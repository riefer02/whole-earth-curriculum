name: Website or tooling bug
description: Report a reproducible technical problem.
title: "Bug: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the page or command and the result you observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser/device for website bugs; OS and Node version for tooling bugs.
