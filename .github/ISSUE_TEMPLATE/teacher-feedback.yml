name: Teacher or pilot feedback
description: Report specific classroom-use evidence without student personal data.
title: "Teacher feedback: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing the curriculum. Do not include learner names, images, health information, assessment records, or other personal student data.
  - type: input
    id: lesson
    attributes:
      label: Lesson or unit
      description: Link the page or provide its L.xx.xxx.xx or U.xx.xxx ID.
    validations:
      required: true
  - type: input
    id: setting
    attributes:
      label: Learning setting
      description: Country or region, approximate age/grade, group size, and available resources—without identifying learners.
    validations:
      required: true
  - type: textarea
    id: worked
    attributes:
      label: What worked?
    validations:
      required: true
  - type: textarea
    id: barriers
    attributes:
      label: What was unclear or difficult?
      description: Include preparation time, materials, timing, accessibility, or assessment issues when relevant.
    validations:
      required: true
  - type: textarea
    id: adaptations
    attributes:
      label: Adaptations and suggested changes
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included personal information about learners.
          required: true
