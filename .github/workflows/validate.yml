name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      # Usability ratchet: fails only if the must-fix count grows past
      # tools/audit/baseline.json. Ratchet it down with `npm run audit -- --baseline`
      # as the backlog is cleared.
      - run: npm run audit:ci
      - run: npm run test:citation-lint
      - run: npm run test:support-form
      - run: npm run lint:sources
