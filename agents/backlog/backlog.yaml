  - id: B-000
    title: Kindergarten exemplar slice (D01 + D06 lessons and units)
    agent: lesson-author
    type: lesson
    grade: 0
    domain: D01
    status: done
    priority: 1
    depends_on: []
    required_reviews:
      - reviewer
      - fact-checker
      - global-culture-editor
      - accessibility-editor
      - alignment-auditor
      - child-psychologist
    reviews:
      reviewer:
        verdict: passed
        note: Schema and headings verified during scaffold.
      fact-checker:
        verdict: passed
        note: Verified S-001 CASEL and S-002 NASA Big Bang; fixed broken NASA URL and marked both sources reviewed:true. Big Bang correctly hedged as story-grounded-in-evidence; evidence/values distinguished; global origin stories held alongside.
      global-culture-editor:
        verdict: passed
        note: "Reviewed all 4 files: framing is universal (no US/Eurocentric default); Big Bang framed as 'one story among many' per philosophy §11; cultures not stereotyped; Connection sections region-neutral. Non-blocking suggestion to name 1-2 concrete origin stories from underrepresented regions as optional facilitator resources."
      accessibility-editor:
        verdict: passed
        note: Reviewed all 4 files. Added materials_low_tech to both lessons; added non-visual paths (verbal descriptions, feel-your-face) to feeling-cards/mirror steps; added say-it/gesture alternatives to wonder box. Materials are low-cost/universal; no assets entries so alt-text vacuous. validate passes.
      alignment-auditor:
        verdict: passed
        note: "Audited 4 files. Lenses verified: ethics (non-coercion of belief), egalitarianism (all origin stories held side-by-side), global (no US/Euro default), evidence-vs-values (CASEL+NASA cited; Big Bang as evidence-grounded story). Traceability intact: D01 and D06 chains resolve to declared standards. validate passes."
      child-psychologist:
        verdict: passed
        note: "Reviewed all 4 K files. Cognitive fit: feelings concrete/here-and-now; origins told as story with picture anchor. Emotional safety: no frightening content; origin stories held side-by-side, no belief required. Physical fit: body scan, face-making, big-motor + fine-motor. Open-endedness per philosophy §11. No changes needed."
    notes: Exemplars authored during scaffold; now entering the review chain.
