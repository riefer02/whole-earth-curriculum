# Curriculum-building backlog.
#
# Lifecycle:  ready -> claimed -> review -> done
#   ready    — defined and available to claim
#   claimed  — an author is working on it
#   review   — authored; entering the required_reviews chain (in order)
#   done     — all required reviews passed and merged
#
# required_reviews lists the reviewers that must each record `passed` (in order)
# before the item can be `done`. A `blocked` verdict sends it back to `claimed`
# and restarts the review chain.
#
# depends_on items must be `done` before the item can be claimed.

