<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Why a character made that choice: a reason, not an excuse</title>
  <desc id="desc">Two panels follow one character, Amara, at a water queue. The first panel is labeled a good choice: Amara bends down to help a smaller child pick up a dropped cup, and a thought bubble reads "why? she cared." The second panel is labeled a hurtful choice: Amara leans forward and pushes past a person toward a water tap, and a thought bubble reads "why? she was tired and hot" with a note beneath that this reason helps us understand but does not make pushing okay. The labels, the bubbles, the reaching hand, and the leaning body, not color, carry the meaning, so the picture prints clearly in grayscale and teaches that every choice has a reason — a reason helps us understand a person, and it does not excuse a hurt.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Why a Character Made That Choice</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Every choice has a reason</text>

  <!-- panels -->
  <rect x="20" y="86" width="226" height="296" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="266" y="86" width="226" height="296" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>

  <text x="133" y="112" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">a good choice</text>
  <text x="379" y="112" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">a hurtful choice</text>

  <!-- arrow between panels -->
  <line x1="250" y1="234" x2="260" y2="234" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <path d="M260 228 L267 234 L260 240 Z" fill="#4f6d7a"/>

  <!-- ===== Panel 1: Amara helps the smaller child ===== -->
  <!-- dropped cup on ground -->
  <path d="M168 274 Q178 268 188 274 L186 286 L170 286 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <line x1="168" y1="272" x2="188" y2="272" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>

  <!-- smaller child (light skin, sad) -->
  <circle cx="150" cy="250" r="12" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M138 248 A12 12 0 0 1 162 248 Z" fill="#4f6d7a"/>
  <circle cx="145" cy="250" r="1.6" fill="#2b3a42"/>
  <circle cx="155" cy="250" r="1.6" fill="#2b3a42"/>
  <path d="M145 259 Q150 255 155 259" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="141" y="263" width="18" height="26" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="145" y1="289" x2="143" y2="308" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="155" y1="289" x2="157" y2="308" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <!-- Amara (medium-deep skin, reaching down to help) -->
  <circle cx="108" cy="206" r="14" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M94 204 A14 14 0 0 1 122 204 Z" fill="#2b3a42"/>
  <circle cx="102" cy="206" r="1.8" fill="#2b3a42"/>
  <circle cx="114" cy="206" r="1.8" fill="#2b3a42"/>
  <path d="M102 214 Q108 219 114 214" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="97" y="222" width="22" height="38" rx="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="102" y1="260" x2="100" y2="290" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="114" y1="260" x2="116" y2="290" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <!-- arm reaching down toward cup/child -->
  <line x1="119" y1="236" x2="150" y2="262" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <!-- thought bubble: why? -->
  <rect x="52" y="130" width="128" height="52" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="88" cy="186" r="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="80" cy="196" r="2.5" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="116" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">why?</text>
  <text x="116" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">she cared</text>

  <text x="133" y="358" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">reason: she cared</text>

  <!-- ===== Panel 2: Amara pushes past ===== -->
  <!-- water tap -->
  <rect x="430" y="150" width="14" height="40" rx="3" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <rect x="422" y="144" width="30" height="10" rx="4" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <path d="M427 190 Q431 200 431 210" fill="none" stroke="#6b93b6" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="431" cy="216" rx="7" ry="3" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>

  <!-- person ahead (light-medium skin) -->
  <circle cx="398" cy="176" r="13" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <path d="M385 174 A13 13 0 0 1 411 174 Z" fill="#4f6d7a"/>
  <circle cx="392" cy="176" r="1.6" fill="#2b3a42"/>
  <circle cx="404" cy="176" r="1.6" fill="#2b3a42"/>
  <path d="M392 184 Q398 188 404 184" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="388" y="190" width="20" height="34" rx="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="392" y1="224" x2="390" y2="252" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="404" y1="224" x2="406" y2="252" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>

  <!-- Amara (medium-deep skin, leaning forward, pushing) -->
  <circle cx="330" cy="196" r="14" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M316 194 A14 14 0 0 1 344 194 Z" fill="#2b3a42"/>
  <circle cx="324" cy="196" r="1.8" fill="#2b3a42"/>
  <circle cx="336" cy="196" r="1.8" fill="#2b3a42"/>
  <path d="M324 206 Q330 208 336 206" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="319" y="212" width="22" height="38" rx="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="324" y1="250" x2="320" y2="280" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="336" y1="250" x2="340" y2="280" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <!-- arm pushing forward -->
  <line x1="341" y1="226" x2="368" y2="214" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <!-- thought bubble: why? -->
  <rect x="286" y="128" width="150" height="52" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="330" cy="184" r="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="322" cy="194" r="2.5" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="361" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">why?</text>
  <text x="361" y="168" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">tired and hot</text>

  <text x="379" y="358" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">reason: tired and hot</text>

  <text x="256" y="416" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">A reason helps us understand a person.</text>
  <text x="256" y="442" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Understanding does not make a hurtful choice okay &#183; we can choose again</text>
</svg>
