<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Line plot with fractions</title>
  <desc id="desc">A line plot showing fractional data. A number line from 0 to 1 is marked in eighths. X marks are stacked above 1/2 (three Xs), 5/8 (two Xs), 3/4 (four Xs), and 7/8 (one X). Labels note the most common value is 3/4, the range from smallest (1/2) to largest (7/8) is 3/8, and there are 10 data points total. Labels and marks, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Line Plot with Fractions</text>
  <text x="256" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">bean sprout lengths, in eighths of a unit</text>

  <!-- number line -->
  <line x1="60" y1="300" x2="452" y2="300" stroke="#2b3a42" stroke-width="3"/>
  <!-- eighths ticks: positions 60..452 across 8 intervals = 49 each -->
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="60" y1="292" x2="60" y2="308"/>
    <line x1="109" y1="296" x2="109" y2="304"/>
    <line x1="158" y1="292" x2="158" y2="308"/>
    <line x1="207" y1="296" x2="207" y2="304"/>
    <line x1="256" y1="292" x2="256" y2="308"/>
    <line x1="305" y1="296" x2="305" y2="304"/>
    <line x1="354" y1="292" x2="354" y2="308"/>
    <line x1="403" y1="296" x2="403" y2="304"/>
    <line x1="452" y1="292" x2="452" y2="308"/>
  </g>

  <g font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">
    <text x="60" y="332">0</text>
    <text x="109" y="332">1/8</text>
    <text x="158" y="332">1/4</text>
    <text x="207" y="332">3/8</text>
    <text x="256" y="332">1/2</text>
    <text x="305" y="332">5/8</text>
    <text x="354" y="332">3/4</text>
    <text x="403" y="332">7/8</text>
    <text x="452" y="332">1</text>
  </g>

  <!-- X marks. X at value v (x position), stacked upward. -->
  <!-- 1/2 = 256: three Xs -->
  <g fill="#7a9e7e" stroke="none" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    <text x="256" y="282">X</text>
    <text x="256" y="264">X</text>
    <text x="256" y="246">X</text>
  </g>
  <!-- 5/8 = 305: two Xs -->
  <g fill="#6b93b6" stroke="none" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    <text x="305" y="282">X</text>
    <text x="305" y="264">X</text>
  </g>
  <!-- 3/4 = 354: four Xs -->
  <g fill="#e0a458" stroke="none" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    <text x="354" y="282">X</text>
    <text x="354" y="264">X</text>
    <text x="354" y="246">X</text>
    <text x="354" y="228">X</text>
  </g>
  <!-- 7/8 = 403: one X -->
  <g fill="#2b3a42" stroke="none" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    <text x="403" y="282">X</text>
  </g>

  <!-- reading panel -->
  <rect x="60" y="360" width="392" height="120" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="386" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#6b93b6">Reading the plot</text>
  <text x="256" y="412" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">most common: 3/4 (four Xs)</text>
  <text x="256" y="436" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">range: 7/8 − 1/2 = 3/8</text>
  <text x="256" y="460" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">data points: 10 Xs in all</text>
</svg>
