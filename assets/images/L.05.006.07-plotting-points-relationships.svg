<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-05-006-07-plotting-points-relationships desc-L-05-006-07-plotting-points-relationships">
  <title id="title-L-05-006-07-plotting-points-relationships">Plotting points and relationships</title>
  <desc id="desc-L-05-006-07-plotting-points-relationships">A first-quadrant coordinate grid numbered 0 to 6 on the x-axis and y-axis. Points (1,2), (2,4), and (3,6) are plotted as filled dots and connected by a dashed line, each point labeled. A caption reads "as x goes up by 1, y goes up by 2 — the relationship y = 2x," showing a doubling pattern. The axes are labeled x-axis and y-axis and the origin is marked 0. Labels and coordinates, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Plotting Points and Relationships</text>

  <!-- grid area -->
  <g>
    <!-- axes -->
    <line x1="72" y1="60" x2="72" y2="360" stroke="#2b3a42" stroke-width="3"/>
    <line x1="72" y1="360" x2="432" y2="360" stroke="#2b3a42" stroke-width="3"/>
    <!-- gridlines -->
    <g stroke="#d7d1c8" stroke-width="1">
      <line x1="132" y1="60" x2="132" y2="360"/><line x1="192" y1="60" x2="192" y2="360"/>
      <line x1="252" y1="60" x2="252" y2="360"/><line x1="312" y1="60" x2="312" y2="360"/>
      <line x1="372" y1="60" x2="372" y2="360"/><line x1="432" y1="60" x2="432" y2="360"/>
      <line x1="72" y1="300" x2="432" y2="300"/><line x1="72" y1="240" x2="432" y2="240"/>
      <line x1="72" y1="180" x2="432" y2="180"/><line x1="72" y1="120" x2="432" y2="120"/>
    </g>
    <!-- axis labels -->
    <text x="72" y="382" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">0</text>
    <text x="132" y="382" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">1</text>
    <text x="192" y="382" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">2</text>
    <text x="252" y="382" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">3</text>
    <text x="312" y="382" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">4</text>
    <text x="372" y="382" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">5</text>
    <text x="432" y="382" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">6</text>
    <text x="56" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">0</text>
    <text x="56" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">2</text>
    <text x="56" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">4</text>
    <text x="56" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">6</text>
    <text x="56" y="120" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">8</text>

    <!-- axis titles -->
    <text x="252" y="412" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#6b93b6">x-axis (across →)</text>
    <text x="82" y="86" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6b93b6">y-axis ↑</text>

    <!-- dashed line through points y = 2x -->
    <line x1="132" y1="300" x2="252" y2="180" stroke="#e0a458" stroke-width="3" stroke-dasharray="7 5"/>

    <!-- points -->
    <circle cx="132" cy="300" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="192" cy="240" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="252" cy="180" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

    <text x="132" y="288" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">(1,2)</text>
    <text x="192" y="228" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">(2,4)</text>
    <text x="252" y="168" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">(3,6)</text>

    <!-- origin marker -->
    <text x="72" y="400" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">origin</text>
  </g>

  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="15.5" font-weight="bold" fill="#222222">as x goes up by 1, y goes up by 2 — the relationship y = 2x</text>
  <text x="256" y="488" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">"along the corridor, up the stairs" — across first, then up</text>
</svg>
