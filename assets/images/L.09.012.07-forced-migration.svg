<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The transatlantic slave trade: forced movement of millions</title>
  <desc id="desc">A simple diagram of the Atlantic with three labeled regions: West and Central Africa, the Americas, and Europe. An arrow shows captive Africans forced across the ocean, and a smaller band notes that enslaved people resisted and kept their cultures alive.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Forced Across the Ocean</text>

  <!-- Atlantic ocean band -->
  <rect x="30" y="150" width="452" height="120" rx="12" fill="#6b93b6" opacity="0.25" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="212" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Atlantic Ocean — the Middle Passage</text>

  <!-- Africa -->
  <rect x="40" y="300" width="120" height="150" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="100" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">West &amp; Central</text>
  <text x="100" y="348" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">Africa</text>
  <text x="100" y="374" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">millions taken</text>
  <text x="100" y="390" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">against their will</text>

  <!-- Americas -->
  <rect x="352" y="300" width="120" height="150" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="412" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">The Americas</text>
  <text x="412" y="374" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">forced labor on</text>
  <text x="412" y="390" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">plantations &amp; mines</text>

  <!-- arrow across -->
  <path d="M160 260 Q256 200 352 260" fill="none" stroke="#e0a458" stroke-width="4" marker-end="url(#f1)"/>
  <defs>
    <marker id="f1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 Z" fill="#e0a458"/>
    </marker>
  </defs>
  <text x="256" y="254" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#2b3a42">people forced, not by choice</text>

  <!-- resistance band -->
  <rect x="30" y="80" width="452" height="52" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="102" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#2b3a42">They resisted — and kept their cultures alive</text>
  <text x="256" y="120" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">maroon communities · music · religion · family</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">A global movement of people with lasting effects everywhere</text>
</svg>
