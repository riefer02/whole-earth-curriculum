<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Balance and control</title>
  <desc id="desc">Three panels show ways to balance. Standing on two feet like a tree, standing on one foot like a flamingo with arms out like branches, and a seated steady pose with a beanbag balanced on the head. A line at the bottom shows a balance beam to walk along slowly. Word labels and shapes carry the meaning, not color alone.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Balance and Control</text>

  <!-- Two feet (tree) -->
  <g>
    <rect x="20" y="66" width="150" height="300" rx="14" fill="#ffffff" stroke="#7a9e7e" stroke-width="3"/>
    <text x="95" y="98" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">two feet</text>
    <circle cx="95" cy="150" r="28" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <rect x="73" y="178" width="44" height="70" rx="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="77" y1="190" x2="56" y2="150" stroke="#c99567" stroke-width="13" stroke-linecap="round"/>
    <line x1="113" y1="190" x2="134" y2="150" stroke="#c99567" stroke-width="13" stroke-linecap="round"/>
    <line x1="88" y1="246" x2="88" y2="306" stroke="#4f6d7a" stroke-width="13" stroke-linecap="round"/>
    <line x1="104" y1="246" x2="104" y2="306" stroke="#4f6d7a" stroke-width="13" stroke-linecap="round"/>
    <rect x="74" y="304" width="24" height="10" rx="5" fill="#2b3a42"/>
    <rect x="94" y="304" width="24" height="10" rx="5" fill="#2b3a42"/>
    <text x="95" y="340" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">steady as a tree</text>
  </g>

  <!-- One foot (flamingo) -->
  <g>
    <rect x="181" y="66" width="150" height="300" rx="14" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
    <text x="256" y="98" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">one foot</text>
    <circle cx="256" cy="150" r="28" fill="#e3b587" stroke="#2b3a42" stroke-width="2"/>
    <rect x="234" y="178" width="44" height="70" rx="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="238" y1="190" x2="214" y2="150" stroke="#e3b587" stroke-width="13" stroke-linecap="round"/>
    <line x1="274" y1="190" x2="298" y2="150" stroke="#e3b587" stroke-width="13" stroke-linecap="round"/>
    <!-- one leg down, one lifted -->
    <line x1="248" y1="246" x2="246" y2="306" stroke="#4f6d7a" stroke-width="13" stroke-linecap="round"/>
    <line x1="268" y1="246" x2="280" y2="270" stroke="#4f6d7a" stroke-width="13" stroke-linecap="round"/>
    <rect x="234" y="304" width="24" height="10" rx="5" fill="#2b3a42"/>
    <text x="256" y="340" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">like a flamingo</text>
  </g>

  <!-- Seated steady pose -->
  <g>
    <rect x="342" y="66" width="150" height="300" rx="14" fill="#ffffff" stroke="#6b93b6" stroke-width="3"/>
    <text x="417" y="98" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">seated</text>
    <circle cx="417" cy="150" r="28" fill="#a9714b" stroke="#2b3a42" stroke-width="2"/>
    <rect x="395" y="178" width="44" height="58" rx="16" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="399" y1="190" x2="378" y2="214" stroke="#a9714b" stroke-width="13" stroke-linecap="round"/>
    <line x1="435" y1="190" x2="456" y2="214" stroke="#a9714b" stroke-width="13" stroke-linecap="round"/>
    <!-- beanbag on head -->
    <rect x="402" y="104" width="30" height="16" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <!-- seat -->
    <rect x="380" y="236" width="74" height="12" rx="6" fill="#4f6d7a"/>
    <line x1="394" y1="248" x2="394" y2="286" stroke="#4f6d7a" stroke-width="8"/>
    <line x1="440" y1="248" x2="440" y2="286" stroke="#4f6d7a" stroke-width="8"/>
    <text x="417" y="318" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">sit tall and still</text>
    <text x="417" y="336" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">beanbag on head</text>
  </g>

  <!-- Balance beam line -->
  <g>
    <rect x="60" y="390" width="392" height="26" rx="8" fill="#dbe6d2" stroke="#4f6d7a" stroke-width="2"/>
    <text x="256" y="408" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">walk the line slowly — careful is strong</text>
  </g>

  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Balance is steadiness, never about how long.</text>
  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Standing or seated — every body can be steady.</text>
</svg>
