<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Balance, agility, coordination</title>
  <desc id="desc">Three panels in a row. The first shows a child balancing on one foot on a line, labeled "balance." The second shows a child weaving between three cones, labeled "agility." The third shows a seated child tossing a soft ball hand to hand, labeled "coordination." Standing and seated versions are shown.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="50" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Balance, Agility, Coordination</text>

  <!-- Panel 1: balance -->
  <g>
    <rect x="16" y="80" width="150" height="240" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="91" y="112" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">balance</text>
    <line x1="40" y1="260" x2="142" y2="260" stroke="#4f6d7a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="91" cy="196" r="26" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="83" cy="190" r="3" fill="#2b3a42"/><circle cx="99" cy="190" r="3" fill="#2b3a42"/>
    <path d="M86 204 Q91 210 96 204" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M91 222 L91 260 M91 234 L74 250 M91 234 L108 250" stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="91" y="300" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">stand on one foot</text>
  </g>

  <!-- Panel 2: agility -->
  <g>
    <rect x="181" y="80" width="150" height="240" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="112" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">agility</text>
    <path d="M212 150 L256 240 L300 150" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M200 260 Q256 300 312 260" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
    <!-- cones -->
    <polygon points="212,170 208,196 216,196" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <polygon points="256,232 252,258 260,258" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <polygon points="300,170 296,196 304,196" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <!-- child weaving -->
    <circle cx="256" cy="200" r="16" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="251" cy="196" r="2.5" fill="#2b3a42"/><circle cx="261" cy="196" r="2.5" fill="#2b3a42"/>
    <path d="M256 216 L256 244 M256 228 L244 244" stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="256" y="300" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">weave and change</text>
    <text x="256" y="316" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">direction</text>
  </g>

  <!-- Panel 3: coordination -->
  <g>
    <rect x="346" y="80" width="150" height="240" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="421" y="112" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">coordination</text>
    <!-- seated child -->
    <circle cx="421" cy="180" r="24" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="413" cy="174" r="3" fill="#2b3a42"/><circle cx="429" cy="174" r="3" fill="#2b3a42"/>
    <path d="M416 188 Q421 194 426 188" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M421 204 L421 236 M421 214 L404 232 M421 214 L438 232" stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- ball between hands -->
    <circle cx="421" cy="246" r="12" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M398 258 Q421 274 444 258" stroke="#2b3a42" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
    <text x="421" y="300" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">toss hand to hand</text>
    <text x="421" y="316" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">(seated or standing)</text>
  </g>

  <text x="256" y="356" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222222">every body can move its own way</text>
</svg>
