<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Sound and motion together: sound matches motion</title>
  <desc id="desc">A pairing diagram shows sound symbols on the top row aligned with movement figures on the bottom row. A long rectangle sound matches a figure reaching high and slow; a small dot sound matches a figure low and quick. A bracket joins each sound to its movement, with the words "sound matches motion" beneath. Labels and symbols carry all meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Sound and Motion Together</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">The beat tells the body; the body feels the beat.</text>

  <!-- top row: sounds -->
  <text x="256" y="104" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#6b93b6">sound</text>
  <g>
    <rect x="70" y="122" width="90" height="40" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="115" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">long</text>
    <circle cx="286" cy="142" r="22" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="286" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">short</text>
    <circle cx="360" cy="142" r="22" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="360" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">short</text>
    <rect x="412" y="122" width="90" height="40" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="457" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">long</text>
  </g>

  <!-- brackets -->
  <g stroke="#2b3a42" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M96 168 L96 226 M96 226 L430 226 M430 226 L430 168"/>
  </g>
  <text x="256" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">sound matches motion</text>

  <!-- bottom row: motion -->
  <text x="256" y="258" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7a9e7e">motion</text>

  <!-- high slow figure -->
  <g>
    <circle cx="115" cy="300" r="18" fill="#e6bb92" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M115 318 L115 356" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M115 330 L92 292 M115 330 L138 292" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <text x="115" y="392" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">high, slow</text>
  </g>

  <!-- low quick figure -->
  <g>
    <circle cx="286" cy="322" r="18" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M286 340 L286 352" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M286 344 L266 368 M286 344 L306 368" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <text x="286" y="392" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">low, quick</text>
  </g>

  <!-- low quick figure 2 -->
  <g>
    <circle cx="360" cy="322" r="18" fill="#c99567" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M360 340 L360 352" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M360 344 L340 368 M360 344 L380 368" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <text x="360" y="392" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">low, quick</text>
  </g>

  <!-- high slow figure 2 -->
  <g>
    <circle cx="457" cy="300" r="18" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M457 318 L457 356" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M457 330 L434 292 M457 330 L480 292" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <text x="457" y="392" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">high, slow</text>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">drummers and dancers move as one</text>
</svg>
