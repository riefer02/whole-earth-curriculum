<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Arithmetic and Geometric Sequences</title>
  <desc id="desc">Two rows side by side. The top row shows an arithmetic sequence as equal staircase steps labeled 2, 4, 6, 8 with a plus 2 arrow between them. The bottom row shows a geometric sequence as doubling bars labeled 1, 2, 4, 8 with a times 2 arrow between them. Each row has its common difference or common ratio noted.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Two Kinds of Sequence</text>

  <!-- Arithmetic panel -->
  <text x="128" y="66" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a" font-weight="bold">Arithmetic (add d)</text>
  <rect x="40" y="220" width="46" height="44" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="86" y="176" width="46" height="88" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="132" y="132" width="46" height="132" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="178" y="88" width="46" height="176" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="63" y="212" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff" font-weight="bold">2</text>
  <text x="109" y="168" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff" font-weight="bold">4</text>
  <text x="155" y="124" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff" font-weight="bold">6</text>
  <text x="201" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff" font-weight="bold">8</text>
  <text x="128" y="296" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">equal steps: +2 each time</text>
  <text x="128" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">a&#8345; = a&#8321; + (n&#8722;1)d</text>

  <!-- Geometric panel -->
  <text x="384" y="66" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a" font-weight="bold">Geometric (multiply by r)</text>
  <rect x="296" y="240" width="40" height="24" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <rect x="340" y="216" width="40" height="48" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <rect x="384" y="168" width="40" height="96" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <rect x="428" y="72" width="40" height="192" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="316" y="232" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">1</text>
  <text x="360" y="208" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">2</text>
  <text x="404" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">4</text>
  <text x="448" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">8</text>
  <text x="384" y="296" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">doubling piles: &#215;2 each time</text>
  <text x="384" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">a&#8345; = a&#8321; &#183; r&#8319;&#8315;&#185;</text>

  <!-- Note box -->
  <rect x="90" y="344" width="332" height="120" fill="#ffffff" stroke="#e0a458" stroke-width="2" rx="6"/>
  <text x="256" y="372" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">Same amount vs same factor</text>
  <text x="256" y="396" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">Arithmetic: change by +d (a fixed difference)</text>
  <text x="256" y="416" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">Geometric: change by &#215;r (a fixed ratio)</text>
  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">The chessboard doubles: 1, 2, 4, 8, &#8230; (&#215;2)</text>
</svg>
