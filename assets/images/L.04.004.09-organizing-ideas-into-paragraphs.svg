<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Organizing ideas into paragraphs: three clear parts</title>
  <desc id="desc">A paragraph is shown as a stack of three labeled blocks: a topic sentence on top, two detail blocks in the middle, and a closing sentence at the bottom. This teaches the clear order of a paragraph. Simple shapes, grayscale-printable.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">A Paragraph in Order</text>

  <!-- Topic sentence -->
  <rect x="80" y="84" width="352" height="64" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="112" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">topic sentence</text>
  <text x="256" y="136" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">states the idea</text>

  <!-- Detail 1 -->
  <rect x="80" y="172" width="352" height="64" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="200" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222222">detail</text>
  <text x="256" y="224" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">supports the idea</text>

  <!-- Detail 2 -->
  <rect x="80" y="260" width="352" height="64" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="288" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222222">detail</text>
  <text x="256" y="312" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">supports the idea</text>

  <!-- Closing sentence -->
  <rect x="80" y="348" width="352" height="64" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="376" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">closing sentence</text>
  <text x="256" y="400" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">wraps it up</text>

  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42">One idea, in order, easy to follow.</text>
</svg>
