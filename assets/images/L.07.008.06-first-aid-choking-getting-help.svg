<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">First aid for choking and how to call for help</title>
  <desc id="desc">Two panels. The left panel, Choking, shows a figure with hands at the throat, the universal sign of choking, and three steps: recognize the sign, call for emergency help and get an adult, and if trained give back blows and abdominal thrusts. The right panel, When you call for help, say, lists three things: your name, where you are, and what happened. The call-for-help steps are emphasized in green boxes.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Choking &amp; calling for help</text>

  <!-- LEFT PANEL -->
  <rect x="14" y="62" width="238" height="434" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <text x="133" y="92" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#e0a458">Choking — act fast</text>

  <!-- figure with hands at throat -->
  <g>
    <circle cx="133" cy="140" r="16" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="127" cy="136" r="2.5" fill="#2b3a42"/>
    <circle cx="139" cy="136" r="2.5" fill="#2b3a42"/>
    <path d="M127 148 Q133 144 139 148" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <path d="M127 151 Q133 154 139 151" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="113" y="160" width="40" height="52" rx="12" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M120 176 Q133 168 146 176" fill="none" stroke="#f5d6b6" stroke-width="5" stroke-linecap="round"/>
    <path d="M120 176 Q133 184 146 176" fill="none" stroke="#f5d6b6" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="133" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">hands at the throat = the sign</text>

  <!-- step 1 -->
  <g>
    <circle cx="50" cy="268" r="13" fill="#e0a458"/>
    <text x="50" y="273" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>
    <text x="76" y="268" font-family="sans-serif" font-size="13" fill="#2b3a42">Recognize the sign</text>
    <text x="76" y="284" font-family="sans-serif" font-size="12" fill="#4f6d7a">can't breathe, talk, or cough</text>
  </g>

  <!-- step 2 -->
  <g>
    <circle cx="50" cy="330" r="13" fill="#7a9e7e"/>
    <text x="50" y="335" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2</text>
    <text x="76" y="330" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Call for emergency help</text>
    <text x="76" y="346" font-family="sans-serif" font-size="12" fill="#2b3a42">and get an adult now</text>
  </g>

  <!-- step 3 -->
  <g>
    <circle cx="50" cy="392" r="13" fill="#6b93b6"/>
    <text x="50" y="397" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3</text>
    <text x="76" y="392" font-family="sans-serif" font-size="13" fill="#2b3a42">If trained: back blows,</text>
    <text x="76" y="408" font-family="sans-serif" font-size="13" fill="#2b3a42">then abdominal thrusts</text>
    <text x="76" y="424" font-family="sans-serif" font-size="11" fill="#4f6d7a">learn these from a certified instructor</text>
  </g>

  <text x="133" y="478" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">Never give food or drink to someone choking</text>

  <!-- RIGHT PANEL -->
  <rect x="260" y="62" width="238" height="434" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <text x="379" y="92" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#7a9e7e">When you call for help, say:</text>

  <g>
    <!-- phone icon -->
    <rect x="352" y="116" width="54" height="92" rx="10" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="366" y="132" width="26" height="60" rx="4" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="379" cy="168" r="3" fill="#2b3a42"/>
    <line x1="366" y1="176" x2="392" y2="176" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- three things -->
  <g font-family="sans-serif" font-size="14">
    <rect x="288" y="236" width="182" height="34" rx="8" fill="#7a9e7e" fill-opacity="0.2" stroke="#7a9e7e" stroke-width="2"/>
    <text x="379" y="258" text-anchor="middle" font-weight="bold" fill="#2b3a42">1. Your name</text>

    <rect x="288" y="280" width="182" height="34" rx="8" fill="#7a9e7e" fill-opacity="0.2" stroke="#7a9e7e" stroke-width="2"/>
    <text x="379" y="302" text-anchor="middle" font-weight="bold" fill="#2b3a42">2. Where you are</text>

    <rect x="288" y="324" width="182" height="34" rx="8" fill="#7a9e7e" fill-opacity="0.2" stroke="#7a9e7e" stroke-width="2"/>
    <text x="379" y="346" text-anchor="middle" font-weight="bold" fill="#2b3a42">3. What happened</text>
  </g>

  <text x="379" y="396" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Learn your country's emergency</text>
  <text x="379" y="412" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">number (112, 999, 911, or local)</text>

  <text x="379" y="478" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">Stay on the line until told to hang up</text>

  <!-- bottom caption -->
  <text x="256" y="500" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">When unsure, always get an adult or medical help.</text>
</svg>
