<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-08-003-02-tone-body-meaning desc-L-08-003-02-tone-body-meaning">
  <title id="title-L-08-003-02-tone-body-meaning">Same words, different meaning</title>
  <desc id="desc-L-08-003-02-tone-body-meaning">Three panels showing the same sentence "Sure, fine" said three ways. Panel one: a figure standing open with wide arms and a smile, labeled "warm voice, open arms — means agreement". Panel two: a figure with arms folded and a flat face, labeled "flat voice, arms crossed — means dismissal". Panel three: a figure pointing a finger with a hard face, labeled "loud voice, pointing finger — means anger". The posture and the words carry the meaning, so the drawing prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">The same words — three meanings</text>
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">"Sure, fine."</text>

  <!-- panel 1: warm voice, open arms -->
  <rect x="20" y="88" width="150" height="374" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <g fill="#d9a066">
    <circle cx="95" cy="142" r="20"/>
    <rect x="86" y="156" width="18" height="16" rx="6"/>
    <rect x="71" y="168" width="48" height="132" rx="22"/>
    <path d="M 81 186 L 51 244" stroke="#d9a066" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M 109 186 L 139 244" stroke="#d9a066" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M 85 296 L 78 366" stroke="#d9a066" stroke-width="17" stroke-linecap="round" fill="none"/>
    <path d="M 105 296 L 112 366" stroke="#d9a066" stroke-width="17" stroke-linecap="round" fill="none"/>
    <ellipse cx="76" cy="371" rx="10" ry="6"/>
    <ellipse cx="114" cy="371" rx="10" ry="6"/>
  </g>
  <circle cx="88" cy="138" r="2.4" fill="#2b3a42"/>
  <circle cx="102" cy="138" r="2.4" fill="#2b3a42"/>
  <path d="M 88 149 Q 95 155 102 149" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="95" y="404" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">warm voice,</text>
  <text x="95" y="424" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">open arms</text>
  <text x="95" y="446" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">means: agreement</text>

  <!-- panel 2: flat voice, arms crossed -->
  <rect x="181" y="88" width="150" height="374" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <g fill="#c98a5e">
    <circle cx="256" cy="142" r="20"/>
    <rect x="247" y="156" width="18" height="16" rx="6"/>
    <rect x="232" y="168" width="48" height="132" rx="22"/>
    <path d="M 232 205 L 281 216" stroke="#b0703f" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M 281 224 L 232 235" stroke="#b0703f" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M 246 296 L 239 366" stroke="#c98a5e" stroke-width="17" stroke-linecap="round" fill="none"/>
    <path d="M 266 296 L 273 366" stroke="#c98a5e" stroke-width="17" stroke-linecap="round" fill="none"/>
    <ellipse cx="237" cy="371" rx="10" ry="6"/>
    <ellipse cx="275" cy="371" rx="10" ry="6"/>
  </g>
  <line x1="247" y1="138" x2="253" y2="138" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <line x1="259" y1="138" x2="265" y2="138" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <line x1="249" y1="151" x2="263" y2="151" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="256" y="404" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">flat voice,</text>
  <text x="256" y="424" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">arms crossed</text>
  <text x="256" y="446" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">means: dismissal</text>

  <!-- panel 3: loud voice, pointing finger -->
  <rect x="342" y="88" width="150" height="374" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <g fill="#8a5a3a">
    <circle cx="417" cy="142" r="20"/>
    <rect x="408" y="156" width="18" height="16" rx="6"/>
    <rect x="393" y="168" width="48" height="132" rx="22"/>
    <path d="M 403 188 L 381 240" stroke="#8a5a3a" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M 431 190 L 466 206" stroke="#8a5a3a" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M 466 206 L 474 203" stroke="#8a5a3a" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 407 296 L 400 366" stroke="#8a5a3a" stroke-width="17" stroke-linecap="round" fill="none"/>
    <path d="M 427 296 L 434 366" stroke="#8a5a3a" stroke-width="17" stroke-linecap="round" fill="none"/>
    <ellipse cx="398" cy="371" rx="10" ry="6"/>
    <ellipse cx="436" cy="371" rx="10" ry="6"/>
  </g>
  <line x1="407" y1="135" x2="407" y2="141" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <line x1="427" y1="135" x2="427" y2="141" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M 409 152 L 425 149" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="417" y="404" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">loud voice,</text>
  <text x="417" y="424" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">pointing finger</text>
  <text x="417" y="446" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">means: anger</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">You are always sending two messages: your words, and your tone and body.</text>
</svg>
