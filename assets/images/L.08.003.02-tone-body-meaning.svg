<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Same words, different meaning</title>
  <desc id="desc">Three panels showing the same sentence "Sure, fine" said three ways. Panel one: a figure with open posture and a smile, labeled "warm — agreement". Panel two: a figure with crossed arms looking away, labeled "flat — dismissal". Panel three: a figure pointing with a hard face, labeled "loud — anger". Drawn simply for grayscale printing.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">The same words — three meanings</text>
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">"Sure, fine."</text>

  <!-- helper for a simple figure: circle head + body line -->
  <!-- panel 1 -->
  <rect x="20" y="88" width="150" height="330" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="95" cy="150" r="22" fill="#d9a066" stroke="#2b3a42" stroke-width="2.5"/>
  <path d="M80 200 Q86 186 95 186 Q104 186 110 200" stroke="#2b3a42" stroke-width="2.5" fill="none"/>
  <line x1="95" y1="184" x2="95" y2="300" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="95" y1="216" x2="58" y2="260" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="95" y1="216" x2="132" y2="260" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="95" y1="300" x2="72" y2="372" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="95" y1="300" x2="118" y2="372" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="95" y="404" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">warm voice,</text>
  <text x="95" y="424" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">open arms</text>
  <text x="95" y="444" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#7a9e7e">means: agreement</text>

  <!-- panel 2 -->
  <rect x="181" y="88" width="150" height="330" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="256" cy="150" r="22" fill="#c98a5e" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="246" y1="146" x2="266" y2="146" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="256" y1="184" x2="256" y2="300" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="256" y1="216" x2="238" y2="270" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="238" y1="270" x2="220" y2="262" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="256" y1="216" x2="274" y2="270" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="274" y1="270" x2="292" y2="262" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="256" y1="300" x2="240" y2="372" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="256" y1="300" x2="272" y2="372" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="404" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">flat voice,</text>
  <text x="256" y="424" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">arms crossed</text>
  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">means: dismissal</text>

  <!-- panel 3 -->
  <rect x="342" y="88" width="150" height="330" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="417" cy="150" r="22" fill="#8a5a3a" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="409" y1="142" x2="409" y2="152" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="425" y1="142" x2="425" y2="152" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="417" y1="184" x2="417" y2="300" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="417" y1="216" x2="390" y2="248" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="417" y1="216" x2="452" y2="230" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="452" y1="230" x2="462" y2="216" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="417" y1="300" x2="398" y2="372" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="417" y1="300" x2="436" y2="372" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="417" y="404" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">loud voice,</text>
  <text x="417" y="424" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">pointing finger</text>
  <text x="417" y="444" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">means: anger</text>

  <text x="256" y="484" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">You are always sending two messages: your words, and your tone and body.</text>
</svg>
