<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Earth's Coupled Systems</title>
  <desc id="desc">Four spheres — atmosphere, water, land, and life — arranged in a circle with two-way arrows connecting each to the others, showing couplings. A small inset traces carbon moving from air to a plant to soil and back, labeled the carbon cycle links all four.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Earth's Coupled Systems</text>

  <!-- Four spheres -->
  <circle cx="256" cy="130" r="52" fill="#6b93b6" fill-opacity="0.3" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="126" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">air</text>
  <text x="256" y="144" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">atmosphere</text>

  <circle cx="256" cy="330" r="52" fill="#7a9e7e" fill-opacity="0.3" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="326" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">land</text>
  <text x="256" y="344" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">geosphere</text>

  <circle cx="116" cy="230" r="52" fill="#6b93b6" fill-opacity="0.22" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="116" y="226" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">water</text>
  <text x="116" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">hydrosphere</text>

  <circle cx="396" cy="230" r="52" fill="#7a9e7e" fill-opacity="0.22" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="396" y="226" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">life</text>
  <text x="396" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">biosphere</text>

  <!-- Coupling arrows -->
  <line x1="256" y1="182" x2="256" y2="278" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="256,278 250,266 262,266" fill="#2b3a42"/>
  <polygon points="256,182 250,194 262,194" fill="#2b3a42"/>
  <line x1="168" y1="230" x2="344" y2="230" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="344,230 332,224 332,236" fill="#2b3a42"/>
  <polygon points="168,230 180,224 180,236" fill="#2b3a42"/>
  <line x1="196" y1="150" x2="150" y2="190" stroke="#2b3a42" stroke-width="2"/>
  <line x1="316" y1="150" x2="360" y2="190" stroke="#2b3a42" stroke-width="2"/>
  <line x1="150" y1="270" x2="196" y2="310" stroke="#2b3a42" stroke-width="2"/>
  <line x1="360" y1="270" x2="316" y2="310" stroke="#2b3a42" stroke-width="2"/>

  <text x="256" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">coupled</text>
  <text x="256" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">coupled</text>

  <!-- Inset -->
  <rect x="60" y="400" width="392" height="86" fill="#ffffff" stroke="#e0a458" stroke-width="2" rx="6"/>
  <text x="256" y="424" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">The carbon cycle links all four:</text>
  <text x="256" y="446" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">air → plant → soil → back to air, and into ocean and rock.</text>
  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">A change in one sphere is never just a change in one sphere.</text>
</svg>
