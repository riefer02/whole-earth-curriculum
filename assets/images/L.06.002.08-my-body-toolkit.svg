<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My body toolkit</title>
  <desc id="desc">A page divided into four labeled boxes like a kit. Box one "my tension map" shows a small body with a shaded spot; box two "my release technique" shows an open hand labeled "squeeze, then let go"; box three "my skill log" shows tally marks and four footprints; box four "my teamwork reflection" shows four figures in a circle. A header reads "My body toolkit." Labels, not color alone, carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">My Body Toolkit</text>

  <!-- Box 1: tension map -->
  <rect x="26" y="60" width="220" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="84" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">1. my tension map</text>
  <circle cx="110" cy="130" r="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="92" y="142" width="36" height="50" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="110" cy="162" rx="10" ry="8" fill="#e0a458" opacity="0.8"/>
  <text x="176" y="128" font-family="sans-serif" font-size="13" fill="#222222">where stress</text>
  <text x="176" y="146" font-family="sans-serif" font-size="13" fill="#222222">tightens me</text>
  <text x="176" y="164" font-family="sans-serif" font-size="13" fill="#222222">(shade the spot)</text>

  <!-- Box 2: release -->
  <rect x="266" y="60" width="220" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="84" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">2. my release technique</text>
  <circle cx="350" cy="150" r="18" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <line x1="338" y1="140" x2="328" y2="166" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <line x1="344" y1="136" x2="340" y2="164" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <line x1="350" y1="134" x2="350" y2="164" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <line x1="356" y1="136" x2="360" y2="164" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <line x1="362" y1="140" x2="372" y2="166" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="400" y="140" font-family="sans-serif" font-size="13" fill="#222222">squeeze,</text>
  <text x="400" y="158" font-family="sans-serif" font-size="13" fill="#222222">then let go</text>
  <text x="400" y="176" font-family="sans-serif" font-size="13" fill="#222222">+ slow breath</text>

  <!-- Box 3: skill log -->
  <rect x="26" y="224" width="220" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="248" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">3. my skill log</text>
  <text x="60" y="286" font-family="sans-serif" font-size="15" fill="#222222">side, cross, side, tap</text>
  <g stroke="#2b3a42" stroke-width="2" fill="#ffffff">
    <ellipse cx="70" cy="312" rx="12" ry="18"/>
    <ellipse cx="96" cy="312" rx="12" ry="18"/>
    <ellipse cx="122" cy="312" rx="12" ry="18"/>
  </g>
  <text x="160" y="292" font-family="sans-serif" font-size="15" fill="#222222">tries: | | | |</text>
  <text x="160" y="314" font-family="sans-serif" font-size="15" fill="#222222">a correction that helped</text>

  <!-- Box 4: teamwork -->
  <rect x="266" y="224" width="220" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="248" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">4. my teamwork reflection</text>
  <g stroke="#2b3a42" stroke-width="2" fill="#ffffff">
    <circle cx="340" cy="300" r="9"/>
    <circle cx="376" cy="290" r="9"/>
    <circle cx="412" cy="300" r="9"/>
    <circle cx="376" cy="330" r="9"/>
  </g>
  <text x="376" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">a role I shared,</text>
  <text x="376" y="368" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">a word that encouraged</text>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#2b3a42">Notice, release, move, belong — my toolkit for life.</text>
</svg>
