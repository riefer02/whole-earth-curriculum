<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Five Questions for Health Information</title>
  <desc id="desc">A five-question checklist for judging health information — who made it, why, for whom, what evidence, what is left out — beside a magnifying-glass motif.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42" font-weight="bold">Open Any Health Claim with Five Questions</text>

  <g font-family="sans-serif" stroke="#2b3a42" stroke-width="1.5">
    <rect x="40" y="56" width="330" height="62" rx="8" fill="#ffffff"/>
    <circle cx="74" cy="87" r="15" fill="#e0a458"/>
    <text x="74" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">1</text>
    <text x="102" y="86" font-size="15" font-weight="bold" fill="#222222">Who made this?</text>
    <text x="102" y="106" font-size="12" fill="#4f6d7a">An author, a company, or an anonymous account?</text>

    <rect x="40" y="126" width="330" height="62" rx="8" fill="#ffffff"/>
    <circle cx="74" cy="157" r="15" fill="#7a9e7e"/>
    <text x="74" y="163" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">2</text>
    <text x="102" y="156" font-size="15" font-weight="bold" fill="#222222">Why was it made?</text>
    <text x="102" y="176" font-size="12" fill="#4f6d7a">To inform, persuade, sell, scare, or entertain?</text>

    <rect x="40" y="196" width="330" height="62" rx="8" fill="#ffffff"/>
    <circle cx="74" cy="227" r="15" fill="#6b93b6"/>
    <text x="74" y="233" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">3</text>
    <text x="102" y="226" font-size="15" font-weight="bold" fill="#222222">For whom?</text>
    <text x="102" y="246" font-size="12" fill="#4f6d7a">Whose attention or money is wanted?</text>

    <rect x="40" y="266" width="330" height="62" rx="8" fill="#ffffff"/>
    <circle cx="74" cy="297" r="15" fill="#e0a458"/>
    <text x="74" y="303" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">4</text>
    <text x="102" y="296" font-size="15" font-weight="bold" fill="#222222">What evidence?</text>
    <text x="102" y="316" font-size="12" fill="#4f6d7a">A study and a source — or only assertion?</text>

    <rect x="40" y="336" width="330" height="62" rx="8" fill="#ffffff"/>
    <circle cx="74" cy="367" r="15" fill="#7a9e7e"/>
    <text x="74" y="373" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">5</text>
    <text x="102" y="366" font-size="15" font-weight="bold" fill="#222222">What is left out?</text>
    <text x="102" y="386" font-size="12" fill="#4f6d7a">Risks, costs, alternatives, who disagrees?</text>
  </g>

  <!-- magnifying glass -->
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <circle cx="420" cy="140" r="48"/>
    <line x1="454" y1="174" x2="478" y2="198"/>
    <circle cx="420" cy="140" r="30" stroke-width="1.5" stroke="#4f6d7a"/>
  </g>
  <text x="420" y="216" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Look closely</text>

  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Reading the source &#8212; before you believe or share &#8212; protects you.</text>
</svg>
