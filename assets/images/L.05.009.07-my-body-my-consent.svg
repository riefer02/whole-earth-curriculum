<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-05-009-07-my-body-my-consent desc-L-05-009-07-my-body-my-consent">
  <title id="title-L-05-009-07-my-body-my-consent">My body, my consent</title>
  <desc id="desc-L-05-009-07-my-body-my-consent">A diagram titled "My body, my consent." A child stands inside a dashed ring, drawn as one soft silhouette; a leader line joins the ring to the words "my personal space" beneath it. On the right, an open hand is held up, palm out, with the word "stop" beneath it, above the words "no means no" and "stop means stop." Below are three short rules: "ask first", "it is always okay to say no", and "tell a trusted adult — always". The closing line reads: you decide who touches you, and how — and a yes can always change to a no.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">My Body, My Consent</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">my body is mine</text>

  <!-- leader from the dashed ring to its label -->
  <line x1="172" y1="306" x2="172" y2="318" stroke="#4f6d7a" stroke-width="1.6"/>

  <!-- the ring of personal space -->
  <circle cx="172" cy="206" r="98" fill="#fdfbf7" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- the child, one soft silhouette -->
  <g>
    <path d="M 154 246 L 152 286" stroke="#7a9e7e" stroke-width="16" stroke-linecap="round"/>
    <path d="M 190 246 L 192 286" stroke="#7a9e7e" stroke-width="16" stroke-linecap="round"/>
    <path d="M 152 210 Q 140 228 138 242" stroke="#c99567" stroke-width="12" stroke-linecap="round"/>
    <path d="M 192 210 Q 204 228 206 242" stroke="#c99567" stroke-width="12" stroke-linecap="round"/>
    <path d="M 148 246 Q 148 194 172 194 Q 196 194 196 246 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="172" cy="168" r="22" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 151 165 Q 152 146 172 146 Q 192 146 193 165 Q 183 156 172 157 Q 161 156 151 165 Z" fill="#2b3a42"/>
    <circle cx="165" cy="168" r="2.2" fill="#2b3a42"/>
    <circle cx="179" cy="168" r="2.2" fill="#2b3a42"/>
    <path d="M 165 178 Q 172 183 179 178" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="172" y="334" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">my personal space</text>

  <!-- an open hand, palm out -->
  <g>
    <path d="M 334 200 L 334 164 A 5 5 0 0 1 344 164 L 344 178 L 348 178 L 348 154 A 5 5 0 0 1 358 154
             L 358 178 L 362 178 L 362 156 A 5 5 0 0 1 372 156 L 372 178 L 376 178 L 376 164
             A 5 5 0 0 1 386 164 L 386 200 A 14 14 0 0 1 372 214 L 348 214 A 14 14 0 0 1 334 200 Z"
          fill="#f5d6b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <rect x="320" y="186" width="24" height="12" rx="6" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 344 196 q 18 -4 34 0" fill="none" stroke="#4f6d7a" stroke-width="1.4"/>
  </g>

  <text x="360" y="236" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">stop</text>
  <text x="360" y="268" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">no means no</text>
  <text x="360" y="294" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">stop means stop</text>

  <!-- the three rules -->
  <rect x="24" y="366" width="144" height="64" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="96" y="404" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">ask first</text>

  <rect x="184" y="366" width="144" height="64" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="392" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">it is always okay</text>
  <text x="256" y="412" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">to say no</text>

  <rect x="344" y="366" width="144" height="64" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="416" y="392" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">tell a trusted</text>
  <text x="416" y="412" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">adult — always</text>

  <text x="256" y="464" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">You decide who touches you, and how.</text>
  <text x="256" y="490" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">And a "yes" can always change to a "no."</text>
</svg>
