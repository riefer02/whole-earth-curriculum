<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My body, my consent</title>
  <desc id="desc">A diagram titled "my body, my consent." A child stands inside a dashed circle labeled "my personal space." A raised hand with the word "stop" sits beside the words "no means no" and "stop means stop." Below, three short rules: "ask first," "it is always okay to say no," and "tell a trusted adult." Labels and pictures, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">My Body, My Consent</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">my body is mine</text>

  <!-- Personal space bubble and child -->
  <circle cx="196" cy="196" r="104" fill="#fdfbf7" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="196" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">my personal space</text>

  <circle cx="196" cy="180" r="26" fill="#d9a066" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="187" cy="175" r="3" fill="#222222"/>
  <circle cx="205" cy="175" r="3" fill="#222222"/>
  <path d="M182 192 Q196 200 210 192" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M196 206 L196 260 M196 224 L172 250 M196 224 L220 250 M196 260 L180 300 M196 260 L212 300" stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Stop hand -->
  <g>
    <path d="M356 132 L372 132 L372 152 L388 152 L388 176 L372 176 L372 200 L356 200 L356 176 L340 176 L340 152 L356 152 Z" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M356 152 L356 184 M348 152 L348 180 M364 152 L364 186" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="372" y="126" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">stop</text>
  </g>

  <text x="356" y="246" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">no means no</text>
  <text x="356" y="272" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">stop means stop</text>

  <!-- Rules -->
  <rect x="24" y="360" width="144" height="60" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="96" y="396" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">ask first</text>

  <rect x="184" y="360" width="144" height="60" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="386" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">it is always okay</text>
  <text x="256" y="406" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">to say no</text>

  <rect x="344" y="360" width="144" height="60" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="416" y="386" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">tell a trusted</text>
  <text x="416" y="406" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">adult — always</text>

  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">You decide who touches you, and how.</text>
  <text x="256" y="488" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">And a "yes" can always change to a "no."</text>
</svg>
