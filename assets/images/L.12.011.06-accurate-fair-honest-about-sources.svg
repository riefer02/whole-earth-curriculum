<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Accurate, Fair, Honest About Sources</title>
  <desc id="desc">Three revision columns: 'verify the fact — check a second source,' 'represent fairly — no straw figures,' and 'attribute the source — who, where, when.' A footer reads 'a message that earns trust.' Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42" font-weight="bold">Making the Message Earn Trust</text>

  <!-- column 1 -->
  <rect x="28" y="80" width="140" height="220" rx="6" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <text x="98" y="112" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">verify the fact</text>
  <line x1="44" y1="126" x2="152" y2="126" stroke="#6b93b6" stroke-width="2"/>
  <text x="98" y="156" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">check a second,</text>
  <text x="98" y="176" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">independent</text>
  <text x="98" y="196" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">source</text>

  <!-- column 2 -->
  <rect x="186" y="80" width="140" height="220" rx="6" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="256" y="112" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">represent fairly</text>
  <line x1="202" y1="126" x2="310" y2="126" stroke="#7a9e7e" stroke-width="2"/>
  <text x="256" y="156" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">state the other</text>
  <text x="256" y="176" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">side as its</text>
  <text x="256" y="196" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">holder would</text>

  <!-- column 3 -->
  <rect x="344" y="80" width="140" height="220" rx="6" fill="none" stroke="#e0a458" stroke-width="3"/>
  <text x="414" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">attribute the</text>
  <text x="414" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">source</text>
  <line x1="360" y1="144" x2="468" y2="144" stroke="#e0a458" stroke-width="2"/>
  <text x="414" y="176" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">who said it,</text>
  <text x="414" y="196" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">where,</text>
  <text x="414" y="216" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">and when</text>

  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42" font-weight="bold">A message that asks for trust</text>
  <text x="256" y="386" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">is not the same as a message that earns it.</text>
</svg>
