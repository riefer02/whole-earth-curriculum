<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Trust built in small steps</title>
  <desc id="desc">A jar is filled one small pebble at a time. Each pebble is labeled with a trust-building behavior: reliability, honesty, respect, care, owning mistakes. A small crack on the jar is labeled repair, showing that a rupture can be mended. Labels, not color, carry the meaning.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Trust Is Built in Small Steps</text>

  <!-- Jar -->
  <path d="M150 170 L150 400 Q150 428 256 428 Q362 428 362 400 L362 170 Z" fill="#6b93b6" opacity="0.12" stroke="#2b3a42" stroke-width="3"/>
  <rect x="146" y="150" width="220" height="26" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>

  <!-- Pebbles inside the jar, each labeled -->
  <g font-family="sans-serif" font-size="15" text-anchor="middle">
    <ellipse cx="206" cy="360" rx="46" ry="24" fill="#7a9e7e" opacity="0.45" stroke="#2b3a42" stroke-width="2"/>
    <text x="206" y="364" fill="#222222" font-weight="bold">reliability</text>
    <ellipse cx="306" cy="352" rx="44" ry="22" fill="#e0a458" opacity="0.45" stroke="#2b3a42" stroke-width="2"/>
    <text x="306" y="356" fill="#222222" font-weight="bold">honesty</text>
    <ellipse cx="256" cy="310" rx="46" ry="22" fill="#6b93b6" opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="314" fill="#222222" font-weight="bold">respect</text>
    <ellipse cx="206" cy="262" rx="40" ry="20" fill="#7a9e7e" opacity="0.45" stroke="#2b3a42" stroke-width="2"/>
    <text x="206" y="266" fill="#222222" font-weight="bold">care</text>
    <ellipse cx="306" cy="250" rx="46" ry="20" fill="#e0a458" opacity="0.45" stroke="#2b3a42" stroke-width="2"/>
    <text x="306" y="254" fill="#222222" font-weight="bold">owning mistakes</text>
    <ellipse cx="256" cy="212" rx="40" ry="18" fill="#6b93b6" opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="216" fill="#222222" font-weight="bold">kept promises</text>
  </g>

  <!-- A pebble in hand, being added -->
  <ellipse cx="384" cy="150" rx="18" ry="14" fill="#7a9e7e" opacity="0.45" stroke="#2b3a42" stroke-width="2"/>
  <path d="M384 164 L300 190" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- A crack, labeled repair -->
  <path d="M150 220 L166 250 L154 282" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <text x="104" y="258" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">repair</text>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#4f6d7a">One pebble at a time — and a crack can be mended.</text>
</svg>
