<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Together We Can: each does a part</title>
  <desc id="desc">Four children of varied skin tones carry one long heavy bench together, each holding a different spot along its length, smiling with the effort. Above them a label reads "no one could lift it alone." An arrow below reads "each does a part, we finish together." The written words carry the meaning, not color, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">Together We Can</text>
  <text x="256" y="68" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">No one could lift it alone</text>

  <!-- The bench -->
  <rect x="70" y="210" width="372" height="24" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="90" y1="210" x2="86" y2="270" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="422" y1="210" x2="426" y2="270" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>

  <!-- Child 1 (far left) -->
  <g>
    <circle cx="110" cy="172" r="18" fill="#8d5a3b" stroke="#2b3a42" stroke-width="2"/>
    <path d="M94 170 A16 16 0 0 1 126 170" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="104" cy="172" r="2" fill="#2b3a42"/>
    <circle cx="116" cy="172" r="2" fill="#2b3a42"/>
    <path d="M104 182 Q110 186 116 182" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="110" y1="190" x2="106" y2="210" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="110" y1="190" x2="114" y2="210" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="92" y1="200" x2="70" y2="214" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="128" y1="200" x2="150" y2="214" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Child 2 -->
  <g>
    <circle cx="206" cy="162" r="18" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M190 162 A18 18 0 0 1 222 162 Z" fill="#2b3a42"/>
    <circle cx="200" cy="162" r="2" fill="#2b3a42"/>
    <circle cx="214" cy="162" r="2" fill="#2b3a42"/>
    <path d="M200 172 Q206 176 212 172" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="206" y1="180" x2="202" y2="210" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="206" y1="180" x2="210" y2="210" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="188" y1="190" x2="166" y2="214" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="224" y1="190" x2="246" y2="214" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Child 3 -->
  <g>
    <circle cx="306" cy="162" r="18" fill="#6b5b3e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M290 162 A18 18 0 0 1 322 162 Z" fill="#2b3a42"/>
    <circle cx="300" cy="162" r="2" fill="#2b3a42"/>
    <circle cx="314" cy="162" r="2" fill="#2b3a42"/>
    <path d="M300 172 Q306 176 312 172" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="306" y1="180" x2="302" y2="210" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="306" y1="180" x2="310" y2="210" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="288" y1="190" x2="266" y2="214" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="324" y1="190" x2="346" y2="214" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Child 4 (far right) -->
  <g>
    <circle cx="402" cy="172" r="18" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M386 170 A16 16 0 0 1 418 170" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="396" cy="172" r="2" fill="#2b3a42"/>
    <circle cx="408" cy="172" r="2" fill="#2b3a42"/>
    <path d="M396 182 Q402 186 408 182" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="402" y1="190" x2="398" y2="210" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="402" y1="190" x2="406" y2="210" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="384" y1="200" x2="362" y2="214" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="420" y1="200" x2="442" y2="214" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="286" width="512" height="40" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  <!-- Arrow + result -->
  <g>
    <text x="256" y="340" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">each does a part</text>
    <line x1="130" y1="370" x2="382" y2="370" stroke="#2b3a42" stroke-width="4"/>
    <path d="M382 370 L366 362 L366 378 Z" fill="#2b3a42"/>
    <rect x="120" y="392" width="272" height="46" rx="12" fill="#2b3a42"/>
    <text x="256" y="421" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#fdfbf7">we finish together</text>
  </g>

  <text x="256" y="474" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Every part matters — and yours did too.</text>
</svg>
