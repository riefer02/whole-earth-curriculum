<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-03-003-04-a-day-in-someone-elses-shoes desc-L-03-003-04-a-day-in-someone-elses-shoes">
  <title id="title-L-03-003-04-a-day-in-someone-elses-shoes">A day in someone else's shoes</title>
  <desc id="desc-L-03-003-04-a-day-in-someone-elses-shoes">One classroom shown twice. The left view is from a standing child's height - a shelf with a ball on top, a door with a handle, and a window. The right view is the same room from a child in a wheelchair at a lower height - the ball on the shelf is now out of reach, the door handle is high, and a step is in the way. Beneath reads "the same place feels different to different people." The words and shapes carry the meaning, not colour, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">A Day in Someone Else's Shoes</text>

  <!-- Left panel: the standing view -->
  <rect x="20" y="70" width="226" height="300" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="133" y="88" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">Standing view</text>

  <!-- shelf, ball within reach -->
  <rect x="44" y="140" width="76" height="10" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <rect x="44" y="150" width="76" height="66" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="82" cy="130" r="13" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="82" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">ball</text>

  <!-- door with handle, level with a standing child's hand -->
  <rect x="166" y="140" width="58" height="92" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="216" cy="190" r="3.5" fill="#2b3a42"/>
  <text x="195" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">door</text>

  <!-- window -->
  <rect x="158" y="286" width="74" height="54" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" fill-opacity="0.35"/>
  <line x1="195" y1="286" x2="195" y2="340" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="158" y1="313" x2="232" y2="313" stroke="#2b3a42" stroke-width="1.5"/>

  <!-- standing child, a silhouette -->
  <g fill="#f5d6b6" stroke="none">
    <circle cx="110" cy="252" r="18"/>
    <rect x="103" y="269" width="14" height="12" rx="6"/>
    <rect x="88" y="278" width="44" height="38" rx="19"/>
    <path d="M92 290 l-8 26" stroke="#f5d6b6" stroke-width="11" stroke-linecap="round"/>
    <path d="M128 290 l8 24" stroke="#f5d6b6" stroke-width="11" stroke-linecap="round"/>
    <path d="M100 312 l-2 26" stroke="#f5d6b6" stroke-width="13" stroke-linecap="round"/>
    <path d="M120 312 l2 26" stroke="#f5d6b6" stroke-width="13" stroke-linecap="round"/>
  </g>
  <ellipse cx="97" cy="340" rx="8" ry="4" fill="#f5d6b6"/>
  <ellipse cx="123" cy="340" rx="8" ry="4" fill="#f5d6b6"/>
  <circle cx="110" cy="252" r="18" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="104" cy="249" r="2.2" fill="#2b3a42"/><circle cx="116" cy="249" r="2.2" fill="#2b3a42"/>
  <path d="M105 260 q5 4 10 0" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Right panel: the wheelchair view -->
  <rect x="266" y="70" width="226" height="300" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="379" y="88" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">Wheelchair view</text>

  <!-- the same shelf, now above the child's reach -->
  <rect x="290" y="140" width="76" height="10" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <rect x="290" y="150" width="76" height="66" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="328" cy="130" r="13" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="328" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8f5f3d">out of reach</text>

  <!-- the same door, handle now high -->
  <rect x="406" y="140" width="58" height="92" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="456" cy="190" r="3.5" fill="#2b3a42"/>
  <text x="435" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">high handle</text>

  <!-- a step in the way -->
  <rect x="380" y="300" width="96" height="13" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="428" y="332" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8f5f3d">a step</text>

  <!-- child in a wheelchair, a silhouette -->
  <rect x="348" y="262" width="10" height="60" rx="5" fill="#4f6d7a" stroke="#2b3a42" stroke-width="1.6"/>
  <g fill="#8f5f3d" stroke="none">
    <circle cx="330" cy="246" r="17"/>
    <rect x="323" y="261" width="14" height="10" rx="5"/>
    <rect x="312" y="268" width="40" height="42" rx="18"/>
    <path d="M316 280 l-14 18" stroke="#8f5f3d" stroke-width="12" stroke-linecap="round"/>
    <path d="M320 304 l-16 4" stroke="#8f5f3d" stroke-width="13" stroke-linecap="round"/>
    <path d="M304 308 l0 16" stroke="#8f5f3d" stroke-width="11" stroke-linecap="round"/>
  </g>
  <circle cx="330" cy="246" r="17" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="324" cy="243" r="2.2" fill="#2b3a42"/><circle cx="336" cy="243" r="2.2" fill="#2b3a42"/>
  <path d="M325 254 q5 4 10 0" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="296" y="320" width="62" height="9" rx="4" fill="#4f6d7a" stroke="#2b3a42" stroke-width="1.8"/>
  <circle cx="322" cy="346" r="15" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="350" cy="346" r="15" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <ellipse cx="302" cy="326" rx="8" ry="4" fill="#8f5f3d"/>

  <text x="256" y="412" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">The same place feels different to different people.</text>
  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#4f6d7a">Seeing that is how we make a place kinder — and fairer.</text>
</svg>
