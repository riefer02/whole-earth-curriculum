<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The real number line with rational and irrational numbers</title>
  <desc id="desc">A number line from 0 to 4 showing the integers 0, 1, 2, 3, 4, the fractions one half and three halves, and the irrational numbers square root of 2 near 1.4, square root of 3 near 1.7, and pi near 3.14, each labeled rational or irrational.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">The Real Number Line</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">rational + irrational = real</text>

  <!-- number line -->
  <line x1="56" y1="240" x2="456" y2="240" stroke="#2b3a42" stroke-width="3"/>
  <polygon points="456,240 444,234 444,246" fill="#2b3a42"/>

  <!-- integer ticks -->
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="56" y1="228" x2="56" y2="252"/>
    <line x1="156" y1="228" x2="156" y2="252"/>
    <line x1="256" y1="228" x2="256" y2="252"/>
    <line x1="356" y1="228" x2="356" y2="252"/>
    <line x1="456" y1="228" x2="456" y2="252"/>
  </g>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42" text-anchor="middle">
    <text x="56" y="274">0</text>
    <text x="156" y="274">1</text>
    <text x="256" y="274">2</text>
    <text x="356" y="274">3</text>
    <text x="456" y="274">4</text>
  </g>

  <!-- rational fractions -->
  <line x1="106" y1="234" x2="106" y2="246" stroke="#6b93b6" stroke-width="3"/>
  <text x="106" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6b93b6">1/2</text>
  <line x1="206" y1="234" x2="206" y2="246" stroke="#6b93b6" stroke-width="3"/>
  <text x="206" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6b93b6">1 1/2</text>

  <!-- irrational roots and pi -->
  <circle cx="197" cy="240" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="197" y="190" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e0a458">√2 ≈ 1.41</text>
  <circle cx="229" cy="240" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="229" y="164" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e0a458">√3 ≈ 1.73</text>
  <circle cx="370" cy="240" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="370" y="190" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e0a458">π ≈ 3.14</text>

  <!-- legend -->
  <rect x="70" y="306" width="372" height="170" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="96" cy="336" r="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="116" y="341" font-family="sans-serif" font-size="14" fill="#222222">rational — a fraction or a decimal that ends or repeats</text>
  <circle cx="96" cy="368" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="116" y="373" font-family="sans-serif" font-size="14" fill="#222222">irrational — a decimal that never repeats (√2, π)</text>
  <text x="96" y="412" font-family="sans-serif" font-size="14" fill="#4f6d7a">√2 is a real place on the line — not a fraction, not a mistake.</text>
  <text x="96" y="440" font-family="sans-serif" font-size="13" fill="#4f6d7a">Babylonian scribes knew √2 ≈ 1.4142… nearly 4,000 years ago (YBC 7289).</text>
</svg>
