<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Stories, songs, and art show what people value</title>
  <desc id="desc">Three panels show three kinds of cultural treasures. The first panel shows a woven kente cloth with a repeated pattern, labeled "kente cloth — patterns mean wisdom and unity." The second panel shows a painted dot pattern with circles, labeled "painting and story — caring for Country and family." The third panel shows musical notes rising from a drum, labeled "song and rhythm — passing on joy and memory." Each treasure shows what a culture values, and labels and shapes carry the meaning so it prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Stories, Songs &amp; Art Show What We Value</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Every culture keeps treasures that say what matters to its people.</text>

  <!-- panel 1: kente -->
  <rect x="30" y="96" width="140" height="190" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="100" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">kente cloth</text>
  <g stroke="#2b3a42" stroke-width="2">
    <rect x="48" y="132" width="104" height="120" fill="#fdfbf7"/>
    <path d="M48 158 h104 M48 184 h104 M48 210 h104 M48 236 h104" stroke="#4f6d7a" stroke-width="1.5"/>
    <rect x="58" y="136" width="18" height="16" fill="#e0a458"/>
    <rect x="84" y="136" width="18" height="16" fill="#7a9e7e"/>
    <rect x="110" y="136" width="18" height="16" fill="#6b93b6"/>
    <rect x="58" y="162" width="18" height="16" fill="#6b93b6"/>
    <rect x="84" y="162" width="18" height="16" fill="#e0a458"/>
    <rect x="110" y="162" width="18" height="16" fill="#7a9e7e"/>
    <rect x="58" y="188" width="18" height="16" fill="#7a9e7e"/>
    <rect x="84" y="188" width="18" height="16" fill="#6b93b6"/>
    <rect x="110" y="188" width="18" height="16" fill="#e0a458"/>
    <rect x="58" y="214" width="18" height="16" fill="#e0a458"/>
    <rect x="84" y="214" width="18" height="16" fill="#7a9e7e"/>
    <rect x="110" y="214" width="18" height="16" fill="#6b93b6"/>
  </g>
  <text x="100" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">patterns carry meaning</text>
  <text x="100" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">&#8594; wisdom, unity, honor</text>

  <!-- panel 2: painting and story -->
  <rect x="186" y="96" width="140" height="190" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="256" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">painting &amp; story</text>
  <g>
    <circle cx="256" cy="196" r="34" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="256" cy="196" r="22" fill="none" stroke="#2b3a42" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="256" cy="196" r="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="242" cy="150" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="274" cy="152" r="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="286" cy="180" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="230" cy="182" r="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="260" cy="234" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="238" cy="230" r="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="256" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">dots tell a Dreaming story</text>
  <text x="256" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">&#8594; caring for Country, family</text>

  <!-- panel 3: song -->
  <rect x="342" y="96" width="140" height="190" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="412" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">song &amp; rhythm</text>
  <ellipse cx="412" cy="196" rx="30" ry="20" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="412" cy="186" rx="30" ry="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M412 170 l0 -20" stroke="#2b3a42" stroke-width="2"/>
  <path d="M430 156 q6 -10 0 -20 q-6 10 0 20" fill="#2b3a42"/>
  <path d="M398 156 q6 -10 0 -20 q-6 10 0 20" fill="#2b3a42"/>
  <path d="M414 148 q6 -10 0 -20 q-6 10 0 20" fill="#4f6d7a"/>
  <text x="412" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">drum, song, and dance</text>
  <text x="412" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">&#8594; passing on joy, memory</text>

  <text x="256" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">A story, song, or art form is a window into</text>
  <text x="256" y="352" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">what a culture holds dear.</text>
  <text x="256" y="398" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Every culture has its own treasures — all are living,</text>
  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">all are real, none is "better" than another.</text>
</svg>
