<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Peers and media shape my self-image</title>
  <desc id="d">A diagram of two forces shaping self-image. In the center is a figure holding a small mirror labeled "how I see myself." From the left, an arrow labeled "peers" comes from a group of three figures with a speech bubble reading "everyone has one." From the right, an arrow labeled "media" comes from a phone screen showing a row of sparkly, edited-looking images. A caption reads "Peers and media are like mirrors — some mirrors are warped. Noticing the influence gives me power." Shapes, labels, and arrows, not color alone, carry the meaning, so the diagram prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">Two Forces Shape My Self-Image</text>

  <!-- Center figure -->
  <g>
    <circle cx="256" cy="180" r="34" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="246" cy="173" r="3.5" fill="#2b3a42"/>
    <circle cx="266" cy="173" r="3.5" fill="#2b3a42"/>
    <path d="M248 190 Q256 197 264 190" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M256 214 L256 290" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M256 290 L228 352" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M256 290 L284 352" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M230 236 L282 236" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- mirror in hand -->
    <rect x="288" y="244" width="30" height="44" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="303" y="274" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4f6d7a">me</text>
  </g>

  <!-- Peers arrow from left -->
  <path d="M150 170 L204 170" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  <path d="M196 164 L204 170 L196 176" fill="none" stroke="#e0a458" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="150" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#4f6d7a">peers</text>

  <!-- Peers group -->
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <circle cx="84" cy="196" r="20" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="132" cy="208" r="20" fill="#8a5a3b" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="108" cy="244" r="20" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <circle cx="80" cy="192" r="2.5" fill="#2b3a42"/>
  <circle cx="88" cy="192" r="2.5" fill="#2b3a42"/>
  <circle cx="128" cy="204" r="2.5" fill="#2b3a42"/>
  <circle cx="136" cy="204" r="2.5" fill="#2b3a42"/>
  <circle cx="104" cy="240" r="2.5" fill="#2b3a42"/>
  <circle cx="112" cy="240" r="2.5" fill="#2b3a42"/>
  <rect x="46" y="120" width="120" height="44" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="106" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">"everyone</text>
  <text x="106" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">has one"</text>

  <!-- Media arrow from right -->
  <path d="M362 170 L308 170" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  <path d="M316 164 L308 170 L316 176" fill="none" stroke="#e0a458" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="390" y="150" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#4f6d7a">media</text>

  <!-- Phone with curated images -->
  <rect x="370" y="196" width="88" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="380" y="212" width="68" height="34" rx="6" fill="#c9d6df" stroke="#2b3a42" stroke-width="2"/>
  <rect x="380" y="256" width="68" height="34" rx="6" fill="#e0e8ee" stroke="#2b3a42" stroke-width="2"/>
  <rect x="380" y="300" width="68" height="34" rx="6" fill="#c9d6df" stroke="#2b3a42" stroke-width="2"/>
  <!-- sparkles -->
  <g stroke="#e0a458" stroke-width="2" stroke-linecap="round">
    <line x1="416" y1="216" x2="416" y2="208"/>
    <line x1="412" y1="212" x2="420" y2="212"/>
    <line x1="416" y1="260" x2="416" y2="252"/>
    <line x1="412" y1="256" x2="420" y2="256"/>
    <line x1="416" y1="304" x2="416" y2="296"/>
    <line x1="412" y1="300" x2="420" y2="300"/>
  </g>
  <text x="414" y="368" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">edited, curated</text>

  <!-- Caption -->
  <rect x="60" y="392" width="392" height="70" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">Peers and media are like mirrors.</text>
  <text x="256" y="446" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">Some mirrors are warped — noticing that gives me power.</text>

  <g fill="#7a9e7e">
    <circle cx="226" cy="490" r="4"/>
    <circle cx="256" cy="490" r="4"/>
    <circle cx="286" cy="490" r="4"/>
  </g>
</svg>
