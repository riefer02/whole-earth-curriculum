<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">A healthy response to negative comparison</title>
  <desc id="d">A two-panel diagram. The left panel, labeled "the comparison trap," shows a figure looking at another person's shining trophy and thinking "I'll never be that good." The right panel, labeled "a healthy response," shows the same figure turning toward a small ladder of their own progress and thinking "I compare my today to my yesterday." A four-step strip at the bottom reads "notice — name — reframe — act." Shapes and labels, not color alone, carry the meaning, so the diagram prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">A Healthy Response to Comparison</text>

  <!-- Left panel -->
  <rect x="24" y="64" width="224" height="290" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="92" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">the comparison trap</text>
  <!-- figure looking at trophy -->
  <circle cx="110" cy="180" r="30" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="101" cy="173" r="3" fill="#2b3a42"/>
  <circle cx="119" cy="173" r="3" fill="#2b3a42"/>
  <path d="M101 190 Q110 196 119 190" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M110 210 L110 278" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M110 278 L88 332" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M110 278 L132 332" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M90 236 L130 236" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <!-- trophy -->
  <path d="M196 200 h28 v16 h-28 z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M196 200 a14 14 0 0 1 28 0" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="202" y="216" width="16" height="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="194" y="226" width="32" height="8" rx="3" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#e0a458" stroke-width="2" stroke-linecap="round">
    <line x1="210" y1="188" x2="210" y2="180"/>
    <line x1="206" y1="184" x2="214" y2="184"/>
  </g>
  <!-- thought bubble -->
  <rect x="70" y="336" width="120" height="48" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="130" y="356" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">"I'll never be</text>
  <text x="130" y="372" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">that good."</text>

  <!-- Right panel -->
  <rect x="264" y="64" width="224" height="290" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="92" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">a healthy response</text>
  <!-- figure facing ladder -->
  <circle cx="376" cy="180" r="30" fill="#8a5a3b" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="367" cy="173" r="3" fill="#2b3a42"/>
  <circle cx="385" cy="173" r="3" fill="#2b3a42"/>
  <path d="M367 190 Q376 197 385 190" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M376 210 L376 278" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M376 278 L354 332" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M376 278 L398 332" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M356 236 L396 236" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <!-- progress ladder (steps going up) -->
  <g stroke="#2b3a42" stroke-width="2" fill="#ffffff">
    <rect x="420" y="296" width="44" height="16"/>
    <rect x="428" y="272" width="44" height="16"/>
    <rect x="436" y="248" width="44" height="16"/>
  </g>
  <path d="M422 312 L436 296" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  <path d="M430 308 L444 296" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  <text x="442" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">my own</text>
  <text x="442" y="253" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">growth</text>
  <!-- thought bubble -->
  <rect x="300" y="336" width="140" height="48" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="370" y="356" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">"I compare my today</text>
  <text x="370" y="372" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">to my yesterday."</text>

  <!-- steps strip -->
  <rect x="24" y="404" width="464" height="88" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="432" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">notice &#8594; name &#8594; reframe &#8594; act</text>
  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Catch the comparison. Name the feeling.</text>
  <text x="256" y="476" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Reframe. Do one small thing in my own lane.</text>
</svg>
