<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Many healthy tables</title>
  <desc id="desc">Four plates from different food cultures, all the same size so no way of eating ranks above another. The first is a rice and vegetable bowl, the second an injera platter with lentil stew, the third tortillas with beans, and the fourth a fish and vegetable stew. Each plate is labeled with a word, and the shapes are bold and simple so they print clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Many Healthy Tables</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Different foods, same idea — feeding the body well</text>

  <!-- Panel 1: rice and vegetable bowl -->
  <g>
    <rect x="20" y="92" width="112" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <path d="M52 150 q0 -24 24 -24 q24 0 24 24 q0 14 -6 20 q-6 8 -18 8 q-12 0 -18 -8 q-6 -6 -6 -20 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="66" cy="152" r="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="86" cy="150" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="72" cy="172" r="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="44" y="206" width="64" height="18" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="48" y="232" width="56" height="8" rx="3" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="76" y="388" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">rice and vegetables</text>
  </g>

  <!-- Panel 2: injera platter with lentils -->
  <g>
    <rect x="144" y="92" width="112" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <ellipse cx="200" cy="176" rx="44" ry="30" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="186" cy="172" rx="13" ry="10" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="214" cy="180" rx="11" ry="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="200" cy="190" rx="10" ry="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="180" y="220" width="40" height="16" rx="4" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <text x="200" y="388" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">injera and lentils</text>
  </g>

  <!-- Panel 3: tortillas with beans -->
  <g>
    <rect x="268" y="92" width="112" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <circle cx="324" cy="158" r="20" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="316" cy="152" r="4" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="332" cy="160" r="4" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="324" cy="204" rx="26" ry="12" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="314" cy="204" r="4" fill="#8f5f3d"/>
    <circle cx="330" cy="208" r="4" fill="#8f5f3d"/>
    <circle cx="324" cy="200" r="4" fill="#8f5f3d"/>
    <path d="M300 236 q24 12 48 0" fill="none" stroke="#7a9e7e" stroke-width="8" stroke-linecap="round"/>
    <text x="324" y="388" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">tortillas and beans</text>
  </g>

  <!-- Panel 4: fish and vegetable stew -->
  <g>
    <rect x="392" y="92" width="112" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <path d="M428 156 q-10 16 -2 34 q-10 12 0 26 q-8 12 2 24" fill="none" stroke="#6b93b6" stroke-width="7" stroke-linecap="round"/>
    <polygon points="452,150 470,168 452,186 434,168" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="448" cy="164" r="2.5" fill="#2b3a42"/>
    <rect x="428" y="240" width="40" height="26" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="436" cy="258" r="4" fill="#7a9e7e"/>
    <circle cx="452" cy="262" r="4" fill="#7a9e7e"/>
    <circle cx="460" cy="254" r="4" fill="#c99567"/>
    <text x="448" y="388" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">fish and vegetables</text>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">Every family and culture has its own healthy table. None is better than another.</text>
</svg>
