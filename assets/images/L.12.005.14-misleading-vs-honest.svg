<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Detecting Misleading Statistics</title>
  <desc id="desc">Two bar charts of the same data side by side. The left chart has a truncated vertical axis starting at 50, making the difference between 50 and 52 look huge. The right chart has a full axis from 0, making the same difference look small. Labels point out the truncated axis as the trick.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42" font-weight="bold">Same Numbers, Two Stories</text>

  <!-- LEFT: truncated -->
  <text x="128" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">Truncated axis</text>
  <line x1="60" y1="300" x2="196" y2="300" stroke="#2b3a42" stroke-width="2"/>
  <line x1="60" y1="300" x2="60" y2="80" stroke="#2b3a42" stroke-width="2"/>
  <!-- bars 50 and 52 on a 50..53 scale -->
  <rect x="80" y="290" width="40" height="10" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <rect x="140" y="70" width="40" height="230" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="100" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">50</text>
  <text x="160" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">52</text>
  <text x="128" y="336" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e0a458" font-weight="bold">"a doubling!"</text>

  <!-- RIGHT: honest -->
  <text x="384" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">Full axis (0)</text>
  <line x1="316" y1="300" x2="452" y2="300" stroke="#2b3a42" stroke-width="2"/>
  <line x1="316" y1="300" x2="316" y2="80" stroke="#2b3a42" stroke-width="2"/>
  <!-- bars 50 and 52 on a 0..60 scale -->
  <rect x="336" y="116" width="40" height="184" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <rect x="396" y="110" width="40" height="190" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="316" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">0</text>
  <text x="356" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">50</text>
  <text x="416" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">52</text>
  <text x="384" y="336" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6b93b6" font-weight="bold">"about 4%"</text>

  <rect x="60" y="370" width="392" height="100" fill="#ffffff" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="256" y="396" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">The trick: a truncated axis hides the true size.</text>
  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Also watch for: cherry-picking, spurious correlation, p-hacking.</text>
  <text x="256" y="446" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">The antidote: show the full axis and all the data (S-307, S-432).</text>

  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Ask: who benefits when a number misleads?</text>
</svg>
