<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A change hunt with many senses</title>
  <desc id="desc">A child with a pointing stick stands at the center of an outdoor scene, hunting for changes. Around the child are four labeled sense spots — see (an eye), hear (an ear), smell (a nose), and feel (a hand) — plus small change clues: a moving cloud, a falling leaf, a raindrop, and a sun with a shadow. Each clue and sense is drawn as a shape and labeled in words, so the meaning holds in grayscale, and a change found by ear, nose, or skin counts just as much as one found by eye.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="52" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">A Change Hunt</text>
  <text x="256" y="78" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Change is everywhere — if you look for it.</text>

  <!-- Ground -->
  <path d="M0 400 Q 128 348 256 362 Q 384 376 512 350 L512 512 L0 512 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Sun and shadow clue -->
  <circle cx="452" cy="120" r="22" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round">
    <line x1="452" y1="88" x2="452" y2="80"/>
    <line x1="452" y1="152" x2="452" y2="160"/>
    <line x1="420" y1="120" x2="412" y2="120"/>
    <line x1="484" y1="120" x2="492" y2="120"/>
    <line x1="429" y1="97" x2="423" y2="91"/>
    <line x1="475" y1="143" x2="481" y2="149"/>
    <line x1="475" y1="97" x2="481" y2="91"/>
    <line x1="429" y1="143" x2="423" y2="149"/>
  </g>

  <!-- Cloud clue (moving) -->
  <g fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4">
    <circle cx="64" cy="110" r="11"/>
    <circle cx="80" cy="104" r="14"/>
    <circle cx="96" cy="110" r="10"/>
  </g>
  <path d="M50 128 Q56 122 62 128" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <text x="80" y="146" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">a cloud moved</text>

  <!-- Raindrop clue -->
  <g stroke="#6b93b6" stroke-width="2.5" stroke-linecap="round">
    <line x1="140" y1="120" x2="136" y2="132"/>
    <line x1="156" y1="128" x2="152" y2="140"/>
    <line x1="128" y1="140" x2="124" y2="152"/>
  </g>
  <text x="142" y="166" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">rain fell</text>

  <!-- Falling leaf clue -->
  <path d="M360 150 Q350 172 362 190 Q374 172 360 150 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <line x1="360" y1="150" x2="360" y2="190" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="360" y="214" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">a leaf fell</text>

  <!-- Child in the middle -->
  <g>
    <circle cx="256" cy="238" r="28" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M236 232 A26 26 0 0 1 276 232" fill="#2b3a42" stroke="#2b3a42" stroke-width="2"/>
    <g fill="#2b3a42">
      <circle cx="246" cy="238" r="3.5"/>
      <circle cx="266" cy="238" r="3.5"/>
    </g>
    <path d="M250 252 Q256 258 262 252" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="230" y="266" width="52" height="64" rx="20" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="240" y1="284" x2="224" y2="354" stroke="#2b3a42" stroke-width="15" stroke-linecap="round"/>
    <line x1="272" y1="284" x2="288" y2="354" stroke="#2b3a42" stroke-width="15" stroke-linecap="round"/>
    <line x1="248" y1="328" x2="248" y2="402" stroke="#2b3a42" stroke-width="17" stroke-linecap="round"/>
    <line x1="264" y1="328" x2="264" y2="402" stroke="#2b3a42" stroke-width="17" stroke-linecap="round"/>
    <!-- pointing arm -->
    <line x1="276" y1="282" x2="310" y2="260" stroke="#2b3a42" stroke-width="15" stroke-linecap="round"/>
    <!-- pointing stick -->
    <line x1="310" y1="260" x2="344" y2="232" stroke="#e0a458" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Sense spots -->
  <g>
    <!-- see: eye -->
    <ellipse cx="92" cy="252" rx="17" ry="11" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="92" cy="252" r="6" fill="#2b3a42"/>
    <text x="92" y="284" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">see</text>
  </g>
  <g>
    <!-- hear: ear -->
    <path d="M430 250 Q414 258 430 270 Q446 258 430 250 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="430" y="290" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">hear</text>
  </g>
  <g>
    <!-- smell: nose -->
    <path d="M92 336 Q98 330 104 336 Q104 344 98 348 Q92 344 92 336 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="98" y="366" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">smell</text>
  </g>
  <g>
    <!-- feel: hand -->
    <path d="M418 320 Q430 314 438 322 L442 342 Q442 356 428 356 L414 352 L410 336 Q408 326 418 320 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="426" y="372" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">feel</text>
  </g>

  <!-- Footer -->
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Eyes, ears, nose, and skin all notice change.</text>
</svg>
