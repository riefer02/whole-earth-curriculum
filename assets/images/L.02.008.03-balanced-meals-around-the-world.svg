<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Balanced meals around the world</title>
  <desc id="desc">Three balanced meals from three traditions, each on its own plate with labels. Meal one is rice, beans, and greens; meal two is flatbread, lentils, and vegetables; meal three is maize, fish, and fruit. Every plate shows foods from several different groups and all three are equal, so the idea that a balanced meal can look many ways reads clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Balanced Meals Around the World</text>
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Three meals, three places — each one has foods from several groups.</text>

  <!-- Meal 1 -->
  <g>
    <rect x="16" y="92" width="152" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <rect x="16" y="92" width="152" height="38" rx="12" fill="#7a9e7e" stroke="#4f6d7a" stroke-width="2"/>
    <rect x="16" y="112" width="152" height="18" fill="#7a9e7e"/>
    <text x="92" y="117" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">rice + beans + greens</text>
    <circle cx="92" cy="240" r="52" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M60 240 A32 32 0 0 0 124 240 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="78" cy="234" r="5" fill="#c99567" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="92" cy="230" r="5" fill="#c99567" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="106" cy="234" r="5" fill="#c99567" stroke="#2b3a42" stroke-width="1.5"/>
    <path d="M70 254 q10 -9 20 0 q-10 9 -20 0 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="92" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">grains • protein • vegetables</text>
    <text x="92" y="398" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">from a rice-growing land</text>
  </g>

  <!-- Meal 2 -->
  <g>
    <rect x="180" y="92" width="152" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <rect x="180" y="92" width="152" height="38" rx="12" fill="#e0a458" stroke="#4f6d7a" stroke-width="2"/>
    <rect x="180" y="112" width="152" height="18" fill="#e0a458"/>
    <text x="256" y="117" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">flatbread + lentils + veg</text>
    <circle cx="256" cy="240" r="52" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="256" cy="234" rx="34" ry="22" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="244" cy="248" rx="7" ry="5" fill="#c99567" stroke="#2b3a42" stroke-width="1.5"/>
    <ellipse cx="258" cy="250" rx="7" ry="5" fill="#c99567" stroke="#2b3a42" stroke-width="1.5"/>
    <ellipse cx="272" cy="248" rx="7" ry="5" fill="#c99567" stroke="#2b3a42" stroke-width="1.5"/>
    <path d="M232 258 q-10 -8 0 -16 q10 8 0 16 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">grains • protein • vegetables</text>
    <text x="256" y="398" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">from a wheat-growing land</text>
  </g>

  <!-- Meal 3 -->
  <g>
    <rect x="344" y="92" width="152" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <rect x="344" y="92" width="152" height="38" rx="12" fill="#6b93b6" stroke="#4f6d7a" stroke-width="2"/>
    <rect x="344" y="112" width="152" height="18" fill="#6b93b6"/>
    <text x="420" y="117" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">maize + fish + fruit</text>
    <circle cx="420" cy="240" r="52" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M396 240 A24 24 0 0 0 444 240 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M404 252 q10 -9 20 0 q-10 9 -20 0 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="432" cy="252" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="420" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">grains • protein • fruit</text>
    <text x="420" y="398" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">from a maize-growing land</text>
  </g>

  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Every tradition has its own balanced meal — and every one is worthy of honor.</text>
</svg>
