<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Reading Screening Tests</title>
  <desc id="desc">A two-by-two contingency table for a screening test on a rare disease, showing true positives, false positives, true negatives, and false negatives, with the conditional probability P(disease given positive test) computed beside it.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42" font-weight="bold">A Rare Disease: 1 in 1,000 (town of 10,000)</text>

  <!-- 2x2 table -->
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <rect x="40" y="50" width="120" height="40" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="160" y="50" width="90" height="40" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="250" y="50" width="90" height="40" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="340" y="50" width="90" height="40" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="40" y="90" width="120" height="40" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="160" y="90" width="90" height="40" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="250" y="90" width="90" height="40" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="340" y="90" width="90" height="40" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="40" y="130" width="120" height="40" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="160" y="130" width="90" height="40" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="250" y="130" width="90" height="40" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="340" y="130" width="90" height="40" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>

    <text x="100" y="75">&#160;</text>
    <text x="205" y="75">Test +</text>
    <text x="295" y="75">Test &#8722;</text>
    <text x="385" y="75">Total</text>
    <text x="100" y="115">Sick</text>
    <text x="205" y="115">&#8776; 10</text>
    <text x="295" y="115">&#8776; 0</text>
    <text x="385" y="115">10</text>
    <text x="100" y="155">Well</text>
    <text x="205" y="155">&#8776; 100</text>
    <text x="295" y="155">&#8776; 9,890</text>
    <text x="385" y="155">9,990</text>
  </g>
  <text x="205" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a06030" font-weight="bold">true +</text>
  <text x="295" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a06030" font-weight="bold">false &#8722;</text>
  <text x="385" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a5a72" font-weight="bold">(false + are here: &#8776;100)</text>
  <text x="295" y="130" font-family="sans-serif" font-size="12" fill="#3a5a72">&#8592; false +</text>

  <!-- Computation -->
  <text x="256" y="230" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42" font-weight="bold">P(disease | positive) = 10 / (10 + 100) &#8776; 9%</text>
  <text x="256" y="258" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Even with a positive result, the person is probably fine &#8212; because the disease is rare.</text>

  <text x="256" y="300" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">P(A|B) = P(A and B) / P(B) &#160;&#160;|&#160;&#160; independent if P(A|B) = P(A)</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">The base rate (how common the disease is) matters as much as the test's accuracy.</text>
</svg>
