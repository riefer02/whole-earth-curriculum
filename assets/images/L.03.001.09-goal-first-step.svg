<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My goal and its first step</title>
  <desc id="desc">A staircase of four steps going up and to the right. At the top is a flag labeled "my goal." The bottom step is highlighted with a thick outline and labeled "first step." A small figure stands at the bottom step, ready to climb. The idea is that a tall goal is reached one small step at a time, and the first step is the one to do now. Shapes and words, not color, carry the meaning so it prints clearly in grayscale.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="52" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">My Goal and Its First Step</text>

  <!-- Flag at top -->
  <line x1="404" y1="140" x2="404" y2="52" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  <path d="M404 52 L468 70 L404 88 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <text x="404" y="116" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">my goal</text>

  <!-- Steps -->
  <rect x="60" y="340" width="100" height="60" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="4"/>
  <rect x="160" y="280" width="100" height="60" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
  <rect x="260" y="220" width="100" height="60" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
  <rect x="360" y="160" width="100" height="60" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>

  <!-- First step label -->
  <text x="110" y="376" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">first step</text>

  <!-- Figure at bottom step -->
  <g>
    <circle cx="110" cy="316" r="20" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M104 316 L116 316" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <circle cx="107" cy="316" r="2.2" fill="#2b3a42"/>
    <circle cx="113" cy="316" r="2.2" fill="#2b3a42"/>
    <path d="M110 336 L110 356" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bottom note -->
  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">Climb one small step at a time.</text>
</svg>
