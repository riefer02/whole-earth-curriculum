<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Area model for 23 times 45</title>
  <desc id="desc">A rectangle split into four parts to show 23 times 45. The left side is labeled 20 and 3, and the top is labeled 40 and 5. The four inner parts are labeled 20 times 40 equals 800, 20 times 5 equals 100, 3 times 40 equals 120, and 3 times 5 equals 15. Below, the partial products 800, 100, 120, and 15 add to 1,035.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Multiplying with an Area Model</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">23 × 45 — split into tens and ones</text>

  <!-- Outer rectangle -->
  <g>
    <!-- four inner rects -->
    <rect x="150" y="100" width="200" height="120" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="350" y="100" width="50" height="120" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="150" y="220" width="200" height="40" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="350" y="220" width="50" height="40" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- top labels -->
  <text x="250" y="92" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">40</text>
  <text x="375" y="92" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">5</text>
  <!-- side labels -->
  <text x="134" y="164" text-anchor="end" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">20</text>
  <text x="134" y="244" text-anchor="end" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">3</text>

  <!-- inner labels -->
  <text x="250" y="156" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fdfbf7">20 × 40 = 800</text>
  <text x="375" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fdfbf7">20 × 5</text>
  <text x="375" y="174" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fdfbf7">= 100</text>
  <text x="250" y="236" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fdfbf7">3 × 40 = 120</text>
  <text x="375" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">3 × 5</text>
  <text x="375" y="254" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">= 15</text>

  <!-- Add parts -->
  <rect x="100" y="300" width="312" height="140" rx="12" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
  <text x="256" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">800 + 100 + 120 + 15</text>
  <text x="256" y="364" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">Add the parts:</text>
  <text x="256" y="410" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#e0a458">23 × 45 = 1,035</text>

  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">A rectangle is a multiplication you can see.</text>
</svg>
