<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Power, Inequality, Technology</title>
  <desc id="desc">A phone in the center connected by a chain to a mine below and a distant user above. On one side a figure who is connected and thriving; on the other a figure left out, showing who gains and who is left out of technology.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Who Gains, Who Is Left Out?</text>

  <!-- Phone -->
  <rect x="226" y="150" width="60" height="110" rx="8" fill="#2b3a42" stroke="#2b3a42" stroke-width="2"/>
  <rect x="234" y="160" width="44" height="82" fill="#6b93b6"/>
  <line x1="256" y1="268" x2="256" y2="300" stroke="#2b3a42" stroke-width="3"/>

  <!-- Chain down to mine -->
  <g fill="none" stroke="#2b3a42" stroke-width="3">
    <ellipse cx="256" cy="310" rx="8" ry="14"/>
    <ellipse cx="256" cy="340" rx="8" ry="14"/>
  </g>
  <path d="M216 400 L296 400 L282 430 L230 430 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="418" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">mine</text>
  <circle cx="240" cy="386" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="240" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">worker</text>

  <!-- Connected figure (left) -->
  <circle cx="150" cy="150" r="15" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M126 190 Q150 166 174 190" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <line x1="166" y1="150" x2="226" y2="180" stroke="#7a9e7e" stroke-width="3"/>
  <text x="150" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">connected</text>

  <!-- Left-out figure (right) -->
  <circle cx="362" cy="150" r="15" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M338 190 Q362 166 386 190" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <line x1="346" y1="150" x2="290" y2="180" stroke="#4f6d7a" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="362" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">left out</text>

  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">The same tool includes some and leaves others behind.</text>
</svg>
