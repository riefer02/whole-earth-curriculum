<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Geometry in Real Design</title>
  <desc id="desc">A star-and-polygon pattern built from a square grid of construction lines shown lightly, with one repeating tile highlighted in a bold outline and labels naming symmetry, tessellation, and the underlying grid. The pattern prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42" font-weight="bold">Design = Symmetry + Tessellation + Scale</text>

  <!-- grid -->
  <g stroke="#dcd5c8" stroke-width="1">
    <line x1="76" y1="80" x2="436" y2="80"/>
    <line x1="76" y1="160" x2="436" y2="160"/>
    <line x1="76" y1="240" x2="436" y2="240"/>
    <line x1="76" y1="320" x2="436" y2="320"/>
    <line x1="76" y1="400" x2="436" y2="400"/>
    <line x1="76" y1="80" x2="76" y2="400"/>
    <line x1="156" y1="80" x2="156" y2="400"/>
    <line x1="236" y1="80" x2="236" y2="400"/>
    <line x1="316" y1="80" x2="316" y2="400"/>
    <line x1="396" y1="80" x2="396" y2="400"/>
  </g>

  <!-- eight-pointed star motif, centered around tiles -->
  <g stroke="#2b3a42" stroke-width="2.5" fill="none">
    <!-- star at center (236..316, 160..240) center (276,200) -->
    <polygon points="276,160 300,180 300,220 276,240 252,220 252,180" fill="#e0a458"/>
    <!-- diamond tiles at corners -->
    <polygon points="196,120 216,140 196,160 176,140" fill="#ffffff"/>
    <polygon points="356,120 376,140 356,160 336,140" fill="#ffffff"/>
    <polygon points="196,280 216,300 196,320 176,300" fill="#ffffff"/>
    <polygon points="356,280 376,300 356,320 336,300" fill="#ffffff"/>
    <!-- connecting squares -->
    <rect x="216" y="120" width="40" height="40" fill="#6b93b6"/>
    <rect x="296" y="120" width="40" height="40" fill="#6b93b6"/>
    <rect x="216" y="240" width="40" height="40" fill="#6b93b6"/>
    <rect x="296" y="240" width="40" height="40" fill="#6b93b6"/>
    <rect x="216" y="200" width="40" height="40" fill="#ffffff"/>
    <rect x="296" y="200" width="40" height="40" fill="#ffffff"/>
  </g>

  <!-- highlight one repeating tile -->
  <rect x="236" y="160" width="80" height="80" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="352" y="180" font-family="sans-serif" font-size="13" fill="#7a9e7e" font-weight="bold">one tile</text>

  <!-- labels -->
  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">symmetry: mirrors and rotations &#8226; tessellation: the tile repeats without gaps</text>
  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Patterned design spans many traditions (S-024, S-292, S-434).</text>
</svg>
