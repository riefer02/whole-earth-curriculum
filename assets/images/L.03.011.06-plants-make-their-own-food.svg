<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Green plants make their own food using sunlight</title>
  <desc id="d">A green plant makes its own food. The sun shines on a leaf, and water from the soil and air come to the leaf; a label reads plants make their own food using sunlight. To the right, a rabbit eats the plant and a fox eats the rabbit; a note says all living things depend on plants, or on animals that eat them. Word labels carry the meaning so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#222222">Plants make their own food using sunlight</text>

  <!-- Sun -->
  <circle cx="90" cy="96" r="26" fill="#e0a458" stroke="#2b3a42" stroke-width="4"/>
  <line x1="90" y1="58" x2="90" y2="44" stroke="#2b3a42" stroke-width="4"/>
  <line x1="90" y1="134" x2="90" y2="148" stroke="#2b3a42" stroke-width="4"/>
  <line x1="52" y1="96" x2="38" y2="96" stroke="#2b3a42" stroke-width="4"/>
  <line x1="128" y1="96" x2="142" y2="96" stroke="#2b3a42" stroke-width="4"/>
  <text x="90" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">sunlight</text>

  <!-- arrows of sunlight to leaf -->
  <line x1="120" y1="100" x2="150" y2="120" stroke="#e0a458" stroke-width="4"/>
  <line x1="118" y1="116" x2="152" y2="132" stroke="#e0a458" stroke-width="4"/>

  <!-- Plant -->
  <line x1="180" y1="300" x2="180" y2="220" stroke="#2b3a42" stroke-width="5"/>
  <path d="M180 220 q24 10 20 34" fill="none" stroke="#7a9e7e" stroke-width="6"/>
  <path d="M180 220 q-24 10 -20 34" fill="none" stroke="#7a9e7e" stroke-width="6"/>
  <path d="M180 260 q-28 6 -30 28" fill="none" stroke="#7a9e7e" stroke-width="6"/>
  <ellipse cx="180" cy="210" rx="30" ry="18" fill="#7a9e7e" stroke="#2b3a42" stroke-width="4"/>
  <text x="180" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">leaf</text>
  <!-- water -->
  <path d="M150 320 q10 -8 20 0 q10 -8 20 0" fill="none" stroke="#6b93b6" stroke-width="4"/>
  <text x="180" y="348" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">water from soil</text>
  <!-- air -->
  <text x="128" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">air</text>

  <!-- equals -->
  <text x="240" y="150" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#4f6d7a">=</text>

  <!-- food -->
  <rect x="264" y="118" width="60" height="44" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="4"/>
  <text x="294" y="146" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">food</text>

  <!-- Rabbit eats plant -->
  <circle cx="350" cy="220" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <ellipse cx="350" cy="252" rx="20" ry="17" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <ellipse cx="326" cy="200" rx="7" ry="17" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <ellipse cx="374" cy="200" rx="7" ry="17" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <text x="350" y="292" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">rabbit eats plant</text>

  <!-- Fox eats rabbit -->
  <circle cx="452" cy="214" r="15" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <polygon points="436,202 424,196 438,210" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <ellipse cx="452" cy="250" rx="24" ry="18" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <text x="452" y="292" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">fox eats rabbit</text>

  <rect x="24" y="316" width="464" height="176" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="256" y="346" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">A green plant makes its own food,</text>
  <text x="256" y="372" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">using sunlight, water, and air.</text>
  <text x="256" y="404" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">The rabbit depends on the plant; the fox depends on the rabbit.</text>
  <text x="256" y="432" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">All living things depend on plants,</text>
  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">or on animals that eat them.</text>
  <text x="256" y="482" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Caring for plants is caring for every animal.</text>
</svg>
