<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Standing up: first notice, then help</title>
  <desc id="desc">This picture shows the two steps of standing up for someone. Step one, labeled notice, shows a child who sees that another child was left out and says that is not fair. Step two, labeled help, shows the same child reaching out and inviting the left-out child to come join them. Below, a band labeled repair shows all the children playing together and smiling. The numbered badges, the speech bubbles, and the faces, not color, carry the meaning, so the picture prints clearly in grayscale and teaches that noticing unfairness and doing a kind act are two parts of one brave act, and ends in repair and warmth.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Standing Up: First Notice, Then Help</text>

  <!-- panels -->
  <rect x="20" y="80" width="226" height="270" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="266" y="80" width="226" height="270" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>

  <!-- step badges -->
  <circle cx="46" cy="104" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="46" y="110" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">1</text>
  <text x="133" y="110" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">notice</text>

  <circle cx="292" cy="104" r="16" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="292" y="110" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">2</text>
  <text x="379" y="110" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">help</text>

  <!-- arrow between panels -->
  <line x1="250" y1="215" x2="260" y2="215" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <path d="M260 209 L267 215 L260 221 Z" fill="#4f6d7a"/>

  <!-- ===== Panel 1: notice ===== -->
  <!-- left-out child -->
  <circle cx="95" cy="200" r="13" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <path d="M82 198 A13 13 0 0 1 108 198 Z" fill="#4f6d7a"/>
  <circle cx="90" cy="200" r="1.6" fill="#2b3a42"/>
  <circle cx="100" cy="200" r="1.6" fill="#2b3a42"/>
  <path d="M90 209 Q95 205 100 209" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="86" y="213" width="18" height="28" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="90" y1="241" x2="88" y2="264" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="100" y1="241" x2="102" y2="264" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <text x="95" y="296" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">left out</text>

  <!-- noticing child -->
  <circle cx="185" cy="180" r="13" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M172 178 A13 13 0 0 1 198 178 Z" fill="#2b3a42"/>
  <circle cx="180" cy="180" r="1.6" fill="#2b3a42"/>
  <circle cx="190" cy="180" r="1.6" fill="#2b3a42"/>
  <path d="M180 187 Q185 191 190 187" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="176" y="194" width="18" height="30" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="180" y1="224" x2="178" y2="248" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="190" y1="224" x2="192" y2="248" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <!-- pointing arm -->
  <line x1="176" y1="206" x2="150" y2="214" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <!-- speech bubble -->
  <path d="M166 130 L166 152 Q166 164 178 164 L186 164 L192 176 L194 164 L210 164 Q222 164 222 152 L222 130 Q222 118 210 118 L178 118 Q166 118 166 130 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="194" y="146" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">that is not fair</text>

  <!-- ===== Panel 2: help ===== -->
  <!-- left-out child, now smiling -->
  <circle cx="330" cy="200" r="13" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <path d="M317 198 A13 13 0 0 1 343 198 Z" fill="#4f6d7a"/>
  <circle cx="325" cy="200" r="1.6" fill="#2b3a42"/>
  <circle cx="335" cy="200" r="1.6" fill="#2b3a42"/>
  <path d="M325 207 Q330 212 335 207" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="321" y="213" width="18" height="28" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="325" y1="241" x2="323" y2="264" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="335" y1="241" x2="337" y2="264" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <!-- helping child -->
  <circle cx="410" cy="180" r="13" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M397 178 A13 13 0 0 1 423 178 Z" fill="#2b3a42"/>
  <circle cx="405" cy="180" r="1.6" fill="#2b3a42"/>
  <circle cx="415" cy="180" r="1.6" fill="#2b3a42"/>
  <path d="M405 187 Q410 191 415 187" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="401" y="194" width="18" height="30" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="405" y1="224" x2="403" y2="248" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="415" y1="224" x2="417" y2="248" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <!-- reaching arm -->
  <line x1="401" y1="206" x2="376" y2="214" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <!-- speech bubble -->
  <path d="M356 130 L356 152 Q356 164 368 164 L376 164 L382 176 L384 164 L400 164 Q412 164 412 152 L412 130 Q412 118 400 118 L368 118 Q356 118 356 130 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="384" y="146" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">come join us</text>

  <!-- ===== repair band ===== -->
  <rect x="20" y="366" width="472" height="66" rx="12" fill="#7a9e7e" fill-opacity="0.14" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="256" y="390" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">repair &#183; now everyone plays together</text>
  <g>
    <circle cx="176" cy="414" r="9" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M176 407 A9 9 0 0 1 185 414" fill="none" stroke="#2b3a42" stroke-width="1.6"/>
    <path d="M171 417 Q176 420 181 417" fill="none" stroke="#2b3a42" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="216" cy="414" r="9" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M216 407 A9 9 0 0 1 225 414" fill="none" stroke="#2b3a42" stroke-width="1.6"/>
    <path d="M211 417 Q216 420 221 417" fill="none" stroke="#2b3a42" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="256" cy="414" r="9" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M256 407 A9 9 0 0 1 265 414" fill="none" stroke="#2b3a42" stroke-width="1.6"/>
    <path d="M251 417 Q256 420 261 417" fill="none" stroke="#2b3a42" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="296" cy="414" r="9" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M296 407 A9 9 0 0 1 305 414" fill="none" stroke="#2b3a42" stroke-width="1.6"/>
    <path d="M291 417 Q296 420 301 417" fill="none" stroke="#2b3a42" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="336" cy="414" r="9" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M336 407 A9 9 0 0 1 345 414" fill="none" stroke="#2b3a42" stroke-width="1.6"/>
    <path d="M331 417 Q336 420 341 417" fill="none" stroke="#2b3a42" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">You do not need to be big or strong to notice and be kind.</text>
  <text x="256" y="488" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Noticing and helping are two parts of one brave act</text>
</svg>
