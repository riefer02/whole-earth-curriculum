<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Patterns all around us: stripes, spiral, weave, and tiles</title>
  <desc id="desc">Four cards show patterns found in the world, in every land: striped cloth, a spiral shell, a woven basket weave, and a tiled floor. Each card is labeled with its pattern name. A caption reminds learners that a pattern is anything that repeats again and again. Labels and shapes carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Patterns All Around Us</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">A pattern is something that repeats — again and again.</text>

  <!-- Card 1: stripes -->
  <rect x="36" y="104" width="208" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="60" y="134" width="160" height="80" rx="6" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <g>
    <rect x="76" y="144" width="26" height="60" fill="#e0a458"/>
    <rect x="112" y="144" width="26" height="60" fill="#7a9e7e"/>
    <rect x="148" y="144" width="26" height="60" fill="#6b93b6"/>
    <rect x="184" y="144" width="26" height="60" fill="#e0a458"/>
  </g>
  <text x="140" y="240" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">stripes</text>

  <!-- Card 2: spiral -->
  <rect x="268" y="104" width="208" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M372 168 m-5 0 a5 5 0 1 1 10 0 a10 10 0 1 1 -20 0 a15 15 0 1 1 30 0 a20 20 0 1 1 -40 0 a25 25 0 1 1 50 0" fill="none" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  <text x="372" y="240" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">spiral</text>

  <!-- Card 3: weave -->
  <rect x="36" y="278" width="208" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="66" y="312" width="148" height="72" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#e0a458" stroke-width="8" stroke-linecap="round">
    <line x1="76" y1="330" x2="204" y2="330"/><line x1="76" y1="348" x2="204" y2="348"/><line x1="76" y1="366" x2="204" y2="366"/>
  </g>
  <g stroke="#7a9e7e" stroke-width="8" stroke-linecap="round">
    <line x1="94" y1="312" x2="94" y2="384"/><line x1="130" y1="312" x2="130" y2="384"/><line x1="166" y1="312" x2="166" y2="384"/><line x1="202" y1="312" x2="202" y2="384"/>
  </g>
  <text x="140" y="414" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">weave</text>

  <!-- Card 4: tiles -->
  <rect x="268" y="278" width="208" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="302" y="310" width="140" height="80" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#2b3a42" stroke-width="1.5">
    <rect x="302" y="310" width="28" height="26" fill="#6b93b6"/><rect x="330" y="310" width="28" height="26" fill="#e0a458"/><rect x="358" y="310" width="28" height="26" fill="#7a9e7e"/><rect x="386" y="310" width="28" height="26" fill="#6b93b6"/><rect x="414" y="310" width="28" height="26" fill="#e0a458"/>
    <rect x="302" y="336" width="28" height="26" fill="#7a9e7e"/><rect x="330" y="336" width="28" height="26" fill="#6b93b6"/><rect x="358" y="336" width="28" height="26" fill="#e0a458"/><rect x="386" y="336" width="28" height="26" fill="#7a9e7e"/><rect x="414" y="336" width="28" height="26" fill="#6b93b6"/>
    <rect x="302" y="362" width="28" height="28" fill="#e0a458"/><rect x="330" y="362" width="28" height="28" fill="#7a9e7e"/><rect x="358" y="362" width="28" height="28" fill="#6b93b6"/><rect x="386" y="362" width="28" height="28" fill="#e0a458"/><rect x="414" y="362" width="28" height="28" fill="#7a9e7e"/>
  </g>
  <text x="372" y="414" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">tiles</text>

  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Stripes, spirals, weaves, and tiles — patterns live everywhere, in every land.</text>
</svg>
