<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Movement builds muscles and lifts mood</title>
  <desc id="desc">Two panels. The left panel shows a strong arm lifting a small weight, labeled "movement builds muscles." The right panel shows a smiling face with a rising sun, labeled "movement lifts mood." Labels, not color alone, carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Movement Helps Muscles and Mood</text>

  <!-- Left: muscles -->
  <rect x="26" y="74" width="222" height="250" rx="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="137" y="104" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#4f6d7a">muscles</text>
  <!-- arm lifting weight -->
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96 210 Q96 180 120 166 L156 160"/>
    <circle cx="120" cy="168" r="16" fill="#f5d6b6"/>
  </g>
  <!-- muscle bump -->
  <ellipse cx="120" cy="178" rx="12" ry="16" fill="#e0a458" opacity="0.5" stroke="#2b3a42" stroke-width="1.5"/>
  <!-- dumbbell -->
  <rect x="150" y="150" width="70" height="20" rx="6" fill="#2b3a42"/>
  <rect x="142" y="144" width="18" height="32" rx="5" fill="#2b3a42"/>
  <rect x="210" y="144" width="18" height="32" rx="5" fill="#2b3a42"/>
  <text x="137" y="280" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">movement builds muscles</text>
  <text x="137" y="306" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">muscles strengthen with use</text>

  <!-- Right: mood -->
  <rect x="264" y="74" width="222" height="250" rx="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="375" y="104" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#4f6d7a">mood</text>
  <!-- sun -->
  <circle cx="375" cy="150" r="26" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#e0a458" stroke-width="2.5" stroke-linecap="round">
    <line x1="375" y1="112" x2="375" y2="104"/>
    <line x1="413" y1="150" x2="421" y2="150"/>
    <line x1="375" y1="188" x2="375" y2="196"/>
    <line x1="337" y1="150" x2="329" y2="150"/>
    <line x1="348" y1="124" x2="342" y2="118"/>
    <line x1="402" y1="124" x2="408" y2="118"/>
  </g>
  <!-- smiling face -->
  <circle cx="375" cy="220" r="34" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="363" cy="212" r="3.5" fill="#222222"/>
  <circle cx="387" cy="212" r="3.5" fill="#222222"/>
  <path d="M360 232 Q375 244 390 232" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="375" y="280" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">movement lifts mood</text>
  <text x="375" y="306" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">the brain makes its own good feelings</text>

  <text x="256" y="392" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42">Heart, muscles, and mood — movement is a gift for all three.</text>
  <text x="256" y="424" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">People everywhere move for joy: dance, games, martial arts, walking.</text>
</svg>
