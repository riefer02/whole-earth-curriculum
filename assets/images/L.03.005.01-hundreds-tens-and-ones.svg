<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Hundreds, tens, and ones: four hundreds, three tens, and two ones make four hundred thirty-two</title>
  <desc id="desc">Four hundred flats drawn as large squares of one hundred dots each, three rods of ten drawn as strips of ten dots, and two single units. Labels read four hundreds, three tens, and two ones, with the total four hundred thirty-two, written as 432.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Hundreds, Tens &amp; Ones</text>

  <!-- Four hundreds -->
  <text x="52" y="86" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4f6d7a">4 hundreds</text>
  <g>
    <rect x="30" y="96" width="96" height="96" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="134" y="96" width="96" height="96" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="238" y="96" width="96" height="96" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="342" y="96" width="96" height="96" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <g fill="#fdfbf7" opacity="0.85">
    <circle cx="42" cy="108" r="2.4"/><circle cx="54" cy="108" r="2.4"/><circle cx="66" cy="108" r="2.4"/><circle cx="78" cy="108" r="2.4"/><circle cx="90" cy="108" r="2.4"/><circle cx="102" cy="108" r="2.4"/><circle cx="114" cy="108" r="2.4"/>
    <circle cx="42" cy="120" r="2.4"/><circle cx="54" cy="120" r="2.4"/><circle cx="66" cy="120" r="2.4"/><circle cx="78" cy="120" r="2.4"/><circle cx="90" cy="120" r="2.4"/><circle cx="102" cy="120" r="2.4"/><circle cx="114" cy="120" r="2.4"/>
    <circle cx="42" cy="132" r="2.4"/><circle cx="54" cy="132" r="2.4"/><circle cx="66" cy="132" r="2.4"/><circle cx="78" cy="132" r="2.4"/><circle cx="90" cy="132" r="2.4"/><circle cx="102" cy="132" r="2.4"/><circle cx="114" cy="132" r="2.4"/>
    <circle cx="42" cy="144" r="2.4"/><circle cx="54" cy="144" r="2.4"/><circle cx="66" cy="144" r="2.4"/><circle cx="78" cy="144" r="2.4"/><circle cx="90" cy="144" r="2.4"/><circle cx="102" cy="144" r="2.4"/><circle cx="114" cy="144" r="2.4"/>
    <circle cx="42" cy="156" r="2.4"/><circle cx="54" cy="156" r="2.4"/><circle cx="66" cy="156" r="2.4"/><circle cx="78" cy="156" r="2.4"/><circle cx="90" cy="156" r="2.4"/><circle cx="102" cy="156" r="2.4"/><circle cx="114" cy="156" r="2.4"/>
    <circle cx="42" cy="168" r="2.4"/><circle cx="54" cy="168" r="2.4"/><circle cx="66" cy="168" r="2.4"/><circle cx="78" cy="168" r="2.4"/><circle cx="90" cy="168" r="2.4"/><circle cx="102" cy="168" r="2.4"/><circle cx="114" cy="168" r="2.4"/>
    <circle cx="42" cy="180" r="2.4"/><circle cx="54" cy="180" r="2.4"/><circle cx="66" cy="180" r="2.4"/><circle cx="78" cy="180" r="2.4"/><circle cx="90" cy="180" r="2.4"/><circle cx="102" cy="180" r="2.4"/><circle cx="114" cy="180" r="2.4"/>
  </g>
  <text x="78" y="216" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">(each = 100)</text>

  <!-- Three tens -->
  <text x="52" y="252" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4f6d7a">3 tens</text>
  <g>
    <rect x="30" y="262" width="96" height="34" rx="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="134" y="262" width="96" height="34" rx="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="238" y="262" width="96" height="34" rx="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="78" y="316" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">(each = 10)</text>

  <!-- Two ones -->
  <text x="52" y="352" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4f6d7a">2 ones</text>
  <g>
    <rect x="30" y="362" width="34" height="34" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="72" y="362" width="34" height="34" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="78" y="416" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">(each = 1)</text>

  <rect x="300" y="100" width="184" height="200" rx="12" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
  <text x="392" y="136" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">4 hundreds + 3 tens + 2 ones</text>
  <text x="392" y="200" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#2b3a42">400 + 30 + 2</text>
  <text x="392" y="268" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#e0a458">432</text>

  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#4f6d7a">Ten ones make a ten. Ten tens make a hundred.</text>
</svg>
