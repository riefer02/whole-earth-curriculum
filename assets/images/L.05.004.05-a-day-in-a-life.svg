<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A day in a life</title>
  <desc id="desc">A day timeline drawn as a circle with four labeled sections — "morning," "midday," "evening," and "night." Around the circle, small pictures show one child's day: carrying water, learning, playing, and sleeping, with the place label "a high Andes village." Below, a second empty circle is labeled "my day," inviting the learner to fill in their own morning, midday, evening, and night. A caption reads "Every life has a rhythm — the details differ." Labels and pictures, not color alone, carry the meaning.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">A Day in Someone Else's Life</text>

  <!-- day circle -->
  <circle cx="150" cy="200" r="112" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <line x1="150" y1="88" x2="150" y2="312" stroke="#2b3a42" stroke-width="2"/>
  <line x1="38" y1="200" x2="262" y2="200" stroke="#2b3a42" stroke-width="2"/>
  <text x="150" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">morning</text>
  <text x="150" y="336" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">evening</text>
  <text x="40" y="204" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">midday</text>
  <text x="260" y="204" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">night</text>

  <!-- morning: carrying water -->
  <circle cx="150" cy="120" r="9" fill="#d9a06b" stroke="#2b3a42" stroke-width="2"/>
  <path d="M141 138 q9 -8 18 0" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M142 128 L148 108 L160 118" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <text x="150" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">carry water</text>

  <!-- midday: learning -->
  <circle cx="98" cy="200" r="9" fill="#d9a06b" stroke="#2b3a42" stroke-width="2"/>
  <path d="M89 218 q9 -8 18 0" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <rect x="76" y="186" width="22" height="16" rx="2" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="98" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">learn</text>

  <!-- evening: play -->
  <circle cx="150" cy="280" r="9" fill="#d9a06b" stroke="#2b3a42" stroke-width="2"/>
  <path d="M141 298 q9 -8 18 0" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="168" cy="272" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="150" y="322" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">play</text>

  <!-- night: sleep -->
  <circle cx="216" cy="200" r="9" fill="#d9a06b" stroke="#2b3a42" stroke-width="2"/>
  <path d="M240 214 q-14 10 -24 -2" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <text x="244" y="186" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">sleep</text>

  <text x="150" y="376" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">one child's day — a high Andes village</text>

  <!-- my day circle -->
  <circle cx="392" cy="200" r="112" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="392" y1="88" x2="392" y2="312" stroke="#4f6d7a" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="280" y1="200" x2="504" y2="200" stroke="#4f6d7a" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="392" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">morning</text>
  <text x="392" y="336" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">evening</text>
  <text x="282" y="204" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">midday</text>
  <text x="502" y="204" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">night</text>
  <text x="392" y="376" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">my day — fill it in</text>

  <text x="256" y="428" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">Every life has a rhythm — the details differ.</text>
  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Same day, different world — meet it with curiosity, not judgment.</text>
</svg>
