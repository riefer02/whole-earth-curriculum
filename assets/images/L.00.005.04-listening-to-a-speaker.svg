<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Listening to a speaker: attention, in your own way</title>
  <desc id="desc">A speaker on the left holds a talking stick and speaks, with a speech bubble above. A listener on the right gives their full attention with a calm, turned-toward body and hands gently still. Two small insets below show different respectful ways to listen: one listener looks down to show respect, and one listener watches the speaker's hands, because some people listen by watching sign or hands. The words "be present" and "let them finish" and the calm body shapes carry the meaning, so the picture prints clearly in grayscale and teaches that listening to a person is a way of caring, with no single required way to use your eyes.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Listening to a Speaker</text>

  <line x1="48" y1="320" x2="464" y2="320" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>

  <!-- Speaker (left) holding talking stick -->
  <g>
    <circle cx="140" cy="205" r="22" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M118 203 A22 22 0 0 1 162 203 Z" fill="#2b3a42"/>
    <circle cx="132" cy="205" r="2.2" fill="#2b3a42"/>
    <circle cx="148" cy="205" r="2.2" fill="#2b3a42"/>
    <path d="M132 216 Q140 222 148 216" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="122" y="230" width="36" height="52" rx="12" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="130" y1="282" x2="128" y2="318" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <line x1="150" y1="282" x2="152" y2="318" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <line x1="122" y1="244" x2="84" y2="256" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <line x1="158" y1="244" x2="196" y2="238" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <line x1="196" y1="238" x2="196" y2="206" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <circle cx="196" cy="202" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="140" y="344" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">I speak</text>

  <!-- Speech bubble -->
  <path d="M96 120 Q96 96 122 96 L210 96 Q224 96 224 108 L224 138 Q224 150 210 150 L152 150 L142 162 L144 150 L122 150 Q96 150 96 138 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="160" y="128" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">one important thing</text>

  <!-- Listener (right) -->
  <g>
    <circle cx="372" cy="205" r="22" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M350 203 A22 22 0 0 1 394 203 Z" fill="#4f6d7a"/>
    <circle cx="364" cy="205" r="2.2" fill="#2b3a42"/>
    <circle cx="380" cy="205" r="2.2" fill="#2b3a42"/>
    <path d="M364 216 Q372 222 380 216" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="354" y="230" width="36" height="52" rx="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="362" y1="282" x2="360" y2="318" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <line x1="382" y1="282" x2="384" y2="318" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <path d="M354 248 Q358 260 362 248" fill="none" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <path d="M366 248 Q370 260 374 248" fill="none" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="372" y="344" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">I listen</text>

  <!-- Heart between them -->
  <path d="M256 234 Q250 224 244 234 Q238 244 256 254 Q274 244 268 234 Q262 224 256 234 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>

  <!-- Two listening insets -->
  <rect x="30" y="366" width="218" height="94" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="86" cy="412" r="18" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <path d="M68 410 A18 18 0 0 1 104 410 Z" fill="#2b3a42"/>
  <path d="M80 412 Q84 409 88 412" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M92 412 Q96 409 100 412" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="150" y="410" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">some look down</text>
  <text x="150" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">to listen with respect</text>

  <rect x="264" y="366" width="218" height="94" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="320" cy="412" r="18" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M302 410 A18 18 0 0 1 338 410 Z" fill="#4f6d7a"/>
  <circle cx="314" cy="412" r="2" fill="#2b3a42"/>
  <circle cx="326" cy="412" r="2" fill="#2b3a42"/>
  <text x="392" y="410" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">some watch the hands</text>
  <text x="392" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">(sign, or pointing)</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Be present, don't interrupt, let them finish.</text>
</svg>
