<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 600" role="img" aria-labelledby="title desc">
  <title id="title">Same tool, different lives</title>
  <desc id="desc">A two-panel comparison of how one tool, the mobile phone, is used differently in two places. The left panel, labeled "Place A — far from banks," shows two hands holding phones with an arrow and coins between them, above the caption "the phone is a wallet: send and save money." The right panel, labeled "Place B — a busy city," shows a phone with a speech bubble and a photo frame, above the caption "the phone is for talking, photos, and messages." A bottom band reads "same phone — why the difference? Place A has few banks, so the phone fills that need. Place B has many banks, so the phone does other jobs." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="600" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Same Tool, Different Lives</text>
  <text x="256" y="54" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">one phone, two ways to live with it</text>

  <!-- left panel -->
  <rect x="24" y="76" width="224" height="330" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="104" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">PLACE A — far from banks</text>

  <!-- two phones with money arrow -->
  <rect x="52" y="140" width="42" height="76" rx="6" fill="#2b3a42" stroke="#2b3a42" stroke-width="2"/>
  <rect x="58" y="150" width="30" height="46" rx="3" fill="#fdfbf7"/>
  <rect x="160" y="140" width="42" height="76" rx="6" fill="#2b3a42" stroke="#2b3a42" stroke-width="2"/>
  <rect x="166" y="150" width="30" height="46" rx="3" fill="#fdfbf7"/>
  <line x1="94" y1="178" x2="160" y2="178" stroke="#7a9e7e" stroke-width="2" marker-end="url(#arr2)"/>
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7a9e7e"/>
    </marker>
  </defs>
  <circle cx="127" cy="166" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="127" y="169" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">$</text>

  <rect x="40" y="238" width="192" height="78" rx="8" fill="#fdfbf7" stroke="#4f6d7a" stroke-width="1.5"/>
  <text x="136" y="262" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">the phone is a wallet:</text>
  <text x="136" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">send money, pay at a</text>
  <text x="136" y="298" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">market, save for later</text>

  <rect x="40" y="330" width="192" height="56" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">why? few bank branches</text>
  <text x="136" y="370" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">nearby — the phone fills that gap</text>

  <!-- right panel -->
  <rect x="264" y="76" width="224" height="330" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="104" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">PLACE B — a busy city</text>

  <rect x="332" y="140" width="42" height="76" rx="6" fill="#2b3a42" stroke="#2b3a42" stroke-width="2"/>
  <rect x="338" y="150" width="30" height="46" rx="3" fill="#fdfbf7"/>
  <rect x="352" y="130" width="48" height="30" rx="6" fill="#fdfbf7" stroke="#4f6d7a" stroke-width="1.5"/>
  <text x="376" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">"hi!"</text>

  <rect x="40" y="238" width="192" height="78" rx="8" fill="#fdfbf7" stroke="#4f6d7a" stroke-width="1.5"/>
  <text x="136" y="262" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">the phone is for talking,</text>
  <text x="136" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">taking photos, and</text>
  <text x="136" y="298" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">sending messages</text>

  <rect x="40" y="330" width="192" height="56" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">why? many banks and shops</text>
  <text x="136" y="370" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">nearby — the phone does other jobs</text>

  <!-- bottom band -->
  <rect x="24" y="426" width="464" height="120" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="454" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Same phone. Why the difference?</text>
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">People shape a tool around the life they have —</text>
  <text x="256" y="498" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">the needs, the land, the money, the distance.</text>
  <text x="256" y="524" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">No use is "better" — each one fits its place.</text>
</svg>
