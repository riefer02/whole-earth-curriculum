<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Judging design — four questions</title>
  <desc id="desc">A judgment sheet with four questions — who does it help, who does it harm, what does it cost the Earth, and could it be done better — each with a balance-scale icon and a line for evidence.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <rect x="32" y="28" width="448" height="456" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="62" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#222222" font-weight="bold">Judging a design</text>
  <!-- four rows -->
  <g stroke="#2b3a42" stroke-width="2">
    <rect x="52" y="88" width="408" height="84" rx="6" fill="#6b93b6" fill-opacity="0.15"/>
    <rect x="52" y="184" width="408" height="84" rx="6" fill="#e0a458" fill-opacity="0.18"/>
    <rect x="52" y="280" width="408" height="84" rx="6" fill="#7a9e7e" fill-opacity="0.18"/>
    <rect x="52" y="376" width="408" height="84" rx="6" fill="#4f6d7a" fill-opacity="0.15"/>
  </g>
  <!-- balance scale icon helper -->
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <!-- scale 1 -->
    <path d="M78 110 L108 110"/>
    <path d="M93 110 L93 124"/>
    <path d="M78 124 L108 124"/>
    <path d="M84 124 L84 138 L78 138"/>
    <path d="M102 124 L102 138 L108 138"/>
    <!-- scale 2 -->
    <path d="M78 206 L108 206"/>
    <path d="M93 206 L93 220"/>
    <path d="M78 220 L108 220"/>
    <path d="M84 220 L84 234 L78 234"/>
    <path d="M102 220 L102 234 L108 234"/>
    <!-- scale 3 -->
    <path d="M78 302 L108 302"/>
    <path d="M93 302 L93 316"/>
    <path d="M78 316 L108 316"/>
    <path d="M84 316 L84 330 L78 330"/>
    <path d="M102 316 L102 330 L108 330"/>
    <!-- scale 4 -->
    <path d="M78 398 L108 398"/>
    <path d="M93 398 L93 412"/>
    <path d="M78 412 L108 412"/>
    <path d="M84 412 L84 426 L78 426"/>
    <path d="M102 412 L102 426 L108 426"/>
  </g>
  <text x="128" y="118" font-family="sans-serif" font-size="19" fill="#222222" font-weight="bold">1 · Who does it help?</text>
  <text x="128" y="140" font-family="sans-serif" font-size="14" fill="#222222">evidence: ______</text>
  <text x="128" y="214" font-family="sans-serif" font-size="19" fill="#222222" font-weight="bold">2 · Who does it harm?</text>
  <text x="128" y="236" font-family="sans-serif" font-size="14" fill="#222222">evidence: ______</text>
  <text x="128" y="310" font-family="sans-serif" font-size="19" fill="#222222" font-weight="bold">3 · What does it cost the Earth?</text>
  <text x="128" y="332" font-family="sans-serif" font-size="14" fill="#222222">evidence: ______</text>
  <text x="128" y="406" font-family="sans-serif" font-size="19" fill="#222222" font-weight="bold">4 · Could it be done better?</text>
  <text x="128" y="428" font-family="sans-serif" font-size="14" fill="#222222">evidence: ______</text>
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">a judgment names evidence, not just taste</text>
</svg>
