<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Environmental change and migration</title>
  <desc id="desc">A diagram showing environmental change — drought, flood, and sea-level rise — as push factors that can drive people to move, with arrows to adaptation — moving to new land, changing how they farm, building differently — for both the past and today.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Environmental change can push people to move — and to adapt</text>

  <!-- push factors -->
  <g>
    <rect x="40" y="80" width="120" height="64" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="100" y="108" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">drought</text>
    <text x="100" y="128" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">rains fail</text>
  </g>
  <g>
    <rect x="196" y="80" width="120" height="64" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="108" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">flood</text>
    <text x="256" y="128" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">waters rise</text>
  </g>
  <g>
    <rect x="352" y="80" width="120" height="64" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="412" y="108" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">sea-level rise</text>
    <text x="412" y="128" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">coasts shrink</text>
  </g>

  <!-- arrows down -->
  <path d="M100 144 L100 196 L200 236" fill="none" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#sarr)"/>
  <path d="M256 144 L256 236" fill="none" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#sarr)"/>
  <path d="M412 144 L412 196 L312 236" fill="none" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#sarr)"/>
  <defs>
    <marker id="sarr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 Z" fill="#2b3a42"/>
    </marker>
  </defs>

  <!-- central node -->
  <rect x="176" y="236" width="160" height="64" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="262" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">people move</text>
  <text x="256" y="282" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">in the past and today</text>

  <!-- arrows down to adaptation -->
  <path d="M256 300 L256 348" fill="none" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#sarr)"/>

  <!-- adaptation -->
  <rect x="96" y="352" width="320" height="96" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="378" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">people adapt</text>
  <text x="256" y="400" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">move to new land · change how they farm</text>
  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">build differently · plan together</text>

  <text x="256" y="476" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">Past: the Ancestral Pueblo moved from Chaco Canyon in drought (late 1200s). Today: the same pattern, faster.</text>
</svg>
