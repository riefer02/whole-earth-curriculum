<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 560" role="img" aria-labelledby="title desc">
  <title id="title">Use it carefully so it lasts</title>
  <desc id="desc">A two-panel comparison about using a resource carefully. The left panel, labeled "careless use," shows a tap running with water spilling away and the caption "water wasted, less for later." The right panel, labeled "careful use," shows a tap turned off, a bucket, and a fixed pipe, with the caption "the same water serves today and tomorrow." A closing band reads "use less than comes back, and it lasts." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="560" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Use It Carefully So It Lasts</text>
  <text x="256" y="54" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">a resource lasts when we use less than comes back</text>

  <!-- left panel -->
  <rect x="24" y="80" width="224" height="330" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="108" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">CARELESS use</text>

  <!-- running tap -->
  <rect x="92" y="140" width="88" height="30" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M122,170 C122,196 110,200 110,220 L122,232" fill="none" stroke="#6b93b6" stroke-width="8" stroke-linecap="round"/>
  <g fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5">
    <path d="M124,240 l6,16 l-12,0 Z"/>
    <path d="M140,250 l6,16 l-12,0 Z"/>
  </g>
  <text x="160" y="262" font-family="sans-serif" font-size="12" fill="#4f6d7a">left running…</text>

  <rect x="40" y="300" width="192" height="86" rx="8" fill="#fdfbf7" stroke="#4f6d7a" stroke-width="1.5"/>
  <text x="136" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">water wasted</text>
  <text x="136" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">— less for later</text>
  <text x="136" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">today uses up tomorrow</text>

  <!-- arrow -->
  <line x1="252" y1="245" x2="262" y2="245" stroke="#2b3a42" stroke-width="2"/>
  <path d="M264,237 L274,245 L264,253 Z" fill="#2b3a42"/>

  <!-- right panel -->
  <rect x="276" y="80" width="212" height="330" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="382" y="108" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">CAREFUL use</text>

  <!-- closed tap + bucket -->
  <rect x="346" y="140" width="72" height="26" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="382" y1="140" x2="382" y2="128" stroke="#2b3a42" stroke-width="2"/>
  <path d="M360,166 L360,196 L404,196 L404,166 Z" fill="none" stroke="#7a9e7e" stroke-width="6" stroke-linejoin="round"/>
  <text x="410" y="190" font-family="sans-serif" font-size="12" fill="#4f6d7a">tap off</text>

  <rect x="300" y="212" width="120" height="46" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="360" cy="212" rx="58" ry="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="360" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">a bucket catches what we need</text>

  <rect x="292" y="300" width="180" height="86" rx="8" fill="#fdfbf7" stroke="#4f6d7a" stroke-width="1.5"/>
  <text x="382" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">the same water serves</text>
  <text x="382" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">today and tomorrow</text>
  <text x="382" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">fix leaks · take what we need</text>

  <!-- bottom band -->
  <rect x="24" y="436" width="464" height="78" rx="10" fill="#2b3a42" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Use less than comes back, and it lasts.</text>
  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fdfbf7">careful use is fair to people today and to people not born yet</text>
</svg>
