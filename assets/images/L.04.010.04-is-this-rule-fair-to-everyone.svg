<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Is this rule fair to everyone?</title>
  <desc id="desc">A rule card at the top reads "rule: everyone must reach the top shelf to get a book." Below it, a row of three different figures shows who is affected: a tall child who reaches easily, a shorter child who must stretch, and a child in a wheelchair who cannot reach at all. Three check questions run down the left: "who does it affect?", "does it treat anyone worse?", "is there a fairer way?" A judgment banner at the bottom reads "not fair to everyone — add a low shelf or a helper." Labels, the three figures, and the check questions, not color, carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">Is This Rule Fair to Everyone?</text>

  <!-- rule card -->
  <rect x="86" y="52" width="340" height="54" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4f6d7a">RULE</text>
  <text x="256" y="92" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Everyone must reach the top shelf to get a book.</text>

  <!-- shelf -->
  <rect x="86" y="124" width="340" height="12" rx="4" fill="#2b3a42"/>
  <line x1="86" y1="136" x2="426" y2="136" stroke="#2b3a42" stroke-width="1"/>
  <rect x="180" y="112" width="16" height="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <rect x="300" y="112" width="16" height="14" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  <!-- figure 1: tall child reaches easily -->
  <circle cx="150" cy="172" r="15" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M135 170 A15 15 0 0 1 165 170 Z" fill="#2b3a42"/>
  <circle cx="145" cy="172" r="1.8" fill="#2b3a42"/>
  <circle cx="155" cy="172" r="1.8" fill="#2b3a42"/>
  <path d="M145 179 Q150 184 155 179" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="140" y="190" width="20" height="64" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <!-- tall arm reaching up -->
  <path d="M160 200 L178 150" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <text x="150" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">tall — reaches</text>
  <text x="150" y="286" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">easily</text>

  <!-- figure 2: shorter child must stretch -->
  <circle cx="256" cy="186" r="14" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M242 184 A14 14 0 0 1 270 184 Z" fill="#2b3a42"/>
  <circle cx="251" cy="186" r="1.6" fill="#2b3a42"/>
  <circle cx="261" cy="186" r="1.6" fill="#2b3a42"/>
  <path d="M251 192 Q256 196 261 192" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="246" y="200" width="20" height="40" rx="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <!-- stretching arm -->
  <path d="M266 206 L282 166" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <path d="M262 210 L252 218" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <text x="256" y="258" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">shorter — must</text>
  <text x="256" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">stretch</text>

  <!-- figure 3: child in wheelchair cannot reach -->
  <circle cx="368" cy="186" r="14" fill="#e8c39e" stroke="#2b3a42" stroke-width="2"/>
  <path d="M354 184 A14 14 0 0 1 382 184 Z" fill="#2b3a42"/>
  <circle cx="363" cy="186" r="1.6" fill="#2b3a42"/>
  <circle cx="373" cy="186" r="1.6" fill="#2b3a42"/>
  <path d="M363 192 Q368 195 373 192" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="358" y="200" width="20" height="26" rx="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <!-- wheelchair -->
  <rect x="348" y="226" width="40" height="16" rx="6" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="356" cy="246" r="7" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="380" cy="246" r="7" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="368" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">wheelchair —</text>
  <text x="368" y="286" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">cannot reach</text>

  <!-- fairness check questions -->
  <rect x="24" y="304" width="220" height="96" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="134" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">Fairness check</text>
  <text x="38" y="348" text-anchor="start" font-family="sans-serif" font-size="11" fill="#222222">1. Who does it affect?</text>
  <text x="38" y="366" text-anchor="start" font-family="sans-serif" font-size="11" fill="#222222">2. Does it treat anyone worse?</text>
  <text x="38" y="384" text-anchor="start" font-family="sans-serif" font-size="11" fill="#222222">3. Is there a fairer way?</text>

  <!-- judgment banner -->
  <rect x="268" y="304" width="220" height="96" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="378" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">My judgment</text>
  <text x="286" y="350" text-anchor="start" font-family="sans-serif" font-size="11" fill="#222222">Not fair to everyone.</text>
  <text x="286" y="368" text-anchor="start" font-family="sans-serif" font-size="11" fill="#222222">Fix: add a low shelf</text>
  <text x="286" y="386" text-anchor="start" font-family="sans-serif" font-size="11" fill="#222222">or a helper.</text>

  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Change the rule, not the person.</text>
  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Fair to everyone can mean different support for different needs.</text>
  <text x="256" y="488" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#4f6d7a">Labels and the three figures, not color, carry the meaning.</text>
</svg>
