<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Still learning: not yet is not a verdict</title>
  <desc id="desc">A growth ladder with three rungs labeled "not yet," "with help," and "on my own," and a small climber stepping from the bottom rung up toward the top. Beside the ladder, a speech bubble says "Not yet means I am still learning." A note at the bottom says everyone is learning something, and "not yet" is information, not a verdict. The ladder, rung labels, and words, not color, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Still Learning</text>

  <!-- ladder rails -->
  <line x1="150" y1="90" x2="150" y2="420" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
  <line x1="250" y1="90" x2="250" y2="420" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>

  <!-- rungs -->
  <line x1="150" y1="120" x2="250" y2="120" stroke="#4f6d7a" stroke-width="5" stroke-linecap="round"/>
  <line x1="150" y1="230" x2="250" y2="230" stroke="#4f6d7a" stroke-width="5" stroke-linecap="round"/>
  <line x1="150" y1="340" x2="250" y2="340" stroke="#4f6d7a" stroke-width="5" stroke-linecap="round"/>

  <!-- rung labels -->
  <text x="150" y="158" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">not yet</text>
  <text x="150" y="268" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">with help</text>
  <text x="150" y="378" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">on my own</text>

  <!-- climber: figure standing on "not yet" rung, reaching up -->
  <g>
    <circle cx="200" cy="90" r="16" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M192 86 A16 16 0 0 1 208 86 Z" fill="#2b3a42"/>
    <circle cx="195" cy="92" r="1.8" fill="#2b3a42"/>
    <circle cx="205" cy="92" r="1.8" fill="#2b3a42"/>
    <path d="M195 98 Q200 101 205 98" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="188" y="106" width="24" height="34" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="196" y1="112" x2="196" y2="130" stroke="#d6d1c7" stroke-width="5" stroke-linecap="round"/>
    <line x1="204" y1="112" x2="204" y2="130" stroke="#d6d1c7" stroke-width="5" stroke-linecap="round"/>
    <line x1="196" y1="130" x2="196" y2="140" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="204" y1="130" x2="204" y2="140" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="194" cy="144" rx="8" ry="4" fill="#2b3a42"/>
    <ellipse cx="206" cy="144" rx="8" ry="4" fill="#2b3a42"/>
    <line x1="176" y1="112" x2="162" y2="96" stroke="#d6d1c7" stroke-width="5" stroke-linecap="round"/>
    <line x1="224" y1="112" x2="238" y2="96" stroke="#d6d1c7" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- speech bubble -->
  <g>
    <rect x="290" y="120" width="196" height="72" rx="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M312 192 L318 206 L330 194 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="388" y="150" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">"Not yet" means</text>
    <text x="388" y="172" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">I am still learning.</text>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Everyone is learning something. "Not yet" is information, not a verdict.</text>
</svg>
