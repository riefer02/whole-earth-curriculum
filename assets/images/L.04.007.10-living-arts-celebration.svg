<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">The four arts, joined together</title>
  <desc id="d">Four rounded panels arranged around a center circle labeled "living arts." The panels are labeled: see (visual art), hear (music and sound), move (dance and drama), and make (making and design). Labels carry all meaning, so the graphic prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#222222">The Four Arts, Joined Together</text>

  <!-- center -->
  <circle cx="256" cy="256" r="64" fill="#e0a458" fill-opacity="0.4" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="250" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">living</text>
  <text x="256" y="272" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">arts</text>

  <!-- four panels -->
  <g font-family="sans-serif" fill="#222222">
    <rect x="30" y="120" width="150" height="80" rx="12" fill="#7a9e7e" fill-opacity="0.5" stroke="#2b3a42" stroke-width="3"/>
    <text x="105" y="156" text-anchor="middle" font-size="18" font-weight="bold">see</text>
    <text x="105" y="180" text-anchor="middle" font-size="13">visual art</text>

    <rect x="332" y="120" width="150" height="80" rx="12" fill="#6b93b6" fill-opacity="0.5" stroke="#2b3a42" stroke-width="3"/>
    <text x="407" y="156" text-anchor="middle" font-size="18" font-weight="bold">hear</text>
    <text x="407" y="180" text-anchor="middle" font-size="13">music and sound</text>

    <rect x="30" y="312" width="150" height="80" rx="12" fill="#e0a458" fill-opacity="0.5" stroke="#2b3a42" stroke-width="3"/>
    <text x="105" y="348" text-anchor="middle" font-size="18" font-weight="bold">move</text>
    <text x="105" y="372" text-anchor="middle" font-size="13">dance and drama</text>

    <rect x="332" y="312" width="150" height="80" rx="12" fill="#c9d4d8" stroke="#2b3a42" stroke-width="3"/>
    <text x="407" y="348" text-anchor="middle" font-size="18" font-weight="bold">make</text>
    <text x="407" y="372" text-anchor="middle" font-size="13">making and design</text>
  </g>

  <!-- connector lines -->
  <g fill="none" stroke="#2b3a42" stroke-width="2.5">
    <line x1="180" y1="160" x2="204" y2="204"/>
    <line x1="332" y1="160" x2="308" y2="204"/>
    <line x1="180" y1="352" x2="204" y2="308"/>
    <line x1="332" y1="352" x2="308" y2="308"/>
  </g>

  <text x="256" y="472" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">Celebrate what we made &#8212; and honor the living arts of every people.</text>
</svg>
