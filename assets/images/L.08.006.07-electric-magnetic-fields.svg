<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Electric current makes a magnetic field</title>
  <desc id="desc">A straight vertical wire with an electric current, surrounded by concentric magnetic field circles, with a compass needle nearby. Labels note the chain moving charge to field to force to current.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Current Makes a Magnetic Field</text>

  <!-- wire -->
  <rect x="250" y="90" width="12" height="230" rx="3" fill="#2b3a42"/>
  <text x="238" y="80" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">wire</text>
  <!-- current arrow up -->
  <path d="M256 300 L256 120" fill="none" stroke="#e0a458" stroke-width="3" marker-end="url(#iarr)"/>
  <defs>
    <marker id="iarr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 Z" fill="#e0a458"/>
    </marker>
  </defs>
  <text x="286" y="130" font-family="sans-serif" font-size="12.5" fill="#2b3a42">current</text>

  <!-- concentric field lines -->
  <circle cx="256" cy="205" r="52" fill="none" stroke="#6b93b6" stroke-width="2.5"/>
  <circle cx="256" cy="205" r="86" fill="none" stroke="#6b93b6" stroke-width="2.5"/>
  <circle cx="256" cy="205" r="120" fill="none" stroke="#6b93b6" stroke-width="2.5"/>
  <text x="256" y="380" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#2b3a42">magnetic field lines</text>

  <!-- compass -->
  <g>
    <circle cx="120" cy="205" r="30" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M120 182 L128 228 Z" fill="#2b3a42"/>
    <path d="M120 228 L112 182 Z" fill="#e0a458"/>
    <circle cx="120" cy="205" r="3" fill="#2b3a42"/>
    <text x="120" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">compass</text>
  </g>

  <!-- chain -->
  <rect x="34" y="420" width="444" height="70" rx="8" fill="#ffffff" stroke="#4f6d7a" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="46" y="444" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">moving charge → field → force → current</text>
  <text x="46" y="466" font-family="sans-serif" font-size="13" fill="#222222">motor: current → motion   |   generator: motion → current</text>
  <text x="46" y="484" font-family="sans-serif" font-size="12" fill="#4f6d7a">A changing field can push charge to make a current — that is the link.</text>
</svg>
