<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Sorting shapes by their attributes</title>
  <desc id="desc">Three sorting rings. The first holds a triangle and a smaller triangle, labeled three sides. The second holds a square and a rectangle, labeled four sides. The third holds a pentagon and a hexagon, labeled five or more sides. A note says the rule decides the pile.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Sorting Shapes by Attributes</text>

  <!-- Ring 1: 3 sides -->
  <ellipse cx="106" cy="190" rx="86" ry="104" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="106" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7a9e7e">3 sides</text>
  <polygon points="106,130 148,200 64,200" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <polygon points="96,240 126,280 66,280" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  <!-- Ring 2: 4 sides -->
  <ellipse cx="256" cy="190" rx="86" ry="104" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <text x="256" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6b93b6">4 sides</text>
  <rect x="214" y="126" width="84" height="84" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <rect x="204" y="236" width="104" height="62" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>

  <!-- Ring 3: 5+ sides -->
  <ellipse cx="406" cy="190" rx="86" ry="104" fill="none" stroke="#e0a458" stroke-width="3"/>
  <text x="406" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e0a458">5 or more sides</text>
  <polygon points="406,120 446,150 432,196 380,196 366,150" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <polygon points="406,232 434,246 434,278 406,292 378,278 378,246" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>

  <rect x="96" y="330" width="320" height="100" rx="12" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
  <text x="256" y="362" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">Same shape, different piles?</text>
  <text x="256" y="396" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">The rule decides the pile.</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#4f6d7a">A category is a shared attribute.</text>
</svg>
