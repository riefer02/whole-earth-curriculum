<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">One text, many readings</title>
  <desc id="desc">A single text box sits at the center. Four reading figures surround it, each connected by a line and labeled with a different perspective: the author's, a dominant voice, a missing voice, and a reader from another culture. A note reads: one text, many readings.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="30" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">One Text, Many Readings</text>

  <!-- Center text -->
  <rect x="196" y="214" width="120" height="72" rx="9" fill="#dce9f0" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="244" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">the text</text>
  <line x1="214" y1="256" x2="298" y2="256" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <line x1="214" y1="270" x2="284" y2="270" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>

  <!-- Four reader figures -->
  <g stroke="#2b3a42" stroke-width="2" fill="#eaf2ea">
    <circle cx="256" cy="120" r="16"/>
    <path d="M256 136 q-17 17 0 34 q17 -17 0 -34 z"/>
  </g>
  <text x="256" y="96" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a5a3a">the author's</text>

  <g stroke="#2b3a42" stroke-width="2" fill="#f6ead8">
    <circle cx="100" cy="256" r="16"/>
    <path d="M100 272 q-17 17 0 34 q17 -17 0 -34 z"/>
  </g>
  <text x="100" y="332" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8a6d4a">a dominant voice</text>

  <g stroke="#2b3a42" stroke-width="2" fill="#eaf2ea">
    <circle cx="412" cy="256" r="16"/>
    <path d="M412 272 q-17 17 0 34 q17 -17 0 -34 z"/>
  </g>
  <text x="412" y="332" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a5a6a">a missing voice</text>

  <g stroke="#2b3a42" stroke-width="2" fill="#f6ead8">
    <circle cx="256" cy="396" r="16"/>
    <path d="M256 412 q-17 17 0 34 q17 -17 0 -34 z"/>
  </g>
  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8a6d4a">a reader from another culture</text>

  <!-- Connection lines -->
  <g stroke="#7a9e7e" stroke-width="2" fill="none">
    <line x1="256" y1="172" x2="256" y2="212"/>
    <line x1="118" y1="248" x2="194" y2="248"/>
    <line x1="394" y1="248" x2="318" y2="248"/>
    <line x1="256" y1="360" x2="256" y2="288"/>
  </g>

  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">a text that survives its counter-reading is stronger for it</text>
</svg>
