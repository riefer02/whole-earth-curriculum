<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Responding with Care and Justice</title>
  <desc id="desc">A scale balancing two responses. One pan shows a community rebuilding and planting where they are; the other shows people moving together with their belongings to a new place, with helping hands between them.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Care and Justice in the Balance</text>

  <!-- Scale -->
  <line x1="256" y1="80" x2="256" y2="260" stroke="#2b3a42" stroke-width="4"/>
  <line x1="120" y1="100" x2="392" y2="100" stroke="#2b3a42" stroke-width="4"/>
  <line x1="140" y1="100" x2="140" y2="150" stroke="#2b3a42" stroke-width="2"/>
  <line x1="372" y1="100" x2="372" y2="150" stroke="#2b3a42" stroke-width="2"/>

  <!-- Left pan: adapt in place -->
  <rect x="110" y="150" width="60" height="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="120" y="124" width="18" height="26" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M124 124 l6 -10 l6 10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="140" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">rebuild &amp; plant</text>

  <!-- Right pan: move together -->
  <rect x="342" y="150" width="60" height="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <path d="M356 148 q6 -12 0 -18 M364 148 q6 -12 0 -18"/>
  </g>
  <circle cx="356" cy="122" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="366" cy="120" r="5" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="372" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">move together</text>

  <!-- Helping hands -->
  <g stroke="#e0a458" stroke-width="4" fill="none">
    <path d="M200 330 q20 -18 40 -6"/>
    <path d="M312 330 q-20 -18 -40 -6"/>
  </g>
  <g fill="#e0a458" stroke="#2b3a42" stroke-width="2">
    <circle cx="238" cy="316" r="7"/>
    <circle cx="274" cy="316" r="7"/>
  </g>

  <text x="256" y="392" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Ask of every response: who is helped, and who carries the cost?</text>
</svg>
