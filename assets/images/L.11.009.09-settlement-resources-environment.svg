<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Settlement, Resources, Environment</title>
  <desc id="desc">A circular diagram with three nodes — people settling (small houses), resources used (water and trees), and environmental change (a shrinking river and a cleared slope) — connected by arrows forming a loop.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">The Settlement&#8211;Resource&#8211;Environment Loop</text>

  <!-- Three nodes -->
  <g>
    <!-- Settlement (top) -->
    <rect x="206" y="70" width="100" height="34" fill="#e0a458" stroke="#2b3a42" stroke-width="2" rx="4"/>
    <text x="256" y="92" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Settlement</text>

    <!-- Resources (bottom-left) -->
    <rect x="80" y="300" width="120" height="34" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" rx="4"/>
    <text x="140" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Resources used</text>

    <!-- Environment (bottom-right) -->
    <rect x="312" y="300" width="130" height="34" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" rx="4"/>
    <text x="377" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Environment changes</text>
  </g>

  <!-- Arrows forming the loop -->
  <g fill="none" stroke="#2b3a42" stroke-width="3">
    <path d="M216 104 L158 296" marker-end="none"/>
    <path d="M140 300 L140 130" />
    <path d="M296 104 L362 296"/>
    <path d="M377 300 L377 130"/>
  </g>
  <!-- Arrowheads -->
  <g fill="#2b3a42">
    <polygon points="140,300 133,284 147,284"/>
    <polygon points="377,300 370,284 384,284"/>
    <polygon points="152,300 158,286 146,290"/>
    <polygon points="360,300 354,286 366,290"/>
  </g>

  <!-- Small symbols -->
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <path d="M110 250 h20 v14 h-20 z" />
    <path d="M400 250 q8 -8 16 0 q8 8 16 0"/>
  </g>

  <text x="256" y="392" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">People settle, use resources, and change the environment —</text>
  <text x="256" y="414" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">and the changed environment reshapes the people.</text>
</svg>
