<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">What the text says and means</title>
  <desc id="desc">A two-column diagram joined by an arrow labeled "because of the clues." The left column is headed "the text says" and reads "the wind died and the birds stopped singing, and everyone began rolling up the mats." The right column is headed "this means" and reads "a storm is coming." Below, a clue line reads "clues — wind died, birds stopped, rolling up mats." Labels and shapes, not color alone, carry the meaning so the graphic prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">What the Text Says and Means</text>

  <!-- Left column -->
  <rect x="24" y="70" width="200" height="220" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="24" y="70" width="200" height="50" rx="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="124" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">the text says</text>
  <text x="124" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">"the wind died and the</text>
  <text x="124" y="162" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">birds stopped singing,</text>
  <text x="124" y="182" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">and everyone began</text>
  <text x="124" y="202" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">rolling up the mats."</text>
  <text x="124" y="238" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">the exact words</text>
  <text x="124" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">on the page</text>

  <!-- Arrow -->
  <path d="M228 180 L280 180" stroke="#2b3a42" stroke-width="3" marker-end="url(#c)"/>
  <defs>
    <marker id="c" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2b3a42"/>
    </marker>
  </defs>
  <text x="256" y="166" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">because of</text>
  <text x="256" y="186" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">the clues</text>

  <!-- Right column -->
  <rect x="288" y="70" width="200" height="220" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="288" y="70" width="200" height="50" rx="12" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="388" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">this means</text>
  <text x="388" y="156" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">a storm</text>
  <text x="388" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">is coming.</text>
  <text x="388" y="238" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">the idea the</text>
  <text x="388" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">words point to</text>

  <!-- Clue line -->
  <rect x="24" y="322" width="464" height="66" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="348" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">clues — the exact words that bridge the two</text>
  <text x="256" y="372" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">wind died · birds stopped singing · rolling up the mats</text>

  <text x="256" y="432" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">The text never says "storm" — the clues point there.</text>
  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Inference is meaning built from evidence, not a guess.</text>
</svg>
