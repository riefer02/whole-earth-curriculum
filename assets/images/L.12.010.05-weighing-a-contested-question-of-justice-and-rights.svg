<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Weighing a Contested Question of Justice and Rights</title>
  <desc id="desc">A contested question at the center of four boxes: "the person seeking safety," "the receiving community," "the sending country," "international law." Each box lists the value it appeals to. Below: "weigh all four — separate evidence from values, and name where they conflict." Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42" font-weight="bold">A Contested Question of Justice and Rights</text>

  <!-- center -->
  <ellipse cx="256" cy="200" rx="120" ry="52" fill="none" stroke="#2b3a42" stroke-width="4"/>
  <text x="256" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">the right to move and</text>
  <text x="256" y="208" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">seek safety</text>
  <text x="256" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">weighed against</text>
  <text x="256" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">a state's control of borders</text>

  <!-- four boxes -->
  <rect x="24" y="70" width="160" height="80" rx="6" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <text x="104" y="96" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">person seeking safety</text>
  <text x="104" y="116" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">dignity, survival,</text>
  <text x="104" y="130" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">a future</text>

  <rect x="328" y="70" width="160" height="80" rx="6" fill="none" stroke="#e0a458" stroke-width="3"/>
  <text x="408" y="96" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">receiving community</text>
  <text x="408" y="116" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">belonging, resources,</text>
  <text x="408" y="130" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">self-rule</text>

  <rect x="24" y="300" width="160" height="80" rx="6" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="104" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">sending country</text>
  <text x="104" y="346" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">loss or relief,</text>
  <text x="104" y="360" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">duty to its own</text>

  <rect x="328" y="300" width="160" height="80" rx="6" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="408" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">international law</text>
  <text x="408" y="346" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">the right to seek</text>
  <text x="408" y="360" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">asylum</text>

  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Weigh all four — separate evidence from values,</text>
  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">and name where they conflict.</text>
</svg>
