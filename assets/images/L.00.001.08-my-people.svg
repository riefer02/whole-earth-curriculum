<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My family, my people: many kinds of care</title>
  <desc id="desc">Four panels showing different kinds of "my people." Panel 1: one grown-up and a child. Panel 2: two grown-ups and a child, one grown-up wearing a hearing aid. Panel 3: an older grown-up with glasses and a cane, and a child. Panel 4: a child standing and a child in a wheelchair. Skin tones, hair, and shirts vary across the figures. The captions and shapes, not color, carry the meaning so it prints clearly in grayscale, and the four panels show that no single household shape is "the" family.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">My Family, My People</text>

  <!-- Panel frames -->
  <rect x="16" y="84" width="232" height="180" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="264" y="84" width="232" height="180" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="16" y="278" width="232" height="180" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="264" y="278" width="232" height="180" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>

  <!-- ===== Panel 1: one grown-up and me ===== -->
  <g>
    <!-- grown-up -->
    <circle cx="118" cy="156" r="16" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M108 150 A16 16 0 0 1 128 150 Z" fill="#2b3a42"/>
    <circle cx="112" cy="154" r="2" fill="#2b3a42"/>
    <circle cx="124" cy="154" r="2" fill="#2b3a42"/>
    <path d="M112 166 Q118 170 124 166" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="106" y="174" width="24" height="44" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="112" y1="218" x2="110" y2="244" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="124" y1="218" x2="126" y2="244" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="106" y1="180" x2="96" y2="206" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <!-- child -->
    <circle cx="158" cy="190" r="11" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M151 185 A11 11 0 0 1 165 185 Z" fill="#2b3a42"/>
    <circle cx="154" cy="189" r="1.8" fill="#2b3a42"/>
    <circle cx="162" cy="189" r="1.8" fill="#2b3a42"/>
    <path d="M154 197 Q158 200 162 197" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="150" y="202" width="16" height="28" rx="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="154" y1="230" x2="152" y2="246" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="162" y1="230" x2="164" y2="246" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <!-- holding hands -->
    <line x1="96" y1="206" x2="158" y2="210" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="132" y="254" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">one grown-up and me</text>

  <!-- ===== Panel 2: two grown-ups and me ===== -->
  <g>
    <!-- grown-up left -->
    <circle cx="340" cy="156" r="15" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M330 150 A15 15 0 0 1 350 150 Z" fill="#2b3a42"/>
    <circle cx="334" cy="154" r="2" fill="#2b3a42"/>
    <circle cx="346" cy="154" r="2" fill="#2b3a42"/>
    <path d="M334 166 Q340 170 346 166" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="329" y="173" width="22" height="42" rx="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="333" y1="215" x2="331" y2="240" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="347" y1="215" x2="349" y2="240" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <!-- grown-up right (hearing aid) -->
    <circle cx="420" cy="156" r="15" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M410 150 A15 15 0 0 1 430 150 Z" fill="#2b3a42"/>
    <path d="M431 152 A8 8 0 0 1 431 164" fill="none" stroke="#e0a458" stroke-width="5" stroke-linecap="round"/>
    <circle cx="434" cy="158" r="2.6" fill="#e0a458"/>
    <circle cx="414" cy="154" r="2" fill="#2b3a42"/>
    <circle cx="426" cy="154" r="2" fill="#2b3a42"/>
    <path d="M414 166 Q420 170 426 166" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="409" y="173" width="22" height="42" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="413" y1="215" x2="411" y2="240" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="427" y1="215" x2="429" y2="240" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <!-- child -->
    <circle cx="380" cy="192" r="10" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M374 187 A10 10 0 0 1 386 187 Z" fill="#2b3a42"/>
    <circle cx="376" cy="191" r="1.8" fill="#2b3a42"/>
    <circle cx="384" cy="191" r="1.8" fill="#2b3a42"/>
    <path d="M376 199 Q380 202 384 199" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="372" y="203" width="16" height="26" rx="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="376" y1="229" x2="374" y2="244" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="384" y1="229" x2="386" y2="244" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="380" y="254" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">two grown-ups and me</text>

  <!-- ===== Panel 3: my grandparent and me ===== -->
  <g>
    <!-- grandparent (grey hair, glasses, cane) -->
    <circle cx="118" cy="156" r="15" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M108 150 A15 15 0 0 1 128 150 Z" fill="#4f6d7a"/>
    <circle cx="112" cy="154" r="3.2" fill="none" stroke="#2b3a42" stroke-width="1.8"/>
    <circle cx="124" cy="154" r="3.2" fill="none" stroke="#2b3a42" stroke-width="1.8"/>
    <line x1="115" y1="154" x2="121" y2="154" stroke="#2b3a42" stroke-width="1.8"/>
    <path d="M112 166 Q118 170 124 166" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="107" y="173" width="22" height="42" rx="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="111" y1="215" x2="109" y2="240" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="125" y1="215" x2="127" y2="240" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <!-- cane -->
    <line x1="96" y1="176" x2="92" y2="244" stroke="#4f6d7a" stroke-width="4" stroke-linecap="round"/>
    <path d="M88 244 Q92 249 96 244" fill="none" stroke="#4f6d7a" stroke-width="4" stroke-linecap="round"/>
    <!-- child -->
    <circle cx="158" cy="190" r="10" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M152 185 A10 10 0 0 1 164 185 Z" fill="#2b3a42"/>
    <circle cx="154" cy="189" r="1.8" fill="#2b3a42"/>
    <circle cx="162" cy="189" r="1.8" fill="#2b3a42"/>
    <path d="M154 197 Q158 200 162 197" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="150" y="202" width="16" height="26" rx="7" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="154" y1="228" x2="152" y2="244" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="162" y1="228" x2="164" y2="244" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="132" y="448" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">my grandparent and me</text>

  <!-- ===== Panel 4: friends and neighbors ===== -->
  <g>
    <!-- child standing -->
    <circle cx="336" cy="190" r="10" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M330 185 A10 10 0 0 1 342 185 Z" fill="#2b3a42"/>
    <circle cx="332" cy="189" r="1.8" fill="#2b3a42"/>
    <circle cx="340" cy="189" r="1.8" fill="#2b3a42"/>
    <path d="M332 197 Q336 200 340 197" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="328" y="201" width="16" height="26" rx="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="332" y1="227" x2="330" y2="244" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="340" y1="227" x2="342" y2="244" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <!-- child in wheelchair -->
    <circle cx="414" cy="176" r="11" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M407 171 A11 11 0 0 1 421 171 Z" fill="#2b3a42"/>
    <circle cx="410" cy="175" r="1.8" fill="#2b3a42"/>
    <circle cx="418" cy="175" r="1.8" fill="#2b3a42"/>
    <path d="M410 184 Q414 187 418 184" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="404" y="190" width="20" height="26" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="396" y="216" width="42" height="7" rx="3" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <line x1="410" y1="220" x2="428" y2="216" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <circle cx="406" cy="236" r="15" fill="none" stroke="#2b3a42" stroke-width="3"/>
    <circle cx="406" cy="236" r="3" fill="#2b3a42"/>
    <circle cx="432" cy="236" r="6" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
  </g>
  <text x="380" y="448" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">friends and neighbors</text>

  <!-- Bottom note -->
  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Many kinds of people care for us.</text>
</svg>
