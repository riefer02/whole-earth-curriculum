<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My class community: everyone has a part</title>
  <desc id="desc">A circle of seven children stands together around a small center. Each child is labeled with the part they bring to the class: a smile, a helping hand, a question, a song, an idea, a listening ear, and a helping hand. One child uses a wheelchair. The children have different skin tones, hair, and clothes. The circle and the word labels, not color, carry the meaning, so the picture prints clearly in grayscale and teaches that the class is a community where everyone belongs and everyone adds their own part.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Title -->
  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">My Class Community</text>

  <!-- Center circle -->
  <circle cx="256" cy="270" r="70" fill="none" stroke="#e0a458" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="256" y="266" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">together</text>
  <text x="256" y="288" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">we are a</text>
  <text x="256" y="306" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">community</text>

  <!-- ===== 7 children around the circle ===== -->

  <!-- Child 1 (top center): a smile -->
  <g>
    <circle cx="256" cy="140" r="18" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M238 138 A18 18 0 0 1 274 138 Z" fill="#2b3a42"/>
    <circle cx="249" cy="140" r="2" fill="#2b3a42"/>
    <circle cx="263" cy="140" r="2" fill="#2b3a42"/>
    <path d="M249 149 Q256 154 263 149" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="243" y="160" width="26" height="40" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="256" y="120" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">a smile</text>

  <!-- Child 2 (upper right): a question -->
  <g>
    <circle cx="366" cy="176" r="18" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M348 174 A18 18 0 0 1 384 174 Z" fill="#4f6d7a"/>
    <circle cx="359" cy="176" r="2" fill="#2b3a42"/>
    <circle cx="373" cy="176" r="2" fill="#2b3a42"/>
    <path d="M359 185 Q366 190 373 185" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="353" y="196" width="26" height="40" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="378" y="168" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">?</text>
  </g>
  <text x="396" y="180" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">a question</text>

  <!-- Child 3 (right): a helping hand -->
  <g>
    <circle cx="416" cy="268" r="18" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M398 266 A18 18 0 0 1 434 266 Z" fill="#2b3a42"/>
    <circle cx="409" cy="268" r="2" fill="#2b3a42"/>
    <circle cx="423" cy="268" r="2" fill="#2b3a42"/>
    <path d="M409 277 Q416 282 423 277" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="403" y="288" width="26" height="40" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="403" y1="296" x2="386" y2="286" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="446" y="272" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">a helping hand</text>

  <!-- Child 4 (lower right): a song -->
  <g>
    <circle cx="372" cy="364" r="18" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M354 362 A18 18 0 0 1 390 362 Z" fill="#4f6d7a"/>
    <circle cx="365" cy="364" r="2" fill="#2b3a42"/>
    <circle cx="379" cy="364" r="2" fill="#2b3a42"/>
    <path d="M365 373 Q372 378 379 373" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="359" y="384" width="26" height="40" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="382" y="356" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">&#9835;</text>
  </g>
  <text x="398" y="392" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">a song</text>

  <!-- Child 5 (bottom center): an idea -->
  <g>
    <circle cx="256" cy="404" r="18" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M238 402 A18 18 0 0 1 274 402 Z" fill="#2b3a42"/>
    <circle cx="249" cy="404" r="2" fill="#2b3a42"/>
    <circle cx="263" cy="404" r="2" fill="#2b3a42"/>
    <path d="M249 413 Q256 418 263 413" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="243" y="424" width="26" height="36" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M268 392 Q274 382 280 380 Q284 372 288 376 Q292 380 284 384 Q280 388 268 392 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">an idea</text>

  <!-- Child 6 (lower left): a listening ear -->
  <g>
    <circle cx="140" cy="364" r="18" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M122 362 A18 18 0 0 1 158 362 Z" fill="#2b3a42"/>
    <circle cx="133" cy="364" r="2" fill="#2b3a42"/>
    <circle cx="147" cy="364" r="2" fill="#2b3a42"/>
    <path d="M133 373 Q140 378 147 373" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="127" y="384" width="26" height="40" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M154 350 Q160 342 154 336 Q152 340 154 350 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="102" y="392" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">a listening ear</text>

  <!-- Child 7 (left): a helping hand, wheelchair -->
  <g>
    <circle cx="96" cy="268" r="18" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M78 266 A18 18 0 0 1 114 266 Z" fill="#2b3a42"/>
    <circle cx="89" cy="268" r="2" fill="#2b3a42"/>
    <circle cx="103" cy="268" r="2" fill="#2b3a42"/>
    <path d="M89 277 Q96 282 103 277" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="83" y="288" width="26" height="36" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="70" y="324" width="46" height="7" rx="3" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <line x1="88" y1="328" x2="106" y2="324" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <circle cx="82" cy="344" r="14" fill="none" stroke="#2b3a42" stroke-width="3"/>
    <circle cx="82" cy="344" r="3" fill="#2b3a42"/>
    <circle cx="108" cy="344" r="6" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
  </g>
  <text x="60" y="272" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">a helping hand</text>

  <!-- Bottom note -->
  <text x="256" y="490" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Everyone belongs, and everyone adds a part.</text>
</svg>
