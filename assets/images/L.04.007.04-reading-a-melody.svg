<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Reading a simple melody on a staff</title>
  <desc id="d">A five-line musical staff with five notes placed from lower to higher. Each note is labeled with its moveable-do syllable above (do, re, mi, fa, sol) and its letter name below (C, D, E, F, G). A curved arrow shows pitch rising from left to right. Labels and the rising arrangement carry the meaning, so the graphic prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#222222">Reading a Melody on a Staff</text>
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">higher on the staff = higher pitch</text>

  <!-- staff lines -->
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="80" y1="170" x2="460" y2="170"/>
    <line x1="80" y1="202" x2="460" y2="202"/>
    <line x1="80" y1="234" x2="460" y2="234"/>
    <line x1="80" y1="266" x2="460" y2="266"/>
    <line x1="80" y1="298" x2="460" y2="298"/>
  </g>

  <!-- simplified treble clef (spiral + stem) -->
  <g fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round">
    <path d="M 108 306 L 108 168"/>
    <path d="M 108 306 C 108 318 124 318 124 306 C 124 292 108 292 108 278 C 108 262 124 262 124 274"/>
  </g>
  <text x="108" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">treble clef</text>

  <!-- notes: C D E F G at y 250, 234, 218, 202, 186 -->
  <!-- C = space above middle line (space 3): middle line is line 3 at y=234; C sits just above at 218? Actually use line3=234 as B, space3=218 as C -->
  <g fill="#2b3a42">
    <ellipse cx="160" cy="218" rx="12" ry="9"/>
    <ellipse cx="220" cy="202" rx="12" ry="9"/>
    <ellipse cx="280" cy="186" rx="12" ry="9"/>
    <ellipse cx="340" cy="170" rx="12" ry="9"/>
    <ellipse cx="400" cy="154" rx="12" ry="9"/>
  </g>
  <!-- stems up for notes below middle line; these are near/above middle, so stems down -->
  <g stroke="#2b3a42" stroke-width="3">
    <line x1="172" y1="218" x2="172" y2="268"/>
    <line x1="232" y1="202" x2="232" y2="252"/>
    <line x1="292" y1="186" x2="292" y2="236"/>
    <line x1="352" y1="170" x2="352" y2="220"/>
    <line x1="412" y1="154" x2="412" y2="204"/>
  </g>

  <!-- solfege labels above -->
  <g font-family="sans-serif" font-size="15" fill="#4f6d7a" text-anchor="middle">
    <text x="160" y="138">do</text>
    <text x="220" y="138">re</text>
    <text x="280" y="138">mi</text>
    <text x="340" y="138">fa</text>
    <text x="400" y="138">sol</text>
  </g>
  <!-- letter labels below -->
  <g font-family="sans-serif" font-size="17" fill="#222222" text-anchor="middle">
    <text x="160" y="300">C</text>
    <text x="220" y="300">D</text>
    <text x="280" y="300">E</text>
    <text x="340" y="300">F</text>
    <text x="400" y="300">G</text>
  </g>

  <!-- rising arrow -->
  <path d="M 120 380 C 200 340 360 340 440 380" fill="none" stroke="#e0a458" stroke-width="4"/>
  <path d="M 428 372 L 444 380 L 428 390" fill="none" stroke="#e0a458" stroke-width="4" stroke-linejoin="round"/>
  <text x="280" y="420" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">pitch rises</text>

  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">Sing it, play it, or trace it with your hand in the air.</text>
</svg>
