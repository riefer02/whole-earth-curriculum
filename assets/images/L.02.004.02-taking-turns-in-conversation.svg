<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Taking turns in a conversation</title>
  <desc id="desc">Four children sit in a circle. The child at the top is holding a talking stick and speaking, with sound lines by their mouth, while the other three listen. A small card in the center of the circle shows the shared topic, a smiling sun over a bowl of food. Dashed arrows run around the circle to show the turn passing from one child to the next. The labels and shapes carry the meaning, so the picture prints clearly in grayscale and teaches learners to take turns in a conversation, stay on one topic, and speak clearly.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Taking Turns in a Conversation</text>

  <!-- circle of children -->
  <g>
    <!-- top child (speaking, holds stick) -->
    <circle cx="256" cy="118" r="26" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M222 180 Q220 130 256 130 Q292 130 290 180 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <!-- talking stick -->
    <line x1="214" y1="168" x2="180" y2="196" stroke="#8f5f3d" stroke-width="6" stroke-linecap="round"/>
    <path d="M286 116 Q300 110 308 116 M290 126 Q306 120 316 126" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- right child (listening) -->
    <circle cx="392" cy="210" r="26" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M358 272 Q356 222 392 222 Q428 222 426 272 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

    <!-- bottom child (listening) -->
    <circle cx="256" cy="286" r="26" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M222 348 Q220 298 256 298 Q292 298 290 348 Z" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>

    <!-- left child (listening) -->
    <circle cx="120" cy="210" r="26" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M86 272 Q84 222 120 222 Q156 222 154 272 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- dashed turn arrows -->
  <path d="M288 130 Q340 160 372 196" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/>
  <path d="M372 246 Q344 272 292 282" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/>
  <path d="M222 282 Q172 272 144 246" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/>
  <path d="M142 194 Q168 160 222 130" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/>

  <!-- shared topic card in center -->
  <rect x="200" y="196" width="112" height="76" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">our topic</text>
  <circle cx="240" cy="244" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M256 226 Q280 218 300 230" fill="none" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  <path d="M236 254 L276 254 Q284 254 284 260 L284 264 L228 264 L228 260 Q228 254 236 254 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  <text x="256" y="390" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">One person speaks, the rest listen — and the ideas stay connected.</text>
</svg>
