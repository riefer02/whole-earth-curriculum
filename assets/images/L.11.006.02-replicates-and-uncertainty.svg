<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Replicates and Uncertainty</title>
  <desc id="desc">Two target-style panels. The left panel shows arrows clustered tightly but off the bullseye, labeled precise but not accurate (systematic error). The right panel shows arrows scattered around the bullseye, labeled accurate on average but spread out (random error). A row of repeated measurements below shows the mean and the range.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Precision and Accuracy</text>

  <!-- Left target -->
  <circle cx="128" cy="150" r="78" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
  <circle cx="128" cy="150" r="52" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="128" cy="150" r="26" fill="#e0a458" fill-opacity="0.35" stroke="#2b3a42" stroke-width="2"/>
  <!-- clustered off-center -->
  <circle cx="168" cy="120" r="4" fill="#2b3a42"/>
  <circle cx="176" cy="128" r="4" fill="#2b3a42"/>
  <circle cx="164" cy="132" r="4" fill="#2b3a42"/>
  <circle cx="172" cy="116" r="4" fill="#2b3a42"/>
  <circle cx="180" cy="124" r="4" fill="#2b3a42"/>
  <text x="128" y="256" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">precise, not accurate</text>
  <text x="128" y="276" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">tight cluster, off the mark</text>
  <text x="128" y="296" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">(systematic error)</text>

  <!-- Right target -->
  <circle cx="384" cy="150" r="78" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
  <circle cx="384" cy="150" r="52" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="384" cy="150" r="26" fill="#7a9e7e" fill-opacity="0.35" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="384" cy="150" r="4" fill="#2b3a42"/>
  <circle cx="358" cy="122" r="4" fill="#2b3a42"/>
  <circle cx="412" cy="130" r="4" fill="#2b3a42"/>
  <circle cx="398" cy="178" r="4" fill="#2b3a42"/>
  <circle cx="366" cy="172" r="4" fill="#2b3a42"/>
  <circle cx="386" cy="112" r="4" fill="#2b3a42"/>
  <text x="384" y="256" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">accurate, but spread out</text>
  <text x="384" y="276" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">centered on the mark, scattered</text>
  <text x="384" y="296" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">(random error)</text>

  <!-- Repeated measurements -->
  <text x="256" y="342" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a" font-weight="bold">Five trials of the same measurement</text>
  <g font-family="sans-serif" font-size="13" fill="#222222">
    <rect x="60" y="360" width="52" height="34" fill="#6b93b6" fill-opacity="0.2" stroke="#2b3a42" stroke-width="2" rx="4"/>
    <text x="86" y="381" text-anchor="middle">51</text>
    <rect x="128" y="360" width="52" height="34" fill="#6b93b6" fill-opacity="0.2" stroke="#2b3a42" stroke-width="2" rx="4"/>
    <text x="154" y="381" text-anchor="middle">52</text>
    <rect x="196" y="360" width="52" height="34" fill="#6b93b6" fill-opacity="0.2" stroke="#2b3a42" stroke-width="2" rx="4"/>
    <text x="222" y="381" text-anchor="middle">53</text>
    <rect x="264" y="360" width="52" height="34" fill="#6b93b6" fill-opacity="0.2" stroke="#2b3a42" stroke-width="2" rx="4"/>
    <text x="290" y="381" text-anchor="middle">52</text>
    <rect x="332" y="360" width="52" height="34" fill="#6b93b6" fill-opacity="0.2" stroke="#2b3a42" stroke-width="2" rx="4"/>
    <text x="358" y="381" text-anchor="middle">52</text>
  </g>
  <rect x="396" y="360" width="56" height="34" fill="#e0a458" fill-opacity="0.3" stroke="#2b3a42" stroke-width="2" rx="4"/>
  <text x="424" y="381" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">mean 52</text>

  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">range = largest − smallest = 2</text>
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">Report it as: 52 ± 1 cm</text>
</svg>
