<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Coupled Systems: Ecosystem, Economy, Health</title>
  <desc id="desc">Three labeled circles — Ecosystem, Economy, Health — connected by arrows showing what flows between them: food, water, and materials, work and income, disease and health, with a feedback loop curving back.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">One Coupled System, Three Views</text>

  <!-- Ecosystem circle (top) -->
  <circle cx="256" cy="150" r="82" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="256" y="144" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42" font-weight="bold">Ecosystem</text>
  <text x="256" y="164" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">food, water,</text>
  <text x="256" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">clean air</text>

  <!-- Economy circle (left) -->
  <circle cx="130" cy="330" r="82" fill="none" stroke="#e0a458" stroke-width="3"/>
  <text x="130" y="324" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42" font-weight="bold">Economy</text>
  <text x="130" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">work, income,</text>
  <text x="130" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">goods</text>

  <!-- Health circle (right) -->
  <circle cx="382" cy="330" r="82" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <text x="382" y="324" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42" font-weight="bold">Health</text>
  <text x="382" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">sickness and</text>
  <text x="382" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">wellbeing</text>

  <!-- arrows -->
  <line x1="212" y1="210" x2="168" y2="268" stroke="#2b3a42" stroke-width="2"/>
  <path d="M 172 256 L 164 272 L 182 270" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <line x1="300" y1="210" x2="344" y2="268" stroke="#2b3a42" stroke-width="2"/>
  <path d="M 340 256 L 348 272 L 330 270" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <line x1="214" y1="330" x2="298" y2="330" stroke="#2b3a42" stroke-width="2"/>
  <path d="M 286 324 L 302 330 L 286 336" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <line x1="300" y1="342" x2="214" y2="342" stroke="#2b3a42" stroke-width="2"/>
  <path d="M 226 336 L 210 342 L 226 348" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42" font-weight="bold">A change in one ripples through the others.</text>
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Cut one arrow, and the loop changes everywhere.</text>
</svg>
