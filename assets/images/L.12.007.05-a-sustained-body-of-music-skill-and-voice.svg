<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A body of music: one motif, three variations, one voice</title>
  <desc id="desc">A short motif shown as a line of note shapes, then three boxes each showing a variation, all joined by a thread labeled "one voice." Labels carry the meaning, so it prints clearly in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="52" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">A Body of Music</text>

  <!-- Motif -->
  <rect x="156" y="90" width="200" height="70" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="116" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">motif</text>
  <circle cx="190" cy="140" r="6" fill="#2b3a42"/>
  <circle cx="218" cy="132" r="6" fill="#2b3a42"/>
  <circle cx="246" cy="144" r="6" fill="#2b3a42"/>
  <circle cx="274" cy="134" r="6" fill="#2b3a42"/>
  <circle cx="302" cy="142" r="6" fill="#2b3a42"/>
  <line x1="184" y1="152" x2="308" y2="152" stroke="#2b3a42" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Three variations -->
  <rect x="40" y="220" width="120" height="90" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="100" y="250" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">variation</text>
  <circle cx="70" cy="284" r="5" fill="#222222"/>
  <circle cx="95" cy="276" r="5" fill="#222222"/>
  <circle cx="120" cy="288" r="5" fill="#222222"/>

  <rect x="196" y="220" width="120" height="90" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="250" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">variation</text>
  <circle cx="226" cy="284" r="5" fill="#222222"/>
  <circle cx="251" cy="276" r="5" fill="#222222"/>
  <circle cx="276" cy="288" r="5" fill="#222222"/>

  <rect x="352" y="220" width="120" height="90" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="412" y="250" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">variation</text>
  <circle cx="382" cy="284" r="5" fill="#222222"/>
  <circle cx="407" cy="276" r="5" fill="#222222"/>
  <circle cx="432" cy="288" r="5" fill="#222222"/>

  <!-- Voice thread -->
  <path d="M256 160 L256 214" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  <path d="M256 220 C120 360 392 360 256 310" fill="none" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  <text x="256" y="392" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">one voice</text>
</svg>
