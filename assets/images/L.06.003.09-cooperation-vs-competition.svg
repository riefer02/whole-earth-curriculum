<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Cooperation versus competition</title>
  <desc id="d">Two panels. The left panel, labeled cooperation, shows several figures of varied skin tones rowing one boat together, with a caption "helps when the goal is shared." The right panel, labeled competition, shows two figures racing toward one finish line, with a caption "helps when it is fair play — harms when winning is all."</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <!-- left panel: cooperation -->
  <g>
    <rect x="24" y="40" width="220" height="300" rx="14" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
    <text x="134" y="70" font-family="sans-serif" font-size="19" fill="#222222" text-anchor="middle" font-weight="bold">cooperation</text>
    <!-- boat -->
    <path d="M60 250 L 210 250 L 190 280 L 80 280 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
    <!-- three rowers -->
    <circle cx="100" cy="220" r="14" fill="#d9a066"/>
    <circle cx="160" cy="220" r="14" fill="#a9714b"/>
    <circle cx="190" cy="220" r="14" fill="#f2c9a0"/>
    <!-- oars -->
    <line x1="100" y1="232" x2="70" y2="272" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="160" y1="232" x2="130" y2="272" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="190" y1="232" x2="160" y2="272" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <rect x="40" y="336" width="190" height="44" rx="10" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="135" y="353" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">helps when the</text>
    <text x="135" y="369" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">goal is shared</text>
  </g>
  <!-- right panel: competition -->
  <g>
    <rect x="268" y="40" width="220" height="300" rx="14" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
    <text x="378" y="70" font-family="sans-serif" font-size="19" fill="#222222" text-anchor="middle" font-weight="bold">competition</text>
    <!-- finish line -->
    <rect x="452" y="120" width="8" height="140" fill="#2b3a42"/>
    <path d="M452 124 L 350 124 L 350 132 L 452 132 Z" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <!-- two runners -->
    <circle cx="340" cy="200" r="14" fill="#f2c9a0"/>
    <rect x="327" y="214" width="26" height="34" rx="8" fill="#7a9e7e"/>
    <path d="M332 222 L 318 244" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M346 222 L 356 240" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M336 248 L 330 274" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <path d="M346 248 L 354 272" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <circle cx="384" cy="200" r="14" fill="#a9714b"/>
    <rect x="371" y="214" width="26" height="34" rx="8" fill="#6b93b6"/>
    <path d="M376 222 L 362 244" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M390 222 L 400 240" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M380 248 L 374 274" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <path d="M390 248 L 398 272" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <rect x="286" y="336" width="190" height="58" rx="10" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="381" y="353" font-family="sans-serif" font-size="11" fill="#222222" text-anchor="middle">helps when it is fair play —</text>
    <text x="381" y="369" font-family="sans-serif" font-size="11" fill="#222222" text-anchor="middle">harms when winning</text>
    <text x="381" y="385" font-family="sans-serif" font-size="11" fill="#222222" text-anchor="middle">is all</text>
  </g>
</svg>
