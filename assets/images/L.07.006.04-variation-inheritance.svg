<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Variation and inheritance</title>
  <desc id="desc">A diagram of a population of beetles with inherited variation. A parent pair (one light, one dark beetle) with an arrow down to offspring of mixed shades, labeled "offspring resemble parents — traits are inherited." Below, a row of many beetles in varied shades is labeled "variation — no two are exactly alike." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Variation &amp; Inheritance</text>

  <!-- Parent pair -->
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Parents</text>
  <!-- light beetle -->
  <g>
    <ellipse cx="150" cy="130" rx="34" ry="24" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="150" y1="130" x2="150" y2="110" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="132" cy="122" r="3" fill="#2b3a42"/>
    <circle cx="168" cy="122" r="3" fill="#2b3a42"/>
    <path d="M140 100 L134 90 M150 100 L150 88 M160 100 L166 90" stroke="#2b3a42" stroke-width="1.5" fill="none"/>
    <text x="150" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">light</text>
  </g>
  <!-- dark beetle -->
  <g>
    <ellipse cx="362" cy="130" rx="34" ry="24" fill="#6b5a4a" stroke="#2b3a42" stroke-width="2"/>
    <line x1="362" y1="130" x2="362" y2="110" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="344" cy="122" r="3" fill="#2b3a42"/>
    <circle cx="380" cy="122" r="3" fill="#2b3a42"/>
    <path d="M352 100 L346 90 M362 100 L362 88 M372 100 L378 90" stroke="#2b3a42" stroke-width="1.5" fill="none"/>
    <text x="362" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">dark</text>
  </g>

  <!-- arrow down -->
  <path d="M256 180 L256 218" fill="none" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr4)"/>
  <text x="276" y="204" font-family="sans-serif" font-size="13" fill="#4f6d7a">inherit</text>

  <defs>
    <marker id="arr4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z" fill="#2b3a42"/>
    </marker>
  </defs>

  <!-- Offspring -->
  <text x="256" y="242" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Offspring — they resemble their parents</text>
  <g>
    <ellipse cx="140" cy="292" rx="30" ry="21" fill="#e8c8a8" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="256" cy="292" rx="30" ry="21" fill="#b8956e" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="372" cy="292" rx="30" ry="21" fill="#5d4d3e" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="256" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">traits are inherited — but offspring differ from each other, too</text>

  <!-- Variation row -->
  <rect x="40" y="356" width="432" height="94" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="382" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Variation — no two are exactly alike</text>
  <g>
    <ellipse cx="80" cy="416" rx="22" ry="16" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="150" cy="416" rx="22" ry="16" fill="#e0b48a" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="220" cy="416" rx="22" ry="16" fill="#c99a6a" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="290" cy="416" rx="22" ry="16" fill="#9a7650" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="360" cy="416" rx="22" ry="16" fill="#6b5a4a" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="430" cy="416" rx="22" ry="16" fill="#4c4237" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <text x="256" y="482" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">variation is the raw material — the differences a population has to work with</text>
</svg>
