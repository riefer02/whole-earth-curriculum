<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Words carry culture</title>
  <desc id="desc">A three-row chart titled "words carry culture." Row one, "family," shows the Hindi words "चाचा" (father's younger brother) and "मामा" (mother's brother) beside the single English word "uncle." Row two, "food," shows the words "tea" and "chai" with a note that the same drink traveled by sea and by land. Row three, "respect," shows the Spanish "tú" (informal you) and "usted" (formal you). Each row is labeled. Labels and shapes, not color alone, carry the meaning so the graphic prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Words Carry Culture</text>

  <!-- Row 1: family -->
  <rect x="24" y="70" width="464" height="120" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="44" y="100" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">family</text>
  <text x="120" y="130" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#222222">चाचा</text>
  <text x="120" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">father's younger brother</text>
  <text x="256" y="130" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#222222">मामा</text>
  <text x="256" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">mother's brother</text>
  <text x="390" y="130" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222222">uncle</text>
  <text x="390" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">one word for both</text>

  <!-- Row 2: food -->
  <rect x="24" y="200" width="464" height="120" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="44" y="230" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">food</text>
  <text x="150" y="262" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222222">tea</text>
  <text x="150" y="290" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">spread by sea</text>
  <text x="330" y="262" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222222">chai</text>
  <text x="330" y="290" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">spread by land</text>
  <text x="240" y="262" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">same drink</text>

  <!-- Row 3: respect -->
  <rect x="24" y="330" width="464" height="120" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="44" y="360" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">respect</text>
  <text x="150" y="392" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222222">tú</text>
  <text x="150" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">you — familiar</text>
  <text x="330" y="392" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222222">usted</text>
  <text x="330" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">you — formal</text>
  <text x="240" y="392" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">the language requires a choice</text>

  <text x="256" y="482" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42">A language sorts the world the way its speakers value it.</text>
</svg>
