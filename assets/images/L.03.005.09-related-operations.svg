<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Related operations: a fact family and the opposite move</title>
  <desc id="desc">A fact-family house with a roof labeled three, four, and twelve, and four rooms showing three times four equals twelve, four times three equals twelve, twelve divided by four equals three, and twelve divided by three equals four. Below, a missing-number sentence twelve divided by blank equals four is solved by doing the opposite, four times three equals twelve, so the missing number is three.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Related Operations</text>

  <!-- Fact family house -->
  <polygon points="256,84 96,150 416,150" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="136" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">3, 4, 12</text>
  <rect x="96" y="150" width="320" height="150" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <line x1="256" y1="150" x2="256" y2="300" stroke="#2b3a42" stroke-width="2"/>
  <line x1="96" y1="225" x2="416" y2="225" stroke="#2b3a42" stroke-width="2"/>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#2b3a42">
    <text x="176" y="196">3 × 4 = 12</text>
    <text x="336" y="196">4 × 3 = 12</text>
    <text x="176" y="272">12 ÷ 4 = 3</text>
    <text x="336" y="272">12 ÷ 3 = 4</text>
  </g>

  <!-- Missing number -->
  <rect x="96" y="330" width="320" height="120" rx="12" fill="#ffffff" stroke="#6b93b6" stroke-width="2"/>
  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">Missing number:  12 ÷ ▢ = 4</text>
  <text x="256" y="392" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Do the opposite:  4 × 3 = 12</text>
  <text x="256" y="428" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#e0a458">so ▢ = 3</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#4f6d7a">Every operation has an opposite.</text>
</svg>
