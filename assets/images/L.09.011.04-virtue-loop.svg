<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Virtues: practice builds character over a lifetime</title>
  <desc id="desc">A four-step loop with arrows: practice a virtue, it becomes a habit, the habit builds character, and good character helps a person flourish, then returns to practice.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">The Virtues Lens</text>

  <!-- practice -->
  <rect x="40" y="96" width="170" height="90" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="64" cy="122" r="8" fill="#7a9e7e"/>
  <text x="80" y="126" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#222222">Practice</text>
  <text x="54" y="150" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">repeat a virtue —</text>
  <text x="54" y="166" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">courage, honesty, care</text>

  <!-- habit -->
  <rect x="302" y="96" width="170" height="90" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="326" cy="122" r="8" fill="#e0a458"/>
  <text x="342" y="126" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#222222">Habit</text>
  <text x="316" y="150" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">it becomes part of</text>
  <text x="316" y="166" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">who you are</text>

  <!-- character -->
  <rect x="302" y="296" width="170" height="90" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="326" cy="322" r="8" fill="#6b93b6"/>
  <text x="342" y="326" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#222222">Character</text>
  <text x="316" y="350" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">many habits form</text>
  <text x="316" y="366" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">a settled way of being</text>

  <!-- flourishing -->
  <rect x="40" y="296" width="170" height="90" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="64" cy="322" r="8" fill="#4f6d7a"/>
  <text x="80" y="326" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#222222">Flourishing</text>
  <text x="54" y="350" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">a good life, well lived,</text>
  <text x="54" y="366" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">in community</text>

  <!-- arrows clockwise -->
  <path d="M210 141 L302 141" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M294 134 L302 141 L294 148" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M387 186 L387 296" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M380 288 L387 296 L394 288" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M302 341 L210 341" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M218 334 L210 341 L218 348" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M125 296 L125 186" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M118 194 L125 186 L132 194" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">Ask: what kind of person would I become by doing this?</text>
</svg>
