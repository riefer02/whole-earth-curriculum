<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-06-005-12-polygons-coordinate-length desc-L-06-005-12-polygons-coordinate-length">
  <title id="title-L-06-005-12-polygons-coordinate-length">Polygons on the coordinate plane: length</title>
  <desc id="desc-L-06-005-12-polygons-coordinate-length">A four-quadrant coordinate plane with a rectangle whose vertices are (minus 3, 2), (1, 2), (1, minus 1), and (minus 3, minus 1). The horizontal side length is shown as 1 minus (minus 3) equals 4 units, and the vertical side length is shown as 2 minus (minus 1) equals 3 units. The side lengths are labeled along the rectangle. Labels, numbers, and position, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Polygons on the Coordinate Plane: Length</text>
  <text x="256" y="58" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">find a side's length by subtracting its two coordinates</text>

  <g>
    <line x1="280" y1="70" x2="280" y2="410" stroke="#2b3a42" stroke-width="3"/>
    <line x1="80" y1="240" x2="420" y2="240" stroke="#2b3a42" stroke-width="3"/>
    <g stroke="#d7d1c8" stroke-width="1">
      <line x1="130" y1="70" x2="130" y2="410"/><line x1="180" y1="70" x2="180" y2="410"/>
      <line x1="230" y1="70" x2="230" y2="410"/><line x1="280" y1="70" x2="280" y2="410"/>
      <line x1="330" y1="70" x2="330" y2="410"/><line x1="380" y1="70" x2="380" y2="410"/>
      <line x1="80" y1="120" x2="420" y2="120"/><line x1="80" y1="170" x2="420" y2="170"/>
      <line x1="80" y1="290" x2="420" y2="290"/><line x1="80" y1="340" x2="420" y2="340"/><line x1="80" y1="390" x2="420" y2="390"/>
    </g>
    <text x="80" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">-4</text>
    <text x="180" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">-2</text>
    <text x="280" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">0</text>
    <text x="130" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">-3</text>
    <text x="230" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">-1</text>
    <text x="330" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">1</text>
    <text x="380" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">2</text>
    <text x="266" y="145" text-anchor="end" font-family="sans-serif" font-size="12" fill="#222222">2</text>
    <text x="266" y="195" text-anchor="end" font-family="sans-serif" font-size="12" fill="#222222">1</text>
    <text x="266" y="295" text-anchor="end" font-family="sans-serif" font-size="12" fill="#222222">-1</text>
    <text x="410" y="264" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#375f7d">x</text>
    <text x="270" y="82" font-family="sans-serif" font-size="14" font-weight="bold" fill="#375f7d">y</text>

    <!-- rectangle: (-3,2),(1,2),(1,-1),(-3,-1) -->
    <!-- grid: x=-3 -> 200px? map: each unit 50px, x=0 at 200, so x=-3 at 200-150=50 -->
    <polygon points="130,140 330,140 330,290 130,290" fill="#e0a458" fill-opacity="0.35" stroke="#2b3a42" stroke-width="3"/>
    <circle cx="130" cy="140" r="6" fill="#2b3a42"/>
    <circle cx="330" cy="140" r="6" fill="#2b3a42"/>
    <circle cx="330" cy="290" r="6" fill="#2b3a42"/>
    <circle cx="130" cy="290" r="6" fill="#2b3a42"/>

    <text x="130" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">(-3, 2)</text>
    <text x="330" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">(1, 2)</text>
    <text x="338" y="308" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">(1, -1)</text>
    <text x="124" y="308" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">(-3, -1)</text>

    <!-- side labels: a paper chip keeps the axis from cutting through the words -->
    <rect x="144" y="152" width="172" height="44" rx="6" fill="#fdfbf7"/>
    <text x="230" y="170" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">horizontal: 4 units</text>
    <text x="230" y="190" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">1 - (-3) = 4</text>
    <rect x="158" y="116" width="144" height="18" rx="4" fill="#fdfbf7"/>
    <text x="230" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">count across: 1 - (-3)</text>

    <text x="118" y="176" text-anchor="end" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">vertical:</text>
    <text x="118" y="194" text-anchor="end" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">3 units</text>
    <text x="118" y="212" text-anchor="end" font-family="sans-serif" font-size="13" fill="#222222">2 - (-1) = 3</text>
    <line x1="122" y1="188" x2="130" y2="215" stroke="#4f6d7a" stroke-width="1.4"/>
  </g>

  <text x="256" y="446" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">a side that runs left-right: subtract the x-values</text>
  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">a side that runs up-down: subtract the y-values</text>
  <text x="256" y="494" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">length is always positive — distance has no direction</text>
</svg>
