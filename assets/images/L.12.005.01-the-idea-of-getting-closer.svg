<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The Idea of Getting Closer</title>
  <desc id="desc">A number line from 0 to 1 showing the partial sums 1/2, 3/4, 7/8, and 15/16 as marks stepping closer and closer to 1, never reaching it, with the label "approaches 1, never overshoots."</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">A Limit: Getting Closer and Closer</text>

  <!-- number line 0..1 -->
  <line x1="60" y1="150" x2="452" y2="150" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="60" cy="150" r="4" fill="#2b3a42"/>
  <circle cx="452" cy="150" r="4" fill="#2b3a42"/>
  <text x="60" y="176" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">0</text>
  <text x="452" y="176" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">1</text>

  <!-- partial sums as marks, approaching 1 -->
  <g stroke="#e0a458" stroke-width="3">
    <line x1="256" y1="140" x2="256" y2="160"/>
    <line x1="354" y1="140" x2="354" y2="160"/>
    <line x1="403" y1="140" x2="403" y2="160"/>
    <line x1="427" y1="140" x2="427" y2="160"/>
  </g>
  <text x="256" y="126" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">1/2</text>
  <text x="354" y="126" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">3/4</text>
  <text x="403" y="126" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">7/8</text>
  <text x="427" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">15/16</text>

  <!-- brace toward 1 -->
  <path d="M 427 168 C 427 190, 452 190, 452 168" fill="none" stroke="#6b93b6" stroke-width="2"/>
  <text x="452" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#6b93b6">approaches 1,</text>
  <text x="452" y="230" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#6b93b6">never overshoots</text>

  <!-- continuity vs jump -->
  <text x="128" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42" font-weight="bold">Continuous: no gap, no jump</text>
  <path d="M 60 360 C 100 300, 156 300, 196 360" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="128" y="386" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">a smooth cooling curve</text>

  <text x="384" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42" font-weight="bold">Not continuous: a jump</text>
  <path d="M 316 360 L 348 360 L 352 300 L 420 300" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="348" cy="360" r="4" fill="#2b3a42"/>
  <circle cx="352" cy="300" r="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="384" y="386" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">a staircase step</text>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">"As close as I like" is the whole idea.</text>
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Early limit ideas appear in Greek and Kerala (India) traditions (S-272).</text>
</svg>
