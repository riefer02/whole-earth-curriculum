    <rect x="268" y="369" width="40" height="7" rx="3" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="274" cy="394" r="13" fill="none" stroke="#2b3a42" stroke-width="3"/>
    <circle cx="274" cy="394" r="3" fill="#2b3a42"/>
    <circle cx="302" cy="396" r="5" fill="none" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <g>
    <circle cx="392" cy="334" r="12" fill="#6f4a2e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M380 334 A12 12 0 0 1 404 334 L404 326 A12 12 0 0 0 380 326 Z" fill="#8f5f3d"/>
    <rect x="383" y="346" width="22" height="28" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="388" y1="374" x2="386" y2="398" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="399" y1="374" x2="401" y2="398" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <circle cx="398" cy="336" r="5.5" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="386" cy="336" r="5.5" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <line x1="392" y1="336" x2="392" y2="336" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <!-- clapping hands -->
  <g>
    <line x1="452" y1="322" x2="452" y2="344" stroke="#c99567" stroke-width="7" stroke-linecap="round"/>
    <line x1="464" y1="318" x2="464" y2="340" stroke="#e6bb92" stroke-width="7" stroke-linecap="round"/>
    <circle cx="436" cy="300" r="3" fill="#e0a458"/>
    <circle cx="474" cy="296" r="3" fill="#6b93b6"/>
    <circle cx="446" cy="288" r="2.5" fill="#7a9e7e"/>
  </g>

  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">No winners. No ranking. Everyone belongs.</text>
  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">A shared celebration we make together.</text>
</svg>
