    <line x1="82" y1="375" x2="80" y2="402" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="94" y1="375" x2="96" y2="402" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="78" y1="350" x2="66" y2="336" stroke="#c99567" stroke-width="5" stroke-linecap="round"/>
    <line x1="98" y1="350" x2="110" y2="336" stroke="#c99567" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="180" cy="336" r="12" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M168 336 A12 12 0 0 1 192 336 L192 328 A12 12 0 0 0 168 328 Z" fill="#4f6d7a"/>
    <rect x="171" y="348" width="22" height="28" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="176" y1="376" x2="174" y2="400" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="187" y1="376" x2="189" y2="400" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- wheelchair child -->
  <g>
    <circle cx="286" cy="330" r="13" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M273 330 A13 13 0 0 1 299 330 L299 321 A13 13 0 0 0 273 321 Z" fill="#2b3a42"/>
    <rect x="276" y="343" width="24" height="26" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
