<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Observation versus judgment in critiquing art</title>
  <desc id="desc">Two columns: the left column lists observation with evidence about line, shape, color, texture, space, context, and purpose; the right column lists judgment, which must cite that evidence rather than rest on mere taste.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Observation vs. Judgment</text>

  <!-- left column: observation -->
  <rect x="28" y="72" width="216" height="360" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="28" y="72" width="216" height="44" rx="10" fill="#4a7a5c"/>
  <text x="136" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">OBSERVATION</text>
  <text x="136" y="124" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">what I actually see</text>

  <text x="44" y="156" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Elements</text>
  <text x="44" y="176" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">· line, shape, color</text>
  <text x="44" y="194" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">· texture, value, space</text>

  <text x="44" y="230" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Context</text>
  <text x="44" y="250" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">· where and when made</text>
  <text x="44" y="268" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">· what tradition, what tools</text>

  <text x="44" y="304" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Purpose</text>
  <text x="44" y="324" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">· what it seems to be for</text>

  <rect x="40" y="356" width="192" height="60" rx="8" fill="#fdfbf7" stroke="#e0a458" stroke-width="2"/>
  <text x="136" y="382" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#2b3a42">"I see a red circle,"</text>
  <text x="136" y="402" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#2b3a42">not "I like it"</text>

  <!-- right column: judgment -->
  <rect x="268" y="72" width="216" height="360" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="268" y="72" width="216" height="44" rx="10" fill="#8f5c15"/>
  <text x="376" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">JUDGMENT</text>
  <text x="376" y="124" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">what I think or feel</text>

  <text x="284" y="156" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">My view</text>
  <text x="284" y="176" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">· what it means to me</text>
  <text x="284" y="194" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">· whether it works</text>

  <text x="284" y="230" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">The rule</text>
  <text x="284" y="250" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">· judgment must cite</text>
  <text x="284" y="268" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">  evidence from the left</text>

  <rect x="280" y="356" width="192" height="60" rx="8" fill="#fdfbf7" stroke="#e0a458" stroke-width="2"/>
  <text x="376" y="378" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#2b3a42">"This feels calm because</text>
  <text x="376" y="398" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#2b3a42">the lines are curved…"</text>

  <!-- bridge arrow -->
  <path d="M244 220 L268 220" stroke="#2b3a42" stroke-width="2" marker-end="none"/>
  <path d="M264 214 L268 220 L264 226" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Evidence turns taste into critique</text>
</svg>
