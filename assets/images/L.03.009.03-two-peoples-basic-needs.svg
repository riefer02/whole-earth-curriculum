<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Two peoples meet their needs</title>
  <desc id="desc">Two panels compare how two peoples meet the same needs in different places. The left panel, "the Arctic — cold," shows a warm parka, a snow house, and a fish on a line, labeled clothing, shelter, food. The right panel, "the desert — hot and dry," shows a light loose robe, a tent, and dates with a milk bowl, labeled clothing, shelter, food. The place shapes each choice, and labels and shapes carry the meaning so it prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Two Peoples, Two Ways to Meet Needs</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">The same needs — food, shelter, clothing — answered by the place.</text>

  <!-- left: Arctic -->
  <rect x="30" y="92" width="218" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="139" y="120" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">The Arctic — cold</text>

  <text x="139" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">clothing</text>
  <path d="M118 158 q14 -14 42 -14 q28 0 42 14 l-6 44 q-18 10 -36 10 q-18 0 -36 -10 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M139 174 l0 40" stroke="#2b3a42" stroke-width="2"/>

  <text x="139" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">shelter</text>
  <path d="M96 296 q20 -34 40 0 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M104 296 q16 -26 32 0" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="139" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">snow house</text>

  <text x="139" y="344" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">food</text>
  <path d="M120 352 q0 -14 19 -14 q19 0 19 14 q0 8 -8 8 l-22 0 q-8 0 -8 -8 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M139 358 l0 -10" stroke="#2b3a42" stroke-width="2"/>
  <text x="139" y="384" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">fish</text>

  <!-- right: Desert -->
  <rect x="264" y="92" width="218" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="373" y="120" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">The desert — hot, dry</text>

  <text x="373" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">clothing</text>
  <path d="M348 158 q12 -20 50 -20 q38 0 50 20 l0 48 q-24 10 -50 10 q-26 0 -50 -10 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M373 178 l0 42" stroke="#2b3a42" stroke-width="2"/>

  <text x="373" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">shelter</text>
  <path d="M330 268 L416 268 L406 296 L340 296 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M373 268 l0 -12" stroke="#2b3a42" stroke-width="2"/>
  <text x="373" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">tent</text>

  <text x="373" y="344" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">food</text>
  <circle cx="360" cy="362" r="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="374" cy="358" r="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="386" cy="362" r="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <path d="M398 344 q10 0 10 10 q0 8 -6 8 l-14 0 q-6 0 -6 -8 q0 -10 16 -10 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="373" y="384" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">dates and milk</text>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">Both peoples meet the same needs — the place shapes how.</text>
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Neither way is better; each fits its home.</text>
</svg>
