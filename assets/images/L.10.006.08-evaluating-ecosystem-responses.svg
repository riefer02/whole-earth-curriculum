<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Evaluating Responses to Ecosystem Harm</title>
  <desc id="desc">Four labeled response cards — restoration, protected area, regulation, and biosecurity — each with a simple scoring row for effectiveness, fairness, cost, and side effects, arranged for comparison.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Four Responses to Evaluate</text>

  <!-- Header row -->
  <text x="60" y="76" font-family="sans-serif" font-size="13" fill="#4f6d7a" font-weight="bold">Response</text>
  <text x="260" y="76" font-family="sans-serif" font-size="13" fill="#4f6d7a" font-weight="bold">Aim</text>
  <text x="420" y="76" font-family="sans-serif" font-size="13" fill="#4f6d7a" font-weight="bold">Score</text>

  <g font-family="sans-serif" font-size="13">
    <!-- Restoration -->
    <text x="60" y="110" fill="#2b3a42" font-weight="bold">Restoration</text>
    <text x="260" y="110" fill="#222222">replant, clean, reintroduce</text>
    <text x="420" y="110" fill="#4f6d7a">works / slow / costly</text>
    <line x1="40" y1="122" x2="472" y2="122" stroke="#e0a458" stroke-width="1.5"/>

    <!-- Protected area -->
    <text x="60" y="150" fill="#2b3a42" font-weight="bold">Protected area</text>
    <text x="260" y="150" fill="#222222">set land aside</text>
    <text x="420" y="150" fill="#4f6d7a">saves habitat / may exclude</text>
    <line x1="40" y1="162" x2="472" y2="162" stroke="#e0a458" stroke-width="1.5"/>

    <!-- Regulation -->
    <text x="60" y="190" fill="#2b3a42" font-weight="bold">Regulation</text>
    <text x="260" y="190" fill="#222222">limits on pollution, harvest</text>
    <text x="420" y="190" fill="#4f6d7a">broad / needs enforcement</text>
    <line x1="40" y1="202" x2="472" y2="202" stroke="#e0a458" stroke-width="1.5"/>

    <!-- Biosecurity -->
    <text x="60" y="230" fill="#2b3a42" font-weight="bold">Biosecurity</text>
    <text x="260" y="230" fill="#222222">keep invaders out</text>
    <text x="420" y="230" fill="#4f6d7a">prevents / costly to run</text>
  </g>

  <!-- Rubric -->
  <text x="256" y="290" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">The four questions</text>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <text x="100" y="322">1. Is it effective?</text>
    <text x="100" y="348">2. Is it fair?</text>
    <text x="100" y="374">3. Is it affordable?</text>
    <text x="100" y="400">4. Does it cause side effects?</text>
  </g>
  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">&#8220;Works for whom?&#8221; matters as much as &#8220;does it work?&#8221;</text>

  <text x="256" y="482" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">Every response is a trade-off &#8212; and can work when chosen with local people.</text>
</svg>
