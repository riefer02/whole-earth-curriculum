<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 380" role="img" aria-labelledby="title desc">
  <title id="title">Tracing a migration: the settlement of the Pacific</title>
  <desc id="desc">A map-style diagram titled "Tracing a migration: the settlement of the Pacific." A chain of islands is connected by curved arrows that move from left to right, showing a gradual eastward voyage across water. Near the starting islands on the left, a label reads "push — islands grow full, families need more." Near the farthest islands on the right, a label reads "pull — new islands, fresh water, and food." Small double-hulled canoes with sails sit between the islands, and a star and wave marks suggest navigation. Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="380" fill="#fdfbf7"/>
  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Tracing a Migration: The Settlement of the Pacific</text>

  <!-- water -->
  <g stroke="#6b93b6" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M20 210 Q50 200 80 210 Q110 220 140 210 Q170 200 200 210 Q230 220 260 210 Q290 200 320 210 Q350 220 380 210 Q410 200 440 210 Q470 220 500 210"/>
  </g>

  <!-- islands -->
  <ellipse cx="70" cy="150" rx="34" ry="20" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="140" cy="120" rx="26" ry="16" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="220" cy="150" rx="28" ry="17" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="300" cy="118" rx="24" ry="15" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="380" cy="148" rx="26" ry="16" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="456" cy="120" rx="30" ry="18" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  <!-- migration arrows -->
  <g stroke="#e0a458" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M104 148 Q122 190 138 138"/>
    <path d="M166 118 Q194 190 218 150"/>
    <path d="M248 148 Q274 190 298 132"/>
    <path d="M324 116 Q352 190 378 148"/>
    <path d="M406 146 Q432 188 452 138"/>
  </g>

  <!-- canoes -->
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 190 Q160 182 170 190"/>
    <path d="M160 182 L160 170 L176 170 L176 182"/>
    <path d="M300 188 Q310 180 320 188"/>
    <path d="M310 180 L310 168 L326 168 L326 180"/>
  </g>

  <!-- navigation marks -->
  <g stroke="#2b3a42" stroke-width="1.5" fill="none">
    <path d="M64 60 L70 52 L76 60 L70 68 Z" fill="#2b3a42"/>
    <path d="M446 54 L452 46 L458 54 L452 62 Z" fill="#2b3a42"/>
  </g>
  <text x="70" y="88" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">stars and swells guide the way</text>

  <!-- push / pull labels -->
  <rect x="30" y="262" width="196" height="54" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="128" y="284" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4f6d7a">push</text>
  <text x="128" y="304" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">islands grow full, families need more</text>

  <rect x="288" y="262" width="196" height="54" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="386" y="284" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4f6d7a">pull</text>
  <text x="386" y="304" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">new islands, fresh water, and food</text>

  <text x="256" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">A voyage of skill, courage, and hope — over about three thousand years.</text>
</svg>
