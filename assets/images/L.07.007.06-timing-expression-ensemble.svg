<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Timing, expression, and ensemble in performance</title>
  <desc id="desc">A three-part reference for performers. "Expression" shows three simple faces: a joyful one with an upturned mouth, a worried one with tilted eyebrows, and a determined one with a straight mouth, each labeled. "Timing" shows three dots aligned on one line labeled "together" and three dots staggered one after another labeled "staggered." "Ensemble" shows a bird's-eye view of a stage with three figures placed so they face the audience and leave space for each other, labeled "everyone fits the scene together." Labels and shapes carry the meaning so it prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Three tools of a performer</text>

  <!-- Expression -->
  <rect x="20" y="66" width="472" height="126" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="94" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">Expression — face and body carry feeling</text>
  <!-- joyful -->
  <circle cx="96" cy="142" r="22" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="88" cy="136" r="2.5" fill="#2b3a42"/>
  <circle cx="104" cy="136" r="2.5" fill="#2b3a42"/>
  <path d="M86 152 Q96 162 106 152" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="96" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">joyful</text>
  <!-- worried -->
  <circle cx="256" cy="142" r="22" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="248" cy="136" r="2.5" fill="#2b3a42"/>
  <circle cx="264" cy="136" r="2.5" fill="#2b3a42"/>
  <path d="M245 131 L251 133 M267 131 L261 133" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M246 154 Q256 148 266 154" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="256" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">worried</text>
  <!-- determined -->
  <circle cx="416" cy="142" r="22" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="408" cy="136" r="2.5" fill="#2b3a42"/>
  <circle cx="424" cy="136" r="2.5" fill="#2b3a42"/>
  <path d="M404 132 L412 135 M428 132 L420 135" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M406 154 L426 154" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="416" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">determined</text>

  <!-- Timing -->
  <rect x="20" y="206" width="472" height="126" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="234" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">Timing — together or staggered</text>
  <circle cx="120" cy="280" r="7" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="180" cy="280" r="7" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="240" cy="280" r="7" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="120" y1="280" x2="240" y2="280" stroke="#4f6d7a" stroke-width="2"/>
  <text x="180" y="306" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">together = one strong moment</text>
  <circle cx="330" cy="272" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="380" cy="282" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="430" cy="290" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="380" y="306" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">staggered = one after another</text>

  <!-- Ensemble -->
  <rect x="20" y="346" width="472" height="138" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="374" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">Ensemble — everyone fits the scene together</text>
  <!-- stage from above -->
  <rect x="140" y="392" width="232" height="66" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">audience</text>
  <!-- three figures on stage -->
  <circle cx="190" cy="416" r="9" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="256" cy="408" r="9" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="322" cy="416" r="9" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <text x="120" y="400" text-anchor="end" font-family="sans-serif" font-size="12" fill="#222222">face out,</text>
  <text x="120" y="416" text-anchor="end" font-family="sans-serif" font-size="12" fill="#222222">leave space</text>
  <text x="392" y="400" text-anchor="start" font-family="sans-serif" font-size="12" fill="#222222">no one blocks</text>
  <text x="392" y="416" text-anchor="start" font-family="sans-serif" font-size="12" fill="#222222">another</text>
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">enter and exit on a shared cue; support, don't steal, the scene</text>
</svg>
