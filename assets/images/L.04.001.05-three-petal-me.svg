<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Three-petal me: interests, abilities, experiences</title>
  <desc id="desc">A flower with a round center labeled "me" and three petals. The petals are labeled "interests" with a small book and ball, "abilities" with a small star and hand, and "experiences" with a small path and sun. Labels and shapes, not color, carry the meaning.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="58" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">What Makes Me, Me</text>

  <!-- stems -->
  <line x1="256" y1="224" x2="256" y2="168" stroke="#7a9e7e" stroke-width="5" stroke-linecap="round"/>
  <line x1="224" y1="272" x2="180" y2="312" stroke="#7a9e7e" stroke-width="5" stroke-linecap="round"/>
  <line x1="288" y1="272" x2="332" y2="312" stroke="#7a9e7e" stroke-width="5" stroke-linecap="round"/>

  <!-- Petal 1: interests (top) -->
  <g>
    <circle cx="256" cy="140" r="64" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="118" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">interests</text>
    <rect x="238" y="130" width="14" height="20" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <circle cx="270" cy="144" r="9" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  </g>

  <!-- Petal 2: abilities (lower-left) -->
  <g>
    <circle cx="160" cy="330" r="64" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="160" y="308" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">abilities</text>
    <path d="M150 330 l5 12 13 1 -10 8 3 13 -11 -7 -11 7 3 -13 -10 -8 13 -1 z" fill="#e0a458" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Petal 3: experiences (lower-right) -->
  <g>
    <circle cx="352" cy="330" r="64" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="352" y="308" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">experiences</text>
    <circle cx="352" cy="336" r="9" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <path d="M344 364 Q352 356 360 364" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Center -->
  <circle cx="256" cy="272" r="56" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="280" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#222222">me</text>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2b3a42">What I love, what I can do, and what I have lived</text>
  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2b3a42">all shape me.</text>
</svg>
