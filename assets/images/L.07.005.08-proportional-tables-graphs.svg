<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Proportional relationships in tables and graphs</title>
  <desc id="desc">A proportional relationship diagram. A table lists pairs (1, 2), (2, 4), (3, 6), (4, 8), with the ratio y/x = 2 in each row. A coordinate grid plots these four points, which lie on a straight line through the origin (0,0), labeled "straight line through the origin = proportional." A second small table (1, 3), (2, 5), (3, 7) is labeled "not proportional: the ratio changes." Labels, counts, and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="28" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Proportional: Tables and Graphs</text>

  <!-- table -->
  <rect x="20" y="46" width="180" height="140" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <line x1="20" y1="80" x2="200" y2="80" stroke="#2b3a42" stroke-width="2"/>
  <line x1="110" y1="46" x2="110" y2="186" stroke="#2b3a42" stroke-width="2"/>
  <text x="65" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">x</text>
  <text x="155" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">y</text>
  <text x="65" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">1</text>
  <text x="155" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">2</text>
  <text x="65" y="132" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">2</text>
  <text x="155" y="132" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">4</text>
  <text x="65" y="158" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">3</text>
  <text x="155" y="158" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">6</text>
  <text x="65" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">4</text>
  <text x="155" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">8</text>
  <text x="110" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">y ÷ x = 2 in every row</text>

  <!-- graph -->
  <rect x="230" y="46" width="262" height="190" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <!-- axes -->
  <line x1="250" y1="220" x2="480" y2="220" stroke="#2b3a42" stroke-width="2"/>
  <line x1="250" y1="220" x2="250" y2="60" stroke="#2b3a42" stroke-width="2"/>
  <!-- grid lines every 30px -->
  <g stroke="#4f6d7a" stroke-width="1">
    <line x1="280" y1="220" x2="280" y2="60"/>
    <line x1="310" y1="220" x2="310" y2="60"/>
    <line x1="340" y1="220" x2="340" y2="60"/>
    <line x1="370" y1="220" x2="370" y2="60"/>
    <line x1="400" y1="220" x2="400" y2="60"/>
    <line x1="430" y1="220" x2="430" y2="60"/>
    <line x1="460" y1="220" x2="460" y2="60"/>
    <line x1="250" y1="190" x2="480" y2="190"/>
    <line x1="250" y1="160" x2="480" y2="160"/>
    <line x1="250" y1="130" x2="480" y2="130"/>
    <line x1="250" y1="100" x2="480" y2="100"/>
    <line x1="250" y1="70" x2="480" y2="70"/>
  </g>
  <!-- line y=2x: from (0,0)=(250,220) to (4,8)=(370,100) -->
  <line x1="250" y1="220" x2="460" y2="80" stroke="#e0a458" stroke-width="3"/>
  <!-- points (1,2)=280,160 (2,4)=310,100 (3,6)=340,70-ish; keep visible -->
  <g fill="#6b93b6" stroke="#2b3a42" stroke-width="2">
    <circle cx="280" cy="160" r="6"/>
    <circle cx="310" cy="100" r="6"/>
    <circle cx="400" cy="40" r="0"/>
  </g>
  <!-- use visible points: (1,2)->(280,160), (2,4)->(310,100), and extend line -->
  <text x="250" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">0</text>
  <text x="280" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">1</text>
  <text x="310" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">2</text>
  <text x="460" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">x</text>
  <text x="238" y="224" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">0</text>
  <text x="238" y="164" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">2</text>
  <text x="238" y="104" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">4</text>
  <text x="238" y="64" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">y</text>

  <!-- origin label -->
  <circle cx="250" cy="220" r="5" fill="#222222"/>
  <text x="216" y="216" font-family="sans-serif" font-size="12" fill="#222222">(0,0)</text>

  <!-- not proportional -->
  <rect x="20" y="250" width="472" height="120" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="256" y="274" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Not proportional — the taxi with a $2 start fee</text>
  <text x="40" y="300" font-family="sans-serif" font-size="14" fill="#222222">(1, 3)  (2, 4)  (3, 5)</text>
  <text x="40" y="324" font-family="sans-serif" font-size="14" fill="#4f6d7a">ratios differ: 3÷1, 4÷2, 5÷3 are not the same</text>
  <text x="40" y="348" font-family="sans-serif" font-size="14" fill="#4f6d7a">and the line does not pass through (0, 0) — 0 km still costs $2</text>

  <text x="256" y="408" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">proportional = same ratio in every row</text>
  <text x="256" y="432" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">= a straight line through the origin</text>
  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">the constant ratio is the unit rate — "how much for one"</text>
  <text x="256" y="490" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">both tests tell the same story; use whichever you can see</text>
</svg>
