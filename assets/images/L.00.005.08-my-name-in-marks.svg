<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My name in marks</title>
  <desc id="desc">Four equal name cards, all the same size so no writing system is ranked above another, show the same name written in four writing systems: Latin "Maya" (with four counting dots and a pointing hand touching the first mark), Cyrillic Мая, Devanagari माया, and Chinese 玛雅. "Maya" is only one example name — each learner writes their own name in their own home script. The counting dots, pointing hand, and script labels carry the meaning, so the picture prints clearly in grayscale and teaches that a name is made of marks, that those marks spell you, and that every name in every writing system is worth writing beautifully.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">My Name in Marks</text>

  <!-- Four equal name cards, one script each -->
  <rect x="28" y="96" width="216" height="150" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="172" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="bold" fill="#2b3a42">Maya</text>
  <circle cx="106" cy="210" r="4" fill="#4f6d7a"/>
  <circle cx="128" cy="210" r="4" fill="#4f6d7a"/>
  <circle cx="150" cy="210" r="4" fill="#4f6d7a"/>
  <circle cx="172" cy="210" r="4" fill="#4f6d7a"/>
  <text x="136" y="234" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">Latin</text>

  <rect x="268" y="96" width="216" height="150" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="172" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans', 'Arial Unicode MS', sans-serif" font-size="46" font-weight="bold" fill="#2b3a42">Мая</text>
  <text x="376" y="234" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">Cyrillic</text>

  <rect x="28" y="270" width="216" height="150" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="346" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans', 'Arial Unicode MS', sans-serif" font-size="46" font-weight="bold" fill="#2b3a42">माया</text>
  <text x="136" y="408" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">Devanagari</text>

  <rect x="268" y="270" width="216" height="150" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="346" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans', 'Arial Unicode MS', sans-serif" font-size="46" font-weight="bold" fill="#2b3a42">玛雅</text>
  <text x="376" y="408" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">Chinese</text>

  <!-- Pointing hand toward the first mark of the example name -->
  <circle cx="184" cy="54" r="4" fill="#2b3a42"/>
  <path d="M180 58 L112 128" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <path d="M106 124 L102 134 L114 128 Z" fill="#2b3a42"/>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Your name is made of marks, and those marks spell you.</text>
</svg>
