<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Event, thought, feeling: taking a reaction apart</title>
  <desc id="desc">Three stacked boxes connected by downward arrows: EVENT, THOUGHT, FEELING. Below them, a worked example fills each box: a friend walks past without saying hello; the thought "she is angry with me"; the feeling "hurt". A caption reads "same event, different thought, different feeling". Outline and label only, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Taking a reaction apart</text>

  <!-- EVENT box -->
  <rect x="60" y="76" width="392" height="86" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="82" y="110" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e0a458">EVENT</text>
  <text x="82" y="142" font-family="sans-serif" font-size="16" fill="#4f6d7a">what actually happened</text>

  <line x1="256" y1="162" x2="256" y2="184" stroke="#2b3a42" stroke-width="3"/>
  <path d="M250 178 L256 190 L262 178 Z" fill="#2b3a42"/>

  <!-- THOUGHT box -->
  <rect x="60" y="190" width="392" height="86" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="82" y="224" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e0a458">THOUGHT</text>
  <text x="82" y="256" font-family="sans-serif" font-size="16" fill="#4f6d7a">the story I tell myself about it</text>

  <line x1="256" y1="276" x2="256" y2="298" stroke="#2b3a42" stroke-width="3"/>
  <path d="M250 292 L256 304 L262 292 Z" fill="#2b3a42"/>

  <!-- FEELING box -->
  <rect x="60" y="304" width="392" height="86" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="82" y="338" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e0a458">FEELING</text>
  <text x="82" y="370" font-family="sans-serif" font-size="16" fill="#4f6d7a">what I feel because of that thought</text>

  <!-- Caption -->
  <rect x="60" y="412" width="392" height="72" rx="14" fill="#f2efe6" stroke="#7a9e7e" stroke-width="2"/>
  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">Same event, different thought &#8594; different feeling</text>
  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">the thought is the hinge between event and feeling</text>
</svg>
