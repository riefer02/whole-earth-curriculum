<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Belonging: who is in, who is out</title>
  <desc id="d">A large circle contains several figures of varied skin tones and one wheelchair user, all facing inward. One figure stands outside the circle, looking in. Arrows ask "why are they out?" and "what would open the circle?" A dashed opening in the circle is labeled "a way in."</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <!-- the circle -->
  <circle cx="256" cy="230" r="150" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3.5"/>
  <!-- dashed opening at bottom -->
  <path d="M256 380 A 150 150 0 0 1 330 344" fill="none" stroke="#2b3a42" stroke-width="3.5" stroke-dasharray="10 9"/>
  <!-- inside figures -->
  <g>
    <circle cx="180" cy="150" r="16" fill="#d9a066"/>
    <rect x="165" y="166" width="30" height="40" rx="9" fill="#7a9e7e"/>
    <circle cx="300" cy="130" r="16" fill="#f2c9a0"/>
    <rect x="285" y="146" width="30" height="40" rx="9" fill="#e0a458"/>
    <circle cx="340" cy="220" r="16" fill="#a9714b"/>
    <rect x="325" y="236" width="30" height="40" rx="9" fill="#6b93b6"/>
    <!-- wheelchair user inside -->
    <circle cx="180" cy="280" r="15" fill="#8d5a3b"/>
    <rect x="166" y="295" width="28" height="34" rx="8" fill="#7a9e7e"/>
    <circle cx="150" cy="320" r="13" fill="none" stroke="#2b3a42" stroke-width="3.5"/>
    <circle cx="210" cy="320" r="13" fill="none" stroke="#2b3a42" stroke-width="3.5"/>
    <line x1="166" y1="312" x2="150" y2="320" stroke="#2b3a42" stroke-width="3"/>
    <line x1="194" y1="312" x2="210" y2="320" stroke="#2b3a42" stroke-width="3"/>
    <line x1="180" y1="312" x2="180" y2="320" stroke="#2b3a42" stroke-width="3"/>
  </g>
  <!-- outside figure looking in -->
  <g>
    <circle cx="256" cy="440" r="16" fill="#f2c9a0"/>
    <rect x="241" y="456" width="30" height="40" rx="9" fill="#e0a458"/>
    <path d="M244 466 L 228 486" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M252 496 L 248 516" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <path d="M264 496 L 268 516" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- arrows and questions -->
  <g font-family="sans-serif" text-anchor="middle">
    <path d="M318 410 C 350 430, 340 450, 300 452" fill="none" stroke="#4f6d7a" stroke-width="3"/>
    <text x="392" y="420" font-size="15" fill="#222222">why are they out?</text>
    <path d="M120 356 C 80 380, 80 400, 120 420" fill="none" stroke="#7a9e7e" stroke-width="3"/>
    <text x="70" y="470" font-size="14" fill="#222222" transform="rotate(0)">what would</text>
    <text x="70" y="488" font-size="14" fill="#222222">open the circle?</text>
  </g>
  <!-- "a way in" label -->
  <text x="316" y="372" font-family="sans-serif" font-size="14" fill="#222222">a way in</text>
</svg>
