<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Stewardship: caring for land and water together</title>
  <desc id="desc">A scene of a community caring for land together: small cool fires, terraced hillsides, and people of different ages planting and tending, with labels for cultural burning, terracing, and guardianship across generations.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">Caring for Land and Water</text>

  <!-- terraced hillside -->
  <path d="M40 200 L160 130 L300 130 L472 220 L472 360 L40 360 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M160 130 L180 190 L300 190 L300 130" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M180 190 L200 250 L300 250 L300 190" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M200 250 L220 310 L300 310 L300 250" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <!-- crops on terraces -->
  <g fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.2">
    <path d="M180 178 q3 -8 0 -16 M190 178 q3 -8 0 -16 M200 178 q3 -8 0 -16"/>
    <path d="M200 238 q3 -8 0 -16 M210 238 q3 -8 0 -16 M220 238 q3 -8 0 -16"/>
    <path d="M220 298 q3 -8 0 -16 M230 298 q3 -8 0 -16 M240 298 q3 -8 0 -16"/>
  </g>
  <text x="150" y="118" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#2b3a42">terracing</text>

  <!-- river -->
  <path d="M300 250 q40 40 80 40 q40 0 80 -20 l12 40 q-40 20 -92 20 q-44 0 -92 -40 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="428" y="292" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#2b3a42">water care</text>

  <!-- cool fire -->
  <g>
    <path d="M90 400 q8 -12 0 -24 q-8 -12 0 -24" fill="none" stroke="#e0a458" stroke-width="4"/>
    <line x1="86" y1="404" x2="94" y2="404" stroke="#e0a458" stroke-width="3"/>
  </g>
  <text x="90" y="434" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#2b3a42">cultural burning</text>

  <!-- people of different ages -->
  <g text-anchor="middle" font-family="sans-serif">
    <circle cx="250" cy="416" r="12" fill="#c98d5f" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="238" y="430" width="24" height="30" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="300" cy="424" r="10" fill="#8a5a3b" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="290" y="436" width="20" height="24" rx="5" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="348" cy="412" r="11" fill="#d9a066" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="337" y="425" width="22" height="26" rx="5" fill="#c9b6a4" stroke="#2b3a42" stroke-width="1.5"/>
  </g>

  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Guardianship across generations</text>
  <text x="256" y="498" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">deep local knowledge · care passed down · land as a relative</text>
</svg>
