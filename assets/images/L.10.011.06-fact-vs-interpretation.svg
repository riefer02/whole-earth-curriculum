<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t6 d6">
  <title id="t6">Fact and interpretation</title>
  <desc id="d6">A claim sentence at the top splits into two labeled columns: fact, which is checkable, and interpretation, a meaning given to facts.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <rect x="76" y="40" width="360" height="60" rx="10" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">One claim, two parts:</text>
  <text x="256" y="86" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">"The rains ruined our crops"</text>
  <path d="M256 100 v30" stroke="#2b3a42" stroke-width="3"/>
  <path d="M256 130 L120 190 M256 130 L392 190" stroke="#2b3a42" stroke-width="3" fill="none"/>
  <rect x="40" y="190" width="180" height="240" rx="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="292" y="190" width="180" height="240" rx="12" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="130" y="222" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">fact</text>
  <text x="130" y="248" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">checkable</text>
  <text x="130" y="286" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">It rained</text>
  <text x="130" y="306" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">three days</text>
  <text x="130" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">confirmed or</text>
  <text x="130" y="364" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">corrected by</text>
  <text x="130" y="384" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">evidence</text>
  <text x="382" y="222" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">interpretation</text>
  <text x="382" y="248" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">a meaning given</text>
  <text x="382" y="286" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">"ruined" —</text>
  <text x="382" y="306" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">the judgment</text>
  <text x="382" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">a conclusion</text>
  <text x="382" y="364" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">placed on the</text>
  <text x="382" y="384" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">fact</text>
  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">Separate them before you decide</text>
</svg>
