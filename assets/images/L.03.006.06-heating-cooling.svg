<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" font-family="sans-serif">
  <title>Heating and cooling change states</title>
  <desc>A circle of water in three states: ice labeled solid, water labeled liquid, and steam labeled gas. Heating arrows labeled melt and evaporate go around one way, cooling arrows labeled freeze and condense go back the other way.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-size="26" fill="#222222" font-weight="bold">Heating and cooling change states</text>

  <!-- three nodes around a circle -->
  <!-- solid (top left) -->
  <rect x="70" y="90" width="130" height="96" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="135" y="122" text-anchor="middle" font-size="19" fill="#2b3a42" font-weight="bold">Solid</text>
  <path d="M110 160 Q110 144 135 144 Q160 144 160 160 Q160 172 135 172 Q110 172 110 160 Z" fill="#6b93b6" opacity="0.85"/>
  <text x="135" y="182" text-anchor="middle" font-size="14" fill="#4f6d7a">ice</text>

  <!-- liquid (bottom) -->
  <rect x="210" y="330" width="130" height="96" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="275" y="362" text-anchor="middle" font-size="19" fill="#2b3a42" font-weight="bold">Liquid</text>
  <path d="M245 384 Q245 372 275 372 Q305 372 305 384 L305 402 Q275 410 245 402 Z" fill="#6b93b6"/>
  <text x="275" y="422" text-anchor="middle" font-size="14" fill="#4f6d7a">water</text>

  <!-- gas (top right) -->
  <rect x="312" y="90" width="130" height="96" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="377" y="122" text-anchor="middle" font-size="19" fill="#2b3a42" font-weight="bold">Gas</text>
  <path d="M340 176 Q330 158 350 150 Q372 142 390 152 Q406 162 388 174" fill="none" stroke="#e0a458" stroke-width="5" stroke-linecap="round"/>
  <circle cx="356" cy="162" r="4" fill="#e0a458"/><circle cx="378" cy="156" r="4" fill="#e0a458"/>
  <text x="377" y="182" text-anchor="middle" font-size="14" fill="#4f6d7a">steam</text>

  <!-- heating arrows (clockwise: melt solid->liquid, evaporate liquid->gas) -->
  <!-- melt: solid -> liquid -->
  <path d="M150 180 Q150 300 210 330" stroke="#e0a458" stroke-width="5" fill="none" marker-end="url(#arrowWarm)"/>
  <rect x="120" y="250" width="66" height="26" rx="6" fill="#e0a458" opacity="0.3"/>
  <text x="153" y="268" text-anchor="middle" font-size="15" fill="#2b3a42">melt</text>

  <!-- evaporate: liquid -> gas -->
  <path d="M340 330 Q380 300 384 186" stroke="#e0a458" stroke-width="5" fill="none" marker-end="url(#arrowWarm)"/>
  <rect x="352" y="248" width="86" height="26" rx="6" fill="#e0a458" opacity="0.3"/>
  <text x="395" y="266" text-anchor="middle" font-size="15" fill="#2b3a42">evaporate</text>

  <!-- cooling arrows (counterclockwise: freeze liquid->solid, condense gas->liquid) -->
  <!-- freeze: liquid -> solid -->
  <path d="M200 360 Q170 300 170 190" stroke="#6b93b6" stroke-width="5" fill="none" marker-end="url(#arrowCool)"/>
  <rect x="120" y="282" width="66" height="26" rx="6" fill="#6b93b6" opacity="0.3"/>
  <text x="153" y="300" text-anchor="middle" font-size="15" fill="#2b3a42">freeze</text>

  <!-- condense: gas -> liquid -->
  <path d="M366 190 Q340 300 300 330" stroke="#6b93b6" stroke-width="5" fill="none" marker-end="url(#arrowCool)"/>
  <rect x="352" y="282" width="86" height="26" rx="6" fill="#6b93b6" opacity="0.3"/>
  <text x="395" y="300" text-anchor="middle" font-size="15" fill="#2b3a42">condense</text>

  <!-- arrowheads -->
  <defs>
    <marker id="arrowWarm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e0a458"/>
    </marker>
    <marker id="arrowCool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b93b6"/>
    </marker>
  </defs>

  <!-- bottom note -->
  <rect x="80" y="452" width="352" height="48" rx="12" fill="#7a9e7e" opacity="0.18" stroke="#7a9e7e" stroke-width="2"/>
  <text x="256" y="482" text-anchor="middle" font-size="16" fill="#222222">Heat moves it one way — cold moves it back.</text>
</svg>
