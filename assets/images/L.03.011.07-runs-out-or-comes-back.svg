<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Resources that run out and resources that come back</title>
  <desc id="d">Two columns sort natural resources. The left column, labeled runs out, shows coal, oil, and metal — resources made over millions of years that can be used up. The right column, labeled comes back, shows the sun, wind, rain, and a tree that regrows — resources that keep returning. A note says a resource that runs out can be used up; one that comes back keeps returning. Word labels carry the meaning so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#222222">Resources: runs out or comes back?</text>

  <!-- Runs out column -->
  <rect x="16" y="54" width="228" height="330" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <rect x="16" y="54" width="228" height="40" rx="12" fill="#e0a458"/>
  <text x="130" y="80" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">RUNS OUT</text>

  <!-- coal -->
  <ellipse cx="70" cy="130" rx="22" ry="16" fill="#2b3a42" stroke="#2b3a42" stroke-width="3"/>
  <text x="70" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fdfbf7">coal</text>
  <!-- oil drop -->
  <path d="M130 112 q0 -18 10 -18 q10 0 10 18 q-4 10 -10 16 q-6 -6 -10 -16 Z" fill="#4f6d7a" stroke="#2b3a42" stroke-width="3"/>
  <text x="140" y="146" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">oil</text>
  <!-- metal -->
  <rect x="184" y="116" width="30" height="24" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="3"/>
  <text x="199" y="146" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">metal</text>

  <text x="130" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Made over millions of years.</text>
  <text x="130" y="220" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Once we use them up,</text>
  <text x="130" y="244" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">they are gone for a very</text>
  <text x="130" y="268" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">long time.</text>

  <text x="130" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">These need careful use.</text>

  <!-- Comes back column -->
  <rect x="268" y="54" width="228" height="330" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <rect x="268" y="54" width="228" height="40" rx="12" fill="#7a9e7e"/>
  <text x="382" y="80" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">COMES BACK</text>

  <!-- sun -->
  <circle cx="320" cy="132" r="18" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <line x1="320" y1="102" x2="320" y2="92" stroke="#2b3a42" stroke-width="3"/>
  <line x1="320" y1="162" x2="320" y2="172" stroke="#2b3a42" stroke-width="3"/>
  <line x1="290" y1="132" x2="280" y2="132" stroke="#2b3a42" stroke-width="3"/>
  <line x1="350" y1="132" x2="360" y2="132" stroke="#2b3a42" stroke-width="3"/>
  <text x="320" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">sunlight</text>
  <!-- wind -->
  <path d="M360 128 q10 -8 20 0 q10 -8 20 0 q10 -8 20 0" fill="none" stroke="#4f6d7a" stroke-width="4"/>
  <text x="430" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">wind</text>
  <!-- rain -->
  <path d="M372 168 q-6 -10 -16 -10 q-14 0 -14 12 q0 10 12 12" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <line x1="362" y1="192" x2="358" y2="202" stroke="#6b93b6" stroke-width="3"/>
  <line x1="376" y1="192" x2="372" y2="202" stroke="#6b93b6" stroke-width="3"/>
  <text x="430" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">rain (water)</text>
  <!-- tree -->
  <line x1="430" y1="226" x2="430" y2="206" stroke="#2b3a42" stroke-width="4"/>
  <circle cx="430" cy="198" r="14" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
  <text x="382" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">a tree that regrows</text>

  <text x="382" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">These keep returning.</text>

  <rect x="16" y="400" width="480" height="96" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A resource that runs out can be used up.</text>
  <text x="256" y="458" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A resource that comes back keeps returning.</text>
  <text x="256" y="482" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Knowing the difference is the first step of caring for our home.</text>
</svg>
