<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Starting with Care: The Care Compass</title>
  <desc id="desc">A four-direction compass with the words Dignity, Accuracy, Consent, and Care at each point, surrounded by diverse figures sitting in a circle.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">The Care Compass</text>

  <!-- compass circle -->
  <circle cx="256" cy="238" r="120" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="256" cy="238" r="14" fill="#2b3a42"/>
  <line x1="256" y1="124" x2="256" y2="352" stroke="#4f6d7a" stroke-width="2"/>
  <line x1="142" y1="238" x2="370" y2="238" stroke="#4f6d7a" stroke-width="2"/>

  <!-- N: Dignity -->
  <polygon points="256,132 246,158 266,158" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="256" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">Dignity</text>

  <!-- E: Accuracy -->
  <polygon points="364,238 338,228 338,248" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="378" y="242" text-anchor="start" font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">Accuracy</text>

  <!-- S: Consent -->
  <polygon points="256,344 246,318 266,318" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="256" y="372" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">Consent</text>

  <!-- W: Care -->
  <polygon points="148,238 174,228 174,248" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="132" y="242" text-anchor="end" font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">Care</text>

  <!-- diverse figures in a circle -->
  <g stroke="#2b3a42" stroke-width="1.5">
    <!-- figure 1 -->
    <circle cx="120" cy="420" r="14" fill="#d9a066"/>
    <rect x="112" y="438" width="16" height="24" rx="6" fill="#4f6d7a"/>
    <!-- figure 2 -->
    <circle cx="196" cy="432" r="13" fill="#8d5a3b"/>
    <rect x="188" y="449" width="16" height="22" rx="6" fill="#7a9e7e"/>
    <!-- figure 3 (wheelchair user) -->
    <circle cx="272" cy="432" r="13" fill="#f0c8a0"/>
    <rect x="264" y="449" width="16" height="22" rx="6" fill="#6b93b6"/>
    <circle cx="268" cy="478" r="8" fill="none"/>
    <circle cx="284" cy="478" r="8" fill="none"/>
    <!-- figure 4 -->
    <circle cx="348" cy="428" r="14" fill="#b57a4a"/>
    <rect x="340" y="446" width="16" height="22" rx="6" fill="#e0a458"/>
    <!-- figure 5 -->
    <circle cx="416" cy="414" r="13" fill="#6b4a2f"/>
    <rect x="408" y="431" width="16" height="24" rx="6" fill="#4f6d7a"/>
  </g>

  <text x="256" y="502" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Every body, every pace, every family&#8217;s way &#8212; honored.</text>
</svg>
