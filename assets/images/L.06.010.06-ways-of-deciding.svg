<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Three ways of deciding: democracy, autocracy, consensus</title>
  <desc id="desc">Three side-by-side panels comparing ways of deciding. Left panel "democracy": several raised hands and a vote tally, with "strength: many voices heard" and "limit: majority can overlook a minority." Middle panel "autocracy": a single figure at a desk, with "strength: fast, clear decision" and "limit: one voice, others may not be heard." Right panel "consensus": a talking circle of diverse figures, with "strength: everyone agrees" and "limit: can take a long time." Labels, shapes, and counts carry the meaning, so it prints clearly in grayscale independent of color.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">Three Ways of Deciding</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">each has strengths &#8212; and limits</text>

  <!-- Democracy -->
  <rect x="16" y="84" width="152" height="396" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="92" y="114" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">democracy</text>
  <text x="92" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">the many decide</text>
  <!-- raised hands -->
  <g stroke="#2b3a42" stroke-width="2" fill="#8a5a3b">
    <rect x="40" y="160" width="10" height="34" rx="4"/>
    <rect x="40" y="150" width="26" height="12" rx="5" fill="#c98a5b"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="#8a5a3b">
    <rect x="74" y="164" width="10" height="30" rx="4"/>
    <rect x="74" y="154" width="26" height="12" rx="5" fill="#d9a05b"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="#8a5a3b">
    <rect x="108" y="158" width="10" height="36" rx="4"/>
    <rect x="108" y="148" width="26" height="12" rx="5" fill="#8a5a3b"/>
  </g>
  <rect x="36" y="216" width="112" height="34" rx="8" fill="#eef3f6" stroke="#4f6d7a" stroke-width="1.5"/>
  <text x="92" y="238" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">vote tally: 3 &#8211; 1</text>
  <rect x="28" y="268" width="128" height="88" rx="8" fill="#ffffff" stroke="#7a9e7e" stroke-width="1.5"/>
  <text x="92" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">strength:</text>
  <text x="92" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">many voices</text>
  <text x="92" y="324" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">heard</text>
  <rect x="28" y="368" width="128" height="88" rx="8" fill="#ffffff" stroke="#e0a458" stroke-width="1.5"/>
  <text x="92" y="390" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">limit:</text>
  <text x="92" y="408" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">majority can</text>
  <text x="92" y="424" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">overlook a minority</text>

  <!-- Autocracy -->
  <rect x="180" y="84" width="152" height="396" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="114" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">autocracy</text>
  <text x="256" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">one person decides</text>
  <!-- single figure at desk -->
  <circle cx="256" cy="176" r="15" fill="#c98a5b" stroke="#2b3a42" stroke-width="2"/>
  <rect x="240" y="191" width="32" height="32" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <rect x="220" y="223" width="72" height="10" rx="4" fill="#2b3a42"/>
  <text x="256" y="252" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">&#8220;we decide now&#8221;</text>
  <rect x="208" y="268" width="96" height="88" rx="8" fill="#ffffff" stroke="#7a9e7e" stroke-width="1.5"/>
  <text x="256" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">strength:</text>
  <text x="256" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">fast, clear</text>
  <text x="256" y="324" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">decision</text>
  <rect x="208" y="368" width="96" height="88" rx="8" fill="#ffffff" stroke="#e0a458" stroke-width="1.5"/>
  <text x="256" y="390" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">limit:</text>
  <text x="256" y="408" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">one voice; others</text>
  <text x="256" y="424" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">may not be heard</text>

  <!-- Consensus -->
  <rect x="344" y="84" width="152" height="396" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="420" y="114" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">consensus</text>
  <text x="420" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">talk until all agree</text>
  <!-- talking circle -->
  <g>
    <circle cx="382" cy="196" r="12" fill="#8a5a3b" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="420" cy="182" r="12" fill="#d9a05b" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="458" cy="196" r="12" fill="#c98a5b" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="442" cy="222" r="12" fill="#8a5a3b" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="398" cy="224" r="12" fill="#c98a5b" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="420" cy="208" r="20" fill="none" stroke="#4f6d7a" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>
  <text x="420" y="268" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">&#8220;we agree&#8221;</text>
  <rect x="356" y="284" width="128" height="88" rx="8" fill="#ffffff" stroke="#7a9e7e" stroke-width="1.5"/>
  <text x="420" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">strength:</text>
  <text x="420" y="324" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">everyone</text>
  <text x="420" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">agrees</text>
  <rect x="356" y="384" width="128" height="80" rx="8" fill="#ffffff" stroke="#e0a458" stroke-width="1.5"/>
  <text x="420" y="406" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">limit:</text>
  <text x="420" y="424" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">can take a</text>
  <text x="420" y="440" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">long time</text>

  <text x="256" y="500" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">No single way is best everywhere &#8212; each fits some situations and strains in others.</text>
</svg>
