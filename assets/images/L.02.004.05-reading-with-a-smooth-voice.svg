<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Reading with a smooth voice</title>
  <desc id="desc">A child reads aloud from a book, with a pointer sliding along the line and soft sound waves rising from the page. Beside the child, a simple fluency chart shows three rows, each marked with a rising path of small footprints, to show three re-readings becoming smoother each time. The labels and shapes carry the meaning, so the picture prints clearly in grayscale and teaches learners that re-reading a familiar text builds a smooth, expressive reading voice.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Reading with a Smooth Voice</text>

  <!-- child reading -->
  <circle cx="180" cy="150" r="28" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M144 228 Q140 178 180 178 Q220 178 216 228 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>

  <!-- open book -->
  <path d="M96 268 Q138 250 180 268 L180 296 Q138 278 96 296 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M264 268 Q222 250 180 268 L180 296 Q222 278 264 296 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <!-- pointer sliding under a line -->
  <line x1="104" y1="282" x2="256" y2="282" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <line x1="188" y1="282" x2="188" y2="304" stroke="#e0a458" stroke-width="4" stroke-linecap="round"/>

  <!-- sound waves rising -->
  <path d="M206 160 Q214 148 206 138 M216 160 Q226 144 216 130" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- fluency chart -->
  <rect x="316" y="120" width="168" height="176" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="400" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">my re-readings</text>
  <line x1="332" y1="160" x2="468" y2="160" stroke="#4f6d7a" stroke-width="1.5"/>

  <!-- row 1 -->
  <text x="336" y="182" font-family="sans-serif" font-size="12" fill="#4f6d7a">1</text>
  <path d="M356 176 Q372 168 392 172" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <!-- row 2 -->
  <text x="336" y="214" font-family="sans-serif" font-size="12" fill="#4f6d7a">2</text>
  <path d="M356 208 Q378 198 404 202" fill="none" stroke="#6b93b6" stroke-width="3" stroke-linecap="round"/>
  <!-- row 3 -->
  <text x="336" y="246" font-family="sans-serif" font-size="12" fill="#4f6d7a">3</text>
  <path d="M356 240 Q384 226 420 232" fill="none" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>

  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Each re-reading is smoother — like walking a path you know.</text>
</svg>
