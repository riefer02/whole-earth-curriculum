<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t-l0500108 d-l0500108">
  <title id="t-l0500108">One result does not fit</title>
  <desc id="d-l0500108">A number line of results from 0 to 40 millilitres holds five dots clustered between 18 and 22 and one dot far out at 38, circled and joined by a leader line to the label "one result does not fit." Below, three numbered steps read measure again, check the method, and check the idea.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">One Result Does Not Fit</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">check it before you change your mind</text>

  <!-- leader -->
  <line x1="422" y1="272" x2="364" y2="190" stroke="#4f6d7a" stroke-width="2"/>

  <!-- axis -->
  <line x1="60" y1="286" x2="452" y2="286" stroke="#2b3a42" stroke-width="2"/>
  <line x1="60" y1="280" x2="60" y2="292" stroke="#2b3a42" stroke-width="2"/>
  <line x1="158" y1="280" x2="158" y2="292" stroke="#2b3a42" stroke-width="2"/>
  <line x1="256" y1="280" x2="256" y2="292" stroke="#2b3a42" stroke-width="2"/>
  <line x1="354" y1="280" x2="354" y2="292" stroke="#2b3a42" stroke-width="2"/>
  <line x1="452" y1="280" x2="452" y2="292" stroke="#2b3a42" stroke-width="2"/>
  <text x="60" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">0</text>
  <text x="158" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">10</text>
  <text x="256" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">20</text>
  <text x="354" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">30</text>
  <text x="452" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">40</text>

  <!-- dots -->
  <circle cx="236" cy="286" r="6" fill="#2b3a42"/>
  <circle cx="246" cy="286" r="6" fill="#2b3a42"/>
  <circle cx="256" cy="286" r="6" fill="#2b3a42"/>
  <circle cx="266" cy="286" r="6" fill="#2b3a42"/>
  <circle cx="276" cy="286" r="6" fill="#2b3a42"/>
  <circle cx="432" cy="286" r="6" fill="#2b3a42"/>
  <circle cx="432" cy="286" r="17" fill="none" stroke="#e0a458" stroke-width="3"/>

  <text x="364" y="180" font-family="sans-serif" font-size="12" fill="#222222">one result does not fit</text>
  <text x="256" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">five results agree</text>
  <line x1="256" y1="258" x2="256" y2="274" stroke="#4f6d7a" stroke-width="2"/>
  <text x="256" y="334" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">water absorbed (mL)</text>

  <!-- three checks -->
  <rect x="40" y="354" width="136" height="60" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="108" y="382" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">1 measure again</text>

  <rect x="188" y="354" width="136" height="60" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="382" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">2 check the method</text>

  <rect x="336" y="354" width="136" height="60" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="404" y="382" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">3 check the idea</text>

  <text x="256" y="446" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Keep the odd number in the record until you know why.</text>
</svg>
