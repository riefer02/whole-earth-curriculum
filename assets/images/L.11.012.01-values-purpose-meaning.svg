<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Values, purpose, and meaning as three arms of one compass</title>
  <desc id="d">A compass rose with three labeled arms — values, purpose, and meaning — meeting at a center where a small figure stands. Each arm points to a different horizon. Labels carry the meaning so the image prints clearly in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <!-- outer compass ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#4f6d7a" stroke-width="1.5"/>
  <!-- three arms -->
  <!-- values: pointing upper-left -->
  <line x1="256" y1="256" x2="118" y2="118" stroke="#e0a458" stroke-width="5" stroke-linecap="round"/>
  <polygon points="118,118 96,132 138,146" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <!-- purpose: pointing upper-right -->
  <line x1="256" y1="256" x2="394" y2="118" stroke="#6b93b6" stroke-width="5" stroke-linecap="round"/>
  <polygon points="394,118 374,96 402,132" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
  <!-- meaning: pointing downward -->
  <line x1="256" y1="256" x2="256" y2="406" stroke="#7a9e7e" stroke-width="5" stroke-linecap="round"/>
  <polygon points="256,406 234,384 278,384" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
  <!-- center figure -->
  <circle cx="256" cy="256" r="26" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="256" cy="248" r="9" fill="#4f6d7a"/>
  <path d="M244 268 q12 -14 24 0 q-12 12 -24 0" fill="#4f6d7a" stroke="#2b3a42" stroke-width="1.5"/>
  <!-- labels with leader lines and shapes (not color-only) -->
  <rect x="40" y="60" width="96" height="34" rx="6" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="88" y="82" text-anchor="middle" font-size="18" fill="#222222" font-weight="600">values</text>
  <line x1="118" y1="128" x2="100" y2="92" stroke="#2b3a42" stroke-width="1.5"/>

  <rect x="372" y="60" width="102" height="34" rx="6" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="423" y="82" text-anchor="middle" font-size="18" fill="#222222" font-weight="600">purpose</text>
  <line x1="398" y1="128" x2="420" y2="92" stroke="#2b3a42" stroke-width="1.5"/>

  <rect x="196" y="420" width="120" height="34" rx="6" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="442" text-anchor="middle" font-size="18" fill="#222222" font-weight="600">meaning</text>
  <line x1="256" y1="398" x2="256" y2="420" stroke="#2b3a42" stroke-width="1.5"/>
  <!-- 'you' label near center -->
  <text x="256" y="308" text-anchor="middle" font-size="15" fill="#222222">you</text>
</svg>
