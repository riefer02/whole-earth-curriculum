<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">A true-info care card with its source</title>
  <desc id="d">A care card template. At the top it says MY CARE CARD. The middle holds one true fact: "Turn off the tap when you are done, to save water." Below it are two lines to fill in: "Where I learned this" and a check next to "true information, not selling". A small heart and a drop of water decorate it. Word labels carry the meaning so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">My care card</text>

  <!-- Card -->
  <rect x="56" y="56" width="400" height="400" rx="16" fill="#fdfbf7" stroke="#2b3a42" stroke-width="5"/>
  <!-- heart -->
  <path d="M90 100 a16 16 0 0 1 28 0 a16 16 0 0 1 28 0 q0 16 -28 32 q-28 -16 -28 -32 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <!-- water drop -->
  <path d="M430 90 q18 24 0 40 q-18 -16 0 -40 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="3"/>

  <text x="256" y="160" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">One true fact</text>
  <text x="256" y="196" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">"Turn off the tap when you are</text>
  <text x="256" y="220" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">done, to save water."</text>

  <line x1="96" y1="256" x2="416" y2="256" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="248" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">Where I learned this: ____________</text>

  <rect x="96" y="284" width="26" height="26" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="4"/>
  <text x="109" y="304" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">✓</text>
  <text x="136" y="304" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start">true information, not selling</text>

  <text x="256" y="356" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Who is it for?</text>
  <line x1="96" y1="376" x2="416" y2="376" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">(my family, my class, my neighbors)</text>

  <text x="256" y="484" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">A true fact, told to help — with its source, and no selling.</text>
</svg>
