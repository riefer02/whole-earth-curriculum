<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Listening and retelling in sequence</title>
  <desc id="desc">Three square frames in a row show a three-step happening in order: first a trowel digs a hole, next a seed is placed in the hole, last a watering can pours water with drops falling on the seed. The words first, next, and last label each frame, and a small listening ear sits above the row. The labels and shapes carry the meaning, so the picture prints clearly in grayscale and teaches learners that retelling keeps the order and key details of a story.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Retelling in Sequence</text>

  <!-- listening ear -->
  <path d="M232 78 Q244 60 268 66 Q292 72 282 88 Q292 84 294 92 Q276 106 240 100 Z" fill="#c99567" stroke="#2b3a42" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="256" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">listen first</text>

  <!-- frame 1: first, dig -->
  <rect x="40" y="150" width="128" height="180" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="104" y="178" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">first</text>
  <!-- mound of soil -->
  <path d="M62 276 Q104 252 146 276 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <!-- trowel -->
  <line x1="104" y1="236" x2="104" y2="272" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <path d="M104 228 L116 232 L112 244 L100 240 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>

  <!-- frame 2: next, plant seed -->
  <rect x="192" y="150" width="128" height="180" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="178" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">next</text>
  <path d="M214 276 Q256 252 298 276 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <!-- seed in hole -->
  <ellipse cx="256" cy="266" rx="12" ry="7" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="256" cy="254" rx="7" ry="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>

  <!-- frame 3: last, water -->
  <rect x="344" y="150" width="128" height="180" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="408" y="178" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">last</text>
  <!-- watering can -->
  <path d="M366 252 Q366 236 392 236 L404 236 Q408 236 408 244 L408 268 Q408 276 400 276 L374 276 Q366 276 366 268 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="404" y1="242" x2="428" y2="252" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <!-- water drops -->
  <line x1="392" y1="286" x2="388" y2="300" stroke="#6b93b6" stroke-width="3" stroke-linecap="round"/>
  <line x1="404" y1="286" x2="400" y2="302" stroke="#6b93b6" stroke-width="3" stroke-linecap="round"/>
  <line x1="416" y1="286" x2="412" y2="300" stroke="#6b93b6" stroke-width="3" stroke-linecap="round"/>

  <text x="256" y="372" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">first … next … last — the order holds the story together.</text>
  <text x="256" y="396" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">Retell with your own words, in your own language, with the key details.</text>
</svg>
