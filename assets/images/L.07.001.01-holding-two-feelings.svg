<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-07-001-01-holding-two-feelings desc-L-07-001-01-holding-two-feelings">
  <title id="title-L-07-001-01-holding-two-feelings">Holding two feelings at once: happy AND sad</title>
  <desc id="desc-L-07-001-01-holding-two-feelings">One scene drawn twice, side by side. The left panel shows a smiling person waving with a moving box, labeled "happy — a new beginning." The right panel shows the same person with a tear and a heavy heart, labeled "sad — an ending." A large word "AND" joins the two panels, with a caption reading "Both are true at once." The meaning is carried by labels and shapes, not color, so it prints clearly in grayscale.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">One moment, two feelings</text>

  <!-- Left panel: happy -->
  <g>
    <rect x="24" y="70" width="168" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="108" y="96" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">happy</text>
    <!-- figure: one soft silhouette, waving -->
    <g fill="#d8a97e">
      <circle cx="140" cy="148" r="24"/>
      <rect x="133" y="168" width="14" height="18" rx="6"/>
      <rect x="120" y="180" width="40" height="72" rx="17"/>
      <path d="M 124 190 Q 114 214 116 236" stroke="#d8a97e" stroke-width="13" stroke-linecap="round" fill="none"/>
      <path d="M 156 190 L 166 204 L 170 182" stroke="#d8a97e" stroke-width="13" stroke-linecap="round"
            stroke-linejoin="round" fill="none"/>
      <path d="M 130 250 L 127 294" stroke="#d8a97e" stroke-width="18" stroke-linecap="round" fill="none"/>
      <path d="M 150 250 L 153 294" stroke="#d8a97e" stroke-width="18" stroke-linecap="round" fill="none"/>
      <ellipse cx="125" cy="299" rx="12" ry="6"/>
      <ellipse cx="155" cy="299" rx="12" ry="6"/>
    </g>
    <ellipse cx="171" cy="178" rx="7" ry="9" fill="#d8a97e"/>
    <!-- face -->
    <circle cx="132" cy="143" r="3.2" fill="#2b3a42"/>
    <circle cx="150" cy="143" r="3.2" fill="#2b3a42"/>
    <path d="M126 139 Q132 135 138 139" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M144 139 Q150 135 156 139" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M129 160 Q140 173 151 160" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- moving box -->
    <rect x="46" y="252" width="62" height="46" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M46 252 L77 234 L108 252" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <path d="M77 234 L77 280" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <text x="108" y="320" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">a new beginning</text>
  </g>

  <!-- Center AND -->
  <text x="256" y="238" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#e0a458">AND</text>

  <!-- Right panel: sad -->
  <g>
    <rect x="320" y="70" width="168" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="404" y="96" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">sad</text>
    <!-- figure: one soft silhouette, arms holding a heavy heart -->
    <g fill="#a9734a">
      <circle cx="404" cy="148" r="24"/>
      <rect x="397" y="168" width="14" height="18" rx="6"/>
      <rect x="384" y="180" width="40" height="72" rx="17"/>
      <path d="M 388 190 Q 380 212 388 230" stroke="#a9734a" stroke-width="13" stroke-linecap="round" fill="none"/>
      <path d="M 420 190 Q 428 212 420 230" stroke="#a9734a" stroke-width="13" stroke-linecap="round" fill="none"/>
      <path d="M 394 250 L 391 294" stroke="#a9734a" stroke-width="18" stroke-linecap="round" fill="none"/>
      <path d="M 414 250 L 417 294" stroke="#a9734a" stroke-width="18" stroke-linecap="round" fill="none"/>
      <ellipse cx="389" cy="299" rx="12" ry="6"/>
      <ellipse cx="419" cy="299" rx="12" ry="6"/>
    </g>
    <!-- face -->
    <circle cx="396" cy="143" r="3.2" fill="#2b3a42"/>
    <circle cx="414" cy="143" r="3.2" fill="#2b3a42"/>
    <path d="M390 139 L396 136" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M412 136 L418 139" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M394 166 Q404 155 414 166" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- tear -->
    <ellipse cx="399" cy="156" rx="2.2" ry="4" fill="#6b93b6"/>
    <!-- heavy heart, held at the chest -->
    <path d="M404 232 c-14 -14 -26 -7 -26 6 c0 14 26 26 26 26 c0 0 26 -12 26 -26 c0 -13 -12 -20 -26 -6 z"
          fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="404" y="320" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">an ending</text>
  </g>

  <!-- Caption -->
  <text x="256" y="412" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Both are true at once.</text>
  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Not "either/or" — "both/and."</text>
</svg>
