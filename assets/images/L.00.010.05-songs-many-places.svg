<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Songs from many places: a song shared with respect</title>
  <desc id="desc">Three people with varied skin tones sit in a row clapping and humming together around a drum. Musical notes float above them, and one hand rests on the drum to feel the beat through vibration, so the song can be followed with the body and not only the ear. No one is dressed as a costume or mimicking another culture; they are joining in. Prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="52" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#2b3a42">Songs from Many Places</text>

  <!-- drum -->
  <g>
    <ellipse cx="256" cy="330" rx="84" ry="30" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="172" y="330" width="168" height="88" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="256" cy="418" rx="84" ry="30" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <!-- zigzag pattern on drum body (shape signal, not color) -->
    <path d="M184 356 L206 372 L228 356 L250 372 L272 356 L294 372 L316 356 L338 372" fill="none" stroke="#fdfbf7" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- musical notes -->
  <g fill="#2b3a42">
    <ellipse cx="96" cy="150" rx="9" ry="6" transform="rotate(-20 96 150)"/>
    <line x1="104" y1="150" x2="104" y2="110" stroke="#2b3a42" stroke-width="3"/>
    <path d="M104 110 Q116 108 116 120" fill="none" stroke="#2b3a42" stroke-width="3"/>
    <ellipse cx="416" cy="140" rx="9" ry="6" transform="rotate(15 416 140)"/>
    <line x1="424" y1="140" x2="424" y2="100" stroke="#2b3a42" stroke-width="3"/>
    <path d="M424 100 Q436 98 436 110" fill="none" stroke="#2b3a42" stroke-width="3"/>
    <ellipse cx="372" cy="196" rx="8" ry="5" transform="rotate(-15 372 196)"/>
    <line x1="379" y1="196" x2="379" y2="162" stroke="#2b3a42" stroke-width="3"/>
    <path d="M379 162 Q390 160 390 170" fill="none" stroke="#2b3a42" stroke-width="3"/>
  </g>

  <!-- person 1 (light skin, left) -->
  <g>
    <circle cx="118" cy="250" r="24" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="109" cy="244" r="3" fill="#2b3a42"/>
    <circle cx="127" cy="244" r="3" fill="#2b3a42"/>
    <path d="M108 260 Q118 268 128 260" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M94 246 Q118 222 142 246" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M96 280 Q118 292 140 280 L138 312 Q118 320 98 312 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <!-- clapping hands -->
    <circle cx="150" cy="300" r="8" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="168" cy="300" r="8" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- person 2 (medium skin, center, hand on drum) -->
  <g>
    <circle cx="256" cy="232" r="24" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="247" cy="226" r="3" fill="#2b3a42"/>
    <circle cx="265" cy="226" r="3" fill="#2b3a42"/>
    <path d="M246 242 Q256 250 266 242" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M232 228 Q256 206 280 228" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M234 262 Q256 274 278 262 L276 300 Q256 308 236 300 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <!-- one hand resting on the drum to feel the beat -->
    <path d="M246 292 L240 316" stroke="#c99567" stroke-width="6" stroke-linecap="round"/>
    <circle cx="240" cy="322" r="7" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- person 3 (deep skin, right) -->
  <g>
    <circle cx="394" cy="250" r="24" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="385" cy="244" r="3" fill="#2b3a42"/>
    <circle cx="403" cy="244" r="3" fill="#2b3a42"/>
    <path d="M384 260 Q394 268 404 260" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M370 246 Q394 222 418 246" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M372 280 Q394 292 416 280 L414 312 Q394 320 374 312 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <!-- clapping hands -->
    <circle cx="346" cy="300" r="8" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="364" cy="300" r="8" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- vibration waves from hand on drum -->
  <g stroke="#6b93b6" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M220 340 Q214 330 220 320"/>
    <path d="M212 348 Q202 330 212 312"/>
  </g>

  <text x="256" y="474" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">Listen &#183; clap &#183; feel the beat together</text>
</svg>
