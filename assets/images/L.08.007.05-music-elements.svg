<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The elements of music</title>
  <desc id="desc">A grid of eight labeled tiles — melody, rhythm, harmony, timbre, dynamics, tempo, texture, and form — arranged around a center that reads a musical work, the vocabulary used to critique music with evidence.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Elements of Music</text>

  <!-- center -->
  <ellipse cx="256" cy="256" rx="86" ry="40" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">a musical</text>
  <text x="256" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">work</text>

  <!-- melody -->
  <rect x="30" y="82" width="140" height="56" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="100" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Melody</text>
  <text x="100" y="124" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">the tune</text>

  <!-- rhythm -->
  <rect x="200" y="82" width="140" height="56" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="270" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Rhythm</text>
  <text x="270" y="124" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">beats and rests</text>

  <!-- harmony -->
  <rect x="370" y="82" width="112" height="56" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="426" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Harmony</text>
  <text x="426" y="124" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">notes together</text>

  <!-- timbre -->
  <rect x="30" y="176" width="140" height="56" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="100" y="200" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Timbre</text>
  <text x="100" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">tone color</text>

  <!-- dynamics -->
  <rect x="370" y="176" width="112" height="56" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="426" y="200" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Dynamics</text>
  <text x="426" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">loud and soft</text>

  <!-- tempo -->
  <rect x="30" y="374" width="140" height="56" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="100" y="398" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Tempo</text>
  <text x="100" y="416" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">fast and slow</text>

  <!-- texture -->
  <rect x="200" y="374" width="140" height="56" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="270" y="398" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Texture</text>
  <text x="270" y="416" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">how parts layer</text>

  <!-- form -->
  <rect x="370" y="374" width="112" height="56" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="426" y="398" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Form</text>
  <text x="426" y="416" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">the shape</text>

  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Name what you hear, then say what effect it has</text>
</svg>
