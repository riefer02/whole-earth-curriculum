<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Feeling thermometer: a little, some, a lot</title>
  <desc id="desc">A labeled thermometer with three stacked zones. From bottom to top the zones read "a little," "some," and "a lot." Tick marks and a bulb at the base show the feeling strength rising. The zones differ in shade and by label so the chart still makes sense printed in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="58" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#2b3a42">Feeling Strength</text>

  <!-- Thermometer tube -->
  <rect x="176" y="116" width="44" height="286" rx="22" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>

  <!-- Mercury zones (light to dark, bottom to top) -->
  <rect x="180" y="320" width="36" height="78" fill="#c9d6df"/>
  <rect x="180" y="232" width="36" height="88" fill="#6b93b6"/>
  <rect x="180" y="144" width="36" height="88" fill="#4f6d7a"/>

  <!-- Bulb -->
  <circle cx="198" cy="428" r="38" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="198" cy="428" r="20" fill="#4f6d7a"/>

  <!-- Tick marks -->
  <line x1="220" y1="144" x2="240" y2="144" stroke="#2b3a42" stroke-width="2"/>
  <line x1="220" y1="232" x2="240" y2="232" stroke="#2b3a42" stroke-width="2"/>
  <line x1="220" y1="320" x2="240" y2="320" stroke="#2b3a42" stroke-width="2"/>

  <!-- Labels -->
  <text x="250" y="178" font-family="sans-serif" font-size="26" font-weight="bold" fill="#222222">a lot</text>
  <text x="250" y="266" font-family="sans-serif" font-size="26" font-weight="bold" fill="#222222">some</text>
  <text x="250" y="354" font-family="sans-serif" font-size="26" font-weight="bold" fill="#222222">a little</text>

  <!-- Arrow pointing up -->
  <line x1="150" y1="396" x2="150" y2="150" stroke="#2b3a42" stroke-width="3"/>
  <path d="M141 160 L150 146 L159 160" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42">Every feeling has a size.</text>
</svg>
