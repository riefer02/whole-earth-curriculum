<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A Listening Program</title>
  <desc id="desc">A horizontal timeline of five numbered segments connected by arrows, each segment labeled with a tradition or culture name, with a short caption line under each, showing how a listening program sequences works from one culture to the next.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">A Listening Program: Works in Sequence</text>

  <!-- Five segments -->
  <rect x="40" y="140" width="78" height="120" rx="8" fill="#7a9e7e" fill-opacity="0.3" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="79" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">1</text>
  <text x="79" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Indian</text>
  <text x="79" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">raga</text>

  <rect x="137" y="140" width="78" height="120" rx="8" fill="#e0a458" fill-opacity="0.3" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="176" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">2</text>
  <text x="176" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Andean</text>
  <text x="176" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">siku</text>

  <rect x="234" y="140" width="78" height="120" rx="8" fill="#6b93b6" fill-opacity="0.3" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="273" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">3</text>
  <text x="273" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">West African</text>
  <text x="273" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">djembe</text>

  <rect x="331" y="140" width="78" height="120" rx="8" fill="#4f6d7a" fill-opacity="0.3" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="370" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">4</text>
  <text x="370" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Jamaican</text>
  <text x="370" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">reggae</text>

  <rect x="428" y="140" width="44" height="120" rx="8" fill="#7a9e7e" fill-opacity="0.3" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="450" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">5</text>
  <text x="450" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">local</text>
  <text x="450" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">song</text>

  <!-- Arrows between segments -->
  <line x1="118" y1="200" x2="137" y2="200" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="137,200 125,194 125,206" fill="#2b3a42"/>
  <line x1="215" y1="200" x2="234" y2="200" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="234,200 222,194 222,206" fill="#2b3a42"/>
  <line x1="312" y1="200" x2="331" y2="200" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="331,200 319,194 319,206" fill="#2b3a42"/>
  <line x1="409" y1="200" x2="428" y2="200" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="428,200 416,194 416,206" fill="#2b3a42"/>

  <!-- Caption lines under each -->
  <text x="79" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">opens calm</text>
  <text x="176" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">interlocking</text>
  <text x="273" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">call &amp; response</text>
  <text x="370" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">a voice for all</text>
  <text x="450" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">closes home</text>

  <!-- Caption -->
  <rect x="90" y="360" width="332" height="78" rx="8" fill="#ffffff" stroke="#e0a458" stroke-width="2"/>
  <text x="256" y="390" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">A program is a journey</text>
  <text x="256" y="412" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">across cultures —</text>
  <text x="256" y="432" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">each work honored, each reason written.</text>
</svg>
