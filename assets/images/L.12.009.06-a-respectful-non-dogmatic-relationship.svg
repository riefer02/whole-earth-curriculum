<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A Respectful, Non-Dogmatic Relationship</title>
  <desc id="desc">Two overlapping circles, one labeled "tradition A" and one labeled "tradition B." The overlap is labeled "where they complement," and the two non-overlapping crescents are labeled "where each stands alone." Below, a line reads "respect each; question none dogmatically." Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2b3a42" font-weight="bold">A Respectful, Non-Dogmatic Relationship</text>

  <!-- circle A -->
  <circle cx="184" cy="210" r="118" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <text x="108" y="210" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">Tradition A</text>
  <text x="108" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">stands alone</text>

  <!-- circle B -->
  <circle cx="328" cy="210" r="118" fill="none" stroke="#e0a458" stroke-width="3"/>
  <text x="404" y="210" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">Tradition B</text>
  <text x="404" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">stands alone</text>

  <!-- overlap -->
  <text x="256" y="196" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42" font-weight="bold">where they</text>
  <text x="256" y="214" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42" font-weight="bold">complement</text>

  <rect x="60" y="360" width="392" height="76" rx="8" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="256" y="388" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">Honor each; treat none as beyond question.</text>
  <text x="256" y="412" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Name where they complement and where they differ.</text>

  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">Two dogmatisms to avoid: only one is real, or all are equal.</text>
</svg>
