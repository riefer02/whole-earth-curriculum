<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Industrialization: Gains and Losses</title>
  <desc id="desc">A balance scale with two pans. The left pan holds symbols of gains — a factory, a city skyline, a lightbulb. The right pan holds symbols of losses — a felled tree, smoke, crowded housing. Three small figures stand beneath, since gains and losses fall on different people.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Weighing Gains and Losses</text>

  <!-- Balance post and beam -->
  <line x1="256" y1="70" x2="256" y2="250" stroke="#2b3a42" stroke-width="4"/>
  <line x1="120" y1="90" x2="392" y2="90" stroke="#2b3a42" stroke-width="4"/>
  <line x1="140" y1="90" x2="140" y2="150" stroke="#2b3a42" stroke-width="2"/>
  <line x1="372" y1="90" x2="372" y2="150" stroke="#2b3a42" stroke-width="2"/>

  <!-- Left pan: gains -->
  <rect x="110" y="150" width="60" height="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="118" y="118" width="16" height="32" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="136" y="106" width="12" height="44" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="150" y="122" width="10" height="28" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="140" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">factory &amp; city</text>
  <circle cx="128" cy="176" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="140" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">light</text>

  <!-- Right pan: losses -->
  <rect x="342" y="150" width="60" height="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M356 150 L352 128 L360 128 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="372" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">felled tree</text>
  <circle cx="380" cy="176" r="5" fill="#4f6d7a"/>
  <circle cx="392" cy="180" r="4" fill="#4f6d7a"/>
  <text x="386" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">smoke</text>

  <!-- People -->
  <g fill="#6b93b6" stroke="#2b3a42" stroke-width="2">
    <circle cx="150" cy="330" r="12"/>
    <circle cx="256" cy="330" r="12"/>
    <circle cx="362" cy="330" r="12"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <path d="M138 356 Q150 344 162 356"/>
    <path d="M244 356 Q256 344 268 356"/>
    <path d="M350 356 Q362 344 374 356"/>
  </g>
  <text x="256" y="386" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Gains and losses fall on different people.</text>
  <text x="256" y="408" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Always ask: for whom?</text>
</svg>
