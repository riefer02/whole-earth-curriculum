<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Art is a voice: a picture says a feeling</title>
  <desc id="desc">A child with medium brown skin draws a big smiling sun on a sheet of paper. A speech bubble above the child holds a small heart and the word "happy", because the picture is saying a feeling. A second child with deep brown skin points at the sun and asks in a speech bubble, "What does it say?" Both children are labeled by what they are doing — drawing and guessing — so the meaning does not rely on color, and the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Art Is a Voice</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">A picture can say a feeling without a single word.</text>

  <!-- Paper with sun -->
  <rect x="216" y="120" width="196" height="180" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <g>
    <circle cx="314" cy="196" r="34" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#e0a458" stroke-width="3" stroke-linecap="round">
      <line x1="314" y1="154" x2="314" y2="146"/>
      <line x1="314" y1="238" x2="314" y2="246"/>
      <line x1="272" y1="196" x2="264" y2="196"/>
      <line x1="356" y1="196" x2="364" y2="196"/>
      <line x1="285" y1="167" x2="279" y2="161"/>
      <line x1="343" y1="225" x2="349" y2="231"/>
      <line x1="343" y1="167" x2="349" y2="161"/>
      <line x1="285" y1="225" x2="279" y2="231"/>
    </g>
    <circle cx="302" cy="190" r="2.6" fill="#2b3a42"/>
    <circle cx="326" cy="190" r="2.6" fill="#2b3a42"/>
    <path d="M304 204 Q314 212 324 204" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="314" y="276" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">my picture</text>
  </g>

  <!-- Child 1 (drawing, medium skin) -->
  <g>
    <circle cx="138" cy="256" r="17" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M121 252 Q138 234 155 252" fill="#2b3a42"/>
    <circle cx="131" cy="254" r="2.6" fill="#2b3a42"/>
    <circle cx="145" cy="254" r="2.6" fill="#2b3a42"/>
    <path d="M132 262 Q138 268 144 262" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="120" y="278" width="36" height="54" rx="14" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <!-- right arm reaching to draw -->
    <path d="M154 292 Q184 286 204 270" fill="none" stroke="#c99567" stroke-width="7" stroke-linecap="round"/>
    <line x1="204" y1="270" x2="204" y2="270" stroke="#c99567" stroke-width="7" stroke-linecap="round"/>
    <!-- left arm at side -->
    <path d="M122 294 Q110 300 112 312" fill="none" stroke="#c99567" stroke-width="7" stroke-linecap="round"/>
    <!-- legs -->
    <line x1="130" y1="332" x2="128" y2="368" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <line x1="146" y1="332" x2="148" y2="368" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <text x="138" y="392" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">drawing</text>
  </g>

  <!-- Child 1 speech bubble: happy -->
  <g>
    <rect x="40" y="150" width="132" height="64" rx="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M150 214 L132 232 L124 214" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M76 172 Q82 164 90 172 Q98 180 82 186 Q66 180 76 172 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="126" y="188" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">happy</text>
  </g>

  <!-- Child 2 (guessing, deep skin) -->
  <g>
    <circle cx="452" cy="316" r="17" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M436 296 Q452 280 468 296 Q468 288 452 284 Q436 288 436 296 Z" fill="#4f6d7a"/>
    <circle cx="445" cy="314" r="2.6" fill="#2b3a42"/>
    <circle cx="459" cy="314" r="2.6" fill="#2b3a42"/>
    <path d="M445 323 Q452 328 459 323" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="434" y="338" width="36" height="50" rx="14" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <!-- pointing arm -->
    <path d="M434 350 Q408 344 396 330" fill="none" stroke="#8f5f3d" stroke-width="7" stroke-linecap="round"/>
    <!-- legs -->
    <line x1="444" y1="388" x2="442" y2="424" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <line x1="460" y1="388" x2="462" y2="424" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <text x="452" y="448" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">guessing</text>
  </g>

  <!-- Child 2 speech bubble: question -->
  <g>
    <rect x="380" y="240" width="112" height="54" rx="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M396 294 L384 312 L408 294" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="436" y="272" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">What does</text>
    <text x="436" y="288" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">it say?</text>
  </g>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">You said something today — and no one needed to hear a word.</text>
</svg>
