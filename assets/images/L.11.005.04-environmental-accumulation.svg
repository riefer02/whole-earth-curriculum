<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Environmental Accumulation: Series in the Living World</title>
  <desc id="desc">Two panels. Top panel: an algae bloom doubling each week shown as growing circles (1, 2, 4, 8, 16 patches), with a note that the cumulative total after five weeks is 31. Bottom panel: a pollutant halving each period shown as shrinking bars (8, 4, 2, 1), with a note that series model both buildup and cleanup.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Buildup and Cleanup Are Series</text>

  <!-- Bloom panel -->
  <text x="128" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a" font-weight="bold">Algae bloom (doubling)</text>
  <circle cx="60" cy="150" r="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="100" cy="150" r="15" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="152" cy="150" r="22" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="214" cy="150" r="31" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="60" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">1</text>
  <text x="100" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">2</text>
  <text x="152" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">4</text>
  <text x="214" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">8</text>
  <rect x="44" y="220" width="168" height="76" fill="#ffffff" stroke="#7a9e7e" stroke-width="2" rx="6"/>
  <text x="128" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">After 5 weeks: last = 16,</text>
  <text x="128" y="264" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">total = 1+2+4+8+16 = 31</text>
  <text x="128" y="284" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">the total matters, not just the last</text>

  <!-- Decay panel -->
  <text x="384" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a" font-weight="bold">Pollutant (halving)</text>
  <rect x="300" y="120" width="36" height="72" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <rect x="340" y="138" width="36" height="54" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <rect x="380" y="156" width="36" height="36" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <rect x="420" y="174" width="36" height="18" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="318" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">8</text>
  <text x="358" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">4</text>
  <text x="398" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">2</text>
  <text x="438" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">1</text>
  <rect x="300" y="220" width="168" height="76" fill="#ffffff" stroke="#6b93b6" stroke-width="2" rx="6"/>
  <text x="384" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">each term &#215;&#189; (half-life)</text>
  <text x="384" y="264" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">passed through = 8+4+2+1 = 15</text>
  <text x="384" y="284" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">a decay series, summed</text>

  <!-- Footer -->
  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">Cumulative, not annual, tells the real story.</text>
  <text x="256" y="388" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Who adds it is often not who breathes it &#8212; read the data.</text>
</svg>
