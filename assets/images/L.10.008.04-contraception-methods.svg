<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Contraception: Four Method Groups</title>
  <desc id="desc">A chart grouping contraception methods into four boxes — barrier, hormonal, long-acting, and emergency — with a highlighted note that condoms also protect against STIs including HIV.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42" font-weight="bold">Contraception: How the Methods Work</text>

  <g font-family="sans-serif" stroke="#2b3a42" stroke-width="1.5">
    <rect x="36" y="52" width="210" height="120" rx="8" fill="#ffffff"/>
    <rect x="36" y="52" width="210" height="30" rx="8" fill="#7a9e7e"/>
    <text x="141" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">Barrier</text>
    <text x="141" y="102" text-anchor="middle" font-size="13" fill="#222222">External &amp; internal condoms</text>
    <text x="141" y="122" text-anchor="middle" font-size="12" fill="#4f6d7a">Block egg and sperm from meeting</text>
    <text x="141" y="150" text-anchor="middle" font-size="12" fill="#4f6d7a">Also protect against STIs</text>

    <rect x="266" y="52" width="210" height="120" rx="8" fill="#ffffff"/>
    <rect x="266" y="52" width="210" height="30" rx="8" fill="#6b93b6"/>
    <text x="371" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">Hormonal</text>
    <text x="371" y="102" text-anchor="middle" font-size="13" fill="#222222">Pills, injections, patches, rings</text>
    <text x="371" y="122" text-anchor="middle" font-size="12" fill="#4f6d7a">Change the monthly cycle</text>
    <text x="371" y="150" text-anchor="middle" font-size="12" fill="#4f6d7a">Do not protect against STIs</text>

    <rect x="36" y="190" width="210" height="120" rx="8" fill="#ffffff"/>
    <rect x="36" y="190" width="210" height="30" rx="8" fill="#e0a458"/>
    <text x="141" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">Long-acting</text>
    <text x="141" y="240" text-anchor="middle" font-size="13" fill="#222222">Implants, IUDs, sterilization</text>
    <text x="141" y="260" text-anchor="middle" font-size="12" fill="#4f6d7a">Work for months or years</text>
    <text x="141" y="288" text-anchor="middle" font-size="12" fill="#4f6d7a">Do not protect against STIs</text>

    <rect x="266" y="190" width="210" height="120" rx="8" fill="#ffffff"/>
    <rect x="266" y="190" width="210" height="30" rx="8" fill="#4f6d7a"/>
    <text x="371" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Emergency</text>
    <text x="371" y="240" text-anchor="middle" font-size="13" fill="#222222">Used soon after unprotected sex</text>
    <text x="371" y="260" text-anchor="middle" font-size="12" fill="#4f6d7a">A backup, not a routine method</text>
    <text x="371" y="288" text-anchor="middle" font-size="12" fill="#4f6d7a">Does not protect against STIs</text>
  </g>

  <rect x="36" y="330" width="440" height="70" rx="8" fill="#e0a458" opacity="0.25" stroke="#e0a458" stroke-width="2"/>
  <text x="256" y="356" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">The key fact: condoms are the method that also protects</text>
  <text x="256" y="380" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">against STIs, including HIV. &#8220;Dual protection&#8221; = condom + another method.</text>

  <text x="256" y="436" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Effectiveness depends on correct and consistent use.</text>
  <text x="256" y="458" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Access to these methods is unequal worldwide &#8212; a justice issue, not a personal failing.</text>
</svg>
