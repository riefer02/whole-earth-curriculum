<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">One job done long ago and today — moving water</title>
  <desc id="d">Two panels compare the same job of moving water, then and now. The left panel, labeled long ago, shows a person carrying a water jug by hand from a river. The right panel, labeled today, shows a person turning a tap and water flowing from a pipe. The note says the job is the same — getting water — but the tool changed: it is faster and easier, and it needs pipes and power. Word labels carry the meaning so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">The same job, then and now</text>

  <!-- Long ago panel -->
  <rect x="16" y="56" width="228" height="300" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="130" y="82" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Long ago</text>
  <!-- river -->
  <path d="M16 210 Q70 194 130 210 T244 210" fill="none" stroke="#6b93b6" stroke-width="6"/>
  <text x="130" y="198" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">river</text>
  <!-- person with jug -->
  <circle cx="130" cy="150" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <line x1="130" y1="166" x2="130" y2="240" stroke="#2b3a42" stroke-width="5"/>
  <line x1="130" y1="240" x2="108" y2="300" stroke="#2b3a42" stroke-width="5"/>
  <line x1="130" y1="240" x2="152" y2="300" stroke="#2b3a42" stroke-width="5"/>
  <line x1="130" y1="176" x2="104" y2="210" stroke="#2b3a42" stroke-width="4"/>
  <line x1="130" y1="176" x2="158" y2="210" stroke="#2b3a42" stroke-width="4"/>
  <path d="M156 210 q20 8 16 26 q-20 10 -36 0 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
  <text x="130" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Carried by hand in a jug</text>
  <text x="130" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">slow · works anywhere · no power</text>

  <!-- Today panel -->
  <rect x="268" y="56" width="228" height="300" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="382" y="82" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Today</text>
  <!-- tap -->
  <rect x="340" y="120" width="16" height="60" fill="#4f6d7a" stroke="#2b3a42" stroke-width="3"/>
  <rect x="352" y="120" width="34" height="12" rx="3" fill="#4f6d7a" stroke="#2b3a42" stroke-width="3"/>
  <path d="M366 132 q6 60 2 100" stroke="#6b93b6" stroke-width="6" fill="none"/>
  <circle cx="366" cy="238" r="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="3"/>
  <!-- person at tap -->
  <circle cx="420" cy="180" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <line x1="420" y1="196" x2="420" y2="270" stroke="#2b3a42" stroke-width="5"/>
  <line x1="420" y1="270" x2="398" y2="330" stroke="#2b3a42" stroke-width="5"/>
  <line x1="420" y1="270" x2="442" y2="330" stroke="#2b3a42" stroke-width="5"/>
  <line x1="420" y1="206" x2="390" y2="180" stroke="#2b3a42" stroke-width="4"/>
  <text x="382" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">A tap and pipes bring it in</text>
  <text x="382" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">faster · easier · needs pipes and power</text>

  <rect x="16" y="372" width="480" height="120" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="256" y="400" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">The job is the same — getting water.</text>
  <text x="256" y="428" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">What changed is the tool: it is faster and easier,</text>
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">and it needs pipes and power.</text>
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">New is not better — it is just different.</text>
</svg>
