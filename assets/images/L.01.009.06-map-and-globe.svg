<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Map and globe: home and another place</title>
  <desc id="desc">Two panels compare a map and a globe. The left panel is labeled map, a picture from above, and shows a simple bird's-eye view: a house marked home, a tree, a wavy pond marked water, and a pin marked another place, with a dashed path between them. The right panel is labeled globe, the Earth as a ball, and shows a round globe on a stand with solid land shapes marked land and wavy water marked water, plus a home pin and an another-place pin joined by a dashed line marked far. The labels and the shapes, not color, carry the meaning, so the picture prints clearly in grayscale and can also be felt with raised lines, and it shows that a map is a flat picture from above while a globe is the whole Earth in the shape of a ball, and every place on them is someone's home.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Maps and Globes</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Finding home and one other place</text>

  <!-- left panel -->
  <rect x="20" y="96" width="230" height="330" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="135" y="124" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">map</text>
  <text x="135" y="146" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">a picture from above</text>

  <!-- path -->
  <path d="M85 330 Q140 300 160 230 Q175 180 200 160" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>

  <!-- house (home) -->
  <g>
    <path d="M66 316 L85 296 L104 316 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <rect x="71" y="316" width="28" height="24" rx="2" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="80" y="326" width="9" height="14" rx="2" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.6"/>
    <text x="85" y="288" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">home</text>
  </g>

  <!-- tree -->
  <g>
    <rect x="168" y="252" width="8" height="24" rx="3" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="172" cy="244" r="16" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- pond (water) -->
  <g>
    <ellipse cx="160" cy="380" rx="42" ry="18" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M130 380 Q140 374 150 380 T170 380 T190 380" fill="none" stroke="#fdfbf7" stroke-width="2" stroke-linecap="round"/>
    <text x="160" y="410" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">water</text>
  </g>

  <!-- another-place pin -->
  <g>
    <path d="M205 150 C205 138 192 134 192 144 C192 152 205 150 205 150 Z" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="197" cy="144" r="3.4" fill="#fdfbf7" stroke="#2b3a42" stroke-width="1.6"/>
    <text x="208" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">another place</text>
  </g>

  <!-- right panel -->
  <rect x="262" y="96" width="230" height="330" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="377" y="124" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">globe</text>
  <text x="377" y="146" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">the Earth as a ball</text>

  <!-- globe stand -->
  <line x1="377" y1="360" x2="377" y2="392" stroke="#4f6d7a" stroke-width="4" stroke-linecap="round"/>
  <path d="M347 392 Q377 402 407 392" fill="none" stroke="#4f6d7a" stroke-width="4" stroke-linecap="round"/>

  <!-- globe -->
  <circle cx="377" cy="272" r="88" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="377" cy="272" rx="30" ry="88" fill="none" stroke="#2b3a42" stroke-width="1.6" stroke-opacity="0.5"/>
  <line x1="289" y1="272" x2="465" y2="272" stroke="#2b3a42" stroke-width="1.6" stroke-opacity="0.5"/>

  <!-- land shapes -->
  <path d="M315 230 Q340 214 358 232 Q350 254 322 254 Q306 246 315 230 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M396 300 Q428 290 444 312 Q432 340 404 340 Q390 324 396 300 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>

  <!-- water waves -->
  <path d="M300 340 Q312 332 324 340 T348 340" fill="none" stroke="#fdfbf7" stroke-width="2" stroke-linecap="round"/>
  <path d="M420 250 Q430 244 440 250" fill="none" stroke="#fdfbf7" stroke-width="2" stroke-linecap="round"/>

  <!-- labels -->
  <text x="336" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">land</text>
  <text x="418" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">land</text>
  <text x="377" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">water</text>

  <!-- home pin on globe -->
  <g>
    <path d="M340 228 L334 222 L346 222 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="336" y="208" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">home</text>
  </g>

  <!-- another-place pin on globe -->
  <g>
    <path d="M424 306 L418 300 L430 300 Z" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="430" y="356" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">another place</text>
  </g>

  <!-- far line between pins -->
  <line x1="340" y1="222" x2="424" y2="302" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/>
  <text x="390" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">far</text>

  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Every place on the map or globe is someone's home.</text>
  <text x="256" y="482" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">No correct place &#183; only the one that is home</text>
</svg>
