<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Having a say</title>
  <desc id="desc">Two circles of people compare a fair group and an unfair group. The left circle shows five people all with speech bubbles, labeled "everyone has a say — fair." The right circle shows four people speaking while one person sits outside the circle with no bubble, labeled "someone is left out — unfair." A small question sits between them. Labels and shapes, not color, carry the meaning so it prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Having a Say</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">A say means your voice helps decide what happens in the group.</text>

  <!-- left circle -->
  <rect x="30" y="96" width="218" height="240" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="139" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">everyone has a say</text>
  <circle cx="120" cy="150" r="14" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M120 164 l0 20 M113 172 l7 7 l7 -7" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="160" cy="150" r="14" fill="#8d5a3a" stroke="#2b3a42" stroke-width="2"/>
  <path d="M160 164 l0 20 M153 172 l7 7 l7 -7" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="140" cy="186" r="14" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M140 200 l0 20 M133 208 l7 7 l7 -7" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="100" cy="186" r="14" fill="#8d5a3a" stroke="#2b3a42" stroke-width="2"/>
  <path d="M100 200 l0 20 M93 208 l7 7 l7 -7" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="180" cy="186" r="14" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M180 200 l0 20 M173 208 l7 7 l7 -7" stroke="#2b3a42" stroke-width="2"/>
  <path d="M128 232 q12 6 24 0 l-2 14 l-10 0 l-10 0 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="140" y="236" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">listen</text>
  <text x="139" y="286" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">every voice is heard</text>
  <text x="139" y="304" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">&#8594; the choice is fair</text>

  <!-- question -->
  <text x="256" y="210" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#4f6d7a">?</text>

  <!-- right circle -->
  <rect x="264" y="96" width="218" height="240" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="373" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">someone is left out</text>
  <circle cx="356" cy="150" r="14" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M356 164 l0 20 M349 172 l7 7 l7 -7" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="396" cy="150" r="14" fill="#8d5a3a" stroke="#2b3a42" stroke-width="2"/>
  <path d="M396 164 l0 20 M389 172 l7 7 l7 -7" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="376" cy="186" r="14" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M376 200 l0 20 M369 208 l7 7 l7 -7" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="416" cy="186" r="14" fill="#8d5a3a" stroke="#2b3a42" stroke-width="2"/>
  <path d="M416 200 l0 20 M409 208 l7 7 l7 -7" stroke="#2b3a42" stroke-width="2"/>
  <!-- left-out person -->
  <circle cx="316" cy="226" r="14" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M316 240 l0 20 M309 248 l7 7 l7 -7" stroke="#2b3a42" stroke-width="2"/>
  <text x="316" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">no bubble —</text>
  <text x="316" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">no voice</text>
  <text x="373" y="286" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">one voice is not heard</text>
  <text x="373" y="304" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">&#8594; the choice can be unfair</text>

  <text x="256" y="382" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">Having a say means your voice helps decide.</text>
  <text x="256" y="404" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">When someone is left out, the group can notice — and invite them in.</text>
  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Every voice matters. A fair group makes room for all.</text>
</svg>
