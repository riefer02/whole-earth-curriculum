<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Memory and body shape a feeling</title>
  <desc id="desc">A diagram with two paths feeding into one feeling. On the left, a photo frame labeled "memory" shows a happy day at the sea with a sun and waves. On the right, a simple body outline labeled "body sensation" has a warm radiating glow at the chest. Both paths point with arrows to a smiling face labeled "feeling: happy." Labels and arrows, not color alone, carry the meaning so the diagram prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Two Shapers of a Feeling</text>

  <!-- Memory panel -->
  <rect x="30" y="84" width="180" height="220" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="120" y="112" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#4f6d7a">memory</text>
  <!-- photo frame -->
  <rect x="52" y="126" width="136" height="150" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
  <!-- sun -->
  <circle cx="96" cy="160" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#e0a458" stroke-width="2" stroke-linecap="round">
    <line x1="96" y1="138" x2="96" y2="132"/>
    <line x1="118" y1="160" x2="124" y2="160"/>
    <line x1="96" y1="182" x2="96" y2="188"/>
    <line x1="74" y1="160" x2="68" y2="160"/>
  </g>
  <!-- sea -->
  <path d="M52 210 Q84 196 120 210 Q152 222 188 210 L188 240 L52 240 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M60 224 q10 6 20 0 q10 -6 20 0 q10 6 20 0 q10 -6 20 0 q10 6 20 0" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- small boat -->
  <path d="M138 218 L150 218 L146 226 L142 226 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="144" y1="218" x2="144" y2="210" stroke="#2b3a42" stroke-width="1.5"/>
  <path d="M144 210 L150 216 L144 214 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="1"/>

  <!-- Body panel -->
  <rect x="302" y="84" width="180" height="220" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="392" y="112" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#4f6d7a">body sensation</text>
  <!-- body outline -->
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="392" cy="152" r="18"/>
    <path d="M392 170 L392 232"/>
    <path d="M392 184 L366 206"/>
    <path d="M392 184 L418 206"/>
    <path d="M392 232 L370 272"/>
    <path d="M392 232 L414 272"/>
  </g>
  <!-- warm glow at chest -->
  <circle cx="392" cy="196" r="24" fill="#e0a458" opacity="0.35"/>
  <circle cx="392" cy="196" r="12" fill="#e0a458" stroke="#e0a458" stroke-width="2"/>
  <g stroke="#e0a458" stroke-width="2" stroke-linecap="round">
    <line x1="392" y1="176" x2="392" y2="170"/>
    <line x1="392" y1="216" x2="392" y2="222"/>
    <line x1="372" y1="196" x2="366" y2="196"/>
    <line x1="412" y1="196" x2="418" y2="196"/>
  </g>

  <!-- Feeling target -->
  <circle cx="256" cy="392" r="42" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="244" cy="384" r="4" fill="#2b3a42"/>
  <circle cx="268" cy="384" r="4" fill="#2b3a42"/>
  <path d="M238 378 Q244 374 250 378" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M262 378 Q268 374 274 378" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M240 404 Q256 416 272 404" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#222222">feeling: happy</text>

  <!-- arrows into feeling -->
  <g stroke="#4f6d7a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 308 Q120 372 212 392"/>
    <path d="M392 308 Q392 372 300 392"/>
  </g>
  <path d="M206 384 L214 392 L206 398" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M306 384 L298 392 L306 398" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
