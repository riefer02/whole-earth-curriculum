<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Identity shapes belonging</title>
  <desc id="d">One circle contains four figures of varied skin tones. One holds a small drum, one holds a bowl of shared food, one has a speech bubble with two different scripts, and one is a wheelchair user with a hearing aid. A banner reads "culture, language, ability — all belong, and it is ordinary."</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <!-- the circle -->
  <circle cx="256" cy="240" r="170" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3.5"/>
  <!-- figure with drum (culture) -->
  <g>
    <circle cx="140" cy="170" r="16" fill="#d9a066"/>
    <rect x="125" y="186" width="30" height="40" rx="9" fill="#e0a458"/>
    <ellipse cx="150" cy="240" rx="16" ry="20" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
    <text x="140" y="130" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">culture</text>
  </g>
  <!-- figure with food bowl (culture) -->
  <g>
    <circle cx="360" cy="170" r="16" fill="#a9714b"/>
    <rect x="345" y="186" width="30" height="40" rx="9" fill="#6b93b6"/>
    <path d="M352 200 L 336 220" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M352 220 L 336 220" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M336 220 Q 344 236 352 220" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
    <text x="370" y="130" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">shared food</text>
  </g>
  <!-- figure with two scripts (language) -->
  <g>
    <circle cx="110" cy="330" r="16" fill="#f2c9a0"/>
    <rect x="95" y="346" width="30" height="40" rx="9" fill="#7a9e7e"/>
    <rect x="46" y="300" width="74" height="44" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="60" y="322" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">hello</text>
    <text x="66" y="338" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">hola</text>
    <text x="110" y="300" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">language</text>
  </g>
  <!-- wheelchair user with hearing aid (ability) -->
  <g>
    <circle cx="360" cy="330" r="15" fill="#8d5a3b"/>
    <path d="M360 318 L 360 312 M360 312 C 354 312, 354 306, 360 306" stroke="#2b3a42" stroke-width="3" fill="none"/>
    <rect x="346" y="345" width="28" height="34" rx="8" fill="#e0a458"/>
    <circle cx="330" cy="372" r="13" fill="none" stroke="#2b3a42" stroke-width="3.5"/>
    <circle cx="390" cy="372" r="13" fill="none" stroke="#2b3a42" stroke-width="3.5"/>
    <line x1="346" y1="364" x2="330" y2="372" stroke="#2b3a42" stroke-width="3"/>
    <line x1="374" y1="364" x2="390" y2="372" stroke="#2b3a42" stroke-width="3"/>
    <text x="400" y="300" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">ability</text>
  </g>
  <!-- banner -->
  <rect x="80" y="440" width="352" height="54" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="464" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">culture, language, ability —</text>
  <text x="256" y="484" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">all belong, and it is ordinary</text>
</svg>
