<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A sustained performance: one idea through beginning, middle, end</title>
  <desc id="desc">A performance arc: a rising-then-falling line through three labeled points — beginning, middle, end — with a thread below labeled "one idea through all three." Labels carry the meaning, so it prints clearly in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="52" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">A Sustained Performance</text>

  <!-- Arc -->
  <path d="M80 320 C170 180 340 180 432 320" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>

  <circle cx="80" cy="320" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="80" y="360" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">beginning</text>

  <circle cx="256" cy="180" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="150" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">middle</text>

  <circle cx="432" cy="320" r="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="432" y="360" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">end</text>

  <path d="M80 330 C180 420 340 420 432 330" fill="none" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">one idea through all three</text>
</svg>
