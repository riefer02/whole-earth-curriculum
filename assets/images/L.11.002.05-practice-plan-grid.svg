<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t5 d5">
  <title id="t5">A weekly mind-body practice plan</title>
  <desc id="d5">A seven-column weekly grid with a row for a chosen practice and a row for "why it works," showing a simple personal plan for practicing breathing, movement, or attention a little each day.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="50" font-family="sans-serif" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle">My practice plan</text>

  <!-- grid -->
  <g stroke="#2b3a42" stroke-width="3" fill="none">
    <rect x="40" y="80" width="432" height="150"/>
    <rect x="40" y="230" width="432" height="150"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="40" y1="80" x2="40" y2="380"/>
    <line x1="472" y1="80" x2="472" y2="380"/>
    <!-- vertical day dividers -->
    <line x1="94" y1="80" x2="94" y2="380"/>
    <line x1="148" y1="80" x2="148" y2="380"/>
    <line x1="202" y1="80" x2="202" y2="380"/>
    <line x1="256" y1="80" x2="256" y2="380"/>
    <line x1="310" y1="80" x2="310" y2="380"/>
    <line x1="364" y1="80" x2="364" y2="380"/>
    <line x1="418" y1="80" x2="418" y2="380"/>
  </g>

  <!-- day labels -->
  <g font-family="sans-serif" font-size="14" fill="#2b3a42" text-anchor="middle">
    <text x="67" y="104">M</text><text x="121" y="104">T</text><text x="175" y="104">W</text>
    <text x="229" y="104">Th</text><text x="283" y="104">F</text><text x="337" y="104">Sa</text>
    <text x="391" y="104">Su</text>
  </g>

  <text x="256" y="138" font-family="sans-serif" font-size="16" fill="#4f6d7a" text-anchor="middle">practice (breath / move / notice)</text>
  <text x="256" y="288" font-family="sans-serif" font-size="16" fill="#4f6d7a" text-anchor="middle">why it works (in my own words)</text>

  <!-- sample check marks in a few cells -->
  <g stroke="#7a9e7e" stroke-width="5" stroke-linecap="round">
    <path d="M 60 170 l 10 12 l 20 -22"/>
    <path d="M 168 170 l 10 12 l 20 -22"/>
    <path d="M 276 170 l 10 12 l 20 -22"/>
    <path d="M 384 170 l 10 12 l 20 -22"/>
    <path d="M 114 320 l 10 12 l 20 -22"/>
    <path d="M 330 320 l 10 12 l 20 -22"/>
  </g>

  <text x="256" y="440" font-family="sans-serif" font-size="20" fill="#2b3a42" text-anchor="middle">A little, often, with a reason.</text>
</svg>
