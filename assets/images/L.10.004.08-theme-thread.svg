<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Theme thread across a full work</title>
  <desc id="desc">A horizontal thread with four beads along it. Each bead is labeled with a chapter and a short phrase showing how one theme grows and changes across a book, from an early seed to fuller meaning by the end.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#2b3a42">Following a Theme the Whole Way</text>

  <!-- Thread -->
  <path d="M60 230 C 160 200, 200 260, 256 230 C 312 200, 360 260, 452 230" fill="none" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>

  <!-- Beads -->
  <g font-family="sans-serif" font-size="13">
    <!-- bead 1 -->
    <circle cx="96" cy="216" r="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="96" y="222" text-anchor="middle" fill="#fdfbf7" font-weight="bold">1</text>
    <text x="96" y="270" text-anchor="middle" fill="#2b3a42">ch. 1 — a hint</text>
    <text x="96" y="290" text-anchor="middle" fill="#4f6d7a">"home" first appears</text>

    <!-- bead 2 -->
    <circle cx="216" cy="232" r="16" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="216" y="238" text-anchor="middle" fill="#fdfbf7" font-weight="bold">2</text>
    <text x="216" y="270" text-anchor="middle" fill="#2b3a42">ch. 5 — it grows</text>
    <text x="216" y="290" text-anchor="middle" fill="#4f6d7a">home now means people</text>

    <!-- bead 3 -->
    <circle cx="336" cy="218" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="336" y="224" text-anchor="middle" fill="#2b3a42" font-weight="bold">3</text>
    <text x="336" y="270" text-anchor="middle" fill="#2b3a42">ch. 9 — it turns</text>
    <text x="336" y="290" text-anchor="middle" fill="#4f6d7a">home is tested</text>

    <!-- bead 4 -->
    <circle cx="448" cy="236" r="16" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <text x="448" y="242" text-anchor="middle" fill="#fdfbf7" font-weight="bold">4</text>
    <text x="448" y="270" text-anchor="middle" fill="#2b3a42">end — full meaning</text>
    <text x="448" y="290" text-anchor="middle" fill="#4f6d7a">home is what you carry</text>
  </g>

  <!-- Caption -->
  <rect x="60" y="330" width="392" height="96" rx="12" fill="#eaf2ea"/>
  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">A theme is not found once — it is followed.</text>
  <text x="256" y="386" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#3a5a3a">Each bead is one recurrence: where it appeared,</text>
  <text x="256" y="408" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#3a5a3a">and how the idea has grown since the last bead.</text>

  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Keep the thread with you — it grows with every sitting.</text>
</svg>
