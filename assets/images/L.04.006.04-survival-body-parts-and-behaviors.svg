<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" font-family="sans-serif">
  <title>Body parts and behaviors help survival</title>
  <desc>Three animals in a row. A bird has a long beak labeled for reaching food, a camel has a hump labeled for storing energy for long dry journeys, and a frog has strong legs labeled for jumping. Each label notes how the body part helps the animal survive in its environment.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-size="26" fill="#222222" font-weight="bold">Adaptations help animals survive</text>

  <!-- Bird -->
  <rect x="30" y="80" width="140" height="300" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="100" y="110" text-anchor="middle" font-size="19" fill="#2b3a42" font-weight="bold">A bird</text>
  <circle cx="100" cy="190" r="34" fill="#6b93b6" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="92" cy="184" r="5" fill="#222222"/>
  <path d="M122 196 L168 206 L122 212 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M100 224 L96 260 L104 260 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="100" y="300" text-anchor="middle" font-size="16" fill="#222222">Long beak</text>
  <text x="100" y="322" text-anchor="middle" font-size="14" fill="#4f6d7a">reaches food</text>
  <text x="100" y="348" text-anchor="middle" font-size="14" fill="#4f6d7a">deep in mud</text>

  <!-- Camel -->
  <rect x="186" y="80" width="140" height="300" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="110" text-anchor="middle" font-size="19" fill="#2b3a42" font-weight="bold">A camel</text>
  <ellipse cx="256" cy="190" rx="34" ry="26" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <path d="M240 166 Q256 130 272 166" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="246" cy="184" r="4" fill="#222222"/>
  <line x1="238" y1="216" x2="238" y2="258" stroke="#2b3a42" stroke-width="6"/>
  <line x1="274" y1="216" x2="274" y2="258" stroke="#2b3a42" stroke-width="6"/>
  <text x="256" y="300" text-anchor="middle" font-size="16" fill="#222222">Hump</text>
  <text x="256" y="322" text-anchor="middle" font-size="14" fill="#4f6d7a">stores energy for</text>
  <text x="256" y="348" text-anchor="middle" font-size="14" fill="#4f6d7a">long dry journeys</text>

  <!-- Frog -->
  <rect x="342" y="80" width="140" height="300" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="412" y="110" text-anchor="middle" font-size="19" fill="#2b3a42" font-weight="bold">A frog</text>
  <ellipse cx="412" cy="200" rx="30" ry="22" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="424" cy="192" r="6" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="426" cy="192" r="3" fill="#222222"/>
  <path d="M396 220 Q382 268 370 280" fill="none" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
  <path d="M428 220 Q442 268 454 280" fill="none" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
  <text x="412" y="300" text-anchor="middle" font-size="16" fill="#222222">Strong legs</text>
  <text x="412" y="322" text-anchor="middle" font-size="14" fill="#4f6d7a">power a big leap</text>
  <text x="412" y="348" text-anchor="middle" font-size="14" fill="#4f6d7a">to escape danger</text>

  <rect x="40" y="410" width="432" height="60" rx="12" fill="#e0a458" opacity="0.22" stroke="#e0a458" stroke-width="2"/>
  <text x="256" y="438" text-anchor="middle" font-size="18" fill="#222222">A body part or a behavior fits each animal to its home.</text>
  <text x="256" y="460" text-anchor="middle" font-size="15" fill="#4f6d7a">None is better — each is fitted to its own place.</text>
</svg>
