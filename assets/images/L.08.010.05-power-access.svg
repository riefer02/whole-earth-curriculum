<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Power and access shape whose rights are protected</title>
  <desc id="desc">A door labeled rights protected. Two paths lead to it: a wide, open path labeled access for some, and a narrow, blocked path labeled barriers for others. Barriers listed are cost, distance, information, and rules that favor some.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Whose Rights Are Protected?</text>

  <!-- door -->
  <rect x="216" y="250" width="80" height="120" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="282" cy="310" r="5" fill="#2b3a42"/>
  <text x="256" y="392" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">rights</text>
  <text x="256" y="407" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">protected</text>

  <!-- wide open path (left) -->
  <path d="M60 150 Q150 200 216 290" fill="none" stroke="#7a9e7e" stroke-width="6"/>
  <text x="86" y="128" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">access for some</text>
  <text x="52" y="148" font-family="sans-serif" font-size="11" fill="#4f6d7a">power, money,</text>
  <text x="52" y="164" font-family="sans-serif" font-size="11" fill="#4f6d7a">connections open</text>
  <text x="52" y="180" font-family="sans-serif" font-size="11" fill="#4f6d7a">the way</text>

  <!-- blocked path (right) -->
  <path d="M452 150 Q380 200 300 285" fill="none" stroke="#4f6d7a" stroke-width="4" stroke-dasharray="8 6"/>
  <rect x="330" y="196" width="66" height="18" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="363" y="209" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#222222">barrier</text>
  <text x="452" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">barriers for others</text>
  <text x="386" y="150" font-family="sans-serif" font-size="11" fill="#4f6d7a">cost, distance,</text>
  <text x="386" y="166" font-family="sans-serif" font-size="11" fill="#4f6d7a">no information,</text>
  <text x="386" y="182" font-family="sans-serif" font-size="11" fill="#4f6d7a">rules that favor some</text>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Power and access — not need alone — shape who gets through.</text>
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">A right on paper is only real when a person can reach it.</text>
</svg>
