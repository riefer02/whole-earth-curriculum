<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-06-006-11-rock-cycle desc-L-06-006-11-rock-cycle">
  <title id="title-L-06-006-11-rock-cycle">The rock cycle</title>
  <desc id="desc-L-06-006-11-rock-cycle">A circular diagram of the rock cycle. At the top, a volcano releases magma labeled magma, which cools into an igneous rock labeled igneous, made by cooling. An arrow leads to weathering and erosion, which breaks rock into grains labeled sediment, pressing into a layered rock labeled sedimentary, made by pressing layers. Heat and pressure turn this into a folded rock labeled metamorphic, changed by heat and pressure, which then melts back into magma, completing the loop. A caption reads: Earth's rock is recycled — broken down and made again, over and over. Labels, arrows, and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">The Rock Cycle</text>
  <text x="256" y="56" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">rock is broken down and made again, over and over</text>

  <defs>
    <marker id="ra-L-06-006-11-rock-cycle" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2b3a42"/>
    </marker>
  </defs>

  <!-- circular loop -->
  <circle cx="256" cy="270" r="140" fill="none" stroke="#d7d1c8" stroke-width="2"/>

  <!-- magma (top) -->
  <g>
    <path d="M 216 120 L 256 90 L 296 120 L 272 142 L 240 142 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">magma</text>
    <text x="256" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">melted rock</text>
  </g>

  <!-- igneous (top right) -->
  <g>
    <rect x="364" y="126" width="92" height="48" rx="8" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <text x="410" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">igneous</text>
    <text x="410" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">made by cooling</text>
  </g>

  <!-- weathering/erosion (right, lower) -->
  <g>
    <text x="430" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">weathering</text>
    <text x="430" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">&amp; erosion</text>
    <g fill="#e0a458" stroke="#2b3a42" stroke-width="1.5">
      <circle cx="410" cy="324" r="3"/><circle cx="422" cy="330" r="3"/><circle cx="436" cy="324" r="3"/><circle cx="448" cy="330" r="3"/>
    </g>
  </g>

  <!-- sediment (bottom right) -->
  <g>
    <rect x="316" y="348" width="88" height="44" rx="8" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
    <text x="360" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">sediment</text>
    <text x="360" y="388" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">loose grains</text>
  </g>

  <!-- sedimentary (bottom) -->
  <g>
    <rect x="190" y="386" width="132" height="48" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="190" y1="400" x2="322" y2="400" stroke="#2b3a42" stroke-width="1.5"/>
    <line x1="190" y1="414" x2="322" y2="414" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="256" y="428" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">sedimentary</text>
    <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">made by pressing layers</text>
  </g>

  <!-- metamorphic (bottom left) -->
  <g>
    <path d="M 120 324 Q 164 310 208 330 Q 164 346 120 324 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 128 336 Q 164 324 200 340" fill="none" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="164" y="366" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">metamorphic</text>
    <text x="164" y="384" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">changed by heat &amp; pressure</text>
  </g>

  <!-- process arrows -->
  <line x1="300" y1="112" x2="380" y2="142" stroke="#2b3a42" stroke-width="3" marker-end="url(#ra-L-06-006-11-rock-cycle)"/>
  <text x="360" y="120" font-family="sans-serif" font-size="11" fill="#222222">cools</text>

  <line x1="452" y1="196" x2="452" y2="266" stroke="#2b3a42" stroke-width="3" marker-end="url(#ra-L-06-006-11-rock-cycle)"/>
  <text x="470" y="234" font-family="sans-serif" font-size="11" fill="#222222">breaks</text>

  <line x1="404" y1="324" x2="376" y2="352" stroke="#2b3a42" stroke-width="3" marker-end="url(#ra-L-06-006-11-rock-cycle)"/>

  <line x1="322" y1="404" x2="262" y2="404" stroke="#2b3a42" stroke-width="3" marker-end="url(#ra-L-06-006-11-rock-cycle)"/>
  <text x="328" y="408" font-family="sans-serif" font-size="11" fill="#222222">presses</text>

  <line x1="196" y1="388" x2="156" y2="362" stroke="#2b3a42" stroke-width="3" marker-end="url(#ra-L-06-006-11-rock-cycle)"/>

  <line x1="82" y1="330" x2="150" y2="210" stroke="#2b3a42" stroke-width="3" marker-end="url(#ra-L-06-006-11-rock-cycle)"/>
  <text x="70" y="270" font-family="sans-serif" font-size="11" fill="#222222">heat &amp; pressure</text>

  <line x1="170" y1="150" x2="230" y2="116" stroke="#2b3a42" stroke-width="3" marker-end="url(#ra-L-06-006-11-rock-cycle)"/>
  <text x="186" y="122" font-family="sans-serif" font-size="11" fill="#222222">melts</text>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">Earth's rock is recycled</text>
  <text x="256" y="494" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">the oldest recycling system on Earth</text>
</svg>
