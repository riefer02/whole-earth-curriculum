<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The rock cycle</title>
  <desc id="desc">A circular diagram of the rock cycle. At the top, a volcano releases magma labeled magma, which cools into an igneous rock labeled igneous, made by cooling. An arrow leads to weathering and erosion, which breaks rock into grains labeled sediment, pressing into a layered rock labeled sedimentary, made by pressing layers. Heat and pressure turn this into a folded rock labeled metamorphic, changed by heat and pressure, which then melts back into magma, completing the loop. A caption reads: Earth's rock is recycled — broken down and made again, over and over. Labels, arrows, and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">The Rock Cycle</text>
  <text x="256" y="56" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">rock is broken down and made again, over and over</text>

  <defs>
    <marker id="ra" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2b3a42"/>
    </marker>
  </defs>

  <!-- circular loop -->
  <circle cx="256" cy="270" r="140" fill="none" stroke="#d7d1c8" stroke-width="2"/>

  <!-- magma (top) -->
  <g transform="translate(256, 90)">
    <path d="M-40,30 L0,0 L40,30 L16,52 L-16,52 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="0" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">magma</text>
    <text x="0" y="88" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">melted rock</text>
  </g>

  <!-- igneous (top right) -->
  <g transform="translate(410, 150)">
    <rect x="-46" y="-24" width="92" height="48" rx="8" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <text x="0" y="2" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">igneous</text>
    <text x="0" y="20" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">made by cooling</text>
  </g>

  <!-- weathering/erosion (right, lower) -->
  <g transform="translate(430, 290)">
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">weathering</text>
    <text x="0" y="16" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">&amp; erosion</text>
    <g fill="#e0a458" stroke="#2b3a42" stroke-width="1.5">
      <circle cx="-20" cy="34" r="3"/><circle cx="-8" cy="40" r="3"/><circle cx="6" cy="34" r="3"/><circle cx="18" cy="40" r="3"/>
    </g>
  </g>

  <!-- sediment (bottom right) -->
  <g transform="translate(360, 370)">
    <rect x="-44" y="-22" width="88" height="44" rx="8" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">sediment</text>
    <text x="0" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">loose grains</text>
  </g>

  <!-- sedimentary (bottom) -->
  <g transform="translate(256, 410)">
    <rect x="-66" y="-24" width="132" height="48" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="-66" y1="-10" x2="66" y2="-10" stroke="#2b3a42" stroke-width="1.5"/>
    <line x1="-66" y1="4" x2="66" y2="4" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="0" y="18" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">sedimentary</text>
    <text x="0" y="34" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">made by pressing layers</text>
  </g>

  <!-- metamorphic (bottom left) -->
  <g transform="translate(120, 350)">
    <path d="M0,-26 Q44,-40 88,-20 Q44,-4 0,-26 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M8,-14 Q44,-26 80,-10" fill="none" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="44" y="16" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">metamorphic</text>
    <text x="44" y="34" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">changed by heat &amp; pressure</text>
  </g>

  <!-- process arrows -->
  <line x1="300" y1="112" x2="380" y2="142" stroke="#2b3a42" stroke-width="3" marker-end="url(#ra)"/>
  <text x="360" y="120" font-family="sans-serif" font-size="11" fill="#222222">cools</text>

  <line x1="452" y1="196" x2="452" y2="266" stroke="#2b3a42" stroke-width="3" marker-end="url(#ra)"/>
  <text x="470" y="234" font-family="sans-serif" font-size="11" fill="#222222">breaks</text>

  <line x1="404" y1="324" x2="376" y2="352" stroke="#2b3a42" stroke-width="3" marker-end="url(#ra)"/>

  <line x1="322" y1="404" x2="262" y2="404" stroke="#2b3a42" stroke-width="3" marker-end="url(#ra)"/>
  <text x="300" y="398" font-family="sans-serif" font-size="11" fill="#222222">presses</text>

  <line x1="196" y1="388" x2="156" y2="362" stroke="#2b3a42" stroke-width="3" marker-end="url(#ra)"/>

  <line x1="82" y1="330" x2="150" y2="210" stroke="#2b3a42" stroke-width="3" marker-end="url(#ra)"/>
  <text x="70" y="270" font-family="sans-serif" font-size="11" fill="#222222">heat &amp; pressure</text>

  <line x1="170" y1="150" x2="230" y2="116" stroke="#2b3a42" stroke-width="3" marker-end="url(#ra)"/>
  <text x="186" y="122" font-family="sans-serif" font-size="11" fill="#222222">melts</text>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">Earth's rock is recycled</text>
  <text x="256" y="494" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">the oldest recycling system on Earth</text>
</svg>
