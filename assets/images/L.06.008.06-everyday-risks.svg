<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Everyday risks — choose the safer action</title>
  <desc id="desc">A three-panel diagram titled "everyday risks — choose the safer action." Panel one "play" shows a child warming up before a game with the label "warm up, wear a helmet, play fair." Panel two "travel" shows a child looking both ways before crossing with the label "look, listen, cross safely." Panel three "online" shows a screen with a lock and the labels "keep personal information private" and "tell a trusted adult if something feels wrong." A caption reads "Notice, think, choose the safer way." Labels, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Everyday Risks — Choose the Safer Action</text>

  <!-- Panel 1: play -->
  <rect x="24" y="58" width="144" height="240" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="96" y="82" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">play</text>
  <circle cx="96" cy="140" r="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="90" cy="136" r="2" fill="#2b3a42"/>
  <circle cx="102" cy="136" r="2" fill="#2b3a42"/>
  <path d="M91 148 Q96 152 101 148" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="80" y="158" width="32" height="50" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <line x1="80" y1="170" x2="60" y2="192" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <line x1="112" y1="170" x2="132" y2="192" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <line x1="88" y1="208" x2="86" y2="236" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <line x1="104" y1="208" x2="106" y2="236" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <circle cx="72" cy="176" r="12" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="96" y="268" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">warm up, wear a</text>
  <text x="96" y="284" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">helmet, play fair</text>

  <!-- Panel 2: travel -->
  <rect x="184" y="58" width="144" height="240" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="82" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">travel</text>
  <line x1="184" y1="200" x2="328" y2="200" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="228" y1="200" x2="252" y2="200"/>
    <line x1="268" y1="200" x2="292" y2="200"/>
  </g>
  <circle cx="246" cy="168" r="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="240" cy="164" r="2" fill="#2b3a42"/>
  <circle cx="252" cy="164" r="2" fill="#2b3a42"/>
  <path d="M241 176 Q246 180 251 176" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="232" y="186" width="28" height="40" rx="9" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <line x1="238" y1="226" x2="236" y2="250" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <line x1="254" y1="226" x2="256" y2="250" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M236 156 Q226 146 214 152" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <path d="M256 156 Q266 146 278 152" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <text x="256" y="268" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">look, listen,</text>
  <text x="256" y="284" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">cross safely</text>

  <!-- Panel 3: online -->
  <rect x="344" y="58" width="144" height="240" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="416" y="82" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">online</text>
  <rect x="372" y="98" width="88" height="62" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <line x1="416" y1="160" x2="416" y2="172" stroke="#2b3a42" stroke-width="2"/>
  <line x1="402" y1="172" x2="430" y2="172" stroke="#2b3a42" stroke-width="2"/>
  <rect x="402" y="122" width="18" height="12" rx="2" fill="#2b3a42"/>
  <path d="M404 122 L404 118 A7 7 0 0 1 418 118 L418 122" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <text x="416" y="196" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">keep personal</text>
  <text x="416" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">information private</text>
  <text x="416" y="236" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">tell a trusted adult</text>
  <text x="416" y="252" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">if something feels</text>
  <text x="416" y="268" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">wrong</text>

  <text x="256" y="336" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">Notice, think, choose the safer way.</text>
  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">A risk is a chance of harm — and a safer choice lowers the chance.</text>
</svg>
