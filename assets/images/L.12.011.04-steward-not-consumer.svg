<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Steward, Not Consumer</title>
  <desc id="desc">Two diverging paths. The upper path is labeled 'consumer — take, use, discard' and leads to a broken, discarded object. The lower path is labeled 'steward — choose, use, repair, share, care' and leads to a cared-for object beside a small plant. Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42" font-weight="bold">Two Paths for a Tool</text>

  <!-- upper path -->
  <text x="150" y="86" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#e0a458" font-weight="bold">consumer</text>
  <path d="M 90 120 C 150 170, 300 170, 380 260" fill="none" stroke="#e0a458" stroke-width="4"/>
  <text x="256" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">take, use, discard</text>

  <!-- lower path -->
  <text x="150" y="300" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#7a9e7e" font-weight="bold">steward</text>
  <path d="M 90 340 C 150 390, 300 390, 380 430" fill="none" stroke="#7a9e7e" stroke-width="4"/>
  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">choose, use, repair, share, care</text>

  <!-- start node -->
  <circle cx="90" cy="230" r="26" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <text x="90" y="235" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">a tool</text>

  <!-- upper outcome: broken object -->
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <rect x="400" y="248" width="66" height="34" rx="4"/>
    <line x1="400" y1="272" x2="388" y2="286"/>
    <line x1="430" y1="272" x2="442" y2="288"/>
  </g>
  <text x="416" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">worn out,</text>
  <text x="416" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">discarded</text>

  <!-- lower outcome: cared-for object + plant -->
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <rect x="398" y="418" width="66" height="34" rx="4"/>
    <line x1="398" y1="428" x2="408" y2="428"/>
  </g>
  <path d="M 470 436 q 6 -18 14 0 q 6 -22 12 0 q -6 -18 2 -16 q 4 -22 8 0" fill="none" stroke="#7a9e7e" stroke-width="2"/>
  <line x1="484" y1="452" x2="484" y2="436" stroke="#7a9e7e" stroke-width="2"/>
  <text x="434" y="472" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">kept working,</text>
  <text x="434" y="488" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">passed on</text>
</svg>
