<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Water, my body's everyday drink</title>
  <desc id="desc">A child drinks from a cup on the left. In the middle, a body drawing shows water in the blood, tears, and sweat, labeled water is in every part of me. On the right, three sources of clean water — a tap, a well, and a boiled kettle. The words drink when thirsty and do not waste appear at the bottom. Labels and shapes carry the idea, and the picture reads clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Water, My Body&#8217;s Drink</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Water is in every part of me.</text>

  <!-- Child drinking -->
  <g>
    <circle cx="120" cy="150" r="20" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M120 170 l0 44" stroke="#2b3a42" stroke-width="4"/>
    <path d="M120 190 l-20 18 M120 190 l20 18" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M120 214 l-12 40 M120 214 l12 40" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M120 254 l-8 40 M120 254 l8 40" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M108 214 l-24 20" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M158 150 q10 -12 16 -14 q6 8 2 16 q-4 8 -10 10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="120" y="336" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">drink when thirsty</text>
  </g>

  <!-- Body with water -->
  <g>
    <circle cx="256" cy="150" r="18" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M256 168 l0 66" stroke="#2b3a42" stroke-width="4"/>
    <path d="M256 186 l-20 16 M256 186 l20 16" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M256 234 l-14 46 M256 234 l14 46" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M240 250 q-10 14 0 26" fill="none" stroke="#6b93b6" stroke-width="5" stroke-linecap="round"/>
    <circle cx="256" cy="150" r="4" fill="#6b93b6"/>
    <circle cx="248" cy="200" r="4" fill="#6b93b6"/>
    <circle cx="264" cy="230" r="4" fill="#6b93b6"/>
    <circle cx="256" cy="286" r="4" fill="#6b93b6"/>
    <text x="256" y="336" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">water in blood, tears, sweat</text>
  </g>

  <!-- Sources -->
  <g>
    <text x="392" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">sources of clean water</text>
    <path d="M392 140 q0 -10 8 -10 q4 0 5 4 l8 20 l-22 0 Z" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <path d="M392 158 l0 20" stroke="#6b93b6" stroke-width="6" stroke-linecap="round"/>
    <path d="M384 184 q8 14 0 26" fill="none" stroke="#6b93b6" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <text x="392" y="228" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">tap</text>

    <path d="M352 250 h26 v-14 h10 v14 h26 v30 h-62 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M378 250 l0 -26" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="378" cy="212" r="8" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <text x="383" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">well</text>

    <path d="M416 260 h26 q10 0 10 10 q0 10 -10 10 h-22" fill="none" stroke="#4f6d7a" stroke-width="3"/>
    <path d="M420 256 q12 -10 22 -4" fill="none" stroke="#6b93b6" stroke-width="3" opacity="0.8"/>
    <text x="440" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">boiled</text>
  </g>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">Water is precious — use just enough, never waste.</text>
</svg>
