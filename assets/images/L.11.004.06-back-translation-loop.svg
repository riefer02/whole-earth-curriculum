<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Back-translation drift</title>
  <desc id="desc">A loop diagram. A sentence in language A is translated to language B, then back to language A, where it has visibly drifted from the original — words differ and a meaning has shifted. A warning note reads: machine translation gives quick gist, but misses tone, idioms, and nuance, and works unevenly across languages.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="30" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">The Back-Translation Test</text>

  <!-- Original -->
  <rect x="40" y="60" width="200" height="64" rx="9" fill="#eaf2ea" stroke="#7a9e7e" stroke-width="2"/>
  <text x="140" y="84" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a5a3a">language A (original)</text>
  <line x1="58" y1="96" x2="222" y2="96" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="110" x2="200" y2="110" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>

  <!-- Forward arrow -->
  <path d="M246 92 h60" stroke="#4f6d7a" stroke-width="2.5" fill="none" marker-end=""/>
  <text x="276" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">translate</text>

  <!-- Language B -->
  <rect x="312" y="60" width="160" height="64" rx="9" fill="#dce9f0" stroke="#2b3a42" stroke-width="2"/>
  <text x="392" y="84" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a5a6a">language B</text>
  <line x1="330" y1="96" x2="454" y2="96" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <line x1="330" y1="110" x2="440" y2="110" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>

  <!-- Back arrow -->
  <path d="M392 124 C 392 200, 140 200, 140 124" stroke="#e0a458" stroke-width="2.5" fill="none" marker-end=""/>
  <text x="266" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a6d4a">translate back</text>

  <!-- Returned -->
  <rect x="40" y="240" width="200" height="64" rx="9" fill="#f6ead8" stroke="#e0a458" stroke-width="2"/>
  <text x="140" y="264" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8a6d4a">language A (returned)</text>
  <line x1="58" y1="276" x2="210" y2="276" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="290" x2="186" y2="290" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>

  <!-- Drift note -->
  <path d="M140 304 v26 M140 316 h10" stroke="#e0a458" stroke-width="2" fill="none"/>
  <text x="160" y="336" font-family="sans-serif" font-size="14" fill="#8a6d4a">it came back different — meaning drifted</text>

  <rect x="60" y="366" width="392" height="112" rx="12" fill="#fdfbf7" stroke="#6b93b6" stroke-width="2"/>
  <text x="256" y="394" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Machine translation gives quick gist,</text>
  <text x="256" y="416" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">but misses tone, idioms, and nuance —</text>
  <text x="256" y="438" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">and works unevenly across languages.</text>
  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3a5a6a">Where meaning matters, a human is still needed.</text>
</svg>
