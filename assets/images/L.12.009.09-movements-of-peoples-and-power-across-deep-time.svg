<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Movements of Peoples and Power Across Deep Time</title>
  <desc id="desc">A simplified world map with four labeled arrows of different line styles: "out of Africa, roughly 300,000 years ago"; "Silk Roads and Indian Ocean trade"; "the transatlantic slave trade, forced"; and "modern displacement, chosen and forced." Each arrow is labeled by movement and by whether it was chosen or forced, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42" font-weight="bold">Movements of Peoples Across Deep Time</text>

  <!-- simplified continents -->
  <path d="M90 150 Q130 120 190 130 Q230 150 220 200 Q210 230 170 240 Q120 250 90 210 Z" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <text x="155" y="195" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Africa</text>

  <path d="M240 120 Q330 100 380 130 Q420 160 400 220 Q380 260 330 260 Q270 250 250 200 Z" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <text x="320" y="195" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Eurasia</text>

  <path d="M90 300 Q140 290 180 310 Q190 360 150 380 Q100 380 80 340 Z" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <text x="130" y="345" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Americas</text>

  <path d="M380 330 Q430 320 450 350 Q440 390 390 390 Z" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <text x="418" y="365" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Oceania</text>

  <!-- arrows -->
  <!-- out of africa -->
  <path d="M180 180 Q230 140 300 140" fill="none" stroke="#6b93b6" stroke-width="4"/>
  <polygon points="300,140 288,134 288,146" fill="#6b93b6"/>
  <text x="240" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2b3a42">out of Africa (~300,000 yrs)</text>

  <!-- silk roads -->
  <path d="M260 180 Q340 190 360 230" fill="none" stroke="#e0a458" stroke-width="4" stroke-dasharray="9 5"/>
  <polygon points="360,230 348,224 352,238" fill="#e0a458"/>
  <text x="330" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2b3a42">Silk Roads and Indian Ocean</text>

  <!-- transatlantic -->
  <path d="M130 280 Q200 250 200 210" fill="none" stroke="#2b3a42" stroke-width="4"/>
  <polygon points="200,210 190,214 196,224" fill="#2b3a42"/>
  <text x="110" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2b3a42">transatlantic slave trade</text>
  <text x="110" y="286" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4f6d7a">(forced)</text>

  <!-- modern displacement -->
  <path d="M300 260 Q380 280 400 340" fill="none" stroke="#7a9e7e" stroke-width="4" stroke-dasharray="4 6"/>
  <polygon points="400,340 388,336 392,350" fill="#7a9e7e"/>
  <text x="380" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2b3a42">modern displacement</text>
  <text x="380" y="302" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4f6d7a">(chosen and forced)</text>

  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">For each: who moved, why — and who held the power to decide?</text>
  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Movement is the human story, not an interruption of it.</text>
</svg>
