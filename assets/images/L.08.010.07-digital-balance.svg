<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Digital civic participation: benefits and risks</title>
  <desc id="desc">A balance scale with two pans. The left pan labeled benefits holds reach, speed, and coordination. The right pan labeled risks holds misinformation, surveillance, and harassment. A question in the middle asks how to weigh them.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Digital Tools Change Civic Life</text>

  <!-- beam -->
  <line x1="96" y1="200" x2="416" y2="200" stroke="#2b3a42" stroke-width="3"/>
  <line x1="256" y1="200" x2="256" y2="232" stroke="#2b3a42" stroke-width="3"/>
  <path d="M256 232 L240 250 L272 250 Z" fill="#2b3a42"/>

  <!-- left pan -->
  <path d="M96 200 L96 240" stroke="#2b3a42" stroke-width="2"/>
  <path d="M96 240 Q96 272 128 272 L192 272" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <rect x="84" y="272" width="120" height="92" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="108" cy="296" r="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="120" y="300" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">Benefits</text>
  <text x="94" y="322" font-family="sans-serif" font-size="11" fill="#4f6d7a">reach far, spread</text>
  <text x="94" y="338" font-family="sans-serif" font-size="11" fill="#4f6d7a">fast, coordinate</text>
  <text x="94" y="354" font-family="sans-serif" font-size="11" fill="#4f6d7a">many people</text>

  <!-- right pan -->
  <path d="M416 200 L416 240" stroke="#2b3a42" stroke-width="2"/>
  <path d="M416 240 Q416 272 384 272 L320 272" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <rect x="308" y="272" width="120" height="92" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="332" cy="296" r="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="344" y="300" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">Risks</text>
  <text x="318" y="322" font-family="sans-serif" font-size="11" fill="#4f6d7a">false stories,</text>
  <text x="318" y="338" font-family="sans-serif" font-size="11" fill="#4f6d7a">surveillance,</text>
  <text x="318" y="354" font-family="sans-serif" font-size="11" fill="#4f6d7a">harassment</text>

  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Weigh them — then choose how to organize.</text>
  <text x="256" y="446" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">The same tool can lift voices up and let false stories spread.</text>
  <text x="256" y="464" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Check before you share; protect the people you organize with.</text>
</svg>
