<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Two views, one event</title>
  <desc id="desc">A chart with one event in the center — a sudden rain shower — splitting into two thought bubbles: "my view: my picnic is spoiled" and "your view: my garden is watered". A row beneath reads "alike: both noticed the rain" and "different: one hoped it would stop, one hoped it would fall". The words and shapes carry the meaning, not color, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Two Views, One Event</text>

  <!-- Event in center -->
  <rect x="186" y="120" width="140" height="76" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="150" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">the same event</text>
  <text x="256" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">a sudden rainstorm</text>

  <!-- Rain cloud above event -->
  <path d="M216 96 Q232 76 248 96 Q264 84 276 96 Q292 84 300 98" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#6b93b6" stroke-width="2" stroke-linecap="round">
    <path d="M226 110 L222 122"/><path d="M256 108 L252 120"/><path d="M286 110 L282 122"/>
  </g>

  <!-- Left view bubble -->
  <rect x="40" y="200" width="150" height="64" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="115" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">my view</text>
  <text x="115" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">my picnic</text>
  <text x="115" y="261" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">is spoiled</text>

  <!-- Right view bubble -->
  <rect x="322" y="200" width="150" height="64" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="397" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">your view</text>
  <text x="397" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">my garden</text>
  <text x="397" y="261" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">is watered</text>

  <!-- Compare row -->
  <rect x="40" y="296" width="210" height="66" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="145" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">alike</text>
  <text x="145" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">we both noticed the rain</text>

  <rect x="262" y="296" width="210" height="66" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="367" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">different</text>
  <text x="367" y="338" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">one hoped it would stop,</text>
  <text x="367" y="353" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">one hoped it would fall</text>

  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">Two views can both be true.</text>
  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Where you stand shapes what you see.</text>
</svg>
