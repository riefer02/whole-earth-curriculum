<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The Design Cycle</title>
  <desc id="desc">A circular design-process loop with six steps — name the problem, imagine, plan, create, test, and improve — connected by arrows that return from improve back to imagine, showing the cycle repeating as a prototype is refined.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">The Design Cycle</text>

  <!-- Six nodes in a circle -->
  <circle cx="256" cy="150" r="54" fill="#7a9e7e" fill-opacity="0.25" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="144" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">Name the</text>
  <text x="256" y="164" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">problem</text>

  <circle cx="404" cy="235" r="50" fill="#e0a458" fill-opacity="0.25" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="404" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">Imagine</text>

  <circle cx="330" cy="375" r="50" fill="#6b93b6" fill-opacity="0.25" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="330" y="380" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">Plan</text>

  <circle cx="182" cy="375" r="50" fill="#4f6d7a" fill-opacity="0.25" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="182" y="380" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">Create</text>

  <circle cx="108" cy="235" r="50" fill="#7a9e7e" fill-opacity="0.25" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="108" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">Test</text>

  <circle cx="256" cy="290" r="0" fill="none"/>

  <!-- Arrows -->
  <line x1="300" y1="186" x2="362" y2="220" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="362,220 350,214 356,226" fill="#2b3a42"/>

  <line x1="384" y1="283" x2="352" y2="330" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="352,330 356,318 344,322" fill="#2b3a42"/>

  <line x1="286" y1="375" x2="226" y2="375" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="226,375 238,369 238,381" fill="#2b3a42"/>

  <line x1="140" y1="330" x2="120" y2="283" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="120,283 130,290 128,278" fill="#2b3a42"/>

  <line x1="150" y1="200" x2="204" y2="168" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="204,168 192,166 198,178" fill="#2b3a42"/>

  <!-- Improve node (center) -->
  <circle cx="256" cy="280" r="46" fill="#e0a458" fill-opacity="0.4" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="286" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">Improve</text>

  <!-- Return arrow -->
  <path d="M 256 326 C 256 400, 404 360, 404 287" fill="none" stroke="#e0a458" stroke-width="2.5" stroke-dasharray="7 5"/>
  <polygon points="404,287 398,299 410,297" fill="#e0a458"/>

  <!-- Caption -->
  <rect x="110" y="440" width="292" height="56" rx="8" fill="#ffffff" stroke="#e0a458" stroke-width="2"/>
  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">The loop repeats as many times</text>
  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">as the design needs.</text>
</svg>
