<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Energy Trade-Offs</title>
  <desc id="desc">A balance scale weighing environmental and social costs on one side against benefits on the other for an energy source, with labeled weights for emissions, land, water, waste, jobs, and access.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Weighing an Energy Source</text>

  <!-- Balance scale -->
  <line x1="256" y1="70" x2="256" y2="180" stroke="#2b3a42" stroke-width="4"/>
  <line x1="120" y1="130" x2="392" y2="130" stroke="#2b3a42" stroke-width="4"/>
  <path d="M120 130 l-10 -20 l10 20 l10 -20 z" fill="#2b3a42"/>
  <path d="M392 130 l-10 -20 l10 20 l10 -20 z" fill="#2b3a42"/>
  <line x1="256" y1="170" x2="256" y2="200" stroke="#2b3a42" stroke-width="3"/>

  <!-- Left pan: costs -->
  <text x="128" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e0a458" font-weight="bold">Costs</text>
  <g font-family="sans-serif" font-size="13" fill="#222222">
    <text x="128" y="236">emissions</text>
    <text x="128" y="258">land &#038; water use</text>
    <text x="128" y="280">waste</text>
  </g>

  <!-- Right pan: benefits -->
  <text x="384" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#7a9e7e" font-weight="bold">Benefits</text>
  <g font-family="sans-serif" font-size="13" fill="#222222">
    <text x="384" y="236">reliable power</text>
    <text x="384" y="258">jobs &#038; income</text>
    <text x="384" y="280">energy access</text>
  </g>

  <!-- Justice note -->
  <text x="256" y="340" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">The burden falls unevenly</text>
  <text x="256" y="366" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Who breathes the smoke, loses the land, or goes without?</text>
  <text x="256" y="392" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">The &#8220;cleanest&#8221; and the &#8220;fairest&#8221; source are not always the same.</text>

  <text x="256" y="482" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">The question is not &#8220;which is perfect?&#8221; but &#8220;which mix is fairest?&#8221;</text>
</svg>
