<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Key details of a read-aloud: keeping what matters, setting aside the rest</title>
  <desc id="desc">A listener holds a notepad. Beside the notepad, four boxes are labeled "key detail" with check marks, and one extra box labeled "extra" is crossed out. This shows how a listener keeps the important details and sets aside the rest. Simple shapes, grayscale-printable.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Listening for Key Details</text>

  <!-- Book -->
  <g>
    <rect x="48" y="150" width="130" height="180" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M113 150 L113 330" stroke="#2b3a42" stroke-width="2"/>
    <line x1="68" y1="188" x2="98" y2="188" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
    <line x1="68" y1="214" x2="98" y2="214" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
    <line x1="68" y1="240" x2="90" y2="240" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
    <line x1="126" y1="188" x2="158" y2="188" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
    <line x1="126" y1="214" x2="158" y2="214" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
    <line x1="126" y1="240" x2="150" y2="240" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Listener -->
  <g>
    <circle cx="200" cy="250" r="28" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M170 296 Q200 286 230 296 L230 332 L170 332 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M186 286 L178 262 M214 286 L222 262" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Notepad -->
  <rect x="256" y="140" width="150" height="180" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <line x1="276" y1="168" x2="388" y2="168" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <line x1="276" y1="196" x2="388" y2="196" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <line x1="276" y1="224" x2="360" y2="224" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>

  <!-- Key detail checkboxes -->
  <g font-family="sans-serif" font-size="18" fill="#222222">
    <rect x="44" y="360" width="20" height="20" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M48 370 L52 375 L62 363" fill="none" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
    <text x="74" y="376">key detail</text>

    <rect x="186" y="360" width="20" height="20" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M190 370 L194 375 L204 363" fill="none" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
    <text x="216" y="376">key detail</text>

    <rect x="320" y="360" width="20" height="20" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M324 370 L328 375 L338 363" fill="none" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
    <text x="350" y="376">key detail</text>
  </g>

  <!-- Extra crossed-out box -->
  <g>
    <rect x="44" y="412" width="20" height="20" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <line x1="42" y1="410" x2="66" y2="434" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
    <line x1="66" y1="410" x2="42" y2="434" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
    <text x="74" y="428" font-family="sans-serif" font-size="18" fill="#222222">extra (set aside)</text>
  </g>
</svg>
