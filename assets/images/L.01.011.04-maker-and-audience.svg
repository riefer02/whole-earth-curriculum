<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Who made it, and who is it for</title>
  <desc id="desc">Two cards teach that every picture and story has a maker and an audience. The first card shows a "wash your hands" sign, labeled maker: a nurse who cares about health, and audience: everyone who uses the sink. The second card shows a picture book cover with the names of the author, who wrote the words, and the illustrator, who drew the pictures, and labels the audience: children who love stories. The words "maker" and "audience" and the name labels carry the meaning, not color, so the picture prints clearly in grayscale. The closing line teaches that every message comes from a maker and goes to an audience, and every kind of maker matters.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Who Made It, and for Whom?</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Every picture and story has a maker and an audience</text>

  <!-- cards -->
  <rect x="20" y="90" width="226" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="266" y="90" width="226" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>

  <text x="133" y="114" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">a sign</text>
  <text x="379" y="114" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">a picture book</text>

  <!-- ===== sign card ===== -->
  <rect x="48" y="128" width="170" height="78" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="133" y="158" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">Wash your hands</text>
  <!-- hands under a tap -->
  <path d="M118 190 Q133 184 148 190" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="127" cy="196" r="4" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="139" cy="196" r="4" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="133" y1="172" x2="133" y2="178" stroke="#6b93b6" stroke-width="2" stroke-linecap="round"/>
  <line x1="133" y1="172" x2="130" y2="178" stroke="#6b93b6" stroke-width="2" stroke-linecap="round"/>
  <line x1="133" y1="172" x2="136" y2="178" stroke="#6b93b6" stroke-width="2" stroke-linecap="round"/>

  <text x="133" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">maker</text>
  <text x="133" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">a nurse who cares</text>
  <text x="133" y="262" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">about health</text>
  <line x1="60" y1="274" x2="206" y2="274" stroke="#2b3a42" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="133" y="296" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">audience</text>
  <text x="133" y="314" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">everyone who</text>
  <text x="133" y="332" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">uses the sink</text>

  <!-- ===== book card ===== -->
  <rect x="322" y="132" width="114" height="84" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="379" y="168" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">The Little</text>
  <text x="379" y="188" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Fox Story</text>
  <circle cx="348" cy="206" r="5" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M344 210 L352 210 L348 216 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>

  <text x="379" y="234" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">maker</text>
  <text x="379" y="252" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#222222">author — wrote the words</text>
  <text x="379" y="270" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#222222">illustrator — drew the pictures</text>
  <line x1="306" y1="282" x2="452" y2="282" stroke="#2b3a42" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="379" y="304" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">audience</text>
  <text x="379" y="322" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#222222">children who</text>
  <text x="379" y="340" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#222222">love stories</text>

  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">A message comes from a maker and goes to an audience.</text>
  <text x="256" y="446" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">An author, an illustrator, a sign-writer, a grandparent,</text>
  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">a child who draws — every maker matters equally.</text>
</svg>
