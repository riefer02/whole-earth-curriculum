<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Solidarity across distance</title>
  <desc id="d">Two figures on opposite sides, drawn with different features, joined by a sturdy bridge labeled "acting together". One figure is labeled "near me, like me" and the other "far away, different from me". Below, a note says solidarity is choosing to act with people we may never meet.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222222">Solidarity across distance</text>
  <!-- left figure -->
  <circle cx="110" cy="180" r="20" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M76 260 Q110 234 144 260" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="110" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#222222">near me, like me</text>
  <!-- right figure -->
  <circle cx="402" cy="180" r="20" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <path d="M368 260 Q402 234 436 260" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="402" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#222222">far away, different</text>
  <text x="402" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#222222">from me</text>
  <!-- bridge -->
  <rect x="160" y="196" width="192" height="16" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#222222">acting together</text>
  <!-- support lines -->
  <line x1="130" y1="200" x2="160" y2="204" stroke="#2b3a42" stroke-width="2"/>
  <line x1="382" y1="200" x2="352" y2="204" stroke="#2b3a42" stroke-width="2"/>
  <!-- note -->
  <text x="256" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#222222">Solidarity is a choice: to act with people we may never meet,</text>
  <text x="256" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#222222">because their freedom is bound up with our own.</text>
</svg>
