<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Arguing with reasons</title>
  <desc id="desc">A simple argument structure: a claim box on top, supported from below by two reason boxes, each supported by an evidence box. Arrows point upward from evidence to reasons to the claim. A small figure stands beside it listening. Labels, not color, carry the meaning, so the diagram prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Arguing with Reasons</text>

  <!-- Claim -->
  <rect x="166" y="80" width="180" height="58" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="105" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">claim</text>
  <text x="256" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">what I argue</text>

  <!-- Reasons -->
  <rect x="80" y="190" width="150" height="56" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="155" y="213" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">reason 1</text>
  <text x="155" y="233" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">why it matters</text>

  <rect x="282" y="190" width="150" height="56" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="357" y="213" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">reason 2</text>
  <text x="357" y="233" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">why it matters</text>

  <!-- Evidence -->
  <rect x="80" y="300" width="150" height="56" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="155" y="323" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">evidence</text>
  <text x="155" y="343" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">what I can show</text>

  <rect x="282" y="300" width="150" height="56" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="357" y="323" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">evidence</text>
  <text x="357" y="343" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">what I can show</text>

  <!-- Arrows upward -->
  <g stroke="#7a9e7e" stroke-width="3" fill="none">
    <path d="M155 190 V138"/>
    <path d="M357 190 V138"/>
    <path d="M155 300 V246"/>
    <path d="M357 300 V246"/>
  </g>
  <g fill="#7a9e7e">
    <path d="M149 144 l6 -12 l6 12 z"/>
    <path d="M351 144 l6 -12 l6 12 z"/>
    <path d="M149 252 l6 -12 l6 12 z"/>
    <path d="M351 252 l6 -12 l6 12 z"/>
  </g>

  <!-- Listening figure -->
  <g stroke="#2b3a42" stroke-width="2" fill="#ffffff">
    <circle cx="432" cy="150" r="12" fill="#6b93b6"/>
    <path d="M432 162 v20 M420 170 c0 9 5 15 12 15 s12 -6 12 -15"/>
  </g>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">A strong argument stands on reasons and evidence — and invites an answer.</text>
</svg>
