<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Reading a complex moment: the layers of feeling</title>
  <desc id="desc">A stack of four labeled layers from bottom to top: the event, the thought about the event, the subtle feeling, and the secondary feeling about that feeling. An arrow ascends the stack showing how each layer rises from the one below.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Layers of a Complex Feeling</text>

  <!-- layer 1: event -->
  <rect x="76" y="360" width="360" height="62" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="96" y="386" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#222222">Event</text>
  <text x="96" y="408" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">what happened, plain as a camera would see it</text>

  <!-- layer 2: thought -->
  <rect x="76" y="272" width="360" height="62" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="96" y="298" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#222222">Thought</text>
  <text x="96" y="320" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">the story I tell myself about what it means</text>

  <!-- layer 3: subtle feeling -->
  <rect x="76" y="184" width="360" height="62" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="96" y="210" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#222222">Subtle feeling</text>
  <text x="96" y="232" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">envy · awe · nostalgia · resentment · tenderness</text>

  <!-- layer 4: secondary feeling -->
  <rect x="76" y="96" width="360" height="62" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="96" y="122" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#222222">Secondary feeling</text>
  <text x="96" y="144" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">the feeling about that feeling — shame, pride, guilt</text>

  <!-- ascending arrow -->
  <path d="M256 352 L256 286" fill="none" stroke="#4f6d7a" stroke-width="2" marker-end="url(#larr)"/>
  <path d="M256 264 L256 198" fill="none" stroke="#4f6d7a" stroke-width="2" marker-end="url(#larr)"/>
  <path d="M256 176 L256 110" fill="none" stroke="#4f6d7a" stroke-width="2" marker-end="url(#larr)"/>
  <defs>
    <marker id="larr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 Z" fill="#4f6d7a"/>
    </marker>
  </defs>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Each layer rises from the one below — name them one at a time.</text>
</svg>
