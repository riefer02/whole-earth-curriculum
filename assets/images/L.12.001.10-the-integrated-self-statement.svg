<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">The integrated self statement</title>
  <desc id="d">A statement frame with a title line and four labeled lines — who I am, what I value, how I will act, how I author myself within forces. Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#222222">The integrated self statement</text>
  <!-- title line -->
  <rect x="56" y="70" width="400" height="46" rx="10" fill="#e0a458" opacity="0.25" stroke="#2b3a42" stroke-width="2"/>
  <text x="76" y="99" font-family="Arial, sans-serif" font-size="17" fill="#4f6d7a">title</text>
  <!-- four prompt lines -->
  <rect x="56" y="134" width="400" height="62" rx="10" fill="#7a9e7e" opacity="0.2" stroke="#2b3a42" stroke-width="2"/>
  <text x="76" y="161" font-family="Arial, sans-serif" font-size="16" fill="#222222">who I am</text>
  <text x="76" y="184" font-family="Arial, sans-serif" font-size="14" fill="#4f6d7a">_ _ _ _ _ _ _ _ _ _</text>
  <rect x="56" y="212" width="400" height="62" rx="10" fill="#6b93b6" opacity="0.2" stroke="#2b3a42" stroke-width="2"/>
  <text x="76" y="239" font-family="Arial, sans-serif" font-size="16" fill="#222222">what I value</text>
  <text x="76" y="262" font-family="Arial, sans-serif" font-size="14" fill="#4f6d7a">_ _ _ _ _ _ _ _ _ _</text>
  <rect x="56" y="290" width="400" height="62" rx="10" fill="#e0a458" opacity="0.2" stroke="#2b3a42" stroke-width="2"/>
  <text x="76" y="317" font-family="Arial, sans-serif" font-size="16" fill="#222222">how I will act</text>
  <text x="76" y="340" font-family="Arial, sans-serif" font-size="14" fill="#4f6d7a">_ _ _ _ _ _ _ _ _ _</text>
  <rect x="56" y="368" width="400" height="62" rx="10" fill="#7a9e7e" opacity="0.2" stroke="#2b3a42" stroke-width="2"/>
  <text x="76" y="395" font-family="Arial, sans-serif" font-size="16" fill="#222222">how I author myself within forces</text>
  <text x="76" y="418" font-family="Arial, sans-serif" font-size="14" fill="#4f6d7a">_ _ _ _ _ _ _ _ _ _</text>
  <text x="256" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6d7a">a draft, not a verdict</text>
</svg>
