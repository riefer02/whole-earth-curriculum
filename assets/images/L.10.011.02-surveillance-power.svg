<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t2 d2">
  <title id="t2">Asymmetric visibility</title>
  <desc id="d2">Many small figures at the bottom are watched by a few large figures at the top; thick arrows run up from the many to the few and only thin arrows come back down.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <g fill="#7a9e7e">
    <circle cx="86" cy="400" r="14"/><circle cx="140" cy="400" r="14"/><circle cx="194" cy="400" r="14"/>
    <circle cx="248" cy="400" r="14"/><circle cx="302" cy="400" r="14"/><circle cx="356" cy="400" r="14"/>
    <circle cx="410" cy="400" r="14"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <path d="M86 424 v30 M140 424 v30 M194 424 v30 M248 424 v30 M302 424 v30 M356 424 v30 M410 424 v30"/>
  </g>
  <text x="248" y="480" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#222222">the many (watched)</text>
  <g fill="#4f6d7a">
    <circle cx="190" cy="110" r="26"/><circle cx="322" cy="110" r="26"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <path d="M190 146 v44 M322 146 v44"/>
  </g>
  <text x="256" y="60" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#222222">the few (watchers)</text>
  <g stroke="#6b93b6" stroke-width="4" fill="none">
    <path d="M120 400 C110 250 150 170 182 140"/>
    <path d="M180 400 C170 250 210 170 240 140"/>
    <path d="M240 400 C235 250 270 170 300 140"/>
    <path d="M300 400 C300 250 330 170 330 140"/>
    <path d="M360 400 C360 250 380 170 356 140"/>
  </g>
  <g stroke="#e0a458" stroke-width="2" fill="none">
    <path d="M202 190 L130 380"/>
    <path d="M310 190 L380 380"/>
  </g>
  <text x="96" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">they can</text>
  <text x="96" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">see up</text>
  <text x="420" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e0a458">thin</text>
  <text x="420" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e0a458">look back</text>
</svg>
