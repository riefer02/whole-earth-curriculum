<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-01-007-03-singing-and-keeping-the-beat desc-L-01-007-03-singing-and-keeping-the-beat">
  <title id="title-L-01-007-03-singing-and-keeping-the-beat">Singing and keeping the beat: a beat you can see and feel</title>
  <desc id="desc-L-01-007-03-singing-and-keeping-the-beat">A child with medium-brown skin sings with a wide-open mouth while two music notes float up from them. Beside them, two hands — one light and one deep brown — clap together with little motion lines. Below, a row of four equal, evenly spaced beat circles is numbered 1, 2, 3, 4, each labeled clap, clap, clap, pat, so the steady beat can be seen and counted like a heartbeat. At the bottom, a hand rests on a drum with vibration arcs around it and the label "feel the beat," because a beat can be felt as a vibration, not only heard. Numbers, labels, and shapes carry all meaning, so the picture prints clearly in grayscale and teaches that a steady, even beat belongs to everyone.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Singing and Keeping the Beat</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">The steady beat is the song's heartbeat.</text>

  <!-- ===== Singing child ===== -->
  <g>
    <!-- limbs with weight -->
    <path d="M102 220 L100 252" stroke="#2b3a42" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M118 220 L120 252" stroke="#2b3a42" stroke-width="13" stroke-linecap="round" fill="none"/>
    <ellipse cx="97" cy="257" rx="9" ry="5" fill="#2b3a42"/>
    <ellipse cx="123" cy="257" rx="9" ry="5" fill="#2b3a42"/>
    <path d="M96 182 L82 214" stroke="#7a9e7e" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M124 182 L138 214" stroke="#7a9e7e" stroke-width="11" stroke-linecap="round" fill="none"/>
    <circle cx="80" cy="218" r="6" fill="#c99567" stroke="#2b3a42" stroke-width="1.6"/>
    <circle cx="140" cy="218" r="6" fill="#c99567" stroke="#2b3a42" stroke-width="1.6"/>
    <path d="M110 170 C 99 170 92 177 92 187 L92 208 C92 219 98 223 106 223 L114 223 C122 223 128 219 128 208 L128 187 C128 177 121 170 110 170 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="110" cy="146" r="24" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M86 146 A24 24 0 0 1 134 146 L134 136 A24 24 0 0 0 86 136 Z" fill="#2b3a42"/>
    <circle cx="102" cy="146" r="2.6" fill="#2b3a42"/>
    <circle cx="118" cy="146" r="2.6" fill="#2b3a42"/>
    <ellipse cx="110" cy="160" rx="6.5" ry="5.5" fill="#2b3a42"/>
    <!-- music notes -->
    <g fill="#2b3a42" stroke="#2b3a42" stroke-width="2">
      <ellipse cx="158" cy="128" rx="7" ry="5"/>
      <line x1="165" y1="128" x2="165" y2="108"/>
      <path d="M165 108 Q172 110 170 118" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g fill="#2b3a42" stroke="#2b3a42" stroke-width="2">
      <ellipse cx="176" cy="146" rx="7" ry="5"/>
      <line x1="183" y1="146" x2="183" y2="126"/>
      <path d="M183 126 Q190 128 188 136" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ===== Clapping hands ===== -->
  <g>
    <path d="M290 180 L290 136 Q290 114 308 114 L320 114 Q338 114 338 136 L338 180 Q338 200 314 200 Q290 200 290 180 Z" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M304 116 L304 132" stroke="#2b3a42" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M314 116 L314 132" stroke="#2b3a42" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M380 180 L380 136 Q380 114 398 114 L410 114 Q428 114 428 136 L428 180 Q428 200 404 200 Q380 200 380 180 Z" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M404 116 L404 132" stroke="#2b3a42" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M414 116 L414 132" stroke="#2b3a42" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M362 150 L350 144 M362 172 L350 172 M356 196 L348 204" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ===== Beat row: 1 2 3 4 ===== -->
  <g>
    <circle cx="90" cy="300" r="34" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="90" y="294" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#6b93b6">1</text>
    <text x="90" y="314" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">clap</text>
  </g>
  <g>
    <circle cx="200" cy="300" r="34" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="200" y="294" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#6b93b6">2</text>
    <text x="200" y="314" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">clap</text>
  </g>
  <g>
    <circle cx="310" cy="300" r="34" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="310" y="294" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#6b93b6">3</text>
    <text x="310" y="314" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">clap</text>
  </g>
  <g>
    <circle cx="420" cy="300" r="34" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="420" y="294" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#7a9e7e">4</text>
    <text x="420" y="314" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">pat</text>
  </g>
  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">even and steady — like a heartbeat</text>

  <!-- ===== Feel the beat: hand on drum ===== -->
  <g>
    <!-- drum -->
    <path d="M156 470 L164 404 Q166 396 178 396 L190 396 Q202 396 204 404 L212 470 Q212 482 184 482 Q156 482 156 470 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="184" cy="396" rx="30" ry="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <!-- hand pressing on the drum skin -->
    <ellipse cx="184" cy="383" rx="19" ry="11" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M196 374 L208 372 M198 381 L213 381 M196 388 L208 390" stroke="#c99567" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M140 384 L166 383" stroke="#c99567" stroke-width="15" stroke-linecap="round" fill="none"/>
    <!-- vibration arcs -->
    <g stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M128 404 Q124 412 128 420"/>
      <path d="M118 416 Q114 424 118 432"/>
    </g>
    <line x1="216" y1="412" x2="254" y2="418" stroke="#4f6d7a" stroke-width="1.6"/>
    <text x="260" y="418" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">feel the beat</text>
    <text x="260" y="436" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">the drum shakes</text>
  </g>
</svg>
