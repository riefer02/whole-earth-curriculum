<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Singing and keeping the beat: a beat you can see and feel</title>
  <desc id="desc">A child with medium-brown skin sings with a wide-open mouth while two music notes float up from them. Beside them, two hands — one light and one deep brown — clap together with little motion lines. Below, a row of four equal, evenly spaced beat circles is numbered 1, 2, 3, 4, each labeled clap, clap, clap, pat, so the steady beat can be seen and counted like a heartbeat. At the bottom, a hand rests on a drum with vibration arcs around it and the label "feel the beat," because a beat can be felt as a vibration, not only heard. Numbers, labels, and shapes carry all meaning, so the picture prints clearly in grayscale and teaches that a steady, even beat belongs to everyone.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Singing and Keeping the Beat</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">The steady beat is the song's heartbeat.</text>

  <!-- ===== Singing child ===== -->
  <g>
    <circle cx="110" cy="150" r="24" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M86 148 A24 24 0 0 1 134 148 Z" fill="#2b3a42"/>
    <circle cx="102" cy="150" r="2.4" fill="#2b3a42"/>
    <circle cx="118" cy="150" r="2.4" fill="#2b3a42"/>
    <ellipse cx="110" cy="162" rx="7" ry="5" fill="#2b3a42"/>
    <rect x="92" y="176" width="36" height="48" rx="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="100" y1="222" x2="98" y2="244" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <line x1="120" y1="222" x2="122" y2="244" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <!-- music notes -->
    <g fill="#2b3a42" stroke="#2b3a42" stroke-width="2">
      <ellipse cx="158" cy="128" rx="7" ry="5"/>
      <line x1="165" y1="128" x2="165" y2="108"/>
      <path d="M165 108 Q172 110 170 118" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g fill="#2b3a42" stroke="#2b3a42" stroke-width="2">
      <ellipse cx="176" cy="146" rx="7" ry="5"/>
      <line x1="183" y1="146" x2="183" y2="126"/>
      <path d="M183 126 Q190 128 188 136" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ===== Clapping hands ===== -->
  <g>
    <path d="M290 180 L290 136 Q290 114 308 114 L320 114 Q338 114 338 136 L338 180 Q338 200 314 200 Q290 200 290 180 Z" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="304" y1="116" x2="304" y2="132" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="314" y1="116" x2="314" y2="132" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M380 180 L380 136 Q380 114 398 114 L410 114 Q428 114 428 136 L428 180 Q428 200 404 200 Q380 200 380 180 Z" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <line x1="404" y1="116" x2="404" y2="132" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="414" y1="116" x2="414" y2="132" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <g stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round">
      <line x1="362" y1="150" x2="350" y2="144"/>
      <line x1="362" y1="172" x2="350" y2="172"/>
      <line x1="356" y1="196" x2="348" y2="204"/>
    </g>
  </g>

  <!-- ===== Beat row: 1 2 3 4 ===== -->
  <g>
    <circle cx="90" cy="300" r="34" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="90" y="294" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#6b93b6">1</text>
    <text x="90" y="314" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">clap</text>
  </g>
  <g>
    <circle cx="200" cy="300" r="34" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="200" y="294" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#6b93b6">2</text>
    <text x="200" y="314" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">clap</text>
  </g>
  <g>
    <circle cx="310" cy="300" r="34" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="310" y="294" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#6b93b6">3</text>
    <text x="310" y="314" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">clap</text>
  </g>
  <g>
    <circle cx="420" cy="300" r="34" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="420" y="294" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#7a9e7e">4</text>
    <text x="420" y="314" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">pat</text>
  </g>
  <text x="256" y="356" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">even and steady — like a heartbeat</text>

  <!-- ===== Feel the beat: hand on drum ===== -->
  <g>
    <path d="M156 470 L164 406 Q166 398 178 398 L190 398 Q202 398 204 406 L212 470 Q212 482 184 482 Q156 482 156 470 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="184" cy="398" rx="30" ry="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <path d="M184 354 Q176 338 164 344 L156 358 Q150 366 160 372 L176 374 Q190 374 192 364 Z" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M126 406 Q122 412 126 418"/>
      <path d="M242 406 Q246 412 242 418"/>
      <path d="M118 418 Q114 424 118 430"/>
      <path d="M250 418 Q254 424 250 430"/>
    </g>
    <text x="184" y="506" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">feel the beat</text>
  </g>
</svg>
