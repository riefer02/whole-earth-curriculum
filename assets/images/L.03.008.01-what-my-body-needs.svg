<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">What my body needs</title>
  <desc id="desc">Four equal panels in a row, each the same size so no need ranks above another. The first shows a child eating from a bowl labeled food, the second a child drinking from a cup labeled water, the third a child asleep under a blanket labeled sleep, and the fourth a child running labeled movement. Labels and shapes carry the idea, and the picture reads clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">What My Body Needs</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Four needs, all equal — food, water, sleep, movement</text>

  <!-- Panel 1: food -->
  <g>
    <rect x="20" y="92" width="112" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <path d="M76 150 q0 -18 20 -18 q20 0 20 18 q0 10 -6 16 q-6 8 -14 8 q-8 0 -14 -8 q-6 -6 -6 -16 Z" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M70 176 q-8 14 -8 22 q0 8 14 8 q14 0 14 -8 q0 -8 -8 -22 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="76" cy="226" rx="20" ry="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="44" y="258" width="64" height="34" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="76" y="388" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">food</text>
  </g>

  <!-- Panel 2: water -->
  <g>
    <rect x="144" y="92" width="112" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <path d="M200 152 q0 -14 14 -14 q14 0 14 14 l0 12 q0 8 -6 8 l-16 0 q-6 0 -6 -8 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M200 172 l0 30" stroke="#2b3a42" stroke-width="2"/>
    <path d="M196 208 q-8 12 -6 18 q2 6 10 6 q8 0 10 -6 q2 -6 -6 -18 Z" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M178 238 q-10 16 0 30 q-6 12 0 24" fill="none" stroke="#6b93b6" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <path d="M220 244 q8 14 0 28" fill="none" stroke="#6b93b6" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <text x="200" y="388" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">water</text>
  </g>

  <!-- Panel 3: sleep -->
  <g>
    <rect x="268" y="92" width="112" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <circle cx="324" cy="176" r="20" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M324 176 q-8 22 -12 30 q-2 8 4 10 l6 2" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <path d="M296 250 q32 22 56 0 l0 30 q-28 18 -56 0 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M306 268 q0 -8 8 -8 q8 0 8 8 m0 0 l14 0" stroke="#2b3a42" stroke-width="2" fill="none"/>
    <text x="324" y="388" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">sleep</text>
  </g>

  <!-- Panel 4: movement -->
  <g>
    <rect x="392" y="92" width="112" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <circle cx="448" cy="162" r="16" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M448 178 l0 40" stroke="#2b3a42" stroke-width="4"/>
    <path d="M448 196 l-22 20 M448 196 l22 20" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M448 218 l-18 40 M448 218 l18 40" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M448 258 l-6 40 M448 258 l6 40" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <text x="448" y="388" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">movement</text>
  </g>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">My body needs all four, every day.</text>
</svg>
