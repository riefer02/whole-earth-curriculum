<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Seeking to understand: the listening loop</title>
  <desc id="d">Two figures with different clothing and skin tone face each other across a gap. Between them is a four-step loop of arrows — listen, repeat back, ask a question, check — labeled 'seek to understand before being understood'. Each figure has a speech bubble: the left says 'I see it differently...' and the right replies 'tell me more.'</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">Seeking to understand</text>

  <!-- Left figure -->
  <g>
    <circle cx="120" cy="210" r="26" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="112" cy="204" r="3" fill="#2b3a42"/>
    <circle cx="128" cy="204" r="3" fill="#2b3a42"/>
    <path d="M114 220 Q120 225 126 220" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M120 236 L120 300 L100 344 M120 300 L140 344" stroke="#2b3a42" stroke-width="2"/>
    <path d="M96 274 L144 274" stroke="#2b3a42" stroke-width="2"/>
    <path d="M120 158 L150 130 L186 142 L156 158 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="152" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">"I see it differently…"</text>
  </g>

  <!-- Right figure -->
  <g>
    <circle cx="392" cy="210" r="26" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="384" cy="204" r="3" fill="#2b3a42"/>
    <circle cx="400" cy="204" r="3" fill="#2b3a42"/>
    <path d="M386 220 Q392 225 398 220" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M392 236 L392 300 L372 344 M392 300 L412 344" stroke="#2b3a42" stroke-width="2"/>
    <path d="M368 274 L416 274" stroke="#2b3a42" stroke-width="2"/>
    <path d="M392 158 L362 130 L326 142 L356 158 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="360" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">"tell me more."</text>
  </g>

  <!-- Listening loop -->
  <g>
    <circle cx="256" cy="300" r="78" fill="none" stroke="#6b93b6" stroke-width="3"/>
    <text x="256" y="258" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">listen</text>
    <text x="332" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">repeat back</text>
    <text x="256" y="342" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">ask a question</text>
    <text x="180" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">check</text>
    <path d="M300 246 L330 278 M318 244 L332 270" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <text x="256" y="418" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">Seek to understand before being understood.</text>
  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Understanding is not agreement — it is the honest first move.</text>
</svg>
