<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Seeking to understand: the listening loop</title>
  <desc id="d">Two figures with different clothing and skin tone face each other across a gap. Between them is a four-step loop of arrows — listen, repeat back, ask a question, check — labeled 'seek to understand before being understood'. Each figure has a speech bubble: the left says 'I see it differently...' and the right replies 'tell me more.'</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">Seeking to understand</text>

  <!-- Left figure -->
  <g>
    <g fill="#8f5f3d">
      <circle cx="120" cy="202" r="22"/>
      <rect x="114" y="221" width="12" height="16" rx="5"/>
      <rect x="96" y="234" width="48" height="72" rx="20"/>
      <path d="M 100 244 Q 90 266 94 288" stroke="#8f5f3d" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M 140 244 Q 150 266 146 288" stroke="#8f5f3d" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M 109 304 L 105 338" stroke="#8f5f3d" stroke-width="17" stroke-linecap="round" fill="none"/>
      <path d="M 131 304 L 135 338" stroke="#8f5f3d" stroke-width="17" stroke-linecap="round" fill="none"/>
      <ellipse cx="103" cy="342" rx="11" ry="6"/>
      <ellipse cx="137" cy="342" rx="11" ry="6"/>
    </g>
    <circle cx="111" cy="197" r="3" fill="#2b3a42"/>
    <circle cx="129" cy="197" r="3" fill="#2b3a42"/>
    <path d="M112 213 Q120 219 128 213" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M56 148 h108 a8 8 0 0 1 8 8 v12 a8 8 0 0 1 -8 8 h-50 l-10 14 l-2 -14 h-46 a8 8 0 0 1 -8 -8 v-12 a8 8 0 0 1 8 -8 z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="112" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">I see it differently…</text>
  </g>

  <!-- Right figure -->
  <g>
    <g fill="#e6bb92">
      <circle cx="392" cy="202" r="22"/>
      <rect x="386" y="221" width="12" height="16" rx="5"/>
      <rect x="368" y="234" width="48" height="72" rx="20"/>
      <path d="M 372 244 Q 362 266 366 288" stroke="#e6bb92" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M 412 244 Q 422 266 418 288" stroke="#e6bb92" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M 381 304 L 377 338" stroke="#e6bb92" stroke-width="17" stroke-linecap="round" fill="none"/>
      <path d="M 403 304 L 407 338" stroke="#e6bb92" stroke-width="17" stroke-linecap="round" fill="none"/>
      <ellipse cx="375" cy="342" rx="11" ry="6"/>
      <ellipse cx="409" cy="342" rx="11" ry="6"/>
    </g>
    <circle cx="383" cy="197" r="3" fill="#2b3a42"/>
    <circle cx="401" cy="197" r="3" fill="#2b3a42"/>
    <path d="M384 213 Q392 219 400 213" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M352 148 h84 a8 8 0 0 1 8 8 v12 a8 8 0 0 1 -8 8 h-42 l-12 14 l0 -14 h-30 a8 8 0 0 1 -8 -8 v-12 a8 8 0 0 1 8 -8 z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="396" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">tell me more.</text>
  </g>

  <!-- Listening loop -->
  <g>
    <circle cx="256" cy="300" r="78" fill="none" stroke="#6b93b6" stroke-width="3"/>
    <text x="256" y="258" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">listen</text>
    <text x="332" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">repeat back</text>
    <text x="256" y="342" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">ask a question</text>
    <text x="180" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">check</text>
    <path d="M300 246 L330 278 M318 244 L332 270" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <text x="256" y="418" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">Seek to understand before being understood.</text>
  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Understanding is not agreement — it is the honest first move.</text>
</svg>
