<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The register spectrum</title>
  <desc id="desc">A horizontal line running from close and intimate on the left to formal and public on the right. Five settings are placed along it with labels: home with family, the market, the classroom, a ceremony, and a court. A note says every culture draws this line in its own way.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#2b3a42">Matching Your Voice to the Room</text>

  <!-- Spectrum line -->
  <line x1="60" y1="180" x2="452" y2="180" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  <polygon points="60,180 60,200 40,190" fill="#2b3a42"/>
  <polygon points="452,180 452,200 472,190" fill="#2b3a42"/>

  <text x="60" y="148" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7a9e7e">close &amp; intimate</text>
  <text x="452" y="148" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">formal &amp; public</text>

  <!-- Placements -->
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <!-- home -->
    <circle cx="96" cy="180" r="9" fill="#7a9e7e"/>
    <text x="96" y="222">home with</text>
    <text x="96" y="240">family</text>

    <!-- market -->
    <circle cx="176" cy="180" r="9" fill="#e0a458"/>
    <text x="176" y="222">the market</text>

    <!-- classroom -->
    <circle cx="256" cy="180" r="9" fill="#6b93b6"/>
    <text x="256" y="222">the classroom</text>

    <!-- ceremony -->
    <circle cx="344" cy="180" r="9" fill="#4f6d7a"/>
    <text x="344" y="222">a ceremony</text>

    <!-- court -->
    <circle cx="424" cy="180" r="9" fill="#2b3a42"/>
    <text x="424" y="222">a court or</text>
    <text x="424" y="240">interview</text>
  </g>

  <!-- Examples of change -->
  <rect x="60" y="280" width="392" height="118" rx="12" fill="#fdfbf7" stroke="#6b93b6" stroke-width="2"/>
  <text x="256" y="306" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">What changes as I move along the line?</text>
  <g font-family="sans-serif" font-size="14" fill="#3a5a6a">
    <text x="82" y="332">words ("hey" → "good morning")</text>
    <text x="82" y="354">titles and forms of address</text>
    <text x="82" y="376">tone and volume</text>
    <text x="82" y="398">sometimes the grammar itself</text>
  </g>

  <text x="256" y="446" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Every culture and language draws this line in its own way —</text>
  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">no register is "better"; the skill is matching the room.</text>
</svg>
