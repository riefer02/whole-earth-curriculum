<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Measuring liquid volume: one liter equals one thousand milliliters</title>
  <desc id="desc">A one-liter bottle and a smaller cup marked two hundred fifty milliliters. A pouring arrow shows four cups filling the liter bottle. Labels read one liter equals one thousand milliliters, and a note says estimate first, then measure to check.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Liquid Volume: Liters &amp; Milliliters</text>

  <!-- Liter bottle -->
  <rect x="120" y="110" width="90" height="200" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="3"/>
  <rect x="120" y="110" width="90" height="200" rx="10" fill="#6b93b6" opacity="0.85"/>
  <rect x="126" y="118" width="78" height="184" rx="6" fill="#fdfbf7"/>
  <rect x="126" y="118" width="78" height="184" rx="6" fill="#6b93b6"/>
  <text x="165" y="210" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1 L</text>
  <text x="165" y="342" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">1 liter</text>

  <!-- Pouring arrow -->
  <path d="M 270 150 Q 320 150 320 110 Q 320 80 360 80" stroke="#e0a458" stroke-width="3" fill="none"/>
  <polygon points="360,74 372,80 360,88" fill="#e0a458" stroke="#2b3a42" stroke-width="1"/>

  <!-- 250 mL cup -->
  <rect x="360" y="80" width="70" height="120" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
  <rect x="366" y="88" width="58" height="106" rx="4" fill="#7a9e7e"/>
  <text x="395" y="150" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">250</text>
  <text x="395" y="230" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">250 mL</text>

  <!-- Four pours -->
  <rect x="96" y="300" width="320" height="130" rx="12" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
  <text x="256" y="330" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">4 cups of 250 mL fill the liter:</text>
  <text x="256" y="366" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42">250 + 250 + 250 + 250 = 1,000 mL</text>
  <text x="256" y="404" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#e0a458">1 liter = 1,000 milliliters</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#4f6d7a">Estimate first, then measure to check.</text>
</svg>
