<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-04-002-04-warm-work-cool-rest desc-L-04-002-04-warm-work-cool-rest">
  <title id="title-L-04-002-04-warm-work-cool-rest">Warm work, cool rest</title>
  <desc id="desc-L-04-002-04-warm-work-cool-rest">Two children side by side. The left child sits cross-legged with a soft, cool tint behind them, labelled "rest — cooler". The right child runs, with a warm tint behind them and three sweat drops, labelled "work — warmer". A caption reads "working muscles make heat".</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="52" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Warm Work, Cool Rest</text>

  <!-- Resting child: a silhouette, seated cross-legged on a cool tint -->
  <circle cx="140" cy="230" r="74" fill="#6b93b6" opacity="0.14"/>
  <g fill="#e6bb92" stroke="none">
    <circle cx="140" cy="160" r="26"/>
    <rect x="133" y="180" width="14" height="12" rx="6"/>
    <rect x="116" y="190" width="48" height="74" rx="22"/>
    <path d="M124 208 l-12 44" stroke="#e6bb92" stroke-width="14" stroke-linecap="round"/>
    <path d="M156 208 l12 44" stroke="#e6bb92" stroke-width="14" stroke-linecap="round"/>
    <path d="M136 260 l-26 30" stroke="#e6bb92" stroke-width="20" stroke-linecap="round"/>
    <path d="M144 260 l26 30" stroke="#e6bb92" stroke-width="20" stroke-linecap="round"/>
    <path d="M112 292 q28 14 56 0" stroke="#e6bb92" stroke-width="17" stroke-linecap="round"/>
  </g>
  <circle cx="140" cy="160" r="26" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="131" cy="156" r="2.4" fill="#2b3a42"/>
  <circle cx="149" cy="156" r="2.4" fill="#2b3a42"/>
  <path d="M132 168 Q140 174 148 168" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="140" y="384" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">rest — cooler</text>

  <!-- Running child: leaning silhouette with a warm tint and sweat drops -->
  <circle cx="376" cy="216" r="74" fill="#e0a458" opacity="0.2"/>
  <g fill="#c99567" stroke="none">
    <circle cx="384" cy="140" r="26"/>
    <rect x="377" y="160" width="14" height="12" rx="6"/>
    <rect x="360" y="170" width="46" height="72" rx="22" transform="rotate(9 383 206)"/>
    <path d="M366 190 l-30 26" stroke="#c99567" stroke-width="13" stroke-linecap="round"/>
    <path d="M400 188 l28 -16" stroke="#c99567" stroke-width="13" stroke-linecap="round"/>
    <path d="M374 240 l-30 26" stroke="#c99567" stroke-width="16" stroke-linecap="round"/>
    <path d="M394 240 l22 20 l4 26" stroke="#c99567" stroke-width="16" stroke-linecap="round"/>
  </g>
  <ellipse cx="342" cy="270" rx="10" ry="6" fill="#c99567"/>
  <ellipse cx="422" cy="290" rx="10" ry="6" fill="#c99567"/>
  <circle cx="384" cy="140" r="26" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="375" cy="136" r="2.4" fill="#2b3a42"/>
  <circle cx="393" cy="136" r="2.4" fill="#2b3a42"/>
  <path d="M376 148 Q384 154 392 148" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <!-- sweat drops -->
  <path d="M348 116 q5 8 0 12 q-6 -4 0 -12 z" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.2"/>
  <path d="M404 104 q5 8 0 12 q-6 -4 0 -12 z" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.2"/>
  <path d="M426 140 q4 7 0 10 q-5 -3 0 -10 z" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.2"/>
  <text x="380" y="384" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">work — warmer</text>

  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222222">working muscles make heat</text>
</svg>
