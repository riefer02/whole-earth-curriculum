<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Warm work, cool rest</title>
  <desc id="desc">Two child figures side by side. The left figure sits still and is labeled "rest, cooler" with soft shading. The right figure runs and is labeled "work, warmer" with warm shading and small sweat drops, showing the body warms with activity.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="52" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">Warm Work, Cool Rest</text>

  <!-- Resting child -->
  <g>
    <circle cx="140" cy="150" r="34" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M140 184 Q140 300 110 330 M140 300 Q170 320 140 340" stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M140 200 L120 260 M140 200 L160 260" stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="128" cy="146" r="3" fill="#2b3a42"/>
    <circle cx="152" cy="146" r="3" fill="#2b3a42"/>
    <path d="M132 162 Q140 168 148 162" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <circle cx="140" cy="120" r="5" fill="#6b93b6" opacity="0.5"/>
  </g>
  <text x="140" y="384" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">rest — cooler</text>

  <!-- Running child -->
  <g>
    <circle cx="380" cy="140" r="34" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M380 174 Q360 250 330 280 M380 200 Q410 240 430 260" stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M380 190 L352 230 M380 190 L408 230" stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="368" cy="136" r="3" fill="#2b3a42"/>
    <circle cx="392" cy="136" r="3" fill="#2b3a42"/>
    <path d="M372 152 Q380 158 388 152" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- warm shading -->
    <circle cx="380" cy="150" r="60" fill="#e0a458" opacity="0.18"/>
    <!-- sweat drops -->
    <circle cx="352" cy="110" r="4" fill="#6b93b6"/>
    <circle cx="404" cy="104" r="4" fill="#6b93b6"/>
    <circle cx="376" cy="94" r="3" fill="#6b93b6"/>
  </g>
  <text x="380" y="384" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">work — warmer</text>

  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222222">working muscles make heat</text>
</svg>
