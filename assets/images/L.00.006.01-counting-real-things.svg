<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Counting real things: one number for each thing</title>
  <desc id="desc">A pointing hand touches the first of five found objects in a row: a smooth pebble, a ridged shell, a seed, a leaf, and a second pebble. Directly under each object is a number from 1 to 5, one number for each thing, so a learner sees one-to-one correspondence. Below, a strip shows five tally marks as another way people count, with a caption that counting is done in many ways and numerals are one system among many. Shapes, labels, and numbers carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Counting Real Things</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Touch each thing and say one number for it.</text>

  <!-- Pointing hand (left), index finger toward the first object -->
  <g fill="#c99567" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round">
    <circle cx="62" cy="236" r="16"/>
    <rect x="74" y="218" width="42" height="11" rx="5.5"/>
    <path d="M76 238 q0 14 15 14 q15 0 15 -14 z"/>
  </g>

  <!-- Row of five found objects -->
  <ellipse cx="148" cy="230" rx="26" ry="18" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M212 256 L188 230 Q212 208 236 230 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <line x1="212" y1="256" x2="200" y2="228" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <line x1="212" y1="256" x2="212" y2="216" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <line x1="212" y1="256" x2="224" y2="228" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <path d="M296 210 q22 20 0 40 q-22 -20 0 -40 z" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M370 206 q24 22 0 44 q-24 -22 0 -44 z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="370" y1="214" x2="370" y2="242" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="438" cy="230" rx="22" ry="15" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>

  <!-- One number for each thing -->
  <g fill="#2b3a42">
    <circle cx="148" cy="276" r="3"/>
    <circle cx="212" cy="276" r="3"/>
    <circle cx="296" cy="276" r="3"/>
    <circle cx="370" cy="276" r="3"/>
    <circle cx="438" cy="276" r="3"/>
  </g>
  <g font-family="sans-serif" font-size="28" font-weight="bold" fill="#222222" text-anchor="middle">
    <text x="148" y="302">1</text>
    <text x="212" y="302">2</text>
    <text x="296" y="302">3</text>
    <text x="370" y="302">4</text>
    <text x="438" y="302">5</text>
  </g>

  <text x="256" y="340" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">One thing = one number. The last number you say is how many: five.</text>

  <!-- Tally marks: another way people count -->
  <rect x="88" y="374" width="336" height="108" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.5"/>
  <text x="256" y="402" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Another way to count: tally marks</text>
  <g stroke="#2b3a42" stroke-width="5" stroke-linecap="round">
    <line x1="150" y1="424" x2="150" y2="462"/>
    <line x1="182" y1="424" x2="182" y2="462"/>
    <line x1="214" y1="424" x2="214" y2="462"/>
    <line x1="246" y1="424" x2="246" y2="462"/>
    <line x1="150" y1="424" x2="278" y2="448"/>
  </g>
  <text x="332" y="450" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">= 5</text>
  <text x="256" y="476" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">People everywhere count — numerals are one way among many.</text>
</svg>
