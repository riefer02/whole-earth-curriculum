<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Strategies of Resistance</title>
  <desc id="desc">Three panels of strategy. The first shows a long line of people walking on a march; the second shows people refusing and turning away from a document; the third shows people with arms around trees to protect them.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">March, Refuse, Protect</text>

  <!-- Panel 1: march -->
  <rect x="36" y="70" width="140" height="300" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="106" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a" font-weight="bold">march</text>
  <g>
    <circle cx="60" cy="220" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="86" cy="206" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="112" cy="224" r="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="138" cy="210" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="160" cy="230" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <path d="M40 320 Q100 300 170 316" fill="none" stroke="#6b93b6" stroke-width="4"/>
  <text x="106" y="344" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">a long walk</text>

  <!-- Panel 2: refuse -->
  <rect x="188" y="70" width="140" height="300" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="258" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a" font-weight="bold">refuse</text>
  <rect x="222" y="160" width="70" height="46" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <line x1="230" y1="172" x2="284" y2="172" stroke="#4f6d7a" stroke-width="2"/>
  <line x1="230" y1="184" x2="284" y2="184" stroke="#4f6d7a" stroke-width="2"/>
  <line x1="230" y1="196" x2="266" y2="196" stroke="#4f6d7a" stroke-width="2"/>
  <text x="258" y="224" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">the unjust document</text>
  <g>
    <circle cx="228" cy="280" r="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="258" cy="270" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="288" cy="282" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="258" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">turning away, refusing</text>

  <!-- Panel 3: protect -->
  <rect x="340" y="70" width="140" height="300" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="410" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a" font-weight="bold">protect</text>
  <g>
    <rect x="386" y="180" width="12" height="120" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="392" cy="140" r="24" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <g>
    <circle cx="356" cy="236" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="426" cy="236" r="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <g stroke="#2b3a42" stroke-width="3" fill="none">
    <path d="M364 236 q8 -40 28 -54"/>
    <path d="M418 236 q-8 -40 -28 -54"/>
  </g>
  <text x="410" y="344" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">embracing the tree</text>

  <text x="256" y="424" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Each strategy fits its struggle.</text>
</svg>
