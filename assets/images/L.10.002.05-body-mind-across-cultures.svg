<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The body-mind connection across cultures and times</title>
  <desc id="desc">A simple world map with four labeled markers — breath practice, meditation, movement arts, and humoral medicine — each connected by a line to a small icon of a person, showing that many cultures across time have held ideas about the body-mind connection.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">The Body-Mind Connection Across Cultures</text>

  <!-- Simplified world map: continents as blobs -->
  <g fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.7">
    <path d="M70 150 Q60 210 90 250 Q110 300 150 310 Q140 340 120 350 Q100 355 95 330 Q70 300 60 250 Q50 200 70 150 Z"/>
    <path d="M180 120 Q220 90 260 110 Q300 130 300 170 Q300 210 260 230 Q230 240 210 220 Q190 200 185 160 Q180 130 180 120 Z"/>
    <path d="M330 110 Q380 90 420 120 Q450 150 440 200 Q420 250 380 260 Q350 260 340 230 Q330 200 340 160 Q340 130 330 110 Z"/>
    <path d="M210 260 Q250 240 290 260 Q330 290 300 340 Q260 390 220 360 Q190 330 210 260 Z"/>
    <path d="M300 360 Q340 350 380 380 Q400 420 360 450 Q320 470 300 440 Z"/>
    <path d="M400 300 Q440 290 470 310 Q480 340 460 360 Q430 370 410 350 Q400 330 400 300 Z"/>
  </g>

  <!-- Marker 1: breath practice (South Asia) -->
  <g>
    <circle cx="340" cy="230" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M340 239 L340 268" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <rect x="250" y="272" width="150" height="34" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="325" y="294" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">breath practice</text>

  <!-- Marker 2: meditation (East Asia) -->
  <g>
    <circle cx="420" cy="180" r="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M420 189 L420 214" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <rect x="352" y="216" width="120" height="34" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="412" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">meditation</text>

  <!-- Marker 3: movement arts (Americas) -->
  <g>
    <circle cx="120" cy="220" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M120 229 L120 254" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <rect x="30" y="256" width="140" height="34" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="100" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">movement arts</text>

  <!-- Marker 4: humoral medicine (Mediterranean) -->
  <g>
    <circle cx="180" cy="150" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M180 159 L180 184" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <rect x="108" y="186" width="170" height="34" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="193" y="208" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">humoral medicine</text>

  <!-- Person icon -->
  <g>
    <circle cx="256" cy="396" r="22" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M256 418 L256 456" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M256 428 L234 448 M256 428 L278 448" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M256 456 L236 486 M256 456 L276 486" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- radiating lines to person -->
    <path d="M256 370 L256 390" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <text x="256" y="506" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">A discovery the whole human family keeps making, each in its own words.</text>
</svg>
