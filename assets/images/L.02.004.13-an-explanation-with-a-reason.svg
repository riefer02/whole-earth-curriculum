<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">An explanation with a reason</title>
  <desc id="desc">A page shows an explanation with two parts: a topic on the top line and a reason on the line below. Beside the page is a small diagram of a seed under the soil with water drops above and a sun in the sky, showing how a plant grows. The labels and diagram carry the meaning, so the picture prints clearly in grayscale and teaches learners to write a simple explanation that states a topic and gives a reason.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">An Explanation with a Reason</text>

  <!-- explanation page -->
  <rect x="40" y="100" width="250" height="180" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="66" y="138" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">topic:</text>
  <line x1="130" y1="134" x2="264" y2="134" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <text x="66" y="186" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">reason:</text>
  <line x1="142" y1="182" x2="264" y2="182" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <line x1="142" y1="200" x2="230" y2="200" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <text x="66" y="246" font-family="sans-serif" font-size="14" fill="#4f6d7a">This is how… because…</text>

  <!-- diagram -->
  <g>
    <rect x="320" y="100" width="160" height="180" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <!-- sun -->
    <circle cx="360" cy="136" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M346 136 L338 136 M374 136 L382 136 M360 122 L360 114 M360 150 L360 158" stroke="#e0a458" stroke-width="2.5" stroke-linecap="round"/>
    <!-- water drops -->
    <path d="M428 150 Q430 162 428 168 M444 150 Q446 162 444 168" stroke="#6b93b6" stroke-width="3" stroke-linecap="round"/>
    <!-- soil -->
    <path d="M336 236 L464 236 L464 260 L336 260 Z" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <!-- sprout -->
    <path d="M400 236 Q400 210 400 202" fill="none" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round"/>
    <path d="M400 218 Q390 210 386 202 M400 224 Q410 216 414 206" fill="none" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
    <!-- seed under soil -->
    <ellipse cx="396" cy="248" rx="6" ry="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <text x="256" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Tell what it is, and why it works that way.</text>
</svg>
