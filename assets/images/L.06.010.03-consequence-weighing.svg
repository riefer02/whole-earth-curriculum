<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Weighing the consequences of each choice</title>
  <desc id="desc">A consequence-weighing diagram. A balance scale sits in the center. On the left pan, labeled "Choice A: keep the secret," sit two labels: "helped: the friend (trust kept)" and "harmed: the person at risk." On the right pan, labeled "Choice B: tell a trusted adult," sit two labels: "helped: the person at risk" and "harmed: the friend (trust broken)." The two pans tip to show they weigh differently. A caption reads "weigh each choice by who is helped and who is harmed." Labels, shapes, and the tilt carry the meaning, so it prints clearly in grayscale independent of color.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Weigh the Consequences</text>
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">who is helped? who is harmed?</text>

  <!-- balance post -->
  <rect x="250" y="104" width="12" height="150" fill="#2b3a42"/>
  <rect x="224" y="248" width="64" height="12" rx="4" fill="#2b3a42"/>
  <!-- beam (tilted) -->
  <line x1="110" y1="140" x2="402" y2="168" stroke="#2b3a42" stroke-width="4"/>
  <circle cx="256" cy="152" r="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>

  <!-- left pan (higher, lighter-looking tilt) -->
  <line x1="110" y1="140" x2="92" y2="210" stroke="#2b3a42" stroke-width="2"/>
  <line x1="130" y1="144" x2="128" y2="210" stroke="#2b3a42" stroke-width="2"/>
  <path d="M60 210 Q110 250 160 210 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="110" y="176" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Choice A</text>

  <!-- right pan (lower, heavier tilt) -->
  <line x1="402" y1="168" x2="384" y2="240" stroke="#2b3a42" stroke-width="2"/>
  <line x1="418" y1="171" x2="416" y2="240" stroke="#2b3a42" stroke-width="2"/>
  <path d="M350 240 Q400 280 450 240 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="400" y="206" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Choice B</text>

  <!-- Left labels -->
  <rect x="28" y="300" width="196" height="86" rx="10" fill="#eef3f6" stroke="#4f6d7a" stroke-width="2"/>
  <text x="126" y="324" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">keep the secret</text>
  <text x="126" y="344" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">helped: the friend (trust kept)</text>
  <text x="126" y="362" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">harmed: the person at risk</text>

  <!-- Right labels -->
  <rect x="288" y="300" width="196" height="86" rx="10" fill="#eef3f6" stroke="#4f6d7a" stroke-width="2"/>
  <text x="386" y="324" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">tell a trusted adult</text>
  <text x="386" y="344" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">helped: the person at risk</text>
  <text x="386" y="362" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">harmed: the friend (trust broken)</text>

  <text x="256" y="428" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">some consequences are heavy, some light &#8212;</text>
  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">and they fall on different people</text>
  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">Weigh both sides before you decide.</text>
</svg>
