<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Waves carry energy</title>
  <desc id="desc">A diagram of a transverse wave with labeled parts. A horizontal rest line; a wavy line rises to a crest and falls to a trough. Labels: "crest" (the highest point), "trough" (the lowest point), "amplitude" (height from rest to crest, shown with a vertical arrow), and "wavelength" (distance from one crest to the next, shown with a horizontal arrow). A caption reads "the wave carries energy, not the medium — the water or air moves in place while the energy travels." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Anatomy of a Wave</text>

  <!-- rest line -->
  <line x1="30" y1="250" x2="482" y2="250" stroke="#4f6d7a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="488" y="250" text-anchor="end" font-family="sans-serif" font-size="12" fill="#4f6d7a">rest line</text>

  <!-- wave -->
  <path d="M40 250 Q70 180 100 250 T160 250 T220 250 T280 250 T340 250 T400 250 T460 250"
        fill="none" stroke="#2b3a42" stroke-width="3.5" stroke-linecap="round"/>

  <!-- crest label -->
  <text x="100" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e0a458">crest</text>
  <line x1="100" y1="168" x2="100" y2="182" stroke="#e0a458" stroke-width="2"/>

  <!-- trough label -->
  <text x="220" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6b93b6">trough</text>
  <line x1="220" y1="332" x2="220" y2="318" stroke="#6b93b6" stroke-width="2"/>

  <!-- amplitude arrow -->
  <line x1="60" y1="250" x2="60" y2="182" stroke="#7a9e7e" stroke-width="3" marker-end="url(#arr9)"/>
  <line x1="52" y1="182" x2="68" y2="182" stroke="#7a9e7e" stroke-width="2"/>
  <text x="66" y="216" font-family="sans-serif" font-size="13" fill="#7a9e7e">amplitude</text>
  <text x="66" y="232" font-family="sans-serif" font-size="11" fill="#7a9e7e">(height)</text>

  <!-- wavelength arrow -->
  <line x1="100" y1="140" x2="280" y2="140" stroke="#e0a458" stroke-width="3" marker-end="url(#arr9w)"/>
  <line x1="100" y1="132" x2="100" y2="148" stroke="#e0a458" stroke-width="2"/>
  <line x1="280" y1="132" x2="280" y2="148" stroke="#e0a458" stroke-width="2"/>
  <text x="190" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e0a458">wavelength</text>

  <defs>
    <marker id="arr9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z" fill="#7a9e7e"/>
    </marker>
    <marker id="arr9w" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z" fill="#e0a458"/>
    </marker>
  </defs>

  <!-- energy note -->
  <rect x="40" y="360" width="432" height="120" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="386" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A wave carries energy, not stuff</text>
  <text x="256" y="412" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Sound, light, and water waves all move energy from one place</text>
  <text x="256" y="432" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">to another. The medium (air, water) mostly moves in place —</text>
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">up and down or back and forth — while the energy travels on.</text>
</svg>
