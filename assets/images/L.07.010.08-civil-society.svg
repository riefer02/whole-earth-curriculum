<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Civil society: people acting together</title>
  <desc id="desc">A three-layer diagram. At the bottom, individual people. In the middle, civil-society groups joined by arrows. At the top, government. Arrows show people joining together in groups that act for the common good, and sometimes press government to act.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Civil society: people, together</text>

  <!-- government (top) -->
  <rect x="136" y="72" width="240" height="56" rx="10" fill="#6b93b6" opacity="0.3" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="108" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">government</text>

  <!-- civil society (middle) -->
  <rect x="86" y="188" width="340" height="112" rx="12" fill="#7a9e7e" opacity="0.3" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="214" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">civil society</text>
  <text x="256" y="236" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">voluntary groups acting for the common good</text>
  <circle cx="140" cy="272" r="12" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="196" cy="264" r="12" fill="#d9a066" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="256" cy="276" r="12" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="316" cy="264" r="12" fill="#d9a066" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="372" cy="272" r="12" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="152" y1="272" x2="184" y2="264" stroke="#2b3a42" stroke-width="2"/>
  <line x1="208" y1="264" x2="244" y2="276" stroke="#2b3a42" stroke-width="2"/>
  <line x1="268" y1="276" x2="304" y2="264" stroke="#2b3a42" stroke-width="2"/>
  <line x1="328" y1="264" x2="360" y2="272" stroke="#2b3a42" stroke-width="2"/>

  <!-- people (bottom) -->
  <circle cx="120" cy="424" r="14" fill="#d9a066" stroke="#2b3a42" stroke-width="2.5"/>
  <circle cx="176" cy="436" r="14" fill="#d9a066" stroke="#2b3a42" stroke-width="2.5"/>
  <circle cx="232" cy="428" r="14" fill="#d9a066" stroke="#2b3a42" stroke-width="2.5"/>
  <circle cx="288" cy="438" r="14" fill="#d9a066" stroke="#2b3a42" stroke-width="2.5"/>
  <circle cx="344" cy="428" r="14" fill="#d9a066" stroke="#2b3a42" stroke-width="2.5"/>
  <circle cx="400" cy="436" r="14" fill="#d9a066" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">people</text>

  <!-- arrows -->
  <line x1="256" y1="128" x2="256" y2="184" stroke="#2b3a42" stroke-width="2.5" stroke-dasharray="6 6"/>
  <line x1="176" y1="382" x2="200" y2="304" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arr2)"/>
  <line x1="344" y1="382" x2="320" y2="304" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arr2)"/>

  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b3a42"/>
    </marker>
  </defs>

  <text x="256" y="500" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">People join together, and sometimes press government to act.</text>
</svg>
