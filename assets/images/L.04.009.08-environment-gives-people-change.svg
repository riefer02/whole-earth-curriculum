<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The environment gives, people change it</title>
  <desc id="desc">Two rows show the lesson's idea. The top row shows how the environment gives what people need: a cold place gives fish and warm coverings, a desert gives dates and light cloth, a river valley gives grain and water. The bottom row shows how people change the environment: a terraced hillside for farming, an irrigation canal watering fields, and a dug well reaching water. Labels and shapes, not color, carry the meaning, so it prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#2b3a42">The Environment Gives, People Change It</text>
  <text x="256" y="56" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Two directions, one relationship between people and place.</text>

  <!-- top row: environment gives -->
  <text x="256" y="88" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">The environment gives food, water, and shelter</text>

  <!-- cold -->
  <rect x="30" y="100" width="140" height="130" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="100" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">cold place</text>
  <path d="M82 132 q0 -8 8 -8 q8 0 8 8 q0 6 -5 6 l-6 0 q-5 0 -5 -6 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M116 132 q0 -10 12 -10 q12 0 12 10 l0 12 q-6 4 -12 4 q-6 0 -12 -4 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="100" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">fish</text>
  <text x="100" y="174" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">warm covering</text>

  <!-- desert -->
  <rect x="186" y="100" width="140" height="130" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="256" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">desert</text>
  <circle cx="232" cy="150" r="5" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="244" cy="146" r="5" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <path d="M262 140 q10 0 10 8 q0 6 -5 6 l-10 0 q-5 0 -5 -6 q0 -8 10 -8 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">dates</text>
  <text x="256" y="174" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">light cloth</text>

  <!-- river valley -->
  <rect x="342" y="100" width="140" height="130" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="412" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">river valley</text>
  <path d="M384 148 q4 -8 8 -8 q4 0 8 8 l-3 2 l-5 -3 l-5 3 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M404 148 q4 -8 8 -8 q4 0 8 8 l-3 2 l-5 -3 l-5 3 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M388 158 l0 10 M416 158 l0 10 M408 158 l0 8" stroke="#2b3a42" stroke-width="2"/>
  <text x="412" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">grain</text>
  <text x="412" y="174" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">water + soil</text>

  <!-- bottom row: people change -->
  <text x="256" y="258" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">People change the environment to meet their needs</text>

  <!-- terrace -->
  <rect x="30" y="272" width="140" height="150" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M50 396 L80 360 L120 360 L150 396 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="50" y1="396" x2="150" y2="396" stroke="#2b3a42" stroke-width="2"/>
  <line x1="80" y1="360" x2="80" y2="396" stroke="#2b3a42" stroke-width="2"/>
  <line x1="120" y1="360" x2="120" y2="396" stroke="#2b3a42" stroke-width="2"/>
  <text x="100" y="302" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">terraced hillside</text>
  <text x="100" y="322" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">flat steps cut</text>
  <text x="100" y="336" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">into a slope</text>
  <text x="100" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">to farm it</text>

  <!-- canal -->
  <rect x="186" y="272" width="140" height="150" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M48 0" stroke="none"/>
  <path d="M210 380 L290 380 L306 408 L214 408 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="222" y1="380" x2="222" y2="364" stroke="#6b93b6" stroke-width="4"/>
  <line x1="256" y1="380" x2="256" y2="364" stroke="#6b93b6" stroke-width="4"/>
  <line x1="290" y1="380" x2="290" y2="364" stroke="#6b93b6" stroke-width="4"/>
  <text x="256" y="302" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">irrigation canal</text>
  <text x="256" y="322" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">channels carry</text>
  <text x="256" y="336" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">river water</text>
  <text x="256" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">to the fields</text>

  <!-- well -->
  <rect x="342" y="272" width="140" height="150" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <rect x="396" y="306" width="32" height="34" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M388 306 L436 306 L428 292 L396 292 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <rect x="404" y="340" width="16" height="40" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="412" y="302" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">dug well</text>
  <text x="412" y="318" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">digging down</text>
  <text x="412" y="332" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">to reach water</text>
  <text x="412" y="346" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">underground</text>

  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">The environment shapes people, and people shape the environment.</text>
  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Both directions, with knowledge and care, in every place on Earth.</text>
</svg>
