<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Drafting a paragraph as an argument</title>
  <desc id="desc">A paragraph drawn as a three-tier structure. Top tier: a topic sentence. Middle tier: two evidence blocks, one marked with a citation bracket. Bottom tier: a warrant and a transition. An arrow feeds from this paragraph to the next. Labels carry the meaning, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">A Paragraph Is a Small Argument</text>

  <!-- Topic sentence -->
  <rect x="60" y="66" width="392" height="52" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="88" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">topic sentence</text>
  <text x="256" y="106" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">the claim this paragraph argues</text>

  <!-- Down arrow -->
  <line x1="256" y1="118" x2="256" y2="140" stroke="#4f6d7a" stroke-width="2.5"/>
  <polygon points="256,140 250,131 262,131" fill="#4f6d7a"/>

  <!-- Evidence -->
  <rect x="60" y="142" width="190" height="86" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="155" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">evidence</text>
  <rect x="80" y="180" width="150" height="8" rx="2" fill="#2b3a42" opacity="0.55"/>
  <rect x="80" y="194" width="150" height="8" rx="2" fill="#2b3a42" opacity="0.55"/>
  <rect x="80" y="208" width="130" height="8" rx="2" fill="#2b3a42" opacity="0.55"/>
  <text x="238" y="222" text-anchor="end" font-family="sans-serif" font-size="11" fill="#4f6d7a">[1]</text>

  <rect x="262" y="142" width="190" height="86" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="357" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">evidence</text>
  <rect x="282" y="180" width="150" height="8" rx="2" fill="#2b3a42" opacity="0.55"/>
  <rect x="282" y="194" width="150" height="8" rx="2" fill="#2b3a42" opacity="0.55"/>
  <rect x="282" y="208" width="120" height="8" rx="2" fill="#2b3a42" opacity="0.55"/>
  <text x="440" y="222" text-anchor="end" font-family="sans-serif" font-size="11" fill="#4f6d7a">[2]</text>

  <!-- Down arrow -->
  <line x1="256" y1="228" x2="256" y2="250" stroke="#4f6d7a" stroke-width="2.5"/>
  <polygon points="256,250 250,241 262,241" fill="#4f6d7a"/>

  <!-- Warrant + transition -->
  <rect x="60" y="252" width="252" height="62" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="186" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">warrant</text>
  <text x="186" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">why the evidence matters</text>

  <rect x="322" y="252" width="130" height="62" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="387" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">transition</text>
  <text x="387" y="298" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#222222">hand-off to next</text>

  <!-- Next paragraph arrow -->
  <line x1="256" y1="314" x2="256" y2="360" stroke="#2b3a42" stroke-width="3"/>
  <polygon points="256,360 248,351 264,351" fill="#2b3a42"/>
  <rect x="150" y="364" width="212" height="40" rx="10" fill="#f0ede4" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="390" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">next paragraph</text>

  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">draft with structure in hand —</text>
  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">then revision is fixing beams, not sorting bricks</text>
</svg>
