<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">A problem we can't solve alone</title>
  <desc id="d">A shared resource — a pond drawn as a large circle — surrounded by six figures. Each has an arrow reaching toward the pond. The caption notes that when each person takes freely, the shared resource can be used up, so solving the problem needs coordination, not just individual choice.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222222">A shared resource</text>
  <circle cx="256" cy="240" r="110" fill="#6b93b6" opacity="0.45" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222222" font-weight="bold">the pond</text>
  <text x="256" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#222222">(or the air, the fish,</text>
  <text x="256" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#222222">the climate)</text>
  <!-- six figures around the pond -->
  <g stroke="#2b3a42" stroke-width="2">
    <circle cx="120" cy="150" r="13" fill="#e0a458"/>
    <circle cx="392" cy="150" r="13" fill="#7a9e7e"/>
    <circle cx="80" cy="260" r="13" fill="#6b93b6"/>
    <circle cx="432" cy="260" r="13" fill="#e0a458"/>
    <circle cx="140" cy="372" r="13" fill="#7a9e7e"/>
    <circle cx="372" cy="372" r="13" fill="#6b93b6"/>
  </g>
  <!-- arrows reaching in -->
  <line x1="133" y1="160" x2="196" y2="196" stroke="#2b3a42" stroke-width="2"/>
  <line x1="379" y1="160" x2="316" y2="196" stroke="#2b3a42" stroke-width="2"/>
  <line x1="93" y1="260" x2="150" y2="250" stroke="#2b3a42" stroke-width="2"/>
  <line x1="419" y1="260" x2="362" y2="250" stroke="#2b3a42" stroke-width="2"/>
  <line x1="152" y1="360" x2="200" y2="306" stroke="#2b3a42" stroke-width="2"/>
  <line x1="360" y1="360" x2="312" y2="306" stroke="#2b3a42" stroke-width="2"/>
  <!-- caption -->
  <text x="256" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#222222">Each person's choice is reasonable alone —</text>
  <text x="256" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#222222">but together they can use the pond up.</text>
  <text x="256" y="484" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#222222">Solving it needs coordination, not just good intentions.</text>
</svg>
