<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Medicine used safely versus misuse</title>
  <desc id="d">A two-column chart comparing medicine used as directed — right person, right dose, right time — with misuse — someone else's medicine, wrong dose, or a different purpose — plus a note that drugs change brain signaling.</desc>
  <rect x="0" y="0" width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">Medicine: Help or Harm?</text>

  <!-- left column -->
  <rect x="28" y="70" width="214" height="290" rx="14" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <rect x="28" y="70" width="214" height="48" rx="14" fill="#7a9e7e"/>
  <text x="135" y="100" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Used as directed</text>
  <text x="135" y="140" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">right person</text>
  <text x="135" y="164" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">right dose</text>
  <text x="135" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">right time</text>
  <text x="135" y="212" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">as a trusted adult or</text>
  <text x="135" y="230" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">clinician directs</text>
  <text x="135" y="272" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#7a9e7e">= help</text>
  <text x="135" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">prevents or treats illness</text>

  <!-- right column -->
  <rect x="270" y="70" width="214" height="290" rx="14" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <rect x="270" y="70" width="214" height="48" rx="14" fill="#e0a458"/>
  <text x="377" y="100" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Misuse</text>
  <text x="377" y="140" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">someone else's medicine</text>
  <text x="377" y="164" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">more than the dose</text>
  <text x="377" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">a different purpose</text>
  <text x="377" y="212" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">mixing with alcohol</text>
  <text x="377" y="230" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">or other drugs</text>
  <text x="377" y="272" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#e0a458">= harm</text>
  <text x="377" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">can injure or addict</text>

  <!-- brain note -->
  <rect x="28" y="380" width="456" height="60" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="406" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Mind-affecting drugs change brain signaling.</text>
  <text x="256" y="426" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">Repeated use can lead to dependence — a treatable health condition, never a moral failing.</text>

  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Never take medicine that isn't yours. When in doubt, ask a trusted adult.</text>
</svg>
