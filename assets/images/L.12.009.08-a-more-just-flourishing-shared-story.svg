<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A More Just, Flourishing Shared Story</title>
  <desc id="desc">A single trunk rising from many roots, each root labeled a different tradition — herbal medicine, biomedicine, Indigenous ecology, oral history, written science — and the canopy above labeled "a more just, flourishing shared story." Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2b3a42" font-weight="bold">Many Traditions, One Flourishing Story</text>

  <!-- canopy -->
  <ellipse cx="256" cy="130" rx="150" ry="70" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="256" y="122" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">a more just,</text>
  <text x="256" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">flourishing shared story</text>

  <!-- trunk -->
  <line x1="256" y1="200" x2="256" y2="330" stroke="#2b3a42" stroke-width="6"/>

  <!-- roots -->
  <path d="M256 330 Q200 380 120 400" fill="none" stroke="#4f6d7a" stroke-width="4"/>
  <path d="M256 330 Q230 390 210 420" fill="none" stroke="#4f6d7a" stroke-width="4"/>
  <path d="M256 330 Q290 390 310 420" fill="none" stroke="#4f6d7a" stroke-width="4"/>
  <path d="M256 330 Q320 380 400 400" fill="none" stroke="#4f6d7a" stroke-width="4"/>

  <!-- root labels -->
  <text x="96" y="414" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">herbal medicine</text>
  <text x="210" y="442" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">oral history</text>
  <text x="318" y="442" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">written science</text>
  <text x="418" y="414" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">Indigenous ecology</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">When one tradition crowds out the rest, everyone is poorer.</text>
</svg>
