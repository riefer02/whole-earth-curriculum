<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">When I was little: growing from then to now</title>
  <desc id="desc">Two framed pictures of the same child side by side. The left frame, labeled "then me," shows a small child crawling. The right frame, labeled "now me," shows a taller child running with one arm raised. A dashed arrow points from left to right. The same smiling heart floats above both children to show what stayed the same while they grew. Prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="52" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#2b3a42">When I Was Little</text>

  <!-- left frame -->
  <rect x="30" y="88" width="210" height="300" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="135" y="122" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222222">then me</text>

  <!-- crawling child (left) -->
  <g>
    <!-- head -->
    <circle cx="135" cy="200" r="24" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="126" cy="194" r="3" fill="#2b3a42"/>
    <circle cx="144" cy="194" r="3" fill="#2b3a42"/>
    <path d="M124 212 Q135 219 146 212" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- body -->
    <path d="M112 228 Q135 240 158 228 L156 268 Q135 276 114 268 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <!-- arms -->
    <line x1="112" y1="240" x2="92" y2="262" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="158" y1="240" x2="178" y2="262" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <!-- legs (crawling, bent) -->
    <line x1="122" y1="274" x2="104" y2="300" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="148" y1="274" x2="166" y2="300" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- shared heart above left child -->
  <g fill="#e0a458" stroke="#2b3a42" stroke-width="2">
    <circle cx="129" cy="152" r="6"/>
    <circle cx="141" cy="152" r="6"/>
    <path d="M124 156 L146 156 L135 168 Z"/>
  </g>

  <!-- growth arrow -->
  <line x1="250" y1="238" x2="272" y2="238" stroke="#2b3a42" stroke-width="3" stroke-dasharray="5 4"/>
  <path d="M272 232 L282 238 L272 244 Z" fill="#2b3a42"/>

  <!-- right frame -->
  <rect x="286" y="88" width="196" height="300" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="384" y="122" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222222">now me</text>

  <!-- running child (right, taller) -->
  <g>
    <circle cx="384" cy="196" r="26" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="375" cy="190" r="3.2" fill="#2b3a42"/>
    <circle cx="393" cy="190" r="3.2" fill="#2b3a42"/>
    <path d="M372 208 Q384 216 396 208" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- hair -->
    <path d="M358 184 Q384 162 410 184" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <!-- body -->
    <path d="M360 228 Q384 240 408 228 L404 282 Q384 292 364 282 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <!-- one arm raised, one arm low -->
    <line x1="364" y1="242" x2="346" y2="262" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="404" y1="242" x2="424" y2="216" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <!-- legs (running) -->
    <line x1="374" y1="288" x2="360" y2="318" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="394" y1="288" x2="410" y2="318" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- shared heart above right child -->
  <g fill="#e0a458" stroke="#2b3a42" stroke-width="2">
    <circle cx="378" cy="148" r="6"/>
    <circle cx="390" cy="148" r="6"/>
    <path d="M373 152 L395 152 L384 164 Z"/>
  </g>

  <text x="256" y="422" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">I grew &#183; and some parts stayed the same</text>
</svg>
