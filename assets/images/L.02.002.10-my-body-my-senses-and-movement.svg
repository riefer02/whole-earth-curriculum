<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My body, my senses and movement — a celebration</title>
  <desc id="desc">A four-part celebration of the body and its senses and movement. Senses: five doors (eyes, ears, nose, tongue, skin). Feelings: a small body map with labeled feeling spots. Move: a child combining hop and turn into a sequence. Ball: a child throwing and a child kicking a ball. Each part is labeled with words, so the meaning does not depend on color and it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">My Body, My Senses &amp; Movement</text>

  <!-- ===== Senses quadrant ===== -->
  <g>
    <rect x="20" y="62" width="232" height="210" rx="14" fill="#ffffff" stroke="#6b93b6" stroke-width="3"/>
    <text x="136" y="90" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">senses</text>
    <!-- five mini icons -->
    <ellipse cx="72" cy="130" rx="13" ry="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <circle cx="72" cy="130" r="4" fill="#2b3a42"/>
    <text x="72" y="154" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">sight</text>
    <path d="M128 122 Q116 130 126 144" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <text x="128" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">hearing</text>
    <path d="M184 124 Q194 134 184 146" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <text x="184" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">smell</text>
    <path d="M216 132 Q226 142 216 152" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M220 134 Q226 140 222 146 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="220" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">taste</text>
    <circle cx="148" cy="206" r="11" fill="#d6d1c7" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="148" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">touch</text>
    <text x="136" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">eyes, ears, nose, tongue, skin</text>
  </g>

  <!-- ===== Feelings quadrant ===== -->
  <g>
    <rect x="260" y="62" width="232" height="210" rx="14" fill="#ffffff" stroke="#7a9e7e" stroke-width="3"/>
    <text x="376" y="90" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">feelings</text>
    <!-- small body -->
    <circle cx="336" cy="126" r="20" fill="#d6d1c7" stroke="#2b3a42" stroke-width="2"/>
    <rect x="322" y="146" width="28" height="52" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <line x1="324" y1="154" x2="308" y2="180" stroke="#d6d1c7" stroke-width="9" stroke-linecap="round"/>
    <line x1="348" y1="154" x2="364" y2="180" stroke="#d6d1c7" stroke-width="9" stroke-linecap="round"/>
    <line x1="330" y1="198" x2="328" y2="222" stroke="#4f6d7a" stroke-width="9" stroke-linecap="round"/>
    <line x1="342" y1="198" x2="344" y2="222" stroke="#4f6d7a" stroke-width="9" stroke-linecap="round"/>
    <!-- spots -->
    <path d="M336 172 L339 178 L344 179 L340 182 L342 187 L336 184 L330 187 L332 182 L328 179 L333 178 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="1.4"/>
    <circle cx="326" cy="132" r="4" fill="#c96f5f" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="346" cy="132" r="4" fill="#c96f5f" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="376" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">where does a</text>
    <text x="376" y="160" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">feeling live?</text>
    <text x="376" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">fast heart = excited</text>
    <text x="376" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">fluttery tummy = nervous</text>
    <text x="376" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">heavy shoulders = sad</text>
    <text x="376" y="260" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">name it, and care for it</text>
  </g>

  <!-- ===== Move quadrant ===== -->
  <g>
    <rect x="20" y="284" width="232" height="210" rx="14" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
    <text x="136" y="312" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">move</text>
    <!-- hop child -->
    <circle cx="80" cy="368" r="18" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <rect x="66" y="386" width="28" height="34" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="68" y1="392" x2="56" y2="406" stroke="#c99567" stroke-width="8" stroke-linecap="round"/>
    <line x1="90" y1="392" x2="102" y2="406" stroke="#c99567" stroke-width="8" stroke-linecap="round"/>
    <line x1="74" y1="420" x2="70" y2="438" stroke="#4f6d7a" stroke-width="8" stroke-linecap="round"/>
    <line x1="86" y1="420" x2="94" y2="436" stroke="#4f6d7a" stroke-width="8" stroke-linecap="round"/>
    <text x="80" y="462" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">hop</text>
    <!-- arrow -->
    <path d="M118 400 L140 400" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M134 394 L140 400 L134 406" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- turn child -->
    <circle cx="178" cy="368" r="18" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <rect x="164" y="386" width="28" height="34" rx="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="166" y1="392" x2="154" y2="406" stroke="#8f5f3d" stroke-width="8" stroke-linecap="round"/>
    <line x1="188" y1="392" x2="200" y2="406" stroke="#8f5f3d" stroke-width="8" stroke-linecap="round"/>
    <line x1="172" y1="420" x2="168" y2="438" stroke="#4f6d7a" stroke-width="8" stroke-linecap="round"/>
    <line x1="184" y1="420" x2="188" y2="438" stroke="#4f6d7a" stroke-width="8" stroke-linecap="round"/>
    <path d="M180 342 Q196 362 180 370" fill="none" stroke="#2b3a42" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="178" y="462" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">turn</text>
    <text x="136" y="486" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">two movements make a sequence</text>
  </g>

  <!-- ===== Ball quadrant ===== -->
  <g>
    <rect x="260" y="284" width="232" height="210" rx="14" fill="#ffffff" stroke="#6b93b6" stroke-width="3"/>
    <text x="376" y="312" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">ball</text>
    <!-- throwing child -->
    <circle cx="320" cy="372" r="17" fill="#d9a066" stroke="#2b3a42" stroke-width="2"/>
    <rect x="306" y="388" width="28" height="34" rx="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="308" y1="394" x2="294" y2="392" stroke="#d9a066" stroke-width="8" stroke-linecap="round"/>
    <line x1="332" y1="394" x2="346" y2="392" stroke="#d9a066" stroke-width="8" stroke-linecap="round"/>
    <circle cx="320" cy="390" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="320" y="452" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">throw, catch</text>
    <!-- kicking child -->
    <circle cx="420" cy="372" r="17" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <rect x="406" y="388" width="28" height="34" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="408" y1="394" x2="394" y2="392" stroke="#c99567" stroke-width="8" stroke-linecap="round"/>
    <line x1="432" y1="394" x2="446" y2="392" stroke="#c99567" stroke-width="8" stroke-linecap="round"/>
    <line x1="414" y1="422" x2="410" y2="440" stroke="#4f6d7a" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="408" cy="444" rx="9" ry="4.5" fill="#2b3a42"/>
    <circle cx="448" cy="434" r="11" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="420" y="452" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">and kick</text>
    <text x="376" y="486" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">both hands, both feet</text>
  </g>

  <text x="256" y="500" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">Celebrate everything your body can sense, feel, and do.</text>
</svg>
