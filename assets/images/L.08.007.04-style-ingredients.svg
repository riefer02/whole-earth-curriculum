<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The ingredients of a musical style</title>
  <desc id="desc">Four labeled boxes for the ingredients of a musical style — scale or mode, rhythm, texture and timbre, and form — each feeding into a central box labeled your composed piece, with two example traditions, raga and maqam, shown nearby.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Ingredients of a Style</text>

  <!-- central piece -->
  <rect x="186" y="222" width="140" height="86" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="258" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Your Composed</text>
  <text x="256" y="278" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Piece</text>

  <!-- ingredient: scale/mode -->
  <rect x="40" y="96" width="196" height="66" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="62" cy="118" r="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="80" y="123" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Scale or mode</text>
  <text x="50" y="144" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">which notes the melody draws from</text>

  <!-- ingredient: rhythm -->
  <rect x="276" y="96" width="196" height="66" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="298" cy="118" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="316" y="123" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Rhythm</text>
  <text x="286" y="144" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">the pattern of beats and rests</text>

  <!-- ingredient: texture/timbre -->
  <rect x="40" y="340" width="196" height="66" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="62" cy="362" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="80" y="367" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Texture &amp; timbre</text>
  <text x="50" y="388" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">what voices or instruments sound like</text>

  <!-- ingredient: form -->
  <rect x="276" y="340" width="196" height="66" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="298" cy="362" r="9" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="316" y="367" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Form</text>
  <text x="286" y="388" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">a beginning, a middle, an end</text>

  <!-- connectors -->
  <path d="M138 162 L200 226" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M374 162 L312 226" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M138 340 L200 304" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M374 340 L312 304" fill="none" stroke="#4f6d7a" stroke-width="2"/>

  <!-- examples -->
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Every tradition mixes these differently — a raga, a maqam, the blues</text>
</svg>
