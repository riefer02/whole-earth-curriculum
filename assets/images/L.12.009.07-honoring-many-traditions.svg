<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Honoring Many Traditions</title>
  <desc id="desc">A central circle labeled "a living tradition" with four smaller circles around it, each labeled one act of honoring — recognize it, credit its keepers, protect it, pass it on. Arrows run both ways between center and each small circle. Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2b3a42" font-weight="bold">Four Acts of Honoring a Tradition</text>

  <!-- central -->
  <circle cx="256" cy="230" r="80" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="222" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">A living</text>
  <text x="256" y="242" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">tradition</text>

  <!-- four small circles -->
  <circle cx="256" cy="96" r="52" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <text x="256" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42" font-weight="bold">recognize</text>
  <text x="256" y="108" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">it as knowledge</text>

  <circle cx="120" cy="320" r="52" fill="none" stroke="#e0a458" stroke-width="3"/>
  <text x="120" y="314" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42" font-weight="bold">credit</text>
  <text x="120" y="332" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">its keepers</text>

  <circle cx="392" cy="320" r="52" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="392" y="314" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42" font-weight="bold">protect</text>
  <text x="392" y="332" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">it from erasure</text>

  <circle cx="256" cy="420" r="52" fill="none" stroke="#4f6d7a" stroke-width="3"/>
  <text x="256" y="414" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42" font-weight="bold">pass it on</text>
  <text x="256" y="432" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">to the next generation</text>

  <!-- bidirectional arrows -->
  <line x1="256" y1="150" x2="256" y2="174" stroke="#2b3a42" stroke-width="3"/>
  <line x1="178" y1="262" x2="196" y2="276" stroke="#2b3a42" stroke-width="3"/>
  <line x1="334" y1="262" x2="316" y2="276" stroke="#2b3a42" stroke-width="3"/>
  <line x1="256" y1="310" x2="256" y2="366" stroke="#2b3a42" stroke-width="3"/>

  <text x="256" y="494" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Honoring is more than tolerating — and more than taking without credit.</text>
</svg>
