<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Unfair, then someone helps</title>
  <desc id="desc">Two panels show one gentle story with a repair. The first panel is labeled unfair: three children play with a ball while a fourth child stands apart, head down, left out for no reason. The second panel is labeled help: one child reaches out and invites the left-out child to join, and now all four play together and smile. The labels, the positions of the figures, and the sad-to-smiling faces, not color, carry the meaning, so the picture prints clearly in grayscale and shows that noticing unfairness and inviting someone in is a kind thing anyone can do. The story is gentle and blame-free and ends in repair.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Unfair, Then Someone Helps</text>

  <!-- panels -->
  <rect x="20" y="80" width="226" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="266" y="80" width="226" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>

  <text x="133" y="106" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">unfair</text>
  <text x="379" y="106" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">help</text>

  <!-- arrow between panels -->
  <line x1="250" y1="230" x2="260" y2="230" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <path d="M260 224 L267 230 L260 236 Z" fill="#4f6d7a"/>
  <text x="255" y="214" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">then</text>

  <!-- ===== Panel 1: three play, one left out ===== -->
  <!-- ball -->
  <circle cx="95" cy="196" r="14" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M95 182 A14 14 0 0 1 109 196" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M95 182 A14 14 0 0 0 81 196" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <!-- figure A (top) -->
  <circle cx="95" cy="150" r="12" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M83 148 A12 12 0 0 1 107 148 Z" fill="#2b3a42"/>
  <circle cx="90" cy="150" r="1.6" fill="#2b3a42"/>
  <circle cx="100" cy="150" r="1.6" fill="#2b3a42"/>
  <path d="M90 157 Q95 161 100 157" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="86" y="163" width="18" height="30" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="90" y1="193" x2="88" y2="216" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="100" y1="193" x2="102" y2="216" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <!-- figure B (left) -->
  <circle cx="58" cy="200" r="12" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M46 198 A12 12 0 0 1 70 198 Z" fill="#4f6d7a"/>
  <circle cx="53" cy="200" r="1.6" fill="#2b3a42"/>
  <circle cx="63" cy="200" r="1.6" fill="#2b3a42"/>
  <path d="M53 207 Q58 211 63 207" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="49" y="213" width="18" height="28" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="53" y1="241" x2="51" y2="262" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="63" y1="241" x2="65" y2="262" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <!-- figure C (right) -->
  <circle cx="132" cy="200" r="12" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M120 198 A12 12 0 0 1 144 198 Z" fill="#2b3a42"/>
  <circle cx="127" cy="200" r="1.6" fill="#2b3a42"/>
  <circle cx="137" cy="200" r="1.6" fill="#2b3a42"/>
  <path d="M127 207 Q132 211 137 207" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="123" y="213" width="18" height="28" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="127" y1="241" x2="125" y2="262" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="137" y1="241" x2="139" y2="262" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <!-- figure D (left out, sad) -->
  <circle cx="206" cy="230" r="12" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <path d="M194 228 A12 12 0 0 1 218 228 Z" fill="#4f6d7a"/>
  <circle cx="201" cy="230" r="1.6" fill="#2b3a42"/>
  <circle cx="211" cy="230" r="1.6" fill="#2b3a42"/>
  <path d="M201 240 Q206 236 211 240" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="197" y="243" width="18" height="28" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="201" y1="271" x2="199" y2="292" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="211" y1="271" x2="213" y2="292" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <text x="133" y="358" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">left out for no reason</text>

  <!-- ===== Panel 2: someone invites them in ===== -->
  <!-- ball -->
  <circle cx="348" cy="196" r="14" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M348 182 A14 14 0 0 1 362 196" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M348 182 A14 14 0 0 0 334 196" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <!-- figure A (top, reaching out) -->
  <circle cx="348" cy="150" r="12" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M336 148 A12 12 0 0 1 360 148 Z" fill="#2b3a42"/>
  <circle cx="343" cy="150" r="1.6" fill="#2b3a42"/>
  <circle cx="353" cy="150" r="1.6" fill="#2b3a42"/>
  <path d="M343 157 Q348 161 353 157" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="339" y="163" width="18" height="30" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="357" y1="178" x2="372" y2="196" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="343" y1="193" x2="341" y2="216" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="353" y1="193" x2="355" y2="216" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <!-- figure B (left) -->
  <circle cx="312" cy="200" r="12" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M300 198 A12 12 0 0 1 324 198 Z" fill="#2b3a42"/>
  <circle cx="307" cy="200" r="1.6" fill="#2b3a42"/>
  <circle cx="317" cy="200" r="1.6" fill="#2b3a42"/>
  <path d="M307 207 Q312 211 317 207" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="303" y="213" width="18" height="28" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="307" y1="241" x2="305" y2="262" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="317" y1="241" x2="319" y2="262" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <!-- figure C (right) -->
  <circle cx="386" cy="200" r="12" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M374 198 A12 12 0 0 1 398 198 Z" fill="#4f6d7a"/>
  <circle cx="381" cy="200" r="1.6" fill="#2b3a42"/>
  <circle cx="391" cy="200" r="1.6" fill="#2b3a42"/>
  <path d="M381 207 Q386 211 391 207" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="377" y="213" width="18" height="28" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="381" y1="241" x2="379" y2="262" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="391" y1="241" x2="393" y2="262" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <!-- figure D (now included, smiling) -->
  <circle cx="430" cy="230" r="12" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <path d="M418 228 A12 12 0 0 1 442 228 Z" fill="#4f6d7a"/>
  <circle cx="425" cy="230" r="1.6" fill="#2b3a42"/>
  <circle cx="435" cy="230" r="1.6" fill="#2b3a42"/>
  <path d="M425 236 Q430 241 435 236" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="421" y="243" width="18" height="28" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="425" y1="271" x2="423" y2="292" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="435" y1="271" x2="437" y2="292" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <!-- arm reaching in -->
  <line x1="414" y1="238" x2="400" y2="248" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <text x="379" y="358" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">come play with us</text>

  <text x="256" y="416" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Noticing unfairness is the first step &#183; helping is the next.</text>
  <text x="256" y="442" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">No child is ever the problem &#183; anyone can help</text>
</svg>
