<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Reading with fluency</title>
  <desc id="desc">A child reads aloud from a book while a smooth, flowing wave of sound rises from the page. Three punctuation marks — a period, a comma, and a question mark — stand beside the text as signposts for pause and voice. The labels and shapes carry the meaning, so the picture prints clearly in grayscale and teaches learners that fluency means reading smoothly, at a talking pace, with expression that follows the punctuation.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Reading with Fluency</text>

  <!-- child reading -->
  <circle cx="170" cy="160" r="28" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M134 238 Q130 188 170 188 Q210 188 206 238 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  <!-- open book -->
  <path d="M86 278 Q128 260 170 278 L170 306 Q128 288 86 306 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M254 278 Q212 260 170 278 L170 306 Q212 288 254 306 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#4f6d7a" stroke-width="3" stroke-linecap="round">
    <line x1="98" y1="292" x2="120" y2="292"/>
    <line x1="126" y1="292" x2="148" y2="292"/>
    <line x1="154" y1="292" x2="176" y2="292"/>
    <line x1="182" y1="292" x2="204" y2="292"/>
    <line x1="210" y1="292" x2="232" y2="292"/>
  </g>

  <!-- smooth sound wave -->
  <path d="M196 150 Q232 120 268 150 T340 150" fill="none" stroke="#6b93b6" stroke-width="4" stroke-linecap="round"/>
  <path d="M196 138 Q236 104 276 138 T352 138" fill="none" stroke="#6b93b6" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- punctuation signposts -->
  <g>
    <circle cx="316" cy="240" r="20" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="316" cy="248" r="4" fill="#2b3a42"/>
    <text x="316" y="288" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">period — stop</text>

    <circle cx="384" cy="240" r="20" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M380 236 Q384 244 388 236 L392 244 L382 252 Z" fill="#2b3a42"/>
    <text x="384" y="288" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">comma — pause</text>

    <circle cx="452" cy="240" r="20" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="452" y="249" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">?</text>
    <text x="452" y="288" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">question — rise</text>
  </g>

  <text x="256" y="344" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Fluency is smooth, like talking — not racing, and never against anyone.</text>
  <text x="256" y="370" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">Re-reading a familiar text makes the voice flow.</text>
</svg>
