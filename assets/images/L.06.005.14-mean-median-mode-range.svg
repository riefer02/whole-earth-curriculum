<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Mean, median, mode, and range</title>
  <desc id="desc">A dot plot of the number of books read by a class in a month, with values 1, 2, 3, 4, 5, and 20. Most dots cluster at 2, 3, and 4, with one dot at 20 (an outlier). Vertical lines mark the mode (3), the median (3), and the mean (about 4.08), which the single large value pulls up. A bracket shows the range from 1 to 20. A caption reads "an outlier pulls the mean but not the median or mode." Labels, numbers, and position, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Mean, Median, Mode, and Range</text>
  <text x="256" y="58" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">books read by a class this month — one very fast reader is the 20</text>

  <g transform="translate(40, 90)">
    <line x1="0" y1="0" x2="0" y2="230" stroke="#2b3a42" stroke-width="3"/>
    <line x1="0" y1="230" x2="440" y2="230" stroke="#2b3a42" stroke-width="3"/>

    <text x="0" y="252" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">1</text>
    <text x="60" y="252" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">2</text>
    <text x="120" y="252" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">3</text>
    <text x="180" y="252" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">4</text>
    <text x="240" y="252" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">5</text>
    <text x="420" y="252" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">20</text>
    <text x="220" y="282" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6b93b6">books read</text>

    <g fill="#2b3a42">
      <circle cx="0" cy="220" r="6"/><circle cx="0" cy="204" r="6"/>
      <circle cx="60" cy="220" r="6"/><circle cx="60" cy="204" r="6"/><circle cx="60" cy="188" r="6"/>
      <circle cx="120" cy="220" r="6"/><circle cx="120" cy="204" r="6"/><circle cx="120" cy="188" r="6"/><circle cx="120" cy="172" r="6"/>
      <circle cx="180" cy="220" r="6"/><circle cx="180" cy="204" r="6"/>
      <circle cx="240" cy="220" r="6"/>
      <circle cx="420" cy="220" r="6"/>
    </g>

    <!-- mode -->
    <line x1="120" y1="150" x2="120" y2="226" stroke="#7a9e7e" stroke-width="3"/>
    <text x="120" y="138" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7a9e7e">mode 3</text>

    <!-- median -->
    <line x1="120" y1="110" x2="120" y2="226" stroke="#e0a458" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="60" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e0a458">median 3</text>

    <!-- mean -->
    <line x1="168" y1="70" x2="168" y2="226" stroke="#6b93b6" stroke-width="3"/>
    <text x="196" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6b93b6">mean ≈ 4.08</text>

    <!-- range -->
    <path d="M0 60 L0 50 L420 50 L420 60" fill="none" stroke="#2b3a42" stroke-width="3"/>
    <text x="210" y="44" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">range: 1 to 20</text>
  </g>

  <text x="256" y="394" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">the single 20 pulls the mean up, but not the median or mode</text>
  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">mean: balance point · median: middle value · mode: most common · range: spread</text>
  <text x="256" y="460" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">choose the measure that best answers your question — sometimes the median</text>
  <text x="256" y="482" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">tells the truer story of "what most learners did" than the mean does</text>
</svg>
