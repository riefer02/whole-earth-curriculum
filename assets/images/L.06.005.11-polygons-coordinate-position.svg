<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Polygons on the coordinate plane: position</title>
  <desc id="desc">A four-quadrant coordinate plane with axes from minus 4 to 4. A rectangle is drawn with vertices at (minus 3, 2), (2, 2), (2, minus 2), and (minus 3, minus 2), each vertex labeled. The rectangle crosses two quadrants. The axes are labeled x and y, and the quadrants are numbered I, II, III, IV. Labels, numbers, and position, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Polygons on the Coordinate Plane: Position</text>
  <text x="256" y="58" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">vertices are named by ordered pairs; the axes split the plane into four quadrants</text>

  <g transform="translate(70, 60)">
    <line x1="0" y1="0" x2="0" y2="360" stroke="#2b3a42" stroke-width="3"/>
    <line x1="0" y1="180" x2="360" y2="180" stroke="#2b3a42" stroke-width="3"/>
    <g stroke="#d7d1c8" stroke-width="1">
      <line x1="45" y1="0" x2="45" y2="360"/><line x1="90" y1="0" x2="90" y2="360"/>
      <line x1="135" y1="0" x2="135" y2="360"/><line x1="180" y1="0" x2="180" y2="360"/>
      <line x1="225" y1="0" x2="225" y2="360"/><line x1="270" y1="0" x2="270" y2="360"/><line x1="315" y1="0" x2="315" y2="360"/>
      <line x1="0" y1="45" x2="360" y2="45"/><line x1="0" y1="90" x2="360" y2="90"/>
      <line x1="0" y1="135" x2="360" y2="135"/><line x1="0" y1="225" x2="360" y2="225"/>
      <line x1="0" y1="270" x2="360" y2="270"/><line x1="0" y1="315" x2="360" y2="315"/>
    </g>

    <!-- axis labels -->
    <text x="180" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">0</text>
    <text x="45" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">1</text>
    <text x="90" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">2</text>
    <text x="135" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">3</text>
    <text x="225" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">-1</text>
    <text x="270" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">-2</text>
    <text x="315" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">-3</text>
    <text x="160" y="135" text-anchor="end" font-family="sans-serif" font-size="12" fill="#222222">1</text>
    <text x="160" y="90" text-anchor="end" font-family="sans-serif" font-size="12" fill="#222222">2</text>
    <text x="160" y="45" text-anchor="end" font-family="sans-serif" font-size="12" fill="#222222">3</text>
    <text x="160" y="225" text-anchor="end" font-family="sans-serif" font-size="12" fill="#222222">-1</text>
    <text x="160" y="270" text-anchor="end" font-family="sans-serif" font-size="12" fill="#222222">-2</text>
    <text x="160" y="315" text-anchor="end" font-family="sans-serif" font-size="12" fill="#222222">-3</text>

    <text x="350" y="204" text-anchor="end" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6b93b6">x</text>
    <text x="12" y="14" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6b93b6">y</text>

    <!-- quadrants -->
    <text x="240" y="40" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">II</text>
    <text x="120" y="40" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">I</text>
    <text x="240" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">III</text>
    <text x="120" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">IV</text>

    <!-- rectangle -->
    <polygon points="45,90 270,90 270,270 45,270" fill="#e0a458" fill-opacity="0.35" stroke="#2b3a42" stroke-width="3"/>
    <circle cx="45" cy="90" r="7" fill="#2b3a42"/>
    <circle cx="270" cy="90" r="7" fill="#2b3a42"/>
    <circle cx="270" cy="270" r="7" fill="#2b3a42"/>
    <circle cx="45" cy="270" r="7" fill="#2b3a42"/>
    <text x="45" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">(-3, 2)</text>
    <text x="270" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">(2, 2)</text>
    <text x="278" y="286" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">(2, -2)</text>
    <text x="40" y="288" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">(-3, -2)</text>
  </g>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">a polygon's place comes from its vertices' ordered pairs</text>
  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">negative coordinates put a point left of the y-axis or below the x-axis</text>
</svg>
