<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Three losses of colonization, and what people kept alive</title>
  <desc id="desc">Three columns labeled land, culture, and self-rule, each showing what was taken. Below them a row of small symbols — a drum, a book, a seed — with the words "what people kept alive." The picture holds both the loss and the survival together.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="52" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">What was taken, what was kept</text>

  <!-- Three losses -->
  <g font-family="sans-serif">
    <rect x="24" y="92" width="144" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="96" y="126" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b3a42">land</text>
    <path d="M50 200 L74 150 L98 200 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M40 200 L96 200 L96 210 L40 210 Z" fill="#8f5f3d" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="96" y="232" text-anchor="middle" font-size="12" fill="#4f6d7a">homelands taken</text>

    <rect x="184" y="92" width="144" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="126" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b3a42">culture</text>
    <rect x="220" y="152" width="30" height="40" rx="3" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="262" y="152" width="30" height="40" rx="3" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="232" text-anchor="middle" font-size="12" fill="#4f6d7a">languages pushed aside</text>

    <rect x="344" y="92" width="144" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="416" y="126" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b3a42">self-rule</text>
    <circle cx="400" cy="172" r="18" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
    <line x1="388" y1="172" x2="412" y2="172" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="416" y="232" text-anchor="middle" font-size="12" fill="#4f6d7a">ruled by others</text>
  </g>

  <!-- Divider -->
  <line x1="36" y1="280" x2="476" y2="280" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- What was kept -->
  <text x="256" y="324" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">And what people kept alive</text>
  <g font-family="sans-serif">
    <circle cx="128" cy="372" r="30" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="128" y="378" text-anchor="middle" font-size="13" fill="#222222">drum</text>

    <circle cx="256" cy="372" r="30" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="244" y="358" width="24" height="28" rx="3" fill="#fdfbf7" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="256" y="414" text-anchor="middle" font-size="13" fill="#222222">story</text>

    <circle cx="384" cy="372" r="30" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="384" y="378" text-anchor="middle" font-size="13" fill="#222222">seed</text>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Loss is real — and so is survival, resistance, and continuity.</text>
</svg>
