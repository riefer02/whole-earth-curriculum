<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Operating with integers</title>
  <desc id="desc">An integer operations diagram on a vertical temperature number line from −20 to +20. Arrows show: −5 + 8 = +3 (a rise from −5 up 8), 3 − 5 = −2 (a fall of 5 from 3), and −3 × −2 = +6 with a note "a negative times a negative is positive." A small table lists the sign rules for multiply/divide: same signs → positive, different signs → negative. Labels, counts, and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="28" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Operating with Integers</text>

  <!-- vertical number line -->
  <line x1="120" y1="60" x2="120" y2="440" stroke="#2b3a42" stroke-width="2"/>
  <!-- ticks every 20px = 2 degrees, from +20 (top, y=60) to -20 (bottom, y=440) -->
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="112" y1="60" x2="128" y2="60"/>
    <line x1="112" y1="98" x2="128" y2="98"/>
    <line x1="112" y1="136" x2="128" y2="136"/>
    <line x1="112" y1="174" x2="128" y2="174"/>
    <line x1="112" y1="212" x2="128" y2="212"/>
    <line x1="112" y1="250" x2="128" y2="250"/>
    <line x1="112" y1="288" x2="128" y2="288"/>
    <line x1="112" y1="326" x2="128" y2="326"/>
    <line x1="112" y1="364" x2="128" y2="364"/>
    <line x1="112" y1="402" x2="128" y2="402"/>
    <line x1="112" y1="440" x2="128" y2="440"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#222222" text-anchor="end">
    <text x="108" y="64">+20</text>
    <text x="108" y="102">+10</text>
    <text x="108" y="140">+5</text>
    <text x="108" y="216">0</text>
    <text x="108" y="292">−5</text>
    <text x="108" y="368">−10</text>
    <text x="108" y="444">−20</text>
  </g>

  <!-- arrow 1: -5 + 8 = +3 -->
  <g stroke="#e0a458" stroke-width="3" fill="none">
    <line x1="150" y1="292" x2="150" y2="140"/>
    <polygon points="144,146 150,132 156,146" fill="#e0a458"/>
  </g>
  <text x="166" y="216" font-family="sans-serif" font-size="13" fill="#4f6d7a">−5 + 8 = +3</text>
  <text x="166" y="234" font-family="sans-serif" font-size="12" fill="#4f6d7a">(rise 8)</text>

  <!-- arrow 2: 3 - 5 = -2 -->
  <g stroke="#6b93b6" stroke-width="3" fill="none">
    <line x1="230" y1="140" x2="230" y2="212"/>
    <polygon points="224,206 230,220 236,206" fill="#6b93b6"/>
  </g>
  <text x="246" y="178" font-family="sans-serif" font-size="13" fill="#4f6d7a">3 − 5 = −2</text>
  <text x="246" y="196" font-family="sans-serif" font-size="12" fill="#4f6d7a">(fall 5)</text>

  <!-- sign rules table -->
  <rect x="300" y="60" width="190" height="150" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="395" y="84" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">multiply / divide</text>
  <line x1="300" y1="96" x2="490" y2="96" stroke="#2b3a42" stroke-width="2"/>
  <text x="320" y="120" font-family="sans-serif" font-size="13" fill="#222222">same signs → positive</text>
  <text x="320" y="142" font-family="sans-serif" font-size="13" fill="#222222">(−3) × (−2) = +6</text>
  <text x="320" y="170" font-family="sans-serif" font-size="13" fill="#222222">different signs → negative</text>
  <text x="320" y="192" font-family="sans-serif" font-size="13" fill="#222222">(−6) ÷ 2 = −3</text>

  <!-- rules summary -->
  <rect x="40" y="320" width="432" height="70" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="256" y="346" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">add a positive: move up · add a negative: move down</text>
  <text x="256" y="368" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">subtract: move the opposite way · subtract a negative: move up</text>

  <text x="256" y="424" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">a +1 and a −1 make a zero pair</text>
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">negatives name cold below zero, depth below sea level, money owed</text>
  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">negative numbers: red/black rods in ancient China · rules in India (7th c.)</text>
</svg>
