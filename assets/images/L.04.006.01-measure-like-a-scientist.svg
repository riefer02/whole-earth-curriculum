<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" font-family="sans-serif">
  <title>Four tools of measurement</title>
  <desc>Four simple tools in a row: a ruler marked in centimeters for length, a balance scale for mass in grams, a thermometer for temperature in degrees Celsius, and a magnifier for looking closely. Each is labeled with what it measures and its unit.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-size="26" fill="#222222" font-weight="bold">A measurement is a number + a unit</text>

  <!-- Ruler -->
  <rect x="40" y="90" width="100" height="220" rx="10" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="90" y="120" text-anchor="middle" font-size="18" fill="#2b3a42" font-weight="bold">Ruler</text>
  <rect x="56" y="140" width="68" height="150" rx="4" fill="#e0a458" opacity="0.35" stroke="#e0a458" stroke-width="2"/>
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="60" y1="150" x2="80" y2="150"/>
    <line x1="60" y1="170" x2="70" y2="170"/>
    <line x1="60" y1="190" x2="80" y2="190"/>
    <line x1="60" y1="210" x2="70" y2="210"/>
    <line x1="60" y1="230" x2="80" y2="230"/>
    <line x1="60" y1="250" x2="70" y2="250"/>
    <line x1="60" y1="270" x2="80" y2="270"/>
  </g>
  <text x="90" y="310" text-anchor="middle" font-size="16" fill="#4f6d7a">length</text>
  <text x="90" y="330" text-anchor="middle" font-size="16" fill="#4f6d7a">centimeters</text>

  <!-- Scale -->
  <rect x="160" y="90" width="100" height="220" rx="10" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="210" y="120" text-anchor="middle" font-size="18" fill="#2b3a42" font-weight="bold">Scale</text>
  <line x1="210" y1="140" x2="210" y2="210" stroke="#2b3a42" stroke-width="4"/>
  <line x1="176" y1="210" x2="244" y2="210" stroke="#2b3a42" stroke-width="4"/>
  <path d="M176 210 L166 250 L176 250 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M244 210 L254 250 L244 250 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="210" cy="262" r="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="210" y="310" text-anchor="middle" font-size="16" fill="#4f6d7a">mass</text>
  <text x="210" y="330" text-anchor="middle" font-size="16" fill="#4f6d7a">grams</text>

  <!-- Thermometer -->
  <rect x="280" y="90" width="100" height="220" rx="10" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="330" y="120" text-anchor="middle" font-size="18" fill="#2b3a42" font-weight="bold">Thermometer</text>
  <rect x="320" y="140" width="20" height="140" rx="10" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <rect x="322" y="200" width="16" height="78" rx="8" fill="#e0a458" stroke="#e0a458" stroke-width="2"/>
  <circle cx="330" cy="288" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <text x="330" y="310" text-anchor="middle" font-size="16" fill="#4f6d7a">temperature</text>
  <text x="330" y="330" text-anchor="middle" font-size="16" fill="#4f6d7a">degrees C</text>

  <!-- Magnifier -->
  <rect x="400" y="90" width="76" height="220" rx="10" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="438" y="120" text-anchor="middle" font-size="18" fill="#2b3a42" font-weight="bold">Magnifier</text>
  <circle cx="430" cy="205" r="46" fill="#6b93b6" opacity="0.35" stroke="#2b3a42" stroke-width="3"/>
  <line x1="462" y1="238" x2="470" y2="270" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <text x="438" y="310" text-anchor="middle" font-size="16" fill="#4f6d7a">look close</text>
  <text x="438" y="330" text-anchor="middle" font-size="16" fill="#4f6d7a">details</text>

  <rect x="90" y="390" width="332" height="66" rx="12" fill="#7a9e7e" opacity="0.25" stroke="#7a9e7e" stroke-width="2"/>
  <text x="256" y="420" text-anchor="middle" font-size="19" fill="#222222">Always write the number</text>
  <text x="256" y="444" text-anchor="middle" font-size="19" fill="#222222">with its unit.</text>
</svg>
