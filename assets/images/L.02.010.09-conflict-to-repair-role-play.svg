<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Conflict to repair: a role-play</title>
  <desc id="desc">A three-step strip shows the whole path from conflict to repair. Step 1, labeled conflict: two children pull the same ball and frown. Step 2, labeled peaceful solve: the same two children face each other and take turns passing the ball. Step 3, labeled real apology: one child reaches out and says "I am sorry," and both smile, with a caption "fix the harm." Numbered labels and the actions, not color, carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Conflict to Repair: A Role-Play</text>

  <!-- step 1 -->
  <rect x="20" y="70" width="150" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="95" y="96" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">1</text>
  <text x="95" y="116" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">conflict</text>

  <circle cx="95" cy="220" r="15" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M95 205 A15 15 0 0 1 110 220" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M95 205 A15 15 0 0 0 80 220" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <circle cx="70" cy="180" r="13" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M57 178 A13 13 0 0 1 83 178 Z" fill="#2b3a42"/>
  <circle cx="65" cy="180" r="1.6" fill="#2b3a42"/>
  <circle cx="75" cy="180" r="1.6" fill="#2b3a42"/>
  <path d="M65 189 Q70 185 75 189" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="62" y="194" width="18" height="32" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="66" y1="226" x2="64" y2="254" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="78" y1="226" x2="80" y2="254" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="80" y1="202" x2="88" y2="214" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <circle cx="122" cy="180" r="13" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M109 178 A13 13 0 0 1 135 178 Z" fill="#4f6d7a"/>
  <circle cx="117" cy="180" r="1.6" fill="#2b3a42"/>
  <circle cx="127" cy="180" r="1.6" fill="#2b3a42"/>
  <path d="M117 189 Q122 185 127 189" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="114" y="194" width="18" height="32" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="118" y1="226" x2="116" y2="254" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="130" y1="226" x2="132" y2="254" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="112" y1="202" x2="104" y2="214" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <text x="95" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">who wants what?</text>
  <text x="95" y="324" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">we both want it</text>

  <!-- arrow -->
  <line x1="176" y1="220" x2="196" y2="220" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <path d="M196 214 L204 220 L196 226 Z" fill="#4f6d7a"/>

  <!-- step 2 -->
  <rect x="210" y="70" width="150" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="285" y="96" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">2</text>
  <text x="285" y="116" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">peaceful solve</text>

  <circle cx="270" cy="180" r="13" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M257 178 A13 13 0 0 1 283 178 Z" fill="#2b3a42"/>
  <circle cx="265" cy="180" r="1.6" fill="#2b3a42"/>
  <circle cx="275" cy="180" r="1.6" fill="#2b3a42"/>
  <path d="M265 186 Q270 191 275 186" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="262" y="194" width="18" height="32" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="266" y1="226" x2="264" y2="254" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="278" y1="226" x2="280" y2="254" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <circle cx="308" cy="180" r="13" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M295 178 A13 13 0 0 1 321 178 Z" fill="#4f6d7a"/>
  <circle cx="303" cy="180" r="1.6" fill="#2b3a42"/>
  <circle cx="313" cy="180" r="1.6" fill="#2b3a42"/>
  <path d="M303 186 Q308 191 313 186" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="300" y="194" width="18" height="32" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="304" y1="226" x2="302" y2="254" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="316" y1="226" x2="318" y2="254" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <!-- ball passing -->
  <circle cx="288" cy="220" r="14" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M288 206 A14 14 0 0 1 302 220" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <line x1="282" y1="202" x2="290" y2="214" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <text x="285" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">talk &#183; turns &#183; help</text>
  <text x="285" y="324" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">take turns</text>

  <!-- arrow -->
  <line x1="366" y1="220" x2="386" y2="220" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <path d="M386 214 L394 220 L386 226 Z" fill="#4f6d7a"/>

  <!-- step 3 -->
  <rect x="400" y="70" width="112" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="456" y="96" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">3</text>
  <text x="456" y="116" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">real apology</text>

  <circle cx="440" cy="190" r="13" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M427 188 A13 13 0 0 1 453 188 Z" fill="#2b3a42"/>
  <circle cx="435" cy="190" r="1.6" fill="#2b3a42"/>
  <circle cx="445" cy="190" r="1.6" fill="#2b3a42"/>
  <path d="M435 196 Q440 201 445 196" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="432" y="204" width="18" height="32" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="436" y1="236" x2="434" y2="264" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="448" y1="236" x2="450" y2="264" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <!-- reaching arm -->
  <line x1="452" y1="214" x2="470" y2="228" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <circle cx="484" cy="196" r="11" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <path d="M473 194 A11 11 0 0 1 495 194 Z" fill="#4f6d7a"/>
  <circle cx="480" cy="196" r="1.4" fill="#2b3a42"/>
  <circle cx="488" cy="196" r="1.4" fill="#2b3a42"/>
  <path d="M480 201 Q484 205 488 201" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="476" y="208" width="16" height="26" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  <text x="456" y="292" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">I am sorry &#8212;</text>
  <text x="456" y="312" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">I will fix</text>
  <text x="456" y="332" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">the harm</text>

  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">describe the conflict &#8594; choose a peaceful solve &#8594; make a real apology</text>
  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">That is how both people become well again.</text>
</svg>
