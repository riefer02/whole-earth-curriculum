<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Unit map: living systems, physical systems, and our origins</title>
  <desc id="desc">Three panels standing on a shared base. Left: a plant and a feeding arrow for living systems. Middle: an atom for physical systems. Right: a globe with a deep-time spiral for Earth, space and origins. The base reads "the evidence discipline" underneath all three.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Three Bodies of the Natural World</text>

  <!-- base bar -->
  <rect x="40" y="440" width="432" height="40" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">standing on one discipline: evidence, then claim, with limits</text>

  <!-- panel 1: living systems -->
  <rect x="36" y="84" width="136" height="150" rx="10" fill="#ffffff" stroke="#7a9e7e" stroke-width="2.5"/>
  <text x="104" y="112" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Living Systems</text>
  <!-- plant -->
  <line x1="104" y1="198" x2="104" y2="170" stroke="#4f6d7a" stroke-width="2"/>
  <line x1="104" y1="188" x2="88" y2="172" stroke="#4f6d7a" stroke-width="2"/>
  <line x1="104" y1="180" x2="120" y2="164" stroke="#4f6d7a" stroke-width="2"/>
  <circle cx="104" cy="166" r="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
  <!-- sun + arrow to plant -->
  <circle cx="58" cy="150" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="68" y1="152" x2="90" y2="160" stroke="#2b3a42" stroke-width="2"/>
  <polygon points="90,160 82,156 84,164" fill="#2b3a42"/>
  <text x="104" y="224" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">matter cycles,</text>
  <text x="104" y="239" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">energy flows</text>

  <!-- panel 2: physical systems -->
  <rect x="188" y="84" width="136" height="150" rx="10" fill="#ffffff" stroke="#6b93b6" stroke-width="2.5"/>
  <text x="256" y="112" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Physical Systems</text>
  <!-- atom -->
  <circle cx="256" cy="168" r="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="256" cy="168" rx="26" ry="11" fill="none" stroke="#2b3a42" stroke-width="1.8"/>
  <ellipse cx="256" cy="168" rx="26" ry="11" fill="none" stroke="#2b3a42" stroke-width="1.8" transform="rotate(60 256 168)"/>
  <ellipse cx="256" cy="168" rx="26" ry="11" fill="none" stroke="#2b3a42" stroke-width="1.8" transform="rotate(120 256 168)"/>
  <circle cx="282" cy="168" r="4" fill="#2b3a42"/>
  <text x="256" y="224" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">energy conserved,</text>
  <text x="256" y="239" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">atoms bond</text>

  <!-- panel 3: Earth, space & origins -->
  <rect x="340" y="84" width="136" height="150" rx="10" fill="#ffffff" stroke="#e0a458" stroke-width="2.5"/>
  <text x="408" y="112" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Earth &amp; Origins</text>
  <!-- globe -->
  <circle cx="408" cy="164" r="22" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="408" cy="164" rx="10" ry="22" fill="none" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="386" y1="164" x2="430" y2="164" stroke="#2b3a42" stroke-width="1.5"/>
  <!-- deep time spiral -->
  <path d="M396 200 Q416 206 408 218 Q398 228 380 224" fill="none" stroke="#e0a458" stroke-width="2"/>
  <text x="408" y="224" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">deep time,</text>
  <text x="408" y="239" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">climate, origins</text>

  <!-- down arrows to base -->
  <line x1="104" y1="250" x2="140" y2="436" stroke="#4f6d7a" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="256" y1="250" x2="256" y2="436" stroke="#4f6d7a" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="408" y1="250" x2="372" y2="436" stroke="#4f6d7a" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="256" y="496" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Origins are held as models with evidence — never as creed.</text>
</svg>
