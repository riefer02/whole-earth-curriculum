<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The forms of energy</title>
  <desc id="desc">A five-panel diagram of the forms of energy. The first panel shows a rolling ball labeled kinetic, energy of motion. The second shows a stretched bow labeled potential, stored energy. The third shows a steaming bowl labeled thermal, heat energy. The fourth shows a plate of food and a fuel can labeled chemical, energy stored in matter. The fifth shows a battery and a lit bulb labeled electrical, energy of moving charges. A title reads: forms of energy. Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Forms of Energy</text>
  <text x="256" y="56" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">one thing with five faces</text>

  <!-- panel 1 kinetic -->
  <g transform="translate(20, 80)">
    <rect x="0" y="0" width="150" height="180" rx="10" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
    <text x="75" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">kinetic</text>
    <circle cx="75" cy="80" r="24" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="75" y1="80" x2="110" y2="80" stroke="#2b3a42" stroke-width="2" marker-end="url(#ka)"/>
    <defs><marker id="ka" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#2b3a42"/></marker></defs>
    <text x="75" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">energy of motion</text>
  </g>

  <!-- panel 2 potential -->
  <g transform="translate(182, 80)">
    <rect x="0" y="0" width="150" height="180" rx="10" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
    <text x="75" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">potential</text>
    <path d="M30,120 Q75,40 120,120" fill="none" stroke="#2b3a42" stroke-width="4"/>
    <line x1="30" y1="120" x2="120" y2="120" stroke="#2b3a42" stroke-width="2"/>
    <line x1="75" y1="80" x2="30" y2="120" stroke="#4f6d7a" stroke-width="2"/>
    <text x="75" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">stored energy</text>
  </g>

  <!-- panel 3 thermal -->
  <g transform="translate(344, 80)">
    <rect x="0" y="0" width="150" height="180" rx="10" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
    <text x="75" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">thermal</text>
    <path d="M40,120 Q75,80 110,120 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#4f6d7a" stroke-width="2" fill="none">
      <path d="M60,70 C55,58 65,58 60,46"/>
      <path d="M75,66 C70,54 80,54 75,42"/>
      <path d="M90,70 C85,58 95,58 90,46"/>
    </g>
    <text x="75" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">heat energy</text>
  </g>

  <!-- panel 4 chemical -->
  <g transform="translate(20, 288)">
    <rect x="0" y="0" width="150" height="180" rx="10" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
    <text x="75" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">chemical</text>
    <ellipse cx="55" cy="90" rx="36" ry="16" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
    <path d="M20,90 Q55,110 90,90" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="105" y="70" width="26" height="40" rx="4" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <text x="75" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">energy stored in matter</text>
  </g>

  <!-- panel 5 electrical -->
  <g transform="translate(182, 288)">
    <rect x="0" y="0" width="150" height="180" rx="10" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
    <text x="75" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">electrical</text>
    <rect x="30" y="78" width="30" height="46" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="45" y="98" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#222222">+</text>
    <text x="45" y="112" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#222222">−</text>
    <circle cx="98" cy="100" r="22" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#2b3a42" stroke-width="2">
      <line x1="60" y1="88" x2="78" y2="92"/>
      <line x1="60" y1="112" x2="78" y2="108"/>
    </g>
    <text x="75" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">energy of moving charges</text>
  </g>

  <!-- panel 6 transform note -->
  <g transform="translate(344, 288)">
    <rect x="0" y="0" width="150" height="180" rx="10" fill="#fdfbf7" stroke="#e0a458" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="75" y="40" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">and it changes</text>
    <path d="M45,110 Q75,60 105,110" fill="none" stroke="#2b3a42" stroke-width="3" marker-end="url(#ka)"/>
    <text x="75" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">energy changes from one form to another</text>
  </g>
</svg>
