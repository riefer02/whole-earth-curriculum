<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Evidence versus belief</title>
  <desc id="desc">A two-column diagram. The left column, labeled evidence, shows a claim with a test and a checkmark plus a second source, marked verifiable. The right column, labeled belief or value, shows a held conviction marked not a claim about the world, but a value I hold. A middle band asks what to do when they conflict.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#2b3a42">Evidence and Belief — Two Kinds of Thought</text>

  <!-- Evidence column -->
  <rect x="28" y="64" width="222" height="300" rx="12" fill="#fdfbf7" stroke="#7a9e7e" stroke-width="2"/>
  <text x="139" y="92" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">Evidence (a claim)</text>
  <text x="139" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a5a3a">a claim about the world</text>
  <rect x="52" y="136" width="174" height="30" rx="8" fill="#eaf2ea"/>
  <text x="139" y="156" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a5a3a">"the river floods in</text>
  <text x="139" y="174" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a5a3a">the rainy season"</text>
  <g font-family="sans-serif" font-size="13" fill="#3a5a3a">
    <text x="52" y="212">✓ I can test it</text>
    <text x="52" y="236">✓ a second source agrees</text>
  </g>
  <rect x="52" y="258" width="174" height="66" rx="8" fill="#eaf2ea"/>
  <text x="139" y="284" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">verifiable</text>
  <text x="139" y="304" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a5a3a">owes the world evidence</text>

  <!-- Belief column -->
  <rect x="262" y="64" width="222" height="300" rx="12" fill="#fdfbf7" stroke="#e0a458" stroke-width="2"/>
  <text x="373" y="92" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">Belief (a value)</text>
  <text x="373" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8a6d4a">a conviction I hold</text>
  <rect x="286" y="136" width="174" height="30" rx="8" fill="#f6ead8"/>
  <text x="373" y="156" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8a6d4a">"we should look after</text>
  <text x="373" y="174" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8a6d4a">this river"</text>
  <g font-family="sans-serif" font-size="13" fill="#8a6d4a">
    <text x="286" y="212">not settled by a test</text>
    <text x="286" y="236">fairness · family · faith</text>
  </g>
  <rect x="286" y="258" width="174" height="66" rx="8" fill="#f6ead8"/>
  <text x="373" y="284" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">held, not proven</text>
  <text x="373" y="304" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a6d4a">owes the world honesty</text>

  <!-- Conflict band -->
  <rect x="28" y="380" width="456" height="78" rx="12" fill="#dce9f0"/>
  <text x="256" y="410" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">When they seem to conflict</text>
  <text x="256" y="434" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a5a6a">check the claim with evidence — and let the value stay a value.</text>

  <text x="256" y="488" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Confusing the two is how we get fooled — and how we fool ourselves.</text>
</svg>
