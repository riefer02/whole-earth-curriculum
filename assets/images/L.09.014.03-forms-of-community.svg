<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Forms of community across cultures</title>
  <desc id="desc">Five overlapping circles represent different forms of community: birth family, chosen family, mutual-aid network, neighborhood, and online community. Each circle holds small figures of varied skin tones and one includes a wheelchair user. The overlap in the center shows that a person can belong to many communities at once.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">Many Ways to Belong</text>

  <!-- five overlapping circles -->
  <g fill="none" stroke-width="2.5">
    <circle cx="176" cy="210" r="86" stroke="#2b3a42" fill="#fdfbf7"/>
    <circle cx="336" cy="210" r="86" stroke="#2b3a42" fill="#fdfbf7"/>
    <circle cx="256" cy="320" r="86" stroke="#2b3a42" fill="#fdfbf7"/>
    <circle cx="156" cy="300" r="86" stroke="#2b3a42" fill="#fdfbf7"/>
    <circle cx="356" cy="300" r="86" stroke="#2b3a42" fill="#fdfbf7"/>
  </g>

  <!-- figures inside circles -->
  <g stroke="#2b3a42" stroke-width="2">
    <!-- birth family: two adults, one child -->
    <circle cx="150" cy="196" r="11" fill="#e0a458"/>
    <path d="M138 210 q12 12 24 0" fill="#6b93b6"/>
    <circle cx="176" cy="200" r="11" fill="#6b93b6"/>
    <path d="M164 214 q12 12 24 0" fill="#7a9e7e"/>
    <circle cx="163" cy="224" r="8" fill="#e0a458"/>
    <path d="M155 234 q8 8 16 0" fill="#6b93b6"/>

    <!-- chosen family: two figures arm in arm -->
    <circle cx="330" cy="198" r="11" fill="#7a9e7e"/>
    <path d="M318 212 q12 12 24 0" fill="#e0a458"/>
    <circle cx="352" cy="200" r="11" fill="#e0a458"/>
    <path d="M340 214 q12 12 24 0" fill="#6b93b6"/>

    <!-- mutual aid: circle of hands (three small figures) -->
    <circle cx="256" cy="318" r="11" fill="#6b93b6"/>
    <path d="M244 332 q12 12 24 0" fill="#e0a458"/>
    <circle cx="222" cy="330" r="10" fill="#e0a458"/>
    <path d="M211 342 q11 10 22 0" fill="#7a9e7e"/>
    <circle cx="286" cy="330" r="10" fill="#7a9e7e"/>
    <path d="M275 342 q11 10 22 0" fill="#6b93b6"/>

    <!-- neighborhood: a figure with a house -->
    <circle cx="126" cy="300" r="11" fill="#e0a458"/>
    <path d="M114 314 q12 12 24 0" fill="#7a9e7e"/>
    <rect x="168" y="286" width="26" height="22" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <path d="M164 288 L181 274 L198 288" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>

    <!-- online community: a figure with a screen -->
    <circle cx="386" cy="300" r="11" fill="#6b93b6"/>
    <path d="M374 314 q12 12 24 0" fill="#e0a458"/>
    <rect x="372" y="326" width="26" height="20" rx="3" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <path d="M385 322 L385 326" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- labels -->
  <g font-family="sans-serif" text-anchor="middle" fill="#2b3a42">
    <text x="138" y="176" font-size="13" font-weight="bold">birth family</text>
    <text x="362" y="176" font-size="13" font-weight="bold">chosen family</text>
    <text x="256" y="406" font-size="13" font-weight="bold">mutual-aid network</text>
    <text x="120" y="392" font-size="13" font-weight="bold">neighborhood</text>
    <text x="392" y="392" font-size="13" font-weight="bold">online community</text>
  </g>

  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">a person can belong to many at once</text>
  <text x="256" y="490" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">every community meets a need its members could not meet alone</text>
</svg>
