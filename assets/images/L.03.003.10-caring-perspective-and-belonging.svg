<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Caring, perspective and belonging</title>
  <desc id="desc">A celebration collage of eight labeled frames — take turns and build on, an I statement, retell from another's view, a day in someone else's shoes, my community and one far away, a fair rule, a fair group goal, and helping one another — all gathered around three big words in the center: caring, perspective, belonging. The words and shapes carry the meaning, not color, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Caring, Perspective &amp; Belonging</text>

  <!-- Three center words -->
  <text x="256" y="96" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#e0a458">caring</text>
  <text x="256" y="132" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#6b93b6">perspective</text>
  <text x="256" y="168" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#7a9e7e">belonging</text>

  <!-- Eight frames, two columns of four -->
  <g font-family="sans-serif" font-size="13" fill="#222222">
    <!-- left column -->
    <rect x="40" y="200" width="200" height="52" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <text x="50" y="224">1 · take turns &amp; build on</text>
    <text x="50" y="242">2 · say how I feel, no blame</text>

    <rect x="40" y="262" width="200" height="52" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <text x="50" y="286">3 · retell from another's view</text>
    <text x="50" y="304">4 · a day in someone's shoes</text>

    <rect x="40" y="324" width="200" height="52" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <text x="50" y="348">5 · my community &amp; one far</text>
    <text x="50" y="366">6 · a rule that helps us all</text>

    <rect x="40" y="386" width="200" height="52" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <text x="50" y="410">7 · a fair group goal</text>
    <text x="50" y="428">8 · how we help each other</text>

    <!-- right column with small icons -->
    <rect x="272" y="200" width="200" height="52" rx="10" fill="#ffffff" stroke="#7a9e7e" stroke-width="2"/>
    <text x="282" y="224">🗨 turn · add</text>
    <text x="282" y="242">💬 "I feel… I need…"</text>

    <rect x="272" y="262" width="200" height="52" rx="10" fill="#ffffff" stroke="#6b93b6" stroke-width="2"/>
    <text x="282" y="286">👁 their eyes</text>
    <text x="282" y="304">👟 their shoes</text>

    <rect x="272" y="324" width="200" height="52" rx="10" fill="#ffffff" stroke="#e0a458" stroke-width="2"/>
    <text x="282" y="348">🌍 here &amp; far</text>
    <text x="282" y="366">⚖ fair for all</text>

    <rect x="272" y="386" width="200" height="52" rx="10" fill="#ffffff" stroke="#7a9e7e" stroke-width="2"/>
    <text x="282" y="410">🤝 shared work</text>
    <text x="282" y="428">❤ helping hands</text>
  </g>

  <text x="256" y="472" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">When everyone cares, everyone belongs.</text>
</svg>
