<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">My many parts shift by context</title>
  <desc id="d">A diagram of one person in the center, a circle labeled "me" with a friendly face, connected by lines to three panels. The top-left panel is labeled "at home" and lists "my family" and "my language." The top-right panel is labeled "at school" and lists "my interests" and "my beliefs." The bottom panel is labeled "at a celebration" and lists "my culture" and "my interests." A caption reads "The same me — different parts in front in different places." Shapes and labels, not color alone, carry the meaning, so the diagram prints clearly in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">My Many Parts Shift by Context</text>

  <!-- connector lines from center -->
  <g stroke="#4f6d7a" stroke-width="2" fill="none">
    <line x1="232" y1="176" x2="120" y2="158"/>
    <line x1="280" y1="176" x2="392" y2="158"/>
    <line x1="256" y1="244" x2="256" y2="364"/>
  </g>

  <!-- center me -->
  <circle cx="256" cy="200" r="44" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="256" cy="190" r="18" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="250" cy="185" r="2.5" fill="#2b3a42"/>
  <circle cx="262" cy="185" r="2.5" fill="#2b3a42"/>
  <path d="M251 194 Q256 198 261 194" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="256" y="230" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">me</text>

  <!-- top-left panel: at home -->
  <rect x="20" y="96" width="150" height="110" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="95" y="124" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">at home</text>
  <text x="36" y="156" font-family="sans-serif" font-size="15" fill="#222222">&#8226; my family</text>
  <text x="36" y="184" font-family="sans-serif" font-size="15" fill="#222222">&#8226; my language</text>

  <!-- top-right panel: at school -->
  <rect x="342" y="96" width="150" height="110" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="417" y="124" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">at school</text>
  <text x="358" y="156" font-family="sans-serif" font-size="15" fill="#222222">&#8226; my interests</text>
  <text x="358" y="184" font-family="sans-serif" font-size="15" fill="#222222">&#8226; my beliefs</text>

  <!-- bottom panel: at a celebration -->
  <rect x="156" y="366" width="200" height="92" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="394" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">at a celebration</text>
  <text x="174" y="424" font-family="sans-serif" font-size="15" fill="#222222">&#8226; my culture</text>
  <text x="174" y="450" font-family="sans-serif" font-size="15" fill="#222222">&#8226; my interests</text>

  <text x="256" y="504" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">The same me — different parts in front in different places.</text>
</svg>
