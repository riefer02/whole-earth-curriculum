<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Rhythm and melody patterns: sound you can say again</title>
  <desc id="desc">The top half shows a rhythm pattern of four symbols in a row — clap, clap, rest, clap — repeated twice, with a curved repeat arrow between the first and second row and the word repeat. The bottom half shows a melody pattern of four notes rising and falling along a wavy line, repeated a second time with an echo arrow between them. Labels, symbols, and arrows carry all meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Rhythm and Melody Patterns</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">A pattern is sound you can say again.</text>

  <!-- rhythm section -->
  <text x="256" y="112" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#6b93b6">rhythm pattern</text>

  <!-- row 1 -->
  <g font-family="sans-serif" text-anchor="middle">
    <circle cx="90" cy="160" r="26" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="90" y="166" font-size="16" font-weight="bold" fill="#222222">clap</text>
    <circle cx="170" cy="160" r="26" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="170" y="166" font-size="16" font-weight="bold" fill="#222222">clap</text>
    <circle cx="250" cy="160" r="26" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="250" y="166" font-size="16" font-weight="bold" fill="#222222">rest</text>
    <circle cx="330" cy="160" r="26" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="330" y="166" font-size="16" font-weight="bold" fill="#222222">clap</text>
  </g>

  <!-- repeat arrow 1 -->
  <g stroke="#2b3a42" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M380 160 Q420 160 420 210 L420 238"/>
    <path d="M412 228 L420 240 L428 228"/>
  </g>
  <text x="434" y="200" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">repeat</text>

  <!-- row 2 -->
  <g font-family="sans-serif" text-anchor="middle">
    <circle cx="90" cy="256" r="26" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="90" y="262" font-size="16" font-weight="bold" fill="#222222">clap</text>
    <circle cx="170" cy="256" r="26" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="170" y="262" font-size="16" font-weight="bold" fill="#222222">clap</text>
    <circle cx="250" cy="256" r="26" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="250" y="262" font-size="16" font-weight="bold" fill="#222222">rest</text>
    <circle cx="330" cy="256" r="26" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="330" y="262" font-size="16" font-weight="bold" fill="#222222">clap</text>
  </g>

  <!-- melody section -->
  <text x="256" y="316" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#7a9e7e">melody pattern</text>

  <!-- melody 1 -->
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M70 400 Q90 360 120 388 Q150 350 180 392 Q210 344 240 384 Q270 356 300 388"/>
  </g>
  <g fill="#2b3a42">
    <ellipse cx="120" cy="388" rx="7" ry="5"/>
    <line x1="127" y1="388" x2="127" y2="366"/>
    <ellipse cx="180" cy="392" rx="7" ry="5"/>
    <line x1="187" y1="392" x2="187" y2="370"/>
    <ellipse cx="240" cy="384" rx="7" ry="5"/>
    <line x1="247" y1="384" x2="247" y2="362"/>
    <ellipse cx="300" cy="388" rx="7" ry="5"/>
    <line x1="307" y1="388" x2="307" y2="366"/>
  </g>

  <!-- echo arrow -->
  <g stroke="#2b3a42" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M330 388 Q362 388 362 430 L362 452"/>
    <path d="M354 442 L362 454 L370 442"/>
  </g>
  <text x="388" y="428" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">echo</text>

  <!-- melody 2 -->
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M70 452 Q90 412 120 440 Q150 402 180 444 Q210 396 240 436 Q270 408 300 440"/>
  </g>
  <g fill="#2b3a42">
    <ellipse cx="120" cy="440" rx="7" ry="5"/>
    <line x1="127" y1="440" x2="127" y2="418"/>
    <ellipse cx="180" cy="444" rx="7" ry="5"/>
    <line x1="187" y1="444" x2="187" y2="422"/>
    <ellipse cx="240" cy="436" rx="7" ry="5"/>
    <line x1="247" y1="436" x2="247" y2="414"/>
    <ellipse cx="300" cy="440" rx="7" ry="5"/>
    <line x1="307" y1="440" x2="307" y2="418"/>
  </g>
</svg>
