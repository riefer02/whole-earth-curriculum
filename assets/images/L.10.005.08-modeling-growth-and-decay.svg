<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-10-005-08-modeling-growth-and-decay desc-L-10-005-08-modeling-growth-and-decay">
  <title id="title-L-10-005-08-modeling-growth-and-decay">Modeling Growth and Decay: Population, Finance, Environment</title>
  <desc id="desc-L-10-005-08-modeling-growth-and-decay">A graph showing an exponential growth curve rising steeply, then bending into an S-shaped logistic curve that flattens at a dashed carrying-capacity line, with a small compound-interest table beside it.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Growth Meets a Ceiling</text>

  <!-- Axes -->
  <line x1="60" y1="380" x2="380" y2="380" stroke="#2b3a42" stroke-width="2"/>
  <line x1="60" y1="380" x2="60" y2="60" stroke="#2b3a42" stroke-width="2"/>
  <polygon points="380,380 368,375 368,385" fill="#2b3a42"/>
  <polygon points="60,60 55,72 65,72" fill="#2b3a42"/>
  <text x="358" y="398" text-anchor="end" font-family="sans-serif" font-size="13" fill="#222222">time</text>
  <text x="70" y="86" font-family="sans-serif" font-size="13" fill="#222222">size</text>

  <!-- carrying capacity line -->
  <line x1="60" y1="150" x2="380" y2="150" stroke="#e0a458" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="70" y="142" font-family="sans-serif" font-size="13" fill="#a06030" font-weight="bold">carrying capacity K</text>

  <!-- exponential curve (unbounded) -->
  <path d="M 60 360 C 120 350, 190 320, 262 250 C 300 200, 330 120, 370 44"
        fill="none" stroke="#6b93b6" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="196" y="120" font-family="sans-serif" font-size="13" fill="#3a5a72" stroke="#fdfbf7" stroke-width="4" paint-order="stroke">exponential (unbounded)</text>

  <!-- logistic S-curve -->
  <path d="M 60 360 C 115 340, 175 280, 225 230 C 280 180, 320 162, 372 154"
        fill="none" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="100" y="240" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">logistic (S-curve)</text>

  <!-- Compound interest table -->
  <text x="448" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a" font-weight="bold">1,000 at 5%</text>
  <g font-family="sans-serif" font-size="12" fill="#222222">
    <rect x="392" y="92" width="112" height="22" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text fill="#222222" x="448" y="108" text-anchor="middle" font-size="12">year 1: 1,050</text>
    <rect x="392" y="118" width="112" height="22" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text fill="#222222" x="448" y="134" text-anchor="middle" font-size="12">year 2: 1,102.50</text>
    <rect x="392" y="144" width="112" height="22" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text fill="#222222" x="448" y="160" text-anchor="middle" font-size="12">year 10: 1,628.89</text>
  </g>
  <text x="448" y="188" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">doubling &#8776; 70 &#247; rate</text>
  <text x="448" y="204" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">&#8776; 14 years</text>

  <text x="256" y="469" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Real growth bends into an S as resources run short. The rate &#8212; not the start &#8212;</text>
  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">is the lever.</text>
</svg>
