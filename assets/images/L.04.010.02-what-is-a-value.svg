<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">What is a value?</title>
  <desc id="desc">A circle of six cards names things people care about: fairness, honesty, kindness, family, learning, and caring for nature, each with a small picture. A child with a hearing aid stands beside the circle and points to the kindness card, with a speech bubble reading "one of my values is kindness — I care about how others feel." Labels and the pictures, not color, carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">A Value Is Something You Care About</text>

  <!-- six value cards in a circle -->
  <!-- fairness -->
  <rect x="60" y="84" width="120" height="86" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="120" y="108" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">fairness</text>
  <line x1="84" y1="140" x2="156" y2="140" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="108" cy="128" r="5" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="132" cy="128" r="5" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  <!-- honesty -->
  <rect x="196" y="84" width="120" height="86" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="108" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">honesty</text>
  <path d="M244 128 L268 128" stroke="#2b3a42" stroke-width="3"/>
  <path d="M256 118 L256 140" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">a straight "true"</text>

  <!-- kindness -->
  <rect x="332" y="84" width="120" height="86" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="392" y="108" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">kindness</text>
  <path d="M376 140 Q392 120 408 140" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M392 132 Q392 146 392 132" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="380" cy="134" r="2" fill="#2b3a42"/>
  <circle cx="404" cy="134" r="2" fill="#2b3a42"/>

  <!-- family -->
  <rect x="60" y="190" width="120" height="86" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="120" y="214" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">family</text>
  <circle cx="96" cy="242" r="9" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="144" cy="242" r="9" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="120" cy="228" r="7" fill="#e8c39e" stroke="#2b3a42" stroke-width="2"/>

  <!-- learning -->
  <rect x="196" y="190" width="120" height="86" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="214" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">learning</text>
  <rect x="238" y="228" width="36" height="26" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="256" y1="228" x2="256" y2="254" stroke="#2b3a42" stroke-width="2"/>
  <line x1="244" y1="240" x2="268" y2="240" stroke="#2b3a42" stroke-width="2"/>

  <!-- caring for nature -->
  <rect x="332" y="190" width="120" height="86" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="392" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">caring for</text>
  <text x="392" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">nature</text>
  <line x1="392" y1="256" x2="392" y2="238" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="382" cy="240" rx="10" ry="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="404" cy="242" rx="10" ry="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  <!-- child pointing to kindness card -->
  <circle cx="392" cy="330" r="15" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M377 328 A15 15 0 0 1 407 328 Z" fill="#2b3a42"/>
  <circle cx="387" cy="330" r="1.8" fill="#2b3a42"/>
  <circle cx="397" cy="330" r="1.8" fill="#2b3a42"/>
  <path d="M387 337 Q392 342 397 337" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <!-- hearing aid -->
  <path d="M407 330 A10 10 0 0 1 410 336" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="410" cy="338" r="2.5" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
  <rect x="382" y="348" width="22" height="40" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <!-- pointing arm -->
  <path d="M378 356 L348 300" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>

  <!-- speech bubble -->
  <rect x="150" y="316" width="204" height="78" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M228 394 L238 412 L252 396 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="252" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">one of my values is kindness</text>
  <text x="252" y="360" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">— I care about how</text>
  <text x="252" y="376" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">others feel.</text>

  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">A value is a real care that guides how you choose and act.</text>
  <text x="256" y="488" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#4f6d7a">Labels and pictures, not color, carry the meaning.</text>
</svg>
