<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Subtracting: taking two away leaves five</title>
  <desc id="desc">A basket holds seven pebbles. A minus sign sits beside it, and two warm pebbles are set aside in a dashed tray labeled take two away. Below, a basket holds the five pebbles that are left, labeled five left. The number sentence 7 minus 2 equals 5 sits at the bottom, with a caption that the minus sign means take away. Numbers and labels carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Subtracting: Taking Away</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Taking some away leaves a smaller group.</text>

  <!-- Start basket: 7 -->
  <rect x="56" y="124" width="170" height="92" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#2b3a42" stroke-width="2">
    <ellipse cx="88" cy="162" rx="13" ry="10" fill="#6b93b6"/>
    <ellipse cx="118" cy="158" rx="13" ry="10" fill="#7a9e7e"/>
    <ellipse cx="148" cy="162" rx="13" ry="10" fill="#6b93b6"/>
    <ellipse cx="178" cy="158" rx="13" ry="10" fill="#7a9e7e"/>
    <ellipse cx="100" cy="190" rx="13" ry="10" fill="#6b93b6"/>
    <ellipse cx="132" cy="194" rx="13" ry="10" fill="#7a9e7e"/>
    <ellipse cx="164" cy="190" rx="13" ry="10" fill="#6b93b6"/>
  </g>
  <text x="141" y="236" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">7</text>

  <text x="246" y="180" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#2b3a42">&#8722;</text>

  <!-- Taken away: 2 -->
  <rect x="286" y="124" width="150" height="92" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-dasharray="6 5"/>
  <g stroke="#2b3a42" stroke-width="2">
    <ellipse cx="334" cy="172" rx="13" ry="10" fill="#e0a458"/>
    <ellipse cx="372" cy="172" rx="13" ry="10" fill="#e0a458"/>
  </g>
  <text x="361" y="236" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e0a458">take 2 away</text>

  <!-- Down arrow -->
  <line x1="256" y1="258" x2="256" y2="286" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round"/>
  <path d="M246 278 L256 290 L266 278 Z" fill="#7a9e7e"/>

  <!-- Left basket: 5 -->
  <rect x="156" y="296" width="180" height="92" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#2b3a42" stroke-width="2">
    <ellipse cx="186" cy="334" rx="13" ry="10" fill="#6b93b6"/>
    <ellipse cx="216" cy="330" rx="13" ry="10" fill="#7a9e7e"/>
    <ellipse cx="246" cy="334" rx="13" ry="10" fill="#6b93b6"/>
    <ellipse cx="276" cy="330" rx="13" ry="10" fill="#7a9e7e"/>
    <ellipse cx="216" cy="362" rx="13" ry="10" fill="#6b93b6"/>
  </g>
  <text x="246" y="408" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">5 left</text>

  <text x="256" y="448" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#222222">7 &#8722; 2 = 5</text>
  <text x="256" y="476" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">&#8722; means "take away" &#8226; the number left is always there to count.</text>
</svg>
