<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Many hands, one big job</title>
  <desc id="desc">A heavy basket held up by many hands. Four children reach in from the sides, each hand lifting a corner or edge of the basket, so the load is shared. At the bottom left, a small "one hand" picture shows a single hand straining under the basket, labeled "too heavy for one." At the bottom right, the four hands lift together, labeled "together, we lift it." The children vary in skin tone, hair, and dress; one wears a head covering. The closing line teaches that a job no one could do alone becomes possible when we cooperate. Labels carry the meaning, so the picture prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Many Hands, One Big Job</text>
  <text x="256" y="68" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">a job no one could do alone</text>

  <!-- the heavy basket -->
  <g>
    <path d="M156 210 L356 210 L336 300 L176 300 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="3" stroke-linejoin="round"/>
    <line x1="176" y1="240" x2="336" y2="240" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="182" y1="270" x2="330" y2="270" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M156 210 Q256 188 356 210" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- child 1 (left) -->
  <g>
    <circle cx="92" cy="250" r="20" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M72 250 A20 20 0 0 1 112 250 L112 243 A20 20 0 0 0 72 243 Z" fill="#2b3a42"/>
    <rect x="76" y="270" width="30" height="40" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="104" y1="250" x2="150" y2="236" stroke="#c99567" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- child 2 (right, head covering) -->
  <g>
    <circle cx="420" cy="250" r="20" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M400 250 A20 20 0 0 1 440 250 L440 243 A20 20 0 0 0 400 243 Z" fill="#4f6d7a"/>
    <path d="M400 236 Q420 226 440 236" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="406" y="270" width="30" height="40" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="408" y1="250" x2="362" y2="236" stroke="#8f5f3d" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- child 3 (bottom-left hand) -->
  <g>
    <circle cx="140" cy="360" r="20" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M120 360 A20 20 0 0 1 160 360 L160 353 A20 20 0 0 0 120 353 Z" fill="#c99567"/>
    <rect x="124" y="380" width="30" height="40" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="150" y1="366" x2="200" y2="300" stroke="#e6bb92" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- child 4 (bottom-right hand) -->
  <g>
    <circle cx="372" cy="360" r="20" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M352 360 A20 20 0 0 1 392 360 L392 353 A20 20 0 0 0 352 353 Z" fill="#2b3a42"/>
    <rect x="356" y="380" width="30" height="40" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="362" y1="366" x2="312" y2="300" stroke="#ab7a4e" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- one hand vs many -->
  <g>
    <text x="90" y="436" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">too heavy for one</text>
    <path d="M90 448 L90 468" stroke="#4f6d7a" stroke-width="4" stroke-linecap="round"/>
    <path d="M90 448 L76 456" stroke="#4f6d7a" stroke-width="4" stroke-linecap="round"/>
    <path d="M90 448 L104 456" stroke="#4f6d7a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g>
    <text x="256" y="436" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">together, we lift it</text>
    <path d="M256 448 L256 468" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round"/>
    <path d="M256 448 L242 456" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round"/>
    <path d="M256 448 L270 456" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round"/>
    <path d="M256 448 L238 450" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round"/>
    <path d="M256 448 L274 450" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="256" y="502" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">When we cooperate and share the load, a job no one could do alone becomes possible.</text>
</svg>
