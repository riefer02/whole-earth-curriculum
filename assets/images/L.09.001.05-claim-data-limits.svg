<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-09-001-05-claim-data-limits desc-L-09-001-05-claim-data-limits">
  <title id="title-L-09-001-05-claim-data-limits">A worked frame for an evidence-based explanation</title>
  <desc id="desc-L-09-001-05-claim-data-limits">Three stacked boxes show how to build an explanation. The claim box says sea level rose about 0.20 metres between 1901 and 2018. The data box shows the three rates, 1.3, 1.9 and 3.7 millimetres per year, and the total with its likely range. The limits box says the global mean hides local change, and a range is not a guarantee. A footer says the source can be traced, the claim checked, and the limits stated.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">Claim · Data · Limits</text>

  <rect x="24" y="60" width="464" height="92" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="24" y="60" width="7" height="92" rx="3" fill="#e0a458"/>
  <text x="48" y="86" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">CLAIM</text>
  <text x="48" y="112" font-family="sans-serif" font-size="13" fill="#222222">Sea level rose about 0.20 m,</text>
  <text x="48" y="134" font-family="sans-serif" font-size="13" fill="#222222">1901 to 2018.</text>

  <rect x="24" y="166" width="464" height="120" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="24" y="166" width="7" height="120" rx="3" fill="#6b93b6"/>
  <text x="48" y="192" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">DATA</text>
  <text x="48" y="218" font-family="sans-serif" font-size="13" fill="#222222">Rates: 1.3 → 1.9 → 3.7 mm per year</text>
  <text x="48" y="242" font-family="sans-serif" font-size="13" fill="#222222">Periods: 71, 35 and 12 years</text>
  <text x="48" y="266" font-family="sans-serif" font-size="13" fill="#222222">Total: 0.20 m [likely 0.15–0.25]</text>

  <rect x="24" y="300" width="464" height="120" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="24" y="300" width="7" height="120" rx="3" fill="#7a9e7e"/>
  <text x="48" y="326" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">LIMITS</text>
  <text x="48" y="352" font-family="sans-serif" font-size="13" fill="#222222">A global mean hides local change.</text>
  <text x="48" y="376" font-family="sans-serif" font-size="13" fill="#222222">A range is not a guarantee.</text>
  <text x="48" y="400" font-family="sans-serif" font-size="13" fill="#222222">The table alone does not name a cause.</text>

  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">Trace the source. Check the claim. State the limits.</text>
</svg>
