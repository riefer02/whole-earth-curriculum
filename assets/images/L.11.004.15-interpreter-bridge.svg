<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The interpreter as a bridge</title>
  <desc id="desc">Two figures face each other, each speaking a different language, separated by a gap. A bridge spans the gap, and on it stands a third figure labeled "interpreter." A four-step note beside the scene reads: listen for the main idea, render it faithfully, check back, admit when unsure.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="30" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">The Interpreter Is a Bridge</text>

  <!-- Speaker A -->
  <g stroke="#2b3a42" stroke-width="2" fill="#f6ead8">
    <circle cx="90" cy="250" r="20"/>
    <path d="M90 270 q-22 22 0 46 q22 -24 0 -46 z"/>
    <line x1="66" y1="338" x2="66" y2="372" stroke="#2b3a42" stroke-width="4"/>
    <line x1="114" y1="338" x2="114" y2="372" stroke="#2b3a42" stroke-width="4"/>
  </g>
  <text x="90" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8a6d4a">speaker A</text>

  <!-- Speaker B -->
  <g stroke="#2b3a42" stroke-width="2" fill="#eaf2ea">
    <circle cx="422" cy="250" r="20"/>
    <path d="M422 270 q-22 22 0 46 q22 -24 0 -46 z"/>
    <line x1="398" y1="338" x2="398" y2="372" stroke="#2b3a42" stroke-width="4"/>
    <line x1="446" y1="338" x2="446" y2="372" stroke="#2b3a42" stroke-width="4"/>
  </g>
  <text x="422" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a5a3a">speaker B</text>

  <!-- Gap / bridge -->
  <path d="M150 300 q106 -70 212 0" stroke="#4f6d7a" stroke-width="5" fill="none"/>
  <path d="M150 300 l-8 6 M362 300 l8 6" stroke="#4f6d7a" stroke-width="2" fill="none"/>

  <!-- Interpreter on bridge -->
  <g stroke="#2b3a42" stroke-width="2" fill="#dce9f0">
    <circle cx="256" cy="238" r="16"/>
    <path d="M256 254 q-16 16 0 32 q16 -16 0 -32 z"/>
  </g>
  <text x="256" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">interpreter</text>

  <!-- Protocol -->
  <g font-family="sans-serif" font-size="13">
    <rect x="110" y="420" width="292" height="80" rx="10" fill="#fdfbf7" stroke="#e0a458" stroke-width="2"/>
    <text x="128" y="442" fill="#222222">1 · listen for the main idea</text>
    <text x="128" y="460" fill="#222222">2 · render it faithfully</text>
    <text x="128" y="478" fill="#222222">3 · check back  4 · admit when unsure</text>
  </g>
</svg>
