<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">First aid for minor hurts</title>
  <desc id="desc">Three columns for three minor hurts. The first shows a cut with the steps wash with clean water and cover it. The second shows a scrape with the same steps. The third shows a bruise with a cool cloth and rest. Above all three are the words first tell an adult, with a child telling a listening adult. Labels and shapes carry the idea, and the picture reads clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">First Aid for Minor Hurts</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Tell an adult first — then wash, cover, cool, and rest.</text>

  <!-- Tell an adult -->
  <g>
    <circle cx="196" cy="108" r="14" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M196 122 l0 24" stroke="#2b3a42" stroke-width="4"/>
    <path d="M196 128 l-12 10 M196 128 l12 10" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <circle cx="300" cy="108" r="14" fill="#b0804f" stroke="#2b3a42" stroke-width="2"/>
    <path d="M300 122 l0 24" stroke="#2b3a42" stroke-width="4"/>
    <path d="M300 128 l-12 10 M300 128 l12 10" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <path d="M222 104 q20 -16 40 0" fill="none" stroke="#e0a458" stroke-width="5" stroke-linecap="round"/>
    <text x="248" y="166" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">first: tell an adult</text>
  </g>

  <!-- Cut column -->
  <g>
    <rect x="24" y="196" width="148" height="286" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <path d="M98 230 l-8 44 M98 230 l8 44 M90 230 l10 44" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <path d="M82 244 l18 6" stroke="#e0a458" stroke-width="4" stroke-linecap="round"/>
    <text x="98" y="286" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">cut</text>
    <path d="M70 310 q-8 10 0 20 q8 -8 14 0 q8 8 0 16" fill="none" stroke="#6b93b6" stroke-width="3" stroke-linecap="round"/>
    <text x="98" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">wash with clean water</text>
    <rect x="60" y="368" width="76" height="30" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="98" y="388" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">cover it</text>
  </g>

  <!-- Scrape column -->
  <g>
    <rect x="182" y="196" width="148" height="286" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <path d="M242 246 q6 -10 14 -10 q6 0 10 8 q-4 8 -10 8 q-4 0 -6 -4 q4 -4 6 0" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="244" cy="238" r="3" fill="#2b3a42"/>
    <circle cx="258" cy="236" r="3" fill="#2b3a42"/>
    <circle cx="262" cy="246" r="3" fill="#2b3a42"/>
    <text x="256" y="286" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">scrape</text>
    <path d="M228 310 q-8 10 0 20 q8 -8 14 0 q8 8 0 16" fill="none" stroke="#6b93b6" stroke-width="3" stroke-linecap="round"/>
    <text x="256" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">wash with clean water</text>
    <rect x="218" y="368" width="76" height="30" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="388" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">cover it</text>
  </g>

  <!-- Bruise column -->
  <g>
    <rect x="340" y="196" width="148" height="286" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <ellipse cx="414" cy="246" rx="16" ry="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M404 244 q4 -6 10 -6 q6 0 8 6" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <text x="414" y="286" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">bruise</text>
    <rect x="380" y="312" width="68" height="22" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="414" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">cool it</text>
    <path d="M398 374 q6 4 10 0 M414 374 q6 4 10 0" stroke="#e0a458" stroke-width="4" stroke-linecap="round"/>
    <text x="414" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">rest</text>
  </g>

  <text x="256" y="506" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">If a hurt is deep or will not stop bleeding, the adult gets more help.</text>
</svg>
