<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A wondering child asking a question and making a guess</title>
  <desc id="desc">A child in a wheelchair rests a hand on their chin, with a thought bubble holding a question mark. Beside them, three stacked steps connected by arrows show the science rhythm: I wonder, I think, I can check by — each with a small icon (a question mark, a lightbulb, an eye). Words and shapes, not color alone, carry the meaning, so it prints clearly in grayscale.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Ask a Question, Make a Guess</text>

  <!-- Thought bubble -->
  <g fill="#ffffff" stroke="#2b3a42" stroke-width="2">
    <circle cx="120" cy="128" r="9"/>
    <circle cx="142" cy="112" r="14"/>
    <ellipse cx="176" cy="94" rx="46" ry="34"/>
  </g>
  <text x="176" y="104" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#2b3a42">?</text>

  <!-- Child in wheelchair -->
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- head -->
    <circle cx="120" cy="200" r="30" fill="#9a6a44"/>
    <path d="M102 196 A24 24 0 0 1 138 196" fill="#2b3a42" stroke="none"/>
    <!-- hearing aid -->
    <path d="M90 190 Q84 200 90 210" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <circle cx="89" cy="212" r="4.5" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="112" cy="202" r="3.4" fill="#2b3a42" stroke="none"/>
    <circle cx="128" cy="202" r="3.4" fill="#2b3a42" stroke="none"/>
    <path d="M116 212 Q120 216 124 212" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- torso -->
    <rect x="98" y="230" width="44" height="58" rx="16" fill="#6b93b6"/>
    <!-- arm resting on chin -->
    <line x1="112" y1="244" x2="96" y2="208" stroke="#9a6a44" stroke-width="12"/>
    <line x1="128" y1="244" x2="156" y2="272" stroke="#9a6a44" stroke-width="12"/>
    <!-- legs -->
    <line x1="106" y1="288" x2="118" y2="330" stroke="#2b3a42" stroke-width="14"/>
    <line x1="134" y1="288" x2="150" y2="330" stroke="#2b3a42" stroke-width="14"/>
  </g>
  <!-- wheelchair -->
  <g fill="#e0a458" stroke="#2b3a42" stroke-width="2">
    <rect x="92" y="320" width="66" height="34" rx="8"/>
    <rect x="104" y="286" width="42" height="40" rx="6"/>
  </g>
  <g fill="#ffffff" stroke="#2b3a42" stroke-width="2">
    <circle cx="120" cy="360" r="24"/>
    <circle cx="180" cy="360" r="24"/>
    <circle cx="102" cy="336" r="8"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="120" y1="360" x2="120" y2="336"/>
    <line x1="120" y1="360" x2="150" y2="336"/>
    <line x1="120" y1="360" x2="90" y2="336"/>
  </g>

  <!-- Three steps -->
  <g>
    <!-- step 1 -->
    <rect x="256" y="96" width="236" height="70" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <text x="270" y="126" text-anchor="start" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">I wonder</text>
    <text x="452" y="130" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#6b93b6">?</text>
    <text x="270" y="150" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4f6d7a">notice, then ask</text>

    <!-- arrow -->
    <path d="M374 166 L374 190" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M367 186 L374 194 L381 186 Z" fill="#2b3a42"/>

    <!-- step 2 -->
    <rect x="256" y="194" width="236" height="70" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <text x="270" y="224" text-anchor="start" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">I think</text>
    <!-- lightbulb -->
    <g>
      <circle cx="452" cy="228" r="13" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
      <rect x="448" y="240" width="8" height="8" rx="2" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    </g>
    <text x="270" y="248" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4f6d7a">make a guess you can check</text>

    <!-- arrow -->
    <path d="M374 264 L374 288" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M367 284 L374 292 L381 284 Z" fill="#2b3a42"/>

    <!-- step 3 -->
    <rect x="256" y="292" width="236" height="70" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <text x="270" y="322" text-anchor="start" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">I can check by</text>
    <!-- eye -->
    <g>
      <path d="M440 326 Q452 316 464 326 Q452 336 440 326 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="452" cy="326" r="5" fill="#2b3a42"/>
    </g>
    <text x="270" y="346" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4f6d7a">watching, trying, waiting</text>
  </g>

  <!-- Footer -->
  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">A guess is where finding out begins.</text>
</svg>
