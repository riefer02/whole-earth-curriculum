<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Combining movements</title>
  <desc id="desc">Two panels showing how two movements can be combined into one sequence. Panel one: hop, then turn (a child hopping with an arrow to a child turning). Panel two: run, then catch (a child running with an arrow to a child catching a soft ball with both hands). Arrows show the order. Each panel is labeled with words, so it prints clearly in grayscale and the meaning does not depend on color.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">Combining Movements</text>

  <!-- ===== Panel 1: hop + turn ===== -->
  <g>
    <rect x="20" y="66" width="230" height="200" rx="14" fill="#ffffff" stroke="#7a9e7e" stroke-width="3"/>
    <text x="135" y="94" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">hop, then turn</text>

    <!-- hopping child -->
    <circle cx="82" cy="168" r="20" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <rect x="66" y="188" width="32" height="42" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="70" y1="196" x2="56" y2="216" stroke="#c99567" stroke-width="9" stroke-linecap="round"/>
    <line x1="94" y1="196" x2="108" y2="216" stroke="#c99567" stroke-width="9" stroke-linecap="round"/>
    <line x1="76" y1="230" x2="70" y2="252" stroke="#4f6d7a" stroke-width="9" stroke-linecap="round"/>
    <line x1="88" y1="230" x2="98" y2="248" stroke="#4f6d7a" stroke-width="9" stroke-linecap="round"/>
    <text x="82" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">hop</text>

    <!-- arrow -->
    <path d="M124 190 L144 190" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <path d="M138 184 L144 190 L138 196" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- turning child -->
    <circle cx="192" cy="168" r="20" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <rect x="176" y="188" width="32" height="42" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="180" y1="196" x2="166" y2="216" stroke="#8f5f3d" stroke-width="9" stroke-linecap="round"/>
    <line x1="204" y1="196" x2="218" y2="216" stroke="#8f5f3d" stroke-width="9" stroke-linecap="round"/>
    <line x1="186" y1="230" x2="182" y2="252" stroke="#4f6d7a" stroke-width="9" stroke-linecap="round"/>
    <line x1="198" y1="230" x2="202" y2="252" stroke="#4f6d7a" stroke-width="9" stroke-linecap="round"/>
    <path d="M196 120 Q216 150 196 168" fill="none" stroke="#2b3a42" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="192" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">turn</text>
  </g>

  <!-- ===== Panel 2: run + catch ===== -->
  <g>
    <rect x="262" y="66" width="230" height="200" rx="14" fill="#ffffff" stroke="#6b93b6" stroke-width="3"/>
    <text x="377" y="94" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">run, then catch</text>

    <!-- running child -->
    <circle cx="322" cy="168" r="20" fill="#d9a066" stroke="#2b3a42" stroke-width="2"/>
    <rect x="306" y="188" width="32" height="42" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="310" y1="196" x2="292" y2="212" stroke="#d9a066" stroke-width="9" stroke-linecap="round"/>
    <line x1="334" y1="196" x2="352" y2="212" stroke="#d9a066" stroke-width="9" stroke-linecap="round"/>
    <line x1="316" y1="230" x2="300" y2="252" stroke="#4f6d7a" stroke-width="9" stroke-linecap="round"/>
    <line x1="330" y1="230" x2="346" y2="248" stroke="#4f6d7a" stroke-width="9" stroke-linecap="round"/>
    <text x="322" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">run</text>

    <!-- arrow -->
    <path d="M364 190 L384 190" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <path d="M378 184 L384 190 L378 196" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- catching child -->
    <circle cx="432" cy="168" r="20" fill="#6b5342" stroke="#2b3a42" stroke-width="2"/>
    <rect x="416" y="188" width="32" height="42" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="418" y1="196" x2="400" y2="206" stroke="#6b5342" stroke-width="9" stroke-linecap="round"/>
    <line x1="446" y1="196" x2="464" y2="206" stroke="#6b5342" stroke-width="9" stroke-linecap="round"/>
    <circle cx="432" cy="196" r="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="426" y1="230" x2="422" y2="252" stroke="#4f6d7a" stroke-width="9" stroke-linecap="round"/>
    <line x1="438" y1="230" x2="442" y2="252" stroke="#4f6d7a" stroke-width="9" stroke-linecap="round"/>
    <text x="432" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">catch</text>
  </g>

  <text x="256" y="298" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">A sequence is two or more movements joined in order.</text>
  <text x="256" y="326" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">You can do every part in your own body's way &#8212; feet, wheels, or seated.</text>

  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Two movements joined make a sequence.</text>
</svg>
