<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Tools help us do jobs</title>
  <desc id="desc">Four boxes, each showing one tool doing its job, with a label under each: a spoon scooping soup from a bowl, a water jug carrying water, a mortar and pestle grinding grain, and a broom sweeping the floor. Each tool is drawn simply with its job named in words, so the picture prints clearly in grayscale and shows that a tool is something people make to help them do a job.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Tools Help Us Do Jobs</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">A tool is something people make to help them do a job.</text>

  <!-- ===== Panel A: spoon ===== -->
  <rect x="24" y="100" width="224" height="176" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="128" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">Spoon</text>
  <!-- bowl -->
  <path d="M62 200 L74 234 Q110 248 146 234 L158 200 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="110" cy="200" rx="48" ry="13" fill="#8fb0cc" stroke="#2b3a42" stroke-width="2"/>
  <!-- spoon -->
  <line x1="146" y1="176" x2="184" y2="140" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="138" cy="184" rx="17" ry="11" fill="#e0a458" stroke="#2b3a42" stroke-width="2" transform="rotate(-20 138 184)"/>
  <text x="136" y="256" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">scoops soup</text>

  <!-- ===== Panel B: water jug ===== -->
  <rect x="264" y="100" width="224" height="176" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="128" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">Water jug</text>
  <!-- jug -->
  <path d="M360 150 L362 196 Q376 216 392 216 Q408 216 422 196 L424 150 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <rect x="356" y="142" width="72" height="14" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M424 160 Q446 168 420 192" fill="none" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <!-- water drops -->
  <path d="M380 226 q-5 9 0 13 q5 -4 0 -13 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M400 228 q-5 9 0 13 q5 -4 0 -13 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <text x="376" y="256" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">carries water</text>

  <!-- ===== Panel C: mortar and pestle ===== -->
  <rect x="24" y="292" width="224" height="176" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="320" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">Mortar &amp; pestle</text>
  <!-- mortar -->
  <path d="M72 366 L80 404 Q110 418 140 404 L148 366 Z" fill="#d7d1c3" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="110" cy="366" rx="38" ry="9" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <!-- grain dots -->
  <circle cx="100" cy="372" r="3" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <circle cx="114" cy="376" r="3" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <circle cx="122" cy="370" r="3" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <!-- pestle -->
  <line x1="86" y1="344" x2="130" y2="384" stroke="#2b3a42" stroke-width="9" stroke-linecap="round"/>
  <circle cx="86" cy="344" r="6" fill="#2b3a42"/>
  <text x="136" y="448" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">grinds grain</text>

  <!-- ===== Panel D: broom ===== -->
  <rect x="264" y="292" width="224" height="176" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="320" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">Broom</text>
  <!-- handle -->
  <line x1="376" y1="344" x2="376" y2="410" stroke="#2b3a42" stroke-width="8" stroke-linecap="round"/>
  <!-- bristles -->
  <path d="M344 410 L408 410 L402 436 Q376 444 350 436 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <!-- sweep lines -->
  <path d="M332 428 Q340 434 348 430" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <path d="M356 432 Q364 438 372 434" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <text x="376" y="448" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">sweeps the floor</text>

  <!-- Footer -->
  <text x="256" y="494" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">People everywhere, in every time, have made tools for their own hands.</text>
</svg>
