<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">How collective hope arises</title>
  <desc id="desc">A three-step flow diagram: shared history leads to shared conditions, which lead to a shared feeling of hope. Arrows connect three boxes left to right, with small example labels under the first two boxes, and a sun icon above the final box. Labels, not color, carry the meaning so the diagram prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">How Collective Hope Arises</text>

  <!-- Box 1: shared history -->
  <rect x="36" y="150" width="128" height="96" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="100" y="188" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">shared</text>
  <text x="100" y="212" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">history</text>
  <text x="100" y="268" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">we remember</text>
  <text x="100" y="286" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">what we came</text>
  <text x="100" y="304" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">through</text>

  <!-- Arrow 1 -->
  <path d="M172 198 h52" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <path d="M216 192 l12 6 l-12 6 z" fill="#2b3a42"/>

  <!-- Box 2: shared conditions -->
  <rect x="230" y="150" width="128" height="96" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="294" y="188" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">shared</text>
  <text x="294" y="212" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">conditions</text>
  <text x="294" y="268" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">what we face</text>
  <text x="294" y="286" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">together</text>
  <text x="294" y="304" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">right now</text>

  <!-- Arrow 2 -->
  <path d="M366 198 h52" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <path d="M410 192 l12 6 l-12 6 z" fill="#2b3a42"/>

  <!-- Box 3: shared feeling hope -->
  <rect x="424" y="150" width="60" height="96" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="454" y="206" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">hope</text>

  <!-- Sun icon above hope -->
  <circle cx="454" cy="120" r="24" fill="#fdfbf7" stroke="#e0a458" stroke-width="3"/>
  <g stroke="#e0a458" stroke-width="3" stroke-linecap="round">
    <path d="M454 82 v10"/><path d="M454 148 v10"/>
    <path d="M416 120 h10"/><path d="M482 120 h10"/>
    <path d="M427 93 l7 7"/><path d="M474 140 l7 7"/>
    <path d="M481 93 l-7 7"/><path d="M434 140 l-7 7"/>
  </g>

  <!-- Example strip -->
  <rect x="36" y="340" width="452" height="120" rx="10" fill="#eef2ee" stroke="#7a9e7e" stroke-width="2"/>
  <text x="262" y="372" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">Hope rises when people see a real opening</text>
  <g font-family="sans-serif" font-size="16" fill="#222222" text-anchor="middle">
    <text x="130" y="408">a drought ends</text>
    <text x="130" y="430">for everyone</text>
    <text x="262" y="408">a movement</text>
    <text x="262" y="430">wins one step</text>
    <text x="394" y="408">a town</text>
    <text x="394" y="430">rebuilds</text>
  </g>
</svg>
