<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A body of artwork: three frames joined by one theme</title>
  <desc id="desc">Three small picture frames in a row, each containing a different simple subject, linked by a single thread labeled "theme," with a caption "one vision, many works." The labels carry the meaning, so it prints clearly in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="52" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">A Body of Work</text>

  <!-- Frame 1: a mountain -->
  <g>
    <rect x="40" y="120" width="120" height="120" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M60 210 L100 150 L120 185 L135 165 L160 210 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- Frame 2: a river -->
  <g>
    <rect x="196" y="120" width="120" height="120" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M206 130 C236 160 216 190 256 210" fill="none" stroke="#6b93b6" stroke-width="5" stroke-linecap="round"/>
    <path d="M286 130 C256 160 276 190 236 210" fill="none" stroke="#6b93b6" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Frame 3: a tree -->
  <g>
    <rect x="352" y="120" width="120" height="120" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="406" y="180" width="12" height="52" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="412" cy="166" r="34" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- Theme thread -->
  <path d="M100 260 C180 300 332 300 412 260" fill="none" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  <text x="256" y="322" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">theme</text>
  <text x="256" y="372" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222222">one vision, many works</text>
</svg>
