<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">An old tool and a new tool for the same job</title>
  <desc id="d">Two columns compare tools for the same job of grinding grain. The old tool is a stone mortar and pestle, worked by hand. The new tool is an electric grinder that plugs in. Both are labeled as grinding grain. A note says both do the same job; the new one uses electricity and is faster, the old one works without power. Word labels carry the meaning so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">Same job: grinding grain</text>

  <!-- Old tool -->
  <rect x="20" y="60" width="220" height="330" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="130" y="90" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">OLD TOOL</text>
  <!-- mortar bowl -->
  <path d="M60 220 Q130 300 200 220 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="4"/>
  <!-- pestle -->
  <rect x="120" y="120" width="20" height="120" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="4"/>
  <text x="130" y="316" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">mortar and pestle</text>
  <text x="130" y="344" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">worked by hand</text>
  <text x="130" y="368" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">no power needed</text>

  <!-- New tool -->
  <rect x="272" y="60" width="220" height="330" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="382" y="90" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">NEW TOOL</text>
  <!-- blender jar -->
  <rect x="340" y="130" width="84" height="120" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="4"/>
  <!-- blades -->
  <line x1="368" y1="250" x2="396" y2="250" stroke="#2b3a42" stroke-width="4"/>
  <!-- base -->
  <rect x="352" y="250" width="60" height="60" rx="8" fill="#4f6d7a" stroke="#2b3a42" stroke-width="4"/>
  <line x1="382" y1="310" x2="382" y2="340" stroke="#2b3a42" stroke-width="4"/>
  <line x1="370" y1="340" x2="394" y2="340" stroke="#2b3a42" stroke-width="4"/>
  <text x="382" y="368" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">electric grinder</text>
  <text x="382" y="392" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">plugs in</text>

  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">Both grind grain. The new one is faster,</text>
  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">but it needs electricity. The old one works without it.</text>
  <text x="256" y="490" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">New is not better — just different.</text>
</svg>
