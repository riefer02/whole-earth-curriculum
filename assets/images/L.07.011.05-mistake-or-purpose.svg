<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Misinformation and disinformation</title>
  <desc id="desc">Two panels. Left: "Misinformation — false by mistake", showing a person passing along an old number believing it is current. Right: "Disinformation — false on purpose", showing a person deliberately making up a false claim. Each panel shows a speech bubble with a false statement.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">False by mistake, false on purpose</text>

  <!-- left: misinformation -->
  <rect x="24" y="72" width="220" height="360" rx="12" fill="#6b93b6" opacity="0.3" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="134" y="108" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">Misinformation</text>
  <text x="134" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">false by mistake</text>

  <circle cx="134" cy="200" r="30" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="134" y="206" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#222222">A</text>

  <rect x="60" y="250" width="148" height="66" rx="10" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="134" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">"The fair is on</text>
  <text x="134" y="298" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Saturday."</text>

  <text x="134" y="356" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">shares an old date,</text>
  <text x="134" y="376" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">believing it is current</text>

  <!-- right: disinformation -->
  <rect x="268" y="72" width="220" height="360" rx="12" fill="#e0a458" opacity="0.35" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="378" y="108" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">Disinformation</text>
  <text x="378" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">false on purpose</text>

  <circle cx="378" cy="200" r="30" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="378" y="206" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#222222">B</text>

  <rect x="304" y="250" width="148" height="66" rx="10" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="378" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">"The fair is on</text>
  <text x="378" y="298" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Saturday."</text>

  <text x="378" y="356" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">knows it is false,</text>
  <text x="378" y="376" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">spreads it to trick people</text>

  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">The words look the same; the intent is different.</text>
</svg>
