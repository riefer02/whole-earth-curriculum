<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Space and time: the grammar of movement</title>
  <desc id="desc">A top-down diagram of a rectangular playing area. Six player dots are spread evenly into open space, labeled spacing. A dashed circle marks a gap of open space. One curved arrow shows a player moving into that gap at a specific moment, labeled timing. The diagram uses labels and shapes, not color alone, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Space and Time</text>

  <!-- Playing area -->
  <rect x="76" y="84" width="360" height="280" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>

  <!-- Player dots, spread out -->
  <circle cx="120" cy="140" r="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="330" cy="130" r="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="470" cy="220" r="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="220" cy="300" r="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="400" cy="330" r="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="120" cy="270" r="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>

  <!-- Open space (dashed circle) -->
  <circle cx="270" cy="210" r="44" fill="none" stroke="#e0a458" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Timing arrow: a player moves into the gap -->
  <path d="M220 300 C 240 250, 240 240, 262 232" fill="none" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
  <path d="M258 224 l14 -4 l-6 12 z" fill="#7a9e7e"/>

  <!-- Labels -->
  <rect x="60" y="396" width="150" height="62" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="135" y="420" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#6b93b6">Spacing</text>
  <text x="135" y="440" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">spread into open space</text>

  <rect x="306" y="396" width="150" height="62" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="381" y="420" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7a9e7e">Timing</text>
  <text x="381" y="440" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">move at the right moment</text>

  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Grammar you can learn, not a gift you are born with.</text>
</svg>
