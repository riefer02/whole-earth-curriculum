<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Multimodal composition, accessible by design</title>
  <desc id="desc">A framed composition built from four modes: a written heading and paragraph, a simple image with an alt-text tag, a sound wave with a text transcript, and a clean layout. Beside it, an accessibility checklist lists alt text, captions, contrast, headings, and a text version of sound.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#2b3a42">Four Modes, One Message — for Everyone</text>

  <!-- Composition frame -->
  <rect x="28" y="58" width="300" height="300" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <!-- words -->
  <text x="48" y="86" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Heading</text>
  <g stroke="#4f6d7a" stroke-width="2" stroke-linecap="round">
    <line x1="48" y1="98" x2="308" y2="98"/>
    <line x1="48" y1="112" x2="308" y2="112"/>
    <line x1="48" y1="126" x2="252" y2="126"/>
  </g>
  <!-- image with alt tag -->
  <rect x="48" y="140" width="110" height="80" rx="8" fill="#dce9f0" stroke="#6b93b6" stroke-width="2"/>
  <circle cx="103" cy="172" r="14" fill="#6b93b6"/>
  <rect x="70" y="190" width="66" height="22" rx="6" fill="#e0a458"/>
  <rect x="176" y="140" width="132" height="30" rx="6" fill="#eaf2ea"/>
  <text x="182" y="160" font-family="sans-serif" font-size="12" fill="#3a5a3a">alt text: "a blue circle</text>
  <text x="182" y="176" font-family="sans-serif" font-size="12" fill="#3a5a3a">over a warm field"</text>
  <!-- sound wave with transcript -->
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M48 260 l6 18 l6 -30 l6 30 l6 -18"/>
  </g>
  <text x="76" y="268" font-family="sans-serif" font-size="12" fill="#4f6d7a">sound</text>
  <text x="76" y="288" font-family="sans-serif" font-size="12" fill="#4f6d7a">+ text version</text>
  <!-- design note -->
  <text x="48" y="336" font-family="sans-serif" font-size="13" fill="#4f6d7a">clean layout · strong contrast · clear order</text>

  <!-- Checklist -->
  <rect x="344" y="58" width="140" height="300" rx="12" fill="#eaf2ea"/>
  <text x="414" y="84" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Checklist</text>
  <g font-family="sans-serif" font-size="12.5" fill="#3a5a3a">
    <text x="360" y="112">☑ alt text</text>
    <text x="360" y="136">☑ captions</text>
    <text x="360" y="160">☑ readable</text>
    <text x="374" y="178">contrast</text>
    <text x="360" y="202">☑ headings</text>
    <text x="360" y="226">☑ text version</text>
    <text x="374" y="244">of sound</text>
    <text x="360" y="268">☑ color is not</text>
    <text x="374" y="286">the only signal</text>
  </g>

  <text x="256" y="392" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">A message that reaches everyone is a better message, full stop.</text>
  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Accessibility is not a favor — it is part of what a text is.</text>
</svg>
