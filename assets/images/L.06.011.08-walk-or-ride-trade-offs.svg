<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Walk or ride? A choice with trade-offs</title>
  <desc id="desc">A two-column diagram comparing the trade-offs of walking versus riding. The left column, labeled "WALK," lists "healthy exercise, no cost, no fuel; but slow and tiring over long distance or bad weather." The right column, labeled "RIDE," lists "fast, dry, carries heavy things; but costs money and burns fuel, adding smoke and traffic." A bottom band reads "The best choice depends on the situation: distance, weather, safety, and what you need to carry. There is no single right answer." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Walk or ride? A choice with trade-offs</text>

  <!-- WALK column -->
  <g>
    <rect x="20" y="56" width="226" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="133" y="84" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">WALK</text>
    <!-- walking figure -->
    <circle cx="133" cy="128" r="15" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M133 143 L133 168 L118 190" fill="none" stroke="#2b3a42" stroke-width="4" stroke-linejoin="round"/>
    <path d="M133 150 L148 168 L152 190" fill="none" stroke="#2b3a42" stroke-width="4" stroke-linejoin="round"/>
    <path d="M133 146 L112 158" fill="none" stroke="#2b3a42" stroke-width="4"/>
    <rect x="36" y="208" width="194" height="44" rx="8" fill="#d7e3d9" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="133" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">Healthy exercise, no cost,</text>
    <text x="133" y="242" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">no fuel.</text>
    <rect x="36" y="262" width="194" height="44" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="133" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">But slow, and tiring over</text>
    <text x="133" y="296" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">distance or bad weather.</text>
  </g>

  <!-- RIDE column -->
  <g>
    <rect x="266" y="56" width="226" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="379" y="84" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">RIDE</text>
    <!-- bus -->
    <rect x="300" y="110" width="110" height="52" rx="8" fill="#dbe6ef" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="312" y="120" width="22" height="18" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="340" y="120" width="22" height="18" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="368" y="120" width="22" height="18" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="324" cy="164" r="12" fill="none" stroke="#2b3a42" stroke-width="3"/>
    <circle cx="386" cy="164" r="12" fill="none" stroke="#2b3a42" stroke-width="3"/>
    <rect x="290" y="208" width="194" height="44" rx="8" fill="#dbe6ef" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="387" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">Fast, dry, carries</text>
    <text x="387" y="242" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">heavy things.</text>
    <rect x="290" y="262" width="194" height="44" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="387" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">But costs money and burns</text>
    <text x="387" y="296" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">fuel — smoke and traffic.</text>
  </g>

  <!-- bottom band -->
  <rect x="20" y="372" width="472" height="118" rx="12" fill="#f2ead8" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="400" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">The best choice depends on the situation:</text>
  <text x="256" y="424" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">distance, weather, safety, and what you need</text>
  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">to carry. Both choices can be right on different</text>
  <text x="256" y="464" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">days. There is no single "right" answer.</text>
</svg>
