<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Dividing 125 by 4 with a remainder</title>
  <desc id="desc">Four groups of 31 dots each, shown as rounded rectangles, with a single dot left over on the side labeled the remainder. The division sentence 125 divided by 4 equals 31 remainder 1 is written below, along with the check 31 times 4 plus 1 equals 125.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Dividing with a Remainder</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">125 shared into 4 equal groups</text>

  <!-- Four groups of dots -->
  <g>
    <!-- group 1 -->
    <rect x="40" y="90" width="96" height="150" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="88" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fdfbf7">Group 1</text>
    <g fill="#fdfbf7">
      <circle cx="56" cy="128" r="3"/><circle cx="70" cy="128" r="3"/><circle cx="84" cy="128" r="3"/><circle cx="98" cy="128" r="3"/><circle cx="112" cy="128" r="3"/>
      <circle cx="56" cy="142" r="3"/><circle cx="70" cy="142" r="3"/><circle cx="84" cy="142" r="3"/><circle cx="98" cy="142" r="3"/><circle cx="112" cy="142" r="3"/>
      <circle cx="56" cy="156" r="3"/><circle cx="70" cy="156" r="3"/><circle cx="84" cy="156" r="3"/><circle cx="98" cy="156" r="3"/><circle cx="112" cy="156" r="3"/>
      <circle cx="56" cy="170" r="3"/><circle cx="70" cy="170" r="3"/><circle cx="84" cy="170" r="3"/><circle cx="98" cy="170" r="3"/><circle cx="112" cy="170" r="3"/>
      <circle cx="56" cy="184" r="3"/><circle cx="70" cy="184" r="3"/><circle cx="84" cy="184" r="3"/><circle cx="98" cy="184" r="3"/><circle cx="112" cy="184" r="3"/>
      <circle cx="56" cy="198" r="3"/><circle cx="70" cy="198" r="3"/><circle cx="84" cy="198" r="3"/><circle cx="98" cy="198" r="3"/><circle cx="112" cy="198" r="3"/>
      <circle cx="84" cy="212" r="3"/>
    </g>
    <text x="88" y="232" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fdfbf7">31</text>

    <!-- group 2 -->
    <rect x="148" y="90" width="96" height="150" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="196" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fdfbf7">Group 2</text>
    <g fill="#fdfbf7">
      <circle cx="164" cy="128" r="3"/><circle cx="178" cy="128" r="3"/><circle cx="192" cy="128" r="3"/><circle cx="206" cy="128" r="3"/><circle cx="220" cy="128" r="3"/>
      <circle cx="164" cy="142" r="3"/><circle cx="178" cy="142" r="3"/><circle cx="192" cy="142" r="3"/><circle cx="206" cy="142" r="3"/><circle cx="220" cy="142" r="3"/>
      <circle cx="164" cy="156" r="3"/><circle cx="178" cy="156" r="3"/><circle cx="192" cy="156" r="3"/><circle cx="206" cy="156" r="3"/><circle cx="220" cy="156" r="3"/>
      <circle cx="164" cy="170" r="3"/><circle cx="178" cy="170" r="3"/><circle cx="192" cy="170" r="3"/><circle cx="206" cy="170" r="3"/><circle cx="220" cy="170" r="3"/>
      <circle cx="164" cy="184" r="3"/><circle cx="178" cy="184" r="3"/><circle cx="192" cy="184" r="3"/><circle cx="206" cy="184" r="3"/><circle cx="220" cy="184" r="3"/>
      <circle cx="164" cy="198" r="3"/><circle cx="178" cy="198" r="3"/><circle cx="192" cy="198" r="3"/><circle cx="206" cy="198" r="3"/><circle cx="220" cy="198" r="3"/>
      <circle cx="192" cy="212" r="3"/>
    </g>
    <text x="196" y="232" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fdfbf7">31</text>

    <!-- group 3 -->
    <rect x="256" y="90" width="96" height="150" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="304" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fdfbf7">Group 3</text>
    <g fill="#fdfbf7">
      <circle cx="272" cy="128" r="3"/><circle cx="286" cy="128" r="3"/><circle cx="300" cy="128" r="3"/><circle cx="314" cy="128" r="3"/><circle cx="328" cy="128" r="3"/>
      <circle cx="272" cy="142" r="3"/><circle cx="286" cy="142" r="3"/><circle cx="300" cy="142" r="3"/><circle cx="314" cy="142" r="3"/><circle cx="328" cy="142" r="3"/>
      <circle cx="272" cy="156" r="3"/><circle cx="286" cy="156" r="3"/><circle cx="300" cy="156" r="3"/><circle cx="314" cy="156" r="3"/><circle cx="328" cy="156" r="3"/>
      <circle cx="272" cy="170" r="3"/><circle cx="286" cy="170" r="3"/><circle cx="300" cy="170" r="3"/><circle cx="314" cy="170" r="3"/><circle cx="328" cy="170" r="3"/>
      <circle cx="272" cy="184" r="3"/><circle cx="286" cy="184" r="3"/><circle cx="300" cy="184" r="3"/><circle cx="314" cy="184" r="3"/><circle cx="328" cy="184" r="3"/>
      <circle cx="272" cy="198" r="3"/><circle cx="286" cy="198" r="3"/><circle cx="300" cy="198" r="3"/><circle cx="314" cy="198" r="3"/><circle cx="328" cy="198" r="3"/>
      <circle cx="300" cy="212" r="3"/>
    </g>
    <text x="304" y="232" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fdfbf7">31</text>

    <!-- group 4 -->
    <rect x="364" y="90" width="96" height="150" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="412" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fdfbf7">Group 4</text>
    <g fill="#fdfbf7">
      <circle cx="380" cy="128" r="3"/><circle cx="394" cy="128" r="3"/><circle cx="408" cy="128" r="3"/><circle cx="422" cy="128" r="3"/><circle cx="436" cy="128" r="3"/>
      <circle cx="380" cy="142" r="3"/><circle cx="394" cy="142" r="3"/><circle cx="408" cy="142" r="3"/><circle cx="422" cy="142" r="3"/><circle cx="436" cy="142" r="3"/>
      <circle cx="380" cy="156" r="3"/><circle cx="394" cy="156" r="3"/><circle cx="408" cy="156" r="3"/><circle cx="422" cy="156" r="3"/><circle cx="436" cy="156" r="3"/>
      <circle cx="380" cy="170" r="3"/><circle cx="394" cy="170" r="3"/><circle cx="408" cy="170" r="3"/><circle cx="422" cy="170" r="3"/><circle cx="436" cy="170" r="3"/>
      <circle cx="380" cy="184" r="3"/><circle cx="394" cy="184" r="3"/><circle cx="408" cy="184" r="3"/><circle cx="422" cy="184" r="3"/><circle cx="436" cy="184" r="3"/>
      <circle cx="380" cy="198" r="3"/><circle cx="394" cy="198" r="3"/><circle cx="408" cy="198" r="3"/><circle cx="422" cy="198" r="3"/><circle cx="436" cy="198" r="3"/>
      <circle cx="408" cy="212" r="3"/>
    </g>
    <text x="412" y="232" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fdfbf7">31</text>
  </g>

  <!-- remainder -->
  <rect x="40" y="260" width="420" height="44" rx="8" fill="#ffffff" stroke="#e0a458" stroke-width="2"/>
  <circle cx="96" cy="282" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="120" y="287" font-family="sans-serif" font-size="16" fill="#2b3a42">1 left over — this is the remainder (R 1)</text>

  <!-- result -->
  <rect x="80" y="324" width="352" height="120" rx="12" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
  <text x="256" y="356" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#e0a458">125 ÷ 4 = 31 R 1</text>
  <text x="256" y="394" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">Check: 31 × 4 + 1 = 125</text>
  <text x="256" y="424" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">multiply back, add the leftover, get the whole again</text>

  <text x="256" y="476" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Division is equal sharing. The remainder is the leftover.</text>
</svg>
