<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Through the setback</title>
  <desc id="d">A road with a labeled goal at the end and a labeled barrier across the middle, with a dashed detour path curving around it, labeled "detour." Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#222222">Through the setback</text>
  <!-- goal -->
  <circle cx="420" cy="230" r="24" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="420" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#222222">goal</text>
  <!-- start -->
  <circle cx="96" cy="230" r="16" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="96" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#222222">start</text>
  <!-- barrier -->
  <rect x="238" y="180" width="26" height="100" rx="6" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="251" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#222222">barrier</text>
  <!-- road segments -->
  <line x1="112" y1="230" x2="238" y2="230" stroke="#2b3a42" stroke-width="3"/>
  <line x1="264" y1="230" x2="396" y2="230" stroke="#2b3a42" stroke-width="3"/>
  <!-- detour -->
  <path d="M238 230 C238 160 280 130 330 150 C380 170 396 200 396 230" fill="none" stroke="#7a9e7e" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="300" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6d7a">detour</text>
  <text x="256" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6d7a">a detour is not surrender</text>
  <text x="256" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4f6d7a">first, name the barrier: self-made or structural?</text>
</svg>
