<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Rules of the game</title>
  <desc id="desc">Three numbered rule cards in a row. Card 1 shows a child passing a ball to a teammate, labeled "pass to a teammate." Card 2 shows a circle with a child inside, labeled "stay inside the circle." Card 3 shows several children with a check mark, labeled "everyone gets a turn."</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="50" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Rules of the Game</text>

  <!-- Card 1 -->
  <g>
    <rect x="16" y="88" width="150" height="200" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="48" cy="118" r="18" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="48" y="125" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">1</text>
    <circle cx="70" cy="180" r="14" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="118" cy="180" r="14" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="94" cy="172" r="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M86 160 L104 188" stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
    <text x="91" y="238" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">pass to a</text>
    <text x="91" y="256" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">teammate</text>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="181" y="88" width="150" height="200" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="213" cy="118" r="18" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="213" y="125" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">2</text>
    <circle cx="256" cy="180" r="44" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="256" cy="180" r="12" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="238" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">stay inside</text>
    <text x="256" y="256" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">the circle</text>
  </g>

  <!-- Card 3 -->
  <g>
    <rect x="346" y="88" width="150" height="200" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="378" cy="118" r="18" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="378" y="125" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">3</text>
    <circle cx="398" cy="168" r="12" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="432" cy="180" r="12" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="412" cy="196" r="12" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M414 226 L418 232 L436 216" fill="none" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="421" y="254" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">everyone gets</text>
    <text x="421" y="272" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">a turn</text>
  </g>

  <text x="256" y="330" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222222">rules make a game fair for everyone</text>
</svg>
