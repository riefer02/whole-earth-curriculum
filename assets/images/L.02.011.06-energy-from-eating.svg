<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Energy moves from the sun to a plant to animals</title>
  <desc id="d">A food chain of four parts with arrows showing the direction energy moves. The sun gives energy to grass, the grass is eaten by a rabbit, and the rabbit is eaten by a fox. Each part is labeled: sun, plant (grass), plant-eater (rabbit), animal-eater (fox). The note says animals get energy from eating plants or other animals. Word labels carry the meaning so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">Energy moves through a food chain</text>

  <!-- Sun -->
  <circle cx="56" cy="120" r="28" fill="#e0a458" stroke="#2b3a42" stroke-width="4"/>
  <line x1="56" y1="80" x2="56" y2="64" stroke="#2b3a42" stroke-width="4"/>
  <line x1="56" y1="160" x2="56" y2="176" stroke="#2b3a42" stroke-width="4"/>
  <line x1="16" y1="120" x2="0" y2="120" stroke="#2b3a42" stroke-width="4"/>
  <line x1="96" y1="120" x2="112" y2="120" stroke="#2b3a42" stroke-width="4"/>
  <text x="56" y="206" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">sun</text>

  <text x="120" y="130" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#4f6d7a">→</text>

  <!-- Grass -->
  <line x1="176" y1="180" x2="176" y2="120" stroke="#2b3a42" stroke-width="4"/>
  <line x1="196" y1="180" x2="196" y2="112" stroke="#2b3a42" stroke-width="4"/>
  <line x1="216" y1="180" x2="216" y2="124" stroke="#2b3a42" stroke-width="4"/>
  <path d="M176 120 q10 -14 0 -20" fill="none" stroke="#7a9e7e" stroke-width="4"/>
  <path d="M196 112 q10 -14 0 -20" fill="none" stroke="#7a9e7e" stroke-width="4"/>
  <path d="M216 124 q10 -14 0 -20" fill="none" stroke="#7a9e7e" stroke-width="4"/>
  <text x="196" y="206" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">plant: grass</text>

  <text x="264" y="130" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#4f6d7a">→</text>

  <!-- Rabbit -->
  <circle cx="336" cy="120" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="4"/>
  <ellipse cx="336" cy="162" rx="24" ry="20" fill="#e0a458" stroke="#2b3a42" stroke-width="4"/>
  <ellipse cx="306" cy="96" rx="8" ry="20" fill="#e0a458" stroke="#2b3a42" stroke-width="4"/>
  <ellipse cx="366" cy="96" rx="8" ry="20" fill="#e0a458" stroke="#2b3a42" stroke-width="4"/>
  <circle cx="330" cy="116" r="3" fill="#222222"/>
  <text x="336" y="206" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">plant-eater: rabbit</text>

  <text x="404" y="130" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#4f6d7a">→</text>

  <!-- Fox -->
  <circle cx="476" cy="112" r="18" fill="#e0a458" stroke="#2b3a42" stroke-width="4"/>
  <polygon points="458,100 440,92 456,108" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <polygon points="494,100 512,92 496,108" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <ellipse cx="476" cy="158" rx="28" ry="22" fill="#e0a458" stroke="#2b3a42" stroke-width="4"/>
  <circle cx="470" cy="110" r="3" fill="#222222"/>
  <text x="476" y="206" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">animal-eater: fox</text>

  <rect x="24" y="240" width="464" height="120" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="256" y="272" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Who gets energy from eating?</text>
  <text x="256" y="300" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">The rabbit gets energy from eating plants (grass).</text>
  <text x="256" y="324" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">The fox gets energy from eating other animals (the rabbit).</text>
  <text x="256" y="348" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">Animals get energy from eating plants or other animals.</text>

  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">The arrows show which way the energy moves.</text>
  <text x="256" y="460" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">The sun gives the plant its start.</text>
</svg>
