<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 560" role="img" aria-labelledby="title-L-06-007-05-story-movement-voice-prop desc-L-06-007-05-story-movement-voice-prop">
  <title id="title-L-06-007-05-story-movement-voice-prop">Story = movement + voice + one more element</title>
  <desc id="desc-L-06-007-05-story-movement-voice-prop">A poster titled "Story = movement + voice + one more element." At the top, three labeled parts are shown: "movement — what my body does," "voice — what I say or sound," and "one more element — music, a prop, or shadow." Below, a three-box storyboard of a worked example "a seed becomes a tree" shows the beginning (a curled figure on the ground, a whispered "seed"), the middle (reaching arms, a rising "whoosh"), and the end (spread arms as branches, a calm "shade for everyone"). Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="560" fill="#fdfbf7"/>
  <text x="256" y="37.5" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Story = Movement + Voice + One More Element</text>

  <!-- three recipe parts -->
  <rect x="24" y="60" width="148" height="70" fill="#ffffff" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="98" y="84" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">movement</text>
  <text x="98" y="104" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">what my body does</text>

  <rect x="182" y="60" width="148" height="70" fill="#ffffff" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="256" y="84" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">voice</text>
  <text x="256" y="104" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">what I say or sound</text>

  <rect x="340" y="60" width="148" height="70" fill="#ffffff" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="414" y="84" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">one more element</text>
  <text x="414" y="104" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">music, a prop, or shadow</text>

  <!-- storyboard title -->
  <text x="256" y="168" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">worked example: "a seed becomes a tree"</text>

  <!-- box 1: beginning -->
  <rect x="24" y="190" width="148" height="240" fill="#ffffff" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="98" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">beginning</text>
  <!-- curled figure: down low, back rounded, head tucked to the knees -->
  <g transform="translate(0,-8)">
    <!-- folded knees -->
    <ellipse cx="76" cy="304" rx="15" ry="10" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="82" cy="310" rx="10" ry="6" fill="#2b3a42"/>
    <!-- rounded back -->
    <path d="M 68 300 Q 66 274 88 268 Q 110 262 118 282 Q 122 290 116 296 L 96 300
             Q 76 300 68 300 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"
          stroke-linejoin="round"/>
    <!-- arm wrapped round the knees -->
    <path d="M 92 286 Q 108 292 112 304" fill="none" stroke="#e6bb92" stroke-width="10"
          stroke-linecap="round"/>
    <!-- head, bowed -->
    <circle cx="112" cy="298" r="11.5" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 102 296 Q 102 286 113 286 Q 124 286 124 296 Q 117 290 110 292 Q 104 293 102 296 Z"
          fill="#2b3a42"/>
    <path d="M 110 304 q 5 2 8 -1" fill="none" stroke="#2b3a42" stroke-width="1.8"
          stroke-linecap="round"/>
  </g>
  <text x="98" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">movement: curled small</text>
  <text x="98" y="348" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">voice: "seed… seed…"</text>
  <text x="98" y="366" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">(extra: a whisper)</text>

  <!-- box 2: middle -->
  <rect x="182" y="190" width="148" height="240" fill="#ffffff" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="256" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">middle</text>
  <!-- rising figure: up off one knee, both arms reaching overhead -->
  <g>
    <!-- knelt leg, shin flat on the ground -->
    <path d="M 254 296 L 238 316 L 224 318" fill="none" stroke="#4f6d7a" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- braced foot in front -->
    <path d="M 258 296 L 274 310 L 274 322" fill="none" stroke="#4f6d7a" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="276" cy="325" rx="9" ry="5" fill="#2b3a42"/>
    <!-- torso, rising -->
    <path d="M 256 260 L 256 296" fill="none" stroke="#e0a458" stroke-width="20"
          stroke-linecap="round"/>
    <!-- both arms up -->
    <path d="M 254 266 L 242 252 L 238 240" fill="none" stroke="#ab7a4e" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 258 266 L 270 252 L 274 240" fill="none" stroke="#ab7a4e" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- head, tipped back to look up -->
    <circle cx="256" cy="246" r="11.5" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 245 244 Q 245 234 256 234 Q 267 234 267 244 Q 260 238 253 240 Q 247 241 245 244 Z"
          fill="#2b3a42"/>
  </g>
  <text x="256" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">movement: arms reach up</text>
  <text x="256" y="358" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">voice: a rising "whoosh"</text>
  <text x="256" y="374" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">extra: a partner</text>
  <text x="256" y="388" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">taps a beat</text>

  <!-- box 3: end -->
  <rect x="340" y="190" width="148" height="240" fill="#ffffff" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="414" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">end</text>
  <!-- tree figure: standing tall, arms spread wide like branches -->
  <g>
    <!-- legs, planted -->
    <path d="M 407 302 L 404 324" fill="none" stroke="#4f6d7a" stroke-width="12"
          stroke-linecap="round"/>
    <path d="M 421 302 L 424 324" fill="none" stroke="#4f6d7a" stroke-width="12"
          stroke-linecap="round"/>
    <ellipse cx="401" cy="327" rx="9" ry="5" fill="#2b3a42"/>
    <ellipse cx="427" cy="327" rx="9" ry="5" fill="#2b3a42"/>
    <!-- torso -->
    <path d="M 401 270 Q 401 260 409 258 L 419 258 Q 427 260 427 270 L 428 300 Q 428 306
             421 306 L 407 306 Q 400 306 400 300 Z" fill="#7a9e7e" stroke="#2b3a42"
          stroke-width="2" stroke-linejoin="round"/>
    <!-- arms spread like branches -->
    <path d="M 404 268 Q 388 260 379 247" fill="none" stroke="#e6bb92" stroke-width="10"
          stroke-linecap="round"/>
    <path d="M 424 268 Q 440 260 449 247" fill="none" stroke="#e6bb92" stroke-width="10"
          stroke-linecap="round"/>
    <!-- leaves at the finger tips and the crown -->
    <circle cx="376" cy="243" r="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.6"/>
    <circle cx="452" cy="243" r="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.6"/>
    <!-- head -->
    <circle cx="414" cy="244" r="11.5" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 403 242 Q 403 232 414 232 Q 425 232 425 242 Q 418 236 411 238 Q 405 239 403 242 Z"
          fill="#2b3a42"/>
    <path d="M 409 250 q 5 4 10 0" fill="none" stroke="#2b3a42" stroke-width="1.8"
          stroke-linecap="round"/>
  </g>
  <text x="414" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">movement: arms</text>
  <text x="414" y="360" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">spread wide</text>
  <text x="414" y="376" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">voice: "shade</text>
  <text x="414" y="390" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">for everyone"</text>
  <text x="414" y="404" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">(extra: a calm stillness)</text>

  <!-- arrows between boxes -->
  <g stroke="#2b3a42" stroke-width="2.5" fill="none">
    <line x1="172" y1="310" x2="182" y2="310" marker-end="url(#arr5-L-06-007-05-story-movement-voice-prop)"/>
    <line x1="330" y1="310" x2="340" y2="310" marker-end="url(#arr5-L-06-007-05-story-movement-voice-prop)"/>
  </g>
  <defs>
    <marker id="arr5-L-06-007-05-story-movement-voice-prop" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2b3a42"/>
    </marker>
  </defs>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">three tools, one story, a clear beginning, middle, and end</text>
  <text x="256" y="498" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">people have always told stories this way — with body, voice, and one more thing</text>
</svg>
