<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Caring and Working Together: many small acts build a caring community</title>
  <desc id="desc">A collage of eight labeled panels gathers the whole unit into one image. The panels are: encourage (a cheer with a raised fist), solve with words (a speech bubble), two feelings (a happy face and a sad face), care when hurt (a helping hand), a welcoming group (an open circle), traditions (a lit candle), together we can (two hands lifting together), and helping helps everyone (a heart with arrows). A central band reads "many small acts build a caring community." The written words carry the meaning, not color, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">Caring &amp; Working Together</text>
  <text x="256" y="62" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">All our skills in one box</text>

  <!-- Panel 1: encourage -->
  <g font-family="sans-serif">
    <rect x="16" y="82" width="112" height="92" rx="9" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="72" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b3a42">encourage</text>
    <line x1="72" y1="132" x2="72" y2="112" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <circle cx="72" cy="108" r="5" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <text x="72" y="152" text-anchor="middle" font-size="12" fill="#4f6d7a">a real cheer</text>

    <rect x="140" y="82" width="112" height="92" rx="9" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="196" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b3a42">solve with words</text>
    <rect x="168" y="114" width="56" height="30" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="196" y="134" text-anchor="middle" font-size="11" fill="#222222">I need…</text>
    <text x="196" y="160" text-anchor="middle" font-size="12" fill="#4f6d7a">not grabbing</text>

    <rect x="264" y="82" width="112" height="92" rx="9" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="320" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b3a42">two feelings</text>
    <circle cx="302" cy="132" r="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M296 132 A8 8 0 0 1 308 132" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="338" cy="132" r="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M334 134 Q338 130 342 134" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <text x="320" y="160" text-anchor="middle" font-size="12" fill="#4f6d7a">both true</text>

    <rect x="388" y="82" width="112" height="92" rx="9" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="444" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b3a42">care when hurt</text>
    <path d="M424 132 Q444 112 464 132" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <text x="444" y="152" text-anchor="middle" font-size="12" fill="#4f6d7a">stay &amp; help</text>

    <rect x="16" y="188" width="112" height="92" rx="9" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="72" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b3a42">welcome</text>
    <circle cx="72" cy="238" r="22" fill="none" stroke="#2b3a42" stroke-width="3" stroke-dasharray="2 8"/>
    <circle cx="72" cy="238" r="7" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <text x="72" y="270" text-anchor="middle" font-size="12" fill="#4f6d7a">make room</text>

    <rect x="140" y="188" width="112" height="92" rx="9" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="196" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b3a42">traditions</text>
    <line x1="196" y1="224" x2="196" y2="246" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <path d="M191 224 Q196 214 201 224" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="196" y1="214" x2="196" y2="208" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
    <text x="196" y="270" text-anchor="middle" font-size="12" fill="#4f6d7a">share &amp; remember</text>

    <rect x="264" y="188" width="112" height="92" rx="9" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="320" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b3a42">together we can</text>
    <path d="M300 238 Q320 220 340 238" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <path d="M304 246 Q320 230 336 246" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <text x="320" y="270" text-anchor="middle" font-size="12" fill="#4f6d7a">each a part</text>

    <rect x="388" y="188" width="112" height="92" rx="9" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="444" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b3a42">helping helps</text>
    <path d="M444 234 Q436 224 432 232 Q428 240 444 248 Q460 240 456 232 Q452 224 444 234 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="444" y="270" text-anchor="middle" font-size="12" fill="#4f6d7a">everyone</text>
  </g>

  <!-- Central band -->
  <rect x="36" y="306" width="440" height="58" rx="12" fill="#2b3a42"/>
  <text x="256" y="332" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#fdfbf7">many small acts</text>
  <text x="256" y="354" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#fdfbf7">build a caring community</text>

  <text x="256" y="402" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Caring and working together is a practice we do every day.</text>
</svg>
