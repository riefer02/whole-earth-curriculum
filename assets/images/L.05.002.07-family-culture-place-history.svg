<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Four shapers of me: family, culture, place, history</title>
  <desc id="desc">A flower diagram with a center circle labeled "me" and four petals labeled "family," "culture," "place," and "history." The family petal shows two figures holding hands. The culture petal shows a bowl of shared food and music notes. The place petal shows a house with a mountain and a river. The history petal shows an open book with an arrow pointing forward. Each petal is labeled and its icon differs in shape, so the diagram prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold" fill="#2b3a42">What Shapes Me</text>

  <!-- center "me" -->
  <circle cx="256" cy="270" r="52" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="256" cy="262" r="14" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="251" cy="258" r="2" fill="#2b3a42"/>
  <circle cx="261" cy="258" r="2" fill="#2b3a42"/>
  <path d="M250 268 Q256 272 262 268" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="256" y="300" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">me</text>

  <!-- Petal 1: family (top) -->
  <ellipse cx="256" cy="150" rx="88" ry="66" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <!-- two figures holding hands -->
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="232" cy="142" r="12" fill="#8f5f3d"/>
    <circle cx="280" cy="142" r="12" fill="#f5d6b6"/>
    <path d="M232 154 L232 182"/>
    <path d="M280 154 L280 182"/>
    <path d="M232 166 L280 166"/>
  </g>
  <text x="256" y="122" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#4f6d7a">family</text>

  <!-- Petal 2: culture (right) -->
  <ellipse cx="384" cy="270" rx="66" ry="88" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <!-- bowl of food -->
  <path d="M368 232 Q384 250 400 232 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <!-- music notes -->
  <g fill="#4f6d7a">
    <circle cx="402" cy="258" r="4"/>
    <line x1="406" y1="258" x2="406" y2="242" stroke="#4f6d7a" stroke-width="2"/>
    <path d="M406 242 Q414 240 414 250" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  </g>
  <text x="384" y="308" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#4f6d7a">culture</text>

  <!-- Petal 3: place (bottom) -->
  <ellipse cx="256" cy="390" rx="88" ry="66" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <!-- house + mountain + river -->
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M222 402 L236 388 L250 402"/>
    <rect x="226" y="402" width="20" height="16" fill="#ffffff"/>
    <path d="M272 386 L280 370 L290 386 L298 368 L306 386" />
    <path d="M238 402 Q244 412 240 420" />
  </g>
  <path d="M240 420 Q252 414 262 420 Q272 426 284 420" fill="none" stroke="#6b93b6" stroke-width="2"/>
  <text x="256" y="368" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#4f6d7a">place</text>

  <!-- Petal 4: history (left) -->
  <ellipse cx="128" cy="270" rx="66" ry="88" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <!-- open book + forward arrow -->
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 240 Q116 232 128 240 L128 268 Q116 260 104 268 Z"/>
    <path d="M128 240 Q140 232 152 240 L152 268 Q140 260 128 268 Z"/>
  </g>
  <line x1="104" y1="286" x2="150" y2="286" stroke="#2b3a42" stroke-width="2"/>
  <path d="M150 286 L142 280 L142 292 Z" fill="#2b3a42"/>
  <text x="128" y="308" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#4f6d7a">history</text>

  <text x="256" y="488" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42">Many threads, one whole self.</text>
</svg>
