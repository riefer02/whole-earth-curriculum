<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Who I am page</title>
  <desc id="desc">A "Who I Am" page folded into boxes. Four boxes show the facts of a person: my age (a number and a small cake), things I like (a ball and a book), things I can do (a child reading, "I can ____"), and my family (a grown-up, a child, and an older person with a cane and a hearing aid — one of many possible families). A wide box at the bottom reads "one thing I'm proud of" and shows a small plant growing from a pot, captioned "pride = my own growth, not beating anyone." Word labels carry the meaning so the page prints in grayscale. Skin tones and hair vary across the family figures. The closing line teaches that no page is better than another's — each is a true story.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Who I Am</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">my facts, and one thing I'm proud of</text>

  <!-- the page -->
  <rect x="30" y="90" width="452" height="304" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="116" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">this is me</text>

  <!-- box 1: age -->
  <rect x="44" y="130" width="206" height="84" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="56" y="150" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">my age</text>
  <text x="132" y="182" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#2b3a42">7</text>
  <text x="180" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">years old</text>

  <!-- box 2: likes -->
  <rect x="262" y="130" width="206" height="84" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="274" y="150" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">things I like</text>
  <circle cx="322" cy="180" r="13" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M313 174 Q322 167 331 174" fill="none" stroke="#2b3a42" stroke-width="1.6"/>
  <path d="M313 186 Q322 193 331 186" fill="none" stroke="#2b3a42" stroke-width="1.6"/>
  <rect x="360" y="166" width="34" height="26" rx="3" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="368" y1="174" x2="386" y2="174" stroke="#fdfbf7" stroke-width="2"/>
  <line x1="368" y1="180" x2="382" y2="180" stroke="#fdfbf7" stroke-width="2"/>

  <!-- box 3: abilities -->
  <rect x="44" y="222" width="206" height="84" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="56" y="242" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">things I can do</text>
  <circle cx="104" cy="270" r="9" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M95 270 A9 9 0 0 1 113 270 L113 263 A9 9 0 0 0 95 263 Z" fill="#2b3a42"/>
  <rect x="94" y="279" width="20" height="20" rx="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="176" y="276" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">I can ____</text>

  <!-- box 4: family -->
  <rect x="262" y="222" width="206" height="84" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="274" y="242" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">my family</text>
  <!-- grown-up -->
  <circle cx="330" cy="270" r="11" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <path d="M319 270 A11 11 0 0 1 341 270 L341 262 A11 11 0 0 0 319 262 Z" fill="#2b3a42"/>
  <rect x="320" y="281" width="20" height="24" rx="7" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <!-- child -->
  <circle cx="372" cy="278" r="8" fill="#d9a06b" stroke="#2b3a42" stroke-width="2"/>
  <path d="M364 278 A8 8 0 0 1 380 278 L380 272 A8 8 0 0 0 364 272 Z" fill="#8f5f3d"/>
  <rect x="365" y="286" width="14" height="16" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <!-- older person with cane and hearing aid -->
  <circle cx="414" cy="272" r="10" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
  <path d="M404 272 A10 10 0 0 1 424 272 L424 264 A10 10 0 0 0 404 264 Z" fill="#e8e3da"/>
  <path d="M421 268 Q426 264 429 270" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="429" cy="271" r="1.8" fill="#4f6d7a"/>
  <rect x="405" y="282" width="18" height="20" rx="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="430" y1="282" x2="436" y2="306" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>

  <!-- proud box -->
  <rect x="44" y="314" width="424" height="66" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="56" y="336" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">one thing I'm proud of</text>
  <line x1="120" y1="366" x2="120" y2="346" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 360 Q112 354 106 358 Q112 350 120 356 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M120 350 Q128 344 134 348 Q128 340 120 346 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M104 372 L136 372 L132 384 L108 384 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="156" y="356" font-family="sans-serif" font-size="14" fill="#222222">I practiced ____</text>
  <text x="156" y="372" font-family="sans-serif" font-size="12" fill="#4f6d7a">pride = my own growth, not beating anyone</text>

  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">No page is better than another's — each page is a true story.</text>
</svg>
