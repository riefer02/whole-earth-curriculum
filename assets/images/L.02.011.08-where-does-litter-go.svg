<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Where litter goes: two paths</title>
  <desc id="d">A piece of litter can take two paths. The top path, dropped on the ground, shows the litter being washed by rain into a river and out to the sea, where a fish could mistake it for food. The bottom path, put in the bin, shows the litter going to a bin and then being recycled, reused, or composted. Labels and arrows show both paths, teaching that putting litter in the right place keeps water, soil, and animals safe. Word labels carry the meaning so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">Where does litter go?</text>

  <!-- Top path: dropped -->
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Dropped on the ground</text>
  <!-- litter -->
  <rect x="60" y="80" width="26" height="26" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <text x="73" y="98" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">x</text>
  <text x="60" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">litter</text>

  <!-- rain -->
  <line x1="150" y1="90" x2="146" y2="104" stroke="#6b93b6" stroke-width="3"/>
  <line x1="160" y1="86" x2="156" y2="100" stroke="#6b93b6" stroke-width="3"/>
  <line x1="170" y1="90" x2="166" y2="104" stroke="#6b93b6" stroke-width="3"/>
  <text x="160" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">rain</text>

  <text x="212" y="98" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#4f6d7a">→</text>

  <!-- river -->
  <path d="M240 80 Q280 88 300 96" fill="none" stroke="#6b93b6" stroke-width="8" stroke-linecap="round"/>
  <text x="270" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">river</text>

  <text x="330" y="98" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#4f6d7a">→</text>

  <!-- sea -->
  <path d="M360 70 q40 26 80 0" fill="none" stroke="#6b93b6" stroke-width="8" stroke-linecap="round"/>
  <text x="400" y="66" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">sea</text>

  <!-- fish -->
  <ellipse cx="440" cy="104" rx="20" ry="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
  <polygon points="460,104 472,96 472,112" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="428" cy="102" r="3" fill="#222222"/>
  <text x="448" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">a fish could</text>
  <text x="448" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">eat it</text>

  <line x1="24" y1="180" x2="488" y2="180" stroke="#2b3a42" stroke-width="3"/>

  <!-- Bottom path: in the bin -->
  <text x="256" y="210" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Put in the bin</text>
  <!-- litter -->
  <rect x="60" y="230" width="26" height="26" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <text x="73" y="248" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">x</text>

  <text x="212" y="248" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#4f6d7a">→</text>

  <!-- bin -->
  <rect x="240" y="226" width="56" height="70" rx="6" fill="#4f6d7a" stroke="#2b3a42" stroke-width="4"/>
  <rect x="248" y="216" width="40" height="12" rx="3" fill="#4f6d7a" stroke="#2b3a42" stroke-width="3"/>
  <text x="268" y="270" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fdfbf7">bin</text>

  <text x="330" y="248" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#4f6d7a">→</text>

  <!-- recycle arrows -->
  <path d="M372 268 a22 22 0 1 1 -12 -38" fill="none" stroke="#7a9e7e" stroke-width="4"/>
  <polygon points="356,226 368,224 366,238" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="452" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">reuse,</text>
  <text x="452" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">recycle,</text>
  <text x="452" y="296" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">or compost</text>

  <rect x="24" y="330" width="464" height="140" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="256" y="362" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Why the right place matters</text>
  <text x="256" y="392" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">Litter dropped on the ground can wash into rivers and the sea,</text>
  <text x="256" y="416" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">where animals may mistake it for food.</text>
  <text x="256" y="448" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">Litter in the right place keeps water, soil, and animals safe.</text>
</svg>
