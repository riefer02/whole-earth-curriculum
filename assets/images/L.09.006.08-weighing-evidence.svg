<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Weighing conflicting evidence</title>
  <desc id="desc">A balance scale with a source on each pan. On the base are four criteria — author, purpose, evidence, currency — used as weights to judge which source is stronger, showing that conflicting evidence is weighed, not just picked.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Weighing Two Sources</text>

  <!-- scale -->
  <rect x="246" y="120" width="20" height="120" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="256" cy="240" r="8" fill="#2b3a42"/>
  <line x1="256" y1="240" x2="120" y2="160" stroke="#2b3a42" stroke-width="3"/>
  <line x1="256" y1="240" x2="392" y2="160" stroke="#2b3a42" stroke-width="3"/>

  <!-- pans -->
  <path d="M80 160 C 80 200, 160 200, 160 160" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <path d="M352 160 C 352 200, 432 200, 432 160" fill="none" stroke="#2b3a42" stroke-width="3"/>

  <!-- source boxes on pans -->
  <rect x="88" y="130" width="64" height="40" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="120" y="154" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">Source 1</text>

  <rect x="360" y="130" width="64" height="40" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="392" y="154" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">Source 2</text>

  <!-- criteria weights -->
  <rect x="40" y="270" width="200" height="44" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="140" y="290" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">who wrote it? (author)</text>
  <text x="140" y="306" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">do they know? do they gain?</text>

  <rect x="272" y="270" width="200" height="44" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="372" y="290" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">why? (purpose)</text>
  <text x="372" y="306" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">to inform or to persuade?</text>

  <rect x="40" y="326" width="200" height="44" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="140" y="346" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">what proof? (evidence)</text>
  <text x="140" y="362" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">data, or just claims?</text>

  <rect x="272" y="326" width="200" height="44" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="372" y="346" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">how fresh? (currency)</text>
  <text x="372" y="362" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">still true today?</text>

  <text x="256" y="414" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">When sources disagree, weigh them — then say which you trust and why.</text>
  <text x="256" y="436" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Sometimes the honest answer is: "the evidence is not settled yet."</text>
</svg>
