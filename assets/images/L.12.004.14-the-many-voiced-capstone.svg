<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The many-voiced capstone</title>
  <desc id="desc">A portfolio map: a central circle labeled one many-voiced whole, surrounded by four strand circles labeled deliberation, reading, writing, and language justice. Each strand circle holds two small artifact tags. Lines connect all four strands to the center. Labels carry the meaning, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">The Many-Voiced Capstone</text>

  <!-- Center -->
  <circle cx="256" cy="268" r="72" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="260" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">one</text>
  <text x="256" y="280" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">many-voiced</text>
  <text x="256" y="300" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">whole</text>

  <!-- Connectors -->
  <line x1="256" y1="196" x2="256" y2="132" stroke="#4f6d7a" stroke-width="2.5"/>
  <line x1="256" y1="340" x2="256" y2="404" stroke="#4f6d7a" stroke-width="2.5"/>
  <line x1="184" y1="268" x2="120" y2="268" stroke="#4f6d7a" stroke-width="2.5"/>
  <line x1="328" y1="268" x2="392" y2="268" stroke="#4f6d7a" stroke-width="2.5"/>

  <!-- Strand: deliberation (top) -->
  <circle cx="256" cy="92" r="48" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">deliberation</text>
  <text x="256" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">hear · reach</text>

  <!-- Strand: writing (bottom) -->
  <circle cx="256" cy="444" r="48" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">writing</text>
  <text x="256" y="458" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">plan · draft · revise</text>

  <!-- Strand: reading (left) -->
  <circle cx="80" cy="268" r="48" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="80" y="264" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">reading</text>
  <text x="80" y="282" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">registers · scripts</text>

  <!-- Strand: language justice (right) -->
  <circle cx="432" cy="268" r="48" fill="#cbb79a" stroke="#2b3a42" stroke-width="2"/>
  <text x="432" y="258" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">language</text>
  <text x="432" y="274" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">justice</text>
  <text x="432" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">advocate · bridge</text>

  <!-- Artifact tags -->
  <g font-family="sans-serif">
    <rect x="30" y="150" width="96" height="24" rx="12" fill="#f0ede4" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="78" y="166" text-anchor="middle" font-size="11" fill="#2b3a42">position log</text>
    <rect x="30" y="360" width="96" height="24" rx="12" fill="#f0ede4" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="78" y="376" text-anchor="middle" font-size="11" fill="#2b3a42">speech map</text>
    <rect x="386" y="150" width="96" height="24" rx="12" fill="#f0ede4" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="434" y="166" text-anchor="middle" font-size="11" fill="#2b3a42">justice audit</text>
    <rect x="386" y="360" width="96" height="24" rx="12" fill="#f0ede4" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="434" y="376" text-anchor="middle" font-size="11" fill="#2b3a42">bridging note</text>
  </g>

  <text x="256" y="498" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">four strands, one skill: hearing many voices, speaking with care</text>
</svg>
