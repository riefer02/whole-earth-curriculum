<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The emotional climate of a group</title>
  <desc id="desc">A group of five people seated in a circle, with a shared "climate" drawn above them. Three small panels show the three collective emotions named in the lesson — hope (a sun), fear (a storm cloud), and grief (a rain cloud) — each with its word, so the diagram prints clearly in grayscale. One seated figure uses a wheelchair.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">The Emotional Climate of a Group</text>

  <!-- Three collective-emotion panels -->
  <g>
    <rect x="30" y="70" width="140" height="118" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="100" cy="112" r="22" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#e0a458" stroke-width="3" stroke-linecap="round">
      <path d="M100 96 v18"/><path d="M100 104 h-14"/><path d="M100 104 h14"/>
      <path d="M100 120 h-14"/><path d="M100 120 h14"/>
    </g>
    <text x="100" y="168" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">hope</text>
  </g>
  <g>
    <rect x="186" y="70" width="140" height="118" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M232 130 h36 a14 14 0 0 0 0 -28 h-8 a18 18 0 0 0 -34 -4 a12 12 0 0 0 6 32 z" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M242 138 l6 8 m4 0 l6 -8" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="256" y="168" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">fear</text>
  </g>
  <g>
    <rect x="342" y="70" width="140" height="118" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M386 130 h36 a14 14 0 0 0 0 -28 h-8 a18 18 0 0 0 -34 -4 a12 12 0 0 0 6 32 z" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M398 134 l-3 8 m12 0 l-3 -8 m0 8 l-3 -8" fill="none" stroke="#6b93b6" stroke-width="2.5" stroke-linecap="round"/>
    <text x="412" y="168" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">grief</text>
  </g>

  <!-- Arrows from climate to group -->
  <g fill="none" stroke="#4f6d7a" stroke-width="2">
    <path d="M100 192 L172 296"/>
    <path d="M256 192 L256 300"/>
    <path d="M412 192 L340 296"/>
  </g>
  <path d="M172 288 l-8 14 l14 -2 z" fill="#4f6d7a"/>

  <!-- Group circle -->
  <ellipse cx="256" cy="360" rx="210" ry="60" fill="#eef2ee" stroke="#7a9e7e" stroke-width="2"/>

  <!-- Figure 1 (left) -->
  <g>
    <circle cx="110" cy="330" r="20" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M90 372 a20 20 0 0 1 40 0 z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <!-- Figure 2 -->
  <g>
    <circle cx="176" cy="340" r="20" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M156 382 a20 20 0 0 1 40 0 z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <!-- Figure 3 (center, wheelchair) -->
  <g>
    <circle cx="256" cy="300" r="20" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="236" y="318" width="40" height="40" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M246 358 l-6 24 m36 0 l6 -24" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="238" cy="386" r="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="278" cy="386" r="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <!-- Figure 4 -->
  <g>
    <circle cx="336" cy="340" r="20" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M316 382 a20 20 0 0 1 40 0 z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <!-- Figure 5 -->
  <g>
    <circle cx="402" cy="330" r="20" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M382 372 a20 20 0 0 1 40 0 z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#222222">A climate is shared — everyone breathes the same air.</text>
</svg>
