<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Weighing loyalty against solidarity</title>
  <desc id="d">A person in the center holding a balance scale, pulled between two labeled arrows — 'loyalty to my own' on one side and 'solidarity with others' on the other — toward a center labeled 'the common good'. Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <!-- left pull label -->
  <rect x="30" y="150" width="150" height="56" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="105" y="174" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">loyalty to</text>
  <text x="105" y="194" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">my own</text>
  <path d="M150 178 L200 178" stroke="#2b3a42" stroke-width="3" fill="none"/>
  <path d="M192 172 L204 178 L192 184" fill="#2b3a42"/>
  <!-- right pull label -->
  <rect x="332" y="150" width="150" height="56" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="407" y="174" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">solidarity with</text>
  <text x="407" y="194" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">others</text>
  <path d="M332 178 L282 178" stroke="#2b3a42" stroke-width="3" fill="none"/>
  <path d="M290 172 L278 178 L290 184" fill="#2b3a42"/>
  <!-- person -->
  <circle cx="256" cy="240" r="34" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <path d="M214 330 Q256 364 298 330" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <!-- balance scale held -->
  <line x1="214" y1="250" x2="298" y2="250" stroke="#2b3a42" stroke-width="3"/>
  <line x1="256" y1="250" x2="256" y2="286" stroke="#2b3a42" stroke-width="3"/>
  <!-- common good below -->
  <rect x="146" y="392" width="220" height="56" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="427" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">the common good</text>
  <line x1="256" y1="286" x2="256" y2="390" stroke="#2b3a42" stroke-width="2.5"/>
</svg>
