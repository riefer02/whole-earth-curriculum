<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Writing a topic sentence</title>
  <desc id="desc">A paragraph is drawn as a stack of sentence lines, and the first line glows with a warm highlight and a star, labeled "topic sentence — tells what the paragraph is about." The lines below are dimmer, marked "the rest of the sentences." The labels and shapes carry the meaning, so the picture prints clearly in grayscale and teaches learners that a topic sentence is the first sentence that tells the reader what the paragraph will be about.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Writing a Topic Sentence</text>

  <!-- paragraph block -->
  <rect x="80" y="110" width="352" height="230" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>

  <!-- topic sentence line (highlighted) -->
  <rect x="104" y="132" width="304" height="44" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
  <g stroke="#2b3a42" stroke-width="3" stroke-linecap="round">
    <line x1="122" y1="154" x2="150" y2="154"/>
    <line x1="158" y1="154" x2="186" y2="154"/>
    <line x1="194" y1="154" x2="222" y2="154"/>
    <line x1="230" y1="154" x2="258" y2="154"/>
    <line x1="266" y1="154" x2="294" y2="154"/>
  </g>
  <!-- star -->
  <text x="384" y="162" font-family="sans-serif" font-size="24" fill="#2b3a42">★</text>

  <!-- ordinary sentence lines -->
  <g stroke="#4f6d7a" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="122" y1="206" x2="256" y2="206"/>
    <line x1="122" y1="236" x2="300" y2="236"/>
    <line x1="122" y1="266" x2="240" y2="266"/>
    <line x1="122" y1="296" x2="280" y2="296"/>
  </g>

  <!-- labels -->
  <g font-family="sans-serif" font-size="14" fill="#2b3a42">
    <line x1="256" y1="182" x2="256" y2="224" stroke="#4f6d7a" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="270" y="200" font-weight="bold">topic sentence</text>

    <line x1="256" y1="252" x2="256" y2="290" stroke="#4f6d7a" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="270" y="272" fill="#4f6d7a">the rest of the</text>
    <text x="270" y="290" fill="#4f6d7a">sentences</text>
  </g>

  <text x="256" y="382" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">The topic sentence tells the reader what the paragraph is about.</text>
  <text x="256" y="408" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">It is usually the first sentence — the door the reader walks through.</text>
</svg>
