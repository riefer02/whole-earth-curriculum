<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My goal and my first step</title>
  <desc id="desc">A staircase with three steps. At the top sits a goal flag labeled "my goal," and a child stands on the bottom step with one foot lifted toward the first step, which is labeled "my first step." The middle step is labeled "then the next." A dotted line climbs from "today" up to the goal. The closing line teaches that a goal feels big, but naming the very first step makes it reachable. The child varies in skin tone and dress. Everything reads in grayscale because each step is labeled with text.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">My Goal and My First Step</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">a goal feels big — the first step makes it reachable</text>

  <!-- goal flag at top -->
  <g>
    <line x1="380" y1="150" x2="380" y2="360" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <path d="M380 150 L320 164 L380 178 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="350" y="140" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">my goal</text>
  </g>

  <!-- steps -->
  <rect x="180" y="330" width="230" height="34" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="295" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">my first step</text>

  <rect x="150" y="368" width="260" height="34" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="280" y="390" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">then the next step</text>

  <rect x="120" y="406" width="290" height="34" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="265" y="428" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">today — where I begin</text>

  <!-- child climbing -->
  <g>
    <circle cx="210" cy="360" r="18" fill="#d9a06b" stroke="#2b3a42" stroke-width="2"/>
    <path d="M196 360 A14 14 0 0 1 224 360 L224 350 A14 14 0 0 0 196 350 Z" fill="#6b93b6"/>
    <circle cx="205" cy="359" r="2" fill="#2b3a42"/>
    <circle cx="216" cy="359" r="2" fill="#2b3a42"/>
    <path d="M205 366 Q210 369 215 366" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M210 378 L210 398" stroke="#2b3a42" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M202 394 L218 394" stroke="#2b3a42" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M210 340 L210 344" stroke="#2b3a42" stroke-width="2.2" stroke-linecap="round"/>
    <text x="210" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">▲</text>
  </g>

  <!-- dotted line up -->
  <path d="M240 420 Q300 380 350 300" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="4 6"/>

  <text x="256" y="508" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">I can name my goal — and I can name the very first step toward it.</text>
</svg>
