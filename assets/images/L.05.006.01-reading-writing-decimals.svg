<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Place value to thousandths</title>
  <desc id="desc">A place-value chart with four columns labeled ones, tenths, hundredths, and thousandths. A decimal-point marker sits between the ones and tenths columns. The number 3.456 is shown: digit 3 under ones, 4 under tenths, 5 under hundredths, 6 under thousandths. Below each column a value row reads 3 ones, 4 tenths, 5 hundredths, 6 thousandths. At the bottom an expanded-form line reads 3.456 equals 3 plus 4 tenths plus 5 hundredths plus 6 thousandths. Labels and digits, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">Place Value to Thousandths</text>

  <!-- Column headers -->
  <rect x="40" y="70" width="96" height="46" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="88" y="98" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">ones</text>

  <rect x="168" y="70" width="96" height="46" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="216" y="98" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">tenths</text>

  <rect x="296" y="70" width="96" height="46" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="344" y="98" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">hundredths</text>

  <rect x="424" y="70" width="96" height="46" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="472" y="98" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">thousandths</text>

  <!-- Decimal point marker -->
  <circle cx="152" cy="93" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="152" y="136" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">decimal point</text>

  <!-- Digit row -->
  <rect x="40" y="150" width="96" height="64" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="88" y="192" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#222222">3</text>

  <rect x="168" y="150" width="96" height="64" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="216" y="192" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#222222">4</text>

  <rect x="296" y="150" width="96" height="64" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="344" y="192" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#222222">5</text>

  <rect x="424" y="150" width="96" height="64" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="472" y="192" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#222222">6</text>

  <!-- Value row -->
  <text x="88" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">3 ones</text>
  <text x="216" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">4 tenths</text>
  <text x="344" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">5 hundredths</text>
  <text x="472" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">6 thousandths</text>

  <!-- Fraction value row -->
  <text x="216" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#7a9e7e">4/10</text>
  <text x="344" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#7a9e7e">5/100</text>
  <text x="472" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#7a9e7e">6/1000</text>

  <!-- Expanded form -->
  <rect x="40" y="320" width="480" height="150" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="280" y="352" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#6b93b6">Expanded form</text>
  <text x="280" y="388" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#222222">3.456 = 3 + 4/10 + 5/100 + 6/1000</text>
  <text x="280" y="424" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">"three and four hundred fifty-six thousandths"</text>
  <text x="280" y="450" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">each place is ten times smaller as you move right</text>
</svg>
