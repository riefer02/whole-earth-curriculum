<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Ordinary people changing what was unfair</title>
  <desc id="desc">A before-and-after change diagram. The left panel, labeled "before," shows a bare hillside with a caption "forest being cut down." An arrow labeled "ordinary people worked together" leads to the right panel, labeled "after," showing the same hillside with many small planted trees and a caption "trees replanted, land cared for." Below, four labeled steps run left to right: "see the unfair thing," "join together," "act over time," "the change holds." Arrows, labels, and shapes carry the meaning, so it prints clearly in grayscale independent of color.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Ordinary People Change What Was Unfair</text>

  <!-- before panel -->
  <rect x="20" y="64" width="220" height="250" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="130" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">before</text>
  <!-- bare hillside + stumps -->
  <path d="M40 270 Q80 210 130 230 Q180 200 220 260 Z" fill="#e6e0d4" stroke="#2b3a42" stroke-width="2"/>
  <rect x="70" y="252" width="12" height="24" rx="3" fill="#c9a06b" stroke="#2b3a42" stroke-width="2"/>
  <rect x="150" y="244" width="12" height="26" rx="3" fill="#c9a06b" stroke="#2b3a42" stroke-width="2"/>
  <text x="130" y="298" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">forest being cut down</text>

  <!-- arrow -->
  <path d="M250 190 L300 190" stroke="#2b3a42" stroke-width="3" fill="none"/>
  <path d="M292 182 L302 190 L292 198" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <text x="276" y="166" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">ordinary people</text>
  <text x="276" y="184" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">worked together</text>

  <!-- after panel -->
  <rect x="272" y="64" width="220" height="250" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="382" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">after</text>
  <path d="M292 270 Q332 210 382 230 Q432 200 472 260 Z" fill="#e6e0d4" stroke="#2b3a42" stroke-width="2"/>
  <!-- planted trees -->
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="310" y1="252" x2="310" y2="222"/>
    <path d="M304 230 Q310 214 316 230 Z" fill="#7a9e7e"/>
    <line x1="382" y1="246" x2="382" y2="214"/>
    <path d="M376 222 Q382 206 388 222 Z" fill="#7a9e7e"/>
    <line x1="452" y1="254" x2="452" y2="224"/>
    <path d="M446 232 Q452 216 458 232 Z" fill="#7a9e7e"/>
  </g>
  <text x="382" y="298" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">trees replanted, land cared for</text>

  <!-- four steps -->
  <g font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">
    <rect x="20" y="340" width="108" height="60" rx="10" fill="#eef3f6" stroke="#4f6d7a" stroke-width="2"/>
    <text x="74" y="362">see the</text>
    <text x="74" y="378">unfair thing</text>
    <rect x="140" y="340" width="108" height="60" rx="10" fill="#eef3f6" stroke="#4f6d7a" stroke-width="2"/>
    <text x="194" y="362">join</text>
    <text x="194" y="378">together</text>
    <rect x="260" y="340" width="108" height="60" rx="10" fill="#eef3f6" stroke="#4f6d7a" stroke-width="2"/>
    <text x="314" y="362">act over</text>
    <text x="314" y="378">time</text>
    <rect x="380" y="340" width="108" height="60" rx="10" fill="#eef3f6" stroke="#4f6d7a" stroke-width="2"/>
    <text x="434" y="362">the change</text>
    <text x="434" y="378">holds</text>
  </g>
  <text x="256" y="438" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">no single hero &#8212; many people, staying with it</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">Collective action: seeing + joining + acting = change.</text>
</svg>
