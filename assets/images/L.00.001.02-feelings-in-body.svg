<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Feelings in our bodies: a body map with five feeling spots</title>
  <desc id="desc">A simple child body outline with five labeled feeling spots marked by different shapes: a warm heart on the chest (happy), a diamond on the shoulder (sad), a circle on the cheek (angry, shown warm-toned for "hot cheeks"), a triangle on the tummy (scared), and a square on the hand (calm). The body is drawn in a neutral tone, not a skin tone, so any learner can see it as their own body. A legend on the right repeats each shape with its feeling word and body spot. The shapes and words, not color, carry the meaning so it prints clearly in grayscale.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Feelings in Our Bodies</text>

  <!-- ===== Body outline ===== -->
  <!-- Legs (pants) -->
  <line x1="164" y1="330" x2="158" y2="416" stroke="#2b3a42" stroke-width="16" stroke-linecap="round"/>
  <line x1="164" y1="330" x2="158" y2="416" stroke="#4f6d7a" stroke-width="12" stroke-linecap="round"/>
  <line x1="196" y1="330" x2="202" y2="416" stroke="#2b3a42" stroke-width="16" stroke-linecap="round"/>
  <line x1="196" y1="330" x2="202" y2="416" stroke="#4f6d7a" stroke-width="12" stroke-linecap="round"/>
  <!-- Feet (shoes) -->
  <ellipse cx="156" cy="428" rx="13" ry="7" fill="#2b3a42"/>
  <ellipse cx="204" cy="428" rx="13" ry="7" fill="#2b3a42"/>

  <!-- Arms (skin) -->
  <line x1="148" y1="244" x2="110" y2="300" stroke="#2b3a42" stroke-width="15" stroke-linecap="round"/>
  <line x1="148" y1="244" x2="110" y2="300" stroke="#d6d1c7" stroke-width="11" stroke-linecap="round"/>
  <line x1="212" y1="244" x2="250" y2="300" stroke="#2b3a42" stroke-width="15" stroke-linecap="round"/>
  <line x1="212" y1="244" x2="250" y2="300" stroke="#d6d1c7" stroke-width="11" stroke-linecap="round"/>
  <!-- Hands -->
  <circle cx="108" cy="304" r="9" fill="#d6d1c7" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="252" cy="304" r="9" fill="#d6d1c7" stroke="#2b3a42" stroke-width="2"/>

  <!-- Torso (shirt) -->
  <rect x="142" y="222" width="76" height="112" rx="18" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>

  <!-- Neck -->
  <rect x="172" y="206" width="16" height="18" fill="#d6d1c7" stroke="#2b3a42" stroke-width="2"/>

  <!-- Head -->
  <circle cx="180" cy="176" r="34" fill="#d6d1c7" stroke="#2b3a42" stroke-width="2"/>
  <path d="M146 172 A34 34 0 0 1 214 172 Z" fill="#2b3a42"/>
  <circle cx="168" cy="180" r="3" fill="#2b3a42"/>
  <circle cx="192" cy="180" r="3" fill="#2b3a42"/>
  <path d="M170 194 Q180 200 190 194" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>

  <!-- ===== Feeling spots on the body ===== -->
  <!-- happy: warm chest (heart) -->
  <path d="M180 259 C176 252 169 252 169 258 C169 263 180 272 180 272 C180 272 191 263 191 258 C191 252 184 252 180 259 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <!-- sad: heavy shoulders (diamond) -->
  <path d="M150 230 L157 238 L150 246 L143 238 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <!-- angry: hot cheeks (circle) -->
  <circle cx="158" cy="184" r="7" fill="#c96f5f" stroke="#2b3a42" stroke-width="2"/>
  <!-- scared: wobbly tummy (triangle) -->
  <path d="M180 289 L188 305 L172 305 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <!-- calm: still hands (square) -->
  <rect x="247" y="299" width="14" height="14" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>

  <!-- ===== Legend ===== -->
  <!-- happy -->
  <path d="M322 166 C317 158 309 158 309 165 C309 171 322 182 322 182 C322 182 335 171 335 165 C335 158 327 158 322 166 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="344" y="165" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">happy</text>
  <text x="344" y="184" font-family="sans-serif" font-size="15" fill="#4f6d7a">warm chest</text>

  <!-- sad -->
  <path d="M322 215 L330 224 L322 233 L314 224 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="344" y="231" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">sad</text>
  <text x="344" y="250" font-family="sans-serif" font-size="15" fill="#4f6d7a">heavy shoulders</text>

  <!-- angry -->
  <circle cx="322" cy="290" r="9" fill="#c96f5f" stroke="#2b3a42" stroke-width="2"/>
  <text x="344" y="297" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">angry</text>
  <text x="344" y="316" font-family="sans-serif" font-size="15" fill="#4f6d7a">hot cheeks</text>

  <!-- scared -->
  <path d="M322 347 L331 365 L313 365 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="344" y="363" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">scared</text>
  <text x="344" y="382" font-family="sans-serif" font-size="15" fill="#4f6d7a">wobbly tummy</text>

  <!-- calm -->
  <rect x="313" y="413" width="18" height="18" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="344" y="429" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">calm</text>
  <text x="344" y="448" font-family="sans-serif" font-size="15" fill="#4f6d7a">still hands</text>
</svg>
