<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t4 d4">
  <title id="t4">Attention has anchors</title>
  <desc id="d4">A seated figure in the center with three labeled anchors radiating outward — breath, sounds, feet on the ground — showing that when attention wanders, you can return it to a chosen anchor without judging yourself.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="56" font-family="sans-serif" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle">Anchors for attention</text>

  <!-- central figure seated -->
  <circle cx="256" cy="230" r="30" fill="#e0a458"/>
  <path d="M 256 260 L 256 330" stroke="#2b3a42" stroke-width="9" stroke-linecap="round"/>
  <path d="M 256 285 L 214 315" stroke="#2b3a42" stroke-width="9" stroke-linecap="round"/>
  <path d="M 256 285 L 298 315" stroke="#2b3a42" stroke-width="9" stroke-linecap="round"/>
  <path d="M 256 330 L 210 395" stroke="#2b3a42" stroke-width="9" stroke-linecap="round"/>
  <path d="M 256 330 L 302 395" stroke="#2b3a42" stroke-width="9" stroke-linecap="round"/>
  <text x="256" y="270" font-family="sans-serif" font-size="16" fill="#fdfbf7" text-anchor="middle">me</text>

  <!-- connectors -->
  <line x1="256" y1="210" x2="130" y2="120" stroke="#4f6d7a" stroke-width="3"/>
  <line x1="286" y1="215" x2="392" y2="130" stroke="#4f6d7a" stroke-width="3"/>
  <line x1="256" y1="260" x2="256" y2="480" stroke="#4f6d7a" stroke-width="3"/>

  <!-- anchor 1: breath -->
  <circle cx="130" cy="100" r="40" fill="#7a9e7e" opacity="0.85"/>
  <text x="130" y="108" font-family="sans-serif" font-size="18" fill="#222222" text-anchor="middle">breath</text>

  <!-- anchor 2: sounds -->
  <circle cx="392" cy="100" r="40" fill="#6b93b6" opacity="0.85"/>
  <text x="392" y="108" font-family="sans-serif" font-size="18" fill="#222222" text-anchor="middle">sounds</text>

  <!-- anchor 3: feet -->
  <circle cx="256" cy="500" r="0" fill="none"/>
  <ellipse cx="256" cy="452" rx="60" ry="26" fill="#e0a458" opacity="0.85"/>
  <text x="256" y="458" font-family="sans-serif" font-size="17" fill="#222222" text-anchor="middle">feet on the ground</text>

  <text x="256" y="30" font-family="sans-serif" font-size="0" fill="#fdfbf7"/>
</svg>
