<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Power and Momentum</title>
  <desc id="desc">Two panels — one showing the same amount of work done quickly versus slowly with the equation power equals work divided by time, and one showing two objects colliding with momentum conserved before and after.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Power and Momentum</text>

  <!-- Power panel -->
  <text x="130" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a" font-weight="bold">Power: how fast work happens</text>
  <g font-family="sans-serif" font-size="13" fill="#222222">
    <text x="50" y="96">Same work, 200 J:</text>
    <text x="50" y="122">&#8226; done in 2 s &#8594; 100 W</text>
    <text x="50" y="146">&#8226; done in 10 s &#8594; 20 W</text>
  </g>
  <text x="130" y="184" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42" font-weight="bold">P = W &#247; t</text>
  <text x="130" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">watts = joules &#247; seconds</text>

  <!-- Momentum panel -->
  <text x="386" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a" font-weight="bold">Momentum: conserved in collisions</text>
  <text x="300" y="100" font-family="sans-serif" font-size="13" fill="#222222">Before:</text>
  <rect x="300" y="112" width="50" height="40" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="325" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">2 kg</text>
  <text x="352" y="130" font-family="sans-serif" font-size="12" fill="#6b93b6">&#8594; 3 m/s</text>
  <rect x="420" y="112" width="36" height="30" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="438" y="131" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2b3a42">1 kg</text>

  <text x="300" y="176" font-family="sans-serif" font-size="13" fill="#222222">After:</text>
  <rect x="330" y="188" width="40" height="34" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="410" y="188" width="46" height="38" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="386" y="238" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">total before = total after</text>

  <text x="256" y="280" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42" font-weight="bold">p = m &#215; v &#160;&#160;(momentum = mass &#215; velocity)</text>

  <text x="256" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Airbags and crumple zones stretch a crash out over time,</text>
  <text x="256" y="362" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">so the same change in momentum produces a smaller force.</text>

  <text x="256" y="482" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Physics tells us what can be protected; values decide whether we do.</text>
</svg>
