<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Empathy across distance</title>
  <desc id="desc">A small figure on the left sends a curved signal across a wide space labeled "distance, ocean, time" to a figure on the right on a distant shore. Between them float three cues that build empathy: a name, a story, a shared need. Labels, not color, carry the meaning, so the diagram prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Empathy Across Distance</text>

  <!-- Distant shore -->
  <path d="M320 420 Q384 380 512 420 L512 512 L320 512 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <path d="M0 420 Q90 392 192 420 L192 512 L0 512 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  <!-- Left figure -->
  <g stroke="#2b3a42" stroke-width="2" fill="#ffffff">
    <circle cx="120" cy="360" r="16" fill="#e0a458"/>
    <path d="M120 376 v30 M104 386 c0 13 7 22 16 22 s16 -9 16 -22"/>
  </g>
  <!-- Right figure -->
  <g stroke="#2b3a42" stroke-width="2" fill="#ffffff">
    <circle cx="392" cy="360" r="16" fill="#6b93b6"/>
    <path d="M392 376 v30 M376 386 c0 13 7 22 16 22 s16 -9 16 -22"/>
  </g>

  <!-- Signal arc -->
  <path d="M136 340 Q256 220 376 340" stroke="#4f6d7a" stroke-width="3" fill="none"/>
  <path d="M366 330 l10 12 l-16 -2 z" fill="#4f6d7a"/>

  <!-- Bridging cues -->
  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">
    <rect x="206" y="236" width="100" height="40" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="261">a name</text>
    <rect x="206" y="286" width="100" height="40" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="311">a story</text>
    <rect x="206" y="336" width="100" height="40" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="361">a shared need</text>
  </g>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">Distance weakens feeling — names, stories, and shared needs can carry it across.</text>
</svg>
