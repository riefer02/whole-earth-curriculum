<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Carrying the ethic forward</title>
  <desc id="d">A single figure walking forward along a path, carrying a small bundle labeled 'my ethic', with the unit's ideas as labeled stepping stones behind them. Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <!-- path -->
  <path d="M40 420 Q256 380 470 200" fill="none" stroke="#2b3a42" stroke-width="3" stroke-dasharray="10 8"/>
  <!-- stepping stones behind -->
  <ellipse cx="90" cy="400" rx="34" ry="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="90" y="405" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">trust</text>
  <ellipse cx="160" cy="380" rx="34" ry="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="160" y="385" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">repair</text>
  <ellipse cx="230" cy="352" rx="34" ry="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="230" y="357" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">empathy</text>
  <ellipse cx="300" cy="320" rx="34" ry="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="300" y="325" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">solidarity</text>
  <ellipse cx="370" cy="284" rx="34" ry="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="370" y="289" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">mutual aid</text>
  <ellipse cx="440" cy="246" rx="34" ry="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="440" y="251" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">all life</text>
  <!-- figure walking forward (near the top-right) -->
  <circle cx="452" cy="168" r="26" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <path d="M420 226 Q452 258 484 226" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <!-- carried bundle -->
  <rect x="462" y="130" width="44" height="34" rx="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="484" y="151" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">my ethic</text>
  <path d="M472 164 L472 180" stroke="#2b3a42" stroke-width="2.5"/>
  <!-- forward arrow -->
  <path d="M470 60 L470 88" stroke="#2b3a42" stroke-width="3" fill="none"/>
  <path d="M464 84 L470 96 L476 84" fill="#2b3a42"/>
</svg>
