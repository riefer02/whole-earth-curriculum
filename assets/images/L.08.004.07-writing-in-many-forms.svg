<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Writing in many forms</title>
  <desc id="desc">Three labeled boxes: narrative (a story with beginning, middle, end), argument (a claim with reasons), and informational (a topic with facts). Each box has a short example line about one shared topic — a flooded river.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">One topic, three forms</text>

  <!-- narrative -->
  <rect x="26" y="84" width="144" height="230" rx="10" fill="#6b93b6" opacity="0.45" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="98" y="112" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">narrative</text>
  <text x="98" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">tells what happened</text>
  <line x1="44" y1="148" x2="152" y2="148" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="98" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">beginning</text>
  <text x="98" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">middle</text>
  <text x="98" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">end</text>
  <text x="98" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">"That morning the</text>
  <text x="98" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">river rose over the</text>
  <text x="98" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">stones…"</text>

  <!-- argument -->
  <rect x="184" y="84" width="144" height="230" rx="10" fill="#e0a458" opacity="0.6" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="112" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">argument</text>
  <text x="256" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">makes a case</text>
  <line x1="202" y1="148" x2="310" y2="148" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="256" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">claim</text>
  <text x="256" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">reasons</text>
  <text x="256" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">close</text>
  <text x="256" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">"We should move the</text>
  <text x="256" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">path higher, because</text>
  <text x="256" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">the river floods…"</text>

  <!-- informational -->
  <rect x="342" y="84" width="144" height="230" rx="10" fill="#7a9e7e" opacity="0.5" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="414" y="112" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">informational</text>
  <text x="414" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">explains facts</text>
  <line x1="360" y1="148" x2="468" y2="148" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="414" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">topic</text>
  <text x="414" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">facts</text>
  <text x="414" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">order</text>
  <text x="414" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">"Each rainy season the</text>
  <text x="414" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">river rises and covers</text>
  <text x="414" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">the low path."</text>

  <text x="256" y="372" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">The form is the shape; the voice is yours.</text>
</svg>
