<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-06-006-09-balanced-unbalanced-forces desc-L-06-006-09-balanced-unbalanced-forces">
  <title id="title-L-06-006-09-balanced-unbalanced-forces">Balanced and unbalanced forces</title>
  <desc id="desc-L-06-006-09-balanced-unbalanced-forces">A diagram of balanced and unbalanced forces. At the top, a book rests on a table with two equal-length arrows, one pushing down labeled gravity pulls down and one pushing up labeled table pushes up, with a caption: balanced forces — equal and opposite, so the book does not move. In the middle, a ball on the ground has a long arrow to the right labeled kick and a short arrow to the left labeled friction, with a caption: unbalanced forces — the kick is stronger, so the ball speeds up. At the bottom, a cart has two equal opposite arrows labeled balanced — steady speed, no change. Labels, arrow lengths, and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Balanced and Unbalanced Forces</text>
  <text x="256" y="56" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">equal forces mean no change; unequal forces mean change</text>

  <defs>
    <marker id="ba-L-06-006-09-balanced-unbalanced-forces" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2b3a42"/>
    </marker>
  </defs>

  <!-- book on table (balanced) -->
  <g>
    <line x1="20" y1="200" x2="200" y2="200" stroke="#2b3a42" stroke-width="4"/>
    <rect x="80" y="156" width="70" height="44" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="115" y="184" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">book</text>
    <!-- down arrow -->
    <line x1="115" y1="142" x2="115" y2="154" stroke="#2b3a42" stroke-width="3" marker-end="url(#ba-L-06-006-09-balanced-unbalanced-forces)"/>
    <text x="170" y="142" font-family="sans-serif" font-size="12" fill="#222222">gravity pulls down</text>
    <!-- up arrow -->
    <line x1="115" y1="208" x2="115" y2="220" stroke="#2b3a42" stroke-width="3" marker-end="url(#ba-L-06-006-09-balanced-unbalanced-forces)"/>
    <text x="170" y="218" font-family="sans-serif" font-size="12" fill="#222222">table pushes up</text>
    <text x="115" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">balanced — no move</text>
  </g>

  <!-- kicked ball (unbalanced) -->
  <g>
    <line x1="230" y1="230" x2="410" y2="230" stroke="#2b3a42" stroke-width="4"/>
    <circle cx="290" cy="208" r="22" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <!-- kick arrow (long, right) -->
    <line x1="316" y1="208" x2="380" y2="208" stroke="#2b3a42" stroke-width="4" marker-end="url(#ba-L-06-006-09-balanced-unbalanced-forces)"/>
    <text x="380" y="198" font-family="sans-serif" font-size="12" fill="#222222">kick</text>
    <!-- friction arrow (short, left) -->
    <line x1="264" y1="208" x2="240" y2="208" stroke="#4f6d7a" stroke-width="3" marker-end="url(#ba-L-06-006-09-balanced-unbalanced-forces)"/>
    <text x="290" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">friction</text>
    <text x="290" y="262" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">unbalanced — it speeds up</text>
  </g>

  <!-- cart (balanced steady) -->
  <g>
    <line x1="40" y1="380" x2="240" y2="380" stroke="#2b3a42" stroke-width="4"/>
    <!-- cart -->
    <rect x="110" y="340" width="70" height="40" rx="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="124" cy="384" r="10" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="166" cy="384" r="10" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <!-- left push -->
    <line x1="100" y1="360" x2="64" y2="360" stroke="#2b3a42" stroke-width="3" marker-end="url(#ba-L-06-006-09-balanced-unbalanced-forces)"/>
    <text x="64" y="350" font-family="sans-serif" font-size="12" fill="#222222">push</text>
    <!-- right push equal -->
    <line x1="190" y1="360" x2="226" y2="360" stroke="#2b3a42" stroke-width="3" marker-end="url(#ba-L-06-006-09-balanced-unbalanced-forces)"/>
    <text x="226" y="350" text-anchor="end" font-family="sans-serif" font-size="12" fill="#222222">push</text>
    <text x="145" y="418" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">balanced — steady speed, no change</text>
  </g>

  <!-- summary -->
  <rect x="250" y="290" width="240" height="120" rx="10" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
  <text x="370" y="318" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">read the arrows</text>
  <text x="370" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">equal opposite arrows = balanced</text>
  <text x="370" y="366" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">unequal arrows = unbalanced</text>
  <text x="370" y="392" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">motion changes toward the longer arrow</text>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">motion is a tug-of-war</text>
  <text x="256" y="494" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#4f6d7a">when the pulls are even, nothing changes; when one wins, things move</text>
</svg>
