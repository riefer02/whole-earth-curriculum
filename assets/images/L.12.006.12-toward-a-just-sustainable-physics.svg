<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Toward a Just and Sustainable Physics</title>
  <desc id="desc">A proposal path in five steps — name the problem, state the physical constraint that no energy is free, make one change, name who is newly included, and say how we would know — with the second law noted as the honest limit.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">A Just and Sustainable Proposal</text>

  <circle cx="256" cy="88" r="20" fill="#2b3a42"/>
  <text x="256" y="94" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#fdfbf7">1</text>
  <text x="256" y="126" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Name the problem</text>

  <line x1="256" y1="140" x2="256" y2="160" stroke="#2b3a42" stroke-width="2"/>

  <rect x="136" y="170" width="240" height="44" rx="8" fill="none" stroke="#e0a458" stroke-width="3"/>
  <text x="256" y="192" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">2. Honor the constraint:</text>
  <text x="256" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">no energy is free (the second law)</text>

  <line x1="256" y1="224" x2="256" y2="244" stroke="#2b3a42" stroke-width="2"/>

  <circle cx="256" cy="266" r="20" fill="#2b3a42"/>
  <text x="256" y="272" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#fdfbf7">3</text>
  <text x="256" y="304" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Make one concrete change</text>

  <line x1="256" y1="318" x2="256" y2="338" stroke="#2b3a42" stroke-width="2"/>

  <circle cx="256" cy="360" r="20" fill="#7a9e7e"/>
  <text x="256" y="366" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">4</text>
  <text x="256" y="398" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Name who is newly included</text>

  <line x1="256" y1="412" x2="256" y2="432" stroke="#2b3a42" stroke-width="2"/>

  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#6b93b6" font-weight="bold">5. How would we know it worked?</text>
  <text x="256" y="488" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Work with the laws — and share the benefit fairly.</text>
</svg>
