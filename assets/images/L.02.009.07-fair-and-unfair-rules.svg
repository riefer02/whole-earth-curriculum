<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Fair and unfair rules</title>
  <desc id="desc">Two panels compare a fair rule and an unfair rule. The left panel shows four children in a circle passing a ball, labeled "everyone gets a turn — fair". The right panel shows three children playing with a ball while a fourth child stands apart with head down, labeled "some are left out for no reason — unfair". A small question mark sits between the two panels, labeled "why?". The labels and shapes — not color — carry the meaning, so the picture prints clearly in grayscale and teaches that fair means everyone gets a chance, and unfair means someone is left out for no good reason.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Fair and Unfair Rules</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Fair = same chance, good reason &#183; unfair = left out, no reason</text>

  <!-- fair panel -->
  <rect x="28" y="96" width="200" height="280" rx="14" fill="#ffffff" stroke="#7a9e7e" stroke-width="2"/>
  <text x="128" y="124" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">fair</text>
  <!-- four children in a circle passing a ball -->
  <g>
    <circle cx="128" cy="200" r="13" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="90" cy="232" r="13" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="166" cy="232" r="13" fill="#8d6e63" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="128" cy="266" r="13" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <circle cx="128" cy="200" r="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="128" y="320" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">everyone gets a turn</text>
  <text x="128" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">same chance for all</text>

  <!-- unfair panel -->
  <rect x="284" y="96" width="200" height="280" rx="14" fill="#ffffff" stroke="#e0a458" stroke-width="2"/>
  <text x="384" y="124" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">unfair</text>
  <!-- three children playing, one left out -->
  <g>
    <circle cx="356" cy="200" r="13" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="404" cy="210" r="13" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="376" cy="244" r="13" fill="#8d6e63" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <circle cx="384" cy="210" r="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <!-- child left out -->
  <circle cx="452" cy="268" r="13" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M452 284 L446 296 M452 284 L458 296" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="384" y="320" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">some are left out</text>
  <text x="384" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">for no good reason</text>

  <!-- why marker -->
  <rect x="232" y="232" width="52" height="52" rx="26" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="258" y="266" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#222222">?</text>
  <text x="258" y="304" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4f6d7a">why?</text>

  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Notice fair and unfair &#183; say why &#183; then make it right</text>
  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">The unfairness is in the rule, never in a child</text>
</svg>
