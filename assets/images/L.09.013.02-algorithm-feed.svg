<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A feed filtered by an algorithm</title>
  <desc id="desc">Many possible posts enter on the left and pass through a filter labeled algorithm, which sorts and ranks them. Only a few posts reach the screen on the right, and small labels show the algorithm's signals: clicks, watch time, and shares. A person holding a phone sees only the ranked result.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">The Algorithm Decides What Reaches You</text>

  <!-- many posts on the left -->
  <rect x="40" y="92" width="34" height="22" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <rect x="40" y="128" width="34" height="22" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="40" y="164" width="34" height="22" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <rect x="40" y="200" width="34" height="22" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <rect x="40" y="236" width="34" height="22" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="40" y="272" width="34" height="22" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="57" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">many posts</text>

  <!-- arrows into filter -->
  <defs>
    <marker id="af1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 Z" fill="#2b3a42"/>
    </marker>
  </defs>
  <path d="M86 130 L150 170" stroke="#2b3a42" stroke-width="2" fill="none" marker-end="url(#af1)"/>
  <path d="M86 180 L150 190" stroke="#2b3a42" stroke-width="2" fill="none" marker-end="url(#af1)"/>
  <path d="M86 250 L150 210" stroke="#2b3a42" stroke-width="2" fill="none" marker-end="url(#af1)"/>

  <!-- filter box -->
  <rect x="150" y="150" width="92" height="80" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="196" y="182" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">algorithm</text>
  <text x="196" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">sort · rank</text>
  <text x="196" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">filter</text>

  <!-- arrows out to screen -->
  <path d="M242 180 L312 150" stroke="#2b3a42" stroke-width="2" fill="none" marker-end="url(#af1)"/>
  <path d="M242 200 L312 200" stroke="#2b3a42" stroke-width="2" fill="none" marker-end="url(#af1)"/>

  <!-- screen -->
  <rect x="312" y="104" width="120" height="190" rx="10" fill="#2b3a42"/>
  <rect x="320" y="112" width="104" height="174" rx="6" fill="#fdfbf7"/>
  <rect x="330" y="122" width="84" height="34" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <rect x="330" y="164" width="84" height="34" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <rect x="330" y="206" width="84" height="24" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="372" y="256" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">what you see</text>

  <!-- signals -->
  <text x="196" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">signals: clicks · watch time · shares</text>
  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">It ranks to hold attention — not to give you the whole picture</text>
</svg>
