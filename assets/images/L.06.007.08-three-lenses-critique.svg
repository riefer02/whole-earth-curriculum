<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 560" role="img" aria-labelledby="title desc">
  <title id="title">Evaluate through three lenses</title>
  <desc id="desc">A poster titled "Evaluate through three lenses." In the center is a simple drawing of a building entrance with a staircase and a heavy door. Three labeled lenses point to it: "Does it work?" (function — it shelters and lets people in), "Who is left out?" (access and equity — a figure in a wheelchair faces the steps and a person with a cane faces the heavy door), and "Effect on the environment?" (materials, energy, waste — concrete and glass, lights left on). A footer reads "a good critique names what works, who is left out, and the cost to the Earth." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="560" fill="#fdfbf7"/>
  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Evaluate Through Three Lenses</text>

  <!-- center building entrance -->
  <g>
    <!-- wall -->
    <rect x="196" y="150" width="120" height="180" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <!-- roof -->
    <path d="M186 150 L256 106 L326 150 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2.5"/>
    <!-- door -->
    <rect x="224" y="250" width="44" height="80" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
    <circle cx="258" cy="292" r="3" fill="#2b3a42"/>
    <!-- steps -->
    <rect x="204" y="330" width="104" height="16" fill="#c7c1b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="212" y="346" width="88" height="16" fill="#c7c1b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="220" y="362" width="72" height="16" fill="#c7c1b6" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- lens 1: does it work (top left) -->
  <g>
    <rect x="24" y="120" width="150" height="120" fill="#ffffff" stroke="#2b3a42" stroke-width="2" rx="6"/>
    <text x="99" y="144" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Does it work?</text>
    <text x="40" y="168" font-family="sans-serif" font-size="12" fill="#2b3a42">function —</text>
    <text x="40" y="186" font-family="sans-serif" font-size="12" fill="#2b3a42">it shelters people</text>
    <text x="40" y="204" font-family="sans-serif" font-size="12" fill="#2b3a42">and lets many in</text>
    <line x1="190" y1="180" x2="196" y2="180" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr8)"/>
  </g>

  <!-- lens 2: who is left out (top right) -->
  <g>
    <rect x="338" y="120" width="150" height="120" fill="#ffffff" stroke="#2b3a42" stroke-width="2" rx="6"/>
    <text x="413" y="144" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Who is left out?</text>
    <text x="354" y="168" font-family="sans-serif" font-size="12" fill="#2b3a42">access and equity —</text>
    <text x="354" y="186" font-family="sans-serif" font-size="12" fill="#2b3a42">steps block a wheelchair,</text>
    <text x="354" y="204" font-family="sans-serif" font-size="12" fill="#2b3a42">a heavy door blocks weak grips</text>
    <line x1="338" y1="180" x2="316" y2="180" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr8)"/>
  </g>

  <!-- lens 3: environment (bottom right) -->
  <g>
    <rect x="338" y="360" width="150" height="120" fill="#ffffff" stroke="#2b3a42" stroke-width="2" rx="6"/>
    <text x="413" y="384" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Effect on the environment?</text>
    <text x="354" y="408" font-family="sans-serif" font-size="12" fill="#2b3a42">materials, energy, waste —</text>
    <text x="354" y="426" font-family="sans-serif" font-size="12" fill="#2b3a42">concrete and glass cost</text>
    <text x="354" y="444" font-family="sans-serif" font-size="12" fill="#2b3a42">energy; lights stay on</text>
    <line x1="338" y1="420" x2="326" y2="380" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr8)"/>
  </g>

  <!-- wheelchair figure facing steps -->
  <g stroke="#2b3a42" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="120" cy="360" r="10" fill="#e6bb92"/>
    <line x1="120" y1="370" x2="120" y2="392"/>
    <circle cx="98" cy="392" r="10"/>
    <circle cx="142" cy="392" r="10"/>
    <line x1="98" y1="392" x2="142" y2="392"/>
    <line x1="120" y1="380" x2="104" y2="388"/>
    <line x1="120" y1="380" x2="136" y2="388"/>
  </g>
  <!-- person with cane facing door -->
  <g stroke="#2b3a42" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="170" cy="300" r="8" fill="#ab7a4e"/>
    <line x1="170" y1="308" x2="170" y2="330"/>
    <line x1="170" y1="314" x2="158" y2="322"/>
    <line x1="170" y1="330" x2="160" y2="348"/>
    <line x1="170" y1="330" x2="180" y2="348"/>
    <line x1="182" y1="318" x2="182" y2="348" stroke-width="2"/>
  </g>

  <defs>
    <marker id="arr8" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2b3a42"/>
    </marker>
  </defs>

  <text x="256" y="510" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">a good critique names what works, who is left out, and the cost to the Earth</text>
  <text x="256" y="538" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">and it always ends in a better idea</text>
</svg>
