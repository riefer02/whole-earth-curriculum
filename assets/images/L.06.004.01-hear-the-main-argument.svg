<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Hear the main argument — the argument tree</title>
  <desc id="desc">A tree diagram of one spoken argument. The trunk is labeled "main claim — we should build a shaded rest stop by the field." Three branches are labeled "supporting detail" (people work there all day; there is no shade; a rest stop helps everyone), and scattered leaves are labeled "example" (the old woman who carries water, the children who play at noon, the market seller who naps on his cart). Labels and shapes, not color alone, carry the meaning so the graphic prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">The Argument Tree</text>

  <!-- Trunk -->
  <rect x="176" y="70" width="160" height="64" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="95" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">MAIN CLAIM</text>
  <text x="256" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">"We should build a shaded</text>
  <text x="256" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">rest stop by the field."</text>

  <!-- Branches -->
  <path d="M256 134 L140 200" stroke="#2b3a42" stroke-width="4" fill="none"/>
  <path d="M256 134 L256 200" stroke="#2b3a42" stroke-width="4" fill="none"/>
  <path d="M256 134 L372 200" stroke="#2b3a42" stroke-width="4" fill="none"/>

  <rect x="40" y="200" width="200" height="78" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="140" y="222" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">supporting detail</text>
  <text x="140" y="246" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">people work there all day,</text>
  <text x="140" y="264" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">and there is no shade</text>

  <rect x="156" y="200" width="200" height="78" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="222" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">supporting detail</text>
  <text x="256" y="246" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">a rest stop would</text>
  <text x="256" y="264" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">help everyone</text>

  <rect x="272" y="200" width="200" height="78" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="372" y="222" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">supporting detail</text>
  <text x="372" y="246" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">the walk is long and</text>
  <text x="372" y="264" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">there is nowhere to rest</text>

  <!-- Leaves -->
  <text x="40" y="320" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">leaves — examples (specific cases):</text>
  <rect x="40" y="336" width="432" height="34" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="358" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">the old woman who carries water · the children who play at noon</text>
  <rect x="40" y="378" width="432" height="34" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">the market seller who naps on his cart</text>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#2b3a42">Trunk = the claim. Branches = details. Leaves = examples.</text>
  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">A claim holds the argument; details and examples hold up the claim.</text>
</svg>
