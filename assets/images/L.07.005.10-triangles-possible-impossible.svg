<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Triangles: possible and impossible</title>
  <desc id="desc">A diagram of the triangle inequality. Three panels show: (a) lengths 3, 4, 5 forming a closed triangle labeled "possible: 3 + 4 > 5"; (b) lengths 2, 3, 5 lying flat in a line labeled "impossible: 2 + 3 = 5, no triangle"; and (c) lengths 1, 2, 4 not reaching, labeled "impossible: 1 + 2 < 4." A caption reads "the two shorter sides must add to more than the longest side." Labels, counts, and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="30" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">The Triangle Inequality</text>

  <!-- Panel A: possible 3-4-5 -->
  <rect x="16" y="46" width="150" height="150" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="91" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">possible</text>
  <!-- 3-4-5 triangle -->
  <polygon points="40,178 145,178 145,86" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
  <text x="88" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">4</text>
  <text x="156" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">3</text>
  <text x="92" y="112" font-family="sans-serif" font-size="12" fill="#222222">5</text>
  <text x="91" y="218" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">3 + 4 &gt; 5 ✓</text>

  <!-- Panel B: impossible 2-3-5 flat -->
  <rect x="181" y="46" width="150" height="150" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">impossible</text>
  <!-- flat line segments 2+3=5 -->
  <line x1="205" y1="150" x2="316" y2="150" stroke="#e0a458" stroke-width="4" stroke-linecap="round"/>
  <circle cx="205" cy="150" r="4" fill="#222222"/>
  <circle cx="244" cy="150" r="4" fill="#222222"/>
  <circle cx="316" cy="150" r="4" fill="#222222"/>
  <text x="224" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">2</text>
  <text x="280" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">3</text>
  <text x="256" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">2 + 3 = 5, lies flat</text>
  <text x="256" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">no triangle</text>

  <!-- Panel C: impossible 1-2-4 -->
  <rect x="346" y="46" width="150" height="150" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="421" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">impossible</text>
  <!-- two short sides not reaching -->
  <line x1="370" y1="160" x2="410" y2="160" stroke="#6b93b6" stroke-width="4" stroke-linecap="round"/>
  <line x1="410" y1="160" x2="452" y2="160" stroke="#6b93b6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="370" cy="160" r="4" fill="#222222"/>
  <circle cx="410" cy="160" r="4" fill="#222222"/>
  <circle cx="452" cy="160" r="4" fill="#222222"/>
  <text x="388" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">1</text>
  <text x="432" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">2</text>
  <text x="421" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">1 + 2 &lt; 4</text>
  <text x="421" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">cannot reach</text>

  <!-- rule -->
  <rect x="40" y="240" width="432" height="80" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="256" y="268" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">the two shorter sides must add to MORE than the longest</text>
  <text x="256" y="294" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">equal → lies flat · less → cannot reach · only "more" closes a triangle</text>

  <text x="256" y="356" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">predict with the sum test, then build to confirm</text>
  <text x="256" y="384" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">4, 5, 6 → 4 + 5 = 9 &gt; 6 ✓ · 3, 3, 6 → 3 + 3 = 6 ✗ · 2, 2, 5 → 4 &lt; 5 ✗</text>

  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">triangles are rigid — that is why bridges and roofs are braced with them</text>
  <text x="256" y="458" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">the 3-4-5 rope triangle for right angles: Egypt, India, China — shared geometry</text>
  <text x="256" y="484" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">shape has conditions — knowing them tells you what can be built</text>
</svg>
