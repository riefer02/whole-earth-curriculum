<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Building a paragraph</title>
  <desc id="desc">A paragraph is drawn like a sandwich: the top bun is the topic sentence, three fillings are the supporting details, and the bottom bun is the closing sentence. Each part is labeled, and the whole sandwich is held together by two toothpicks. The labels and shapes carry the meaning, so the picture prints clearly in grayscale and teaches learners the three parts of a complete paragraph — topic sentence, supporting details, and closing sentence.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Building a Paragraph</text>

  <!-- top bun = topic sentence -->
  <path d="M120 130 Q256 96 392 130 Q392 152 384 158 L128 158 Q120 152 120 130 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="146" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">topic sentence</text>

  <!-- filling 1 -->
  <rect x="120" y="168" width="272" height="40" rx="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="193" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">supporting detail 1</text>

  <!-- filling 2 -->
  <rect x="120" y="216" width="272" height="40" rx="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="241" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">supporting detail 2</text>

  <!-- filling 3 -->
  <rect x="120" y="264" width="272" height="40" rx="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="289" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">supporting detail 3</text>

  <!-- bottom bun = closing sentence -->
  <path d="M120 322 Q256 356 392 322 Q392 312 384 308 L128 308 Q120 312 120 322 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="332" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">closing sentence</text>

  <!-- toothpicks -->
  <line x1="92" y1="140" x2="92" y2="318" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="92" cy="140" r="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="420" y1="140" x2="420" y2="318" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="420" cy="140" r="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>

  <text x="256" y="404" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">A complete paragraph has three parts, like a sandwich.</text>
  <text x="256" y="428" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">Topic sentence — supporting details — closing sentence.</text>
</svg>
