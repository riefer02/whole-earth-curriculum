<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Hopping and jumping</title>
  <desc id="desc">Two panels show springing movements. Hop is a spring on one foot, shown by a standing child on one foot and a seated child bouncing in a chair. Jump is a spring on two feet, shown by a standing child with both feet off the ground and a child in a wheelchair pushing up and gliding. Bent knees show a soft landing. Word labels and shapes carry the meaning, not color alone.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Hopping and Jumping</text>

  <!-- Hop panel -->
  <g>
    <rect x="20" y="64" width="232" height="270" rx="14" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
    <text x="136" y="94" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">hop</text>
    <!-- standing child on one foot -->
    <circle cx="86" cy="132" r="24" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <rect x="66" y="156" width="40" height="58" rx="14" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="70" y1="166" x2="54" y2="130" stroke="#c99567" stroke-width="12" stroke-linecap="round"/>
    <line x1="102" y1="166" x2="118" y2="130" stroke="#c99567" stroke-width="12" stroke-linecap="round"/>
    <!-- one foot down, one lifted -->
    <line x1="80" y1="212" x2="76" y2="268" stroke="#4f6d7a" stroke-width="12" stroke-linecap="round"/>
    <line x1="96" y1="212" x2="104" y2="240" stroke="#4f6d7a" stroke-width="12" stroke-linecap="round"/>
    <!-- hop spring arc -->
    <path d="M104 116 q16 -12 30 -4" fill="none" stroke="#4f6d7a" stroke-width="2"/>
    <!-- seated child bouncing -->
    <circle cx="192" cy="168" r="20" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <rect x="174" y="188" width="36" height="40" rx="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="176" y1="196" x2="158" y2="176" stroke="#8f5f3d" stroke-width="10" stroke-linecap="round"/>
    <line x1="208" y1="196" x2="226" y2="176" stroke="#8f5f3d" stroke-width="10" stroke-linecap="round"/>
    <rect x="168" y="232" width="48" height="10" rx="5" fill="#4f6d7a"/>
    <line x1="180" y1="242" x2="180" y2="262" stroke="#4f6d7a" stroke-width="8"/>
    <line x1="204" y1="242" x2="204" y2="262" stroke="#4f6d7a" stroke-width="8"/>
    <path d="M210 152 q14 -10 26 -2" fill="none" stroke="#4f6d7a" stroke-width="2"/>
    <text x="136" y="304" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">spring on one foot</text>
    <text x="136" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">or a seated bounce</text>
  </g>

  <!-- Jump panel -->
  <g>
    <rect x="260" y="64" width="232" height="270" rx="14" fill="#ffffff" stroke="#7a9e7e" stroke-width="3"/>
    <text x="376" y="94" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">jump</text>
    <!-- standing child, two feet off ground -->
    <circle cx="326" cy="122" r="24" fill="#e3b587" stroke="#2b3a42" stroke-width="2"/>
    <rect x="306" y="146" width="40" height="58" rx="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="310" y1="156" x2="292" y2="122" stroke="#e3b587" stroke-width="12" stroke-linecap="round"/>
    <line x1="342" y1="156" x2="360" y2="122" stroke="#e3b587" stroke-width="12" stroke-linecap="round"/>
    <!-- both feet tucked up -->
    <line x1="318" y1="202" x2="310" y2="240" stroke="#4f6d7a" stroke-width="12" stroke-linecap="round"/>
    <line x1="338" y1="202" x2="346" y2="240" stroke="#4f6d7a" stroke-width="12" stroke-linecap="round"/>
    <!-- upward arc -->
    <path d="M304 108 q-8 -16 -18 -14" fill="none" stroke="#4f6d7a" stroke-width="2"/>
    <!-- soft landing: bent knees -->
    <path d="M290 284 q8 10 16 0 M330 284 q8 10 16 0" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="322" y="304" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">soft landing, bent knees</text>
    <!-- wheelchair push and glide -->
    <circle cx="434" cy="168" r="20" fill="#a9714b" stroke="#2b3a42" stroke-width="2"/>
    <rect x="416" y="188" width="36" height="40" rx="12" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="418" y1="196" x2="400" y2="176" stroke="#a9714b" stroke-width="10" stroke-linecap="round"/>
    <line x1="450" y1="196" x2="468" y2="176" stroke="#a9714b" stroke-width="10" stroke-linecap="round"/>
    <rect x="408" y="232" width="52" height="10" rx="5" fill="#4f6d7a"/>
    <line x1="422" y1="242" x2="422" y2="262" stroke="#4f6d7a" stroke-width="8"/>
    <circle cx="414" cy="262" r="9" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <circle cx="454" cy="262" r="7" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M456 150 q14 -10 26 -2" fill="none" stroke="#4f6d7a" stroke-width="2"/>
    <text x="376" y="304" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">spring on two feet</text>
    <text x="376" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">or a push-and-glide</text>
  </g>

  <text x="256" y="382" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Land softly with bent knees — control matters more than height.</text>
  <text x="256" y="406" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Every body springs and lands its own way.</text>
</svg>
