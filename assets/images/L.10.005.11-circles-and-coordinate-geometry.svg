<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Circles and Coordinate Geometry</title>
  <desc id="desc">A circle with a central angle and an inscribed angle intercepting the same arc, showing the inscribed angle is half the central angle, a tangent line touching the circle at a right angle to the radius, and beside it a circle on coordinate axes with its equation.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42" font-weight="bold">Circle Theorems</text>

  <!-- Circle -->
  <circle cx="150" cy="250" r="110" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <circle cx="150" cy="250" r="3" fill="#2b3a42"/>

  <!-- Central angle (wider): points on circle -->
  <line x1="150" y1="250" x2="90" y2="180" stroke="#4f6d7a" stroke-width="2"/>
  <line x1="150" y1="250" x2="222" y2="200" stroke="#4f6d7a" stroke-width="2"/>
  <text x="128" y="238" font-family="sans-serif" font-size="13" fill="#3a5a72" font-weight="bold">central angle</text>

  <!-- Inscribed angle: vertex on circle at top-right -->
  <line x1="90" y1="180" x2="248" y2="300" stroke="#e0a458" stroke-width="2"/>
  <line x1="222" y1="200" x2="248" y2="300" stroke="#e0a458" stroke-width="2"/>
  <circle cx="248" cy="300" r="4" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="240" y="322" font-family="sans-serif" font-size="13" fill="#a06030" font-weight="bold">inscribed angle = half</text>

  <!-- Tangent -->
  <line x1="40" y1="330" x2="260" y2="330" stroke="#6b93b6" stroke-width="2.5"/>
  <circle cx="248" cy="300" r="0"/>
  <text x="120" y="352" font-family="sans-serif" font-size="13" fill="#3a5a72">tangent &#8869; radius (touches at one point)</text>

  <!-- Coordinate panel -->
  <text x="402" y="58" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a" font-weight="bold">A circle as numbers</text>
  <line x1="330" y1="240" x2="470" y2="240" stroke="#2b3a42" stroke-width="2"/>
  <line x1="400" y1="110" x2="400" y2="330" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="430" cy="200" r="34" fill="none" stroke="#e0a458" stroke-width="2.5"/>
  <circle cx="430" cy="200" r="3" fill="#e0a458"/>
  <line x1="400" y1="200" x2="430" y2="200" stroke="#4f6d7a" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="430" y1="240" x2="430" y2="200" stroke="#4f6d7a" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="414" y="252" font-family="sans-serif" font-size="12" fill="#4f6d7a">(h,k)</text>
  <text x="360" y="300" font-family="sans-serif" font-size="14" fill="#222222">(x&#8722;h)&#178; + (y&#8722;k)&#178; = r&#178;</text>
  <text x="360" y="320" font-family="sans-serif" font-size="12" fill="#4f6d7a">= the distance formula squared</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">&#960; was approximated in Egypt, by Archimedes, and by Zu Chongzhi (355/113). Coordinates set places from Ptolemy to al-Idrisi.</text>
</svg>
