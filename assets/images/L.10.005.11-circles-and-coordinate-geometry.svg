<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Circles and Coordinate Geometry</title>
  <desc id="desc">Three labelled panels. The top-left panel shows a circle with points A and B on it and point C on the far arc: the central angle AOB at the centre O is twice the inscribed angle ACB at the edge. The bottom-left panel shows a tangent line touching a circle at one point, with the radius drawn to that point and a right-angle marker, labelled "right angle". The right-hand panel puts the same circle on coordinate axes, with centre (h,k), a radius labelled r, and the equation (x-h) squared plus (y-k) squared equals r squared, described as the distance formula squared. Angles are named by letters and words, not by colour alone, so the diagram prints clearly in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">Circle Theorems</text>

  <!-- ============ Panel 1: central angle vs inscribed angle ============ -->
  <rect x="16" y="52" width="232" height="234" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.3"/>
  <text x="132" y="74" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#4f6d7a">Centre and edge</text>

  <circle cx="132" cy="152" r="70" fill="none" stroke="#2b3a42" stroke-width="2.5"/>

  <!-- central angle AOB -->
  <line x1="132" y1="152" x2="70" y2="119" stroke="#4f6d7a" stroke-width="2.5"/>
  <line x1="132" y1="152" x2="194" y2="119" stroke="#4f6d7a" stroke-width="2.5"/>

  <!-- inscribed angle ACB -->
  <line x1="70" y1="119" x2="132" y2="222" stroke="#e0a458" stroke-width="2.5"/>
  <line x1="194" y1="119" x2="132" y2="222" stroke="#e0a458" stroke-width="2.5"/>

  <circle cx="132" cy="152" r="3.5" fill="#2b3a42"/>
  <circle cx="70" cy="119" r="3.5" fill="#2b3a42"/>
  <circle cx="194" cy="119" r="3.5" fill="#2b3a42"/>
  <circle cx="132" cy="222" r="3.5" fill="#2b3a42"/>

  <text x="140" y="166" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">O</text>
  <text x="62" y="112" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">A</text>
  <text x="202" y="112" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">B</text>
  <text x="132" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">C</text>

  <text x="132" y="258" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">&#8736;AOB is the central angle</text>
  <text x="132" y="275" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#222222">&#8736;ACB is half of it</text>

  <!-- ============ Panel 2: tangent meets radius ============ -->
  <rect x="16" y="296" width="232" height="150" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.3"/>
  <text x="132" y="318" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#4f6d7a">Tangent and radius</text>

  <circle cx="94" cy="400" r="42" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="30" y1="358" x2="158" y2="358" stroke="#6b93b6" stroke-width="3"/>
  <line x1="94" y1="400" x2="94" y2="358" stroke="#4f6d7a" stroke-width="2.5"/>
  <circle cx="94" cy="400" r="3.5" fill="#2b3a42"/>
  <circle cx="94" cy="358" r="3.5" fill="#2b3a42"/>
  <!-- right-angle marker at the point of contact -->
  <path d="M94 358 L108 358 L108 372 L94 372 Z" fill="none" stroke="#e0a458" stroke-width="2.2"/>
  <text x="112" y="350" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#a06030">right angle</text>

  <text x="150" y="388" font-family="sans-serif" font-size="11" fill="#222222">a tangent line</text>
  <text x="150" y="406" font-family="sans-serif" font-size="11" fill="#222222">touches once</text>

  <!-- ============ Panel 3: the same circle as numbers ============ -->
  <rect x="264" y="52" width="232" height="394" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.3"/>
  <text x="380" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4f6d7a">A circle as numbers</text>

  <!-- axes -->
  <line x1="282" y1="272" x2="484" y2="272" stroke="#2b3a42" stroke-width="2"/>
  <line x1="380" y1="100" x2="380" y2="272" stroke="#2b3a42" stroke-width="2"/>
  <path d="M484 272 l-9 -4 l0 8 z" fill="#2b3a42"/>
  <path d="M380 100 l-4 9 l8 0 z" fill="#2b3a42"/>

  <!-- circle with centre (h,k) -->
  <circle cx="424" cy="204" r="58" fill="none" stroke="#e0a458" stroke-width="3"/>
  <line x1="380" y1="204" x2="424" y2="204" stroke="#4f6d7a" stroke-width="1.8" stroke-dasharray="5 4"/>
  <line x1="424" y1="204" x2="424" y2="272" stroke="#4f6d7a" stroke-width="1.8" stroke-dasharray="5 4"/>
  <line x1="424" y1="204" x2="424" y2="146" stroke="#4f6d7a" stroke-width="2.5"/>
  <circle cx="424" cy="204" r="4" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <circle cx="424" cy="146" r="3" fill="#2b3a42"/>

  <text x="432" y="200" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">(h, k)</text>
  <text x="430" y="176" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">r</text>

  <text x="380" y="348" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">(x&#8722;h)&#178; + (y&#8722;k)&#178; = r&#178;</text>
  <text x="380" y="370" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">the distance formula, squared</text>
  <text x="380" y="398" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#222222">centre (h, k) &#183; radius r</text>

  <!-- ============ Sources ============ -->
  <text x="256" y="476" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">&#960; was approximated in Egypt, by Archimedes, and by Zu Chongzhi (355/113).</text>
  <text x="256" y="496" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">Coordinates set places from Ptolemy to al-Idrisi.</text>
</svg>
