<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Vectors: Size and Direction</title>
  <desc id="desc">A coordinate grid with two vectors added tip-to-tail: an arrow labeled boat 4 east, then an arrow labeled current 3 north starting at its tip, and a dashed resultant arrow labeled 5 at 37 degrees. A small right triangle shows sides 4 and 3 with hypotenuse 5, and the magnitude formula.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Vectors: Size and Direction</text>

  <!-- grid -->
  <g stroke="#dcd7cb" stroke-width="1">
    <line x1="60" y1="400" x2="460" y2="400"/>
    <line x1="60" y1="360" x2="460" y2="360"/>
    <line x1="60" y1="320" x2="460" y2="320"/>
    <line x1="60" y1="280" x2="460" y2="280"/>
    <line x1="60" y1="240" x2="460" y2="240"/>
    <line x1="60" y1="200" x2="460" y2="200"/>
    <line x1="60" y1="160" x2="460" y2="160"/>
    <line x1="60" y1="120" x2="460" y2="120"/>
    <line x1="100" y1="120" x2="100" y2="400"/>
    <line x1="140" y1="120" x2="140" y2="400"/>
    <line x1="180" y1="120" x2="180" y2="400"/>
    <line x1="220" y1="120" x2="220" y2="400"/>
    <line x1="260" y1="120" x2="260" y2="400"/>
    <line x1="300" y1="120" x2="300" y2="400"/>
    <line x1="340" y1="120" x2="340" y2="400"/>
    <line x1="380" y1="120" x2="380" y2="400"/>
    <line x1="420" y1="120" x2="420" y2="400"/>
  </g>

  <!-- boat vector (4 east) -->
  <line x1="100" y1="320" x2="300" y2="320" stroke="#2b3a42" stroke-width="4"/>
  <polygon points="300,320 284,312 284,328" fill="#2b3a42"/>
  <text x="190" y="310" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">boat 4 east</text>

  <!-- current vector (3 north) -->
  <line x1="300" y1="320" x2="300" y2="200" stroke="#7a9e7e" stroke-width="4"/>
  <polygon points="300,200 292,216 308,216" fill="#7a9e7e"/>
  <text x="330" y="266" font-family="sans-serif" font-size="14" fill="#222222">current 3 north</text>

  <!-- resultant -->
  <line x1="100" y1="320" x2="300" y2="200" stroke="#e0a458" stroke-width="4" stroke-dasharray="8 6"/>
  <polygon points="300,200 288,204 292,190" fill="#e0a458"/>
  <text x="180" y="246" font-family="sans-serif" font-size="14" fill="#222222" transform="rotate(-31 180 246)">resultant 5</text>

  <!-- right triangle note -->
  <rect x="60" y="120" width="180" height="100" fill="#ffffff" stroke="#e0a458" stroke-width="2" rx="6"/>
  <text x="150" y="146" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">3&#178; + 4&#178; = 5&#178;</text>
  <text x="150" y="168" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">magnitude = &#8730;(x&#178; + y&#178;)</text>
  <text x="150" y="190" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">direction: tan = y / x</text>
  <text x="150" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">= 3/4 &#8594; about 37&#176;</text>

  <!-- footer -->
  <text x="300" y="400" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">Tip-to-tail: the boat lands northeast.</text>
  <text x="300" y="424" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Size + direction = the full story.</text>
</svg>
