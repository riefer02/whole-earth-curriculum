<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Engaging with another culture's movement or drama</title>
  <desc id="desc">Two panels side by side. "Honors living practitioners" shows a learner practicing beside a teacher with symbols for invitation and credit. "Takes from them" shows a performer copying a form alone with a symbol for profit and no permission.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <!-- left panel -->
  <rect x="24" y="40" width="220" height="432" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="134" y="72" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#222222" font-weight="bold">Honors living</text>
  <text x="134" y="94" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#222222" font-weight="bold">practitioners</text>
  <!-- learner and teacher -->
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <circle cx="96" cy="170" r="16" fill="#c68863"/>
    <path d="M96 186 L96 250"/>
    <path d="M96 200 C82 210 78 220 76 230"/>
    <path d="M96 250 L84 286"/>
    <path d="M96 250 L108 286"/>
    <circle cx="170" cy="170" r="16" fill="#8a5a44"/>
    <path d="M170 186 L170 250"/>
    <path d="M170 200 C186 210 190 220 192 230"/>
    <path d="M170 250 L158 286"/>
    <path d="M170 250 L182 286"/>
  </g>
  <!-- invitation and credit symbols -->
  <g fill="none" stroke="#2b3a42" stroke-width="2">
    <circle cx="66" cy="330" r="22" fill="#7a9e7e" fill-opacity="0.3"/>
    <text x="66" y="338" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222222">I</text>
    <circle cx="134" cy="330" r="22" fill="#6b93b6" fill-opacity="0.3"/>
    <text x="134" y="338" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222222">C</text>
    <circle cx="202" cy="330" r="22" fill="#e0a458" fill-opacity="0.3"/>
    <text x="202" y="338" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222222">S</text>
  </g>
  <text x="66" y="370" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">invited</text>
  <text x="134" y="370" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">credited</text>
  <text x="202" y="370" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">shared</text>
  <text x="134" y="404" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">learned the meaning,</text>
  <text x="134" y="424" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">honored the context</text>
  <!-- right panel -->
  <rect x="268" y="40" width="220" height="432" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="378" y="72" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#222222" font-weight="bold">Takes from them</text>
  <!-- lone performer -->
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <circle cx="378" cy="170" r="16" fill="#c68863"/>
    <path d="M378 186 L378 250"/>
    <path d="M378 200 C364 210 360 220 358 230"/>
    <path d="M378 250 L366 286"/>
    <path d="M378 250 L390 286"/>
  </g>
  <!-- no permission, profit symbols -->
  <g fill="none" stroke="#2b3a42" stroke-width="2">
    <circle cx="330" cy="330" r="22" fill="#e0a458" fill-opacity="0.25"/>
    <path d="M314 314 L346 346" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="426" cy="330" r="22" fill="#e0a458" fill-opacity="0.25"/>
    <text x="426" y="338" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222222">$</text>
  </g>
  <text x="330" y="370" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">no invitation</text>
  <text x="426" y="370" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">profit</text>
  <text x="378" y="404" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">copied from a video,</text>
  <text x="378" y="424" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">context stripped</text>
</svg>
