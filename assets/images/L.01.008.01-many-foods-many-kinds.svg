<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Many foods, many kinds</title>
  <desc id="desc">Ten world foods arranged in two even rows, each drawn simply and labeled with its name: rice, beans, flatbread, maize, cassava, lentils, greens, mango, fish, and root vegetables. No food is numbered or ranked; every tile is the same size. Labels carry the meaning so the chart prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Many Foods, Many Kinds</text>

  <!-- Row 1 -->
  <!-- 1 rice -->
  <g>
    <rect x="16" y="76" width="88" height="150" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <path d="M40 148 A20 20 0 0 0 80 148 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="52" cy="140" rx="4" ry="3" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <ellipse cx="62" cy="136" rx="4" ry="3" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <ellipse cx="70" cy="141" rx="4" ry="3" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="60" y="196" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">rice</text>
  </g>

  <!-- 2 beans -->
  <g>
    <rect x="116" y="76" width="88" height="150" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <path d="M140 150 A20 20 0 0 0 180 150 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="148" cy="142" rx="6" ry="4" fill="#c99567" stroke="#2b3a42" stroke-width="1.5"/>
    <ellipse cx="160" cy="138" rx="6" ry="4" fill="#c99567" stroke="#2b3a42" stroke-width="1.5"/>
    <ellipse cx="172" cy="142" rx="6" ry="4" fill="#c99567" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="160" y="196" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">beans</text>
  </g>

  <!-- 3 flatbread -->
  <g>
    <rect x="216" y="76" width="88" height="150" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <ellipse cx="260" cy="142" rx="26" ry="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="250" cy="138" r="1.8" fill="#8f5f3d"/>
    <circle cx="264" cy="146" r="1.8" fill="#8f5f3d"/>
    <circle cx="258" cy="132" r="1.8" fill="#8f5f3d"/>
    <circle cx="270" cy="138" r="1.8" fill="#8f5f3d"/>
    <text x="260" y="196" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">flatbread</text>
  </g>

  <!-- 4 maize -->
  <g>
    <rect x="316" y="76" width="88" height="150" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <path d="M348 116 q-12 14 0 40 q12 -26 0 -40 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <rect x="346" y="128" width="28" height="44" rx="12" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="354" y1="130" x2="354" y2="170" stroke="#2b3a42" stroke-width="1.5"/>
    <line x1="366" y1="130" x2="366" y2="170" stroke="#2b3a42" stroke-width="1.5"/>
    <line x1="348" y1="142" x2="372" y2="142" stroke="#2b3a42" stroke-width="1.5"/>
    <line x1="348" y1="156" x2="372" y2="156" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="360" y="196" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">maize</text>
  </g>

  <!-- 5 cassava -->
  <g>
    <rect x="416" y="76" width="88" height="150" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <path d="M440 150 Q460 136 476 156 Q464 160 452 152 Q444 158 440 150 Z" fill="#c99567" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <line x1="456" y1="146" x2="462" y2="158" stroke="#8f5f3d" stroke-width="2" stroke-linecap="round"/>
    <line x1="450" y1="150" x2="456" y2="162" stroke="#8f5f3d" stroke-width="2" stroke-linecap="round"/>
    <text x="460" y="196" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">cassava</text>
  </g>

  <!-- Row 2 -->
  <!-- 6 lentils -->
  <g>
    <rect x="16" y="246" width="88" height="150" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <path d="M38 320 A22 22 0 0 0 82 320 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="48" cy="310" r="4" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="58" cy="306" r="4" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="68" cy="311" r="4" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="54" cy="298" r="4" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="66" cy="300" r="4" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="60" y="366" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">lentils</text>
  </g>

  <!-- 7 greens -->
  <g>
    <rect x="116" y="246" width="88" height="150" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <path d="M160 322 q-26 -20 0 -44 q26 24 0 44 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <line x1="160" y1="300" x2="160" y2="322" stroke="#2b3a42" stroke-width="2"/>
    <text x="160" y="366" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">greens</text>
  </g>

  <!-- 8 mango -->
  <g>
    <rect x="216" y="246" width="88" height="150" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <ellipse cx="260" cy="308" rx="22" ry="28" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M252 296 q-12 -8 -4 -14 q8 2 8 12 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="260" y="366" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">mango</text>
  </g>

  <!-- 9 fish -->
  <g>
    <rect x="316" y="246" width="88" height="150" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <path d="M344 308 q22 -16 44 0 q-22 16 -44 0 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M388 308 l14 -10 l-14 -8 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="352" cy="306" r="2.6" fill="#2b3a42"/>
    <text x="360" y="366" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">fish</text>
  </g>

  <!-- 10 root vegetable -->
  <g>
    <rect x="416" y="246" width="88" height="150" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <path d="M460 328 q-14 14 -22 2 q10 -8 4 -18 q12 -4 18 16 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M458 296 q-10 -6 -4 -14 q10 2 8 12 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="460" y="366" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">root vegetable</text>
  </g>

  <text x="256" y="436" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">Every family&#8217;s food is worthy of honor.</text>
  <text x="256" y="464" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">A food that is everyday for one family may be a treat for another — no food is better than another.</text>
  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">How many of these foods does your family enjoy?</text>
</svg>
