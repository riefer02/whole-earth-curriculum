<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A function machine: f(x) = 2x + 1</title>
  <desc id="desc">A function-machine diagram. An input x = 3 enters a box labeled f(x) = 2x + 1 and an output 7 comes out. Beside it is a table of input-output pairs: (0,1), (1,3), (2,5), (3,7). The note says "for each input, exactly one output." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="30" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">A Function: f(x) = 2x + 1</text>

  <!-- input -->
  <text x="60" y="150" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">input x</text>
  <circle cx="60" cy="180" r="22" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="60" y="186" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">3</text>

  <!-- arrow in -->
  <line x1="84" y1="180" x2="128" y2="180" stroke="#2b3a42" stroke-width="2"/>
  <path d="M124 175 L128 180 L124 185" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <!-- machine box -->
  <rect x="132" y="128" width="140" height="104" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="202" y="174" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#6b93b6">f(x) = 2x + 1</text>
  <text x="202" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">the rule</text>

  <!-- arrow out -->
  <line x1="276" y1="180" x2="320" y2="180" stroke="#2b3a42" stroke-width="2"/>
  <path d="M316 175 L320 180 L316 185" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <!-- output -->
  <text x="380" y="150" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">output f(x)</text>
  <circle cx="380" cy="180" r="22" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="380" y="186" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">7</text>

  <!-- table -->
  <rect x="132" y="270" width="240" height="150" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <line x1="132" y1="302" x2="372" y2="302" stroke="#2b3a42" stroke-width="2"/>
  <line x1="252" y1="270" x2="252" y2="420" stroke="#2b3a42" stroke-width="2"/>
  <text x="192" y="290" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">x</text>
  <text x="312" y="290" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">f(x)</text>
  <text x="192" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">0</text>
  <text x="312" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">1</text>
  <text x="192" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">1</text>
  <text x="312" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">3</text>
  <text x="192" y="390" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">2</text>
  <text x="312" y="390" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">5</text>
  <text x="192" y="414" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">3</text>
  <text x="312" y="414" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">7</text>

  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">for each input, exactly one output</text>
  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">x is the independent variable · f(x) is the dependent variable — it depends on x</text>
</svg>
