<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-04-001-02-body-signals desc-L-04-001-02-body-signals">
  <title id="title-L-04-001-02-body-signals">Body signals at three feeling strengths</title>
  <desc id="desc-L-04-001-02-body-signals">Three people stacked one above another, each at a different feeling strength, with a label joined to the body by a leader line. Top, "a little": a small flutter drawn on the stomach, labelled flutter in the tummy. Middle, "some": a person wearing a hearing aid, with a heart at the chest and motion lines, labelled heart beats faster and skin warms. Bottom, "a lot": jitter marks at the shoulders and hands, labelled hot, tight, shaky all over. Labels and shapes, not colour, carry the meaning.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">What Each Level Feels Like</text>
  <text x="256" y="59" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">the same feeling, at a little, some, and a lot</text>

  <!-- leader lines, drawn under the figures so each meets the body edge cleanly -->
  <g stroke="#4f6d7a" stroke-width="1.4">
    <line x1="140" y1="134" x2="184" y2="134"/>
    <line x1="140" y1="234" x2="184" y2="234"/>
    <line x1="140" y1="340" x2="184" y2="340"/>
  </g>

  <!-- row 1: a little -->
  <g>
    <g fill="#f5d6b6" stroke="none">
      <circle cx="120" cy="86" r="14"/>
      <rect x="115" y="99" width="10" height="8" rx="4"/>
      <rect x="100" y="104" width="40" height="42" rx="18"/>
      <path d="M104 116 l-8 30" stroke="#f5d6b6" stroke-width="11" stroke-linecap="round"/>
      <path d="M136 116 l8 30" stroke="#f5d6b6" stroke-width="11" stroke-linecap="round"/>
      <path d="M112 144 l-2 22" stroke="#f5d6b6" stroke-width="13" stroke-linecap="round"/>
      <path d="M128 144 l2 22" stroke="#f5d6b6" stroke-width="13" stroke-linecap="round"/>
    </g>
    <ellipse cx="109" cy="167" rx="8" ry="4" fill="#f5d6b6"/>
    <ellipse cx="131" cy="167" rx="8" ry="4" fill="#f5d6b6"/>
    <circle cx="120" cy="86" r="14" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="115" cy="83" r="2.4" fill="#2b3a42"/><circle cx="125" cy="83" r="2.4" fill="#2b3a42"/>
    <path d="M116 92 Q120 96 124 92" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>
    <!-- a small flutter in the stomach -->
    <path d="M112 134 q4 -6 8 0 q4 6 8 0" fill="none" stroke="#2b3a42" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- row 2: some, wearing a hearing aid -->
  <g>
    <g fill="#c99567" stroke="none">
      <circle cx="120" cy="202" r="14"/>
      <rect x="115" y="215" width="10" height="8" rx="4"/>
      <rect x="100" y="220" width="40" height="42" rx="18"/>
      <path d="M104 232 l-8 30" stroke="#c99567" stroke-width="11" stroke-linecap="round"/>
      <path d="M136 232 l8 30" stroke="#c99567" stroke-width="11" stroke-linecap="round"/>
      <path d="M112 260 l-2 22" stroke="#c99567" stroke-width="13" stroke-linecap="round"/>
      <path d="M128 260 l2 22" stroke="#c99567" stroke-width="13" stroke-linecap="round"/>
    </g>
    <ellipse cx="109" cy="283" rx="8" ry="4" fill="#c99567"/>
    <ellipse cx="131" cy="283" rx="8" ry="4" fill="#c99567"/>
    <circle cx="120" cy="202" r="14" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M133 199 A5 5 0 0 1 140 200" fill="none" stroke="#e0a458" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="140" cy="201" r="2.2" fill="#e0a458"/>
    <circle cx="115" cy="199" r="2.4" fill="#2b3a42"/><circle cx="125" cy="199" r="2.4" fill="#2b3a42"/>
    <path d="M116 208 Q120 212 124 208" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>
    <!-- heart at the chest, with motion lines -->
    <path d="M120 228 c-4 -5 -11 -1 -7 4 l7 7 7 -7 c4 -5 -3 -9 -7 -4 z"
          fill="#e0a458" stroke="#2b3a42" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M106 224 l-4 -4 M134 224 l4 -4" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- row 3: a lot -->
  <g>
    <g fill="#8f5f3d" stroke="none">
      <circle cx="120" cy="318" r="14"/>
      <rect x="115" y="331" width="10" height="8" rx="4"/>
      <rect x="100" y="336" width="40" height="42" rx="18"/>
      <path d="M104 348 l-10 28" stroke="#8f5f3d" stroke-width="11" stroke-linecap="round"/>
      <path d="M136 348 l10 28" stroke="#8f5f3d" stroke-width="11" stroke-linecap="round"/>
      <path d="M112 376 l-3 20" stroke="#8f5f3d" stroke-width="13" stroke-linecap="round"/>
      <path d="M128 376 l3 20" stroke="#8f5f3d" stroke-width="13" stroke-linecap="round"/>
    </g>
    <ellipse cx="108" cy="398" rx="8" ry="4" fill="#8f5f3d"/>
    <ellipse cx="132" cy="398" rx="8" ry="4" fill="#8f5f3d"/>
    <circle cx="120" cy="318" r="14" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="115" cy="315" r="2.4" fill="#2b3a42"/><circle cx="125" cy="315" r="2.4" fill="#2b3a42"/>
    <path d="M115 325 L125 325" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>
    <!-- jitter at the shoulders and hands -->
    <path d="M96 342 l7 -5 -7 -1 7 -5" fill="none" stroke="#2b3a42" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M136 342 l7 -5 -7 -1 7 -5" fill="none" stroke="#2b3a42" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M90 382 l7 -5 -7 -1 7 -5" fill="none" stroke="#2b3a42" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M142 382 l7 -5 -7 -1 7 -5" fill="none" stroke="#2b3a42" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- labels, one per leader line -->
  <g font-family="sans-serif">
    <text x="192" y="130" font-size="15" font-weight="bold" fill="#2b3a42">a little</text>
    <text x="192" y="148" font-size="12.5" fill="#222222">flutter in the tummy</text>

    <text x="192" y="230" font-size="15" font-weight="bold" fill="#2b3a42">some</text>
    <text x="192" y="248" font-size="12.5" fill="#222222">heart beats faster,</text>
    <text x="192" y="264" font-size="12.5" fill="#222222">skin warms</text>

    <text x="192" y="336" font-size="15" font-weight="bold" fill="#2b3a42">a lot</text>
    <text x="192" y="354" font-size="12.5" fill="#222222">hot and tight,</text>
    <text x="192" y="370" font-size="12.5" fill="#222222">shaky all over</text>
  </g>

  <!-- takeaway band -->
  <rect x="24" y="410" width="464" height="56" rx="12" fill="#fdfbf7" stroke="#2b3a42"
        stroke-width="2"/>
  <text x="256" y="432" text-anchor="middle" font-family="sans-serif" font-size="14"
        font-weight="bold" fill="#2b3a42">My body tells me how strong a feeling is.</text>
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="12"
        fill="#4f6d7a">A small flutter and a whole-body shake are both messages — not a test.</text>

  <text x="256" y="490" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#2b3a42">Naming the signal helps: "my tummy is fluttering, so I feel a little nervous."</text>
</svg>
