<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Asking a clarifying question</title>
  <desc id="desc">A scene with two figures. On the left a speaker with a raised finger says, "Meet me at the tall tree at noon." On the right a listener with a puzzled face and a hand by the ear says, "Which tall tree — the one by the well, or the one by the road?" The listener's bubble is labeled "clarifying question." A question mark floats between them. Labels and shapes, not color alone, carry the meaning so the graphic prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Asking a Clarifying Question</text>

  <!-- Speaker (left) -->
  <circle cx="112" cy="150" r="30" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="102" cy="144" r="3" fill="#2b3a42"/>
  <circle cx="122" cy="144" r="3" fill="#2b3a42"/>
  <path d="M98 160 Q112 166 126 160" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M112 180 L112 250 M112 200 L92 234 M112 200 L132 234 M112 250 L94 292 M112 250 L130 292" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- raised finger -->
  <path d="M126 158 L140 150" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="112" y="336" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">speaker</text>

  <!-- Speaker bubble -->
  <rect x="22" y="66" width="180" height="56" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M92 122 L84 140 L114 122" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <text x="112" y="100" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#222222">Meet me at the</text>
  <text x="112" y="118" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#222222">tall tree at noon.</text>

  <!-- Question mark between -->
  <text x="256" y="176" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="bold" fill="#4f6d7a">?</text>

  <!-- Listener (right) -->
  <circle cx="400" cy="150" r="30" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="390" cy="144" r="3" fill="#2b3a42"/>
  <circle cx="410" cy="144" r="3" fill="#2b3a42"/>
  <!-- puzzled mouth -->
  <path d="M390 162 Q400 156 410 162" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M400 180 L400 250 M400 200 L380 234 M400 200 L420 234 M400 250 L382 292 M400 250 L418 292" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- hand by ear -->
  <circle cx="388" cy="150" r="8" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <text x="400" y="336" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">listener</text>

  <!-- Listener bubble -->
  <rect x="252" y="212" width="248" height="76" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M336 288 L328 306 L362 288" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <text x="376" y="238" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">Which tall tree — the one</text>
  <text x="376" y="259" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">by the well, or the one</text>
  <text x="376" y="280" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">by the road?</text>

  <!-- Label -->
  <rect x="148" y="376" width="216" height="50" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="407" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">clarifying question</text>

  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2b3a42">Ask until the meaning is clear — it is a strength.</text>
</svg>
