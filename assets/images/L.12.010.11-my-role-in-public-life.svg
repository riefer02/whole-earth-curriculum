<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My Role in Public Life</title>
  <desc id="desc">A person at center surrounded by labeled pathways: "vote," "organize," "testify," "create," "witness," "care," "protest," "run," "teach," "report." A footer reads "many ways to take part; power must be held accountable." Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#2b3a42" font-weight="bold">My Role in Public Life</text>

  <!-- center figure -->
  <g stroke="#2b3a42" stroke-width="3" fill="none">
    <circle cx="256" cy="230" r="16"/>
    <line x1="256" y1="246" x2="256" y2="286"/>
    <line x1="256" y1="262" x2="234" y2="250"/>
    <line x1="256" y1="262" x2="278" y2="250"/>
    <line x1="256" y1="286" x2="238" y2="312"/>
    <line x1="256" y1="286" x2="274" y2="312"/>
  </g>

  <!-- spokes -->
  <line x1="256" y1="214" x2="256" y2="120" stroke="#4f6d7a" stroke-width="3"/>
  <line x1="272" y1="230" x2="400" y2="160" stroke="#4f6d7a" stroke-width="3"/>
  <line x1="272" y1="230" x2="420" y2="260" stroke="#4f6d7a" stroke-width="3"/>
  <line x1="256" y1="246" x2="256" y2="380" stroke="#4f6d7a" stroke-width="3"/>
  <line x1="240" y1="230" x2="100" y2="260" stroke="#4f6d7a" stroke-width="3"/>
  <line x1="240" y1="230" x2="110" y2="160" stroke="#4f6d7a" stroke-width="3"/>

  <!-- labels -->
  <text x="256" y="104" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">vote</text>
  <text x="404" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">organize</text>
  <text x="428" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">testify</text>
  <text x="256" y="398" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">create</text>
  <text x="88" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">witness</text>
  <text x="102" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">care</text>

  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">many ways to take part —</text>
  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">and power must be held accountable.</text>
</svg>
