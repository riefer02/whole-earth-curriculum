<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-09-012-03-growth-of-cities desc-L-09-012-03-growth-of-cities">
  <title id="title-L-09-012-03-growth-of-cities">The growth of cities across regions and centuries</title>
  <desc id="desc-L-09-012-03-growth-of-cities">Five city cards arranged across time: Mohenjo-daro of the Indus Valley, Cahokia of the Mississippi, Great Zimbabwe of the Shona, Angkor of the Khmer, and Timbuktu of Mali, with a note on what cities kept in common and what changed.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Cities Across Regions &amp; Centuries</text>

  <!-- timeline arrow -->
  <line x1="36" y1="120" x2="476" y2="120" stroke="#4f6d7a" stroke-width="2"/>
  <text x="256" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">a long thread of city-building — approximate dates, BC or CE</text>

  <!-- Mohenjo-daro -->
  <rect x="26" y="138" width="90" height="150" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="71" cy="162" r="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="71" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">Mohenjo-daro</text>
  <text x="71" y="204" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Indus Valley</text>
  <text x="71" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">2600–1900 BC</text>
  <text x="71" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">grid streets,</text>
  <text x="71" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">drainage</text>

  <!-- Cahokia -->
  <rect x="124" y="138" width="90" height="150" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="169" cy="162" r="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="169" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">Cahokia</text>
  <text x="169" y="204" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Mississippi</text>
  <text x="169" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">1050–1350</text>
  <text x="169" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">earth mounds,</text>
  <text x="169" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">corn fields</text>

  <!-- Great Zimbabwe -->
  <rect x="222" y="138" width="90" height="150" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="267" cy="162" r="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="267" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">Great</text>
  <text x="267" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">Zimbabwe</text>
  <text x="267" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Shona</text>
  <text x="267" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">11th–15th c.</text>
  <text x="267" y="248" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">stone walls,</text>
  <text x="267" y="262" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">gold trade</text>

  <!-- Angkor -->
  <rect x="320" y="138" width="90" height="150" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="365" cy="162" r="8" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="365" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">Angkor</text>
  <text x="365" y="204" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Khmer</text>
  <text x="365" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">9th–15th c.</text>
  <text x="365" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">water temples,</text>
  <text x="365" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">reservoirs</text>

  <!-- Timbuktu -->
  <rect x="418" y="138" width="90" height="150" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="463" cy="162" r="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="463" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">Timbuktu</text>
  <text x="463" y="204" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Mali</text>
  <text x="463" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">15th–16th c.</text>
  <text x="463" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">mosques,</text>
  <text x="463" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">manuscripts</text>

  <!-- common vs changed -->
  <rect x="30" y="306" width="452" height="172" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="332" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Cities keep a common thread — and change</text>
  <text x="46" y="360" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">STAYED: cities grew at rivers, ports, and trade routes;</text>
  <text x="46" y="378" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">people met to trade, pray, govern, and learn</text>
  <text x="46" y="406" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">CHANGED: each city found its own form — stone, earth,</text>
  <text x="46" y="424" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">or water — and each rose and fell in its own time</text>
</svg>
