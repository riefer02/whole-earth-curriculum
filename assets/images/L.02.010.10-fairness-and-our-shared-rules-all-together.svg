<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Fairness and our shared rules, all together</title>
  <desc id="desc">A five-part page gathers the whole unit on fairness and shared rules. The five boxes are labeled: "right choice and reason," drawn as a checkmark and a because-bubble; "same is not always fair," drawn as a ramp, a tall box, and a plain box; "a right every child has," drawn as an open book and a ball; "our fair decision and a helping hand," drawn as a vote chart with tokens and an open hand; and "a peaceful solve and a real apology," drawn as an ear, two smiling faces, and a repaired heart. Each box has a dashed draw-or-write area, and the labels, not color, carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#2b3a42">Fairness &amp; Our Shared Rules &#8212; All Together</text>

  <!-- box 1 -->
  <rect x="16" y="52" width="232" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="132" y="76" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">right choice and reason</text>
  <path d="M56 98 L72 112 L96 88" fill="none" stroke="#7a9e7e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="130" cy="104" rx="48" ry="18" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="130" y="109" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">because&#8230;</text>
  <rect x="36" y="132" width="192" height="50" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="132" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">draw or write here</text>

  <!-- box 2 -->
  <rect x="264" y="52" width="232" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="380" y="76" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">same is not always fair</text>
  <path d="M300 122 L336 90 L346 122 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="356" y="106" width="13" height="26" rx="2" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <rect x="388" y="106" width="13" height="14" rx="2" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <rect x="420" y="106" width="13" height="14" rx="2" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <rect x="284" y="132" width="192" height="50" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="380" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">draw or write here</text>

  <!-- box 3 -->
  <rect x="16" y="214" width="232" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="132" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">a right every child has</text>
  <path d="M66 264 L66 290 L112 290 L112 264 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <line x1="89" y1="264" x2="89" y2="290" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="146" cy="278" r="15" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M146 263 A15 15 0 0 1 161 278" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M146 263 A15 15 0 0 0 131 278" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <rect x="36" y="302" width="192" height="46" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="132" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">draw or write here</text>

  <!-- box 4 -->
  <rect x="264" y="214" width="232" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="380" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">our fair decision &amp; helping hand</text>
  <rect x="292" y="252" width="44" height="40" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="304" cy="268" r="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="318" cy="268" r="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="314" y="288" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">2</text>
  <path d="M382 292 Q366 264 348 272 L344 286 Q370 298 382 292 Z" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M352 272 L348 260 M352 272 L356 258 M352 272 L340 266 M352 272 L342 282 M352 272 L362 264" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="284" y="302" width="192" height="46" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="380" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">draw or write here</text>

  <!-- box 5 (bottom strip) -->
  <rect x="16" y="376" width="480" height="110" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">a peaceful solve &amp; a real apology</text>
  <!-- ear -->
  <path d="M200 402 Q186 408 188 424 Q189 436 200 442 L200 450 Q208 452 210 444 L212 428 Q214 408 202 402 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <!-- two smiling faces -->
  <circle cx="252" cy="432" r="13" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="247" cy="429" r="1.5" fill="#2b3a42"/>
  <circle cx="257" cy="429" r="1.5" fill="#2b3a42"/>
  <path d="M247 436 Q252 440 257 436" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <circle cx="286" cy="432" r="13" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="281" cy="429" r="1.5" fill="#2b3a42"/>
  <circle cx="291" cy="429" r="1.5" fill="#2b3a42"/>
  <path d="M281 436 Q286 440 291 436" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <!-- repaired heart -->
  <path d="M330 442 Q326 434 332 430 Q336 428 338 434 Q340 428 344 430 Q350 434 346 442 Q342 448 338 452 Q334 448 330 442 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <rect x="360" y="424" width="112" height="44" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="416" y="450" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">draw or write</text>
</svg>
