<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-08-009-06-trade-networks-map desc-L-08-009-06-trade-networks-map">
  <title id="title-L-08-009-06-trade-networks-map">The Silk Roads and Indian Ocean trade networks</title>
  <desc id="desc-L-08-009-06-trade-networks-map">A schematic map showing the overland Silk Roads across Central Asia and the Indian Ocean sea routes around its rim, with labels for goods — silk, spices, porcelain, gold, ivory — ideas — paper and numerals — and beliefs — Buddhism and Islam — moving along them.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Silk Roads (overland) &amp; Indian Ocean (sea)</text>

  <!-- land mass -->
  <path d="M40 190 L120 150 L230 165 L330 140 L472 150 L472 210 L40 210 Z" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>

  <!-- ocean -->
  <path d="M40 210 L472 210 L472 330 Q256 360 40 330 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>

  <!-- overland Silk Roads route (dark slate so it stays legible in grayscale; distinguished from the sea route by dash pattern + label, never color alone) -->
  <path d="M56 200 L150 172 L260 178 L360 160 L456 168" fill="none" stroke="#4f6d7a" stroke-width="4" stroke-dasharray="8 5"/>
  <text x="256" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Silk Roads (overland)</text>

  <!-- overland labels -->
  <g font-family="sans-serif">
    <text text-anchor="middle" font-size="12" x="72" y="166">East Asia</text>
    <text text-anchor="end" font-size="12" x="466" y="204">Mediterranean</text>
    <text text-anchor="middle" font-size="12" x="256" y="112">goods: silk, paper, glass</text>
    <text text-anchor="middle" font-size="12" x="256" y="130">ideas: paper &amp; numerals · belief: Buddhism</text>
  </g>

  <!-- ocean route -->
  <path d="M120 300 Q256 330 400 296" fill="none" stroke="#2b3a42" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="256" y="286" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">Indian Ocean (monsoon sea)</text>

  <!-- ports -->
  <g fill="#2b3a42">
    <circle cx="96" cy="272" r="5"/>
    <circle cx="196" cy="300" r="5"/>
    <circle cx="320" cy="300" r="5"/>
    <circle cx="420" cy="274" r="5"/>
  </g>
  <!-- short leaders join each port to its name -->
  <g stroke="#2b3a42" stroke-width="1.4">
    <line x1="96" y1="264" x2="96" y2="257"/>
    <line x1="196" y1="306" x2="196" y2="313"/>
    <line x1="320" y1="306" x2="320" y2="313"/>
    <line x1="425" y1="270" x2="440" y2="257"/>
  </g>
  <g font-family="sans-serif">
    <text text-anchor="middle" font-size="12" x="96" y="252">East Africa</text>
    <text text-anchor="middle" font-size="12" x="196" y="324">Arabia</text>
    <text text-anchor="middle" font-size="12" x="320" y="324">India</text>
    <text text-anchor="end" font-size="12" x="466" y="252">Southeast Asia &amp; China</text>
  </g>

  <text x="256" y="372" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">goods: spices, gold, ivory, porcelain, cloth · belief: Islam · ideas &amp; technology</text>

  <text x="256" y="423.5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Two webs that tied distant peoples together — moving goods, ideas,</text>
  <text x="256" y="441.7" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">and beliefs.</text>
  <text x="256" y="460" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">The people who walked and sailed them were the real makers of the network.</text>
  <text x="256" y="482" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">(schematic map — not to scale)</text>
</svg>
