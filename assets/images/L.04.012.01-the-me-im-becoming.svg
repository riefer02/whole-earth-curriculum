<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-04-012-01-the-me-im-becoming desc-L-04-012-01-the-me-im-becoming">
  <title id="title-L-04-012-01-the-me-im-becoming">The Me I'm Becoming: a map of the self</title>
  <desc id="desc-L-04-012-01-the-me-im-becoming">A map of the self. A child in a wheelchair sits at the centre, drawn as one soft silhouette with a real chair, a big wheel, a seat, a backrest and a footplate, and the word "me" beneath the chair. Three branches reach the child, each drawn as a dashed line from a labelled box to the child's body edge: "what I love doing" (a book and a ball), "what I can do" (a watering can and an open hand), and "what I have lived" (a winding path and a small family group). An arrow to the right leads to the words "the me I'm becoming". People vary in skin tone, dress, and ability.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">The Me I'm Becoming</text>

  <!-- branch leaders, drawn under the artwork so each meets the body edge -->
  <g stroke="#4f6d7a" stroke-width="2" stroke-dasharray="7 6">
    <line x1="174" y1="170" x2="250" y2="216"/>
    <line x1="338" y1="150" x2="294" y2="204"/>
    <line x1="150" y1="340" x2="240" y2="286"/>
  </g>

  <!-- branch 1: what I love doing -->
  <g>
    <rect x="24" y="96" width="150" height="120" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="99" y="124" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">what I</text>
    <text x="99" y="144" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">love doing</text>
    <rect x="44" y="162" width="32" height="24" rx="3" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="60" y1="162" x2="60" y2="186" stroke="#2b3a42" stroke-width="1.6"/>
    <circle cx="112" cy="174" r="13" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M112 161 A13 13 0 0 1 112 187" fill="none" stroke="#2b3a42" stroke-width="1.8"/>
  </g>

  <!-- branch 2: what I can do -->
  <g>
    <rect x="338" y="86" width="150" height="120" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="413" y="114" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">what I</text>
    <text x="413" y="134" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">can do</text>
    <!-- watering can -->
    <path d="M 368 158 h 26 a 4 4 0 0 1 4 4 v 20 a 4 4 0 0 1 -4 4 h -26 a 4 4 0 0 1 -4 -4 v -20 a 4 4 0 0 1 4 -4 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 364 164 L 350 152" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <path d="M 372 158 q 6 -12 18 -8" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- a sprout in a pot -->
    <path d="M 432 168 q 0 -14 12 -16 q 0 14 -12 16 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 448 170 q 12 -10 20 0 q -10 10 -20 0 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 444 172 v 6" stroke="#4f6d7a" stroke-width="2"/>
    <path d="M 434 178 h 24 l -4 14 h -16 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- branch 3: what I have lived -->
  <g>
    <rect x="40" y="340" width="150" height="120" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="115" y="368" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">what I</text>
    <text x="115" y="388" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">have lived</text>
    <path d="M56 428 q22 -16 44 0 q22 16 44 0" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="70" cy="412" r="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="96" cy="412" r="8" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="83" cy="400" r="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- centre: a child in a wheelchair -->
  <g>
    <!-- backrest and push handle -->
    <rect x="230" y="196" width="11" height="70" rx="5" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 231 200 L 220 190" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <!-- big rear wheel -->
    <circle cx="256" cy="300" r="30" fill="none" stroke="#4f6d7a" stroke-width="3.5"/>
    <g stroke="#4f6d7a" stroke-width="1.6">
      <line x1="256" y1="272" x2="256" y2="328"/>
      <line x1="228" y1="300" x2="284" y2="300"/>
      <line x1="236" y1="280" x2="276" y2="320"/>
      <line x1="276" y1="280" x2="236" y2="320"/>
    </g>
    <circle cx="256" cy="300" r="4" fill="#4f6d7a"/>
    <!-- seat -->
    <rect x="234" y="262" width="74" height="11" rx="5" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <!-- front frame, footplate and small caster -->
    <path d="M 300 273 L 304 290" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
    <rect x="292" y="288" width="26" height="7" rx="3" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 305 295 L 306 308" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="306" cy="316" r="8" fill="none" stroke="#4f6d7a" stroke-width="3"/>
    <!-- leg resting on the footplate -->
    <path d="M 278 258 L 298 274 L 300 286" fill="none" stroke="#6b93b6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- child -->
    <path d="M252 266 Q 252 214 274 214 Q 296 214 296 266 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="274" cy="190" r="21" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 253 186 Q 254 166 274 166 Q 294 166 295 186 Q 285 177 274 178 Q 263 177 253 186 Z" fill="#2b3a42"/>
    <circle cx="267" cy="190" r="2.2" fill="#2b3a42"/>
    <circle cx="281" cy="190" r="2.2" fill="#2b3a42"/>
    <path d="M 267 200 Q 274 206 281 200" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- arm to the wheel rim -->
    <path d="M 290 234 Q 296 258 282 276" fill="none" stroke="#f5d6b6" stroke-width="10" stroke-linecap="round"/>
  </g>

  <text x="256" y="356" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">me</text>

  <!-- the way ahead -->
  <line x1="336" y1="252" x2="398" y2="252" stroke="#e0a458" stroke-width="4" stroke-linecap="round"/>
  <path d="M 398 252 L 386 243 M 398 252 L 386 261" fill="none" stroke="#e0a458" stroke-width="4" stroke-linecap="round"/>
  <text x="406" y="246" font-family="sans-serif" font-size="13" fill="#2b3a42">the me I'm</text>
  <text x="406" y="266" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">becoming</text>
</svg>
