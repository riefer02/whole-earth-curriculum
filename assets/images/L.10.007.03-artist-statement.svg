<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The artist's explanation — four moves</title>
  <desc id="desc">A framed sheet with four labeled sections — "what I keep returning to," "what changed," "who influenced me (with credit)," and "how I honored living traditions" — connected by arrows into one explanation.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <rect x="40" y="32" width="432" height="448" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222222" font-weight="bold">The Artist's Explanation</text>
  <!-- four boxes -->
  <g fill="#ffffff" stroke="#2b3a42" stroke-width="2">
    <rect x="60" y="100" width="392" height="78" rx="6" fill="#6b93b6" fill-opacity="0.18"/>
    <rect x="60" y="206" width="392" height="78" rx="6" fill="#7a9e7e" fill-opacity="0.18"/>
    <rect x="60" y="312" width="392" height="78" rx="6" fill="#e0a458" fill-opacity="0.18"/>
    <rect x="60" y="418" width="392" height="48" rx="6" fill="#4f6d7a" fill-opacity="0.15"/>
  </g>
  <text x="76" y="132" font-family="sans-serif" font-size="19" fill="#222222" font-weight="bold">1 · What I keep returning to</text>
  <text x="76" y="156" font-family="sans-serif" font-size="15" fill="#222222">the idea or concern behind my work</text>
  <text x="76" y="238" font-family="sans-serif" font-size="19" fill="#222222" font-weight="bold">2 · What changed</text>
  <text x="76" y="262" font-family="sans-serif" font-size="15" fill="#222222">how the work grew across the series</text>
  <text x="76" y="344" font-family="sans-serif" font-size="19" fill="#222222" font-weight="bold">3 · Who influenced me (with credit)</text>
  <text x="76" y="368" font-family="sans-serif" font-size="15" fill="#222222">the people and artists I learned from, named</text>
  <text x="76" y="444" font-family="sans-serif" font-size="17" fill="#222222" font-weight="bold">4 · How I honored any living tradition I engaged</text>
  <!-- arrows -->
  <g stroke="#4f6d7a" stroke-width="3" fill="none">
    <path d="M256 182 L256 202" marker-end="none"/>
    <path d="M256 288 L256 308"/>
    <path d="M256 394 L256 414"/>
  </g>
  <g fill="#4f6d7a">
    <path d="M250 202 L256 214 L262 202 Z"/>
    <path d="M250 308 L256 320 L262 308 Z"/>
    <path d="M250 414 L256 426 L262 414 Z"/>
  </g>
</svg>
