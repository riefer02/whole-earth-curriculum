<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Helpful feedback</title>
  <desc id="desc">Two speech bubbles side by side. The left bubble, marked with a check, reads "I noticed your elbow dropped — try keeping it up" and is labeled "helpful: specific and kind." The right bubble, marked with an X, reads "you're bad at this" and is labeled "hurtful: not helpful." Labels and the check and X marks, not color alone, carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Feedback That Helps vs. Hurts</text>

  <!-- Left: helpful -->
  <rect x="26" y="80" width="222" height="250" rx="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="137" y="116" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#7a9e7e">helpful</text>
  <!-- check -->
  <circle cx="137" cy="150" r="20" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <path d="M126 150 L134 158 L150 140" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- speech bubble -->
  <rect x="46" y="190" width="182" height="96" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M86 286 L80 306 L106 286" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <text x="137" y="222" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">I noticed your</text>
  <text x="137" y="242" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">elbow dropped —</text>
  <text x="137" y="262" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">try keeping it up.</text>
  <text x="137" y="310" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">specific • kind • about the action</text>

  <!-- Right: hurtful -->
  <rect x="264" y="80" width="222" height="250" rx="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="375" y="116" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#4f6d7a">hurtful</text>
  <!-- X -->
  <circle cx="375" cy="150" r="20" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M364 140 L386 162" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <path d="M386 140 L364 162" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <!-- speech bubble -->
  <rect x="284" y="190" width="182" height="96" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M330 286 L336 306 L312 286" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <text x="375" y="236" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222222">You're bad</text>
  <text x="375" y="258" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222222">at this.</text>
  <text x="375" y="310" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">about the person • helps nothing</text>

  <text x="256" y="388" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222222">Name the action, not the person.</text>
  <text x="256" y="418" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">"I noticed ___. What helped me was ___. Try ___."</text>
  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Good feedback is a gift: it tells the truth kindly and believes you can grow.</text>
</svg>
