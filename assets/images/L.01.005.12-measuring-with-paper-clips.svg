<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Measuring length with paper clips and hand spans</title>
  <desc id="desc">A long pencil is shown at the top with six paper clips laid end to end along it, each numbered 1 through 6, with the caption that the pencil is six paper clips long. Below, an open hand is drawn with a dashed bracket from the thumb to the little finger labeled hand span, and text explains that the body is a measuring tool with hand span, footstep, and cubit, and that units must match so two people can agree on one unit and keep measuring fair. A closing note says measuring is laying equal units end to end and counting. Labels and numbers carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Measuring Length</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Lay equal units end to end and count.</text>

  <!-- Pencil -->
  <rect x="52" y="126" width="14" height="24" rx="3" fill="#c96f5f" stroke="#2b3a42" stroke-width="2"/>
  <rect x="66" y="126" width="8" height="24" fill="#d7d1c3" stroke="#2b3a42" stroke-width="2"/>
  <rect x="74" y="126" width="290" height="24" rx="3" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M364 126 L394 138 L364 150 Z" fill="#d7d1c3" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M380 138 L394 138 L381 142 Z" fill="#2b3a42"/>

  <!-- Six paper clips -->
  <g fill="#ffffff" stroke="#2b3a42" stroke-width="2">
    <rect x="74" y="188" width="40" height="20" rx="10"/>
    <rect x="116" y="188" width="40" height="20" rx="10"/>
    <rect x="158" y="188" width="40" height="20" rx="10"/>
    <rect x="200" y="188" width="40" height="20" rx="10"/>
    <rect x="242" y="188" width="40" height="20" rx="10"/>
    <rect x="284" y="188" width="40" height="20" rx="10"/>
  </g>
  <g fill="none" stroke="#4f6d7a" stroke-width="2">
    <rect x="84" y="192" width="20" height="12" rx="6"/>
    <rect x="126" y="192" width="20" height="12" rx="6"/>
    <rect x="168" y="192" width="20" height="12" rx="6"/>
    <rect x="210" y="192" width="20" height="12" rx="6"/>
    <rect x="252" y="192" width="20" height="12" rx="6"/>
    <rect x="294" y="192" width="20" height="12" rx="6"/>
  </g>

  <g font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222" text-anchor="middle">
    <text x="94" y="236">1</text>
    <text x="136" y="236">2</text>
    <text x="178" y="236">3</text>
    <text x="220" y="236">4</text>
    <text x="262" y="236">5</text>
    <text x="304" y="236">6</text>
  </g>

  <text x="256" y="268" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">The pencil is 6 paper clips long.</text>

  <!-- Hand span -->
  <ellipse cx="118" cy="358" rx="30" ry="24" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <g fill="none" stroke="#8f5f3d" stroke-width="9" stroke-linecap="round">
    <line x1="100" y1="342" x2="96" y2="306"/>
    <line x1="114" y1="340" x2="114" y2="300"/>
    <line x1="128" y1="342" x2="132" y2="306"/>
    <line x1="142" y1="346" x2="150" y2="314"/>
    <line x1="96" y1="366" x2="68" y2="380"/>
  </g>
  <line x1="150" y1="314" x2="68" y2="380" stroke="#e0a458" stroke-width="2.5" stroke-dasharray="5 4"/>
  <line x1="160" y1="330" x2="150" y2="320" stroke="#4f6d7a" stroke-width="1.5"/>
  <text x="166" y="336" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">hand span</text>
  <text x="118" y="404" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">thumb to little finger</text>

  <!-- Body measures note -->
  <text x="240" y="330" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Your body is a measuring tool:</text>
  <text x="240" y="354" font-family="sans-serif" font-size="15" fill="#4f6d7a">hand span, footstep, cubit.</text>
  <text x="240" y="388" font-family="sans-serif" font-size="15" fill="#4f6d7a">Units must match, so two people</text>
  <text x="240" y="410" font-family="sans-serif" font-size="15" fill="#4f6d7a">agree on one unit. That keeps</text>
  <text x="240" y="432" font-family="sans-serif" font-size="15" fill="#4f6d7a">measuring fair for everyone.</text>

  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">To measure is to lay equal units end to end and count.</text>
</svg>
