<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Letters, sounds and words festival</title>
  <desc id="desc">Four festival stations in a grid show the skills coming together. Station one, "Listen and Ask," shows an ear and a question mark. Station two, "Read and Retell," shows an open book with three numbered dots for beginning, middle, and end. Station three, "Write," shows a pencil writing a sentence with a capital and an end mark. Station four, "Share Languages," shows a speech bubble and a heart over a small globe. Each station is labeled and numbered one through four. The labels and shapes carry the meaning, so the picture prints clearly in grayscale and teaches learners that listening, speaking, reading, writing, and sharing languages all come together in one celebration where every language is wealth.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Letters, Sounds and Words Festival</text>

  <!-- Station 1 -->
  <rect x="16" y="76" width="234" height="190" rx="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="133" y="104" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">1 · Listen and Ask</text>
  <path d="M86 158 Q74 158 74 146 Q74 134 86 134 Q98 134 98 146 L98 158 Q104 160 108 156" fill="none" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  <path d="M74 146 Q80 140 88 140 Q96 140 98 146" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="180" y="162" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#4f6d7a">?</text>
  <text x="133" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">hear a story, ask a question</text>

  <!-- Station 2 -->
  <rect x="262" y="76" width="234" height="190" rx="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="379" y="104" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">2 · Read and Retell</text>
  <path d="M344 140 Q362 126 380 140 Q398 126 416 140 L416 162 Q398 148 380 162 Q362 148 344 162 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <line x1="380" y1="132" x2="380" y2="160" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="360" cy="196" r="6" fill="#2b3a42"/>
  <circle cx="380" cy="196" r="6" fill="#2b3a42"/>
  <circle cx="400" cy="196" r="6" fill="#2b3a42"/>
  <text x="379" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">beginning · middle · end</text>

  <!-- Station 3 -->
  <rect x="16" y="278" width="234" height="190" rx="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="133" y="306" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">3 · Write</text>
  <path d="M72 362 L112 402 L176 338 L136 298 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M112 402 L128 418" fill="#2b3a42"/>
  <path d="M136 298 L152 282" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M152 282 L154 284 L150 288 Z" fill="#2b3a42"/>
  <text x="196" y="384" font-family="sans-serif" font-size="24" fill="#2b3a42">A.</text>
  <text x="133" y="440" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">capital + thought + end mark</text>

  <!-- Station 4 -->
  <rect x="262" y="278" width="234" height="190" rx="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="379" y="306" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">4 · Share Languages</text>
  <circle cx="360" cy="360" r="26" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M344 360 Q360 344 376 360 M347 348 Q360 334 373 348" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M410 344 Q410 330 422 330 L430 330 Q440 330 440 340 L440 356 Q440 366 430 366 L424 366 L420 374 L421 366 L422 366 Q410 366 410 356 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M420 402 Q414 394 406 402 Q398 410 420 420 Q442 410 434 402 Q426 394 420 402 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="379" y="440" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">home language + a greeting</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Every language — including yours — makes the world richer.</text>
</svg>
