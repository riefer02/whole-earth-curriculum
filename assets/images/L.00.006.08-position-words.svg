<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Where is it? Position words over, on, in, under, and beside</title>
  <desc id="desc">A woven basket sits in the middle of the picture. A bird flies over the basket, a leaf rests on its rim, a seed sits inside it, a pebble lies under it, and another seed sits beside it. Each object has a label with a thin line pointing to it, teaching the position words over, on, in, under, and beside. The words and shapes carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Where Is It? Over, Under, Beside</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">These little words say where a thing is.</text>

  <!-- Basket -->
  <path d="M196 224 L206 342 Q256 360 306 342 L316 224 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="256" cy="224" rx="60" ry="16" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="256" cy="224" rx="42" ry="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M206 280 q50 16 100 0" fill="none" stroke="#c99567" stroke-width="3" stroke-linecap="round"/>
  <path d="M210 312 q46 14 92 0" fill="none" stroke="#c99567" stroke-width="3" stroke-linecap="round"/>

  <!-- Over: bird -->
  <g fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round">
    <path d="M248 120 q8 -12 16 0 q-4 -2 -6 2 q-2 4 0 8 z"/>
    <path d="M256 128 q12 -6 18 4 q-8 4 -14 2 z"/>
  </g>
  <text x="300" y="126" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">over</text>
  <line x1="288" y1="130" x2="264" y2="136" stroke="#2b3a42" stroke-width="1.5" stroke-linecap="round"/>

  <!-- On: leaf -->
  <path d="M320 232 q16 12 0 26 q-16 -12 0 -26 z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="320" y1="236" x2="320" y2="252" stroke="#4f6d7a" stroke-width="1.5" stroke-linecap="round"/>
  <text x="352" y="252" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">on</text>
  <line x1="344" y1="248" x2="330" y2="244" stroke="#2b3a42" stroke-width="1.5" stroke-linecap="round"/>

  <!-- In: seed -->
  <path d="M256 216 q10 9 0 18 q-10 -9 0 -18 z" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <text x="196" y="214" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">in</text>
  <line x1="212" y1="218" x2="242" y2="224" stroke="#2b3a42" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Under: pebble -->
  <ellipse cx="256" cy="392" rx="24" ry="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="196" y="404" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">under</text>
  <line x1="214" y1="398" x2="234" y2="394" stroke="#2b3a42" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Beside: seed -->
  <path d="M384 300 q11 10 0 20 q-11 -10 0 -20 z" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <text x="412" y="300" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">beside</text>
  <line x1="402" y1="304" x2="396" y2="308" stroke="#2b3a42" stroke-width="1.5" stroke-linecap="round"/>

  <text x="256" y="472" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Over, on, in, under, beside — say where it is, and it can be found.</text>
</svg>
