<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Structure, style and argument working together</title>
  <desc id="desc">Three interlocking shapes labeled structure, style, and argument feed a single arrow into a box labeled meaning and effect, showing that the three parts of a text work together, not separately.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">How a Text Works</text>

  <!-- three interlocking parts -->
  <ellipse cx="170" cy="200" rx="110" ry="74" fill="#7a9e7e" fill-opacity="0.28" stroke="#2b3a42" stroke-width="2"/>
  <text x="170" y="190" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">STRUCTURE</text>
  <text x="170" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">how the parts are ordered</text>

  <ellipse cx="342" cy="200" rx="110" ry="74" fill="#e0a458" fill-opacity="0.28" stroke="#2b3a42" stroke-width="2"/>
  <text x="342" y="190" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">STYLE</text>
  <text x="342" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">word choice, voice, rhythm</text>

  <ellipse cx="256" cy="300" rx="120" ry="70" fill="#6b93b6" fill-opacity="0.28" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="290" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">ARGUMENT</text>
  <text x="256" y="310" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">the claim and its reasons</text>

  <!-- arrow down -->
  <path d="M256 372 L256 412" fill="none" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2b3a42"/>
    </marker>
  </defs>

  <!-- result -->
  <rect x="128" y="420" width="256" height="64" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="448" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">meaning &amp; effect</text>
  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">what the reader feels and understands</text>
</svg>
