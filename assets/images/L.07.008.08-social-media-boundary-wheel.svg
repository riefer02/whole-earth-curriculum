<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My social-media boundary wheel</title>
  <desc id="desc">A circle divided into four labeled sections around a center that reads "My boundaries, my choice." The four sections are: Time — set limits on when and how long; Content — curate what and who you follow; Notifications — turn off what pulls you back; and People — choose who you connect with. A caption reads "Boundaries are self-care, not punishment."</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">My social-media boundaries</text>

  <circle cx="256" cy="268" r="176" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
  <line x1="256" y1="92" x2="256" y2="444" stroke="#2b3a42" stroke-width="2"/>
  <line x1="80" y1="268" x2="432" y2="268" stroke="#2b3a42" stroke-width="2"/>

  <!-- center -->
  <circle cx="256" cy="268" r="58" fill="#e0a458" fill-opacity="0.3" stroke="#e0a458" stroke-width="2.5"/>
  <text x="256" y="262" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">My boundaries</text>
  <text x="256" y="280" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">my choice</text>

  <!-- Time (top) -->
  <text x="256" y="158" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#6b93b6">Time</text>
  <text x="256" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">limits on when</text>
  <text x="256" y="194" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">and how long</text>

  <!-- Content (right) -->
  <text x="360" y="258" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#7a9e7e">Content</text>
  <text x="360" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">curate what and</text>
  <text x="360" y="294" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">who you follow</text>

  <!-- Notifications (bottom) -->
  <text x="256" y="378" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#e0a458">Notifications</text>
  <text x="256" y="398" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">turn off what</text>
  <text x="256" y="414" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">pulls you back</text>

  <!-- People (left) -->
  <text x="152" y="258" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">People</text>
  <text x="152" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">choose who you</text>
  <text x="152" y="294" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">connect with</text>

  <!-- caption -->
  <rect x="80" y="462" width="352" height="34" rx="8" fill="#7a9e7e" fill-opacity="0.2" stroke="#7a9e7e" stroke-width="2"/>
  <text x="256" y="484" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Boundaries are self-care, not punishment.</text>
</svg>
