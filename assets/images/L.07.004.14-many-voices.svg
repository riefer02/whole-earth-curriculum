<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-07-004-14-many-voices desc-L-07-004-14-many-voices">
  <title id="title-L-07-004-14-many-voices">Many voices, all correct</title>
  <desc id="desc-L-07-004-14-many-voices">A row of three speech bubbles rising from three people of varied skin tones and hair, each bubble containing a different greeting word. Above them a caption reads "Every way of speaking is a correct way of speaking." Meaning is carried by labels and the equal, side-by-side layout, not color, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Every way of speaking is a correct way</text>

  <!-- Person 1: bobbed hair -->
  <g>
    <path d="M 70 440 L 70 422 Q 74 372 120 362 Q 166 372 170 422 L 170 440 Z" fill="#6b93b6"/>
    <circle cx="120" cy="312" r="35" fill="#2b3a42"/>
    <rect x="112" y="336" width="16" height="30" rx="6" fill="#f5d6b6"/>
    <circle cx="120" cy="316" r="30" fill="#f5d6b6"/>
    <path d="M90 308 q6 -22 30 -22 q24 0 30 22 q-14 -10 -30 -10 q-16 0 -30 10 z" fill="#2b3a42"/>
    <circle cx="110" cy="313" r="3" fill="#2b3a42"/>
    <circle cx="130" cy="313" r="3" fill="#2b3a42"/>
    <path d="M111 329 Q120 337 129 329" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Person 2: cropped hair with a top knot -->
  <g>
    <path d="M 206 440 L 206 422 Q 210 372 256 362 Q 302 372 306 422 L 306 440 Z" fill="#7a9e7e"/>
    <circle cx="256" cy="316" r="31" fill="#2b3a42"/>
    <circle cx="256" cy="280" r="10" fill="#2b3a42"/>
    <rect x="248" y="336" width="16" height="30" rx="6" fill="#c99567"/>
    <circle cx="256" cy="316" r="30" fill="#c99567"/>
    <path d="M228 302 q10 -14 28 -14 q18 0 28 14 q-14 -6 -28 -6 q-14 0 -28 6 z" fill="#2b3a42"/>
    <circle cx="246" cy="313" r="3" fill="#2b3a42"/>
    <circle cx="266" cy="313" r="3" fill="#2b3a42"/>
    <path d="M247 329 Q256 337 265 329" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Person 3: curly hair -->
  <g>
    <path d="M 342 440 L 342 422 Q 346 372 392 362 Q 438 372 442 422 L 442 440 Z" fill="#4f6d7a"/>
    <g fill="#2b3a42">
      <circle cx="368" cy="300" r="12"/>
      <circle cx="383" cy="290" r="13"/>
      <circle cx="401" cy="290" r="13"/>
      <circle cx="416" cy="300" r="12"/>
    </g>
    <rect x="384" y="336" width="16" height="30" rx="6" fill="#e0b18a"/>
    <circle cx="392" cy="316" r="30" fill="#e0b18a"/>
    <path d="M364 296 q12 -12 28 -12 q16 0 28 12 q-12 -4 -28 -4 q-16 0 -28 4 z" fill="#2b3a42"/>
    <circle cx="382" cy="313" r="3" fill="#2b3a42"/>
    <circle cx="402" cy="313" r="3" fill="#2b3a42"/>
    <path d="M383 329 Q392 337 401 329" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Speech bubbles -->
  <g>
    <path d="M64 150 Q64 122 96 122 L168 122 Q200 122 200 150 L200 186 Q200 214 168 214 L128 214 L112 238 L120 214 L96 214 Q64 214 64 186 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="132" y="162" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">salaam</text>
  </g>
  <g>
    <path d="M208 150 Q208 122 240 122 L312 122 Q344 122 344 150 L344 186 Q344 214 312 214 L272 214 L256 238 L264 214 L240 214 Q208 214 208 186 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="276" y="162" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">hola</text>
  </g>
  <g>
    <path d="M352 150 Q352 122 384 122 L456 122 Q488 122 488 150 L488 186 Q488 214 456 214 L416 214 L400 238 L408 214 L384 214 Q352 214 352 186 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="420" y="162" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">jambo</text>
  </g>

  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Dialect and accent are natural variation — not error.</text>
</svg>
