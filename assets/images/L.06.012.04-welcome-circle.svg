<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Identity shapes belonging, and we can open the circle</title>
  <desc id="d">A welcoming circle contains four figures of varied skin tones. One holds a small drum, one holds a bowl of shared food, one has a speech bubble reading "hello / hola," and one is a wheelchair user with a hearing aid. Just outside the circle, a fifth figure stands with an open arm and a dashed arrow pointing through a gap into the circle, labeled "you are welcome." A banner reads "culture, language, ability — all belong, and it is ordinary." Shapes and labels, not color alone, carry the meaning.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#2b3a42">Identity Shapes Belonging — and We Can Open the Circle</text>

  <!-- the circle (with a gap lower-left) -->
  <path d="M 300 92 A 150 150 0 1 0 150 268" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3.5" fill-rule="evenodd"/>
  <path d="M 380 92 A 150 150 0 0 1 410 160" fill="none" stroke="#2b3a42" stroke-width="3.5"/>

  <!-- inside: drum (culture) -->
  <g>
    <circle cx="300" cy="150" r="16" fill="#d9a066"/>
    <rect x="286" y="166" width="30" height="40" rx="9" fill="#e0a458"/>
    <ellipse cx="300" cy="226" rx="18" ry="22" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
    <text x="300" y="112" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">culture</text>
  </g>

  <!-- inside: shared food -->
  <g>
    <circle cx="404" cy="160" r="15" fill="#a9714b"/>
    <rect x="390" y="176" width="30" height="38" rx="9" fill="#6b93b6"/>
    <path d="M398 190 L 382 210" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M382 210 Q 390 226 398 210" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
    <text x="420" y="122" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">shared food</text>
  </g>

  <!-- inside: language -->
  <g>
    <circle cx="340" cy="300" r="16" fill="#f2c9a0"/>
    <rect x="326" y="316" width="30" height="38" rx="9" fill="#7a9e7e"/>
    <rect x="276" y="272" width="82" height="44" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="317" y="292" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">hello</text>
    <text x="317" y="308" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">hola</text>
    <text x="340" y="264" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">language</text>
  </g>

  <!-- inside: wheelchair user with hearing aid (ability) -->
  <g>
    <circle cx="256" cy="316" r="15" fill="#8d5a3b"/>
    <path d="M256 304 L 256 298 M256 298 C 250 298, 250 292, 256 292" stroke="#2b3a42" stroke-width="3" fill="none"/>
    <rect x="242" y="331" width="28" height="34" rx="8" fill="#e0a458"/>
    <circle cx="226" cy="360" r="13" fill="none" stroke="#2b3a42" stroke-width="3.5"/>
    <circle cx="286" cy="360" r="13" fill="none" stroke="#2b3a42" stroke-width="3.5"/>
    <line x1="242" y1="352" x2="226" y2="360" stroke="#2b3a42" stroke-width="3"/>
    <line x1="270" y1="352" x2="286" y2="360" stroke="#2b3a42" stroke-width="3"/>
    <text x="256" y="282" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">ability</text>
  </g>

  <!-- outside figure being welcomed -->
  <g>
    <circle cx="104" cy="380" r="16" fill="#f5d6b6"/>
    <circle cx="98" cy="375" r="2.5" fill="#2b3a42"/>
    <circle cx="110" cy="375" r="2.5" fill="#2b3a42"/>
    <path d="M99 385 Q104 390 109 385" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="89" y="396" width="30" height="40" rx="9" fill="#7a9e7e"/>
    <path d="M119 402 L 152 388" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- dashed welcome arrow into the gap -->
  <path d="M128 342 C 120 330, 130 316, 150 300" fill="none" stroke="#6b93b6" stroke-width="3" stroke-dasharray="6 5"/>
  <path d="M140 296 L 152 298 L 144 310" fill="none" stroke="#6b93b6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="300" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6b93b6">you are welcome</text>

  <!-- banner -->
  <rect x="80" y="434" width="352" height="54" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="458" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">culture, language, ability —</text>
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">all belong, and it is ordinary</text>
</svg>
