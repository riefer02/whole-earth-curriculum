<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title>Life cycle of a made object</title>
  <desc>A flow of four stages — materials, making, use, disposal — arranged in a loop with a reuse arrow returning to materials, showing that every designed object has a life cycle affecting the environment.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="34" font-family="system-ui, sans-serif" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">Where a made thing comes from and goes</text>

  <!-- four stage boxes in a loop -->
  <rect x="40" y="140" width="120" height="80" rx="8" fill="#7a9e7e" opacity="0.6" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="100" y="184" font-family="system-ui, sans-serif" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">materials</text>

  <rect x="200" y="140" width="120" height="80" rx="8" fill="#e0a458" opacity="0.6" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="260" y="184" font-family="system-ui, sans-serif" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">making</text>

  <rect x="360" y="140" width="120" height="80" rx="8" fill="#6b93b6" opacity="0.6" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="420" y="184" font-family="system-ui, sans-serif" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">use</text>

  <rect x="200" y="300" width="120" height="80" rx="8" fill="#4f6d7a" opacity="0.5" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="260" y="344" font-family="system-ui, sans-serif" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">disposal</text>

  <!-- flow arrows -->
  <path d="M160 180 H 200" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M320 180 H 360" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M420 220 V 300 Q420 340 380 340 H 320" fill="none" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M200 340 Q160 340 160 300 V 250 Q160 220 120 220 H 100" fill="none" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- reuse label -->
  <text x="160" y="396" font-family="system-ui, sans-serif" font-size="13" fill="#4f6d7a" text-anchor="middle">reuse / recycle</text>

  <!-- caption -->
  <text x="256" y="452" font-family="system-ui, sans-serif" font-size="13" fill="#4f6d7a" text-anchor="middle">design choices ripple through the whole cycle</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b3a42"/>
    </marker>
  </defs>
</svg>
