<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-03-001-07-my-groups desc-L-03-001-07-my-groups">
  <title id="title-L-03-001-07-my-groups">The groups I belong to</title>
  <desc id="desc-L-03-001-07-my-groups">A web diagram with a simple figure in the center labeled "me," and six empty circles around it connected by lines, ready to be filled in with the groups a learner belongs to. Small labels around the edge suggest ideas: family, class, community, a club or team, a faith or culture, a language. The circles are blank so the learner writes or draws their own. Shapes and words, not color, carry the meaning so it prints clearly in grayscale.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="50" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">The Groups I Belong To</text>

  <!-- Spokes -->
  <g stroke="#4f6d7a" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="230" x2="110" y2="136"/>
    <line x1="256" y1="230" x2="402" y2="136"/>
    <line x1="256" y1="230" x2="90" y2="330"/>
    <line x1="256" y1="230" x2="422" y2="330"/>
    <line x1="256" y1="230" x2="150" y2="430"/>
    <line x1="256" y1="230" x2="362" y2="430"/>
  </g>

  <!-- Empty group circles, for the learner to fill in -->
  <g fill="#ffffff" stroke="#2b3a42" stroke-width="2">
    <circle cx="110" cy="136" r="44"/>
    <circle cx="402" cy="136" r="44"/>
    <circle cx="90" cy="330" r="44"/>
    <circle cx="422" cy="330" r="44"/>
    <circle cx="150" cy="430" r="44"/>
    <circle cx="362" cy="430" r="44"/>
  </g>

  <!-- Center figure: one soft silhouette, limbs with weight -->
  <g fill="#c99567" stroke="none">
    <circle cx="256" cy="208" r="26"/>
    <rect x="249" y="230" width="14" height="14" rx="6"/>
    <rect x="226" y="240" width="60" height="62" rx="26"/>
    <path d="M234 254 l-14 44" stroke="#c99567" stroke-width="16" stroke-linecap="round"/>
    <path d="M278 254 l14 44" stroke="#c99567" stroke-width="16" stroke-linecap="round"/>
    <path d="M242 296 l-4 26" stroke="#c99567" stroke-width="20" stroke-linecap="round"/>
    <path d="M270 296 l4 26" stroke="#c99567" stroke-width="20" stroke-linecap="round"/>
  </g>
  <ellipse cx="234" cy="326" rx="12" ry="6" fill="#c99567"/>
  <ellipse cx="278" cy="326" rx="12" ry="6" fill="#c99567"/>
  <circle cx="256" cy="208" r="26" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="247" cy="202" r="2.6" fill="#2b3a42"/>
  <circle cx="265" cy="202" r="2.6" fill="#2b3a42"/>
  <path d="M246 216 Q256 226 266 216" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">me</text>

  <!-- Idea labels: each sits directly under its own circle -->
  <g fill="#4f6d7a" font-family="sans-serif" font-size="13" text-anchor="middle">
    <text x="110" y="78" font-size="13" text-anchor="middle">family</text>
    <text x="402" y="78" font-size="13" text-anchor="middle">class</text>
    <text x="90" y="390" font-size="13" text-anchor="middle">community</text>
    <text x="422" y="390" font-size="13" text-anchor="middle">a club or team</text>
    <text x="150" y="498" font-size="13" text-anchor="middle">a faith or culture</text>
    <text x="362" y="498" font-size="13" text-anchor="middle">a language</text>
  </g>
</svg>
