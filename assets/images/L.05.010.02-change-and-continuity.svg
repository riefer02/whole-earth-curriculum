<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 460" role="img" aria-labelledby="title desc">
  <title id="title">Changed and stayed the same</title>
  <desc id="desc">A two-column chart titled "Changed and stayed the same." The left column, labeled "changed," shows a small pyramid beside a taller pyramid with the note "buildings grew grander over centuries," and a busy grid of streets with the note "cities rose and later declined." The right column, labeled "stayed the same," shows a river with rising flood marks and the note "the river's flood returned every year," and a hand holding a stylus with the note "writing kept records across the centuries." A caption reads "Change happens over time; continuity is what lasts." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="460" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#2b3a42">Changed and Stayed the Same</text>

  <!-- Left column: changed -->
  <rect x="24" y="66" width="224" height="330" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="94" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">changed</text>

  <!-- pyramids growing -->
  <path d="M52 200 L66 170 L80 200 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M100 200 L122 152 L144 200 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="102" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">buildings grew grander</text>
  <text x="102" y="238" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">over centuries</text>

  <!-- grid streets -->
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <rect x="46" y="266" width="120" height="60"/>
    <line x1="86" y1="266" x2="86" y2="326"/>
    <line x1="126" y1="266" x2="126" y2="326"/>
    <line x1="46" y1="296" x2="166" y2="296"/>
  </g>
  <text x="106" y="346" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">cities rose and</text>
  <text x="106" y="362" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">later declined</text>

  <!-- Right column: stayed -->
  <rect x="264" y="66" width="224" height="330" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="94" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">stayed the same</text>

  <!-- river with flood marks -->
  <g stroke="#6b93b6" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M284 150 Q310 168 336 150 Q362 132 388 150 Q414 168 440 150"/>
    <path d="M292 176 Q322 194 352 176 Q382 158 428 176"/>
  </g>
  <g stroke="#e0a458" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M300 210 Q310 206 316 210"/>
    <path d="M336 206 Q346 202 352 206"/>
  </g>
  <text x="376" y="228" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">the river's flood</text>
  <text x="376" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">returned every year</text>

  <!-- hand with stylus -->
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M360 296 L360 330"/>
    <path d="M360 306 L340 300"/>
    <path d="M360 306 L380 300"/>
    <path d="M356 330 L396 330"/>
    <path d="M360 330 L352 348"/>
    <path d="M376 330 L372 348"/>
  </g>
  <rect x="356" y="278" width="8" height="22" rx="2" fill="#2b3a42"/>
  <text x="376" y="366" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">writing kept records</text>
  <text x="376" y="382" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">across the centuries</text>

  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">Change happens over time; continuity is what lasts.</text>
</svg>
