<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The four strands of the year</title>
  <desc id="desc">A four-panel unit map. Each panel shows one strand — Number &amp; Quantity, Patterns &amp; Relationships, Geometry &amp; Spatial Reasoning, and Data &amp; Measurement — with a Grade 7 idea on the left, an arrow, and a Grade 8 idea on the right. Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Four Strands, One Year of Sense-Making</text>

  <!-- panel 1 -->
  <rect x="20" y="56" width="472" height="100" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="34" y="78" font-family="sans-serif" font-size="16" font-weight="bold" fill="#6b93b6">Number &amp; Quantity</text>
  <text x="34" y="104" font-family="sans-serif" font-size="13" fill="#222222">Grade 7: fractions, decimals, integers</text>
  <text x="452" y="104" text-anchor="end" font-family="sans-serif" font-size="13" fill="#222222">Grade 8: rational vs. irrational · scientific notation</text>
  <line x1="34" y1="112" x2="452" y2="112" stroke="#e0a458" stroke-width="2"/>
  <path d="M448 107 L452 112 L448 117" fill="none" stroke="#e0a458" stroke-width="2"/>

  <!-- panel 2 -->
  <rect x="20" y="164" width="472" height="100" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="34" y="186" font-family="sans-serif" font-size="16" font-weight="bold" fill="#6b93b6">Patterns &amp; Relationships</text>
  <text x="34" y="212" font-family="sans-serif" font-size="13" fill="#222222">Grade 7: y = kx · two-step equations</text>
  <text x="452" y="212" text-anchor="end" font-family="sans-serif" font-size="13" fill="#222222">Grade 8: functions · linear equations · systems</text>
  <line x1="34" y1="220" x2="452" y2="220" stroke="#e0a458" stroke-width="2"/>
  <path d="M448 215 L452 220 L448 225" fill="none" stroke="#e0a458" stroke-width="2"/>

  <!-- panel 3 -->
  <rect x="20" y="272" width="472" height="100" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="34" y="294" font-family="sans-serif" font-size="16" font-weight="bold" fill="#6b93b6">Geometry &amp; Spatial Reasoning</text>
  <text x="34" y="320" font-family="sans-serif" font-size="13" fill="#222222">Grade 7: triangles · scale drawings · π</text>
  <text x="452" y="320" text-anchor="end" font-family="sans-serif" font-size="13" fill="#222222">Grade 8: transformations · Pythagorean theorem</text>
  <line x1="34" y1="328" x2="452" y2="328" stroke="#e0a458" stroke-width="2"/>
  <path d="M448 323 L452 328 L448 333" fill="none" stroke="#e0a458" stroke-width="2"/>

  <!-- panel 4 -->
  <rect x="20" y="380" width="472" height="100" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="34" y="402" font-family="sans-serif" font-size="16" font-weight="bold" fill="#6b93b6">Data, Measurement &amp; Probability</text>
  <text x="34" y="428" font-family="sans-serif" font-size="13" fill="#222222">Grade 7: random sampling · probability</text>
  <text x="452" y="428" text-anchor="end" font-family="sans-serif" font-size="13" fill="#222222">Grade 8: scatter plots · lines of fit</text>
  <line x1="34" y1="436" x2="452" y2="436" stroke="#e0a458" stroke-width="2"/>
  <path d="M448 431 L452 436 L448 441" fill="none" stroke="#e0a458" stroke-width="2"/>

  <text x="256" y="500" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">four habits that grow together — number, relationship, shape, and data</text>
</svg>
