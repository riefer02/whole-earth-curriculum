<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Our people, places and long ago story</title>
  <desc id="desc">A story page divided into four labeled sections. The first is a timeline with a long-ago and now end. The second is a place changing over time. The third shows two homes side by side, labeled "two peoples." The fourth shows people in a circle together, labeled "a say for all." Each section is where a learner writes or draws one piece of their own people, places, and long ago story. Labels and shapes, not color, carry the meaning so it prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">My People, Places &amp; Long Ago Story</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">One page, many pieces — each learner's own story.</text>

  <!-- section 1: timeline -->
  <rect x="30" y="92" width="218" height="140" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="139" y="114" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">my timeline</text>
  <path d="M54 156 L224 156" stroke="#2b3a42" stroke-width="3"/>
  <path d="M218 150 l10 6 l-10 6 Z" fill="#2b3a42"/>
  <circle cx="80" cy="156" r="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="130" cy="156" r="7" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="180" cy="156" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="139" y="188" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">events in order, long ago to now</text>
  <text x="139" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">— and how I know the order</text>

  <!-- section 2: place changes -->
  <rect x="264" y="92" width="218" height="140" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="373" y="114" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">a place changed</text>
  <path d="M284 168 q30 16 60 0 q30 -16 60 0" fill="none" stroke="#6b93b6" stroke-width="4"/>
  <rect x="298" y="146" width="24" height="18" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <rect x="424" y="146" width="24" height="18" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M352 168 q12 -18 24 0" fill="none" stroke="#2b3a42" stroke-width="4"/>
  <text x="373" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">what changed, and one reason why</text>

  <!-- section 3: two peoples -->
  <rect x="30" y="244" width="218" height="140" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="139" y="266" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">two peoples</text>
  <rect x="52" y="280" width="80" height="64" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M66 316 q9 -14 18 0 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="146" y="280" width="80" height="64" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M160 310 L212 310 L206 326 L166 326 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="139" y="366" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">food, shelter, clothing — shaped by place</text>

  <!-- section 4: a say -->
  <rect x="264" y="244" width="218" height="140" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="373" y="266" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">a say for all</text>
  <circle cx="342" cy="298" r="12" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="404" cy="298" r="12" fill="#8d5a3a" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="373" cy="322" r="12" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M342 310 q12 6 24 0 l-2 14 l-10 0 l-10 0 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="373" y="366" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">working together, everyone's voice</text>

  <text x="256" y="426" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">Every learner's story is different — and every one belongs.</text>
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">History is told from many voices, never just one.</text>
</svg>
