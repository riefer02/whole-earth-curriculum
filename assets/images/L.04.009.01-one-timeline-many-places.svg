<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">One timeline, many places</title>
  <desc id="desc">A horizontal timeline arrow runs from a "long ago" end on the left to a "today" end on the right, with a BCE-to-CE change near the middle. Six events from four world regions sit in date order along the line, each a dot with its date above and a short label below: Great Pyramid in Egypt, a grid city in the Indus Valley, a carved stone head in Mesoamerica, a stone pillar in India, a lake city in Mesoamerica, and mountain roads in the Andes. Labels and dates, not color, carry the meaning, so it prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">One Timeline, Many Places</text>
  <text x="256" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Events from many world regions, placed in order by date (not to scale).</text>

  <!-- timeline arrow -->
  <line x1="52" y1="300" x2="478" y2="300" stroke="#2b3a42" stroke-width="2"/>
  <polygon points="478,296 492,300 478,304" fill="#2b3a42"/>
  <text x="52" y="322" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">long ago</text>
  <text x="470" y="322" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">today</text>

  <!-- BCE/CE divider -->
  <line x1="256" y1="288" x2="256" y2="312" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="256" y="278" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">BCE &#8594; CE</text>

  <!-- 1. Pyramid Egypt -->
  <circle cx="88" cy="300" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="88" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">c. 2560 BCE</text>
  <text x="88" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">Pyramid</text>
  <text x="88" y="356" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">Egypt</text>

  <!-- 2. Grid city Indus -->
  <circle cx="146" cy="300" r="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="146" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">c. 2500 BCE</text>
  <text x="146" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">Grid city</text>
  <text x="146" y="356" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">Indus Valley</text>

  <!-- 3. Carved head Mesoamerica -->
  <circle cx="204" cy="300" r="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="204" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">c. 1200 BCE</text>
  <text x="204" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">Carved head</text>
  <text x="204" y="356" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">Mesoamerica</text>

  <!-- 4. Pillar India -->
  <circle cx="296" cy="300" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="296" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">c. 250 BCE</text>
  <text x="296" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">Stone pillar</text>
  <text x="296" y="356" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">India</text>

  <!-- 5. Lake city Mesoamerica -->
  <circle cx="380" cy="300" r="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="380" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">1325 CE</text>
  <text x="380" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">Lake city</text>
  <text x="380" y="356" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">Mesoamerica</text>

  <!-- 6. Mountain roads Andes -->
  <circle cx="454" cy="300" r="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="454" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">c. 1450 CE</text>
  <text x="454" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">Mountain roads</text>
  <text x="454" y="356" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">Andes</text>

  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Six places, one line — dates tell the order, and many ways count the years.</text>
</svg>
