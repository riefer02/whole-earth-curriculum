<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My body, my senses and movement — celebration collage</title>
  <desc id="desc">A four-part collage celebrating the body. Panel one shows senses teaming up: a nose and tongue, and an eye and ear. Panel two shows body signals: hunger, fullness, thirst, and tiredness. Panel three shows movement with rhythm and balance: a child stomping and then walking a line. Panel four shows aiming: a child throwing at a target. A note reminds us to celebrate everything our body can sense, signal, and do. Words and shapes carry the meaning, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#2b3a42">Celebrate My Body</text>

  <!-- ===== Panel 1: senses team up ===== -->
  <g>
    <rect x="24" y="64" width="220" height="150" rx="12" fill="#f4f0e6" stroke="#4f6d7a" stroke-width="2"/>
    <text x="134" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Senses team up</text>
    <!-- nose -->
    <path d="M64 128 L68 142 L54 146 L64 128" fill="#c9bdb0" stroke="#2b3a42" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- tongue -->
    <path d="M74 120 Q84 132 94 120" fill="none" stroke="#2b3a42" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M78 124 Q84 132 90 124 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="84" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">taste + smell</text>
    <!-- eye -->
    <ellipse cx="176" cy="124" rx="18" ry="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2.2"/>
    <circle cx="176" cy="124" r="5" fill="#2b3a42"/>
    <!-- ear -->
    <path d="M210 116 Q200 124 208 138" fill="none" stroke="#2b3a42" stroke-width="2.4" stroke-linecap="round"/>
    <text x="196" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">eyes + ears</text>
    <text x="134" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">two senses = fuller picture</text>
  </g>

  <!-- ===== Panel 2: body signals ===== -->
  <g>
    <rect x="268" y="64" width="220" height="150" rx="12" fill="#f4f0e6" stroke="#4f6d7a" stroke-width="2"/>
    <text x="378" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Body signals</text>
    <!-- small body -->
    <circle cx="330" cy="128" r="16" fill="#d6d1c7" stroke="#2b3a42" stroke-width="2"/>
    <path d="M322 122 A16 16 0 0 1 338 122 L338 118 Q330 112 322 118 Z" fill="#2b3a42"/>
    <path d="M322 144 L338 144 L340 186 Q330 194 320 186 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="330" cy="164" rx="9" ry="7" fill="#e0a458" opacity="0.55" stroke="#e0a458" stroke-width="1.5"/>
    <path d="M326 164 Q330 160 334 164" fill="none" stroke="#2b3a42" stroke-width="1.4"/>
    <!-- signal list -->
    <text x="376" y="124" font-family="sans-serif" font-size="13" fill="#222222">hunger &#8594; eat</text>
    <text x="376" y="142" font-family="sans-serif" font-size="13" fill="#222222">fullness &#8594; stop</text>
    <text x="376" y="160" font-family="sans-serif" font-size="13" fill="#222222">thirst &#8594; drink</text>
    <text x="376" y="178" font-family="sans-serif" font-size="13" fill="#222222">tiredness &#8594; rest</text>
    <text x="378" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">notice the signal, answer kindly</text>
  </g>

  <!-- ===== Panel 3: rhythm and balance ===== -->
  <g>
    <rect x="24" y="232" width="220" height="150" rx="12" fill="#f4f0e6" stroke="#4f6d7a" stroke-width="2"/>
    <text x="134" y="258" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Move: rhythm + balance</text>
    <!-- beat dots -->
    <circle cx="64" cy="284" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="92" cy="284" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="120" cy="284" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="148" cy="284" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <!-- stomping child -->
    <circle cx="72" cy="336" r="18" fill="#e6c8a0" stroke="#2b3a42" stroke-width="2"/>
    <path d="M62 328 A18 18 0 0 1 82 328 L82 324 Q72 318 62 324 Z" fill="#2b3a42"/>
    <ellipse cx="68" cy="336" rx="3" ry="2.2" fill="#ffffff" stroke="#2b3a42" stroke-width="1.3"/>
    <circle cx="68" cy="336" r="1.3" fill="#2b3a42"/>
    <ellipse cx="76" cy="336" rx="3" ry="2.2" fill="#ffffff" stroke="#2b3a42" stroke-width="1.3"/>
    <circle cx="76" cy="336" r="1.3" fill="#2b3a42"/>
    <path d="M66 344 Q72 350 78 344" fill="none" stroke="#2b3a42" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M72 352 L68 376 M72 352 L76 376" stroke="#2b3a42" stroke-width="2.4" stroke-linecap="round"/>
    <!-- balance line walker -->
    <circle cx="176" cy="336" r="18" fill="#d6d1c7" stroke="#2b3a42" stroke-width="2"/>
    <path d="M166 328 A18 18 0 0 1 186 328 L186 324 Q176 318 166 324 Z" fill="#2b3a42"/>
    <ellipse cx="172" cy="336" rx="3" ry="2.2" fill="#ffffff" stroke="#2b3a42" stroke-width="1.3"/>
    <circle cx="172" cy="336" r="1.3" fill="#2b3a42"/>
    <ellipse cx="180" cy="336" rx="3" ry="2.2" fill="#ffffff" stroke="#2b3a42" stroke-width="1.3"/>
    <circle cx="180" cy="336" r="1.3" fill="#2b3a42"/>
    <path d="M170 344 Q176 350 182 344" fill="none" stroke="#2b3a42" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M166 340 L150 346 M186 340 L202 346" stroke="#2b3a42" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M176 352 L174 376 M176 352 L178 376" stroke="#2b3a42" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="150" y1="378" x2="202" y2="378" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- ===== Panel 4: aim ===== -->
  <g>
    <rect x="268" y="232" width="220" height="150" rx="12" fill="#f4f0e6" stroke="#4f6d7a" stroke-width="2"/>
    <text x="378" y="258" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Hand&#8211;eye: aim</text>
    <!-- child -->
    <circle cx="318" cy="312" r="18" fill="#d6d1c7" stroke="#2b3a42" stroke-width="2"/>
    <path d="M308 304 A18 18 0 0 1 328 304 L328 300 Q318 294 308 300 Z" fill="#2b3a42"/>
    <ellipse cx="314" cy="312" rx="3" ry="2.2" fill="#ffffff" stroke="#2b3a42" stroke-width="1.3"/>
    <circle cx="315" cy="312" r="1.3" fill="#2b3a42"/>
    <ellipse cx="322" cy="312" rx="3" ry="2.2" fill="#ffffff" stroke="#2b3a42" stroke-width="1.3"/>
    <circle cx="323" cy="312" r="1.3" fill="#2b3a42"/>
    <path d="M314 320 Q318 324 322 320" fill="none" stroke="#2b3a42" stroke-width="1.6" stroke-linecap="round"/>
    <!-- throwing arm + beanbag -->
    <path d="M326 316 L348 296" stroke="#2b3a42" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="352" cy="292" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="1.8"/>
    <!-- target -->
    <path d="M438 306 L456 306 L452 338 Q447 342 442 338 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2.2" stroke-linejoin="round"/>
    <ellipse cx="447" cy="306" rx="9" ry="4" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <!-- dotted path -->
    <path d="M358 292 Q400 300 440 308" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow2)"/>
    <text x="378" y="370" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">eyes guide the hands</text>
  </g>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#4f6d7a"/>
    </marker>
  </defs>

  <text x="256" y="418" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Your body can sense, signal, and do wonderful things.</text>
  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Every body is different, and every body is good.</text>
  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">Celebrate yours.</text>
</svg>
