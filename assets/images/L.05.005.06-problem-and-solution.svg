<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Problem and solution</title>
  <desc id="desc">A two-box diagram. The left box is labeled "problem" and shows a cracked, dry field with a small sun, captioned "the well runs dry." The right box is labeled "solution" and shows a shared rain barrel collecting water, captioned "a community rain barrel." An arrow between them is labeled "so." Labels and shapes, not color alone, carry the meaning so the graphic prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Author's Structure: Problem and Solution</text>

  <!-- Problem box -->
  <rect x="28" y="90" width="210" height="220" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="133" y="122" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">problem</text>

  <!-- sun -->
  <circle cx="70" cy="160" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M70 134 L70 126 M70 186 L70 194 M44 160 L36 160 M96 160 L104 160 M52 142 L46 136 M88 142 L94 136" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>

  <!-- cracked dry field -->
  <path d="M44 292 L70 280 L90 292 L110 282 L130 292 L150 281 L170 292 L190 283 L222 292" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M60 292 L52 310 M110 282 L104 302 M160 292 L158 308" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>

  <!-- dry well -->
  <rect x="92" y="200" width="40" height="56" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M86 200 L146 200" stroke="#2b3a42" stroke-width="2"/>
  <text x="112" y="280" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">the well runs dry</text>

  <!-- Arrow between -->
  <text x="256" y="180" text-anchor="middle" font-family="sans-serif" font-size="20" font-style="italic" fill="#4f6d7a">so</text>
  <path d="M238 200 L280 200" fill="none" stroke="#4f6d7a" stroke-width="3"/>
  <path d="M270 192 L282 200 L270 208" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-linejoin="round"/>

  <!-- Solution box -->
  <rect x="282" y="90" width="202" height="220" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="383" y="122" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">solution</text>

  <!-- rain cloud -->
  <path d="M330 168 q-14 -4 -14 -22 a16 16 0 0 1 10 -14 a22 22 0 0 1 42 -4 a18 18 0 0 1 30 8 a18 18 0 0 1 4 22 q8 0 8 12 z" fill="#c9d6df" stroke="#2b3a42" stroke-width="2"/>
  <path d="M334 186 L334 200 M350 186 L350 200 M366 186 L366 200 M382 186 L382 200" stroke="#6b93b6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- rain barrel -->
  <rect x="344" y="224" width="78" height="70" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="383" cy="224" rx="39" ry="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <path d="M352 224 L356 210 M414 224 L410 210" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M360 234 L360 224 M372 234 L372 224 M384 234 L384 224" stroke="#2b3a42" stroke-width="1.5"/>

  <text x="383" y="312" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">a community rain barrel</text>

  <text x="256" y="368" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2b3a42">First the problem, then the answer — and hope.</text>
</svg>
