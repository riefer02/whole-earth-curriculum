<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Complex Numbers</title>
  <desc id="desc">A complex plane with a horizontal real axis and vertical imaginary axis, the point a plus b i plotted, and a small table showing i squared equals negative one and that multiplying a plus b i by its conjugate a minus b i gives a squared plus b squared.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Complex Numbers: a Second Dimension</text>

  <!-- Axes -->
  <line x1="40" y1="260" x2="320" y2="260" stroke="#2b3a42" stroke-width="2"/>
  <line x1="180" y1="60" x2="180" y2="430" stroke="#2b3a42" stroke-width="2"/>
  <polygon points="320,260 308,255 308,265" fill="#2b3a42"/>
  <polygon points="180,60 175,72 185,72" fill="#2b3a42"/>
  <text x="306" y="286" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">Re</text>
  <text x="192" y="70" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">Im</text>

  <!-- Point a + bi -->
  <text x="270" y="214" font-family="sans-serif" font-size="16" fill="#e0a458" font-weight="bold">a + bi</text>
  <circle cx="252" cy="196" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="180" y1="196" x2="252" y2="196" stroke="#4f6d7a" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="252" y1="260" x2="252" y2="196" stroke="#4f6d7a" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="210" y="278" font-family="sans-serif" font-size="13" fill="#4f6d7a">a (real part)</text>
  <text x="262" y="232" font-family="sans-serif" font-size="13" fill="#4f6d7a">b (imaginary part)</text>

  <!-- Ticks -->
  <g stroke="#2b3a42" stroke-width="1.5">
    <line x1="180" y1="260" x2="180" y2="266"/>
    <line x1="216" y1="256" x2="216" y2="264"/>
    <line x1="252" y1="256" x2="252" y2="264"/>
    <line x1="288" y1="256" x2="288" y2="264"/>
    <line x1="174" y1="260" x2="186" y2="260"/>
    <line x1="174" y1="224" x2="186" y2="224"/>
    <line x1="174" y1="188" x2="186" y2="188"/>
  </g>
  <text x="180" y="282" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">0</text>

  <!-- Rules table -->
  <g font-family="sans-serif" font-size="15" fill="#222222">
    <rect x="348" y="88" width="148" height="44" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="422" y="116" text-anchor="middle">i&#178; = &#8722;1</text>
    <rect x="348" y="144" width="148" height="44" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="422" y="160" text-anchor="middle" font-size="12">x&#178; = &#8722;4</text>
    <text x="422" y="178" text-anchor="middle" font-size="12">&#8658; x = 2i or &#8722;2i</text>
    <rect x="348" y="200" width="148" height="56" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="422" y="220" text-anchor="middle" font-size="12">(a + bi)(a &#8722; bi)</text>
    <text x="422" y="238" text-anchor="middle" font-size="12">= a&#178; + b&#178;</text>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">New numbers arise when real problems need them &#8212; not from a rule someone merely liked.</text>
</svg>
