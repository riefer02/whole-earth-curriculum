<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Science and Culture, Side by Side</title>
  <desc id="desc">Two equal columns — a scientific account and a cultural or spiritual account — each asking a different question, with a shared row below showing how they relate without one ranked above the other.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Two Accounts, Held Side by Side</text>

  <rect x="36" y="66" width="210" height="270" rx="8" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <text x="141" y="96" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42" font-weight="bold">Scientific account</text>
  <text x="52" y="130" font-family="sans-serif" font-size="14" fill="#4f6d7a">Asks:</text>
  <text x="52" y="152" font-family="sans-serif" font-size="14" fill="#222222">"How does it work?"</text>
  <text x="52" y="188" font-family="sans-serif" font-size="14" fill="#4f6d7a">Offers:</text>
  <text x="52" y="210" font-family="sans-serif" font-size="14" fill="#222222">mechanism, evidence,</text>
  <text x="52" y="230" font-family="sans-serif" font-size="14" fill="#222222">prediction</text>

  <rect x="266" y="66" width="210" height="270" rx="8" fill="none" stroke="#e0a458" stroke-width="3"/>
  <text x="371" y="96" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42" font-weight="bold">Cultural / spiritual account</text>
  <text x="282" y="130" font-family="sans-serif" font-size="14" fill="#4f6d7a">Asks:</text>
  <text x="282" y="152" font-family="sans-serif" font-size="14" fill="#222222">"What is it to us?"</text>
  <text x="282" y="188" font-family="sans-serif" font-size="14" fill="#4f6d7a">Offers:</text>
  <text x="282" y="210" font-family="sans-serif" font-size="14" fill="#222222">meaning, duty,</text>
  <text x="282" y="230" font-family="sans-serif" font-size="14" fill="#222222">belonging</text>

  <rect x="36" y="356" width="440" height="100" rx="8" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="256" y="386" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42" font-weight="bold">How they relate</text>
  <text x="256" y="412" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">They answer different questions — neither ranked above the other.</text>
  <text x="256" y="436" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Two-eyed seeing: look with both.</text>

  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">Hold both with dignity — never as creed.</text>
</svg>
