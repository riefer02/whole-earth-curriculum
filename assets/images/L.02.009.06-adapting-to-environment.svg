<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Living in a very different environment</title>
  <desc id="desc">Three panels show how people adapt to very different environments. The desert panel shows a hot sun, a tent, and a person in a long, loose robe. The coast panel shows a house on stilts near the water with a small canoe. The cold region panel shows a snow house and a person in warm clothing under a low sun. Each panel is labeled desert, coast, or cold region. The labels and the shapes — not color — carry the meaning, so the picture prints clearly in grayscale and teaches that people adapt cleverly to each place.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Living in a Very Different Environment</text>
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Each place asks something &#183; people answer with knowledge</text>

  <!-- desert panel -->
  <rect x="26" y="96" width="146" height="220" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="99" y="122" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">desert</text>
  <circle cx="70" cy="150" r="17" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#e0a458" stroke-width="2" stroke-linecap="round">
    <line x1="70" y1="124" x2="70" y2="116"/>
    <line x1="48" y1="134" x2="42" y2="130"/>
    <line x1="92" y1="134" x2="98" y2="130"/>
  </g>
  <path d="M48 240 L99 200 L150 240 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <line x1="48" y1="240" x2="150" y2="240" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="120" cy="262" r="10" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M108 260 A10 10 0 0 1 132 260 Z" fill="#2b3a42"/>
  <rect x="112" y="272" width="16" height="30" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="99" y="310" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">light robe &#183; tent &#183; know the wells</text>

  <!-- coast panel -->
  <rect x="182" y="96" width="146" height="220" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="255" y="122" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">coast</text>
  <rect x="222" y="140" width="60" height="46" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M206 152 L222 136 L238 152 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <line x1="232" y1="186" x2="232" y2="224" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  <line x1="248" y1="186" x2="248" y2="224" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  <path d="M196 232 Q226 220 256 232 Q286 244 316 232" fill="none" stroke="#6b93b6" stroke-width="3" stroke-linecap="round"/>
  <path d="M216 262 L240 288 L200 288 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M244 288 L260 282 L252 294 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="255" y="310" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">boat &#183; house on stilts &#183; read the tide</text>

  <!-- cold region panel -->
  <rect x="338" y="96" width="146" height="220" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="411" y="122" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">cold region</text>
  <circle cx="432" cy="152" r="14" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M396 232 A40 40 0 0 1 476 232 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <rect x="412" y="216" width="20" height="20" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="362" cy="262" r="11" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M350 260 A11 11 0 0 1 374 260 Z" fill="#4f6d7a"/>
  <path d="M352 262 Q362 268 372 262" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="352" y="273" width="20" height="30" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="411" y="310" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">warm parka &#183; snow home &#183; kayak</text>

  <text x="256" y="376" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Clothing &#183; shelter &#183; travel &#183; clever fits for each place</text>
  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Deserts, coasts, and cold regions are homes, not problems</text>
  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Adapting is a human gift</text>
</svg>
