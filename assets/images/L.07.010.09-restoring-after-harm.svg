<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Three restorative steps</title>
  <desc id="desc">A three-step circular flow: listen, take responsibility, repair. Beneath each step are three guiding questions — what happened, who was harmed, how do we make it right — connected by arrows showing the steps follow one another.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Three restorative steps</text>

  <!-- step 1 -->
  <rect x="40" y="150" width="140" height="72" rx="10" fill="#7a9e7e" opacity="0.35" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="110" y="182" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">1 · listen</text>
  <text x="110" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">what happened?</text>

  <!-- step 2 -->
  <rect x="186" y="150" width="140" height="72" rx="10" fill="#e0a458" opacity="0.45" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="182" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">2 · take responsibility</text>
  <text x="256" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">who was harmed?</text>

  <!-- step 3 -->
  <rect x="332" y="150" width="140" height="72" rx="10" fill="#6b93b6" opacity="0.3" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="402" y="182" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">3 · repair</text>
  <text x="402" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">how do we make it right?</text>

  <!-- arrows -->
  <line x1="180" y1="186" x2="186" y2="186" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arr3)"/>
  <line x1="326" y1="186" x2="332" y2="186" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arr3)"/>

  <defs>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b3a42"/>
    </marker>
  </defs>

  <!-- a circle of people below -->
  <circle cx="110" cy="360" r="14" fill="#d9a066" stroke="#2b3a42" stroke-width="2.5"/>
  <circle cx="180" cy="352" r="14" fill="#d9a066" stroke="#2b3a42" stroke-width="2.5"/>
  <circle cx="256" cy="360" r="14" fill="#d9a066" stroke="#2b3a42" stroke-width="2.5"/>
  <circle cx="332" cy="352" r="14" fill="#d9a066" stroke="#2b3a42" stroke-width="2.5"/>
  <circle cx="402" cy="360" r="14" fill="#d9a066" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="124" y1="360" x2="166" y2="352" stroke="#2b3a42" stroke-width="2"/>
  <line x1="194" y1="352" x2="242" y2="360" stroke="#2b3a42" stroke-width="2"/>
  <line x1="270" y1="360" x2="318" y2="352" stroke="#2b3a42" stroke-width="2"/>
  <line x1="346" y1="352" x2="388" y2="360" stroke="#2b3a42" stroke-width="2"/>

  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">Everyone affected is heard, and harm is faced and repaired.</text>
  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Restoration makes a way forward — it does not pretend nothing happened.</text>
</svg>
