<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Restorative justice vs. punishment</title>
  <desc id="desc">A two-column comparison. The left column, labeled "restorative justice," shows a circle of figures talking while one figure hands back a repaired item, with "aim: repair the harm and meet needs" and "limit: takes time and everyone's willingness." The right column, labeled "punishment," shows a figure receiving a consequence, with "aim: a clear consequence for the wrong" and "limit: the harm and the harmed person's needs may not be repaired." A caption reads "both aim to respond to harm — differently." Labels, shapes, and the scenes carry the meaning, so it prints clearly in grayscale independent of color.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Restorative Justice vs. Punishment</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">two responses to harm &#8212; each with aims and limits</text>

  <!-- Left column: restorative justice -->
  <rect x="20" y="84" width="228" height="398" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="134" y="114" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">restorative justice</text>
  <!-- talking circle + handing back repaired item -->
  <g>
    <circle cx="100" cy="172" r="13" fill="#8a5a3b" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="168" cy="162" r="13" fill="#c98a5b" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="150" cy="200" r="13" fill="#d9a05b" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="134" cy="182" r="22" fill="none" stroke="#4f6d7a" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>
  <path d="M120 200 Q134 216 152 200 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="134" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">meet, listen, take responsibility,</text>
  <text x="134" y="256" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">and repair the harm</text>
  <rect x="32" y="276" width="204" height="76" rx="8" fill="#ffffff" stroke="#7a9e7e" stroke-width="1.5"/>
  <text x="134" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">aim:</text>
  <text x="134" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">repair the harm and</text>
  <text x="134" y="334" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">meet needs</text>
  <rect x="32" y="364" width="204" height="92" rx="8" fill="#ffffff" stroke="#e0a458" stroke-width="1.5"/>
  <text x="134" y="388" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">limit:</text>
  <text x="134" y="406" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">takes time, and</text>
  <text x="134" y="424" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">everyone&#8217;s</text>
  <text x="134" y="442" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">willingness</text>

  <!-- Right column: punishment -->
  <rect x="264" y="84" width="228" height="398" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="378" y="114" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">punishment</text>
  <!-- figure receiving a consequence -->
  <circle cx="378" cy="176" r="15" fill="#c98a5b" stroke="#2b3a42" stroke-width="2"/>
  <rect x="362" y="191" width="32" height="34" rx="6" fill="#c9d6df" stroke="#2b3a42" stroke-width="2"/>
  <rect x="330" y="232" width="96" height="34" rx="8" fill="#eef3f6" stroke="#4f6d7a" stroke-width="2"/>
  <text x="378" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">&#8220;you lose a turn&#8221;</text>
  <rect x="276" y="276" width="204" height="76" rx="8" fill="#ffffff" stroke="#7a9e7e" stroke-width="1.5"/>
  <text x="378" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">aim:</text>
  <text x="378" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">a clear consequence</text>
  <text x="378" y="334" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">for the wrong</text>
  <rect x="276" y="364" width="204" height="92" rx="8" fill="#ffffff" stroke="#e0a458" stroke-width="1.5"/>
  <text x="378" y="388" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">limit:</text>
  <text x="378" y="406" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">the harm, and the</text>
  <text x="378" y="424" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">harmed person&#8217;s needs,</text>
  <text x="378" y="442" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">may not be repaired</text>

  <text x="256" y="500" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">Both aim to respond to harm &#8212; differently. Which fits this harm? Hold it open.</text>
</svg>
