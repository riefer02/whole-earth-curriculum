<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Texts from many cultures and times</title>
  <desc id="desc">Three panels side by side. Left: a frog at a pond labeled "Bashō, Japan, 1680s". Middle: a reed flute labeled "Rumi, Persia, 1200s". Right: a person speaking to a small seated group labeled "Sundiata, West Africa, oral tradition". A bottom line reads "each text reflects the culture and time that made it".</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">Texts from many cultures and times</text>

  <!-- panel 1 -->
  <rect x="24" y="74" width="144" height="230" rx="10" fill="#7a9e7e" opacity="0.4" stroke="#2b3a42" stroke-width="2.5"/>
  <ellipse cx="96" cy="150" rx="52" ry="22" fill="#6b93b6" opacity="0.5" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="70" cy="140" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="80" cy="136" r="2.5" fill="#222222"/>
  <path d="M96,172 C90,168 88,162 92,158" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <text x="96" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">Bashō</text>
  <text x="96" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">Japan, 1680s</text>
  <text x="96" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">haiku — one instant</text>
  <text x="96" y="284" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">old pond — frog —</text>
  <text x="96" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">sound of water</text>

  <!-- panel 2 -->
  <rect x="184" y="74" width="144" height="230" rx="10" fill="#e0a458" opacity="0.5" stroke="#2b3a42" stroke-width="2.5"/>
  <rect x="228" y="128" width="12" height="70" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="234" cy="122" r="5" fill="#222222"/>
  <circle cx="234" cy="140" r="3" fill="#222222"/>
  <circle cx="234" cy="156" r="3" fill="#222222"/>
  <circle cx="234" cy="172" r="3" fill="#222222"/>
  <text x="256" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">Rumi</text>
  <text x="256" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">Persia, 1200s</text>
  <text x="256" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">mystic verse — longing</text>
  <text x="256" y="284" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">listen to the reed,</text>
  <text x="256" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">how it tells of parting</text>

  <!-- panel 3 -->
  <rect x="344" y="74" width="144" height="230" rx="10" fill="#6b93b6" opacity="0.4" stroke="#2b3a42" stroke-width="2.5"/>
  <circle cx="386" cy="132" r="14" fill="#e0a458" opacity="0.8" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="414" cy="140" r="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="444" cy="140" r="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="428" cy="156" r="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="416" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">the griot</text>
  <text x="416" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">West Africa</text>
  <text x="416" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">oral tradition — memory</text>
  <text x="416" y="284" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">I keep the history</text>
  <text x="416" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">of my people by word</text>

  <text x="256" y="356" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Each text reflects the culture and time that made it.</text>
  <text x="256" y="384" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">form · subject · purpose — three windows into its world</text>
</svg>
