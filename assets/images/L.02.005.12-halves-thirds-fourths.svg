<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Halves, thirds, and fourths</title>
  <desc id="desc">A circle and a rectangle, each partitioned into two, three, and four equal parts, with each part labeled one half, one third, and one fourth.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Equal Shares</text>

  <!-- Circle halves -->
  <text x="128" y="80" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#4f6d7a">halves</text>
  <circle cx="128" cy="160" r="60" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <line x1="128" y1="100" x2="128" y2="220" stroke="#2b3a42" stroke-width="3"/>
  <text x="128" y="252" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">2 equal parts</text>
  <text x="128" y="274" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">one half</text>

  <!-- Circle thirds -->
  <text x="256" y="80" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#4f6d7a">thirds</text>
  <circle cx="256" cy="160" r="60" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
  <line x1="256" y1="100" x2="256" y2="220" stroke="#2b3a42" stroke-width="3"/>
  <line x1="204" y1="130" x2="308" y2="190" stroke="#2b3a42" stroke-width="3"/>
  <line x1="308" y1="130" x2="204" y2="190" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="252" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">3 equal parts</text>
  <text x="256" y="274" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">one third</text>

  <!-- Circle fourths -->
  <text x="384" y="80" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#4f6d7a">fourths</text>
  <circle cx="384" cy="160" r="60" fill="#6b93b6" stroke="#2b3a42" stroke-width="3"/>
  <line x1="384" y1="100" x2="384" y2="220" stroke="#2b3a42" stroke-width="3"/>
  <line x1="324" y1="160" x2="444" y2="160" stroke="#2b3a42" stroke-width="3"/>
  <text x="384" y="252" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">4 equal parts</text>
  <text x="384" y="274" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">one fourth</text>

  <!-- Rectangle halves -->
  <text x="128" y="318" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#4f6d7a">halves</text>
  <rect x="78" y="336" width="100" height="66" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <line x1="128" y1="336" x2="128" y2="402" stroke="#2b3a42" stroke-width="3"/>
  <text x="128" y="430" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">2 equal parts</text>

  <!-- Rectangle thirds -->
  <text x="256" y="318" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#4f6d7a">thirds</text>
  <rect x="206" y="336" width="100" height="66" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
  <line x1="239" y1="336" x2="239" y2="402" stroke="#2b3a42" stroke-width="3"/>
  <line x1="273" y1="336" x2="273" y2="402" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">3 equal parts</text>

  <!-- Rectangle fourths -->
  <text x="384" y="318" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#4f6d7a">fourths</text>
  <rect x="334" y="336" width="100" height="66" fill="#6b93b6" stroke="#2b3a42" stroke-width="3"/>
  <line x1="359" y1="336" x2="359" y2="402" stroke="#2b3a42" stroke-width="3"/>
  <line x1="384" y1="336" x2="384" y2="402" stroke="#2b3a42" stroke-width="3"/>
  <line x1="409" y1="336" x2="409" y2="402" stroke="#2b3a42" stroke-width="3"/>
  <text x="384" y="430" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">4 equal parts</text>

  <text x="256" y="476" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#2b3a42">More equal parts → each share is smaller.</text>
</svg>
