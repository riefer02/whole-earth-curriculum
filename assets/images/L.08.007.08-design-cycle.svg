<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The design and prototype cycle</title>
  <desc id="desc">A circular loop of six steps for designing and making a prototype: ask, imagine, plan, create, test, and improve, with arrows showing the cycle repeats through testing and feedback.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Design &amp; Prototype Cycle</text>

  <!-- ask -->
  <rect x="178" y="80" width="156" height="60" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="200" cy="102" r="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="218" y="108" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Ask</text>
  <text x="190" y="128" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">what problem, for whom?</text>

  <!-- imagine -->
  <rect x="336" y="164" width="150" height="60" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="358" cy="186" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="192" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Imagine</text>
  <text x="348" y="212" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">many possible ideas</text>

  <!-- plan -->
  <rect x="336" y="300" width="150" height="60" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="358" cy="322" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="328" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Plan</text>
  <text x="348" y="348" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">choose one, list steps</text>

  <!-- create -->
  <rect x="178" y="368" width="156" height="60" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="200" cy="390" r="9" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="218" y="396" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Create</text>
  <text x="190" y="416" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">build a working prototype</text>

  <!-- test -->
  <rect x="22" y="300" width="150" height="60" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="44" cy="322" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="62" y="328" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Test</text>
  <text x="34" y="348" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">try it, get feedback</text>

  <!-- improve -->
  <rect x="22" y="164" width="150" height="60" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="44" cy="186" r="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="62" y="192" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Improve</text>
  <text x="34" y="212" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">revise, then test again</text>

  <!-- connectors (cycle) -->
  <path d="M256 140 L340 176" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M411 224 L411 260 L340 292" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M256 368 L256 360 L172 360 L172 380" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M97 300 L97 224" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M172 194 L172 224" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M22 252 L22 260 L97 260" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M172 300 L160 300" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M256 428 L256 428" fill="none" stroke="#4f6d7a" stroke-width="2"/>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">A prototype is a first try, made to be revised</text>
</svg>
