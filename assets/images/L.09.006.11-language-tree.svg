<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Language loss and revitalization</title>
  <desc id="desc">A tree whose roots are labeled with languages. Some branches are faded and bare, marked lost, while others are green and regrowing, marked revitalized. Small plant and animal shapes beside the tree show that languages carry knowledge of the living world.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Languages, Like Roots, Can Be Lost — and Regrown</text>

  <!-- tree trunk -->
  <rect x="242" y="180" width="28" height="150" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  <!-- crown branches: some lost, some alive -->
  <g stroke="#2b3a42" stroke-width="3" fill="none">
    <path d="M256 190 C 200 150, 150 140, 120 90"/>
    <path d="M256 190 C 300 140, 360 150, 400 100"/>
    <path d="M256 190 C 240 150, 210 120, 200 70"/>
    <path d="M256 190 C 280 160, 330 140, 360 90"/>
  </g>

  <!-- faded (lost) branch leaves -->
  <g fill="#c9c4b8" stroke="#8a8577" stroke-width="1.5">
    <ellipse cx="122" cy="84" rx="16" ry="8"/>
    <ellipse cx="200" cy="64" rx="14" ry="7"/>
  </g>
  <text x="150" y="66" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#6f6a5e">lost</text>

  <!-- green (revitalized) branch leaves -->
  <g fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5">
    <ellipse cx="400" cy="94" rx="16" ry="8"/>
    <ellipse cx="360" cy="84" rx="14" ry="7"/>
    <ellipse cx="250" cy="120" rx="12" ry="6"/>
  </g>
  <text x="392" y="70" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#2b3a42">regrown</text>

  <!-- roots labeled languages -->
  <g stroke="#2b3a42" stroke-width="3" fill="none">
    <path d="M250 330 C 220 360, 190 380, 150 410"/>
    <path d="M256 330 C 256 370, 250 400, 256 430"/>
    <path d="M262 330 C 300 360, 330 390, 370 410"/>
  </g>
  <text x="150" y="436" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">a language</text>
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">a language</text>
  <text x="372" y="436" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">a language</text>

  <!-- living world: plant and animal -->
  <g stroke="#2b3a42" stroke-width="1.5" fill="#7a9e7e">
    <rect x="70" y="330" width="6" height="30"/>
    <circle cx="73" cy="324" r="10"/>
  </g>
  <g stroke="#2b3a42" stroke-width="1.5" fill="#e0a458">
    <ellipse cx="440" cy="330" rx="14" ry="9"/>
    <circle cx="450" cy="322" r="5"/>
  </g>

  <text x="256" y="482" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">When a language is lost, its names for plants, animals, and places go with it</text>
</svg>
