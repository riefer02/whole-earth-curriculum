<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Measuring a pencil in centimeters</title>
  <desc id="desc">A pencil lying along a ruler marked in centimeters, with its left end at zero and its right end at twelve, showing the pencil is twelve centimeters long.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Measure With a Ruler</text>

  <!-- Pencil -->
  <rect x="40" y="150" width="240" height="34" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <polygon points="280,158 280,176 316,167" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="40" y="150" width="14" height="34" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>

  <!-- Ruler -->
  <rect x="40" y="220" width="360" height="60" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="40" y1="220" x2="40" y2="244"/>
    <line x1="70" y1="220" x2="70" y2="232"/>
    <line x1="100" y1="220" x2="100" y2="232"/>
    <line x1="130" y1="220" x2="130" y2="232"/>
    <line x1="160" y1="220" x2="160" y2="232"/>
    <line x1="190" y1="220" x2="190" y2="232"/>
    <line x1="220" y1="220" x2="220" y2="232"/>
    <line x1="250" y1="220" x2="250" y2="232"/>
    <line x1="280" y1="220" x2="280" y2="244"/>
    <line x1="310" y1="220" x2="310" y2="232"/>
    <line x1="340" y1="220" x2="340" y2="232"/>
    <line x1="370" y1="220" x2="370" y2="232"/>
    <line x1="400" y1="220" x2="400" y2="232"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#4f6d7a" text-anchor="middle">
    <text x="40" y="262">0</text>
    <text x="70" y="262">1</text>
    <text x="100" y="262">2</text>
    <text x="130" y="262">3</text>
    <text x="160" y="262">4</text>
    <text x="190" y="262">5</text>
    <text x="220" y="262">6</text>
    <text x="250" y="262">7</text>
    <text x="280" y="262">8</text>
    <text x="310" y="262">9</text>
    <text x="340" y="262">10</text>
    <text x="370" y="262">11</text>
    <text x="400" y="262">12</text>
  </g>

  <!-- line-up hint -->
  <line x1="40" y1="120" x2="40" y2="210" stroke="#c0504d" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="40" y="112" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#c0504d">line up the end at 0</text>

  <!-- Result -->
  <rect x="120" y="320" width="272" height="76" rx="12" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
  <text x="256" y="350" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42">The pencil is</text>
  <text x="256" y="384" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#e0a458">12 centimeters long</text>

  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#4f6d7a">A centimeter is the same for everyone, everywhere.</text>
</svg>
