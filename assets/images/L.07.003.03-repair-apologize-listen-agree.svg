<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">The repair conversation: three steps</title>
  <desc id="d">Three rounded boxes connected by arrows, left to right. Step one, apologize: a figure with an open, sincere posture saying "I'm sorry for...". Step two, listen: the same two figures, one speaking while the other listens, saying "how did it feel for you?". Step three, agree on next steps: two figures shaking hands over a small shared note reading "next time we will...".</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="50" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">The repair conversation</text>

  <!-- Step 1 -->
  <g>
    <rect x="22" y="92" width="140" height="150" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="92" cy="142" r="22" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="86" cy="138" r="2.5" fill="#2b3a42"/>
    <circle cx="98" cy="138" r="2.5" fill="#2b3a42"/>
    <path d="M86 150 Q92 154 98 150" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M92 164 L92 196" stroke="#2b3a42" stroke-width="2"/>
    <path d="M92 196 L74 226 M92 196 L110 226" stroke="#2b3a42" stroke-width="2"/>
    <text x="92" y="112" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#e0a458">1 · APOLOGIZE</text>
    <text x="92" y="246" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">"I'm sorry for…"</text>
  </g>
  <path d="M168 167 L196 167 M188 160 L196 167 L188 174" fill="none" stroke="#2b3a42" stroke-width="3"/>

  <!-- Step 2 -->
  <g>
    <rect x="196" y="92" width="140" height="150" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="238" cy="142" r="22" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="232" cy="138" r="2.5" fill="#2b3a42"/>
    <circle cx="244" cy="138" r="2.5" fill="#2b3a42"/>
    <path d="M232 152 Q238 148 244 152" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M238 164 L238 196" stroke="#2b3a42" stroke-width="2"/>
    <path d="M238 196 L220 226 M238 196 L256 226" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="282" cy="142" r="22" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="276" cy="138" r="2.5" fill="#2b3a42"/>
    <circle cx="288" cy="138" r="2.5" fill="#2b3a42"/>
    <path d="M276 152 Q282 148 288 152" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M282 164 L282 196" stroke="#2b3a42" stroke-width="2"/>
    <path d="M282 196 L264 226 M282 196 L300 226" stroke="#2b3a42" stroke-width="2"/>
    <text x="266" y="112" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#e0a458">2 · LISTEN</text>
    <text x="266" y="246" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">"How did it feel for you?"</text>
  </g>
  <path d="M342 167 L370 167 M362 160 L370 167 L362 174" fill="none" stroke="#2b3a42" stroke-width="3"/>

  <!-- Step 3 -->
  <g>
    <rect x="370" y="92" width="120" height="150" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="414" cy="142" r="20" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="446" cy="142" r="20" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M430 154 L446 142" stroke="#2b3a42" stroke-width="3"/>
    <text x="430" y="112" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#e0a458">3 · AGREE</text>
    <text x="430" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">"Next time</text>
    <text x="430" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">we will…"</text>
  </g>

  <text x="256" y="290" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">Repair is not erasing what happened — it is naming it,</text>
  <text x="256" y="314" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">hearing the hurt, and choosing a different next step.</text>
</svg>
