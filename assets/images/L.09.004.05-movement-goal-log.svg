<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A movement goal planner and tracking log</title>
  <desc id="desc">A planner with a worked example goal: walk or roll outside three times a week, starting at ten minutes. It lists a reason (more afternoon energy and a clearer head), a start point, small steps for weeks one through three, and a note on what to do if a week is missed. A weekly tracking table records each day done and one word for how it felt.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">A Movement Goal I Own</text>
  <text x="256" y="62" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Built on what my body can do and feel — never on weight or appearance.</text>

  <!-- goal box -->
  <rect x="28" y="84" width="456" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="44" y="108" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Goal</text>
  <text x="44" y="128" font-family="sans-serif" font-size="13" fill="#222222">walk or roll outside three times a week, starting at ten minutes</text>
  <text x="44" y="152" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Reason</text>
  <text x="44" y="172" font-family="sans-serif" font-size="13" fill="#222222">more afternoon energy and a clearer head before I study</text>
  <text x="44" y="196" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Small steps</text>
  <text x="44" y="216" font-family="sans-serif" font-size="12.5" fill="#222222">week 1: two walks &#183; week 2: three &#183; week 3: three, a little longer if it feels good</text>
  <text x="44" y="232" font-family="sans-serif" font-size="12" fill="#4f6d7a">If I miss a week: restart smaller — no blame, no quitting.</text>

  <!-- tracking log -->
  <text x="44" y="268" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Tracking log</text>
  <rect x="28" y="280" width="456" height="150" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="1.5"/>
  <!-- header -->
  <rect x="28" y="280" width="456" height="28" rx="10" fill="#2b3a42"/>
  <text x="92" y="299" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fdfbf7">Mon</text>
  <text x="156" y="299" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fdfbf7">Tue</text>
  <text x="220" y="299" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fdfbf7">Wed</text>
  <text x="284" y="299" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fdfbf7">Thu</text>
  <text x="348" y="299" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fdfbf7">Fri</text>
  <text x="412" y="299" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fdfbf7">Sat/Sun</text>

  <!-- week 1 -->
  <text x="44" y="336" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">Week 1</text>
  <circle cx="92" cy="333" r="11" fill="#ffffff" stroke="#7a9e7e" stroke-width="2"/>
  <circle cx="156" cy="333" r="11" fill="#7a9e7e"/>
  <circle cx="220" cy="333" r="11" fill="#ffffff" stroke="#7a9e7e" stroke-width="2"/>
  <circle cx="284" cy="333" r="11" fill="#7a9e7e"/>
  <circle cx="348" cy="333" r="11" fill="#ffffff" stroke="#7a9e7e" stroke-width="2"/>
  <circle cx="412" cy="333" r="11" fill="#ffffff" stroke="#7a9e7e" stroke-width="2"/>
  <text x="284" y="364" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">done</text>

  <!-- week 2 -->
  <text x="44" y="392" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">Week 2</text>
  <circle cx="92" cy="389" r="11" fill="#7a9e7e"/>
  <circle cx="156" cy="389" r="11" fill="#ffffff" stroke="#7a9e7e" stroke-width="2"/>
  <circle cx="220" cy="389" r="11" fill="#7a9e7e"/>
  <circle cx="284" cy="389" r="11" fill="#ffffff" stroke="#7a9e7e" stroke-width="2"/>
  <circle cx="348" cy="389" r="11" fill="#7a9e7e"/>
  <circle cx="412" cy="389" r="11" fill="#ffffff" stroke="#7a9e7e" stroke-width="2"/>
  <text x="156" y="420" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">one word: how it felt</text>

  <text x="256" y="474" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">I am the owner of this goal, not its employee.</text>
  <text x="256" y="494" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">A missed week is information, not a verdict.</text>
</svg>
