<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t-l0500102 d-l0500102">
  <title id="t-l0500102">From a wonder to a testable question</title>
  <desc id="d-l0500102">A wonder card at the top asks why the seedlings lean. Three ladder rungs below ask what could I change, what could I measure, and what would I keep the same. A bottom card turns the wonder into the question: do seedlings lean towards light in five days? Arrows join the parts.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">From Wonder to Testable Question</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">sharpen the wonder, keep the wonder</text>

  <!-- wonder card -->
  <rect x="66" y="88" width="380" height="56" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="114" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">a wonder</text>
  <text x="256" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">Why do the seedlings lean?</text>

  <!-- arrows -->
  <line x1="256" y1="144" x2="256" y2="172" stroke="#4f6d7a" stroke-width="2"/>
  <polygon points="256,178 250,166 262,166" fill="#4f6d7a"/>

  <!-- three rungs -->
  <rect x="66" y="180" width="380" height="48" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="94" cy="204" r="14" fill="#7a9e7e"/>
  <text x="94" y="209" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="120" y="210" font-family="sans-serif" font-size="14" fill="#222222">What could I change?</text>

  <line x1="256" y1="228" x2="256" y2="236" stroke="#4f6d7a" stroke-width="2"/>

  <rect x="66" y="240" width="380" height="48" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="94" cy="264" r="14" fill="#7a9e7e"/>
  <text x="94" y="269" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="120" y="270" font-family="sans-serif" font-size="14" fill="#222222">What could I measure?</text>

  <line x1="256" y1="288" x2="256" y2="296" stroke="#4f6d7a" stroke-width="2"/>

  <rect x="66" y="300" width="380" height="48" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="94" cy="324" r="14" fill="#7a9e7e"/>
  <text x="94" y="329" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="120" y="330" font-family="sans-serif" font-size="14" fill="#222222">What would I keep the same?</text>

  <!-- arrow to result -->
  <line x1="256" y1="348" x2="256" y2="372" stroke="#4f6d7a" stroke-width="2"/>
  <polygon points="256,378 250,366 262,366" fill="#4f6d7a"/>

  <!-- result card -->
  <rect x="46" y="382" width="420" height="64" rx="10" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
  <text x="256" y="406" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">a testable question</text>
  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">Do seedlings lean towards light in five days?</text>

  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">It has more than one possible answer.</text>
</svg>
