<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My home language is a treasure</title>
  <desc id="desc">A treasure chest with its lid open spills out word cards, each holding a word for "love" from a different language and script, all equal in size: "amor" (Spanish), "حب" (Arabic), "प्यार" (Devanagari), "爱" (Chinese), and "amour" (French). Beside the chest, a small speech bubble with sound lines and two hands signing show that a home language may be spoken or signed and need not be written at all. The caption reads "every language is a treasure — spoken, signed, or written." The labels and shapes carry the meaning, so the picture prints clearly in grayscale and teaches learners to name their home language and share its words with pride, with no language ranked above another.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">My Home Language Is a Treasure</text>

  <!-- treasure chest -->
  <g>
    <path d="M96 300 L96 372 Q96 388 112 388 L216 388 Q232 388 232 372 L232 300 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="88" y="280" width="152" height="28" rx="8" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <rect x="152" y="272" width="24" height="20" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="100" y="352" width="128" height="12" rx="4" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="164" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">word</text>
  <text x="164" y="334" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">treasure</text>

  <!-- spilling word cards -->
  <g>
    <rect x="246" y="250" width="86" height="52" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2" transform="rotate(-8 289 276)"/>
    <text x="289" y="282" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">amor</text>

    <rect x="290" y="316" width="86" height="52" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2" transform="rotate(6 333 342)"/>
    <text x="333" y="348" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans', 'Arial Unicode MS', sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">حب</text>

    <rect x="360" y="240" width="86" height="52" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2" transform="rotate(4 403 266)"/>
    <text x="403" y="272" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans', 'Arial Unicode MS', sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">प्यार</text>

    <rect x="388" y="330" width="86" height="52" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2" transform="rotate(-5 431 356)"/>
    <text x="431" y="362" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans', 'Arial Unicode MS', sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">爱</text>

    <rect x="238" y="382" width="86" height="52" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2" transform="rotate(7 281 408)"/>
    <text x="281" y="414" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">amour</text>
  </g>

  <!-- spoken / signed insets -->
  <rect x="24" y="408" width="216" height="70" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M48 442 Q48 428 62 428 L104 428 Q112 428 112 434 L112 448 Q112 454 104 454 L80 454 L74 460 L76 454 L62 454 Q48 454 48 448 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M132 434 Q142 428 150 434 M138 440 Q146 434 154 440 M144 446 Q150 440 158 446" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <text x="196" y="448" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">spoken</text>

  <rect x="272" y="408" width="216" height="70" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M296 448 L296 442 Q296 438 300 438 L312 438" fill="none" stroke="#c99567" stroke-width="4" stroke-linecap="round"/>
  <circle cx="296" cy="452" r="5" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M332 446 L328 438 M326 446 L320 438 M336 450 L342 444" stroke="#c99567" stroke-width="4" stroke-linecap="round"/>
  <text x="392" y="448" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">signed</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Every language is a treasure — spoken, signed, or written. None is better.</text>
</svg>
