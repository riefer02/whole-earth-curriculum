<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A feeling vocabulary wheel: basic, subtle, and secondary emotions</title>
  <desc id="desc">Three concentric rings. The innermost ring lists basic emotions such as joy, sadness, fear, and anger. The middle ring lists more precise or subtle emotions such as awe, nostalgia, longing, and resentment. The outermost ring lists secondary emotions, feelings about feelings, such as shame about jealousy or pride about courage.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">A Feeling Vocabulary Wheel</text>

  <!-- outer ring (secondary: feelings about feelings) -->
  <circle cx="256" cy="270" r="150" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="128" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#4f6d7a">Secondary — a feeling about a feeling</text>
  <text x="256" y="146" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">shame about jealousy · pride in courage</text>
  <text x="256" y="164" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">guilt about anger · relief after worry</text>

  <!-- middle ring (subtle) -->
  <circle cx="256" cy="270" r="106" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="206" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#2b3a42">Subtle</text>
  <text x="256" y="224" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">awe · nostalgia · longing</text>
  <text x="256" y="242" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">resentment · tenderness</text>
  <text x="256" y="260" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">envy · gratitude</text>

  <!-- inner ring (basic) -->
  <circle cx="256" cy="270" r="64" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Basic</text>
  <text x="256" y="276" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">joy · sadness</text>
  <text x="256" y="294" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">fear · anger</text>

  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#2b3a42">More words, more precise: naming a feeling changes it.</text>
  <text x="256" y="484" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">There is no single right wheel — build your own.</text>
</svg>
