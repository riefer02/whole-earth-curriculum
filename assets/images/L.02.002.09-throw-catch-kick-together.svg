<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Throw, catch, and kick together</title>
  <desc id="desc">Three panels showing a ball moving between two friends. Throw: one child throws a ball with both hands to a friend. Catch: the friend catches with both hands. Kick: one child kicks the ball back to the friend. Arrows show the ball's path between the two children. Each panel is labeled with words, so it prints clearly in grayscale and the meaning does not depend on color.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">Throw, Catch, and Kick Together</text>

  <!-- ===== Throw panel ===== -->
  <g>
    <rect x="20" y="66" width="150" height="200" rx="14" fill="#ffffff" stroke="#7a9e7e" stroke-width="3"/>
    <text x="95" y="94" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">throw</text>
    <circle cx="62" cy="180" r="17" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <rect x="48" y="196" width="28" height="36" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="50" y1="204" x2="34" y2="200" stroke="#c99567" stroke-width="8" stroke-linecap="round"/>
    <line x1="74" y1="204" x2="90" y2="200" stroke="#c99567" stroke-width="8" stroke-linecap="round"/>
    <circle cx="62" cy="198" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M78 192 Q96 176 116 168" fill="none" stroke="#2b3a42" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M110 164 L116 168 L110 172" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- friend -->
    <circle cx="136" cy="166" r="13" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <rect x="126" y="178" width="20" height="26" rx="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="95" y="252" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">send it to a friend</text>
  </g>

  <!-- ===== Catch panel ===== -->
  <g>
    <rect x="181" y="66" width="150" height="200" rx="14" fill="#ffffff" stroke="#6b93b6" stroke-width="3"/>
    <text x="256" y="94" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">catch</text>
    <circle cx="216" cy="166" r="13" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <rect x="206" y="178" width="20" height="26" rx="7" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M232 172 Q252 180 268 190" fill="none" stroke="#2b3a42" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M262 186 L268 190 L262 194" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- friend catching -->
    <circle cx="290" cy="196" r="17" fill="#d9a066" stroke="#2b3a42" stroke-width="2"/>
    <rect x="276" y="212" width="28" height="36" rx="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="278" y1="218" x2="262" y2="214" stroke="#d9a066" stroke-width="8" stroke-linecap="round"/>
    <line x1="302" y1="218" x2="318" y2="214" stroke="#d9a066" stroke-width="8" stroke-linecap="round"/>
    <circle cx="290" cy="212" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="252" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">hands ready, eyes up</text>
  </g>

  <!-- ===== Kick panel ===== -->
  <g>
    <rect x="342" y="66" width="150" height="200" rx="14" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
    <text x="417" y="94" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">kick</text>
    <circle cx="372" cy="180" r="17" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <rect x="358" y="196" width="28" height="36" rx="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="360" y1="204" x2="348" y2="218" stroke="#8f5f3d" stroke-width="8" stroke-linecap="round"/>
    <line x1="382" y1="204" x2="396" y2="218" stroke="#8f5f3d" stroke-width="8" stroke-linecap="round"/>
    <line x1="366" y1="232" x2="360" y2="252" stroke="#4f6d7a" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="358" cy="256" rx="9" ry="4.5" fill="#2b3a42"/>
    <!-- ball -->
    <circle cx="408" cy="242" r="13" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M408 232 Q411 242 408 252" fill="none" stroke="#2b3a42" stroke-width="1.5"/>
    <path d="M424 242 L458 242" stroke="#2b3a42" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M452 236 L458 242 L452 248" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- friend receiving -->
    <circle cx="474" cy="242" r="12" fill="#d9a066" stroke="#2b3a42" stroke-width="2"/>
    <rect x="465" y="254" width="18" height="24" rx="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="417" y="252" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">kick it back with one foot</text>
  </g>

  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">A ball is more fun when we pass it to each other.</text>
</svg>
