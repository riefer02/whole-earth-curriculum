<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Kind and unkind choices, same situation</title>
  <desc id="desc">Two panels show the same everyday situation — two children and one ball — handled two ways. The first panel is labeled unkind choice: one child hugs the ball away while the other child stands empty-handed with a sad frown, and the caption says "unkind: one takes it all." The second panel is labeled kind choice: the same two children stand smiling and pass the ball between them, and the caption says "kind: we take turns." The labels, the sad-versus-smiling faces, and the ball's position, not color, carry the meaning, so the picture prints clearly in grayscale and teaches that "kind" and "unkind" name the choice we make, not the child — anyone can choose again.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Kind and Unkind Choices</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Same situation, two different choices</text>

  <!-- panels -->
  <rect x="20" y="86" width="226" height="286" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="266" y="86" width="226" height="286" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>

  <text x="133" y="112" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">unkind choice</text>
  <text x="379" y="112" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">kind choice</text>

  <!-- arrow between panels -->
  <line x1="250" y1="229" x2="260" y2="229" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <path d="M260 223 L267 229 L260 235 Z" fill="#4f6d7a"/>
  <text x="255" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">choose again</text>

  <!-- ===== Panel 1: one takes it all ===== -->
  <!-- ball -->
  <circle cx="92" cy="204" r="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M92 188 A16 16 0 0 1 108 204" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M92 188 A16 16 0 0 0 76 204" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <!-- child A (left, hugging ball, medium skin) -->
  <circle cx="88" cy="156" r="13" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M75 154 A13 13 0 0 1 101 154 Z" fill="#2b3a42"/>
  <circle cx="83" cy="156" r="1.6" fill="#2b3a42"/>
  <circle cx="93" cy="156" r="1.6" fill="#2b3a42"/>
  <path d="M83 163 Q88 167 93 163" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="78" y="170" width="20" height="34" rx="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="82" y1="204" x2="80" y2="232" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="94" y1="204" x2="96" y2="232" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <!-- arms hugging ball -->
  <path d="M78 184 Q70 192 74 202" fill="none" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <path d="M98 184 Q106 192 102 202" fill="none" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <!-- child B (right, empty hands, sad, light skin) -->
  <circle cx="190" cy="180" r="13" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M177 178 A13 13 0 0 1 203 178 Z" fill="#4f6d7a"/>
  <circle cx="185" cy="180" r="1.6" fill="#2b3a42"/>
  <circle cx="195" cy="180" r="1.6" fill="#2b3a42"/>
  <path d="M185 190 Q190 186 195 190" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="180" y="194" width="20" height="34" rx="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="184" y1="228" x2="182" y2="256" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="196" y1="228" x2="198" y2="256" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <!-- empty arms down -->
  <line x1="180" y1="206" x2="172" y2="230" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="200" y1="206" x2="208" y2="230" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <text x="133" y="348" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">one takes it all</text>

  <!-- ===== Panel 2: take turns ===== -->
  <!-- ball between them -->
  <circle cx="375" cy="216" r="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M375 200 A16 16 0 0 1 391 216" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M375 200 A16 16 0 0 0 359 216" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <!-- child A (left, passing ball, medium skin, smiling) -->
  <circle cx="326" cy="166" r="13" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M313 164 A13 13 0 0 1 339 164 Z" fill="#2b3a42"/>
  <circle cx="321" cy="166" r="1.6" fill="#2b3a42"/>
  <circle cx="331" cy="166" r="1.6" fill="#2b3a42"/>
  <path d="M321 172 Q326 177 331 172" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="316" y="180" width="20" height="34" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="320" y1="214" x2="318" y2="242" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="332" y1="214" x2="334" y2="242" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <!-- arm reaching with ball toward other child -->
  <line x1="336" y1="190" x2="360" y2="210" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <!-- child B (right, receiving, light skin, smiling) -->
  <circle cx="430" cy="188" r="13" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <path d="M417 186 A13 13 0 0 1 443 186 Z" fill="#4f6d7a"/>
  <circle cx="425" cy="188" r="1.6" fill="#2b3a42"/>
  <circle cx="435" cy="188" r="1.6" fill="#2b3a42"/>
  <path d="M425 194 Q430 199 435 194" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="420" y="202" width="20" height="34" rx="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="424" y1="236" x2="422" y2="264" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="436" y1="236" x2="438" y2="264" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <!-- arms open to receive -->
  <line x1="420" y1="212" x2="408" y2="224" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="440" y1="212" x2="408" y2="224" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <text x="379" y="348" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">we take turns</text>

  <text x="256" y="416" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">"Kind" and "unkind" name the choice, never the child.</text>
  <text x="256" y="442" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">A kind choice is always possible &#183; we can choose again</text>
</svg>
