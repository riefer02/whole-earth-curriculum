<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Atmosphere, oceans, and land shape climate and weather</title>
  <desc id="desc">A cross-section diagram of the climate system. The Sun shines on the atmosphere (with a greenhouse-gas layer), the ocean (with a looping current arrow), and the land (with mountains and a reflective surface). Arrows show energy moving: sunlight in, heat trapped, water evaporating from ocean to clouds, and wind moving. Labels explain that weather is day-to-day and climate is the long-term pattern. Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Atmosphere, Oceans, and Land</text>
  <text x="256" y="56" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">three parts, working together, shape climate and weather</text>

  <!-- Sun -->
  <circle cx="52" cy="92" r="20" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M52 62 v-8 M52 122 v8 M22 92 h-8 M82 92 h8 M31 71 l-6 -6 M73 113 l6 6 M31 113 l-6 6 M73 71 l6 -6" stroke="#e0a458" stroke-width="2.5" stroke-linecap="round"/>
  <text x="52" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">Sun</text>

  <!-- sunlight arrow -->
  <line x1="70" y1="92" x2="140" y2="120" stroke="#e0a458" stroke-width="3" marker-end="url(#arr11)"/>

  <!-- Atmosphere band -->
  <rect x="20" y="150" width="472" height="56" fill="#dbe7f0" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="176" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Atmosphere (air, greenhouse gases, clouds)</text>
  <text x="256" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">holds in heat and carries water as clouds and wind</text>

  <!-- cloud -->
  <ellipse cx="150" cy="212" rx="26" ry="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="168" cy="206" rx="18" ry="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>

  <!-- evaporation arrow up -->
  <path d="M360 320 q0 -40 20 -70" fill="none" stroke="#6b93b6" stroke-width="2.5" marker-end="url(#arr11b)" stroke-dasharray="6 4"/>

  <!-- Ocean -->
  <rect x="280" y="330" width="212" height="66" fill="#cfe0ec" stroke="#2b3a42" stroke-width="2"/>
  <text x="386" y="358" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Ocean</text>
  <text x="386" y="376" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">stores heat, moves it in currents</text>
  <path d="M300 388 q20 -10 40 0 t40 0 t40 0 t40 0" fill="none" stroke="#6b93b6" stroke-width="2.5" marker-end="url(#arr11b)"/>

  <!-- Land -->
  <rect x="20" y="330" width="232" height="66" fill="#e8dcc4" stroke="#2b3a42" stroke-width="2"/>
  <text x="80" y="348" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Land</text>
  <text x="80" y="366" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">mountains, soil, and</text>
  <text x="80" y="382" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">bright surfaces</text>
  <!-- mountain -->
  <path d="M40 330 L96 270 L152 330" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M96 270 L112 300 M96 270 L80 300" stroke="#2b3a42" stroke-width="1.5" fill="none"/>

  <defs>
    <marker id="arr11" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z" fill="#e0a458"/>
    </marker>
    <marker id="arr11b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z" fill="#6b93b6"/>
    </marker>
  </defs>

  <!-- weather vs climate -->
  <rect x="40" y="416" width="432" height="74" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Weather vs. Climate</text>
  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Weather = today's conditions · Climate = the long-term pattern</text>
  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">(one hot day is weather; a hot decade is climate)</text>
</svg>
