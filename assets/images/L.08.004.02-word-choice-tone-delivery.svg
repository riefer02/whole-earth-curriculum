<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Word choice, tone, and delivery — three lenses</title>
  <desc id="desc">Three labeled boxes — "word choice", "tone", and "delivery" — each with a short example line, all pointing with arrows to a central phrase "meaning + persuasion". Labels and shapes carry the meaning, not color alone.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">How a speaker shapes meaning</text>

  <!-- central target -->
  <circle cx="256" cy="330" r="64" fill="#e0a458" opacity="0.55" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="326" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">meaning +</text>
  <text x="256" y="348" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">persuasion</text>

  <!-- word choice box -->
  <rect x="30" y="86" width="140" height="92" rx="10" fill="#6b93b6" opacity="0.45" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="100" y="114" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">word choice</text>
  <text x="100" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">"worried" vs "a few"</text>
  <text x="100" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">carries feeling</text>
  <line x1="100" y1="178" x2="196" y2="312" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- tone box -->
  <rect x="186" y="86" width="140" height="92" rx="10" fill="#7a9e7e" opacity="0.5" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="114" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">tone</text>
  <text x="256" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">warm, urgent,</text>
  <text x="256" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">playful, cold</text>
  <line x1="256" y1="178" x2="256" y2="266" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- delivery box -->
  <rect x="342" y="86" width="140" height="92" rx="10" fill="#e0a458" opacity="0.6" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="412" y="114" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">delivery</text>
  <text x="412" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">pace, volume,</text>
  <text x="412" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">pause, gesture</text>
  <line x1="412" y1="178" x2="316" y2="312" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arr)"/>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b3a42"/>
    </marker>
  </defs>

  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Meaning lives in the words and in the saying.</text>
</svg>
