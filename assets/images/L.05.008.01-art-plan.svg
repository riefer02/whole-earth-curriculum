<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My Art Plan</title>
  <desc id="desc">A three-part planning page titled "My Art Plan." The top box, labeled "my idea (what I want to show)," shows a small sketch of a stormy sea with a thought bubble. The middle box, labeled "materials I will use," shows simple icons for paper, pencil, scissors, glue, paint, and found objects. The bottom box, labeled "technique I will try," lists the words draw, paint, cut, tear, and fold. Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">My Art Plan</text>

  <!-- Box 1: idea -->
  <rect x="40" y="64" width="432" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="60" y="92" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4f6d7a">my idea (what I want to show)</text>
  <!-- sketch: stormy sea -->
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 190 Q150 170 180 190 Q210 210 240 190"/>
    <path d="M150 190 Q180 174 210 190 Q240 206 270 190"/>
    <path d="M110 200 Q140 184 170 200"/>
  </g>
  <circle cx="300" cy="120" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M332 120 L392 120" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M344 112 L372 120 L344 128" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="60" y="146" font-family="sans-serif" font-size="13" fill="#4f6d7a">"a stormy sea at night"</text>

  <!-- Box 2: materials -->
  <rect x="40" y="230" width="432" height="118" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="60" y="258" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4f6d7a">materials I will use</text>
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round">
    <rect x="60" y="276" width="46" height="40" fill="#ffffff"/>
    <line x1="60" y1="296" x2="106" y2="296"/>
    <line x1="83" y1="296" x2="96" y2="306" stroke-width="1.5"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <path d="M128 312 L166 286" stroke-linecap="round"/>
    <path d="M166 286 L166 306" stroke-linecap="round"/>
    <path d="M140 306 L166 306" stroke-linecap="round"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="196" cy="296" r="6"/>
    <circle cx="216" cy="296" r="6"/>
    <path d="M196 296 L216 296"/>
    <path d="M206 290 L206 302"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round">
    <rect x="238" y="282" width="34" height="28" rx="4" fill="#ffffff"/>
    <path d="M246 282 L246 276 L262 276 L262 282"/>
    <path d="M255 282 L255 292" stroke-width="3"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 316 Q312 290 330 316 Q340 306 348 316"/>
    <path d="M324 296 L324 306"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M372 316 Q376 288 392 288 Q408 288 412 316" stroke-linejoin="round"/>
  </g>
  <text x="60" y="338" font-family="sans-serif" font-size="12" fill="#4f6d7a">paper · pencil · scissors · glue · paint · found objects</text>

  <!-- Box 3: technique -->
  <rect x="40" y="364" width="432" height="120" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="60" y="392" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4f6d7a">technique I will try</text>
  <text x="60" y="424" font-family="sans-serif" font-size="20" fill="#2b3a42">draw   ·   paint   ·   cut   ·   tear   ·   fold</text>
  <text x="60" y="458" font-family="sans-serif" font-size="13" fill="#4f6d7a">because: smudged chalk looks like moving water</text>
</svg>
