<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A picture plus my words</title>
  <desc id="desc">On the left, a sheet of paper holds a child's drawing: a sun in the corner, a tree, a house, and a small person. On the right, a speech bubble carries the child's spoken words: "This is my home and my tree." The drawing and the speech bubble sit side by side to show that a picture plus its telling make one complete message. A small pencil and the words "my picture" and "my words" label the two parts. The shapes and labels carry the meaning, so the picture prints clearly in grayscale and teaches that drawing an idea and telling what it means is how writing begins.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">A Picture + My Words</text>

  <!-- Paper with drawing -->
  <rect x="36" y="104" width="264" height="250" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="168" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4f6d7a">my picture</text>

  <!-- sun -->
  <circle cx="70" cy="150" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
  <path d="M70 124 L70 116 M70 176 L70 184 M44 150 L36 150 M96 150 L104 150" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>

  <!-- tree -->
  <rect x="120" y="220" width="18" height="60" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="129" cy="200" r="34" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="112" cy="212" r="20" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="146" cy="212" r="20" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  <!-- house -->
  <path d="M196 254 L232 226 L268 254 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="204" y="254" width="56" height="46" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <rect x="226" y="272" width="14" height="28" fill="#4f6d7a"/>

  <!-- small person -->
  <circle cx="90" cy="290" r="10" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <rect x="82" y="302" width="16" height="24" rx="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="86" y1="326" x2="84" y2="344" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="94" y1="326" x2="96" y2="344" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <!-- Speech bubble -->
  <path d="M324 150 Q324 122 356 122 L460 122 Q476 122 476 136 L476 186 Q476 200 460 200 L402 200 L390 214 L392 200 L356 200 Q324 200 324 186 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="400" y="156" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4f6d7a">my words</text>
  <text x="400" y="180" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">"This is my home</text>
  <text x="400" y="200" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">and my tree."</text>

  <!-- pencil -->
  <rect x="120" y="382" width="120" height="16" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M240 382 L252 390 L240 398 Z" fill="#c99567" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M250 389 L254 391" stroke="#2b3a42" stroke-width="2"/>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">My drawing plus my words makes one complete message.</text>
</svg>
