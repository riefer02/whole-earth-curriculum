<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Weighing it: a decision in two time scales</title>
  <desc id="desc">A balance scale with two pans. The left pan is labeled "now" and holds one small stone; the right pan is labeled "later" and holds three stones, tipping the scale down. A center label reads "which weighs more for me?". Outline and label only, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Weighing a decision</text>

  <!-- Post -->
  <line x1="256" y1="120" x2="256" y2="360" stroke="#2b3a42" stroke-width="5"/>
  <rect x="236" y="356" width="40" height="14" rx="3" fill="#2b3a42"/>

  <!-- Beam (tilted: right down) -->
  <line x1="110" y1="150" x2="402" y2="196" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="168" r="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>

  <!-- Left pan: now -->
  <line x1="130" y1="158" x2="130" y2="230" stroke="#2b3a42" stroke-width="3"/>
  <line x1="110" y1="158" x2="150" y2="162" stroke="#2b3a42" stroke-width="3"/>
  <path d="M78 230 A62 18 0 0 0 182 230 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <ellipse cx="130" cy="226" rx="20" ry="10" fill="#c9d7e2" stroke="#2b3a42" stroke-width="2"/>
  <text x="130" y="266" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">now</text>

  <!-- Right pan: later -->
  <line x1="382" y1="200" x2="382" y2="272" stroke="#2b3a42" stroke-width="3"/>
  <line x1="362" y1="196" x2="402" y2="200" stroke="#2b3a42" stroke-width="3"/>
  <path d="M330 272 A62 18 0 0 0 434 272 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <ellipse cx="372" cy="266" rx="19" ry="9" fill="#c9d7e2" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="388" cy="266" rx="17" ry="8" fill="#d9d3e8" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="380" cy="252" rx="16" ry="8" fill="#cfe0cf" stroke="#2b3a42" stroke-width="2"/>
  <text x="382" y="306" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">later</text>

  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e0a458">which weighs more for me?</text>

  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">a good decision listens to both the now and the later</text>
</svg>
