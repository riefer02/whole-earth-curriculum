<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-11-001-05-values-compass desc-L-11-001-05-values-compass">
  <title id="title-L-11-001-05-values-compass">My values compass</title>
  <desc id="desc-L-11-001-05-values-compass">A compass rose with a circle at its center labeled "my values." Eight marked points around the rim are labelled with example values — fairness, honesty, care, courage, justice, freedom, respect, and kindness — each word sitting beside its own point. A caption reminds the learner to name their own values.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">My Values Compass</text>

  <!-- Compass ring -->
  <circle cx="256" cy="276" r="150" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="256" cy="276" r="110" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- Center -->
  <circle cx="256" cy="276" r="52" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="272" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">my</text>
  <text x="256" y="294" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">values</text>

  <!-- Points on the rim, each with its word right beside it -->
  <g fill="#4f6d7a">
    <circle cx="256" cy="126" r="5"/>
    <circle cx="362" cy="170" r="5"/>
    <circle cx="406" cy="276" r="5"/>
    <circle cx="362" cy="382" r="5"/>
    <circle cx="256" cy="426" r="5"/>
    <circle cx="150" cy="382" r="5"/>
    <circle cx="106" cy="276" r="5"/>
    <circle cx="150" cy="170" r="5"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#222222">
    <text x="256" y="112" text-anchor="middle">fairness</text>
    <text x="374" y="164">honesty</text>
    <text x="418" y="281">care</text>
    <text x="374" y="396">courage</text>
    <text x="256" y="452" text-anchor="middle">justice</text>
    <text x="138" y="396" text-anchor="end">freedom</text>
    <text x="94" y="281" text-anchor="end">respect</text>
    <text x="138" y="164" text-anchor="end">kindness</text>
  </g>

  <text x="256" y="496" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">These are examples — name your own.</text>
</svg>
