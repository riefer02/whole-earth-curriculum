<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img" font-family="sans-serif">
  <title>One action: help or harm</title>
  <desc>Two pictures of the same stream bank, side by side, labeled before and after. On the left, the stream is littered with bottles and wrappers and the bank is bare — labeled harm. On the right, the same stream is clean and a young tree is planted on the bank — labeled help. Captions name who and what is affected.</desc>
  <rect width="820" height="400" fill="#fdfbf7"/>
  <text x="410" y="36" text-anchor="middle" font-size="22" fill="#222222" font-weight="bold">One action can help or harm the same place</text>

  <!-- Left: harm -->
  <rect x="30" y="60" width="360" height="300" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="210" y="90" text-anchor="middle" font-size="19" fill="#222222" font-weight="bold">Littered — HARM</text>
  <!-- stream -->
  <path d="M30 240 q90 -20 180 0 q90 20 180 0" fill="none" stroke="#6b93b6" stroke-width="26" stroke-linecap="round"/>
  <!-- litter -->
  <rect x="80" y="214" width="30" height="20" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="3" transform="rotate(-12 95 224)"/>
  <rect x="250" y="222" width="34" height="20" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3" transform="rotate(8 267 232)"/>
  <rect x="170" y="210" width="26" height="18" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <!-- bare bank -->
  <path d="M30 300 L390 300" stroke="#2b3a42" stroke-width="3"/>
  <text x="210" y="330" text-anchor="middle" font-size="14" fill="#222222">Litter can wash into the water,</text>
  <text x="210" y="350" text-anchor="middle" font-size="14" fill="#222222">harming fish and birds.</text>

  <!-- Right: help -->
  <rect x="430" y="60" width="360" height="300" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="610" y="90" text-anchor="middle" font-size="19" fill="#222222" font-weight="bold">Planted — HELP</text>
  <!-- clean stream -->
  <path d="M430 240 q90 -20 180 0 q90 20 180 0" fill="none" stroke="#6b93b6" stroke-width="26" stroke-linecap="round"/>
  <!-- fish -->
  <path d="M520 236 q16 -8 28 0 q-9 6 -19 4 l-4 3 q-2 2 -5 0 z" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <!-- tree -->
  <rect x="700" y="200" width="12" height="70" fill="#4f6d7a"/>
  <circle cx="706" cy="182" r="34" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
  <!-- grass -->
  <g stroke="#2b3a42" stroke-width="3">
    <line x1="470" y1="300" x2="470" y2="282"/>
    <line x1="482" y1="300" x2="482" y2="278"/>
    <line x1="494" y1="300" x2="494" y2="284"/>
  </g>
  <path d="M430 300 L790 300" stroke="#2b3a42" stroke-width="3"/>
  <text x="610" y="330" text-anchor="middle" font-size="14" fill="#222222">The tree shades and cools the water,</text>
  <text x="610" y="350" text-anchor="middle" font-size="14" fill="#222222">and its roots hold the soil.</text>

  <text x="410" y="388" text-anchor="middle" font-size="15" fill="#4f6d7a">Every action is a choice to help or to harm.</text>
</svg>
