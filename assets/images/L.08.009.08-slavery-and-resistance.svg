<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Slavery and resistance</title>
  <desc id="desc">A two-panel diagram — left, the transatlantic slave trade as a system built on the denial of human dignity; right, forms of resistance — revolt, maroon communities, everyday refusal, and preserving culture — each with a named example.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">Slavery as a system — and the people who resisted</text>

  <!-- left panel -->
  <rect x="24" y="70" width="224" height="316" rx="8" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fdfbf7">a system that denied</text>
  <text x="136" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fdfbf7">human dignity</text>
  <text x="136" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fdfbf7">treating people as property</text>
  <text x="136" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fdfbf7">built to extract labor</text>
  <text x="136" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fdfbf7">for the Americas</text>
  <text x="136" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fdfbf7">an estimated 12.5 million</text>
  <text x="136" y="242" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fdfbf7">people forcibly carried —</text>
  <text x="136" y="262" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fdfbf7">each one a person,</text>
  <text x="136" y="282" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fdfbf7">a family, a name</text>

  <!-- right panel -->
  <rect x="264" y="70" width="224" height="316" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">forms of resistance</text>
  <g font-family="sans-serif" font-size="12" fill="#222222">
    <text x="376" y="128" text-anchor="middle" font-weight="bold">revolt</text>
    <text x="376" y="146" text-anchor="middle">Haitian Revolution (1791–1804)</text>
    <text x="376" y="172" text-anchor="middle" font-weight="bold">maroon communities</text>
    <text x="376" y="190" text-anchor="middle">free settlements, like Palmares</text>
    <text x="376" y="216" text-anchor="middle" font-weight="bold">everyday refusal</text>
    <text x="376" y="234" text-anchor="middle">slowing work, keeping their names</text>
    <text x="376" y="260" text-anchor="middle" font-weight="bold">preserving culture</text>
    <text x="376" y="278" text-anchor="middle">language, music, family, faith</text>
  </g>

  <text x="256" y="428" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Enslaved people never accepted it — they resisted, in ways large and small.</text>
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Told with care: dignity and agency at the center, never as spectacle.</text>
</svg>
