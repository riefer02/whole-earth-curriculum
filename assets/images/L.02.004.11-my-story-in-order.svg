<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My story in order</title>
  <desc id="desc">A child writes a short story on a page. Three lines of writing sit under the labels first, next, and last, each with a small picture beside it: a seed, a watering can, and a flower. The labels and pictures carry the meaning, so the picture prints clearly in grayscale and teaches learners to write a short story of several sentences in order.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">My Story in Order</text>

  <!-- writing page -->
  <rect x="60" y="90" width="392" height="320" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>

  <!-- row 1: first -->
  <text x="88" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">first</text>
  <line x1="140" y1="126" x2="300" y2="126" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="144" x2="270" y2="144" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <rect x="330" y="112" width="70" height="52" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M356 146 L374 146 L374 158 L356 158 Z" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="365" cy="136" r="5" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>

  <!-- row 2: next -->
  <text x="88" y="210" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">next</text>
  <line x1="140" y1="206" x2="300" y2="206" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="224" x2="256" y2="224" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <rect x="330" y="192" width="70" height="52" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M350 226 L380 226 L380 238 L350 238 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M350 232 L338 222" stroke="#6b93b6" stroke-width="4" stroke-linecap="round"/>
  <path d="M360 242 L358 250 M370 242 L370 250" stroke="#6b93b6" stroke-width="3" stroke-linecap="round"/>

  <!-- row 3: last -->
  <text x="88" y="290" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">last</text>
  <line x1="140" y1="286" x2="300" y2="286" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="304" x2="286" y2="304" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <rect x="330" y="272" width="70" height="52" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <path d="M365 316 Q365 288 365 282" fill="none" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round"/>
  <circle cx="365" cy="282" r="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>

  <!-- pen -->
  <line x1="120" y1="360" x2="160" y2="330" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">A story in order — first, next, last.</text>
</svg>
