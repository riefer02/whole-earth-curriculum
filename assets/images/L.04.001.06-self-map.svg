<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Self-map: branches of my growing self</title>
  <desc id="desc">A mind-map with a round center labeled "me." Five branches reach out to boxes labeled "I love," "I am good at," "I have done," "I am still learning," and "my next step." The "I am still learning" box has a dashed border and is marked "not yet." Labels and shape, not color, carry the meaning.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="56" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">The Map of My Growing Self</text>

  <!-- Center -->
  <circle cx="256" cy="262" r="54" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="271" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#222222">me</text>

  <!-- Branch lines -->
  <line x1="256" y1="208" x2="256" y2="138" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <line x1="310" y1="262" x2="392" y2="208" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <line x1="310" y1="296" x2="392" y2="330" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <line x1="202" y1="296" x2="120" y2="330" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <line x1="202" y1="262" x2="120" y2="208" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>

  <!-- Boxes -->
  <g>
    <rect x="186" y="98" width="140" height="40" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="124" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">I love</text>
  </g>
  <g>
    <rect x="392" y="188" width="112" height="40" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="448" y="207" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">I am good at</text>
    <text x="448" y="223" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">(ability)</text>
  </g>
  <g>
    <rect x="392" y="310" width="112" height="40" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="448" y="335" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">I have done</text>
  </g>
  <g>
    <rect x="8" y="310" width="112" height="56" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="64" y="331" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">I am still</text>
    <text x="64" y="348" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">learning</text>
    <text x="64" y="361" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">(not yet)</text>
  </g>
  <g>
    <rect x="8" y="188" width="112" height="40" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="64" y="213" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">my next step</text>
  </g>

  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42">I am still growing.</text>
</svg>
