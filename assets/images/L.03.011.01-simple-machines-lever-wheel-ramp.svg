<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Three simple machines and the jobs they make easier</title>
  <desc id="d">Three simple machines are shown, each with the job it makes easier. A lever — a stick over a stone — lifts a heavy rock; a wheel on a cart rolls a heavy load so it is easier to move; a ramp slopes up to a step so a load can be rolled instead of lifted. Word labels name each machine and its job, so the meaning does not depend on color and it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">Three simple machines make jobs easier</text>

  <!-- Lever -->
  <rect x="16" y="56" width="150" height="190" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="91" y="80" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">LEVER</text>
  <circle cx="91" cy="150" r="14" fill="#4f6d7a" stroke="#2b3a42" stroke-width="3"/>
  <line x1="30" y1="124" x2="152" y2="112" stroke="#e0a458" stroke-width="6" stroke-linecap="round"/>
  <circle cx="150" cy="108" r="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="3"/>
  <text x="152" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">rock</text>
  <text x="91" y="196" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">A stick over a stone</text>
  <text x="91" y="216" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">lifts a heavy rock.</text>
  <text x="91" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">job: lifting</text>

  <!-- Wheel -->
  <rect x="181" y="56" width="150" height="190" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="256" y="80" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">WHEEL</text>
  <circle cx="256" cy="132" r="26" fill="none" stroke="#2b3a42" stroke-width="4"/>
  <circle cx="256" cy="132" r="4" fill="#2b3a42"/>
  <line x1="230" y1="132" x2="282" y2="132" stroke="#2b3a42" stroke-width="3"/>
  <line x1="256" y1="106" x2="256" y2="158" stroke="#2b3a42" stroke-width="3"/>
  <rect x="256" y="158" width="64" height="22" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">A load on a wheel</text>
  <text x="256" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">rolls instead of dragging.</text>
  <text x="256" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">job: moving</text>

  <!-- Ramp -->
  <rect x="346" y="56" width="150" height="190" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="421" y="80" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">RAMP</text>
  <polygon points="360,180 480,180 480,120" fill="#7a9e7e" stroke="#2b3a42" stroke-width="4"/>
  <rect x="404" y="92" width="34" height="24" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="412" cy="120" r="5" fill="#2b3a42"/>
  <circle cx="430" cy="120" r="5" fill="#2b3a42"/>
  <line x1="374" y1="176" x2="470" y2="130" stroke="#4f6d7a" stroke-width="3" stroke-dasharray="5,4"/>
  <text x="421" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">A slope lets a load</text>
  <text x="421" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">roll up instead of lifting.</text>
  <text x="421" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">job: raising</text>

  <rect x="16" y="268" width="480" height="120" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="256" y="296" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A simple machine changes how you push or pull,</text>
  <text x="256" y="322" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">so a hard job feels easier.</text>
  <text x="256" y="350" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">lever = lifts   ·   wheel = rolls   ·   ramp = raises up a slope</text>
  <text x="256" y="374" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">A simple machine is not magic — people made it.</text>

  <text x="256" y="500" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">People everywhere use simple machines.</text>
</svg>
