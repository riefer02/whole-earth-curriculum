<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-02-001-08-alike-and-different desc-L-02-001-08-alike-and-different">
  <title id="title-L-02-001-08-alike-and-different">Alike and different</title>
  <desc id="desc-L-02-001-08-alike-and-different">A Venn diagram with two overlapping circles labeled "just me" and "just my friend," with the overlap labeled "things we share." Around it, small example labels with icons: a drum (music I like), a book (stories I love), a ball (games I play), and a home (where I live). A note at the bottom says what we share joins us, and what is different makes each of us special — both matter. The circle labels and words, not color, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Alike and Different</text>

  <!-- overlapping circles -->
  <circle cx="196" cy="210" r="120" fill="#e0a458" fill-opacity="0.25" stroke="#2b3a42" stroke-width="2.5"/>
  <circle cx="316" cy="210" r="120" fill="#6b93b6" fill-opacity="0.25" stroke="#2b3a42" stroke-width="2.5"/>

  <text x="150" y="180" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">just me</text>
  <text x="370" y="180" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">just my friend</text>
  <text x="256" y="235" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">things we share</text>

  <!-- icons around -->
  <g>
    <circle cx="86" cy="316" r="20" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="86" y="362" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">music I like</text>
    <path d="M80 324 L96 312 L96 324 Z" fill="#2b3a42"/>
    <line x1="96" y1="324" x2="96" y2="308" stroke="#2b3a42" stroke-width="2"/>

    <circle cx="426" cy="316" r="20" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="418" y="306" width="16" height="20" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="426" y="362" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">stories I love</text>

    <circle cx="256" cy="376" r="20" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="256" cy="376" r="12" fill="#c96f5f" stroke="#2b3a42" stroke-width="1.5"/>
    <path d="M244 376 Q256 364 268 376" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="414" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">games I play</text>

    <circle cx="426" cy="210" r="0"/>
  </g>

  <text x="256" y="463.5" text-anchor="middle" font-family="sans-serif" font-size="13.7" fill="#4f6d7a">What we share joins us. What is different makes each of us special.</text>
  <text x="256" y="483" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Both matter.</text>
</svg>
