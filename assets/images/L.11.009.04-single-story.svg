<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The Danger of a Single Story</title>
  <desc id="desc">On the left, one narrow spotlight beam illuminates a single book. On the right, many wider beams illuminate a whole shelf of books, contrasting a single story with many stories.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">One Story or Many?</text>

  <!-- Left: single beam, single book -->
  <rect x="80" y="180" width="90" height="14" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="125" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">one story</text>
  <polygon points="125,80 70,400 180,400" fill="#6b93b6" opacity="0.25" stroke="none"/>

  <!-- Right: many beams, shelf of books -->
  <g fill="#7a9e7e" stroke="#2b3a42" stroke-width="2">
    <rect x="290" y="150" width="16" height="70"/>
    <rect x="308" y="138" width="14" height="82"/>
    <rect x="324" y="146" width="18" height="74"/>
    <rect x="344" y="130" width="14" height="90"/>
    <rect x="360" y="152" width="16" height="68"/>
    <rect x="378" y="140" width="14" height="80"/>
  </g>
  <rect x="288" y="220" width="110" height="8" fill="#2b3a42"/>
  <text x="343" y="252" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">many stories</text>
  <g stroke="#e0a458" stroke-width="3" fill="none">
    <line x1="300" y1="70" x2="300" y2="130"/>
    <line x1="320" y1="66" x2="320" y2="128"/>
    <line x1="343" y1="62" x2="343" y2="128"/>
    <line x1="366" y1="66" x2="366" y2="138"/>
    <line x1="386" y1="70" x2="386" y2="146"/>
  </g>

  <text x="256" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">A single story flattens a people.</text>
  <text x="256" y="342" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Many stories keep them whole.</text>
</svg>
