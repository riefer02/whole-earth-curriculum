<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A graphic score</title>
  <desc id="desc">A graphic score: a horizontal time line with a rising and falling melodic line above it, clusters of dots for rhythm below it, and a swelling shape for loud and soft, with labels for melody, rhythm, and loud/soft.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#222222" font-weight="bold">This piece is about ______</text>
  <!-- time axis -->
  <line x1="48" y1="360" x2="464" y2="360" stroke="#2b3a42" stroke-width="3"/>
  <path d="M464 360 L452 354 L452 366 Z" fill="#2b3a42"/>
  <text x="464" y="392" text-anchor="end" font-family="sans-serif" font-size="16" fill="#222222">time</text>
  <!-- melody line -->
  <path d="M60 320 C120 200 160 260 220 160 C280 120 340 220 400 240 C430 250 448 230 456 210" stroke="#6b93b6" stroke-width="3" fill="none"/>
  <text x="60" y="150" font-family="sans-serif" font-size="16" fill="#222222">melody</text>
  <!-- rhythm dots -->
  <g fill="#4f6d7a">
    <circle cx="90" cy="330" r="6"/>
    <circle cx="130" cy="330" r="6"/>
    <circle cx="170" cy="330" r="6"/>
    <circle cx="210" cy="330" r="6"/>
    <circle cx="250" cy="330" r="6"/>
    <circle cx="290" cy="330" r="6"/>
    <circle cx="330" cy="330" r="6"/>
    <circle cx="370" cy="330" r="6"/>
    <circle cx="410" cy="330" r="6"/>
  </g>
  <text x="60" y="352" font-family="sans-serif" font-size="16" fill="#222222">rhythm</text>
  <!-- dynamics swell -->
  <path d="M90 300 C140 260 240 240 300 270 C340 288 380 300 410 286 C430 276 444 282 452 292" stroke="#e0a458" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
  <text x="60" y="232" font-family="sans-serif" font-size="16" fill="#222222">loud / soft</text>
</svg>
