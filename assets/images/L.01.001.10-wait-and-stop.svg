<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Wait and stop: two ways we care</title>
  <desc id="desc">Two panels. The left panel, "wait," shows three children in a row; the middle child holds a talking object (a star) inside a dashed circle, meaning only the holder speaks, while the others wait quietly. The right panel, "stop," shows a large open-palm hand cue with the word "STOP" and a child frozen in place with small motion lines. Captions explain that waiting is for a fair chance and stopping is to keep everyone safe and respected. The labels and shapes, not color, carry the meaning so it prints clearly in grayscale, and the note at the bottom says waiting and stopping are ways we care for each other.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">Wait and Stop</text>

  <!-- ===== Left panel: WAIT ===== -->
  <rect x="16" y="84" width="232" height="344" rx="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <text x="132" y="126" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#4f6d7a">WAIT</text>

  <!-- hourglass cue -->
  <g>
    <path d="M198 100 L216 100 L198 122 L216 122 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <line x1="198" y1="100" x2="216" y2="100" stroke="#2b3a42" stroke-width="2"/>
    <line x1="198" y1="122" x2="216" y2="122" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- three children, middle one holds the talking object -->
  <!-- child left (waiting) -->
  <circle cx="76" cy="250" r="12" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M69 244 A12 12 0 0 1 83 244 Z" fill="#2b3a42"/>
  <rect x="66" y="264" width="20" height="34" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="70" y1="298" x2="68" y2="324" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="82" y1="298" x2="84" y2="324" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="66" y1="272" x2="54" y2="300" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <!-- child middle (holds talking object) inside dashed circle -->
  <circle cx="132" cy="250" r="46" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="132" cy="240" r="12" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M125 234 A12 12 0 0 1 139 234 Z" fill="#2b3a42"/>
  <rect x="122" y="254" width="20" height="34" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="126" y1="288" x2="124" y2="314" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="138" y1="288" x2="140" y2="314" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="122" y1="262" x2="110" y2="290" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <path d="M164 250 L173 258 L185 246 L180 263 L189 272 L172 276 L166 268 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>

  <!-- child right (waiting) -->
  <circle cx="188" cy="250" r="12" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M181 244 A12 12 0 0 1 195 244 Z" fill="#2b3a42"/>
  <rect x="178" y="264" width="20" height="34" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="182" y1="298" x2="180" y2="324" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="194" y1="298" x2="196" y2="324" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="198" y1="272" x2="210" y2="300" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <text x="132" y="360" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">Only the holder speaks.</text>
  <text x="132" y="380" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">I wait my turn so</text>
  <text x="132" y="398" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">everyone gets a fair chance.</text>

  <!-- ===== Right panel: STOP ===== -->
  <rect x="264" y="84" width="232" height="344" rx="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <text x="380" y="126" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#4f6d7a">STOP</text>

  <!-- open palm stop cue -->
  <g>
    <rect x="360" y="150" width="40" height="36" rx="12" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="356" y="122" width="10" height="36" rx="5" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="369" y="118" width="10" height="40" rx="5" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="382" y="118" width="10" height="40" rx="5" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="395" y="122" width="10" height="36" rx="5" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- frozen child with motion lines -->
  <g>
    <circle cx="380" cy="252" r="12" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M373 246 A12 12 0 0 1 387 246 Z" fill="#2b3a42"/>
    <rect x="370" y="266" width="20" height="34" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="374" y1="300" x2="372" y2="326" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="386" y1="300" x2="388" y2="326" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="370" y1="274" x2="356" y2="298" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="356" y1="292" x2="348" y2="290" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="358" y1="304" x2="348" y2="306" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- calm voice bubble -->
  <rect x="324" y="300" width="90" height="40" rx="18" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="369" y="326" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">stop</text>

  <text x="380" y="372" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">An open palm and a calm voice.</text>
  <text x="380" y="392" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">I stop to keep everyone</text>
  <text x="380" y="410" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">safe and respected.</text>

  <!-- Bottom note -->
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Waiting and stopping are ways we care for each other.</text>
</svg>
