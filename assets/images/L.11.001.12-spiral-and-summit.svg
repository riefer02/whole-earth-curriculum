<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The spiral keeps rising</title>
  <desc id="desc">A spiral path rising toward a summit, with a flag at the top labeled "not yet." Small stars mark spots along the path, and a figure stands on the path partway up. Labels and shapes carry the meaning, so the diagram prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">The Spiral Keeps Rising</text>

  <!-- Summit flag -->
  <path d="M356 150 L356 92" stroke="#2b3a42" stroke-width="3"/>
  <path d="M356 92 L414 106 L356 120 z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="356" y="76" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">"not yet"</text>

  <!-- Spiral path -->
  <path d="M96 420 C 140 420 150 350 210 350 C 270 350 250 280 320 280 C 380 280 360 210 356 190" fill="none" stroke="#4f6d7a" stroke-width="5" stroke-linecap="round"/>

  <!-- Stars (artifacts) along the path -->
  <g fill="#e0a458" stroke="#2b3a42" stroke-width="1.5">
    <path d="M120 396 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1 z"/>
    <path d="M196 344 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1 z"/>
    <path d="M300 330 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1 z"/>
    <path d="M330 224 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1 z"/>
  </g>

  <!-- Figure on the path -->
  <circle cx="210" cy="330" r="15" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M196 362 a14 14 0 0 1 28 0 z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">Every star is work I did; the path keeps rising.</text>
</svg>
