<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Revision as re-seeing</title>
  <desc id="desc">A revision loop: a central box labeled draft, surrounded by three pass boxes labeled structure, style, and evidence, each with an arrow feeding back into the draft. A curved arrow labeled revise (re-see) circles the passes, and a final arrow leads to a box labeled polished piece. Labels carry the meaning, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Revision as Re-Seeing</text>

  <!-- Central draft -->
  <rect x="186" y="200" width="140" height="72" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="232" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">draft</text>
  <text x="256" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">the first guess</text>

  <!-- Pass: structure (left) -->
  <rect x="20" y="70" width="130" height="60" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="85" y="105" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">structure</text>
  <line x1="150" y1="100" x2="208" y2="216" stroke="#4f6d7a" stroke-width="2.5"/>
  <polygon points="208,216 199,207 210,208" fill="#4f6d7a"/>

  <!-- Pass: style (top) -->
  <rect x="191" y="70" width="130" height="60" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="105" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">style</text>
  <line x1="256" y1="130" x2="256" y2="198" stroke="#4f6d7a" stroke-width="2.5"/>
  <polygon points="256,198 250,189 262,189" fill="#4f6d7a"/>

  <!-- Pass: evidence (right) -->
  <rect x="362" y="70" width="130" height="60" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="427" y="105" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">evidence</text>
  <line x1="362" y1="100" x2="304" y2="216" stroke="#4f6d7a" stroke-width="2.5"/>
  <polygon points="304,216 313,208 302,207" fill="#4f6d7a"/>

  <!-- Circular re-see arrow -->
  <path d="M150 150 A140 140 0 1 1 90 260" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-dasharray="8 6"/>
  <rect x="36" y="300" width="150" height="34" rx="17" fill="#f0ede4" stroke="#2b3a42" stroke-width="2"/>
  <text x="111" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">revise (re-see)</text>

  <!-- Polished piece -->
  <line x1="256" y1="272" x2="256" y2="330" stroke="#4f6d7a" stroke-width="3"/>
  <polygon points="256,330 248,321 264,321" fill="#4f6d7a"/>
  <rect x="176" y="334" width="160" height="52" rx="10" fill="#f0ede4" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="365" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">polished piece</text>

  <text x="256" y="428" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">re-seeing changes meaning; editing cleans the surface.</text>
  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">re-see first.</text>
</svg>
