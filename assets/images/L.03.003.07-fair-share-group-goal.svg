<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Fair share, group goal</title>
  <desc id="desc">A group of four children building one tall block tower together. Each child has a labeled job — one hands blocks, one stacks, one steadies the base, one checks the plan. A jobs chart beside them lists each name and part, with the words "everyone contributes; no one does everything; no one does nothing." The words and shapes carry the meaning, not color, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Fair Share, Group Goal</text>

  <!-- Block tower -->
  <g stroke="#2b3a42" stroke-width="2">
    <rect x="150" y="300" width="70" height="26" fill="#e0a458"/>
    <rect x="158" y="274" width="54" height="26" fill="#6b93b6"/>
    <rect x="166" y="248" width="38" height="26" fill="#7a9e7e"/>
    <rect x="172" y="222" width="26" height="26" fill="#e0a458"/>
  </g>
  <text x="185" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">goal</text>

  <!-- Child 1: stacking -->
  <circle cx="185" cy="160" r="22" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="178" cy="156" r="2"/><circle cx="192" cy="156" r="2" fill="#2b3a42"/>
  <path d="M178 166 Q185 172 192 166" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M185 182 L185 210" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <path d="M185 210 L172 226" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>

  <!-- Child 2: handing blocks -->
  <circle cx="110" cy="240" r="20" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="104" cy="236" r="2"/><circle cx="116" cy="236" r="2" fill="#2b3a42"/>
  <path d="M104 246 Q110 252 116 246" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M110 260 L122 276" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <rect x="118" y="274" width="26" height="14" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>

  <!-- Child 3: steadying the base -->
  <circle cx="255" cy="300" r="20" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="249" cy="296" r="2"/><circle cx="261" cy="296" r="2" fill="#2b3a42"/>
  <path d="M249 306 Q255 312 261 306" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M255 320 L240 340" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <path d="M236 330 L244 334" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>

  <!-- Child 4: checking the plan -->
  <circle cx="330" cy="180" r="20" fill="#6b4f3a" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="324" cy="176" r="2"/><circle cx="336" cy="176" r="2" fill="#2b3a42"/>
  <path d="M324 186 Q330 192 336 186" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="312" y="200" width="40" height="30" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <line x1="318" y1="208" x2="346" y2="208" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="318" y1="214" x2="346" y2="214" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="318" y1="220" x2="340" y2="220" stroke="#2b3a42" stroke-width="1.5"/>

  <!-- Jobs chart -->
  <rect x="360" y="150" width="132" height="170" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="426" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Jobs</text>
  <line x1="368" y1="180" x2="484" y2="180" stroke="#4f6d7a" stroke-width="1.5"/>
  <text x="376" y="200" font-family="sans-serif" font-size="12" fill="#222222">• hand blocks</text>
  <text x="376" y="220" font-family="sans-serif" font-size="12" fill="#222222">• stack</text>
  <text x="376" y="240" font-family="sans-serif" font-size="12" fill="#222222">• steady base</text>
  <text x="376" y="260" font-family="sans-serif" font-size="12" fill="#222222">• check plan</text>
  <text x="376" y="286" font-family="sans-serif" font-size="12" fill="#7a9e7e">everyone has</text>
  <text x="376" y="302" font-family="sans-serif" font-size="12" fill="#7a9e7e">a real part</text>

  <text x="256" y="388" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">Everyone contributes; no one does everything; no one does nothing.</text>
  <text x="256" y="418" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">A group reaches its goal when everyone carries a fair part.</text>
</svg>
