<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Communication, remixed by screens</title>
  <desc id="desc">A two-panel diagram. The left panel shows two people facing each other with tone, face, body, and instant reply labeled as cues that carry meaning. The right panel shows two phones with those cues marked absent, and reach, permanence, and speed marked as what screens add.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Communication, Remixed by Screens</text>

  <!-- Left panel: face to face -->
  <rect x="28" y="64" width="222" height="330" rx="14" fill="#fdfbf7" stroke="#7a9e7e" stroke-width="2"/>
  <text x="139" y="92" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">Face to face</text>

  <!-- Person 1 -->
  <g transform="translate(52,120)">
    <circle cx="0" cy="-34" r="22" fill="#6b93b6"/>
    <rect x="-16" y="-14" width="32" height="52" rx="10" fill="#4f6d7a"/>
  </g>
  <!-- Person 2 -->
  <g transform="translate(196,120)">
    <circle cx="0" cy="-34" r="22" fill="#e0a458"/>
    <rect x="-16" y="-14" width="32" height="52" rx="10" fill="#2b3a42"/>
  </g>

  <!-- Speech waves between -->
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M86,108 C100,96 112,96 126,108"/>
    <path d="M162,108 C176,96 188,96 202,108"/>
  </g>

  <!-- Cues kept -->
  <g font-family="sans-serif" font-size="13" fill="#222222">
    <rect x="52" y="188" width="174" height="26" rx="8" fill="#eaf2ea"/>
    <text x="139" y="206" text-anchor="middle">tone of voice</text>
    <rect x="52" y="220" width="174" height="26" rx="8" fill="#eaf2ea"/>
    <text x="139" y="238" text-anchor="middle">face and body</text>
    <rect x="52" y="252" width="174" height="26" rx="8" fill="#eaf2ea"/>
    <text x="139" y="270" text-anchor="middle">instant reply &amp; repair</text>
    <rect x="52" y="284" width="174" height="26" rx="8" fill="#eaf2ea"/>
    <text x="139" y="302" text-anchor="middle">shared moment</text>
  </g>

  <!-- Right panel: screens -->
  <rect x="262" y="64" width="222" height="330" rx="14" fill="#fdfbf7" stroke="#e0a458" stroke-width="2"/>
  <text x="373" y="92" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">On a screen</text>

  <!-- Phone 1 -->
  <g transform="translate(292,120)">
    <rect x="0" y="0" width="46" height="80" rx="8" fill="#2b3a42"/>
    <rect x="4" y="4" width="38" height="72" rx="5" fill="#fdfbf7"/>
    <text x="23" y="40" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">fine</text>
  </g>
  <!-- Phone 2 -->
  <g transform="translate(392,120)">
    <rect x="0" y="0" width="46" height="80" rx="8" fill="#2b3a42"/>
    <rect x="4" y="4" width="38" height="72" rx="5" fill="#fdfbf7"/>
    <text x="23" y="40" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">fine?</text>
  </g>

  <!-- Cues dropped (crossed) -->
  <g font-family="sans-serif" font-size="13" fill="#8a6d4a">
    <rect x="286" y="216" width="174" height="26" rx="8" fill="#f6ead8"/>
    <text x="373" y="234" text-anchor="middle">tone of voice &#10007;</text>
    <rect x="286" y="248" width="174" height="26" rx="8" fill="#f6ead8"/>
    <text x="373" y="266" text-anchor="middle">face and body &#10007;</text>
  </g>

  <!-- Cues added -->
  <g font-family="sans-serif" font-size="13" fill="#3a5a6a">
    <rect x="286" y="282" width="174" height="26" rx="8" fill="#dce9f0"/>
    <text x="373" y="300" text-anchor="middle">+ reach across distance</text>
    <rect x="286" y="314" width="174" height="26" rx="8" fill="#dce9f0"/>
    <text x="373" y="332" text-anchor="middle">+ a lasting record</text>
    <rect x="286" y="346" width="174" height="26" rx="8" fill="#dce9f0"/>
    <text x="373" y="364" text-anchor="middle">+ an audience I can&#8217;t see</text>
  </g>

  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">A screen keeps some signals and drops others — so checking is a skill, not a failure.</text>
</svg>
