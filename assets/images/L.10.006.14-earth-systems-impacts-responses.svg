<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Human Impacts on Earth Systems</title>
  <desc id="desc">A diagram of Earth's connected systems — atmosphere, ocean, land, and ice — with arrows showing human drivers of change entering each, and a response column showing mitigation and adaptation feeding back toward balance.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Earth&#8217;s Connected Systems</text>

  <!-- Four system boxes -->
  <rect x="40" y="70" width="150" height="60" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="115" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">Atmosphere</text>

  <rect x="322" y="70" width="150" height="60" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="397" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">Ocean</text>

  <rect x="40" y="190" width="150" height="60" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="115" y="225" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">Land</text>

  <rect x="322" y="190" width="150" height="60" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="397" y="225" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">Ice</text>

  <!-- Coupling arrows -->
  <g stroke="#6b93b6" stroke-width="2">
    <line x1="190" y1="100" x2="322" y2="100"/>
    <line x1="190" y1="220" x2="322" y2="220"/>
    <line x1="115" y1="130" x2="115" y2="190"/>
    <line x1="397" y1="130" x2="397" y2="190"/>
  </g>
  <text x="256" y="92" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">heat &#038; gases</text>
  <text x="256" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">runoff</text>

  <!-- Human drivers -->
  <text x="256" y="286" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e0a458" font-weight="bold">Human drivers push the system</text>
  <g font-family="sans-serif" font-size="13" fill="#222222">
    <text x="80" y="314">&#8226; burning fossil fuels &#8594; warming</text>
    <text x="80" y="336">&#8226; land clearing &#8594; carbon, water change</text>
    <text x="80" y="358">&#8226; pollution &#8594; acidifying ocean</text>
  </g>

  <!-- Responses -->
  <text x="256" y="398" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#7a9e7e" font-weight="bold">Responses</text>
  <g font-family="sans-serif" font-size="13" fill="#222222">
    <text x="256" y="424" text-anchor="middle">Mitigation &#8212; cut the drivers (renewables, forests, less waste)</text>
    <text x="256" y="446" text-anchor="middle">Adaptation &#8212; live with change (walls, crops, warnings, mangroves)</text>
  </g>

  <text x="256" y="488" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">The future is not yet written &#8212; hope is honest, not pretend.</text>
</svg>
