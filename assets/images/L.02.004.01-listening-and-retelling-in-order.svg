<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Listening and retelling in order</title>
  <desc id="desc">Two children sit face to face on a mat. The child on the left is telling a three-step story, with three small sound lines by their mouth. The child on the right is listening and moves a stone onto one of three labeled spots arranged in a row — first, next, last — below the mat. A speech bubble over the telling child holds three small numbered marks: one, two, three. The labels, numbers, and stones carry the meaning, so the picture prints clearly in grayscale and teaches learners to listen to a partner and retell what they said in the correct order.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Listening and Retelling in Order</text>

  <!-- mat -->
  <ellipse cx="256" cy="200" rx="216" ry="72" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" opacity="0.55"/>

  <!-- telling child (left) -->
  <circle cx="150" cy="150" r="30" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M112 220 Q108 168 150 168 Q192 168 188 220 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <!-- sound lines from mouth -->
  <path d="M182 148 Q196 142 204 148 M186 158 Q202 152 212 158" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- listening child (right) -->
  <circle cx="362" cy="150" r="30" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M324 220 Q320 168 362 168 Q404 168 400 220 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <!-- arm reaching to stones -->
  <path d="M388 210 Q420 250 448 296" fill="none" stroke="#c99567" stroke-width="5" stroke-linecap="round"/>

  <!-- three labeled spots -->
  <g>
    <circle cx="160" cy="360" r="30" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="160" cy="360" r="11" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <text x="160" y="410" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">first</text>

    <circle cx="256" cy="360" r="30" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="256" cy="360" r="11" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="410" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">next</text>

    <circle cx="352" cy="360" r="30" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="352" cy="360" r="11" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <text x="352" y="410" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">last</text>
  </g>

  <!-- a stone being moved onto first spot -->
  <circle cx="160" cy="360" r="15" fill="#e0a458" stroke="#2b3a42" stroke-width="2" opacity="0.9"/>
  <circle cx="160" cy="360" r="6" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Listen, then retell — first, next, last.</text>
</svg>
