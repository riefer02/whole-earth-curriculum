<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 560" role="img" aria-labelledby="title desc">
  <title id="title">Energy flows, matter cycles</title>
  <desc id="desc">A diagram contrasting energy flow and matter cycling in an ecosystem. At the top, a labeled Sun sends a thick straight arrow down to a plant labeled producer, then to a rabbit labeled consumer, then to mushrooms labeled decomposers, and finally an arrow labeled heat escapes leaves to the side; this is labeled energy flows one way. Below, a circular loop of arrows passes through a plant, an animal, the soil, and the air, labeled carbon cycles and water cycles, with a caption matter is used again and again. A summary line reads: energy flows through, matter cycles around. Labels and arrow shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="560" fill="#fdfbf7"/>

  <text x="256" y="32" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Energy Flows, Matter Cycles</text>
  <text x="256" y="54" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">one runs in a line; the other turns in a circle</text>

  <!-- ENERGY FLOW (top) -->
  <text x="256" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">energy flows one way</text>

  <!-- Sun -->
  <circle cx="80" cy="116" r="22" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="80" y1="86" x2="80" y2="78"/><line x1="80" y1="146" x2="80" y2="154"/>
    <line x1="50" y1="116" x2="42" y2="116"/><line x1="110" y1="116" x2="118" y2="116"/>
  </g>
  <text x="80" y="168" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">Sun</text>

  <!-- flow arrow -->
  <defs>
    <marker id="farr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2b3a42"/>
    </marker>
  </defs>
  <line x1="104" y1="116" x2="150" y2="116" stroke="#2b3a42" stroke-width="3" marker-end="url(#farr)"/>

  <!-- producer -->
  <rect x="154" y="96" width="110" height="40" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="209" y="121" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">producer</text>

  <line x1="264" y1="116" x2="300" y2="116" stroke="#2b3a42" stroke-width="3" marker-end="url(#farr)"/>

  <!-- consumer -->
  <rect x="304" y="96" width="110" height="40" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="359" y="121" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">consumer</text>

  <line x1="414" y1="116" x2="450" y2="116" stroke="#2b3a42" stroke-width="3" marker-end="url(#farr)"/>

  <!-- decomposer + heat -->
  <rect x="356" y="154" width="120" height="36" rx="10" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="416" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">decomposer</text>
  <line x1="359" y1="136" x2="380" y2="154" stroke="#2b3a42" stroke-width="2" marker-end="url(#farr)"/>

  <!-- heat out -->
  <path d="M416,190 C416,220 460,220 470,196" fill="none" stroke="#e0a458" stroke-width="3" marker-end="url(#farr)"/>
  <text x="486" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e0a458">heat escapes</text>

  <line x1="20" y1="220" x2="492" y2="220" stroke="#d7d1c8" stroke-width="2"/>

  <!-- MATTER CYCLE (bottom) -->
  <text x="256" y="252" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">matter cycles around</text>

  <g transform="translate(120, 280)">
    <!-- circular arrows -->
    <g fill="none" stroke="#4f6d7a" stroke-width="3">
      <path d="M80,20 A80,80 0 1 1 20,80"/>
      <path d="M80,140 A80,80 0 1 1 140,80"/>
    </g>
    <defs>
      <marker id="carr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L8,3 L0,6 Z" fill="#4f6d7a"/>
      </marker>
    </defs>
    <!-- labeled nodes on the circle -->
    <rect x="60" y="8" width="80" height="30" rx="8" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
    <text x="100" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">plant</text>

    <rect x="130" y="74" width="70" height="30" rx="8" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
    <text x="165" y="94" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">animal</text>

    <rect x="60" y="130" width="80" height="30" rx="8" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
    <text x="100" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">soil</text>

    <rect x="0" y="74" width="70" height="30" rx="8" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
    <text x="35" y="94" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">air</text>
  </g>

  <text x="380" y="300" font-family="sans-serif" font-size="13" fill="#4f6d7a">carbon cycles</text>
  <text x="380" y="324" font-family="sans-serif" font-size="13" fill="#4f6d7a">water cycles</text>
  <text x="380" y="352" font-family="sans-serif" font-size="12" fill="#222222">matter is used</text>
  <text x="380" y="368" font-family="sans-serif" font-size="12" fill="#222222">again and again</text>

  <text x="256" y="500" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">energy flows through · matter cycles around</text>
  <text x="256" y="524" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">energy leaves as heat; carbon and water return</text>
</svg>
