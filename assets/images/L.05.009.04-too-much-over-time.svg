<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Too much, over time — about the inside</title>
  <desc id="desc">A three-panel diagram titled "too much, over time — about the inside, never about size or shape." The first panel shows a tooth and a jagged up-and-down energy line, labeled "too much added sugar — tooth decay, energy spikes and crashes." The second shows a heart and a wavy blood-vessel line, labeled "too much salt — strain on the heart and blood vessels." The third shows a blood vessel with a small build-up inside, labeled "too much saturated fat, over time — build-up in blood vessels." A bottom caption reads "Patterns over time matter; every body deserves respect, whatever its size or shape." Labels and pictures, not color alone, carry the meaning.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">Too Much, Over Time</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">about the inside — never about size or shape</text>

  <!-- Panel 1: sugar -->
  <rect x="24" y="86" width="140" height="250" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <path d="M70 140 Q88 116 106 140 L102 158 Q88 150 74 158 Z" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M84 166 L84 192 M92 166 L92 192" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M60 226 L74 206 L88 226 L102 206 L116 226 L130 206" stroke="#2b3a42" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <text x="94" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">too much added sugar</text>
  <text x="94" y="288" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">tooth decay, energy</text>
  <text x="94" y="304" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">spikes and crashes</text>

  <!-- Panel 2: salt -->
  <rect x="186" y="86" width="140" height="250" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <path d="M256 120 Q286 140 276 172 Q266 200 236 196 Q226 194 224 178 Q222 150 256 120 Z" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M234 150 Q256 142 278 150" stroke="#2b3a42" stroke-width="2" fill="none"/>
  <path d="M222 232 Q242 216 262 232 Q282 248 302 232" stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="256" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">too much salt</text>
  <text x="256" y="288" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">strain on the heart</text>
  <text x="256" y="304" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">and blood vessels</text>

  <!-- Panel 3: saturated fat -->
  <rect x="348" y="86" width="140" height="250" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <path d="M380 128 L448 128 L448 208 L380 208 Z" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <path d="M396 128 L396 208 M412 128 L412 208 M428 128 L428 208" stroke="#d9d2c4" stroke-width="2"/>
  <ellipse cx="420" cy="182" rx="9" ry="13" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="418" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">too much saturated fat</text>
  <text x="418" y="288" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">build-up in</text>
  <text x="418" y="304" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">blood vessels, over time</text>

  <text x="256" y="398" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Patterns over time matter — a single meal is not the point.</text>
  <text x="256" y="424" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Every body deserves respect, whatever its size or shape.</text>
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Talk about food kindly: about the inside of the body, never the outside.</text>
</svg>
