<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Decision Framework</title>
  <desc id="desc">A four-step decision framework drawn as a cycle — know the facts, know my values, talk it through, decide and revisit — with a balance weighing risks against responsibilities.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42" font-weight="bold">The Four-Step Decision Frame</text>

  <!-- cycle -->
  <g font-family="sans-serif" stroke="#2b3a42" stroke-width="1.5">
    <rect x="76" y="58" width="180" height="86" rx="10" fill="#ffffff"/>
    <circle cx="104" cy="86" r="16" fill="#7a9e7e"/>
    <text x="104" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">1</text>
    <text x="132" y="86" font-size="15" font-weight="bold" fill="#222222">Know the facts</text>
    <text x="132" y="106" font-size="12" fill="#4f6d7a">Accurate info on</text>
    <text x="132" y="122" font-size="12" fill="#4f6d7a">contraception &amp; infections</text>

    <rect x="256" y="58" width="180" height="86" rx="10" fill="#ffffff"/>
    <circle cx="284" cy="86" r="16" fill="#6b93b6"/>
    <text x="284" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">2</text>
    <text x="312" y="86" font-size="15" font-weight="bold" fill="#222222">Know my values</text>
    <text x="312" y="106" font-size="12" fill="#4f6d7a">What matters to me</text>
    <text x="312" y="122" font-size="12" fill="#4f6d7a">(delay &amp; abstinence are valid)</text>

    <rect x="76" y="168" width="180" height="86" rx="10" fill="#ffffff"/>
    <circle cx="104" cy="196" r="16" fill="#e0a458"/>
    <text x="104" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">3</text>
    <text x="132" y="196" font-size="15" font-weight="bold" fill="#222222">Talk it through</text>
    <text x="132" y="216" font-size="12" fill="#4f6d7a">Honest, consenting</text>
    <text x="132" y="232" font-size="12" fill="#4f6d7a">communication together</text>

    <rect x="256" y="168" width="180" height="86" rx="10" fill="#ffffff"/>
    <circle cx="284" cy="196" r="16" fill="#4f6d7a"/>
    <text x="284" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">4</text>
    <text x="312" y="196" font-size="15" font-weight="bold" fill="#222222">Decide &amp; revisit</text>
    <text x="312" y="216" font-size="12" fill="#4f6d7a">A decision can always</text>
    <text x="312" y="232" font-size="12" fill="#4f6d7a">be changed</text>

    <!-- cycle arrows -->
    <path d="M256 130 Q256 146 256 158" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <polygon points="256,166 250,154 262,154" fill="#2b3a42"/>
    <path d="M166 254 Q150 254 150 240 L150 146" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <polygon points="150,140 144,152 156,152" fill="#2b3a42"/>
  </g>

  <!-- balance -->
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="96" y1="330" x2="416" y2="330"/>
    <line x1="256" y1="330" x2="256" y2="296"/>
    <line x1="150" y1="330" x2="150" y2="302"/>
    <line x1="362" y1="330" x2="362" y2="302"/>
  </g>
  <text x="150" y="288" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Risks</text>
  <text x="150" y="356" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Pregnancy &#183; infections</text>
  <text x="150" y="374" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Emotional &amp; relational outcomes</text>

  <text x="362" y="288" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Responsibilities</text>
  <text x="362" y="356" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Consent &#183; communication</text>
  <text x="362" y="374" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Protection &#183; mutual care</text>

  <text x="256" y="416" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">The frame produces a reasoned decision, not one &#8220;right&#8221; answer.</text>
  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">The point is the reasoning &#8212; and the freedom to say &#8220;not yet.&#8221;</text>
</svg>
