<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Listening to a friend's feelings: three steps</title>
  <desc id="desc">Three cards teach how to listen to a friend's feelings. The first card, labeled "face toward," shows two children facing each other, one speaking and the other wearing a hearing aid and listening, with a note that a listener may also turn an ear or watch the speaker's hands. The second card, labeled "wait," shows one child holding a soft turn marker while the other waits quietly for a turn. The third card, labeled "repeat back," shows a listener saying in a speech bubble "I hear that you feel sad." Along the bottom, two more figures show that listening can look different: one child signs "I hear you" while looking away, and another turns an ear toward a voice — both count as listening, and eye contact is never required. The labels, not color, carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Listening to a Friend's Feelings</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Saying how I feel is half of it — listening is the other half</text>

  <!-- cards -->
  <rect x="20" y="90" width="150" height="280" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="181" y="90" width="150" height="280" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="342" y="90" width="150" height="280" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>

  <text x="95" y="116" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">face toward</text>
  <text x="256" y="116" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">wait your turn</text>
  <text x="417" y="116" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">repeat back</text>

  <!-- ===== Card 1: face toward ===== -->
  <!-- speaker (left, light skin) -->
  <circle cx="66" cy="168" r="10" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M56 166 A10 10 0 0 1 76 166 Z" fill="#4f6d7a"/>
  <circle cx="62" cy="168" r="1.4" fill="#2b3a42"/>
  <circle cx="70" cy="168" r="1.4" fill="#2b3a42"/>
  <ellipse cx="66" cy="174" rx="3" ry="2" fill="#2b3a42"/>
  <rect x="58" y="180" width="16" height="26" rx="7" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="62" y1="206" x2="60" y2="224" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="70" y1="206" x2="72" y2="224" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <!-- speech bubble -->
  <path d="M40 130 q-10 0 -10 10 q0 8 7 9 q-2 5 2 6 l4 -6 q7 1 7 -8 q0 -11 -10 -11 z" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <!-- listener (right, hearing aid, deep skin) -->
  <circle cx="128" cy="168" r="10" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M118 166 A10 10 0 0 1 138 166 Z" fill="#2b3a42"/>
  <path d="M137 164 q5 2 5 7" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <circle cx="142" cy="173" r="2.2" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="124" cy="168" r="1.4" fill="#2b3a42"/>
  <circle cx="132" cy="168" r="1.4" fill="#2b3a42"/>
  <path d="M124 174 Q128 177 132 174" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="120" y="180" width="16" height="26" rx="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="124" y1="206" x2="122" y2="224" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="132" y1="206" x2="134" y2="224" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <text x="95" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">or turn an ear,</text>
  <text x="95" y="274" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">or watch their hands</text>
  <text x="95" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">eye contact is not required</text>

  <!-- ===== Card 2: wait your turn ===== -->
  <!-- holder of turn marker (left, medium skin) -->
  <circle cx="220" cy="168" r="10" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M210 166 A10 10 0 0 1 230 166 Z" fill="#2b3a42"/>
  <circle cx="216" cy="168" r="1.4" fill="#2b3a42"/>
  <circle cx="224" cy="168" r="1.4" fill="#2b3a42"/>
  <path d="M216 174 Q220 177 224 174" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="212" y="180" width="16" height="26" rx="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="216" y1="206" x2="214" y2="224" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="224" y1="206" x2="226" y2="224" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <!-- turn marker in hands -->
  <circle cx="238" cy="196" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="230" y1="190" x2="234" y2="194" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  <!-- waiting listener (right, light skin, hands still) -->
  <circle cx="286" cy="168" r="10" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <path d="M276 166 A10 10 0 0 1 296 166 Z" fill="#4f6d7a"/>
  <circle cx="282" cy="168" r="1.4" fill="#2b3a42"/>
  <circle cx="290" cy="168" r="1.4" fill="#2b3a42"/>
  <path d="M282 174 Q286 177 290 174" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="278" y="180" width="16" height="26" rx="7" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="282" y1="206" x2="280" y2="224" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="290" y1="206" x2="292" y2="224" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <text x="256" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">the turn marker</text>
  <text x="256" y="274" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">marks whose turn</text>
  <text x="256" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">wait without interrupting</text>

  <!-- ===== Card 3: repeat back ===== -->
  <!-- speaker (left, medium skin) -->
  <circle cx="380" cy="168" r="10" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M370 166 A10 10 0 0 1 390 166 Z" fill="#2b3a42"/>
  <circle cx="376" cy="168" r="1.4" fill="#2b3a42"/>
  <circle cx="384" cy="168" r="1.4" fill="#2b3a42"/>
  <path d="M376 175 Q380 178 384 175" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="372" y="180" width="16" height="26" rx="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="376" y1="206" x2="374" y2="224" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="384" y1="206" x2="386" y2="224" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <!-- listener (right, light skin) -->
  <circle cx="446" cy="168" r="10" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M436 166 A10 10 0 0 1 456 166 Z" fill="#4f6d7a"/>
  <circle cx="442" cy="168" r="1.4" fill="#2b3a42"/>
  <circle cx="450" cy="168" r="1.4" fill="#2b3a42"/>
  <path d="M442 174 Q446 177 450 174" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="438" y="180" width="16" height="26" rx="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="442" y1="206" x2="440" y2="224" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="450" y1="206" x2="452" y2="224" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <!-- repeat-back bubble -->
  <rect x="370" y="236" width="124" height="52" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M412 288 L408 300 L424 288 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <text x="432" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">I hear that</text>
  <text x="432" y="274" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">you feel sad</text>
  <text x="417" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">say, sign, or point it back</text>

  <!-- bottom: listening can look different -->
  <text x="256" y="398" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">Listening can look different — all of it counts</text>

  <!-- signing listener (averted gaze ok) -->
  <circle cx="130" cy="436" r="11" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <path d="M119 434 A11 11 0 0 1 141 434 Z" fill="#4f6d7a"/>
  <circle cx="125" cy="436" r="1.5" fill="#2b3a42"/>
  <circle cx="135" cy="436" r="1.5" fill="#2b3a42"/>
  <path d="M125 443 Q130 447 135 443" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="121" y="448" width="18" height="26" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <!-- signing hand -->
  <line x1="139" y1="458" x2="152" y2="446" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <circle cx="153" cy="444" r="4" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <text x="130" y="494" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">signs "I hear you"</text>

  <!-- turning an ear listener -->
  <circle cx="382" cy="436" r="11" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M371 434 A11 11 0 0 1 393 434 Z" fill="#4f6d7a"/>
  <circle cx="377" cy="436" r="1.5" fill="#2b3a42"/>
  <circle cx="387" cy="436" r="1.5" fill="#2b3a42"/>
  <path d="M377 443 Q382 447 387 443" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="373" y="448" width="18" height="26" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <!-- turn an ear: head tilted, waves -->
  <g stroke="#4f6d7a" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M362 428 q-10 0 -10 9 q0 7 7 7"/>
    <path d="M354 428 q-16 0 -16 14 q0 10 10 10"/>
  </g>
  <text x="382" y="494" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">turns an ear to hear</text>

  <text x="256" y="490" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a" stroke="#fdfbf7" stroke-width="6" paint-order="stroke">both count &#183; both are listening</text>
</svg>
