<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Planning a sustained, polished piece</title>
  <desc id="desc">A writing plan drawn as a path. Five connected stations run left to right — audience, purpose, thesis, sections, evidence — ending at an arrow labeled draft. A figure stands at the start of the path. Labels carry the meaning, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Planning a Sustained Piece</text>

  <!-- Path -->
  <line x1="40" y1="230" x2="440" y2="230" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>

  <!-- Station 1: audience -->
  <circle cx="72" cy="230" r="34" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="72" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">audience</text>
  <text x="72" y="242" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">who</text>

  <!-- Station 2: purpose -->
  <circle cx="164" cy="230" r="34" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="164" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">purpose</text>
  <text x="164" y="242" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">why</text>

  <!-- Station 3: thesis -->
  <circle cx="256" cy="230" r="34" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">thesis</text>
  <text x="256" y="242" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">what</text>

  <!-- Station 4: sections -->
  <circle cx="348" cy="230" r="34" fill="#cbb79a" stroke="#2b3a42" stroke-width="2"/>
  <text x="348" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">sections</text>
  <text x="348" y="242" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">how</text>

  <!-- Station 5: evidence -->
  <circle cx="440" cy="230" r="34" fill="#9fb5a6" stroke="#2b3a42" stroke-width="2"/>
  <text x="440" y="226" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">evidence</text>
  <text x="440" y="242" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">support</text>

  <!-- Draft arrow -->
  <line x1="256" y1="150" x2="256" y2="192" stroke="#4f6d7a" stroke-width="3"/>
  <polygon points="256,192 250,183 262,183" fill="#4f6d7a"/>
  <rect x="198" y="104" width="116" height="40" rx="10" fill="#f0ede4" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="130" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">draft</text>

  <!-- Figure at start -->
  <g>
    <circle cx="72" cy="330" r="20" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="66" cy="325" r="2.2" fill="#2b3a42"/><circle cx="78" cy="325" r="2.2" fill="#2b3a42"/>
    <path d="M65 339 Q72 344 79 339" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M72 350 L58 384 M72 350 L86 384" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">plan first — the scaffold makes the piece finishable</text>
</svg>
