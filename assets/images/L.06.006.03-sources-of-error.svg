<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 560" role="img" aria-labelledby="title-L-06-006-03-sources-of-error desc-L-06-006-03-sources-of-error">
  <title id="title-L-06-006-03-sources-of-error">Sources of error in a measurement</title>
  <desc id="desc-L-06-006-03-sources-of-error">A diagram of the same pencil measured five times, each time with a slightly different reading. A pencil is drawn at the top, and beneath it five rulers each show a reading: trial 1 reads 12.1, trial 2 reads 12.0, trial 3 reads 12.2, trial 4 reads 11.9, and trial 5 reads 12.1 centimetres. An average box reads: average is about 12.1 cm. Below, three panels name three sources of error, each with a small drawing: tool limits (a ruler with only a few coarse marks), human reading (a person leaning in, eye off to one side of the mark, the dashed sight line landing at an angle), and conditions (the object shifted along the bench). A caption reads: careful measurements still differ a little; naming the source lets us reduce it. Labels and numbers, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="560" fill="#fdfbf7"/>

  <text x="256" y="32" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">The Same Object, Measured Five Times</text>
  <text x="256" y="54" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">careful measurements still differ a little</text>

  <!-- pencil -->
  <g transform="translate(60, 70)">
    <rect x="0" y="18" width="150" height="20" rx="3" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <polygon points="150,20 166,28 150,36" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <rect x="0" y="14" width="16" height="28" rx="2" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="250" y="32" font-family="sans-serif" font-size="13" fill="#222222">a pencil</text>
  </g>

  <!-- five rulers -->
  <g font-family="sans-serif">
    <g transform="translate(60, 120)">
      <rect x="0" y="0" width="160" height="22" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
      <g stroke="#2b3a42" stroke-width="1"><line x1="20" y1="0" x2="20" y2="10"/><line x1="50" y1="0" x2="50" y2="10"/><line x1="80" y1="0" x2="80" y2="10"/><line x1="110" y1="0" x2="110" y2="10"/><line x1="140" y1="0" x2="140" y2="10"/></g>
      <text x="8" y="16" font-size="12" fill="#222222">12.1</text>
      <text x="168" y="16" font-size="13" fill="#222222">trial 1</text>
    </g>
    <g transform="translate(60, 152)">
      <rect x="0" y="0" width="160" height="22" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
      <g stroke="#2b3a42" stroke-width="1"><line x1="20" y1="0" x2="20" y2="10"/><line x1="50" y1="0" x2="50" y2="10"/><line x1="80" y1="0" x2="80" y2="10"/><line x1="110" y1="0" x2="110" y2="10"/><line x1="140" y1="0" x2="140" y2="10"/></g>
      <text x="8" y="16" font-size="12" fill="#222222">12.0</text>
      <text x="168" y="16" font-size="13" fill="#222222">trial 2</text>
    </g>
    <g transform="translate(60, 184)">
      <rect x="0" y="0" width="160" height="22" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
      <g stroke="#2b3a42" stroke-width="1"><line x1="20" y1="0" x2="20" y2="10"/><line x1="50" y1="0" x2="50" y2="10"/><line x1="80" y1="0" x2="80" y2="10"/><line x1="110" y1="0" x2="110" y2="10"/><line x1="140" y1="0" x2="140" y2="10"/></g>
      <text x="8" y="16" font-size="12" fill="#222222">12.2</text>
      <text x="168" y="16" font-size="13" fill="#222222">trial 3</text>
    </g>
    <g transform="translate(60, 216)">
      <rect x="0" y="0" width="160" height="22" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
      <g stroke="#2b3a42" stroke-width="1"><line x1="20" y1="0" x2="20" y2="10"/><line x1="50" y1="0" x2="50" y2="10"/><line x1="80" y1="0" x2="80" y2="10"/><line x1="110" y1="0" x2="110" y2="10"/><line x1="140" y1="0" x2="140" y2="10"/></g>
      <text x="8" y="16" font-size="12" fill="#222222">11.9</text>
      <text x="168" y="16" font-size="13" fill="#222222">trial 4</text>
    </g>
    <g transform="translate(60, 248)">
      <rect x="0" y="0" width="160" height="22" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
      <g stroke="#2b3a42" stroke-width="1"><line x1="20" y1="0" x2="20" y2="10"/><line x1="50" y1="0" x2="50" y2="10"/><line x1="80" y1="0" x2="80" y2="10"/><line x1="110" y1="0" x2="110" y2="10"/><line x1="140" y1="0" x2="140" y2="10"/></g>
      <text x="8" y="16" font-size="12" fill="#222222">12.1</text>
      <text x="168" y="16" font-size="13" fill="#222222">trial 5</text>
    </g>
  </g>

  <!-- average box -->
  <rect x="280" y="120" width="200" height="60" rx="8" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
  <text x="380" y="146" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">average</text>
  <text x="380" y="168" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">≈ 12.1 cm</text>

  <!-- three sources, each with the thing its words name -->
  <g font-family="sans-serif">
    <rect x="20" y="300" width="150" height="146" rx="8" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
    <text x="95" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b3a42">tool limits</text>
    <text x="95" y="344" text-anchor="middle" font-size="12" fill="#222222">the ruler's marks</text>
    <text x="95" y="362" text-anchor="middle" font-size="12" fill="#222222">are coarse</text>
    <text x="95" y="382" text-anchor="middle" font-size="12" fill="#4f6d7a">use finer marks</text>
    <!-- a ruler with only a few coarse marks -->
    <rect x="63" y="398" width="64" height="20" rx="3" fill="#ffffff" stroke="#2b3a42"
          stroke-width="2"/>
    <g stroke="#2b3a42" stroke-width="2">
      <line x1="79" y1="398" x2="79" y2="408"/>
      <line x1="95" y1="398" x2="95" y2="408"/>
      <line x1="111" y1="398" x2="111" y2="408"/>
    </g>
    <line x1="63" y1="432" x2="127" y2="432" stroke="#4f6d7a" stroke-width="1.6"/>

    <rect x="182" y="300" width="150" height="146" rx="8" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
    <text x="257" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b3a42">human reading</text>
    <text x="257" y="344" text-anchor="middle" font-size="12" fill="#222222">the eye sits at</text>
    <text x="257" y="362" text-anchor="middle" font-size="12" fill="#222222">a slight angle</text>
    <text x="257" y="382" text-anchor="middle" font-size="12" fill="#4f6d7a">read straight on</text>
    <!-- a reader leaning in, eye off to one side of the mark -->
    <path d="M 222 436 Q 222 414 232 410 L 246 410 Q 253 414 253 422 L 253 436 Z"
          fill="#c98d5f" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="240" cy="398" r="11" fill="#c98d5f" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 229 396 Q 230 384 241 384 Q 251 384 252 393 Q 244 388 234 391 Q 230 393 229 396 Z"
          fill="#2b3a42"/>
    <circle cx="247" cy="398" r="1.8" fill="#2b3a42"/>
    <path d="M 248 401 L 280 427" fill="none" stroke="#4f6d7a" stroke-width="1.6"
          stroke-dasharray="4 3"/>
    <line x1="252" y1="428" x2="316" y2="428" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#2b3a42" stroke-width="1.6">
      <line x1="264" y1="428" x2="264" y2="433"/>
      <line x1="280" y1="428" x2="280" y2="433"/>
      <line x1="296" y1="428" x2="296" y2="433"/>
    </g>

    <rect x="344" y="300" width="150" height="146" rx="8" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
    <text x="419" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b3a42">conditions</text>
    <text x="419" y="344" text-anchor="middle" font-size="12" fill="#222222">the object</text>
    <text x="419" y="362" text-anchor="middle" font-size="12" fill="#222222">shifted</text>
    <text x="419" y="382" text-anchor="middle" font-size="12" fill="#4f6d7a">hold it steady</text>
    <!-- the same object, moved along the bench -->
    <rect x="396" y="418" width="40" height="12" rx="2" fill="#e0a458" stroke="#2b3a42"
          stroke-width="2"/>
    <path d="M 390 412 q 14 -12 34 -8" fill="none" stroke="#4f6d7a" stroke-width="2"
          stroke-linecap="round"/>
    <path d="M 419 400 L 426 404 L 419 409" fill="none" stroke="#4f6d7a" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="386" y1="434" x2="450" y2="434" stroke="#4f6d7a" stroke-width="1.6"/>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">naming the source lets us reduce it</text>
  <text x="256" y="494" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">repeat, average, and standardize — error is information, not a mistake</text>
</svg>
