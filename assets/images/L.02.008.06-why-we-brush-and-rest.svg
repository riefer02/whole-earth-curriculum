<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Why we brush and rest</title>
  <desc id="desc">On the left, a friendly tooth with a toothbrush and motion arcs, with sun and moon labeled morning and night, plus a chewing stick and a clean finger as other ways to clean teeth. On the right, a bed with a crescent moon and a sleeping child labeled rest and sleep, with the note that sleep helps the body grow, heal, and fight sickness. Labels and shapes carry the meaning in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Why We Brush and Rest</text>
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Clean teeth and enough sleep help the body stay well.</text>

  <!-- Brush panel -->
  <g>
    <rect x="16" y="92" width="232" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <text x="132" y="124" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">brush your teeth</text>
    <circle cx="132" cy="220" r="64" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M98 220 q34 -44 68 0 q-34 44 -68 0 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="200" y="204" width="44" height="16" rx="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M206 216 l-10 22 m0 0 l-12 -14" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <path d="M120 208 q6 -14 0 -28" fill="none" stroke="#6b93b6" stroke-width="2" stroke-linecap="round"/>
    <path d="M150 208 q6 -14 0 -28" fill="none" stroke="#6b93b6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="108" cy="120" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="108" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">morning</text>
    <circle cx="156" cy="120" r="14" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <text x="156" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">night</text>
    <text x="132" y="322" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">other ways: a chewing stick or a clean finger</text>
    <text x="132" y="344" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">brushing washes away bits that can hurt teeth</text>
    <text x="132" y="366" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">morning and night, about two minutes</text>
  </g>

  <!-- Rest panel -->
  <g>
    <rect x="264" y="92" width="232" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <text x="380" y="124" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">rest and sleep</text>
    <path d="M352 176 q40 -34 80 0 q-6 30 -22 30 q-14 0 -16 -8 q-2 8 -16 8 q-16 0 -26 -30 Z" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M344 176 q36 -28 72 0 l-6 14 q-30 -22 -60 0 Z" fill="#7a9e7e"/>
    <path d="M352 198 q4 -4 10 -2 m18 2 q4 -4 10 -2" stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="300" y="230" width="160" height="16" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M300 246 q80 14 160 0 l0 20 q-80 14 -160 0 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M344 200 q6 -14 0 -26 q-6 -8 -14 -8 l-10 4 q-6 -10 -18 -6 l-8 8 q-8 -4 -16 0 q-12 6 -12 22" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
    <text x="380" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">sleep helps your body grow, heal, and fight sickness</text>
    <text x="380" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">most children your age need about 9 to 12 hours</text>
    <text x="380" y="366" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">every body's rest can look a little different</text>
  </g>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Brush and rest — two ways to care for the body that cares for you.</text>
</svg>
