<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My five senses on a body map</title>
  <desc id="desc">A friendly front-facing body in a warm tone with five labeled sense spots. Leader lines point from the words see (eyes), hear (ears), smell (nose), taste (tongue), and touch (hands) to the matching body part, each ringed in a distinct shape of circle or oval. Labels and shapes — not color alone — carry the meaning, so it prints clearly in grayscale.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">My Five Senses</text>

  <!-- Body -->
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#c68a5b">
    <circle cx="256" cy="150" r="46"/>
    <rect x="218" y="196" width="76" height="132" rx="24"/>
    <line x1="222" y1="214" x2="188" y2="300" stroke-width="20"/>
    <line x1="290" y1="214" x2="324" y2="300" stroke-width="20"/>
    <line x1="236" y1="326" x2="236" y2="398" stroke-width="22"/>
    <line x1="276" y1="326" x2="276" y2="398" stroke-width="22"/>
    <circle cx="188" cy="302" r="11"/>
    <circle cx="324" cy="302" r="11"/>
    <rect x="220" y="396" width="30" height="12" rx="6"/>
    <rect x="262" y="396" width="30" height="12" rx="6"/>
  </g>

  <!-- Face -->
  <g fill="#2b3a42">
    <circle cx="238" cy="144" r="4"/>
    <circle cx="274" cy="144" r="4"/>
  </g>
  <path d="M250 152 L262 152 L256 166 Z" fill="#c68a5b" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M244 180 Q256 192 268 180" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="256" cy="184" rx="5" ry="3.4" fill="#7a9e7e"/>

  <!-- Ears -->
  <path d="M210 138 Q200 150 210 162" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <path d="M302 138 Q312 150 302 162" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>

  <!-- Sense spot rings (shape carries meaning: eye=circle, ear=oval, nose=oval, tongue=oval, hand=big circle) -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <circle cx="238" cy="144" r="12" stroke="#6b93b6"/>
    <ellipse cx="210" cy="150" rx="12" ry="16" stroke="#e0a458"/>
    <ellipse cx="256" cy="160" rx="12" ry="14" stroke="#7a9e7e"/>
    <ellipse cx="256" cy="184" rx="12" ry="9" stroke="#4f6d7a"/>
    <circle cx="188" cy="302" r="16" stroke="#e0a458"/>
  </g>

  <!-- Leader lines -->
  <g stroke="#4f6d7a" stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="146" y1="132" x2="225" y2="142"/>
    <line x1="146" y1="180" x2="198" y2="158"/>
    <line x1="146" y1="302" x2="172" y2="303"/>
    <line x1="366" y1="132" x2="271" y2="152"/>
    <line x1="366" y1="182" x2="269" y2="183"/>
  </g>

  <!-- Labels -->
  <g font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">
    <text x="146" y="128" text-anchor="end">see — eyes</text>
    <text x="146" y="176" text-anchor="end">hear — ears</text>
    <text x="146" y="298" text-anchor="end">touch — hands</text>
    <text x="366" y="128" text-anchor="start">smell — nose</text>
    <text x="366" y="178" text-anchor="start">taste — tongue</text>
  </g>

  <!-- Footer -->
  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">I carry my science tools everywhere.</text>
</svg>
