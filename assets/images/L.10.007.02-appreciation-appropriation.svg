<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Appreciation versus appropriation in visual art</title>
  <desc id="desc">Two side-by-side panels. The left panel, labeled "Honors the living tradition," shows a person holding a patterned textile beside symbols for asking, crediting, and sharing. The right panel, labeled "Takes from it," shows a person holding the same pattern beside symbols for no permission, no credit, and profit for oneself.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <!-- left panel -->
  <rect x="24" y="40" width="220" height="432" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="134" y="72" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#222222" font-weight="bold">Honors the living</text>
  <text x="134" y="94" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#222222" font-weight="bold">tradition</text>
  <!-- person with textile -->
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <circle cx="134" cy="150" r="18" fill="#c68863"/>
    <path d="M134 168 L134 240"/>
    <path d="M110 190 L158 190"/>
    <path d="M134 240 L116 300"/>
    <path d="M134 240 L152 300"/>
  </g>
  <rect x="104" y="176" width="60" height="44" fill="#7a9e7e" fill-opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
  <!-- symbols: ask / credit / share -->
  <g fill="none" stroke="#2b3a42" stroke-width="2">
    <circle cx="60" cy="320" r="22" fill="#6b93b6" fill-opacity="0.3"/>
    <text x="60" y="328" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222222">?</text>
    <circle cx="134" cy="320" r="22" fill="#7a9e7e" fill-opacity="0.3"/>
    <text x="134" y="328" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222222">C</text>
    <circle cx="208" cy="320" r="22" fill="#e0a458" fill-opacity="0.3"/>
    <text x="208" y="328" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222222">S</text>
  </g>
  <text x="60" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">asked</text>
  <text x="134" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">credited</text>
  <text x="208" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">shared</text>
  <text x="134" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">learned the meaning,</text>
  <text x="134" y="420" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">named the makers</text>
  <!-- right panel -->
  <rect x="268" y="40" width="220" height="432" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="378" y="72" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#222222" font-weight="bold">Takes from it</text>
  <!-- person with textile -->
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <circle cx="378" cy="150" r="18" fill="#8a5a44"/>
    <path d="M378 168 L378 240"/>
    <path d="M354 190 L402 190"/>
    <path d="M378 240 L360 300"/>
    <path d="M378 240 L396 300"/>
  </g>
  <rect x="348" y="176" width="60" height="44" fill="#7a9e7e" fill-opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
  <!-- symbols: no permission, no credit, profit -->
  <g fill="none" stroke="#2b3a42" stroke-width="2">
    <circle cx="304" cy="320" r="22" fill="#e0a458" fill-opacity="0.25"/>
    <path d="M288 304 L320 336" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="378" cy="320" r="22" fill="#e0a458" fill-opacity="0.25"/>
    <path d="M362 304 L394 336" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="452" cy="320" r="22" fill="#e0a458" fill-opacity="0.25"/>
    <text x="452" y="328" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222222">$</text>
  </g>
  <text x="304" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">no ask</text>
  <text x="378" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">no credit</text>
  <text x="452" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">profit</text>
  <text x="378" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">meaning stripped,</text>
  <text x="378" y="420" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">makers earn nothing</text>
</svg>
