<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-05-006-10-coordinates-perimeter desc-L-05-006-10-coordinates-perimeter">
  <title id="title-L-05-006-10-coordinates-perimeter">Coordinates, perimeter, and paths</title>
  <desc id="desc-L-05-006-10-coordinates-perimeter">A first-quadrant coordinate grid showing a rectangle with corners at (1,1), (5,1), (5,4), and (1,4). The side lengths are labeled: width 4 units across and height 3 units up. Below the grid, the perimeter is computed as 4 plus 3 plus 4 plus 3 equals 14 units. A dashed path from (1,1) to (5,4) along grid lines is also shown and labeled 4 plus 3 equals 7 units. Labels and counts, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="32" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#2b3a42">Coordinates: Perimeter and Paths</text>

  <g>
    <line x1="60" y1="60" x2="60" y2="320" stroke="#2b3a42" stroke-width="3"/>
    <line x1="60" y1="320" x2="360" y2="320" stroke="#2b3a42" stroke-width="3"/>
    <g stroke="#d7d1c8" stroke-width="1">
      <line x1="120" y1="60" x2="120" y2="320"/><line x1="180" y1="60" x2="180" y2="320"/>
      <line x1="240" y1="60" x2="240" y2="320"/><line x1="300" y1="60" x2="300" y2="320"/><line x1="360" y1="60" x2="360" y2="320"/>
      <line x1="60" y1="255" x2="360" y2="255"/><line x1="60" y1="190" x2="360" y2="190"/>
      <line x1="60" y1="125" x2="360" y2="125"/>
    </g>
    <text x="60" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">0</text>
    <text x="120" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">1</text>
    <text x="180" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">2</text>
    <text x="240" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">3</text>
    <text x="300" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">4</text>
    <text x="360" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">5</text>
    <text x="46" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">0</text>
    <text x="46" y="255" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">1</text>
    <text x="46" y="190" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">2</text>
    <text x="46" y="125" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">3</text>
    <text x="46" y="60" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">4</text>

    <!-- rectangle -->
    <rect x="120" y="125" width="240" height="195" fill="none" stroke="#7a9e7e" stroke-width="5"/>
    <circle cx="120" cy="320" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="360" cy="320" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="360" cy="125" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="120" cy="125" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="120" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">(1,1)</text>
    <text x="360" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">(5,1)</text>
    <text x="360" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">(5,4)</text>
    <text x="120" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">(1,4)</text>

    <text x="240" y="362" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#436b47">width = 4</text>
    <text x="112" y="214" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#436b47">height</text>
    <text x="112" y="230" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#436b47">= 3</text>

    <!-- dashed path (1,1) to (5,4) -->
    <path d="M 60 260 L 300 260 L 300 65" fill="none" stroke="#e0a458" stroke-width="3" stroke-dasharray="8 6"/>
  </g>

  <rect x="60" y="372" width="392" height="86" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="400" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#6b93b6">Perimeter (all the way around)</text>
  <text x="256" y="432" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222222">4 + 3 + 4 + 3 = 14 units</text>

  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">dashed path (1,1)→(5,4) along grid lines: 4 + 3 = 7 units</text>
</svg>
