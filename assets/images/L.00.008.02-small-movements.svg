<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Small movements</title>
  <desc id="desc">Four small hand movements in labeled panels: a hand stacking blocks into a tower, a hand holding a crayon to draw a zigzag line, a hand pinching a small bead between thumb and first finger, and a hand threading beads onto a string. Each panel has a word label — stack, draw, pinch, thread — so the meaning does not depend on color.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Small Movements</text>

  <!-- STACK panel -->
  <g>
    <rect x="20" y="60" width="228" height="170" rx="14" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
    <!-- tower -->
    <g fill="#6b93b6" stroke="#2b3a42" stroke-width="2">
      <rect x="150" y="178" width="46" height="20" rx="5"/>
      <rect x="150" y="156" width="46" height="20" rx="5"/>
      <rect x="150" y="134" width="46" height="20" rx="5"/>
      <rect x="150" y="112" width="46" height="20" rx="5"/>
    </g>
    <!-- hand placing top block -->
    <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round">
      <rect x="74" y="92" width="34" height="30" rx="12" fill="#c99567"/>
      <rect x="100" y="98" width="16" height="9" rx="4" fill="#c99567"/>
      <rect x="100" y="110" width="16" height="9" rx="4" fill="#c99567"/>
    </g>
    <text x="134" y="216" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">stack</text>
  </g>

  <!-- DRAW panel -->
  <g>
    <rect x="264" y="60" width="228" height="170" rx="14" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
    <!-- paper -->
    <rect x="336" y="112" width="116" height="84" rx="6" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <path d="M348 170 L372 140 L396 172 L420 138" fill="none" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- crayon + hand -->
    <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="398" y1="96" x2="370" y2="152" stroke="#e0a458" stroke-width="10"/>
      <line x1="398" y1="96" x2="370" y2="152" stroke="#2b3a42" stroke-width="2"/>
      <rect x="394" y="96" width="22" height="22" rx="10" fill="#f1c9a5"/>
      <rect x="402" y="108" width="10" height="10" rx="4" fill="#f1c9a5"/>
    </g>
    <text x="378" y="216" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">draw</text>
  </g>

  <!-- PINCH panel -->
  <g>
    <rect x="20" y="242" width="228" height="170" rx="14" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
    <!-- pile of beads -->
    <g fill="#e0a458" stroke="#2b3a42" stroke-width="2">
      <circle cx="160" cy="196" r="10"/>
      <circle cx="142" cy="204" r="10"/>
      <circle cx="176" cy="204" r="10"/>
      <circle cx="160" cy="214" r="10"/>
    </g>
    <!-- pinching fingers -->
    <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M96 152 Q112 168 128 178" fill="none" stroke="#a47148" stroke-width="12"/>
      <path d="M116 132 Q128 150 132 168" fill="none" stroke="#a47148" stroke-width="12"/>
      <circle cx="130" cy="176" r="6" fill="#a47148"/>
    </g>
    <!-- bead being pinched -->
    <circle cx="134" cy="182" r="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="134" y="398" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">pinch</text>
  </g>

  <!-- THREAD panel -->
  <g>
    <rect x="264" y="242" width="228" height="170" rx="14" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
    <!-- string with beads -->
    <line x1="308" y1="330" x2="452" y2="330" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#2b3a42" stroke-width="2">
      <circle cx="340" cy="330" r="12" fill="#6b93b6"/>
      <circle cx="374" cy="330" r="12" fill="#e0a458"/>
      <circle cx="408" cy="330" r="12" fill="#7a9e7e"/>
      <circle cx="436" cy="330" r="10" fill="#fdfbf7"/>
    </g>
    <!-- hand holding string end -->
    <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round">
      <rect x="452" y="312" width="30" height="40" rx="12" fill="#8f5f3d"/>
      <rect x="474" y="318" width="9" height="10" rx="4" fill="#8f5f3d"/>
      <rect x="474" y="332" width="9" height="10" rx="4" fill="#8f5f3d"/>
    </g>
    <text x="378" y="398" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">thread</text>
  </g>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Hands do careful work — slowly, one small move at a time.</text>
</svg>
