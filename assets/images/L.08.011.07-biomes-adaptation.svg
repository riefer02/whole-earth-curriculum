<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Biomes and adaptation: desert and rainforest</title>
  <desc id="desc">A side-by-side comparison of a hot dry desert with a cactus and a lizard, and a wet rainforest with tall trees and broad leaves, each with labels describing the adaptations such as water storage and drip-tip leaves.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">Desert vs. Rainforest</text>

  <!-- desert -->
  <rect x="24" y="70" width="220" height="300" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="24" y="310" width="220" height="60" fill="#e0a458"/>
  <circle cx="70" cy="96" r="18" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="70" y1="114" x2="70" y2="128" stroke="#2b3a42" stroke-width="2"/>
  <path d="M42 148 q8 -16 0 -32 q-8 -16 0 -32 M70 148 q8 -20 0 -40 q-8 -20 0 -40 M98 148 q8 -16 0 -32 q-8 -16 0 -32" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <path d="M70 150 v44" stroke="#7a9e7e" stroke-width="3"/>
  <ellipse cx="170" cy="300" rx="20" ry="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="134" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Desert: hot &amp; dry</text>
  <text x="134" y="362" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">cactus stores water · spiny leaves</text>
  <text x="134" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">lizard is nocturnal</text>

  <!-- rainforest -->
  <rect x="268" y="70" width="220" height="300" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="268" y="310" width="220" height="60" fill="#7a9e7e"/>
  <path d="M300 310 q4 -36 0 -72 M340 310 q4 -44 0 -88 M380 310 q4 -36 0 -72 M420 310 q4 -30 0 -60" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="300" cy="230" r="20" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
  <circle cx="340" cy="212" r="22" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
  <circle cx="380" cy="228" r="20" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
  <path d="M268 90 q40 8 80 0 q40 -8 80 0" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <text x="378" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Rainforest: hot &amp; wet</text>
  <text x="378" y="362" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">tall trees race for light</text>
  <text x="378" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">drip-tip leaves shed rain</text>

  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Form fits place: desert saves water, rainforest sheds it.</text>
  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">No biome is "better" — each is a set of living answers to a place.</text>
</svg>
