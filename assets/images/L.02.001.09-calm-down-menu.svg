<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Two ways to calm down</title>
  <desc id="desc">A menu card showing two calming strategies. Left card: "take three slow breaths," with a flower to smell on the in-breath and a bowl of soup to blow on for the out-breath. Right card: "count slowly to ten," with the numbers 1 through 10 in a row. At the bottom, a star labeled "my choice" invites the learner to mark which one they will use. A note says a calm-down is a helpful tool, never a punishment. Shapes and words, not color, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Two Ways to Calm Down</text>

  <!-- Card 1: three slow breaths -->
  <g>
    <rect x="24" y="76" width="222" height="250" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <!-- flower -->
    <circle cx="135" cy="150" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="122" cy="136" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="148" cy="136" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="120" cy="152" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="150" cy="152" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="135" y1="157" x2="135" y2="180" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round"/>
    <path d="M120 168 Q135 160 150 168 Q135 176 120 168 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <!-- soup bowl -->
    <path d="M105 218 Q135 212 165 218 L158 232 Q135 238 112 232 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="135" y="268" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">take three slow breaths</text>
    <text x="135" y="294" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">in like a flower,</text>
    <text x="135" y="312" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">out like hot soup</text>
  </g>

  <!-- Card 2: count to ten -->
  <g>
    <rect x="266" y="76" width="222" height="250" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <text x="300" y="150" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#6b93b6">1</text>
    <text x="330" y="150" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#6b93b6">2</text>
    <text x="360" y="150" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#6b93b6">3</text>
    <text x="390" y="150" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#6b93b6">4</text>
    <text x="420" y="150" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#6b93b6">5</text>
    <text x="300" y="200" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">6</text>
    <text x="330" y="200" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">7</text>
    <text x="360" y="200" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">8</text>
    <text x="390" y="200" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">9</text>
    <text x="420" y="200" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">10</text>
    <text x="377" y="268" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">count slowly to ten</text>
    <text x="377" y="294" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">one slow, soft</text>
    <text x="377" y="312" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">step at a time</text>
  </g>

  <!-- my choice -->
  <g>
    <path d="M256 382 L262 395 L277 396 L266 405 L269 420 L256 412 L243 420 L246 405 L235 396 L250 395 Z" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="256" y="448" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">my choice</text>
  </g>

  <text x="256" y="490" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">A calm-down is a helpful tool, never a punishment.</text>
</svg>
