<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 470" role="img" aria-labelledby="title desc">
  <title id="title">Solar and lunar eclipses</title>
  <desc id="desc">An eclipse diagram with two panels, labeled not to scale. The top panel shows a solar eclipse: the Sun on the left, the Moon in the middle directly between the Sun and Earth, and Earth on the right, with the Moon's shadow cone narrowing to a small spot on Earth. A label reads: the Moon's shadow falls on Earth — solar eclipse (new moon). The bottom panel shows a lunar eclipse: the Sun on the left, Earth in the middle, and the Moon on the right, with Earth's shadow cone widening to cover the Moon. A label reads: Earth's shadow falls on the Moon — lunar eclipse (full moon). Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="470" fill="#fdfbf7"/>

  <text x="256" y="28" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Eclipses: When Shadows Meet</text>
  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">not to scale</text>

  <!-- SOLAR ECLIPSE (top) -->
  <text x="256" y="76" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Solar eclipse — new moon</text>

  <circle cx="80" cy="120" r="30" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="80" y="125" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Sun</text>

  <circle cx="280" cy="120" r="14" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="280" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">Moon</text>

  <circle cx="430" cy="120" r="34" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="430" y="124" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Earth</text>

  <!-- moon shadow cone -->
  <path d="M280,120 L440,86 L440,154 Z" fill="#4f6d7a" opacity="0.35" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="256" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">the Moon's shadow falls on Earth</text>

  <line x1="256" y1="202" x2="256" y2="222" stroke="#2b3a42" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- LUNAR ECLIPSE (bottom) -->
  <text x="256" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Lunar eclipse — full moon</text>

  <circle cx="80" cy="300" r="30" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="80" y="305" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Sun</text>

  <circle cx="280" cy="300" r="34" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="280" y="304" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Earth</text>

  <circle cx="430" cy="300" r="14" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="430" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">Moon</text>

  <!-- earth shadow cone -->
  <path d="M280,300 L424,272 L424,328 Z" fill="#4f6d7a" opacity="0.35" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="256" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">Earth's shadow falls on the Moon</text>

  <text x="256" y="410" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">the Moon's orbit is tilted, so the three do not line up every month</text>
  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">that is why eclipses are rare — and why they can be predicted</text>
</svg>
