<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title>Peacebuilding strategies</title>
  <desc>Three labeled pathways — nonviolent resistance, dialogue and mediation, truth and reconciliation — converging from a conflict on the left toward a peaceful center on the right, grayscale-printable.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <g font-family="sans-serif" text-anchor="middle">
    <!-- conflict -->
    <circle cx="96" cy="256" r="46" fill="#e8eef2" stroke="#2b3a42" stroke-width="2"/>
    <text x="96" y="252" font-size="15" font-weight="bold" fill="#222222">conflict</text>
    <text x="96" y="272" font-size="11" fill="#4f6d7a">(not violence)</text>
    <!-- peace -->
    <circle cx="416" cy="256" r="52" fill="#eef3e8" stroke="#2b3a42" stroke-width="2"/>
    <text x="416" y="252" font-size="15" font-weight="bold" fill="#222222">peace</text>
    <text x="416" y="272" font-size="11" fill="#4f6d7a">built, not just kept</text>
    <!-- three pathways -->
    <g stroke="#2b3a42" stroke-width="2" fill="none">
      <path d="M142 256 C 200 140, 300 140, 364 256"/>
      <path d="M142 256 C 220 256, 320 256, 364 256"/>
      <path d="M142 256 C 200 372, 300 372, 364 256"/>
    </g>
    <!-- labels -->
    <text x="252" y="126" font-size="13" fill="#222222">nonviolent resistance</text>
    <text x="252" y="248" font-size="13" fill="#222222">dialogue &amp; mediation</text>
    <text x="252" y="392" font-size="13" fill="#222222">truth &amp; reconciliation</text>
    <text x="256" y="486" font-size="14" fill="#2b3a42">different settings call for different strategies</text>
  </g>
</svg>
