<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" font-family="sans-serif">
  <title>An ecosystem diagram of a pond edge</title>
  <desc>A labeled ecosystem diagram of a pond edge. The sun shines in the sky, a plant grows by the water, a frog sits on the bank, and soil is under the ground. Arrows show the plant depends on the sun, water, and soil, and the frog depends on the plant. A label notes the frog's strong legs as an adaptation.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="38" text-anchor="middle" font-size="24" fill="#222222" font-weight="bold">My ecosystem diagram: a pond edge</text>

  <!-- Sky -->
  <rect x="30" y="60" width="452" height="150" fill="#6b93b6" opacity="0.18"/>

  <!-- Sun -->
  <circle cx="420" cy="100" r="30" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <g stroke="#e0a458" stroke-width="3" stroke-linecap="round">
    <line x1="420" y1="56" x2="420" y2="42"/>
    <line x1="420" y1="144" x2="420" y2="158"/>
    <line x1="376" y1="100" x2="362" y2="100"/>
    <line x1="464" y1="100" x2="478" y2="100"/>
  </g>
  <text x="420" y="180" text-anchor="middle" font-size="14" fill="#222222">sunlight</text>
  <text x="420" y="196" text-anchor="middle" font-size="12" fill="#4f6d7a">(nonliving)</text>

  <!-- Water -->
  <rect x="30" y="300" width="452" height="120" fill="#6b93b6" opacity="0.4"/>
  <path d="M30 300 Q70 288 120 300 T210 300 T300 300 T390 300 T482 300" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <text x="120" y="340" text-anchor="middle" font-size="15" fill="#222222">water</text>
  <text x="120" y="358" text-anchor="middle" font-size="12" fill="#4f6d7a">(nonliving)</text>

  <!-- Soil -->
  <rect x="30" y="420" width="452" height="50" fill="#7a9e7e" opacity="0.55"/>
  <text x="250" y="452" text-anchor="middle" font-size="15" fill="#222222">soil</text>
  <text x="250" y="468" text-anchor="middle" font-size="12" fill="#4f6d7a">(nonliving)</text>

  <!-- Plant -->
  <g>
    <line x1="160" y1="420" x2="160" y2="330" stroke="#2b3a42" stroke-width="5"/>
    <ellipse cx="146" cy="330" rx="18" ry="11" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="174" cy="330" rx="18" ry="11" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="160" cy="316" rx="14" ry="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="160" y="270" text-anchor="middle" font-size="15" fill="#222222">plant</text>
  <text x="160" y="286" text-anchor="middle" font-size="12" fill="#4f6d7a">(living)</text>

  <!-- Frog -->
  <g>
    <ellipse cx="300" cy="390" rx="28" ry="20" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
    <circle cx="312" cy="382" r="6" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="314" cy="382" r="3" fill="#222222"/>
    <path d="M284 406 Q268 452 254 464" fill="none" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <path d="M316 406 Q332 452 346 464" fill="none" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="300" y="434" text-anchor="middle" font-size="15" fill="#222222">frog</text>
  <text x="300" y="450" text-anchor="middle" font-size="12" fill="#4f6d7a">(living)</text>

  <!-- Dependence arrows -->
  <g stroke="#e0a458" stroke-width="3" fill="none">
    <line x1="410" y1="150" x2="170" y2="300" marker-end="none"/>
    <polygon points="170,300 182,292 180,306" fill="#e0a458"/>
  </g>
  <g stroke="#e0a458" stroke-width="3" fill="none">
    <line x1="150" y1="350" x2="156" y2="330"/>
    <line x1="168" y1="414" x2="164" y2="360"/>
  </g>
  <g stroke="#e0a458" stroke-width="3" fill="none">
    <line x1="300" y1="392" x2="190" y2="352"/>
  </g>

  <!-- Adaptation note -->
  <rect x="250" y="234" width="212" height="56" rx="10" fill="#e0a458" opacity="0.25" stroke="#e0a458" stroke-width="2"/>
  <text x="356" y="256" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">Adaptation</text>
  <text x="356" y="276" text-anchor="middle" font-size="13" fill="#4f6d7a">Strong legs help the frog leap away.</text>

  <!-- Legend arrows -->
  <g stroke="#e0a458" stroke-width="3" fill="none">
    <line x1="60" y1="480" x2="90" y2="480"/>
    <polygon points="90,480 82,475 82,485" fill="#e0a458"/>
  </g>
  <text x="98" y="485" font-size="13" fill="#222222">arrow = depends on</text>
</svg>
