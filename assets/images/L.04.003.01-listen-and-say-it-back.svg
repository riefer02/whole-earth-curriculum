<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Listen and say it back</title>
  <desc id="desc">Two children facing each other in a listening loop. One speaks, the other replies with the words "So what I hear you saying is…". A circling arrow labeled "listen → say it back → check" links them, with a small "Did I get it right?" bubble. The words and shapes carry the meaning, not color, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Listen and Say It Back</text>

  <!-- Speaker child (left) -->
  <g stroke="#2b3a42" stroke-width="2" fill="#c99567">
    <circle cx="150" cy="210" r="30"/>
  </g>
  <g fill="#2b3a42">
    <circle cx="141" cy="206" r="2.5"/><circle cx="159" cy="206" r="2.5"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M141 218 Q150 224 159 218"/>
  </g>
  <!-- Speaker body -->
  <path d="M150 240 L150 300" stroke="#2b3a42" stroke-width="2"/>
  <!-- Speech bubble from speaker -->
  <rect x="70" y="120" width="150" height="46" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="145" y="138" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">"I was nervous</text>
  <text x="145" y="155" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">before the test."</text>

  <!-- Listener child (right) -->
  <g stroke="#2b3a42" stroke-width="2" fill="#6b4f3a">
    <circle cx="362" cy="210" r="30"/>
  </g>
  <g fill="#2b3a42">
    <circle cx="353" cy="206" r="2.5"/><circle cx="371" cy="206" r="2.5"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M353 218 Q362 224 371 218"/>
  </g>
  <path d="M362 240 L362 300" stroke="#2b3a42" stroke-width="2"/>
  <!-- Paraphrase bubble from listener -->
  <rect x="292" y="120" width="180" height="64" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="382" y="138" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">"So what I hear you</text>
  <text x="382" y="155" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">saying is you were</text>
  <text x="382" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">worried. Did I get it right?"</text>

  <!-- Circling loop arrows between them -->
  <path d="M196 250 Q256 320 316 250" fill="none" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
  <path d="M316 268 Q256 338 196 268" fill="none" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
  <g fill="#7a9e7e">
    <path d="M196 250 l-10 -2 l8 8 z"/>
    <path d="M316 268 l10 -2 l-8 8 z"/>
  </g>

  <!-- Loop label -->
  <rect x="176" y="300" width="160" height="40" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="325" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">listen · say it back · check</text>

  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">Hearing is not enough — say it back.</text>
  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Put their idea into your own words, then check you got it right.</text>
</svg>
