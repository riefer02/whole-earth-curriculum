<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Reading a peer's boundary: verbal and nonverbal cues</title>
  <desc id="d">Two figures face each other. The figure on the right holds up an open palm and leans slightly back, with a speech bubble saying "no thanks." Around them, three small cue cards label what to read: the words, the body, and the voice. The other figure pauses and steps back, showing respect for the signal. Figures differ in skin tone; one uses a wheelchair.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Reading a peer's boundary</text>

  <!-- Left figure (approaching): pauses, steps back -->
  <g transform="translate(0,-18) rotate(-6 150 378)">
    <g fill="#e6bb92">
      <circle cx="150" cy="222" r="23"/>
      <rect x="144" y="242" width="12" height="16" rx="5"/>
      <rect x="126" y="256" width="48" height="72" rx="20"/>
      <path d="M 130 264 Q 118 286 122 306" stroke="#e6bb92" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M 170 264 Q 182 286 178 306" stroke="#e6bb92" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M 139 326 L 135 370" stroke="#e6bb92" stroke-width="18" stroke-linecap="round" fill="none"/>
      <path d="M 161 326 L 165 370" stroke="#e6bb92" stroke-width="18" stroke-linecap="round" fill="none"/>
      <ellipse cx="133" cy="374" rx="12" ry="6"/>
      <ellipse cx="167" cy="374" rx="12" ry="6"/>
    </g>
    <circle cx="142" cy="217" r="3.2" fill="#2b3a42"/>
    <circle cx="158" cy="217" r="3.2" fill="#2b3a42"/>
    <path d="M141 234 Q150 241 159 234" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="150" y="388" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">pauses, steps back</text>

  <!-- Right figure (setting a boundary): a wheelchair user, open palm out -->
  <g>
    <!-- chair -->
    <circle cx="360" cy="336" r="34" fill="none" stroke="#2b3a42" stroke-width="3"/>
    <circle cx="360" cy="336" r="5" fill="#2b3a42"/>
    <circle cx="330" cy="362" r="7" fill="none" stroke="#2b3a42" stroke-width="3"/>
    <rect x="332" y="298" width="56" height="9" rx="4" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <rect x="382" y="252" width="9" height="50" rx="4" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 334 350 L 312 350" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M 382 302 L 394 340" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <!-- person -->
    <g fill="#8f5f3d">
      <circle cx="358" cy="224" r="21"/>
      <rect x="352" y="243" width="12" height="16" rx="5"/>
      <rect x="342" y="256" width="38" height="48" rx="16"/>
      <path d="M 358 300 L 322 306" stroke="#8f5f3d" stroke-width="16" stroke-linecap="round" fill="none"/>
      <path d="M 322 306 L 318 342" stroke="#8f5f3d" stroke-width="14" stroke-linecap="round" fill="none"/>
      <ellipse cx="314" cy="346" rx="10" ry="5"/>
      <path d="M 344 266 L 328 282 L 312 266" stroke="#8f5f3d" stroke-width="12" stroke-linecap="round"
            stroke-linejoin="round" fill="none"/>
    </g>
    <!-- open palm: the boundary signal -->
    <path d="M 310 268 q -8 -2 -10 -10 q -1 -7 5 -7 q 6 0 8 6 q -6 -12 1 -14 q 6 -2 8 8 q -2 -12 5 -12 q 6 0 6 11 q 0 12 -10 18 z"
          fill="#8f5f3d"/>
    <circle cx="350" cy="219" r="3" fill="#2b3a42"/>
    <circle cx="366" cy="219" r="3" fill="#2b3a42"/>
    <path d="M349 236 Q358 232 367 236" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- speech bubble -->
    <path d="M356 150 L420 150 L420 120 L392 120 L376 104 L370 120 L356 120 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="388" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">no thanks</text>
  </g>

  <!-- Cue cards -->
  <g>
    <rect x="30" y="396" width="452" height="96" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <text x="52" y="424" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">words</text>
    <text x="52" y="448" font-family="sans-serif" font-size="12" fill="#4f6d7a">"no," "stop," "not now"</text>
    <text x="210" y="424" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">body</text>
    <text x="210" y="448" font-family="sans-serif" font-size="12" fill="#4f6d7a">palm up, leaning back,</text>
    <text x="210" y="466" font-family="sans-serif" font-size="12" fill="#4f6d7a">turning away</text>
    <text x="360" y="424" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">voice</text>
    <text x="360" y="448" font-family="sans-serif" font-size="12" fill="#4f6d7a">flat, quiet, or firm</text>
  </g>
</svg>
