<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Tools all around me</title>
  <desc id="desc">Four boxes, each a place where a tool lives, with a label: a pot in a kitchen, a hoe in a field, a basket at a market, and a bicycle on a road. Under each tool is the job it helps with. Each place is named in words and each tool is drawn simply, so the picture prints clearly in grayscale and shows that every place has its own tools and no place's tools are more important than another's.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Tools All Around Me</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">A tool lives in a place, and every place has its own tools.</text>

  <!-- ===== Panel A: kitchen / pot ===== -->
  <rect x="24" y="100" width="224" height="176" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="128" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">Kitchen</text>
  <!-- pot -->
  <path d="M78 164 L86 214 Q110 228 134 214 L142 164 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <rect x="74" y="156" width="72" height="12" rx="5" fill="#8fb0cc" stroke="#2b3a42" stroke-width="2"/>
  <path d="M138 168 Q154 170 140 184" fill="none" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <path d="M86 168 Q102 170 88 184" fill="none" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <!-- steam -->
  <path d="M104 144 q3 -8 0 -16" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 144 q3 -8 0 -16" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <text x="136" y="256" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">a pot cooks food</text>

  <!-- ===== Panel B: field / hoe ===== -->
  <rect x="264" y="100" width="224" height="176" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="128" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">Field</text>
  <!-- soil line -->
  <line x1="336" y1="220" x2="416" y2="220" stroke="#2b3a42" stroke-width="2"/>
  <!-- sprouts -->
  <g stroke="#7a9e7e" stroke-width="4" stroke-linecap="round">
    <line x1="344" y1="220" x2="344" y2="200"/>
    <path d="M344 208 q -6 -3 -8 -10" fill="none"/>
  </g>
  <g stroke="#7a9e7e" stroke-width="4" stroke-linecap="round">
    <line x1="360" y1="220" x2="360" y2="196"/>
    <path d="M360 204 q -6 -3 -8 -10" fill="none"/>
  </g>
  <!-- hoe -->
  <line x1="404" y1="140" x2="396" y2="212" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
  <path d="M392 206 L418 196 L416 214 L390 222 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <text x="376" y="256" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">a hoe turns the soil</text>

  <!-- ===== Panel C: market / basket ===== -->
  <rect x="24" y="292" width="224" height="176" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="320" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">Market</text>
  <!-- basket -->
  <path d="M74 350 L84 416 Q110 430 136 416 L146 350 Z" fill="#d7d1c3" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <line x1="74" y1="350" x2="146" y2="350" stroke="#2b3a42" stroke-width="2"/>
  <path d="M96 350 Q110 332 124 350" fill="none" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  <!-- food in basket -->
  <circle cx="92" cy="344" r="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="128" cy="344" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="110" cy="338" r="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="448" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">a basket carries food</text>

  <!-- ===== Panel D: road / bicycle ===== -->
  <rect x="264" y="292" width="224" height="176" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="320" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">Road</text>
  <!-- road line -->
  <line x1="336" y1="420" x2="416" y2="420" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <!-- bicycle -->
  <circle cx="352" cy="386" r="26" fill="none" stroke="#2b3a42" stroke-width="6"/>
  <circle cx="400" cy="386" r="26" fill="none" stroke="#2b3a42" stroke-width="6"/>
  <circle cx="352" cy="386" r="5" fill="#2b3a42"/>
  <circle cx="400" cy="386" r="5" fill="#2b3a42"/>
  <line x1="352" y1="386" x2="376" y2="360" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="400" y1="386" x2="376" y2="360" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="376" y1="360" x2="376" y2="352" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="376" y1="352" x2="360" y2="340" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="376" y1="352" x2="392" y2="340" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="352" y1="386" x2="352" y2="360" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <text x="376" y="448" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">a bicycle carries a rider</text>

  <!-- Footer -->
  <text x="256" y="494" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Every place has its own tools, and every tool helps someone do a job.</text>
</svg>
