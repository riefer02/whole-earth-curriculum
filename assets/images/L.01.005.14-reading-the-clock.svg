<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Telling time: o'clock and half past</title>
  <desc id="desc">Two clock faces are shown side by side. The left clock shows 3 o'clock: the short hour hand points to the 3 and the long minute hand points straight up to the 12, written 3:00. The right clock shows half past 3: the short hour hand points between the 3 and the 4 and the long minute hand points down to the 6, written 3:30. Each clock has all twelve numbers and tick marks. A note explains the short hand tells the hour and the long hand tells the minutes, and that people have kept time in many ways. Numbers and labels carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Telling Time</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Read the clock to the hour and half hour.</text>
  <text x="256" y="96" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">short hand = hour &#8226; long hand = minutes</text>

  <!-- Clock 1: 3:00 -->
  <circle cx="150" cy="270" r="78" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="150" y1="196" x2="150" y2="204" transform="rotate(0 150 270)"/>
    <line x1="150" y1="196" x2="150" y2="204" transform="rotate(30 150 270)"/>
    <line x1="150" y1="196" x2="150" y2="204" transform="rotate(60 150 270)"/>
    <line x1="150" y1="196" x2="150" y2="204" transform="rotate(90 150 270)"/>
    <line x1="150" y1="196" x2="150" y2="204" transform="rotate(120 150 270)"/>
    <line x1="150" y1="196" x2="150" y2="204" transform="rotate(150 150 270)"/>
    <line x1="150" y1="196" x2="150" y2="204" transform="rotate(180 150 270)"/>
    <line x1="150" y1="196" x2="150" y2="204" transform="rotate(210 150 270)"/>
    <line x1="150" y1="196" x2="150" y2="204" transform="rotate(240 150 270)"/>
    <line x1="150" y1="196" x2="150" y2="204" transform="rotate(270 150 270)"/>
    <line x1="150" y1="196" x2="150" y2="204" transform="rotate(300 150 270)"/>
    <line x1="150" y1="196" x2="150" y2="204" transform="rotate(330 150 270)"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">
    <text x="150" y="220">12</text>
    <text x="179" y="224">1</text>
    <text x="200" y="245">2</text>
    <text x="208" y="274" font-size="15" font-weight="bold">3</text>
    <text x="200" y="303">4</text>
    <text x="179" y="324">5</text>
    <text x="150" y="332" font-size="15" font-weight="bold">6</text>
    <text x="121" y="324">7</text>
    <text x="100" y="303">8</text>
    <text x="92" y="274" font-size="15" font-weight="bold">9</text>
    <text x="100" y="245">10</text>
    <text x="121" y="224">11</text>
  </g>
  <!-- hands: minute to 12, hour to 3 -->
  <line x1="150" y1="270" x2="150" y2="212" stroke="#4f6d7a" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="270" x2="194" y2="270" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
  <circle cx="150" cy="270" r="6" fill="#2b3a42"/>
  <text x="150" y="378" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">3 o'clock</text>
  <text x="150" y="400" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">= 3:00</text>

  <!-- Clock 2: half past 3 -->
  <circle cx="362" cy="270" r="78" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="362" y1="196" x2="362" y2="204" transform="rotate(0 362 270)"/>
    <line x1="362" y1="196" x2="362" y2="204" transform="rotate(30 362 270)"/>
    <line x1="362" y1="196" x2="362" y2="204" transform="rotate(60 362 270)"/>
    <line x1="362" y1="196" x2="362" y2="204" transform="rotate(90 362 270)"/>
    <line x1="362" y1="196" x2="362" y2="204" transform="rotate(120 362 270)"/>
    <line x1="362" y1="196" x2="362" y2="204" transform="rotate(150 362 270)"/>
    <line x1="362" y1="196" x2="362" y2="204" transform="rotate(180 362 270)"/>
    <line x1="362" y1="196" x2="362" y2="204" transform="rotate(210 362 270)"/>
    <line x1="362" y1="196" x2="362" y2="204" transform="rotate(240 362 270)"/>
    <line x1="362" y1="196" x2="362" y2="204" transform="rotate(270 362 270)"/>
    <line x1="362" y1="196" x2="362" y2="204" transform="rotate(300 362 270)"/>
    <line x1="362" y1="196" x2="362" y2="204" transform="rotate(330 362 270)"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">
    <text x="362" y="220">12</text>
    <text x="391" y="224">1</text>
    <text x="412" y="245">2</text>
    <text x="420" y="274" font-size="15" font-weight="bold">3</text>
    <text x="412" y="303">4</text>
    <text x="391" y="324">5</text>
    <text x="362" y="332" font-size="15" font-weight="bold">6</text>
    <text x="333" y="324">7</text>
    <text x="312" y="303">8</text>
    <text x="304" y="274" font-size="15" font-weight="bold">9</text>
    <text x="312" y="245">10</text>
    <text x="333" y="224">11</text>
  </g>
  <!-- hands: minute to 6, hour between 3 and 4 -->
  <line x1="362" y1="270" x2="362" y2="328" stroke="#4f6d7a" stroke-width="4" stroke-linecap="round"/>
  <line x1="362" y1="270" x2="404" y2="281" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
  <circle cx="362" cy="270" r="6" fill="#2b3a42"/>
  <text x="362" y="378" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">half past 3</text>
  <text x="362" y="400" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">= 3:30</text>

  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">People have kept time in many ways &#8212; sun, sand, water, and the clock.</text>
  <text x="256" y="474" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">A clock turns the day's rhythm into numbers you can read and write.</text>
</svg>
