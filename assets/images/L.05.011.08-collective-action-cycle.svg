<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Plan, do, reflect: collective action for the common good</title>
  <desc id="desc">A circular three-step diagram labeled "plan," "do," and "reflect," with arrows flowing from one to the next in a loop. In the center, three children work together carrying a bundle, with the caption "collective action for the common good." Each step has one sentence: plan (choose the action and roles), do (carry it out together), reflect (what worked, what to change). Labels, arrows, and shapes carry the meaning, so it prints clearly in grayscale independent of color.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Plan &#8594; Do &#8594; Reflect</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">collective action for the common good</text>

  <!-- central image: three children carrying a bundle -->
  <circle cx="210" cy="256" r="16" fill="#c98a5b" stroke="#2b3a42" stroke-width="2"/>
  <rect x="196" y="272" width="28" height="24" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="256" cy="252" r="16" fill="#8a5a3b" stroke="#2b3a42" stroke-width="2"/>
  <rect x="242" y="268" width="28" height="24" rx="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="302" cy="256" r="16" fill="#d9a05b" stroke="#2b3a42" stroke-width="2"/>
  <rect x="288" y="272" width="28" height="24" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <!-- bundle carried together -->
  <rect x="208" y="238" width="96" height="22" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M224 238 Q256 228 288 238" fill="none" stroke="#2b3a42" stroke-width="1.5"/>

  <!-- step 1: plan (top) -->
  <rect x="176" y="108" width="160" height="84" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="134" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">plan</text>
  <text x="256" y="156" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">choose the action</text>
  <text x="256" y="174" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">and the roles</text>
  <line x1="256" y1="192" x2="256" y2="212" stroke="#2b3a42" stroke-width="2"/>
  <path d="M252 206 L256 212 L260 206" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <!-- step 2: do (right) -->
  <rect x="340" y="212" width="150" height="84" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="415" y="238" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">do</text>
  <text x="415" y="260" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">carry it out</text>
  <text x="415" y="278" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">together</text>
  <line x1="320" y1="256" x2="338" y2="256" stroke="#2b3a42" stroke-width="2"/>
  <path d="M334 252 L338 256 L334 260" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <!-- step 3: reflect (bottom) -->
  <rect x="176" y="316" width="160" height="84" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="342" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">reflect</text>
  <text x="256" y="364" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">what worked,</text>
  <text x="256" y="382" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">what to change</text>

  <!-- left connector (reflect back to plan) -->
  <line x1="176" y1="340" x2="150" y2="340" stroke="#2b3a42" stroke-width="2"/>
  <line x1="150" y1="340" x2="150" y2="150" stroke="#2b3a42" stroke-width="2"/>
  <line x1="150" y1="150" x2="176" y2="150" stroke="#2b3a42" stroke-width="2"/>
  <path d="M174 146 L176 150 L174 154" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <text x="256" y="448" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">One drop is small; many drops together make a river.</text>
  <text x="256" y="472" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Acting together for everyone is the common good.</text>
</svg>
