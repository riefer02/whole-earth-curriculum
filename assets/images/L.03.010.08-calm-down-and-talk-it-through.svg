<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Calm down and talk it through</title>
  <desc id="desc">A five-step strip shows how to calm down and talk through a conflict. Step 1: stop and breathe (a child takes slow breaths). Step 2: name the feeling (a face with a label "I feel mad"). Step 3: say what you need (a speech bubble "I need a turn"). Step 4: listen to the other (an ear beside a face). Step 5: find a fair solve (two children shake hands over a shared ball). Numbered labels and the actions, not color, carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Calm Down and Talk It Through</text>

  <!-- Step 1 -->
  <rect x="20" y="60" width="88" height="220" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="64" cy="84" r="13" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="64" y="89" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fdfbf7">1</text>
  <circle cx="64" cy="140" r="16" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M48 138 A16 16 0 0 1 80 138 Z" fill="#2b3a42"/>
  <circle cx="59" cy="140" r="1.8" fill="#2b3a42"/>
  <circle cx="69" cy="140" r="1.8" fill="#2b3a42"/>
  <rect x="52" y="158" width="24" height="36" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <!-- breath lines -->
  <path d="M84 128 q6 -4 12 0 q-6 4 -12 0" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M84 120 q8 -5 16 0 q-8 5 -16 0" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <text x="64" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">stop and</text>
  <text x="64" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">breathe</text>
  <text x="64" y="264" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4f6d7a">slow in, slower out</text>

  <!-- Step 2 -->
  <rect x="116" y="60" width="88" height="220" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="160" cy="84" r="13" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="160" y="89" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fdfbf7">2</text>
  <circle cx="160" cy="140" r="26" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="150" cy="136" r="2" fill="#2b3a42"/>
  <circle cx="170" cy="136" r="2" fill="#2b3a42"/>
  <path d="M148 152 Q160 160 172 152" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <text x="160" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2b3a42">"I feel mad"</text>
  <text x="160" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">name the</text>
  <text x="160" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">feeling</text>
  <text x="160" y="264" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4f6d7a">say "I feel…"</text>

  <!-- Step 3 -->
  <rect x="212" y="60" width="88" height="220" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="256" cy="84" r="13" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="89" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fdfbf7">3</text>
  <circle cx="256" cy="150" r="16" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M240 148 A16 16 0 0 1 272 148 Z" fill="#4f6d7a"/>
  <circle cx="251" cy="150" r="1.8" fill="#2b3a42"/>
  <circle cx="261" cy="150" r="1.8" fill="#2b3a42"/>
  <rect x="244" y="168" width="24" height="34" rx="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <path d="M276 136 q12 -10 26 -6 l0 16 q-12 3 -24 -2 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="292" y="138" font-family="sans-serif" font-size="10" fill="#222222">I need</text>
  <text x="292" y="150" font-family="sans-serif" font-size="10" fill="#222222">a turn</text>
  <text x="256" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">say what</text>
  <text x="256" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">you need</text>
  <text x="256" y="264" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4f6d7a">say "I need…"</text>

  <!-- Step 4 -->
  <rect x="308" y="60" width="88" height="220" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="352" cy="84" r="13" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="352" y="89" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fdfbf7">4</text>
  <!-- ear -->
  <path d="M342 128 q0 22 14 22 q16 0 16 -20 q0 -14 -8 -18 q-4 8 -10 8 q-2 0 -2 4 q-2 0 -4 0 q-4 0 -6 4 Z" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <!-- face beside -->
  <circle cx="352" cy="206" r="16" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M336 204 A16 16 0 0 1 368 204 Z" fill="#2b3a42"/>
  <circle cx="347" cy="206" r="1.8" fill="#2b3a42"/>
  <circle cx="357" cy="206" r="1.8" fill="#2b3a42"/>
  <path d="M347 213 Q352 218 357 213" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="352" y="238" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">listen to</text>
  <text x="352" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">the other</text>
  <text x="352" y="272" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4f6d7a">hear them too</text>

  <!-- Step 5 -->
  <rect x="404" y="60" width="88" height="220" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="448" cy="84" r="13" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="448" y="89" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fdfbf7">5</text>
  <!-- two children shaking hands over ball -->
  <circle cx="430" cy="158" r="14" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M416 156 A14 14 0 0 1 444 156 Z" fill="#2b3a42"/>
  <circle cx="425" cy="158" r="1.6" fill="#2b3a42"/>
  <circle cx="435" cy="158" r="1.6" fill="#2b3a42"/>
  <path d="M425 165 Q430 170 435 165" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="420" y="172" width="20" height="28" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>

  <circle cx="466" cy="158" r="14" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M452 156 A14 14 0 0 1 480 156 Z" fill="#4f6d7a"/>
  <circle cx="461" cy="158" r="1.6" fill="#2b3a42"/>
  <circle cx="471" cy="158" r="1.6" fill="#2b3a42"/>
  <path d="M461 165 Q466 170 471 165" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="456" y="172" width="20" height="28" rx="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  <!-- ball between -->
  <circle cx="448" cy="150" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>

  <text x="448" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">find a</text>
  <text x="448" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">fair solve</text>
  <text x="448" y="264" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4f6d7a">works for both</text>

  <!-- footer -->
  <rect x="76" y="304" width="360" height="80" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="332" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Breathe first, then talk.</text>
  <text x="256" y="356" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Name the feeling, say the need,</text>
  <text x="256" y="374" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">listen, and find a solve — so no one is hurt.</text>

  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Five steps, in order: the body calms before the words can land.</text>
</svg>
