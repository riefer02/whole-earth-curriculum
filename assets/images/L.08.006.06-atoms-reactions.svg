<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Atoms rearranged: hydrogen and oxygen make water</title>
  <desc id="desc">A diagram showing two hydrogen atoms and one oxygen atom on the left, an arrow, and a water molecule on the right. Labels note that the same atoms are present before and after, just rearranged.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">A Reaction Rearranges Atoms</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">hydrogen + oxygen → water</text>

  <!-- reactants -->
  <g>
    <circle cx="90" cy="180" r="30" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="90" y="186" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">H</text>
    <circle cx="150" cy="150" r="30" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="150" y="156" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">H</text>
    <circle cx="150" cy="230" r="38" fill="#6b93b6" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="150" y="237" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">O</text>
    <text x="120" y="312" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">reactants</text>
  </g>

  <!-- arrow -->
  <path d="M212 190 L288 190" fill="none" stroke="#2b3a42" stroke-width="3" marker-end="url(#carr)"/>
  <defs>
    <marker id="carr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 Z" fill="#2b3a42"/>
    </marker>
  </defs>
  <text x="250" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">rearrange</text>

  <!-- product: water molecule -->
  <g>
    <circle cx="360" cy="190" r="38" fill="#6b93b6" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="360" y="197" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">O</text>
    <circle cx="300" cy="150" r="30" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="300" y="156" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">H</text>
    <circle cx="300" cy="232" r="30" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="300" y="238" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">H</text>
    <path d="M326 168 L336 178" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M326 210 L336 200" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="340" y="312" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">product: water (H₂O)</text>
  </g>

  <text x="256" y="362" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Same atoms before and after — just rearranged.</text>
  <text x="256" y="386" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">Atoms are not created or destroyed in a reaction.</text>
</svg>
