<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 600" role="img" aria-labelledby="title desc">
  <title id="title">An everyday tool, before and after</title>
  <desc id="desc">A before-and-after comparison of the mobile phone. The left panel, labeled "before the phone," shows a person walking and carrying a rolled note, above the caption "messages traveled only as fast as a person could walk." The right panel, labeled "after the phone," shows a person holding a phone to their ear, above the caption "a call or text reaches someone far away in seconds." A bottom band reads "and new needs, too — charging, repairs, cost," and a closing caption reads "a tool changes the day." The two human figures have different skin tones and clothing. Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="600" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">An Everyday Tool, Before and After</text>
  <text x="256" y="54" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">a tool changes the day</text>

  <!-- left panel -->
  <rect x="24" y="76" width="220" height="340" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="134" y="104" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">BEFORE the phone</text>

  <!-- walking figure left -->
  <circle cx="112" cy="170" r="16" fill="#b07b4f" stroke="#2b3a42" stroke-width="2"/>
  <rect x="92" y="190" width="40" height="52" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="96" y1="200" x2="70" y2="240" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="128" y1="200" x2="150" y2="236" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="240" x2="86" y2="300" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="124" y1="240" x2="138" y2="300" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <rect x="142" y="196" width="26" height="34" rx="3" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>

  <rect x="40" y="322" width="188" height="74" rx="8" fill="#fdfbf7" stroke="#4f6d7a" stroke-width="1.5"/>
  <text x="134" y="346" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">messages traveled only</text>
  <text x="134" y="364" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">as fast as a person</text>
  <text x="134" y="382" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">could walk</text>

  <!-- arrow divider -->
  <line x1="252" y1="246" x2="260" y2="246" stroke="#2b3a42" stroke-width="2"/>
  <path d="M262,238 L272,246 L262,254 Z" fill="#2b3a42"/>
  <text x="266" y="230" font-family="sans-serif" font-size="11" fill="#2b3a42">over time</text>

  <!-- right panel -->
  <rect x="284" y="76" width="220" height="340" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="394" y="104" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">AFTER the phone</text>

  <!-- figure right -->
  <circle cx="382" cy="170" r="16" fill="#e8c39e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="362" y="190" width="40" height="52" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="370" y1="200" x2="350" y2="238" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="394" y1="200" x2="410" y2="238" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="374" y1="240" x2="366" y2="300" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="392" y1="240" x2="400" y2="300" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <rect x="388" y="176" width="20" height="34" rx="4" fill="#2b3a42" stroke="#2b3a42" stroke-width="2"/>
  <line x1="392" y1="176" x2="402" y2="168" stroke="#2b3a42" stroke-width="2"/>

  <rect x="300" y="322" width="188" height="74" rx="8" fill="#fdfbf7" stroke="#4f6d7a" stroke-width="1.5"/>
  <text x="394" y="346" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">a call or text reaches</text>
  <text x="394" y="364" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">someone far away</text>
  <text x="394" y="382" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">in seconds</text>

  <!-- bottom bands -->
  <rect x="24" y="436" width="464" height="56" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="460" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">and new needs, too — charging, repairs, cost</text>
  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">a tool helps, and a tool asks for care</text>

  <text x="256" y="530" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">A tool changes the day.</text>
  <text x="256" y="552" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">work changes → life changes → new needs appear</text>
</svg>
