<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My class, my community: a circle of people</title>
  <desc id="desc">A child stands in the middle of a dashed circle, surrounded by six labeled community members: a food seller with a basket, a teacher with a book, a healer with a medicine bottle, a fixer with a hammer, a friend with a ball, and a neighbor with a house. Each person is labeled by role, not color, so the image prints clearly in grayscale. Skin tones and shirts vary across the figures.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">My Class, My Community</text>

  <!-- Connecting dashed circle -->
  <circle cx="256" cy="272" r="120" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-dasharray="8 8" stroke-opacity="0.6"/>

  <!-- ===== Central child ===== -->
  <g>
    <circle cx="256" cy="250" r="16" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M246 244 A16 16 0 0 1 266 244 Z" fill="#2b3a42"/>
    <circle cx="250" cy="248" r="2" fill="#2b3a42"/>
    <circle cx="262" cy="248" r="2" fill="#2b3a42"/>
    <path d="M250 258 Q256 262 262 258" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="244" y="268" width="24" height="30" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="244" y1="276" x2="228" y2="272" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="268" y1="276" x2="284" y2="272" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <circle cx="226" cy="272" r="4" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="286" cy="272" r="4" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="250" y1="298" x2="248" y2="314" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="262" y1="298" x2="264" y2="314" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <text x="256" y="332" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">me</text>
  </g>

  <!-- ===== Helper 1 (top): food seller ===== -->
  <g>
    <circle cx="256" cy="152" r="13" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M248 146 A13 13 0 0 1 264 146 Z" fill="#2b3a42"/>
    <circle cx="252" cy="150" r="1.8" fill="#2b3a42"/>
    <circle cx="260" cy="150" r="1.8" fill="#2b3a42"/>
    <path d="M252 158 Q256 161 260 158" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="246" y="165" width="20" height="22" rx="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M272 152 L288 152 L284 166 L276 166 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="277" cy="146" r="4.5" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="285" cy="146" r="4.5" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="256" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">food</text>
  </g>

  <!-- ===== Helper 2 (top-right): teacher ===== -->
  <g>
    <circle cx="360" cy="212" r="13" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M352 206 A13 13 0 0 1 368 206 Z" fill="#2b3a42"/>
    <circle cx="356" cy="210" r="1.8" fill="#2b3a42"/>
    <circle cx="364" cy="210" r="1.8" fill="#2b3a42"/>
    <path d="M356 218 Q360 221 364 218" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="350" y="225" width="20" height="22" rx="7" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="374" y="200" width="20" height="16" rx="2" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <line x1="384" y1="200" x2="384" y2="216" stroke="#2b3a42" stroke-width="2"/>
    <text x="360" y="260" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">teach</text>
  </g>

  <!-- ===== Helper 3 (bottom-right): healer ===== -->
  <g>
    <circle cx="360" cy="332" r="13" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M352 326 A13 13 0 0 1 368 326 Z" fill="#2b3a42"/>
    <circle cx="356" cy="330" r="1.8" fill="#2b3a42"/>
    <circle cx="364" cy="330" r="1.8" fill="#2b3a42"/>
    <path d="M356 338 Q360 341 364 338" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="350" y="345" width="20" height="22" rx="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="375" y="322" width="13" height="17" rx="3" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="378" y="317" width="7" height="5" rx="1" fill="#2b3a42"/>
    <text x="360" y="380" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">heal</text>
  </g>

  <!-- ===== Helper 4 (bottom): fixer ===== -->
  <g>
    <circle cx="256" cy="392" r="13" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M248 386 A13 13 0 0 1 264 386 Z" fill="#2b3a42"/>
    <circle cx="252" cy="390" r="1.8" fill="#2b3a42"/>
    <circle cx="260" cy="390" r="1.8" fill="#2b3a42"/>
    <path d="M252 398 Q256 401 260 398" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="246" y="405" width="20" height="22" rx="7" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="282" y1="398" x2="273" y2="382" stroke="#4f6d7a" stroke-width="4" stroke-linecap="round"/>
    <rect x="270" y="376" width="18" height="8" rx="2" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">fix</text>
  </g>

  <!-- ===== Helper 5 (bottom-left): friend ===== -->
  <g>
    <circle cx="152" cy="332" r="13" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M144 326 A13 13 0 0 1 160 326 Z" fill="#2b3a42"/>
    <circle cx="148" cy="330" r="1.8" fill="#2b3a42"/>
    <circle cx="156" cy="330" r="1.8" fill="#2b3a42"/>
    <path d="M148 338 Q152 341 156 338" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="142" y="345" width="20" height="22" rx="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="174" cy="328" r="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M174 320 A8 8 0 0 1 174 336" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <text x="152" y="380" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">play</text>
  </g>

  <!-- ===== Helper 6 (top-left): neighbor ===== -->
  <g>
    <circle cx="152" cy="212" r="13" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M144 206 A13 13 0 0 1 160 206 Z" fill="#2b3a42"/>
    <circle cx="148" cy="210" r="1.8" fill="#2b3a42"/>
    <circle cx="156" cy="210" r="1.8" fill="#2b3a42"/>
    <path d="M148 218 Q152 221 156 218" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="142" y="225" width="20" height="22" rx="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M163 202 L175 191 L187 202 Z" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <rect x="165" y="202" width="20" height="15" rx="1" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="173" y="208" width="5" height="9" fill="#2b3a42"/>
    <text x="152" y="260" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">neighbor</text>
  </g>

  <!-- Bottom note -->
  <text x="256" y="490" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Many groups hold you. We all belong here.</text>
</svg>
