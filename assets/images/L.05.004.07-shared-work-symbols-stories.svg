<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Shared work, symbols, and stories</title>
  <desc id="desc">Three panels side by side, each labeled at the top. Panel one, "shared work," shows several figures of varied skin tones lifting a roof beam together. Panel two, "symbols," shows a patterned cloth and a crest, labeled "patterns that say who we are." Panel three, "stories," shows people gathered in a circle listening to an elder with a speech bubble, labeled "stories we remember." A caption below reads "Work, symbols, and stories build the 'we.'" Labels and pictures, not color alone, carry the meaning.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">What Builds a Community</text>

  <!-- Panel 1: shared work -->
  <rect x="22" y="64" width="148" height="280" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="96" y="92" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7a9e7e">shared work</text>
  <!-- beam -->
  <rect x="44" y="140" width="104" height="12" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <!-- three figures lifting -->
  <circle cx="62" cy="170" r="12" fill="#d9a06b" stroke="#2b3a42" stroke-width="2"/>
  <path d="M50 200 q12 -12 24 0" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <line x1="58" y1="184" x2="58" y2="154" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="96" cy="170" r="12" fill="#8a5a3b" stroke="#2b3a42" stroke-width="2"/>
  <path d="M84 200 q12 -12 24 0" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <line x1="96" y1="184" x2="96" y2="154" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="130" cy="170" r="12" fill="#f0c8a0" stroke="#2b3a42" stroke-width="2"/>
  <path d="M118 200 q12 -12 24 0" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <line x1="130" y1="184" x2="130" y2="154" stroke="#2b3a42" stroke-width="2"/>
  <text x="96" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">we build together</text>
  <text x="96" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">— a harvest, a roof,</text>
  <text x="96" y="276" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">a festival</text>

  <!-- Panel 2: symbols -->
  <rect x="182" y="64" width="148" height="280" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="92" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6b93b6">symbols</text>
  <!-- patterned cloth -->
  <rect x="208" y="112" width="96" height="80" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <line x1="208" y1="132" x2="304" y2="132" stroke="#7a9e7e" stroke-width="2"/>
  <line x1="208" y1="152" x2="304" y2="152" stroke="#e0a458" stroke-width="2"/>
  <line x1="208" y1="172" x2="304" y2="172" stroke="#6b93b6" stroke-width="2"/>
  <line x1="240" y1="112" x2="240" y2="192" stroke="#4f6d7a" stroke-width="2"/>
  <line x1="272" y1="112" x2="272" y2="192" stroke="#4f6d7a" stroke-width="2"/>
  <!-- crest -->
  <path d="M230 232 l26 -34 l26 34 z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="286" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">patterns that say</text>
  <text x="256" y="304" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">"this is who we are"</text>

  <!-- Panel 3: stories -->
  <rect x="342" y="64" width="148" height="280" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="416" y="92" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e0a458">stories</text>
  <!-- elder + listeners -->
  <circle cx="416" cy="130" r="16" fill="#8a5a3b" stroke="#2b3a42" stroke-width="2"/>
  <path d="M398 164 q18 -16 36 0" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="382" cy="184" r="10" fill="#d9a06b" stroke="#2b3a42" stroke-width="2"/>
  <path d="M372 204 q10 -10 20 0" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="452" cy="184" r="10" fill="#f0c8a0" stroke="#2b3a42" stroke-width="2"/>
  <path d="M442 204 q10 -10 20 0" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <!-- speech from elder -->
  <rect x="378" y="216" width="76" height="34" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M406 250 L402 262 L414 250" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <text x="416" y="237" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">once, long ago...</text>
  <text x="416" y="286" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">stories we remember</text>
  <text x="416" y="304" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">again and again</text>

  <text x="256" y="384" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">Work, symbols, and stories build the "we."</text>
  <text x="256" y="414" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">They turn a group of people into a community that belongs to each other.</text>
</svg>
