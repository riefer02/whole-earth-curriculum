<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Evaluating design: function, fairness, footprint, craft</title>
  <desc id="desc">Four labeled boxes — function, fairness, footprint, craft — each with a short prompt, all feeding into one line labeled "my judgment, with a reason." Labels carry the meaning, so it prints clearly in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Evaluating Design</text>

  <rect x="36" y="90" width="200" height="76" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="118" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">function</text>
  <text x="136" y="144" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">does it do its job?</text>

  <rect x="276" y="90" width="200" height="76" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="118" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">fairness</text>
  <text x="376" y="144" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">who is left out?</text>

  <rect x="36" y="186" width="200" height="76" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="214" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">footprint</text>
  <text x="136" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">what does it cost the Earth?</text>

  <rect x="276" y="186" width="200" height="76" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="214" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">craft</text>
  <text x="376" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">is it made well and honestly?</text>

  <path d="M136 266 L222 330" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M376 266 L290 330" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <rect x="84" y="330" width="344" height="66" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="358" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#222222">my judgment</text>
  <text x="256" y="382" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">… with a reason</text>
</svg>
