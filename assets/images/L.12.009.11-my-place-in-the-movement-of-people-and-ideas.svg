<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My Place in the Movement of People and Ideas</title>
  <desc id="desc">Several winding path-lines from different directions converging on a small figure labeled "me." Each path is labeled — a family move, a borrowed word, a food that traveled, an idea in motion — and the figure holds a small bundle labeled "what I carry." Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2b3a42" font-weight="bold">My Place in the Movement</text>

  <!-- central figure -->
  <circle cx="256" cy="260" r="16" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <path d="M246 286 Q256 300 266 286" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="256" cy="236" r="4" fill="#2b3a42"/>
  <text x="256" y="316" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42" font-weight="bold">me</text>
  <rect x="240" y="196" width="32" height="22" rx="4" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="184" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">what I carry</text>

  <!-- path 1 -->
  <path d="M60 100 Q140 120 180 180 Q210 220 240 250" fill="none" stroke="#6b93b6" stroke-width="4"/>
  <text x="66" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">a family move</text>

  <!-- path 2 -->
  <path d="M120 420 Q160 360 200 320 Q230 290 248 270" fill="none" stroke="#e0a458" stroke-width="4"/>
  <text x="100" y="452" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">a borrowed word</text>

  <!-- path 3 -->
  <path d="M430 90 Q360 130 320 190 Q290 230 266 252" fill="none" stroke="#7a9e7e" stroke-width="4"/>
  <text x="440" y="72" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">a food that traveled</text>

  <!-- path 4 -->
  <path d="M440 400 Q380 360 330 330 Q290 300 266 268" fill="none" stroke="#4f6d7a" stroke-width="4"/>
  <text x="442" y="428" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">an idea in motion</text>

  <text x="256" y="490" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">For each: chosen or forced? You are already a crossroads.</text>
</svg>
