<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">One question, many ways of answering</title>
  <desc id="desc">A central question, "Where did we come from?", branches to two paths held side by side at the same height. One path is a scientific model built from evidence, shown with a ruler and data points. The other is cultural and spiritual stories, shown with a book and symbols. Neither path is drawn above the other.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">One Question, Held Open</text>

  <!-- central question -->
  <rect x="146" y="72" width="220" height="56" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="106" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">Where did we come from?</text>

  <!-- branch lines -->
  <line x1="210" y1="128" x2="120" y2="176" stroke="#4f6d7a" stroke-width="2"/>
  <line x1="302" y1="128" x2="392" y2="176" stroke="#4f6d7a" stroke-width="2"/>

  <!-- left: scientific model -->
  <rect x="28" y="176" width="220" height="230" rx="10" fill="#ffffff" stroke="#6b93b6" stroke-width="2.5"/>
  <text x="138" y="202" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">a scientific model</text>
  <text x="138" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">built from evidence</text>
  <!-- ruler/data -->
  <rect x="52" y="242" width="172" height="16" rx="3" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
  <g fill="#2b3a42">
    <line x1="66" y1="242" x2="66" y2="258" stroke-width="1.5"/>
    <line x1="98" y1="242" x2="98" y2="258" stroke-width="1.5"/>
    <line x1="130" y1="242" x2="130" y2="258" stroke-width="1.5"/>
    <line x1="162" y1="242" x2="162" y2="258" stroke-width="1.5"/>
    <line x1="194" y1="242" x2="194" y2="258" stroke-width="1.5"/>
  </g>
  <!-- data points -->
  <circle cx="66" cy="300" r="4" fill="#2b3a42"/>
  <circle cx="98" cy="284" r="4" fill="#2b3a42"/>
  <circle cx="130" cy="268" r="4" fill="#2b3a42"/>
  <circle cx="162" cy="254" r="4" fill="#2b3a42"/>
  <line x1="66" y1="300" x2="162" y2="254" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="138" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">tested, revised, stated with limits</text>
  <text x="138" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">answers "how"</text>
  <text x="138" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">Big Bang, evolution, deep time</text>

  <!-- right: cultural and spiritual stories -->
  <rect x="264" y="176" width="220" height="230" rx="10" fill="#ffffff" stroke="#e0a458" stroke-width="2.5"/>
  <text x="374" y="202" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">cultural &amp; spiritual stories</text>
  <text x="374" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">carrying meaning</text>
  <!-- book -->
  <rect x="328" y="242" width="92" height="64" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="374" y1="242" x2="374" y2="306" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="336" y1="258" x2="366" y2="258" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="336" y1="270" x2="366" y2="270" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="382" y1="258" x2="412" y2="258" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="382" y1="270" x2="412" y2="270" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="374" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">held by many peoples across the Earth</text>
  <text x="374" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">answers "why" and "who we are"</text>
  <text x="374" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">creation stories, belonging, purpose</text>

  <!-- equal footing note -->
  <rect x="60" y="424" width="392" height="60" rx="8" fill="#ffffff" stroke="#4f6d7a" stroke-width="1.5"/>
  <text x="256" y="448" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Both are held side by side, neither ranked above the other.</text>
  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Science is a model with evidence — never a creed.</text>
</svg>
