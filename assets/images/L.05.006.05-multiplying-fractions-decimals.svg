<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Multiplying fractions and decimals</title>
  <desc id="desc">Two multiplication models. Left: a rectangle divided into a 2-by-3 grid of six cells. One column is shaded to show 1/3, and one row is crossed with diagonal lines to show 1/2; their single overlapping cell is labeled 1/2 times 1/3 equals 1/6. Right: a decimal model showing 0.5 times 6 equals 3, drawn as six circles each half shaded, totaling three whole circles, labeled 0.5 times 6 equals 3. Labels, shading, and counts, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Multiplying Fractions and Decimals</text>

  <!-- Left: area model 1/2 x 1/3 -->
  <text x="140" y="72" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#6b93b6">1/2 × 1/3</text>

  <!-- 2x3 grid -->
  <g stroke="#2b3a42" stroke-width="2">
    <rect x="40" y="88" width="120" height="80" fill="#ffffff"/>
    <line x1="80" y1="88" x2="80" y2="168"/>
    <line x1="120" y1="88" x2="120" y2="168"/>
    <line x1="40" y1="128" x2="160" y2="128"/>
  </g>
  <!-- shade 1/3 column (left column) -->
  <rect x="40" y="88" width="40" height="80" fill="#7a9e7e" stroke="none"/>
  <!-- hatch 1/2 row (top row) -->
  <rect x="40" y="88" width="120" height="40" fill="none" stroke="none"/>
  <g stroke="#e0a458" stroke-width="2">
    <line x1="44" y1="92" x2="156" y2="92"/>
    <line x1="44" y1="100" x2="156" y2="100"/>
    <line x1="44" y1="108" x2="156" y2="108"/>
    <line x1="44" y1="116" x2="156" y2="116"/>
    <line x1="44" y1="124" x2="156" y2="124"/>
  </g>
  <!-- overlap cell highlighted -->
  <rect x="40" y="88" width="40" height="40" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="140" y="196" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">1/2 × 1/3 = 1/6</text>
  <text x="140" y="216" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">1 shaded cell out of 6</text>

  <!-- Right: 0.5 x 6 = 3 -->
  <text x="372" y="72" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#6b93b6">0.5 × 6</text>

  <g>
    <circle cx="300" cy="104" r="22" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 300 82 A 22 22 0 0 1 300 126 Z" fill="#7a9e7e" stroke="none"/>
    <circle cx="348" cy="104" r="22" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 348 82 A 22 22 0 0 1 348 126 Z" fill="#7a9e7e" stroke="none"/>
    <circle cx="396" cy="104" r="22" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 396 82 A 22 22 0 0 1 396 126 Z" fill="#7a9e7e" stroke="none"/>
    <circle cx="444" cy="104" r="22" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 444 82 A 22 22 0 0 1 444 126 Z" fill="#7a9e7e" stroke="none"/>
    <circle cx="324" cy="148" r="22" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 324 126 A 22 22 0 0 1 324 170 Z" fill="#7a9e7e" stroke="none"/>
    <circle cx="420" cy="148" r="22" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 420 126 A 22 22 0 0 1 420 170 Z" fill="#7a9e7e" stroke="none"/>
  </g>
  <text x="372" y="200" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">0.5 × 6 = 3</text>
  <text x="372" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">six halves make three wholes</text>

  <rect x="60" y="252" width="392" height="70" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="280" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#6b93b6">Fraction of a group: 1/4 of 12</text>
  <text x="256" y="308" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222222">12 eggs ÷ 4 groups = 3 eggs each → 1/4 of 12 = 3</text>

  <text x="256" y="352" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">multiply: part of a part, or several parts</text>

  <!-- dots for 12 -->
  <g fill="#4f6d7a">
    <circle cx="70" cy="376" r="5"/><circle cx="96" cy="376" r="5"/><circle cx="122" cy="376" r="5"/>
    <circle cx="70" cy="402" r="5"/><circle cx="96" cy="402" r="5"/><circle cx="122" cy="402" r="5"/>
    <circle cx="70" cy="428" r="5"/><circle cx="96" cy="428" r="5"/><circle cx="122" cy="428" r="5"/>
    <circle cx="70" cy="454" r="5"/><circle cx="96" cy="454" r="5"/><circle cx="122" cy="454" r="5"/>
  </g>
  <text x="360" y="400" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">4 equal rows,</text>
  <text x="360" y="420" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">take 1 row = 3</text>
</svg>
