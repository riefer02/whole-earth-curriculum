<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title>The story continues into Grade 11</title>
  <desc>A winding path crosses the page from a past marker on the left through a present marker in the middle to an open future marker on the right, where a small rising sun waits. A figure stands at the present, holding a rolled-up page labeled 'my considered position', about to step forward.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <!-- path -->
  <path d="M 40 400 C 140 400 150 320 230 300 C 310 280 320 380 470 360" fill="none" stroke="#4f6d7a" stroke-width="6" stroke-linecap="round"/>
  <!-- past marker -->
  <g>
    <circle cx="40" cy="400" r="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="40" y="446" font-family="sans-serif" font-size="20" fill="#222222" text-anchor="middle">past</text>
  </g>
  <!-- present marker -->
  <g>
    <circle cx="230" cy="300" r="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
    <text x="230" y="266" font-family="sans-serif" font-size="20" fill="#222222" text-anchor="middle">now</text>
  </g>
  <!-- future marker + rising sun -->
  <g>
    <circle cx="470" cy="360" r="22" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-dasharray="6 6"/>
    <text x="470" y="410" font-family="sans-serif" font-size="20" fill="#222222" text-anchor="middle">next</text>
    <path d="M 400 96 q 30 -26 60 0 q 0 26 -30 26 q -30 0 -30 -26 z" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
    <line x1="430" y1="124" x2="430" y2="140" stroke="#2b3a42" stroke-width="2.5"/>
  </g>
  <!-- person at present holding a rolled page -->
  <g stroke="#2b3a42" stroke-width="3" fill="none">
    <circle cx="256" cy="248" r="20" fill="#c98d5f"/>
    <path d="M 256 268 q -4 24 -24 26 l 0 52 q 0 6 6 6 l 36 0 q 6 0 6 -6 l 0 -52 q -20 -2 -24 -26 z" fill="#e8c9a8"/>
    <path d="M 236 274 q -18 4 -18 20"/>
    <path d="M 276 274 q 18 4 18 20"/>
  </g>
  <!-- rolled page -->
  <g stroke="#2b3a42" stroke-width="2.5">
    <rect x="262" y="252" width="54" height="20" rx="6" fill="#fdfbf7" transform="rotate(-14 289 262)"/>
  </g>
  <text x="360" y="238" font-family="sans-serif" font-size="18" fill="#222222" text-anchor="middle">my considered</text>
  <text x="360" y="258" font-family="sans-serif" font-size="18" fill="#222222" text-anchor="middle">position</text>
  <!-- dotted arrow ahead -->
  <path d="M 300 296 q 40 -6 60 14" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-dasharray="5 5"/>
</svg>
