<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Many ways to sense and move</title>
  <desc id="desc">A row of five diverse figures going about everyday life, each naturally using an aid. From left to right: a child with glasses reading a book, a child with a hearing aid, a child in a wheelchair, a person with a white cane, and a person with a prosthetic leg. All are shown with equal dignity and ease, in varied skin tones.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="50" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Many Ways to Sense and Move</text>

  <!-- Figure 1: glasses, reading -->
  <g>
    <circle cx="66" cy="140" r="26" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M66 166 L66 240 M66 190 L46 230 M66 190 L86 230 M66 240 L56 290 M66 240 L76 290" stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="56" cy="136" r="8" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="76" cy="136" r="8" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <line x1="48" y1="136" x2="84" y2="136" stroke="#2b3a42" stroke-width="2"/>
    <rect x="36" y="200" width="52" height="40" rx="3" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M40 212 L80 212 M40 224 L80 224" stroke="#4f6d7a" stroke-width="2"/>
    <text x="66" y="322" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222222">glasses</text>
  </g>

  <!-- Figure 2: hearing aid -->
  <g>
    <circle cx="168" cy="140" r="26" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M168 166 L168 240 M168 190 L148 230 M168 190 L188 230 M168 240 L158 290 M168 240 L178 290" stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="158" cy="134" r="3" fill="#2b3a42"/>
    <circle cx="178" cy="134" r="3" fill="#2b3a42"/>
    <path d="M162 150 Q168 156 174 150" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M188 136 A 8 8 0 0 1 200 136" fill="none" stroke="#e0a458" stroke-width="5" stroke-linecap="round"/>
    <path d="M194 136 L198 146" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
    <text x="168" y="322" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222222">hearing aid</text>
  </g>

  <!-- Figure 3: wheelchair -->
  <g>
    <circle cx="270" cy="130" r="26" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M270 156 L270 210 M270 170 L250 200 M270 170 L290 200" stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="262" cy="124" r="3" fill="#2b3a42"/>
    <circle cx="278" cy="124" r="3" fill="#2b3a42"/>
    <path d="M264 138 Q270 144 276 138" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- wheelchair seat and wheels -->
    <rect x="246" y="212" width="52" height="10" rx="4" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="256" cy="256" r="20" fill="none" stroke="#2b3a42" stroke-width="4"/>
    <circle cx="288" cy="256" r="20" fill="none" stroke="#2b3a42" stroke-width="4"/>
    <path d="M246 222 L250 250 M298 222 L294 250" stroke="#2b3a42" stroke-width="2"/>
    <text x="270" y="322" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222222">wheelchair</text>
  </g>

  <!-- Figure 4: white cane -->
  <g>
    <circle cx="372" cy="140" r="26" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M372 166 L372 240 M372 190 L352 230 M372 190 L392 230 M372 240 L362 290 M372 240 L382 290" stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M364 150 Q372 156 380 150" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- white cane -->
    <line x1="392" y1="210" x2="414" y2="292" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="392" y1="210" x2="414" y2="292" stroke="#2b3a42" stroke-width="1" stroke-linecap="round"/>
    <circle cx="414" cy="292" r="3" fill="#e0a458"/>
    <text x="372" y="322" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222222">white cane</text>
  </g>

  <!-- Figure 5: prosthetic leg -->
  <g>
    <circle cx="474" cy="140" r="26" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M474 166 L474 240 M474 190 L454 230 M474 190 L494 230 M474 240 L464 290" stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="464" cy="134" r="3" fill="#2b3a42"/>
    <circle cx="484" cy="134" r="3" fill="#2b3a42"/>
    <path d="M468 150 Q474 156 480 150" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- prosthetic leg -->
    <line x1="482" y1="240" x2="486" y2="292" stroke="#4f6d7a" stroke-width="6" stroke-linecap="round"/>
    <rect x="478" y="290" width="18" height="8" rx="3" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <text x="474" y="322" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222222">prosthetic</text>
  </g>
</svg>
