<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">The repair bridge: before and after</title>
  <desc id="d">Two panels. Top: a river between two banks with a broken bridge, a gap in the middle, labeled 'after a disagreement'. Bottom: the same two banks joined by a bridge made of three labeled planks — apologize, listen, agree on next steps — labeled 'repair rebuilds the bridge'.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">The repair bridge</text>

  <!-- Top panel: broken -->
  <g>
    <rect x="24" y="70" width="464" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <!-- banks -->
    <rect x="24" y="130" width="150" height="90" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="338" y="130" width="150" height="90" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <!-- broken bridge -->
    <path d="M174 150 L246 150" stroke="#8f5f3d" stroke-width="8" stroke-linecap="round"/>
    <path d="M266 150 L338 150" stroke="#8f5f3d" stroke-width="8" stroke-linecap="round"/>
    <path d="M246 150 L266 150" stroke="#2b3a42" stroke-width="3" stroke-dasharray="6 6"/>
    <text x="256" y="196" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">after a disagreement</text>
  </g>

  <!-- Bottom panel: mended -->
  <g>
    <rect x="24" y="244" width="464" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <rect x="24" y="304" width="150" height="90" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="338" y="304" width="150" height="90" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="168" y="330" width="56" height="38" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="196" y="354" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2b3a42">apologize</text>
    <rect x="228" y="330" width="56" height="38" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="354" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2b3a42">listen</text>
    <rect x="288" y="330" width="56" height="38" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="316" y="354" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2b3a42">agree</text>
    <path d="M174 349 L168 349 M338 349 L344 349" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="376" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">repair rebuilds the bridge</text>
  </g>

  <text x="256" y="460" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">The gap stays honest — but it no longer separates you.</text>
</svg>
