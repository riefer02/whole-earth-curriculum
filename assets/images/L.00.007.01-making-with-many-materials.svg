<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Making with many materials: found things become art</title>
  <desc id="desc">Six labeled cards show everyday found materials: a leaf, a stone, a shell, a coil of string, a ball of clay, and a stick. Below, a scene shows two hands of different skin tones pressing a leaf onto a sheet of paper to make a leaf print, leaving a green leaf shape on the paper. Every material is labeled with its name, and the shapes carry the meaning, so the picture prints clearly in grayscale and teaches that any found material can become art.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Making with Many Materials</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Found things can become art.</text>

  <!-- Material cards -->
  <!-- leaf -->
  <g>
    <rect x="22" y="96" width="74" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M59 150 Q48 130 59 118 Q70 130 59 150 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <line x1="59" y1="150" x2="59" y2="158" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="59" y="232" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">leaf</text>
  </g>
  <!-- stone -->
  <g>
    <rect x="100" y="96" width="74" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <ellipse cx="137" cy="140" rx="22" ry="16" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <path d="M124 148 Q137 158 151 147" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="137" y="232" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">stone</text>
  </g>
  <!-- shell -->
  <g>
    <rect x="178" y="96" width="74" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M215 160 Q203 128 215 118 L227 118 Q239 128 227 160 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M215 160 L215 128 M215 160 L204 124 M215 160 L226 124" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="215" y="232" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">shell</text>
  </g>
  <!-- string -->
  <g>
    <rect x="256" y="96" width="74" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M293 118 Q276 118 276 132 Q276 146 293 146 Q310 146 310 132 Q310 118 293 118" fill="none" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="310" y1="132" x2="318" y2="132" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <text x="293" y="232" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">string</text>
  </g>
  <!-- clay -->
  <g>
    <rect x="334" y="96" width="74" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="371" cy="140" r="22" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M360 132 Q371 124 382 132" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="371" y="232" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">clay</text>
  </g>
  <!-- stick -->
  <g>
    <rect x="412" y="96" width="74" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <line x1="436" y1="156" x2="462" y2="118" stroke="#8f5f3d" stroke-width="5" stroke-linecap="round"/>
    <line x1="450" y1="138" x2="458" y2="130" stroke="#8f5f3d" stroke-width="3" stroke-linecap="round"/>
    <text x="449" y="232" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">stick</text>
  </g>

  <!-- Making scene -->
  <rect x="22" y="262" width="468" height="186" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <!-- paper -->
  <rect x="168" y="296" width="176" height="132" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <!-- leaf print on paper -->
  <path d="M256 346 Q242 322 256 308 Q270 322 256 346 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <line x1="256" y1="346" x2="256" y2="356" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <!-- leaf being pressed -->
  <path d="M256 310 Q248 298 256 290 Q264 298 256 310 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <!-- left hand (light) pressing -->
  <path d="M228 288 Q224 268 238 264 L252 274 Q258 282 250 288 L240 292 Q226 292 228 288 Z" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <!-- right hand (deep) pressing -->
  <path d="M284 288 Q288 268 274 264 L260 274 Q254 282 262 288 L272 292 Q286 292 284 288 Z" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <!-- motion dots -->
  <circle cx="256" cy="332" r="3" fill="#4f6d7a"/>

  <text x="256" y="476" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">There is no wrong way to make — any material is a place to start.</text>
</svg>
