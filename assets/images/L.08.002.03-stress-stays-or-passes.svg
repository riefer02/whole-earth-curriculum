<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Stress that passes versus stress that stays</title>
  <desc id="desc">Two panels. The first shows a short stress burst as a curve that rises sharply and falls back down, labeled a useful alarm. The second shows a stress line that rises and stays high, with the body wearing down over time, labeled stress that never turns off. Below is a list of calm practices. Shapes and labels, not color, carry the meaning.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Two Kinds of Stress</text>

  <!-- left panel -->
  <rect x="24" y="60" width="220" height="260" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="134" y="88" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Stress that passes</text>
  <text x="134" y="108" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">a useful alarm</text>

  <!-- axes -->
  <line x1="48" y1="286" x2="220" y2="286" stroke="#2b3a42" stroke-width="2"/>
  <line x1="48" y1="130" x2="48" y2="286" stroke="#2b3a42" stroke-width="2"/>
  <!-- rise and fall curve -->
  <path d="M48 286 Q90 140 134 160 Q180 180 220 286" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <text x="110" y="236" font-family="sans-serif" font-size="13" fill="#7a9e7e">alarm</text>
  <text x="166" y="236" font-family="sans-serif" font-size="13" fill="#7a9e7e">calm</text>

  <!-- right panel -->
  <rect x="268" y="60" width="220" height="260" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="378" y="88" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Stress that stays</text>
  <text x="378" y="108" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">wears on the body</text>

  <line x1="292" y1="286" x2="464" y2="286" stroke="#2b3a42" stroke-width="2"/>
  <line x1="292" y1="130" x2="292" y2="286" stroke="#2b3a42" stroke-width="2"/>
  <!-- rise and stay high line -->
  <path d="M292 286 Q320 180 340 150 L360 150 L390 152 L430 150 L464 150" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="352" y="210" font-family="sans-serif" font-size="13" fill="#222222">stays on</text>

  <!-- bottom list: calm practices -->
  <rect x="24" y="336" width="464" height="152" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="364" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Ways back to calm</text>
  <text x="52" y="394" font-family="sans-serif" font-size="14" fill="#222222">• slow breathing</text>
  <text x="52" y="416" font-family="sans-serif" font-size="14" fill="#222222">• movement</text>
  <text x="52" y="438" font-family="sans-serif" font-size="14" fill="#222222">• sleep</text>
  <text x="52" y="460" font-family="sans-serif" font-size="14" fill="#222222">• connection</text>
  <text x="256" y="394" font-family="sans-serif" font-size="14" fill="#222222">• time in nature</text>
  <text x="256" y="416" font-family="sans-serif" font-size="14" fill="#222222">• talking to someone</text>
  <text x="256" y="438" font-family="sans-serif" font-size="14" fill="#222222">• rest</text>
</svg>
