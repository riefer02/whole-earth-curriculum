<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t3 d3">
  <title id="t3">Automation and work</title>
  <desc id="d3">The same task, sorting a harvest, is shown done by a person on the left and by a machine on the right, with labels naming who gains and who loses.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <line x1="256" y1="40" x2="256" y2="472" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="128" y="70" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42">Person does it</text>
  <text x="384" y="70" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42">Machine does it</text>
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <circle cx="128" cy="150" r="20"/>
    <path d="M128 170 v50 M128 190 l-22 40 M128 190 l22 40 M128 220 l-16 50 M128 220 l16 50"/>
    <path d="M96 210 l-24 -12 M96 224 l-24 4"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="#7a9e7e">
    <circle cx="104" cy="300" r="8"/><circle cx="132" cy="310" r="8"/><circle cx="158" cy="300" r="8"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <rect x="288" y="120" width="160" height="70" rx="10"/>
    <rect x="328" y="96" width="80" height="30" rx="6"/>
    <path d="M316 150 l-18 20 m18 20 l-18 -20"/>
    <circle cx="384" cy="240" r="34"/>
    <path d="M384 240 v40 M384 256 l-20 26 M384 256 l20 26"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="#e0a458">
    <circle cx="356" cy="310" r="8"/><circle cx="384" cy="320" r="8"/><circle cx="412" cy="310" r="8"/>
  </g>
  <text x="128" y="356" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#7a9e7e">gain: a job, skill</text>
  <text x="128" y="378" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#e0a458">lose: time, toil</text>
  <text x="384" y="356" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#7a9e7e">gain: owner, speed</text>
  <text x="384" y="378" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#e0a458">lose: workers' hours</text>
  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">Who decides?</text>
</svg>
