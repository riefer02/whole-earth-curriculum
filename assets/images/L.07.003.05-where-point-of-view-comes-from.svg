<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">The elephant and the many points of view</title>
  <desc id="d">A traditional story told in many versions across India and beyond. Four figures stand around an elephant, each touching a different part. The one at the trunk says 'a snake'; the one at the leg says 'a tree trunk'; the one at the ear says 'a fan'; the one at the tail says 'a rope'. Each is partly right because each touches only one part — no single view is the whole truth. Figures differ in skin tone.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">The elephant and the many views</text>

  <!-- Elephant -->
  <g stroke="#2b3a42" stroke-width="2" fill="#c9c2b4">
    <ellipse cx="250" cy="290" rx="90" ry="70"/>
    <circle cx="318" cy="230" r="48"/>
    <path d="M318 190 Q360 176 372 200 Q380 216 372 230" fill="#c9c2b4"/>
    <path d="M372 216 L400 200" fill="none"/>
    <rect x="230" y="356" width="26" height="66" rx="6"/>
    <rect x="286" y="356" width="26" height="66" rx="6"/>
    <path d="M344 232 Q356 226 366 234" fill="#c9c2b4"/>
    <circle cx="344" cy="232" r="6" fill="#2b3a42"/>
  </g>

  <!-- Trunk figure -->
  <g>
    <circle cx="140" cy="180" r="18" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M140 198 L140 250 L124 292 M140 250 L156 292" stroke="#2b3a42" stroke-width="2"/>
    <path d="M124 292 L156 292" stroke="#2b3a42" stroke-width="2"/>
    <path d="M156 292 L360 214" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="20" y="120" width="112" height="46" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="76" y="148" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">"a snake"</text>
  </g>

  <!-- Leg figure -->
  <g>
    <circle cx="100" cy="330" r="18" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M100 348 L100 400 L84 442 M100 400 L116 442" stroke="#2b3a42" stroke-width="2"/>
    <path d="M84 442 L116 442" stroke="#2b3a42" stroke-width="2"/>
    <path d="M116 400 L250 372" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="14" y="292" width="120" height="46" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="74" y="320" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">"a tree trunk"</text>
  </g>

  <!-- Ear figure -->
  <g>
    <circle cx="400" cy="260" r="18" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M400 278 L400 330 L384 372 M400 330 L416 372" stroke="#2b3a42" stroke-width="2"/>
    <path d="M384 372 L416 372" stroke="#2b3a42" stroke-width="2"/>
    <path d="M384 340 L330 250" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="376" y="120" width="112" height="46" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="432" y="148" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">"a fan"</text>
  </g>

  <!-- Tail figure -->
  <g>
    <circle cx="380" cy="430" r="18" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M380 448 L380 470" stroke="#2b3a42" stroke-width="2"/>
    <path d="M380 430 L380 300" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="340" y="432" width="112" height="46" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="396" y="460" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">"a rope"</text>
  </g>

  <text x="256" y="500" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">Each is partly right — and no single view is the whole truth.</text>
</svg>
