<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">A food chain and the direction energy moves</title>
  <desc id="d">A food chain of four parts with arrows showing the direction energy moves. The sun gives energy to grass, the grass is eaten by a rabbit, and the rabbit is eaten by a fox. Each part is labeled: sun, plant (grass), plant-eater (rabbit), animal-eater (fox). A note says the arrows point the way energy moves — from the sun to the plant, and from the plant to the animals that eat it. Word labels carry the meaning so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#222222">Energy moves through a food chain</text>

  <!-- Sun -->
  <circle cx="62" cy="120" r="28" fill="#e0a458" stroke="#2b3a42" stroke-width="4"/>
  <line x1="62" y1="80" x2="62" y2="64" stroke="#2b3a42" stroke-width="4"/>
  <line x1="62" y1="160" x2="62" y2="176" stroke="#2b3a42" stroke-width="4"/>
  <line x1="34" y1="120" x2="20" y2="120" stroke="#2b3a42" stroke-width="4"/>
  <line x1="90" y1="120" x2="104" y2="120" stroke="#2b3a42" stroke-width="4"/>
  <text x="62" y="202" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">sun</text>

  <text x="137" y="130" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#4f6d7a">→</text>

  <!-- Grass -->
  <line x1="166" y1="180" x2="166" y2="120" stroke="#2b3a42" stroke-width="4"/>
  <line x1="186" y1="180" x2="186" y2="112" stroke="#2b3a42" stroke-width="4"/>
  <line x1="206" y1="180" x2="206" y2="124" stroke="#2b3a42" stroke-width="4"/>
  <path d="M166 120 q10 -14 0 -20" fill="none" stroke="#7a9e7e" stroke-width="4"/>
  <path d="M186 112 q10 -14 0 -20" fill="none" stroke="#7a9e7e" stroke-width="4"/>
  <path d="M206 124 q10 -14 0 -20" fill="none" stroke="#7a9e7e" stroke-width="4"/>
  <text x="186" y="202" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">plant: grass</text>

  <text x="241" y="130" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#4f6d7a">→</text>

  <!-- Rabbit -->
  <circle cx="310" cy="120" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="4"/>
  <ellipse cx="310" cy="162" rx="24" ry="20" fill="#e0a458" stroke="#2b3a42" stroke-width="4"/>
  <ellipse cx="280" cy="96" rx="8" ry="20" fill="#e0a458" stroke="#2b3a42" stroke-width="4"/>
  <ellipse cx="340" cy="96" rx="8" ry="20" fill="#e0a458" stroke="#2b3a42" stroke-width="4"/>
  <circle cx="304" cy="116" r="3" fill="#222222"/>
  <text x="310" y="202" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">plant-eater:</text>
  <text x="310" y="222" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">rabbit</text>

  <text x="372" y="130" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#4f6d7a">→</text>

  <!-- Fox -->
  <circle cx="434" cy="112" r="18" fill="#e0a458" stroke="#2b3a42" stroke-width="4"/>
  <polygon points="416,100 398,92 414,108" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <polygon points="452,100 470,92 454,108" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <ellipse cx="434" cy="158" rx="28" ry="22" fill="#e0a458" stroke="#2b3a42" stroke-width="4"/>
  <circle cx="428" cy="110" r="3" fill="#222222"/>
  <text x="434" y="202" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">animal-eater:</text>
  <text x="434" y="222" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">fox</text>

  <rect x="24" y="240" width="464" height="120" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="256" y="272" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">The arrow points the way the energy moves.</text>
  <text x="256" y="300" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">From the sun, into the plant, and into the animals that eat.</text>
  <text x="256" y="324" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">grass → rabbit → fox</text>
  <text x="256" y="348" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">The rabbit gets energy from the plant; the fox from the rabbit.</text>

  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">The arrow points from the eaten to the eater.</text>
  <text x="256" y="460" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">Energy always starts with the sun and a plant.</text>
</svg>
