<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My life story so far, in order</title>
  <desc id="desc">A winding road drawn left to right with five numbered stops. Stop 1 is labeled "I was born," stop 2 "a first memory," stop 3 "something I learned," stop 4 "a big change," and stop 5 "now." Small dots mark each stop along the road. The stops are blank enough for a learner to draw or write their own moment at each one. Numbers and words, not color, carry the meaning so it prints clearly in grayscale.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="52" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">My Life Story, In Order</text>

  <!-- Road -->
  <path d="M30 380 Q 120 300 190 320 Q 270 340 320 290 Q 380 240 470 200" fill="none" stroke="#4f6d7a" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 14"/>

  <!-- Stops and markers -->
  <g>
    <circle cx="60" cy="366" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="60" y="371" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">1</text>
    <text x="60" y="412" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">I was born</text>

    <circle cx="168" cy="316" r="16" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="168" y="321" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">2</text>
    <text x="168" y="362" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">a first memory</text>

    <circle cx="284" cy="316" r="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="284" y="321" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">3</text>
    <text x="284" y="362" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">something I learned</text>

    <circle cx="396" cy="262" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="396" y="267" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">4</text>
    <text x="396" y="308" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">a big change</text>

    <circle cx="474" cy="202" r="16" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="474" y="207" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">5</text>
    <text x="474" y="248" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">now</text>
  </g>

  <!-- Bottom note -->
  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">First, next, then — in order — all the way to now.</text>
</svg>
