<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-11-001-07-global-web desc-L-11-001-07-global-web">
  <title id="title-L-11-001-07-global-web">My place in a connected world</title>
  <desc id="desc-L-11-001-07-global-web">A web diagram with a node labeled "me" at the center, connected by lines to six outer nodes labeled food, water, climate, work, news, and medicine. Each outer node has a small simple icon. Labels, not color, carry the meaning, so the diagram prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">My Place in a Connected World</text>

  <!-- Connecting lines -->
  <g stroke="#4f6d7a" stroke-width="2.5">
    <path d="M256 286 L150 150"/>
    <path d="M256 286 L256 120"/>
    <path d="M256 286 L362 150"/>
    <path d="M256 286 L384 300"/>
    <path d="M256 286 L256 414"/>
    <path d="M256 286 L128 300"/>
  </g>

  <!-- Center node -->
  <circle cx="256" cy="286" r="40" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="293" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">me</text>

  <!-- Outer nodes -->
  <g font-family="sans-serif" font-size="16" fill="#222222" text-anchor="middle">
    <circle cx="150" cy="140" r="34" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="150" y="146">food</text>
    <text x="150" y="192" font-size="11" fill="#4f6d7a" stroke="#fdfbf7" stroke-width="4" paint-order="stroke">grown far away</text>

    <circle cx="256" cy="110" r="34" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="116">water</text>
    <text x="256" y="164" font-size="11" fill="#4f6d7a" stroke="#fdfbf7" stroke-width="4" paint-order="stroke">one shared cycle</text>

    <circle cx="362" cy="140" r="34" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="362" y="146">climate</text>
    <text x="362" y="192" font-size="11" fill="#4f6d7a" stroke="#fdfbf7" stroke-width="4" paint-order="stroke">one shared air</text>

    <circle cx="392" cy="300" r="34" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="392" y="306">work</text>
    <text x="392" y="352" font-size="11" fill="#4f6d7a" stroke="#fdfbf7" stroke-width="4" paint-order="stroke">linked by trade</text>

    <circle cx="256" cy="414" r="34" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="420">news</text>
    <text x="256" y="464" font-size="11" fill="#4f6d7a">one shared screen</text>

    <circle cx="120" cy="300" r="34" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="120" y="306">medicine</text>
    <text x="120" y="352" font-size="11" fill="#4f6d7a" stroke="#fdfbf7" stroke-width="4" paint-order="stroke">made in many lands</text>
  </g>

  <text x="256" y="488" text-anchor="middle" font-family="sans-serif" font-size="17.6" fill="#2b3a42">What I do touches others; what others do touches me.</text>
</svg>
