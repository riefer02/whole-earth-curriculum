<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-01-001-02-showing-feelings-clues desc-L-01-001-02-showing-feelings-clues">
  <title id="title-L-01-001-02-showing-feelings-clues">Where feelings show: face, body, and voice clues</title>
  <desc id="desc-L-01-001-02-showing-feelings-clues">Three cards showing the three places a feeling shows, using one feeling (excited) as the example. Card one, "face," shows a smiling face with wide eyes. Card two, "body," shows a figure standing tall with both arms up and small jump lines under the feet. Card three, "voice," shows a speech bubble with the word "Yay!" inside. The labels and shapes, not color, carry the meaning so it prints clearly in grayscale. Skin tones vary across the figures.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="52" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">Where Feelings Show</text>
  <text x="256" y="82" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">One feeling can show in three places.</text>

  <!-- ===== Card 1: face ===== -->
  <g>
    <rect x="16" y="112" width="150" height="300" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <text x="91" y="146" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#4f6d7a">face</text>
    <circle cx="71" cy="228" r="9" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="111" cy="228" r="9" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="91" cy="228" r="36" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="77" cy="214" r="5" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="105" cy="214" r="5" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="77" cy="214" r="2" fill="#2b3a42"/>
    <circle cx="105" cy="214" r="2" fill="#2b3a42"/>
    <line x1="72" y1="197" x2="82" y2="194" stroke="#2b3a42" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="100" y1="194" x2="110" y2="197" stroke="#2b3a42" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M75 244 Q91 260 107 244" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="91" y="300" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">a smile, wide eyes,</text>
    <text x="91" y="320" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">raised eyebrows</text>
    <text x="91" y="392" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6b93b6">I see it on the face.</text>
  </g>

  <!-- ===== Card 2: body ===== -->
  <g>
    <rect x="181" y="112" width="150" height="300" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <text x="256" y="146" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#4f6d7a">body</text>
    <circle cx="256" cy="204" r="26" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M230 202 A26 26 0 0 1 282 202 L282 192 A26 26 0 0 0 230 192 Z" fill="#2b3a42"/>
    <circle cx="248" cy="204" r="2.6" fill="#2b3a42"/>
    <circle cx="264" cy="204" r="2.6" fill="#2b3a42"/>
    <path d="M248 216 Q256 221 264 216" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- arms up, with weight -->
    <path d="M238 242 L214 216" stroke="#7a9e7e" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M274 242 L298 216" stroke="#7a9e7e" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="211" cy="213" r="7" fill="#c99567" stroke="#2b3a42" stroke-width="1.6"/>
    <circle cx="301" cy="213" r="7" fill="#c99567" stroke="#2b3a42" stroke-width="1.6"/>
    <!-- torso with weight -->
    <path d="M256 234 C 241 234 234 242 234 252 L234 286 C234 298 240 302 250 302 L262 302 C272 302 278 298 278 286 L278 252 C278 242 271 234 256 234 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <!-- legs and feet -->
    <path d="M248 300 L246 332" stroke="#2b3a42" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M264 300 L266 332" stroke="#2b3a42" stroke-width="13" stroke-linecap="round" fill="none"/>
    <ellipse cx="244" cy="337" rx="9" ry="5" fill="#2b3a42"/>
    <ellipse cx="268" cy="337" rx="9" ry="5" fill="#2b3a42"/>
    <path d="M238 348 L242 356 L250 348" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M274 348 L278 356 L286 348" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="256" y="374" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">tall, arms up,</text>
    <text x="256" y="392" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7a9e7e">I see it in the body.</text>
  </g>

  <!-- ===== Card 3: voice ===== -->
  <g>
    <rect x="346" y="112" width="150" height="300" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <text x="421" y="146" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#4f6d7a">voice</text>
    <circle cx="401" cy="228" r="9" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="441" cy="228" r="9" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="421" cy="228" r="36" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="407" cy="214" r="3.6" fill="#2b3a42"/>
    <circle cx="435" cy="214" r="3.6" fill="#2b3a42"/>
    <path d="M407 244 Q421 256 435 244" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M404 190 L428 190 L418 208 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <rect x="387" y="152" width="68" height="40" rx="18" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="421" y="180" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Yay!</text>
    <text x="421" y="300" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">loud, fast,</text>
    <text x="421" y="320" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">a happy sound</text>
    <text x="421" y="392" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#8a5a1a">I hear it in the voice.</text>
  </g>

  <!-- Bottom note -->
  <text x="256" y="446" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Noticing clues helps me be kind.</text>
</svg>
