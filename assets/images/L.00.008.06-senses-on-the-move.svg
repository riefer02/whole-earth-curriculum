<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Senses on the move</title>
  <desc id="desc">A child in a wheelchair rolls along a path to the right. Wind lines trail behind to show touch, sound waves rise near the ear to show hearing, a bird overhead shows sight, the sun shows warmth on the skin, and a flower shows smell. Labeled tags read see, hear, feel, and smell. A caption names the ways of moving — walk, hop, roll, glide — and reminds that moving changes what the senses notice. Labels carry meaning in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Senses on the Move</text>

  <!-- Path and motion arrow -->
  <line x1="16" y1="332" x2="496" y2="332" stroke="#4f6d7a" stroke-width="2"/>
  <rect x="16" y="334" width="480" height="18" fill="#dbe6d2"/>
  <path d="M64 344 L128 344" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 338 L128 344 L120 350 Z" fill="#4f6d7a"/>

  <!-- Bird (see) -->
  <g stroke="#2b3a42" stroke-width="2">
    <ellipse cx="95" cy="118" rx="15" ry="10" fill="#6b93b6"/>
    <circle cx="109" cy="108" r="7" fill="#6b93b6"/>
    <path d="M115 108 L123 110 L115 114 Z" fill="#e0a458" stroke-width="1"/>
    <circle cx="106" cy="106" r="1.5" fill="#2b3a42"/>
    <path d="M82 128 L82 134 L98 134 L98 128 Z" fill="#6b93b6"/>
  </g>
  <rect x="63" y="142" width="64" height="26" rx="12" fill="#ffffff" stroke="#7a9e7e" stroke-width="2"/>
  <text x="95" y="160" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">see</text>

  <!-- Child in wheelchair rolling -->
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="230" cy="210" r="24" fill="#c99567"/>
    <rect x="212" y="236" width="36" height="50" rx="14" fill="#6b93b6"/>
    <line x1="244" y1="248" x2="272" y2="230" stroke-width="13" stroke="#c99567"/>
    <circle cx="274" cy="228" r="6" fill="#c99567"/>
    <line x1="214" y1="248" x2="204" y2="276" stroke-width="13" stroke="#c99567"/>
    <circle cx="202" cy="278" r="6" fill="#c99567"/>
    <rect x="200" y="282" width="60" height="12" rx="6" fill="#4f6d7a"/>
    <line x1="214" y1="294" x2="214" y2="314" stroke="#4f6d7a" stroke-width="8"/>
    <circle cx="212" cy="314" r="16" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
    <circle cx="256" cy="322" r="9" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- Wind lines behind (feel) -->
  <g fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round">
    <path d="M150 200 q14 -10 28 0"/>
    <path d="M142 224 q14 -10 28 0"/>
    <path d="M150 250 q14 -10 28 0"/>
  </g>

  <!-- Sound waves near ear (hear) -->
  <g fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round">
    <path d="M266 188 q8 -8 0 -16"/>
    <path d="M276 190 q8 -8 0 -16"/>
  </g>
  <rect x="252" y="158" width="64" height="26" rx="12" fill="#ffffff" stroke="#7a9e7e" stroke-width="2"/>
  <text x="284" y="176" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">hear</text>

  <!-- Sun (feel) -->
  <circle cx="430" cy="104" r="15" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#e0a458" stroke-width="3" stroke-linecap="round">
    <line x1="430" y1="82" x2="430" y2="76"/>
    <line x1="430" y1="126" x2="430" y2="132"/>
    <line x1="408" y1="104" x2="402" y2="104"/>
    <line x1="452" y1="104" x2="458" y2="104"/>
    <line x1="414" y1="88" x2="410" y2="84"/>
    <line x1="446" y1="88" x2="450" y2="84"/>
    <line x1="414" y1="120" x2="410" y2="124"/>
    <line x1="446" y1="120" x2="450" y2="124"/>
  </g>
  <rect x="398" y="138" width="64" height="26" rx="12" fill="#ffffff" stroke="#7a9e7e" stroke-width="2"/>
  <text x="430" y="156" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">feel</text>

  <!-- Flower (smell) -->
  <line x1="438" y1="332" x2="438" y2="296" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
  <g fill="#e0a458" stroke="#2b3a42" stroke-width="1.5">
    <circle cx="438" cy="288" r="7"/>
    <circle cx="447" cy="294" r="7"/>
    <circle cx="429" cy="294" r="7"/>
    <circle cx="444" cy="283" r="7"/>
    <circle cx="432" cy="283" r="7"/>
  </g>
  <circle cx="438" cy="290" r="4" fill="#6b93b6"/>
  <g fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round">
    <path d="M418 276 q -6 -6 0 -12"/>
    <path d="M412 268 q -6 -6 0 -12"/>
  </g>
  <rect x="406" y="352" width="64" height="26" rx="12" fill="#ffffff" stroke="#7a9e7e" stroke-width="2"/>
  <text x="438" y="370" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">smell</text>

  <!-- Caption band -->
  <rect x="16" y="396" width="480" height="46" rx="12" fill="#ffffff" stroke="#7a9e7e" stroke-width="2"/>
  <text x="256" y="424" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">walk · hop · roll · glide — moving changes what I notice</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">taste: remember a taste from your day — never taste unknown plants</text>
</svg>
