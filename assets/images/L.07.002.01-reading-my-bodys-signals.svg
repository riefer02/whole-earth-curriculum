<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Body signal map: hunger, fatigue, stress</title>
  <desc id="desc">A simple front-facing human figure with three labeled signals marked by leader lines. Hunger is marked at the stomach as an empty or rumbling stomach. Fatigue is marked at the eyes and shoulders as heavy eyelids and drooping shoulders. Stress is marked at the chest as a fast heart and tight chest. The figure is neutral and calm; shapes and labels, not color, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">Body Signal Map</text>

  <!-- Figure -->
  <g>
    <!-- head -->
    <circle cx="256" cy="120" r="34" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <!-- neutral face -->
    <circle cx="245" cy="114" r="3" fill="#2b3a42"/>
    <circle cx="267" cy="114" r="3" fill="#2b3a42"/>
    <path d="M248 130 Q256 134 264 130" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- torso -->
    <rect x="222" y="160" width="68" height="150" rx="26" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <!-- arms -->
    <rect x="196" y="168" width="20" height="104" rx="10" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <rect x="296" y="168" width="20" height="104" rx="10" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <!-- legs -->
    <rect x="232" y="312" width="20" height="120" rx="10" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <rect x="260" y="312" width="20" height="120" rx="10" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- Hunger: stomach -->
  <g>
    <ellipse cx="256" cy="240" rx="24" ry="14" fill="none" stroke="#e0a458" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="256" y1="254" x2="360" y2="300" stroke="#e0a458" stroke-width="2"/>
    <circle cx="360" cy="300" r="3" fill="#e0a458"/>
    <rect x="330" y="300" width="150" height="66" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="405" y="322" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Hunger</text>
    <text x="405" y="344" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">empty or rumbling</text>
    <text x="405" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">stomach</text>
  </g>

  <!-- Fatigue: eyes and shoulders -->
  <g>
    <line x1="245" y1="114" x2="120" y2="96" stroke="#6b93b6" stroke-width="2"/>
    <circle cx="120" cy="96" r="3" fill="#6b93b6"/>
    <rect x="40" y="46" width="168" height="66" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="124" y="70" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Fatigue</text>
    <text x="124" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">heavy eyes, drooping</text>
    <text x="124" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">shoulders</text>
  </g>

  <!-- Stress: chest / heart -->
  <g>
    <path d="M252 196 C246 188 236 196 252 208 C268 196 258 188 252 196" fill="none" stroke="#7a9e7e" stroke-width="2"/>
    <line x1="266" y1="196" x2="400" y2="150" stroke="#7a9e7e" stroke-width="2"/>
    <circle cx="400" cy="150" r="3" fill="#7a9e7e"/>
    <rect x="362" y="118" width="130" height="66" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="427" y="140" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Stress</text>
    <text x="427" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">fast heart, tight</text>
    <text x="427" y="176" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">chest</text>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Signals are information, not weaknesses.</text>
</svg>
