<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Composition and Emphasis</title>
  <desc id="desc">A picture frame containing a small bright shape and a large pale shape. Dashed arrows show how contrast and placement pull the eye to the small bright shape first. Labels point to contrast, placement, and the path the viewer's eye follows.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Composition Steers the Eye</text>

  <!-- Frame -->
  <rect x="80" y="90" width="280" height="300" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>

  <!-- Large pale shape -->
  <rect x="120" y="130" width="180" height="130" fill="#7a9e7e" fill-opacity="0.35" stroke="#4f6d7a" stroke-width="2"/>

  <!-- Small bright shape -->
  <circle cx="250" cy="300" r="26" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>

  <!-- Eye path arrow -->
  <path d="M 120 320 C 170 340, 210 330, 250 320" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-dasharray="7 5"/>
  <polygon points="250,318 238,316 244,326" fill="#2b3a42"/>

  <!-- Labels -->
  <line x1="300" y1="195" x2="372" y2="150" stroke="#4f6d7a" stroke-width="2"/>
  <text x="374" y="148" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">large, pale</text>
  <text x="374" y="166" font-family="sans-serif" font-size="13" fill="#4f6d7a">(recedes)</text>

  <line x1="276" y1="300" x2="372" y2="268" stroke="#4f6d7a" stroke-width="2"/>
  <text x="374" y="262" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">small, bright</text>
  <text x="374" y="280" font-family="sans-serif" font-size="13" fill="#4f6d7a">(contrast = emphasis)</text>

  <!-- Caption -->
  <rect x="90" y="420" width="332" height="62" rx="8" fill="#ffffff" stroke="#e0a458" stroke-width="2"/>
  <text x="256" y="446" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">Contrast and placement decide</text>
  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">where the eye goes first.</text>
</svg>
