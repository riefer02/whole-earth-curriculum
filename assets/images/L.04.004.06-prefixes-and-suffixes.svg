<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Prefixes and suffixes change a base word's meaning</title>
  <desc id="desc">A base word "help" sits in the center. On the left a box labeled "un-" (prefix) and on the right a box labeled "-ful" (suffix) snap onto it to form the word "unhelpful" below. This shows how affixes attach to change meaning. Simple shapes, grayscale-printable.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Prefix + Base + Suffix</text>

  <!-- Prefix box -->
  <rect x="70" y="150" width="100" height="90" rx="12" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="120" y="202" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#222222">un-</text>
  <text x="120" y="228" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">not</text>
  <text x="120" y="126" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">prefix (before)</text>

  <!-- Base box -->
  <rect x="206" y="150" width="100" height="90" rx="12" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="202" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#222222">help</text>
  <text x="256" y="228" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">base</text>

  <!-- Suffix box -->
  <rect x="342" y="150" width="100" height="90" rx="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="392" y="202" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#222222">-ful</text>
  <text x="392" y="228" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">full of</text>
  <text x="392" y="126" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">suffix (after)</text>

  <!-- Result arrow -->
  <path d="M256 268 L256 312" stroke="#4f6d7a" stroke-width="3"/>
  <path d="M248 304 L256 316 L264 304" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Result word -->
  <rect x="120" y="320" width="272" height="66" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="362" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">unhelpful</text>
  <text x="256" y="414" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222222">not + full of help</text>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42">Snap parts on, read the meaning.</text>
</svg>
