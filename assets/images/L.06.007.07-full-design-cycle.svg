<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 500" role="img" aria-labelledby="title desc">
  <title id="title">The full design cycle</title>
  <desc id="desc">A diagram titled "The full design cycle." Four steps are arranged in a loop — "research" (a magnifying glass and a question mark), "prototype" (hands on a box), "test" (a drop of water), and "improve" (an upward arrow) — with arrows circling from one to the next and a band wrapping around them all labeled "document every step." A center worked example reads "seedlings dry out and get eaten → a shade-and-guard that works." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="500" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">The Full Design Cycle</text>

  <defs>
    <marker id="arr7" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2b3a42"/>
    </marker>
  </defs>

  <!-- outer document band -->
  <rect x="28" y="68" width="456" height="356" fill="none" stroke="#7a9e7e" stroke-width="4" rx="200" stroke-dasharray="10 7"/>
  <text x="256" y="88" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7a9e7e">document every step</text>

  <!-- four steps around a loop -->
  <!-- research (top) -->
  <g>
    <circle cx="256" cy="150" r="46" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <circle cx="246" cy="150" r="18" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
    <line x1="260" y1="164" x2="278" y2="182" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <text x="256" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">research</text>
    <text x="256" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">watch and ask first</text>
  </g>

  <!-- prototype (right) -->
  <g>
    <circle cx="400" cy="266" r="46" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="378" y="256" width="44" height="32" rx="3" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <circle cx="386" cy="248" r="7" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="414" cy="246" r="7" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <text x="400" y="326" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">prototype</text>
    <text x="400" y="342" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">rough and quick</text>
  </g>

  <!-- test (bottom) -->
  <g>
    <circle cx="256" cy="382" r="46" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M256 358 Q268 376 256 392" fill="none" stroke="#6b93b6" stroke-width="3" stroke-linecap="round"/>
    <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">test</text>
    <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">against the real problem</text>
  </g>

  <!-- improve (left) -->
  <g>
    <circle cx="112" cy="266" r="46" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M96 290 L128 290 M112 296 L112 268" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <path d="M96 290 L112 274 L128 290" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="326" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">improve</text>
    <text x="112" y="342" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">change one thing, try again</text>
  </g>

  <!-- arrows around loop -->
  <g stroke="#2b3a42" stroke-width="2.5" fill="none">
    <line x1="290" y1="180" x2="362" y2="236" marker-end="url(#arr7)"/>
    <line x1="372" y1="310" x2="292" y2="352" marker-end="url(#arr7)"/>
    <line x1="222" y1="352" x2="152" y2="310" marker-end="url(#arr7)"/>
    <line x1="150" y1="222" x2="218" y2="182" marker-end="url(#arr7)"/>
  </g>

  <!-- center worked example -->
  <text x="256" y="256" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#2b3a42">seedlings dry out</text>
  <text x="256" y="274" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#2b3a42">and get eaten</text>
  <text x="256" y="300" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">→</text>
  <text x="256" y="318" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#2b3a42">a shade-and-guard</text>
  <text x="256" y="336" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#2b3a42">that works</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">research first — test teaches — write it down</text>
</svg>
