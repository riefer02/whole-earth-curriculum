<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Designing for everyone: remove the barriers</title>
  <desc id="desc">Two panels compare two designs for the same doorway. The left panel, labeled "Design that blocks," shows a doorway reached only by stairs: a person using a wheelchair and a person using a cane are stopped below, unable to enter. The right panel, labeled "Design that includes," shows the same doorway with a ramp beside the stairs and a wide door: the wheelchair user, the cane user, and a person carrying a heavy load all enter together. Below, a note reads "a ramp helps more than wheelchairs — it helps everyone." Labels and shapes, not color, carry the meaning so it prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Design for everyone</text>

  <!-- Panel A: blocks -->
  <rect x="20" y="62" width="228" height="300" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="134" y="88" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">Design that blocks</text>
  <!-- building + door -->
  <rect x="150" y="130" width="70" height="120" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <rect x="158" y="156" width="54" height="94" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <!-- stairs -->
  <line x1="110" y1="250" x2="110" y2="300" stroke="#2b3a42" stroke-width="2"/>
  <line x1="110" y1="262" x2="150" y2="262" stroke="#2b3a42" stroke-width="2"/>
  <line x1="110" y1="275" x2="150" y2="275" stroke="#2b3a42" stroke-width="2"/>
  <line x1="110" y1="288" x2="150" y2="288" stroke="#2b3a42" stroke-width="2"/>
  <!-- wheelchair user stopped -->
  <circle cx="72" cy="316" r="11" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="72" cy="330" r="10" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="72" cy="330" r="2.5" fill="#2b3a42"/>
  <line x1="72" y1="327" x2="72" y2="312" stroke="#2b3a42" stroke-width="3"/>
  <!-- cane user stopped -->
  <circle cx="104" cy="318" r="9" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="104" y1="327" x2="104" y2="346" stroke="#2b3a42" stroke-width="3"/>
  <line x1="104" y1="338" x2="118" y2="352" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="134" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">stairs only — some</text>
  <text x="134" y="367" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">people are stopped</text>

  <!-- Panel B: includes -->
  <rect x="264" y="62" width="228" height="300" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="378" y="88" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">Design that includes</text>
  <!-- building + wide door -->
  <rect x="394" y="130" width="70" height="120" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <rect x="398" y="156" width="62" height="94" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <!-- stairs + ramp -->
  <line x1="354" y1="250" x2="354" y2="300" stroke="#2b3a42" stroke-width="2"/>
  <line x1="354" y1="262" x2="394" y2="262" stroke="#2b3a42" stroke-width="2"/>
  <line x1="354" y1="275" x2="394" y2="275" stroke="#2b3a42" stroke-width="2"/>
  <line x1="354" y1="288" x2="394" y2="288" stroke="#2b3a42" stroke-width="2"/>
  <path d="M310 300 L360 300 L360 250" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <!-- wheelchair user entering -->
  <circle cx="326" cy="308" r="11" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="326" cy="322" r="10" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="326" cy="322" r="2.5" fill="#2b3a42"/>
  <line x1="326" y1="319" x2="326" y2="304" stroke="#2b3a42" stroke-width="3"/>
  <!-- cane user entering -->
  <circle cx="358" cy="310" r="9" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="358" y1="319" x2="358" y2="338" stroke="#2b3a42" stroke-width="3"/>
  <!-- person with load -->
  <circle cx="418" cy="286" r="9" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <line x1="418" y1="295" x2="418" y2="316" stroke="#2b3a42" stroke-width="3"/>
  <rect x="410" y="282" width="16" height="12" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <text x="378" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">ramp + wide door —</text>
  <text x="378" y="367" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">everyone enters</text>

  <text x="256" y="398" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">A ramp helps more than wheelchairs</text>
  <text x="256" y="424" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">It helps the person with a cane, the person carrying a heavy load,</text>
  <text x="256" y="446" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">the person pushing a cart, the person with tired legs.</text>

  <text x="256" y="484" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Design for the edges and you design better for everyone.</text>
</svg>
