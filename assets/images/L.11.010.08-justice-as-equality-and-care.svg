<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Justice as equality and care</title>
  <desc id="d">Two panels. The left panel shows three equal bars labeled "equal shares" (equality). The right panel shows three bars of different heights matched to need, labeled "to each what they need" (care). Labels and bar heights, not color, carry the meaning.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222222">Two more answers: equality and care</text>
  <!-- left panel: equality -->
  <rect x="40" y="80" width="200" height="340" rx="10" fill="#7a9e7e" opacity="0.35" stroke="#2b3a42" stroke-width="2"/>
  <text x="140" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222222" font-weight="bold">equality</text>
  <text x="140" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4f6d7a">equal shares</text>
  <rect x="70" y="240" width="40" height="150" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <rect x="120" y="240" width="40" height="150" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <rect x="170" y="240" width="40" height="150" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="140" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#222222">same for everyone</text>
  <!-- right panel: care -->
  <rect x="272" y="80" width="200" height="340" rx="10" fill="#e0a458" opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
  <text x="372" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222222" font-weight="bold">care</text>
  <text x="372" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4f6d7a">to each what they need</text>
  <rect x="300" y="300" width="40" height="90" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <rect x="350" y="240" width="40" height="150" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <rect x="400" y="330" width="40" height="60" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="372" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#222222">different needs,</text>
  <text x="372" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#222222">different support</text>
  <!-- note -->
  <text x="256" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#222222">Equality asks "are shares equal?" Care asks "is each person met?"</text>
</svg>
