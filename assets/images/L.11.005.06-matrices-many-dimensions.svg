<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Matrices: Many Dimensions at Once</title>
  <desc id="desc">Left panel: a 2 by 3 matrix with rows and columns labeled, and the note that it has 2 rows and 3 columns. Right panel: a worked matrix addition of two 2 by 2 matrices, element by element, and a matrix multiplication of a 2 by 2 times a 2 by 1 with the row-times-column rule shown, giving totals 17 and 39.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Matrices: Many Numbers at Once</text>

  <!-- Left: matrix anatomy -->
  <text x="128" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a" font-weight="bold">A 2 &#215; 3 matrix</text>
  <rect x="64" y="84" width="128" height="104" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <line x1="64" y1="136" x2="192" y2="136" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="106" y1="84" x2="106" y2="188" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="149" y1="84" x2="149" y2="188" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="85" y="116" font-family="sans-serif" font-size="16" fill="#222222">10</text>
  <text x="127" y="116" font-family="sans-serif" font-size="16" fill="#222222">12</text>
  <text x="170" y="116" font-family="sans-serif" font-size="16" fill="#222222">14</text>
  <text x="85" y="172" font-family="sans-serif" font-size="16" fill="#222222">20</text>
  <text x="127" y="172" font-family="sans-serif" font-size="16" fill="#222222">18</text>
  <text x="170" y="172" font-family="sans-serif" font-size="16" fill="#222222">16</text>
  <line x1="66" y1="82" x2="190" y2="62" stroke="#e0a458" stroke-width="2"/>
  <text x="196" y="62" font-family="sans-serif" font-size="13" fill="#4f6d7a">2 rows</text>
  <line x1="192" y1="86" x2="222" y2="120" stroke="#7a9e7e" stroke-width="2"/>
  <text x="224" y="132" font-family="sans-serif" font-size="13" fill="#4f6d7a">3 columns</text>
  <text x="128" y="224" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">m&#215;n = rows &#215; columns</text>
  <text x="128" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">rainfall: 2 regions, 3 months</text>

  <!-- Right: addition -->
  <text x="384" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a" font-weight="bold">Add element by element</text>
  <text x="300" y="96" font-family="sans-serif" font-size="20" fill="#222222">[1 2]   [5 6]   [6 8]</text>
  <text x="300" y="126" font-family="sans-serif" font-size="20" fill="#222222">[3 4] + [7 8] = [10 12]</text>

  <!-- Right: multiplication -->
  <text x="384" y="172" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a" font-weight="bold">Multiply: row &#215; column</text>
  <text x="300" y="204" font-family="sans-serif" font-size="20" fill="#222222">[1 2]   [5]   [1&#183;5+2&#183;6]</text>
  <text x="300" y="234" font-family="sans-serif" font-size="20" fill="#222222">[3 4] &#183; [6] = [3&#183;5+4&#183;6]</text>
  <text x="300" y="264" font-family="sans-serif" font-size="20" fill="#222222">            = [17]  [39]</text>
  <rect x="288" y="288" width="192" height="64" fill="#ffffff" stroke="#6b93b6" stroke-width="2" rx="6"/>
  <text x="384" y="312" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">inside dimensions must match:</text>
  <text x="384" y="332" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">(2&#215;2) &#183; (2&#215;1) &#8594; (2&#215;1)</text>

  <!-- footer -->
  <text x="256" y="392" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">One grid that holds and combines many numbers.</text>
  <text x="256" y="418" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">The Lo Shu square is an early array-like object (S-289).</text>
</svg>
