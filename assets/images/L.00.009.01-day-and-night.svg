<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Day and night, side by side</title>
  <desc id="desc">Two panels. The left panel shows daytime: a sun with rays over a green hill with a small plant. The right panel shows nighttime: a crescent moon and stars over a dark hill. Each panel is labeled "Day" and "Night," and the difference is shown by light versus dark, not by color alone, so it prints clearly in grayscale.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Day and Night</text>

  <!-- Left panel: DAY -->
  <g>
    <rect x="16" y="72" width="230" height="360" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
    <text x="131" y="104" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Day</text>

    <!-- Sun with rays -->
    <circle cx="131" cy="176" r="32" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round">
      <line x1="131" y1="132" x2="131" y2="118"/>
      <line x1="131" y1="220" x2="131" y2="234"/>
      <line x1="87" y1="176" x2="73" y2="176"/>
      <line x1="175" y1="176" x2="189" y2="176"/>
      <line x1="100" y1="145" x2="90" y2="135"/>
      <line x1="162" y1="207" x2="172" y2="217"/>
      <line x1="162" y1="145" x2="172" y2="135"/>
      <line x1="100" y1="207" x2="90" y2="217"/>
    </g>

    <!-- Clouds -->
    <g fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35">
      <circle cx="52" cy="150" r="10"/>
      <circle cx="66" cy="144" r="12"/>
      <circle cx="80" cy="150" r="9"/>
      <circle cx="196" cy="128" r="9"/>
      <circle cx="208" cy="122" r="11"/>
      <circle cx="220" cy="128" r="8"/>
    </g>

    <!-- Green hill -->
    <path d="M16 432 Q 80 336 131 356 Q 190 380 246 350 L246 432 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>

    <!-- Small plant -->
    <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" fill="none">
      <line x1="131" y1="390" x2="131" y2="360"/>
      <path d="M131 376 Q 118 372 116 358" fill="none"/>
      <path d="M131 368 Q 144 364 146 350" fill="none"/>
    </g>
    <circle cx="131" cy="352" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>

    <text x="131" y="462" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">the sun gives light</text>
  </g>

  <!-- Right panel: NIGHT -->
  <g>
    <rect x="266" y="72" width="230" height="360" rx="12" fill="#2b3a42" stroke="#2b3a42" stroke-width="2"/>
    <text x="381" y="104" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#fdfbf7">Night</text>

    <!-- Crescent moon -->
    <circle cx="381" cy="176" r="32" fill="#fdfbf7"/>
    <circle cx="396" cy="164" r="28" fill="#2b3a42"/>

    <!-- Stars -->
    <g fill="#fdfbf7">
      <path d="M320 140 Q324 148 332 148 Q324 148 320 156 Q316 148 308 148 Q316 148 320 140 Z"/>
      <path d="M444 160 Q447 166 453 166 Q447 166 444 172 Q441 166 435 166 Q441 166 444 160 Z"/>
      <path d="M300 220 Q303 226 309 226 Q303 226 300 232 Q297 226 291 226 Q297 226 300 220 Z"/>
      <path d="M460 230 Q463 236 469 236 Q463 236 460 242 Q457 236 451 236 Q457 236 460 230 Z"/>
      <path d="M430 120 Q432 125 437 125 Q432 125 430 130 Q428 125 423 125 Q428 125 430 120 Z"/>
    </g>
    <g fill="#fdfbf7">
      <circle cx="350" cy="230" r="3"/>
      <circle cx="410" cy="240" r="3"/>
      <circle cx="470" cy="140" r="3"/>
      <circle cx="290" cy="180" r="3"/>
    </g>

    <!-- Dark hill -->
    <path d="M266 432 Q 320 340 381 358 Q 440 376 496 350 L496 432 Z" fill="#4f6d7a" stroke="#fdfbf7" stroke-width="2" stroke-opacity="0.35"/>

    <text x="381" y="462" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fdfbf7">moon and stars</text>
  </g>

  <!-- Footer -->
  <text x="256" y="494" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Every place on Earth has light time and dark time.</text>
</svg>
