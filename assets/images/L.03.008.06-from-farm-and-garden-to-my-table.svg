<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">From farm and garden to my table</title>
  <desc id="desc">A six-step journey across the page. Step one shows a seed, step two a growing plant, step three a person harvesting, step four a truck carrying food, step five a market stall, and step six a family at a table. Under each step are the words seed, grow, harvest, transport, market, and table, and small worker figures help along the way. Labels and shapes carry the idea, and the picture reads clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">From Farm and Garden to My Table</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Many hands help food travel from seed to table.</text>

  <!-- Journey arrow -->
  <path d="M40 270 L472 270" stroke="#e0a458" stroke-width="6" stroke-linecap="round"/>
  <path d="M462 262 l18 8 l-18 8 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>

  <!-- Step 1: seed -->
  <g>
    <circle cx="80" cy="120" r="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M80 128 q0 8 4 10 q4 -2 4 -10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="80" y="158" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">seed</text>
  </g>

  <!-- Step 2: grow -->
  <g>
    <path d="M160 150 l0 -40" stroke="#7a9e7e" stroke-width="3"/>
    <path d="M160 128 q-13 -10 -15 -24 q13 -2 18 9 q7 -11 20 -7 q-2 13 -11 18 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M160 150 q-7 7 0 13 M160 150 q7 7 0 13" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
    <text x="160" y="178" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">grow</text>
  </g>

  <!-- Step 3: harvest -->
  <g>
    <circle cx="240" cy="128" r="10" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M240 138 l0 18" stroke="#2b3a42" stroke-width="4"/>
    <path d="M240 142 l-12 10 M240 142 l12 10" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <path d="M232 156 l-6 16" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
    <text x="240" y="178" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">harvest</text>
  </g>

  <!-- Step 4: transport -->
  <g>
    <rect x="298" y="132" width="44" height="26" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="308" cy="160" r="7" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="332" cy="160" r="7" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <text x="320" y="184" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">transport</text>
  </g>

  <!-- Step 5: market -->
  <g>
    <path d="M392 138 l0 22" stroke="#2b3a42" stroke-width="2"/>
    <path d="M384 138 l28 0 q-2 -12 -14 -12 q-12 0 -14 12 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="400" y="184" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">market</text>
  </g>

  <!-- Step 6: table -->
  <g>
    <path d="M448 148 h32 M464 148 l0 16" stroke="#2b3a42" stroke-width="3"/>
    <circle cx="452" cy="140" r="6" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="472" cy="140" r="6" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <text x="464" y="184" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">table</text>
  </g>

  <!-- Worker figures -->
  <g>
    <circle cx="200" cy="360" r="9" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M200 369 l0 20" stroke="#2b3a42" stroke-width="3"/>
    <path d="M200 374 l-10 8 M200 374 l10 8" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <circle cx="360" cy="360" r="9" fill="#b0804f" stroke="#2b3a42" stroke-width="2"/>
    <path d="M360 369 l0 20" stroke="#2b3a42" stroke-width="3"/>
    <path d="M360 374 l-10 8 M360 374 l10 8" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <text x="280" y="396" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">workers help at every step</text>
  </g>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">Every meal is the work of many hands.</text>
</svg>
