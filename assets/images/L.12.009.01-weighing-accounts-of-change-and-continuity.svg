<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Weighing Accounts of Change and Continuity</title>
  <desc id="desc">A set of scales with two pans. One pan holds a box labeled "account A: change," the other holds a box labeled "account B: continuity." Below, three weighing questions: who tells it, what does it leave out, what is best supported. Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2b3a42" font-weight="bold">Weighing Two Accounts of One Change</text>

  <!-- balance beam -->
  <line x1="96" y1="120" x2="416" y2="120" stroke="#2b3a42" stroke-width="5"/>
  <line x1="256" y1="120" x2="256" y2="170" stroke="#2b3a42" stroke-width="5"/>
  <line x1="216" y1="170" x2="296" y2="170" stroke="#2b3a42" stroke-width="5"/>
  <polygon points="256,170 236,210 276,210" fill="#2b3a42"/>
  <!-- left pan -->
  <line x1="96" y1="120" x2="96" y2="168" stroke="#4f6d7a" stroke-width="3"/>
  <path d="M40 168 Q96 244 152 168 Z" fill="none" stroke="#4f6d7a" stroke-width="3"/>
  <!-- right pan -->
  <line x1="416" y1="120" x2="416" y2="168" stroke="#4f6d7a" stroke-width="3"/>
  <path d="M360 168 Q416 244 472 168 Z" fill="none" stroke="#4f6d7a" stroke-width="3"/>

  <!-- left box -->
  <rect x="46" y="150" width="100" height="74" rx="6" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <text x="96" y="178" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">Account A</text>
  <text x="96" y="198" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">notices change</text>
  <!-- right box -->
  <rect x="366" y="150" width="100" height="74" rx="6" fill="none" stroke="#e0a458" stroke-width="3"/>
  <text x="416" y="178" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">Account B</text>
  <text x="416" y="198" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">notices continuity</text>

  <!-- weighing questions -->
  <rect x="46" y="286" width="420" height="150" rx="8" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="256" y="316" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42" font-weight="bold">Three weighing questions</text>
  <text x="62" y="348" font-family="sans-serif" font-size="14" fill="#222222">1. Who is telling this, and what do they know?</text>
  <text x="62" y="374" font-family="sans-serif" font-size="14" fill="#222222">2. What does it notice, and what does it leave out?</text>
  <text x="62" y="400" font-family="sans-serif" font-size="14" fill="#222222">3. Where do independent accounts agree?</text>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Both may be true — they weigh change and continuity differently.</text>
</svg>
