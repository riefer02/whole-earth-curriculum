<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-06-005-09-area-volume desc-L-06-005-09-area-volume">
  <title id="title-L-06-005-09-area-volume">Area and volume</title>
  <desc id="desc-L-06-005-09-area-volume">Two diagrams side by side. Left: a rectangle 4 by 3 drawn as a grid of 12 unit squares, labeled area equals length times width equals 4 times 3 equals 12 square units. Right: a rectangular prism 4 by 3 by 2 drawn with visible unit cubes, labeled volume equals length times width times height equals 4 times 3 times 2 equals 24 cubic units. Labels, numbers, and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Area and Volume</text>
  <text x="256" y="58" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">area covers a flat surface; volume fills a solid space</text>

  <!-- rectangle 4x3 -->
  <g>
    <rect x="40" y="90" width="200" height="150" fill="#f0e9dd" stroke="#2b3a42" stroke-width="3"/>
    <g stroke="#d7d1c8" stroke-width="1">
      <line x1="90" y1="90" x2="90" y2="240"/><line x1="140" y1="90" x2="140" y2="240"/><line x1="190" y1="90" x2="190" y2="240"/>
      <line x1="40" y1="140" x2="240" y2="140"/><line x1="40" y1="190" x2="240" y2="190"/>
    </g>
    <text x="140" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">4 units wide</text>
    <text x="28" y="217" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222" transform="rotate(-90 28 217)">3 units tall</text>
    <text x="140" y="276" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">area = length × width</text>
    <text x="140" y="300" text-anchor="middle" font-family="sans-serif" font-size="14.0" fill="#222222">= 4 × 3 = 12 square units</text>
  </g>

  <!-- prism 4x3x2 -->
  <g>
    <polygon points="300,150 340,120 460,120 420,150" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <polygon points="300,150 300,250 340,280 340,180" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <polygon points="420,150 420,250 340,280 340,180" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="340" y1="120" x2="340" y2="180" stroke="#2b3a42" stroke-width="2"/>
    <line x1="460" y1="120" x2="420" y2="150" stroke="#2b3a42" stroke-width="2"/>
    <line x1="460" y1="220" x2="420" y2="250" stroke="#2b3a42" stroke-width="2"/>
    <line x1="460" y1="120" x2="460" y2="220" stroke="#2b3a42" stroke-width="2"/>
    <text x="380" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">2 deep</text>
    <text x="466" y="185" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">4 wide</text>
    <text x="320" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">3 tall</text>
    <text x="372" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">volume = length × width × height</text>
    <text x="372" y="338" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">= 4 × 3 × 2 = 24 cubic units</text>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">area is measured in square units; volume in cubic units</text>
  <text x="256" y="494" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">farmers, builders, and potters everywhere use these same two ideas</text>
</svg>
