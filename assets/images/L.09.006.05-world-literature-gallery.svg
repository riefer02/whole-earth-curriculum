<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">World literature gallery</title>
  <desc id="desc">Six cards arranged on a page, each naming a text and its origin — Du Fu of Tang China, Rumi of Persia, Neruda of Chile, Tagore of Bengal, Harjo of the Mvskoke Nation, and the Sundiata epic of Mali — with a short note of each work's form.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Voices From Many Places</text>

  <!-- card 1 -->
  <rect x="40" y="72" width="200" height="86" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="62" cy="94" r="9" fill="#7a9e7e"/>
  <text x="78" y="99" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">Du Fu — Tang China</text>
  <text x="52" y="122" font-family="sans-serif" font-size="11" fill="#4f6d7a">poem of war and home</text>
  <text x="52" y="140" font-family="sans-serif" font-size="11" fill="#4f6d7a">(8th century)</text>

  <!-- card 2 -->
  <rect x="272" y="72" width="200" height="86" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="294" cy="94" r="9" fill="#e0a458"/>
  <text x="310" y="99" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">Rumi — Persia</text>
  <text x="284" y="122" font-family="sans-serif" font-size="11" fill="#4f6d7a">lyric of longing</text>
  <text x="284" y="140" font-family="sans-serif" font-size="11" fill="#4f6d7a">(13th century)</text>

  <!-- card 3 -->
  <rect x="40" y="182" width="200" height="86" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="62" cy="204" r="9" fill="#6b93b6"/>
  <text x="78" y="209" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">Pablo Neruda — Chile</text>
  <text x="52" y="232" font-family="sans-serif" font-size="11" fill="#4f6d7a">ode to an everyday thing</text>
  <text x="52" y="250" font-family="sans-serif" font-size="11" fill="#4f6d7a">(20th century)</text>

  <!-- card 4 -->
  <rect x="272" y="182" width="200" height="86" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="294" cy="204" r="9" fill="#4f6d7a"/>
  <text x="310" y="209" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">Rabindranath Tagore — Bengal</text>
  <text x="284" y="232" font-family="sans-serif" font-size="11" fill="#4f6d7a">song-offering, Gitanjali</text>
  <text x="284" y="250" font-family="sans-serif" font-size="11" fill="#4f6d7a">(1913, Nobel Prize)</text>

  <!-- card 5 -->
  <rect x="40" y="292" width="200" height="86" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="62" cy="314" r="9" fill="#7a9e7e"/>
  <text x="78" y="319" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">Joy Harjo — Mvskoke Nation</text>
  <text x="52" y="342" font-family="sans-serif" font-size="11" fill="#4f6d7a">"Remember" — anaphora</text>
  <text x="52" y="360" font-family="sans-serif" font-size="11" fill="#4f6d7a">(US Poet Laureate)</text>

  <!-- card 6 -->
  <rect x="272" y="292" width="200" height="86" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="294" cy="314" r="9" fill="#e0a458"/>
  <text x="310" y="319" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">Sundiata — Mali</text>
  <text x="284" y="342" font-family="sans-serif" font-size="11" fill="#4f6d7a">oral epic kept by griots</text>
  <text x="284" y="360" font-family="sans-serif" font-size="11" fill="#4f6d7a">(passed by word)</text>

  <text x="256" y="410" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Each voice uses structure, style, and argument in its own way —</text>
  <text x="256" y="428" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">and every one has something to teach about how a text works.</text>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Pick one. Read it. Find its structure, its style, and its argument.</text>
</svg>
