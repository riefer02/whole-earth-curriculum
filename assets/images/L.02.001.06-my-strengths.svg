<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-02-001-06-my-strengths desc-L-02-001-06-my-strengths">
  <title id="title-L-02-001-06-my-strengths">My Strengths</title>
  <desc id="desc-L-02-001-06-my-strengths">A page titled "My Strengths" with five large empty stars arranged in a loose row. Around the stars are small idea labels with tiny icons: helping a friend (two hands), drawing and making (a pencil and a box), running and moving (a running figure), listening (an ear), and being kind (a heart). The stars are blank so the learner fills in their own strengths. A note at the bottom says a strength is something you can do well, and no strength is better than another. Shapes and words, not color, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">My Strengths</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">A strength is something you can do well.</text>

  <!-- five empty stars -->
  <g fill="none" stroke="#2b3a42" stroke-width="2.5">
    <path d="M56 140 L65 160 L87 162 L70 176 L75 198 L56 186 L37 198 L42 176 L25 162 L47 160 Z"/>
    <path d="M156 140 L165 160 L187 162 L170 176 L175 198 L156 186 L137 198 L142 176 L125 162 L147 160 Z"/>
    <path d="M256 140 L265 160 L287 162 L270 176 L275 198 L256 186 L237 198 L242 176 L225 162 L247 160 Z"/>
    <path d="M356 140 L365 160 L387 162 L370 176 L375 198 L356 186 L337 198 L342 176 L325 162 L347 160 Z"/>
    <path d="M456 140 L465 160 L487 162 L470 176 L475 198 L456 186 L437 198 L442 176 L425 162 L447 160 Z"/>
  </g>
  <text x="56" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">write it</text>
  <text x="156" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">or draw it</text>
  <text x="256" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">in each star</text>
  <text x="356" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">your own</text>
  <text x="456" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">strength</text>

  <!-- idea labels with icons -->
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <!-- helping -->
    <circle cx="56" cy="290" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M49 290 L56 296 L64 284" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="326" text-anchor="middle">helping</text>
    <!-- drawing -->
    <circle cx="156" cy="290" r="16" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="150" y="286" width="12" height="8" fill="#2b3a42"/>
    <text x="156" y="326" text-anchor="middle">making</text>
    <!-- moving -->
    <circle cx="256" cy="290" r="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M248 300 Q256 290 264 300" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <text x="256" y="326" text-anchor="middle">moving</text>
    <!-- listening -->
    <circle cx="356" cy="290" r="16" fill="#d6d1c7" stroke="#2b3a42" stroke-width="2"/>
    <path d="M348 292 Q356 284 364 292" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <text x="356" y="326" text-anchor="middle">listening</text>
    <!-- kind -->
    <path d="M456 286 C452 280 445 280 445 285 C445 289 456 296 456 296 C456 296 467 289 467 285 C467 280 460 280 456 286 Z" fill="#c96f5f" stroke="#2b3a42" stroke-width="2"/>
    <text x="456" y="326" text-anchor="middle">being kind</text>
  </g>

  <text x="256" y="372" text-anchor="middle" font-family="sans-serif" font-size="14.3" fill="#4f6d7a">Everyone has strengths — and no strength is better than another.</text>
</svg>
