<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Mutual aid gallery</title>
  <desc id="desc">A gallery of four small scenes in a row. Scene one, "barn raising," shows several figures lifting a roof beam together. Scene two, "harvest sharing," shows people passing baskets of food. Scene three, "shared water," shows people filling containers at a well. Scene four, "tree planting," shows people planting saplings. Each scene is labeled, and a caption reads "Mutual aid: people help one another because they belong to each other." Labels and pictures, not color alone, carry the meaning.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Mutual Aid Around the World</text>

  <!-- Scene 1: barn raising -->
  <rect x="22" y="60" width="110" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="44" y="96" width="66" height="10" rx="3" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="52" cy="124" r="9" fill="#d9a06b" stroke="#2b3a42" stroke-width="1.5"/>
  <path d="M44 144 q8 -8 16 0" fill="none" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="50" y1="134" x2="50" y2="110" stroke="#2b3a42" stroke-width="1.5"/>
  <circle cx="77" cy="124" r="9" fill="#8a5a3b" stroke="#2b3a42" stroke-width="1.5"/>
  <path d="M69 144 q8 -8 16 0" fill="none" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="77" y1="134" x2="77" y2="110" stroke="#2b3a42" stroke-width="1.5"/>
  <circle cx="102" cy="124" r="9" fill="#f0c8a0" stroke="#2b3a42" stroke-width="1.5"/>
  <path d="M94 144 q8 -8 16 0" fill="none" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="102" y1="134" x2="102" y2="110" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="77" y="188" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">barn raising</text>

  <!-- Scene 2: harvest sharing -->
  <rect x="144" y="60" width="110" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="172" cy="112" r="10" fill="#8a5a3b" stroke="#2b3a42" stroke-width="1.5"/>
  <path d="M162 134 q10 -10 20 0" fill="none" stroke="#2b3a42" stroke-width="1.5"/>
  <path d="M166 118 h14 a7 7 0 0 1 7 7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
  <circle cx="226" cy="112" r="10" fill="#d9a06b" stroke="#2b3a42" stroke-width="1.5"/>
  <path d="M216 134 q10 -10 20 0" fill="none" stroke="#2b3a42" stroke-width="1.5"/>
  <path d="M220 118 h14 a7 7 0 0 1 7 7" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="199" y="188" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">harvest sharing</text>

  <!-- Scene 3: shared water -->
  <rect x="266" y="60" width="110" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="294" y="104" width="54" height="30" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="298" y1="104" x2="298" y2="134" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="344" y1="104" x2="344" y2="134" stroke="#2b3a42" stroke-width="1.5"/>
  <path d="M321 104 L313 92 L329 92 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
  <circle cx="300" cy="156" r="9" fill="#f0c8a0" stroke="#2b3a42" stroke-width="1.5"/>
  <path d="M292 176 q8 -8 16 0" fill="none" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="321" y="188" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">shared water</text>

  <!-- Scene 4: tree planting -->
  <rect x="388" y="60" width="110" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="410" cy="112" r="10" fill="#d9a06b" stroke="#2b3a42" stroke-width="1.5"/>
  <path d="M400 134 q10 -10 20 0" fill="none" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="420" y1="130" x2="430" y2="108" stroke="#2b3a42" stroke-width="1.5"/>
  <path d="M424 116 q8 -2 8 6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
  <circle cx="458" cy="112" r="10" fill="#8a5a3b" stroke="#2b3a42" stroke-width="1.5"/>
  <path d="M448 134 q10 -10 20 0" fill="none" stroke="#2b3a42" stroke-width="1.5"/>
  <line x1="448" y1="130" x2="438" y2="108" stroke="#2b3a42" stroke-width="1.5"/>
  <path d="M434 116 q-8 -2 -8 6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="443" y="188" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">tree planting</text>

  <text x="256" y="290" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">Mutual aid: people help one another</text>
  <text x="256" y="318" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">because they belong to each other.</text>
  <text x="256" y="352" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Not for pay — for each other. In every culture and time.</text>

  <text x="256" y="410" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">Who helped? What did they do? Why did it matter?</text>
</svg>
