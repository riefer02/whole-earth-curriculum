<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Washing hands step by step</title>
  <desc id="desc">Five panels in a row show the handwashing routine in order: wet, soap, scrub, rinse, and dry. Each panel has a number, a simple hand drawing, and a word label. The steps are numbered and labeled so they print and read clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Washing Hands</text>

  <!-- Step 1: wet -->
  <g>
    <rect x="16" y="80" width="92" height="268" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="62" cy="112" r="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="62" y="119" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">1</text>
    <!-- hand under water -->
    <path d="M62 160 L62 176 L48 184 L48 172 L40 176 L44 162 L58 158 Z" fill="#e6bb92" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <g stroke="#6b93b6" stroke-width="3" stroke-linecap="round">
      <line x1="62" y1="146" x2="62" y2="152"/>
      <line x1="72" y1="150" x2="72" y2="156"/>
    </g>
    <text x="62" y="210" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">wet</text>
    <text x="62" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">with water</text>
  </g>

  <!-- Step 2: soap -->
  <g>
    <rect x="116" y="80" width="92" height="268" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="162" cy="112" r="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="162" y="119" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">2</text>
    <path d="M162 170 L162 186 L148 194 L148 182 L140 186 L144 172 L158 168 Z" fill="#e6bb92" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="170" cy="206" rx="16" ry="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="162" y="246" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">soap</text>
    <text x="162" y="274" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">add soap</text>
  </g>

  <!-- Step 3: scrub -->
  <g>
    <rect x="216" y="80" width="92" height="268" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="262" cy="112" r="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="262" y="119" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">3</text>
    <!-- two hands rubbing -->
    <path d="M244 178 L244 190 L232 196 L232 186 L226 190 L228 178 L240 176 Z" fill="#e6bb92" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M280 178 L280 190 L292 196 L292 186 L298 190 L296 178 L284 176 Z" fill="#c99567" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <g stroke="#4f6d7a" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M252 208 q6 -6 0 -12"/>
      <path d="M262 214 q6 -6 0 -12"/>
      <path d="M272 208 q6 -6 0 -12"/>
    </g>
    <text x="262" y="246" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">scrub</text>
    <text x="262" y="274" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">20 seconds</text>
  </g>

  <!-- Step 4: rinse -->
  <g>
    <rect x="316" y="80" width="92" height="268" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="362" cy="112" r="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="362" y="119" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">4</text>
    <path d="M362 168 L362 184 L348 192 L348 180 L340 184 L344 170 L358 166 Z" fill="#c99567" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <g stroke="#6b93b6" stroke-width="3" stroke-linecap="round">
      <line x1="362" y1="150" x2="362" y2="156"/>
      <line x1="372" y1="154" x2="372" y2="160"/>
    </g>
    <path d="M362 200 q10 10 0 20" fill="none" stroke="#6b93b6" stroke-width="3" stroke-linecap="round"/>
    <text x="362" y="246" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">rinse</text>
    <text x="362" y="274" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">soap away</text>
  </g>

  <!-- Step 5: dry -->
  <g>
    <rect x="416" y="80" width="92" height="268" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="462" cy="112" r="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="462" y="119" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">5</text>
    <path d="M462 170 L462 186 L448 194 L448 182 L440 186 L444 172 L458 168 Z" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <rect x="436" y="200" width="52" height="34" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="462" y="246" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">dry</text>
    <text x="462" y="274" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">clean cloth</text>
  </g>

  <text x="256" y="380" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Wash before eating, after the bathroom, after play, and after touching animals.</text>
  <text x="256" y="408" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Washing hands is a small act of care for everyone.</text>
</svg>
