<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A food-marketing claim versus the evidence</title>
  <desc id="desc">Two panels. The left panel, labeled The claim, shows a food package with a bright speech bubble reading "Makes you strong!" The right panel, labeled The evidence, shows a checklist of checkable items: What is actually in it? What does the label list? What do independent tests show? A caption reads "A claim is what they say; evidence is what can be checked."</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Claim vs. evidence</text>

  <!-- LEFT PANEL -->
  <rect x="16" y="70" width="230" height="330" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <text x="131" y="98" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e0a458">THE CLAIM</text>
  <text x="131" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">what they say</text>

  <!-- package/bottle -->
  <g>
    <rect x="81" y="160" width="100" height="150" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="81" y="196" width="100" height="40" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="131" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">FIZZ!</text>
    <circle cx="131" cy="272" r="16" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <path d="M123 272 Q131 262 139 272" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- speech bubble -->
  <g>
    <path d="M196 150 L316 150 Q336 150 336 170 L336 196 Q336 216 316 216 L206 216 L192 234 L196 214 Q186 216 180 210 L180 170 Q180 150 196 150 Z" fill="#fdfbf7" stroke="#e0a458" stroke-width="2.5"/>
    <text x="256" y="186" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">"Makes you strong!"</text>
  </g>
  <text x="131" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">A promise to make you buy it</text>

  <!-- RIGHT PANEL -->
  <rect x="266" y="70" width="230" height="330" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <text x="381" y="98" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7a9e7e">THE EVIDENCE</text>
  <text x="381" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">what can be checked</text>

  <g font-family="sans-serif" font-size="14" fill="#2b3a42">
    <g>
      <rect x="286" y="140" width="22" height="22" rx="4" fill="none" stroke="#7a9e7e" stroke-width="2.5"/>
      <path d="M291 151 L296 156 L305 146" fill="none" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
      <text x="318" y="157">What is actually in it?</text>
    </g>
    <g>
      <rect x="286" y="182" width="22" height="22" rx="4" fill="none" stroke="#7a9e7e" stroke-width="2.5"/>
      <path d="M291 193 L296 198 L305 188" fill="none" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
      <text x="318" y="199">What does the label list?</text>
    </g>
    <g>
      <rect x="286" y="224" width="22" height="22" rx="4" fill="none" stroke="#7a9e7e" stroke-width="2.5"/>
      <path d="M291 235 L296 240 L305 230" fill="none" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
      <text x="318" y="241">What do independent tests show?</text>
    </g>
    <g>
      <rect x="286" y="266" width="22" height="22" rx="4" fill="none" stroke="#7a9e7e" stroke-width="2.5"/>
      <path d="M291 277 L296 282 L305 272" fill="none" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
      <text x="318" y="283">Who is saying it, and why?</text>
    </g>
  </g>
  <text x="381" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Facts you can look up and test</text>

  <!-- caption -->
  <rect x="60" y="420" width="392" height="56" rx="10" fill="#7a9e7e" fill-opacity="0.18" stroke="#7a9e7e" stroke-width="2"/>
  <text x="256" y="446" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">A claim is what they say; evidence is what can be checked.</text>
  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Ads are built on claims. Wise eaters ask for evidence.</text>
</svg>
