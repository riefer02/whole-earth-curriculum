<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">How a free press and a literate reader resist manipulation</title>
  <desc id="d">A claim enters from the left and passes through two labeled gates: an independent press that checks facts and asks for evidence, and a literate reader who questions sources. What emerges on the right is labeled "checked claim, or rejected." Labels carry the meaning.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">Two defenses against manipulation</text>

  <!-- input -->
  <rect x="20" y="196" width="120" height="80" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="80" y="228" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">A CLAIM</text>
  <text x="80" y="252" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">arrives</text>

  <!-- gate 1: free press -->
  <rect x="172" y="170" width="150" height="132" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="247" y="202" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">FREE PRESS</text>
  <text x="247" y="228" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">checks the facts</text>
  <text x="247" y="250" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">asks for evidence</text>
  <text x="247" y="272" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">reports freely</text>

  <!-- gate 2: literacy -->
  <rect x="342" y="170" width="150" height="132" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="417" y="202" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">LITERACY</text>
  <text x="417" y="228" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">you question it</text>
  <text x="417" y="250" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">you check sources</text>
  <text x="417" y="272" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">you weigh evidence</text>

  <!-- output -->
  <rect x="156" y="360" width="200" height="76" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="392" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">CHECKED CLAIM —</text>
  <text x="256" y="416" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">or rejected</text>

  <!-- arrows -->
  <line x1="140" y1="236" x2="168" y2="236" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="168,236 158,230 158,242" fill="#2b3a42"/>
  <line x1="322" y1="236" x2="338" y2="236" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="338,236 328,230 328,242" fill="#2b3a42"/>
  <line x1="417" y1="302" x2="310" y2="388" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="310,388 322,388 316,376" fill="#2b3a42"/>
</svg>
