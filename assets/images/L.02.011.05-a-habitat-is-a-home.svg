<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">A pond habitat with a plant and an animal that suit it</title>
  <desc id="d">A pond habitat is drawn with water, mud, and a sun. A reed is the plant; a frog is the animal. Labels point to each: water, mud, plant (reed), animal (frog). A note explains why each suits the pond: the reed grows in wet mud, and the frog's wet skin suits the water. Word labels carry the meaning so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">A habitat is a home: the pond</text>

  <!-- Sun -->
  <circle cx="60" cy="60" r="24" fill="#e0a458" stroke="#2b3a42" stroke-width="4"/>
  <line x1="60" y1="24" x2="60" y2="10" stroke="#2b3a42" stroke-width="4"/>
  <line x1="60" y1="96" x2="60" y2="110" stroke="#2b3a42" stroke-width="4"/>
  <line x1="24" y1="60" x2="10" y2="60" stroke="#2b3a42" stroke-width="4"/>
  <line x1="96" y1="60" x2="110" y2="60" stroke="#2b3a42" stroke-width="4"/>

  <!-- Water -->
  <rect x="20" y="200" width="472" height="180" rx="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="4"/>
  <path d="M40 300 q20 -14 40 0 q20 14 40 0" fill="none" stroke="#fdfbf7" stroke-width="3"/>
  <path d="M160 340 q20 -14 40 0 q20 14 40 0" fill="none" stroke="#fdfbf7" stroke-width="3"/>
  <text x="60" y="360" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">water</text>

  <!-- Mud -->
  <rect x="20" y="380" width="472" height="44" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="4"/>
  <text x="440" y="408" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">mud</text>

  <!-- Reed (plant) -->
  <line x1="170" y1="380" x2="170" y2="250" stroke="#2b3a42" stroke-width="5"/>
  <ellipse cx="170" cy="246" rx="10" ry="26" fill="#7a9e7e" stroke="#2b3a42" stroke-width="4"/>
  <line x1="196" y1="380" x2="196" y2="280" stroke="#2b3a42" stroke-width="5"/>
  <ellipse cx="196" cy="276" rx="10" ry="26" fill="#7a9e7e" stroke="#2b3a42" stroke-width="4"/>
  <text x="183" y="230" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">plant: reed</text>

  <!-- Frog (animal) -->
  <ellipse cx="330" cy="330" rx="34" ry="22" fill="#7a9e7e" stroke="#2b3a42" stroke-width="4"/>
  <circle cx="312" cy="312" r="8" fill="#222222"/>
  <circle cx="348" cy="312" r="8" fill="#222222"/>
  <path d="M318 338 Q330 346 342 338" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <line x1="296" y1="330" x2="278" y2="322" stroke="#2b3a42" stroke-width="4"/>
  <line x1="364" y1="330" x2="382" y2="322" stroke="#2b3a42" stroke-width="4"/>
  <text x="330" y="366" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">animal: frog</text>

  <text x="256" y="460" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">The reed grows in wet mud; the frog's wet skin suits the water.</text>
  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">Each living thing fits its home.</text>
</svg>
