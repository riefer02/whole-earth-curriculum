<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Defending a Reasoned Position Across Perspectives</title>
  <desc id="desc">A central box labeled "my reasoned position," with lines to three smaller boxes labeled "credit their strongest point," each naming a different perspective. A footer reads "take a stand — and account for what the other side sees." Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42" font-weight="bold">Defending a Reasoned Position</text>

  <!-- center -->
  <rect x="176" y="180" width="160" height="64" rx="8" fill="none" stroke="#2b3a42" stroke-width="4"/>
  <text x="256" y="207" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">my reasoned position</text>
  <text x="256" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">a stand, with reasons</text>

  <!-- credit boxes -->
  <rect x="20" y="330" width="140" height="80" rx="6" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <text x="90" y="356" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">credit their strongest point</text>
  <text x="90" y="376" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">the person seeking safety</text>

  <rect x="186" y="330" width="140" height="80" rx="6" fill="none" stroke="#e0a458" stroke-width="3"/>
  <text x="256" y="356" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">credit their strongest point</text>
  <text x="256" y="376" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">the receiving community</text>

  <rect x="352" y="330" width="140" height="80" rx="6" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="422" y="356" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">credit their strongest point</text>
  <text x="422" y="376" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">the sending country</text>

  <!-- connector lines -->
  <line x1="220" y1="244" x2="120" y2="330" stroke="#4f6d7a" stroke-width="3"/>
  <line x1="256" y1="244" x2="256" y2="330" stroke="#4f6d7a" stroke-width="3"/>
  <line x1="292" y1="244" x2="392" y2="330" stroke="#4f6d7a" stroke-width="3"/>

  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Take a stand — and account for what the other side sees.</text>
</svg>
