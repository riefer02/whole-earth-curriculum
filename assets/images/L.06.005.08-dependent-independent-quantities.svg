<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Which quantity depends on the other</title>
  <desc id="desc">A diagram showing dependent and independent quantities. Two example rows each have an input box, an arrow, and an output box. Example A: "number of portions you cook (you choose)" points to "cooking time (depends on portions)". Example B: "water you give a plant (you choose)" points to "plant growth (depends on water)". The input box is labeled "independent" and the output box is labeled "dependent". Labels, arrows, and position, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Which Quantity Depends on the Other?</text>
  <text x="256" y="58" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">the independent quantity is what you choose; the dependent quantity follows from it</text>

  <!-- Example A -->
  <g>
    <rect x="20" y="90" width="180" height="110" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="110" y="132" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">portions you cook</text>
    <text x="110" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">(you choose)</text>
    <text x="110" y="184" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">INDEPENDENT</text>

    <line x1="200" y1="145" x2="292" y2="145" stroke="#2b3a42" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="246" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">depends on</text>

    <rect x="300" y="90" width="190" height="110" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="395" y="132" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">cooking time</text>
    <text x="395" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">(follows portions)</text>
    <text x="395" y="184" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">DEPENDENT</text>
  </g>

  <!-- Example B -->
  <g>
    <rect x="20" y="250" width="180" height="110" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="110" y="292" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">water you give</text>
    <text x="110" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">(you choose)</text>
    <text x="110" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">INDEPENDENT</text>

    <line x1="200" y1="305" x2="292" y2="305" stroke="#2b3a42" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="246" y="290" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">depends on</text>

    <rect x="300" y="250" width="190" height="110" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="395" y="292" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">plant growth</text>
    <text x="395" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">(follows water)</text>
    <text x="395" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">DEPENDENT</text>
  </g>

  <text x="256" y="410" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">ask: "which one do I choose, and which one follows from it?"</text>
  <text x="256" y="438" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">cooking time depends on portions — portions do not depend on cooking time</text>
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">not every pair of quantities is cause and effect — sometimes both follow a third thing</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2b3a42"/>
    </marker>
  </defs>
</svg>
