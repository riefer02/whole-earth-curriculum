<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Blocking: Bodies in Space</title>
  <desc id="desc">A top-down view of a performance space with three performers shown as labeled dots, arrows tracing their movement paths, and labels for high, middle, and low levels, showing how spacing and levels direct an audience's attention.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Blocking: Bodies in Space</text>

  <!-- Stage rectangle -->
  <rect x="60" y="90" width="392" height="300" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">stage (viewed from above)</text>

  <!-- Audience -->
  <rect x="60" y="400" width="392" height="40" fill="#4f6d7a" fill-opacity="0.2" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="426" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">audience</text>

  <!-- Performer 1 (high, upstage center) -->
  <circle cx="256" cy="140" r="22" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="145" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">A</text>
  <text x="256" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">high level</text>

  <!-- Performer 2 (middle, stage left) -->
  <circle cx="140" cy="250" r="22" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="140" y="255" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">B</text>
  <text x="140" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">middle</text>

  <!-- Performer 3 (low, stage right) -->
  <circle cx="370" cy="330" r="22" fill="#6b93b6" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="370" y="335" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">C</text>
  <text x="370" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">low level</text>

  <!-- Movement arrows -->
  <path d="M 256 162 C 220 190, 180 220, 162 250" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-dasharray="7 5"/>
  <polygon points="162,250 174,246 168,238" fill="#2b3a42"/>

  <path d="M 370 308 C 320 300, 300 280, 278 250" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-dasharray="7 5"/>
  <polygon points="278,250 286,246 278,238" fill="#2b3a42"/>

  <!-- Caption -->
  <rect x="90" y="452" width="332" height="52" rx="8" fill="#ffffff" stroke="#e0a458" stroke-width="2"/>
  <text x="256" y="474" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">Spacing and level carry meaning</text>
  <text x="256" y="494" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">without a single word.</text>
</svg>
