<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Two ways to show one feeling, neither is the default</title>
  <desc id="desc">Two panels side by side. The left panel shows a group of people wailing and embracing openly at a loss, labeled "one way: grief shared aloud." The right panel shows a single seated figure with a still face and folded hands, labeled "another way: grief held quietly." A large equals sign sits between the panels, and a caption below reads "Two norms, both real — neither is the default." Meaning is carried by labels and shapes, not color, so it prints clearly in grayscale.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">One feeling, two ways</text>

  <!-- Left panel: grief shared aloud -->
  <g>
    <rect x="24" y="70" width="196" height="330" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="122" y="96" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">one way: grief shared aloud</text>
    <!-- three figures, arms raised, embracing -->
    <!-- figure 1 -->
    <circle cx="86" cy="180" r="26" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M86 162 Q91 157 96 162" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M76 162 Q81 157 86 162" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="86" cy="172" rx="3.5" ry="6" fill="#2b3a42"/>
    <path d="M60 206 L96 206" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <!-- figure 2 center -->
    <circle cx="122" cy="188" r="30" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M122 168 Q128 162 134 168" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M110 168 Q116 162 122 168" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="122" cy="180" rx="4" ry="7" fill="#2b3a42"/>
    <path d="M70 214 L174 214" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <!-- figure 3 -->
    <circle cx="158" cy="180" r="26" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M158 162 Q163 157 168 162" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M148 162 Q153 157 158 162" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="158" cy="172" rx="3.5" ry="6" fill="#2b3a42"/>
    <path d="M148 206 L184 206" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <text x="122" y="268" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">voices raised together</text>
    <text x="122" y="292" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">the whole street knows</text>
  </g>

  <!-- Equals sign -->
  <text x="256" y="256" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="bold" fill="#e0a458">=</text>

  <!-- Right panel: grief held quietly -->
  <g>
    <rect x="292" y="70" width="196" height="330" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="390" y="96" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">another way: grief held quietly</text>
    <!-- single seated figure, still face, folded hands -->
    <circle cx="390" cy="196" r="34" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M378 190 L384 186" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M396 186 L402 190" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M382 206 L398 206" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- folded hands -->
    <path d="M380 248 q10 10 20 0 q-10 8 -20 0" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <!-- body -->
    <path d="M356 300 q34 -34 68 0" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <text x="390" y="332" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">a still face</text>
    <text x="390" y="356" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">carried in private</text>
  </g>

  <!-- Caption -->
  <text x="256" y="434" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">Two norms, both real —</text>
  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">neither is the default.</text>
</svg>
