<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Balanced and unbalanced forces</title>
  <desc id="desc">A two-panel diagram of balanced and unbalanced forces. Left panel "Balanced forces": a box at rest with two equal, opposite arrows (push left and friction right) of the same length, labeled "equal and opposite — no change in motion." Right panel "Unbalanced forces": the same box with a longer push arrow and a shorter friction arrow, labeled "one bigger — the box speeds up." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Balanced and Unbalanced Forces</text>

  <!-- Balanced -->
  <rect x="24" y="60" width="220" height="200" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="134" y="86" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Balanced forces</text>

  <rect x="82" y="140" width="72" height="46" rx="6" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="118" y="168" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">box</text>

  <!-- equal arrows -->
  <line x1="24" y1="163" x2="74" y2="163" stroke="#e0a458" stroke-width="4" marker-end="url(#arr8)"/>
  <text x="40" y="150" font-family="sans-serif" font-size="11" fill="#e0a458">push</text>
  <line x1="162" y1="163" x2="212" y2="163" stroke="#6b93b6" stroke-width="4" marker-end="url(#arr8b)"/>
  <text x="196" y="150" font-family="sans-serif" font-size="11" fill="#6b93b6">friction</text>

  <text x="134" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">equal and opposite →</text>
  <text x="134" y="242" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">no change in motion</text>

  <!-- Unbalanced -->
  <rect x="268" y="60" width="220" height="200" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="378" y="86" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Unbalanced forces</text>

  <rect x="326" y="140" width="72" height="46" rx="6" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="362" y="168" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">box</text>

  <!-- longer push, shorter friction -->
  <line x1="268" y1="163" x2="318" y2="163" stroke="#e0a458" stroke-width="6" marker-end="url(#arr8)"/>
  <text x="284" y="150" font-family="sans-serif" font-size="11" fill="#e0a458">push</text>
  <line x1="406" y1="163" x2="440" y2="163" stroke="#6b93b6" stroke-width="3" marker-end="url(#arr8b)"/>
  <text x="424" y="150" font-family="sans-serif" font-size="11" fill="#6b93b6">friction</text>

  <!-- motion arrow -->
  <line x1="430" y1="163" x2="484" y2="163" stroke="#7a9e7e" stroke-width="4" marker-end="url(#arr8g)"/>

  <text x="378" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">one force is bigger →</text>
  <text x="378" y="242" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">the box speeds up</text>

  <defs>
    <marker id="arr8" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 z" fill="#e0a458"/>
    </marker>
    <marker id="arr8b" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 z" fill="#6b93b6"/>
    </marker>
    <marker id="arr8g" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 z" fill="#7a9e7e"/>
    </marker>
  </defs>

  <!-- gravity note -->
  <rect x="64" y="292" width="384" height="76" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="318" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Two forces you meet every day</text>
  <text x="256" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">gravity pulls things down · friction resists sliding</text>

  <!-- rule -->
  <rect x="64" y="396" width="384" height="56" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="422" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Motion changes only when forces are unbalanced.</text>
  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">balanced forces = steady motion · unbalanced forces = speeding up or slowing down</text>
</svg>
