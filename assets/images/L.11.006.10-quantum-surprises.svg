<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Quantum Surprises</title>
  <desc id="desc">A three-panel diagram. Panel one shows an electron jumping between fixed energy levels, labeled energy comes in allowed steps. Panel two shows a wave and a particle drawn as the same thing, labeled wave and particle at once. Panel three shows a blurred position with a question mark, labeled you cannot know both position and speed exactly.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Three Quantum Surprises</text>

  <!-- Panel 1: energy steps -->
  <rect x="20" y="60" width="150" height="180" fill="#7a9e7e" fill-opacity="0.12" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="95" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">1 · Energy in steps</text>
  <line x1="52" y1="210" x2="52" y2="120" stroke="#4f6d7a" stroke-width="2"/>
  <line x1="52" y1="150" x2="150" y2="150" stroke="#2b3a42" stroke-width="2"/>
  <line x1="52" y1="180" x2="150" y2="180" stroke="#2b3a42" stroke-width="2"/>
  <line x1="52" y1="210" x2="150" y2="210" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="70" cy="180" r="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
  <path d="M 70 180 C 90 150 100 150 108 130" fill="none" stroke="#e0a458" stroke-width="2"/>
  <polygon points="108,130 100,136 108,142" fill="#e0a458"/>
  <text x="95" y="228" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">no level in between</text>

  <!-- Panel 2: wave-particle -->
  <rect x="181" y="60" width="150" height="180" fill="#6b93b6" fill-opacity="0.12" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="256" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">2 · Wave and particle</text>
  <path d="M 200 170 q 15 -30 30 0 t 30 0 t 30 0 t 30 0" fill="none" stroke="#6b93b6" stroke-width="2.5"/>
  <circle cx="300" cy="140" r="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">the same thing, two faces</text>
  <text x="256" y="228" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">light and matter both</text>

  <!-- Panel 3: uncertainty -->
  <rect x="342" y="60" width="150" height="180" fill="#e0a458" fill-opacity="0.12" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="417" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">3 · Uncertainty</text>
  <ellipse cx="417" cy="150" rx="44" ry="30" fill="#e0a458" fill-opacity="0.35" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="417" y="154" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42" font-weight="bold">?</text>
  <text x="417" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">position and motion:</text>
  <text x="417" y="228" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">can't know both exactly</text>

  <!-- Footer -->
  <rect x="70" y="280" width="372" height="90" fill="#ffffff" stroke="#e0a458" stroke-width="2" rx="6"/>
  <text x="256" y="308" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">Counterintuitive — but measured, and real.</text>
  <text x="256" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">The laser, the transistor, and the screen</text>
  <text x="256" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">you read on all work because of them.</text>
</svg>
