<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A day in another child's life</title>
  <desc id="desc">Four simple cards show the parts of a child's day in another place. The first card shows a bowl of food with a spoon, labeled food. The second card shows a small home with a roof and a door, labeled home. The third card shows a child carrying a basket, labeled work. The fourth card shows a child playing with a ball, labeled play. The four labels and the simple shapes — not color — carry the meaning, so the picture prints clearly in grayscale and teaches that children everywhere eat, live somewhere, help, and play.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">A Day in Another Child&#8217;s Life</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Food &#183; home &#183; work &#183; play &#183; the parts are alike, the ways are many</text>

  <!-- card frames -->
  <rect x="26" y="104" width="100" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="146" y="104" width="100" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="266" y="104" width="100" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="386" y="104" width="100" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>

  <!-- food -->
  <g>
    <path d="M46 158 Q76 146 106 158 L100 192 L52 192 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <line x1="42" y1="152" x2="110" y2="152" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <line x1="62" y1="150" x2="68" y2="136" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="70" cy="133" rx="6" ry="4" fill="#4f6d7a" stroke="#2b3a42" stroke-width="1.6"/>
    <text x="76" y="238" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">food</text>
  </g>

  <!-- home -->
  <g>
    <path d="M162 150 L196 122 L230 150 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <rect x="170" y="150" width="52" height="52" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="188" y="178" width="16" height="24" rx="2" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <text x="196" y="238" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">home</text>
  </g>

  <!-- work -->
  <g>
    <circle cx="316" cy="176" r="13" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M303 174 A13 13 0 0 1 329 174 Z" fill="#2b3a42"/>
    <path d="M309 180 Q316 184 323 180" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="307" y="190" width="18" height="22" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M286 196 L270 188 L278 176 L292 184 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <line x1="278" y1="176" x2="286" y2="184" stroke="#2b3a42" stroke-width="2"/>
    <text x="316" y="238" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">work</text>
  </g>

  <!-- play -->
  <g>
    <circle cx="436" cy="176" r="22" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M436 154 A22 22 0 0 1 458 176" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <path d="M436 154 A22 22 0 0 0 414 176" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <path d="M436 198 A22 22 0 0 0 414 176" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <path d="M436 198 A22 22 0 0 1 458 176" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <text x="436" y="238" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">play</text>
  </g>

  <text x="256" y="308" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">Every child eats, lives somewhere, helps, and plays</text>
  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">alike &#183; different &#183; no way is better</text>
  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Children in another place &#183; and children long ago</text>
</svg>
