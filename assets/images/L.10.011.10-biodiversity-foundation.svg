<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t10 d10">
  <title id="t10">Biodiversity as a foundation</title>
  <desc id="d10">Two pyramids: on the left, ecosystem services sit on a wide base of many species; on the right, the same services rest on a narrowed base and tilt as it fails.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="128" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">healthy</text>
  <text x="384" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">thinned</text>
  <path d="M128 70 L48 210 L208 210 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <path d="M128 70 L128 210" stroke="#fdfbf7" stroke-width="2"/>
  <path d="M384 70 L304 210 L464 210 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" transform="rotate(6 384 210)"/>
  <path d="M384 70 L384 210" stroke="#fdfbf7" stroke-width="2"/>
  <text x="128" y="120" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">services</text>
  <text x="384" y="120" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">services</text>
  <path d="M70 210 L186 210" stroke="#2b3a42" stroke-width="4"/>
  <path d="M330 210 L436 210" stroke="#2b3a42" stroke-width="4"/>
  <text x="128" y="246" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">wide base of</text>
  <text x="128" y="268" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">many species</text>
  <text x="384" y="246" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">narrow base</text>
  <text x="384" y="268" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">= fewer kinds</text>
  <text x="256" y="320" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">Services stand on biodiversity</text>
  <text x="256" y="348" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Thin the base, and the top topples</text>
</svg>
