<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Capstone: the human story, told from many perspectives</title>
  <desc id="desc">A web diagram with the human story told from many perspectives at the center and eight spokes — competing explanations, change and continuity, knowledge traditions, cultural blending, trade networks, environmental migration, slavery and resistance, and keeping hope — each labeled with one short reminder.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Eight goals, one human story</text>

  <!-- center -->
  <circle cx="256" cy="256" r="70" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="250" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">the human story,</text>
  <text x="256" y="270" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">told from many</text>
  <text x="256" y="290" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">perspectives</text>

  <!-- spokes -->
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="256" y1="186" x2="256" y2="96"/>
    <line x1="320" y1="220" x2="410" y2="168"/>
    <line x1="326" y1="256" x2="420" y2="256"/>
    <line x1="320" y1="292" x2="410" y2="344"/>
    <line x1="256" y1="326" x2="256" y2="416"/>
    <line x1="192" y1="292" x2="102" y2="344"/>
    <line x1="186" y1="256" x2="92" y2="256"/>
    <line x1="192" y1="220" x2="102" y2="168"/>
  </g>

  <!-- nodes -->
  <g font-family="sans-serif" font-size="11" fill="#222222" text-anchor="middle">
    <circle cx="256" cy="86" r="22" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="83">weigh</text><text x="256" y="97">causes</text>

    <circle cx="420" cy="160" r="22" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="420" y="157">change &amp;</text><text x="420" y="171">stays</text>

    <circle cx="430" cy="256" r="22" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="430" y="253">knowledge</text><text x="430" y="267">traditions</text>

    <circle cx="420" cy="352" r="22" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="420" y="349">blending</text><text x="420" y="363">of cultures</text>

    <circle cx="256" cy="426" r="22" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="423">trade</text><text x="256" y="437">networks</text>

    <circle cx="92" cy="352" r="22" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="92" y="349">environment</text><text x="92" y="363">&amp; migration</text>

    <circle cx="82" cy="256" r="22" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <text x="82" y="253" fill="#fdfbf7">slavery &amp;</text><text x="82" y="267" fill="#fdfbf7">resistance</text>

    <circle cx="92" cy="160" r="22" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="92" y="157">keeping</text><text x="92" y="171">hope</text>
  </g>

  <text x="256" y="482" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">Each thread touches the others — and every learner is a thread in the web.</text>
</svg>
