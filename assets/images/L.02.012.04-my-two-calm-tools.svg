<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My two calm tools</title>
  <desc id="desc">Two calm tools drawn as two cards. The first card shows "balloon breath": a small circle growing into a big balloon as a child breathes in, then shrinking as the child breathes out, with arrows in and out. The second card shows "count to five": a hand with five fingers, each finger labeled with a number and a dot, plus a small "pause" hand held up. A banner above both cards reads "pause first." The closing line teaches that a strong feeling is okay, and I can choose a calm tool on my own. Labels carry the meaning, so the picture prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">My Two Calm Tools</text>
  <text x="256" y="68" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">a strong feeling is okay — I can choose how to calm</text>

  <!-- pause banner -->
  <rect x="176" y="88" width="160" height="34" rx="17" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="111" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">pause first</text>

  <!-- card 1: balloon breath -->
  <g>
    <rect x="16" y="150" width="228" height="310" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <text x="130" y="184" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">balloon breath</text>
    <path d="M130 300 Q130 214 130 236" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="130" cy="300" rx="58" ry="66" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M118 358 Q130 368 142 358" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="130" y="388" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">breathe in — grow big</text>
    <ellipse cx="78" cy="262" rx="34" ry="38" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="78" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">breathe out —</text>
    <text x="78" y="350" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">grow small</text>
    <path d="M196 300 L212 300" stroke="#4f6d7a" stroke-width="3"/>
    <path d="M206 294 L212 300 L206 306" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- card 2: count to five -->
  <g>
    <rect x="268" y="150" width="228" height="310" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <text x="382" y="184" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">count to five</text>
    <!-- hand -->
    <path d="M382 300 L382 366" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M382 300 L340 318" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M382 300 L362 314" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M382 300 L402 314" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M382 300 L424 318" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <circle cx="340" cy="318" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="362" cy="314" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="402" cy="314" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="424" cy="318" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="382" cy="366" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="340" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">1</text>
    <text x="362" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">2</text>
    <text x="402" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">3</text>
    <text x="424" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">4</text>
    <text x="382" y="358" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">5</text>
    <text x="382" y="388" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">one, two, three, four, five</text>
    <text x="382" y="412" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">slow and steady</text>
  </g>

  <text x="256" y="500" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">These are two of many calm tools. I can choose the one that helps me today.</text>
</svg>
