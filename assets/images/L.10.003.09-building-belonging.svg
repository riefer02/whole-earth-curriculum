<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Building belonging with technology</title>
  <desc id="desc">Concentric circles of community, from an inner circle of family, class, and neighborhood, through a middle circle of online spaces and diaspora ties, to an outer circle of the global. Screen threads connect the circles, and a note asks who is inside and who is left out.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Building Belonging</text>

  <!-- Concentric circles -->
  <circle cx="256" cy="240" r="60" fill="#eaf2ea" stroke="#7a9e7e" stroke-width="3"/>
  <circle cx="256" cy="240" r="120" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <circle cx="256" cy="240" r="180" fill="none" stroke="#e0a458" stroke-width="3"/>

  <!-- Inner person -->
  <g transform="translate(256,240)">
    <circle cx="0" cy="-30" r="18" fill="#e0a458"/>
    <rect x="-13" y="-12" width="26" height="42" rx="9" fill="#2b3a42"/>
  </g>

  <!-- Labels -->
  <text x="256" y="204" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2c4a2c">family &#183; class &#183; neighborhood</text>
  <text x="256" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3a5a6a">online spaces &#183; diaspora ties</text>
  <text x="256" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5a3d1e">the global</text>

  <!-- Screen threads -->
  <g stroke="#4f6d7a" stroke-width="2" stroke-dasharray="4 4">
    <line x1="256" y1="180" x2="256" y2="60"/>
    <line x1="256" y1="300" x2="256" y2="430"/>
    <line x1="196" y1="240" x2="76" y2="240"/>
    <line x1="316" y1="240" x2="436" y2="240"/>
  </g>
  <g fill="#6b93b6">
    <rect x="248" y="108" width="16" height="10" rx="3"/>
    <rect x="408" y="232" width="16" height="10" rx="3"/>
    <rect x="104" y="232" width="16" height="10" rx="3"/>
  </g>
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">screens thread the circles together</text>

  <!-- Who is inside / out -->
  <rect x="28" y="470" width="456" height="28" rx="10" fill="#f6ead8" stroke="#e0a458" stroke-width="1.5"/>
  <text x="256" y="489" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5a3d1e">every room has a door — ask who is welcomed, and who is left out</text>
</svg>
