<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-00-009-07-asking-why-and-how desc-L-00-009-07-asking-why-and-how">
  <title id="title-L-00-009-07-asking-why-and-how">Asking why and how</title>
  <desc id="desc-L-00-009-07-asking-why-and-how">A wondering child with a raised finger looks at a leaf and a seed on a table in front of them. Two speech bubbles above the child hold the question words "Why?" and "How?". A box to the right is labeled "Wonder box," where questions can be dropped. A small lightbulb marks the child's own idea. The scene shows that wondering and asking is how every curious person begins, and it prints clearly in grayscale.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="52" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Asking Why and How</text>

  <!-- Why bubble -->
  <g>
    <path d="M110 96 Q110 72 148 72 L192 72 Q230 72 230 96 L230 118 Q230 142 192 142 L160 142 L144 164 L152 142 L148 142 Q110 142 110 118 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="170" y="114" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#6b93b6">Why?</text>
  </g>

  <!-- How bubble -->
  <g>
    <path d="M282 96 Q282 72 320 72 L368 72 Q406 72 406 96 L406 118 Q406 142 368 142 L336 142 L320 164 L328 142 L324 142 Q282 142 282 118 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="344" y="114" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#7a9e7e">How?</text>
  </g>

  <!-- Child: one soft silhouette, limbs with weight -->
  <g>
    <path d="M238 366 L234 438" stroke="#d9e3e9" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M274 366 L278 438" stroke="#d9e3e9" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M218 302 L196 366" stroke="#d9e3e9" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M294 302 L320 256" stroke="#d9e3e9" stroke-width="18" stroke-linecap="round" fill="none"/>
    <circle cx="193" cy="371" r="9" fill="#d9e3e9"/>
    <circle cx="323" cy="251" r="9" fill="#d9e3e9"/>
    <path d="M256 290 C 232 290 218 302 218 320 L218 350 C218 368 228 376 244 376 L268 376 C284 376 294 368 294 350 L294 320 C294 302 280 290 256 290 Z" fill="#e0a458"/>
    <rect x="249" y="274" width="14" height="20" rx="5" fill="#d9e3e9"/>
    <circle cx="256" cy="248" r="32" fill="#d9e3e9"/>
    <path d="M224 248 A32 32 0 0 1 288 248 C288 236 276 222 256 222 C236 222 224 236 224 248 Z" fill="#2b3a42"/>
    <circle cx="245" cy="254" r="3.4" fill="#2b3a42"/>
    <circle cx="267" cy="254" r="3.4" fill="#2b3a42"/>
    <path d="M248 266 Q256 272 264 266" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- raised index finger -->
    <path d="M324 244 L330 220" stroke="#d9e3e9" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Table with leaf and seed -->
  <g>
    <rect x="150" y="436" width="212" height="16" rx="6" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <line x1="164" y1="452" x2="164" y2="478" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="348" y1="452" x2="348" y2="478" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <!-- leaf -->
    <path d="M184 430 Q198 414 212 430 Q198 446 184 430 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <line x1="184" y1="430" x2="212" y2="430" stroke="#2b3a42" stroke-width="1.5"/>
    <!-- seed -->
    <ellipse cx="340" cy="430" rx="12" ry="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M334 428 Q340 434 346 428" fill="none" stroke="#2b3a42" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Wonder box -->
  <g>
    <rect x="392" y="330" width="100" height="80" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M404 330 L404 316 Q404 308 414 308 L458 308 Q468 308 468 316 L468 330" fill="none" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M442 330 L442 344 M434 330 L434 344 M450 330 L450 344" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
    <text x="442" y="366" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Wonder</text>
    <text x="442" y="386" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">box</text>
  </g>

  <!-- Idea lightbulb -->
  <g>
    <circle cx="86" cy="330" r="20" fill="#f7eeda" stroke="#2b3a42" stroke-width="2"/>
    <rect x="82" y="350" width="8" height="6" rx="2" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M76 336 Q80 332 84 336 M88 336 Q92 332 96 336" fill="none" stroke="#e0a458" stroke-width="2.5" stroke-linecap="round"/>
    <text x="86" y="386" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">my idea</text>
  </g>

  <!-- Footer -->
  <text x="256" y="500" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">There are no silly questions. Ask, then share your own idea.</text>
</svg>
