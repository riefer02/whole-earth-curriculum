<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 300" role="img" aria-labelledby="title desc">
  <title id="title">A dance has a start, a middle, and an end</title>
  <desc id="desc">A movement map titled "A dance has a start, a middle, and an end." Three panels read left to right. The left panel, labeled "start shape (all together, low)," shows stick figures crouched close together. The middle panel, labeled "middle (travel — pathways and levels)," shows stick figures moving along curved arrows, some high and some low. The right panel, labeled "end shape (a final group shape)," shows stick figures standing close in a tall shared shape. Arrows connect the panels. Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="300" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">A Dance Has a Start, a Middle, and an End</text>

  <defs>
    <marker id="arr7" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2b3a42"/>
    </marker>
  </defs>

  <!-- Panel 1: start shape -->
  <rect x="24" y="80" width="140" height="170" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="94" y="104" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">start shape</text>
  <text x="94" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">all together, low</text>
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="70" cy="196" r="8" fill="#e6bb92"/>
    <circle cx="118" cy="196" r="8" fill="#ab7a4e"/>
    <path d="M70 204 Q78 216 86 224"/>
    <path d="M118 204 Q110 216 102 224"/>
    <path d="M70 208 L62 218"/>
    <path d="M118 208 L126 218"/>
    <path d="M86 224 L86 216"/>
    <path d="M102 224 L102 216"/>
  </g>
  <text x="94" y="238" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">curled together — the seed</text>

  <!-- arrow 1 -->
  <line x1="168" y1="170" x2="192" y2="170" stroke="#2b3a42" stroke-width="3" marker-end="url(#arr7)"/>

  <!-- Panel 2: middle -->
  <rect x="196" y="80" width="140" height="170" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="266" y="104" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">middle</text>
  <text x="266" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">travel — pathways and levels</text>
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="232" cy="200" r="8" fill="#d9a06b"/>
    <circle cx="266" cy="170" r="8" fill="#e6bb92"/>
    <circle cx="300" cy="200" r="8" fill="#8c5a3b"/>
    <path d="M232 208 L232 232"/>
    <path d="M266 178 L266 202"/>
    <path d="M300 208 L300 232"/>
    <path d="M232 214 L222 206"/>
    <path d="M232 214 L242 206"/>
    <path d="M300 214 L290 206"/>
    <path d="M300 214 L310 206"/>
  </g>
  <!-- pathway arrows -->
  <g stroke="#e0a458" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M226 244 Q246 252 262 244 Q278 236 296 244"/>
  </g>
  <text x="266" y="238" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">rising, moving outward</text>

  <!-- arrow 2 -->
  <line x1="340" y1="170" x2="364" y2="170" stroke="#2b3a42" stroke-width="3" marker-end="url(#arr7)"/>

  <!-- Panel 3: end shape -->
  <rect x="368" y="80" width="140" height="170" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="438" y="104" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">end shape</text>
  <text x="438" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">a final group shape</text>
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="416" cy="170" r="8" fill="#e6bb92"/>
    <circle cx="460" cy="170" r="8" fill="#ab7a4e"/>
    <path d="M416 178 L416 216"/>
    <path d="M460 178 L460 216"/>
    <path d="M416 188 L400 180"/>
    <path d="M460 188 L476 180"/>
    <path d="M416 216 L430 226"/>
    <path d="M460 216 L446 226"/>
  </g>
  <!-- arms reaching up together -->
  <path d="M402 150 Q438 132 474 150" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="438" y="238" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">tall and open — the tree</text>

  <text x="256" y="280" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">shape it together — every body belongs</text>
</svg>
