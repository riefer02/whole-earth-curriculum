<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Three checks before you trust</title>
  <desc id="desc">Three checkboxes labeled "author," "purpose," and "evidence," each with a question below: "who wrote it?", "why?", and "what proof?". A caption reads "Three checks before you trust." Meaning is carried by labels and position, not color, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">Three checks before you trust</text>

  <!-- Check 1 -->
  <g>
    <rect x="60" y="96" width="44" height="44" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
    <path d="M72 118 L82 128 L96 108" fill="none" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="116" y="116" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">author</text>
    <text x="116" y="136" font-family="sans-serif" font-size="15" fill="#4f6d7a">who wrote it?</text>
  </g>

  <!-- Check 2 -->
  <g>
    <rect x="60" y="176" width="44" height="44" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
    <path d="M72 198 L82 208 L96 188" fill="none" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="116" y="196" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">purpose</text>
    <text x="116" y="216" font-family="sans-serif" font-size="15" fill="#4f6d7a">why? inform, persuade, or sell?</text>
  </g>

  <!-- Check 3 -->
  <g>
    <rect x="60" y="256" width="44" height="44" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
    <path d="M72 278 L82 288 L96 268" fill="none" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="116" y="276" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">evidence</text>
    <text x="116" y="296" font-family="sans-serif" font-size="15" fill="#4f6d7a">what proof, and can it be checked?</text>
  </g>

  <text x="256" y="356" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Then reach a verdict:</text>
  <text x="256" y="392" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">trust · question · reject</text>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">The same claim can be trustworthy or not — it depends on the source.</text>
</svg>
