<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Two peoples, two places comparison</title>
  <desc id="desc">A comparison chart with two columns and four rows. The two column headers are "Arctic people" and "desert people." The rows are labeled "place," "food," "shelter," and "clothing," with a simple icon in each cell: snow and sun for place, fish and dates for food, a snow house and a tent for shelter, and a parka and a robe for clothing. Labels and shapes, not color, carry the meaning so it prints in grayscale, and neither column is marked better.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Two Peoples, Two Places</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">How each place shapes food, shelter, and clothing.</text>

  <!-- header row -->
  <rect x="56" y="92" width="120" height="44" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="116" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">what to compare</text>
  <rect x="176" y="92" width="140" height="44" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="246" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Arctic people</text>
  <rect x="316" y="92" width="140" height="44" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="386" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">desert people</text>

  <!-- place -->
  <rect x="56" y="136" width="120" height="52" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="116" y="167" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">place</text>
  <rect x="176" y="136" width="140" height="52" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M246 150 q6 -6 6 -12 q0 -6 -6 -12 q6 -6 6 -12 q0 -6 -6 -12" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <text x="246" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">cold and snowy</text>
  <rect x="316" y="136" width="140" height="52" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="386" cy="156" r="12" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M386 142 l0 -6 M386 176 l0 -6 M372 156 l-6 0 M406 156 l6 0 M376 146 l-4 -4 M396 146 l4 -4 M376 166 l-4 4 M396 166 l4 4" stroke="#2b3a42" stroke-width="2"/>
  <text x="386" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">hot and dry</text>

  <!-- food -->
  <rect x="56" y="188" width="120" height="52" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="116" y="219" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">food</text>
  <rect x="176" y="188" width="140" height="52" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M234 206 q0 -10 12 -10 q12 0 12 10 q0 6 -5 6 l-14 0 q-5 0 -5 -6 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="246" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">fish and sea food</text>
  <rect x="316" y="188" width="140" height="52" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="376" cy="206" r="5" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="390" cy="202" r="5" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="400" cy="206" r="5" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="386" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">dates and milk</text>

  <!-- shelter -->
  <rect x="56" y="240" width="120" height="52" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="116" y="271" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">shelter</text>
  <rect x="176" y="240" width="140" height="52" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M224 274 q11 -18 22 0 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="246" y="284" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">snow house</text>
  <rect x="316" y="240" width="140" height="52" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M360 258 L412 258 L406 276 L366 276 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="386" y="284" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">tent</text>

  <!-- clothing -->
  <rect x="56" y="292" width="120" height="52" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="116" y="323" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">clothing</text>
  <rect x="176" y="292" width="140" height="52" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M232 300 q10 -10 28 -10 q18 0 28 10 l-4 26 q-12 6 -24 6 q-12 0 -24 -6 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="246" y="336" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">warm parka</text>
  <rect x="316" y="292" width="140" height="52" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M370 300 q10 -14 32 -14 q22 0 32 14 l0 24 q-16 6 -32 6 q-16 0 -32 -6 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="386" y="336" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">light robe</text>

  <text x="256" y="382" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">Both peoples meet the same needs —</text>
  <text x="256" y="404" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">each place shapes how, and neither way is better.</text>
  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Comparing with respect is how we learn from one another.</text>
</svg>
