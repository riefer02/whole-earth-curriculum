<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 400" role="img" aria-labelledby="title-L-04-002-09-playing-fair-all-together desc-L-04-002-09-playing-fair-all-together">
  <title id="title-L-04-002-09-playing-fair-all-together">Playing fair, all together</title>
  <desc id="desc-L-04-002-09-playing-fair-all-together">Two panels showing fair play. In the left panel two children stand together; the first raises an open hand to cheer the second, and a leader line joins that raised hand to the word "encourage" above them. In the right panel one child passes a ball to another, saying "your turn", and a leader line joins the ball to the words "take turns" below. Each child is drawn as one soft silhouette in a different skin tone and dress. The closing line reads: fair play means everyone can play.</desc>

  <rect width="512" height="400" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Playing Fair, All Together</text>

  <!-- Panel 1: encourage -->
  <rect x="16" y="80" width="230" height="216" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>

  <!-- leaders first, so each runs under the artwork -->
  <line x1="131" y1="126" x2="149" y2="158" stroke="#4f6d7a" stroke-width="1.4"/>

  <!-- child cheering -->
  <g>
    <circle cx="104" cy="170" r="25" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 79 165 Q 81 143 104 143 Q 127 143 129 165 Q 117 156 104 157 Q 91 156 79 165 Z" fill="#2b3a42"/>
    <circle cx="96" cy="170" r="2.3" fill="#2b3a42"/>
    <circle cx="112" cy="170" r="2.3" fill="#2b3a42"/>
    <path d="M 96 181 Q 104 187 112 181" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M 68 258 Q 68 197 104 197 Q 140 197 140 258 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 126 214 Q 142 196 147 168" fill="none" stroke="#c99567" stroke-width="11" stroke-linecap="round"/>
    <circle cx="148" cy="163" r="7" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- teammate being cheered -->
  <g>
    <circle cx="190" cy="184" r="20" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 170 180 Q 171 164 190 164 Q 209 164 210 180 Q 200 173 190 174 Q 180 173 170 180 Z" fill="#8f5f3d"/>
    <circle cx="184" cy="184" r="2" fill="#2b3a42"/>
    <circle cx="196" cy="184" r="2" fill="#2b3a42"/>
    <path d="M 184 192 Q 190 197 196 192" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 163 258 Q 163 206 190 206 Q 217 206 217 258 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <text x="131" y="116" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">encourage</text>

  <!-- Panel 2: take turns -->
  <rect x="266" y="80" width="230" height="216" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>

  <line x1="390" y1="266" x2="402" y2="226" stroke="#4f6d7a" stroke-width="1.4"/>

  <!-- child passing the ball -->
  <g>
    <circle cx="320" cy="180" r="25" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 295 175 Q 297 153 320 153 Q 343 153 345 175 Q 333 166 320 167 Q 307 166 295 175 Z" fill="#4f6d7a"/>
    <circle cx="312" cy="180" r="2.3" fill="#2b3a42"/>
    <circle cx="328" cy="180" r="2.3" fill="#2b3a42"/>
    <path d="M 312 191 Q 320 197 328 191" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M 284 258 Q 284 207 320 207 Q 356 207 356 258 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 344 222 Q 366 216 394 212" fill="none" stroke="#e6bb92" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- child receiving the ball -->
  <g>
    <circle cx="458" cy="190" r="20" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 438 186 Q 439 170 458 170 Q 477 170 478 186 Q 468 179 458 180 Q 448 179 438 186 Z" fill="#2b3a42"/>
    <circle cx="452" cy="190" r="2" fill="#2b3a42"/>
    <circle cx="464" cy="190" r="2" fill="#2b3a42"/>
    <path d="M 452 198 Q 458 203 464 198" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 431 258 Q 431 212 458 212 Q 485 212 485 258 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 436 226 Q 424 220 416 216" fill="none" stroke="#8f5f3d" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- the ball, held out between two hands -->
  <circle cx="404" cy="210" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M 390 210 q 14 -8 28 0" fill="none" stroke="#2b3a42" stroke-width="1.6"/>

  <!-- speech bubble -->
  <rect x="350" y="146" width="88" height="38" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M 362 184 L 344 200 L 378 184 Z" fill="#ffffff"/>
  <text x="394" y="171" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">your turn</text>

  <text x="381" y="278" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">take turns</text>

  <text x="256" y="352" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222222">fair play means everyone can play</text>
</svg>
