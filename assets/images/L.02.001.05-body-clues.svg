<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My body gives me clues</title>
  <desc id="desc">A matching chart titled "My body gives me clues" with three rows. Each row shows a body signal on the left — a small figure with tense raised shoulders, a figure with a hand on a fast-beating heart, and a figure with a heavy, drooping chest — and a dashed arrow pointing to a blank rounded box on the right where the learner writes or says the feeling name. At the bottom, a three-step path shows Notice (an eye), Name (a speech bubble), and Check (a check mark), connected by arrows. The signal drawings and words, not color, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">My Body Gives Me Clues</text>

  <!-- Row 1: tense shoulders -->
  <g>
    <circle cx="80" cy="100" r="22" fill="#d6d1c7" stroke="#2b3a42" stroke-width="2"/>
    <rect x="58" y="122" width="44" height="46" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <line x1="66" y1="132" x2="70" y2="140" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="94" y1="132" x2="90" y2="140" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <text x="80" y="196" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">tense shoulders</text>
  </g>
  <line x1="168" y1="128" x2="212" y2="128" stroke="#2b3a42" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M210 122 L222 128 L210 134 Z" fill="#2b3a42"/>
  <rect x="226" y="104" width="150" height="48" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="301" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">What feeling? ___</text>

  <!-- Row 2: fast heart -->
  <g>
    <circle cx="80" cy="244" r="22" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <rect x="58" y="266" width="44" height="46" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="80" cy="288" r="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="66" y1="276" x2="70" y2="284" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="94" y1="276" x2="90" y2="284" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <text x="80" y="340" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">fast heartbeat</text>
  </g>
  <line x1="168" y1="272" x2="212" y2="272" stroke="#2b3a42" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M210 266 L222 272 L210 278 Z" fill="#2b3a42"/>
  <rect x="226" y="248" width="150" height="48" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="301" y="276" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">What feeling? ___</text>

  <!-- Row 3: heavy chest -->
  <g>
    <circle cx="80" cy="388" r="22" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <rect x="58" y="410" width="44" height="46" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M66 420 Q80 412 94 420" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <text x="80" y="484" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">heavy chest</text>
  </g>
  <line x1="168" y1="416" x2="212" y2="416" stroke="#2b3a42" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M210 410 L222 416 L210 422 Z" fill="#2b3a42"/>
  <rect x="226" y="392" width="150" height="48" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="301" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">What feeling? ___</text>

  <!-- three steps -->
  <rect x="392" y="104" width="104" height="44" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="444" y="131" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Notice</text>
  <rect x="392" y="248" width="104" height="44" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="444" y="275" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Name</text>
  <rect x="392" y="392" width="104" height="44" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="444" y="419" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Check</text>
</svg>
