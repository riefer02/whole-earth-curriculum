<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Human rights: shared core, many traditions, honest critique</title>
  <desc id="desc">A diagram with a center labeled human dignity, surrounded by nodes labeled individual rights, collective and people's rights, duties and community, and critique — showing that rights are a shared idea that many traditions express differently and some critique.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Human Rights: Shared, Contested</text>

  <!-- center -->
  <ellipse cx="256" cy="258" rx="96" ry="52" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="250" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Human dignity</text>
  <text x="256" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">every person worth</text>
  <text x="256" y="286" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">protecting</text>

  <!-- node 1: individual -->
  <rect x="26" y="88" width="150" height="92" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="50" cy="112" r="8" fill="#7a9e7e"/>
  <text x="66" y="116" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">Individual rights</text>
  <text x="40" y="140" font-family="sans-serif" font-size="11" fill="#4f6d7a">speech, vote,</text>
  <text x="40" y="156" font-family="sans-serif" font-size="11" fill="#4f6d7a">fair trial, belief</text>

  <!-- node 2: collective -->
  <rect x="336" y="88" width="150" height="92" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="360" cy="112" r="8" fill="#e0a458"/>
  <text x="376" y="116" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">Peoples' rights</text>
  <text x="350" y="140" font-family="sans-serif" font-size="11" fill="#4f6d7a">land, language,</text>
  <text x="350" y="156" font-family="sans-serif" font-size="11" fill="#4f6d7a">development, culture</text>

  <!-- node 3: duties -->
  <rect x="26" y="336" width="150" height="92" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="50" cy="360" r="8" fill="#6b93b6"/>
  <text x="66" y="364" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">Duties &amp; community</text>
  <text x="40" y="388" font-family="sans-serif" font-size="11" fill="#4f6d7a">rights with</text>
  <text x="40" y="404" font-family="sans-serif" font-size="11" fill="#4f6d7a">responsibilities</text>

  <!-- node 4: critique -->
  <rect x="336" y="336" width="150" height="92" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="360" cy="360" r="8" fill="#4f6d7a"/>
  <text x="376" y="364" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">Critique</text>
  <text x="350" y="388" font-family="sans-serif" font-size="11" fill="#4f6d7a">does it favor some</text>
  <text x="350" y="404" font-family="sans-serif" font-size="11" fill="#4f6d7a">traditions more?</text>

  <!-- connectors -->
  <path d="M170 140 L212 216" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M342 140 L300 216" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M170 372 L212 302" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M342 372 L300 302" fill="none" stroke="#4f6d7a" stroke-width="2"/>

  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">A shared idea — expressed, extended, and questioned across many traditions.</text>
</svg>
