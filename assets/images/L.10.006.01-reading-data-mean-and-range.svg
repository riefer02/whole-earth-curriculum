<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Mean and Range of Rainfall</title>
  <desc id="desc">A dot plot of seven daily rainfall measurements in millimetres, with the mean marked by a horizontal dashed line and the range marked by a bracket from the smallest to the largest value.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Mean and Range</text>
  <text x="256" y="56" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Daily rainfall (mm) over 7 days</text>

  <!-- Axes -->
  <line x1="60" y1="80" x2="60" y2="420" stroke="#2b3a42" stroke-width="2"/>
  <line x1="60" y1="420" x2="480" y2="420" stroke="#2b3a42" stroke-width="2"/>
  <text x="24" y="424" font-family="sans-serif" font-size="13" fill="#222222">0</text>
  <text x="16" y="344" font-family="sans-serif" font-size="13" fill="#222222">10</text>
  <text x="16" y="264" font-family="sans-serif" font-size="13" fill="#222222">20</text>
  <text x="16" y="184" font-family="sans-serif" font-size="13" fill="#222222">30</text>
  <text x="16" y="104" font-family="sans-serif" font-size="13" fill="#222222">40</text>

  <!-- Dot plot: values 3, 5, 4, 40, 6, 5, 4 -->
  <!-- scale: 8 mm per unit; y = 420 - value*8 -->
  <circle cx="110" cy="396" r="6" fill="#6b93b6"/>
  <circle cx="160" cy="380" r="6" fill="#6b93b6"/>
  <circle cx="210" cy="388" r="6" fill="#6b93b6"/>
  <circle cx="260" cy="100" r="6" fill="#e0a458"/>
  <circle cx="310" cy="372" r="6" fill="#6b93b6"/>
  <circle cx="360" cy="380" r="6" fill="#6b93b6"/>
  <circle cx="410" cy="388" r="6" fill="#6b93b6"/>
  <text x="260" y="84" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">40</text>

  <!-- Mean line at ~9.6 => y = 420 - 9.6*8 = 343 -->
  <line x1="60" y1="343" x2="470" y2="343" stroke="#2b3a42" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="476" y="347" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">mean &#8776; 9.6</text>

  <!-- Range bracket from 3 to 40 -->
  <line x1="52" y1="100" x2="52" y2="396" stroke="#7a9e7e" stroke-width="3"/>
  <line x1="44" y1="100" x2="60" y2="100" stroke="#7a9e7e" stroke-width="3"/>
  <line x1="44" y1="396" x2="60" y2="396" stroke="#7a9e7e" stroke-width="3"/>
  <text x="36" y="250" font-family="sans-serif" font-size="14" fill="#4f6d7a" transform="rotate(-90 36 250)" text-anchor="middle">range = 37</text>

  <text x="256" y="460" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">Mean = sum &#247; count.  Range = largest &#8722; smallest.</text>
  <text x="256" y="482" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">One outlier (40) pulls the mean above most of the days.</text>
</svg>
