<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Kind and helpful: a child helps carry a heavy basket</title>
  <desc id="desc">A neighbor on the left and a child on the right lift one basket of fruit together. The neighbor says "Thank you — that's kind!" and the child asks "Can I help?" The two people have different skin tones and shirt colors. The words and the act of two people carrying one basket together carry the meaning, so the picture prints clearly in grayscale and shows that helping carry is one kind and helpful thing you can do.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Title -->
  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Kind and Helpful Things</text>

  <!-- Ground -->
  <line x1="48" y1="402" x2="464" y2="402" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>

  <!-- ===== Neighbor (left) ===== -->
  <g>
    <circle cx="140" cy="196" r="22" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M118 192 A22 22 0 0 1 162 192 L162 186 A22 22 0 0 0 118 186 Z" fill="#4f6d7a"/>
    <circle cx="132" cy="198" r="2.2" fill="#2b3a42"/>
    <circle cx="148" cy="198" r="2.2" fill="#2b3a42"/>
    <path d="M132 208 Q140 214 148 208" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="120" y="222" width="40" height="74" rx="14" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="128" y1="296" x2="126" y2="400" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <line x1="152" y1="296" x2="154" y2="400" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <!-- arm to basket -->
    <line x1="160" y1="244" x2="212" y2="272" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- ===== Basket with fruit ===== -->
  <g>
    <path d="M196 268 L314 268 L298 336 L212 336 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M206 268 Q256 222 306 268" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="228" cy="258" r="13" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="256" cy="250" r="13" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="282" cy="258" r="13" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="228" y1="246" x2="228" y2="242" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="282" y1="246" x2="282" y2="242" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ===== Child (right) ===== -->
  <g>
    <circle cx="372" cy="206" r="22" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M350 204 A22 22 0 0 1 394 204 L394 198 A22 22 0 0 0 350 198 Z" fill="#2b3a42"/>
    <circle cx="364" cy="208" r="2.2" fill="#2b3a42"/>
    <circle cx="380" cy="208" r="2.2" fill="#2b3a42"/>
    <path d="M364 218 Q372 224 380 218" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="352" y="232" width="40" height="70" rx="14" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="360" y1="302" x2="358" y2="400" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <line x1="384" y1="302" x2="386" y2="400" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <!-- arm to basket -->
    <line x1="352" y1="252" x2="300" y2="276" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- ===== Speech bubbles ===== -->
  <g>
    <rect x="24" y="96" width="196" height="46" rx="15" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M132 142 L140 156 L124 142 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="122" y="125" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Thank you — that&#39;s kind!</text>
  </g>
  <g>
    <rect x="300" y="112" width="156" height="46" rx="15" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M360 158 L368 172 L352 158 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="378" y="141" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Can I help?</text>
  </g>

  <!-- Bottom note -->
  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Kindness is something you can do — every day.</text>
</svg>
