<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Welcoming newcomers</title>
  <desc id="desc">A circle of children opens a space for one new child stepping in. A banner above reads "Welcome". Four small labels circle the scene — "greet by name", "show around", "invite to play", "learn their words" — with the words "everyone belongs" beneath. The words and shapes carry the meaning, not color, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Welcoming Newcomers</text>

  <!-- Welcome banner -->
  <rect x="176" y="66" width="160" height="36" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="90" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">Welcome</text>

  <!-- New child entering center -->
  <circle cx="256" cy="220" r="28" fill="#6b4f3a" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="248" cy="216" r="2.5" fill="#2b3a42"/><circle cx="264" cy="216" r="2.5" fill="#2b3a42"/>
  <path d="M248 226 Q256 232 264 226" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M256 248 L256 280" stroke="#2b3a42" stroke-width="2"/>

  <!-- Circle of children around, leaving a gap -->
  <g>
    <circle cx="150" cy="180" r="24" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="143" cy="176" r="2.5" fill="#2b3a42"/><circle cx="157" cy="176" r="2.5" fill="#2b3a42"/>
    <path d="M143 186 Q150 192 157 186" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="362" cy="180" r="24" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="355" cy="176" r="2.5" fill="#2b3a42"/><circle cx="369" cy="176" r="2.5" fill="#2b3a42"/>
    <path d="M355 186 Q362 192 369 186" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="150" cy="280" r="24" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="143" cy="276" r="2.5" fill="#2b3a42"/><circle cx="157" cy="276" r="2.5" fill="#2b3a42"/>
    <path d="M143 286 Q150 292 157 286" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="362" cy="280" r="24" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="355" cy="276" r="2.5" fill="#2b3a42"/><circle cx="369" cy="276" r="2.5" fill="#2b3a42"/>
    <path d="M355 286 Q362 292 369 286" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Open gap at bottom of circle (invitation) -->
  <text x="256" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">an open space</text>

  <!-- Four welcome-way labels -->
  <rect x="36" y="360" width="100" height="44" rx="8" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="86" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">greet</text>
  <text x="86" y="393" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">by name</text>

  <rect x="146" y="360" width="100" height="44" rx="8" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="196" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">show</text>
  <text x="196" y="393" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">around</text>

  <rect x="256" y="360" width="100" height="44" rx="8" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="306" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">invite</text>
  <text x="306" y="393" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">to play</text>

  <rect x="366" y="360" width="100" height="44" rx="8" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="416" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">learn their</text>
  <text x="416" y="393" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">words</text>

  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">Everyone belongs.</text>
  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Belonging is the ground to learn, to help, and to be yourself.</text>
</svg>
