<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Tone and figurative language</title>
  <desc id="desc">A seed growing into a plant with the line "hope is a seed". Four labeled boxes show metaphor, simile, personification, and hyperbole, each with a one-line example. A tone word bank at the bottom lists hopeful, bitter, playful, solemn.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">Figurative language &amp; tone</text>

  <!-- seed and plant -->
  <ellipse cx="256" cy="330" rx="120" ry="18" fill="#7a9e7e" opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
  <path d="M256,330 L256,270" stroke="#2b3a42" stroke-width="2.5"/>
  <ellipse cx="256" cy="288" rx="18" ry="10" fill="#7a9e7e" opacity="0.6" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="256" cy="258" rx="20" ry="11" fill="#7a9e7e" opacity="0.6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M240,288 C220,278 220,262 236,252" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M272,288 C292,278 292,262 276,252" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="382" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">"hope is a seed"</text>

  <!-- four boxes -->
  <rect x="26" y="76" width="110" height="80" rx="10" fill="#6b93b6" opacity="0.45" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="81" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">metaphor</text>
  <text x="81" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">hope IS</text>
  <text x="81" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">a seed</text>

  <rect x="148" y="76" width="110" height="80" rx="10" fill="#e0a458" opacity="0.6" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="203" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">simile</text>
  <text x="203" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">hope is LIKE</text>
  <text x="203" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">a seed</text>

  <rect x="270" y="76" width="110" height="80" rx="10" fill="#7a9e7e" opacity="0.5" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="325" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">personification</text>
  <text x="325" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">the wind</text>
  <text x="325" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">whispered</text>

  <rect x="392" y="76" width="100" height="80" rx="10" fill="#6b93b6" opacity="0.45" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="442" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">hyperbole</text>
  <text x="442" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">a thousand</text>
  <text x="442" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">times</text>

  <!-- tone word bank -->
  <rect x="66" y="414" width="380" height="56" rx="10" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="436" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">tone word bank</text>
  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">hopeful · bitter · playful · solemn</text>
</svg>
