<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Strengthening belonging</title>
  <desc id="desc">A circle of figures with a gap that opens to welcome one more figure in, with an arrow labeled "invitation" pointing to the gap and the word "belonging" beneath, drawn simply for grayscale printing.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Strengthening belonging</text>

  <!-- circle of figures, with a gap -->
  <g>
    <circle cx="220" cy="200" r="16" fill="#d9a066" stroke="#2b3a42" stroke-width="2.5"/>
    <line x1="220" y1="216" x2="220" y2="244" stroke="#2b3a42" stroke-width="2.5"/>
  </g>
  <g>
    <circle cx="292" cy="200" r="16" fill="#c98a5e" stroke="#2b3a42" stroke-width="2.5"/>
    <line x1="292" y1="216" x2="292" y2="244" stroke="#2b3a42" stroke-width="2.5"/>
  </g>
  <g>
    <circle cx="188" cy="280" r="16" fill="#8a5a3a" stroke="#2b3a42" stroke-width="2.5"/>
    <line x1="188" y1="296" x2="188" y2="324" stroke="#2b3a42" stroke-width="2.5"/>
  </g>
  <g>
    <circle cx="324" cy="280" r="16" fill="#d9a066" stroke="#2b3a42" stroke-width="2.5"/>
    <line x1="324" y1="296" x2="324" y2="324" stroke="#2b3a42" stroke-width="2.5"/>
  </g>
  <g>
    <circle cx="256" cy="324" r="16" fill="#c98a5e" stroke="#2b3a42" stroke-width="2.5"/>
    <line x1="256" y1="340" x2="256" y2="368" stroke="#2b3a42" stroke-width="2.5"/>
  </g>

  <!-- connecting arms -->
  <line x1="234" y1="206" x2="278" y2="206" stroke="#2b3a42" stroke-width="2"/>
  <line x1="204" y1="284" x2="240" y2="320" stroke="#2b3a42" stroke-width="2"/>
  <line x1="308" y1="284" x2="272" y2="320" stroke="#2b3a42" stroke-width="2"/>

  <!-- gap opens on the top, new figure entering -->
  <circle cx="256" cy="126" r="18" fill="#a06a3f" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="256" y1="144" x2="256" y2="172" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="256" y1="156" x2="242" y2="184" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="256" y1="156" x2="270" y2="184" stroke="#2b3a42" stroke-width="2.5"/>

  <!-- invitation arrow -->
  <line x1="256" y1="90" x2="256" y2="106" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arr5)"/>
  <text x="256" y="76" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7a9e7e">invitation</text>

  <defs>
    <marker id="arr5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b3a42"/>
    </marker>
  </defs>

  <text x="256" y="424" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">Belonging is built, every day, by small real moves.</text>
  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Name the person. Name the barrier. Do one concrete thing.</text>
  <text x="256" y="472" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">And always respect their freedom to say no.</text>
</svg>
