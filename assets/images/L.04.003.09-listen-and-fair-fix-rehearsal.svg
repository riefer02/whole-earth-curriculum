<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Listen and fair fix, rehearsal</title>
  <desc id="desc">A two-step path with check marks. Step one reads "listen — say it back, check" and step two reads "fair fix — name it, needs, options, choose, check", joined by an arrow, with the words "both skills, one disagreement" beneath. The words and shapes carry the meaning, not color, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Listen and Fair Fix, Rehearsal</text>

  <!-- Step one -->
  <rect x="40" y="120" width="200" height="120" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="140" y="152" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">1 · listen</text>
  <text x="140" y="178" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">say it back</text>
  <text x="140" y="198" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">then check</text>
  <!-- check mark -->
  <path d="M84 216 l10 10 l22 -22" fill="none" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow -->
  <path d="M248 180 L272 180" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <path d="M272 180 l-10 -4 l0 8 z" fill="#2b3a42"/>

  <!-- Step two -->
  <rect x="272" y="120" width="200" height="120" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="372" y="148" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">2 · fair fix</text>
  <text x="372" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">name it · needs</text>
  <text x="372" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">options · choose</text>
  <text x="372" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">check</text>
  <path d="M316 224 l10 10 l22 -22" fill="none" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Two figures shaking hands below -->
  <g>
    <circle cx="206" cy="310" r="24" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="199" cy="306" r="2.5" fill="#2b3a42"/><circle cx="213" cy="306" r="2.5" fill="#2b3a42"/>
    <path d="M199 316 Q206 322 213 316" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M206 334 L206 356" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <g>
    <circle cx="306" cy="310" r="24" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="299" cy="306" r="2.5" fill="#2b3a42"/><circle cx="313" cy="306" r="2.5" fill="#2b3a42"/>
    <path d="M299 316 Q306 322 313 316" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M306 334 L306 356" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <!-- Joined hands -->
  <path d="M230 346 Q256 336 282 346" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>

  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">Both skills, one disagreement.</text>
  <text x="256" y="458" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Listen first, then find the fair fix.</text>
</svg>
