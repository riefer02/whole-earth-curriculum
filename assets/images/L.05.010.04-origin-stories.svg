<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 470" role="img" aria-labelledby="title desc">
  <title id="title">Origin stories reflect their people</title>
  <desc id="desc">Three panels titled "Origin stories reflect their people." The left panel, labeled "Maori — Aotearoa New Zealand," shows sky and earth being pushed apart as light enters between them, with the note "a sea-and-sky people tell of light and separation." The middle panel, labeled "Haudenosaunee — Turtle Island," shows a turtle whose back carries growing plants and a small figure, with the note "a planting people tell of the land carried on Turtle's back." The right panel, labeled "Yoruba — West Africa," shows land rising from water under a sun, with the note "a coast-and-water people tell of land made from the waters." A caption reads "Told with respect, kept alive by the peoples who tell them." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="470" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Origin Stories Reflect Their People</text>

  <!-- Panel 1: Maori -->
  <rect x="24" y="66" width="144" height="346" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="96" y="92" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">Māori</text>
  <text x="96" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Aotearoa NZ</text>
  <!-- sky and earth separating -->
  <rect x="34" y="130" width="124" height="40" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <rect x="34" y="250" width="124" height="40" rx="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <!-- light beams between -->
  <g stroke="#e0a458" stroke-width="2" stroke-linecap="round">
    <path d="M70 176 L62 242"/>
    <path d="M96 176 L96 242"/>
    <path d="M122 176 L130 242"/>
  </g>
  <text x="96" y="316" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">a sea-and-sky people</text>
  <text x="96" y="334" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">tell of light and</text>
  <text x="96" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">separation</text>

  <!-- Panel 2: Haudenosaunee -->
  <rect x="184" y="66" width="144" height="346" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="92" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">Haudenosaunee</text>
  <text x="256" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Turtle Island</text>
  <!-- turtle -->
  <ellipse cx="256" cy="252" rx="58" ry="34" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <path d="M206 252 L196 240" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M306 252 L316 240" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <circle cx="238" cy="222" r="5" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="256" cy="220" r="5" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="274" cy="222" r="5" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <!-- plants on the back -->
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M232 210 L232 186"/>
    <path d="M256 210 L256 180"/>
    <path d="M280 210 L280 188"/>
  </g>
  <path d="M224 196 Q232 184 240 196" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M248 186 Q256 174 264 186" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="256" y="316" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">a planting people tell</text>
  <text x="256" y="334" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">of the land carried</text>
  <text x="256" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">on Turtle's back</text>

  <!-- Panel 3: Yoruba -->
  <rect x="344" y="66" width="144" height="346" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="416" y="92" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">Yoruba</text>
  <text x="416" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">West Africa</text>
  <!-- water and rising land -->
  <g stroke="#6b93b6" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M354 250 Q372 240 390 250 Q408 260 426 250"/>
    <path d="M354 268 Q372 258 390 268 Q408 278 426 268"/>
  </g>
  <path d="M368 226 Q386 196 404 226 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="432" cy="140" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="416" y="316" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">a coast-and-water</text>
  <text x="416" y="334" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">people tell of land</text>
  <text x="416" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">made from the waters</text>

  <text x="256" y="442" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">Told with respect, kept alive by the peoples who tell them.</text>
</svg>
