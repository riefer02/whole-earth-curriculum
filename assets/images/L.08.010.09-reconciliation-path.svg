<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A path from conflict to reconciliation</title>
  <desc id="desc">A winding path from a box labeled conflict to a box labeled peace, with five milestones along the way: stop the harm, tell the truth, listen, take responsibility, and repair and rebuild trust.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">From Conflict to Reconciliation</text>

  <!-- start -->
  <rect x="30" y="238" width="110" height="70" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="85" y="268" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">conflict</text>
  <text x="85" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">harm and hurt</text>

  <!-- winding path -->
  <path d="M140 273 C 180 150, 210 150, 240 240 C 270 330, 310 330, 340 250 C 360 200, 390 200, 410 250" fill="none" stroke="#4f6d7a" stroke-width="3"/>

  <!-- milestone 1 -->
  <circle cx="178" cy="190" r="20" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="178" y="195" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">1</text>
  <text x="150" y="150" font-family="sans-serif" font-size="11" fill="#4f6d7a">stop the harm</text>

  <!-- milestone 2 -->
  <circle cx="242" cy="196" r="20" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="242" y="201" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">2</text>
  <text x="262" y="180" font-family="sans-serif" font-size="11" fill="#4f6d7a">tell the truth</text>

  <!-- milestone 3 -->
  <circle cx="278" cy="296" r="20" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="278" y="301" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">3</text>
  <text x="298" y="330" font-family="sans-serif" font-size="11" fill="#4f6d7a">listen</text>

  <!-- milestone 4 -->
  <circle cx="350" cy="256" r="20" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="350" y="261" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">4</text>
  <text x="360" y="216" font-family="sans-serif" font-size="11" fill="#4f6d7a">take responsibility</text>

  <!-- milestone 5 -->
  <circle cx="404" cy="210" r="20" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="404" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">5</text>
  <text x="420" y="180" font-family="sans-serif" font-size="11" fill="#4f6d7a">repair, rebuild trust</text>

  <!-- end -->
  <rect x="372" y="238" width="110" height="70" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="427" y="268" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">peace</text>
  <text x="427" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">not forgetting —</text>
  <text x="427" y="302" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">but mending</text>

  <text x="256" y="380" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Reconciliation is slow, honest, and never forced.</text>
  <text x="256" y="406" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">It means facing the truth of what happened and repairing what broke,</text>
  <text x="256" y="424" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">so people can live together again.</text>
</svg>
