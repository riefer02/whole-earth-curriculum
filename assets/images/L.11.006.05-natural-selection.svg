<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Natural Selection</title>
  <desc id="desc">A three-panel diagram of natural selection. Panel one shows a population with varied traits: small, medium, and large forms. Panel two shows an environmental pressure in which only some survive, such as the larger forms reaching food. Panel three shows the next generation shifted toward the surviving forms. Arrows connect the panels with labels for variation, inheritance, and selection.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Natural Selection in Three Steps</text>

  <!-- Panel 1: variation -->
  <rect x="24" y="60" width="144" height="150" fill="#7a9e7e" fill-opacity="0.12" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="96" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">1 · Variation</text>
  <circle cx="60" cy="150" r="22" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="96" cy="150" r="30" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="140" cy="150" r="38" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="96" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">small, medium, large</text>

  <!-- Arrow 1 -->
  <line x1="172" y1="135" x2="198" y2="135" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="198,135 188,130 188,140" fill="#2b3a42"/>
  <text x="185" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">environment</text>
  <text x="185" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">presses</text>

  <!-- Panel 2: selection -->
  <rect x="204" y="60" width="144" height="150" fill="#e0a458" fill-opacity="0.12" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="276" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">2 · Selection</text>
  <circle cx="240" cy="150" r="22" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="276" cy="150" r="30" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="320" cy="150" r="38" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="276" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">only some survive</text>

  <!-- Arrow 2 -->
  <line x1="352" y1="135" x2="378" y2="135" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="378,135 368,130 368,140" fill="#2b3a42"/>
  <text x="365" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">survivors</text>
  <text x="365" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">reproduce</text>

  <!-- Panel 3: shift -->
  <rect x="384" y="60" width="104" height="150" fill="#6b93b6" fill-opacity="0.12" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="436" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">3 · Shift</text>
  <circle cx="408" cy="150" r="32" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="452" cy="150" r="38" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="436" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">next generation</text>
  <text x="436" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">shifted larger</text>

  <!-- Footer -->
  <rect x="90" y="280" width="332" height="88" fill="#ffffff" stroke="#e0a458" stroke-width="2" rx="6"/>
  <text x="256" y="308" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">Populations vary. Some variation is inherited.</text>
  <text x="256" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">The environment favors some variants.</text>
  <text x="256" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">So the population shifts — nothing chose it.</text>
</svg>
