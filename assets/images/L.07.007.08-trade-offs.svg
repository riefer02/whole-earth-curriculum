<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Every design choice is a trade-off</title>
  <desc id="desc">A comparison table titled "Every design choice is a trade-off," comparing three water bottles — glass, plastic, and metal — across four columns: cost, materials, function, and environmental impact. Glass: higher cost, sand (heavy), reusable with a clean taste, recyclable but heavy to ship. Plastic: very low cost, oil-based, light and cheap, often single-use and polluting. Metal: highest cost up front, mined metal, durable with a long life, recyclable and lasts for years. Words and symbols, not color, carry the meaning so it prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Every design choice is a trade-off</text>
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">A water bottle: glass, plastic, or metal?</text>

  <!-- Header row -->
  <rect x="26" y="86" width="100" height="36" fill="#e8e4dc" stroke="#2b3a42" stroke-width="2"/>
  <text x="76" y="109" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Bottle</text>
  <rect x="126" y="86" width="92" height="36" fill="#e8e4dc" stroke="#2b3a42" stroke-width="2"/>
  <text x="172" y="109" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Cost</text>
  <rect x="218" y="86" width="96" height="36" fill="#e8e4dc" stroke="#2b3a42" stroke-width="2"/>
  <text x="266" y="109" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Materials</text>
  <rect x="314" y="86" width="92" height="36" fill="#e8e4dc" stroke="#2b3a42" stroke-width="2"/>
  <text x="360" y="109" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Function</text>
  <rect x="406" y="86" width="80" height="36" fill="#e8e4dc" stroke="#2b3a42" stroke-width="2"/>
  <text x="446" y="102" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">Impact</text>
  <text x="446" y="117" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">(Earth)</text>

  <!-- Row: glass -->
  <rect x="26" y="122" width="100" height="78" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="76" y="166" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Glass</text>
  <rect x="126" y="122" width="92" height="78" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="172" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">higher</text>
  <text x="172" y="168" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">up front</text>
  <rect x="218" y="122" width="96" height="78" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="266" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">sand —</text>
  <text x="266" y="168" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">heavy</text>
  <rect x="314" y="122" width="92" height="78" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="360" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">reusable,</text>
  <text x="360" y="168" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">clean taste</text>
  <rect x="406" y="122" width="80" height="78" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="446" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">recyclable,</text>
  <text x="446" y="168" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">heavy to ship</text>

  <!-- Row: plastic -->
  <rect x="26" y="200" width="100" height="78" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="76" y="244" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Plastic</text>
  <rect x="126" y="200" width="92" height="78" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="172" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">very low</text>
  <text x="172" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">cost</text>
  <rect x="218" y="200" width="96" height="78" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="266" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">oil-based</text>
  <text x="266" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">(a fossil fuel)</text>
  <rect x="314" y="200" width="92" height="78" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="360" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">light,</text>
  <text x="360" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">cheap, easy</text>
  <rect x="406" y="200" width="80" height="78" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="446" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">often</text>
  <text x="446" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">single-use,</text>
  <text x="446" y="264" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">pollutes</text>

  <!-- Row: metal -->
  <rect x="26" y="278" width="100" height="78" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="76" y="322" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Metal</text>
  <rect x="126" y="278" width="92" height="78" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="172" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">highest</text>
  <text x="172" y="324" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">up front</text>
  <rect x="218" y="278" width="96" height="78" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="266" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">mined</text>
  <text x="266" y="324" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">metal</text>
  <rect x="314" y="278" width="92" height="78" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="360" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">durable,</text>
  <text x="360" y="324" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">long life</text>
  <rect x="406" y="278" width="80" height="78" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="446" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">recyclable,</text>
  <text x="446" y="324" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">lasts years</text>

  <text x="256" y="386" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">No choice wins every column.</text>
  <text x="256" y="410" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">A good designer names the trade-offs and chooses on purpose.</text>

  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">Ask of any design: what does it cost? what is it made of?</text>
  <text x="256" y="472" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">how well does it work? and what does it leave behind?</text>
</svg>
