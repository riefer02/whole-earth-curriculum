<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Writing my own story</title>
  <desc id="desc">A home-made book lies open with three page cards in a row, one for each part of a story. The first page shows a rising sun and is labeled "beginning"; the second shows a mountain and is labeled "middle"; the third shows a moon and stars and is labeled "end". Each page also has a few wavy scribble marks, showing that pictures and marks together tell a story. Below, a child holds the closed book and smiles, with the words "I made this book!" The labels and the order of the pages carry the meaning, so the picture prints clearly in grayscale and teaches that an author writes a story with a beginning, a middle, and an end.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Writing My Own Story</text>

  <!-- Page 1: beginning -->
  <rect x="28" y="92" width="144" height="180" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M64 164 L92 140 L120 164" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M52 164 L132 164" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="74" cy="150" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M50 190 Q60 182 70 190 Q80 198 90 190 Q100 182 110 190" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M50 206 Q60 198 70 206 Q80 214 90 206 Q100 198 110 206" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="252" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">beginning</text>

  <!-- Page 2: middle -->
  <rect x="184" y="92" width="144" height="180" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M216 180 L230 150 L244 180 M230 150 L230 180 M216 180 L236 174 L244 180" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M206 180 L252 180" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <path d="M206 196 Q216 188 226 196 Q236 204 246 196" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M206 212 Q216 204 226 212 Q236 220 246 212" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round"/>
  <text x="256" y="252" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">middle</text>

  <!-- Page 3: end -->
  <rect x="340" y="92" width="144" height="180" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M400 150 A22 22 0 1 1 384 164 A26 26 0 0 0 400 150 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M372 136 L374 142 M388 130 L390 136 M404 136 L406 142" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M362 190 Q372 182 382 190 Q392 198 402 190" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M362 206 Q372 198 382 206 Q392 214 402 206" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round"/>
  <text x="412" y="252" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">end</text>

  <!-- Child holding the book -->
  <g>
    <circle cx="256" cy="322" r="20" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M236 320 A20 20 0 0 1 276 320 Z" fill="#2b3a42"/>
    <circle cx="249" cy="322" r="2" fill="#2b3a42"/>
    <circle cx="263" cy="322" r="2" fill="#2b3a42"/>
    <path d="M249 332 Q256 337 263 332" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="240" y="344" width="32" height="40" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="248" y1="384" x2="246" y2="416" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="264" y1="384" x2="266" y2="416" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="240" y1="352" x2="214" y2="346" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="272" y1="352" x2="298" y2="346" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <!-- closed book in arms -->
    <rect x="226" y="360" width="60" height="10" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="256" y="446" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">I made this book!</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">You are an author when you tell your own story.</text>
</svg>
