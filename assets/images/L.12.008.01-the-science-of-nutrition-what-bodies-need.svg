<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The Science of Nutrition: What Bodies Need</title>
  <desc id="desc">A wheel of six nutrient categories — water, carbohydrate, protein, fat, vitamins, minerals — arranged around a central body figure, with the label "every body needs these; amounts differ."</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">What Bodies Need: Six Categories</text>

  <!-- central body figure -->
  <circle cx="256" cy="250" r="30" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <path d="M 256 280 L 256 340" stroke="#2b3a42" stroke-width="3" fill="none"/>
  <path d="M 256 340 L 226 396 M 256 340 L 286 396" stroke="#2b3a42" stroke-width="3" fill="none"/>
  <path d="M 256 296 L 224 320 M 256 296 L 288 320" stroke="#2b3a42" stroke-width="3" fill="none"/>
  <text x="256" y="428" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">a body</text>

  <!-- six category nodes around the body -->
  <g font-family="sans-serif" font-size="16" fill="#4f6d7a" text-anchor="middle">
    <circle cx="256" cy="140" r="34" fill="#ffffff" stroke="#6b93b6" stroke-width="3"/>
    <text x="256" y="145">water</text>

    <circle cx="128" cy="210" r="34" fill="#ffffff" stroke="#7a9e7e" stroke-width="3"/>
    <text x="128" y="215">carbs</text>

    <circle cx="384" cy="210" r="34" fill="#ffffff" stroke="#7a9e7e" stroke-width="3"/>
    <text x="384" y="215">protein</text>

    <circle cx="112" cy="330" r="34" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
    <text x="112" y="335">fats</text>

    <circle cx="400" cy="330" r="34" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
    <text x="400" y="328">vitamins</text>
    <text x="400" y="344" font-size="13">minerals</text>
  </g>

  <!-- connecting lines -->
  <g stroke="#4f6d7a" stroke-width="2">
    <line x1="256" y1="174" x2="256" y2="220"/>
    <line x1="162" y1="212" x2="226" y2="236"/>
    <line x1="350" y1="212" x2="286" y2="236"/>
    <line x1="144" y1="318" x2="224" y2="282"/>
    <line x1="368" y1="318" x2="288" y2="282"/>
  </g>

  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">Every body needs these; amounts differ.</text>
  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Nutrients describe; they never grade a person.</text>
</svg>
