<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The Big Bang Model</title>
  <desc id="desc">A three-part diagram. Part one shows a dotted balloon being inflated, with arrows showing points moving apart, labeled expansion. Part two shows a wavy line of light shifting toward the red end, labeled redshift. Part three shows a faint microwave glow filling the sky, labeled cosmic microwave background. A caption reads three lines of evidence, held as a model.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">The Big Bang: A Model and Its Evidence</text>

  <!-- Panel 1: expansion -->
  <rect x="20" y="60" width="150" height="180" fill="#7a9e7e" fill-opacity="0.12" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="95" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">1 · Expansion</text>
  <ellipse cx="95" cy="160" rx="62" ry="46" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="80" cy="145" r="4" fill="#2b3a42"/>
  <circle cx="115" cy="150" r="4" fill="#2b3a42"/>
  <circle cx="95" cy="178" r="4" fill="#2b3a42"/>
  <line x1="80" y1="145" x2="64" y2="130" stroke="#e0a458" stroke-width="2"/>
  <line x1="115" y1="150" x2="136" y2="138" stroke="#e0a458" stroke-width="2"/>
  <line x1="95" y1="178" x2="98" y2="204" stroke="#e0a458" stroke-width="2"/>
  <text x="95" y="228" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">every point moves apart</text>

  <!-- Panel 2: redshift -->
  <rect x="181" y="60" width="150" height="180" fill="#e0a458" fill-opacity="0.12" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="256" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">2 · Redshift</text>
  <path d="M 200 150 q 15 -26 30 0 t 30 0 t 30 0 t 30 0" fill="none" stroke="#6b93b6" stroke-width="2.5"/>
  <path d="M 200 170 q 17 -30 34 0 t 34 0 t 34 0 t 34 0" fill="none" stroke="#e0a458" stroke-width="2.5"/>
  <text x="256" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">light stretched toward red</text>
  <text x="256" y="228" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">as galaxies recede</text>

  <!-- Panel 3: CMB -->
  <rect x="342" y="60" width="150" height="180" fill="#6b93b6" fill-opacity="0.12" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="417" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">3 · Microwave glow</text>
  <rect x="360" y="100" width="114" height="120" fill="#6b93b6" fill-opacity="0.2" stroke="#2b3a42" stroke-width="2"/>
  <g fill="#6b93b6" opacity="0.7">
    <circle cx="380" cy="120" r="2"/>
    <circle cx="430" cy="130" r="2"/>
    <circle cx="400" cy="160" r="2"/>
    <circle cx="450" cy="170" r="2"/>
    <circle cx="375" cy="190" r="2"/>
    <circle cx="420" cy="200" r="2"/>
    <circle cx="390" cy="145" r="2"/>
  </g>
  <text x="417" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">faint glow in every</text>
  <text x="417" y="228" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">direction — early heat</text>

  <!-- Footer -->
  <rect x="60" y="280" width="392" height="72" fill="#ffffff" stroke="#e0a458" stroke-width="2" rx="6"/>
  <text x="256" y="306" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">Three lines of evidence, held as a model —</text>
  <text x="256" y="328" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">the best account we have, always open to revision.</text>
</svg>
