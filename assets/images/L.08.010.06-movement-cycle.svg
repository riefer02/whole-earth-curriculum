<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">How a social movement works</title>
  <desc id="desc">A four-step cycle with arrows: name the goal, choose strategies, act together, and look at effects then reflect and evaluate, looping back to the goal.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">How a Social Movement Works</text>

  <!-- goal -->
  <rect x="34" y="84" width="150" height="86" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="58" cy="108" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="72" y="113" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">1. Name the goal</text>
  <text x="46" y="136" font-family="sans-serif" font-size="11" fill="#4f6d7a">What is unfair, and</text>
  <text x="46" y="152" font-family="sans-serif" font-size="11" fill="#4f6d7a">what would be fair?</text>

  <!-- strategies -->
  <rect x="328" y="84" width="150" height="86" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="352" cy="108" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="366" y="113" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">2. Choose strategies</text>
  <text x="340" y="136" font-family="sans-serif" font-size="11" fill="#4f6d7a">Organize, petition,</text>
  <text x="340" y="152" font-family="sans-serif" font-size="11" fill="#4f6d7a">protest, build allies</text>

  <!-- act -->
  <rect x="328" y="306" width="150" height="86" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="352" cy="330" r="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="366" y="335" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">3. Act together</text>
  <text x="340" y="358" font-family="sans-serif" font-size="11" fill="#4f6d7a">Ordinary people do</text>
  <text x="340" y="374" font-family="sans-serif" font-size="11" fill="#4f6d7a">it, together, over time</text>

  <!-- effects -->
  <rect x="34" y="306" width="150" height="86" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="58" cy="330" r="9" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="72" y="335" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">4. Look at effects</text>
  <text x="46" y="358" font-family="sans-serif" font-size="11" fill="#4f6d7a">What changed? Who</text>
  <text x="46" y="374" font-family="sans-serif" font-size="11" fill="#4f6d7a">benefited? Who was left out?</text>

  <!-- arrows -->
  <path d="M184 127 L328 127" fill="none" stroke="#4f6d7a" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M403 170 L403 306" fill="none" stroke="#4f6d7a" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M328 349 L184 349" fill="none" stroke="#4f6d7a" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M109 306 L109 170" fill="none" stroke="#4f6d7a" stroke-width="2" marker-end="url(#arr)"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4f6d7a"/>
    </marker>
  </defs>

  <text x="256" y="448" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Then reflect and evaluate — and, if needed, refine and try again.</text>
  <text x="256" y="474" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Movements are judged by what they do and what they change.</text>
</svg>
