<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Consequences: an act ripples out to help and harm different people</title>
  <desc id="desc">A flow diagram: one action in a box on the left, an arrow to the right, and a fan of three result boxes labeled helped, harmed, and affected far away, each with a small figure, to show that a single act has many consequences for different people.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">The Consequences Lens</text>

  <!-- action box -->
  <rect x="30" y="206" width="120" height="100" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="90" y="246" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">One act</text>
  <text x="90" y="268" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">a choice,</text>
  <text x="90" y="284" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">a rule, a product</text>

  <!-- arrow -->
  <path d="M150 256 L190 256" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M182 249 L190 256 L182 263" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <!-- ripple label -->
  <text x="170" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#4f6d7a">ripples</text>

  <!-- helped -->
  <rect x="206" y="86" width="150" height="96" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="236" cy="112" r="7" fill="#7a9e7e"/>
  <text x="250" y="116" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">Who is helped?</text>
  <circle cx="236" cy="146" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="252" y="150" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">gain, relief, safety</text>

  <!-- harmed -->
  <rect x="206" y="206" width="150" height="96" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="236" cy="232" r="7" fill="#e0a458"/>
  <text x="250" y="236" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">Who is harmed?</text>
  <circle cx="236" cy="266" r="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="252" y="270" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">loss, pain, risk</text>

  <!-- far away -->
  <rect x="206" y="326" width="150" height="96" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="236" cy="352" r="7" fill="#6b93b6"/>
  <text x="250" y="356" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">Who far away?</text>
  <circle cx="236" cy="386" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="252" y="390" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">future, elsewhere</text>

  <!-- arrow fan -->
  <path d="M206 230 L190 252" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M206 254 L190 256" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M206 330 L190 262" fill="none" stroke="#4f6d7a" stroke-width="2"/>

  <text x="390" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Then ask:</text>
  <text x="390" y="264" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#4f6d7a">overall, are the</text>
  <text x="390" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#4f6d7a">results better</text>
  <text x="390" y="296" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#4f6d7a">or worse?</text>
</svg>
