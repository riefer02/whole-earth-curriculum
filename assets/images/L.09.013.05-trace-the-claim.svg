<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Trace the claim to its source</title>
  <desc id="desc">A flowchart of four steps. Step one: a viral claim appears on a phone. Step two: trace it back to its original source. Step three: check the source against independent reporting from other outlets. Step four: decide, with evidence, whether the claim holds. An arrow flows from one step to the next.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">Trace a Viral Claim to Its Source</text>

  <defs>
    <marker id="tc1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 Z" fill="#2b3a42"/>
    </marker>
  </defs>

  <!-- step 1 -->
  <rect x="156" y="66" width="200" height="52" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="88" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#fdfbf7">1 · The viral claim</text>
  <text x="256" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fdfbf7">who posted it? where did it appear first?</text>
  <path d="M256 118 L256 142" stroke="#2b3a42" stroke-width="2.5" fill="none" marker-end="url(#tc1)"/>

  <!-- step 2 -->
  <rect x="156" y="144" width="200" height="52" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="166" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#fdfbf7">2 · Trace to the source</text>
  <text x="256" y="184" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fdfbf7">what is the original evidence or report?</text>
  <path d="M256 196 L256 220" stroke="#2b3a42" stroke-width="2.5" fill="none" marker-end="url(#tc1)"/>

  <!-- step 3 -->
  <rect x="156" y="222" width="200" height="52" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="244" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#2b3a42">3 · Check independent reporting</text>
  <text x="256" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2b3a42">do other, separate sources agree?</text>
  <path d="M256 274 L256 298" stroke="#2b3a42" stroke-width="2.5" fill="none" marker-end="url(#tc1)"/>

  <!-- step 4 -->
  <rect x="156" y="300" width="200" height="52" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="322" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#2b3a42">4 · Decide with evidence</text>
  <text x="256" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">does the claim hold? or is it out of context?</text>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">One source is a start; independent sources are the test</text>
</svg>
