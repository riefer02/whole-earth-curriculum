<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The many-voiced story</title>
  <desc id="desc">Four strands — time, culture, migration, remembrance — woven into a single braided line, with a caption reading "history is told from many voices, never one nation's triumph." Grayscale-printable.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222222" font-weight="bold">The many-voiced story</text>
  <!-- Four strand labels -->
  <g font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">
    <rect x="28" y="80" width="90" height="34" rx="8" fill="#6b93b6"/>
    <text x="73" y="102" text-anchor="middle" fill="#fdfbf7">TIME</text>
    <rect x="28" y="128" width="90" height="34" rx="8" fill="#7a9e7e"/>
    <text x="73" y="150" text-anchor="middle" fill="#fdfbf7">CULTURE</text>
    <rect x="28" y="176" width="90" height="34" rx="8" fill="#e0a458"/>
    <text x="73" y="198" text-anchor="middle" fill="#fdfbf7">MIGRATION</text>
    <rect x="28" y="224" width="90" height="34" rx="8" fill="#4f6d7a"/>
    <text x="73" y="246" text-anchor="middle" fill="#fdfbf7">REMEMBRANCE</text>
  </g>
  <!-- Braided strands -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M 126 96 C 220 96 180 180 280 180 C 360 180 340 250 460 250" stroke="#6b93b6"/>
    <path d="M 126 144 C 220 144 200 210 300 210 C 370 210 350 270 460 270" stroke="#7a9e7e"/>
    <path d="M 126 192 C 220 192 220 240 320 240 C 380 240 360 290 460 290" stroke="#e0a458"/>
    <path d="M 126 240 C 220 240 240 270 340 270 C 390 270 370 310 460 310" stroke="#4f6d7a"/>
  </g>
  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222" font-weight="bold">woven into one story</text>
  <text x="256" y="392" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">History is told from many voices —</text>
  <text x="256" y="414" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">never a single nation's triumph.</text>
  <text x="256" y="448" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">And now your own voice joins the long, unfinished story.</text>
</svg>
