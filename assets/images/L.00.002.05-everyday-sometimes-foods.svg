<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Everyday foods and sometimes foods</title>
  <desc id="desc">Two labeled groups of foods. The left group, everyday, shows an apple, a carrot, a rice bowl, a fish, and beans. The right group, sometimes, shows a sweet, a fried snack, a slice of cake, and a fizzy drink. Each food is drawn with a shape and a word label. The two group headers use the words everyday and sometimes, never good and bad.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Everyday and Sometimes Foods</text>

  <!-- Everyday column -->
  <g>
    <rect x="24" y="72" width="228" height="412" rx="14" fill="#ffffff" stroke="#7a9e7e" stroke-width="3"/>
    <rect x="24" y="72" width="228" height="52" rx="14" fill="#7a9e7e"/>
    <text x="138" y="106" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222222">everyday</text>

    <!-- apple -->
    <g>
      <circle cx="78" cy="164" r="22" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
      <line x1="78" y1="142" x2="78" y2="130" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
      <text x="78" y="202" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">fruit</text>
    </g>
    <!-- carrot -->
    <g>
      <path d="M192 142 L214 176 L170 176 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
      <line x1="192" y1="142" x2="192" y2="128" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
      <text x="192" y="202" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">vegetable</text>
    </g>
    <!-- rice bowl -->
    <g>
      <path d="M56 262 L100 262 L92 296 L64 296 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
      <ellipse cx="78" cy="262" rx="22" ry="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
      <text x="78" y="318" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">rice</text>
    </g>
    <!-- fish -->
    <g>
      <ellipse cx="188" cy="268" rx="26" ry="12" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
      <path d="M212 268 L226 258 L226 278 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="174" cy="266" r="2" fill="#2b3a42"/>
      <text x="192" y="318" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">fish</text>
    </g>
    <!-- beans -->
    <g>
      <ellipse cx="138" cy="360" rx="16" ry="10" fill="#8a6f52" stroke="#2b3a42" stroke-width="2"/>
      <ellipse cx="160" cy="366" rx="16" ry="10" fill="#8a6f52" stroke="#2b3a42" stroke-width="2"/>
      <text x="150" y="398" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">beans</text>
    </g>
    <text x="138" y="448" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">give steady strength</text>
  </g>

  <!-- Sometimes column -->
  <g>
    <rect x="260" y="72" width="228" height="412" rx="14" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
    <rect x="260" y="72" width="228" height="52" rx="14" fill="#e0a458"/>
    <text x="374" y="106" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222222">sometimes</text>

    <!-- sweet (lollipop) -->
    <g>
      <circle cx="316" cy="164" r="20" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
      <line x1="316" y1="184" x2="316" y2="206" stroke="#4f6d7a" stroke-width="4" stroke-linecap="round"/>
      <text x="316" y="202" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">sweet</text>
    </g>
    <!-- fried snack -->
    <g>
      <ellipse cx="424" cy="160" rx="22" ry="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
      <path d="M412 154 q6 -8 12 -8 q6 0 12 8" fill="none" stroke="#8a6f52" stroke-width="2"/>
      <text x="424" y="202" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">fried snack</text>
    </g>
    <!-- cake slice -->
    <g>
      <path d="M296 274 L338 274 L338 292 L320 306 L296 292 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
      <rect x="298" y="262" width="40" height="12" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
      <text x="316" y="326" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">cake</text>
    </g>
    <!-- fizzy drink -->
    <g>
      <rect x="404" y="252" width="30" height="46" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
      <rect x="412" y="246" width="14" height="8" rx="3" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
      <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round">
        <circle cx="414" cy="276" r="2"/>
        <circle cx="424" cy="272" r="2"/>
        <circle cx="416" cy="284" r="2"/>
      </g>
      <text x="420" y="326" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">drink</text>
    </g>
    <text x="374" y="448" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">a treat now and then</text>
  </g>

  <text x="256" y="500" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">No food is bad — different foods have different jobs.</text>
</svg>
