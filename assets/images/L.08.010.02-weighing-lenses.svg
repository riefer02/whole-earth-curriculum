<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Weighing a dilemma: consequences, duties, and fairness</title>
  <desc id="desc">A triangle with three labeled boxes at its corners — consequences, duties, and fairness — and a question mark in the center where the three lenses meet to weigh a dilemma.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Three Lenses for Weighing a Dilemma</text>

  <!-- center question -->
  <circle cx="256" cy="268" r="52" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="262" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">What</text>
  <text x="256" y="288" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">to do?</text>

  <!-- consequences (top) -->
  <rect x="176" y="80" width="160" height="84" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="200" cy="104" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="214" y="109" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Consequences</text>
  <text x="188" y="130" font-family="sans-serif" font-size="11" fill="#4f6d7a">What happens to everyone</text>
  <text x="188" y="147" font-family="sans-serif" font-size="11" fill="#4f6d7a">affected, now and later?</text>

  <!-- duties (bottom-left) -->
  <rect x="34" y="372" width="160" height="84" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="58" cy="396" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="72" y="401" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Duties</text>
  <text x="46" y="422" font-family="sans-serif" font-size="11" fill="#4f6d7a">What do I owe — honesty,</text>
  <text x="46" y="439" font-family="sans-serif" font-size="11" fill="#4f6d7a">promises, care?</text>

  <!-- fairness (bottom-right) -->
  <rect x="318" y="372" width="160" height="84" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="342" cy="396" r="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="356" y="401" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Fairness</text>
  <text x="330" y="422" font-family="sans-serif" font-size="11" fill="#4f6d7a">Who gets what? Is anyone</text>
  <text x="330" y="439" font-family="sans-serif" font-size="11" fill="#4f6d7a">left out or harmed?</text>

  <!-- connectors -->
  <path d="M256 164 L256 216" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M140 400 L214 304" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M372 400 L298 304" fill="none" stroke="#4f6d7a" stroke-width="2"/>

  <text x="256" y="488" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Weigh all three — then decide, and give your reason.</text>
</svg>
