<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Two views of disability</title>
  <desc id="desc">Two panels. The first, the medical view, shows a lone wheelchair user with a label pointing at the person as the problem. The second, the social view, shows the same person facing a flight of steps, a narrow doorway, and judgmental labels, with a caption that disability lives in the fit between a person and the world. Labels and shapes carry the meaning.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Two Views of Disability</text>

  <!-- Panel 1: Medical view -->
  <g>
    <rect x="16" y="76" width="232" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
    <text x="132" y="104" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Medical view</text>
    <text x="132" y="124" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">the body is the problem</text>
    <!-- person in wheelchair -->
    <circle cx="132" cy="180" r="14" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M132 194 L132 224" stroke="#2b3a42" stroke-width="2"/>
    <path d="M118 210 L146 210" stroke="#2b3a42" stroke-width="2"/>
    <rect x="104" y="224" width="20" height="28" rx="3" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="140" y="224" width="20" height="28" rx="3" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="114" cy="256" r="7" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="150" cy="256" r="7" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <!-- arrow pointing at person -->
    <path d="M178 156 L206 168 M206 168 L198 164 M206 168 L202 176" stroke="#e0a458" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="196" y="144" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e0a458" font-weight="bold">fix the</text>
    <text x="196" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e0a458" font-weight="bold">person</text>
    <text x="132" y="330" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#222222">Focus on what the body cannot do.</text>
    <text x="132" y="350" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">Sees only one half of the story.</text>
  </g>

  <!-- Panel 2: Social view -->
  <g>
    <rect x="264" y="76" width="232" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
    <text x="380" y="104" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Social view</text>
    <text x="380" y="124" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">barriers are the problem</text>
    <!-- person in wheelchair facing stairs -->
    <circle cx="330" cy="186" r="14" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M330 200 L330 230" stroke="#2b3a42" stroke-width="2"/>
    <path d="M316 216 L344 216" stroke="#2b3a42" stroke-width="2"/>
    <rect x="302" y="230" width="20" height="28" rx="3" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="338" y="230" width="20" height="28" rx="3" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="312" cy="262" r="7" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="348" cy="262" r="7" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <!-- stairs barrier -->
    <rect x="372" y="252" width="60" height="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="380" y="240" width="60" height="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
    <rect x="388" y="228" width="60" height="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="416" y="224" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#4f6d7a">steps</text>
    <!-- attitudinal barrier labels -->
    <rect x="286" y="312" width="88" height="22" rx="4" fill="#fdfbf7" stroke="#e0a458" stroke-width="1.5"/>
    <text x="330" y="327" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#222222">"you don't look it"</text>
    <text x="380" y="300" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#222222">Fix the steps, the door,</text>
    <text x="380" y="350" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#222222">the attitudes — the world.</text>
  </g>

  <text x="256" y="414" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4f6d7a">Disability lives in the fit between a person and the world.</text>
  <text x="256" y="438" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">Change the world — steps, doors, attitudes — and you change what is disabling.</text>
</svg>
