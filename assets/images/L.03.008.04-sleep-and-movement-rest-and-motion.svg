<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Sleep and movement</title>
  <desc id="desc">Two equal panels. The left panel shows a child asleep under a blanket, labeled sleep restores the body. The right panel shows a child running with a heart symbol, labeled movement strengthens heart and muscles. Below each panel are the words rest and motion. Labels and shapes carry the idea, and the picture reads clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Sleep and Movement</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Sleep restores. Movement strengthens.</text>

  <!-- Sleep panel -->
  <g>
    <rect x="24" y="92" width="224" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <circle cx="136" cy="176" r="22" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M136 176 q-10 26 -14 34 q-2 8 5 11 l7 2" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <path d="M100 252 q36 26 72 0 l0 40 q-36 22 -72 0 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M112 274 q0 -9 9 -9 q9 0 9 9 m0 0 l16 0" stroke="#2b3a42" stroke-width="2" fill="none"/>
    <path d="M150 300 q0 -8 8 -8 q8 0 8 8" stroke="#2b3a42" stroke-width="2" fill="none"/>
    <text x="136" y="388" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">sleep restores the body</text>
  </g>

  <!-- Movement panel -->
  <g>
    <rect x="264" y="92" width="224" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <circle cx="376" cy="162" r="16" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M376 178 l0 40" stroke="#2b3a42" stroke-width="4"/>
    <path d="M376 196 l-22 20 M376 196 l22 20" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M376 218 l-18 40 M376 218 l18 40" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M376 258 l-6 40 M376 258 l6 40" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M344 236 l-16 16 M344 252 l-16 -16" fill="none" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
    <path d="M352 244 q6 0 6 -6 q0 -6 -6 -6 q-6 0 -6 6 q0 6 6 6 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="376" y="388" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">movement strengthens heart and muscles</text>
  </g>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">Every body rests and moves in its own way.</text>
</svg>
