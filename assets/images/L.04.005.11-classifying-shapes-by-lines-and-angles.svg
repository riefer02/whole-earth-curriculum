<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Classifying quadrilaterals by lines and angles</title>
  <desc id="desc">Four quadrilaterals shown in a row: a parallelogram, a rectangle, a rhombus, and a square. Each is labeled with its features: the parallelogram has two pairs of parallel sides; the rectangle adds four right angles; the rhombus has four equal sides; the square has four equal sides and four right angles. A note says every square is a rectangle and a rhombus.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Classifying Shapes by Lines &amp; Angles</text>

  <!-- Parallelogram -->
  <text x="106" y="86" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#6b93b6">parallelogram</text>
  <polygon points="66,160 156,160 186,220 96,220" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="106" y="246" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">2 pairs of parallel sides</text>

  <!-- Rectangle -->
  <text x="256" y="86" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7a9e7e">rectangle</text>
  <rect x="206" y="126" width="100" height="66" rx="2" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#e0a458" stroke-width="2" fill="none">
    <path d="M212 132 h6 v6"/><path d="M300 132 h-6 v6"/><path d="M212 186 v-6 h6"/><path d="M300 186 v-6 h-6"/>
  </g>
  <text x="256" y="246" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">parallel sides + 4 right angles</text>

  <!-- Rhombus -->
  <text x="406" y="86" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e0a458">rhombus</text>
  <polygon points="406,126 456,158 406,192 356,158" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="406" y1="126" x2="456" y2="158"/><line x1="456" y1="158" x2="406" y2="192"/><line x1="406" y1="192" x2="356" y2="158"/><line x1="356" y1="158" x2="406" y2="126"/>
  </g>
  <text x="406" y="246" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">4 equal sides (not always square corners)</text>

  <!-- Square -->
  <text x="256" y="288" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7a9e7e">square</text>
  <rect x="216" y="302" width="80" height="80" rx="2" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#e0a458" stroke-width="2" fill="none">
    <path d="M222 308 h6 v6"/><path d="M290 308 h-6 v6"/><path d="M222 376 v-6 h6"/><path d="M290 376 v-6 h-6"/>
  </g>
  <text x="256" y="408" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">4 equal sides AND 4 right angles</text>

  <rect x="80" y="430" width="352" height="50" rx="10" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">Every square is a rectangle AND a rhombus.</text>
  <text x="256" y="472" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">A shape can belong to more than one family.</text>
</svg>
