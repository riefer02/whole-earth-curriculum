<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Teamwork Rehearsal: each adds one, we cheer each other on</title>
  <desc id="desc">A team of three children builds a tower of blocks together. The child in the middle carefully places one block on the growing tower, while the other two children cheer with speech bubbles: "You can do it!" and "Nice try!" A label across the bottom reads "each adds one, we cheer each other on." The written words carry the meaning, not color, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Teamwork Rehearsal</text>
  <text x="256" y="68" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Do your part and cheer each other on</text>

  <!-- Tower of blocks -->
  <g>
    <rect x="206" y="270" width="100" height="30" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="218" y="240" width="76" height="30" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="230" y="210" width="52" height="30" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="242" y="180" width="28" height="30" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- Child placing block (center) -->
  <g>
    <circle cx="256" cy="140" r="17" fill="#8d5a3b" stroke="#2b3a42" stroke-width="2"/>
    <path d="M240 140 A17 17 0 0 1 272 140 Z" fill="#2b3a42"/>
    <circle cx="249" cy="140" r="2" fill="#2b3a42"/>
    <circle cx="263" cy="140" r="2" fill="#2b3a42"/>
    <path d="M249 150 Q256 154 263 150" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="256" y1="157" x2="252" y2="186" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="157" x2="260" y2="186" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="239" y1="168" x2="216" y2="182" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="273" y1="168" x2="296" y2="182" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Left cheering child -->
  <g>
    <circle cx="130" cy="150" r="17" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M114 150 A17 17 0 0 1 146 150 Z" fill="#2b3a42"/>
    <circle cx="123" cy="150" r="2" fill="#2b3a42"/>
    <circle cx="137" cy="150" r="2" fill="#2b3a42"/>
    <path d="M123 160 Q130 164 137 160" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="130" y1="167" x2="126" y2="196" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="130" y1="167" x2="134" y2="196" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="113" y1="178" x2="92" y2="170" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="147" y1="178" x2="168" y2="170" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Right cheering child -->
  <g>
    <circle cx="386" cy="150" r="17" fill="#6b5b3e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M370 150 A17 17 0 0 1 402 150 Z" fill="#2b3a42"/>
    <circle cx="379" cy="150" r="2" fill="#2b3a42"/>
    <circle cx="393" cy="150" r="2" fill="#2b3a42"/>
    <path d="M379 160 Q386 164 393 160" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="386" y1="167" x2="382" y2="196" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="386" y1="167" x2="390" y2="196" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="369" y1="178" x2="348" y2="170" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="403" y1="178" x2="424" y2="170" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Speech bubbles -->
  <rect x="40" y="92" width="130" height="40" rx="11" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M120 132 L138 132 L130 146 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <text x="105" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">You can do it!</text>

  <rect x="342" y="92" width="130" height="40" rx="11" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M392 132 L410 132 L402 146 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <text x="407" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Nice try!</text>

  <!-- Bottom band -->
  <rect x="86" y="330" width="340" height="48" rx="12" fill="#2b3a42"/>
  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#fdfbf7">each adds one, we cheer each other on</text>

  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">A team is people doing their parts and cheering each other on.</text>
</svg>
