<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My Responsibilities to Fairness and Justice</title>
  <desc id="desc">Four concentric circles labeled from center outward: "self," "close community," "wider society," "world." Beside them, a note: "evidence shows inequality and unequal access are real; what I owe is a question of value." Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42" font-weight="bold">My Responsibilities to Fairness and Justice</text>

  <!-- concentric circles -->
  <circle cx="226" cy="240" r="196" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <circle cx="226" cy="240" r="146" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <circle cx="226" cy="240" r="96" fill="none" stroke="#e0a458" stroke-width="3"/>
  <circle cx="226" cy="240" r="48" fill="none" stroke="#2b3a42" stroke-width="3"/>

  <text x="226" y="246" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42" font-weight="bold">self</text>
  <text x="226" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">close community</text>
  <text x="226" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">wider society</text>
  <text x="226" y="66" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">world</text>

  <rect x="226" y="400" width="262" height="70" rx="6" fill="none" stroke="#4f6d7a" stroke-width="3"/>
  <text x="357" y="425" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">Evidence: inequality and unequal</text>
  <text x="357" y="441" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">access are real.</text>
  <text x="357" y="457" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2b3a42" font-weight="bold">What I owe is a question of value.</text>
</svg>
