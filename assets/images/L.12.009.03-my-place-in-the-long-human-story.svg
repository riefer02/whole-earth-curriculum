<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My Place in the Long Human Story</title>
  <desc id="desc">A long horizontal strip running left to right. Near the far left a small figure labeled "first humans in Africa, roughly 300,000 years ago"; about three-quarters across a marker labeled "writing, roughly 5,000 years ago"; near the very end a small dot labeled "you." The strip is proportional, so the vastness before writing is visible. Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2b3a42" font-weight="bold">The Long Human Story (in proportion)</text>

  <!-- the long strip -->
  <line x1="40" y1="200" x2="472" y2="200" stroke="#2b3a42" stroke-width="5"/>
  <polygon points="472,200 456,193 456,207" fill="#2b3a42"/>

  <!-- first humans -->
  <line x1="72" y1="196" x2="72" y2="204" stroke="#4f6d7a" stroke-width="4"/>
  <circle cx="72" cy="150" r="14" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <circle cx="72" cy="146" r="4" fill="#2b3a42"/>
  <path d="M63 156 Q72 150 81 156" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <text x="72" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">first humans in Africa</text>
  <text x="72" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">~300,000 years ago</text>

  <!-- writing marker -->
  <line x1="356" y1="196" x2="356" y2="204" stroke="#e0a458" stroke-width="4"/>
  <text x="356" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">writing</text>
  <text x="356" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">~5,000 years ago</text>

  <!-- cities marker -->
  <line x1="436" y1="196" x2="436" y2="204" stroke="#7a9e7e" stroke-width="4"/>
  <text x="436" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">cities for most</text>
  <text x="436" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">recent decades</text>

  <!-- you -->
  <line x1="468" y1="196" x2="468" y2="204" stroke="#2b3a42" stroke-width="4"/>
  <circle cx="468" cy="150" r="10" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <text x="468" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">you</text>

  <text x="256" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Most of the story has no writing — and you are part of it.</text>
  <text x="256" y="286" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Your life is a place in the story, not its ending.</text>
</svg>
