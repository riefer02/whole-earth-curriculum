<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">How I Will Act</title>
  <desc id="desc">A flow from left to right: "name the responsibility," then "one concrete action," then "allies and resources," then "honest limits," then "check back." A footer reads "justice is something I do, not just something I believe." Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#2b3a42" font-weight="bold">How I Will Act</text>

  <!-- five boxes in a flow -->
  <rect x="20" y="150" width="88" height="120" rx="6" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <text x="64" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">name the responsibility</text>

  <rect x="122" y="150" width="88" height="120" rx="6" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <text x="166" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">one concrete action</text>

  <rect x="224" y="150" width="88" height="120" rx="6" fill="none" stroke="#e0a458" stroke-width="3"/>
  <text x="268" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">allies and resources</text>

  <rect x="326" y="150" width="88" height="120" rx="6" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="370" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">honest limits</text>

  <rect x="428" y="150" width="64" height="120" rx="6" fill="none" stroke="#e0a458" stroke-width="3"/>
  <text x="460" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">check back</text>

  <!-- arrows -->
  <line x1="108" y1="210" x2="122" y2="210" stroke="#4f6d7a" stroke-width="4"/>
  <line x1="210" y1="210" x2="224" y2="210" stroke="#4f6d7a" stroke-width="4"/>
  <line x1="312" y1="210" x2="326" y2="210" stroke="#4f6d7a" stroke-width="4"/>
  <line x1="414" y1="210" x2="428" y2="210" stroke="#4f6d7a" stroke-width="4"/>

  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Justice is something I do,</text>
  <text x="256" y="384" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">not just something I believe.</text>
</svg>
