<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Me and my society: shaped and shaping</title>
  <desc id="desc">A central figure stands in the middle, surrounded by seven labeled nodes: family, school, media, culture, laws, economy, and peers. Two-way arrows run between the center and each node. One arrow direction is labeled "society shapes me" and the other "I shape society," showing that influence runs both ways.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">Me and My Society</text>

  <!-- central figure -->
  <circle cx="256" cy="270" r="30" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
  <path d="M210 300 q46 40 92 0" fill="#6b93b6" stroke="#2b3a42" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="256" y="276" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">me</text>

  <!-- surrounding nodes -->
  <g font-family="sans-serif" text-anchor="middle">
    <!-- family (top) -->
    <rect x="196" y="58" width="120" height="34" rx="17" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="256" y="80" font-size="14" font-weight="bold" fill="#2b3a42">family</text>

    <!-- school (upper right) -->
    <rect x="386" y="98" width="110" height="34" rx="17" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="441" y="120" font-size="14" font-weight="bold" fill="#2b3a42">school</text>

    <!-- media (right) -->
    <rect x="398" y="196" width="100" height="34" rx="17" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="448" y="218" font-size="14" font-weight="bold" fill="#2b3a42">media</text>

    <!-- peers (lower right) -->
    <rect x="386" y="310" width="110" height="34" rx="17" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="441" y="332" font-size="14" font-weight="bold" fill="#2b3a42">peers</text>

    <!-- economy (bottom) -->
    <rect x="196" y="404" width="120" height="34" rx="17" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="256" y="426" font-size="14" font-weight="bold" fill="#2b3a42">economy</text>

    <!-- laws (lower left) -->
    <rect x="16" y="310" width="110" height="34" rx="17" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="71" y="332" font-size="14" font-weight="bold" fill="#2b3a42">laws</text>

    <!-- culture (upper left) -->
    <rect x="16" y="98" width="110" height="34" rx="17" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="71" y="120" font-size="14" font-weight="bold" fill="#2b3a42">culture</text>
  </g>

  <!-- two-way arrows -->
  <g stroke="#4f6d7a" stroke-width="2.5" fill="none">
    <path d="M256 96 L256 210" />
    <path d="M332 122 L288 240" />
    <path d="M388 210 L294 262" />
    <path d="M380 322 L300 288" />
    <path d="M256 398 L256 314" />
    <path d="M132 322 L212 288" />
    <path d="M124 210 L222 262" />
  </g>
  <!-- arrowheads: in (society shapes me) -->
  <g fill="#4f6d7a">
    <path d="M256 204 L250 220 L262 220 Z"/>
    <path d="M296 246 L278 254 L292 262 Z"/>
    <path d="M300 268 L278 264 L290 278 Z"/>
    <path d="M306 294 L278 292 L294 306 Z"/>
    <path d="M256 308 L250 324 L262 324 Z"/>
    <path d="M206 294 L234 292 L218 306 Z"/>
    <path d="M216 268 L238 264 L226 278 Z"/>
  </g>
  <!-- arrowheads: out (I shape society) -->
  <g fill="#2b3a42">
    <path d="M256 102 L250 118 L262 118 Z"/>
    <path d="M326 128 L308 136 L322 144 Z"/>
    <path d="M382 214 L364 210 L376 224 Z"/>
    <path d="M374 316 L352 312 L364 326 Z"/>
    <path d="M256 392 L250 408 L262 408 Z"/>
    <path d="M138 316 L160 312 L148 326 Z"/>
    <path d="M130 214 L148 210 L136 224 Z"/>
  </g>

  <text x="256" y="460" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">society shapes me &#160;&#8592;&#8594;&#160; I shape society</text>
  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">the arrow runs both ways</text>
</svg>
