<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A body of work — one idea, many versions</title>
  <desc id="desc">A sketchbook page showing one branching leaf drawn four different ways in four frames, with a caption reading "one idea, many versions."</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <rect x="56" y="40" width="400" height="432" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="84" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#222222">I keep returning to ______</text>
  <!-- four frames -->
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <rect x="72" y="112" width="176" height="150"/>
    <rect x="264" y="112" width="176" height="150"/>
    <rect x="72" y="286" width="176" height="150"/>
    <rect x="264" y="286" width="176" height="150"/>
  </g>
  <!-- frame 1: large rough leaf -->
  <g stroke="#4f6d7a" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M160 210 C140 170 140 130 160 110 C180 130 180 170 160 210"/>
    <path d="M160 110 L160 210"/>
  </g>
  <!-- frame 2: small careful leaf -->
  <g stroke="#7a9e7e" stroke-width="2" fill="#7a9e7e" fill-opacity="0.25">
    <path d="M348 196 C340 178 340 158 348 148 C356 158 356 178 348 196"/>
    <path d="M348 148 L348 196" stroke="#7a9e7e" stroke-width="2"/>
  </g>
  <!-- frame 3: colored leaf, one color -->
  <g stroke="#e0a458" stroke-width="3" fill="#e0a458" fill-opacity="0.4">
    <path d="M160 360 C140 320 140 282 160 262 C180 282 180 320 160 360"/>
    <path d="M160 262 L160 360" stroke="#e0a458" stroke-width="3"/>
  </g>
  <!-- frame 4: close-up leaf, detail -->
  <g stroke="#6b93b6" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M348 350 C332 322 332 292 348 274 C364 292 364 322 348 350"/>
    <path d="M348 274 L348 350"/>
    <path d="M332 310 L364 310"/>
  </g>
  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222222">one idea, many versions</text>
</svg>
