<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Growing and square-number patterns</title>
  <desc id="desc">A row of four growing square arrangements of dots: 1 dot, a 2 by 2 square of 4 dots, a 3 by 3 square of 9 dots, and a 4 by 4 square of 16 dots. Below, a number sequence 1, 4, 9, 16, 25 shows the rule: add the next odd number, plus 3, plus 5, plus 7, plus 9. A second row shows a repeating pattern of circle, square, circle, square with the rule written beneath.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Patterns That Follow a Rule</text>

  <!-- Square numbers -->
  <text x="256" y="78" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">Square numbers: 1, 4, 9, 16, 25 …</text>

  <!-- 1 dot -->
  <g stroke="#2b3a42" stroke-width="2">
    <rect x="48" y="96" width="44" height="44" rx="4" fill="#ffffff"/>
  </g>
  <circle cx="70" cy="118" r="7" fill="#e0a458"/>

  <!-- 4 dots -->
  <g stroke="#2b3a42" stroke-width="2">
    <rect x="120" y="96" width="60" height="60" rx="4" fill="#ffffff"/>
  </g>
  <g fill="#6b93b6">
    <circle cx="136" cy="112" r="6"/><circle cx="164" cy="112" r="6"/>
    <circle cx="136" cy="140" r="6"/><circle cx="164" cy="140" r="6"/>
  </g>

  <!-- 9 dots -->
  <g stroke="#2b3a42" stroke-width="2">
    <rect x="208" y="96" width="76" height="76" rx="4" fill="#ffffff"/>
  </g>
  <g fill="#7a9e7e">
    <circle cx="226" cy="114" r="6"/><circle cx="246" cy="114" r="6"/><circle cx="266" cy="114" r="6"/>
    <circle cx="226" cy="134" r="6"/><circle cx="246" cy="134" r="6"/><circle cx="266" cy="134" r="6"/>
    <circle cx="226" cy="154" r="6"/><circle cx="246" cy="154" r="6"/><circle cx="266" cy="154" r="6"/>
  </g>

  <!-- 16 dots -->
  <g stroke="#2b3a42" stroke-width="2">
    <rect x="312" y="96" width="92" height="92" rx="4" fill="#ffffff"/>
  </g>
  <g fill="#6b93b6">
    <circle cx="332" cy="116" r="6"/><circle cx="354" cy="116" r="6"/><circle cx="376" cy="116" r="6"/><circle cx="398" cy="116" r="6"/>
    <circle cx="332" cy="138" r="6"/><circle cx="354" cy="138" r="6"/><circle cx="376" cy="138" r="6"/><circle cx="398" cy="138" r="6"/>
    <circle cx="332" cy="160" r="6"/><circle cx="354" cy="160" r="6"/><circle cx="376" cy="160" r="6"/><circle cx="398" cy="160" r="6"/>
    <circle cx="332" cy="182" r="6"/><circle cx="354" cy="182" r="6"/><circle cx="376" cy="182" r="6"/><circle cx="398" cy="182" r="6"/>
  </g>

  <g font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b3a42">
    <text x="70" y="208">1</text>
    <text x="150" y="208">4</text>
    <text x="246" y="208">9</text>
    <text x="358" y="208">16</text>
  </g>

  <!-- rule -->
  <text x="256" y="242" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#e0a458">Rule: add the next odd number — +3, +5, +7, +9 …</text>

  <!-- Repeating pattern -->
  <text x="256" y="292" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">A repeating pattern</text>
  <g>
    <circle cx="120" cy="318" r="22" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="150" y="296" width="44" height="44" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="230" cy="318" r="22" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="260" y="296" width="44" height="44" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="340" cy="318" r="22" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="370" y="296" width="44" height="44" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="256" y="372" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#7a9e7e">Rule: circle, square, circle, square — repeat</text>

  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">A pattern is a rule you can see.</text>
  <text x="256" y="448" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">Know the rule, and you can predict what comes next.</text>
</svg>
