<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Sharing roles on a team</title>
  <desc id="desc">A circle of four diverse figures, each labeled with a role: "stepper" (a figure stepping), "counter" (counting on fingers), "encourager" (hands cupped to mouth), and "director" (pointing ahead). Curved arrows around the circle show the roles rotating so each person tries each role. A caption reads "A team shares its roles." Labels and arrows, not color alone, carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">A Team Shares Its Roles</text>

  <!-- Center circle -->
  <circle cx="256" cy="270" r="86" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="266" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">the team</text>
  <text x="256" y="290" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">roles rotate</text>

  <!-- Rotation arrows -->
  <g stroke="#4f6d7a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 172 A 118 118 0 0 1 374 270" stroke-dasharray="6 6"/>
    <path d="M256 368 A 118 118 0 0 1 138 270" stroke-dasharray="6 6"/>
  </g>
  <text x="318" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">rotate</text>
  <text x="194" y="348" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">rotate</text>

  <!-- Top figure: stepper -->
  <g>
    <circle cx="256" cy="126" r="20" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="238" y="146" width="36" height="46" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <line x1="256" y1="192" x2="236" y2="224" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="256" y1="192" x2="276" y2="224" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="256" y="86" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">stepper</text>
    <text x="256" y="104" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">steps the move</text>
  </g>

  <!-- Right figure: counter -->
  <g>
    <circle cx="392" cy="216" r="20" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="374" y="236" width="36" height="46" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <line x1="386" y1="252" x2="392" y2="270" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="398" y1="252" x2="400" y2="270" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="392" y="196" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">counter</text>
    <text x="392" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">counts the beat</text>
  </g>

  <!-- Bottom figure: encourager -->
  <g>
    <circle cx="256" cy="414" r="20" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="238" y="434" width="36" height="46" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <line x1="246" y1="446" x2="238" y2="470" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="266" y1="446" x2="274" y2="470" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="256" y="394" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">encourager</text>
    <text x="256" y="376" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">cheers the effort</text>
  </g>

  <!-- Left figure: director -->
  <g>
    <circle cx="120" cy="216" r="20" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="102" y="236" width="36" height="46" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <line x1="108" y1="252" x2="96" y2="272" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="252" x2="134" y2="272" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="120" y="196" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">director</text>
    <text x="120" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">calls the next move</text>
  </g>

  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#2b3a42">A team shares its roles — and every role matters.</text>
</svg>
