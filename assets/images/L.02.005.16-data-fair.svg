<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Our data fair bar graph</title>
  <desc id="desc">A completed bar graph titled How We Get to School with bars for walking eight, riding four, and bus three, plus a finding card that says four more children walk than ride because eight minus four is four.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Our Data Fair</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#4f6d7a">How We Get to School</text>

  <!-- axes -->
  <line x1="70" y1="100" x2="70" y2="300" stroke="#2b3a42" stroke-width="2"/>
  <line x1="70" y1="300" x2="470" y2="300" stroke="#2b3a42" stroke-width="2"/>

  <!-- grid lines -->
  <g stroke="#2b3a42" stroke-width="1" stroke-opacity="0.25">
    <line x1="70" y1="130" x2="470" y2="130"/>
    <line x1="70" y1="160" x2="470" y2="160"/>
    <line x1="70" y1="190" x2="470" y2="190"/>
    <line x1="70" y1="220" x2="470" y2="220"/>
    <line x1="70" y1="250" x2="470" y2="250"/>
    <line x1="70" y1="280" x2="470" y2="280"/>
  </g>

  <!-- walking (8) -->
  <rect x="120" y="140" width="60" height="160" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="150" y="320" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">walk</text>
  <text x="150" y="340" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">8</text>

  <!-- riding (4) -->
  <rect x="250" y="220" width="60" height="80" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="280" y="320" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">ride</text>
  <text x="280" y="340" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">4</text>

  <!-- bus (3) -->
  <rect x="380" y="240" width="60" height="60" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="410" y="320" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">bus</text>
  <text x="410" y="340" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">3</text>

  <!-- finding card -->
  <rect x="70" y="370" width="372" height="110" rx="12" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
  <text x="256" y="400" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">Our finding:</text>
  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e0a458">4 more children walk than ride</text>
  <text x="256" y="458" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42">because 8 − 4 = 4</text>

  <text x="256" y="496" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">Ask → collect → graph → read. Every voice counts once.</text>
</svg>
