<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The Great Acceleration</title>
  <desc id="desc">A line graph. The line rises very slowly for a long stretch on the left, then turns sharply upward near the right, labeled population, energy use, and CO2. A small footprint symbol sits at the top right.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">The Great Acceleration</text>

  <!-- Axes -->
  <line x1="70" y1="420" x2="470" y2="420" stroke="#2b3a42" stroke-width="3"/>
  <line x1="70" y1="420" x2="70" y2="60" stroke="#2b3a42" stroke-width="3"/>
  <text x="270" y="450" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">time (long stretch &#8594; recent)</text>

  <!-- Slow rise then sharp climb -->
  <path d="M70 410 Q 220 400 320 380 Q 400 300 460 90" fill="none" stroke="#6b93b6" stroke-width="5"/>
  <circle cx="320" cy="380" r="5" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="330" y="372" font-family="sans-serif" font-size="12" fill="#e0a458" font-weight="bold">the bend (~1800)</text>

  <!-- Footprint symbol -->
  <g transform="translate(408,96)" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2">
    <ellipse cx="28" cy="30" rx="14" ry="10"/>
    <circle cx="14" cy="12" r="5"/>
    <circle cx="22" cy="8" r="4"/>
    <circle cx="30" cy="6" r="3.5"/>
    <circle cx="38" cy="8" r="3"/>
  </g>
  <text x="428" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">footprint</text>

  <text x="256" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Population, energy use, and CO&#8322;</text>
  <text x="256" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">rise slowly, then turn sharply upward.</text>
</svg>
