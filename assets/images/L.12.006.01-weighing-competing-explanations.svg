<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Weighing Competing Explanations</title>
  <desc id="desc">A three-column scale weighing two competing explanations, A and B, against the same three criteria — evidence, coherence, and falsifiability — with a verdict line beneath.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Weighing Two Competing Explanations</text>

  <!-- balance beam -->
  <line x1="70" y1="150" x2="442" y2="150" stroke="#2b3a42" stroke-width="4"/>
  <path d="M 256 150 L 256 210" stroke="#2b3a42" stroke-width="4"/>
  <path d="M 236 210 L 276 210" stroke="#2b3a42" stroke-width="4"/>
  <circle cx="256" cy="150" r="6" fill="#2b3a42"/>

  <!-- left pan (A) -->
  <path d="M 70 150 L 70 210 M 130 150 L 130 210" stroke="#2b3a42" stroke-width="3"/>
  <path d="M 60 210 C 60 236, 140 236, 140 210" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <text x="100" y="226" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#e0a458" font-weight="bold">A</text>

  <!-- right pan (B) -->
  <path d="M 382 150 L 382 210 M 442 150 L 442 210" stroke="#2b3a42" stroke-width="3"/>
  <path d="M 372 210 C 372 236, 452 236, 452 210" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <text x="412" y="226" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#6b93b6" font-weight="bold">B</text>

  <!-- three criteria column -->
  <text x="256" y="280" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42" font-weight="bold">Weigh both with the same three questions</text>

  <rect x="76" y="300" width="360" height="46" rx="6" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <text x="88" y="329" font-family="sans-serif" font-size="16" fill="#222222">1. Evidence — what observations support it?</text>

  <rect x="76" y="352" width="360" height="46" rx="6" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <text x="88" y="381" font-family="sans-serif" font-size="16" fill="#222222">2. Coherence — does it fit what we know?</text>

  <rect x="76" y="404" width="360" height="46" rx="6" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <text x="88" y="433" font-family="sans-serif" font-size="16" fill="#222222">3. Falsifiability — what would prove it wrong?</text>

  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42" font-weight="bold">Verdict: the explanation that survives all three.</text>
</svg>
