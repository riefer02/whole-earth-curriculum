  <!-- Bottom caption -->
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Everyone&#8217;s work is shown equally.</text>
  <text x="256" y="476" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">No one is first or best &#8212; together we celebrate and care.</text>
