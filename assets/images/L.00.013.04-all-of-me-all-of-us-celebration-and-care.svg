<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">All of me, all of us: a celebration with equal display and care</title>
  <desc id="desc">A celebration scene. A display board in the middle holds five children's artworks in one equal row — all the same size and height, with a caption that everyone's work is shown equally. A bunting garland hangs above. Children stand around the board celebrating with raised arms; their skin tones and clothing vary and one child uses a wheelchair. Along the bottom, three children care for the shared space together: one sweeps, one picks up a piece of paper, and one waters a plant. A caption at the bottom says no one is first or best and that together we celebrate and care. The picture prints clearly in grayscale and teaches that a celebration honors everyone without ranking.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">All of Me, All of Us</text>
  <text x="256" y="62" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Celebration &amp; Care</text>

