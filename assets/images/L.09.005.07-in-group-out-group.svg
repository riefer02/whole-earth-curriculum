<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">In-group and out-group</title>
  <desc id="desc">Two panels. The first shows a small circle labeled us with figures inside and a figure outside labeled them, separated by a line. The second shows the same line redrawn as a larger circle that includes more people, with the note that belonging can build community or exclude. Shape and position, not color, carry the meaning.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">The Two Faces of "Us"</text>

  <!-- Panel 1: small us, them outside -->
  <text x="128" y="86" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">a line that excludes</text>
  <circle cx="128" cy="230" r="72" fill="#7a9e7e" opacity="0.2" stroke="#2b3a42" stroke-width="2"/>
  <text x="128" y="150" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">us</text>
  <!-- figures inside -->
  <circle cx="108" cy="200" r="14" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="140" cy="210" r="14" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="120" cy="244" r="14" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <!-- figure outside -->
  <circle cx="220" cy="300" r="14" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
  <text x="220" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">them</text>
  <path d="M128 158 L128 120" fill="none" stroke="#e0a458" stroke-width="3"/>

  <!-- Arrow between panels -->
  <path d="M250 240 L282 240" fill="none" stroke="#2b3a42" stroke-width="4"/>
  <path d="M282 240 L272 232 M282 240 L272 248" fill="none" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>

  <!-- Panel 2: wider circle -->
  <text x="392" y="86" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">a line redrawn wider</text>
  <circle cx="392" cy="230" r="96" fill="#7a9e7e" opacity="0.2" stroke="#2b3a42" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="392" y="128" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">us (wider)</text>
  <!-- figures all inside -->
  <circle cx="360" cy="200" r="14" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="398" cy="210" r="14" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="380" cy="244" r="14" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="430" cy="270" r="14" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
  <text x="392" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">now "them" is "us" too</text>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#4f6d7a">Belonging can build community — or leave people out.</text>
</svg>
