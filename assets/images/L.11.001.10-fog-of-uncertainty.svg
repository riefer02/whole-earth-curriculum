<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Deciding when nothing is certain</title>
  <desc id="desc">A figure stands at a fork in a path under patches of fog, holding a compass. The two branches are labeled "one option" and "another option," and the fog patches are labeled "unknown." A caption reads that when nothing is certain, values are the compass. Labels and shapes carry the meaning, so the diagram prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Deciding When Nothing Is Certain</text>

  <!-- Fog patches -->
  <g fill="#eef2ee" stroke="#4f6d7a" stroke-width="2">
    <path d="M120 120 q30 -26 64 0 q30 24 62 0 q28 -22 58 0 q-28 22 -58 0 q-32 24 -62 0 q-34 26 -64 0 z"/>
    <path d="M250 180 q26 -22 54 0 q26 20 52 0 q-26 20 -52 0 q-28 22 -54 0 z"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#4f6d7a" text-anchor="middle">
    <text x="172" y="104">unknown</text>
    <text x="278" y="164">unknown</text>
  </g>

  <!-- Forking paths -->
  <path d="M256 360 L256 300 L150 240" fill="none" stroke="#4f6d7a" stroke-width="5" stroke-linecap="round"/>
  <path d="M256 300 L362 240" fill="none" stroke="#4f6d7a" stroke-width="5" stroke-linecap="round"/>

  <text x="130" y="222" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">one option</text>
  <text x="386" y="222" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">another option</text>

  <!-- Figure with compass -->
  <circle cx="256" cy="344" r="18" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M240 380 a16 16 0 0 1 32 0 z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>

  <!-- Compass in hand -->
  <g transform="translate(280 330)">
    <circle cx="0" cy="0" r="17" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <path d="M0 -12 l5 12 l-5 8 l-5 -8 z" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
    <path d="M12 8 l-16 8" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">When nothing is certain, my values are the compass.</text>
</svg>
