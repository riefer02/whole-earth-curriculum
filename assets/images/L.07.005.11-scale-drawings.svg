<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Scale drawings</title>
  <desc id="desc">A scale drawing diagram. A map of a rectangular garden is shown on a grid with a scale bar reading "1 cm = 2 m." A side measures 3 cm on the drawing, and a worked computation shows 3 × 2 = 6 metres actual. A second small drawing shows the same garden reproduced at double scale (scale factor 2), labeled "reproduce at scale factor 2: every length doubles." Labels, counts, and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="30" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Scale Drawings: From Picture to World</text>

  <!-- garden drawing on grid -->
  <text x="60" y="64" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">garden plan (drawing)</text>
  <!-- grid 20px cells, garden 3 cells wide x 2 tall = 60x40 -->
  <g stroke="#4f6d7a" stroke-width="1">
    <line x1="60" y1="80" x2="160" y2="80"/>
    <line x1="60" y1="100" x2="160" y2="100"/>
    <line x1="60" y1="120" x2="160" y2="120"/>
    <line x1="60" y1="140" x2="160" y2="140"/>
    <line x1="60" y1="160" x2="160" y2="160"/>
    <line x1="60" y1="80" x2="60" y2="160"/>
    <line x1="80" y1="80" x2="80" y2="160"/>
    <line x1="100" y1="80" x2="100" y2="160"/>
    <line x1="120" y1="80" x2="120" y2="160"/>
    <line x1="140" y1="80" x2="140" y2="160"/>
    <line x1="160" y1="80" x2="160" y2="160"/>
  </g>
  <rect x="60" y="80" width="100" height="80" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="110" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">3 cm</text>
  <text x="110" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">each square = 1 cm</text>

  <!-- scale bar -->
  <rect x="210" y="90" width="120" height="18" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="270" y="104" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">1 cm = 2 m</text>
  <text x="270" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">the scale</text>

  <!-- worked computation -->
  <rect x="210" y="150" width="270" height="70" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="345" y="176" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">wall = 3 cm on the plan</text>
  <text x="345" y="200" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6b93b6">3 × 2 = 6 m actual</text>

  <!-- reproduce at scale factor 2 -->
  <text x="60" y="230" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">reproduce at scale factor 2 (double)</text>
  <rect x="60" y="244" width="200" height="80" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="160" y="284" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">6 cm</text>
  <text x="160" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">every length × 2: 3 cm → 6 cm</text>

  <text x="256" y="378" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">actual length = drawing length × scale factor</text>
  <text x="256" y="402" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">reproduce: multiply every length by the same factor</text>

  <text x="256" y="442" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">the scale is a constant of proportionality between picture and world</text>
  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">maps and plans: Ptolemy's coordinates · al-Idrisi's 12th-century world map</text>
  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">a scale lets anyone read a map or plan and check a measurement</text>
</svg>
