<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The make-and-improve cycle: imagine, plan, make, test, improve</title>
  <desc id="desc">A cycle diagram with five steps arranged in a circle joined by arrows that point around and around. The top step is "imagine," shown with a lightbulb; moving clockwise, "plan" is shown with a pencil, "make" with two stacked blocks, "test" with a magnifying glass, and "improve" with an upward arrow. Arrows run imagine to plan to make to test to improve and back to imagine, so the loop never has to stop. In the center the words "make-and-improve cycle" are written. Each step has both a picture and its word, so the meaning never depends on color and the diagram prints clearly in grayscale. It teaches that making is a circle you can travel again and again, and every stop teaches you something.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">The Make-and-Improve Cycle</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Making is a circle, not one try.</text>

  <!-- ===== Arrows (drawn under the nodes) ===== -->
  <g fill="#4f6d7a" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round">
    <line x1="292" y1="163" x2="329" y2="190" stroke-width="3"/>
    <path d="M0 -7 L12 0 L0 7 Z" transform="translate(339 197) rotate(36)" fill="#4f6d7a" stroke="none"/>
  </g>
  <g fill="#4f6d7a" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round">
    <line x1="364" y1="267" x2="350" y2="311"/>
    <path d="M0 -7 L12 0 L0 7 Z" transform="translate(346 323) rotate(108)" fill="#4f6d7a" stroke="none"/>
  </g>
  <g fill="#4f6d7a" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round">
    <line x1="287" y1="369" x2="241" y2="369"/>
    <path d="M0 -7 L12 0 L0 7 Z" transform="translate(229 369) rotate(180)" fill="#4f6d7a" stroke="none"/>
  </g>
  <g fill="#4f6d7a" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round">
    <line x1="167" y1="327" x2="153" y2="283"/>
    <path d="M0 -7 L12 0 L0 7 Z" transform="translate(149 271) rotate(-108)" fill="#4f6d7a" stroke="none"/>
  </g>
  <g fill="#4f6d7a" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round">
    <line x1="170" y1="200" x2="207" y2="172"/>
    <path d="M0 -7 L12 0 L0 7 Z" transform="translate(217 165) rotate(-36)" fill="#4f6d7a" stroke="none"/>
  </g>

  <!-- ===== Center label ===== -->
  <text x="256" y="260" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">make-and-</text>
  <text x="256" y="278" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">improve</text>
  <text x="256" y="296" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">cycle</text>

  <!-- ===== imagine (top) ===== -->
  <g>
    <circle cx="256" cy="137" r="40" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <circle cx="256" cy="128" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="251" y="142" width="10" height="5" rx="2" fill="#2b3a42"/>
    <line x1="244" y1="116" x2="240" y2="110" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
    <line x1="256" y1="112" x2="256" y2="106" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
    <line x1="268" y1="116" x2="272" y2="110" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
    <text x="256" y="199" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">imagine</text>
  </g>

  <!-- ===== plan (upper-right) ===== -->
  <g>
    <circle cx="378" cy="225" r="40" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="371" y="210" width="12" height="24" rx="2" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M371 234 L377 234 L374 242 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="371" y="206" width="12" height="5" rx="2" fill="#c47a6b" stroke="#2b3a42" stroke-width="2"/>
    <text x="378" y="287" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">plan</text>
  </g>

  <!-- ===== make (lower-right) ===== -->
  <g>
    <circle cx="331" cy="369" r="40" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="323" y="360" width="16" height="12" rx="2" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="319" y="373" width="24" height="11" rx="2" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="331" y="431" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">make</text>
  </g>

  <!-- ===== test (lower-left) ===== -->
  <g>
    <circle cx="181" cy="369" r="40" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <circle cx="178" cy="364" r="11" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <line x1="186" y1="371" x2="197" y2="382" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <text x="181" y="431" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">test</text>
  </g>

  <!-- ===== improve (upper-left) ===== -->
  <g>
    <circle cx="134" cy="225" r="40" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <line x1="134" y1="238" x2="134" y2="216" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M126 218 L134 206 L142 218 Z" fill="#2b3a42"/>
    <line x1="126" y1="240" x2="142" y2="240" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <text x="134" y="287" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">improve</text>
  </g>

  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Travel the circle again and again — every stop teaches you something.</text>
</svg>
