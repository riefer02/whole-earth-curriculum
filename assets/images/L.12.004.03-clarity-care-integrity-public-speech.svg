<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Clarity, care, and integrity in public speech</title>
  <desc id="desc">A speaker stands at the left, gesturing, with three arrows labeled clarity, care, and integrity running from the speaker to three audiences on the right: a community meeting, a professional panel behind a table, and a young listener. The audiences differ in dress and setting. All meaning is carried by labels and shapes, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Clarity, Care, Integrity</text>

  <!-- Speaker -->
  <g>
    <circle cx="86" cy="170" r="26" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="78" cy="164" r="2.6" fill="#2b3a42"/><circle cx="94" cy="164" r="2.6" fill="#2b3a42"/>
    <path d="M77 181 Q86 187 95 181" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M86 196 L70 236 M86 196 L102 236" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <circle cx="70" cy="238" r="5" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="102" cy="238" r="5" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="86" y="268" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">speaker</text>

  <!-- Three arrows with labels -->
  <g>
    <line x1="118" y1="160" x2="180" y2="96" stroke="#7a9e7e" stroke-width="3"/>
    <polygon points="180,96 170,100 174,90" fill="#7a9e7e"/>
    <rect x="120" y="104" width="72" height="24" rx="12" fill="#7a9e7e"/>
    <text x="156" y="121" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">clarity</text>

    <line x1="128" y1="184" x2="206" y2="184" stroke="#6b93b6" stroke-width="3"/>
    <polygon points="206,184 196,179 196,189" fill="#6b93b6"/>
    <rect x="132" y="156" width="68" height="24" rx="12" fill="#6b93b6"/>
    <text x="166" y="173" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">care</text>

    <line x1="118" y1="208" x2="180" y2="272" stroke="#e0a458" stroke-width="3"/>
    <polygon points="180,272 174,262 186,264" fill="#e0a458"/>
    <rect x="122" y="238" width="76" height="24" rx="12" fill="#e0a458"/>
    <text x="160" y="255" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">integrity</text>
  </g>

  <!-- Audience 1: community meeting (top) -->
  <g>
    <circle cx="238" cy="92" r="18" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="244" cy="92" r="18" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="250" cy="92" r="18" fill="#d9a06a" stroke="#2b3a42" stroke-width="2"/>
    <text x="244" y="132" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">community meeting</text>
  </g>

  <!-- Audience 2: professional panel (middle) -->
  <g>
    <rect x="226" y="158" width="180" height="16" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="246" cy="188" r="14" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="286" cy="188" r="14" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="326" cy="188" r="14" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="316" y="226" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">professional panel</text>
  </g>

  <!-- Audience 3: young listener (bottom) -->
  <g>
    <circle cx="244" cy="290" r="18" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="238" cy="285" r="2" fill="#2b3a42"/><circle cx="250" cy="285" r="2" fill="#2b3a42"/>
    <path d="M237 297 Q244 302 251 297" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M244 308 L232 330 M244 308 L256 330" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="244" y="350" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">young listener</text>
  </g>

  <!-- Bottom note -->
  <text x="256" y="392" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">the voice adapts to audience and purpose;</text>
  <text x="256" y="414" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">clarity, care, and integrity travel unchanged.</text>
</svg>
