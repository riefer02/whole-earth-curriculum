<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My family community: families come in many shapes</title>
  <desc id="desc">Four panels show different kinds of family. Panel one: one grown-up cooking at a pot while a child waits. Panel two: a grandparent with grey hair and glasses and a child walking together. Panel three: two grown-ups and a child holding hands. Panel four: an older child carrying water with a younger child. Each panel is labeled with a short caption like "we cook together" and "we walk together." Skin tones, hair, and clothes vary across the figures. The captions and the shapes, not color, carry the meaning, so the picture prints clearly in grayscale and shows that what makes a family is caring and being together, not any single shape.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Title -->
  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">My Family Community</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Families come in many shapes</text>

  <!-- Panel frames -->
  <rect x="18" y="92" width="232" height="176" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="262" y="92" width="232" height="176" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="18" y="286" width="232" height="176" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="262" y="286" width="232" height="176" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>

  <!-- ===== Panel 1: one grown-up cooking, one child ===== -->
  <g>
    <circle cx="100" cy="150" r="17" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M83 148 A17 17 0 0 1 117 148 Z" fill="#2b3a42"/>
    <circle cx="94" cy="150" r="1.8" fill="#2b3a42"/>
    <circle cx="106" cy="150" r="1.8" fill="#2b3a42"/>
    <path d="M94 160 Q100 165 106 160" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="89" y="168" width="22" height="42" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="94" y1="210" x2="92" y2="238" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="106" y1="210" x2="108" y2="238" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <!-- cooking pot -->
    <path d="M140 208 Q150 200 160 208 L164 236 L136 236 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="132" y1="202" x2="168" y2="202" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <!-- child -->
    <circle cx="150" cy="178" r="11" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M139 176 A11 11 0 0 1 161 176 Z" fill="#4f6d7a"/>
    <circle cx="146" cy="178" r="1.6" fill="#2b3a42"/>
    <circle cx="154" cy="178" r="1.6" fill="#2b3a42"/>
    <path d="M146 185 Q150 189 154 185" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="142" y="190" width="16" height="26" rx="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="134" y="258" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">we cook together</text>

  <!-- ===== Panel 2: grandparent and child ===== -->
  <g>
    <circle cx="330" cy="150" r="16" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M314 148 A16 16 0 0 1 346 148 Z" fill="#4f6d7a"/>
    <circle cx="324" cy="150" r="3" fill="none" stroke="#2b3a42" stroke-width="1.8"/>
    <circle cx="336" cy="150" r="3" fill="none" stroke="#2b3a42" stroke-width="1.8"/>
    <line x1="327" y1="150" x2="333" y2="150" stroke="#2b3a42" stroke-width="1.8"/>
    <path d="M324 160 Q330 165 336 160" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="319" y="167" width="22" height="42" rx="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="323" y1="209" x2="321" y2="238" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="337" y1="209" x2="339" y2="238" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="319" y1="176" x2="382" y2="184" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <!-- child -->
    <circle cx="400" cy="176" r="11" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M389 174 A11 11 0 0 1 411 174 Z" fill="#2b3a42"/>
    <circle cx="396" cy="176" r="1.6" fill="#2b3a42"/>
    <circle cx="404" cy="176" r="1.6" fill="#2b3a42"/>
    <path d="M396 183 Q400 187 404 183" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="392" y="188" width="16" height="26" rx="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="396" y1="214" x2="394" y2="238" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="404" y1="214" x2="406" y2="238" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="378" y="258" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">we walk together</text>

  <!-- ===== Panel 3: two grown-ups and a child ===== -->
  <g>
    <circle cx="90" cy="150" r="15" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M75 148 A15 15 0 0 1 105 148 Z" fill="#2b3a42"/>
    <circle cx="84" cy="150" r="1.8" fill="#2b3a42"/>
    <circle cx="96" cy="150" r="1.8" fill="#2b3a42"/>
    <path d="M84 159 Q90 164 96 159" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="80" y="166" width="20" height="40" rx="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="84" y1="206" x2="82" y2="232" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="96" y1="206" x2="98" y2="232" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <!-- grown-up with hearing aid -->
    <circle cx="156" cy="150" r="15" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M141 148 A15 15 0 0 1 171 148 Z" fill="#4f6d7a"/>
    <path d="M172 146 A7 7 0 0 1 172 158" fill="none" stroke="#e0a458" stroke-width="5" stroke-linecap="round"/>
    <circle cx="174" cy="152" r="2.4" fill="#e0a458"/>
    <circle cx="150" cy="150" r="1.8" fill="#2b3a42"/>
    <circle cx="162" cy="150" r="1.8" fill="#2b3a42"/>
    <path d="M150 159 Q156 164 162 159" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="146" y="166" width="20" height="40" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="150" y1="206" x2="148" y2="232" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="162" y1="206" x2="164" y2="232" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <!-- child in the middle holding hands -->
    <circle cx="123" cy="176" r="10" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M113 174 A10 10 0 0 1 133 174 Z" fill="#2b3a42"/>
    <circle cx="119" cy="176" r="1.6" fill="#2b3a42"/>
    <circle cx="127" cy="176" r="1.6" fill="#2b3a42"/>
    <path d="M119 183 Q123 187 127 183" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="115" y="187" width="16" height="24" rx="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="119" y1="211" x2="117" y2="232" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="127" y1="211" x2="129" y2="232" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="100" y1="180" x2="117" y2="180" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="129" y1="180" x2="146" y2="180" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="134" y="452" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">we hold hands</text>

  <!-- ===== Panel 4: older child and younger child carrying water ===== -->
  <g>
    <circle cx="330" cy="168" r="13" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M317 166 A13 13 0 0 1 343 166 Z" fill="#2b3a42"/>
    <circle cx="324" cy="168" r="1.6" fill="#2b3a42"/>
    <circle cx="336" cy="168" r="1.6" fill="#2b3a42"/>
    <path d="M324 176 Q330 180 336 176" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="318" y="182" width="24" height="34" rx="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="323" y1="216" x2="321" y2="240" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="337" y1="216" x2="339" y2="240" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <!-- water pot on shoulder -->
    <circle cx="344" cy="184" r="12" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="330" y1="186" x2="344" y2="186" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <!-- younger child -->
    <circle cx="396" cy="188" r="10" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M386 186 A10 10 0 0 1 406 186 Z" fill="#4f6d7a"/>
    <circle cx="392" cy="188" r="1.6" fill="#2b3a42"/>
    <circle cx="400" cy="188" r="1.6" fill="#2b3a42"/>
    <path d="M392 195 Q396 199 400 195" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="388" y="199" width="16" height="24" rx="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="392" y1="223" x2="390" y2="240" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="400" y1="223" x2="402" y2="240" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="378" y="452" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">we fetch water together</text>

  <!-- Bottom note -->
  <text x="256" y="488" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Caring and being together make a family.</text>
</svg>
