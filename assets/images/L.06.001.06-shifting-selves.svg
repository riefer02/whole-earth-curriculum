<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">My many selves shift by context</title>
  <desc id="d">Three panels, each showing the same person in a different context with a different part of themselves in front. Panel one is "with family" — I speak my home language. Panel two is "at school" — I am the careful one. Panel three is "with friends" — I am the one who makes jokes. Each panel shows a varied figure. A banner at the bottom reads "Different contexts bring different parts of me forward — all of them are me." Shapes and labels, not color alone, carry the meaning, so the diagram prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">My Many Selves Shift by Context</text>

  <!-- Panel 1 -->
  <rect x="24" y="64" width="148" height="300" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="98" y="92" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">with family</text>
  <!-- figure 1 -->
  <circle cx="98" cy="170" r="28" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="90" cy="164" r="3" fill="#2b3a42"/>
  <circle cx="106" cy="164" r="3" fill="#2b3a42"/>
  <path d="M90 178 Q98 184 106 178" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M98 198 L98 262" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M98 262 L78 318" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M98 262 L118 318" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M76 214 L120 214" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <!-- speech bubble -->
  <rect x="60" y="328" width="76" height="26" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="98" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">home language</text>
  <text x="98" y="374" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">I speak my</text>
  <text x="98" y="391" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">home language</text>

  <!-- Panel 2 -->
  <rect x="182" y="64" width="148" height="300" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="92" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">at school</text>
  <!-- figure 2 (with glasses) -->
  <circle cx="256" cy="170" r="28" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
  <g fill="none" stroke="#2b3a42" stroke-width="2">
    <circle cx="248" cy="166" r="8"/>
    <circle cx="264" cy="166" r="8"/>
    <line x1="256" y1="166" x2="256" y2="166"/>
  </g>
  <circle cx="248" cy="166" r="2.5" fill="#2b3a42"/>
  <circle cx="264" cy="166" r="2.5" fill="#2b3a42"/>
  <path d="M248 180 Q256 186 264 180" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M256 198 L256 262" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M256 262 L236 318" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M256 262 L276 318" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M234 214 L278 214" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="256" y="374" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">I am the</text>
  <text x="256" y="391" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">careful one</text>

  <!-- Panel 3 -->
  <rect x="340" y="64" width="148" height="300" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="414" y="92" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">with friends</text>
  <!-- figure 3 -->
  <circle cx="414" cy="170" r="28" fill="#8a5a3b" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="406" cy="164" r="3" fill="#2b3a42"/>
  <circle cx="422" cy="164" r="3" fill="#2b3a42"/>
  <path d="M406 178 Q414 186 422 178" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M414 198 L414 262" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M414 262 L394 318" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M414 262 L434 318" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M392 214 L436 214" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="414" y="374" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">I am the one</text>
  <text x="414" y="391" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">who makes jokes</text>

  <!-- Banner -->
  <rect x="24" y="392" width="464" height="68" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">Different contexts bring different parts of me forward</text>
  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">— all of them are me.</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Shifting is a skill, not a fake self.</text>
</svg>
