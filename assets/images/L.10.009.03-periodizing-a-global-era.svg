<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Periodizing a global era</title>
  <desc id="desc">A horizontal timeline from 1400 to 1900 divided by three candidate turning points: around 1492 (the Columbian Exchange joining the hemispheres), the late 1700s, and the 1800s (industrial take-off). Each marker has an evidence note below. Grayscale-printable.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222222" font-weight="bold">Where does a global era turn?</text>
  <!-- Timeline -->
  <line x1="48" y1="120" x2="464" y2="120" stroke="#2b3a42" stroke-width="3"/>
  <g fill="#2b3a42" font-family="sans-serif" font-size="13">
    <text x="44" y="104" text-anchor="middle">1400</text>
    <text x="160" y="104" text-anchor="middle">1600</text>
    <text x="300" y="104" text-anchor="middle">1800</text>
    <text x="464" y="104" text-anchor="middle">1900</text>
  </g>
  <!-- Period bands -->
  <rect x="48" y="134" width="150" height="18" fill="#7a9e7e" opacity="0.35" stroke="none"/>
  <rect x="198" y="134" width="116" height="18" fill="#6b93b6" opacity="0.35" stroke="none"/>
  <rect x="314" y="134" width="150" height="18" fill="#e0a458" opacity="0.35" stroke="none"/>
  <!-- Turning point markers -->
  <g>
    <circle cx="198" cy="120" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="198" y1="127" x2="198" y2="150" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <g>
    <circle cx="314" cy="120" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="314" y1="127" x2="314" y2="150" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <!-- Notes -->
  <g font-family="sans-serif" font-size="13" fill="#222222">
    <text x="198" y="176" text-anchor="middle" font-weight="bold">c. 1492</text>
    <text x="198" y="194" text-anchor="middle">Columbian Exchange</text>
    <text x="198" y="212" text-anchor="middle">hemispheres join —</text>
    <text x="198" y="230" text-anchor="middle">crops, peoples, power</text>
    <text x="198" y="248" text-anchor="middle">move across oceans</text>
    <text x="314" y="176" text-anchor="middle" font-weight="bold">c. 1760s–1800s</text>
    <text x="314" y="194" text-anchor="middle">industrial take-off</text>
    <text x="314" y="212" text-anchor="middle">machines remake work,</text>
    <text x="314" y="230" text-anchor="middle">cities, energy, and</text>
    <text x="314" y="248" text-anchor="middle">the environment</text>
  </g>
  <!-- Defense box -->
  <rect x="48" y="280" width="416" height="196" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="312" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222222" font-weight="bold">Defending a turning point</text>
  <text x="256" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">1. Propose: where did change run deepest across regions?</text>
  <text x="256" y="362" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">2. Evidence: what actually changed, and for whom?</text>
  <text x="256" y="384" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">3. Answer a counterclaim: "but it was uneven…" — yes, yet</text>
  <text x="256" y="406" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">   the connected system dates from then.</text>
  <text x="256" y="428" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">4. Say what counts as significant: whose turning point is it?</text>
  <text x="256" y="458" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Periodization is an argument defended with evidence — not a fact to find.</text>
</svg>
