<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Capstone — my voice among many voices</title>
  <desc id="desc">A central circle labeled "my voice" surrounded by eight smaller labeled circles — word choice, debate, point of view, figurative language, many cultures, writing forms, citing, translation — connected by lines. A note reads "all of it becomes one voice among many".</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">My Voice Among Many Voices</text>

  <!-- central circle -->
  <circle cx="256" cy="256" r="66" fill="#e0a458" opacity="0.6" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="250" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">my voice</text>
  <text x="256" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">among many</text>

  <!-- eight small circles -->
  <circle cx="256" cy="110" r="44" fill="#6b93b6" opacity="0.45" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#222222">word choice</text>
  <text x="256" y="122" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">tone · delivery</text>
  <line x1="256" y1="154" x2="256" y2="190" stroke="#2b3a42" stroke-width="2"/>

  <circle cx="106" cy="172" r="44" fill="#7a9e7e" opacity="0.5" stroke="#2b3a42" stroke-width="2"/>
  <text x="106" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#222222">debate</text>
  <text x="106" y="184" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">listen · argue</text>
  <line x1="140" y1="200" x2="196" y2="232" stroke="#2b3a42" stroke-width="2"/>

  <circle cx="106" cy="340" r="44" fill="#6b93b6" opacity="0.45" stroke="#2b3a42" stroke-width="2"/>
  <text x="106" y="336" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#222222">point of view</text>
  <text x="106" y="352" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">whose eyes?</text>
  <line x1="140" y1="312" x2="196" y2="280" stroke="#2b3a42" stroke-width="2"/>

  <circle cx="256" cy="402" r="44" fill="#e0a458" opacity="0.6" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="398" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#222222">figurative</text>
  <text x="256" y="414" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">language · tone</text>
  <line x1="256" y1="358" x2="256" y2="322" stroke="#2b3a42" stroke-width="2"/>

  <circle cx="406" cy="340" r="44" fill="#7a9e7e" opacity="0.5" stroke="#2b3a42" stroke-width="2"/>
  <text x="406" y="336" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#222222">many</text>
  <text x="406" y="352" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#222222">cultures</text>
  <line x1="372" y1="312" x2="316" y2="280" stroke="#2b3a42" stroke-width="2"/>

  <circle cx="406" cy="172" r="44" fill="#e0a458" opacity="0.6" stroke="#2b3a42" stroke-width="2"/>
  <text x="406" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#222222">writing</text>
  <text x="406" y="184" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#222222">forms</text>
  <line x1="372" y1="200" x2="316" y2="232" stroke="#2b3a42" stroke-width="2"/>

  <circle cx="150" cy="110" r="44" fill="#7a9e7e" opacity="0.5" stroke="#2b3a42" stroke-width="2"/>
  <text x="150" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#222222">citing</text>
  <text x="150" y="122" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">sources</text>
  <line x1="182" y1="146" x2="210" y2="180" stroke="#2b3a42" stroke-width="2"/>

  <circle cx="362" cy="110" r="44" fill="#6b93b6" opacity="0.45" stroke="#2b3a42" stroke-width="2"/>
  <text x="362" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#222222">translation</text>
  <text x="362" y="122" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">used critically</text>
  <line x1="330" y1="146" x2="302" y2="180" stroke="#2b3a42" stroke-width="2"/>

  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">All of it becomes one voice among many.</text>
</svg>
