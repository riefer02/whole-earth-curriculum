<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Asking for help</title>
  <desc id="desc">A child raises one hand and says "I need help" in a speech bubble, while a trusted grown-up stands nearby with an open, welcoming hand. Both figures are labeled child and trusted grown-up. Words and shapes, not color alone, carry the meaning, so it prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Asking for Help</text>

  <!-- Ground -->
  <rect x="0" y="380" width="512" height="132" fill="#dbe6d2"/>
  <line x1="0" y1="380" x2="512" y2="380" stroke="#4f6d7a" stroke-width="2"/>

  <!-- Child (light skin), raising hand -->
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="176" cy="232" r="30" fill="#f5d6b6"/>
    <rect x="154" y="264" width="44" height="78" rx="16" fill="#7a9e7e"/>
    <!-- raised arm -->
    <line x1="190" y1="276" x2="212" y2="214" stroke-width="16" stroke="#f5d6b6"/>
    <circle cx="214" cy="210" r="10" fill="#f5d6b6"/>
    <!-- other arm down -->
    <line x1="160" y1="276" x2="144" y2="320" stroke-width="16" stroke="#f5d6b6"/>
    <!-- legs -->
    <line x1="166" y1="340" x2="162" y2="378" stroke-width="18" stroke="#4f6d7a"/>
    <line x1="186" y1="340" x2="190" y2="378" stroke-width="18" stroke="#4f6d7a"/>
    <!-- face -->
    <circle cx="166" cy="226" r="3.5" fill="#2b3a42"/>
    <circle cx="186" cy="226" r="3.5" fill="#2b3a42"/>
    <path d="M168 244 Q176 250 184 244" fill="none" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="176" y="416" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">child</text>

  <!-- Speech bubble -->
  <g>
    <path d="M216 150 Q216 130 244 130 L320 130 Q348 130 348 150 L348 176 Q348 196 320 196 L252 196 L238 212 L238 196 Q216 196 216 176 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="282" y="172" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">I need help</text>
  </g>

  <!-- Grown-up (deep skin), open hand -->
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="376" cy="224" r="32" fill="#8f5f3d"/>
    <rect x="352" y="258" width="48" height="86" rx="16" fill="#6b93b6"/>
    <!-- open hand raised -->
    <line x1="362" y1="272" x2="338" y2="216" stroke-width="16" stroke="#8f5f3d"/>
    <path d="M332 214 L332 202 L344 202 L344 214 Z" fill="#8f5f3d"/>
    <!-- other arm -->
    <line x1="394" y1="272" x2="410" y2="312" stroke-width="16" stroke="#8f5f3d"/>
    <!-- legs -->
    <line x1="366" y1="342" x2="362" y2="378" stroke-width="18" stroke="#4f6d7a"/>
    <line x1="386" y1="342" x2="390" y2="378" stroke-width="18" stroke="#4f6d7a"/>
    <!-- face -->
    <circle cx="366" cy="218" r="3.5" fill="#2b3a42"/>
    <circle cx="386" cy="218" r="3.5" fill="#2b3a42"/>
    <path d="M368 236 Q376 242 384 236" fill="none" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="376" y="416" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">trusted grown-up</text>

  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">When you are hurt, scared, or unsafe, ask a grown-up you trust.</text>
  <text x="256" y="490" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Asking for help is strong, not weak.</text>
</svg>
