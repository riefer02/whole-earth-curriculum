<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" font-family="sans-serif">
  <title>A plant life cycle in order</title>
  <desc>A circle of five stages joined by arrows, numbered one to five: seed, sprout, seedling, flower, and fruit with seeds again. Each stage is drawn and labeled.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-size="25" fill="#222222" font-weight="bold">A plant life cycle, in order</text>

  <!-- center label -->
  <circle cx="256" cy="256" r="56" fill="#e0a458" opacity="0.25" stroke="#e0a458" stroke-width="2"/>
  <text x="256" y="250" text-anchor="middle" font-size="16" fill="#222222">life</text>
  <text x="256" y="272" text-anchor="middle" font-size="16" fill="#222222">cycle</text>

  <!-- 1 seed (top) -->
  <circle cx="256" cy="120" r="38" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="108" text-anchor="middle" font-size="15" fill="#2b3a42" font-weight="bold">1</text>
  <ellipse cx="256" cy="130" rx="12" ry="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="172" text-anchor="middle" font-size="15" fill="#222222">seed</text>

  <!-- 2 sprout (top right) -->
  <circle cx="392" cy="196" r="38" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="392" y="184" text-anchor="middle" font-size="15" fill="#2b3a42" font-weight="bold">2</text>
  <path d="M386 208 q6 -14 12 0" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <line x1="392" y1="208" x2="392" y2="196" stroke="#7a9e7e" stroke-width="3"/>
  <text x="392" y="248" text-anchor="middle" font-size="15" fill="#222222">sprout</text>

  <!-- 3 seedling (right-bottom) -->
  <circle cx="338" cy="360" r="38" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="338" y="348" text-anchor="middle" font-size="15" fill="#2b3a42" font-weight="bold">3</text>
  <line x1="338" y1="376" x2="338" y2="352" stroke="#4f6d7a" stroke-width="3"/>
  <path d="M330 362 q8 -10 16 0" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <path d="M330 350 q8 -10 16 0" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="338" y="412" text-anchor="middle" font-size="15" fill="#222222">seedling</text>

  <!-- 4 flower (left-bottom) -->
  <circle cx="174" cy="360" r="38" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="174" y="348" text-anchor="middle" font-size="15" fill="#2b3a42" font-weight="bold">4</text>
  <circle cx="174" cy="364" r="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="166" cy="354" r="7" fill="#6b93b6" opacity="0.7" stroke="#2b3a42" stroke-width="1.5"/>
  <circle cx="182" cy="354" r="7" fill="#6b93b6" opacity="0.7" stroke="#2b3a42" stroke-width="1.5"/>
  <circle cx="166" cy="374" r="7" fill="#6b93b6" opacity="0.7" stroke="#2b3a42" stroke-width="1.5"/>
  <circle cx="182" cy="374" r="7" fill="#6b93b6" opacity="0.7" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="174" y="412" text-anchor="middle" font-size="15" fill="#222222">flower</text>

  <!-- 5 fruit with seeds (left) -->
  <circle cx="123" cy="213" r="38" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="123" y="201" text-anchor="middle" font-size="15" fill="#2b3a42" font-weight="bold">5</text>
  <circle cx="123" cy="217" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="117" cy="213" r="3" fill="#2b3a42"/>
  <circle cx="129" cy="219" r="3" fill="#2b3a42"/>
  <circle cx="123" cy="223" r="3" fill="#2b3a42"/>
  <text x="123" y="265" text-anchor="middle" font-size="15" fill="#222222">fruit + seeds</text>

  <!-- arrows between: 1->2->3->4->5->1 around the ring -->
  <path d="M292 132 Q340 150 360 178" fill="none" stroke="#4f6d7a" stroke-width="3"/>
  <polygon points="358,174 370,186 352,186" fill="#4f6d7a"/>
  <path d="M384 234 Q372 280 358 322" fill="none" stroke="#4f6d7a" stroke-width="3"/>
  <polygon points="354,320 350,334 362,326" fill="#4f6d7a"/>
  <path d="M300 360 L212 360" fill="none" stroke="#4f6d7a" stroke-width="3"/>
  <polygon points="214,356 202,360 214,364" fill="#4f6d7a"/>
  <path d="M150 328 Q132 270 128 251" fill="none" stroke="#4f6d7a" stroke-width="3"/>
  <polygon points="124,253 128,239 136,251" fill="#4f6d7a"/>
  <path d="M140 180 Q170 140 218 126" fill="none" stroke="#4f6d7a" stroke-width="3"/>
  <polygon points="216,122 230,124 220,134" fill="#4f6d7a"/>

  <text x="256" y="478" text-anchor="middle" font-size="15" fill="#4f6d7a">Around and around it goes — seeds make more seeds.</text>
</svg>
