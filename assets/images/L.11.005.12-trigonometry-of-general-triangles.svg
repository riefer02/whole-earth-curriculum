<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Trigonometry of General Triangles</title>
  <desc id="desc">A general triangle with sides a, b, c and opposite angles A, B, C. The Law of Sines and Law of Cosines are written beside it. Below, a surveying scene shows a river with a tree on the far bank and a baseline of 100 meters on the near bank with two sighting angles, illustrating measuring a distance that cannot be walked.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Solving Any Triangle</text>

  <!-- general triangle -->
  <polygon points="90,150 240,110 250,230" fill="#7a9e7e" fill-opacity="0.3" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="86" y="178" font-family="sans-serif" font-size="15" fill="#222222">A</text>
  <text x="238" y="102" font-family="sans-serif" font-size="15" fill="#222222">B</text>
  <text x="258" y="240" font-family="sans-serif" font-size="15" fill="#222222">C</text>
  <text x="160" y="118" font-family="sans-serif" font-size="14" fill="#222222">c</text>
  <text x="176" y="196" font-family="sans-serif" font-size="14" fill="#222222">a</text>
  <text x="120" y="132" font-family="sans-serif" font-size="14" fill="#222222">b</text>

  <!-- laws -->
  <text x="390" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a" font-weight="bold">Law of Sines</text>
  <text x="390" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">a/sin A = b/sin B = c/sin C</text>
  <text x="390" y="180" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a" font-weight="bold">Law of Cosines</text>
  <text x="390" y="208" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">c&#178; = a&#178; + b&#178; &#8722; 2ab&#183;cos C</text>

  <!-- surveying scene -->
  <rect x="60" y="280" width="392" height="170" fill="#ffffff" stroke="#6b93b6" stroke-width="2" rx="8"/>
  <text x="256" y="306" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a" font-weight="bold">Measuring across a river (triangulation)</text>
  <!-- river band -->
  <path d="M 60 360 Q 160 340 256 360 T 452 358" fill="#6b93b6" fill-opacity="0.35" stroke="none"/>
  <text x="330" y="354" font-family="sans-serif" font-size="12" fill="#4f6d7a">river</text>
  <!-- tree -->
  <rect x="120" y="296" width="6" height="26" fill="#7a9e7e"/>
  <circle cx="123" cy="296" r="12" fill="#7a9e7e"/>
  <text x="106" y="330" font-family="sans-serif" font-size="12" fill="#222222">tree</text>
  <!-- baseline -->
  <line x1="150" y1="420" x2="380" y2="420" stroke="#2b3a42" stroke-width="3"/>
  <text x="265" y="444" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">baseline = 100 m</text>
  <!-- sight lines -->
  <line x1="150" y1="420" x2="123" y2="308" stroke="#e0a458" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="380" y1="420" x2="123" y2="308" stroke="#e0a458" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="140" y="392" font-family="sans-serif" font-size="13" fill="#222222">65&#176;</text>
  <text x="332" y="392" font-family="sans-serif" font-size="13" fill="#222222">50&#176;</text>
  <text x="240" y="398" font-family="sans-serif" font-size="12" fill="#4f6d7a">sight two angles, solve the triangle</text>

  <text x="256" y="482" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">The triangle does the walking for you.</text>
</svg>
