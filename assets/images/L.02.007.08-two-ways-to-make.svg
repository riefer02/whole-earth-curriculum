<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Two ways to make: compare and choose</title>
  <desc id="desc">Two ways to solve the same making problem sit side by side. Way A shows a bridge made of a single stick that sags down in the middle under a stone, labeled way A. Way B shows a bridge of two sticks bound together that holds the stone straight, with a check mark and labeled way B. Below, a speech bubble is labeled why: it is stronger. Labels, arrows, and the check mark carry all meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Two Ways to Make</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Compare two ways, choose one, say why.</text>

  <!-- way A -->
  <text x="128" y="112" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#6b93b6">way A</text>
  <g stroke="#2b3a42" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M64 210 L192 210"/>
    <path d="M64 210 L64 172"/>
    <path d="M192 210 L192 172"/>
    <path d="M64 210 Q128 244 192 210" stroke-width="5"/>
  </g>
  <circle cx="128" cy="236" r="12" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <text x="128" y="282" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">one stick — it sags</text>

  <!-- way B -->
  <text x="384" y="112" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#7a9e7e">way B</text>
  <g stroke="#2b3a42" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M320 210 L448 210"/>
    <path d="M320 210 L320 172"/>
    <path d="M448 210 L448 172"/>
    <path d="M320 210 L448 210" stroke-width="5"/>
    <path d="M320 204 L448 204" stroke-width="5" stroke="#4f6d7a"/>
  </g>
  <circle cx="384" cy="236" r="12" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <!-- check mark -->
  <g stroke="#7a9e7e" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M412 120 L424 132 L444 110"/>
  </g>
  <text x="384" y="282" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">two sticks — it holds</text>

  <!-- speech bubble -->
  <g>
    <path d="M156 336 Q156 306 206 306 L306 306 Q356 306 356 336 L356 362 Q356 378 340 378 L240 378 L206 396 L214 378 L196 378 Q180 378 168 366 Q156 354 156 336 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="256" y="342" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">I choose way B</text>
    <text x="256" y="362" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4f6d7a">why: it is stronger</text>
  </g>

  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">a choice with a reason is a design</text>
</svg>
