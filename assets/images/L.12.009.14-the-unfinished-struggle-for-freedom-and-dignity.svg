<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The Unfinished Struggle for Freedom and Dignity</title>
  <desc id="desc">A wide path runs left to right across the page. Its beginning, on the left, is drawn as a solid band; from the middle onward it becomes a dashed band that carries on past the right edge of the page. A green milestone post above the solid path is labelled "won here" and "a freedom already won". An orange milestone post below the solid path is labelled "still fought here" and "a dignity still denied". On the dashed part of the path stands a small figure labelled "you", with the words "one concrete step, with and for others". Two closing lines read that the path continues past the edge and the story now includes you, and that "unfinished" is a word of time, not of defeat. Every marker is named in words as well as colour.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">The Unfinished Struggle for Freedom and Dignity</text>
  <text x="256" y="74" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">Drawn clearly at its beginning — and still going.</text>

  <!-- the path: solid at its beginning, dashed as it continues past the edge -->
  <path d="M28 270 H280" stroke="#4f6d7a" stroke-width="14" stroke-linecap="round"/>
  <path d="M294 270 H484" stroke="#6b93b6" stroke-width="14" stroke-linecap="round" stroke-dasharray="15 11"/>
  <!-- small steps worn into the solid part -->
  <g stroke="#fdfbf7" stroke-width="2.5" stroke-opacity="0.75">
    <path d="M60 264 V276 M92 264 V276 M156 264 V276 M188 264 V276 M264 264 V276"/>
  </g>

  <!-- milestone: a freedom already won -->
  <path d="M120 270 V208" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="120" cy="208" r="11" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="120" y="184" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#2b3a42">won here</text>
  <text x="120" y="166" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">a freedom already won</text>

  <!-- milestone: a dignity still denied -->
  <path d="M250 270 V340" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="250" cy="346" r="11" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="250" y="372" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#2b3a42">still fought here</text>
  <text x="250" y="390" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">a dignity still denied</text>

  <!-- you, standing where the path becomes dashed -->
  <circle cx="380" cy="230" r="9" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M380 239 V257" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <path d="M371 247 H389" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <path d="M380 257 L373 263 M380 257 L387 263" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <text x="380" y="214" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">you</text>
  <text x="380" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">one concrete step,</text>
  <text x="380" y="336" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">with and for others</text>

  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">The path continues past the edge — the story now includes you.</text>
  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">&#8220;Unfinished&#8221; is a word of time, not of defeat.</text>
</svg>
