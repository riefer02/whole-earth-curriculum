<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Our Earth home: tools, media, living, and care</title>
  <desc id="d">A big Earth circle divided into four labeled parts. Tools shows a hand pump. Media shows a book and a screen. Living shows a plant and a frog. Care shows a tap turned off and a bin. The four words Tools, Media, Living, and Care are printed inside each part, so the meaning does not depend on color and it prints in grayscale. The closing line teaches that tools, media, living things, and care all belong to one shared home.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">Our Earth home</text>

  <!-- Earth circle -->
  <circle cx="256" cy="280" r="190" fill="#fdfbf7" stroke="#2b3a42" stroke-width="6"/>
  <line x1="256" y1="90" x2="256" y2="470" stroke="#2b3a42" stroke-width="4"/>
  <line x1="66" y1="280" x2="446" y2="280" stroke="#2b3a42" stroke-width="4"/>

  <!-- Tools -->
  <text x="160" y="150" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">TOOLS</text>
  <rect x="136" y="166" width="30" height="20" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="3"/>
  <line x1="151" y1="186" x2="151" y2="212" stroke="#2b3a42" stroke-width="4"/>

  <!-- Media -->
  <text x="356" y="150" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">MEDIA</text>
  <rect x="318" y="166" width="34" height="44" rx="4" fill="#4f6d7a" stroke="#2b3a42" stroke-width="3"/>
  <rect x="360" y="170" width="34" height="28" rx="4" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>

  <!-- Living -->
  <text x="160" y="400" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">LIVING</text>
  <line x1="140" y1="424" x2="140" y2="398" stroke="#2b3a42" stroke-width="4"/>
  <path d="M140 398 q8 -10 0 -16" fill="none" stroke="#7a9e7e" stroke-width="4"/>
  <ellipse cx="180" cy="414" rx="20" ry="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>

  <!-- Care -->
  <text x="356" y="400" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">CARE</text>
  <rect x="330" y="410" width="16" height="26" fill="#4f6d7a" stroke="#2b3a42" stroke-width="3"/>
  <line x1="330" y1="420" x2="318" y2="420" stroke="#2b3a42" stroke-width="4"/>
  <rect x="376" y="412" width="26" height="24" rx="3" fill="#4f6d7a" stroke="#2b3a42" stroke-width="3"/>

  <text x="256" y="496" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">Tools, media, living things, and care — all in one shared home.</text>
</svg>
