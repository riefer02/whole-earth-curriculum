<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Eyes and ears together</title>
  <desc id="desc">A child in the center watches and listens to a bouncing ball. An eye icon sends one dotted line to a central box, and an ear icon sends another dotted line, and the box is labeled fuller picture. The diagram shows sight and hearing meeting in the middle. Words and shapes carry the meaning, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Sight + Hearing = Fuller Picture</text>

  <!-- ===== Child in center ===== -->
  <g>
    <!-- body -->
    <circle cx="256" cy="180" r="54" fill="#d6d1c7" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M226 162 A54 54 0 0 1 286 162 L286 148 Q256 126 226 148 Z" fill="#2b3a42"/>
    <!-- eyes (open, looking right) -->
    <ellipse cx="240" cy="178" rx="9" ry="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="243" cy="178" r="3.5" fill="#2b3a42"/>
    <ellipse cx="270" cy="178" rx="9" ry="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="273" cy="178" r="3.5" fill="#2b3a42"/>
    <!-- ears -->
    <path d="M202 168 Q192 176 200 192" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <path d="M310 168 Q320 176 312 192" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <!-- nose + mouth -->
    <path d="M252 188 Q256 196 248 200 L262 200 Q254 196 258 188 Z" fill="#c9bdb0" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M240 210 Q256 222 272 210" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <!-- torso -->
    <path d="M226 232 Q256 244 286 232 L292 320 Q256 336 220 320 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- arms reaching toward ball -->
    <path d="M292 244 Q330 260 352 292" fill="none" stroke="#d6d1c7" stroke-width="8" stroke-linecap="round"/>
    <path d="M292 244 Q330 260 352 292" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <!-- ball -->
    <circle cx="366" cy="300" r="22" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M352 288 Q366 300 380 288" fill="none" stroke="#2b3a42" stroke-width="1.5"/>
    <path d="M352 312 Q366 300 380 312" fill="none" stroke="#2b3a42" stroke-width="1.5"/>
    <!-- motion arc under ball -->
    <path d="M344 326 Q366 346 388 326" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- ===== Eye icon (left) ===== -->
  <g>
    <ellipse cx="84" cy="330" rx="30" ry="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <circle cx="84" cy="330" r="8" fill="#2b3a42"/>
    <text x="84" y="372" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">sight</text>
    <text x="84" y="390" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">where it is</text>
  </g>

  <!-- ===== Ear icon (right) ===== -->
  <g>
    <path d="M430 314 Q418 326 428 344" fill="none" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <text x="434" y="372" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">hearing</text>
    <text x="434" y="390" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">what sound</text>
  </g>

  <!-- ===== Dotted lines to center box ===== -->
  <line x1="112" y1="330" x2="210" y2="430" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="402" y1="330" x2="310" y2="430" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- ===== Fuller picture box ===== -->
  <rect x="180" y="428" width="152" height="48" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">fuller picture</text>
  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">where + what sound</text>

  <text x="256" y="502" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Each sense adds a clue the other misses.</text>
</svg>
