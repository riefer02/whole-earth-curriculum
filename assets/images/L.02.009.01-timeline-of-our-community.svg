<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A timeline of our community</title>
  <desc id="desc">A simple timeline drawn as a long horizontal arrow. The left end is labeled "long ago" and the right end is labeled "now". Along the line are four empty round spots, marked one, two, three, and four, where events can be placed in order. A dotted arrow runs from left to right to show time moving from the past toward today. The labels, the arrow, and the numbered spots — not color — carry the meaning, so the picture prints clearly in grayscale and teaches that a timeline orders events from long ago to now.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">A Timeline of Our Community</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">A line that orders events from long ago to now</text>

  <!-- end labels -->
  <text x="70" y="130" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">long ago</text>
  <text x="442" y="130" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">now</text>

  <!-- the timeline arrow -->
  <line x1="46" y1="230" x2="466" y2="230" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  <path d="M466 222 L482 230 L466 238 Z" fill="#2b3a42"/>

  <!-- dotted flow arrow below -->
  <line x1="70" y1="286" x2="442" y2="286" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/>
  <path d="M442 278 L454 286 L442 294 Z" fill="#4f6d7a"/>

  <!-- four event spots -->
  <circle cx="120" cy="230" r="26" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="215" cy="230" r="26" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="310" cy="230" r="26" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="405" cy="230" r="26" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>

  <text x="120" y="236" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#4f6d7a">1</text>
  <text x="215" y="236" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#4f6d7a">2</text>
  <text x="310" y="236" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#4f6d7a">3</text>
  <text x="405" y="236" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#4f6d7a">4</text>

  <text x="120" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">event 1</text>
  <text x="215" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">event 2</text>
  <text x="310" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">event 3</text>
  <text x="405" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">event 4</text>

  <text x="256" y="380" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">before &#183; after &#183; the order tells the story of time</text>
  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">One tool among many &#183; every family&#8217;s order is real</text>
</svg>
