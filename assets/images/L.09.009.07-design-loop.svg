<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title>Design process loop</title>
  <desc>A circular five-step design process — imagine, plan, make, test, improve — around a fabrication tool icon, with arrows showing the cycle repeats.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="34" font-family="system-ui, sans-serif" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">The design loop</text>

  <!-- central fabrication icon: 3D printer -->
  <rect x="206" y="240" width="100" height="66" rx="6" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <rect x="218" y="252" width="76" height="44" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="206" y1="268" x2="218" y2="268" stroke="#2b3a42" stroke-width="2"/>
  <line x1="294" y1="268" x2="306" y2="268" stroke="#2b3a42" stroke-width="2"/>
  <rect x="240" y="284" width="32" height="16" rx="2" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="328" font-family="system-ui, sans-serif" font-size="13" fill="#4f6d7a" text-anchor="middle">digital fabrication tool</text>

  <!-- five steps around a circle -->
  <circle cx="256" cy="200" r="180" fill="none" stroke="#2b3a42" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- imagine (top) -->
  <circle cx="256" cy="52" r="30" fill="#6b93b6" opacity="0.5" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="58" font-family="system-ui, sans-serif" font-size="14" fill="#222222" text-anchor="middle">imagine</text>

  <!-- plan (upper right) -->
  <circle cx="410" cy="128" r="30" fill="#7a9e7e" opacity="0.5" stroke="#2b3a42" stroke-width="2"/>
  <text x="410" y="134" font-family="system-ui, sans-serif" font-size="14" fill="#222222" text-anchor="middle">plan</text>

  <!-- make (lower right) -->
  <circle cx="410" cy="272" r="30" fill="#e0a458" opacity="0.5" stroke="#2b3a42" stroke-width="2"/>
  <text x="410" y="278" font-family="system-ui, sans-serif" font-size="14" fill="#222222" text-anchor="middle">make</text>

  <!-- test (lower left) -->
  <circle cx="102" cy="272" r="30" fill="#7a9e7e" opacity="0.5" stroke="#2b3a42" stroke-width="2"/>
  <text x="102" y="278" font-family="system-ui, sans-serif" font-size="14" fill="#222222" text-anchor="middle">test</text>

  <!-- improve (upper left) -->
  <circle cx="102" cy="128" r="30" fill="#6b93b6" opacity="0.5" stroke="#2b3a42" stroke-width="2"/>
  <text x="102" y="134" font-family="system-ui, sans-serif" font-size="14" fill="#222222" text-anchor="middle">improve</text>

  <!-- arrows connecting steps -->
  <path d="M 278 72 A 180 180 0 0 1 390 108" fill="none" stroke="#4f6d7a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 432 148 A 180 180 0 0 1 432 252" fill="none" stroke="#4f6d7a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 390 292 A 180 180 0 0 1 278 328" fill="none" stroke="#4f6d7a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 122 292 A 180 180 0 0 1 80 252" fill="none" stroke="#4f6d7a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 80 148 A 180 180 0 0 1 122 108" fill="none" stroke="#4f6d7a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- caption -->
  <text x="256" y="480" font-family="system-ui, sans-serif" font-size="13" fill="#4f6d7a" text-anchor="middle">each pass through the loop improves the object</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4f6d7a"/>
    </marker>
  </defs>
</svg>
