<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Earth as One Interconnected System</title>
  <desc id="desc">A circle of four reservoirs — air, ocean, land, life — connected by arrows showing carbon and water moving among them. The Sun is drawn above, driving the flows, and a label for the greenhouse effect (heat trapped by gases) sits below. Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42" font-weight="bold">One Earth, One System</text>

  <!-- sun -->
  <circle cx="256" cy="92" r="26" fill="none" stroke="#e0a458" stroke-width="3"/>
  <g stroke="#e0a458" stroke-width="2">
    <line x1="256" y1="58" x2="256" y2="50"/>
    <line x1="256" y1="126" x2="256" y2="134"/>
    <line x1="222" y1="92" x2="214" y2="92"/>
    <line x1="290" y1="92" x2="298" y2="92"/>
    <line x1="232" y1="68" x2="226" y2="62"/>
    <line x1="280" y1="68" x2="286" y2="62"/>
    <line x1="232" y1="116" x2="226" y2="122"/>
    <line x1="280" y1="116" x2="286" y2="122"/>
  </g>
  <text x="256" y="162" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">energy from the Sun drives the flows</text>

  <!-- reservoirs: air top-left, ocean top-right, land bottom-left, life bottom-right -->
  <rect x="40" y="190" width="130" height="70" rx="6" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <text x="105" y="222" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">air</text>
  <text x="105" y="242" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">atmosphere</text>

  <rect x="342" y="190" width="130" height="70" rx="6" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <text x="407" y="222" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">ocean</text>
  <text x="407" y="242" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">hydrosphere</text>

  <rect x="40" y="300" width="130" height="70" rx="6" fill="none" stroke="#e0a458" stroke-width="3"/>
  <text x="105" y="332" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">land</text>
  <text x="105" y="352" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">geosphere</text>

  <rect x="342" y="300" width="130" height="70" rx="6" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="407" y="332" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">life</text>
  <text x="407" y="352" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">biosphere</text>

  <!-- cycle arrows -->
  <line x1="170" y1="225" x2="342" y2="225" stroke="#2b3a42" stroke-width="2"/>
  <path d="M 332 219 L 344 225 L 332 231" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">carbon + water</text>

  <line x1="342" y1="335" x2="170" y2="335" stroke="#2b3a42" stroke-width="2"/>
  <path d="M 180 329 L 168 335 L 180 341" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <line x1="105" y1="260" x2="105" y2="300" stroke="#2b3a42" stroke-width="2"/>
  <path d="M 99 290 L 105 302 L 111 290" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <line x1="407" y1="260" x2="407" y2="300" stroke="#2b3a42" stroke-width="2"/>
  <path d="M 401 290 L 407 302 L 413 290" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <!-- greenhouse effect -->
  <rect x="120" y="400" width="272" height="46" rx="6" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <text x="256" y="428" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42" font-weight="bold">greenhouse effect: gases trap heat, keeping Earth warm for life</text>

  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Matter is recycled, never made new.</text>
</svg>
