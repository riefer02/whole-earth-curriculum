<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Cooperative project design loop</title>
  <desc id="desc">A circular six-step design loop with arrows connecting the steps: listen, name the need, set a shared goal, divide roles, decide together, and take a first step. An arrow returns from the first step back to listen, showing the loop repeats. Steps are numbered and labeled.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Designing a Cooperative Project</text>

  <circle cx="256" cy="252" r="150" fill="none" stroke="#2b3a42" stroke-width="3" stroke-dasharray="2 10"/>

  <text x="256" y="250" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#4f6d7a">with people,</text>
  <text x="256" y="276" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#4f6d7a">not just for them</text>

  <!-- Step 1: listen (top) -->
  <rect x="186" y="66" width="140" height="56" rx="12" fill="#7a9e7e" opacity="0.28" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="88" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">1</text>
  <text x="256" y="108" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">listen</text>

  <!-- Step 2: name the need (upper right) -->
  <rect x="360" y="150" width="150" height="56" rx="12" fill="#6b93b6" opacity="0.28" stroke="#2b3a42" stroke-width="2"/>
  <text x="435" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">2</text>
  <text x="435" y="192" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">name the need</text>

  <!-- Step 3: shared goal (lower right) -->
  <rect x="360" y="300" width="150" height="56" rx="12" fill="#e0a458" opacity="0.28" stroke="#2b3a42" stroke-width="2"/>
  <text x="435" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">3</text>
  <text x="435" y="342" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">set a shared goal</text>

  <!-- Step 4: divide roles (bottom) -->
  <rect x="166" y="382" width="180" height="56" rx="12" fill="#7a9e7e" opacity="0.28" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="404" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">4</text>
  <text x="256" y="424" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">divide roles fairly</text>

  <!-- Step 5: decide together (lower left) -->
  <rect x="2" y="300" width="150" height="56" rx="12" fill="#6b93b6" opacity="0.28" stroke="#2b3a42" stroke-width="2"/>
  <text x="77" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">5</text>
  <text x="77" y="342" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">decide together</text>

  <!-- Step 6: first step (upper left) -->
  <rect x="2" y="150" width="150" height="56" rx="12" fill="#e0a458" opacity="0.28" stroke="#2b3a42" stroke-width="2"/>
  <text x="77" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">6</text>
  <text x="77" y="192" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">take a first step</text>

  <!-- Return arrow -->
  <path d="M120 130 C120 70 240 50 300 78" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <path d="M300 78 L290 66 M300 78 L302 92" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#4f6d7a">Start by listening — and keep coming back to it.</text>
</svg>
