<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">From Issue to Intended Effect</title>
  <desc id="desc">A three-node chain: an issue box on the left, an artistic-choices box in the middle, and an audience-effect box on the right, with arrows connecting them in a chain, labeled "what matters," "what I choose," and "what I hope an audience feels or does."</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">From Issue to Intended Effect</text>

  <!-- Issue node -->
  <rect x="40" y="130" width="120" height="150" rx="10" fill="#7a9e7e" fill-opacity="0.25" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="100" y="188" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222" font-weight="bold">The Issue</text>
  <text x="100" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">what matters:</text>
  <text x="100" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">who it affects,</text>
  <text x="100" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">why it matters</text>

  <!-- Choices node -->
  <rect x="196" y="130" width="120" height="150" rx="10" fill="#e0a458" fill-opacity="0.25" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="188" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222" font-weight="bold">My Choices</text>
  <text x="256" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">what I select,</text>
  <text x="256" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">order, place,</text>
  <text x="256" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">and make</text>

  <!-- Effect node -->
  <rect x="352" y="130" width="120" height="150" rx="10" fill="#6b93b6" fill-opacity="0.25" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="412" y="188" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222" font-weight="bold">The Effect</text>
  <text x="412" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">what I hope an</text>
  <text x="412" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">audience feels,</text>
  <text x="412" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">thinks, or does</text>

  <!-- Arrows -->
  <line x1="160" y1="205" x2="196" y2="205" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="196,205 184,199 184,211" fill="#2b3a42"/>
  <line x1="316" y1="205" x2="352" y2="205" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="352,205 340,199 340,211" fill="#2b3a42"/>

  <!-- Caption -->
  <rect x="110" y="330" width="292" height="86" rx="8" fill="#ffffff" stroke="#e0a458" stroke-width="2"/>
  <text x="256" y="362" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">Naming the effect first —</text>
  <text x="256" y="384" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">before making —</text>
  <text x="256" y="404" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">turns craft into a voice.</text>

  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">One issue — carried through every lesson.</text>
</svg>
