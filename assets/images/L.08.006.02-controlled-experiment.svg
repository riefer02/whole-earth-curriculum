<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A controlled experiment: warm versus cold water dissolving sugar</title>
  <desc id="desc">Two cups of water, one labeled cold and one labeled warm, each with the same amount of sugar. Labels mark the independent variable temperature, the dependent variable how fast the sugar dissolves, and control variables kept the same, with a note about repeated trials.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">A Controlled Experiment</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Does warm water dissolve sugar faster than cold?</text>

  <!-- cold cup (control condition) -->
  <g>
    <path d="M78 176 L86 318 Q86 332 126 332 L178 332 Q218 332 218 318 L226 176 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M88 176 Q152 164 216 176" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <path d="M96 190 Q152 180 208 190" fill="none" stroke="#6b93b6" stroke-width="2.5"/>
    <!-- sugar grains at bottom -->
    <rect x="120" y="300" width="7" height="7" fill="#e0a458" stroke="#2b3a42" stroke-width="1"/>
    <rect x="140" y="306" width="7" height="7" fill="#e0a458" stroke="#2b3a42" stroke-width="1"/>
    <rect x="160" y="302" width="7" height="7" fill="#e0a458" stroke="#2b3a42" stroke-width="1"/>
    <rect x="180" y="308" width="7" height="7" fill="#e0a458" stroke="#2b3a42" stroke-width="1"/>
    <text x="152" y="356" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">cold water</text>
    <text x="152" y="374" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">control condition</text>
    <!-- thermometer for cold -->
    <rect x="196" y="140" width="8" height="40" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="198" y="156" width="4" height="22" fill="#6b93b6"/>
  </g>

  <!-- warm cup (changed variable) -->
  <g>
    <path d="M286 176 L294 318 Q294 332 334 332 L386 332 Q426 332 426 318 L434 176 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M296 176 Q360 164 424 176" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <path d="M304 190 Q360 180 416 190" fill="none" stroke="#e0a458" stroke-width="2.5"/>
    <!-- sugar grains mostly dissolved -->
    <rect x="336" y="306" width="7" height="7" fill="#e0a458" stroke="#2b3a42" stroke-width="1"/>
    <rect x="360" y="310" width="7" height="7" fill="#e0a458" stroke="#2b3a42" stroke-width="1"/>
    <text x="360" y="356" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">warm water</text>
    <text x="360" y="374" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">what we change</text>
    <!-- thermometer for warm -->
    <rect x="404" y="140" width="8" height="40" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="406" y="144" width="4" height="34" fill="#e0a458"/>
  </g>

  <!-- labels -->
  <rect x="34" y="406" width="444" height="88" rx="8" fill="#ffffff" stroke="#4f6d7a" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="46" y="428" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Independent variable (we change):</text>
  <text x="270" y="428" font-family="sans-serif" font-size="13" fill="#222222">water temperature</text>
  <text x="46" y="448" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Dependent variable (we measure):</text>
  <text x="270" y="448" font-family="sans-serif" font-size="13" fill="#222222">time for sugar to dissolve</text>
  <text x="46" y="468" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Control variables (kept same):</text>
  <text x="270" y="468" font-family="sans-serif" font-size="13" fill="#222222">water amount, sugar, stirring, cup</text>
  <text x="46" y="488" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Repeated trials:</text>
  <text x="270" y="488" font-family="sans-serif" font-size="13" fill="#222222">run each three times, average</text>
</svg>
