<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Intersecting identities making one whole self</title>
  <desc id="desc">A diagram with a central circle labeled me, surrounded by five overlapping ovals labeled culture, gender, ability, language, and my own, all meeting over the person at the center to show that a whole self is made of intersecting parts.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">One Whole Self, Many Parts</text>

  <!-- five overlapping ovals arranged around center -->
  <ellipse cx="256" cy="150" rx="108" ry="64" fill="#e0a458" fill-opacity="0.45" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="146" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">culture</text>
  <text x="256" y="164" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">where &amp; how I grew up</text>

  <ellipse cx="150" cy="270" rx="108" ry="64" fill="#7a9e7e" fill-opacity="0.45" stroke="#2b3a42" stroke-width="2"/>
  <text x="150" y="266" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">gender</text>
  <text x="150" y="284" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">how I experience &amp; express me</text>

  <ellipse cx="362" cy="270" rx="108" ry="64" fill="#6b93b6" fill-opacity="0.45" stroke="#2b3a42" stroke-width="2"/>
  <text x="362" y="266" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">ability</text>
  <text x="362" y="284" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">what my body &amp; mind can do</text>

  <ellipse cx="196" cy="392" rx="108" ry="64" fill="#4f6d7a" fill-opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
  <text x="196" y="388" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">language</text>
  <text x="196" y="406" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">the words I think &amp; speak</text>

  <ellipse cx="316" cy="392" rx="108" ry="64" fill="#d9b8a0" fill-opacity="0.5" stroke="#2b3a42" stroke-width="2"/>
  <text x="316" y="388" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">my own</text>
  <text x="316" y="406" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">one part I choose to name</text>

  <!-- central whole self -->
  <circle cx="256" cy="272" r="52" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="268" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">ME</text>
  <text x="256" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">whole</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Where two parts meet, the whole self is shaped.</text>
</svg>
