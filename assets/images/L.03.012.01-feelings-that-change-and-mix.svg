<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Feelings change and mix</title>
  <desc id="desc">Two ideas in one picture. The top half shows a winding path from morning to evening with three labeled faces — nervous in the morning, calm at midday, proud by evening — with arrows between them, teaching that one feeling can change over time. The bottom half shows one face that is half-smiling and half-sad, labeled "happy and sad at once," with the note "a goodbye can feel sad and exciting together," teaching that sometimes we feel more than one feeling at the same time. Skin tones and hair vary; one face wears glasses. Everything reads in grayscale, not by color.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Feelings Change and Mix</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">one feeling can change — and two feelings can come at once</text>

  <!-- ===== Top: a feeling changes over time ===== -->
  <text x="256" y="92" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4f6d7a">a feeling can change over time</text>

  <!-- winding path -->
  <path d="M70 200 Q150 170 210 200 T370 200 T470 200" fill="none" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 0"/>

  <!-- morning: nervous -->
  <g>
    <circle cx="88" cy="172" r="30" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M70 172 A18 18 0 0 1 106 172 L106 160 A18 18 0 0 0 70 160 Z" fill="#4f6d7a"/>
    <path d="M76 164 Q80 170 84 166" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M92 166 Q96 170 100 164" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <circle cx="80" cy="173" r="2.4" fill="#2b3a42"/>
    <circle cx="96" cy="173" r="2.4" fill="#2b3a42"/>
    <path d="M80 190 Q88 184 96 190" fill="none" stroke="#2b3a42" stroke-width="2.2" stroke-linecap="round"/>
    <text x="88" y="216" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">nervous</text>
    <text x="88" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">morning</text>
  </g>

  <path d="M122 200 L150 200" stroke="#2b3a42" stroke-width="2" marker-end="url(#a)"/>

  <!-- midday: calm -->
  <g>
    <circle cx="256" cy="172" r="30" fill="#d9a06b" stroke="#2b3a42" stroke-width="2"/>
    <path d="M238 172 A18 18 0 0 1 274 172 L274 160 A18 18 0 0 0 238 160 Z" fill="#2b3a42"/>
    <circle cx="248" cy="172" r="2.4" fill="#2b3a42"/>
    <circle cx="264" cy="172" r="2.4" fill="#2b3a42"/>
    <path d="M248 190 Q256 196 264 190" fill="none" stroke="#2b3a42" stroke-width="2.2" stroke-linecap="round"/>
    <text x="256" y="216" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">calm</text>
    <text x="256" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">midday</text>
  </g>

  <path d="M290 200 L318 200" stroke="#2b3a42" stroke-width="2"/>

  <!-- evening: proud -->
  <g>
    <circle cx="424" cy="172" r="30" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M406 172 A18 18 0 0 1 442 172 L442 160 A18 18 0 0 0 406 160 Z" fill="#e0a458"/>
    <circle cx="416" cy="172" r="2.4" fill="#2b3a42"/>
    <circle cx="432" cy="172" r="2.4" fill="#2b3a42"/>
    <path d="M416 190 Q424 198 432 190" fill="none" stroke="#2b3a42" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M424 160 L424 152" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="424" y="216" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">proud</text>
    <text x="424" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">evening</text>
  </g>

  <text x="256" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">the same day — and the feeling changed as the day went on</text>

  <!-- ===== Bottom: two feelings at once ===== -->
  <line x1="40" y1="272" x2="472" y2="272" stroke="#2b3a42" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="256" y="300" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4f6d7a">sometimes two feelings come at once</text>

  <g>
    <circle cx="176" cy="400" r="56" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <!-- left half hair -->
    <path d="M140 400 A36 36 0 0 1 176 364 L176 364 A36 36 0 0 0 140 400 Z" fill="#2b3a42"/>
    <!-- right half hair -->
    <path d="M176 364 A36 36 0 0 1 212 400 L212 400 A36 36 0 0 0 176 364 Z" fill="#4f6d7a"/>
    <!-- left eye (smiling) -->
    <circle cx="160" cy="398" r="3" fill="#2b3a42"/>
    <!-- right eye (sad, down) -->
    <circle cx="192" cy="398" r="3" fill="#2b3a42"/>
    <!-- half-smile left -->
    <path d="M150 414 Q160 420 170 414" fill="none" stroke="#2b3a42" stroke-width="2.4" stroke-linecap="round"/>
    <!-- half-frown right -->
    <path d="M182 414 Q192 408 202 414" fill="none" stroke="#2b3a42" stroke-width="2.4" stroke-linecap="round"/>
    <!-- a small tear on the sad side -->
    <path d="M200 406 L200 414" stroke="#6b93b6" stroke-width="2.4" stroke-linecap="round"/>
    <text x="176" y="478" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">happy and sad at once</text>
  </g>

  <text x="330" y="382" font-family="sans-serif" font-size="14" fill="#4f6d7a">a goodbye can feel</text>
  <text x="330" y="402" font-family="sans-serif" font-size="14" fill="#4f6d7a">sad (leaving) and</text>
  <text x="330" y="422" font-family="sans-serif" font-size="14" fill="#4f6d7a">exciting (a new</text>
  <text x="330" y="442" font-family="sans-serif" font-size="14" fill="#4f6d7a">place) together</text>

  <text x="256" y="508" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Feelings move and change — and more than one can be true at the same time.</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2b3a42"/></marker>
  </defs>
</svg>
