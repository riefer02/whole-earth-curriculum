<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Making things right: five repair steps</title>
  <desc id="desc">Two panels and a five-step strip teach how to make things right after a small hurt. The first panel, labeled "the hurt," shows a block tower knocked over with blocks scattered and one child standing with a hand outstretched while a second child looks down with a sad frown. The second panel, labeled "the repair," shows the same two children building the tower back up together, both smiling. Below, five numbered steps read: 1 say what happened, 2 name how they felt, 3 ask what would help, 4 do the repair, and 5 check back. The labels, the scattered-then-rebuilt blocks, and the sad-then-smiling faces, not color, carry the meaning, so the picture prints clearly in grayscale and teaches that repair — not punishment — heals a hurt so everyone can be well again, and that a sorry that matters names the act and tries to fix it.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Making Things Right</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Repair, not punishment</text>

  <!-- panels -->
  <rect x="20" y="86" width="226" height="272" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="266" y="86" width="226" height="272" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>

  <text x="133" y="112" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">the hurt</text>
  <text x="379" y="112" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">the repair</text>

  <line x1="250" y1="222" x2="260" y2="222" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <path d="M260 216 L267 222 L260 228 Z" fill="#4f6d7a"/>
  <text x="255" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">then</text>

  <!-- ===== Panel 1: the hurt (tower knocked over) ===== -->
  <!-- scattered blocks -->
  <rect x="60" y="210" width="18" height="14" rx="3" fill="#e0a458" stroke="#2b3a42" stroke-width="2" transform="rotate(-14 69 217)"/>
  <rect x="120" y="240" width="18" height="14" rx="3" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" transform="rotate(20 129 247)"/>
  <rect x="84" y="252" width="18" height="14" rx="3" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" transform="rotate(-8 93 259)"/>
  <rect x="152" y="212" width="18" height="14" rx="3" fill="#e0a458" stroke="#2b3a42" stroke-width="2" transform="rotate(12 161 219)"/>
  <!-- child who knocked (left, medium skin, hand out) -->
  <circle cx="90" cy="160" r="13" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M77 158 A13 13 0 0 1 103 158 Z" fill="#2b3a42"/>
  <circle cx="85" cy="160" r="1.6" fill="#2b3a42"/>
  <circle cx="95" cy="160" r="1.6" fill="#2b3a42"/>
  <path d="M85 167 Q90 170 95 167" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="80" y="174" width="20" height="34" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="85" y1="208" x2="83" y2="236" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="95" y1="208" x2="97" y2="236" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <!-- arm out (just knocked) -->
  <line x1="100" y1="188" x2="128" y2="200" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <!-- child whose tower (right, light skin, sad) -->
  <circle cx="184" cy="168" r="13" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M171 166 A13 13 0 0 1 197 166 Z" fill="#4f6d7a"/>
  <circle cx="179" cy="168" r="1.6" fill="#2b3a42"/>
  <circle cx="189" cy="168" r="1.6" fill="#2b3a42"/>
  <path d="M179 178 Q184 174 189 178" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="175" y="182" width="18" height="28" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="179" y1="210" x2="177" y2="236" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="189" y1="210" x2="191" y2="236" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <text x="133" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">the tower was knocked over</text>

  <!-- ===== Panel 2: the repair (rebuild together) ===== -->
  <!-- rebuilt tower -->
  <rect x="352" y="212" width="20" height="16" rx="3" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="352" y="196" width="20" height="16" rx="3" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <rect x="352" y="180" width="20" height="16" rx="3" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <!-- child A (left, medium skin, placing block, smiling) -->
  <circle cx="318" cy="160" r="13" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M305 158 A13 13 0 0 1 331 158 Z" fill="#2b3a42"/>
  <circle cx="313" cy="160" r="1.6" fill="#2b3a42"/>
  <circle cx="323" cy="160" r="1.6" fill="#2b3a42"/>
  <path d="M313 167 Q318 172 323 167" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="308" y="174" width="20" height="34" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="313" y1="208" x2="311" y2="236" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="323" y1="208" x2="325" y2="236" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <!-- arm placing a block -->
  <line x1="328" y1="190" x2="344" y2="200" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <rect x="344" y="196" width="14" height="10" rx="2" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <!-- child B (right, light skin, smiling, holding block) -->
  <circle cx="406" cy="168" r="13" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M393 166 A13 13 0 0 1 419 166 Z" fill="#4f6d7a"/>
  <circle cx="401" cy="168" r="1.6" fill="#2b3a42"/>
  <circle cx="411" cy="168" r="1.6" fill="#2b3a42"/>
  <path d="M401 175 Q406 180 411 175" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="397" y="182" width="18" height="28" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="401" y1="210" x2="399" y2="236" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="411" y1="210" x2="413" y2="236" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <!-- arm offering a block -->
  <line x1="397" y1="194" x2="378" y2="200" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <rect x="364" y="198" width="14" height="10" rx="2" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>

  <text x="379" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">we build it back together</text>

  <!-- ===== five steps ===== -->
  <text x="256" y="378" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">How to make it right</text>

  <g font-family="sans-serif">
    <!-- step 1 -->
    <rect x="20" y="392" width="88" height="92" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="64" cy="414" r="13" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="64" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b3a42">1</text>
    <text x="64" y="444" text-anchor="middle" font-size="13" fill="#222222">say what</text>
    <text x="64" y="460" text-anchor="middle" font-size="13" fill="#222222">happened</text>

    <!-- step 2 -->
    <rect x="116" y="392" width="88" height="92" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="160" cy="414" r="13" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="160" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b3a42">2</text>
    <text x="160" y="444" text-anchor="middle" font-size="13" fill="#222222">name how</text>
    <text x="160" y="460" text-anchor="middle" font-size="13" fill="#222222">they felt</text>

    <!-- step 3 -->
    <rect x="212" y="392" width="88" height="92" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="256" cy="414" r="13" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b3a42">3</text>
    <text x="256" y="444" text-anchor="middle" font-size="13" fill="#222222">ask what</text>
    <text x="256" y="460" text-anchor="middle" font-size="13" fill="#222222">would help</text>

    <!-- step 4 -->
    <rect x="308" y="392" width="88" height="92" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="352" cy="414" r="13" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="352" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b3a42">4</text>
    <text x="352" y="444" text-anchor="middle" font-size="13" fill="#222222">do the</text>
    <text x="352" y="460" text-anchor="middle" font-size="13" fill="#222222">repair</text>

    <!-- step 5 -->
    <rect x="404" y="392" width="88" height="92" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="448" cy="414" r="13" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="448" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b3a42">5</text>
    <text x="448" y="444" text-anchor="middle" font-size="13" fill="#222222">check</text>
    <text x="448" y="460" text-anchor="middle" font-size="13" fill="#222222">back</text>
  </g>

  <text x="256" y="508" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Name the act, never the child &#183; a sorry that matters tries to fix the harm</text>
</svg>
