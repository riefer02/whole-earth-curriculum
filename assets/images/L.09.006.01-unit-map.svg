<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Unit map: four strands of language, literature and argument</title>
  <desc id="desc">A map of the unit showing four boxes labeled listening and speaking, reading and literacy, writing and expression, and multilingual and intercultural communication, each with two short goals, arranged around the words synthesis, argument, and authorship.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Our Unit: Language, Literature &amp; Argument</text>

  <!-- center badge -->
  <ellipse cx="256" cy="256" rx="96" ry="36" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">synthesis · argument</text>
  <text x="256" y="269" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">· authorship ·</text>

  <!-- strand 1: listening & speaking (top-left) -->
  <rect x="34" y="82" width="150" height="118" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="58" cy="104" r="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="74" y="109" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">Listening &amp; Speaking</text>
  <text x="44" y="134" font-family="sans-serif" font-size="11" fill="#4f6d7a">· synthesize many</text>
  <text x="44" y="150" font-family="sans-serif" font-size="11" fill="#4f6d7a">  spoken sources</text>
  <text x="44" y="170" font-family="sans-serif" font-size="11" fill="#4f6d7a">· lead a discussion fairly</text>

  <!-- strand 2: reading (top-right) -->
  <rect x="328" y="82" width="150" height="118" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="352" cy="104" r="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="368" y="109" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">Reading &amp; Literacy</text>
  <text x="338" y="134" font-family="sans-serif" font-size="11" fill="#4f6d7a">· structure, style,</text>
  <text x="338" y="150" font-family="sans-serif" font-size="11" fill="#4f6d7a">  argument together</text>
  <text x="338" y="170" font-family="sans-serif" font-size="11" fill="#4f6d7a">· synthesize across texts</text>

  <!-- strand 3: writing (bottom-left) -->
  <rect x="34" y="312" width="150" height="118" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="58" cy="334" r="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="74" y="339" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">Writing &amp; Expression</text>
  <text x="44" y="364" font-family="sans-serif" font-size="11" fill="#4f6d7a">· research argument with</text>
  <text x="44" y="380" font-family="sans-serif" font-size="11" fill="#4f6d7a">  cited sources</text>
  <text x="44" y="400" font-family="sans-serif" font-size="11" fill="#4f6d7a">· compose for real readers</text>

  <!-- strand 4: multilingual (bottom-right) -->
  <rect x="328" y="312" width="150" height="118" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="352" cy="334" r="10" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="368" y="339" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">Multilingual &amp; Intercultural</text>
  <text x="338" y="364" font-family="sans-serif" font-size="11" fill="#4f6d7a">· languages &amp; identity</text>
  <text x="338" y="382" font-family="sans-serif" font-size="11" fill="#4f6d7a">· language loss &amp;</text>
  <text x="338" y="398" font-family="sans-serif" font-size="11" fill="#4f6d7a">  revitalization</text>

  <!-- connector lines -->
  <path d="M184 141 L256 220" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M328 141 L256 220" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M184 371 L256 292" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M328 371 L256 292" fill="none" stroke="#4f6d7a" stroke-width="2"/>

  <text x="256" y="476" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Eight goals, one skill: building and sharing a supported voice</text>
</svg>
