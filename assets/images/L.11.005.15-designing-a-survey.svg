<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Designing a Survey or Experiment</title>
  <desc id="desc">Left panel: a large circle labeled population with an arrow to a smaller circle labeled random sample, and a note that every member has an equal chance. Right panel: an experiment diagram showing one group split into a treatment group and a control group with a note about comparing their outcomes.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Fair Samples, Honest Questions</text>

  <!-- Survey panel -->
  <text x="128" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a" font-weight="bold">Survey: who do you ask?</text>
  <circle cx="128" cy="180" r="70" fill="#7a9e7e" fill-opacity="0.2" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="128" y="176" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">population</text>
  <text x="128" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">(everyone)</text>
  <circle cx="128" cy="300" r="34" fill="#6b93b6" fill-opacity="0.3" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="128" y="296" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">sample</text>
  <line x1="128" y1="250" x2="128" y2="266" stroke="#e0a458" stroke-width="3"/>
  <polygon points="128,266 122,254 134,254" fill="#e0a458"/>
  <text x="128" y="356" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">random: every member an equal chance</text>
  <text x="128" y="376" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">stratified: keep subgroups represented</text>
  <text x="128" y="396" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">convenience: easy, but biased</text>

  <!-- Experiment panel -->
  <text x="384" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a" font-weight="bold">Experiment: compare two groups</text>
  <rect x="300" y="96" width="168" height="56" fill="#e0a458" fill-opacity="0.25" stroke="#2b3a42" stroke-width="2"/>
  <text x="384" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">group, split randomly</text>
  <text x="384" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">chosen alike at the start</text>
  <line x1="384" y1="152" x2="384" y2="170" stroke="#2b3a42" stroke-width="2"/>
  <line x1="330" y1="152" x2="438" y2="152" stroke="#2b3a42" stroke-width="2"/>
  <rect x="300" y="170" width="76" height="66" fill="#7a9e7e" fill-opacity="0.3" stroke="#2b3a42" stroke-width="2"/>
  <text x="338" y="198" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">treatment</text>
  <text x="338" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">(gets the change)</text>
  <rect x="392" y="170" width="76" height="66" fill="#6b93b6" fill-opacity="0.3" stroke="#2b3a42" stroke-width="2"/>
  <text x="430" y="198" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">control</text>
  <text x="430" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">(does not)</text>
  <text x="384" y="262" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">compare outcomes, not opinions</text>

  <!-- footer -->
  <rect x="90" y="420" width="332" height="56" fill="#ffffff" stroke="#e0a458" stroke-width="2" rx="6"/>
  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">A neutral question: no leading, no pushing.</text>
  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">"Who was asked, and who was left out?"</text>
</svg>
