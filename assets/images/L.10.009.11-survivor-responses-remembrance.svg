<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Remembering with dignity</title>
  <desc id="desc">A memorial image — a steady flame above an open book of names — surrounded by labels for the ways a genocide is remembered: testimony, memorials and museums, days of remembrance, and justice. Grayscale-printable.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222222" font-weight="bold">How a people is remembered</text>
  <!-- Flame -->
  <g transform="translate(256,120)">
    <path d="M 0 -40 C 16 -16 30 -6 30 12 C 30 28 16 40 0 40 C -16 40 -30 28 -30 12 C -30 -6 -16 -16 0 -40 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 0 -20 C 8 -4 12 2 12 12 C 12 20 7 26 0 26 C -7 26 -12 20 -12 12 C -12 2 -8 -4 0 -20 Z" fill="#fdfbf7" stroke="none"/>
  </g>
  <!-- Book of names -->
  <g transform="translate(256,210)">
    <path d="M -60 0 L -4 -18 L 0 -18 L 0 46 L -4 46 Z" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 60 0 L 4 -18 L 0 -18 L 0 46 L 4 46 Z" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <line x1="-4" y1="-18" x2="4" y2="-18" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#4f6d7a" stroke-width="1.5">
      <line x1="-48" y1="-4" x2="-4" y2="-4"/>
      <line x1="-48" y1="6" x2="-4" y2="6"/>
      <line x1="-48" y1="16" x2="-4" y2="16"/>
      <line x1="4" y1="-4" x2="48" y2="-4"/>
      <line x1="4" y1="6" x2="48" y2="6"/>
      <line x1="4" y1="16" x2="48" y2="16"/>
    </g>
  </g>
  <!-- Remembrance forms -->
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <rect x="40" y="292" width="200" height="38" rx="8" fill="#6b93b6"/>
    <text x="140" y="317" text-anchor="middle" fill="#fdfbf7">testimony</text>
    <rect x="272" y="292" width="200" height="38" rx="8" fill="#7a9e7e"/>
    <text x="372" y="317" text-anchor="middle" fill="#fdfbf7">memorials &amp; museums</text>
    <rect x="40" y="342" width="200" height="38" rx="8" fill="#e0a458"/>
    <text x="140" y="367" text-anchor="middle" fill="#fdfbf7">days of remembrance</text>
    <rect x="272" y="342" width="200" height="38" rx="8" fill="#4f6d7a"/>
    <text x="372" y="367" text-anchor="middle" fill="#fdfbf7">justice</text>
  </g>
  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Testimony preserves what a number cannot — a name, a voice, a life.</text>
  <text x="256" y="442" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Remembrance is the living's refusal to forget.</text>
</svg>
