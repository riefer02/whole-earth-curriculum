<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">An unknown number: n plus 3 equals 7</title>
  <desc id="desc">A balance scale with two pans. The left pan holds a box labeled n and three counters, and the right pan holds seven counters. The scale is level, showing both sides are equal. Below, the equation n plus 3 equals 7 is solved: n equals 4, with the check 4 plus 3 equals 7.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">The Unknown Number: n + 3 = 7</text>

  <!-- Balance scale -->
  <line x1="256" y1="90" x2="256" y2="180" stroke="#2b3a42" stroke-width="4"/>
  <line x1="120" y1="140" x2="392" y2="140" stroke="#2b3a42" stroke-width="4"/>
  <!-- fulcrum -->
  <polygon points="256,180 244,200 268,200" fill="#2b3a42"/>
  <line x1="236" y1="200" x2="276" y2="200" stroke="#2b3a42" stroke-width="4"/>

  <!-- left pan -->
  <g>
    <line x1="150" y1="140" x2="140" y2="230" stroke="#2b3a42" stroke-width="3"/>
    <line x1="230" y1="140" x2="240" y2="230" stroke="#2b3a42" stroke-width="3"/>
    <rect x="110" y="230" width="160" height="16" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <!-- n box -->
    <rect x="128" y="196" width="44" height="34" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="150" y="219" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">n</text>
    <!-- three counters -->
    <circle cx="200" cy="220" r="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="220" cy="220" r="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="240" cy="220" r="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="190" y="266" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">n + 3</text>
  </g>

  <!-- right pan -->
  <g>
    <line x1="282" y1="140" x2="272" y2="230" stroke="#2b3a42" stroke-width="3"/>
    <line x1="362" y1="140" x2="372" y2="230" stroke="#2b3a42" stroke-width="3"/>
    <rect x="242" y="230" width="160" height="16" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <!-- seven counters -->
    <circle cx="262" cy="220" r="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="284" cy="220" r="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="306" cy="220" r="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="328" cy="220" r="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="350" cy="220" r="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="372" cy="220" r="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="394" cy="220" r="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="322" y="266" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">7</text>
  </g>

  <!-- solution box -->
  <rect x="80" y="300" width="352" height="140" rx="12" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
  <text x="256" y="334" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42">n + 3 = 7</text>
  <text x="256" y="368" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">count on: 4, 5, 6, 7 → that is 4 more</text>
  <text x="256" y="402" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#e0a458">n = 4</text>
  <text x="256" y="428" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">Check: 4 + 3 = 7 ✓</text>

  <text x="256" y="476" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">A letter stands for the unknown. An equation is a balance.</text>
</svg>
