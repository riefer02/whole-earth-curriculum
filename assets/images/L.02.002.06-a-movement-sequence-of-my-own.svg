<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A movement sequence of my own</title>
  <desc id="desc">Three numbered panels showing a movement sequence in order: first, hop; then, turn; last, balance. Each panel has a number, a word label, and a simple child figure doing the movement, with the last panel showing a child balancing on one foot like a tree. Below each panel is a line where a learner writes or draws their own movement. Words and numbers carry the meaning, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">A Movement Sequence of My Own</text>
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Put three movements in order, then perform them</text>

  <!-- ===== Panel 1 ===== -->
  <g>
    <rect x="20" y="84" width="150" height="180" rx="14" fill="#ffffff" stroke="#7a9e7e" stroke-width="3"/>
    <circle cx="44" cy="104" r="14" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="44" y="109" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">1</text>
    <text x="95" y="110" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">first</text>
    <!-- hopping figure -->
    <circle cx="72" cy="170" r="17" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <rect x="58" y="188" width="28" height="36" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="60" y1="196" x2="48" y2="212" stroke="#c99567" stroke-width="8" stroke-linecap="round"/>
    <line x1="84" y1="196" x2="96" y2="212" stroke="#c99567" stroke-width="8" stroke-linecap="round"/>
    <line x1="66" y1="224" x2="62" y2="244" stroke="#4f6d7a" stroke-width="8" stroke-linecap="round"/>
    <line x1="78" y1="224" x2="86" y2="240" stroke="#4f6d7a" stroke-width="8" stroke-linecap="round"/>
    <text x="95" y="160" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">hop</text>
    <text x="95" y="256" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">write or draw yours:</text>
    <line x1="40" y1="266" x2="150" y2="266" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- ===== Panel 2 ===== -->
  <g>
    <rect x="181" y="84" width="150" height="180" rx="14" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
    <circle cx="205" cy="104" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="205" y="109" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">2</text>
    <text x="256" y="110" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">then</text>
    <!-- turning figure -->
    <circle cx="233" cy="170" r="17" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <rect x="219" y="188" width="28" height="36" rx="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="221" y1="196" x2="209" y2="212" stroke="#8f5f3d" stroke-width="8" stroke-linecap="round"/>
    <line x1="245" y1="196" x2="257" y2="212" stroke="#8f5f3d" stroke-width="8" stroke-linecap="round"/>
    <line x1="227" y1="224" x2="223" y2="244" stroke="#4f6d7a" stroke-width="8" stroke-linecap="round"/>
    <line x1="239" y1="224" x2="243" y2="244" stroke="#4f6d7a" stroke-width="8" stroke-linecap="round"/>
    <path d="M240 130 Q254 158 240 170" fill="none" stroke="#2b3a42" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="256" y="160" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">turn</text>
    <text x="256" y="256" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">write or draw yours:</text>
    <line x1="201" y1="266" x2="311" y2="266" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- ===== Panel 3 ===== -->
  <g>
    <rect x="342" y="84" width="150" height="180" rx="14" fill="#ffffff" stroke="#6b93b6" stroke-width="3"/>
    <circle cx="366" cy="104" r="14" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="366" y="109" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">3</text>
    <text x="417" y="110" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">last</text>
    <!-- balancing figure -->
    <circle cx="394" cy="168" r="17" fill="#d9a066" stroke="#2b3a42" stroke-width="2"/>
    <rect x="380" y="186" width="28" height="38" rx="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="382" y1="194" x2="366" y2="206" stroke="#d9a066" stroke-width="8" stroke-linecap="round"/>
    <line x1="406" y1="194" x2="422" y2="206" stroke="#d9a066" stroke-width="8" stroke-linecap="round"/>
    <line x1="388" y1="224" x2="384" y2="246" stroke="#4f6d7a" stroke-width="8" stroke-linecap="round"/>
    <line x1="402" y1="224" x2="396" y2="240" stroke="#4f6d7a" stroke-width="8" stroke-linecap="round"/>
    <text x="417" y="158" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">balance</text>
    <text x="417" y="256" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">write or draw yours:</text>
    <line x1="362" y1="266" x2="472" y2="266" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">First, then, last — your sequence tells a movement story.</text>
</svg>
