<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A balance between doing it alone and asking for help</title>
  <desc id="desc">A balance scale. One pan holds a single figure standing alone labeled 'on my own'; the other holds a figure reaching a hand toward another figure labeled 'ask for help'. The beam is level, showing both are parts of one healthy independence.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <!-- beam and support -->
  <path d="M120 150 L392 150" stroke="#2b3a42" stroke-width="5"/>
  <path d="M256 150 L256 250" stroke="#2b3a42" stroke-width="5"/>
  <path d="M196 250 L316 250 L280 296 L232 296 Z" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2.5"/>
  <!-- left pan: on my own -->
  <path d="M120 150 L80 210 M120 150 L160 210" stroke="#2b3a42" stroke-width="3.5"/>
  <path d="M64 210 Q120 250 176 210" fill="none" stroke="#2b3a42" stroke-width="4"/>
  <circle cx="120" cy="188" r="20" fill="#c68a5a"/>
  <rect x="106" y="212" width="28" height="46" rx="12" fill="#7a9e7e"/>
  <text x="120" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#222222">on my own</text>
  <!-- right pan: ask for help -->
  <path d="M392 150 L352 210 M392 150 L432 210" stroke="#2b3a42" stroke-width="3.5"/>
  <path d="M336 210 Q392 250 448 210" fill="none" stroke="#2b3a42" stroke-width="4"/>
  <circle cx="376" cy="192" r="20" fill="#8d5a3b"/>
  <rect x="362" y="216" width="28" height="46" rx="12" fill="#6b93b6"/>
  <circle cx="420" cy="198" r="18" fill="#d9a06b"/>
  <rect x="408" y="220" width="24" height="40" rx="10" fill="#e0a458"/>
  <path d="M386 210 Q402 202 408 216" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <text x="404" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#222222">ask for help</text>
  <text x="256" y="486" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#222222">independence and asking for help hold each other up</text>
</svg>
