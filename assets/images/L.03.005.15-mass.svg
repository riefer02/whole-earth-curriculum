<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Measuring mass: an apple is about one hundred grams</title>
  <desc id="desc">A balance scale with an apple on the left pan and gram weights labeled one hundred grams on the right pan, the beam level. Labels read the apple has a mass of about one hundred grams, and a note says one kilogram equals one thousand grams.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Mass: Grams &amp; Kilograms</text>

  <!-- Balance beam -->
  <line x1="96" y1="150" x2="416" y2="150" stroke="#2b3a42" stroke-width="4"/>
  <rect x="250" y="150" width="12" height="120" fill="#2b3a42"/>
  <line x1="256" y1="270" x2="180" y2="310" stroke="#2b3a42" stroke-width="4"/>
  <line x1="256" y1="270" x2="332" y2="310" stroke="#2b3a42" stroke-width="4"/>

  <!-- Left pan: apple -->
  <g>
    <line x1="120" y1="150" x2="120" y2="180" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="120" cy="200" rx="60" ry="16" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="120" cy="188" r="22" fill="#c0504d" stroke="#2b3a42" stroke-width="2"/>
    <line x1="120" y1="166" x2="132" y2="160" stroke="#4f6d7a" stroke-width="2"/>
    <text x="120" y="236" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">apple</text>
  </g>

  <!-- Right pan: weights -->
  <g>
    <line x1="392" y1="150" x2="392" y2="180" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="392" cy="200" rx="60" ry="16" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <rect x="372" y="176" width="40" height="22" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="392" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2b3a42">100 g</text>
    <text x="392" y="236" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">100 grams</text>
  </g>

  <rect x="96" y="300" width="320" height="130" rx="12" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
  <text x="256" y="332" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">The balance is level, so</text>
  <text x="256" y="368" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#e0a458">apple ≈ 100 grams</text>
  <text x="256" y="404" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">1 kilogram = 1,000 grams</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#4f6d7a">Estimate first, then balance to check.</text>
</svg>
