<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Our community timeline — then and now</title>
  <desc id="desc">A timeline sheet with a "long ago" end on the left and a "now" end on the right. Along the line are three event spots in order, each with a small drawing: a new school, a festival banner, and a new baby. Beside one event, a small two-column mark reads "changed" and "stayed the same". A dotted arrow runs left to right. The labels and the left-to-right arrow — not color — carry the meaning, so the picture prints clearly in grayscale and shows how a timeline and a then-and-now comparison fit together on one page.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Our Community Timeline: Then and Now</text>
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Order the events &#183; mark what changed and what stayed</text>

  <!-- page -->
  <rect x="24" y="92" width="464" height="300" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>

  <text x="66" y="120" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">long ago</text>
  <text x="446" y="120" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">now</text>

  <!-- timeline -->
  <line x1="44" y1="210" x2="468" y2="210" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  <path d="M468 202 L484 210 L468 218 Z" fill="#2b3a42"/>

  <!-- event 1: new school -->
  <g>
    <circle cx="120" cy="210" r="7" fill="#2b3a42"/>
    <rect x="96" y="160" width="48" height="36" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M90 160 L120 138 L150 160 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="120" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">new school</text>
  </g>

  <!-- event 2: festival -->
  <g>
    <circle cx="256" cy="210" r="7" fill="#2b3a42"/>
    <path d="M226 148 L286 148 L280 180 L232 180 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <line x1="238" y1="196" x2="238" y2="208" stroke="#2b3a42" stroke-width="2"/>
    <line x1="274" y1="196" x2="274" y2="208" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">festival</text>
  </g>

  <!-- event 3: new baby -->
  <g>
    <circle cx="392" cy="210" r="7" fill="#2b3a42"/>
    <circle cx="392" cy="180" r="15" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M380 178 A15 15 0 0 1 404 178 Z" fill="#2b3a42"/>
    <path d="M386 184 Q390 187 394 184" fill="none" stroke="#2b3a42" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M380 196 Q392 210 404 196" fill="none" stroke="#6b93b6" stroke-width="3" stroke-linecap="round"/>
    <text x="392" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">new baby</text>
  </g>

  <!-- changed / stayed the same mark -->
  <g>
    <rect x="330" y="276" width="130" height="92" rx="10" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <text x="395" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">one event</text>
    <line x1="345" y1="310" x2="445" y2="310" stroke="#4f6d7a" stroke-width="1.5"/>
    <text x="352" y="328" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">changed:</text>
    <text x="352" y="346" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">stayed the same:</text>
    <line x1="404" y1="323" x2="440" y2="323" stroke="#2b3a42" stroke-width="2"/>
    <line x1="404" y1="341" x2="440" y2="341" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">A small history of my people and place &#183; in order, with change and sameness</text>
  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Every family&#8217;s order of events is real and worthy</text>
</svg>
