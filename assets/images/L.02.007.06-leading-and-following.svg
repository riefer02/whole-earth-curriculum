<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Leading and following: mirroring and trading turns</title>
  <desc id="desc">Two figures face each other with mirrored arms — the left figure labeled lead raises one arm, and the right figure labeled follow raises the matching arm like a mirror. A round turn marker sits between them labeled whose turn to lead. A curved arrow runs from lead to follow and back again, labeled trade, to show the two swap so lead becomes follow and follow becomes lead. Labels and arrows carry all meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Leading and Following</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Lead, follow — then trade.</text>

  <!-- lead figure -->
  <g stroke="#2b3a42" stroke-width="2" fill="#c99567">
    <circle cx="150" cy="170" r="24"/>
  </g>
  <g stroke="#2b3a42" stroke-width="7" stroke-linecap="round">
    <line x1="150" y1="194" x2="150" y2="272"/>
    <line x1="150" y1="212" x2="118" y2="238"/>
    <line x1="150" y1="212" x2="182" y2="172"/>
    <line x1="150" y1="272" x2="132" y2="320"/>
    <line x1="150" y1="272" x2="168" y2="320"/>
  </g>
  <circle cx="150" cy="158" r="4" fill="#2b3a42"/>
  <text x="150" y="356" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">lead</text>

  <!-- follow figure -->
  <g stroke="#2b3a42" stroke-width="2" fill="#f5d6b6">
    <circle cx="362" cy="170" r="24"/>
  </g>
  <g stroke="#2b3a42" stroke-width="7" stroke-linecap="round">
    <line x1="362" y1="194" x2="362" y2="272"/>
    <line x1="362" y1="212" x2="394" y2="238"/>
    <line x1="362" y1="212" x2="330" y2="172"/>
    <line x1="362" y1="272" x2="344" y2="320"/>
    <line x1="362" y1="272" x2="380" y2="320"/>
  </g>
  <circle cx="362" cy="158" r="4" fill="#2b3a42"/>
  <text x="362" y="356" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">follow</text>

  <!-- turn marker -->
  <circle cx="256" cy="250" r="30" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">whose</text>
  <text x="256" y="260" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">turn?</text>

  <!-- trade arrow -->
  <g stroke="#6b93b6" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M196 150 Q256 96 318 150"/>
    <path d="M310 130 L318 150 L310 138"/>
  </g>
  <text x="256" y="86" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6b93b6">trade</text>

  <!-- mirror arrows -->
  <g stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round" fill="none">
    <line x1="210" y1="196" x2="302" y2="196"/>
    <line x1="206" y1="190" x2="306" y2="190"/>
  </g>
  <text x="256" y="182" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">mirror</text>
</svg>
