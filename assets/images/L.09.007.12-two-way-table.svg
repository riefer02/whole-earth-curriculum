<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A two-way table with conditional relative frequencies</title>
  <desc id="desc">A two-way table with rows and columns for two categories, showing the four joint counts, the marginal totals, and a conditional relative frequency for one row, with a note that conditional rates — not just overall rates — reveal fairness.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Two-Way Table</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">does the overall rate hide what happens inside?</text>

  <!-- table grid -->
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="80" y1="96" x2="432" y2="96"/>
    <line x1="80" y1="160" x2="432" y2="160"/>
    <line x1="80" y1="224" x2="432" y2="224"/>
    <line x1="80" y1="96" x2="80" y2="224"/>
    <line x1="256" y1="96" x2="256" y2="224"/>
    <line x1="344" y1="96" x2="344" y2="224"/>
    <line x1="432" y1="96" x2="432" y2="224"/>
  </g>

  <!-- header row -->
  <text x="168" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">(blank)</text>
  <text x="300" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Group A</text>
  <text x="388" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Group B</text>
  <text x="388" y="146" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">(marginal)</text>

  <!-- row labels + cells -->
  <text x="100" y="192" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Passed</text>
  <text x="300" y="192" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">80</text>
  <text x="388" y="192" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">60</text>
  <text x="426" y="192" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">140</text>

  <text x="100" y="216" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Did not</text>
  <text x="300" y="216" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">20</text>
  <text x="388" y="216" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">40</text>
  <text x="426" y="216" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">60</text>

  <!-- conditional note -->
  <rect x="80" y="252" width="352" height="120" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="94" y="280" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Conditional relative frequency (the rate inside each group):</text>
  <text x="94" y="306" font-family="sans-serif" font-size="14" fill="#222222">Group A: 80 / 100 = 80% passed</text>
  <text x="94" y="328" font-family="sans-serif" font-size="14" fill="#222222">Group B: 60 / 100 = 60% passed</text>
  <text x="94" y="356" font-family="sans-serif" font-size="14" fill="#4f6d7a">The overall rate (140/200 = 70%) hides this 20-point gap.</text>

  <rect x="80" y="388" width="352" height="104" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="94" y="414" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Fairness questions start here:</text>
  <text x="94" y="438" font-family="sans-serif" font-size="14" fill="#222222">Does each group pass at the same rate given the same starting point?</text>
  <text x="94" y="460" font-family="sans-serif" font-size="14" fill="#222222">Association is not causation — the table shows a relationship, not a cause.</text>
  <text x="94" y="482" font-family="sans-serif" font-size="14" fill="#4f6d7a">Du Bois and Nightingale used tables and charts like this to argue for justice.</text>
</svg>
