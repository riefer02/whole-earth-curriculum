<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">How alcohol affects a growing body</title>
  <desc id="d">A body outline with labeled spots showing alcohol slows the brain — affecting judgment, coordination, and memory — and can harm the liver and a still-growing body.</desc>
  <rect x="0" y="0" width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">Alcohol &amp; a Growing Body</text>

  <!-- body outline -->
  <circle cx="256" cy="120" r="42" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <rect x="196" y="164" width="120" height="230" rx="34" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <line x1="196" y1="300" x2="140" y2="420" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <line x1="316" y1="300" x2="372" y2="420" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <line x1="216" y1="182" x2="176" y2="300" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <line x1="296" y1="182" x2="336" y2="300" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>

  <!-- brain label -->
  <circle cx="256" cy="120" r="6" fill="#e0a458"/>
  <text x="336" y="104" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Brain slows</text>
  <text x="336" y="122" font-family="sans-serif" font-size="12" fill="#222222">judgment, coordination,</text>
  <text x="336" y="138" font-family="sans-serif" font-size="12" fill="#222222">memory all slow down</text>

  <!-- liver label -->
  <circle cx="256" cy="300" r="6" fill="#7a9e7e"/>
  <text x="336" y="296" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Liver</text>
  <text x="336" y="314" font-family="sans-serif" font-size="12" fill="#222222">heavy use harms it</text>

  <!-- growing body label -->
  <circle cx="256" cy="210" r="6" fill="#6b93b6"/>
  <text x="96" y="250" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Growing body</text>
  <text x="96" y="268" text-anchor="end" font-family="sans-serif" font-size="12" fill="#222222">smaller body,</text>
  <text x="96" y="284" text-anchor="end" font-family="sans-serif" font-size="12" fill="#222222">developing brain —</text>
  <text x="96" y="300" text-anchor="end" font-family="sans-serif" font-size="12" fill="#222222">greater effect</text>

  <!-- delay note -->
  <rect x="28" y="436" width="456" height="56" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="460" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Delay protects a young, still-developing brain.</text>
  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Nearly every country sets a minimum drinking age — a safety law, not a test.</text>
</svg>
