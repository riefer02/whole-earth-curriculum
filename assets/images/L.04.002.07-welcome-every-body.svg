    <path d="M366 182 l2 30" stroke="#c99567" stroke-width="11" stroke-linecap="round"/>
    <path d="M340 212 l-4 24" stroke="#c99567" stroke-width="12" stroke-linecap="round"/>
    <path d="M360 212 l4 24" stroke="#c99567" stroke-width="12" stroke-linecap="round"/>
