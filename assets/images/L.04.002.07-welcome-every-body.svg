    <path d="M138 284 l16 26" stroke="#8a5a34" stroke-width="11" stroke-linecap="round"/>
    <path d="M112 314 l-4 24" stroke="#8a5a34" stroke-width="12" stroke-linecap="round"/>
    <path d="M132 314 l4 24" stroke="#8a5a34" stroke-width="12" stroke-linecap="round"/>
  </g>
  <ellipse cx="108" cy="340" rx="9" ry="5" fill="#8a5a34"/>
  <ellipse cx="136" cy="340" rx="9" ry="5" fill="#8a5a34"/>
  <circle cx="122" cy="252" r="16" fill="#8a5a34" stroke="#2b3a42" stroke-width="1.8"/>
  <circle cx="116" cy="249" r="2.2" fill="#2b3a42"/><circle cx="128" cy="249" r="2.2" fill="#2b3a42"/>
  <path d="M117 260 q5 4 10 0" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>

  <text x="256" y="472" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">when a game leaves someone out, we change</text>
  <text x="256" y="494" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">the game</text>
</svg>
