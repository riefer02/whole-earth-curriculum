  <path d="M395 260 q5 4 10 0" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="368" y="312" width="58" height="9" rx="4" fill="#4f6d7a" stroke="#2b3a42" stroke-width="1.8"/>
  <circle cx="388" cy="337" r="15" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="414" cy="337" r="15" fill="none" stroke="#2b3a42" stroke-width="3"/>

