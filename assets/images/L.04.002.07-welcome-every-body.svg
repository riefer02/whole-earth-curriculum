<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-04-002-07-welcome-every-body desc-L-04-002-07-welcome-every-body">
  <title id="title-L-04-002-07-welcome-every-body">Welcome every body</title>
  <desc id="desc-L-04-002-07-welcome-every-body">A circle of six diverse children playing a passing game together around a soft ball at the centre. One child is in a wheelchair, one wears a hearing aid, one sits cross-legged on the ground, one sits on the grass, and skin tones vary. All reach toward the ball, showing a game everyone can join.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="50" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Welcome Every Body</text>

  <!-- Ball at centre -->
  <circle cx="256" cy="244" r="32" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>

  <!-- child 1, top: sitting cross-legged, reaching down toward the ball -->
  <g fill="#f5d6b6" stroke="none">
    <circle cx="256" cy="122" r="16"/>
    <rect x="250" y="135" width="12" height="10" rx="5"/>
    <rect x="234" y="142" width="44" height="46" rx="20"/>
    <path d="M240 154 l-12 30" stroke="#f5d6b6" stroke-width="11" stroke-linecap="round"/>
    <path d="M272 154 l12 30" stroke="#f5d6b6" stroke-width="11" stroke-linecap="round"/>
    <path d="M234 186 q22 14 44 0" stroke="#f5d6b6" stroke-width="16" stroke-linecap="round"/>
  </g>
  <circle cx="256" cy="122" r="16" fill="#f5d6b6" stroke="#2b3a42" stroke-width="1.8"/>
  <circle cx="250" cy="119" r="2.2" fill="#2b3a42"/><circle cx="262" cy="119" r="2.2" fill="#2b3a42"/>
  <path d="M251 130 q5 4 10 0" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>

