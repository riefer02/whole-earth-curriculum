<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Judgment in music: claim, evidence, warrant</title>
  <desc id="desc">A claim-evidence-warrant diagram for music: a top line labeled "my judgment," two boxes below labeled "evidence," and a bottom line labeled "because" linking them together. Labels carry the meaning, so it prints clearly in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">A Judgment I Can Defend</text>

  <rect x="96" y="90" width="320" height="60" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="126" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">my judgment</text>

  <rect x="60" y="210" width="180" height="60" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="150" y="246" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">evidence</text>

  <rect x="272" y="210" width="180" height="60" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="362" y="246" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">evidence</text>

  <path d="M256 150 L150 204" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M256 150 L362 204" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <rect x="96" y="340" width="320" height="60" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="376" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">because …</text>

  <path d="M150 270 L200 334" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M362 270 L312 334" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <text x="256" y="438" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">claim + evidence + warrant</text>
</svg>
