<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Brushing my teeth</title>
  <desc id="desc">A large friendly tooth sits in the center with a toothbrush angled across it and small motion arcs showing the brushing circles. A sun is labeled morning and a moon is labeled night. Below, a chewing stick and a clean finger are shown as ways people clean teeth when there is no brush or paste. Words carry the meaning, so it prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Brushing My Teeth</text>

  <!-- Sun = morning -->
  <g>
    <circle cx="76" cy="120" r="18" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round">
      <line x1="76" y1="92" x2="76" y2="84"/>
      <line x1="76" y1="148" x2="76" y2="156"/>
      <line x1="48" y1="120" x2="40" y2="120"/>
      <line x1="104" y1="120" x2="112" y2="120"/>
      <line x1="56" y1="100" x2="50" y2="94"/>
      <line x1="96" y1="140" x2="102" y2="146"/>
      <line x1="56" y1="140" x2="50" y2="146"/>
      <line x1="96" y1="100" x2="102" y2="94"/>
    </g>
    <text x="76" y="178" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">morning</text>
  </g>

  <!-- Moon = night -->
  <g>
    <path d="M436 100 a26 26 0 1 0 0 40 a20 20 0 1 1 0 -40 Z" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <text x="436" y="178" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">night</text>
  </g>

  <!-- Tooth -->
  <g>
    <rect x="212" y="150" width="88" height="86" rx="20" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
    <rect x="226" y="232" width="26" height="54" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
    <rect x="260" y="232" width="26" height="54" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
    <rect x="212" y="238" width="88" height="6" fill="#fdfbf7"/>
    <!-- friendly face -->
    <circle cx="242" cy="188" r="4" fill="#2b3a42"/>
    <circle cx="270" cy="188" r="4" fill="#2b3a42"/>
    <path d="M244 206 Q256 214 268 206" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Toothbrush -->
  <g>
    <line x1="330" y1="290" x2="308" y2="196" stroke="#e0a458" stroke-width="10" stroke-linecap="round"/>
    <rect x="302" y="176" width="34" height="16" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" transform="rotate(-78 319 184)"/>
  </g>

  <!-- Motion arcs -->
  <g stroke="#4f6d7a" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M330 150 q14 6 8 20"/>
    <path d="M344 172 q14 6 8 20"/>
  </g>

  <!-- Alternatives -->
  <g>
    <rect x="56" y="300" width="180" height="150" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <text x="146" y="330" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">chewing stick</text>
    <path d="M146 388 q-6 -40 6 -58 q12 18 6 58 Z" fill="#c99567" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="146" y="424" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">used in many places</text>

    <rect x="276" y="300" width="180" height="150" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <text x="366" y="330" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">clean finger</text>
    <path d="M366 386 L366 398 L354 404 L354 394 L348 398 L350 386 L360 382 Z" fill="#e6bb92" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="366" y="424" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">when there is no brush</text>
  </g>

  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">Brush every surface, morning and night, for about two minutes.</text>
  <text x="256" y="502" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">A clean finger or a chewing stick also helps when there is no brush or paste. Care is never a test.</text>
</svg>
