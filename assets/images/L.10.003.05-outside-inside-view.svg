<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Seeing a community from the inside</title>
  <desc id="desc">Two lenses side by side. The left lens shows a distant figure looking at a community through a telescope, with labels and assumptions floating near them. The right lens shows a person seated inside a community circle with first-person speech bubbles and questions being asked, not assumed.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Outside View vs. Inside View</text>

  <!-- Left panel: outside -->
  <rect x="28" y="64" width="222" height="360" rx="14" fill="#fdfbf7" stroke="#e0a458" stroke-width="2"/>
  <text x="139" y="92" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">Outside lens</text>

  <!-- Distant figure with telescope -->
  <g transform="translate(70,150)">
    <circle cx="0" cy="-34" r="22" fill="#4f6d7a"/>
    <rect x="-16" y="-14" width="32" height="52" rx="10" fill="#2b3a42"/>
    <line x1="16" y1="-26" x2="58" y2="-26" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <rect x="58" y="-38" width="46" height="20" rx="8" fill="#6b93b6"/>
  </g>
  <!-- Distant community (small shapes) -->
  <g transform="translate(180,150)" fill="#7a9e7e">
    <circle cx="0" cy="0" r="8"/>
    <circle cx="18" cy="-6" r="8"/>
    <circle cx="10" cy="12" r="8"/>
  </g>

  <!-- Labels -->
  <g font-family="sans-serif" font-size="12" fill="#8a6d4a">
    <rect x="44" y="232" width="190" height="24" rx="8" fill="#f6ead8"/>
    <text x="139" y="249" text-anchor="middle">"they are all like ___"</text>
    <rect x="44" y="262" width="190" height="24" rx="8" fill="#f6ead8"/>
    <text x="139" y="279" text-anchor="middle">one story, flattened</text>
    <rect x="44" y="292" width="190" height="24" rx="8" fill="#f6ead8"/>
    <text x="139" y="309" text-anchor="middle">labels, not questions</text>
  </g>
  <text x="139" y="344" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">sees from a distance</text>

  <!-- Right panel: inside -->
  <rect x="262" y="64" width="222" height="360" rx="14" fill="#fdfbf7" stroke="#7a9e7e" stroke-width="2"/>
  <text x="373" y="92" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">Inside lens</text>

  <!-- Circle of people -->
  <g>
    <circle cx="373" cy="170" r="52" fill="none" stroke="#2b3a42" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="373" cy="136" r="16" fill="#e0a458"/>
    <circle cx="404" cy="172" r="16" fill="#6b93b6"/>
    <circle cx="373" cy="208" r="16" fill="#7a9e7e"/>
    <circle cx="342" cy="172" r="16" fill="#e0a458"/>
  </g>

  <!-- Speech bubbles -->
  <g font-family="sans-serif" font-size="11" fill="#222222">
    <rect x="300" y="112" width="120" height="20" rx="8" fill="#dce9f0"/>
    <text x="360" y="126" text-anchor="middle">"our history is…"</text>
    <rect x="316" y="232" width="120" height="20" rx="8" fill="#dce9f0"/>
    <text x="376" y="246" text-anchor="middle">"what we value…"</text>
  </g>

  <!-- Inside moves -->
  <g font-family="sans-serif" font-size="12" fill="#2c4a2c">
    <rect x="286" y="268" width="174" height="24" rx="8" fill="#eaf2ea"/>
    <text x="373" y="285" text-anchor="middle">seek first-person voices</text>
    <rect x="286" y="298" width="174" height="24" rx="8" fill="#eaf2ea"/>
    <text x="373" y="315" text-anchor="middle">ask, don&#8217;t assume</text>
    <rect x="286" y="328" width="174" height="24" rx="8" fill="#eaf2ea"/>
    <text x="373" y="345" text-anchor="middle">let the community name itself</text>
  </g>
  <text x="373" y="372" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">sits inside the circle</text>

  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">The goal is not mastery but humility — to ask, listen, and let people name themselves.</text>
</svg>
