<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Conflict is not violence</title>
  <desc id="desc">A fork diagram titled "conflict is not violence." At the top, a box reads "a disagreement." It splits into two paths. The left path, labeled "handled with respect — listen and find a fair solution," leads to a box reading "healthy: both are heard, the bond can grow." The right path, labeled "handled with force — hurt or threaten to win," leads to a box reading "violence: someone is harmed, trust breaks." Labels, arrows, and shapes carry the meaning, so it prints clearly in grayscale independent of color.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Conflict Is Not Violence</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">a disagreement can go two ways &#8212; the choice is how we handle it</text>

  <!-- situation box -->
  <rect x="176" y="92" width="160" height="52" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="116" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">a disagreement</text>
  <text x="256" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">(a conflict &#8212; normal)</text>

  <!-- trunk and split -->
  <line x1="256" y1="144" x2="256" y2="176" stroke="#2b3a42" stroke-width="2"/>
  <line x1="256" y1="176" x2="128" y2="208" stroke="#2b3a42" stroke-width="2"/>
  <line x1="256" y1="176" x2="384" y2="208" stroke="#2b3a42" stroke-width="2"/>

  <!-- left path: respect -->
  <rect x="26" y="210" width="204" height="74" rx="12" fill="#eef4ee" stroke="#2b3a42" stroke-width="2"/>
  <text x="128" y="234" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">handled with respect</text>
  <text x="128" y="254" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">listen &#183; find a fair solution</text>
  <text x="128" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">both are heard</text>

  <!-- right path: force -->
  <rect x="282" y="210" width="204" height="74" rx="12" fill="#f6f0e8" stroke="#2b3a42" stroke-width="2"/>
  <text x="384" y="234" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">handled with force</text>
  <text x="384" y="254" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">hurt or threaten to win</text>
  <text x="384" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">someone is harmed</text>

  <!-- down arrows -->
  <line x1="128" y1="284" x2="128" y2="316" stroke="#2b3a42" stroke-width="2"/>
  <line x1="384" y1="284" x2="384" y2="316" stroke="#2b3a42" stroke-width="2"/>

  <!-- outcome left -->
  <rect x="26" y="318" width="204" height="84" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="128" y="348" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">healthy</text>
  <text x="128" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">both are heard;</text>
  <text x="128" y="388" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">the bond can grow</text>

  <!-- outcome right -->
  <rect x="282" y="318" width="204" height="84" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="384" y="348" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">violence</text>
  <text x="384" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">someone is harmed;</text>
  <text x="384" y="388" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">trust breaks</text>

  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">Conflict is normal; violence is a choice that harms.</text>
  <text x="256" y="464" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Disagreement, handled with respect, can make decisions better.</text>
</svg>
