<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">All about me: four facts that make me, me</title>
  <desc id="desc">A page divided into four labeled boxes for an "All About Me" sheet. "My age" shows a birthday cake with candles and the number 6. "Things I like" shows a heart and a ball. "Things I can do" shows an open hand with a check mark. "My family" shows two small figures, one taller and one shorter. Each box has blank white space for a learner to draw their own answer, and the labels and shapes, not color, carry the meaning so it prints clearly in grayscale.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="50" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">All About Me</text>

  <!-- Quadrant frames -->
  <rect x="16" y="84" width="232" height="188" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="264" y="84" width="232" height="188" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="16" y="288" width="232" height="188" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="264" y="288" width="232" height="188" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Quadrant 1: my age -->
  <text x="132" y="114" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#4f6d7a">my age</text>
  <g>
    <rect x="66" y="150" width="70" height="40" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="70" y1="143" x2="82" y2="128" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
    <line x1="82" y1="143" x2="94" y2="128" stroke="#6b93b6" stroke-width="3" stroke-linecap="round"/>
    <line x1="94" y1="143" x2="106" y2="128" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
    <line x1="106" y1="143" x2="118" y2="128" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
    <line x1="118" y1="143" x2="130" y2="128" stroke="#6b93b6" stroke-width="3" stroke-linecap="round"/>
    <text x="101" y="178" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">6</text>
    <text x="172" y="176" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">write your</text>
    <text x="172" y="194" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">number here</text>
  </g>

  <!-- Quadrant 2: things I like -->
  <text x="380" y="114" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#4f6d7a">things I like</text>
  <g>
    <path d="M346 206 C341 197 332 197 332 205 C332 212 346 224 346 224 C346 224 360 212 360 205 C360 197 351 197 346 206 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="408" cy="204" r="20" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M395 204 Q408 194 421 204 Q421 194 408 192 Q395 194 395 204" fill="none" stroke="#4f6d7a" stroke-width="2"/>
    <text x="380" y="250" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">a game, food, or place</text>
  </g>

  <!-- Quadrant 3: things I can do -->
  <text x="132" y="318" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#4f6d7a">things I can do</text>
  <g>
    <rect x="92" y="348" width="56" height="50" rx="14" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="94" y="330" width="9" height="22" rx="4" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="108" y="330" width="9" height="22" rx="4" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="122" y="330" width="9" height="22" rx="4" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="136" y="330" width="9" height="22" rx="4" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M162 362 L168 370 L180 354" fill="none" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="132" y="448" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">one thing I do well</text>
  </g>

  <!-- Quadrant 4: my family -->
  <text x="380" y="318" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#4f6d7a">my family</text>
  <g>
    <circle cx="358" cy="372" r="15" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M349 366 A15 15 0 0 1 367 366 Z" fill="#2b3a42"/>
    <rect x="349" y="390" width="18" height="40" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="352" y1="430" x2="350" y2="448" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="364" y1="430" x2="366" y2="448" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <circle cx="408" cy="396" r="11" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M402 390 A11 11 0 0 1 414 390 Z" fill="#2b3a42"/>
    <rect x="402" y="410" width="12" height="26" rx="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="404" y1="436" x2="402" y2="448" stroke="#2b3a42" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="412" y1="436" x2="414" y2="448" stroke="#2b3a42" stroke-width="4.5" stroke-linecap="round"/>
    <text x="380" y="474" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">people I live with or love</text>
  </g>

  <!-- Bottom note -->
  <text x="256" y="500" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">No two pages are alike &#8212; because no two people are alike.</text>
</svg>
