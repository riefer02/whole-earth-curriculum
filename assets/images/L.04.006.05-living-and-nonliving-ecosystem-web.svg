<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" font-family="sans-serif">
  <title>An ecosystem web of dependence</title>
  <desc>A web diagram with a plant at the center, connected by lines to sunlight, water, soil, and air, which are all nonliving, and to a worm and a bird, which are living. Labels show that living and nonliving things depend on each other.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-size="25" fill="#222222" font-weight="bold">An ecosystem is a web of dependence</text>

  <!-- Connecting lines from plant to parts -->
  <g stroke="#4f6d7a" stroke-width="2" fill="none">
    <line x1="256" y1="300" x2="120" y2="140"/>
    <line x1="256" y1="300" x2="392" y2="140"/>
    <line x1="256" y1="300" x2="100" y2="400"/>
    <line x1="256" y1="300" x2="412" y2="400"/>
    <line x1="256" y1="300" x2="256" y2="120"/>
  </g>

  <!-- Sun -->
  <circle cx="120" cy="140" r="26" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <g stroke="#e0a458" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="100" x2="120" y2="88"/>
    <line x1="120" y1="180" x2="120" y2="192"/>
    <line x1="80" y1="140" x2="68" y2="140"/>
    <line x1="160" y1="140" x2="172" y2="140"/>
  </g>
  <text x="120" y="215" text-anchor="middle" font-size="15" fill="#222222">sunlight</text>
  <text x="120" y="232" text-anchor="middle" font-size="13" fill="#4f6d7a">(nonliving)</text>

  <!-- Water -->
  <path d="M370 128 Q382 148 392 148 Q402 148 412 128 Q402 108 392 108 Q382 108 370 128 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="392" y="170" text-anchor="middle" font-size="15" fill="#222222">water</text>
  <text x="392" y="187" text-anchor="middle" font-size="13" fill="#4f6d7a">(nonliving)</text>

  <!-- Air -->
  <g stroke="#4f6d7a" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M240 100 Q248 92 256 100 Q264 108 272 100"/>
    <path d="M250 112 Q256 106 262 112"/>
  </g>
  <text x="256" y="86" text-anchor="middle" font-size="15" fill="#222222">air</text>
  <text x="256" y="70" text-anchor="middle" font-size="13" fill="#4f6d7a">(nonliving)</text>

  <!-- Soil -->
  <rect x="70" y="392" width="60" height="30" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="100" y="414" text-anchor="middle" font-size="13" fill="#222222">soil</text>
  <text x="100" y="440" text-anchor="middle" font-size="13" fill="#4f6d7a">(nonliving)</text>

  <!-- Worm -->
  <path d="M380 400 Q400 386 412 398" fill="none" stroke="#e0a458" stroke-width="8" stroke-linecap="round"/>
  <text x="412" y="418" text-anchor="middle" font-size="15" fill="#222222">worm</text>
  <text x="412" y="440" text-anchor="middle" font-size="13" fill="#4f6d7a">(living)</text>

  <!-- Plant center -->
  <g>
    <line x1="256" y1="330" x2="256" y2="290" stroke="#7a9e7e" stroke-width="6"/>
    <ellipse cx="244" cy="290" rx="16" ry="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="268" cy="290" rx="16" ry="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <rect x="206" y="300" width="100" height="34" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="322" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">plant</text>

  <rect x="40" y="456" width="432" height="44" rx="12" fill="#7a9e7e" opacity="0.22" stroke="#7a9e7e" stroke-width="2"/>
  <text x="256" y="484" text-anchor="middle" font-size="16" fill="#222222">Living and nonliving things depend on each other.</text>
</svg>
