<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The self-directed learning loop</title>
  <desc id="desc">A circular loop of four labeled steps with arrows: choose a goal, gather resources, check my progress, and adjust. A figure stands beside the loop, showing a learner steering their own learning.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <!-- loop nodes -->
  <g font-family="Georgia, serif" font-size="15" fill="#222222" text-anchor="middle">
    <circle cx="150" cy="130" r="56" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="150" y="122">choose a</text>
    <text x="150" y="142">goal</text>
    <circle cx="362" cy="130" r="56" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="362" y="122">gather</text>
    <text x="362" y="142">resources</text>
    <circle cx="362" cy="330" r="56" fill="#6b93b6" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="362" y="322">check my</text>
    <text x="362" y="342">progress</text>
    <circle cx="150" cy="330" r="56" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="150" y="322">adjust and</text>
    <text x="150" y="342">try again</text>
  </g>
  <!-- arrows -->
  <path d="M196 156 Q256 196 316 156" fill="none" stroke="#2b3a42" stroke-width="4"/>
  <path d="M322 180 L316 156 L336 162" fill="#2b3a42"/>
  <path d="M362 186 L362 274" stroke="#2b3a42" stroke-width="4"/>
  <path d="M356 264 L362 286 L368 264" fill="#2b3a42"/>
  <path d="M316 304 Q256 264 196 304" fill="none" stroke="#2b3a42" stroke-width="4"/>
  <path d="M190 298 L196 276 L176 282" fill="#2b3a42"/>
  <path d="M150 274 L150 186" stroke="#2b3a42" stroke-width="4"/>
  <path d="M156 196 L150 174 L144 196" fill="#2b3a42"/>
  <!-- steering figure -->
  <circle cx="430" cy="360" r="30" fill="#8d5a3b"/>
  <path d="M404 358 Q416 340 430 356 Q444 340 456 358 L456 372 Q444 380 416 380 Q404 380 404 372 Z" fill="#2b3a42"/>
  <rect x="408" y="392" width="44" height="66" rx="18" fill="#4f6d7a"/>
  <text x="256" y="486" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#222222">I am the one steering my learning</text>
</svg>
