<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Trusted adults and asking for help</title>
  <desc id="desc">A child raises one hand and says I need help in a speech bubble, while a trusted grown-up who uses a wheelchair sits nearby with an open, welcoming hand; both are labeled. Below, a large open help hand has one kind of trusted adult named at each finger: caregiver, grandparent, teacher, nurse, and neighbor. The message is warm and safe, and labels carry the meaning so it prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Trusted Adults and Asking for Help</text>

  <!-- Ground -->
  <rect x="0" y="300" width="512" height="12" fill="#dbe6d2"/>
  <line x1="0" y1="300" x2="512" y2="300" stroke="#4f6d7a" stroke-width="2"/>

  <!-- Child raising hand -->
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="150" cy="210" r="26" fill="#f5d6b6"/>
    <rect x="130" y="238" width="40" height="60" rx="14" fill="#7a9e7e"/>
    <line x1="162" y1="250" x2="184" y2="196" stroke-width="14" stroke="#f5d6b6"/>
    <circle cx="186" cy="192" r="9" fill="#f5d6b6"/>
    <line x1="138" y1="250" x2="124" y2="288" stroke-width="12" stroke="#f5d6b6"/>
    <line x1="140" y1="296" x2="136" y2="300" stroke-width="13" stroke="#4f6d7a"/>
    <line x1="160" y1="296" x2="164" y2="300" stroke-width="13" stroke="#4f6d7a"/>
    <circle cx="142" cy="206" r="3" fill="#2b3a42"/>
    <circle cx="158" cy="206" r="3" fill="#2b3a42"/>
    <path d="M142 220 Q150 226 158 220" fill="none"/>
  </g>
  <text x="150" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">child</text>

  <!-- Speech bubble -->
  <g>
    <path d="M196 150 Q196 132 222 132 L300 132 Q326 132 326 150 L326 172 Q326 190 300 190 L244 190 L232 206 L232 190 Q196 190 196 172 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="261" y="170" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">I need help</text>
  </g>

  <!-- Trusted grown-up (wheelchair user) -->
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="372" cy="200" r="30" fill="#8f5f3d"/>
    <rect x="350" y="232" width="44" height="44" rx="14" fill="#6b93b6"/>
    <line x1="358" y1="246" x2="334" y2="196" stroke-width="14" stroke="#8f5f3d"/>
    <path d="M328 194 L328 184 L340 184 L340 194 Z" fill="#8f5f3d"/>
    <line x1="386" y1="246" x2="400" y2="282" stroke-width="12" stroke="#8f5f3d"/>
    <circle cx="362" cy="196" r="3" fill="#2b3a42"/>
    <circle cx="382" cy="196" r="3" fill="#2b3a42"/>
    <path d="M362 212 Q372 218 382 212" fill="none"/>
  </g>
  <!-- wheelchair -->
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="350" y="276" width="46" height="10" rx="4" fill="#4f6d7a"/>
    <circle cx="352" cy="286" r="14" fill="#dbe6d2" stroke-width="3"/>
    <circle cx="352" cy="286" r="3" fill="#2b3a42" stroke="none"/>
    <circle cx="394" cy="286" r="14" fill="#dbe6d2" stroke-width="3"/>
    <circle cx="394" cy="286" r="3" fill="#2b3a42" stroke="none"/>
    <line x1="366" y1="284" x2="362" y2="298" stroke="#4f6d7a" stroke-width="9"/>
    <line x1="380" y1="284" x2="384" y2="298" stroke="#4f6d7a" stroke-width="9"/>
    <line x1="356" y1="298" x2="390" y2="298" stroke-width="3"/>
  </g>
  <text x="372" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">trusted grown-up</text>

  <!-- Help hand -->
  <text x="256" y="366" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">My help hand</text>
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- palm -->
    <ellipse cx="256" cy="440" rx="52" ry="34" fill="#e6bb92"/>
    <!-- five fingers -->
    <path d="M214 430 L206 388" stroke-width="14" fill="none"/>
    <path d="M236 414 L228 372" stroke-width="14" fill="none"/>
    <path d="M256 410 L256 364" stroke-width="14" fill="none"/>
    <path d="M276 414 L284 372" stroke-width="14" fill="none"/>
    <path d="M298 430 L306 388" stroke-width="14" fill="none"/>
  </g>
  <!-- finger labels -->
  <text x="206" y="378" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">caregiver</text>
  <text x="230" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">grandparent</text>
  <text x="256" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">teacher</text>
  <text x="284" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">nurse</text>
  <text x="306" y="378" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">neighbor</text>

  <text x="256" y="498" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">You choose who you trust — one trusted adult on each finger.</text>
  <text x="256" y="506" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Asking for help is a strength. Telling is never wrong, and you are never in trouble for telling.</text>
</svg>
