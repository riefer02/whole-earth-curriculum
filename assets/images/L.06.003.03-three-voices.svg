<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Three communication voices</title>
  <desc id="d">Three figures in a row. The left figure is hunched and silent, labeled passive, with a thought bubble reading "whatever you want." The middle figure points sharply and shouts, labeled aggressive, with a speech bubble reading "do it my way or else." The right figure stands upright and calm, labeled assertive, with a speech bubble reading "I need quiet to finish — can we talk after?" A check mark marks the assertive figure.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <!-- passive figure -->
  <g>
    <text x="90" y="60" font-family="sans-serif" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">passive</text>
    <circle cx="90" cy="120" r="16" fill="#f2c9a0"/>
    <path d="M74 118 C 80 106, 100 106, 106 118 Z" fill="#2b3a42"/>
    <rect x="76" y="136" width="28" height="40" rx="9" fill="#7a9e7e"/>
    <path d="M78 146 L 60 170" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M102 146 L 120 170" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M84 176 L 80 204" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <path d="M96 176 L 100 204" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <!-- shoulders hunched -->
    <path d="M60 150 C 70 138, 110 138, 120 150" fill="none" stroke="#2b3a42" stroke-width="3" stroke-dasharray="4 3"/>
    <!-- thought bubble -->
    <ellipse cx="52" cy="260" rx="70" ry="26" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="52" y="265" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">"whatever you want"</text>
  </g>
  <!-- aggressive figure -->
  <g>
    <text x="256" y="60" font-family="sans-serif" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">aggressive</text>
    <circle cx="256" cy="120" r="16" fill="#d9a066"/>
    <path d="M240 118 C 246 106, 266 106, 272 118 Z" fill="#2b3a42"/>
    <rect x="242" y="136" width="28" height="40" rx="9" fill="#e0a458"/>
    <path d="M244 146 L 210 160" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M268 146 L 300 156" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M250 176 L 246 204" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <path d="M262 176 L 266 204" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <!-- pointing arm -->
    <path d="M268 150 L 312 120" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M312 120 L 320 112" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <!-- speech bubble -->
    <rect x="196" y="250" width="120" height="46" rx="10" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M228 296 L 220 314 L 246 296 Z" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="256" y="277" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">"do it my way</text>
    <text x="256" y="291" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">or else!"</text>
  </g>
  <!-- assertive figure -->
  <g>
    <text x="424" y="60" font-family="sans-serif" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">assertive ✓</text>
    <circle cx="424" cy="120" r="16" fill="#a9714b"/>
    <rect x="410" y="136" width="28" height="40" rx="9" fill="#6b93b6"/>
    <path d="M412 146 L 398 168" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M436 146 L 450 168" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M418 176 L 414 204" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <path d="M430 176 L 434 204" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <!-- calm upright posture line -->
    <path d="M396 160 L 452 160" stroke="#7a9e7e" stroke-width="3" stroke-dasharray="4 3"/>
    <!-- speech bubble -->
    <rect x="356" y="250" width="140" height="60" rx="10" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M396 310 L 388 328 L 414 310 Z" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="426" y="274" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">"I need quiet to</text>
    <text x="426" y="288" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">finish — can we</text>
    <text x="426" y="302" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">talk after?"</text>
  </g>
</svg>
