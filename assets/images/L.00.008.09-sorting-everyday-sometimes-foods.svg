<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Sorting everyday and sometimes foods</title>
  <desc id="desc">Two labeled groups of foods. The everyday group (eat often) shows a rice bowl, fruit, a vegetable, beans, and milk. The sometimes group (now and then) shows a sweet, a slice of cake, a fizzy drink, and a special festival dish. Each food has a word label. A footer says no food is good or bad — how often makes the difference. Shapes and labels carry the meaning in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Sorting Everyday and Sometimes Foods</text>

  <!-- Everyday column -->
  <g>
    <rect x="24" y="64" width="228" height="388" rx="14" fill="#ffffff" stroke="#7a9e7e" stroke-width="3"/>
    <rect x="24" y="64" width="228" height="56" rx="14" fill="#7a9e7e"/>
    <text x="138" y="98" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222222">everyday</text>
    <text x="138" y="134" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">eat often</text>

    <!-- rice -->
    <path d="M56 174 L104 174 L96 202 L64 202 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="80" cy="174" rx="24" ry="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <text x="80" y="222" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">rice</text>

    <!-- fruit -->
    <circle cx="196" cy="178" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="196" y1="162" x2="196" y2="154" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
    <text x="196" y="222" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">fruit</text>

    <!-- vegetable -->
    <path d="M60 258 L84 288 L36 288 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <line x1="60" y1="258" x2="60" y2="246" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
    <text x="60" y="308" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">vegetable</text>

    <!-- beans -->
    <ellipse cx="186" cy="276" rx="16" ry="11" fill="#8a6f52" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="206" cy="282" rx="16" ry="11" fill="#8a6f52" stroke="#2b3a42" stroke-width="2"/>
    <text x="196" y="308" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">beans</text>

    <!-- milk -->
    <rect x="120" y="334" width="26" height="36" rx="5" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <line x1="120" y1="344" x2="146" y2="344" stroke="#6b93b6" stroke-width="2"/>
    <text x="133" y="390" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">milk</text>

    <text x="138" y="432" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">keep my body going every day</text>
  </g>

  <!-- Sometimes column -->
  <g>
    <rect x="260" y="64" width="228" height="388" rx="14" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
    <rect x="260" y="64" width="228" height="56" rx="14" fill="#e0a458"/>
    <text x="374" y="98" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222222">sometimes</text>
    <text x="374" y="134" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">now and then</text>

    <!-- sweet -->
    <circle cx="312" cy="178" r="18" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="312" y1="196" x2="312" y2="216" stroke="#4f6d7a" stroke-width="4" stroke-linecap="round"/>
    <text x="312" y="222" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">sweet</text>

    <!-- cake -->
    <path d="M428 176 L466 176 L466 194 L450 206 L428 194 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <rect x="430" y="164" width="36" height="12" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="446" y="222" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">cake</text>

    <!-- drink -->
    <rect x="296" y="244" width="32" height="44" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="304" y="236" width="16" height="8" rx="3" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="306" cy="266" r="2"/>
      <circle cx="316" cy="262" r="2"/>
      <circle cx="308" cy="274" r="2"/>
    </g>
    <text x="312" y="308" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">drink</text>

    <!-- special festival dish -->
    <ellipse cx="438" cy="272" rx="26" ry="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="438" cy="268" rx="16" ry="12" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#e0a458" stroke-width="2" stroke-linecap="round">
      <line x1="462" y1="252" x2="466" y2="248"/>
      <line x1="470" y1="262" x2="475" y2="260"/>
      <line x1="464" y1="274" x2="468" y2="278"/>
    </g>
    <text x="438" y="308" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">special dish</text>

    <text x="374" y="432" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">make days special</text>
  </g>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">No food is good or bad — how often makes the difference.</text>
</svg>
