<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Many ways to say a feeling: words, drawing, movement, sound</title>
  <desc id="desc">Four cards in a two-by-two grid showing four ways one feeling can be expressed. WORDS shows a speech bubble saying "I feel scared." DRAWING shows a paper with a dark cloud and a wobbly line. MOVEMENT shows a small figure hiding its face with its hands. SOUND shows a drum with two musical notes. Each card is labeled with its word, so meaning does not depend on color and it prints clearly in grayscale.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Many Ways to Say a Feeling</text>

  <!-- Card frames -->
  <rect x="16" y="88" width="232" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="264" y="88" width="232" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="16" y="252" width="232" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="264" y="252" width="232" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Card 1: WORDS -->
  <text x="132" y="116" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4f6d7a">WORDS</text>
  <g>
    <rect x="60" y="132" width="144" height="58" rx="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M96 190 L90 202 L112 190 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="132" y="166" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">I feel scared</text>
  </g>

  <!-- Card 2: DRAWING -->
  <text x="380" y="116" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4f6d7a">DRAWING</text>
  <g>
    <rect x="314" y="130" width="132" height="78" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M338 172 Q342 160 352 158 Q364 152 374 160 Q382 154 386 164 Q390 170 388 174 Q392 180 386 182 Q376 188 364 182 Q346 180 338 172 Z" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <path d="M346 206 Q352 198 358 206 Q364 214 370 206" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Card 3: MOVEMENT -->
  <text x="132" y="280" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4f6d7a">MOVEMENT</text>
  <g>
    <circle cx="132" cy="322" r="17" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <line x1="118" y1="310" x2="110" y2="320" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="146" y1="310" x2="154" y2="320" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <circle cx="108" cy="322" r="5" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="156" cy="322" r="5" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <rect x="121" y="340" width="22" height="30" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <line x1="125" y1="370" x2="121" y2="386" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="139" y1="370" x2="143" y2="386" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Card 4: SOUND -->
  <text x="380" y="280" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4f6d7a">SOUND</text>
  <g>
    <rect x="348" y="326" width="64" height="38" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="346" y="320" width="68" height="10" rx="5" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="356" cy="298" rx="6" ry="4.5" fill="#2b3a42"/>
    <line x1="362" y1="298" x2="362" y2="280" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M362 280 Q372 284 374 294" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="392" cy="292" rx="5.5" ry="4" fill="#2b3a42"/>
    <line x1="397" y1="292" x2="397" y2="276" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M397 276 Q405 280 407 288" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Bottom note -->
  <text x="256" y="436" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">One feeling, many ways. Your way is a good way.</text>
</svg>
