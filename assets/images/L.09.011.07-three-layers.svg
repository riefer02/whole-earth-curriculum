<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Systemic injustice: actions inside rules inside structures</title>
  <desc id="desc">Three nested circles: an innermost circle labeled individual actions, a middle ring labeled rules and norms, and an outer ring labeled structures and institutions, showing that unfair outcomes come from all three layers working together.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Systemic Injustice: Three Layers</text>

  <!-- outer ring -->
  <circle cx="256" cy="270" r="180" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="104" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Structures &amp; institutions</text>
  <text x="256" y="122" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">laws, markets, schools, media,</text>
  <text x="256" y="138" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">history — the durable rules of the game</text>

  <!-- middle ring -->
  <circle cx="256" cy="270" r="124" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">Rules &amp; norms</text>
  <text x="256" y="198" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">policies, customs,</text>
  <text x="256" y="214" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">unwritten expectations</text>

  <!-- inner circle -->
  <circle cx="256" cy="270" r="64" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="262" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">Individual</text>
  <text x="256" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">actions</text>

  <!-- arrow to outcome -->
  <path d="M256 450 L256 470" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M249 463 L256 470 L263 463" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Unfair outcomes that no single person chose</text>
</svg>
