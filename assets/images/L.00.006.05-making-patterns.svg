<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-00-006-05-making-patterns desc-L-00-006-05-making-patterns">
  <title id="title-L-00-006-05-making-patterns">Making and continuing patterns: what comes next?</title>
  <desc id="desc-L-00-006-05-making-patterns">A repeating pattern of a shell, a pebble, a shell, a pebble, a shell sits in a row, ending in a dashed empty spot with a question mark. Below, an answer strip shows the same pattern finished with a pebble in the empty spot, labeled next equals pebble, with a check mark. This teaches that a pattern repeats, so you can say what comes next. Labels and shapes carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Making and Continuing Patterns</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">A pattern repeats — so you can say what comes next.</text>

  <text x="256" y="124" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">The pattern</text>

  <defs>
    <g id="shell">
      <path d="M0 26 L-24 0 Q0 -24 24 0 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
      <path d="M0 26 L-13 -3 M0 26 L0 -16 M0 26 L13 -3" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- shell, pebble, shell … -->
  <use href="#shell" x="72" y="222"/>
  <ellipse cx="150" cy="222" rx="25" ry="17" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <use href="#shell" x="228" y="222"/>
  <ellipse cx="306" cy="222" rx="25" ry="17" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <use href="#shell" x="384" y="222"/>

  <!-- the empty spot: what comes next? -->
  <circle cx="462" cy="222" r="30" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="462" y="232" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#4f6d7a">?</text>

  <text x="256" y="292" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">Shell, pebble, shell, pebble, shell … what comes next?</text>

  <!-- Answer strip -->
  <rect x="72" y="318" width="368" height="112" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.5"/>
  <text x="256" y="348" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Keep it going</text>
  <ellipse cx="152" cy="388" rx="22" ry="15" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="240" y="396" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">next = pebble</text>
  <path d="M310 388 l11 11 l20 -24" fill="none" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="256" y="472" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Read the pattern aloud and it tells you what comes next.</text>
</svg>
