<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The greenhouse effect warms the Earth</title>
  <desc id="desc">The sun's incoming light reaches and warms the Earth's surface. The surface emits heat, shown as wavy arrows. A layer of greenhouse gases lets sunlight in but traps some outgoing heat and sends part of it back to the surface, keeping the planet warm.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">Greenhouse Gases Trap Some Heat</text>

  <!-- space background -->
  <rect x="40" y="70" width="432" height="240" fill="#f2efea" stroke="#4f6d7a" stroke-width="1.5"/>

  <!-- sun -->
  <circle cx="92" cy="110" r="20" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>

  <!-- greenhouse gas layer -->
  <g fill="#6b93b6" opacity="0.55">
    <circle cx="180" cy="150" r="7"/>
    <circle cx="220" cy="142" r="7"/>
    <circle cx="262" cy="150" r="7"/>
    <circle cx="304" cy="142" r="7"/>
    <circle cx="346" cy="150" r="7"/>
  </g>
  <text x="430" y="120" text-anchor="end" font-family="sans-serif" font-size="13" fill="#4f6d7a">greenhouse gases</text>

  <!-- Earth surface -->
  <rect x="40" y="262" width="432" height="48" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="60" y="292" font-family="sans-serif" font-size="14" fill="#222222">Earth&#8217;s surface</text>

  <!-- incoming sunlight -->
  <line x1="112" y1="112" x2="250" y2="262" stroke="#e0a458" stroke-width="2.5"/>
  <line x1="92" y1="132" x2="160" y2="262" stroke="#e0a458" stroke-width="2.5"/>
  <polygon points="250,262 240,252 240,266" fill="#e0a458"/>
  <polygon points="160,262 150,252 150,266" fill="#e0a458"/>

  <!-- outgoing heat (infrared), wavy -->
  <path d="M200 262 Q188 230 208 206 Q224 188 214 168" fill="none" stroke="#e0a458" stroke-width="2.5"/>
  <path d="M300 262 Q312 230 292 206 Q276 188 286 168" fill="none" stroke="#e0a458" stroke-width="2.5"/>

  <!-- heat trapped, reflected back down -->
  <path d="M214 168 Q206 196 226 218 Q240 234 236 262" fill="none" stroke="#e0a458" stroke-width="2.5" stroke-dasharray="5 4"/>
  <polygon points="236,262 230,252 240,252" fill="#e0a458"/>

  <text x="256" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Sunlight passes through; heat is partly held back and sent down again.</text>

  <rect x="60" y="366" width="392" height="112" rx="8" fill="#ffffff" stroke="#4f6d7a" stroke-width="1.5"/>
  <text x="76" y="390" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">More greenhouse gases = more heat trapped = a warmer planet.</text>
  <text x="76" y="414" font-family="sans-serif" font-size="13" fill="#4f6d7a">Burning fossil fuels adds carbon dioxide and methane.</text>
  <text x="76" y="434" font-family="sans-serif" font-size="13" fill="#4f6d7a">The effect itself is natural and keeps Earth livable —</text>
  <text x="76" y="452" font-family="sans-serif" font-size="13" fill="#4f6d7a">the problem is how fast human activity has strengthened it.</text>
</svg>
