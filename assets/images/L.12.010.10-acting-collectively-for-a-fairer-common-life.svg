<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Acting Collectively for a Fairer Common Life</title>
  <desc id="desc">Five boxes in a flow: "goal," "allies," "steps," "likely effects," "how we will know it helped." Around them, small diverse figures stand together. A footer reads "success is collective." Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42" font-weight="bold">Acting Collectively for a Fairer Common Life</text>

  <!-- five boxes -->
  <rect x="20" y="80" width="140" height="64" rx="6" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <text x="90" y="117" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42" font-weight="bold">goal</text>

  <rect x="186" y="80" width="140" height="64" rx="6" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <text x="256" y="117" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42" font-weight="bold">allies</text>

  <rect x="352" y="80" width="140" height="64" rx="6" fill="none" stroke="#e0a458" stroke-width="3"/>
  <text x="422" y="117" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42" font-weight="bold">steps</text>

  <rect x="80" y="180" width="160" height="64" rx="6" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="160" y="217" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42" font-weight="bold">likely effects</text>

  <rect x="272" y="180" width="160" height="64" rx="6" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="352" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">how we will know</text>
  <text x="352" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">it helped</text>

  <!-- figures -->
  <g stroke="#4f6d7a" stroke-width="3" fill="none">
    <circle cx="120" cy="330" r="10"/>
    <line x1="120" y1="340" x2="120" y2="366"/>
    <line x1="120" y1="350" x2="104" y2="340"/>
    <line x1="120" y1="350" x2="136" y2="340"/>
    <line x1="120" y1="366" x2="108" y2="386"/>
    <line x1="120" y1="366" x2="132" y2="386"/>
  </g>
  <g stroke="#4f6d7a" stroke-width="3" fill="none">
    <circle cx="220" cy="328" r="10"/>
    <line x1="220" y1="338" x2="220" y2="364"/>
    <line x1="220" y1="348" x2="204" y2="338"/>
    <line x1="220" y1="348" x2="236" y2="338"/>
    <line x1="220" y1="364" x2="208" y2="384"/>
    <line x1="220" y1="364" x2="232" y2="384"/>
  </g>
  <g stroke="#4f6d7a" stroke-width="3" fill="none">
    <circle cx="320" cy="330" r="10"/>
    <line x1="320" y1="340" x2="320" y2="366"/>
    <line x1="320" y1="350" x2="304" y2="340"/>
    <line x1="320" y1="350" x2="336" y2="340"/>
    <line x1="320" y1="366" x2="308" y2="386"/>
    <line x1="320" y1="366" x2="332" y2="386"/>
  </g>
  <g stroke="#4f6d7a" stroke-width="3" fill="none">
    <circle cx="420" cy="328" r="10"/>
    <line x1="420" y1="338" x2="420" y2="364"/>
    <line x1="420" y1="348" x2="404" y2="338"/>
    <line x1="420" y1="348" x2="436" y2="338"/>
    <line x1="420" y1="364" x2="408" y2="384"/>
    <line x1="420" y1="364" x2="432" y2="384"/>
  </g>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">The common good is built by common hands —</text>
  <text x="256" y="476" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">success is collective.</text>
</svg>
