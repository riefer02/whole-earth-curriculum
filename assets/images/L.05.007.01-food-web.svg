<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640" role="img" aria-labelledby="title desc">
  <title id="title">A food web</title>
  <desc id="desc">A food-web diagram showing energy flow from the Sun into producers and up through consumers, with decomposers recycling matter. The Sun at the top sends an arrow down to a grass plant labeled producer. The grass sends arrows to a grasshopper and a rabbit (both consumers). The grasshopper sends an arrow to a frog, the rabbit to a fox, the frog to a snake, and the snake and fox to an eagle (consumers). Dashed arrows from the plants and animals lead down to mushrooms and a worm labeled decomposers, and a dashed arrow labeled nutrients return leads back up from the decomposers to the soil and grass. Every arrow is labeled to show the direction energy moves, from the eaten to the eater. Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="640" fill="#fdfbf7"/>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2b3a42"/>
    </marker>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4f6d7a"/>
    </marker>
  </defs>

  <text x="256" y="32" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">A Food Web</text>
  <text x="256" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">the arrow points from the eaten to the eater</text>

  <!-- Sun -->
  <circle cx="256" cy="92" r="26" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="256" y1="56" x2="256" y2="44"/>
    <line x1="256" y1="128" x2="256" y2="140"/>
    <line x1="220" y1="92" x2="208" y2="92"/>
    <line x1="292" y1="92" x2="304" y2="92"/>
    <line x1="230" y1="66" x2="222" y2="58"/>
    <line x1="282" y1="66" x2="290" y2="58"/>
    <line x1="230" y1="118" x2="222" y2="126"/>
    <line x1="282" y1="118" x2="290" y2="126"/>
  </g>
  <text x="256" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">Sun</text>
  <text x="256" y="104" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2b3a42">light</text>

  <!-- Sun to grass -->
  <line x1="256" y1="120" x2="256" y2="158" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr)"/>
  <text x="262" y="150" font-family="sans-serif" font-size="11" fill="#2b3a42">energy in</text>

  <!-- Producer: grass -->
  <rect x="196" y="160" width="120" height="44" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="178" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">grass</text>
  <text x="256" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">producer</text>

  <!-- grass to grasshopper -->
  <line x1="196" y1="176" x2="132" y2="216" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr)"/>
  <!-- grass to rabbit -->
  <line x1="316" y1="176" x2="380" y2="216" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr)"/>

  <!-- grasshopper -->
  <rect x="56" y="220" width="150" height="44" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="131" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">grasshopper</text>
  <text x="131" y="256" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">consumer · herbivore</text>

  <!-- rabbit -->
  <rect x="306" y="220" width="150" height="44" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="381" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">rabbit</text>
  <text x="381" y="256" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">consumer · herbivore</text>

  <!-- grasshopper to frog -->
  <line x1="131" y1="264" x2="131" y2="304" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr)"/>
  <!-- rabbit to fox -->
  <line x1="381" y1="264" x2="381" y2="304" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr)"/>

  <!-- frog -->
  <rect x="56" y="306" width="150" height="44" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="131" y="324" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">frog</text>
  <text x="131" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">consumer · carnivore</text>

  <!-- fox -->
  <rect x="306" y="306" width="150" height="44" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="381" y="324" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">fox</text>
  <text x="381" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">consumer · carnivore</text>

  <!-- frog to snake -->
  <line x1="131" y1="350" x2="200" y2="396" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr)"/>
  <!-- fox to eagle -->
  <line x1="381" y1="350" x2="312" y2="442" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr)"/>

  <!-- snake -->
  <rect x="180" y="398" width="120" height="44" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="240" y="416" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">snake</text>
  <text x="240" y="434" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">consumer · carnivore</text>

  <!-- snake to eagle -->
  <line x1="240" y1="442" x2="256" y2="478" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr)"/>

  <!-- eagle -->
  <rect x="196" y="480" width="120" height="44" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="498" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">eagle</text>
  <text x="256" y="516" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">top consumer</text>

  <!-- dead matter arrows down to decomposers -->
  <line x1="56" y1="330" x2="96" y2="566" stroke="#4f6d7a" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrD)"/>
  <line x1="256" y1="524" x2="216" y2="566" stroke="#4f6d7a" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrD)"/>
  <line x1="456" y1="330" x2="416" y2="566" stroke="#4f6d7a" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrD)"/>
  <text x="20" y="470" font-family="sans-serif" font-size="11" fill="#4f6d7a">dead matter</text>

  <!-- decomposers box -->
  <rect x="96" y="566" width="320" height="46" rx="10" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="584" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">mushrooms + worms</text>
  <text x="256" y="602" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">decomposers</text>

  <!-- nutrients return up to grass -->
  <line x1="150" y1="566" x2="220" y2="204" stroke="#4f6d7a" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrD)"/>
  <text x="104" y="400" font-family="sans-serif" font-size="11" fill="#4f6d7a">nutrients return</text>
</svg>
