    <path d="M275 402 L395 402" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- confetti -->
    <circle cx="286" cy="322" r="3" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
    <path d="M308 314 L311 320 L317 322 L311 324 L308 330 L305 324 L299 322 L305 320 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M326 324 L330 329 L326 334 L322 329 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="338" cy="316" r="3" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
    <path d="M282 334 L286 339 L282 344 L278 339 Z" fill="#c99567" stroke="#2b3a42" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- celebrator left -->
    <circle cx="300" cy="344" r="8" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="297" cy="343" r="1.2" fill="#2b3a42"/>
    <circle cx="303" cy="343" r="1.2" fill="#2b3a42"/>
    <path d="M297 347 Q300 349 303 347" fill="none" stroke="#2b3a42" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="293" y="352" width="14" height="26" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M296 378 L296 402" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M304 378 L304 402" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M294 354 L286 340" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <path d="M306 354 L314 340" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <!-- celebrator right -->
