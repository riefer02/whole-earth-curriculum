<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">What we do together: five ways people share a community</title>
  <desc id="desc">Five small panels, each labeled with one thing people do together in a community: planting, cooking, building, helping, and celebrating. Each panel shows two simple people doing the thing together. Skin tones and clothing vary across all the people; one person uses a wheelchair while handing a basket to a neighbor. The panels are separated by labels and the activities are shown by their props and actions, not by color, so the picture prints clearly in grayscale and teaches that communities are built on people doing things together.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">What We Do Together</text>
  <text x="256" y="62" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Communities are built on people doing things together.</text>

  <!-- ===== Row 1 ===== -->

  <!-- Panel 1: planting -->
  <g>
    <rect x="14" y="84" width="148" height="160" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M24 192 L152 192" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M44 192 Q56 184 68 192" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M56 190 L56 180" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M56 186 Q50 182 50 176" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M56 184 Q62 180 62 174" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- kneeling planter -->
    <circle cx="48" cy="150" r="8" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="45" cy="149" r="1.2" fill="#2b3a42"/>
    <circle cx="51" cy="149" r="1.2" fill="#2b3a42"/>
    <path d="M45 153 Q48 155 51 153" fill="none" stroke="#2b3a42" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="41" y="158" width="14" height="18" rx="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M45 168 L54 180" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <!-- standing waterer -->
    <circle cx="112" cy="146" r="8" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="109" cy="145" r="1.2" fill="#2b3a42"/>
    <circle cx="115" cy="145" r="1.2" fill="#2b3a42"/>
    <path d="M109 149 Q112 151 115 149" fill="none" stroke="#2b3a42" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="105" y="154" width="14" height="26" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M108 180 L108 192" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M116 180 L116 192" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M111 158 L102 168" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <rect x="92" y="166" width="16" height="12" rx="3" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <path d="M92 170 L82 176" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M84 180 L84 185" stroke="#6b93b6" stroke-width="2" stroke-linecap="round"/>
    <path d="M81 182 L81 187" stroke="#6b93b6" stroke-width="2" stroke-linecap="round"/>
    <path d="M87 182 L87 187" stroke="#6b93b6" stroke-width="2" stroke-linecap="round"/>
    <text x="88" y="230" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">planting</text>
  </g>

