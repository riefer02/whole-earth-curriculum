    <circle cx="130" cy="394" r="2" fill="#2b3a42"/>
    <circle cx="146" cy="394" r="6" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
    <circle cx="146" cy="394" r="2" fill="#2b3a42"/>
    <!-- basket handed between them -->
    <rect x="158" y="354" width="14" height="12" rx="3" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M158 354 Q165 348 172 354" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <!-- standing neighbor -->
    <circle cx="190" cy="350" r="8" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="187" cy="349" r="1.2" fill="#2b3a42"/>
    <circle cx="193" cy="349" r="1.2" fill="#2b3a42"/>
    <path d="M187 353 Q190 355 193 353" fill="none" stroke="#2b3a42" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="183" y="358" width="14" height="26" rx="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M186 384 L186 402" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M194 384 L194 402" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M183 362 L172 360" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <text x="173" y="430" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">helping</text>
  </g>

  <!-- Panel 5: celebrating -->
