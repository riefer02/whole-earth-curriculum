    <circle cx="337" cy="343" r="1.2" fill="#2b3a42"/>
    <circle cx="343" cy="343" r="1.2" fill="#2b3a42"/>
    <path d="M337 347 Q340 349 343 347" fill="none" stroke="#2b3a42" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="333" y="352" width="14" height="26" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
