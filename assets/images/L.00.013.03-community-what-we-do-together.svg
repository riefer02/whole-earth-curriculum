    <path d="M236 170 Q238 164 240 170" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
    <path d="M248 172 Q250 167 252 172" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
    <!-- cook left -->
    <circle cx="204" cy="150" r="8" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="201" cy="149" r="1.2" fill="#2b3a42"/>
    <circle cx="207" cy="149" r="1.2" fill="#2b3a42"/>
    <path d="M201 153 Q204 155 207 153" fill="none" stroke="#2b3a42" stroke-width="1.5" stroke-linecap="round"/>
