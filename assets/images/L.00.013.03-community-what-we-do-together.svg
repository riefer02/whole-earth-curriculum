    <circle cx="268" cy="150" r="8" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="265" cy="149" r="1.2" fill="#2b3a42"/>
    <circle cx="271" cy="149" r="1.2" fill="#2b3a42"/>
    <path d="M265 153 Q268 155 271 153" fill="none" stroke="#2b3a42" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="261" y="158" width="14" height="26" rx="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M264 184 L264 196" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M272 184 L272 196" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M268 162 L258 176" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <text x="256" y="230" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">cooking</text>
  </g>

  <!-- Panel 3: building -->
  <g>
    <rect x="350" y="84" width="148" height="160" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M360 192 L488 192" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
