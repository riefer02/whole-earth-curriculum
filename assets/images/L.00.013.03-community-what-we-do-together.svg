    <rect x="394" y="128" width="14" height="11" rx="2" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M398 146 L398 139" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <!-- builder carrying beam -->
    <circle cx="448" cy="148" r="8" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="445" cy="147" r="1.2" fill="#2b3a42"/>
    <circle cx="451" cy="147" r="1.2" fill="#2b3a42"/>
    <path d="M445 151 Q448 153 451 151" fill="none" stroke="#2b3a42" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="441" y="156" width="14" height="24" rx="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M444 180 L444 192" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M452 180 L452 192" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M436 162 L462 162" stroke="#4f6d7a" stroke-width="4" stroke-linecap="round"/>
    <text x="424" y="230" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">building</text>
  </g>

  <!-- ===== Row 2 ===== -->

  <!-- Panel 4: helping -->
  <g>
    <rect x="99" y="272" width="148" height="160" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M109 402 L229 402" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- person in wheelchair handing basket -->
    <circle cx="138" cy="358" r="8" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="135" cy="357" r="1.2" fill="#2b3a42"/>
    <circle cx="141" cy="357" r="1.2" fill="#2b3a42"/>
