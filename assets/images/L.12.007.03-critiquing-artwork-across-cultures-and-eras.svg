<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The critique ladder: describe, analyze, interpret, evaluate</title>
  <desc id="desc">A four-rung ladder labeled, from bottom to top: describe, analyze, interpret, evaluate. Beside it a small framed artwork with an arrow pointing up the ladder. Labels carry the meaning, so it prints clearly in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">The Critique Ladder</text>

  <!-- Artwork -->
  <g>
    <rect x="352" y="96" width="112" height="112" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M368 188 L398 146 L418 176 L432 158 L452 188 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M416 96 L416 208" stroke="#2b3a42" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>
  <path d="M430 220 L340 300" fill="none" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>

  <!-- Ladder rails -->
  <line x1="150" y1="96" x2="150" y2="440" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="300" y1="96" x2="300" y2="440" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>

  <!-- Rung 1: describe -->
  <line x1="150" y1="120" x2="300" y2="120" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <text x="150" y="200" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">describe</text>

  <!-- Rung 2: analyze -->
  <line x1="150" y1="230" x2="300" y2="230" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <text x="150" y="300" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">analyze</text>

  <!-- Rung 3: interpret -->
  <line x1="150" y1="340" x2="300" y2="340" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <text x="150" y="400" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">interpret</text>

  <!-- Rung 4: evaluate -->
  <line x1="150" y1="440" x2="300" y2="440" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <text x="150" y="478" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">evaluate</text>
</svg>
