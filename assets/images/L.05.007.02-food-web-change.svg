<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 400" role="img" aria-labelledby="title desc">
  <title id="title">One part of a food web changes</title>
  <desc id="desc">Two side-by-side panels. The left panel shows a healthy food chain: a grass plant at the bottom, a grasshopper above it, a frog above that, and a snake at the top, joined by upward arrows. A small caption reads before. The right panel shows the same chain with the frog crossed out and labeled frog removed. A large up-arrow beside the grasshopper is labeled more grasshoppers, and a large down-arrow beside the snake is labeled fewer snakes. Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="400" fill="#fdfbf7"/>

  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2b3a42"/>
    </marker>
  </defs>

  <text x="256" y="32" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">When One Part of a Food Web Changes</text>

  <!-- LEFT PANEL: before -->
  <text x="128" y="66" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">Before</text>

  <rect x="88" y="120" width="80" height="40" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="128" y="145" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">snake</text>

  <rect x="88" y="205" width="80" height="40" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="128" y="230" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">frog</text>

  <rect x="88" y="290" width="80" height="40" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="128" y="315" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">grasshopper</text>

  <rect x="88" y="348" width="80" height="40" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="128" y="373" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">grass</text>

  <line x1="128" y1="205" x2="128" y2="160" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="128" y1="290" x2="128" y2="245" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="128" y1="348" x2="128" y2="330" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- RIGHT PANEL: after -->
  <text x="384" y="66" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">After: frog removed</text>

  <rect x="344" y="120" width="80" height="40" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="384" y="145" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">snake</text>

  <!-- frog removed -->
  <rect x="344" y="205" width="80" height="40" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="384" y="230" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">frog</text>
  <line x1="340" y1="200" x2="428" y2="250" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="428" y1="200" x2="340" y2="250" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="384" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">removed</text>

  <rect x="344" y="290" width="80" height="40" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="384" y="315" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">grasshopper</text>

  <rect x="344" y="348" width="80" height="40" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="384" y="373" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">grass</text>

  <line x1="384" y1="290" x2="384" y2="330" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr2)"/>
  <!-- broken link frog-snake shown as faded -->
  <line x1="384" y1="205" x2="384" y2="160" stroke="#2b3a42" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- ripple arrows -->
  <line x1="438" y1="290" x2="438" y2="330" stroke="#2b3a42" stroke-width="3" marker-end="url(#arr2)"/>
  <text x="466" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">more</text>
  <text x="466" y="321" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">grasshoppers</text>

  <line x1="438" y1="160" x2="438" y2="120" stroke="#2b3a42" stroke-width="3" marker-end="url(#arr2)"/>
  <text x="466" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">fewer</text>
  <text x="466" y="151" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">snakes</text>

  <text x="256" y="398" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">remove one part, and the change ripples through the web</text>
</svg>
