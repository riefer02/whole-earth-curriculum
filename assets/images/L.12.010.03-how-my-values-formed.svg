<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">How My Values Formed</title>
  <desc id="desc">A tree. Roots are labeled "family," "community," "culture," "faith," "school," "peers," "media," "experience." The trunk is labeled "my values." Branches are labeled "still growing" and "still open — a question, not a creed." Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#2b3a42" font-weight="bold">How My Values Formed</text>

  <!-- branches -->
  <path d="M256 150 Q256 120 190 96" fill="none" stroke="#4f6d7a" stroke-width="5"/>
  <path d="M256 150 Q256 118 322 96" fill="none" stroke="#4f6d7a" stroke-width="5"/>
  <ellipse cx="190" cy="86" rx="52" ry="20" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <ellipse cx="322" cy="86" rx="52" ry="20" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="190" y="90" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2b3a42" font-weight="bold">still growing</text>
  <text x="322" y="86" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2b3a42" font-weight="bold">still open</text>
  <text x="322" y="100" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4f6d7a">a question, not a creed</text>

  <!-- trunk -->
  <path d="M230 150 L238 258 L274 258 L282 150 Z" fill="none" stroke="#2b3a42" stroke-width="4"/>
  <text x="256" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">my values</text>

  <!-- roots -->
  <path d="M238 258 Q200 300 150 322" fill="none" stroke="#4f6d7a" stroke-width="4"/>
  <path d="M274 258 Q312 300 362 322" fill="none" stroke="#4f6d7a" stroke-width="4"/>
  <path d="M256 260 Q256 310 256 340" fill="none" stroke="#4f6d7a" stroke-width="4"/>
  <path d="M238 258 Q180 286 120 300" fill="none" stroke="#4f6d7a" stroke-width="4"/>
  <path d="M274 258 Q332 286 392 300" fill="none" stroke="#4f6d7a" stroke-width="4"/>

  <text x="150" y="346" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">family</text>
  <text x="256" y="356" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">community</text>
  <text x="362" y="346" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">culture</text>
  <text x="120" y="318" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">faith</text>
  <text x="392" y="318" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">school</text>
  <text x="184" y="330" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">peers</text>
  <text x="328" y="330" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">media</text>
  <text x="256" y="376" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">experience</text>

  <text x="256" y="476" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Inherited, borrowed, or chosen — a value is still being lived.</text>
</svg>
