<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Human rights belong to every person</title>
  <desc id="desc">A wheel with "every person" at the center and labeled spokes around it: life, dignity, food, water, health, education, voice, safety, play and rest. Each spoke is a small labeled rectangle connected to the center by a line.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Human rights belong to every person</text>

  <circle cx="256" cy="268" r="58" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="258" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">every</text>
  <text x="256" y="282" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">person</text>

  <!-- spokes with labels -->
  <g>
    <line x1="256" y1="210" x2="256" y2="150" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="210" y="110" width="92" height="40" rx="8" fill="#7a9e7e" opacity="0.35" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="136" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">life</text>
  </g>
  <g>
    <line x1="300" y1="234" x2="352" y2="190" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="356" y="168" width="112" height="40" rx="8" fill="#6b93b6" opacity="0.3" stroke="#2b3a42" stroke-width="2"/>
    <text x="412" y="194" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">dignity</text>
  </g>
  <g>
    <line x1="306" y1="288" x2="360" y2="322" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="362" y="304" width="128" height="40" rx="8" fill="#e0a458" opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
    <text x="426" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">food &amp; water</text>
  </g>
  <g>
    <line x1="256" y1="326" x2="256" y2="368" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="210" y="368" width="92" height="40" rx="8" fill="#7a9e7e" opacity="0.35" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="394" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">health</text>
  </g>
  <g>
    <line x1="206" y1="288" x2="152" y2="322" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="22" y="304" width="128" height="40" rx="8" fill="#6b93b6" opacity="0.3" stroke="#2b3a42" stroke-width="2"/>
    <text x="86" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">education</text>
  </g>
  <g>
    <line x1="212" y1="234" x2="160" y2="190" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="44" y="168" width="112" height="40" rx="8" fill="#7a9e7e" opacity="0.35" stroke="#2b3a42" stroke-width="2"/>
    <text x="100" y="194" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">voice</text>
  </g>
  <g>
    <line x1="226" y1="224" x2="184" y2="188" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="60" y="104" width="112" height="40" rx="8" fill="#e0a458" opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
    <text x="116" y="130" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">safety</text>
  </g>
  <g>
    <line x1="286" y1="224" x2="328" y2="188" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="340" y="104" width="140" height="40" rx="8" fill="#6b93b6" opacity="0.3" stroke="#2b3a42" stroke-width="2"/>
    <text x="410" y="130" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">play &amp; rest</text>
  </g>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">A right is a "should" — it says what every person is owed.</text>
</svg>
