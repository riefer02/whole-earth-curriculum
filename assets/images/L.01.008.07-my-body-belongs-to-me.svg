<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-01-008-07-my-body-belongs-to-me desc-L-01-008-07-my-body-belongs-to-me">
  <title id="title-L-01-008-07-my-body-belongs-to-me">My body belongs to me</title>
  <desc id="desc-L-01-008-07-my-body-belongs-to-me">A smiling child who wears a hearing aid stands inside a soft dashed circle that says my body, mine, with a small heart on the chest. Around the child are three gentle reminders: an open stop hand labeled no and stop are okay, a yes and stop card, and a speech bubble saying tell a trusted adult. There is no anatomical detail. The message is empowering and calm, and labels carry the meaning so it prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">My Body Belongs to Me</text>

  <!-- Dashed boundary circle -->
  <circle cx="256" cy="250" r="104" fill="#eef3f0" stroke="#7a9e7e" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="256" y="140" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">my body &#183; mine</text>

  <!-- Child -->
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="212" r="24" fill="#c99567"/>
    <rect x="234" y="238" width="44" height="58" rx="16" fill="#7a9e7e"/>
    <line x1="240" y1="246" x2="226" y2="288" stroke="#c99567" stroke-width="12"/>
    <line x1="272" y1="246" x2="286" y2="288" stroke="#c99567" stroke-width="12"/>
    <line x1="244" y1="294" x2="240" y2="330" stroke="#4f6d7a" stroke-width="14"/>
    <line x1="268" y1="294" x2="272" y2="330" stroke="#4f6d7a" stroke-width="14"/>
    <!-- gentle smile and eyes -->
    <circle cx="248" cy="208" r="3" fill="#2b3a42"/>
    <circle cx="264" cy="208" r="3" fill="#2b3a42"/>
    <path d="M248 220 Q256 226 264 220" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <!-- heart on chest -->
    <path d="M250 256 q-4 -5 0 -8 q4 3 6 0 q4 3 0 8 l-3 3 l-3 -3 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
    <!-- behind-the-ear hearing aid -->
    <ellipse cx="283" cy="209" rx="4" ry="7" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5" transform="rotate(18 283 209)"/>
    <path d="M283 216 q2 3 5 4" fill="none" stroke="#2b3a42" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Stop hand (left) -->
  <g>
    <circle cx="80" cy="200" r="40" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <path d="M80 184 L80 194 L70 200 L70 192 L64 195 L66 185 L76 182 Z" fill="#e6bb92" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="80" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">&#8220;no&#8221; / &#8220;stop&#8221;</text>
    <text x="80" y="270" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">is always okay</text>
  </g>

  <!-- Speech bubble (right): tell a trusted adult -->
  <g>
    <path d="M384 172 Q384 156 406 156 L474 156 Q496 156 496 172 L496 196 Q496 212 474 212 L430 212 L420 228 L420 212 Q384 212 384 196 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="440" y="186" text-anchor="middle" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#222222">tell a trusted</text>
    <text x="440" y="204" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">adult</text>
  </g>

  <!-- Yes / stop card (bottom) -->
  <g>
    <rect x="156" y="364" width="200" height="100" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <text x="256" y="390" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">my yes / stop card</text>
    <!-- yes -->
    <circle cx="206" cy="424" r="18" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M198 424 l6 6 l12 -12" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="206" y="456" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">yes</text>
    <!-- stop -->
    <path d="M306 406 L306 418 L296 424 L296 416 L290 420 L292 410 L302 407 Z" fill="#e6bb92" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="306" y="456" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">stop</text>
  </g>

  <text x="256" y="482" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">My body belongs to me. My no matters. I can always tell a</text>
  <text x="256" y="502" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">trusted adult.</text>
</svg>
