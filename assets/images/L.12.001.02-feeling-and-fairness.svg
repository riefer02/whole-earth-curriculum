<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">The ethical judgment triangle</title>
  <desc id="d">A triangle with three labeled inputs — reasons, feeling, evidence — pointing inward to a central space labeled "the judgment." Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222222">Three inputs, one judgment</text>
  <!-- triangle -->
  <path d="M256 92 L92 384 L420 384 Z" fill="#7a9e7e" opacity="0.15" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <!-- input boxes -->
  <rect x="176" y="80" width="160" height="46" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#222222">reasons</text>
  <rect x="56" y="404" width="160" height="46" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="433" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#222222">feeling</text>
  <rect x="296" y="404" width="160" height="46" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="433" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#222222">evidence</text>
  <!-- center -->
  <ellipse cx="256" cy="290" rx="78" ry="44" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#222222">the</text>
  <text x="256" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#222222">judgment</text>
  <text x="256" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6d7a">feeling is a witness, not the judge</text>
</svg>
