<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Sustainability: a balance with the future</title>
  <desc id="desc">A balance scale with today's needs on one side and the needs of future generations on the other, held level by a label that says use no faster than the Earth can renew.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">Sustainability: A Balance</text>

  <!-- scale -->
  <line x1="256" y1="96" x2="256" y2="190" stroke="#2b3a42" stroke-width="4"/>
  <line x1="140" y1="190" x2="372" y2="190" stroke="#2b3a42" stroke-width="4"/>
  <line x1="140" y1="190" x2="140" y2="212" stroke="#2b3a42" stroke-width="2"/>
  <line x1="372" y1="190" x2="372" y2="212" stroke="#2b3a42" stroke-width="2"/>
  <path d="M112 212 A 36 30 0 0 0 168 212 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <path d="M344 212 A 36 30 0 0 0 400 212 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <polygon points="256,60 248,96 264,96" fill="#2b3a42"/>

  <text x="140" y="208" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">today's needs</text>
  <text x="372" y="208" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">future needs</text>

  <!-- center rule -->
  <rect x="146" y="270" width="220" height="56" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="294" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">use no faster than</text>
  <text x="256" y="314" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">the Earth can renew</text>

  <!-- resource icons -->
  <g text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#222222">
    <path d="M96 400 q8 -14 0 -28 q-8 -14 0 -28" fill="none" stroke="#6b93b6" stroke-width="3"/>
    <text x="96" y="444">water</text>
    <path d="M200 400 q8 -18 0 -36 M216 400 q8 -22 0 -44 M232 400 q8 -18 0 -36" fill="none" stroke="#7a9e7e" stroke-width="3"/>
    <text x="216" y="444">trees</text>
    <ellipse cx="320" cy="392" rx="18" ry="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
    <path d="M338 392 l8 -10 M338 392 l-6 -12" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="320" y="444">fish</text>
    <path d="M404 400 q-6 -12 -6 -24 q0 -12 6 -24" fill="none" stroke="#4f6d7a" stroke-width="3"/>
    <text x="412" y="444">fuel</text>
  </g>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">renewable comes back · nonrenewable does not</text>
</svg>
