<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Finding the main idea</title>
  <desc id="desc">A large umbrella labeled "main idea" shelters a row of four raindrops labeled as details. The umbrella is bigger than each single raindrop, showing that the main idea covers and holds together all the details. The labels and shapes carry the meaning, so the picture prints clearly in grayscale and teaches learners that the main idea is the big idea the whole text is about, supported by its details.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Finding the Main Idea</text>

  <!-- umbrella -->
  <path d="M96 220 Q256 100 416 220 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="3"/>
  <path d="M256 220 L256 180" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="256" cy="180" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="160" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">main idea</text>
  <text x="256" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">the big idea the whole text is about</text>

  <!-- raindrops (details) -->
  <g font-family="sans-serif" font-size="14" fill="#2b3a42">
    <path d="M100 300 Q100 268 130 268 Q160 268 160 300 Q130 328 100 300 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="130" y="305" text-anchor="middle">detail</text>

    <path d="M196 300 Q196 268 226 268 Q256 268 256 300 Q226 328 196 300 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="226" y="305" text-anchor="middle">detail</text>

    <path d="M292 300 Q292 268 322 268 Q352 268 352 300 Q322 328 292 300 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="322" y="305" text-anchor="middle">detail</text>

    <path d="M388 300 Q388 268 418 268 Q448 268 448 300 Q418 328 388 300 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="418" y="305" text-anchor="middle">detail</text>
  </g>

  <text x="256" y="376" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">The main idea covers every detail, the way one umbrella covers many drops.</text>
  <text x="256" y="402" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">Ask: what is this whole text mostly about?</text>
</svg>
