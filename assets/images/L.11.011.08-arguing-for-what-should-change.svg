<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Three directions for change in how information is governed</title>
  <desc id="d">A central question box "what should change?" branches into three labeled proposals: transparent rules for ranking and removal, accountability and appeals for people harmed, and tools and teaching for readers to verify. Labels carry the meaning.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">Arguing for what should change</text>

  <rect x="176" y="60" width="160" height="52" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">WHAT SHOULD</text>
  <text x="256" y="108" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">CHANGE?</text>

  <line x1="256" y1="112" x2="120" y2="150" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="256" y1="112" x2="256" y2="150" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="256" y1="112" x2="392" y2="150" stroke="#2b3a42" stroke-width="2.5"/>

  <rect x="28" y="150" width="144" height="150" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="100" y="178" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">CLEAR RULES</text>
  <text x="100" y="202" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">public rules for</text>
  <text x="100" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">ranking and</text>
  <text x="100" y="242" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">removal,</text>
  <text x="100" y="262" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">not secret ones</text>

  <rect x="184" y="150" width="144" height="150" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="178" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">ACCOUNTABILITY</text>
  <text x="256" y="202" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">people harmed</text>
  <text x="256" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">can appeal and</text>
  <text x="256" y="242" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">get answers,</text>
  <text x="256" y="262" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">repair, response</text>

  <rect x="340" y="150" width="144" height="150" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="412" y="178" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">READER TOOLS</text>
  <text x="412" y="202" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">teaching and</text>
  <text x="412" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">tools so people</text>
  <text x="412" y="242" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">can verify</text>
  <text x="412" y="262" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">for themselves</text>

  <text x="256" y="340" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">A strong argument states the change,</text>
  <text x="256" y="364" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">who it helps, and what it might cost.</text>
</svg>
