<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Patterns in art: repeating shapes, lines, and colors</title>
  <desc id="desc">Three pattern strips shown one above another. The first repeats a triangle and a circle in a row labeled "shape pattern." The second repeats a zigzag line labeled "line pattern." The third repeats two labeled color blocks, blue and green, labeled "color pattern." A header reads "A pattern is a repeat." Labels and shape differences carry all meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Patterns in Art</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">A pattern is a repeat.</text>

  <!-- shape pattern -->
  <text x="256" y="112" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#6b93b6">shape pattern</text>
  <g fill="#ffffff" stroke="#2b3a42" stroke-width="2.5">
    <rect x="40" y="130" width="46" height="46" rx="8"/>
    <polygon points="112,178 135,136 158,178"/>
    <circle cx="181" cy="153" r="23"/>
    <polygon points="230,178 253,136 276,178"/>
    <circle cx="299" cy="153" r="23"/>
    <polygon points="338,178 361,136 384,178"/>
    <circle cx="407" cy="153" r="23"/>
  </g>
  <text x="446" y="157" font-family="sans-serif" font-size="16" fill="#4f6d7a">...</text>

  <!-- line pattern -->
  <text x="256" y="216" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#7a9e7e">line pattern</text>
  <g stroke="#2b3a42" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M48 238 L88 262 L128 238 L168 262 L208 238 L248 262 L288 238 L328 262 L368 238 L408 262 L448 238"/>
  </g>

  <!-- color pattern -->
  <text x="256" y="300" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#e0a458">color pattern</text>
  <g stroke="#2b3a42" stroke-width="2.5">
    <rect x="40" y="318" width="52" height="52" rx="8" fill="#6b93b6"/>
    <rect x="94" y="318" width="52" height="52" rx="8" fill="#6b93b6"/>
    <rect x="148" y="318" width="52" height="52" rx="8" fill="#7a9e7e"/>
    <rect x="202" y="318" width="52" height="52" rx="8" fill="#6b93b6"/>
    <rect x="256" y="318" width="52" height="52" rx="8" fill="#6b93b6"/>
    <rect x="310" y="318" width="52" height="52" rx="8" fill="#7a9e7e"/>
    <rect x="364" y="318" width="52" height="52" rx="8" fill="#6b93b6"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" font-size="13" fill="#222222">
    <text x="66" y="350">blue</text>
    <text x="120" y="350">blue</text>
    <text x="174" y="350">green</text>
    <text x="282" y="350">blue</text>
  </g>

  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">same thing, again and again</text>
  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">triangle, circle, zigzag, blue — a repeat is a pattern</text>
</svg>
