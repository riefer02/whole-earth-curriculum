<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-10-009-09-modern-migration-displacement desc-L-10-009-09-modern-migration-displacement">
  <title id="title-L-10-009-09-modern-migration-displacement">Why people move</title>
  <desc id="desc-L-10-009-09-modern-migration-displacement">A diagram with three labeled arrows — conflict, economy, climate — pushing and pulling a family from a home on the left toward a new place on the right. Two figures walk the path, and labels mark voluntary and forced movement. Grayscale-printable.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222222" font-weight="bold">Why people move</text>
  <!-- Home -->
  <g transform="translate(76,140)">
    <rect x="-34" y="-26" width="68" height="52" rx="4" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <path d="M -42 -26 L 0 -52 L 42 -26 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>

  </g>
  <text x="76" y="224" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">HOME</text>
  <!-- New place -->
  <g transform="translate(436,140)">
    <rect x="-34" y="-26" width="68" height="52" rx="4" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <path d="M -42 -26 L 0 -52 L 42 -26 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  </g>
  <text x="436" y="224" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">NEW PLACE</text>
  <!-- Path -->
  <line x1="110" y1="140" x2="402" y2="140" stroke="#2b3a42" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- Figures: soft silhouettes, limbs with weight -->
  <g transform="translate(212,142)">
    <circle cx="0" cy="-14" r="7" fill="#8d6a4f" stroke="#2b3a42" stroke-width="1.6"/>
    <rect x="-6" y="-7" width="12" height="20" rx="6" fill="#6b93b6"/>
    <line x1="-4" y1="-2" x2="-12" y2="8" stroke="#6b93b6" stroke-width="6" stroke-linecap="round"/>
    <line x1="4" y1="-2" x2="11" y2="6" stroke="#6b93b6" stroke-width="6" stroke-linecap="round"/>
    <line x1="-3" y1="12" x2="-9" y2="26" stroke="#6b93b6" stroke-width="7" stroke-linecap="round"/>
    <line x1="3" y1="12" x2="8" y2="26" stroke="#6b93b6" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g transform="translate(276,142)">
    <circle cx="0" cy="-14" r="7" fill="#c98f63" stroke="#2b3a42" stroke-width="1.6"/>
    <rect x="-6" y="-7" width="12" height="20" rx="6" fill="#e0a458"/>
    <line x1="-4" y1="-2" x2="-12" y2="8" stroke="#e0a458" stroke-width="6" stroke-linecap="round"/>
    <line x1="4" y1="-2" x2="11" y2="6" stroke="#e0a458" stroke-width="6" stroke-linecap="round"/>
    <line x1="-3" y1="12" x2="-9" y2="26" stroke="#e0a458" stroke-width="7" stroke-linecap="round"/>
    <line x1="3" y1="12" x2="8" y2="26" stroke="#e0a458" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- Three driver arrows -->
  <g font-family="sans-serif" font-size="13" fill="#222222">
    <rect x="40" y="252" width="128" height="30" rx="6" fill="#6b93b6"/>
    <text font-size="13" x="104" y="272" text-anchor="middle" fill="#fdfbf7">CONFLICT</text>
    <text fill="#222222" font-size="13" x="104" y="304" text-anchor="middle">war · persecution</text>
    <rect x="192" y="252" width="128" height="30" rx="6" fill="#7a9e7e"/>
    <text font-size="13" x="256" y="272" text-anchor="middle" fill="#fdfbf7">ECONOMY</text>
    <text fill="#222222" font-size="13" x="256" y="304" text-anchor="middle">work · opportunity</text>
    <rect x="344" y="252" width="128" height="30" rx="6" fill="#e0a458"/>
    <text font-size="13" x="408" y="272" text-anchor="middle" fill="#fdfbf7">CLIMATE</text>
    <text fill="#222222" font-size="13" x="408" y="304" text-anchor="middle">drought · flood · sea rise</text>
  </g>
  <!-- Voluntary vs forced -->
  <rect x="40" y="340" width="432" height="120" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="368" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">Voluntary or forced?</text>
  <text x="256" y="394" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">Choosing a city for work moves differently from fleeing a war,</text>
  <text x="256" y="414" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">a failed harvest, or a rising sea. The human weight is not the same —</text>
  <text x="256" y="434" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">read the difference, and see people, never only numbers.</text>
</svg>
