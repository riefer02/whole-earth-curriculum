<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The carbon cycle</title>
  <desc id="desc">A cycle of carbon moving between four reservoirs. Carbon dioxide in the atmosphere is taken in by plants through photosynthesis and returned by respiration and decay. The ocean exchanges carbon dioxide with the air and stores carbon in shells that settle into rock. Over millions of years, buried plants and organisms become fossil fuels, which return ancient carbon to the atmosphere when burned.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">The Carbon Cycle</text>

  <defs>
    <marker id="cc1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 Z" fill="#2b3a42"/>
    </marker>
  </defs>

  <!-- atmosphere -->
  <rect x="176" y="58" width="160" height="42" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="83" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fdfbf7">atmosphere (CO₂)</text>

  <!-- plants -->
  <rect x="52" y="200" width="120" height="120" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="112" y="228" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fdfbf7">plants &amp; soil</text>
  <text x="112" y="248" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#fdfbf7">photosynthesis</text>
  <text x="112" y="264" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#fdfbf7">respiration · decay</text>

  <!-- ocean -->
  <rect x="340" y="200" width="120" height="120" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="400" y="228" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fdfbf7">oceans</text>
  <text x="400" y="248" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#fdfbf7">dissolved CO₂</text>
  <text x="400" y="264" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#fdfbf7">shells &amp; marine life</text>

  <!-- rock / fossil fuels -->
  <rect x="176" y="392" width="160" height="78" rx="8" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fdfbf7">rock &amp; fossil fuels</text>
  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#fdfbf7">limestone · coal · oil · gas</text>
  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#fdfbf7">stored over millions of years</text>

  <!-- arrows -->
  <path d="M206 100 L140 196" stroke="#2b3a42" stroke-width="2.5" fill="none" marker-end="url(#cc1)"/>
  <text x="156" y="132" font-family="sans-serif" font-size="10.5" fill="#4f6d7a">plants take in CO₂</text>

  <path d="M306 100 L372 196" stroke="#2b3a42" stroke-width="2.5" fill="none" marker-end="url(#cc1)"/>
  <text x="348" y="132" font-family="sans-serif" font-size="10.5" fill="#4f6d7a">ocean swaps CO₂</text>

  <path d="M140 240 L170 196" stroke="#2b3a42" stroke-width="2.5" fill="none" marker-end="url(#cc1)"/>
  <path d="M112 320 L140 300" stroke="#2b3a42" stroke-width="2.5" fill="none"/>

  <path d="M372 240 L342 196" stroke="#2b3a42" stroke-width="2.5" fill="none" marker-end="url(#cc1)"/>

  <path d="M256 408 L256 300" stroke="#2b3a42" stroke-width="2.5" fill="none" marker-end="url(#cc1)"/>
  <text x="266" y="368" font-family="sans-serif" font-size="10.5" fill="#c0563b">burning returns ancient carbon</text>

  <text x="256" y="494" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">Carbon is reused, not created new — but burning fossil fuels moves it fast</text>
</svg>
