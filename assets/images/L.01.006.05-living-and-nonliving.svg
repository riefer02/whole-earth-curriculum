<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Sorting living and nonliving things</title>
  <desc id="desc">Two labeled mats. The left mat, Living, holds a seed sprouting into a plant, a flying bird, and a person — with the words grow, move, reproduce beneath them. The right mat, Nonliving, holds a rock, a pencil, and a cup — with the words stay the same beneath them. Each mat is labeled in words and distinguished by shape, not color alone, so it prints clearly in grayscale.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Living and Nonliving</text>

  <!-- Left mat: Living -->
  <g>
    <rect x="18" y="70" width="230" height="380" rx="12" fill="#ffffff" stroke="#7a9e7e" stroke-width="3"/>
    <text x="133" y="98" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Living</text>

    <!-- grow: seed to plant -->
    <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" fill="none">
      <ellipse cx="52" cy="150" rx="13" ry="9" fill="#e0a458"/>
      <path d="M40 148 Q52 156 64 148" fill="none"/>
      <line x1="86" y1="150" x2="110" y2="150"/>
      <path d="M106 144 L113 150 L106 156 Z" fill="#2b3a42" stroke="none"/>
      <line x1="140" y1="168" x2="140" y2="140"/>
      <path d="M140 152 Q132 148 131 138" fill="none"/>
      <path d="M140 144 Q148 140 149 130" fill="none"/>
      <path d="M130 168 Q140 172 150 168" fill="none"/>
    </g>
    <text x="95" y="190" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">grow</text>

    <!-- move: bird -->
    <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M120 250 Q132 236 150 244" fill="#6b93b6"/>
      <circle cx="150" cy="246" r="7" fill="#6b93b6"/>
      <path d="M157 244 L163 240" />
      <circle cx="165" cy="239" r="2" fill="#2b3a42" stroke="none"/>
      <path d="M118 250 Q126 266 138 254" />
    </g>
    <text x="138" y="282" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">move</text>

    <!-- reproduce: parent and child -->
    <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="72" cy="330" r="16" fill="#d7b59a"/>
      <path d="M58 326 A14 14 0 0 1 86 326" fill="#2b3a42" stroke="none"/>
      <circle cx="67" cy="331" r="2.2" fill="#2b3a42" stroke="none"/>
      <circle cx="77" cy="331" r="2.2" fill="#2b3a42" stroke="none"/>
      <rect x="58" y="346" width="28" height="26" rx="10" fill="#7a9e7e"/>
      <circle cx="112" cy="340" r="11" fill="#d7b59a"/>
      <path d="M104 336 A9 9 0 0 1 120 336" fill="#2b3a42" stroke="none"/>
      <circle cx="109" cy="340" r="1.8" fill="#2b3a42" stroke="none"/>
      <circle cx="115" cy="340" r="1.8" fill="#2b3a42" stroke="none"/>
      <rect x="104" y="351" width="18" height="18" rx="8" fill="#6b93b6"/>
    </g>
    <text x="92" y="388" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">reproduce</text>
    <text x="133" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">grows · moves · makes more</text>
  </g>

  <!-- Right mat: Nonliving -->
  <g>
    <rect x="264" y="70" width="230" height="380" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="3"/>
    <text x="379" y="98" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Nonliving</text>

    <!-- rock -->
    <path d="M336 140 Q356 128 372 138 Q386 150 376 166 Q364 178 344 174 Q326 168 330 152 Z" fill="#d7d1c3" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M344 150 Q352 158 342 164" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>

    <!-- pencil -->
    <g stroke="#2b3a42" stroke-width="2" stroke-linejoin="round">
      <rect x="330" y="216" width="70" height="12" rx="2" fill="#e0a458"/>
      <path d="M400 216 L412 222 L400 228 Z" fill="#d7d1c3"/>
      <path d="M412 222 L418 222" stroke="#2b3a42"/>
      <rect x="330" y="216" width="10" height="12" fill="#7a9e7e"/>
    </g>

    <!-- cup -->
    <path d="M352 280 L360 312 L398 312 L406 280 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M406 284 Q420 292 406 306" fill="none" stroke="#2b3a42" stroke-width="2"/>

    <text x="379" y="388" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">stays the same</text>
    <text x="379" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">does not grow or move</text>
  </g>

  <!-- Footer -->
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Living things grow, move, and make more of themselves.</text>
</svg>
