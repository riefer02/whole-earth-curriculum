<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-09-012-09-anti-colonial desc-L-09-012-09-anti-colonial">
  <title id="title-L-09-012-09-anti-colonial">Anti-colonial movements across the world</title>
  <desc id="desc-L-09-012-09-anti-colonial">A timeline of anti-colonial and liberation movements: the Haitian Revolution 1791 to 1804, the Aba Women's War 1929, India's Salt March 1930, Algeria's war of independence 1954 to 1962, and Ghana's independence 1957, each with its strategy named.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="19.1" font-weight="bold" fill="#2b3a42">Anti-Colonial Movements, Across Time &amp; Place</text>

  <line x1="40" y1="96" x2="472" y2="96" stroke="#4f6d7a" stroke-width="3"/>
  <text x="256" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">a long, shared struggle for self-rule</text>

  <!-- Haiti -->
  <circle cx="68" cy="96" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="68" y="66" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#2b3a42">Haiti 1791–1804</text>
  <rect x="24" y="120" width="88" height="140" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="68" y="142" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">enslaved people</text>
  <text x="68" y="155" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">rose; first</text>
  <text x="68" y="168" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">nation built</text>
  <text x="68" y="181" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">by formerly</text>
  <text x="68" y="194" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">enslaved</text>
  <text x="68" y="212" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#2b3a42">armed struggle</text>

  <!-- Aba Women's War -->
  <circle cx="162" cy="96" r="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="162" y="66" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#2b3a42">Aba Women 1929</text>
  <rect x="118" y="120" width="88" height="140" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="162" y="140" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">thousands of</text>
  <text x="162" y="152" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">women</text>
  <text x="162" y="164" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">organized</text>
  <text x="162" y="176" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">against unfair</text>
  <text x="162" y="188" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">colonial tax</text>
  <text x="162" y="204" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#2b3a42">collective</text>
  <text x="162" y="216" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#2b3a42">action</text>

  <!-- India Salt March -->
  <circle cx="256" cy="96" r="7" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#2b3a42">India 1930</text>
  <rect x="212" y="120" width="88" height="140" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="142" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">Salt March —</text>
  <text x="256" y="155" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">made salt</text>
  <text x="256" y="168" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">peacefully,</text>
  <text x="256" y="181" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">breaking an</text>
  <text x="256" y="194" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">unjust law</text>
  <text x="256" y="212" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#2b3a42">nonviolence</text>

  <!-- Algeria -->
  <circle cx="350" cy="96" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="350" y="66" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#2b3a42">Algeria 1954–62</text>
  <rect x="306" y="120" width="88" height="140" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="350" y="142" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">war of</text>
  <text x="350" y="155" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">independence</text>
  <text x="350" y="168" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">against French</text>
  <text x="350" y="181" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">rule after</text>
  <text x="350" y="194" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">132 years</text>
  <text x="350" y="212" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#2b3a42">armed struggle</text>

  <!-- Ghana -->
  <circle cx="444" cy="96" r="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="444" y="66" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#2b3a42">Ghana 1957</text>
  <rect x="400" y="120" width="88" height="140" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="444" y="142" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">first African</text>
  <text x="444" y="155" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">colony south</text>
  <text x="444" y="168" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">of the Sahara</text>
  <text x="444" y="181" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4f6d7a">to win it</text>
  <text x="444" y="199" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#2b3a42">boycott + vote</text>

  <text x="256" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Many strategies, one goal: self-rule and dignity</text>
  <text x="256" y="326" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">Peoples chose the tools that fit their moment — nonviolence,</text>
  <text x="256" y="346" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">boycott, organized protest, and armed struggle</text>
</svg>
