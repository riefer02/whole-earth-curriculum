<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-09-012-09-anti-colonial desc-L-09-012-09-anti-colonial">
  <title id="title-L-09-012-09-anti-colonial">Anti-colonial movements across the world</title>
  <desc id="desc-L-09-012-09-anti-colonial">A timeline of anti-colonial and liberation movements: the Haitian Revolution 1791 to 1804, the Aba Women's War 1929, India's Salt March 1930, Algeria's war of independence 1954 to 1962, and Ghana's independence 1957, each with its strategy named.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">Anti-Colonial Movements, Across Time &amp; Place</text>

  <!-- timeline spine -->
  <line x1="130" y1="88" x2="130" y2="424" stroke="#4f6d7a" stroke-width="3"/>

  <!-- Haiti -->
  <circle cx="130" cy="100" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="116" y="105" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">1791–1804</text>
  <text x="150" y="96" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Haiti</text>
  <text x="150" y="114" font-family="sans-serif" font-size="12" fill="#222222">enslaved people rose — the first nation</text>
  <text x="150" y="130" font-family="sans-serif" font-size="12" fill="#222222">built by formerly enslaved people</text>
  <text x="150" y="150" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">strategy: armed struggle</text>

  <!-- Aba Women's War -->
  <circle cx="130" cy="172" r="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="116" y="177" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">1929</text>
  <text x="150" y="168" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Aba Women's War</text>
  <text x="150" y="186" font-family="sans-serif" font-size="12" fill="#222222">thousands of women organized</text>
  <text x="150" y="202" font-family="sans-serif" font-size="12" fill="#222222">against an unfair colonial tax</text>
  <text x="150" y="222" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">strategy: collective action</text>

  <!-- India -->
  <circle cx="130" cy="244" r="7" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="116" y="249" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">1930</text>
  <text x="150" y="240" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">India — the Salt March</text>
  <text x="150" y="258" font-family="sans-serif" font-size="12" fill="#222222">made salt peacefully, breaking</text>
  <text x="150" y="274" font-family="sans-serif" font-size="12" fill="#222222">an unjust law in public</text>
  <text x="150" y="294" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">strategy: nonviolence</text>

  <!-- Algeria -->
  <circle cx="130" cy="316" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="116" y="321" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">1954–62</text>
  <text x="150" y="312" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Algeria</text>
  <text x="150" y="330" font-family="sans-serif" font-size="12" fill="#222222">war of independence against</text>
  <text x="150" y="346" font-family="sans-serif" font-size="12" fill="#222222">French rule, after 132 years</text>
  <text x="150" y="366" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">strategy: armed struggle</text>

  <!-- Ghana -->
  <circle cx="130" cy="388" r="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="116" y="393" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">1957</text>
  <text x="150" y="384" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Ghana</text>
  <text x="150" y="402" font-family="sans-serif" font-size="12" fill="#222222">first colony south of the Sahara</text>
  <text x="150" y="418" font-family="sans-serif" font-size="12" fill="#222222">to win independence</text>
  <text x="150" y="438" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">strategy: boycott + vote</text>

  <text x="256" y="472" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Many strategies, one goal: self-rule and dignity</text>
  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Each people chose the tools that fit its moment</text>
</svg>
