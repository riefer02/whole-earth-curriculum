<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A day long ago, a day today</title>
  <desc id="desc">Two panels compare a child's day long ago and today. The left panel, "a child in Mohenjo-Daro, about 2500 BCE," shows a brick house, a well for water, flatbread and dates, a clay toy cart, and learning from an elder. The right panel, "me today," shows a home with a water tap, a meal, a toy or game, and learning at a table. Between the panels, arrows point to "changed" and "stayed the same" items. Labels and shapes, not color, carry the meaning, so it prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">A Day Long Ago, A Day Today</text>
  <text x="256" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Some things changed; some things stayed the same.</text>

  <!-- left panel -->
  <rect x="30" y="84" width="216" height="340" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="138" y="112" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">a child in</text>
  <text x="138" y="130" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Mohenjo-Daro</text>
  <text x="138" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">about 2500 BCE</text>

  <text x="138" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">home</text>
  <path d="M62 186 L82 186 L82 224 L62 224 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M56 186 L88 186 L82 172 L62 172 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="200" y="206" font-family="sans-serif" font-size="11" fill="#222222">brick</text>
  <text x="200" y="220" font-family="sans-serif" font-size="11" fill="#222222">house</text>

  <text x="138" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">water</text>
  <circle cx="100" cy="272" r="18" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="100" cy="272" r="9" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="168" y="268" font-family="sans-serif" font-size="11" fill="#222222">a well</text>
  <text x="168" y="282" font-family="sans-serif" font-size="11" fill="#222222">for water</text>

  <text x="138" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">food</text>
  <ellipse cx="92" cy="330" rx="20" ry="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="126" cy="330" r="5" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="168" y="334" font-family="sans-serif" font-size="11" fill="#222222">flatbread</text>
  <text x="168" y="348" font-family="sans-serif" font-size="11" fill="#222222">and dates</text>

  <text x="138" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">play</text>
  <circle cx="94" cy="388" r="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="112" cy="388" r="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="88" y="378" width="30" height="12" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="168" y="392" font-family="sans-serif" font-size="11" fill="#222222">a clay toy</text>
  <text x="168" y="406" font-family="sans-serif" font-size="11" fill="#222222">cart</text>

  <!-- right panel -->
  <rect x="266" y="84" width="216" height="340" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
  <text x="374" y="112" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">me today</text>
  <text x="374" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">wherever I live</text>

  <text x="374" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">home</text>
  <path d="M312 186 L332 186 L332 224 L312 224 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <path d="M306 186 L338 186 L332 172 L312 172 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="436" y="206" font-family="sans-serif" font-size="11" fill="#222222">my home</text>

  <text x="374" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">water</text>
  <path d="M336 260 L344 260 L346 268 L344 284 L336 284 L334 268 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M340 260 L340 252" stroke="#2b3a42" stroke-width="2"/>
  <text x="404" y="268" font-family="sans-serif" font-size="11" fill="#222222">a tap</text>
  <text x="404" y="282" font-family="sans-serif" font-size="11" fill="#222222">or pump</text>

  <text x="374" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">food</text>
  <circle cx="330" cy="330" r="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="404" y="334" font-family="sans-serif" font-size="11" fill="#222222">my meals</text>

  <text x="374" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">play</text>
  <rect x="322" y="378" width="22" height="22" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="404" y="392" font-family="sans-serif" font-size="11" fill="#222222">my games</text>
  <text x="404" y="406" font-family="sans-serif" font-size="11" fill="#222222">and toys</text>

  <text x="256" y="458" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Water changed &#8212; children still need it. That stayed the same.</text>
</svg>
