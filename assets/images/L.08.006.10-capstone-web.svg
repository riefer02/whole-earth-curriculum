<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The eight goals in one web</title>
  <desc id="desc">A web diagram with systems, evidence, and models at the center and eight spokes: experiment design, model revision, genes and environment, ecosystem ripple, atoms and reactions, fields, stars, and plate tectonics.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Eight Goals, One Web</text>

  <!-- center -->
  <ellipse cx="256" cy="256" rx="86" ry="40" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">systems</text>
  <text x="256" y="268" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">evidence · models</text>

  <!-- spokes -->
  <path d="M256 216 L256 130" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M256 296 L256 382" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M170 256 L96 256" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M342 256 L416 256" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M196 214 L146 164" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M316 214 L366 164" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M196 298 L146 348" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M316 298 L366 348" stroke="#4f6d7a" stroke-width="2"/>

  <!-- node: top -->
  <rect x="178" y="92" width="156" height="40" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="116" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">design an experiment</text>

  <!-- node: bottom -->
  <rect x="178" y="380" width="156" height="40" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="404" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">plate tectonics</text>

  <!-- node: left -->
  <rect x="24" y="236" width="72" height="40" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="60" y="254" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">revise</text>
  <text x="60" y="269" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">models</text>

  <!-- node: right -->
  <rect x="416" y="236" width="72" height="40" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="452" y="254" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">atoms &amp;</text>
  <text x="452" y="269" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">reactions</text>

  <!-- node: top-left -->
  <rect x="84" y="140" width="120" height="40" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="144" y="158" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">genes +</text>
  <text x="144" y="173" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">environment</text>

  <!-- node: top-right -->
  <rect x="308" y="140" width="120" height="40" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="368" y="158" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">ecosystem</text>
  <text x="368" y="173" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">ripple</text>

  <!-- node: bottom-left -->
  <rect x="84" y="332" width="120" height="40" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="144" y="350" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">fields &amp;</text>
  <text x="144" y="365" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">currents</text>

  <!-- node: bottom-right -->
  <rect x="308" y="332" width="120" height="40" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="368" y="350" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">stars &amp;</text>
  <text x="368" y="365" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">galaxy</text>

  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Atoms become stars; stars forge elements; elements build life; life forms webs.</text>
</svg>
