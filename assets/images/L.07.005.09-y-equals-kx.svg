<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Proportional relationships as y = kx</title>
  <desc id="desc">A diagram of the proportional equation y = kx. A table shows x = 1, 2, 3 and y = 3, 6, 9, with k = 3 circled. A graph shows the line y = 3x rising steeply through the origin. The equation y = 3x is written large, with an arrow labeling "k = 3 is the constant of proportionality — the amount of y for each 1 of x." Labels, counts, and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="30" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">The Equation of a Proportion: y = kx</text>

  <!-- equation big -->
  <text x="256" y="86" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#6b93b6">y = kx</text>
  <text x="256" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">y is always k times x · k is the constant of proportionality</text>

  <!-- table -->
  <rect x="20" y="132" width="170" height="130" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <line x1="20" y1="164" x2="190" y2="164" stroke="#2b3a42" stroke-width="2"/>
  <line x1="105" y1="132" x2="105" y2="262" stroke="#2b3a42" stroke-width="2"/>
  <text x="62" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">x</text>
  <text x="147" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">y</text>
  <text x="62" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">1</text>
  <text x="147" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">3</text>
  <text x="62" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">2</text>
  <text x="147" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">6</text>
  <text x="62" y="244" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">3</text>
  <text x="147" y="244" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">9</text>
  <text x="105" y="286" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">k = y ÷ x = 3</text>

  <!-- graph -->
  <rect x="220" y="132" width="272" height="150" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <line x1="236" y1="266" x2="480" y2="266" stroke="#2b3a42" stroke-width="2"/>
  <line x1="236" y1="266" x2="236" y2="146" stroke="#2b3a42" stroke-width="2"/>
  <!-- line y=3x -->
  <line x1="236" y1="266" x2="440" y2="150" stroke="#e0a458" stroke-width="3"/>
  <g fill="#6b93b6" stroke="#2b3a42" stroke-width="2">
    <circle cx="284" cy="224" r="6"/>
    <circle cx="332" cy="182" r="6"/>
  </g>
  <circle cx="236" cy="266" r="5" fill="#222222"/>
  <text x="226" y="286" font-family="sans-serif" font-size="12" fill="#222222">(0,0)</text>
  <text x="480" y="286" text-anchor="end" font-family="sans-serif" font-size="13" fill="#222222">x</text>
  <text x="226" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">y</text>

  <!-- prediction -->
  <rect x="40" y="320" width="432" height="80" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="256" y="348" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">predict with the equation</text>
  <text x="256" y="374" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">3 metres per second → y = 3x → after 10 s: y = 3 × 10 = 30 m</text>

  <text x="256" y="436" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">find k by dividing (k = y ÷ x) · write y = kx · multiply to predict</text>
  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">k is the unit rate — the amount of y for each 1 of x</text>
  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">change k on a graph and the line's steepness changes with it</text>
</svg>
