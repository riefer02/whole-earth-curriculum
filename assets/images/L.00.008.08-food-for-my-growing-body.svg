<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Food for my growing body</title>
  <desc id="desc">A child stands in the center with arms raised and a grow arrow pointing up. Around them, six everyday foods from around the world are labeled: rice, beans, fruit, vegetable, bread, and fish. A footer says food is fuel, energy to run, play, learn, and grow. Labels and shapes carry the meaning in grayscale; no food is shown as better than another.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Food for My Growing Body</text>

  <!-- rice -->
  <g>
    <path d="M96 120 L144 120 L136 150 L104 150 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="120" cy="120" rx="24" ry="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="114" cy="118" r="1.5" fill="#2b3a42"/>
    <circle cx="122" cy="120" r="1.5" fill="#2b3a42"/>
    <circle cx="128" cy="117" r="1.5" fill="#2b3a42"/>
    <text x="120" y="172" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">rice</text>
  </g>

  <!-- beans -->
  <g>
    <ellipse cx="384" cy="130" rx="18" ry="12" fill="#8a6f52" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="408" cy="136" rx="18" ry="12" fill="#8a6f52" stroke="#2b3a42" stroke-width="2"/>
    <text x="396" y="172" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">beans</text>
  </g>

  <!-- fruit -->
  <g>
    <circle cx="88" cy="270" r="18" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="88" y1="252" x2="88" y2="244" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="96" cy="246" rx="5" ry="2.5" fill="#7a9e7e"/>
    <text x="88" y="308" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">fruit</text>
  </g>

  <!-- vegetable -->
  <g>
    <path d="M404 258 L428 288 L380 288 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <line x1="404" y1="258" x2="404" y2="246" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
    <text x="404" y="308" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">vegetable</text>
  </g>

  <!-- bread -->
  <g>
    <path d="M128 408 Q160 394 192 408 L192 424 Q160 436 128 424 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <line x1="144" y1="402" x2="144" y2="424" stroke="#8a6f52" stroke-width="2"/>
    <line x1="160" y1="400" x2="160" y2="424" stroke="#8a6f52" stroke-width="2"/>
    <line x1="176" y1="402" x2="176" y2="424" stroke="#8a6f52" stroke-width="2"/>
    <text x="160" y="456" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">bread</text>
  </g>

  <!-- fish -->
  <g>
    <ellipse cx="348" cy="414" rx="26" ry="12" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M372 414 L386 404 L386 424 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="334" cy="412" r="2" fill="#2b3a42"/>
    <text x="356" y="456" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">fish</text>
  </g>

  <!-- Central child growing -->
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="250" r="28" fill="#8f5f3d"/>
    <rect x="238" y="280" width="36" height="52" rx="14" fill="#7a9e7e"/>
    <line x1="244" y1="292" x2="218" y2="258" stroke-width="13" stroke="#8f5f3d"/>
    <circle cx="216" cy="256" r="6" fill="#8f5f3d"/>
    <line x1="268" y1="292" x2="294" y2="258" stroke-width="13" stroke="#8f5f3d"/>
    <circle cx="296" cy="256" r="6" fill="#8f5f3d"/>
    <line x1="246" y1="330" x2="246" y2="348" stroke-width="14" stroke="#4f6d7a"/>
    <line x1="266" y1="330" x2="266" y2="348" stroke-width="14" stroke="#4f6d7a"/>
  </g>

  <!-- grow arrow -->
  <line x1="312" y1="250" x2="312" y2="196" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <path d="M304 204 L312 192 L320 204 Z" fill="#4f6d7a"/>
  <text x="312" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">grow</text>

  <text x="256" y="482" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Food is fuel — energy to run, play, learn, and grow.</text>
  <text x="256" y="502" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Every family's foods help it grow — every way of eating is worthy.</text>
</svg>
