<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-02-012-03-alike-and-different desc-L-02-012-03-alike-and-different">
  <title id="title-L-02-012-03-alike-and-different">Alike and different</title>
  <desc id="desc-L-02-012-03-alike-and-different">Two children stand side by side and smile. One has short dark hair and wears a striped shirt; the other has curly hair, wears glasses, and uses a small crutch under one arm. A dashed line between them is labeled "alike" and names what they share: "we both love to play." The word "different" is written at each child, joined to them by a short line, and names what each brings: "you draw, I run." The closing line teaches that alike helps us understand each other and different brings new gifts, so both matter. Labels carry the meaning, not color, so the picture prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Alike and Different</text>
  <text x="256" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">two children, two true things</text>

  <!-- child 1: short dark hair, striped shirt -->
  <g>
    <path d="M152 296 L148 366" stroke="#2b3a42" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M184 296 L188 366" stroke="#2b3a42" stroke-width="16" stroke-linecap="round" fill="none"/>
    <ellipse cx="144" cy="374" rx="12" ry="6" fill="#2b3a42"/>
    <ellipse cx="192" cy="374" rx="12" ry="6" fill="#2b3a42"/>
    <path d="M146 226 L124 206" stroke="#c99567" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M190 226 L212 206" stroke="#c99567" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="121" cy="203" r="7.5" fill="#c99567" stroke="#2b3a42" stroke-width="1.6"/>
    <circle cx="215" cy="203" r="7.5" fill="#c99567" stroke="#2b3a42" stroke-width="1.6"/>
    <path d="M168 206 C 148 206 138 216 138 234 L138 274 C138 292 147 300 160 300 L176 300 C189 300 198 292 198 274 L198 234 C198 216 188 206 168 206 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M138 250 L198 250 M138 262 L198 262" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.45"/>
    <rect x="161" y="196" width="14" height="16" fill="#c99567"/>
    <circle cx="168" cy="178" r="30" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M138 178 A30 30 0 0 1 198 178 L198 166 A30 30 0 0 0 138 166 Z" fill="#2b3a42"/>
    <circle cx="158" cy="174" r="2.8" fill="#2b3a42"/>
    <circle cx="178" cy="174" r="2.8" fill="#2b3a42"/>
    <path d="M158 190 Q168 196 178 190" fill="none" stroke="#2b3a42" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- child 2: curly hair, glasses, crutch -->
  <g>
    <path d="M336 296 L332 366" stroke="#2b3a42" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M368 296 L372 366" stroke="#2b3a42" stroke-width="16" stroke-linecap="round" fill="none"/>
    <ellipse cx="328" cy="374" rx="12" ry="6" fill="#2b3a42"/>
    <ellipse cx="376" cy="374" rx="12" ry="6" fill="#2b3a42"/>
    <!-- crutch, under the right arm -->
    <path d="M394 242 L392 362" stroke="#4f6d7a" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M382 268 L398 268" stroke="#4f6d7a" stroke-width="6" stroke-linecap="round" fill="none"/>
    <rect x="384" y="228" width="18" height="12" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M322 226 L304 246" stroke="#8f5f3d" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="301" cy="249" r="7.5" fill="#8f5f3d" stroke="#2b3a42" stroke-width="1.6"/>
    <path d="M380 228 L384 264" stroke="#8f5f3d" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="385" cy="268" r="7.5" fill="#8f5f3d" stroke="#2b3a42" stroke-width="1.6"/>
    <path d="M352 206 C 332 206 322 216 322 234 L322 274 C322 292 331 300 344 300 L360 300 C373 300 382 292 382 274 L382 234 C382 216 372 206 352 206 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <rect x="345" y="196" width="14" height="16" fill="#8f5f3d"/>
    <circle cx="352" cy="178" r="30" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M322 174 Q328 148 352 148 Q376 148 382 174 Q372 164 360 168 Q352 158 340 166 Q332 162 322 174 Z" fill="#2b3a42"/>
    <circle cx="342" cy="172" r="7.5" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="362" cy="172" r="7.5" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <path d="M349 172 L356 172" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="342" cy="172" r="2.2" fill="#2b3a42"/>
    <circle cx="362" cy="172" r="2.2" fill="#2b3a42"/>
    <path d="M342 194 Q352 200 362 194" fill="none" stroke="#2b3a42" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- alike: the space between them -->
  <path d="M256 254 L256 146" stroke="#7a9e7e" stroke-width="3" stroke-dasharray="5 5" fill="none"/>
  <text x="256" y="270" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7a9e7e">alike</text>
  <text x="256" y="408" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">we both love to play</text>

  <!-- different: one short line to each child -->
  <line x1="120" y1="392" x2="146" y2="378" stroke="#8a5a1a" stroke-width="1.6"/>
  <text x="96" y="410" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#8a5a1a">different</text>
  <text x="96" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">you draw</text>

  <line x1="396" y1="392" x2="370" y2="378" stroke="#8a5a1a" stroke-width="1.6"/>
  <text x="420" y="410" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#8a5a1a">different</text>
  <text x="420" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">I run</text>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Alike helps us understand each other.</text>
  <text x="256" y="496" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Different brings new gifts. Both matter.</text>
</svg>
