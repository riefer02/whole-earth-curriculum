<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Alike and different</title>
  <desc id="desc">Two children stand side by side and smile. One has short dark hair and wears a striped shirt; the other has curly hair, wears glasses, and uses a small crutch under one arm. Two arrows point at them. The first arrow, labeled "alike," points to the space between them and names what they share: "we both love to play." The second arrow, labeled "different," points at each child and names what each brings: "you draw, I run." The closing line teaches that alike helps us understand each other and different brings new gifts, so both matter. Labels carry the meaning, not color, so the picture prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Alike and Different</text>
  <text x="256" y="68" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">two children, two true things</text>

  <!-- child 1 -->
  <g>
    <circle cx="168" cy="180" r="34" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M134 180 A34 34 0 0 1 202 180 L202 168 A34 34 0 0 0 134 168 Z" fill="#2b3a42"/>
    <circle cx="158" cy="176" r="2.6" fill="#2b3a42"/>
    <circle cx="178" cy="176" r="2.6" fill="#2b3a42"/>
    <path d="M156 194 Q168 202 180 194" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="140" y="214" width="56" height="80" rx="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="150" y1="294" x2="146" y2="360" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="186" y1="294" x2="190" y2="360" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="146" y1="232" x2="126" y2="214" stroke="#c99567" stroke-width="6" stroke-linecap="round"/>
    <line x1="190" y1="232" x2="210" y2="214" stroke="#c99567" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- child 2 (glasses + crutch) -->
  <g>
    <circle cx="352" cy="180" r="34" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M318 180 A34 34 0 0 1 386 180 L386 168 A34 34 0 0 0 318 168 Z" fill="#4f6d7a"/>
    <circle cx="342" cy="174" r="7" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="362" cy="174" r="7" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <line x1="349" y1="174" x2="355" y2="174" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="342" cy="174" r="2" fill="#2b3a42"/>
    <circle cx="362" cy="174" r="2" fill="#2b3a42"/>
    <path d="M340 196 Q352 204 364 196" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="324" y="214" width="56" height="80" rx="14" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="334" y1="294" x2="330" y2="360" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="370" y1="294" x2="374" y2="360" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="330" y1="232" x2="310" y2="214" stroke="#8f5f3d" stroke-width="6" stroke-linecap="round"/>
    <line x1="374" y1="232" x2="386" y2="252" stroke="#8f5f3d" stroke-width="6" stroke-linecap="round"/>
    <line x1="386" y1="252" x2="384" y2="330" stroke="#4f6d7a" stroke-width="4" stroke-linecap="round"/>
    <line x1="378" y1="268" x2="392" y2="268" stroke="#4f6d7a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- alike -->
  <line x1="256" y1="250" x2="256" y2="150" stroke="#7a9e7e" stroke-width="3" stroke-dasharray="5 5"/>
  <text x="256" y="262" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7a9e7e">alike</text>
  <text x="256" y="384" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">we both love to play</text>

  <!-- different -->
  <text x="96" y="404" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e0a458">different</text>
  <text x="96" y="426" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">you draw</text>
  <text x="420" y="404" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e0a458">different</text>
  <text x="420" y="426" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">I run</text>

  <text x="256" y="472" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Alike helps us understand each other.</text>
  <text x="256" y="496" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Different brings new gifts. Both matter.</text>
</svg>
