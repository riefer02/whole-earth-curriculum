<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My own sentence: say it, write it, check it</title>
  <desc id="desc">Three steps in a row show how to compose a sentence. Step one, "say it," shows a speech bubble with "I see a bird." inside. Step two, "write it," shows a hand with a pencil and a page with "I see a bird." written on it. Step three, "check it," shows a check mark beside the sentence with a circle around the capital I and around the final period, labeled "capital" and "end mark." Arrows connect the three steps. The labels, arrows, and shapes carry the meaning, so the picture prints clearly in grayscale and teaches learners to compose their own complete sentence: say it first, write it down, then check for the capital letter and end mark.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">My Own Sentence</text>

  <!-- Step 1: say it -->
  <rect x="16" y="80" width="150" height="250" rx="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="91" y="110" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">1 · say it</text>

  <path d="M56 150 Q56 130 76 130 L106 130 Q118 130 118 140 L118 168 Q118 178 106 178 L84 178 L78 186 L80 178 L76 178 Q56 178 56 168 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="87" y="160" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">I see a</text>
  <text x="87" y="174" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">bird.</text>

  <path d="M70 210 Q62 200 54 210 Q48 218 58 224 Q64 226 70 220 Q78 218 82 210 Q80 202 74 198 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>

  <text x="91" y="306" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">say your idea</text>
  <text x="91" y="324" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">as a sentence</text>

  <!-- Arrow -->
  <path d="M172 205 L192 205" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <path d="M186 199 L196 205 L186 211 Z" fill="#2b3a42"/>

  <!-- Step 2: write it -->
  <rect x="181" y="80" width="150" height="250" rx="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="110" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">2 · write it</text>

  <rect x="204" y="140" width="104" height="88" rx="8" fill="#fdfbf7" stroke="#4f6d7a" stroke-width="2"/>
  <line x1="216" y1="158" x2="296" y2="158" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="216" y1="176" x2="296" y2="176" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="216" y1="194" x2="296" y2="194" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
  <text x="256" y="190" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans', 'Arial Unicode MS', sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">I see a bird.</text>

  <path d="M244 246 L260 262 L292 230 L276 214 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M260 262 L272 278" fill="#2b3a42"/>
  <path d="M276 214 L290 200" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M290 200 L292 202 L288 206 Z" fill="#2b3a42"/>

  <text x="256" y="306" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">open with a capital,</text>
  <text x="256" y="324" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">close with an end mark</text>

  <!-- Arrow -->
  <path d="M337 205 L357 205" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <path d="M351 199 L361 205 L351 211 Z" fill="#2b3a42"/>

  <!-- Step 3: check it -->
  <rect x="346" y="80" width="150" height="250" rx="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="421" y="110" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">3 · check it</text>

  <text x="396" y="160" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">I</text>
  <ellipse cx="396" cy="154" rx="16" ry="20" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="424" y="160" font-family="sans-serif" font-size="30" fill="#2b3a42">see a bird</text>
  <ellipse cx="446" cy="156" rx="7" ry="10" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="446" y="160" font-family="sans-serif" font-size="30" fill="#2b3a42">.</text>

  <path d="M370 230 L378 238 L396 218" fill="none" stroke="#7a9e7e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="421" y="290" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">capital?</text>
  <text x="421" y="308" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">end mark?</text>
  <text x="421" y="326" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">full thought?</text>

  <text x="256" y="372" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">say it · write it · check it</text>

  <text x="256" y="416" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Your own words, your own idea — that is what writers do.</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Compose by voice, by typing, or by arranging word cards — the sentence is the goal.</text>
</svg>
