<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Do our shared project</title>
  <desc id="desc">A group carries out a shared project together. Four figures work on a kindness wall: one draws a banner, one writes kind words, one hangs cards, and one checks in with another figure, asking "are you stuck? can I help?" The finished wall shows cards with hearts and words. A banner above reads "we did it — together." Labels, the four tasks, and the check-in, not color, carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">Do Our Shared Project</text>

  <!-- kindness wall -->
  <rect x="150" y="52" width="240" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="270" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">our kindness wall</text>

  <!-- cards on the wall -->
  <rect x="166" y="90" width="52" height="40" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M180 116 Q192 104 204 116" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <rect x="230" y="90" width="52" height="40" rx="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="114" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#222222">be kind</text>
  <rect x="294" y="90" width="52" height="40" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="320" y="114" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#222222">thank you</text>
  <rect x="198" y="140" width="52" height="40" rx="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="262" y="140" width="52" height="40" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>

  <!-- figure 1: drawing banner -->
  <circle cx="96" cy="120" r="14" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M82 118 A14 14 0 0 1 110 118 Z" fill="#2b3a42"/>
  <circle cx="91" cy="120" r="1.6" fill="#2b3a42"/><circle cx="101" cy="120" r="1.6" fill="#2b3a42"/>
  <rect x="86" y="134" width="20" height="40" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M106 142 L150 160" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <text x="96" y="190" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">draws</text>

  <!-- figure 2: writing kind words -->
  <circle cx="96" cy="260" r="14" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M82 258 A14 14 0 0 1 110 258 Z" fill="#2b3a42"/>
  <circle cx="91" cy="260" r="1.6" fill="#2b3a42"/><circle cx="101" cy="260" r="1.6" fill="#2b3a42"/>
  <rect x="86" y="274" width="20" height="40" rx="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M106 282 L150 268" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <text x="96" y="330" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">writes</text>

  <!-- figure 3: hanging cards -->
  <circle cx="438" cy="120" r="14" fill="#e8c39e" stroke="#2b3a42" stroke-width="2"/>
  <path d="M424 118 A14 14 0 0 1 452 118 Z" fill="#2b3a42"/>
  <circle cx="433" cy="120" r="1.6" fill="#2b3a42"/><circle cx="443" cy="120" r="1.6" fill="#2b3a42"/>
  <rect x="428" y="134" width="20" height="40" rx="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <path d="M428 142 L396 132" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <text x="438" y="190" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">hangs</text>

  <!-- figure 4: checker checking in -->
  <circle cx="438" cy="260" r="14" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M424 258 A14 14 0 0 1 452 258 Z" fill="#2b3a42"/>
  <circle cx="433" cy="260" r="1.6" fill="#2b3a42"/><circle cx="443" cy="260" r="1.6" fill="#2b3a42"/>
  <path d="M433 266 Q438 270 443 266" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="428" y="274" width="20" height="40" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>

  <!-- check-in bubble -->
  <rect x="250" y="248" width="172" height="46" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="336" y="268" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2b3a42">"are you stuck?</text>
  <text x="336" y="284" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2b3a42">can I help?"</text>
  <text x="438" y="330" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">checks in</text>

  <!-- banner -->
  <rect x="120" y="376" width="272" height="52" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="398" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">We did it — together.</text>
  <text x="256" y="418" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">every person contributed · we listened to each other</text>

  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#4f6d7a">Labels and the four tasks, not color, carry the meaning.</text>
</svg>
