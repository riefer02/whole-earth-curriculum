<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-05-001-01-do-heavy-things-always-sink desc-L-05-001-01-do-heavy-things-always-sink">
  <title id="title-L-05-001-01-do-heavy-things-always-sink">Same clay, two shapes</title>
  <desc id="desc-L-05-001-01-do-heavy-things-always-sink">Two basins side by side. In the left basin a ball of clay sits on the bottom labeled "ball sinks." In the right basin the same clay shaped as a boat floats on the water labeled "boat floats." Below, three labeled piles sort statements into evidence (I saw it), inference (I reason it), and opinion (I think it). Labels and shapes carry the meaning so the diagram prints clearly in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Same Clay, Two Shapes</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">mass stayed the same — shape changed</text>
  <!-- Left basin: ball sinks -->
  <rect x="36" y="96" width="200" height="160" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <line x1="36" y1="140" x2="236" y2="140" stroke="#6b93b6" stroke-width="2"/>
  <text x="136" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">water</text>
  <circle cx="136" cy="216" r="24" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="282" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">ball sinks</text>
  <!-- Right basin: boat floats -->
  <rect x="276" y="96" width="200" height="160" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <line x1="276" y1="140" x2="476" y2="140" stroke="#6b93b6" stroke-width="2"/>
  <text x="376" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">water</text>
  <path d="M336 150 L416 150 L404 178 L348 178 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="282" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">boat floats</text>
  <!-- Three sorting piles -->
  <rect x="28" y="310" width="140" height="120" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="98" y="336" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">evidence</text>
  <text x="98" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">I saw it</text>
  <text x="98" y="384" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">the boat floated</text>
  <rect x="186" y="310" width="140" height="120" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="336" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">inference</text>
  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">I reason it</text>
  <text x="256" y="384" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">shape pushes water</text>
  <rect x="344" y="310" width="140" height="120" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="414" y="336" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">opinion</text>
  <text x="414" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">I think it</text>
  <text x="414" y="384" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">clay is best</text>
  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">predict first — then test, observe, explain</text>
</svg>
