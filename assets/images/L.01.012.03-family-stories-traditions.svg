<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Families share stories and traditions</title>
  <desc id="desc">Four panels, each showing a different family shape with a small tradition they share. Panel one: one grown-up and a child sharing a song at bedtime (a music note and a moon). Panel two: two grown-ups and a child sharing a special meal (a bowl and spoon). Panel three: a grandparent using a wheelchair and a grandchild telling a tale told again and again (a book), with a hearing aid on the grandparent. Panel four: a chosen or foster family — a guardian, a child, and a friend sharing a dance or a greeting (two raised hands). Skin tones and hair vary across the figures. Word labels carry the meaning, not color, so the picture prints in grayscale. The closing line teaches that there is no correct family and no better tradition — every family's story is a treasure.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Families Share Stories and Traditions</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">every family's shape is different — and all are worth telling</text>

  <!-- panel 1 -->
  <rect x="20" y="90" width="226" height="180" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="133" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">one grown-up and me</text>
  <!-- grown-up -->
  <circle cx="100" cy="158" r="13" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <path d="M87 158 A13 13 0 0 1 113 158 L113 149 A13 13 0 0 0 87 149 Z" fill="#2b3a42"/>
  <rect x="90" y="171" width="24" height="30" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="96" y1="201" x2="92" y2="226" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  <line x1="108" y1="201" x2="112" y2="226" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  <!-- child -->
  <circle cx="152" cy="172" r="9" fill="#d9a06b" stroke="#2b3a42" stroke-width="2"/>
  <path d="M143 172 A9 9 0 0 1 161 172 L161 165 A9 9 0 0 0 143 165 Z" fill="#8f5f3d"/>
  <rect x="144" y="181" width="16" height="18" rx="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="148" y1="199" x2="146" y2="216" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  <line x1="156" y1="199" x2="158" y2="216" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  <!-- music note + moon -->
  <text x="133" y="248" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">a song at bedtime</text>

  <!-- panel 2 -->
  <rect x="266" y="90" width="226" height="180" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="379" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">two grown-ups and me</text>
  <!-- grown-up 1 -->
  <circle cx="330" cy="158" r="12" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M318 158 A12 12 0 0 1 342 158 L342 150 A12 12 0 0 0 318 150 Z" fill="#4f6d7a"/>
  <rect x="320" y="170" width="22" height="28" rx="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <!-- grown-up 2 -->
  <circle cx="376" cy="158" r="12" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
  <path d="M364 158 A12 12 0 0 1 388 158 L388 150 A12 12 0 0 0 364 150 Z" fill="#2b3a42"/>
  <rect x="366" y="170" width="22" height="28" rx="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <!-- child -->
  <circle cx="404" cy="172" r="9" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M395 172 A9 9 0 0 1 413 172 L413 165 A9 9 0 0 0 395 165 Z" fill="#8f5f3d"/>
  <rect x="396" y="181" width="16" height="18" rx="7" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <!-- bowl + spoon -->
  <path d="M352 234 Q379 234 379 244 Q379 254 352 254 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <line x1="400" y1="222" x2="414" y2="242" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="416" cy="244" rx="5" ry="3" fill="#4f6d7a" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="379" y="248" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">a special meal</text>

  <!-- panel 3 -->
  <rect x="20" y="282" width="226" height="180" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="133" y="304" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">grandparent and me</text>
  <!-- grandparent in wheelchair -->
  <circle cx="95" cy="340" r="11" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M84 340 A11 11 0 0 1 106 340 L106 332 A11 11 0 0 0 84 332 Z" fill="#e8e3da"/>
  <path d="M103 336 Q108 332 111 338" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="111" cy="339" r="1.8" fill="#4f6d7a"/>
  <rect x="85" y="351" width="20" height="22" rx="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="78" y="373" width="34" height="8" rx="4" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="86" cy="390" r="10" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="108" cy="392" r="4" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <line x1="95" y1="373" x2="95" y2="381" stroke="#2b3a42" stroke-width="3"/>
  <!-- grandchild -->
  <circle cx="160" cy="356" r="9" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <path d="M151 356 A9 9 0 0 1 169 356 L169 349 A9 9 0 0 0 151 349 Z" fill="#2b3a42"/>
  <rect x="152" y="365" width="16" height="18" rx="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="156" y1="383" x2="154" y2="400" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  <line x1="164" y1="383" x2="166" y2="400" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  <!-- book -->
  <rect x="60" y="392" width="26" height="20" rx="2" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="73" y1="392" x2="73" y2="412" stroke="#2b3a42" stroke-width="1.6"/>
  <text x="133" y="440" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">a tale told again and again</text>

  <!-- panel 4 -->
  <rect x="266" y="282" width="226" height="180" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="379" y="304" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">a chosen or foster family</text>
  <!-- guardian -->
  <circle cx="322" cy="340" r="12" fill="#6f4a2e" stroke="#2b3a42" stroke-width="2"/>
  <path d="M310 340 A12 12 0 0 1 334 340 L334 332 A12 12 0 0 0 310 332 Z" fill="#2b3a42"/>
  <rect x="312" y="352" width="22" height="28" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <!-- child -->
  <circle cx="368" cy="354" r="9" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M359 354 A9 9 0 0 1 377 354 L377 347 A9 9 0 0 0 359 347 Z" fill="#4f6d7a"/>
  <rect x="360" y="363" width="16" height="18" rx="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <!-- friend -->
  <circle cx="414" cy="354" r="9" fill="#d9a06b" stroke="#2b3a42" stroke-width="2"/>
  <path d="M405 354 A9 9 0 0 1 423 354 L423 347 A9 9 0 0 0 405 347 Z" fill="#8f5f3d"/>
  <rect x="406" y="363" width="16" height="18" rx="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <!-- raised hands: a dance or greeting -->
  <line x1="360" y1="352" x2="352" y2="336" stroke="#c99567" stroke-width="5" stroke-linecap="round"/>
  <line x1="376" y1="352" x2="384" y2="336" stroke="#c99567" stroke-width="5" stroke-linecap="round"/>
  <text x="379" y="440" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">a dance or a greeting</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">There is no correct family and no better tradition — every family's story is a treasure.</text>
</svg>
