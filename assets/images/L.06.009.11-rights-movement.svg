<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A movement for freedom: Indian independence</title>
  <desc id="desc">A three-panel strip titled "A movement for freedom: Indian independence." The left panel, labeled "MILLIONS ACTED," shows a long line of people walking together. The middle panel, labeled "SALT MARCH, 1930," shows walkers carrying a sign reading "make our own salt." The right panel, labeled "BOYCOTT," shows a figure spinning cloth on a wheel, labeled "spinning our own cloth." A caption reads "Ordinary people — women, workers, students — acted together, with dignity, until India became free in 1947." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#2b3a42">A Movement for Freedom</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Indian independence — ordinary people acting together, with dignity</text>

  <!-- Panel 1: millions acted -->
  <g>
    <rect x="20" y="92" width="150" height="250" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="28" y="104" width="134" height="32" rx="6" fill="#6b93b6" opacity="0.35"/>
    <text x="95" y="125" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">MILLIONS ACTED</text>
    <!-- line of walkers -->
    <circle cx="60" cy="210" r="10" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="92" cy="196" r="9" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="122" cy="210" r="10" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M60 220 L60 250" stroke="#2b3a42" stroke-width="2"/>
    <path d="M92 205 L92 246" stroke="#2b3a42" stroke-width="2"/>
    <path d="M122 220 L122 250" stroke="#2b3a42" stroke-width="2"/>
    <text x="95" y="276" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">women, workers,</text>
    <text x="95" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">students, peasants</text>
    <text x="95" y="318" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">— not one hero,</text>
    <text x="95" y="334" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">but a whole people</text>
  </g>

  <!-- Panel 2: salt march -->
  <g>
    <rect x="182" y="92" width="150" height="250" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="190" y="104" width="134" height="32" rx="6" fill="#e0a458" opacity="0.35"/>
    <text x="257" y="125" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">SALT MARCH, 1930</text>
    <circle cx="218" cy="200" r="9" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="252" cy="188" r="9" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="286" cy="200" r="9" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M218 209 L218 244" stroke="#2b3a42" stroke-width="2"/>
    <path d="M252 197 L252 244" stroke="#2b3a42" stroke-width="2"/>
    <path d="M286 209 L286 244" stroke="#2b3a42" stroke-width="2"/>
    <rect x="232" y="228" width="50" height="22" rx="3" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="257" y="243" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">make our own salt</text>
    <text x="257" y="276" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">walking to the sea</text>
    <text x="257" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">to break an unjust</text>
    <text x="257" y="308" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">salt tax — peacefully</text>
  </g>

  <!-- Panel 3: boycott -->
  <g>
    <rect x="344" y="92" width="150" height="250" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="352" y="104" width="134" height="32" rx="6" fill="#7a9e7e" opacity="0.45"/>
    <text x="419" y="125" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">BOYCOTT</text>
    <!-- spinning wheel -->
    <circle cx="419" cy="216" r="26" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <line x1="419" y1="190" x2="419" y2="242" stroke="#2b3a42" stroke-width="2"/>
    <line x1="393" y1="216" x2="445" y2="216" stroke="#2b3a42" stroke-width="2"/>
    <line x1="401" y1="198" x2="437" y2="234" stroke="#2b3a42" stroke-width="2"/>
    <line x1="437" y1="198" x2="401" y2="234" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="419" cy="216" r="5" fill="#2b3a42"/>
    <line x1="419" y1="242" x2="419" y2="274" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="419" cy="282" r="8" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <text x="419" y="306" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">spinning our own</text>
    <text x="419" y="322" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">cloth, refusing</text>
    <text x="419" y="338" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">what was imposed</text>
  </g>

  <rect x="20" y="356" width="474" height="128" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="257" y="386" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Ordinary people — women, workers, students — acted together,</text>
  <text x="257" y="410" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">peacefully and with dignity, through marches, boycotts, and refusal,</text>
  <text x="257" y="434" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">until India won its freedom in 1947.</text>
  <text x="257" y="462" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">They were the authors of their own freedom.</text>
</svg>
