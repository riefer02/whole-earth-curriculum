<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Identity flows into choices and their effects</title>
  <desc id="desc">A left-to-right flow of three boxes: identity, choices, and effects. Arrows connect identity to choices and choices to effects. Below, a small note says choices also feed back to strengthen identity.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Who I Am Becomes What I Do</text>

  <!-- identity -->
  <rect x="36" y="150" width="120" height="110" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="96" y="184" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">identity</text>
  <text x="96" y="206" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">what I value</text>
  <text x="96" y="224" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">what I believe</text>
  <text x="96" y="242" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">who I belong to</text>

  <!-- choices -->
  <rect x="196" y="150" width="120" height="110" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="184" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">choices</text>
  <text x="256" y="206" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">how I spend time</text>
  <text x="256" y="224" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">what I speak up for</text>
  <text x="256" y="242" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">whom I help or hurt</text>

  <!-- effects -->
  <rect x="356" y="150" width="120" height="110" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="416" y="184" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">effects</text>
  <text x="416" y="206" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">on me</text>
  <text x="416" y="224" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">on others</text>
  <text x="416" y="242" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">on my community</text>

  <!-- arrows -->
  <path d="M156 205 L196 205" fill="none" stroke="#2b3a42" stroke-width="2" marker-end="url(#ic1)"/>
  <path d="M316 205 L356 205" fill="none" stroke="#2b3a42" stroke-width="2" marker-end="url(#ic1)"/>
  <defs>
    <marker id="ic1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 Z" fill="#2b3a42"/>
    </marker>
  </defs>

  <!-- feedback arrow -->
  <path d="M416 260 L96 300" fill="none" stroke="#6b93b6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ic2)"/>
  <defs>
    <marker id="ic2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 Z" fill="#6b93b6"/>
    </marker>
  </defs>
  <text x="256" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">choices also shape identity back</text>

  <text x="256" y="370" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#2b3a42">I am not only what happens to me — I am also what I choose to do.</text>
  <text x="256" y="396" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">Small choices, repeated, become the person I am becoming.</text>
</svg>
