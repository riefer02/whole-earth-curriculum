<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Force and Work</title>
  <desc id="desc">A diagram of a person pushing a box across a floor with a force arrow labeled F and the distance labeled d, with the equation work equals force times distance and the units newton times metre equals joule.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Work = Force &#215; Distance</text>

  <!-- Floor -->
  <line x1="40" y1="360" x2="480" y2="360" stroke="#2b3a42" stroke-width="2"/>

  <!-- Box -->
  <rect x="150" y="290" width="110" height="70" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>

  <!-- Person pushing -->
  <circle cx="320" cy="250" r="20" fill="#e0a458"/>
  <line x1="320" y1="270" x2="320" y2="340" stroke="#2b3a42" stroke-width="4"/>
  <line x1="320" y1="300" x2="285" y2="330" stroke="#2b3a42" stroke-width="4"/>
  <line x1="320" y1="300" x2="355" y2="330" stroke="#2b3a42" stroke-width="4"/>
  <line x1="300" y1="280" x2="265" y2="296" stroke="#2b3a42" stroke-width="4"/>

  <!-- Force arrow -->
  <line x1="265" y1="325" x2="150" y2="325" stroke="#6b93b6" stroke-width="4"/>
  <path d="M150 325 l16 -8 l0 16 z" fill="#6b93b6"/>
  <text x="205" y="312" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">F (force)</text>

  <!-- Distance bracket -->
  <line x1="130" y1="382" x2="130" y2="398" stroke="#7a9e7e" stroke-width="3"/>
  <line x1="330" y1="382" x2="330" y2="398" stroke="#7a9e7e" stroke-width="3"/>
  <line x1="130" y1="390" x2="330" y2="390" stroke="#7a9e7e" stroke-width="3"/>
  <path d="M130 390 l10 -6 l0 12 z" fill="#7a9e7e"/>
  <path d="M330 390 l-10 -6 l0 12 z" fill="#7a9e7e"/>
  <text x="230" y="414" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">d (distance)</text>

  <!-- Equation -->
  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42" font-weight="bold">W = F &#215; d</text>
  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">newton &#215; metre = joule &#160;&#160;(and direction matters)</text>
</svg>
