<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">People and environment shape each other: the Andes</title>
  <desc id="desc">A two-panel diagram about the Andes. The top panel, labeled "ENVIRONMENT SHAPES PEOPLE," shows steep mountains and a small figure herding llamas, labeled "steep mountains and high altitude shaped farming, herding, and travel." The bottom panel, labeled "PEOPLE SHAPE ENVIRONMENT," shows the same mountains now cut with terraces and an irrigation canal, labeled "people carved terraces and canals into the slopes to farm." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="50" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">People and Environment Shape Each Other</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">the Andes, South America — two directions, one place</text>

  <!-- Top panel: environment shapes people -->
  <g>
    <rect x="22" y="92" width="468" height="170" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="34" y="106" width="272" height="34" rx="6" fill="#6b93b6" opacity="0.35"/>
    <text x="170" y="129" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">ENVIRONMENT SHAPES PEOPLE</text>

    <!-- steep mountains -->
    <polygon points="60,246 120,150 168,246" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <polygon points="130,246 200,130 260,246" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <line x1="90" y1="246" x2="120" y2="150" stroke="#7a9e7e" stroke-width="2"/>
    <!-- figure herding llama -->
    <circle cx="180" cy="210" r="9" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M180 219 L180 242" stroke="#2b3a42" stroke-width="2"/>
    <path d="M170 220 L168 210" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="212" cy="224" rx="14" ry="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="204" y="234" width="6" height="12" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="218" y="234" width="6" height="12" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="180" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2b3a42">herding llamas</text>
    <text x="330" y="190" font-family="sans-serif" font-size="14" fill="#222222">Steep mountains and thin,</text>
    <text x="330" y="212" font-family="sans-serif" font-size="14" fill="#222222">high-altitude air shaped</text>
    <text x="330" y="234" font-family="sans-serif" font-size="14" fill="#222222">farming, herding, and travel.</text>
  </g>

  <!-- Bottom panel: people shape environment -->
  <g>
    <rect x="22" y="278" width="468" height="170" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="34" y="292" width="272" height="34" rx="6" fill="#7a9e7e" opacity="0.45"/>
    <text x="170" y="315" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">PEOPLE SHAPE ENVIRONMENT</text>

    <!-- terraced mountains -->
    <polygon points="60,432 120,300 168,432" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <line x1="72" y1="416" x2="164" y2="416" stroke="#2b3a42" stroke-width="2"/>
    <line x1="82" y1="392" x2="156" y2="392" stroke="#2b3a42" stroke-width="2"/>
    <line x1="92" y1="368" x2="148" y2="368" stroke="#2b3a42" stroke-width="2"/>
    <line x1="100" y1="344" x2="140" y2="344" stroke="#2b3a42" stroke-width="2"/>
    <!-- canal -->
    <path d="M190 340 Q230 330 260 340" fill="none" stroke="#6b93b6" stroke-width="4" stroke-linecap="round"/>
    <path d="M260 340 Q290 350 320 340" fill="none" stroke="#6b93b6" stroke-width="4" stroke-linecap="round"/>
    <text x="120" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2b3a42">terraces</text>
    <text x="255" y="322" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2b3a42">canal</text>
    <text x="330" y="376" font-family="sans-serif" font-size="14" fill="#222222">People carved terraces into</text>
    <text x="330" y="398" font-family="sans-serif" font-size="14" fill="#222222">the slopes and dug canals to</text>
    <text x="330" y="420" font-family="sans-serif" font-size="14" fill="#222222">farm the steep land.</text>
  </g>
</svg>
