<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Answer a question about a story</title>
  <desc id="desc">A story panel at the top shows a little bird beside a pond, a simple story with a clear who, what, and where. Below it, three question cards ask "Who?", "What?", and "Where?", and each card shows its answer with a picture and a word: a bird (who), looking for water (what), and a pond (where). A filled example sentence underneath reads "A bird was thirsty." The labels, pictures, and words carry the meaning, so the picture prints clearly in grayscale and teaches learners to answer who, what, and where questions about a story, building from a short answer to a full sentence.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Answer a Question About a Story</text>

  <!-- Story panel -->
  <rect x="24" y="68" width="464" height="128" rx="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="256" y="88" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">the story</text>

  <!-- pond -->
  <ellipse cx="396" cy="160" rx="62" ry="18" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M368 158 Q382 152 396 158 Q410 164 424 158" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>

  <!-- bird -->
  <g>
    <circle cx="140" cy="132" r="18" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M124 128 Q132 120 142 128" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M158 132 L176 132 L158 140 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="146" cy="130" r="2.4" fill="#2b3a42"/>
    <path d="M132 146 Q134 152 128 158 M136 152 Q138 156 136 162" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="140" y="182" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">a little bird</text>
  <text x="396" y="182" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">a pond</text>

  <!-- Three question-and-answer cards -->
  <g>
    <rect x="24" y="222" width="148" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="98" y="248" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">Who?</text>
    <circle cx="98" cy="294" r="16" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M84 292 A16 16 0 0 1 112 292 Z" fill="#2b3a42"/>
    <circle cx="92" cy="294" r="1.8" fill="#2b3a42"/>
    <circle cx="104" cy="294" r="1.8" fill="#2b3a42"/>
    <path d="M92 302 Q98 307 104 302" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="98" y="342" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">a bird</text>

    <rect x="182" y="222" width="148" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="248" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">What?</text>
    <circle cx="256" cy="292" r="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M250 288 Q252 282 258 288 Q264 282 266 288" fill="none" stroke="#6b93b6" stroke-width="2"/>
    <path d="M248 298 Q256 304 264 298" fill="none" stroke="#6b93b6" stroke-width="2"/>
    <text x="256" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">looking for water</text>

    <rect x="340" y="222" width="148" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="414" y="248" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">Where?</text>
    <ellipse cx="414" cy="294" rx="30" ry="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="414" y="342" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">at the pond</text>
  </g>

  <!-- Filled example sentence -->
  <rect x="24" y="392" width="464" height="64" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="256" y="416" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4f6d7a">a full sentence</text>
  <text x="256" y="442" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42">"A bird was thirsty."</text>

  <text x="256" y="484" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Short answer or full sentence — both are answers.</text>
</svg>
