<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-02-002-04-my-bodys-feeling-map desc-L-02-002-04-my-bodys-feeling-map">
  <title id="title-L-02-002-04-my-bodys-feeling-map">My body's feeling map</title>
  <desc id="desc-L-02-002-04-my-bodys-feeling-map">A calm, soft-outlined child body map with a labeled prompt box beside each body part — cheeks, shoulders, heart (chest), hands, tummy, and legs — where a learner writes or draws the feeling that shows up there. One leader line joins each box to its body spot. The body is drawn in a neutral tone so any learner can see it as their own. Words and shapes carry the meaning, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">My Body's Feeling Map</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Write or draw the feeling that shows up in each place</text>

  <!-- leader lines, under the figure so each meets the body edge cleanly -->
  <g stroke="#4f6d7a" stroke-width="1.6" fill="none">
    <line x1="150" y1="156" x2="296" y2="110"/>
    <line x1="116" y1="200" x2="296" y2="158"/>
    <line x1="150" y1="244" x2="296" y2="206"/>
    <line x1="222" y1="290" x2="296" y2="254"/>
    <line x1="152" y1="300" x2="296" y2="302"/>
    <line x1="152" y1="400" x2="296" y2="350"/>
  </g>

  <!-- figure: one soft silhouette, limbs with weight -->
  <g fill="#d6d1c7">
    <path d="M134 326 L130 424" stroke="#d6d1c7" stroke-width="26" stroke-linecap="round" fill="none"/>
    <path d="M166 326 L170 424" stroke="#d6d1c7" stroke-width="26" stroke-linecap="round" fill="none"/>
    <ellipse cx="126" cy="430" rx="15" ry="8"/>
    <ellipse cx="174" cy="430" rx="15" ry="8"/>
    <path d="M114 202 L78 284" stroke="#d6d1c7" stroke-width="20" stroke-linecap="round" fill="none"/>
    <path d="M186 202 L222 284" stroke="#d6d1c7" stroke-width="20" stroke-linecap="round" fill="none"/>
    <circle cx="76" cy="289" r="9.5"/>
    <circle cx="223" cy="289" r="9.5"/>
    <path d="M150 190 C 124 190 110 202 110 226 L110 300 C110 320 120 330 138 330 L162 330 C180 330 190 320 190 300 L190 226 C190 202 176 190 150 190 Z"/>
    <rect x="143" y="176" width="14" height="22" rx="5"/>
    <circle cx="150" cy="144" r="34"/>
  </g>
  <path d="M116 144 A34 34 0 0 1 184 144 C184 131 172 118 150 118 C128 118 116 131 116 144 Z" fill="#2b3a42"/>
  <circle cx="139" cy="150" r="3.4" fill="#2b3a42"/>
  <circle cx="161" cy="150" r="3.4" fill="#2b3a42"/>
  <path d="M141 163 Q150 170 159 163" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>

  <!-- prompt boxes -->
  <g font-family="sans-serif">
    <rect x="296" y="92" width="196" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="296" y="140" width="196" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="296" y="188" width="196" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="296" y="236" width="196" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="296" y="284" width="196" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="296" y="332" width="196" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>

    <text x="306" y="115" font-size="13" fill="#4f6d7a">cheeks — hot or warm?</text>
    <text x="306" y="163" font-size="13" fill="#4f6d7a">shoulders — heavy or light?</text>
    <text x="306" y="211" font-size="13" fill="#4f6d7a">heart — fast or calm?</text>
    <text x="306" y="259" font-size="13" fill="#4f6d7a">hands — sweaty or dry?</text>
    <text x="306" y="307" font-size="13" fill="#4f6d7a">tummy — fluttery or settled?</text>
    <text x="306" y="355" font-size="13" fill="#4f6d7a">legs — bouncy or still?</text>
  </g>

  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Where does each feeling live in your body?</text>
</svg>
