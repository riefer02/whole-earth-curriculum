<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My body's feeling map</title>
  <desc id="desc">A simple child body outline with blank boxes beside each body part — heart (chest), tummy, cheeks, hands, shoulders, and legs — where a learner writes or draws the feeling that shows up there. Leader lines connect each box to its body spot. The body is drawn in a neutral tone so any learner can see it as their own. Words and shapes carry the meaning, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">My Body's Feeling Map</text>
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Write or draw the feeling that shows up in each place</text>

  <!-- ===== Body outline (neutral tone) ===== -->
  <g>
    <circle cx="170" cy="150" r="40" fill="#d6d1c7" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M130 146 A40 40 0 0 1 210 146 Z" fill="#2b3a42"/>
    <circle cx="156" cy="154" r="3.5" fill="#2b3a42"/>
    <circle cx="184" cy="154" r="3.5" fill="#2b3a42"/>
    <path d="M158 170 Q170 178 182 170" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>

    <rect x="158" y="196" width="24" height="20" fill="#d6d1c7" stroke="#2b3a42" stroke-width="2"/>
    <rect x="138" y="216" width="64" height="120" rx="18" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>

    <line x1="140" y1="236" x2="106" y2="288" stroke="#d6d1c7" stroke-width="13" stroke-linecap="round"/>
    <line x1="140" y1="236" x2="106" y2="288" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="200" y1="236" x2="234" y2="288" stroke="#d6d1c7" stroke-width="13" stroke-linecap="round"/>
    <line x1="200" y1="236" x2="234" y2="288" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="104" cy="292" r="8" fill="#d6d1c7" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="236" cy="292" r="8" fill="#d6d1c7" stroke="#2b3a42" stroke-width="2"/>

    <line x1="158" y1="334" x2="150" y2="414" stroke="#d6d1c7" stroke-width="13" stroke-linecap="round"/>
    <line x1="158" y1="334" x2="150" y2="414" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="182" y1="334" x2="190" y2="414" stroke="#d6d1c7" stroke-width="13" stroke-linecap="round"/>
    <line x1="182" y1="334" x2="190" y2="414" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="148" cy="424" rx="12" ry="6" fill="#2b3a42"/>
    <ellipse cx="192" cy="424" rx="12" ry="6" fill="#2b3a42"/>
  </g>

  <!-- ===== Blank boxes + leader lines ===== -->
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <!-- cheeks -->
    <line x1="160" y1="168" x2="300" y2="96" stroke="#4f6d7a" stroke-width="1.5"/>
    <rect x="300" y="80" width="188" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="308" y="103" fill="#4f6d7a">cheeks &#8212; hot or warm?</text>

    <!-- heart/chest -->
    <line x1="160" y1="258" x2="300" y2="140" stroke="#4f6d7a" stroke-width="1.5"/>
    <rect x="300" y="124" width="188" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="308" y="147" fill="#4f6d7a">heart &#8212; fast or calm?</text>

    <!-- tummy -->
    <line x1="168" y1="300" x2="300" y2="184" stroke="#4f6d7a" stroke-width="1.5"/>
    <rect x="300" y="168" width="188" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="308" y="191" fill="#4f6d7a">tummy &#8212; fluttery or settled?</text>

    <!-- hands -->
    <line x1="106" y1="296" x2="300" y2="228" stroke="#4f6d7a" stroke-width="1.5"/>
    <rect x="300" y="212" width="188" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="308" y="235" fill="#4f6d7a">hands &#8212; sweaty or dry?</text>

    <!-- shoulders -->
    <line x1="150" y1="226" x2="300" y2="272" stroke="#4f6d7a" stroke-width="1.5"/>
    <rect x="300" y="256" width="188" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="308" y="279" fill="#4f6d7a">shoulders &#8212; heavy or light?</text>

    <!-- legs -->
    <line x1="156" y1="392" x2="300" y2="316" stroke="#4f6d7a" stroke-width="1.5"/>
    <rect x="300" y="300" width="188" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="308" y="323" fill="#4f6d7a">legs &#8212; bouncy or still?</text>
  </g>

  <text x="256" y="490" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Where does each feeling live in your body?</text>
</svg>
