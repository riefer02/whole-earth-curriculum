<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A tradition in motion</title>
  <desc id="desc">A diagram following one tradition — a song — from its home form, through trade and media, into two outcomes: fusion (a new, credited blend) and homogenization (a thinned, market-built version), while the home form keeps living. Grayscale-printable.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222222" font-weight="bold">What happens when a tradition travels</text>
  <!-- Home form -->
  <circle cx="256" cy="92" r="40" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fdfbf7" font-weight="bold">HOME</text>
  <text x="256" y="104" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fdfbf7">a song, a food,</text>
  <text x="256" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fdfbf7">a language</text>
  <!-- Arrow down -->
  <line x1="256" y1="132" x2="256" y2="164" stroke="#2b3a42" stroke-width="2"/>
  <path d="M 248 158 L 256 170 L 264 158 Z" fill="#2b3a42"/>
  <!-- Trade and media bar -->
  <rect x="96" y="170" width="320" height="40" rx="8" fill="#4f6d7a"/>
  <text x="256" y="195" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#fdfbf7">trade · recording · streaming · screens</text>
  <!-- Split arrows -->
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <path d="M 170 210 C 150 250 130 280 128 320"/>
    <path d="M 342 210 C 362 250 382 280 384 320"/>
  </g>
  <g fill="#2b3a42">
    <path d="M 122 314 L 128 328 L 114 328 Z"/>
    <path d="M 390 314 L 384 328 L 398 328 Z"/>
  </g>
  <!-- Fusion box -->
  <rect x="40" y="330" width="176" height="140" rx="12" fill="#fdfbf7" stroke="#6b93b6" stroke-width="2"/>
  <text x="128" y="360" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222" font-weight="bold">FUSION</text>
  <text x="128" y="384" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">new, credited blend —</text>
  <text x="128" y="404" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">makers named,</text>
  <text x="128" y="424" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">something new born.</text>
  <!-- Homogenization box -->
  <rect x="296" y="330" width="176" height="140" rx="12" fill="#fdfbf7" stroke="#e0a458" stroke-width="2"/>
  <text x="384" y="360" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222" font-weight="bold">HOMOGENIZATION</text>
  <text x="384" y="384" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">thinned toward sameness,</text>
  <text x="384" y="404" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">built for a wide market,</text>
  <text x="384" y="424" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">distinctness fades.</text>
  <!-- Home still lives -->
  <line x1="256" y1="132" x2="256" y2="170" stroke="none"/>
  <text x="256" y="496" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Through both, the home tradition keeps living and adapting.</text>
</svg>
