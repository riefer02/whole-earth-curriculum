<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">How my groups shape me</title>
  <desc id="desc">A simple figure in the center surrounded by four gift boxes, each with a label. The gifts are labeled "a word or language," "a food or dish," "a song or story," and "a game or skill." Lines from each gift point toward the figure, showing that the groups we belong to hand us things that become part of who we are. Words and shapes, not color, carry the meaning so it prints clearly in grayscale.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="52" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">How My Groups Shape Me</text>

  <!-- Center figure -->
  <circle cx="256" cy="256" r="36" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="246" cy="250" r="3" fill="#2b3a42"/>
  <circle cx="266" cy="250" r="3" fill="#2b3a42"/>
  <path d="M242 268 Q256 280 270 268" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M256 292 L256 330" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <path d="M256 330 L230 356" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <path d="M256 330 L282 356" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <text x="256" y="388" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">me</text>

  <!-- Arrows from gifts to figure -->
  <g stroke="#4f6d7a" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="150" x2="232" y2="238"/>
    <line x1="392" y1="150" x2="280" y2="238"/>
    <line x1="110" y1="380" x2="234" y2="300"/>
    <line x1="402" y1="380" x2="278" y2="300"/>
  </g>

  <!-- Gift boxes with labels -->
  <g>
    <rect x="70" y="96" width="100" height="76" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.5"/>
    <rect x="70" y="120" width="100" height="10" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="120" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">a word or</text>
    <text x="120" y="166" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">language</text>

    <rect x="342" y="96" width="100" height="76" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.5"/>
    <rect x="342" y="120" width="100" height="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="392" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">a food or</text>
    <text x="392" y="166" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">dish</text>

    <rect x="52" y="386" width="110" height="76" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.5"/>
    <rect x="52" y="410" width="110" height="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="107" y="440" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">a song or</text>
    <text x="107" y="456" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">story</text>

    <rect x="350" y="386" width="110" height="76" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.5"/>
    <rect x="350" y="410" width="110" height="10" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="405" y="440" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">a game or</text>
    <text x="405" y="456" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">skill</text>
  </g>

  <!-- Bottom note -->
  <text x="256" y="490" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Each group hands me things that become part of me.</text>
</svg>
