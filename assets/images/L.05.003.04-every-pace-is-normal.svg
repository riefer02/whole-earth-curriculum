<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-05-003-04-every-pace-is-normal desc-L-05-003-04-every-pace-is-normal">
  <title id="title-L-05-003-04-every-pace-is-normal">Every body belongs</title>
  <desc id="desc-L-05-003-04-every-pace-is-normal">Five children standing together on one ground line, all smiling. They are different heights and builds and have different skin tones. One uses a wheelchair, one wears a hearing aid, and one has a prosthetic lower leg. A banner above reads "every body belongs". Labels and the visible variety of bodies, not colour alone, carry the meaning.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Banner -->
  <rect x="96" y="40" width="320" height="52" rx="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="74" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222222">every body belongs</text>

  <!-- one ground line, so the different heights read as a comparison -->
  <line x1="28" y1="380" x2="484" y2="380" stroke="#c9d4d8" stroke-width="2"/>

  <!-- child 1: tallest -->
  <g fill="#6b4a3a" stroke="none">
    <circle cx="70" cy="214" r="17"/>
    <rect x="63" y="229" width="14" height="12" rx="6"/>
    <rect x="48" y="238" width="44" height="68" rx="20"/>
    <path d="M52 252 l-14 48" stroke="#6b4a3a" stroke-width="12" stroke-linecap="round"/>
    <path d="M88 252 l14 44" stroke="#6b4a3a" stroke-width="12" stroke-linecap="round"/>
    <path d="M61 304 l-4 60" stroke="#6b4a3a" stroke-width="14" stroke-linecap="round"/>
    <path d="M79 304 l4 60" stroke="#6b4a3a" stroke-width="14" stroke-linecap="round"/>
  </g>
  <ellipse cx="55" cy="368" rx="9" ry="5" fill="#6b4a3a"/>
  <ellipse cx="85" cy="368" rx="9" ry="5" fill="#6b4a3a"/>
  <circle cx="70" cy="214" r="17" fill="#6b4a3a" stroke="#2b3a42" stroke-width="1.8"/>
  <circle cx="64" cy="211" r="2.2" fill="#2b3a42"/><circle cx="76" cy="211" r="2.2" fill="#2b3a42"/>
  <path d="M65 222 q5 4 10 0" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>

  <!-- child 2: wheelchair -->
  <rect x="178" y="266" width="10" height="64" rx="5" fill="#4f6d7a" stroke="#2b3a42" stroke-width="1.6"/>
  <g fill="#f5d6b6" stroke="none">
    <circle cx="160" cy="252" r="15"/>
    <rect x="154" y="266" width="12" height="10" rx="5"/>
    <rect x="140" y="274" width="40" height="42" rx="17"/>
    <path d="M144 286 l-12 24" stroke="#f5d6b6" stroke-width="10" stroke-linecap="round"/>
    <path d="M148 312 l-16 4" stroke="#f5d6b6" stroke-width="11" stroke-linecap="round"/>
    <path d="M132 316 l0 14" stroke="#f5d6b6" stroke-width="9" stroke-linecap="round"/>
  </g>
  <circle cx="160" cy="252" r="15" fill="#f5d6b6" stroke="#2b3a42" stroke-width="1.8"/>
  <circle cx="154" cy="249" r="2.2" fill="#2b3a42"/><circle cx="166" cy="249" r="2.2" fill="#2b3a42"/>
  <path d="M155 260 q5 4 10 0" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>
  <ellipse cx="132" cy="332" rx="7" ry="4" fill="#f5d6b6"/>
  <rect x="126" y="328" width="60" height="9" rx="4" fill="#4f6d7a" stroke="#2b3a42" stroke-width="1.8"/>
  <circle cx="152" cy="358" r="16" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="180" cy="358" r="16" fill="none" stroke="#2b3a42" stroke-width="3"/>

  <!-- child 3: hearing aid -->
  <g fill="#e8b88a" stroke="none">
    <circle cx="250" cy="236" r="16"/>
    <rect x="243" y="250" width="14" height="12" rx="6"/>
    <rect x="230" y="258" width="40" height="62" rx="19"/>
    <path d="M234 270 l-12 46" stroke="#e8b88a" stroke-width="11" stroke-linecap="round"/>
    <path d="M266 270 l12 46" stroke="#e8b88a" stroke-width="11" stroke-linecap="round"/>
    <path d="M241 318 l-3 48" stroke="#e8b88a" stroke-width="13" stroke-linecap="round"/>
    <path d="M259 318 l3 48" stroke="#e8b88a" stroke-width="13" stroke-linecap="round"/>
  </g>
  <ellipse cx="236" cy="368" rx="8" ry="4" fill="#e8b88a"/>
  <ellipse cx="264" cy="368" rx="8" ry="4" fill="#e8b88a"/>
  <circle cx="250" cy="236" r="16" fill="#e8b88a" stroke="#2b3a42" stroke-width="1.8"/>
  <path d="M264 232 A6 6 0 0 1 271 234" fill="none" stroke="#e0a458" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="271" cy="235" r="2.4" fill="#e0a458"/>
  <circle cx="244" cy="233" r="2.2" fill="#2b3a42"/><circle cx="256" cy="233" r="2.2" fill="#2b3a42"/>
  <path d="M245 244 q5 4 10 0" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>

  <!-- child 4: prosthetic lower leg -->
  <g fill="#8a5a3a" stroke="none">
    <circle cx="345" cy="246" r="16"/>
    <rect x="338" y="260" width="14" height="12" rx="6"/>
    <rect x="325" y="268" width="40" height="58" rx="19"/>
    <path d="M329 280 l-12 44" stroke="#8a5a3a" stroke-width="11" stroke-linecap="round"/>
    <path d="M361 280 l12 44" stroke="#8a5a3a" stroke-width="11" stroke-linecap="round"/>
    <path d="M336 324 l-3 44" stroke="#8a5a3a" stroke-width="13" stroke-linecap="round"/>
    <path d="M354 324 l2 20" stroke="#8a5a3a" stroke-width="13" stroke-linecap="round"/>
  </g>
  <ellipse cx="331" cy="368" rx="8" ry="4" fill="#8a5a3a"/>
  <circle cx="345" cy="246" r="16" fill="#8a5a3a" stroke="#2b3a42" stroke-width="1.8"/>
  <circle cx="339" cy="243" r="2.2" fill="#2b3a42"/><circle cx="351" cy="243" r="2.2" fill="#2b3a42"/>
  <path d="M340 254 q5 4 10 0" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>
  <!-- the prosthesis, drawn with its own outline so it is visible in grayscale -->
  <path d="M350 342 L360 342 L360 366 L352 366 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M349 360 L361 360" stroke="#2b3a42" stroke-width="1.4"/>
  <path d="M348 366 h16 v5 h-16 Z" fill="#4f6d7a" stroke="#2b3a42" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- child 5: smallest -->
  <g fill="#c99567" stroke="none">
    <circle cx="435" cy="262" r="15"/>
    <rect x="429" y="276" width="12" height="10" rx="5"/>
    <rect x="416" y="284" width="38" height="50" rx="17"/>
    <path d="M420 296 l-10 34" stroke="#c99567" stroke-width="10" stroke-linecap="round"/>
    <path d="M450 296 l10 34" stroke="#c99567" stroke-width="10" stroke-linecap="round"/>
    <path d="M427 332 l-2 32" stroke="#c99567" stroke-width="12" stroke-linecap="round"/>
    <path d="M443 332 l2 32" stroke="#c99567" stroke-width="12" stroke-linecap="round"/>
  </g>
  <ellipse cx="423" cy="368" rx="8" ry="4" fill="#c99567"/>
  <ellipse cx="447" cy="368" rx="8" ry="4" fill="#c99567"/>
  <circle cx="435" cy="262" r="15" fill="#c99567" stroke="#2b3a42" stroke-width="1.8"/>
  <circle cx="429" cy="259" r="2.2" fill="#2b3a42"/><circle cx="441" cy="259" r="2.2" fill="#2b3a42"/>
  <path d="M430 270 q5 4 10 0" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>

  <text x="256" y="424" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Different heights, different builds, different tools —</text>
  <text x="256" y="446" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">all one joyful group.</text>
</svg>
