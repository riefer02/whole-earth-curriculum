<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Guess the feeling behind a behavior, then check</title>
  <desc id="d">A detective-style diagram. On the left, a figure has crossed arms and is turned away, labeled "the behavior: slamming a book and turning away." Three question bubbles on the right offer possible feelings behind the behavior: hurt, embarrassed, and angry. A banner at the bottom reads "We guess the feeling behind a behavior — then we check, we never assume." Shapes and labels, not color alone, carry the meaning, so the diagram prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">What Is Behind the Behavior?</text>

  <!-- Left: behavior figure -->
  <text x="130" y="84" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4f6d7a">the behavior</text>
  <rect x="46" y="98" width="168" height="300" rx="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <!-- figure: body turned, arms crossed -->
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="130" cy="160" r="30" fill="#8a5a3b" stroke="#2b3a42" stroke-width="2"/>
    <path d="M130 190 L130 260" />
    <path d="M130 260 L104 320"/>
    <path d="M130 260 L156 320"/>
    <!-- crossed arms -->
    <path d="M106 208 L154 230"/>
    <path d="M154 208 L106 230"/>
  </g>
  <!-- face turned away: eyes looking sideways -->
  <circle cx="118" cy="154" r="3" fill="#2b3a42"/>
  <circle cx="142" cy="154" r="3" fill="#2b3a42"/>
  <path d="M112 146 L123 152" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M148 146 L137 152" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M123 172 Q130 167 137 172" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="130" y="348" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">slamming a book,</text>
  <text x="130" y="368" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">turning away</text>

  <!-- Arrow -->
  <path d="M220 250 L280 250" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  <path d="M274 244 L282 250 L274 256" fill="none" stroke="#e0a458" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right: possible feelings -->
  <text x="390" y="84" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4f6d7a">maybe they feel&#8230;</text>
  <g>
    <rect x="292" y="104" width="180" height="56" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="382" y="138" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#222222">hurt?</text>
    <rect x="292" y="176" width="180" height="56" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="382" y="210" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#222222">embarrassed?</text>
    <rect x="292" y="248" width="180" height="56" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="382" y="282" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#222222">angry?</text>
  </g>

  <!-- Banner -->
  <rect x="46" y="420" width="420" height="72" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">We guess the feeling behind a behavior —</text>
  <text x="256" y="474" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">then we CHECK. We never assume.</text>
</svg>
