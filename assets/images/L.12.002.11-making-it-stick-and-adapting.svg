<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Making it stick and adapting</title>
  <desc id="d">A circular habit loop with three labeled nodes — cue, routine, reward — connected by arrows, and a side box labeled "setback plan: when the loop breaks, start small again." Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222222">The habit loop — and the restart</text>
  <!-- loop nodes -->
  <circle cx="120" cy="190" r="66" fill="#6b93b6" opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
  <text x="120" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222222">cue</text>
  <text x="120" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4f6d7a">shoes by the door</text>
  <circle cx="256" cy="330" r="66" fill="#7a9e7e" opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222222">routine</text>
  <text x="256" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4f6d7a">ten-minute walk</text>
  <circle cx="392" cy="190" r="66" fill="#e0a458" opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
  <text x="392" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222222">reward</text>
  <text x="392" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4f6d7a">calm head,</text>
  <text x="392" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4f6d7a">a hello</text>
  <!-- loop arrows -->
  <path d="M184 214 Q256 300 226 322" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M318 302 Q350 260 380 252" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M156 158 Q256 110 356 158" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M340 172 L320 138" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <!-- setback box -->
  <rect x="44" y="400" width="424" height="62" rx="8" fill="#e0a458" opacity="0.28" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#222222">setback plan: when the loop breaks,</text>
  <text x="256" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4f6d7a">start small again — half the time, a gentler form</text>
</svg>
