<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-06-005-07-tables-graphs-two-quantities desc-L-06-005-07-tables-graphs-two-quantities">
  <title id="title-L-06-005-07-tables-graphs-two-quantities">Table and graph of two quantities</title>
  <desc id="desc-L-06-005-07-tables-graphs-two-quantities">A table and a graph of two quantities: number of buckets and liters of water carried. The table lists buckets 1, 2, 3, 4 with liters 3, 6, 9, 12. The graph plots the points (1,3), (2,6), (3,9), and (4,12) on a first-quadrant grid and connects them with a dashed line. A caption reads "liters = 3 × buckets — each bucket holds 3 liters." Labels, numbers, and position, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Table and Graph of Two Quantities</text>
  <text x="256" y="58" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">a table lists the pairs; a graph shows them as points</text>

  <!-- table -->
  <g>
    <rect x="20" y="80" width="180" height="150" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <line x1="20" y1="120" x2="200" y2="120" stroke="#2b3a42" stroke-width="2"/>
    <line x1="110" y1="80" x2="110" y2="230" stroke="#2b3a42" stroke-width="2"/>
    <text x="65" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">buckets</text>
    <text x="155" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">liters</text>
    <text x="65" y="146" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">1</text>
    <text x="155" y="146" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">3</text>
    <text x="65" y="184" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">2</text>
    <text x="155" y="184" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">6</text>
    <text x="65" y="216" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">3</text>
    <text x="155" y="216" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">9</text>
    <text x="65" y="248" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">4</text>
    <text x="155" y="248" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">12</text>
    <text x="110" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">each bucket holds 3 liters</text>
  </g>

  <!-- graph -->
  <g>
    <line x1="240" y1="80" x2="240" y2="380" stroke="#2b3a42" stroke-width="3"/>
    <line x1="240" y1="380" x2="500" y2="380" stroke="#2b3a42" stroke-width="3"/>
    <g stroke="#d7d1c8" stroke-width="1">
      <line x1="290" y1="80" x2="290" y2="380"/><line x1="340" y1="80" x2="340" y2="380"/>
      <line x1="390" y1="80" x2="390" y2="380"/><line x1="440" y1="80" x2="440" y2="380"/>
      <line x1="490" y1="80" x2="490" y2="380"/>
      <line x1="240" y1="305" x2="490" y2="305"/><line x1="240" y1="230" x2="490" y2="230"/>
      <line x1="240" y1="155" x2="490" y2="155"/>
    </g>
    <text x="240" y="402" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">0</text>
    <text x="290" y="402" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">1</text>
    <text x="340" y="402" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">2</text>
    <text x="390" y="402" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">3</text>
    <text x="440" y="402" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">4</text>
    <text x="226" y="385" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">0</text>
    <text x="226" y="310" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">3</text>
    <text x="226" y="235" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">6</text>
    <text x="226" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">9</text>
    <text x="365" y="424" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6b93b6">buckets (x)</text>
    <text x="210" y="230" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6b93b6" transform="rotate(-90 210 230)">liters (y)</text>

    <line x1="290" y1="305" x2="440" y2="80" stroke="#e0a458" stroke-width="3" stroke-dasharray="7 5"/>
    <circle cx="290" cy="305" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="340" cy="230" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="390" cy="155" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="440" cy="80" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="290" y="293" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">(1,3)</text>
    <text x="340" y="218" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">(2,6)</text>
    <text x="390" y="143" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">(3,9)</text>
    <text x="440" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">(4,12)</text>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">liters = 3 × buckets</text>
  <text x="256" y="494" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">the points make a straight line — one quantity grows steadily with the other</text>
</svg>
