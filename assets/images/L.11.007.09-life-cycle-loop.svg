<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The Life Cycle of a Made Thing</title>
  <desc id="desc">A circular diagram with five labeled stages — raw materials, making, use, disposal, and back to materials — connected by arrows in a loop, with a central label reading "design out waste" and small notes at each stage suggesting a possible improvement.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">The Life Cycle of a Made Thing</text>

  <!-- Five stages around a circle -->
  <circle cx="256" cy="150" r="52" fill="#7a9e7e" fill-opacity="0.25" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="144" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">Raw</text>
  <text x="256" y="162" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">materials</text>
  <text x="256" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">choose renewable</text>

  <circle cx="394" cy="240" r="52" fill="#e0a458" fill-opacity="0.25" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="394" y="234" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">Making</text>
  <text x="394" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">less energy</text>

  <circle cx="300" cy="385" r="52" fill="#6b93b6" fill-opacity="0.25" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="300" y="379" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">Use</text>
  <text x="300" y="397" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">repair, refill</text>

  <circle cx="140" cy="385" r="52" fill="#4f6d7a" fill-opacity="0.25" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="140" y="379" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">Disposal</text>
  <text x="140" y="397" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">avoid the heap</text>

  <circle cx="80" cy="240" r="52" fill="#7a9e7e" fill-opacity="0.25" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="80" y="234" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">Back to</text>
  <text x="80" y="252" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">materials</text>
  <text x="80" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">the loop</text>

  <!-- Center -->
  <circle cx="256" cy="292" r="56" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
  <text x="256" y="284" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">Design</text>
  <text x="256" y="302" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">out waste</text>

  <!-- Arrows around -->
  <line x1="296" y1="188" x2="352" y2="218" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="352,218 340,212 346,224" fill="#2b3a42"/>

  <line x1="374" y1="290" x2="340" y2="336" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="340,336 344,324 332,328" fill="#2b3a42"/>

  <line x1="252" y1="385" x2="188" y2="385" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="188,385 200,379 200,391" fill="#2b3a42"/>

  <line x1="122" y1="334" x2="98" y2="290" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="98,290 108,297 106,285" fill="#2b3a42"/>

  <line x1="120" y1="204" x2="204" y2="176" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="204,176 192,174 198,186" fill="#2b3a42"/>

  <!-- Caption -->
  <rect x="110" y="450" width="292" height="52" rx="8" fill="#ffffff" stroke="#e0a458" stroke-width="2"/>
  <text x="256" y="472" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">A good design asks where</text>
  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">the story begins — and ends.</text>
</svg>
