<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Handing my goal to adult life</title>
  <desc id="d">Two figures face each other across a dashed threshold labeled 'adult life'. The figure on the left, labeled 'me now', hands a small labeled bundle 'my goal' to the figure on the right, labeled 'me becoming'. Beneath the bundle sit two labels: 'autonomy — it is mine' and 'accountability — I will check'. Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42">Handing myself forward</text>

  <!-- left figure: me now -->
  <circle cx="120" cy="252" r="26" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <path d="M88 336 Q120 306 152 336" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
  <text x="120" y="212" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">me now</text>

  <!-- right figure: me becoming -->
  <circle cx="392" cy="252" r="26" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <path d="M360 336 Q392 306 424 336" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
  <text x="392" y="212" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">me becoming</text>

  <!-- reaching arms -->
  <path d="M152 302 Q206 282 218 266" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <path d="M360 302 Q306 282 294 266" fill="none" stroke="#2b3a42" stroke-width="3"/>

  <!-- the goal bundle -->
  <rect x="204" y="240" width="104" height="44" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="267" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">my goal</text>

  <!-- threshold -->
  <line x1="256" y1="356" x2="256" y2="420" stroke="#2b3a42" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="256" y="446" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">adult life</text>

  <!-- the two handles -->
  <rect x="34" y="468" width="176" height="34" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="122" y="490" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">autonomy — it is mine</text>
  <rect x="302" y="468" width="176" height="34" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="390" y="490" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">accountability — I will check</text>
</svg>
