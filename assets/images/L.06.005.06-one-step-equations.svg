<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Solving a one-step equation</title>
  <desc id="desc">A balance scale showing the equation x plus 3 equals 8. The left pan holds a box labeled x and three dots; the right pan holds eight dots. A caption reads "subtract 3 from both sides so the scale stays balanced: x = 5." Below, a small second balance shows the result with the box labeled x = 5 and five dots on each side. Labels, counts, and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Solving a One-Step Equation</text>
  <text x="256" y="58" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">what you do to one side, you do to the other — the scale stays balanced</text>

  <!-- balance beam -->
  <g>
    <line x1="70" y1="120" x2="442" y2="120" stroke="#2b3a42" stroke-width="4"/>
    <line x1="256" y1="120" x2="256" y2="190" stroke="#2b3a42" stroke-width="4"/>
    <polygon points="226,190 286,190 256,230" fill="#f0e9dd" stroke="#2b3a42" stroke-width="2"/>

    <!-- left pan: x + 3 -->
    <line x1="90" y1="120" x2="140" y2="160" stroke="#2b3a42" stroke-width="2"/>
    <line x1="140" y1="160" x2="210" y2="160" stroke="#2b3a42" stroke-width="2"/>
    <rect x="120" y="170" width="60" height="44" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="150" y="198" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">x</text>
    <circle cx="190" cy="216" r="7" fill="#222222"/>
    <circle cx="206" cy="216" r="7" fill="#222222"/>
    <circle cx="222" cy="216" r="7" fill="#222222"/>
    <text x="165" y="244" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">x + 3</text>

    <!-- right pan: 8 -->
    <line x1="372" y1="120" x2="330" y2="160" stroke="#2b3a42" stroke-width="2"/>
    <line x1="330" y1="160" x2="270" y2="160" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="282" cy="188" r="7" fill="#222222"/>
    <circle cx="298" cy="188" r="7" fill="#222222"/>
    <circle cx="314" cy="188" r="7" fill="#222222"/>
    <circle cx="330" cy="188" r="7" fill="#222222"/>
    <circle cx="282" cy="206" r="7" fill="#222222"/>
    <circle cx="298" cy="206" r="7" fill="#222222"/>
    <circle cx="314" cy="206" r="7" fill="#222222"/>
    <circle cx="330" cy="206" r="7" fill="#222222"/>
    <text x="306" y="244" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">8</text>
  </g>

  <!-- result -->
  <g transform="translate(0, 120)">
    <line x1="70" y1="120" x2="442" y2="120" stroke="#2b3a42" stroke-width="4"/>
    <line x1="256" y1="120" x2="256" y2="170" stroke="#2b3a42" stroke-width="4"/>
    <polygon points="226,170 286,170 256,206" fill="#f0e9dd" stroke="#2b3a42" stroke-width="2"/>
    <line x1="90" y1="120" x2="140" y2="160" stroke="#2b3a42" stroke-width="2"/>
    <line x1="140" y1="160" x2="210" y2="160" stroke="#2b3a42" stroke-width="2"/>
    <rect x="120" y="170" width="60" height="44" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="150" y="198" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">x=5</text>

    <line x1="372" y1="120" x2="330" y2="160" stroke="#2b3a42" stroke-width="2"/>
    <line x1="330" y1="160" x2="270" y2="160" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="282" cy="188" r="7" fill="#222222"/>
    <circle cx="298" cy="188" r="7" fill="#222222"/>
    <circle cx="314" cy="188" r="7" fill="#222222"/>
    <circle cx="330" cy="188" r="7" fill="#222222"/>
    <circle cx="298" cy="206" r="7" fill="#222222"/>
  </g>

  <text x="256" y="414" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">x + 3 = 8   →   subtract 3 from both sides   →   x = 5</text>
  <text x="256" y="442" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">check: 5 + 3 = 8 ✓</text>
  <text x="256" y="484" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">the word "algebra" comes from al-jabr, used by mathematician al-Khwarizmi long ago</text>
</svg>
