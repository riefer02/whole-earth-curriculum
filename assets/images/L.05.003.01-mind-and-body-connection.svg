<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-05-003-01-mind-and-body-connection desc-L-05-003-01-mind-and-body-connection">
  <title id="title-L-05-003-01-mind-and-body-connection">Mind and body are connected</title>
  <desc id="desc-L-05-003-01-mind-and-body-connection">A diagram showing a thought bubble reading "I have a big test tomorrow" beside a worried face, with an arrow pointing to a simple body outline whose stomach is shaded and labeled "tight stomach." A caption reads "A worry in the mind can show up as a feeling in the body." Labels and arrows, not color alone, carry the meaning, so the diagram prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Mind and Body Are Connected</text>

  <!-- Left: thought bubble -->
  <rect x="30" y="110" width="180" height="120" rx="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M96 230 L86 258 L124 230" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <text x="120" y="150" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#222222">I have a big</text>
  <text x="120" y="174" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#222222">test tomorrow.</text>
  <text x="120" y="205" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">(a thought in the mind)</text>

  <!-- Right: body, drawn as one soft silhouette with limbs that carry weight -->
  <g fill="#e6bb92" stroke="none">
    <circle cx="342" cy="148" r="24"/>
    <rect x="335" y="168" width="14" height="14" rx="6"/>
    <rect x="316" y="178" width="52" height="94" rx="24"/>
    <path d="M320 190 l-24 50" stroke="#e6bb92" stroke-width="15" stroke-linecap="round"/>
    <path d="M364 190 l24 50" stroke="#e6bb92" stroke-width="15" stroke-linecap="round"/>
    <path d="M330 268 l-4 50" stroke="#e6bb92" stroke-width="17" stroke-linecap="round"/>
    <path d="M354 268 l4 50" stroke="#e6bb92" stroke-width="17" stroke-linecap="round"/>
  </g>
  <ellipse cx="324" cy="322" rx="11" ry="5" fill="#e6bb92"/>
  <ellipse cx="360" cy="322" rx="11" ry="5" fill="#e6bb92"/>
  <circle cx="342" cy="148" r="24" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>

  <!-- Worried face -->
  <circle cx="334" cy="145" r="2.4" fill="#2b3a42"/>
  <circle cx="350" cy="145" r="2.4" fill="#2b3a42"/>
  <path d="M329 138 Q333 135 337 138" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M347 138 Q351 135 355 138" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M333 158 Q342 166 351 158" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>

  <!-- Tight stomach, with a leader line out to its label -->
  <line x1="366" y1="252" x2="400" y2="290" stroke="#4f6d7a" stroke-width="1.6"/>
  <ellipse cx="342" cy="238" rx="30" ry="22" fill="#e0a458" opacity="0.55" stroke="#2b3a42" stroke-width="2"/>
  <path d="M326 232 Q342 226 358 234 Q346 246 330 240" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <circle cx="366" cy="252" r="2.6" fill="#2b3a42"/>
  <text x="404" y="288" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">tight stomach</text>
  <text x="404" y="306" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">a feeling in</text>
  <text x="404" y="322" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">the body</text>

  <!-- Arrow from thought to body -->
  <g stroke="#4f6d7a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M214 170 L282 170"/>
    <path d="M274 162 L284 170 L274 178"/>
  </g>
  <text x="249" y="160" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">mind</text>
  <text x="249" y="192" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">body</text>

  <text x="256" y="465.3" text-anchor="middle" font-family="sans-serif" font-size="19.5" fill="#2b3a42">A worry in the mind can show up as a feeling in</text>
  <text x="256" y="493.9" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42">the body.</text>
</svg>
