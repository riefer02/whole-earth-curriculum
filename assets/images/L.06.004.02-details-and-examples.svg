<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Details versus examples</title>
  <desc id="desc">A two-column chart. The left column is headed "supporting detail — general reason" and contains "Shade keeps people cool all day" with a broad band icon and the test "applies broadly? yes." The right column is headed "example — specific instance" and contains "Yesterday the market seller napped in the one shady spot" with a single dot icon and the test "one specific case? yes." A bottom line reads "details are general; examples are specific." Labels and shapes, not color alone, carry the meaning so the graphic prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Details and Examples</text>

  <!-- Left column -->
  <rect x="24" y="70" width="228" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="24" y="70" width="228" height="56" rx="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="138" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">supporting detail</text>
  <text x="138" y="112" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">general reason</text>

  <text x="138" y="156" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">"Shade keeps people</text>
  <text x="138" y="176" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">cool all day."</text>

  <!-- broad band icon -->
  <path d="M60 214 L216 214" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <text x="138" y="238" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">applies broadly? yes</text>

  <path d="M48 264 L228 264" stroke="#4f6d7a" stroke-width="1.5"/>
  <text x="138" y="292" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">true for anyone</text>
  <text x="138" y="314" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">a rule you can weigh</text>

  <!-- Right column -->
  <rect x="260" y="70" width="228" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="260" y="70" width="228" height="56" rx="12" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="374" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">example</text>
  <text x="374" y="112" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">specific instance</text>

  <text x="374" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">"Yesterday the market</text>
  <text x="374" y="170" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">seller napped in the</text>
  <text x="374" y="190" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">one shady spot."</text>

  <!-- single dot icon -->
  <circle cx="330" cy="220" r="10" fill="#2b3a42"/>
  <text x="374" y="238" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">one specific case? yes</text>

  <path d="M284 264 L464 264" stroke="#4f6d7a" stroke-width="1.5"/>
  <text x="374" y="292" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">one person</text>
  <text x="374" y="314" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">one day, one story</text>

  <text x="256" y="408" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42">Details are general; examples are specific.</text>
  <text x="256" y="442" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">A strong argument usually needs both.</text>
</svg>
