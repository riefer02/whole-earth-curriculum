<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Operating with fractions and decimals</title>
  <desc id="desc">A fraction and decimal operations diagram. Four panels show the four operations. Add/subtract: 1/2 + 1/4 shown as shaded strips with a common denominator 2/4 + 1/4 = 3/4. Multiply: 1/2 × 1/3 shown as an overlapping area model equal to 1/6. Divide: 2 ÷ 1/2 = 4 shown as "how many halves in 2 wholes." Decimal: 0.4 × 3 = 1.2 on a place-value strip. Each panel carries a short rule. Labels, counts, and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="28" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Four Operations with Fractions and Decimals</text>

  <!-- Panel 1: add -->
  <rect x="16" y="44" width="232" height="140" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="132" y="66" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">add / subtract</text>
  <!-- 1/2 strip -->
  <rect x="28" y="76" width="120" height="20" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <rect x="28" y="76" width="60" height="20" fill="#7a9e7e"/>
  <text x="160" y="92" font-family="sans-serif" font-size="13" fill="#222222">1/2</text>
  <!-- 1/4 strip -->
  <rect x="28" y="102" width="120" height="20" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <rect x="28" y="102" width="30" height="20" fill="#e0a458"/>
  <text x="160" y="118" font-family="sans-serif" font-size="13" fill="#222222">1/4</text>
  <text x="28" y="142" font-family="sans-serif" font-size="13" fill="#4f6d7a">common denominator:</text>
  <text x="28" y="162" font-family="sans-serif" font-size="14" fill="#222222">2/4 + 1/4 = 3/4</text>
  <text x="132" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">add tops, keep the bottom</text>

  <!-- Panel 2: multiply -->
  <rect x="264" y="44" width="232" height="140" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="380" y="66" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">multiply</text>
  <!-- area model 1/2 x 1/3 -->
  <rect x="300" y="76" width="90" height="60" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <rect x="300" y="76" width="90" height="60" fill="#7a9e7e"/>
  <rect x="300" y="76" width="30" height="60" fill="#e0a458"/>
  <text x="460" y="100" font-family="sans-serif" font-size="13" fill="#222222">1/2 × 1/3</text>
  <text x="460" y="120" font-family="sans-serif" font-size="13" fill="#222222">= 1/6</text>
  <text x="380" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">multiply across:</text>
  <text x="380" y="176" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">(1×1)/(2×3) = 1/6</text>

  <!-- Panel 3: divide -->
  <rect x="16" y="196" width="232" height="140" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="132" y="218" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">divide</text>
  <!-- 2 wholes split into halves -->
  <rect x="28" y="230" width="70" height="24" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="102" y="230" width="70" height="24" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="63" y1="230" x2="63" y2="254" stroke="#2b3a42" stroke-width="2"/>
  <line x1="137" y1="230" x2="137" y2="254" stroke="#2b3a42" stroke-width="2"/>
  <text x="28" y="278" font-family="sans-serif" font-size="13" fill="#4f6d7a">how many 1/2 in 2? four</text>
  <text x="28" y="300" font-family="sans-serif" font-size="14" fill="#222222">2 ÷ 1/2 = 2 × 2/1 = 4</text>
  <text x="132" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">flip and multiply</text>

  <!-- Panel 4: decimals -->
  <rect x="264" y="196" width="232" height="140" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="380" y="218" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">decimals</text>
  <!-- 0.4 x 3 -->
  <g fill="#6b93b6" stroke="#2b3a42" stroke-width="2">
    <rect x="290" y="234" width="24" height="24"/>
    <rect x="318" y="234" width="24" height="24"/>
    <rect x="346" y="234" width="24" height="24"/>
    <rect x="290" y="262" width="24" height="24"/>
    <rect x="318" y="262" width="24" height="24"/>
    <rect x="346" y="262" width="24" height="24"/>
    <rect x="290" y="290" width="24" height="24"/>
    <rect x="318" y="290" width="24" height="24"/>
    <rect x="346" y="290" width="24" height="24"/>
    <rect x="290" y="318" width="24" height="24"/>
    <rect x="318" y="318" width="24" height="24"/>
    <rect x="346" y="318" width="24" height="24"/>
  </g>
  <text x="460" y="252" font-family="sans-serif" font-size="13" fill="#222222">0.4 × 3</text>
  <text x="460" y="274" font-family="sans-serif" font-size="13" fill="#222222">= 1.2</text>
  <text x="380" y="344" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">place value: 4 tenths × 3 = 12 tenths</text>

  <text x="256" y="380" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">say the rule: add with a common denominator · multiply across</text>
  <text x="256" y="404" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">divide by flipping and multiplying · decimals by place value</text>

  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">fractions and decimals are two languages for the same numbers</text>
  <text x="256" y="472" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">explaining each step is what makes the skill yours</text>
  <text x="256" y="496" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">decimal place value: shared from India, through the Arab world, to Europe</text>
</svg>
