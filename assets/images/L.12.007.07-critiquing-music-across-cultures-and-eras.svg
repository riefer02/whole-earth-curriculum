<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The listening ladder: describe, analyze, interpret, evaluate</title>
  <desc id="desc">A four-rung ladder labeled, from bottom to top: describe, analyze, interpret, evaluate. Beside it a group of note shapes with an arrow pointing up the ladder. Labels carry the meaning, so it prints clearly in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">The Listening Ladder</text>

  <!-- Notes -->
  <g>
    <ellipse cx="388" cy="140" rx="14" ry="10" fill="#2b3a42"/>
    <line x1="400" y1="140" x2="400" y2="96" stroke="#2b3a42" stroke-width="3"/>
    <ellipse cx="428" cy="128" rx="14" ry="10" fill="#2b3a42"/>
    <line x1="440" y1="128" x2="440" y2="84" stroke="#2b3a42" stroke-width="3"/>
    <ellipse cx="448" cy="168" rx="14" ry="10" fill="#2b3a42"/>
    <line x1="460" y1="168" x2="460" y2="124" stroke="#2b3a42" stroke-width="3"/>
  </g>
  <path d="M424 200 L340 300" fill="none" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>

  <!-- Ladder rails -->
  <line x1="150" y1="96" x2="150" y2="440" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="300" y1="96" x2="300" y2="440" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>

  <line x1="150" y1="120" x2="300" y2="120" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <text x="150" y="200" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">describe</text>

  <line x1="150" y1="230" x2="300" y2="230" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <text x="150" y="300" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">analyze</text>

  <line x1="150" y1="340" x2="300" y2="340" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <text x="150" y="400" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">interpret</text>

  <line x1="150" y1="440" x2="300" y2="440" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <text x="150" y="478" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">evaluate</text>
</svg>
