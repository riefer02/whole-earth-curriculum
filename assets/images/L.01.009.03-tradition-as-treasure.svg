<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Traditions are treasures: gathering, welcoming, remembering</title>
  <desc id="desc">Three panels show three gentle traditions told from inside their meaning, never as costumes. Panel one is labeled thanking: three people, one in a wheelchair, gather around a table to share a meal. Panel two is labeled welcoming: a grown-up holds a baby while a musical note floats above, showing a song that welcomes a new child. Panel three is labeled remembering: a grandparent with glasses and a child look at a framed picture together. Each panel carries a meaning word on a small tag. Skin tones, hair, and clothes vary across the figures. The captions, the meaning tags, and the shapes, not color, carry the meaning, so the picture prints clearly in grayscale and shows that what matters about a tradition is what it means to the people who keep it.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Traditions Are Treasures</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">A tradition carries a meaning, passed from person to person</text>

  <!-- panel frames -->
  <rect x="18" y="96" width="152" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="180" y="96" width="152" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="342" y="96" width="152" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>

  <!-- ===== Panel 1: gathering / thanking ===== -->
  <g>
    <!-- table -->
    <rect x="40" y="260" width="108" height="10" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="50" y1="270" x2="50" y2="298" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="138" y1="270" x2="138" y2="298" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <!-- shared bowl -->
    <path d="M78 236 Q94 230 110 236 L106 260 L82 260 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="76" y1="232" x2="112" y2="232" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <!-- left figure -->
    <circle cx="56" cy="196" r="13" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M43 194 A13 13 0 0 1 69 194 Z" fill="#2b3a42"/>
    <circle cx="51" cy="196" r="1.6" fill="#2b3a42"/>
    <circle cx="61" cy="196" r="1.6" fill="#2b3a42"/>
    <path d="M51 203 Q56 207 61 203" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="47" y="210" width="18" height="32" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <!-- right figure (wheelchair user) -->
    <circle cx="132" cy="196" r="13" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M119 194 A13 13 0 0 1 145 194 Z" fill="#4f6d7a"/>
    <circle cx="127" cy="196" r="1.6" fill="#2b3a42"/>
    <circle cx="137" cy="196" r="1.6" fill="#2b3a42"/>
    <path d="M127 203 Q132 207 137 203" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="123" y="210" width="18" height="24" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="132" cy="246" r="13" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="132" cy="246" r="4" fill="#4f6d7a"/>
    <!-- meaning tag -->
    <rect x="58" y="316" width="72" height="24" rx="12" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="94" y="332" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">thanking</text>
    <text x="94" y="380" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">we share a meal</text>
  </g>

  <!-- ===== Panel 2: welcoming ===== -->
  <g>
    <!-- musical notes -->
    <path d="M268 140 L268 126" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="262" cy="126" rx="6" ry="4" fill="#4f6d7a"/>
    <path d="M292 148 L292 134" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="286" cy="134" rx="6" ry="4" fill="#4f6d7a"/>
    <!-- grown-up holding baby -->
    <circle cx="256" cy="206" r="15" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M241 204 A15 15 0 0 1 271 204 Z" fill="#2b3a42"/>
    <circle cx="250" cy="206" r="1.8" fill="#2b3a42"/>
    <circle cx="262" cy="206" r="1.8" fill="#2b3a42"/>
    <path d="M250 215 Q256 220 262 215" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="245" y="222" width="22" height="44" rx="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="249" y1="266" x2="247" y2="294" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="263" y1="266" x2="265" y2="294" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <!-- arms holding baby -->
    <path d="M245 232 Q234 238 230 248" fill="none" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <path d="M267 232 Q278 238 282 248" fill="none" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <!-- baby -->
    <circle cx="256" cy="254" r="10" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M246 252 A10 10 0 0 1 266 252 Z" fill="#4f6d7a"/>
    <path d="M250 258 Q256 262 262 258" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M244 244 L268 244 L266 268 L246 268 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <!-- meaning tag -->
    <rect x="220" y="316" width="72" height="24" rx="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="332" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">welcoming</text>
    <text x="256" y="380" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">a song for a new child</text>
  </g>

  <!-- ===== Panel 3: remembering ===== -->
  <g>
    <!-- grandparent -->
    <circle cx="400" cy="200" r="15" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M385 198 A15 15 0 0 1 415 198 Z" fill="#4f6d7a"/>
    <circle cx="394" cy="200" r="2.6" fill="none" stroke="#2b3a42" stroke-width="1.8"/>
    <circle cx="406" cy="200" r="2.6" fill="none" stroke="#2b3a42" stroke-width="1.8"/>
    <line x1="397" y1="200" x2="403" y2="200" stroke="#2b3a42" stroke-width="1.8"/>
    <path d="M394 209 Q400 214 406 209" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="389" y="216" width="22" height="40" rx="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="393" y1="256" x2="391" y2="284" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="407" y1="256" x2="409" y2="284" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <!-- child -->
    <circle cx="448" cy="222" r="11" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M437 220 A11 11 0 0 1 459 220 Z" fill="#2b3a42"/>
    <circle cx="444" cy="222" r="1.6" fill="#2b3a42"/>
    <circle cx="452" cy="222" r="1.6" fill="#2b3a42"/>
    <path d="M444 229 Q448 233 452 229" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="440" y="234" width="16" height="26" rx="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="444" y1="260" x2="442" y2="284" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="452" y1="260" x2="454" y2="284" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <!-- framed picture held between them -->
    <rect x="412" y="238" width="34" height="28" rx="3" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <line x1="418" y1="252" x2="428" y2="252" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <circle cx="432" cy="244" r="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.6"/>
    <!-- meaning tag -->
    <rect x="382" y="316" width="72" height="24" rx="12" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="418" y="332" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">remembering</text>
    <text x="418" y="380" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">those who came before</text>
  </g>

  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">When we listen to a tradition, we honor the people who keep it.</text>
  <text x="256" y="454" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">There is no correct family &#183; many traditions, each with meaning</text>
</svg>
