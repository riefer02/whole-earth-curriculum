<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A line plot of fractional measurements</title>
  <desc id="desc">A number line from 3 to 6 marked in halves, with X marks stacked above each value to show how many objects had each length: one X at 3 and a half, three Xs at 4, two Xs at 4 and a half, one X at 5, two Xs at 5 and a half, and one X at 6. Below, questions are answered: the most common length is 4, the least common lengths appear once, and there are ten objects in all.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">A Line Plot of Fractional Measurements</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Lengths of leaves, to the nearest half unit</text>

  <!-- number line -->
  <line x1="60" y1="260" x2="460" y2="260" stroke="#2b3a42" stroke-width="3"/>
  <!-- ticks: 3, 3.5, 4, 4.5, 5, 5.5, 6 -->
  <g stroke="#2b3a42" stroke-width="3">
    <line x1="80" y1="250" x2="80" y2="270"/>
    <line x1="140" y1="250" x2="140" y2="270"/>
    <line x1="200" y1="250" x2="200" y2="270"/>
    <line x1="260" y1="250" x2="260" y2="270"/>
    <line x1="320" y1="250" x2="320" y2="270"/>
    <line x1="380" y1="250" x2="380" y2="270"/>
    <line x1="440" y1="250" x2="440" y2="270"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" font-size="15" fill="#2b3a42">
    <text x="80" y="294">3</text>
    <text x="140" y="294">3½</text>
    <text x="200" y="294">4</text>
    <text x="260" y="294">4½</text>
    <text x="320" y="294">5</text>
    <text x="380" y="294">5½</text>
    <text x="440" y="294">6</text>
  </g>

  <!-- X marks -->
  <g font-family="sans-serif" text-anchor="middle" font-size="20" font-weight="bold" fill="#e0a458">
    <!-- 3.5 -->
    <text x="140" y="246">X</text>
    <!-- 4 (3 stack) -->
    <text x="200" y="246">X</text>
    <text x="200" y="222">X</text>
    <text x="200" y="198">X</text>
    <!-- 4.5 (2 stack) -->
    <text x="260" y="246">X</text>
    <text x="260" y="222">X</text>
    <!-- 5 -->
    <text x="320" y="246">X</text>
    <!-- 5.5 (2 stack) -->
    <text x="380" y="246">X</text>
    <text x="380" y="222">X</text>
    <!-- 6 -->
    <text x="440" y="246">X</text>
  </g>

  <!-- answers -->
  <rect x="70" y="330" width="372" height="130" rx="12" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">Read the plot:</text>
  <text x="256" y="388" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">Most common length: 4 (three Xs)</text>
  <text x="256" y="412" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">Least common: lengths with one X each</text>
  <text x="256" y="436" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">How many in all? 10 objects</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">A line plot is data you can see — one mark for each measurement.</text>
</svg>
