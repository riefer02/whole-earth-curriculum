<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A feeling story: beginning, middle, end</title>
  <desc id="desc">Three empty panels in a row, read left to right. The first panel is labeled "Beginning — how I felt first," the second "Middle — how it changed," and the third "End — how I felt last." The panels are blank so a learner can draw or write their own feeling story inside. Arrows join the panels. Shapes and words, not color, carry the meaning so it prints clearly in grayscale.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">My Feeling Story</text>

  <!-- Panel frames -->
  <rect x="16" y="80" width="132" height="220" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="190" y="80" width="132" height="220" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="364" y="80" width="132" height="220" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Arrows -->
  <g fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="152" y1="190" x2="180" y2="190"/>
    <path d="M178 183 L188 190 L178 197"/>
    <line x1="326" y1="190" x2="354" y2="190"/>
    <path d="M352 183 L362 190 L352 197"/>
  </g>

  <!-- Captions -->
  <text x="82" y="330" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Beginning</text>
  <text x="82" y="350" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">how I felt first</text>
  <text x="256" y="330" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Middle</text>
  <text x="256" y="350" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">how it changed</text>
  <text x="430" y="330" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">End</text>
  <text x="430" y="350" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">how I felt last</text>

  <!-- Bottom note -->
  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">A feeling can change and mix along the way.</text>
</svg>
