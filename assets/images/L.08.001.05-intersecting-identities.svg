<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Intersecting identities: many parts, one whole self</title>
  <desc id="desc">Six overlapping circles arranged around a center point labeled "the whole me". The circles are labeled: culture, gender, ability, language, family, interests. Where the circles overlap is shaded to show that the identities meet and blend in one person. Outline and label only, so the graphic prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Many parts, one whole self</text>

  <g fill="#ffffff" stroke="#2b3a42" stroke-width="2" fill-opacity="0.55">
    <ellipse cx="256" cy="238" rx="150" ry="74" fill="#c9d7e2"/>
    <ellipse cx="196" cy="290" rx="120" ry="82" fill="#cfe0cf"/>
    <ellipse cx="318" cy="290" rx="120" ry="82" fill="#ecd6b8"/>
    <ellipse cx="256" cy="196" rx="112" ry="78" fill="#d9d3e8"/>
  </g>

  <text x="256" y="172" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">the whole me</text>

  <text x="96" y="236" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">culture</text>
  <text x="168" y="368" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">gender</text>
  <text x="344" y="368" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">ability</text>
  <text x="420" y="236" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">language</text>
  <text x="256" y="98" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">family</text>
  <text x="256" y="448" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">interests</text>

  <text x="256" y="488" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">no single label is the whole story</text>
</svg>
