<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Polynomial Functions: Shape and Key Features</title>
  <desc id="desc">A cubic function graph with its x-intercepts (zeros) marked, a local maximum and minimum (turning points) labeled, and arrows showing the end behavior (down on the far left, up on the far right), with the factored form written beside it.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">A Polynomial: f(x) = (x&#8722;1)(x+2)(x&#8722;3)</text>

  <!-- Axes -->
  <line x1="70" y1="290" x2="470" y2="290" stroke="#2b3a42" stroke-width="2"/>
  <line x1="240" y1="50" x2="240" y2="460" stroke="#2b3a42" stroke-width="2"/>
  <polygon points="470,290 458,285 458,295" fill="#2b3a42"/>
  <polygon points="240,50 235,62 245,62" fill="#2b3a42"/>

  <!-- Curve (cubic): down-left, up to local max, down to local min, up-right -->
  <path d="M 100 430 C 130 200, 160 150, 175 175 C 190 200, 200 210, 240 290 C 280 370, 300 380, 315 350 C 330 320, 350 220, 420 100"
        fill="none" stroke="#2b3a42" stroke-width="2.5"/>
  <!-- end arrows -->
  <path d="M 100 430 L 92 420 M 100 430 L 108 424" stroke="#2b3a42" stroke-width="1.5"/>
  <path d="M 420 100 L 412 92 M 420 100 L 426 108" stroke="#2b3a42" stroke-width="1.5"/>

  <!-- Zeros -->
  <circle cx="240" cy="290" r="5" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
  <circle cx="175" cy="290" r="0" fill="#ffffff"/>
  <circle cx="315" cy="290" r="0" fill="#ffffff"/>
  <!-- zeros are x = -2, 1, 3 mapped: -2 -> 175? we set center 240 = x=0. scale ~ 37.5/unit -->
  <circle cx="165" cy="290" r="5" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
  <circle cx="315" cy="290" r="5" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="165" y="312" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">zero: x=&#8722;2</text>
  <text x="240" y="312" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">zero: x=1</text>
  <text x="315" y="312" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">zero: x=3</text>

  <!-- Turning points -->
  <circle cx="188" cy="168" r="5" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="150" y="150" font-family="sans-serif" font-size="13" fill="#a06030" font-weight="bold">turning point</text>
  <text x="150" y="166" font-family="sans-serif" font-size="12" fill="#a06030">(local max)</text>
  <circle cx="322" cy="372" r="5" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="340" y="390" font-family="sans-serif" font-size="13" fill="#a06030" font-weight="bold">turning point</text>
  <text x="340" y="406" font-family="sans-serif" font-size="12" fill="#a06030">(local min)</text>

  <!-- End behavior -->
  <text x="80" y="330" font-family="sans-serif" font-size="13" fill="#4f6d7a">as x &#8594; &#8722;&#8734;,</text>
  <text x="80" y="346" font-family="sans-serif" font-size="13" fill="#4f6d7a">f(x) &#8594; &#8722;&#8734;</text>
  <text x="360" y="150" font-family="sans-serif" font-size="13" fill="#4f6d7a">as x &#8594; +&#8734;,</text>
  <text x="360" y="166" font-family="sans-serif" font-size="13" fill="#4f6d7a">f(x) &#8594; +&#8734;</text>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Degree 3, leading term x&#179; &#8594; odd degree, positive lead: down on the left, up on the right.</text>
</svg>
