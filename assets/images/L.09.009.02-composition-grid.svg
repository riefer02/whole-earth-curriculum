<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title>Composition and symbolism in an ad</title>
  <desc>An annotated advertisement frame showing a rule-of-thirds grid, a leading line, an eye gazing toward the product, a bright color block, and a logo, illustrating how composition and symbolism guide a viewer.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="30" font-family="system-ui, sans-serif" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">Reading an ad: composition + symbols</text>

  <!-- ad frame -->
  <rect x="80" y="60" width="352" height="300" rx="6" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>

  <!-- rule of thirds grid (dashed) -->
  <line x1="197" y1="60" x2="197" y2="360" stroke="#6b93b6" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="315" y1="60" x2="315" y2="360" stroke="#6b93b6" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="80" y1="160" x2="432" y2="160" stroke="#6b93b6" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="80" y1="260" x2="432" y2="260" stroke="#6b93b6" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- bright color block (symbolic) top right -->
  <rect x="315" y="60" width="117" height="100" fill="#e0a458"/>

  <!-- face at top-left third -->
  <circle cx="140" cy="160" r="34" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="152" cy="154" r="3" fill="#2b3a42"/>
  <circle cx="128" cy="154" r="3" fill="#2b3a42"/>
  <path d="M126 172 q14 10 28 0" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <!-- gaze line from eye to product -->
  <path d="M152 154 L 360 220" fill="none" stroke="#2b3a42" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- product circle bottom-right -->
  <circle cx="360" cy="290" r="40" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="360" y="295" font-family="system-ui, sans-serif" font-size="13" fill="#222222" text-anchor="middle">product</text>

  <!-- logo bottom-left -->
  <rect x="100" y="320" width="80" height="24" rx="4" fill="#4f6d7a"/>
  <text x="140" y="336" font-family="system-ui, sans-serif" font-size="12" fill="#fdfbf7" text-anchor="middle">LOGO</text>

  <!-- labels -->
  <text x="256" y="392" font-family="system-ui, sans-serif" font-size="13" fill="#2b3a42" text-anchor="middle">rule of thirds grid</text>
  <text x="90" y="452" font-family="system-ui, sans-serif" font-size="13" fill="#2b3a42">eye gaze leads to product</text>
  <text x="330" y="452" font-family="system-ui, sans-serif" font-size="13" fill="#2b3a42">bright color = attention</text>
  <text x="90" y="480" font-family="system-ui, sans-serif" font-size="13" fill="#2b3a42">logo = who is speaking</text>
</svg>
