<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Whose language is school in?</title>
  <desc id="desc">A classroom scene. A blackboard shows a single language of instruction. Four children each hold a small sign with a different home language. A line connects the blackboard to one child whose sign matches it; the other three children's signs do not match. A note reads: when school speaks only one language, some children learn in theirs — and some must learn in a stranger's.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="30" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">Whose Language Is School In?</text>

  <!-- Blackboard -->
  <rect x="150" y="48" width="212" height="110" rx="8" fill="#dce9f0" stroke="#2b3a42" stroke-width="2"/>
  <rect x="160" y="58" width="192" height="90" rx="4" fill="#2b3a42"/>
  <line x1="178" y1="80" x2="334" y2="80" stroke="#fdfbf7" stroke-width="3" stroke-linecap="round"/>
  <line x1="178" y1="102" x2="300" y2="102" stroke="#fdfbf7" stroke-width="3" stroke-linecap="round"/>
  <line x1="178" y1="124" x2="322" y2="124" stroke="#fdfbf7" stroke-width="3" stroke-linecap="round"/>
  <text x="256" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a5a6a">one language of instruction</text>

  <!-- Children -->
  <g stroke="#2b3a42" stroke-width="2">
    <circle cx="120" cy="250" r="16" fill="#f6ead8"/>
    <path d="M120 266 q-16 16 0 32 q16 -16 0 -32 z" fill="#f6ead8"/>
    <rect x="84" y="330" width="72" height="30" rx="6" fill="#fdfbf7" stroke="#8a6d4a" stroke-width="2"/>
    <line x1="92" y1="341" x2="148" y2="341" stroke="#8a6d4a" stroke-width="2" stroke-linecap="round"/>
    <line x1="92" y1="351" x2="140" y2="351" stroke="#8a6d4a" stroke-width="2" stroke-linecap="round"/>

    <circle cx="256" cy="250" r="16" fill="#eaf2ea"/>
    <path d="M256 266 q-16 16 0 32 q16 -16 0 -32 z" fill="#eaf2ea"/>
    <rect x="220" y="330" width="72" height="30" rx="6" fill="#fdfbf7" stroke="#3a5a3a" stroke-width="2"/>
    <line x1="228" y1="341" x2="284" y2="341" stroke="#3a5a3a" stroke-width="2" stroke-linecap="round"/>
    <line x1="228" y1="351" x2="276" y2="351" stroke="#3a5a3a" stroke-width="2" stroke-linecap="round"/>

    <circle cx="392" cy="250" r="16" fill="#f6ead8"/>
    <path d="M392 266 q-16 16 0 32 q16 -16 0 -32 z" fill="#f6ead8"/>
    <rect x="356" y="330" width="72" height="30" rx="6" fill="#fdfbf7" stroke="#8a6d4a" stroke-width="2"/>
    <line x1="364" y1="341" x2="420" y2="341" stroke="#8a6d4a" stroke-width="2" stroke-linecap="round"/>
    <line x1="364" y1="351" x2="412" y2="351" stroke="#8a6d4a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="120" y="312" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a6d4a">home language A</text>
  <text x="256" y="312" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a5a3a">home language B</text>
  <text x="392" y="312" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a6d4a">home language C</text>

  <!-- Match line (only B matches the board) -->
  <path d="M256 158 C 256 200, 256 214, 256 234" stroke="#7a9e7e" stroke-width="3" fill="none" marker-end=""/>
  <text x="268" y="196" font-family="sans-serif" font-size="11" fill="#3a5a3a">matches</text>

  <!-- No match marks -->
  <text x="120" y="236" font-family="sans-serif" font-size="11" fill="#8a6d4a">✕</text>
  <text x="392" y="236" font-family="sans-serif" font-size="11" fill="#8a6d4a">✕</text>

  <rect x="60" y="388" width="392" height="88" rx="12" fill="#fdfbf7" stroke="#e0a458" stroke-width="2"/>
  <text x="256" y="414" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">When school speaks only one language,</text>
  <text x="256" y="436" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">some children learn in theirs — and some</text>
  <text x="256" y="458" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">must learn in a stranger's.</text>
</svg>
