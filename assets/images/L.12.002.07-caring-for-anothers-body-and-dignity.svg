<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Caring for another's dignity</title>
  <desc id="d">A circle with a person at the center labeled "the person's own wishes," surrounded by three rings labeled ask, listen, adapt, each with a short phrase. Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222222">Help without taking over</text>
  <!-- outer rings -->
  <circle cx="256" cy="256" r="170" fill="#6b93b6" opacity="0.18" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="256" cy="256" r="122" fill="#7a9e7e" opacity="0.22" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="256" cy="256" r="74" fill="#e0a458" opacity="0.35" stroke="#2b3a42" stroke-width="2"/>
  <!-- center person -->
  <circle cx="256" cy="238" r="20" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M236 258 Q236 246 256 246 Q276 246 276 258 L280 286 L268 298 L256 304 L244 298 L232 286 Z" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#222222">the person's</text>
  <text x="256" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#222222">own wishes</text>
  <!-- ring labels -->
  <text x="256" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#222222">ask</text>
  <text x="256" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4f6d7a">"what do you want?"</text>
  <text x="132" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#222222">listen</text>
  <text x="132" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4f6d7a">hear the real no</text>
  <text x="388" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#222222">adapt</text>
  <text x="388" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4f6d7a">offer the arm,</text>
  <text x="388" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4f6d7a">not the takeover</text>
  <text x="256" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#222222">Care honors when the person's choices stay in charge.</text>
</svg>
