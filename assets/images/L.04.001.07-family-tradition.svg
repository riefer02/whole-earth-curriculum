<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A family shares a tradition around a table</title>
  <desc id="desc">A warm scene of a diverse family gathered around a table for a shared meal. Four people of different ages and skin tones sit or stand around the table; one person uses a wheelchair. A shared dish and a lit candle sit at the center. A caption reads "A tradition is something we do again and again, together."</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="56" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">A Family Tradition</text>

  <!-- Table -->
  <rect x="130" y="300" width="252" height="16" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="150" y1="316" x2="150" y2="400" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <line x1="362" y1="316" x2="362" y2="400" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>

  <!-- Shared dish and candle on table -->
  <ellipse cx="256" cy="296" rx="34" ry="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M248 292 q8 -8 16 0 q-2 8 -8 8 q-6 0 -8 -8 z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
  <rect x="322" y="264" width="8" height="30" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M326 250 q6 -10 0 -18 q-6 8 0 18 z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>

  <!-- Figure 1: standing, left -->
  <g>
    <circle cx="96" cy="212" r="26" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M84 202 Q90 198 96 202" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M106 202 Q112 198 118 202" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M86 220 Q96 228 106 220" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M72 288 Q96 248 120 288" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="72" y1="288" x2="62" y2="380" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="288" x2="130" y2="380" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="280" x2="148" y2="300" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Figure 2: child, front center -->
  <g>
    <circle cx="220" cy="240" r="20" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="213" cy="236" r="2.6" fill="#2b3a42"/>
    <circle cx="227" cy="236" r="2.6" fill="#2b3a42"/>
    <path d="M214 246 Q220 251 226 246" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M204 300 Q220 262 236 300" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Figure 3: standing, right -->
  <g>
    <circle cx="404" cy="216" r="26" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="394" cy="210" r="3" fill="#2b3a42"/>
    <circle cx="414" cy="210" r="3" fill="#2b3a42"/>
    <path d="M394 224 Q404 230 414 224" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M380 288 Q404 250 428 288" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="380" y1="288" x2="370" y2="380" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="428" y1="288" x2="438" y2="380" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="380" y1="282" x2="352" y2="300" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Figure 4: seated in wheelchair, right-back -->
  <g>
    <circle cx="462" cy="250" r="22" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M458 244 Q462 242 466 244" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M452 258 Q462 262 472 258" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="438" y="274" width="48" height="10" rx="3" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="452" cy="322" r="16" fill="none" stroke="#2b3a42" stroke-width="3"/>
    <circle cx="472" cy="322" r="16" fill="none" stroke="#2b3a42" stroke-width="3"/>
    <line x1="452" y1="284" x2="452" y2="306" stroke="#2b3a42" stroke-width="3"/>
    <line x1="486" y1="284" x2="486" y2="306" stroke="#2b3a42" stroke-width="3"/>
    <line x1="452" y1="274" x2="486" y2="274" stroke="#2b3a42" stroke-width="3"/>
  </g>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2b3a42">A tradition is something we do</text>
  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2b3a42">again and again, together.</text>
</svg>
