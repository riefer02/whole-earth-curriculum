<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Too little, over time</title>
  <desc id="desc">A three-panel diagram titled "too little, over time." The first panel shows a drooping figure beside a low battery, labeled "too little iron — tired, low energy," with beans and leafy greens drawn beside it. The second shows a bent, soft bone labeled "too little calcium and vitamin D — weaker bones," with a cup and leafy greens. The third shows a person with a dry mouth and a glass of water labeled "too little water — thirsty, headache." A bottom caption reads "The body needs enough of each nutrient — this is about what a body needs, never about a person." Labels and pictures, not color alone, carry the meaning.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Too Little, Over Time</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">what a body needs</text>

  <!-- Panel 1: iron -->
  <rect x="24" y="86" width="140" height="260" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="78" cy="150" r="16" fill="#d9a066"/>
    <path d="M78 166 L78 218"/>
    <path d="M78 190 L62 208"/>
    <path d="M78 190 L94 208"/>
    <path d="M78 218 L68 258"/>
    <path d="M78 218 L88 258"/>
  </g>
  <path d="M70 132 Q78 124 86 132" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="120" y="120" width="20" height="30" rx="3" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <rect x="124" y="114" width="12" height="6" fill="#e0a458"/>
  <text x="94" y="282" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">too little iron</text>
  <text x="94" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">tired, low energy</text>
  <circle cx="62" cy="324" r="6" fill="#7a9e7e"/>
  <circle cx="78" cy="330" r="6" fill="#7a9e7e"/>
  <text x="94" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">beans, leafy greens</text>

  <!-- Panel 2: calcium -->
  <rect x="186" y="86" width="140" height="260" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <path d="M220 160 L270 150 L296 170 L282 196 L268 190 L268 210 L244 210 L244 190 L230 196 L216 170 Z" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M256 180 Q248 190 240 188 M256 180 Q264 190 272 188" stroke="#2b3a42" stroke-width="2" fill="none"/>
  <text x="256" y="282" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">too little calcium</text>
  <text x="256" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">&amp; vitamin D — weaker bones</text>
  <path d="M236 320 L244 332 L252 320" stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M272 324 q0 -8 8 -8 q0 8 -8 8" fill="#7a9e7e"/>
  <text x="256" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">a cup, leafy greens</text>

  <!-- Panel 3: water -->
  <rect x="348" y="86" width="140" height="260" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="402" cy="150" r="16" fill="#f5d6b6"/>
    <path d="M402 166 L402 218"/>
    <path d="M402 190 L386 208"/>
    <path d="M402 190 L418 208"/>
    <path d="M402 218 L392 258"/>
    <path d="M402 218 L412 258"/>
  </g>
  <path d="M394 128 Q402 120 410 128" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M436 132 L436 178 Q436 186 428 186 L426 186 Q418 186 418 178 L418 132 Z" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="418" y="282" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">too little water</text>
  <text x="418" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">thirsty, headache</text>
  <text x="418" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">a glass of water</text>

  <text x="256" y="442" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">The body needs enough of each nutrient.</text>
  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">This is about what a body needs — never about a person.</text>
</svg>
