<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Society and self shape each other both ways</title>
  <desc id="desc">A diagram with two boxes, society and self, connected by two opposing arrows. The arrow from society to self is labeled shapes me; the arrow from self to society is labeled I shape it, showing identity as a two-way making.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Society and Self: A Two-Way Making</text>

  <!-- society box -->
  <rect x="52" y="160" width="180" height="120" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="142" y="196" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">society</text>
  <text x="142" y="220" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">family · school · peers</text>
  <text x="142" y="238" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">language · media · rules</text>
  <text x="142" y="256" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">history · expectations</text>

  <!-- self box -->
  <rect x="280" y="160" width="180" height="120" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="370" y="196" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">self</text>
  <text x="370" y="220" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">my values · my choices</text>
  <text x="370" y="238" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">my story · my voice</text>
  <text x="370" y="256" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">how I show up for others</text>

  <!-- top arrow: society -> self -->
  <path d="M232 190 L280 190" fill="none" stroke="#7a9e7e" stroke-width="3" marker-end="url(#s2s)"/>
  <defs>
    <marker id="s2s" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 Z" fill="#7a9e7e"/>
    </marker>
  </defs>
  <text x="256" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">shapes me</text>

  <!-- bottom arrow: self -> society -->
  <path d="M280 250 L232 250" fill="none" stroke="#e0a458" stroke-width="3" marker-end="url(#self2s)"/>
  <defs>
    <marker id="self2s" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 Z" fill="#e0a458"/>
    </marker>
  </defs>
  <text x="256" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">I shape it</text>

  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#2b3a42">I did not choose the world I was born into — and I am not finished being made by it.</text>
  <text x="256" y="386" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">Identity is a two-way making, never one direction alone.</text>
</svg>
