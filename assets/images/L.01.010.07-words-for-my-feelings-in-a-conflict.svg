<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Words for my feelings in a conflict: I feel, when, I need</title>
  <desc id="desc">A three-part sentence strip teaches how to name a feeling during a conflict. The first card, labeled "I feel," shows three labeled faces — mad, sad, and scared — so a feeling can be named in many ways. The second card, labeled "when," shows two children both reaching for one ball, because a conflict is when two people want different things at once. The third card, labeled "I need," shows a child holding a soft turn marker and asking for a turn, with a smaller picture of a grown-up helping as another need. A full example sentence runs along the bottom: "I feel mad when I do not get a turn; I need a turn too." The words, not color, carry the meaning, so the picture prints clearly in grayscale and teaches that naming a feeling is the first step in solving a conflict — and no one has to speak if they do not want to.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Words for My Feelings</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">A sentence that carries a big feeling</text>

  <!-- cards -->
  <rect x="20" y="90" width="150" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="181" y="90" width="150" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="342" y="90" width="150" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>

  <text x="95" y="116" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">I feel…</text>
  <text x="256" y="116" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">when…</text>
  <text x="417" y="116" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">I need…</text>

  <!-- ===== Card 1: feeling faces ===== -->
  <!-- mad face -->
  <circle cx="95" cy="152" r="18" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="86" y1="146" x2="93" y2="149" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <line x1="104" y1="146" x2="97" y2="149" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M88 160 L102 158" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="95" y="188" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">mad</text>

  <!-- sad face -->
  <circle cx="95" cy="224" r="18" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="89" cy="220" r="1.8" fill="#2b3a42"/>
  <circle cx="101" cy="220" r="1.8" fill="#2b3a42"/>
  <path d="M88 231 Q95 226 102 231" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M104 224 q4 4 4 8 q0 3 -3 4" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.6" stroke-linecap="round"/>
  <text x="95" y="260" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">sad</text>

  <!-- scared face -->
  <circle cx="95" cy="296" r="18" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="89" cy="292" r="3" fill="#2b3a42"/>
  <circle cx="101" cy="292" r="3" fill="#2b3a42"/>
  <ellipse cx="95" cy="303" rx="4" ry="6" fill="#2b3a42"/>
  <text x="95" y="332" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">scared</text>

  <text x="95" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">name it many ways</text>

  <!-- ===== Card 2: two want the same ball ===== -->
  <!-- ball -->
  <circle cx="256" cy="220" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M256 204 A16 16 0 0 1 272 220" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M256 204 A16 16 0 0 0 240 220" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <!-- left child (light skin, reaching) -->
  <circle cx="216" cy="180" r="11" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M205 178 A11 11 0 0 1 227 178 Z" fill="#4f6d7a"/>
  <circle cx="211" cy="180" r="1.5" fill="#2b3a42"/>
  <circle cx="221" cy="180" r="1.5" fill="#2b3a42"/>
  <path d="M211 188 Q216 192 221 188" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="207" y="192" width="18" height="28" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="211" y1="220" x2="209" y2="240" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="221" y1="220" x2="223" y2="240" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="227" y1="200" x2="240" y2="214" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <!-- right child (deep skin, reaching) -->
  <circle cx="296" cy="180" r="11" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M285 178 A11 11 0 0 1 307 178 Z" fill="#2b3a42"/>
  <circle cx="291" cy="180" r="1.5" fill="#2b3a42"/>
  <circle cx="301" cy="180" r="1.5" fill="#2b3a42"/>
  <path d="M291 188 Q296 192 301 188" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="287" y="192" width="18" height="28" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="291" y1="220" x2="289" y2="240" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="301" y1="220" x2="303" y2="240" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="285" y1="200" x2="272" y2="214" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

  <text x="256" y="290" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">both want</text>
  <text x="256" y="308" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">the same ball</text>
  <text x="256" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">conflict is normal</text>

  <!-- ===== Card 3: I need ===== -->
  <!-- child holding turn marker -->
  <circle cx="417" cy="186" r="12" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M405 184 A12 12 0 0 1 429 184 Z" fill="#2b3a42"/>
  <circle cx="412" cy="186" r="1.6" fill="#2b3a42"/>
  <circle cx="422" cy="186" r="1.6" fill="#2b3a42"/>
  <path d="M412 193 Q417 197 422 193" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="408" y="199" width="18" height="30" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="412" y1="229" x2="410" y2="252" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="422" y1="229" x2="424" y2="252" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <!-- turn marker in hand -->
  <circle cx="438" cy="214" r="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="426" y1="208" x2="432" y2="212" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <!-- speech bubble -->
  <rect x="392" y="240" width="96" height="34" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M424 274 L420 286 L436 274 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <text x="440" y="262" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">a turn too</text>

  <text x="417" y="308" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">or: a grown-up</text>
  <text x="417" y="324" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">to help</text>
  <text x="417" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">what would help</text>

  <!-- example sentence -->
  <rect x="40" y="406" width="432" height="52" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="256" y="438" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">I feel mad when I do not get a turn; I need a turn too.</text>

  <text x="256" y="482" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Say it, sign it, or point to it &#183; no one has to speak if they do not want to</text>
</svg>
