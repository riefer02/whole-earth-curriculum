<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Solving It with Words: four steps</title>
  <desc id="desc">A strip shows two children reaching for the same red ball, then one child says in a speech bubble, "Can I have a turn next?" Below, four numbered squares show the four solving steps: one, stop and breathe (a hand on a belly); two, use words (a speech bubble); three, listen (an ear); four, make a plan (two hands sharing). The words and numbers carry the meaning, not color, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Solving It with Words</text>
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Words end in a plan; grabbing ends in hurt</text>

  <!-- Two children reaching for one ball -->
  <circle cx="190" cy="150" r="20" fill="#8d5a3b" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="190" cy="150" r="20" fill="#8d5a3b" stroke="#2b3a42" stroke-width="2"/>
  <path d="M172 148 A18 18 0 0 1 208 148" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="184" cy="150" r="2" fill="#2b3a42"/>
  <circle cx="198" cy="150" r="2" fill="#2b3a42"/>
  <path d="M184 160 Q190 164 196 160" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <line x1="190" y1="170" x2="186" y2="200" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="190" y1="170" x2="194" y2="200" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="170" y1="188" x2="140" y2="180" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="210" y1="188" x2="240" y2="180" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <circle cx="140" cy="178" r="5" fill="#8d5a3b" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="240" cy="178" r="5" fill="#8d5a3b" stroke="#2b3a42" stroke-width="2"/>

  <circle cx="300" cy="150" r="22" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M282 148 A20 20 0 0 1 318 148" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="294" cy="150" r="2" fill="#2b3a42"/>
  <circle cx="308" cy="150" r="2" fill="#2b3a42"/>
  <path d="M294 160 Q300 164 306 160" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <line x1="300" y1="172" x2="296" y2="202" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="300" y1="172" x2="304" y2="202" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="280" y1="190" x2="260" y2="184" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="320" y1="190" x2="340" y2="184" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>

  <!-- The shared ball -->
  <circle cx="240" cy="168" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M232 160 Q240 152 248 160" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M232 176 Q240 184 248 176" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M224 168 Q240 160 256 168" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <!-- Speech bubble: Can I have a turn next? -->
  <rect x="300" y="108" width="180" height="40" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M322 148 L344 148 L330 162 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <text x="390" y="134" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Can I have a turn next?</text>

  <!-- Four steps -->
  <g font-family="sans-serif">
    <rect x="16" y="240" width="112" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="72" cy="268" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="72" y="273" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">1</text>
    <text x="72" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b3a42">Stop &amp; breathe</text>
    <path d="M72 320 Q60 316 58 330 Q56 342 72 346" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <text x="72" y="372" text-anchor="middle" font-size="12" fill="#4f6d7a">Hand on belly,</text>
    <text x="72" y="386" text-anchor="middle" font-size="12" fill="#4f6d7a">in and out</text>

    <rect x="140" y="240" width="112" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="196" cy="268" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="196" y="273" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">2</text>
    <text x="196" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b3a42">Use words</text>
    <rect x="168" y="316" width="56" height="34" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="196" y="337" text-anchor="middle" font-size="12" fill="#222222">I feel…</text>
    <text x="196" y="352" text-anchor="middle" font-size="12" fill="#222222">I need…</text>
    <text x="196" y="372" text-anchor="middle" font-size="12" fill="#4f6d7a">not grabbing</text>
    <text x="196" y="386" text-anchor="middle" font-size="12" fill="#4f6d7a">or shouting</text>

    <rect x="264" y="240" width="112" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="320" cy="268" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="320" y="273" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">3</text>
    <text x="320" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b3a42">Listen</text>
    <path d="M300 322 Q314 310 330 322 Q344 334 320 340 Q308 334 300 322 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="320" y="372" text-anchor="middle" font-size="12" fill="#4f6d7a">Hear their</text>
    <text x="320" y="386" text-anchor="middle" font-size="12" fill="#4f6d7a">side too</text>

    <rect x="388" y="240" width="112" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="444" cy="268" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="444" y="273" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">4</text>
    <text x="444" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b3a42">Make a plan</text>
    <text x="444" y="330" text-anchor="middle" font-size="12" fill="#222222">Take turns</text>
    <text x="444" y="346" text-anchor="middle" font-size="12" fill="#222222">Share</text>
    <text x="444" y="362" text-anchor="middle" font-size="12" fill="#222222">or ask an</text>
    <text x="444" y="378" text-anchor="middle" font-size="12" fill="#222222">adult for help</text>
  </g>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Stop. Use words. Listen. Make a plan.</text>
</svg>
