<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Three responses to a conflict</title>
  <desc id="desc">A conflict box at the top with three arrows leading down to three choices: talk, listen, and repair harm; walk away or avoid, which leaves harm unaddressed; and escalate with force, which deepens harm. A note asks which choice is most just.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Three Responses to a Conflict</text>

  <!-- conflict -->
  <rect x="156" y="70" width="200" height="60" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="95" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">A real conflict</text>
  <text x="256" y="115" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">two sides, both hurt and angry</text>

  <!-- arrows -->
  <path d="M200 130 L120 190" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M256 130 L256 190" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <path d="M312 130 L392 190" fill="none" stroke="#4f6d7a" stroke-width="2"/>

  <!-- restore -->
  <rect x="34" y="190" width="172" height="120" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="58" cy="214" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="72" y="219" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">Talk, listen, repair</text>
  <text x="46" y="244" font-family="sans-serif" font-size="11" fill="#4f6d7a">each side is heard;</text>
  <text x="46" y="260" font-family="sans-serif" font-size="11" fill="#4f6d7a">harm is named and</text>
  <text x="46" y="276" font-family="sans-serif" font-size="11" fill="#4f6d7a">made right</text>
  <text x="46" y="300" font-family="sans-serif" font-size="11" fill="#2b3a42">restorative</text>

  <!-- avoid -->
  <rect x="206" y="190" width="100" height="120" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="230" cy="214" r="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="219" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">Walk away</text>
  <text x="218" y="244" font-family="sans-serif" font-size="10.5" fill="#4f6d7a">harm stays</text>
  <text x="218" y="260" font-family="sans-serif" font-size="10.5" fill="#4f6d7a">unaddressed;</text>
  <text x="218" y="276" font-family="sans-serif" font-size="10.5" fill="#4f6d7a">peace, but no</text>
  <text x="218" y="292" font-family="sans-serif" font-size="10.5" fill="#4f6d7a">repair</text>

  <!-- escalate -->
  <rect x="306" y="190" width="172" height="120" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="330" cy="214" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="344" y="219" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">Escalate with force</text>
  <text x="318" y="244" font-family="sans-serif" font-size="11" fill="#4f6d7a">hurt back, or use</text>
  <text x="318" y="260" font-family="sans-serif" font-size="11" fill="#4f6d7a">power to crush;</text>
  <text x="318" y="276" font-family="sans-serif" font-size="11" fill="#4f6d7a">harm deepens</text>

  <text x="256" y="356" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Weigh each response — then defend your choice.</text>
  <text x="256" y="382" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">The aim is not to win but to stop the harm and mend what broke.</text>

  <rect x="96" y="404" width="320" height="66" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="432" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">A fair resolution hears every side and repairs the harm.</text>
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">Conflict is not the enemy; unaddressed harm is.</text>
</svg>
