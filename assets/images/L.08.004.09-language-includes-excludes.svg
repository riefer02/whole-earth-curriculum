<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Language that includes and excludes</title>
  <desc id="desc">Two doors side by side. The left door is open, labeled "welcomes — plain words, everyone's language", with a small figure walking in. The right door is closed, labeled "shuts out — jargon, one language only", with a small figure standing outside. A question reads "who can come in?".</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">Language is a door</text>

  <!-- left open door -->
  <rect x="48" y="150" width="90" height="150" fill="#7a9e7e" opacity="0.5" stroke="#2b3a42" stroke-width="3"/>
  <rect x="48" y="150" width="90" height="150" fill="none"/>
  <path d="M138,150 L48,86 L48,150" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <path d="M48,86 L138,150" stroke="#2b3a42" stroke-width="1.5" stroke-dasharray="6,6"/>
  <!-- figure walking in -->
  <circle cx="82" cy="220" r="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M82,230 L82,268" stroke="#2b3a42" stroke-width="2"/>
  <path d="M82,240 L66,256 M82,240 L98,256" stroke="#2b3a42" stroke-width="2"/>
  <path d="M82,268 L70,288 M82,268 L94,288" stroke="#2b3a42" stroke-width="2"/>
  <text x="93" y="336" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">welcomes</text>
  <text x="93" y="354" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">plain words,</text>
  <text x="93" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">everyone's language</text>

  <!-- right closed door -->
  <rect x="374" y="150" width="90" height="150" fill="#e0a458" opacity="0.5" stroke="#2b3a42" stroke-width="3"/>
  <path d="M374,86 L374,150" stroke="#2b3a42" stroke-width="3"/>
  <path d="M374,86 L464,150" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="452" cy="236" r="3" fill="#222222"/>
  <!-- figure standing outside -->
  <circle cx="320" cy="228" r="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <path d="M320,238 L320,276" stroke="#2b3a42" stroke-width="2"/>
  <path d="M320,248 L304,264 M320,248 L336,264" stroke="#2b3a42" stroke-width="2"/>
  <path d="M320,276 L308,296 M320,276 L332,296" stroke="#2b3a42" stroke-width="2"/>
  <text x="419" y="336" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">shuts out</text>
  <text x="419" y="354" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">jargon,</text>
  <text x="419" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">one language only</text>

  <text x="256" y="416" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Who can come in?</text>
  <text x="256" y="442" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">We choose whether the door is open.</text>
</svg>
