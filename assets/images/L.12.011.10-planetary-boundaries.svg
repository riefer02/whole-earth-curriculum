<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Planetary Boundaries</title>
  <desc id="desc">Nine horizontal bars, each labeled with a planetary boundary: climate change, biosphere integrity, land-system change, freshwater change, biogeochemical flows, ocean acidification, aerosol loading, ozone depletion, and novel entities. Each bar ends with a word — safe, at risk, or crossed — instead of a number, so it reads in grayscale. Labels carry the meaning.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42" font-weight="bold">Nine Planetary Boundaries</text>
  <text x="256" y="56" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">the safe operating space for humanity</text>

  <!-- boundary bars: label left, state word right -->
  <g font-family="sans-serif">
    <line x1="20" y1="84" x2="492" y2="84" stroke="#4f6d7a" stroke-width="1"/>
    <text x="24" y="82" font-size="14" fill="#2b3a42" font-weight="bold">climate change</text>
    <text x="488" y="82" text-anchor="end" font-size="14" fill="#2b3a42" font-weight="bold">crossed</text>

    <line x1="20" y1="122" x2="492" y2="122" stroke="#4f6d7a" stroke-width="1"/>
    <text x="24" y="120" font-size="14" fill="#2b3a42" font-weight="bold">biosphere integrity</text>
    <text x="488" y="120" text-anchor="end" font-size="14" fill="#2b3a42" font-weight="bold">crossed</text>

    <line x1="20" y1="160" x2="492" y2="160" stroke="#4f6d7a" stroke-width="1"/>
    <text x="24" y="158" font-size="14" fill="#2b3a42" font-weight="bold">land-system change</text>
    <text x="488" y="158" text-anchor="end" font-size="14" fill="#2b3a42" font-weight="bold">crossed</text>

    <line x1="20" y1="198" x2="492" y2="198" stroke="#4f6d7a" stroke-width="1"/>
    <text x="24" y="196" font-size="14" fill="#2b3a42" font-weight="bold">freshwater change</text>
    <text x="488" y="196" text-anchor="end" font-size="14" fill="#2b3a42" font-weight="bold">crossed</text>

    <line x1="20" y1="236" x2="492" y2="236" stroke="#4f6d7a" stroke-width="1"/>
    <text x="24" y="234" font-size="14" fill="#2b3a42" font-weight="bold">biogeochemical flows</text>
    <text x="488" y="234" text-anchor="end" font-size="14" fill="#2b3a42" font-weight="bold">crossed</text>

    <line x1="20" y1="274" x2="492" y2="274" stroke="#4f6d7a" stroke-width="1"/>
    <text x="24" y="272" font-size="14" fill="#2b3a42" font-weight="bold">novel entities (plastics)</text>
    <text x="488" y="272" text-anchor="end" font-size="14" fill="#2b3a42" font-weight="bold">crossed</text>

    <line x1="20" y1="312" x2="492" y2="312" stroke="#4f6d7a" stroke-width="1"/>
    <text x="24" y="310" font-size="14" fill="#2b3a42" font-weight="bold">ocean acidification</text>
    <text x="488" y="310" text-anchor="end" font-size="14" fill="#2b3a42" font-weight="bold">at risk</text>

    <line x1="20" y1="350" x2="492" y2="350" stroke="#4f6d7a" stroke-width="1"/>
    <text x="24" y="348" font-size="14" fill="#2b3a42" font-weight="bold">aerosol loading</text>
    <text x="488" y="348" text-anchor="end" font-size="14" fill="#2b3a42" font-weight="bold">not crossed</text>

    <line x1="20" y1="388" x2="492" y2="388" stroke="#4f6d7a" stroke-width="1"/>
    <text x="24" y="386" font-size="14" fill="#2b3a42" font-weight="bold">ozone depletion</text>
    <text x="488" y="386" text-anchor="end" font-size="14" fill="#2b3a42" font-weight="bold">recovering</text>
  </g>

  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">An honest map, not a forecast of doom.</text>
  <text x="256" y="454" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Knowing the boundaries is the first step to steering.</text>
</svg>
