<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Change and continuity in the practice of trade</title>
  <desc id="desc">A two-column diagram for the practice of trade — left column what changed over centuries (scale, speed, money, technology), right column what stayed the same (exchanging what is scarce, carrying ideas, trust and credit), with a timeline of trade stages across the middle.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Trade: what changed &amp; what stayed</text>

  <!-- changed column -->
  <rect x="30" y="72" width="216" height="250" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="138" y="98" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">what changed</text>
  <text x="138" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">scale: local to global</text>
  <text x="138" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">speed &amp; technology:</text>
  <text x="138" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">feet, camels, sails, ships, internet</text>
  <text x="138" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">money: salt, shells, cacao,</text>
  <text x="138" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">coins, paper, electronic credit</text>
  <text x="138" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">(each new technology changed</text>
  <text x="138" y="256" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">how — and who gained)</text>

  <!-- stayed column -->
  <rect x="266" y="72" width="216" height="250" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="374" y="98" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">what stayed the same</text>
  <text x="374" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">the reason: exchanging</text>
  <text x="374" y="142" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">what is scarce</text>
  <text x="374" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">trade carries ideas, beliefs,</text>
  <text x="374" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">and technology, not only goods</text>
  <text x="374" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">trust, reputation, and credit —</text>
  <text x="374" y="242" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">every exchange rests on a</text>
  <text x="374" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">kept promise</text>

  <!-- timeline -->
  <text x="256" y="356" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">timeline of trade</text>
  <line x1="60" y1="384" x2="452" y2="384" stroke="#2b3a42" stroke-width="2"/>
  <g fill="#2b3a42">
    <circle cx="100" cy="384" r="4"/>
    <circle cx="188" cy="384" r="4"/>
    <circle cx="276" cy="384" r="4"/>
    <circle cx="364" cy="384" r="4"/>
    <circle cx="436" cy="384" r="4"/>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#4f6d7a" text-anchor="middle">
    <text x="100" y="408">early exchange</text>
    <text x="188" y="408">Silk Roads</text>
    <text x="276" y="408">Indian Ocean</text>
    <text x="364" y="408">transatlantic</text>
    <text x="436" y="408">today</text>
  </g>

  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">A practice can change almost entirely on the outside and stay the same at its heart.</text>
</svg>
