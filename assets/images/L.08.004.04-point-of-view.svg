<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Point of view — two windows on one scene</title>
  <desc id="desc">Two window frames side by side looking at the same simple scene of a ball near a fence. The left window is labeled "first person — I saw" and the right "third person limited — they saw". A note reads "each view reveals some things and hides others".</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">Point of view: whose eyes?</text>

  <!-- left window -->
  <rect x="36" y="80" width="200" height="180" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <line x1="136" y1="80" x2="136" y2="260" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="36" y1="170" x2="236" y2="170" stroke="#2b3a42" stroke-width="2.5"/>
  <!-- scene: fence and ball -->
  <rect x="60" y="196" width="150" height="34" fill="#7a9e7e" opacity="0.5" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="180" cy="188" r="13" fill="#e0a458" opacity="0.8" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="288" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">first person</text>
  <text x="136" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">"I watched the ball sail</text>
  <text x="136" y="324" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">over the fence…"</text>

  <!-- right window -->
  <rect x="276" y="80" width="200" height="180" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <line x1="376" y1="80" x2="376" y2="260" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="276" y1="170" x2="476" y2="170" stroke="#2b3a42" stroke-width="2.5"/>
  <rect x="300" y="196" width="150" height="34" fill="#7a9e7e" opacity="0.5" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="420" cy="188" r="13" fill="#e0a458" opacity="0.8" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="288" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">third person limited</text>
  <text x="376" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">"Amara watched the ball;</text>
  <text x="376" y="324" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">what he thought, none knew."</text>

  <text x="256" y="380" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Same event, different knowing.</text>
  <text x="256" y="408" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Each view reveals some things and hides others.</text>
</svg>
