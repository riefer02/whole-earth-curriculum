<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">The more-than-human world: humans as one being among many</title>
  <desc id="d">A circle of five labeled beings — river, forest, animal, mountain, and human — joined by connecting lines, with the human the same size and connected as kin, not placed above the others. A caption reads "all are beings owed care." Labels carry the meaning.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#222222">The more-than-human world</text>

  <circle cx="256" cy="256" r="150" fill="none" stroke="#2b3a42" stroke-width="2.5"/>

  <!-- river -->
  <rect x="196" y="70" width="120" height="54" rx="26" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="103" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">RIVER</text>

  <!-- forest -->
  <rect x="352" y="150" width="120" height="54" rx="26" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="412" y="183" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">FOREST</text>

  <!-- animal -->
  <rect x="352" y="300" width="120" height="54" rx="26" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="412" y="333" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">ANIMAL</text>

  <!-- mountain -->
  <rect x="40" y="150" width="120" height="54" rx="26" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="100" y="183" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">MOUNTAIN</text>

  <!-- human (center, same size) -->
  <rect x="196" y="226" width="120" height="54" rx="26" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="259" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">HUMAN</text>

  <!-- connecting lines -->
  <line x1="256" y1="124" x2="256" y2="222" stroke="#2b3a42" stroke-width="2"/>
  <line x1="160" y1="177" x2="220" y2="244" stroke="#2b3a42" stroke-width="2"/>
  <line x1="352" y1="177" x2="292" y2="244" stroke="#2b3a42" stroke-width="2"/>
  <line x1="160" y1="177" x2="196" y2="280" stroke="#2b3a42" stroke-width="2"/>
  <line x1="412" y1="204" x2="352" y2="280" stroke="#2b3a42" stroke-width="2"/>
  <line x1="412" y1="300" x2="292" y2="280" stroke="#2b3a42" stroke-width="2"/>

  <text x="256" y="428" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">One being among many — each owed care,</text>
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">not one being above the rest.</text>
</svg>
