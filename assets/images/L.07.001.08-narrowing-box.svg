<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A label can narrow me — and I can step out</title>
  <desc id="desc">A figure stands inside a closing box labeled "not for people like you." One side of the box has an open door, and beyond the door several labeled paths stretch outward: "try it anyway," "ask for help," "find my people," "redefine it." A caption reads "A label can narrow me — and I can step out." Meaning is carried by labels and shapes, not color, so it prints clearly in grayscale.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">A label can narrow me —</text>
  <text x="256" y="74" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">and I can step out.</text>

  <!-- The box -->
  <rect x="40" y="120" width="210" height="230" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
  <text x="145" y="146" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">"not for people like you"</text>

  <!-- Figure inside box -->
  <circle cx="145" cy="210" r="26" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M138 206 Q143 203 148 206" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M142 206 Q147 203 152 206" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M138 222 Q145 228 152 222" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M145 236 q-20 24 0 40 q20 -16 0 -40" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>

  <!-- Open door on right side of box -->
  <rect x="250" y="200" width="12" height="80" fill="#fdfbf7"/>
  <line x1="250" y1="200" x2="250" y2="280" stroke="#7a9e7e" stroke-width="3"/>
  <text x="236" y="192" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7a9e7e">door</text>

  <!-- Paths beyond the door -->
  <g>
    <path d="M262 240 L360 160" fill="none" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round"/>
    <text x="368" y="158" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">try it anyway</text>

    <path d="M262 240 L360 228" fill="none" stroke="#6b93b6" stroke-width="4" stroke-linecap="round"/>
    <text x="368" y="232" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">ask for help</text>

    <path d="M262 240 L360 296" fill="none" stroke="#e0a458" stroke-width="4" stroke-linecap="round"/>
    <text x="368" y="300" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">find my people</text>

    <path d="M262 240 L360 360" fill="none" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round"/>
    <text x="368" y="364" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">redefine it</text>
  </g>

  <!-- Caption -->
  <text x="256" y="436" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">The door is not locked.</text>
</svg>
