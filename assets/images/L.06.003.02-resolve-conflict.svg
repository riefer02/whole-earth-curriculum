<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Four-step conflict repair</title>
  <desc id="d">A four-step path labeled Pause, Say it with an I-statement, Listen, and Agree on a next step. At the Listen step, two figures of different skin tones sit across from each other, and a speech bubble reads "I felt left out when the plan changed without me."</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <!-- four step boxes -->
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="30" y="46" width="100" height="74" rx="10" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
    <text x="80" y="76" font-size="20" fill="#222222" font-weight="bold">1</text>
    <text x="80" y="100" font-size="15" fill="#222222">Pause</text>
    <rect x="142" y="46" width="100" height="74" rx="10" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
    <text x="192" y="76" font-size="20" fill="#222222" font-weight="bold">2</text>
    <text x="192" y="100" font-size="14" fill="#222222">Say it with</text>
    <text x="192" y="114" font-size="14" fill="#222222">an I-statement</text>
    <rect x="254" y="46" width="100" height="74" rx="10" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
    <text x="304" y="76" font-size="20" fill="#222222" font-weight="bold">3</text>
    <text x="304" y="100" font-size="15" fill="#222222">Listen</text>
    <rect x="366" y="46" width="100" height="74" rx="10" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
    <text x="416" y="76" font-size="20" fill="#222222" font-weight="bold">4</text>
    <text x="416" y="98" font-size="14" fill="#222222">Agree on</text>
    <text x="416" y="114" font-size="14" fill="#222222">a next step</text>
  </g>
  <!-- arrows between steps -->
  <g stroke="#4f6d7a" stroke-width="4" stroke-linecap="round">
    <line x1="130" y1="83" x2="140" y2="83"/>
    <line x1="242" y1="83" x2="252" y2="83"/>
    <line x1="354" y1="83" x2="364" y2="83"/>
  </g>
  <!-- two figures sitting across a table -->
  <g>
    <circle cx="210" cy="250" r="17" fill="#a9714b"/>
    <rect x="195" y="267" width="30" height="40" rx="9" fill="#e0a458"/>
    <circle cx="348" cy="250" r="17" fill="#f2c9a0"/>
    <rect x="333" y="267" width="30" height="40" rx="9" fill="#6b93b6"/>
    <!-- table -->
    <rect x="180" y="330" width="200" height="14" rx="4" fill="#2b3a42"/>
    <rect x="192" y="344" width="10" height="60" fill="#2b3a42"/>
    <rect x="356" y="344" width="10" height="60" fill="#2b3a42"/>
  </g>
  <!-- speech bubble -->
  <g>
    <rect x="120" y="380" width="300" height="58" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
    <path d="M220 438 L220 456 L244 438 Z" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
    <text x="270" y="404" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">"I felt left out when the</text>
    <text x="270" y="424" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">plan changed without me."</text>
  </g>
</svg>
