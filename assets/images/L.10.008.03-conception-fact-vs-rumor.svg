<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Conception: Fact vs. Rumor</title>
  <desc id="desc">A simple labeled diagram of an egg and a sperm meeting to form a fertilized egg, beside a two-column list contrasting rumor with reality about bodies and pregnancy.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42" font-weight="bold">How Pregnancy Can Begin</text>

  <!-- egg + sperm diagram -->
  <circle cx="150" cy="120" r="40" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="150" y="125" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">Egg</text>

  <g stroke="#2b3a42" stroke-width="2">
    <path d="M245 95 Q 275 75 305 88" fill="none"/>
    <ellipse cx="308" cy="92" rx="16" ry="8" fill="#6b93b6"/>
    <path d="M320 92 q 14 -6 20 -2 q -8 10 -20 2" fill="#6b93b6" stroke="none"/>
  </g>
  <text x="288" y="70" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">Sperm</text>

  <text x="230" y="140" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">+</text>

  <!-- fertilized egg -->
  <circle cx="360" cy="120" r="44" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="360" cy="120" r="16" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="360" y="182" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">Fertilized egg</text>

  <line x1="256" y1="200" x2="256" y2="228" stroke="#2b3a42" stroke-width="2"/>
  <polygon points="256,232 250,220 262,220" fill="#2b3a42"/>
  <text x="256" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Implants in the uterus &#8594; pregnancy may begin</text>

  <line x1="36" y1="280" x2="476" y2="280" stroke="#2b3a42" stroke-width="2"/>

  <!-- rumor vs reality -->
  <text x="150" y="312" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#b5573a" font-weight="bold">Rumor</text>
  <text x="362" y="312" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a" font-weight="bold">Reality</text>

  <g font-family="sans-serif" font-size="13" fill="#222222">
    <rect x="36" y="326" width="228" height="52" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="150" y="348" text-anchor="middle">&#8220;You can&#8217;t get pregnant the first time.&#8221;</text>
    <text x="150" y="368" text-anchor="middle" fill="#4f6d7a">A first time can lead to pregnancy.</text>

    <rect x="248" y="326" width="228" height="52" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="362" y="348" text-anchor="middle">One egg + one sperm is required.</text>
    <text x="362" y="368" text-anchor="middle" fill="#4f6d7a">No position, timing myth, or luck changes that.</text>

    <rect x="36" y="388" width="228" height="52" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="150" y="410" text-anchor="middle">&#8220;It only happens on certain days.&#8221;</text>
    <text x="150" y="430" text-anchor="middle" fill="#4f6d7a">Risk varies by cycle, never to zero on rumor.</text>

    <rect x="248" y="388" width="228" height="52" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="362" y="410" text-anchor="middle">Contraception works in different ways.</text>
    <text x="362" y="430" text-anchor="middle" fill="#4f6d7a">Knowing the methods is the next lesson.</text>
  </g>

  <text x="256" y="476" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">When a claim surprises you, check it against a trustworthy source first.</text>
</svg>
