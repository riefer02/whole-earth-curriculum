<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-10-008-03-conception-fact-vs-rumor desc-L-10-008-03-conception-fact-vs-rumor">
  <title id="title-L-10-008-03-conception-fact-vs-rumor">Conception: Fact vs. Rumor</title>
  <desc id="desc-L-10-008-03-conception-fact-vs-rumor">A simple labeled diagram of an egg and a sperm meeting to form a fertilized egg, beside a two-column list contrasting rumor with reality about bodies and pregnancy.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42" font-weight="bold">How Pregnancy Can Begin</text>

  <!-- egg + sperm diagram -->
  <circle cx="150" cy="120" r="40" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="150" y="125" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">Egg</text>

  <g stroke="#2b3a42" stroke-width="2">
    <path d="M245 95 Q 275 75 305 88" fill="none"/>
    <ellipse cx="308" cy="92" rx="16" ry="8" fill="#6b93b6"/>
    <path d="M320 92 q 14 -6 20 -2 q -8 10 -20 2" fill="#6b93b6" stroke="none"/>
  </g>
  <text x="288" y="70" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">Sperm</text>

  <text x="230" y="140" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">+</text>

  <!-- fertilized egg -->
  <circle cx="360" cy="120" r="44" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="360" cy="120" r="16" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="360" y="182" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">Fertilized egg</text>

  <line x1="256" y1="200" x2="256" y2="228" stroke="#2b3a42" stroke-width="2"/>
  <polygon points="256,232 250,220 262,220" fill="#2b3a42"/>
  <text x="256" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Implants in the uterus &#8594; pregnancy may begin</text>

  <line x1="36" y1="272" x2="476" y2="272" stroke="#2b3a42" stroke-width="2"/>

  <!-- rumor vs reality -->
  <text x="146" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#b5573a" font-weight="bold">Rumor</text>
  <text x="366" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a" font-weight="bold">Reality</text>

  <g font-family="sans-serif" font-size="12" fill="#222222">
    <rect x="36" y="312" width="220" height="84" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="146" y="332" text-anchor="middle">&#8220;You can&#8217;t get pregnant</text>
    <text x="146" y="350" text-anchor="middle">the first time.&#8221;</text>
    <text x="146" y="370" text-anchor="middle" fill="#4f6d7a">A first time can lead</text>
    <text x="146" y="388" text-anchor="middle" fill="#4f6d7a">to pregnancy.</text>

    <rect x="256" y="312" width="220" height="84" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="366" y="332" text-anchor="middle">One egg + one sperm</text>
    <text x="366" y="350" text-anchor="middle">is required.</text>
    <text x="366" y="370" text-anchor="middle" fill="#4f6d7a">No position, timing</text>
    <text x="366" y="388" text-anchor="middle" fill="#4f6d7a">myth or luck changes that.</text>

    <rect x="36" y="404" width="220" height="84" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="146" y="424" text-anchor="middle">&#8220;It only happens on</text>
    <text x="146" y="442" text-anchor="middle">certain days.&#8221;</text>
    <text x="146" y="462" text-anchor="middle" fill="#4f6d7a">Risk varies by cycle,</text>
    <text x="146" y="480" text-anchor="middle" fill="#4f6d7a">never to zero on rumor.</text>

    <rect x="256" y="404" width="220" height="84" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="366" y="424" text-anchor="middle">Contraception works</text>
    <text x="366" y="442" text-anchor="middle">in different ways.</text>
    <text x="366" y="462" text-anchor="middle" fill="#4f6d7a">Knowing the methods</text>
    <text x="366" y="480" text-anchor="middle" fill="#4f6d7a">is the next lesson.</text>
  </g>

  <text x="256" y="502" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">When a claim surprises you, check it against a trustworthy source first.</text>
</svg>
