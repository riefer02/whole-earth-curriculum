<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-05-005-03-presentation-main-idea desc-L-05-005-03-presentation-main-idea">
  <title id="title-L-05-005-03-presentation-main-idea">One clear main idea</title>
  <desc id="desc-L-05-005-03-presentation-main-idea">A speaker stands before a small audience holding up a large banner that reads "One main idea." Above the speaker, a thought bubble shows a tangle of many small words crossed out, and an arrow leads down to the single clear banner. The banner is labeled "main idea" and the crossed-out tangle is labeled "too many ideas." Labels and shapes, not color alone, carry the meaning so the graphic prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">A Presentation with One Main Idea</text>

  <!-- Tangled many ideas (top), crossed out -->
  <rect x="64" y="64" width="384" height="86" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">weather • the game • a cousin's visit • food • the road</text>
  <text x="256" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">a story • a song • a joke • the weather again • ...</text>
  <line x1="80" y1="72" x2="432" y2="140" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  <text x="256" y="164" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">too many ideas</text>

  <!-- Down arrow -->
  <path d="M256 176 L256 226" fill="none" stroke="#4f6d7a" stroke-width="3"/>
  <path d="M246 216 L256 228 L266 216" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-linejoin="round"/>

  <!-- Speaker figure -->
  <g fill="#f5d6b6" stroke="none">
    <circle cx="200" cy="268" r="26"/>
    <rect x="193" y="290" width="14" height="14" rx="6"/>
    <rect x="176" y="300" width="48" height="66" rx="21"/>
    <path d="M180 314 l-12 44" stroke="#f5d6b6" stroke-width="13" stroke-linecap="round"/>
    <path d="M220 314 l22 -30" stroke="#f5d6b6" stroke-width="13" stroke-linecap="round"/>
    <path d="M190 362 l-4 54" stroke="#f5d6b6" stroke-width="14" stroke-linecap="round"/>
    <path d="M210 362 l4 54" stroke="#f5d6b6" stroke-width="14" stroke-linecap="round"/>
  </g>
  <ellipse cx="185" cy="422" rx="9" ry="5" fill="#f5d6b6"/>
  <ellipse cx="215" cy="422" rx="9" ry="5" fill="#f5d6b6"/>
  <circle cx="200" cy="268" r="26" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="191" cy="264" r="2.6" fill="#2b3a42"/>
  <circle cx="209" cy="264" r="2.6" fill="#2b3a42"/>
  <path d="M187 278 Q200 285 213 278" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>

  <!-- Banner held up -->
  <rect x="242" y="240" width="236" height="72" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="360" y="270" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">One main idea</text>
  <text x="360" y="296" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">the one thing to remember</text>
  <line x1="242" y1="312" x2="228" y2="330" stroke="#2b3a42" stroke-width="2"/>

  <!-- Audience -->
  <circle cx="340" cy="466" r="19" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="334" cy="462" r="2.4" fill="#2b3a42"/>
  <circle cx="346" cy="462" r="2.4" fill="#2b3a42"/>
  <path d="M333 472 Q340 476 347 472" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>

  <circle cx="402" cy="470" r="19" fill="#e8b98a" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="396" cy="466" r="2.4" fill="#2b3a42"/>
  <circle cx="408" cy="466" r="2.4" fill="#2b3a42"/>
  <path d="M395 476 Q402 480 409 476" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>

  <circle cx="462" cy="468" r="19" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="456" cy="464" r="2.4" fill="#2b3a42"/>
  <circle cx="468" cy="464" r="2.4" fill="#2b3a42"/>
  <path d="M455 474 Q462 478 469 474" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>

  <text x="256" y="504" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">State the one thing your audience should remember.</text>
</svg>
