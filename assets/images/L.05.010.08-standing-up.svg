<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 470" role="img" aria-labelledby="title desc">
  <title id="title">Standing up, helping one another</title>
  <desc id="desc">A three-panel strip titled "Standing up, helping one another." The left panel, "Salt March — India, 1930," shows a long line of walkers moving toward the sea, with a small sign reading "make our own salt." The middle panel, "Aba Women's War — Nigeria, 1929," shows women gathered together, holding hands in a ring. The right panel, "Wave Hill walk-off — Australia, 1966," shows stockworkers walking away from a station, carrying a few belongings, heads held high. A caption reads "People who are treated unfairly can resist peacefully and help one another." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="470" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Standing Up, Helping One Another</text>

  <!-- Panel 1: Salt March -->
  <rect x="24" y="66" width="144" height="346" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="96" y="92" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">Salt March</text>
  <text x="96" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">India, 1930</text>
  <!-- line of walkers -->
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="48" cy="240" r="10" fill="#d9a06b"/>
    <circle cx="76" cy="240" r="10" fill="#e6bb92"/>
    <circle cx="104" cy="240" r="10" fill="#ab7a4e"/>
    <circle cx="132" cy="240" r="10" fill="#8c5a3b"/>
    <path d="M48 250 L48 292"/>
    <path d="M76 250 L76 292"/>
    <path d="M104 250 L104 292"/>
    <path d="M132 250 L132 292"/>
    <path d="M48 262 L58 268"/>
    <path d="M132 262 L122 268"/>
  </g>
  <!-- sign -->
  <rect x="60" y="196" width="74" height="26" rx="3" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="66" y1="222" x2="66" y2="240" stroke="#2b3a42" stroke-width="2"/>
  <text x="97" y="214" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2b3a42">make our own salt</text>
  <!-- sea -->
  <g stroke="#6b93b6" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M34 330 Q56 322 78 330 Q100 338 122 330"/>
  </g>
  <text x="96" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">walking peacefully</text>
  <text x="96" y="378" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">to the sea</text>

  <!-- Panel 2: Aba Women's War -->
  <rect x="184" y="66" width="144" height="346" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="92" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">Aba Women's War</text>
  <text x="256" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Nigeria, 1929</text>
  <!-- ring of women -->
  <circle cx="256" cy="240" r="58" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="184" r="10" fill="#e6bb92"/>
    <circle cx="220" cy="228" r="10" fill="#ab7a4e"/>
    <circle cx="292" cy="228" r="10" fill="#d9a06b"/>
    <circle cx="256" cy="276" r="10" fill="#8c5a3b"/>
    <path d="M256 194 L256 224"/>
    <path d="M220 238 L220 260"/>
    <path d="M292 238 L292 260"/>
    <path d="M256 286 L256 298"/>
  </g>
  <!-- joined hands -->
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M246 190 L230 222"/>
    <path d="M266 190 L282 222"/>
    <path d="M228 236 L262 270"/>
    <path d="M284 236 L250 270"/>
  </g>
  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">organized, gathered,</text>
  <text x="256" y="378" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">supported each other</text>

  <!-- Panel 3: Wave Hill -->
  <rect x="344" y="66" width="144" height="346" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="416" y="92" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">Wave Hill walk-off</text>
  <text x="416" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Australia, 1966</text>
  <!-- station building behind -->
  <rect x="396" y="150" width="56" height="40" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M390 150 L424 130 L458 150 Z" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <!-- walkers leaving -->
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="372" cy="252" r="10" fill="#8c5a3b"/>
    <circle cx="404" cy="252" r="10" fill="#e6bb92"/>
    <path d="M372 262 L372 300"/>
    <path d="M404 262 L404 300"/>
    <path d="M372 274 L384 280"/>
    <path d="M404 274 L392 280"/>
  </g>
  <!-- belongings -->
  <rect x="388" y="242" width="16" height="12" rx="2" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <!-- ground -->
  <line x1="356" y1="304" x2="476" y2="304" stroke="#2b3a42" stroke-width="2"/>
  <text x="416" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">walked off for fair pay</text>
  <text x="416" y="378" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">and their own land</text>

  <text x="256" y="442" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">People who are treated unfairly can resist peacefully and help one another.</text>
</svg>
