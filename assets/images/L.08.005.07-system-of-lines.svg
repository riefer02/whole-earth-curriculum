<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Solving a system of two lines by graphing</title>
  <desc id="desc">A coordinate grid showing two lines: y = 2x + 1 and y = −x + 7, crossing at the point (2, 5). The point is marked with a dot and labeled "the solution satisfies both equations." A second small panel shows two parallel lines labeled "no solution — parallel lines never meet." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="30" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Two Equations at Once: The Crossing Point</text>

  <!-- main grid -->
  <g stroke="#cfd8dc" stroke-width="1">
    <line x1="60" y1="80" x2="60" y2="360"/>
    <line x1="120" y1="80" x2="120" y2="360"/>
    <line x1="180" y1="80" x2="180" y2="360"/>
    <line x1="240" y1="80" x2="240" y2="360"/>
    <line x1="300" y1="80" x2="300" y2="360"/>
    <line x1="360" y1="80" x2="360" y2="360"/>
    <line x1="60" y1="120" x2="360" y2="120"/>
    <line x1="60" y1="160" x2="360" y2="160"/>
    <line x1="60" y1="200" x2="360" y2="200"/>
    <line x1="60" y1="240" x2="360" y2="240"/>
    <line x1="60" y1="280" x2="360" y2="280"/>
    <line x1="60" y1="320" x2="360" y2="320"/>
  </g>
  <!-- axes -->
  <line x1="60" y1="360" x2="360" y2="360" stroke="#2b3a42" stroke-width="2"/>
  <line x1="60" y1="80" x2="60" y2="360" stroke="#2b3a42" stroke-width="2"/>
  <path d="M360 360 L352 356 M360 360 L352 364" stroke="#2b3a42" stroke-width="2"/>
  <text x="360" y="382" text-anchor="end" font-family="sans-serif" font-size="13" fill="#222222">x</text>
  <text x="48" y="76" font-family="sans-serif" font-size="13" fill="#222222">y</text>
  <text x="56" y="378" font-family="sans-serif" font-size="12" fill="#222222">0</text>

  <!-- line y = 2x + 1: through (0,1)->(1,3)->(2,5)->(3,7) -->
  <line x1="60" y1="320" x2="300" y2="80" stroke="#6b93b6" stroke-width="3"/>
  <text x="292" y="96" font-family="sans-serif" font-size="12" fill="#6b93b6">y = 2x + 1</text>

  <!-- line y = -x + 7: through (0,7)->(1,6)->(2,5)->(3,4)->(5,2) -->
  <line x1="60" y1="80" x2="360" y2="280" stroke="#e0a458" stroke-width="3"/>
  <text x="150" y="96" font-family="sans-serif" font-size="12" fill="#e0a458">y = −x + 7</text>

  <!-- intersection -->
  <circle cx="180" cy="200" r="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="196" y="216" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">(2, 5)</text>

  <text x="256" y="414" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">the solution satisfies both equations: 5 = 2(2) + 1 ✓ and 5 = −2 + 7 ✓</text>

  <!-- parallel panel -->
  <rect x="384" y="80" width="108" height="280" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <line x1="396" y1="300" x2="480" y2="180" stroke="#4f6d7a" stroke-width="2"/>
  <line x1="396" y1="270" x2="480" y2="150" stroke="#4f6d7a" stroke-width="2"/>
  <text x="438" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">parallel</text>
  <text x="438" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">lines never</text>
  <text x="438" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">meet</text>
  <text x="438" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">no solution</text>

  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">check the crossing point in both equations — a point on one line is not enough</text>
</svg>
