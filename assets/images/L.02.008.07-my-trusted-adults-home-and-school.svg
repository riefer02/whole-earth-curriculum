<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My trusted adults at home and school</title>
  <desc id="desc">Two panels. The home panel shows a child with a grandparent who uses a cane and a caregiver; the school panel shows a teacher, a nurse, and a coach. Between them, a hand with each finger labeled as a place a trusted adult can be. Every figure is drawn simply and warmly with varied features and abilities, so the idea that trusted adults can be found at home and at school reads clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">My Trusted Adults</text>
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">At home and at school, grown-ups who listen and help.</text>

  <!-- Home panel -->
  <g>
    <rect x="16" y="92" width="232" height="256" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <rect x="16" y="92" width="232" height="38" rx="12" fill="#7a9e7e" stroke="#4f6d7a" stroke-width="2"/>
    <rect x="16" y="112" width="232" height="18" fill="#7a9e7e"/>
    <text x="132" y="117" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">at home</text>

    <!-- grandparent with cane -->
    <circle cx="88" cy="176" r="22" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M70 190 q18 -16 36 0 q-4 16 -18 16 q-14 0 -18 -16 Z" fill="#4f6d7a"/>
    <rect x="64" y="206" width="48" height="40" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M98 206 l0 40 m-14 -40 l14 20 l14 -20" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <path d="M76 246 l0 44" stroke="#4f6d7a" stroke-width="5" stroke-linecap="round"/>
    <path d="M76 284 q-8 -4 -10 -14" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>

    <!-- caregiver -->
    <circle cx="176" cy="176" r="24" fill="#8d6e63" stroke="#2b3a42" stroke-width="2"/>
    <path d="M156 192 q20 -20 40 0 q-4 18 -20 18 q-16 0 -20 -18 Z" fill="#2b3a42"/>
    <rect x="152" y="210" width="48" height="44" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M176 210 l0 44" stroke="#2b3a42" stroke-width="2"/>

    <text x="132" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">a caregiver, a grandparent, an aunt or uncle</text>
  </g>

  <!-- School panel -->
  <g>
    <rect x="264" y="92" width="232" height="256" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <rect x="264" y="92" width="232" height="38" rx="12" fill="#6b93b6" stroke="#4f6d7a" stroke-width="2"/>
    <rect x="264" y="112" width="232" height="18" fill="#6b93b6"/>
    <text x="380" y="117" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">at school</text>

    <!-- teacher -->
    <circle cx="316" cy="176" r="20" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M300 190 q16 -14 32 0 q-4 14 -16 14 q-12 0 -16 -14 Z" fill="#2b3a42"/>
    <rect x="296" y="204" width="40" height="38" rx="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="300" y="210" width="14" height="16" rx="2" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>

    <!-- nurse -->
    <circle cx="380" cy="176" r="20" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M364 190 q16 -14 32 0 q-4 14 -16 14 q-12 0 -16 -14 Z" fill="#2b3a42"/>
    <rect x="360" y="204" width="40" height="38" rx="7" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="376" cy="218" r="4" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="384" cy="218" r="4" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>

    <!-- coach -->
    <circle cx="444" cy="176" r="20" fill="#8d6e63" stroke="#2b3a42" stroke-width="2"/>
    <path d="M428 190 q16 -14 32 0 q-4 14 -16 14 q-12 0 -16 -14 Z" fill="#2b3a42"/>
    <rect x="424" y="204" width="40" height="38" rx="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="444" cy="220" r="6" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>

    <text x="380" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">a teacher, a nurse, a coach, a school helper</text>
  </g>

  <!-- Help hand -->
  <g>
    <text x="256" y="388" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Count your trusted adults on one hand:</text>
    <g transform="translate(256 462)">
      <path d="M-40 0 q-4 -26 8 -40 q10 -14 24 -14 q14 0 24 14 q2 4 4 10 l2 -12 q0 -8 8 -8 l6 4 q0 -12 8 -16 q10 -6 16 0 q8 6 8 16 l4 -4 q4 -8 10 -8 q8 0 8 8 l0 50 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
      <text x="0" y="10" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">5 trusted adults</text>
    </g>
  </g>

  <text x="256" y="502" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">You choose who you trust — a trusted adult is someone you feel safe with.</text>
</svg>
