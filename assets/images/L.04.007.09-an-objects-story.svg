<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">An object tells a story</title>
  <desc id="d">A woven basket sits in the center. Three labeled boxes point to it: materials (what it is made of), needs (what it is for), and ideas (what it means). Labels carry all meaning, so the graphic prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#222222">An Object Tells a Story</text>
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">every object says where it is from</text>

  <!-- basket -->
  <path d="M 190 250 L 322 250 L 300 360 L 212 360 Z" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linejoin="round"/>
  <g fill="none" stroke="#2b3a42" stroke-width="2">
    <line x1="196" y1="290" x2="316" y2="290"/>
    <line x1="204" y1="330" x2="308" y2="330"/>
    <line x1="226" y1="250" x2="214" y2="360"/>
    <line x1="286" y1="250" x2="298" y2="360"/>
  </g>
  <path d="M 190 250 q 66 -60 132 0" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="396" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">a woven basket</text>

  <!-- three labeled boxes -->
  <g font-family="sans-serif" fill="#222222">
    <rect x="28" y="92" width="140" height="70" rx="10" fill="#7a9e7e" fill-opacity="0.5" stroke="#2b3a42" stroke-width="3"/>
    <text x="98" y="121" text-anchor="middle" font-size="16" font-weight="bold">materials</text>
    <text x="98" y="143" text-anchor="middle" font-size="13">what it is made of</text>

    <rect x="344" y="92" width="140" height="70" rx="10" fill="#6b93b6" fill-opacity="0.5" stroke="#2b3a42" stroke-width="3"/>
    <text x="414" y="121" text-anchor="middle" font-size="16" font-weight="bold">needs</text>
    <text x="414" y="143" text-anchor="middle" font-size="13">what it is for</text>

    <rect x="344" y="300" width="140" height="70" rx="10" fill="#e0a458" fill-opacity="0.5" stroke="#2b3a42" stroke-width="3"/>
    <text x="414" y="329" text-anchor="middle" font-size="16" font-weight="bold">ideas</text>
    <text x="414" y="351" text-anchor="middle" font-size="13">what it means</text>
  </g>

  <!-- connector lines -->
  <g fill="none" stroke="#4f6d7a" stroke-width="2.5">
    <line x1="168" y1="127" x2="196" y2="222"/>
    <line x1="344" y1="127" x2="316" y2="222"/>
    <line x1="344" y1="335" x2="312" y2="340"/>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">Look at an object and ask: what grows here, what do people need, what do they value?</text>
</svg>
