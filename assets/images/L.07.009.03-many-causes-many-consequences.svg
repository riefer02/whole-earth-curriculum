<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Many causes lead to one change, which leads to many consequences</title>
  <desc id="desc">A cause-and-consequence diagram. On the left, four rounded boxes labeled "cause" with arrows pointing right to a central box labeled "the change." From the central box, three arrows point right to three boxes labeled "consequence." The picture shows that one big change has more than one cause and more than one consequence.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="52" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">One change, many causes, many results</text>

  <!-- Causes -->
  <g font-family="sans-serif">
    <rect x="20" y="120" width="120" height="56" rx="10" fill="#6b93b6" opacity="0.25" stroke="#2b3a42" stroke-width="2"/>
    <text x="80" y="154" text-anchor="middle" font-size="14" fill="#222222">cause 1</text>

    <rect x="20" y="196" width="120" height="56" rx="10" fill="#6b93b6" opacity="0.25" stroke="#2b3a42" stroke-width="2"/>
    <text x="80" y="230" text-anchor="middle" font-size="14" fill="#222222">cause 2</text>

    <rect x="20" y="272" width="120" height="56" rx="10" fill="#6b93b6" opacity="0.25" stroke="#2b3a42" stroke-width="2"/>
    <text x="80" y="306" text-anchor="middle" font-size="14" fill="#222222">cause 3</text>

    <rect x="20" y="348" width="120" height="56" rx="10" fill="#6b93b6" opacity="0.25" stroke="#2b3a42" stroke-width="2"/>
    <text x="80" y="382" text-anchor="middle" font-size="14" fill="#222222">cause 4</text>
  </g>

  <!-- Arrows from causes to change -->
  <g stroke="#2b3a42" stroke-width="2.5">
    <line x1="140" y1="148" x2="196" y2="236"/>
    <line x1="140" y1="224" x2="196" y2="250"/>
    <line x1="140" y1="300" x2="196" y2="264"/>
    <line x1="140" y1="376" x2="196" y2="278"/>
  </g>

  <!-- Change box -->
  <rect x="196" y="216" width="110" height="88" rx="12" fill="#e0a458" opacity="0.5" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="251" y="256" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">THE</text>
  <text x="251" y="278" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">CHANGE</text>

  <!-- Arrows from change to consequences -->
  <g stroke="#2b3a42" stroke-width="2.5">
    <line x1="306" y1="240" x2="362" y2="140"/>
    <line x1="306" y1="260" x2="362" y2="260"/>
    <line x1="306" y1="280" x2="362" y2="380"/>
  </g>

  <!-- Consequences -->
  <g font-family="sans-serif">
    <rect x="362" y="112" width="130" height="56" rx="10" fill="#7a9e7e" opacity="0.3" stroke="#2b3a42" stroke-width="2"/>
    <text x="427" y="146" text-anchor="middle" font-size="14" fill="#222222">result 1</text>

    <rect x="362" y="232" width="130" height="56" rx="10" fill="#7a9e7e" opacity="0.3" stroke="#2b3a42" stroke-width="2"/>
    <text x="427" y="266" text-anchor="middle" font-size="14" fill="#222222">result 2</text>

    <rect x="362" y="352" width="130" height="56" rx="10" fill="#7a9e7e" opacity="0.3" stroke="#2b3a42" stroke-width="2"/>
    <text x="427" y="386" text-anchor="middle" font-size="14" fill="#222222">result 3</text>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Some results are intended; others surprise everyone.</text>
</svg>
