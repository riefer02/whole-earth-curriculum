<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A small job that helps, and how it helps</title>
  <desc id="desc">Four cards show small classroom jobs and how each helps. Watering the plant shows a watering can over a sprout, labeled "it helps: the plant grows." Tidying the shelf shows a shelf of books, labeled "it helps: everyone finds things." Helping carry shows two children carrying a basket together, one of them using a wheelchair, labeled "it helps: the load is lighter." Caring for the class animal shows a bird in a nest, labeled "it helps: the animal is well." Each job and its help are named in words, so the picture prints clearly in grayscale and teaches that every job is a contribution that matters, and no job is more important than another — helping is not a prize to win.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">A Small Job That Helps</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Every job is a contribution — not a prize</text>

  <!-- card frames -->
  <rect x="20" y="90" width="226" height="180" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="266" y="90" width="226" height="180" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="20" y="282" width="226" height="180" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="266" y="282" width="226" height="180" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>

  <!-- 1. water the plant -->
  <text x="133" y="114" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">water the plant</text>
  <!-- sprout -->
  <path d="M130 180 L130 150" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round"/>
  <path d="M130 168 Q118 160 108 162 Q118 152 130 158 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M130 160 Q142 150 152 152 Q142 144 130 150 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M118 192 L142 192 L138 206 L122 206 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <!-- watering can -->
  <path d="M118 128 L150 128 L152 138 L120 138 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <line x1="150" y1="130" x2="160" y2="122" stroke="#6b93b6" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#6b93b6" stroke-width="2" stroke-linecap="round">
    <line x1="126" y1="140" x2="124" y2="150"/>
    <line x1="136" y1="140" x2="134" y2="152"/>
    <line x1="146" y1="140" x2="144" y2="150"/>
  </g>
  <text x="133" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">it helps: the plant grows</text>

  <!-- 2. tidy the shelf -->
  <text x="379" y="114" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">tidy the shelf</text>
  <!-- shelf -->
  <rect x="340" y="150" width="78" height="6" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <rect x="340" y="178" width="78" height="6" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <!-- books top row -->
  <rect x="344" y="118" width="12" height="32" rx="2" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <rect x="358" y="122" width="12" height="28" rx="2" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="372" y="116" width="12" height="34" rx="2" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <rect x="386" y="124" width="12" height="26" rx="2" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <rect x="400" y="120" width="12" height="30" rx="2" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <!-- books bottom row -->
  <rect x="344" y="184" width="12" height="28" rx="2" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <rect x="358" y="188" width="12" height="24" rx="2" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <rect x="372" y="182" width="12" height="30" rx="2" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="386" y="186" width="12" height="26" rx="2" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="379" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">it helps: everyone finds things</text>

  <!-- 3. help carry (two children + basket, one wheelchair) -->
  <text x="133" y="306" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">help carry</text>
  <!-- basket -->
  <path d="M110 340 L156 340 L152 372 L114 372 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <line x1="104" y1="332" x2="162" y2="332" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <!-- left child (standing, medium skin) -->
  <circle cx="92" cy="318" r="11" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M81 316 A11 11 0 0 1 103 316 Z" fill="#2b3a42"/>
  <circle cx="87" cy="318" r="1.5" fill="#2b3a42"/>
  <circle cx="97" cy="318" r="1.5" fill="#2b3a42"/>
  <path d="M87 325 Q92 329 97 325" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="83" y="330" width="18" height="26" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <line x1="87" y1="356" x2="85" y2="378" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <line x1="97" y1="356" x2="99" y2="378" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <!-- arm holding basket -->
  <line x1="101" y1="338" x2="112" y2="346" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <!-- right child (wheelchair, deep skin) -->
  <circle cx="176" cy="320" r="11" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M165 318 A11 11 0 0 1 187 318 Z" fill="#2b3a42"/>
  <circle cx="171" cy="320" r="1.5" fill="#2b3a42"/>
  <circle cx="181" cy="320" r="1.5" fill="#2b3a42"/>
  <path d="M171 327 Q176 331 181 327" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <rect x="167" y="332" width="18" height="26" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="167" y="360" width="22" height="4" rx="2" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="172" cy="382" r="10" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="172" cy="382" r="3" fill="#2b3a42"/>
  <circle cx="186" cy="382" r="4" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <line x1="167" y1="364" x2="161" y2="378" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <!-- arm holding basket -->
  <line x1="167" y1="340" x2="156" y2="346" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
  <text x="133" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">it helps: the load is lighter</text>

  <!-- 4. care for class animal -->
  <text x="379" y="306" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">care for the animal</text>
  <!-- nest -->
  <path d="M342 360 Q379 392 416 360 Q379 372 342 360 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <!-- bird -->
  <circle cx="379" cy="340" r="12" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="386" cy="337" r="2" fill="#2b3a42"/>
  <path d="M390 340 L400 342 L390 345 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M368 340 L360 346 M367 348 L358 356" stroke="#e0a458" stroke-width="2" stroke-linecap="round"/>
  <text x="379" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">it helps: the animal is well</text>

  <text x="256" y="472" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Every job helps equally — no job is more important than another.</text>
</svg>
