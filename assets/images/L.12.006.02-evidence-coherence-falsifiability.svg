<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Evidence, Coherence, and Falsifiability</title>
  <desc id="desc">Three labeled tool cards — Evidence, Coherence, Falsifiability — each with a one-line definition and a test question, plus a reminder that a correlation is not yet a cause.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Three Tools for Checking a Claim</text>

  <!-- Evidence card -->
  <rect x="36" y="70" width="440" height="110" rx="8" fill="none" stroke="#4f6d7a" stroke-width="3"/>
  <text x="56" y="102" font-family="sans-serif" font-size="19" fill="#2b3a42" font-weight="bold">Evidence</text>
  <text x="56" y="128" font-family="sans-serif" font-size="15" fill="#222222">Repeated, checked observations — not a strong feeling.</text>
  <text x="56" y="152" font-family="sans-serif" font-size="15" fill="#4f6d7a">Ask: could someone else observe it too?</text>

  <!-- Coherence card -->
  <rect x="36" y="196" width="440" height="110" rx="8" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="56" y="228" font-family="sans-serif" font-size="19" fill="#2b3a42" font-weight="bold">Coherence</text>
  <text x="56" y="254" font-family="sans-serif" font-size="15" fill="#222222">Fits the wider web of established knowledge.</text>
  <text x="56" y="278" font-family="sans-serif" font-size="15" fill="#4f6d7a">Ask: does it build on what we know, or break it?</text>

  <!-- Falsifiability card -->
  <rect x="36" y="322" width="440" height="110" rx="8" fill="none" stroke="#e0a458" stroke-width="3"/>
  <text x="56" y="354" font-family="sans-serif" font-size="19" fill="#2b3a42" font-weight="bold">Falsifiability</text>
  <text x="56" y="380" font-family="sans-serif" font-size="15" fill="#222222">Some possible observation could show it wrong.</text>
  <text x="56" y="404" font-family="sans-serif" font-size="15" fill="#4f6d7a">Ask: what would make me give this up?</text>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42" font-weight="bold">A correlation is a pattern — not yet a cause.</text>
  <text x="256" y="494" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Ice cream and drowning rise together; one does not cause the other.</text>
</svg>
