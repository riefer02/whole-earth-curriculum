<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Rebuilding and what justice requires</title>
  <desc id="desc">Four interlocking circles labeled truth, accountability, repair, and remembrance meet around a center labeled "rebuilding." Below, a note reads "justice is not one act but four things held together." Grayscale-printable.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222222" font-weight="bold">After atrocity: what justice requires</text>
  <!-- Four circles -->
  <g>
    <circle cx="160" cy="160" r="74" fill="#6b93b6" opacity="0.35" stroke="#2b3a42" stroke-width="2"/>
    <text x="160" y="156" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222" font-weight="bold">TRUTH</text>
    <text x="160" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">testimony · records</text>
    <circle cx="352" cy="160" r="74" fill="#7a9e7e" opacity="0.35" stroke="#2b3a42" stroke-width="2"/>
    <text x="352" y="156" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222" font-weight="bold">ACCOUNTABILITY</text>
    <text x="352" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">courts · law</text>
    <circle cx="160" cy="292" r="74" fill="#e0a458" opacity="0.35" stroke="#2b3a42" stroke-width="2"/>
    <text x="160" y="288" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222" font-weight="bold">REPAIR</text>
    <text x="160" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">reparations · care</text>
    <circle cx="352" cy="292" r="74" fill="#4f6d7a" opacity="0.30" stroke="#2b3a42" stroke-width="2"/>
    <text x="352" y="288" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222" font-weight="bold">REMEMBRANCE</text>
    <text x="352" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">memorials · teaching</text>
  </g>
  <!-- Center -->
  <circle cx="256" cy="226" r="40" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="222" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">REBUILD-</text>
  <text x="256" y="240" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222" font-weight="bold">ING</text>
  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Justice is not one act but four things held together —</text>
  <text x="256" y="442" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">each with its own reach, and each with its own limits.</text>
</svg>
