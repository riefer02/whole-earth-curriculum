<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">The nitrogen cycle and the human fertilizer input</title>
  <desc id="d">A loop of labeled steps: fixation turns air nitrogen into usable form, plants and animals use it, decomposition returns it to soil, and denitrification returns it to the air. A dashed arrow labeled "synthetic fertilizer" adds far more reactive nitrogen than natural fixation. Labels carry the meaning.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#222222">The nitrogen cycle</text>

  <!-- air nitrogen -->
  <rect x="176" y="56" width="160" height="52" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">AIR (N₂)</text>
  <text x="256" y="98" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">unusable by most life</text>

  <!-- fixation -->
  <rect x="176" y="150" width="160" height="52" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">FIXATION</text>
  <text x="256" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">made usable by bacteria, lightning</text>

  <!-- plants/animals -->
  <rect x="176" y="244" width="160" height="52" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="266" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">LIFE USES IT</text>
  <text x="256" y="286" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">plants, then animals</text>

  <!-- decomposition -->
  <rect x="176" y="338" width="160" height="52" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">DECOMPOSE</text>
  <text x="256" y="380" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">returns it to soil</text>

  <!-- denitrification back up -->
  <line x1="308" y1="364" x2="372" y2="82" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="372,82 366,92 380,92" fill="#2b3a42"/>
  <text x="392" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">denitrify</text>

  <!-- loop arrows down -->
  <line x1="256" y1="108" x2="256" y2="146" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="256,146 250,136 262,136" fill="#2b3a42"/>
  <line x1="256" y1="202" x2="256" y2="240" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="256,240 250,230 262,230" fill="#2b3a42"/>
  <line x1="256" y1="296" x2="256" y2="334" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="256,334 250,324 262,324" fill="#2b3a42"/>

  <!-- human input -->
  <rect x="20" y="244" width="120" height="70" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="80" y="270" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">HUMANS ADD</text>
  <text x="80" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">synthetic</text>
  <text x="80" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">fertilizer</text>
  <line x1="140" y1="279" x2="172" y2="270" stroke="#2b3a42" stroke-width="2.5"/>
  <polygon points="172,270 162,264 162,278" fill="#2b3a42"/>

  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">Extra nitrogen runs off into water and air,</text>
  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">where it can harm rivers, lakes, and climate.</text>
</svg>
