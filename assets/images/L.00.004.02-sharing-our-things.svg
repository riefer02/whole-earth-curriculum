<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Sharing our things: splitting one pile into two fair shares</title>
  <desc id="desc">Two children sit at a low table with a pile of blocks split into two equal piles, one on each side. One child pushes a few blocks toward the other, whose hands are open to receive them. Small labels read "one for me" and "one for you." The two children have different skin tones and hair. The equal piles and the labels, not color, show what fair sharing means, so the picture prints clearly in grayscale and teaches that sharing is dividing what we have so everyone has enough.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Title -->
  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Sharing Our Things</text>

  <!-- Table -->
  <rect x="60" y="270" width="392" height="20" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="78" y1="290" x2="78" y2="372" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  <line x1="434" y1="290" x2="434" y2="372" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>

  <!-- ===== Left child ===== -->
  <g>
    <circle cx="150" cy="200" r="22" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M128 198 A22 22 0 0 1 172 198 Z" fill="#2b3a42"/>
    <circle cx="142" cy="200" r="2.2" fill="#2b3a42"/>
    <circle cx="158" cy="200" r="2.2" fill="#2b3a42"/>
    <path d="M142 210 Q150 216 158 210" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="132" y="226" width="36" height="52" rx="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="132" y1="240" x2="196" y2="258" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="150" y="430" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">one for me</text>

  <!-- ===== Right child ===== -->
  <g>
    <circle cx="362" cy="200" r="22" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M340 198 A22 22 0 0 1 384 198 Z" fill="#4f6d7a"/>
    <circle cx="354" cy="200" r="2.2" fill="#2b3a42"/>
    <circle cx="370" cy="200" r="2.2" fill="#2b3a42"/>
    <path d="M354 210 Q362 216 370 210" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="344" y="226" width="36" height="52" rx="12" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="380" y1="240" x2="316" y2="258" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="362" y="430" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">one for you</text>

  <!-- ===== Piles of blocks on the table ===== -->
  <!-- left pile -->
  <rect x="176" y="236" width="34" height="34" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <rect x="186" y="222" width="34" height="34" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="170" y="224" width="24" height="24" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <!-- right pile -->
  <rect x="302" y="236" width="34" height="34" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="292" y="222" width="34" height="34" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <rect x="318" y="224" width="24" height="24" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>

  <!-- Equal sign between piles -->
  <text x="256" y="252" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">=</text>

  <!-- Bottom note -->
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">When we share, everyone has enough.</text>
</svg>
