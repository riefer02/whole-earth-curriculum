<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-12-005-13-margin-of-error desc-L-12-005-13-margin-of-error">
  <title id="title-L-12-005-13-margin-of-error">Inference from Samples: Margin of Error and Confidence</title>
  <desc id="desc-L-12-005-13-margin-of-error">A population shown as a field of dots, with a sample circled among them. Below, a confidence interval bar with a point estimate in the middle and error bars extending to 51% and 57%, labeled 54% plus or minus 3%, with a note that a bigger sample narrows the interval.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42" font-weight="bold">A Sample Estimates the Whole, With Honest Uncertainty</text>

  <!-- population of dots -->
  <g fill="#4f6d7a">
    <circle cx="40" cy="68" r="5"/><circle cx="70" cy="68" r="5"/><circle cx="100" cy="68" r="5"/><circle cx="130" cy="68" r="5"/><circle cx="160" cy="68" r="5"/><circle cx="190" cy="68" r="5"/><circle cx="220" cy="68" r="5"/><circle cx="250" cy="68" r="5"/><circle cx="280" cy="68" r="5"/><circle cx="310" cy="68" r="5"/><circle cx="340" cy="68" r="5"/><circle cx="370" cy="68" r="5"/><circle cx="400" cy="68" r="5"/><circle cx="430" cy="68" r="5"/><circle cx="460" cy="68" r="5"/>
    <circle cx="40" cy="100" r="5"/><circle cx="70" cy="100" r="5"/><circle cx="100" cy="100" r="5"/><circle cx="130" cy="100" r="5"/><circle cx="160" cy="100" r="5"/><circle cx="190" cy="100" r="5"/><circle cx="220" cy="100" r="5"/><circle cx="250" cy="100" r="5"/><circle cx="280" cy="100" r="5"/><circle cx="310" cy="100" r="5"/><circle cx="340" cy="100" r="5"/><circle cx="370" cy="100" r="5"/><circle cx="400" cy="100" r="5"/><circle cx="430" cy="100" r="5"/><circle cx="460" cy="100" r="5"/>
  </g>
  <text x="256" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">population: everyone you want to know about</text>

  <!-- sample circle around some dots -->
  <ellipse cx="220" cy="84" rx="72" ry="36" fill="none" stroke="#e0a458" stroke-width="3"/>
  <line x1="292" y1="84" x2="322" y2="90" stroke="#7a4d16" stroke-width="2"/>
  <text x="328" y="96" font-family="sans-serif" font-size="14" fill="#7a4d16" font-weight="bold">sample</text>

  <!-- confidence interval bar -->
  <line x1="60" y1="250" x2="452" y2="250" stroke="#2b3a42" stroke-width="2"/>
  <text x="60" y="276" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">50%</text>
  <text x="452" y="276" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">58%</text>
  <!-- interval 51%..57% around 54% -->
  <line x1="177" y1="240" x2="333" y2="240" stroke="#6b93b6" stroke-width="6"/>
  <circle cx="256" cy="250" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="177" y="224" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">51%</text>
  <text x="333" y="224" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">57%</text>
  <text x="256" y="204" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">54% &#177; 3%  (margin of error)</text>

  <rect x="60" y="310" width="392" height="120" fill="#ffffff" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="256" y="338" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">n = 1000 &#8594; margin of error &#8776; 1/&#8730;1000 &#8776; 3%</text>
  <text x="256" y="362" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">confidence interval: 51% to 57% &#8212; the honest range</text>
  <text x="256" y="390" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#4f6d7a">"significant" = unlikely by chance &#8212; not "big" or "important."</text>

  <text x="256" y="472" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Random sampling reduces bias (S-242, S-250).</text>
</svg>
