<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Location and distance on a grid</title>
  <desc id="desc">A first-quadrant coordinate grid with two distance examples. First, points (1,2) and (4,2) are plotted on the same horizontal line, and the 3-unit horizontal distance between them is marked with a thick line and labeled 3 units. Second, points (3,1) and (3,5) are plotted on the same vertical line, and the 4-unit vertical distance is marked with a thick line and labeled 4 units. Labels and counts, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Location and Distance on a Grid</text>

  <g transform="translate(60, 60)">
    <line x1="0" y1="0" x2="0" y2="320" stroke="#2b3a42" stroke-width="3"/>
    <line x1="0" y1="320" x2="400" y2="320" stroke="#2b3a42" stroke-width="3"/>
    <g stroke="#d7d1c8" stroke-width="1">
      <line x1="80" y1="0" x2="80" y2="320"/><line x1="160" y1="0" x2="160" y2="320"/>
      <line x1="240" y1="0" x2="240" y2="320"/><line x1="320" y1="0" x2="320" y2="320"/><line x1="400" y1="0" x2="400" y2="320"/>
      <line x1="0" y1="256" x2="400" y2="256"/><line x1="0" y1="192" x2="400" y2="192"/>
      <line x1="0" y1="128" x2="400" y2="128"/><line x1="0" y1="64" x2="400" y2="64"/>
    </g>

    <text x="0" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">0</text>
    <text x="80" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">1</text>
    <text x="160" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">2</text>
    <text x="240" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">3</text>
    <text x="320" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">4</text>
    <text x="400" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">5</text>
    <text x="-14" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">0</text>
    <text x="-14" y="256" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">1</text>
    <text x="-14" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">2</text>
    <text x="-14" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">3</text>
    <text x="-14" y="64" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">4</text>
    <text x="-14" y="0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">5</text>

    <!-- horizontal distance (1,2) to (4,2) -->
    <line x1="80" y1="192" x2="320" y2="192" stroke="#7a9e7e" stroke-width="5"/>
    <circle cx="80" cy="192" r="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="320" cy="192" r="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="80" y="176" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">well (1,2)</text>
    <text x="320" y="176" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">gate (4,2)</text>
    <text x="200" y="214" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">3 units across</text>

    <!-- vertical distance (3,1) to (3,5) -->
    <line x1="240" y1="256" x2="240" y2="0" stroke="#6b93b6" stroke-width="5"/>
    <circle cx="240" cy="256" r="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="240" cy="0" r="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="258" y="262" text-anchor="start" font-family="sans-serif" font-size="13" fill="#222222">tree (3,1)</text>
    <text x="258" y="8" text-anchor="start" font-family="sans-serif" font-size="13" fill="#222222">bird (3,5)</text>
    <text x="222" y="128" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">4 units up</text>
  </g>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">same row (same y) → count across · same column (same x) → count up</text>
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">check with subtraction: 4 − 1 = 3, and 5 − 1 = 4</text>
</svg>
