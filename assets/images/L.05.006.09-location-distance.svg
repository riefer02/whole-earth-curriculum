<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-05-006-09-location-distance desc-L-05-006-09-location-distance">
  <title id="title-L-05-006-09-location-distance">Location and distance on a grid</title>
  <desc id="desc-L-05-006-09-location-distance">A first-quadrant coordinate grid with two distance examples. First, points (1,2) and (4,2) are plotted on the same horizontal line, and the 3-unit horizontal distance between them is marked with a thick line and labeled 3 units. Second, points (3,1) and (3,5) are plotted on the same vertical line, and the 4-unit vertical distance is marked with a thick line and labeled 4 units. Labels and counts, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Location and Distance on a Grid</text>

  <g>
    <line x1="60" y1="60" x2="60" y2="380" stroke="#2b3a42" stroke-width="3"/>
    <line x1="60" y1="380" x2="460" y2="380" stroke="#2b3a42" stroke-width="3"/>
    <g stroke="#d7d1c8" stroke-width="1">
      <line x1="140" y1="60" x2="140" y2="380"/><line x1="220" y1="60" x2="220" y2="380"/>
      <line x1="300" y1="60" x2="300" y2="380"/><line x1="380" y1="60" x2="380" y2="380"/><line x1="460" y1="60" x2="460" y2="380"/>
      <line x1="60" y1="316" x2="460" y2="316"/><line x1="60" y1="252" x2="460" y2="252"/>
      <line x1="60" y1="188" x2="460" y2="188"/><line x1="60" y1="124" x2="460" y2="124"/>
    </g>

    <text x="60" y="402" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">0</text>
    <text x="140" y="402" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">1</text>
    <text x="220" y="402" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">2</text>
    <text x="300" y="402" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">3</text>
    <text x="380" y="402" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">4</text>
    <text x="460" y="402" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">5</text>
    <text x="46" y="380" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">0</text>
    <text x="46" y="316" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">1</text>
    <text x="46" y="252" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">2</text>
    <text x="46" y="188" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">3</text>
    <text x="46" y="124" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">4</text>
    <text x="46" y="60" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">5</text>

    <!-- horizontal distance (1,2) to (4,2) -->
    <line x1="140" y1="252" x2="380" y2="252" stroke="#7a9e7e" stroke-width="5"/>
    <circle cx="140" cy="252" r="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="380" cy="252" r="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="140" y="236" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">well (1,2)</text>
    <text x="380" y="236" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">gate (4,2)</text>
    <text x="260" y="274" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">3 units across</text>

    <!-- vertical distance (3,1) to (3,5) -->
    <line x1="300" y1="316" x2="300" y2="60" stroke="#6b93b6" stroke-width="5"/>
    <circle cx="300" cy="316" r="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="300" cy="60" r="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="318" y="322" text-anchor="start" font-family="sans-serif" font-size="13" fill="#222222">tree (3,1)</text>
    <text x="318" y="68" text-anchor="start" font-family="sans-serif" font-size="13" fill="#222222">bird (3,5)</text>
    <text x="282" y="188" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">4 units up</text>
  </g>

  <text x="256" y="442.4" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">same row (same y) → count across · same column (same x) →</text>
  <text x="256" y="463.2" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">count up</text>
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">check with subtraction: 4 − 1 = 3, and 5 − 1 = 4</text>
</svg>
