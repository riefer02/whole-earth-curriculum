<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Tens and ones: three tens and four ones make thirty-four</title>
  <desc id="desc">Three bundles of ten sticks on the left, each wrapped with a band and labeled ten, twenty, thirty, and four single sticks on the right labeled ones. A line reads three tens and four ones make thirty-four.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">Tens and Ones</text>

  <!-- Bundle 1 -->
  <g>
    <rect x="40" y="86" width="14" height="180" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="58" y="86" width="14" height="180" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="76" y="86" width="14" height="180" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="94" y="86" width="14" height="180" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="112" y="86" width="14" height="180" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="130" y="86" width="14" height="180" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="148" y="86" width="14" height="180" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="166" y="86" width="14" height="180" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="184" y="86" width="14" height="180" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="202" y="86" width="14" height="180" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="52" y="120" width="152" height="16" fill="none" stroke="#4f6d7a" stroke-width="4"/>
    <text x="128" y="296" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#2b3a42">one ten</text>
  </g>

  <!-- Bundle 2 -->
  <g>
    <rect x="228" y="86" width="14" height="180" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="246" y="86" width="14" height="180" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="264" y="86" width="14" height="180" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="282" y="86" width="14" height="180" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="300" y="86" width="14" height="180" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="318" y="86" width="14" height="180" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="336" y="86" width="14" height="180" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="354" y="86" width="14" height="180" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="372" y="86" width="14" height="180" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="390" y="86" width="14" height="180" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="240" y="120" width="152" height="16" fill="none" stroke="#4f6d7a" stroke-width="4"/>
    <text x="316" y="296" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#2b3a42">two tens</text>
  </g>

  <!-- Bundle 3 -->
  <g>
    <rect x="416" y="86" width="14" height="180" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="434" y="86" width="14" height="180" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="452" y="86" width="14" height="180" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="470" y="86" width="14" height="180" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="488" y="86" width="14" height="180" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="428" y="120" width="60" height="16" fill="none" stroke="#4f6d7a" stroke-width="4"/>
    <text x="458" y="296" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#2b3a42">three tens</text>
  </g>

  <!-- Four ones -->
  <g>
    <rect x="60" y="360" width="18" height="90" rx="5" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="110" y="360" width="18" height="90" rx="5" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="160" y="360" width="18" height="90" rx="5" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="210" y="360" width="18" height="90" rx="5" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="135" y="478" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#2b3a42">four ones</text>
  </g>

  <text x="340" y="430" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">3 tens + 4 ones</text>
  <text x="340" y="470" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#e0a458">= 34</text>
</svg>
