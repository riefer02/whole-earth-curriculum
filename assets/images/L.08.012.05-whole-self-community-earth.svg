<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Whole self, caring community, living Earth, looking ahead</title>
  <desc id="desc">Three concentric rings. A whole person at the center, a ring of people forming a caring community around them, and a ring of land and water and sky for the living Earth around both, with an arrow pointing ahead to what comes next.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#2b3a42">All of Me, All of Us, All of Earth</text>

  <!-- outer earth ring -->
  <circle cx="256" cy="256" r="180" fill="#6b93b6" fill-opacity="0.22" stroke="#2b3a42" stroke-width="2"/>
  <!-- land + water hints -->
  <path d="M120 210 q60 -46 120 -20 q70 30 120 -10" fill="#7a9e7e" fill-opacity="0.6" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="256" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">the living Earth</text>

  <!-- community ring -->
  <circle cx="256" cy="256" r="112" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <!-- small figures around the community ring -->
  <g fill="#e0a458" stroke="#2b3a42" stroke-width="1.5">
    <circle cx="256" cy="150" r="10"/><rect x="247" y="161" width="18" height="24" rx="6"/>
  </g>
  <g fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5">
    <circle cx="168" cy="196" r="10"/><rect x="159" y="207" width="18" height="24" rx="6"/>
  </g>
  <g fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5">
    <circle cx="344" cy="196" r="10"/><rect x="335" y="207" width="18" height="24" rx="6"/>
  </g>
  <g fill="#d9b8a0" stroke="#2b3a42" stroke-width="1.5">
    <circle cx="168" cy="316" r="10"/><rect x="159" y="327" width="18" height="24" rx="6"/>
  </g>
  <g fill="#4f6d7a" stroke="#2b3a42" stroke-width="1.5">
    <circle cx="344" cy="316" r="10"/><rect x="335" y="327" width="18" height="24" rx="6"/>
  </g>
  <text x="256" y="390" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">the caring community</text>

  <!-- whole person center -->
  <circle cx="256" cy="256" r="46" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
  <g fill="#2b3a42">
    <circle cx="256" cy="244" r="11"/>
    <rect x="243" y="258" width="26" height="32" rx="9"/>
  </g>
  <text x="256" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">one whole self</text>

  <!-- arrow ahead -->
  <line x1="410" y1="420" x2="474" y2="420" stroke="#7a9e7e" stroke-width="4"/>
  <polygon points="482,420 466,412 466,428" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1"/>
  <text x="474" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7a9e7e">carry it forward</text>
</svg>
