<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Proving congruence with a rigid motion and coordinates</title>
  <desc id="desc">Two congruent triangles on a coordinate grid, one shaded amber and one shaded green, with an arrow showing a single translation (right 6, up 2) that maps the first triangle exactly onto the second, labeled with the distance-formula check (sides 4, 3, 5).</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Proving Congruence</text>
  <text x="256" y="56" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">one rigid motion carries A exactly onto B</text>

  <!-- grid: 40 px per unit; x = 70 + 40·v, y = 400 − 40·v -->
  <g stroke="#4f6d7a" stroke-width="1" stroke-opacity="0.25">
    <line x1="70" y1="160" x2="70" y2="400"/>
    <line x1="110" y1="160" x2="110" y2="400"/>
    <line x1="150" y1="160" x2="150" y2="400"/>
    <line x1="190" y1="160" x2="190" y2="400"/>
    <line x1="230" y1="160" x2="230" y2="400"/>
    <line x1="270" y1="160" x2="270" y2="400"/>
    <line x1="310" y1="160" x2="310" y2="400"/>
    <line x1="350" y1="160" x2="350" y2="400"/>
    <line x1="390" y1="160" x2="390" y2="400"/>
    <line x1="430" y1="160" x2="430" y2="400"/>
    <line x1="470" y1="160" x2="470" y2="400"/>
    <line x1="70" y1="400" x2="470" y2="400"/>
    <line x1="70" y1="360" x2="470" y2="360"/>
    <line x1="70" y1="320" x2="470" y2="320"/>
    <line x1="70" y1="280" x2="470" y2="280"/>
    <line x1="70" y1="240" x2="470" y2="240"/>
    <line x1="70" y1="200" x2="470" y2="200"/>
    <line x1="70" y1="160" x2="470" y2="160"/>
  </g>

  <!-- axis labels -->
  <g font-family="sans-serif" font-size="12" fill="#4f6d7a">
    <text x="60" y="404" text-anchor="end">0</text>
    <text x="60" y="324" text-anchor="end">2</text>
    <text x="60" y="244" text-anchor="end">4</text>
    <text x="60" y="164" text-anchor="end">6</text>
    <text x="70" y="416" text-anchor="middle">0</text>
    <text x="150" y="416" text-anchor="middle">2</text>
    <text x="230" y="416" text-anchor="middle">4</text>
    <text x="310" y="416" text-anchor="middle">6</text>
    <text x="390" y="416" text-anchor="middle">8</text>
    <text x="470" y="416" text-anchor="middle">10</text>
  </g>

  <!-- triangle A: (0,0),(4,0),(0,3) -->
  <polygon points="70,400 230,400 70,280" fill="#e0a458" fill-opacity="0.55" stroke="#2b3a42" stroke-width="2"/>
  <text x="120" y="370" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">A</text>

  <!-- triangle B: (6,2),(10,2),(6,5) -->
  <polygon points="310,320 470,320 310,200" fill="#7a9e7e" fill-opacity="0.55" stroke="#2b3a42" stroke-width="2"/>
  <text x="372" y="290" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">B</text>

  <!-- translation arrow: (0,3) -> (6,5) = right 6, up 2 -->
  <line x1="70" y1="280" x2="302" y2="203" stroke="#7a9e7e" stroke-width="3"/>
  <polygon points="310,200 299,209 297,196" fill="#7a9e7e"/>
  <text x="190" y="230" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">translate (6, 2)</text>

  <!-- legend -->
  <rect x="30" y="428" width="452" height="74" rx="10" fill="#ffffff" stroke="#4f6d7a" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="44" y="450" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Two ways to prove congruence:</text>
  <text x="44" y="472" font-family="sans-serif" font-size="13" fill="#222222">· a single translation (6, 2) maps A onto B — (0,0)→(6,2), (4,0)→(10,2), (0,3)→(6,5), or</text>
  <text x="44" y="494" font-family="sans-serif" font-size="13" fill="#222222">· the distance formula shows each matching side is equal (4, 3, 5).</text>
</svg>
