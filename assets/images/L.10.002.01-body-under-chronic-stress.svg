<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-10-002-01-body-under-chronic-stress desc-L-10-002-01-body-under-chronic-stress">
  <title id="title-L-10-002-01-body-under-chronic-stress">The body under chronic stress: acute alarm vs. chronic wear-and-tear</title>
  <desc id="desc-L-10-002-01-body-under-chronic-stress">A two-panel diagram. Left panel shows the acute alarm: a figure with a fast heart and quick breath, ready to act. Right panel shows chronic wear-and-tear: the same figure with a clouded head, a knotted stomach, and poor sleep. An arrow between them points from the alarm to the wear-and-tear.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">The Stress Response</text>

  <!-- Left panel: acute alarm -->
  <rect x="26" y="66" width="222" height="400" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <text x="137" y="96" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Acute alarm</text>
  <text x="137" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">(useful, then it turns off)</text>

  <!-- figure: soft silhouette -->
  <g fill="#f0d3b4">
    <circle cx="137" cy="176" r="24"/>
    <rect x="129" y="194" width="16" height="12" rx="6"/>
    <rect x="115" y="202" width="44" height="88" rx="19"/>
    <line x1="119" y1="214" x2="104" y2="272" stroke="#f0d3b4" stroke-width="12" stroke-linecap="round"/>
    <line x1="155" y1="214" x2="170" y2="272" stroke="#f0d3b4" stroke-width="12" stroke-linecap="round"/>
    <line x1="127" y1="292" x2="123" y2="342" stroke="#f0d3b4" stroke-width="16" stroke-linecap="round"/>
    <line x1="147" y1="292" x2="151" y2="342" stroke="#f0d3b4" stroke-width="16" stroke-linecap="round"/>
  </g>
  <!-- face: alert -->
  <circle cx="130" cy="172" r="2.5" fill="#2b3a42"/>
  <circle cx="144" cy="172" r="2.5" fill="#2b3a42"/>
  <path d="M130 184 Q137 189 144 184" fill="none" stroke="#2b3a42" stroke-width="1.6" stroke-linecap="round"/>
  <!-- fast heart, drawn on the chest -->
  <path d="M137 226 C132 232 144 240 137 247 C130 240 142 232 137 226 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="1.6"/>

  <!-- legend: icon and words together, so nothing floats -->
  <path d="M64 356 C59 362 71 370 64 377 C57 370 69 362 64 356 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="1.6"/>
  <text x="80" y="372" font-family="sans-serif" font-size="14" fill="#222222">fast heart</text>
  <path d="M56 394 Q62 390 68 394 Q74 398 80 394" fill="none" stroke="#6b93b6" stroke-width="2" stroke-linecap="round"/>
  <path d="M56 404 Q62 400 68 404 Q74 408 80 404" fill="none" stroke="#6b93b6" stroke-width="2" stroke-linecap="round"/>
  <text x="90" y="402" font-family="sans-serif" font-size="14" fill="#222222">quick breath</text>

  <text x="137" y="440" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">readies you to act</text>

  <!-- Arrow between panels -->
  <g>
    <path d="M252 266 L264 266" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <path d="M258 260 L264 266 L258 272" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right panel: chronic wear-and-tear -->
  <rect x="264" y="66" width="222" height="400" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <text x="375" y="96" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Chronic wear-and-tear</text>
  <text x="375" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">(the alarm never turns off)</text>

  <!-- figure: soft silhouette -->
  <g fill="#a9773f">
    <circle cx="375" cy="176" r="24"/>
    <rect x="367" y="194" width="16" height="12" rx="6"/>
    <rect x="353" y="202" width="44" height="88" rx="19"/>
    <line x1="357" y1="214" x2="342" y2="272" stroke="#a9773f" stroke-width="12" stroke-linecap="round"/>
    <line x1="393" y1="214" x2="408" y2="272" stroke="#a9773f" stroke-width="12" stroke-linecap="round"/>
    <line x1="365" y1="292" x2="361" y2="342" stroke="#a9773f" stroke-width="16" stroke-linecap="round"/>
    <line x1="385" y1="292" x2="389" y2="342" stroke="#a9773f" stroke-width="16" stroke-linecap="round"/>
  </g>
  <!-- face: tired -->
  <path d="M365 172 Q369 169 373 172 M377 172 Q381 169 385 172" fill="none" stroke="#2b3a42" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M368 186 Q375 181 382 186" fill="none" stroke="#2b3a42" stroke-width="1.6" stroke-linecap="round"/>

  <!-- cloud above head -->
  <ellipse cx="375" cy="142" rx="22" ry="10" fill="#ffffff" stroke="#6b93b6" stroke-width="2"/>
  <ellipse cx="368" cy="136" rx="11" ry="6" fill="#ffffff" stroke="#6b93b6" stroke-width="2"/>
  <ellipse cx="384" cy="136" rx="11" ry="6" fill="#ffffff" stroke="#6b93b6" stroke-width="2"/>

  <!-- knotted stomach, drawn on the belly -->
  <ellipse cx="375" cy="266" rx="14" ry="10" fill="none" stroke="#2b3a42" stroke-width="1.8"/>
  <path d="M368 259 Q375 272 382 259" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>

  <!-- legend: icon and words together -->
  <ellipse cx="310" cy="366" rx="12" ry="9" fill="none" stroke="#2b3a42" stroke-width="1.8"/>
  <path d="M304 359 Q310 371 316 359" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>
  <text x="330" y="372" font-family="sans-serif" font-size="14" fill="#222222">knotted stomach</text>

  <path d="M304 396 A13 13 0 1 1 317 412 A10 10 0 0 0 304 396 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.6"/>
  <text x="330" y="412" font-family="sans-serif" font-size="14" fill="#222222">poor sleep, low mood</text>

  <text x="375" y="440" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">the same alarm, still running</text>

  <text x="256" y="496" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">An alarm that never turns off becomes wear-and-tear.</text>
</svg>
