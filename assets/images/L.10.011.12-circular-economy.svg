<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t12 d12">
  <title id="t12">Linear and circular economies</title>
  <desc id="d12">A linear economy shown as a one-way arrow from take to make to use to waste, beside a circular economy shown as a closed loop with repair, reuse, and return.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="128" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">linear economy</text>
  <text x="384" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">circular economy</text>
  <g fill="#e0a458" stroke="#2b3a42" stroke-width="2">
    <rect x="56" y="70" width="60" height="44" rx="6"/>
    <rect x="96" y="150" width="60" height="44" rx="6"/>
    <rect x="96" y="230" width="60" height="44" rx="6"/>
    <rect x="56" y="310" width="60" height="44" rx="6"/>
  </g>
  <text x="86" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">take</text>
  <text x="126" y="178" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">make</text>
  <text x="126" y="258" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">use</text>
  <text x="86" y="338" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">waste</text>
  <g stroke="#2b3a42" stroke-width="3" fill="none">
    <path d="M120 92 h20"/>
    <path d="M140 92 v58"/>
    <path d="M126 172 l14 0"/>
    <path d="M126 194 v36"/>
    <path d="M126 252 l14 0"/>
    <path d="M126 274 v36"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="#2b3a42">
    <path d="M128 86 l12 6 l-12 6"/>
    <path d="M136 166 l12 6 l-12 6"/>
    <path d="M136 246 l12 6 l-12 6"/>
  </g>
  <circle cx="384" cy="210" r="120" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <g fill="#7a9e7e" stroke="#2b3a42" stroke-width="2">
    <rect x="360" y="96" width="48" height="40" rx="6"/>
    <rect x="290" y="250" width="48" height="40" rx="6"/>
    <rect x="430" y="250" width="48" height="40" rx="6"/>
    <rect x="360" y="300" width="48" height="40" rx="6"/>
  </g>
  <text x="384" y="122" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">make</text>
  <text x="314" y="276" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">use</text>
  <text x="454" y="276" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">repair</text>
  <text x="384" y="326" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">reuse</text>
  <g stroke="#2b3a42" stroke-width="3" fill="none">
    <path d="M384 330 a90 90 0 0 1 74 -58"/>
    <path d="M384 136 a90 90 0 0 1 -70 70"/>
    <path d="M314 260 a90 90 0 0 0 70 60"/>
    <path d="M458 260 a90 90 0 0 0 -46 30"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="#2b3a42">
    <path d="M452 148 l10 -4 l2 10"/>
    <path d="M322 198 l-4 10 l-10 -2"/>
    <path d="M382 338 l4 -10 l10 2"/>
  </g>
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">A line throws away; a loop keeps in use</text>
</svg>
