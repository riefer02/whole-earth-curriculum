<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A character changes across a story</title>
  <desc id="desc">Two panels side by side showing the same character at the start and end of a story. The left panel shows a proud figure standing tall with a crown, labeled "beginning: proud." The right panel shows the same figure seated and calm, labeled "end: content." An arrow between them is labeled "the change." Meaning is carried by labels and position, not color, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">A character changes</text>

  <!-- Left panel: proud -->
  <g>
    <rect x="30" y="80" width="196" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="128" y="108" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">beginning: proud</text>
    <circle cx="128" cy="168" r="30" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M116 162 Q124 158 132 162" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <path d="M124 162 Q128 158 132 162" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <path d="M118 180 Q128 192 138 180" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="128" y="198" width="52" height="90" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M114 206 L142 206 M114 224 L142 224" stroke="#2b3a42" stroke-width="2"/>
    <path d="M128 288 L120 330 M128 288 L136 330" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <!-- crown -->
    <path d="M108 142 L112 126 L122 136 L128 122 L134 136 L144 126 L148 142 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="128" y="362" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">stands tall, wishes for more</text>
  </g>

  <!-- Arrow -->
  <path d="M238 230 L274 230" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <path d="M264 222 L274 230 L264 238" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="214" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e0a458">the change</text>

  <!-- Right panel: content -->
  <g>
    <rect x="286" y="80" width="196" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="384" y="108" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">end: content</text>
    <circle cx="384" cy="168" r="30" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M374 166 Q378 163 382 166" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <path d="M386 166 Q390 163 394 166" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <path d="M374 180 Q384 192 394 180" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M366 224 Q384 240 402 224 L402 288 Q384 302 366 288 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M384 250 L384 288" stroke="#2b3a42" stroke-width="2"/>
    <text x="384" y="362" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">seated, calm, glad to be himself</text>
  </g>

  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">Find the evidence for the change.</text>
  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">What does the character do, say, and learn?</text>
</svg>
