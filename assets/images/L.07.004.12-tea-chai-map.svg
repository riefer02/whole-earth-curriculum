<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The two journeys of the word tea</title>
  <desc id="desc">A simple map with two winding routes. One route is labeled "by land: chai" and the other "by sea: tea/te". Both routes begin at a point labeled "cha" and spread outward, showing how one word became many forms. Meaning is carried by labels and route position, not color, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">The two journeys of "tea"</text>

  <!-- Origin -->
  <circle cx="256" cy="180" r="34" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="186" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">cha</text>

  <!-- Land route -->
  <path d="M256 214 C220 250 120 270 92 330" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <text x="150" y="286" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4f6d7a">by land</text>
  <circle cx="92" cy="340" r="30" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="92" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">chai</text>

  <!-- Sea route -->
  <path d="M256 214 C300 250 400 270 424 330" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <text x="360" y="286" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4f6d7a">by sea</text>
  <circle cx="424" cy="340" r="30" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="424" y="346" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">tea / te</text>

  <text x="256" y="404" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">One word, two routes, many forms.</text>
  <text x="256" y="434" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Words travel with trade, migration, and empire.</text>

  <text x="256" y="482" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">Translation: carrying a meaning from one language into another.</text>
</svg>
