<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The life cycle of a star</title>
  <desc id="desc">A sequence of five stages: a cloud of gas and dust, a shining star, a red giant, a supernova scattering elements, and new stars forming from the remains, with labels under each.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">The Life of a Star</text>

  <!-- stage 1: nebula -->
  <g>
    <ellipse cx="70" cy="170" rx="46" ry="30" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="58" cy="166" r="5" fill="#4f6d7a"/>
    <circle cx="82" cy="172" r="5" fill="#4f6d7a"/>
    <circle cx="70" cy="160" r="4" fill="#4f6d7a"/>
    <text x="70" y="226" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">nebula</text>
    <text x="70" y="243" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">gas &amp; dust</text>
  </g>

  <!-- arrow -->
  <path d="M120 170 L142 170" fill="none" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#sarr)"/>
  <defs>
    <marker id="sarr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 Z" fill="#2b3a42"/>
    </marker>
  </defs>

  <!-- stage 2: main-sequence star -->
  <g>
    <circle cx="188" cy="170" r="30" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M188 132 L188 146 M188 194 L188 208 M150 170 L164 170 M212 170 L226 170" stroke="#e0a458" stroke-width="4" stroke-linecap="round"/>
    <text x="188" y="226" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">shining star</text>
    <text x="188" y="243" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">fusion: H → He</text>
  </g>

  <!-- arrow -->
  <path d="M222 170 L244 170" fill="none" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#sarr)"/>

  <!-- stage 3: red giant -->
  <g>
    <circle cx="300" cy="170" r="46" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5" fill-opacity="0.75"/>
    <circle cx="300" cy="170" r="34" fill="none" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="300" y="226" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">red giant</text>
    <text x="300" y="243" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">swells as it ages</text>
  </g>

  <!-- arrow -->
  <path d="M350 170 L372 170" fill="none" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#sarr)"/>

  <!-- stage 4: supernova -->
  <g>
    <path d="M412 170 L384 152 L398 170 L384 188 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M412 170 L430 148 M412 170 L434 170 M412 170 L430 192" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
    <text x="412" y="226" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">supernova</text>
    <text x="412" y="243" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">forges heavy elements</text>
  </g>

  <!-- arrow -->
  <path d="M460 170 L478 170" fill="none" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#sarr)"/>

  <!-- stage 5: new stars -->
  <g>
    <circle cx="484" cy="166" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="470" cy="180" r="6" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="477" y="226" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#222222">new stars</text>
  </g>

  <text x="256" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Stars forge the elements — the iron in your blood came from a star.</text>
  <text x="256" y="324" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">Our Sun is one of more than 100 billion stars in the Milky Way.</text>
  <text x="256" y="346" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">This is a model built from evidence — we see stars at every stage at once.</text>
</svg>
