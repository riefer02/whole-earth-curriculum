<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My Tradition, My Community: a tradition web</title>
  <desc id="desc">A tradition web. In the center, a small circle labeled "my tradition" holds a family sharing a meal, a glowing lantern, and a drum. Lines radiate outward to a larger circle labeled "the larger community" that shows a mosque, a church, a temple, a market stall, and a gathering of many hands. The connecting lines show how one family's tradition links to a whole community. People vary in skin tone and dress, and one figure uses a cane.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">My Tradition, My Community</text>

  <!-- radiating threads -->
  <path d="M160 190 L70 96" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-dasharray="5 5"/>
  <path d="M300 130 L430 70" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-dasharray="5 5"/>
  <path d="M350 240 L446 210" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-dasharray="5 5"/>
  <path d="M160 300 L70 380" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-dasharray="5 5"/>
  <path d="M300 360 L400 430" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-dasharray="5 5"/>
  <path d="M130 250 L40 250" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-dasharray="5 5"/>

  <!-- center tradition circle -->
  <circle cx="250" cy="245" r="78" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="250" y="160" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">my tradition</text>
  <!-- family at a meal -->
  <circle cx="218" cy="212" r="13" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="250" cy="206" r="13" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="282" cy="212" r="13" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <rect x="206" y="238" width="88" height="10" rx="3" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <!-- lantern -->
  <rect x="246" y="258" width="10" height="14" rx="2" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="251" cy="276" r="4" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <!-- drum -->
  <rect x="210" y="262" width="20" height="14" rx="3" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>

  <!-- outer community ring -->
  <circle cx="250" cy="245" r="150" fill="none" stroke="#7a9e7e" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="250" y="450" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">the larger community</text>

  <!-- mosque -->
  <g>
    <rect x="40" y="76" width="34" height="22" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M44 76 l13 -14 13 14" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="52" y="86" width="6" height="12" fill="#2b3a42" opacity="0.5"/>
  </g>
  <!-- church -->
  <g>
    <rect x="404" y="52" width="30" height="20" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M404 52 l15 -12 15 12" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="416" y="34" width="4" height="12" fill="#2b3a42" opacity="0.5"/>
  </g>
  <!-- temple -->
  <g>
    <rect x="414" y="196" width="34" height="20" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M414 196 l17 -14 17 14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <!-- market -->
  <g>
    <path d="M52 352 L86 352" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <path d="M40 368 l26 -16 26 16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="56" cy="356" r="4" fill="#7a9e7e"/>
    <circle cx="74" cy="356" r="4" fill="#e0a458"/>
  </g>
  <!-- many hands -->
  <g>
    <path d="M382 410 q6 -4 14 0 q4 6 0 12" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M404 408 q6 -4 14 0 q4 6 0 12" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M393 404 q6 -4 14 0" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- figure with cane on the left -->
  <g>
    <circle cx="96" cy="236" r="11" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M96 248 v22" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M96 260 l12 10 M96 258 l-10 10" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M106 250 l10 26" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
