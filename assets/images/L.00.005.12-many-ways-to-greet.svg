<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Many ways to greet</title>
  <desc id="desc">Four people show four ways to greet: the first waves with an open hand, the second bows forward, the third places a hand on their heart, and the fourth presses both palms together. Each figure has a different skin tone and hair, and each is labeled: "a wave", "a bow", "hand on heart", "palms together". Below, four small cards show the word for a greeting in different languages — Hello (English), Привет (Russian), 你好 (Chinese), and 안녕 (Korean) — to show that every language says welcome in its own way. The labels and gestures carry the meaning, so the picture prints clearly in grayscale and teaches that a greeting is both a word and a body gesture, and every greeting is honored equally.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Many Ways to Greet</text>

  <line x1="48" y1="268" x2="464" y2="268" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>

  <!-- Figure 1: wave -->
  <g>
    <circle cx="82" cy="188" r="17" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M65 186 A17 17 0 0 1 99 186 Z" fill="#2b3a42"/>
    <circle cx="76" cy="188" r="1.8" fill="#2b3a42"/>
    <circle cx="88" cy="188" r="1.8" fill="#2b3a42"/>
    <path d="M76 197 Q82 202 88 197" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="68" y="206" width="28" height="38" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="74" y1="244" x2="72" y2="266" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="90" y1="244" x2="92" y2="266" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="68" y1="214" x2="48" y2="224" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="96" y1="214" x2="112" y2="182" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <path d="M104 172 L108 160 M96 160 L100 148 M112 152 L118 144 M120 164 L132 158" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <circle cx="118" cy="180" r="8" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="82" y="292" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">a wave</text>

  <!-- Figure 2: bow -->
  <g>
    <circle cx="210" cy="178" r="17" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M193 176 A17 17 0 0 1 227 176 Z" fill="#4f6d7a"/>
    <circle cx="204" cy="178" r="1.8" fill="#2b3a42"/>
    <circle cx="216" cy="178" r="1.8" fill="#2b3a42"/>
    <path d="M204 187 Q210 192 216 187" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M198 198 L214 234 L204 240" fill="none" stroke="#2b3a42" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="210" y1="236" x2="208" y2="266" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="220" y1="232" x2="222" y2="266" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="200" y1="204" x2="182" y2="210" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="206" y="292" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">a bow</text>

  <!-- Figure 3: hand on heart -->
  <g>
    <circle cx="336" cy="188" r="17" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M319 186 A17 17 0 0 1 353 186 Z" fill="#2b3a42"/>
    <circle cx="330" cy="188" r="1.8" fill="#2b3a42"/>
    <circle cx="342" cy="188" r="1.8" fill="#2b3a42"/>
    <path d="M330 197 Q336 202 342 197" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="322" y="206" width="28" height="38" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="328" y1="244" x2="326" y2="266" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="344" y1="244" x2="346" y2="266" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="350" y1="214" x2="368" y2="228" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="322" y1="214" x2="312" y2="228" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="336" cy="222" rx="9" ry="7" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="336" y="292" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">hand on heart</text>

  <!-- Figure 4: palms together -->
  <g>
    <circle cx="438" cy="188" r="17" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M421 186 A17 17 0 0 1 455 186 Z" fill="#4f6d7a"/>
    <circle cx="432" cy="188" r="1.8" fill="#2b3a42"/>
    <circle cx="444" cy="188" r="1.8" fill="#2b3a42"/>
    <path d="M432 197 Q438 202 444 197" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="424" y="206" width="28" height="38" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="430" y1="244" x2="428" y2="266" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="446" y1="244" x2="448" y2="266" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="424" y1="214" x2="412" y2="230" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="452" y1="214" x2="464" y2="230" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="433" cy="230" rx="5" ry="12" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="443" cy="230" rx="5" ry="12" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="438" y="292" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">palms together</text>

  <!-- Greeting word cards -->
  <rect x="28" y="316" width="106" height="78" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="81" y="352" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">Hello</text>
  <text x="81" y="378" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">English</text>

  <rect x="142" y="316" width="106" height="78" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="195" y="352" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans', 'Arial Unicode MS', sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">Привет</text>
  <text x="195" y="378" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Russian</text>

  <rect x="256" y="316" width="106" height="78" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="309" y="352" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans', 'Arial Unicode MS', sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">你好</text>
  <text x="309" y="378" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Chinese</text>

  <rect x="370" y="316" width="106" height="78" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="423" y="352" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans', 'Arial Unicode MS', sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">안녕</text>
  <text x="423" y="378" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Korean</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Every language says "welcome" in its own beautiful way.</text>
</svg>
