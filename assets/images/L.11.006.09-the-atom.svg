<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The Atom</title>
  <desc id="desc">A labeled diagram of an atom. A central nucleus holds protons labeled positive and neutrons labeled neutral, with electrons labeled negative shown as small dots on shells around it. An inset shows matter is mostly empty space.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">The Atom</text>

  <!-- Electron shells -->
  <ellipse cx="230" cy="180" rx="150" ry="56" fill="none" stroke="#4f6d7a" stroke-width="2"/>
  <ellipse cx="230" cy="180" rx="100" ry="110" fill="none" stroke="#4f6d7a" stroke-width="2"/>

  <!-- Nucleus -->
  <circle cx="230" cy="180" r="38" fill="#e0a458" fill-opacity="0.5" stroke="#2b3a42" stroke-width="2.5"/>
  <circle cx="216" cy="168" r="11" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="216" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222" font-weight="bold">+</text>
  <circle cx="244" cy="170" r="11" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="244" y="174" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222" font-weight="bold">+</text>
  <circle cx="230" cy="192" r="11" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  <!-- Electrons -->
  <circle cx="230" cy="124" r="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="230" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4f6d7a">e⁻</text>
  <circle cx="130" cy="200" r="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
  <circle cx="330" cy="200" r="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
  <circle cx="130" cy="260" r="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>

  <!-- Labels -->
  <text x="230" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">nucleus: protons (+) and neutrons</text>
  <text x="230" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222" font-weight="bold">electrons (−) on shells around it</text>

  <!-- Inset: mostly empty space -->
  <rect x="40" y="380" width="432" height="100" fill="#ffffff" stroke="#e0a458" stroke-width="2" rx="6"/>
  <circle cx="96" cy="430" r="10" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="130" y="414" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">If the nucleus were a pea,</text>
  <text x="130" y="432" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">the electrons would be</text>
  <text x="130" y="450" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">far beyond the edges here.</text>
  <text x="256" y="418" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a" font-weight="bold">Matter is mostly</text>
  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a" font-weight="bold">empty space.</text>
</svg>
