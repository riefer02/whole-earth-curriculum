<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">All about me: a self-portrait template</title>
  <desc id="desc">A simple "All About Me" page. On the left, a frame labeled "draw me" holds a faint dashed oval and shoulders as a guide for drawing a self-portrait. On the right, four fill-in lines: "My name," "One feeling I know," "Something that makes me me," and "A group I belong to." The dashed writing lines and labels carry the meaning, so it prints clearly in grayscale.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">All About Me</text>

  <!-- Portrait frame -->
  <rect x="16" y="84" width="240" height="280" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <text x="136" y="116" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">draw me</text>
  <ellipse cx="136" cy="216" rx="50" ry="60" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-dasharray="5 6" stroke-opacity="0.7"/>
  <path d="M76 304 Q136 338 196 304" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-dasharray="5 6" stroke-opacity="0.7"/>

  <!-- Fill-in lines (right column) -->
  <text x="272" y="132" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">My name</text>
  <line x1="272" y1="150" x2="496" y2="150" stroke="#4f6d7a" stroke-width="2.5" stroke-dasharray="6 6"/>

  <text x="272" y="207" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">One feeling I know</text>
  <line x1="272" y1="225" x2="496" y2="225" stroke="#4f6d7a" stroke-width="2.5" stroke-dasharray="6 6"/>

  <text x="272" y="282" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Something that makes me me</text>
  <line x1="272" y1="300" x2="496" y2="300" stroke="#4f6d7a" stroke-width="2.5" stroke-dasharray="6 6"/>

  <text x="272" y="357" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">A group I belong to</text>
  <line x1="272" y1="375" x2="496" y2="375" stroke="#4f6d7a" stroke-width="2.5" stroke-dasharray="6 6"/>

  <!-- Bottom note -->
  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">This is me, all together.</text>
</svg>
