<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">One integrated self across contexts</title>
  <desc id="d">A figure labeled 'me' holds three labeled threads — who I am, what I value, how I will act — shown as a solid, a dashed, and a dotted line that run unbroken down to a row of four labeled context rooms: family, friends, community, online. Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42">One self, many rooms</text>

  <!-- legend: the three threads -->
  <line x1="66" y1="78" x2="140" y2="78" stroke="#2b3a42" stroke-width="3"/>
  <text x="150" y="83" font-family="sans-serif" font-size="14" fill="#222222">who I am</text>
  <line x1="66" y1="110" x2="140" y2="110" stroke="#2b3a42" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="150" y="115" font-family="sans-serif" font-size="14" fill="#222222">what I value</text>
  <line x1="66" y1="142" x2="140" y2="142" stroke="#2b3a42" stroke-width="3" stroke-dasharray="2 6"/>
  <text x="150" y="147" font-family="sans-serif" font-size="14" fill="#222222">how I will act</text>

  <!-- the three threads running down from the figure through the contexts -->
  <path d="M256 296 V425" stroke="#2b3a42" stroke-width="3" fill="none"/>
  <path d="M236 296 V425" stroke="#4f6d7a" stroke-width="3" stroke-dasharray="10 7" fill="none"/>
  <path d="M276 296 V425" stroke="#4f6d7a" stroke-width="3" stroke-dasharray="2 6" fill="none"/>

  <!-- figure labeled me -->
  <circle cx="256" cy="238" r="28" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <path d="M222 320 Q256 288 290 320" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="198" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">me</text>

  <!-- the four context rooms -->
  <rect x="34" y="430" width="100" height="54" rx="8" fill="#ffffff" stroke="#6b93b6" stroke-width="2.5"/>
  <text x="84" y="462" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">family</text>
  <rect x="146" y="430" width="100" height="54" rx="8" fill="#ffffff" stroke="#6b93b6" stroke-width="2.5"/>
  <text x="196" y="462" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">friends</text>
  <rect x="258" y="430" width="100" height="54" rx="8" fill="#ffffff" stroke="#6b93b6" stroke-width="2.5"/>
  <text x="308" y="462" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">community</text>
  <rect x="370" y="430" width="100" height="54" rx="8" fill="#ffffff" stroke="#6b93b6" stroke-width="2.5"/>
  <text x="420" y="462" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">online</text>

  <text x="256" y="504" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">the same you, unbroken, in every room</text>
</svg>
