<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 300" role="img" aria-labelledby="title desc">
  <title id="title">A piece has a beginning, a middle, and an end</title>
  <desc id="desc">A three-box diagram titled "A piece has a beginning, a middle, and an end." The left box, labeled "beginning (idea introduced)," shows three note shapes in a short repeated pattern. The middle box, labeled "middle (contrast — something new)," shows a different rhythm of note shapes, marked "new rhythm, higher or faster." The right box, labeled "end (return home)," shows the first pattern again, marked "back to the beginning." An arc above the boxes is labeled "A — B — A." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="300" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">A Piece Has a Beginning, a Middle, and an End</text>

  <!-- A-B-A arc -->
  <path d="M70 120 Q256 40 442 120" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="256" y="62" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">A — B — A</text>

  <!-- Box A: beginning -->
  <rect x="24" y="110" width="140" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="94" y="136" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">beginning</text>
  <text x="94" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">idea introduced</text>
  <g fill="#2b3a42">
    <ellipse cx="56" cy="190" rx="9" ry="7"/><line x1="65" y1="190" x2="65" y2="160" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="94" cy="190" rx="9" ry="7"/><line x1="103" y1="190" x2="103" y2="160" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="132" cy="190" rx="9" ry="7"/><line x1="141" y1="190" x2="141" y2="160" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="56" cy="226" rx="9" ry="7"/><line x1="65" y1="226" x2="65" y2="196" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="94" cy="226" rx="9" ry="7"/><line x1="103" y1="226" x2="103" y2="196" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="132" cy="226" rx="9" ry="7"/><line x1="141" y1="226" x2="141" y2="196" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- Box B: middle -->
  <rect x="186" y="110" width="140" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="136" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">middle</text>
  <text x="256" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">contrast — something new</text>
  <g fill="#2b3a42">
    <ellipse cx="216" cy="192" rx="8" ry="6"/><line x1="224" y1="192" x2="224" y2="168" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="240" cy="196" rx="8" ry="6"/><line x1="248" y1="196" x2="248" y2="170" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="264" cy="200" rx="8" ry="6"/><line x1="272" y1="200" x2="272" y2="172" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="288" cy="196" rx="8" ry="6"/><line x1="296" y1="196" x2="296" y2="170" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="312" cy="192" rx="8" ry="6"/><line x1="320" y1="192" x2="320" y2="168" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="256" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">new rhythm, higher or faster</text>

  <!-- Box A: end -->
  <rect x="348" y="110" width="140" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="418" y="136" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">end</text>
  <text x="418" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">return home</text>
  <g fill="#2b3a42">
    <ellipse cx="380" cy="190" rx="9" ry="7"/><line x1="389" y1="190" x2="389" y2="160" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="418" cy="190" rx="9" ry="7"/><line x1="427" y1="190" x2="427" y2="160" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="456" cy="190" rx="9" ry="7"/><line x1="465" y1="190" x2="465" y2="160" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="380" cy="226" rx="9" ry="7"/><line x1="389" y1="226" x2="389" y2="196" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="418" cy="226" rx="9" ry="7"/><line x1="427" y1="226" x2="427" y2="196" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="456" cy="226" rx="9" ry="7"/><line x1="465" y1="226" x2="465" y2="196" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="418" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">back to the beginning</text>
</svg>
