<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Team step sequence</title>
  <desc id="desc">Four diverse figures standing in a line, mid-step, each labeled with the move they added to a shared eight-count sequence. Below, eight boxes labeled counts 1 through 8 show the four counts of the traveling step followed by four added moves. A caption reads "One sequence, four contributions — a cooperative game." Labels, not color alone, carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">One Sequence, Four Contributions</text>

  <!-- Four figures in a line -->
  <g stroke="#2b3a42" stroke-width="2" fill="#ffffff">
    <!-- Figure 1 -->
    <circle cx="84" cy="92" r="17"/>
    <rect x="68" y="109" width="32" height="42" rx="11"/>
    <line x1="84" y1="151" x2="70" y2="180" stroke-linecap="round"/>
    <line x1="84" y1="151" x2="98" y2="180" stroke-linecap="0"/>
    <text x="84" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a" stroke="none">clap</text>
    <!-- Figure 2 -->
    <circle cx="200" cy="92" r="17"/>
    <rect x="184" y="109" width="32" height="42" rx="11"/>
    <line x1="200" y1="151" x2="186" y2="180" stroke-linecap="round"/>
    <line x1="200" y1="151" x2="214" y2="180" stroke-linecap="round"/>
    <text x="200" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a" stroke="none">turn</text>
    <!-- Figure 3 -->
    <circle cx="316" cy="92" r="17"/>
    <rect x="300" y="109" width="32" height="42" rx="11"/>
    <line x1="316" y1="151" x2="302" y2="180" stroke-linecap="round"/>
    <line x1="316" y1="151" x2="330" y2="180" stroke-linecap="round"/>
    <text x="316" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a" stroke="none">reach</text>
    <!-- Figure 4 -->
    <circle cx="432" cy="92" r="17"/>
    <rect x="416" y="109" width="32" height="42" rx="11"/>
    <line x1="432" y1="151" x2="418" y2="180" stroke-linecap="round"/>
    <line x1="432" y1="151" x2="446" y2="180" stroke-linecap="round"/>
    <text x="432" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a" stroke="none">hop</text>
  </g>

  <!-- Eight count boxes -->
  <g font-family="sans-serif">
    <!-- 1-4 traveling step -->
    <rect x="26" y="220" width="106" height="70" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="79" y="246" text-anchor="middle" font-size="20" font-weight="bold" fill="#4f6d7a">1–4</text>
    <text x="79" y="270" text-anchor="middle" font-size="14" fill="#222222">traveling step</text>
    <!-- 5 clap -->
    <rect x="146" y="220" width="74" height="70" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="183" y="246" text-anchor="middle" font-size="20" font-weight="bold" fill="#4f6d7a">5</text>
    <text x="183" y="270" text-anchor="middle" font-size="14" fill="#222222">clap</text>
    <!-- 6 turn -->
    <rect x="234" y="220" width="74" height="70" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="271" y="246" text-anchor="middle" font-size="20" font-weight="bold" fill="#4f6d7a">6</text>
    <text x="271" y="270" text-anchor="middle" font-size="14" fill="#222222">turn</text>
    <!-- 7 reach -->
    <rect x="322" y="220" width="74" height="70" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="359" y="246" text-anchor="middle" font-size="20" font-weight="bold" fill="#4f6d7a">7</text>
    <text x="359" y="270" text-anchor="middle" font-size="14" fill="#222222">reach</text>
    <!-- 8 hop -->
    <rect x="410" y="220" width="74" height="70" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="447" y="246" text-anchor="middle" font-size="20" font-weight="bold" fill="#4f6d7a">8</text>
    <text x="447" y="270" text-anchor="middle" font-size="14" fill="#222222">hop</text>
  </g>

  <text x="256" y="344" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Every teammate adds one move — any move, seated or large.</text>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#2b3a42">One sequence, four contributions — a cooperative game.</text>
</svg>
