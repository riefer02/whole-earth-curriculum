<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The human story, and our part in it</title>
  <desc id="desc">A web diagram titled "One human story." At the center, a circle reads "people, power, and the human story." Eight threads connect outward to labeled circles: "sources," "change and continuity," "knowledge across generations," "technology and ideas," "place and environment," "plants, animals, and people on the move," "power — fair and unfair," and "movements for freedom." At the bottom, a figure stands with an open hand beside the note "and our part in it." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#2b3a42">One Human Story</text>

  <!-- center -->
  <circle cx="256" cy="224" r="62" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">people, power,</text>
  <text x="256" y="236" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">and the</text>
  <text x="256" y="256" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">human story</text>

  <!-- threads -->
  <line x1="256" y1="162" x2="88" y2="84" stroke="#4f6d7a" stroke-width="2"/>
  <line x1="256" y1="162" x2="256" y2="52" stroke="#4f6d7a" stroke-width="2"/>
  <line x1="256" y1="162" x2="424" y2="84" stroke="#4f6d7a" stroke-width="2"/>
  <line x1="194" y1="224" x2="60" y2="224" stroke="#4f6d7a" stroke-width="2"/>
  <line x1="318" y1="224" x2="452" y2="224" stroke="#4f6d7a" stroke-width="2"/>
  <line x1="256" y1="286" x2="88" y2="372" stroke="#4f6d7a" stroke-width="2"/>
  <line x1="256" y1="286" x2="256" y2="400" stroke="#4f6d7a" stroke-width="2"/>
  <line x1="256" y1="286" x2="424" y2="372" stroke="#4f6d7a" stroke-width="2"/>

  <!-- node labels -->
  <rect x="36" y="40" width="104" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="88" y="63" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">sources</text>

  <rect x="204" y="14" width="104" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="37" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">change &amp; continuity</text>

  <rect x="372" y="40" width="104" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="424" y="63" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">knowledge</text>

  <rect x="16" y="206" width="88" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="60" y="223" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">technology</text>
  <text x="60" y="236" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">&amp; ideas</text>

  <rect x="408" y="206" width="88" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="452" y="223" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">place &amp;</text>
  <text x="452" y="236" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">environment</text>

  <rect x="24" y="358" width="128" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="88" y="381" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">plants, animals,</text>
  <text x="88" y="392" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">people on the move</text>

  <rect x="204" y="404" width="104" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="427" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">power — fair &amp; unfair</text>

  <rect x="360" y="358" width="128" height="36" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="424" y="381" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">movements</text>
  <text x="424" y="392" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">for freedom</text>

  <!-- figure + note -->
  <circle cx="256" cy="470" r="12" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M256 482 L256 502" stroke="#2b3a42" stroke-width="2"/>
  <path d="M244 502 L256 482 L268 502" stroke="#2b3a42" stroke-width="2"/>
  <path d="M256 490 L244 478" stroke="#2b3a42" stroke-width="2"/>
  <path d="M256 490 L268 478" stroke="#2b3a42" stroke-width="2"/>
  <text x="290" y="492" font-family="sans-serif" font-size="14" fill="#2b3a42">and our part in it</text>
</svg>
