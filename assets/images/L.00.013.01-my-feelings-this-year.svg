    <rect x="392" y="82" width="106" height="148" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="416" cy="154" r="7" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="474" cy="154" r="7" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="445" cy="154" r="30" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="433" cy="146" r="5" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="457" cy="146" r="5" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="433" cy="146" r="2" fill="#2b3a42"/>
    <circle cx="457" cy="146" r="2" fill="#2b3a42"/>
    <path d="M428 136 Q433 130 438 136" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M452 136 Q457 130 462 136" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
