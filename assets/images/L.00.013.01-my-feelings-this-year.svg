    <path d="M150 304 L152 310 L158 312 L152 314 L150 320 L148 314 L142 312 L148 310 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="132" y="390" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">proud</text>
  </g>

