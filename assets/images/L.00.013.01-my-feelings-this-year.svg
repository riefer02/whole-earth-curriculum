    <path d="M394 296 L396 302 L402 304 L396 306 L394 312 L392 306 L386 304 L392 302 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="380" y="390" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">excited</text>
