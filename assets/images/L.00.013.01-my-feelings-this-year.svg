  <g>
    <rect x="203" y="256" width="106" height="148" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="227" cy="328" r="7" fill="#d9a97f" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="285" cy="328" r="7" fill="#d9a97f" stroke="#2b3a42" stroke-width="2"/>
    <path d="M278 323 A7 7 0 0 1 292 323" fill="none" stroke="#e0a458" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M285 324 L291 331" fill="none" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
    <circle cx="291" cy="331" r="2.6" fill="#e0a458"/>
    <circle cx="256" cy="328" r="30" fill="#d9a97f" stroke="#2b3a42" stroke-width="2"/>
    <path d="M240 320 L248 320" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M264 320 L272 320" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M240 312 L248 308" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M264 308 L272 312" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="244" cy="326" rx="2.2" ry="3.4" fill="#6b93b6"/>
    <path d="M246 342 L266 342" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="256" y="390" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">lonely</text>
  </g>

  <!-- excited (deep skin, sparkles, big smile) -->
  <g>
    <rect x="327" y="256" width="106" height="148" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="351" cy="328" r="7" fill="#7c4f2e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="409" cy="328" r="7" fill="#7c4f2e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="380" cy="328" r="30" fill="#7c4f2e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="368" cy="320" r="4" fill="#2b3a42"/>
    <circle cx="392" cy="320" r="4" fill="#2b3a42"/>
    <circle cx="367" cy="319" r="1.3" fill="#ffffff"/>
