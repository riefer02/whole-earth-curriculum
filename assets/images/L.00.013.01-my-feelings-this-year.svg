<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My feelings this year: seven feeling faces</title>
  <desc id="desc">Seven round faces in two rows, each labeled with a feeling word: happy, sad, angry, scared, proud, lonely, and excited. The faces differ by eyebrow, eye, and mouth shape — not by color — so they print clearly in grayscale. Skin tones vary across the seven faces; one wears glasses and one wears a hearing aid. A caption says that every feeling is welcome and none is wrong.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">My Feelings This Year</text>
  <text x="256" y="62" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Every feeling is welcome &#8212; none is wrong.</text>

  <!-- ===== Row 1 ===== -->

  <!-- happy (light skin) -->
  <g>
    <rect x="14" y="82" width="106" height="148" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="38" cy="154" r="7" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="96" cy="154" r="7" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="67" cy="154" r="30" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="55" cy="146" r="3.5" fill="#2b3a42"/>
    <circle cx="79" cy="146" r="3.5" fill="#2b3a42"/>
    <path d="M51 138 Q55 134 59 138" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M75 138 Q79 134 83 138" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M53 166 Q67 178 81 166" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="67" y="216" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">happy</text>
  </g>

  <!-- sad (light-medium skin, tear) -->
  <g>
    <rect x="140" y="82" width="106" height="148" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="164" cy="154" r="7" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="222" cy="154" r="7" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="193" cy="154" r="30" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="181" cy="146" r="3.5" fill="#2b3a42"/>
    <circle cx="205" cy="146" r="3.5" fill="#2b3a42"/>
    <path d="M177 142 L185 138" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M201 138 L209 142" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="181" cy="152" rx="2.2" ry="3.4" fill="#6b93b6"/>
    <path d="M179 172 Q193 162 207 172" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="193" y="216" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">sad</text>
  </g>

  <!-- angry (medium skin) -->
  <g>
    <rect x="266" y="82" width="106" height="148" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="290" cy="154" r="7" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="348" cy="154" r="7" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="319" cy="154" r="30" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="307" cy="146" r="3.5" fill="#2b3a42"/>
