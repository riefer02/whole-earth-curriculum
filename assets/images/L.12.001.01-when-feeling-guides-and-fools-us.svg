<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Feeling as compass and fog</title>
  <desc id="d">Two panels. Left: a compass needle with the label "feeling informs — a compass." Right: a fog cloud over a bent arrow with the label "feeling biases — a fog." Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222222">Two faces of feeling</text>
  <!-- left panel: compass -->
  <rect x="32" y="70" width="210" height="360" rx="12" fill="#7a9e7e" opacity="0.25" stroke="#2b3a42" stroke-width="2"/>
  <text x="137" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222222">feeling informs</text>
  <circle cx="137" cy="210" r="70" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="137" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#2b3a42">N</text>
  <text x="137" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#2b3a42">S</text>
  <line x1="137" y1="222" x2="137" y2="162" stroke="#e0a458" stroke-width="5" stroke-linecap="round"/>
  <line x1="137" y1="222" x2="137" y2="254" stroke="#4f6d7a" stroke-width="5" stroke-linecap="round"/>
  <text x="137" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#222222">a compass — carries</text>
  <text x="137" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#222222">real, often bodily data</text>
  <text x="137" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6d7a">arrives before slow thought</text>
  <!-- right panel: fog -->
  <rect x="270" y="70" width="210" height="360" rx="12" fill="#6b93b6" opacity="0.25" stroke="#2b3a42" stroke-width="2"/>
  <text x="375" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222222">feeling biases</text>
  <line x1="300" y1="230" x2="450" y2="230" stroke="#2b3a42" stroke-width="2"/>
  <path d="M330 230 L400 200" stroke="#e0a458" stroke-width="4" stroke-linecap="round"/>
  <path d="M430 230 L400 200" stroke="#e0a458" stroke-width="4" stroke-linecap="round"/>
  <path d="M330 230 L400 260" stroke="#e0a458" stroke-width="4" stroke-linecap="round"/>
  <path d="M430 230 L400 260" stroke="#e0a458" stroke-width="4" stroke-linecap="round"/>
  <circle cx="400" cy="196" r="4" fill="#2b3a42"/>
  <!-- fog clouds -->
  <ellipse cx="340" cy="270" rx="42" ry="20" fill="#6b93b6" opacity="0.5" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="405" cy="286" rx="50" ry="22" fill="#6b93b6" opacity="0.5" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="360" cy="300" rx="36" ry="16" fill="#6b93b6" opacity="0.45" stroke="#2b3a42" stroke-width="2"/>
  <text x="375" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#222222">a fog — loud but</text>
  <text x="375" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#222222">unproven, runs ahead</text>
  <text x="375" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6d7a">needs a check</text>
  <text x="256" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#222222">Ask: compass or fog?</text>
</svg>
