<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The design cycle: ask, imagine, plan, create, test, improve</title>
  <desc id="desc">A six-step design cycle drawn as a ring — ask, imagine, plan, create, test, improve — with an arrow looping back from improve to ask, and the word "rationale" at the center. Labels carry the meaning, so it prints clearly in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">The Design Cycle</text>

  <circle cx="256" cy="260" r="150" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="256" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222222">rationale</text>

  <circle cx="256" cy="110" r="26" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="117" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">ask</text>

  <circle cx="386" cy="184" r="26" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="386" y="191" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">imagine</text>

  <circle cx="386" cy="336" r="26" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="386" y="343" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">plan</text>

  <circle cx="256" cy="410" r="26" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="417" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">create</text>

  <circle cx="126" cy="336" r="26" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="126" y="343" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">test</text>

  <circle cx="126" cy="184" r="26" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="126" y="191" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">improve</text>

  <!-- Loop arrow from improve back to ask -->
  <path d="M120 158 C80 120 84 84 128 86" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M130 90 L118 84 L132 78" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
