<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Dividing fractions and decimals</title>
  <desc id="desc">Fraction and decimal division models. Top: a bar of length 2 divided into eight equal quarter pieces, labeled 2 divided by 1/4 equals 8, meaning how many 1/4 pieces fit in 2. Middle: a bar with 3/4 shaded then split in half, each person getting 3/8, labeled 3/4 divided by 2 equals 3/8. Bottom: a decimal problem 4.50 divided by 3 equals 1.50, shown as three equal groups of coins each labeled 1.50. Labels, shading, and counts, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Dividing Fractions and Decimals</text>

  <!-- Top: 2 ÷ 1/4 = 8 -->
  <text x="256" y="68" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#6b93b6">How many 1/4 pieces fit in 2? → 2 ÷ 1/4</text>
  <rect x="60" y="82" width="120" height="34" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <rect x="300" y="82" width="120" height="34" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#2b3a42" stroke-width="1.5">
    <line x1="90" y1="82" x2="90" y2="116"/><line x1="120" y1="82" x2="120" y2="116"/><line x1="150" y1="82" x2="150" y2="116"/>
    <line x1="330" y1="82" x2="330" y2="116"/><line x1="360" y1="82" x2="360" y2="116"/><line x1="390" y1="82" x2="390" y2="116"/>
  </g>
  <text x="120" y="136" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">1 whole = 4 fourths</text>
  <text x="360" y="136" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">another 4 fourths</text>
  <text x="256" y="158" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">2 ÷ 1/4 = 8 pieces</text>

  <line x1="60" y1="176" x2="452" y2="176" stroke="#e0a458" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Middle: 3/4 ÷ 2 = 3/8 -->
  <text x="256" y="204" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#6b93b6">Share 3/4 among 2 people → 3/4 ÷ 2</text>
  <rect x="60" y="218" width="392" height="44" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#2b3a42" stroke-width="1.5">
    <line x1="158" y1="218" x2="158" y2="262"/><line x1="256" y1="218" x2="256" y2="262"/><line x1="354" y1="218" x2="354" y2="262"/>
  </g>
  <rect x="60" y="218" width="294" height="44" fill="#7a9e7e" stroke="none"/>
  <!-- split line -->
  <line x1="207" y1="212" x2="207" y2="268" stroke="#e0a458" stroke-width="3"/>
  <text x="134" y="282" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">person 1: 3/8</text>
  <text x="306" y="282" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">person 2: 3/8</text>
  <text x="452" y="282" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">1/4 left</text>
  <text x="256" y="304" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">3/4 ÷ 2 = 3/8 each</text>

  <line x1="60" y1="322" x2="452" y2="322" stroke="#e0a458" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Bottom: 4.50 ÷ 3 = 1.50 -->
  <text x="256" y="350" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#6b93b6">Divide 4.50 equally among 3 people → 4.50 ÷ 3</text>

  <!-- three groups -->
  <g>
    <rect x="80" y="364" width="100" height="80" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="130" cy="400" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="130" y="432" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">1.50</text>

    <rect x="206" y="364" width="100" height="80" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="256" cy="400" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="432" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">1.50</text>

    <rect x="332" y="364" width="100" height="80" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="382" cy="400" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="382" y="432" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">1.50</text>
  </g>
  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">4.50 ÷ 3 = 1.50 each</text>

  <text x="256" y="496" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">check by multiplying back: 3 × 1.50 = 4.50</text>
</svg>
