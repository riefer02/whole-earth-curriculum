<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-04-001-08-connection-web desc-L-04-001-08-connection-web">
  <title id="title-L-04-001-08-connection-web">A tradition connects me outward in rings</title>
  <desc id="desc-L-04-001-08-connection-web">Four concentric circles. The center reads "me." The next ring reads "my family tradition." The next reads "my community." The outer ring reads "the wider world." Curved dotted lines connect the center outward like threads. Labels and shape, not color, carry the meaning.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">My Tradition Connects Me Outward</text>

  <!-- Rings -->
  <circle cx="256" cy="272" r="42" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="256" cy="272" r="100" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <circle cx="256" cy="272" r="152" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <circle cx="256" cy="272" r="206" fill="none" stroke="#4f6d7a" stroke-width="3"/>

  <!-- Radial dotted threads -->
  <line x1="256" y1="230" x2="256" y2="64" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5 7"/>
  <line x1="214" y1="272" x2="34" y2="272" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5 7"/>
  <line x1="298" y1="272" x2="478" y2="272" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5 7"/>
  <line x1="256" y1="314" x2="256" y2="468" stroke="#2b3a42" stroke-width="2" stroke-dasharray="5 7"/>

  <!-- Center label -->
  <text x="256" y="280" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">me</text>

  <!-- Ring labels -->
  <text x="256" y="176" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">my family tradition</text>
  <text x="256" y="116" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">my community</text>
  <text x="256" y="58" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">the wider world</text>

  <text x="256" y="498" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">My tradition is a thread that reaches far beyond me.</text>
</svg>
