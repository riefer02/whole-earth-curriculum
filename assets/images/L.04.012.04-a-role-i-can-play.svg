<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A Role I Can Play: class and neighborhood roles</title>
  <desc id="desc">A scene of class and neighborhood roles. Five children each hold a labeled role badge and act it out: a "water helper" waters a potted plant, a "reading buddy" reads with a smaller child, a "greeter" waves hello, a "recycler" sorts a bottle into a bin, and a "neighbor helper" carries a bag for an older neighbor. A corner note reads "each role helps us all." People vary in skin tone and dress, and one child wears a hearing aid.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">A Role I Can Play</text>

  <!-- badge 1: water helper -->
  <g>
    <circle cx="90" cy="150" r="24" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="83" cy="145" r="2.5" fill="#2b3a42"/>
    <circle cx="98" cy="145" r="2.5" fill="#2b3a42"/>
    <path d="M84 158 q7 5 14 0" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M90 174 v26" stroke="#2b3a42" stroke-width="3"/>
    <path d="M90 188 l12 10 M90 188 l-12 10" stroke="#2b3a42" stroke-width="3"/>
    <path d="M104 178 l12 18" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
    <path d="M110 208 q-3 -10 -10 -12" fill="none" stroke="#6b93b6" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="60" y="238" width="60" height="20" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="90" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">water helper</text>
  </g>

  <!-- badge 2: reading buddy -->
  <g>
    <circle cx="180" cy="150" r="24" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="230" cy="156" r="18" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <rect x="186" y="178" width="30" height="24" rx="3" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="222" y="182" width="26" height="20" rx="3" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="170" y="238" width="64" height="20" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="202" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">reading buddy</text>
  </g>

  <!-- badge 3: greeter -->
  <g>
    <circle cx="300" cy="150" r="24" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="293" cy="145" r="2.5" fill="#2b3a42"/>
    <circle cx="308" cy="145" r="2.5" fill="#2b3a42"/>
    <path d="M292 160 q9 6 18 0" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- hearing aid -->
    <path d="M312 150 a7 7 0 0 1 10 0" fill="none" stroke="#e0a458" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M300 174 v20" stroke="#2b3a42" stroke-width="3"/>
    <path d="M300 184 l10 8 M300 184 l-10 8" stroke="#2b3a42" stroke-width="3"/>
    <path d="M318 178 l10 16" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
    <path d="M322 178 q6 -2 10 2" fill="none" stroke="#e0a458" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="284" y="238" width="56" height="20" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="312" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">greeter</text>
  </g>

  <!-- badge 4: recycler -->
  <g>
    <circle cx="390" cy="150" r="24" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="383" cy="145" r="2.5" fill="#2b3a42"/>
    <circle cx="398" cy="145" r="2.5" fill="#2b3a42"/>
    <path d="M384 158 q7 5 14 0" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M390 174 v20" stroke="#2b3a42" stroke-width="3"/>
    <path d="M390 184 l10 8 M390 184 l-10 8" stroke="#2b3a42" stroke-width="3"/>
    <rect x="404" y="180" width="14" height="20" rx="2" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="420" y="196" width="34" height="30" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M420 204 a17 12 0 0 1 34 0" fill="none" stroke="#7a9e7e" stroke-width="2"/>
    <rect x="374" y="238" width="60" height="20" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="404" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">recycler</text>
  </g>

  <!-- badge 5: neighbor helper -->
  <g>
    <circle cx="130" cy="330" r="22" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M130 352 v24" stroke="#2b3a42" stroke-width="3"/>
    <path d="M130 364 l12 10 M130 364 l-12 10" stroke="#2b3a42" stroke-width="3"/>
    <rect x="142" y="344" width="20" height="26" rx="3" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <!-- older neighbor -->
    <circle cx="210" cy="330" r="22" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M210 352 v24" stroke="#2b3a42" stroke-width="3"/>
    <path d="M210 364 l12 10 M210 364 l-12 10" stroke="#2b3a42" stroke-width="3"/>
    <path d="M200 356 l14 26" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
    <rect x="96" y="400" width="74" height="20" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="133" y="414" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">neighbor helper</text>
  </g>

  <!-- corner note -->
  <rect x="330" y="360" width="150" height="46" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="405" y="380" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">each role</text>
  <text x="405" y="398" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">helps us all</text>
</svg>
