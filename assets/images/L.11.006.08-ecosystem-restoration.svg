<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Conservation and Restoration</title>
  <desc id="desc">A food web with several linked species. One species is faded with a broken link, showing the ripple to its neighbors. A second panel shows the web restored with the missing link redrawn, labeled conservation and restoration.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Conservation and Restoration</text>

  <!-- Left: broken web -->
  <text x="128" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a" font-weight="bold">A broken web</text>
  <circle cx="128" cy="150" r="26" fill="#7a9e7e" fill-opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
  <text x="128" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">plant</text>
  <circle cx="64" cy="220" r="22" fill="#e0a458" fill-opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
  <text x="64" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">insect</text>
  <circle cx="192" cy="220" r="22" fill="#6b93b6" fill-opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
  <text x="192" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">bird</text>
  <circle cx="128" cy="290" r="22" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="128" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">pollinator</text>
  <text x="128" y="312" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">(removed)</text>

  <line x1="102" y1="150" x2="76" y2="200" stroke="#2b3a42" stroke-width="2"/>
  <line x1="154" y1="150" x2="180" y2="200" stroke="#2b3a42" stroke-width="2"/>
  <line x1="118" y1="176" x2="120" y2="268" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="96" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">✗</text>
  <text x="160" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">✗</text>

  <!-- Right: restored web -->
  <text x="384" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a" font-weight="bold">The web restored</text>
  <circle cx="384" cy="150" r="26" fill="#7a9e7e" fill-opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
  <text x="384" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">plant</text>
  <circle cx="320" cy="220" r="22" fill="#e0a458" fill-opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
  <text x="320" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">insect</text>
  <circle cx="448" cy="220" r="22" fill="#6b93b6" fill-opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
  <text x="448" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">bird</text>
  <circle cx="384" cy="290" r="22" fill="#e0a458" fill-opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
  <text x="384" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">pollinator</text>

  <line x1="358" y1="150" x2="332" y2="200" stroke="#2b3a42" stroke-width="2"/>
  <line x1="410" y1="150" x2="436" y2="200" stroke="#2b3a42" stroke-width="2"/>
  <line x1="374" y1="176" x2="376" y2="268" stroke="#2b3a42" stroke-width="2"/>

  <!-- Footer -->
  <rect x="70" y="350" width="372" height="110" fill="#ffffff" stroke="#7a9e7e" stroke-width="2" rx="6"/>
  <text x="256" y="378" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">Conservation keeps the links from breaking.</text>
  <text x="256" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222" font-weight="bold">Restoration mends them where they have.</text>
  <text x="256" y="424" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Caring for an ecosystem is caring for relationships,</text>
  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">not just creatures.</text>
</svg>
