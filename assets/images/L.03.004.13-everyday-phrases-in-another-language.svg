<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Everyday phrases in another language</title>
  <desc id="desc">Two speech bubbles sit side by side at the same height: one holds the word hello in Latin letters, and the other holds a greeting in a different script, with a hand waving between them. Below, three small cards show everyday phrases — a number, a color, and a greeting — each written in two scripts. The labels and shapes carry the meaning, so the picture prints clearly in grayscale and teaches learners to learn and use simple everyday phrases in another language, honoring every script equally.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Everyday Phrases in Another Language</text>

  <!-- two greeting bubbles -->
  <rect x="80" y="90" width="140" height="70" rx="20" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="150" y="132" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">hello</text>

  <rect x="292" y="90" width="140" height="70" rx="20" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="362" y="132" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans', 'Arial Unicode MS', sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">مرحبا</text>

  <!-- waving hand between them -->
  <rect x="228" y="104" width="56" height="48" rx="8" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M242 122 L256 112 M242 130 L258 122 M242 138 L258 132" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
  <text x="256" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">same idea, two languages</text>

  <!-- phrase cards -->
  <g font-family="sans-serif" font-size="15" fill="#2b3a42">
    <rect x="70" y="230" width="170" height="110" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="155" y="258" text-anchor="middle" font-weight="bold">a number</text>
    <text x="155" y="292" text-anchor="middle" font-size="22" font-weight="bold">3</text>
    <text x="155" y="322" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans', 'Arial Unicode MS', sans-serif" font-size="22" font-weight="bold">٣</text>

    <rect x="262" y="230" width="180" height="110" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="352" y="258" text-anchor="middle" font-weight="bold">a color</text>
    <text x="352" y="292" text-anchor="middle" font-size="20" font-weight="bold">red</text>
    <text x="352" y="322" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans', 'Arial Unicode MS', sans-serif" font-size="20" font-weight="bold">赤</text>
  </g>

  <text x="256" y="382" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Greetings, numbers, colors — everyday phrases you can learn and use.</text>
  <text x="256" y="406" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">Every script carries the same meaning, in its own way.</text>
</svg>
