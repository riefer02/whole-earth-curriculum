<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-09-005-05-empathy-radius desc-L-09-005-05-empathy-radius">
  <title id="title-L-09-005-05-empathy-radius">Empathy across distance</title>
  <desc id="desc-L-09-005-05-empathy-radius">Concentric circles radiate from a person at the center, labeled me, then family and friends, community, nation, and all humanity. Arrows show that a face and a story widen the circle, while distance, numbers, and an endless feed shrink it. Circles are labeled, not distinguished by color alone.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Empathy Is Near-Sighted</text>

  <!-- Concentric circles -->
  <circle cx="256" cy="250" r="180" fill="none" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="256" cy="250" r="140" fill="none" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="256" cy="250" r="100" fill="none" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.65"/>
  <circle cx="256" cy="250" r="60" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <!-- Person at center -->
  <circle cx="256" cy="250" r="24" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="247" cy="246" r="2.6" fill="#2b3a42"/><circle cx="265" cy="246" r="2.6" fill="#2b3a42"/>
  <path d="M248 262 Q256 267 264 262" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>

  <!-- Ring labels: each sits inside the band it names, on the vertical axis,
       with a paper patch behind it so the ring lines never cut the words. -->
  <rect x="242" y="196" width="28" height="20" fill="#fdfbf7"/>
  <text x="256" y="210" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">me</text>

  <rect x="197" y="154" width="118" height="24" fill="#fdfbf7"/>
  <text x="256" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">family &amp; friends</text>

  <rect x="213" y="118" width="86" height="24" fill="#fdfbf7"/>
  <text x="256" y="134" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">community</text>

  <rect x="228" y="78" width="56" height="24" fill="#fdfbf7"/>
  <text x="256" y="94" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">nation</text>

  <rect x="216" y="436" width="80" height="24" fill="#fdfbf7"/>
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">all humanity</text>

  <!-- Widen arrow: starts at the ring edge, points outward -->
  <line x1="382" y1="120" x2="400" y2="120" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round"/>
  <path d="M404 120 L394 114 L394 126 Z" fill="#7a9e7e"/>
  <text x="410" y="112" font-family="sans-serif" font-size="13" fill="#4f6d7a">a face + a story</text>
  <text x="410" y="136" font-family="sans-serif" font-size="14" fill="#4f6d7a">widen it</text>

  <!-- Narrow arrow: points inward, back toward the ring -->
  <line x1="104" y1="120" x2="124" y2="120" stroke="#e0a458" stroke-width="4" stroke-linecap="round"/>
  <path d="M128 120 L118 114 L118 126 Z" fill="#e0a458"/>
  <text x="97" y="106" text-anchor="end" font-family="sans-serif" font-size="14" fill="#4f6d7a">distance,</text>
  <text x="97" y="122" text-anchor="end" font-family="sans-serif" font-size="14" fill="#4f6d7a">numbers,</text>
  <text x="97" y="138" text-anchor="end" font-family="sans-serif" font-size="12" fill="#4f6d7a">an endless feed</text>
  <text x="97" y="154" text-anchor="end" font-family="sans-serif" font-size="14" fill="#4f6d7a">narrow it</text>
</svg>
