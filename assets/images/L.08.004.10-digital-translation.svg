<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Digital translation — gist vs meaning</title>
  <desc id="desc">Two columns. Left: a machine box turning the phrase "it's raining cats and dogs" into a flat literal picture labeled "cats and dogs are falling". Right: a human figure turning the same phrase into "it's raining very hard". A note reads "tools give the gist; humans keep the meaning".</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">Digital translation: gist or meaning?</text>

  <!-- left machine column -->
  <rect x="36" y="80" width="196" height="280" rx="10" fill="#6b93b6" opacity="0.4" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="134" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">the tool (matches words)</text>
  <rect x="60" y="120" width="148" height="46" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="134" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">"it's raining</text>
  <text x="134" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">cats and dogs"</text>
  <path d="M134,166 L134,188" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="60" y="188" width="148" height="46" rx="8" fill="#e0a458" opacity="0.6" stroke="#2b3a42" stroke-width="2"/>
  <text x="134" y="208" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">"cats and dogs</text>
  <text x="134" y="224" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">are falling"</text>
  <text x="134" y="268" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">fast, useful for a</text>
  <text x="134" y="286" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">quick guess</text>

  <!-- right human column -->
  <rect x="280" y="80" width="196" height="280" rx="10" fill="#7a9e7e" opacity="0.5" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="378" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">the human (keeps meaning)</text>
  <circle cx="378" cy="150" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M378,166 L378,206" stroke="#2b3a42" stroke-width="2"/>
  <path d="M378,178 L358,192 M378,178 L398,192" stroke="#2b3a42" stroke-width="2"/>
  <rect x="304" y="212" width="148" height="46" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="378" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">"it's raining</text>
  <text x="378" y="248" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">very hard"</text>
  <text x="378" y="284" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">medicine, law, and</text>
  <text x="378" y="302" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">poems need a human</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b3a42"/>
    </marker>
  </defs>

  <text x="256" y="408" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Tools give the gist; humans keep the meaning.</text>
  <text x="256" y="434" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Your home language is the starting point — tools serve the person.</text>
</svg>
