<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Senses team up — taste and smell make flavor</title>
  <desc id="desc">Two side-by-side panels of the same child tasting food. On the left the child's nose is pinched closed and a faint, small flavor cloud rises. On the right the nose is open and a strong, full flavor cloud rises. Labels show smell and taste meeting to make flavor. Words and shapes carry the meaning, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Taste + Smell = Flavor</text>

  <!-- ===== Panel 1: nose pinched ===== -->
  <g>
    <rect x="28" y="72" width="212" height="360" rx="14" fill="#f4f0e6" stroke="#4f6d7a" stroke-width="2"/>
    <text x="134" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Nose closed</text>

    <!-- head -->
    <circle cx="134" cy="210" r="66" fill="#d6d1c7" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M96 190 A66 66 0 0 1 172 190 L172 174 Q134 148 96 174 Z" fill="#2b3a42"/>
    <!-- eyes -->
    <ellipse cx="112" cy="208" rx="10" ry="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="112" cy="208" r="3.5" fill="#2b3a42"/>
    <ellipse cx="156" cy="208" rx="10" ry="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="156" cy="208" r="3.5" fill="#2b3a42"/>
    <!-- pinched nose -->
    <path d="M126 230 Q134 238 142 230" fill="none" stroke="#e0a458" stroke-width="4" stroke-linecap="round"/>
    <line x1="128" y1="228" x2="122" y2="244" stroke="#e0a458" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="140" y1="228" x2="146" y2="244" stroke="#e0a458" stroke-width="2.5" stroke-linecap="round"/>
    <!-- mouth -->
    <path d="M114 252 Q134 266 154 252" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <!-- food held -->
    <circle cx="134" cy="276" r="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="134" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">faint flavor</text>

    <!-- faint flavor cloud -->
    <g fill="none" stroke="#4f6d7a" stroke-width="2" opacity="0.55">
      <path d="M180 260 Q192 244 184 234" stroke-linecap="round"/>
      <path d="M188 250 Q204 236 198 222" stroke-linecap="round"/>
    </g>
    <text x="196" y="218" font-family="sans-serif" font-size="12" fill="#4f6d7a" opacity="0.7">weak</text>
  </g>

  <!-- ===== Panel 2: nose open ===== -->
  <g>
    <rect x="272" y="72" width="212" height="360" rx="14" fill="#f4f0e6" stroke="#4f6d7a" stroke-width="2"/>
    <text x="378" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Nose open</text>

    <!-- head -->
    <circle cx="378" cy="210" r="66" fill="#e6c8a0" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M340 190 A66 66 0 0 1 416 190 L416 174 Q378 148 340 174 Z" fill="#2b3a42"/>
    <!-- eyes -->
    <ellipse cx="356" cy="208" rx="10" ry="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="356" cy="208" r="3.5" fill="#2b3a42"/>
    <ellipse cx="400" cy="208" rx="10" ry="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="400" cy="208" r="3.5" fill="#2b3a42"/>
    <!-- open nose -->
    <path d="M368 232 Q378 242 388 232" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="372" cy="236" rx="4" ry="3" fill="#c9bdb0" stroke="#2b3a42" stroke-width="1.5"/>
    <ellipse cx="384" cy="236" rx="4" ry="3" fill="#c9bdb0" stroke="#2b3a42" stroke-width="1.5"/>
    <!-- mouth -->
    <path d="M358 252 Q378 268 398 252" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <!-- food held -->
    <circle cx="378" cy="276" r="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="378" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">full flavor</text>

    <!-- strong flavor cloud -->
    <g fill="none" stroke="#4f6d7a" stroke-width="2.5">
      <path d="M424 264 Q438 240 430 224" stroke-linecap="round"/>
      <path d="M434 256 Q452 238 446 220" stroke-linecap="round"/>
      <path d="M442 248 Q462 234 458 214" stroke-linecap="round"/>
    </g>
    <text x="446" y="204" font-family="sans-serif" font-size="12" fill="#4f6d7a">strong</text>
  </g>

  <!-- ===== Team-up diagram ===== -->
  <g font-family="sans-serif">
    <ellipse cx="96" cy="430" rx="34" ry="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="96" y="435" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">taste</text>
    <ellipse cx="240" cy="430" rx="34" ry="16" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="240" y="435" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">smell</text>
    <line x1="130" y1="430" x2="206" y2="430" stroke="#2b3a42" stroke-width="2.5"/>
    <path d="M168 426 L168 414 M168 434 L168 442" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="296" y="408" width="180" height="44" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="386" y="435" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b3a42">flavor</text>
    <line x1="274" y1="430" x2="296" y2="430" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arr)"/>
  </g>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#2b3a42"/>
    </marker>
  </defs>

  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Two senses together give a fuller picture than one alone.</text>
</svg>
