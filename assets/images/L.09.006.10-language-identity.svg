<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Languages are part of identity</title>
  <desc id="desc">A person at the center is surrounded by speech bubbles carrying the same greeting in different scripts — hello in Latin letters, namaste in Devanagari, marhaba in Arabic, and ni hao in Chinese characters — plus a signing hand, all connected to a label that reads identity.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">My Languages Are Part of Me</text>

  <!-- central person -->
  <circle cx="256" cy="278" r="34" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="256" cy="266" r="15" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <rect x="240" y="310" width="32" height="44" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>

  <!-- speech bubbles with diverse scripts -->
  <g>
    <rect x="46" y="96" width="128" height="52" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="110" y="128" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">hello</text>

    <rect x="338" y="96" width="128" height="52" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="402" y="128" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">नमस्ते</text>

    <rect x="46" y="380" width="128" height="52" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="110" y="412" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">مرحبا</text>

    <rect x="338" y="380" width="128" height="52" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="402" y="412" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">你好</text>
  </g>

  <!-- signing hand -->
  <g stroke="#2b3a42" stroke-width="2" fill="#ffffff">
    <path d="M100 200 L100 260" stroke="#2b3a42"/>
    <circle cx="100" cy="196" r="8" fill="#e0a458"/>
    <rect x="94" y="248" width="12" height="30" rx="5"/>
  </g>
  <text x="100" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">a signed language</text>

  <!-- connector lines to identity -->
  <path d="M174 122 C 210 200, 210 240, 240 266" fill="none" stroke="#4f6d7a" stroke-width="1.5"/>
  <path d="M338 122 C 302 200, 302 240, 272 266" fill="none" stroke="#4f6d7a" stroke-width="1.5"/>
  <path d="M174 406 C 210 340, 210 310, 240 296" fill="none" stroke="#4f6d7a" stroke-width="1.5"/>
  <path d="M338 406 C 302 340, 302 310, 272 296" fill="none" stroke="#4f6d7a" stroke-width="1.5"/>
  <path d="M112 250 C 150 250, 190 270, 236 278" fill="none" stroke="#4f6d7a" stroke-width="1.5"/>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Each language I speak — or sign — carries a part of who I am</text>
</svg>
