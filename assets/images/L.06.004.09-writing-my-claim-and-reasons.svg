<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Writing my claim and reasons</title>
  <desc id="desc">A diagram of one argument. At the top, a banner reads "claim — our neighborhood should plant more shade and fruit trees." Below it, three boxes are labeled "reason" and read "because trees give cool shade in hot weather," "because fruit trees give free, healthy food," and "because trees give birds and bees a home." Arrows point from each reason up to the claim. A bottom line reads "a claim is what you believe; reasons are why." Labels and shapes, not color alone, carry the meaning so the graphic prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">Writing My Claim and Reasons</text>

  <!-- Claim banner -->
  <rect x="40" y="70" width="432" height="72" rx="12" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="96" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">CLAIM</text>
  <text x="256" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">"Our neighborhood should plant more shade</text>
  <text x="256" y="136" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">and fruit trees."</text>

  <!-- Arrows up from reasons -->
  <path d="M128 200 L128 146" stroke="#2b3a42" stroke-width="3" marker-end="url(#d)"/>
  <path d="M256 200 L256 146" stroke="#2b3a42" stroke-width="3" marker-end="url(#d)"/>
  <path d="M384 200 L384 146" stroke="#2b3a42" stroke-width="3" marker-end="url(#d)"/>
  <defs>
    <marker id="d" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2b3a42"/>
    </marker>
  </defs>

  <!-- Reason boxes -->
  <rect x="28" y="200" width="200" height="118" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="128" y="224" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">reason</text>
  <text x="128" y="254" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">because trees give</text>
  <text x="128" y="274" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">cool shade in</text>
  <text x="128" y="294" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">hot weather</text>

  <rect x="156" y="200" width="200" height="118" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="224" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">reason</text>
  <text x="256" y="254" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">because fruit trees</text>
  <text x="256" y="274" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">give free,</text>
  <text x="256" y="294" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">healthy food</text>

  <rect x="284" y="200" width="200" height="118" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="384" y="224" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">reason</text>
  <text x="384" y="254" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">because trees give</text>
  <text x="384" y="274" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">birds and bees</text>
  <text x="384" y="294" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">a home</text>

  <!-- Test -->
  <rect x="40" y="352" width="432" height="60" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="378" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">the test: does it support the claim?</text>
  <text x="256" y="398" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">each reason says why — or it is cut or fixed</text>

  <text x="256" y="458" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#2b3a42">A claim is what you believe; reasons are why.</text>
  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Argument is reasoned claim — not winning, not the loudest voice.</text>
</svg>
