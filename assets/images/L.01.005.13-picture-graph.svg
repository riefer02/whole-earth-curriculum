<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Making a picture graph: one mark for each answer</title>
  <desc id="desc">A picture graph answers the question, which fruit do you like best? It has three rows. The mango row holds six marks, the banana row holds four marks, and the apple row holds three marks, each mark meaning one person's answer. The mango row is labeled most and the apple row is labeled fewest, with the count written at the end of each row. A note says one mark equals one answer and every voice counts once. Labels, counts, and shapes carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Make a Picture Graph</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">One mark for each answer.</text>

  <!-- Graph frame -->
  <rect x="40" y="180" width="432" height="268" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.5"/>
  <text x="256" y="208" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Which fruit do you like best?</text>

  <!-- Mango row: 6 -->
  <ellipse cx="116" cy="252" rx="17" ry="12" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <line x1="126" y1="242" x2="131" y2="235" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="116" y="284" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">mango</text>
  <g fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5">
    <circle cx="210" cy="252" r="11"/><circle cx="246" cy="252" r="11"/><circle cx="282" cy="252" r="11"/><circle cx="318" cy="252" r="11"/><circle cx="354" cy="252" r="11"/><circle cx="390" cy="252" r="11"/>
  </g>
  <text x="452" y="257" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">6</text>
  <text x="452" y="237" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e0a458">most</text>

  <!-- Banana row: 4 -->
  <path d="M102 312 Q128 316 120 332" fill="none" stroke="#e0a458" stroke-width="9" stroke-linecap="round"/>
  <text x="116" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">banana</text>
  <g fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5">
    <circle cx="210" cy="320" r="11"/><circle cx="246" cy="320" r="11"/><circle cx="282" cy="320" r="11"/><circle cx="318" cy="320" r="11"/>
  </g>
  <text x="452" y="325" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">4</text>

  <!-- Apple row: 3 -->
  <circle cx="116" cy="388" r="14" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="116" y1="374" x2="116" y2="368" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="123" cy="371" rx="5" ry="2.5" fill="#7a9e7e" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="116" y="420" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">apple</text>
  <g fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5">
    <circle cx="210" cy="388" r="11"/><circle cx="246" cy="388" r="11"/><circle cx="282" cy="388" r="11"/>
  </g>
  <text x="452" y="393" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">3</text>
  <text x="452" y="415" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e0a458">fewest</text>

  <text x="256" y="472" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Mango has the most (6). Apple has the fewest (3).</text>
  <text x="256" y="496" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">One mark = one answer. Every voice counts once.</text>
</svg>
