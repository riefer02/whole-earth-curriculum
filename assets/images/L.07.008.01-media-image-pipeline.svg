<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Real people versus the repeated edited image media often shows</title>
  <desc id="desc">Two panels side by side. The left panel, labeled "Real people — every body is different," shows five simple standing figures of different heights, widths, and skin tones, one using a wheelchair, all smiling. The right panel, labeled "Media often shows one narrow image, edited and repeated," shows three identical tall, thin figures with a sparkle-and-filter icon above them. A caption reads "Media images are chosen, edited, and repeated — not a picture of every body."</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">What are we really seeing?</text>

  <!-- LEFT PANEL -->
  <rect x="16" y="64" width="230" height="372" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <text x="131" y="94" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Real people</text>
  <text x="131" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">every body is different</text>

  <!-- figure 1: short, wide, deep skin -->
  <g>
    <circle cx="60" cy="150" r="11" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <rect x="44" y="166" width="32" height="52" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="46" y1="220" x2="46" y2="256" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="74" y1="220" x2="74" y2="256" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="178" x2="30" y2="206" stroke="#8f5f3d" stroke-width="5" stroke-linecap="round"/>
    <line x1="80" y1="178" x2="90" y2="206" stroke="#8f5f3d" stroke-width="5" stroke-linecap="round"/>
    <path d="M52 143 Q60 148 68 143" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- figure 2: tall, thin, light skin -->
  <g>
    <circle cx="131" cy="140" r="11" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="118" y="156" width="26" height="70" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="120" y1="228" x2="120" y2="272" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="142" y1="228" x2="142" y2="272" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="114" y1="168" x2="104" y2="202" stroke="#f5d6b6" stroke-width="5" stroke-linecap="round"/>
    <line x1="148" y1="168" x2="158" y2="202" stroke="#f5d6b6" stroke-width="5" stroke-linecap="round"/>
    <path d="M123 133 Q131 138 139 133" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- figure 3: medium height/width, medium skin -->
  <g>
    <circle cx="205" cy="158" r="11" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <rect x="190" y="174" width="30" height="48" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="192" y1="224" x2="192" y2="258" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="218" y1="224" x2="218" y2="258" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="186" y1="186" x2="176" y2="212" stroke="#c99567" stroke-width="5" stroke-linecap="round"/>
    <line x1="224" y1="186" x2="234" y2="212" stroke="#c99567" stroke-width="5" stroke-linecap="round"/>
    <path d="M197 151 Q205 156 213 151" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- figure 4: wheelchair user, medium-deep skin -->
  <g>
    <circle cx="60" cy="312" r="11" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="44" y="328" width="32" height="42" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="46" y1="370" x2="40" y2="392" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="74" y1="370" x2="80" y2="392" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="340" x2="30" y2="362" stroke="#ab7a4e" stroke-width="5" stroke-linecap="round"/>
    <line x1="80" y1="340" x2="90" y2="362" stroke="#ab7a4e" stroke-width="5" stroke-linecap="round"/>
    <path d="M52 305 Q60 310 68 305" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- wheelchair -->
    <circle cx="60" cy="404" r="9" fill="none" stroke="#2b3a42" stroke-width="3"/>
    <line x1="34" y1="392" x2="60" y2="404" stroke="#2b3a42" stroke-width="3"/>
    <line x1="60" y1="404" x2="88" y2="398" stroke="#2b3a42" stroke-width="3"/>
    <circle cx="88" cy="398" r="4" fill="#2b3a42"/>
    <line x1="34" y1="392" x2="34" y2="414" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <circle cx="34" cy="416" r="4" fill="#2b3a42"/>
  </g>

  <!-- figure 5: tall, strong, deep skin -->
  <g>
    <circle cx="175" cy="296" r="12" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <rect x="158" y="313" width="34" height="64" rx="11" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="160" y1="380" x2="160" y2="420" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="190" y1="380" x2="190" y2="420" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="154" y1="325" x2="142" y2="362" stroke="#8f5f3d" stroke-width="5" stroke-linecap="round"/>
    <line x1="196" y1="325" x2="208" y2="362" stroke="#8f5f3d" stroke-width="5" stroke-linecap="round"/>
    <path d="M166 289 Q175 294 184 289" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- RIGHT PANEL -->
  <rect x="266" y="64" width="230" height="372" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <text x="381" y="94" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">What media often shows</text>
  <text x="381" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">one narrow image, edited, repeated</text>

  <!-- filter/sparkle icon -->
  <g>
    <path d="M360 132 L366 148 L382 154 L366 160 L360 176 L354 160 L338 154 L354 148 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
    <path d="M398 126 L402 138 L414 142 L402 146 L398 158 L394 146 L382 142 L394 138 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
  </g>

  <!-- three identical tall thin figures -->
  <g>
    <circle cx="330" cy="190" r="10" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="320" y="205" width="20" height="66" rx="9" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <line x1="322" y1="274" x2="322" y2="310" stroke="#2b3a42" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="338" y1="274" x2="338" y2="310" stroke="#2b3a42" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="318" y1="216" x2="310" y2="244" stroke="#f5d6b6" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="342" y1="216" x2="350" y2="244" stroke="#f5d6b6" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="381" cy="190" r="10" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="371" y="205" width="20" height="66" rx="9" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <line x1="373" y1="274" x2="373" y2="310" stroke="#2b3a42" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="389" y1="274" x2="389" y2="310" stroke="#2b3a42" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="369" y1="216" x2="361" y2="244" stroke="#f5d6b6" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="393" y1="216" x2="401" y2="244" stroke="#f5d6b6" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="432" cy="190" r="10" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="422" y="205" width="20" height="66" rx="9" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <line x1="424" y1="274" x2="424" y2="310" stroke="#2b3a42" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="440" y1="274" x2="440" y2="310" stroke="#2b3a42" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="420" y1="216" x2="412" y2="244" stroke="#f5d6b6" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="444" y1="216" x2="452" y2="244" stroke="#f5d6b6" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- caption -->
  <rect x="70" y="452" width="372" height="40" rx="8" fill="#7a9e7e" fill-opacity="0.18" stroke="#7a9e7e" stroke-width="2"/>
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Media images are chosen, edited, and repeated — not a picture of every body.</text>
</svg>
