<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" font-family="sans-serif">
  <title>Checking a claim with two sources</title>
  <desc>A worksheet-style chart for checking a claim with two sources. At the top a claim reads: an octopus has three hearts. Below, two boxes labeled Source 1 and Source 2 each say what that source states. A middle box asks whether the two sources agree, and a bottom box is for the conclusion.</desc>
  <rect width="700" height="420" fill="#fdfbf7"/>

  <!-- Claim -->
  <rect x="40" y="20" width="620" height="70" rx="12" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <text x="350" y="48" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">CLAIM</text>
  <text x="350" y="72" text-anchor="middle" font-size="18" fill="#222222">"An octopus has three hearts."</text>

  <!-- Source 1 -->
  <rect x="40" y="110" width="300" height="120" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="190" y="138" text-anchor="middle" font-size="16" fill="#4f6d7a" font-weight="bold">SOURCE 1 — a nature book</text>
  <text x="190" y="166" text-anchor="middle" font-size="15" fill="#222222">Says: an octopus has</text>
  <text x="190" y="188" text-anchor="middle" font-size="15" fill="#222222">three hearts. Yes,</text>
  <text x="190" y="210" text-anchor="middle" font-size="15" fill="#222222">three hearts.</text>

  <!-- Source 2 -->
  <rect x="360" y="110" width="300" height="120" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="510" y="138" text-anchor="middle" font-size="16" fill="#4f6d7a" font-weight="bold">SOURCE 2 — an aquarium site</text>
  <text x="510" y="166" text-anchor="middle" font-size="15" fill="#222222">Says: an octopus has</text>
  <text x="510" y="188" text-anchor="middle" font-size="15" fill="#222222">three hearts. Yes,</text>
  <text x="510" y="210" text-anchor="middle" font-size="15" fill="#222222">three hearts.</text>

  <!-- Agree? -->
  <rect x="40" y="250" width="620" height="70" rx="12" fill="#6b93b6" stroke="#2b3a42" stroke-width="3"/>
  <text x="350" y="278" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">DO THE TWO SOURCES AGREE?</text>
  <text x="350" y="302" text-anchor="middle" font-size="18" fill="#222222">Yes — both say the same thing.</text>

  <!-- Conclusion -->
  <rect x="40" y="340" width="620" height="66" rx="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
  <text x="350" y="366" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">CONCLUSION</text>
  <text x="350" y="390" text-anchor="middle" font-size="15" fill="#222222">The claim is likely true, because two sources agree.</text>
</svg>
