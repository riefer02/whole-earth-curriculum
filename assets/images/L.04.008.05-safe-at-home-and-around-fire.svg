<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Safe at home and around fire</title>
  <desc id="desc">Three panels showing fire-safety rules. The first shows a child rolling on the ground labeled stop, drop, and roll. The second shows a child crawling low under smoke labeled crawl low. The third shows a box of matches and a lighter crossed out, labeled never touch. Each panel carries its rule with a word and a bold shape, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Safe at Home and Around Fire</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Three rules to know and practice</text>

  <!-- Panel 1: stop, drop, and roll -->
  <g>
    <rect x="20" y="92" width="148" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <circle cx="94" cy="150" r="16" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="94" cy="196" rx="34" ry="22" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M70 176 q24 -20 48 0" fill="none" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <circle cx="74" cy="170" r="8" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="114" cy="170" r="8" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M54 214 q6 -10 14 -10 M118 208 q6 10 14 10" fill="none" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M66 226 q-8 8 -4 18 M122 226 q8 8 4 18" fill="none" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M78 210 q4 8 12 8 M110 210 q-4 8 -12 8" fill="none" stroke="#e0a458" stroke-width="5" stroke-linecap="round"/>
    <path d="M78 220 q6 10 14 10 M110 220 q-6 10 -14 10" fill="none" stroke="#e0a458" stroke-width="5" stroke-linecap="round"/>
    <text x="94" y="388" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">stop, drop, roll</text>
  </g>

  <!-- Panel 2: crawl low under smoke -->
  <g>
    <rect x="182" y="92" width="148" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <path d="M206 150 q14 -8 30 0 M238 150 q14 -8 28 0 M264 150 q12 -8 24 0" fill="none" stroke="#4f6d7a" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
    <path d="M202 162 q16 -10 34 0 M240 162 q16 -10 32 0 M274 162 q10 -8 22 0" fill="none" stroke="#4f6d7a" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
    <circle cx="230" cy="206" r="15" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="252" cy="232" rx="36" ry="20" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="222" cy="220" r="7" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M278 232 q10 0 10 8 M210 226 q-8 0 -8 8" fill="none" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <rect x="238" y="250" width="44" height="10" rx="4" fill="#e0a458"/>
    <text x="256" y="388" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">crawl low under smoke</text>
  </g>

  <!-- Panel 3: never touch matches or lighters -->
  <g>
    <rect x="344" y="92" width="148" height="330" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <rect x="376" y="168" width="40" height="66" rx="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M376 168 q4 -14 20 -14 q16 0 20 14" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M396 156 l0 -20 M396 156 q6 -10 2 -18" fill="none" stroke="#6b93b6" stroke-width="5" stroke-linecap="round"/>
    <rect x="428" y="196" width="26" height="40" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M428 210 q4 -10 10 -14" fill="none" stroke="#c99567" stroke-width="4" stroke-linecap="round"/>
    <circle cx="442" cy="170" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <!-- cross-out -->
    <line x1="368" y1="152" x2="476" y2="250" stroke="#e0a458" stroke-width="9" stroke-linecap="round"/>
    <text x="418" y="388" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">never touch</text>
  </g>

  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Tell an adult, and know two ways out.</text>
</svg>
