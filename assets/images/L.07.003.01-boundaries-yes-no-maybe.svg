<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Boundary signals: yes, maybe, no</title>
  <desc id="d">Three stacked panels. Top: a circle with a check mark, labeled YES, welcome. Middle: a diamond with a question mark, labeled MAYBE, ask first. Bottom: a circle with an X, labeled NO, not okay. Shape and symbol differ, not only color, so it prints clearly in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="54" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">Boundaries: three signals</text>

  <!-- YES panel -->
  <g>
    <rect x="30" y="84" width="452" height="112" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="96" cy="140" r="38" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M78 142 L92 156 L116 126" fill="none" stroke="#2b3a42" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="158" y="128" font-family="sans-serif" font-size="28" font-weight="bold" fill="#222222">YES</text>
    <text x="158" y="160" font-family="sans-serif" font-size="19" fill="#4f6d7a">welcome, comfortable</text>
  </g>

  <!-- MAYBE panel -->
  <g>
    <rect x="30" y="210" width="452" height="112" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M96 108 L134 140 L96 172 L58 140 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="96" y="147" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#2b3a42">?</text>
    <text x="158" y="254" font-family="sans-serif" font-size="28" font-weight="bold" fill="#222222">MAYBE</text>
    <text x="158" y="286" font-family="sans-serif" font-size="19" fill="#4f6d7a">ask first, it depends</text>
  </g>

  <!-- NO panel -->
  <g>
    <rect x="30" y="336" width="452" height="112" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="96" cy="392" r="38" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <path d="M82 378 L110 406 M110 378 L82 406" fill="none" stroke="#fdfbf7" stroke-width="6" stroke-linecap="round"/>
    <text x="158" y="380" font-family="sans-serif" font-size="28" font-weight="bold" fill="#222222">NO</text>
    <text x="158" y="412" font-family="sans-serif" font-size="19" fill="#4f6d7a">not okay, stop</text>
  </g>

  <text x="256" y="490" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">A no is complete. It does not need a reason to be respected.</text>
</svg>
