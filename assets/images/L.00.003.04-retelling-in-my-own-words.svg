<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A story in three parts</title>
  <desc id="desc">Three frames read left to right, joined by arrows, showing a story's beginning, middle, and end: a seed resting in soil, a sprout with two leaves, and a taller plant with a flower and a small sun. Each frame is numbered and labeled. Prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Retell a Story</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">First&#8230; then&#8230; at the end&#8230;</text>

  <!-- Frame 1 -->
  <rect x="24" y="110" width="128" height="210" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="44" cy="130" r="12" fill="#e0a458"/>
  <text x="44" y="135" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">1</text>
  <ellipse cx="88" cy="252" rx="38" ry="13" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="88" cy="238" rx="10" ry="7" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>

  <!-- Frame 2 -->
  <rect x="192" y="110" width="128" height="210" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="212" cy="130" r="12" fill="#e0a458"/>
  <text x="212" y="135" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">2</text>
  <ellipse cx="256" cy="252" rx="38" ry="13" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="256" y1="252" x2="256" y2="182" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
  <path d="M256 200 Q240 192 244 180 Q256 188 256 200 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M256 200 Q272 192 268 180 Q256 188 256 200 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>

  <!-- Frame 3 -->
  <rect x="360" y="110" width="128" height="210" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="380" cy="130" r="12" fill="#e0a458"/>
  <text x="380" y="135" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">3</text>
  <circle cx="464" cy="150" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#e0a458" stroke-width="2" stroke-linecap="round">
    <line x1="464" y1="136" x2="464" y2="132"/>
    <line x1="464" y1="164" x2="464" y2="168"/>
    <line x1="450" y1="150" x2="446" y2="150"/>
    <line x1="478" y1="150" x2="482" y2="150"/>
  </g>
  <ellipse cx="424" cy="252" rx="38" ry="13" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="424" y1="252" x2="424" y2="186" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
  <path d="M424 206 Q408 198 412 186 Q424 194 424 206 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M424 206 Q440 198 436 186 Q424 194 424 206 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="424" cy="170" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="424" cy="170" r="5" fill="#f5d6b6"/>

  <!-- Arrows -->
  <g fill="#2b3a42">
    <path d="M164 214 L184 214 L176 206 Z"/>
    <path d="M164 214 L184 214 L176 222 Z"/>
    <path d="M332 214 L352 214 L344 206 Z"/>
    <path d="M332 214 L352 214 L344 222 Z"/>
  </g>

  <!-- Labels -->
  <text x="88" y="352" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Beginning</text>
  <text x="256" y="352" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Middle</text>
  <text x="424" y="352" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">End</text>

  <text x="256" y="408" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Tell it your own way &#8212; it is still one story among many.</text>
</svg>
