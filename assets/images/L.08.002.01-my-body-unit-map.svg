<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Unit map: My Body, Movement &amp; Wellness</title>
  <desc id="desc">A map with four quadrants arranged around a central circle labeled "My Body." The quadrants are labeled Sense &amp; Respond, Unwind, Move with Purpose, and Play Fair. The central circle shows a simple standing figure with raised arms. Shapes and labels, not color, carry the meaning, so it prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- central circle -->
  <circle cx="256" cy="256" r="92" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="232" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">My</text>
  <text x="256" y="262" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Body</text>
  <!-- small figure inside center -->
  <circle cx="256" cy="296" r="9" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <line x1="256" y1="305" x2="256" y2="322" stroke="#2b3a42" stroke-width="2"/>
  <line x1="246" y1="330" x2="266" y2="330" stroke="#2b3a42" stroke-width="2"/>
  <line x1="256" y1="312" x2="244" y2="318" stroke="#2b3a42" stroke-width="2"/>
  <line x1="256" y1="312" x2="268" y2="318" stroke="#2b3a42" stroke-width="2"/>

  <!-- quadrant 1: top-left -->
  <rect x="24" y="24" width="208" height="196" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="128" y="52" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#222222">Sense &amp; Respond</text>
  <text x="128" y="86" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">nervous system</text>
  <text x="128" y="106" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">fight · flight · rest</text>
  <!-- small eye icon -->
  <circle cx="128" cy="152" r="26" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="128" cy="152" r="9" fill="#2b3a42"/>

  <!-- quadrant 2: top-right -->
  <rect x="280" y="24" width="208" height="196" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="384" y="52" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#222222">Unwind</text>
  <text x="384" y="86" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">stress &amp; calm</text>
  <text x="384" y="106" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">ways back to rest</text>
  <!-- waves / breath -->
  <path d="M356 160 q8 -12 16 0 q8 12 16 0 q8 -12 16 0" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M356 178 q8 -12 16 0 q8 12 16 0 q8 -12 16 0" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>

  <!-- quadrant 3: bottom-left -->
  <rect x="24" y="292" width="208" height="196" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="128" y="320" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#222222">Move with Purpose</text>
  <text x="128" y="354" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">strength · endurance</text>
  <text x="128" y="374" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">flexibility</text>
  <!-- simple flexed arm (muscle) -->
  <path d="M104 430 Q128 402 152 430" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <circle cx="128" cy="420" r="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  <!-- quadrant 4: bottom-right -->
  <rect x="280" y="292" width="208" height="196" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <text x="384" y="320" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#222222">Play Fair</text>
  <text x="384" y="354" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">fair play &amp; inclusion</text>
  <text x="384" y="374" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">welcome every body</text>
  <!-- two joined hands -->
  <path d="M368 428 q8 -14 18 -8 l6 6" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M400 428 q-8 -14 -18 -8 l-6 6" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>

  <!-- connector lines from center to quadrants -->
  <line x1="200" y1="180" x2="176" y2="196" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  <line x1="312" y1="180" x2="336" y2="196" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="332" x2="176" y2="316" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  <line x1="312" y1="332" x2="336" y2="316" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
</svg>
