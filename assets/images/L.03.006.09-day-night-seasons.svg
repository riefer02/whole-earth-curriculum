<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" font-family="sans-serif">
  <title>Day, night, and the seasons</title>
  <desc>A diagram of the Earth spinning on a tilted axis with the Sun shining on one side. The lit side is labeled day, the dark side is labeled night. Below, a small tilted-orbit drawing shows the Earth traveling around the Sun, labeled the tilt makes the seasons.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-size="26" fill="#222222" font-weight="bold">Day, night, and the seasons</text>

  <!-- Sun -->
  <circle cx="92" cy="150" r="34" fill="#e0a458"/>
  <g stroke="#e0a458" stroke-width="5" stroke-linecap="round">
    <line x1="92" y1="100" x2="92" y2="84"/>
    <line x1="92" y1="200" x2="92" y2="216"/>
    <line x1="42" y1="150" x2="26" y2="150"/>
    <line x1="142" y1="150" x2="158" y2="150"/>
    <line x1="57" y1="115" x2="46" y2="104"/>
    <line x1="127" y1="115" x2="138" y2="104"/>
    <line x1="57" y1="185" x2="46" y2="196"/>
    <line x1="127" y1="185" x2="138" y2="196"/>
  </g>

  <!-- sun rays -->
  <line x1="126" y1="150" x2="196" y2="150" stroke="#e0a458" stroke-width="4" opacity="0.6"/>
  <line x1="120" y1="132" x2="188" y2="128" stroke="#e0a458" stroke-width="3" opacity="0.5"/>
  <line x1="120" y1="168" x2="188" y2="172" stroke="#e0a458" stroke-width="3" opacity="0.5"/>

  <!-- Earth -->
  <circle cx="286" cy="150" r="58" fill="#6b93b6"/>
  <!-- axis (tilted) -->
  <line x1="262" y1="206" x2="310" y2="94" stroke="#2b3a42" stroke-width="3"/>
  <!-- lit half (day) -->
  <path d="M286 92 A58 58 0 0 1 286 208 A58 58 0 0 1 286 92 Z" fill="#7a9e7e"/>
  <text x="318" y="140" text-anchor="middle" font-size="15" fill="#fdfbf7" font-weight="bold">day</text>
  <text x="248" y="150" text-anchor="middle" font-size="15" fill="#fdfbf7" font-weight="bold">night</text>
  <!-- you dot -->
  <circle cx="326" cy="150" r="5" fill="#e0a458"/>
  <text x="344" y="154" font-size="13" fill="#222222">you</text>
  <text x="286" y="244" text-anchor="middle" font-size="15" fill="#2b3a42" font-weight="bold">Earth rotates — day and night</text>

  <!-- orbit diagram -->
  <ellipse cx="256" cy="360" rx="150" ry="44" fill="none" stroke="#4f6d7a" stroke-width="3"/>
  <!-- Sun center -->
  <circle cx="256" cy="360" r="16" fill="#e0a458"/>
  <!-- Earths on orbit -->
  <circle cx="406" cy="360" r="14" fill="#6b93b6"/>
  <circle cx="106" cy="360" r="14" fill="#6b93b6"/>
  <circle cx="256" cy="316" r="14" fill="#6b93b6"/>
  <circle cx="256" cy="404" r="14" fill="#6b93b6"/>
  <!-- tilt lines -->
  <line x1="406" y1="344" x2="406" y2="376" stroke="#2b3a42" stroke-width="2"/>
  <line x1="106" y1="344" x2="106" y2="376" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="452" text-anchor="middle" font-size="15" fill="#2b3a42" font-weight="bold">Earth orbits, tilted — the seasons</text>

  <text x="256" y="492" text-anchor="middle" font-size="14" fill="#4f6d7a">One turn = a day. One trip around the Sun = a year.</text>
</svg>
