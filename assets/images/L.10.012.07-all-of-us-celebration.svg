<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title>All of us: celebration, community, and the living Earth</title>
  <desc>A diverse circle of people joins hands around a living tree on a small green hill, while a rising sun glows behind them, its rays reaching toward the words 'Grade 11'. The scene is calm and hopeful, a community standing together around the living Earth and looking ahead.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <!-- sun -->
  <circle cx="256" cy="120" r="54" fill="#e0a458" opacity="0.6"/>
  <circle cx="256" cy="120" r="42" fill="#e0a458"/>
  <g stroke="#e0a458" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="54" x2="256" y2="34"/>
    <line x1="304" y1="70" x2="322" y2="54"/>
    <line x1="208" y1="70" x2="190" y2="54"/>
    <line x1="312" y1="120" x2="332" y2="120"/>
    <line x1="200" y1="120" x2="180" y2="120"/>
  </g>
  <!-- hill -->
  <ellipse cx="256" cy="470" rx="220" ry="56" fill="#7a9e7e"/>
  <!-- tree -->
  <g stroke="#2b3a42" stroke-width="3" fill="none">
    <rect x="248" y="300" width="16" height="70" fill="#8a5a3b"/>
    <circle cx="256" cy="286" r="52" fill="#7a9e7e"/>
    <circle cx="226" cy="270" r="26" fill="#6b93b6"/>
    <circle cx="286" cy="270" r="26" fill="#7a9e7e"/>
  </g>
  <!-- people in a circle holding hands -->
  <g stroke="#2b3a42" stroke-width="3" fill="none">
    <circle cx="150" cy="380" r="17" fill="#c98d5f"/>
    <path d="M 150 397 q -3 15 -15 17 l 0 34 q 0 5 4 5 l 22 0 q 4 0 4 -5 l 0 -34 q -12 -2 -15 -17 z" fill="#7a9e7e"/>
    <circle cx="362" cy="380" r="17" fill="#8a5a3b"/>
    <path d="M 362 397 q 3 15 15 17 l 0 34 q 0 5 -4 5 l -22 0 q -4 0 -4 -5 l 0 -34 q 12 -2 15 -17 z" fill="#6b93b6"/>
    <circle cx="110" cy="452" r="15" fill="#c98d5f"/>
    <path d="M 110 467 q -3 13 -13 15 l 0 28 q 0 4 3 4 l 18 0 q 4 0 4 -4 l 0 -28 q -10 -2 -13 -15 z" fill="#e0a458"/>
    <circle cx="402" cy="452" r="15" fill="#c98d5f"/>
    <path d="M 402 467 q 3 13 13 15 l 0 28 q 0 4 -3 4 l -18 0 q -4 0 -4 -4 l 0 -28 q 10 -2 13 -15 z" fill="#7a9e7e"/>
  </g>
  <!-- joined hands lines -->
  <g stroke="#2b3a42" stroke-width="3" fill="none">
    <path d="M 166 388 q 20 6 36 16"/>
    <path d="M 346 388 q -20 6 -36 16"/>
    <path d="M 124 456 q 22 8 44 4"/>
    <path d="M 388 456 q -22 8 -44 4"/>
    <path d="M 167 386 q 12 34 -6 52"/>
    <path d="M 345 386 q -12 34 6 52"/>
  </g>
  <!-- Grade 11 -->
  <g font-family="sans-serif" font-size="30" fill="#222222" text-anchor="middle">
    <text x="256" y="168" font-size="26" fill="#4f6d7a">looking ahead</text>
    <text x="256" y="196" font-weight="bold">Grade 11</text>
  </g>
</svg>
