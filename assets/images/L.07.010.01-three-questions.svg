<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Three questions for a moral question</title>
  <desc id="desc">A central box reads "a moral question" with three labeled boxes around it: "Who is helped?", "Who is harmed?", and "What is fair?" Arrows point from the central box to each question, showing a question is examined by asking all three.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">Three questions to ask</text>

  <!-- center box -->
  <rect x="166" y="216" width="180" height="80" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="250" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">a moral</text>
  <text x="256" y="274" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">question</text>

  <!-- top box: helped -->
  <rect x="166" y="88" width="180" height="62" rx="10" fill="#7a9e7e" opacity="0.35" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="126" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">Who is helped?</text>
  <line x1="256" y1="216" x2="256" y2="150" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- left box: harmed -->
  <rect x="24" y="216" width="180" height="62" rx="10" fill="#6b93b6" opacity="0.3" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="114" y="254" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">Who is harmed?</text>
  <line x1="166" y1="247" x2="204" y2="247" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- right box: fair -->
  <rect x="308" y="216" width="180" height="62" rx="10" fill="#7a9e7e" opacity="0.35" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="398" y="254" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">What is fair?</text>
  <line x1="346" y1="247" x2="308" y2="247" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b3a42"/>
    </marker>
  </defs>

  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Ask all three — not just the one you like.</text>
</svg>
