<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Testing My Values in the World</title>
  <desc id="desc">A value written at center, with arrows pointing outward to four labeled real situations. A label below reads "test it, record what happens, revise — hold the question open, do not settle it as a creed." Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#2b3a42" font-weight="bold">Testing My Values in the World</text>

  <!-- center -->
  <ellipse cx="256" cy="220" rx="76" ry="40" fill="none" stroke="#2b3a42" stroke-width="4"/>
  <text x="256" y="226" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">one value</text>

  <!-- arrows out -->
  <line x1="256" y1="180" x2="256" y2="120" stroke="#4f6d7a" stroke-width="4"/>
  <line x1="332" y1="220" x2="420" y2="200" stroke="#4f6d7a" stroke-width="4"/>
  <line x1="256" y1="260" x2="256" y2="330" stroke="#4f6d7a" stroke-width="4"/>
  <line x1="180" y1="220" x2="92" y2="200" stroke="#4f6d7a" stroke-width="4"/>

  <rect x="176" y="70" width="160" height="40" rx="6" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <text x="256" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">a real situation that will test it</text>

  <rect x="360" y="176" width="130" height="48" rx="6" fill="none" stroke="#e0a458" stroke-width="3"/>
  <text x="425" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">what I predict</text>
  <text x="425" y="214" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">I will do</text>

  <rect x="176" y="340" width="160" height="40" rx="6" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="256" y="365" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">what actually happened</text>

  <rect x="22" y="176" width="130" height="48" rx="6" fill="none" stroke="#e0a458" stroke-width="3"/>
  <text x="87" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">record the test</text>
  <text x="87" y="214" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">and check it</text>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Test it, record what happens, revise —</text>
  <text x="256" y="476" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">hold the question open, do not settle it as a creed.</text>
</svg>
