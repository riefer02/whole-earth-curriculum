<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Drawing shapes from attributes</title>
  <desc id="desc">Two challenge cards. The first says draw a shape with four equal sides, with a square drawn below. The second says draw a shape with three angles, with a triangle drawn below.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Draw the Shape</text>

  <!-- Challenge 1 -->
  <rect x="30" y="72" width="200" height="70" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="130" y="100" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">Draw a shape with</text>
  <text x="130" y="124" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">four equal sides.</text>

  <rect x="80" y="180" width="100" height="100" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
  <text x="130" y="310" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">a square</text>

  <!-- Challenge 2 -->
  <rect x="282" y="72" width="200" height="70" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="382" y="100" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">Draw a shape with</text>
  <text x="382" y="124" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">three angles.</text>

  <polygon points="382,180 332,280 432,280" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <text x="382" y="310" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">a triangle</text>

  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#2b3a42">Draw it, then count to check:</text>
  <text x="256" y="396" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#2b3a42">sides and angles.</text>

  <text x="256" y="446" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#4f6d7a">Many drawings can be right — check the attributes, not the prettiness.</text>
</svg>
