<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Problems and the tools people made to solve them</title>
  <desc id="d">Three rows show a problem, the tool people made to solve it, and the word solved. Row one: carrying a heavy water jug is the problem, a hand pump is the tool. Row two: food too hard to cut is the problem, a knife is the tool. Row three: digging soil slowly is the problem, a hoe is the tool. Word labels carry the meaning so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222222">A problem  →  a tool  →  solved</text>

  <!-- Row 1 -->
  <rect x="16" y="66" width="150" height="120" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="91" y="92" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">PROBLEM</text>
  <circle cx="91" cy="128" r="18" fill="none" stroke="#4f6d7a" stroke-width="4"/>
  <text x="91" y="134" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">heavy</text>
  <text x="91" y="162" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">water jug</text>
  <text x="181" y="132" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#4f6d7a">→</text>

  <rect x="196" y="66" width="150" height="120" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="271" y="92" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">TOOL</text>
  <rect x="250" y="106" width="42" height="26" rx="4" fill="#6b93b6" stroke="#2b3a42" stroke-width="3"/>
  <line x1="271" y1="132" x2="271" y2="166" stroke="#2b3a42" stroke-width="5"/>
  <text x="271" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">hand pump</text>
  <text x="361" y="132" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#4f6d7a">→</text>

  <rect x="376" y="66" width="120" height="120" rx="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="4"/>
  <text x="436" y="128" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">solved</text>

  <!-- Row 2 -->
  <rect x="16" y="206" width="150" height="120" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="91" y="232" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">PROBLEM</text>
  <circle cx="91" cy="270" r="22" fill="#e0a458" stroke="#2b3a42" stroke-width="4"/>
  <text x="91" y="276" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">food too</text>
  <text x="91" y="296" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">hard to cut</text>
  <text x="181" y="272" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#4f6d7a">→</text>

  <rect x="196" y="206" width="150" height="120" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="271" y="232" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">TOOL</text>
  <polygon points="246,296 260,240 282,240 296,296" fill="#4f6d7a" stroke="#2b3a42" stroke-width="3"/>
  <rect x="263" y="296" width="16" height="22" rx="2" fill="#6b93b6" stroke="#2b3a42" stroke-width="3"/>
  <text x="271" y="326" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">knife</text>
  <text x="361" y="272" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#4f6d7a">→</text>

  <rect x="376" y="206" width="120" height="120" rx="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="4"/>
  <text x="436" y="268" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">solved</text>

  <!-- Row 3 -->
  <rect x="16" y="346" width="150" height="120" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="91" y="372" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">PROBLEM</text>
  <path d="M60 406 Q91 380 122 406 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="4"/>
  <text x="91" y="432" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">digging soil</text>
  <text x="91" y="448" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">is slow</text>
  <text x="181" y="412" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#4f6d7a">→</text>

  <rect x="196" y="346" width="150" height="120" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="4"/>
  <text x="271" y="372" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">TOOL</text>
  <line x1="240" y1="404" x2="302" y2="428" stroke="#e0a458" stroke-width="6"/>
  <line x1="302" y1="428" x2="292" y2="448" stroke="#2b3a42" stroke-width="4"/>
  <path d="M284 428 L300 436 L306 450 L294 442 Z" fill="#4f6d7a" stroke="#2b3a42" stroke-width="3"/>
  <text x="271" y="466" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">hoe</text>
  <text x="361" y="412" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#4f6d7a">→</text>

  <rect x="376" y="346" width="120" height="120" rx="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="4"/>
  <text x="436" y="408" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">solved</text>

  <text x="256" y="496" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">People make tools to solve problems.</text>
</svg>
