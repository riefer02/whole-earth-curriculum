<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t7 d7">
  <title id="t7">Media ownership concentration</title>
  <desc id="d7">Many outlet boxes at the bottom trace up through arrows into just three owner boxes at the top, showing concentration of ownership.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <rect x="72" y="40" width="120" height="64" rx="10" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <rect x="196" y="40" width="120" height="64" rx="10" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <rect x="320" y="40" width="120" height="64" rx="10" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="132" y="68" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#fdfbf7">owner A</text>
  <text x="132" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fdfbf7">(few, big)</text>
  <text x="256" y="68" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#fdfbf7">owner B</text>
  <text x="256" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fdfbf7">(few, big)</text>
  <text x="380" y="68" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#fdfbf7">owner C</text>
  <text x="380" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fdfbf7">(few, big)</text>
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <path d="M132 104 C132 150 100 150 100 190"/>
    <path d="M132 104 C132 150 164 150 164 190"/>
    <path d="M256 104 C256 150 224 150 224 190"/>
    <path d="M256 104 C256 150 288 150 288 190"/>
    <path d="M380 104 C380 150 348 150 348 190"/>
    <path d="M380 104 C380 150 412 150 412 190"/>
  </g>
  <g fill="#7a9e7e" stroke="#2b3a42" stroke-width="2">
    <rect x="74" y="190" width="52" height="52" rx="6"/>
    <rect x="138" y="190" width="52" height="52" rx="6"/>
    <rect x="198" y="190" width="52" height="52" rx="6"/>
    <rect x="262" y="190" width="52" height="52" rx="6"/>
    <rect x="322" y="190" width="52" height="52" rx="6"/>
    <rect x="386" y="190" width="52" height="52" rx="6"/>
  </g>
  <text x="100" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">outlet</text>
  <text x="164" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">outlet</text>
  <text x="224" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">outlet</text>
  <text x="288" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">outlet</text>
  <text x="348" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">outlet</text>
  <text x="412" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">outlet</text>
  <text x="256" y="290" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">Many names, few owners</text>
  <text x="256" y="318" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">= concentration</text>
  <text x="256" y="356" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">Variety that is not real</text>
</svg>
