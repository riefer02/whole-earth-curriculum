<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Sorting into groups: round or pointy, and which has more</title>
  <desc id="desc">A mixed collection is sorted into two dashed rings. The left ring holds four round pebbles and is labeled round; the right ring holds three pointed leaves and is labeled pointy. Below, the two groups are lined up one-to-one with dotted lines, showing that one round pebble has no partner, so round has more. A caption says "more" is a fact, not a worth. Shapes, labels, and numbers carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Sorting Into Groups</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Sort by one feature: round or pointy.</text>

  <!-- Left ring: round -->
  <circle cx="150" cy="205" r="92" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="10 7"/>
  <g fill="#6b93b6" stroke="#2b3a42" stroke-width="2">
    <ellipse cx="118" cy="180" rx="22" ry="15"/>
    <ellipse cx="186" cy="168" rx="20" ry="14"/>
    <ellipse cx="110" cy="240" rx="21" ry="14"/>
    <ellipse cx="184" cy="244" rx="20" ry="14"/>
  </g>

  <!-- Right ring: pointy -->
  <circle cx="362" cy="205" r="92" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="10 7"/>
  <g fill="#7a9e7e" stroke="#2b3a42" stroke-width="2">
    <path d="M340 166 q14 16 0 32 q-14 -16 0 -32 z"/>
    <path d="M398 172 q14 16 0 32 q-14 -16 0 -32 z"/>
    <path d="M368 232 q14 16 0 32 q-14 -16 0 -32 z"/>
  </g>

  <!-- Ring labels -->
  <text x="150" y="322" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">round</text>
  <text x="150" y="344" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">4</text>
  <text x="362" y="322" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">pointy</text>
  <text x="362" y="344" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">3</text>

  <!-- One-to-one comparison -->
  <text x="256" y="382" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Line them up one-to-one — round has more</text>

  <g fill="#6b93b6" stroke="#2b3a42" stroke-width="2">
    <ellipse cx="120" cy="408" rx="20" ry="13"/>
    <ellipse cx="184" cy="408" rx="20" ry="13"/>
    <ellipse cx="248" cy="408" rx="20" ry="13"/>
    <ellipse cx="312" cy="408" rx="20" ry="13"/>
  </g>
  <g fill="#7a9e7e" stroke="#2b3a42" stroke-width="2">
    <path d="M152 444 q10 11 0 22 q-10 -11 0 -22 z"/>
    <path d="M216 444 q10 11 0 22 q-10 -11 0 -22 z"/>
    <path d="M280 444 q10 11 0 22 q-10 -11 0 -22 z"/>
  </g>
  <g stroke="#4f6d7a" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="120" y1="421" x2="152" y2="436"/>
    <line x1="184" y1="421" x2="216" y2="436"/>
    <line x1="248" y1="421" x2="280" y2="436"/>
  </g>
  <text x="348" y="400" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e0a458">one more</text>
  <line x1="342" y1="402" x2="332" y2="406" stroke="#e0a458" stroke-width="2" stroke-linecap="round"/>

  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">"More" is a fact, not a worth — every group is just a group.</text>
</svg>
