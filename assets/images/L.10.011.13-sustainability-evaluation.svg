<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t13 d13">
  <title id="t13">Evaluating a sustainability solution</title>
  <desc id="d13">A sustainability solution at the top sends arrows into three labeled columns: benefits, limits, and fairness.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <rect x="96" y="40" width="320" height="64" rx="12" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fdfbf7">a sustainability solution</text>
  <text x="256" y="88" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fdfbf7">(restoration, circular scheme, commons)</text>
  <path d="M160 104 L110 180 M256 104 L256 180 M352 104 L402 180" stroke="#2b3a42" stroke-width="3" fill="none"/>
  <rect x="40" y="180" width="140" height="230" rx="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="186" y="180" width="140" height="230" rx="12" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <rect x="332" y="180" width="140" height="230" rx="12" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="110" y="212" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">benefits</text>
  <text x="256" y="212" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">limits</text>
  <text x="402" y="212" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">fairness</text>
  <text x="110" y="244" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">what good</text>
  <text x="110" y="264" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">it does</text>
  <text x="256" y="244" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">what it</text>
  <text x="256" y="264" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">cannot do</text>
  <text x="402" y="244" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">who gains,</text>
  <text x="402" y="264" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">who pays</text>
  <text x="110" y="312" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">shade, soil,</text>
  <text x="110" y="332" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">income, clean</text>
  <text x="110" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">water</text>
  <text x="256" y="312" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">takes years,</text>
  <text x="256" y="332" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">may harm,</text>
  <text x="256" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">costs money</text>
  <text x="402" y="312" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">land owners,</text>
  <text x="402" y="332" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">workers,</text>
  <text x="402" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">who is left out</text>
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">Ask all three before you decide</text>
</svg>
