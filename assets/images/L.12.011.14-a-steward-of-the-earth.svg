<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A Steward of the Earth</title>
  <desc id="desc">A four-direction compass. North reads 'care for technology,' east reads 'honest media,' south reads 'the living world,' west reads 'shared action.' The center reads 'for all life.' Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42" font-weight="bold">The Steward's Compass</text>

  <!-- compass circle -->
  <circle cx="256" cy="270" r="150" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="256" cy="270" r="64" fill="none" stroke="#2b3a42" stroke-width="3"/>

  <!-- center -->
  <text x="256" y="266" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42" font-weight="bold">for</text>
  <text x="256" y="288" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42" font-weight="bold">all life</text>

  <!-- north -->
  <line x1="256" y1="270" x2="256" y2="120" stroke="#2b3a42" stroke-width="2"/>
  <path d="M 248 128 L 256 112 L 264 128" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#6b93b6" font-weight="bold">care for technology</text>

  <!-- east -->
  <line x1="256" y1="270" x2="406" y2="270" stroke="#2b3a42" stroke-width="2"/>
  <path d="M 398 262 L 414 270 L 398 278" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <text x="420" y="268" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#7a9e7e" font-weight="bold">honest media</text>

  <!-- south -->
  <line x1="256" y1="270" x2="256" y2="420" stroke="#2b3a42" stroke-width="2"/>
  <path d="M 248 412 L 256 428 L 264 412" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e0a458" font-weight="bold">the living world</text>

  <!-- west -->
  <line x1="256" y1="270" x2="106" y2="270" stroke="#2b3a42" stroke-width="2"/>
  <path d="M 114 262 L 98 270 L 114 278" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <text x="92" y="268" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a" font-weight="bold">shared action</text>

  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">individually and with others, for all life.</text>
</svg>
