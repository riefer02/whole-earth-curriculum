<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Drafting into paragraphs: from plan to draft</title>
  <desc id="desc">On the left, a plan web with three branches. On the right, a sheet of paper being written into three labeled paragraph blocks, with a hand holding a pencil. This shows how a plan becomes a draft of paragraphs. Simple shapes, grayscale-printable.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">From Plan to Draft</text>

  <!-- Plan web -->
  <g>
    <circle cx="120" cy="170" r="34" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="120" y="166" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">plan</text>
    <circle cx="120" cy="90" r="20" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="56" cy="190" r="20" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="120" cy="250" r="20" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#4f6d7a" stroke-width="2">
      <line x1="120" y1="136" x2="120" y2="110"/>
      <line x1="98" y1="184" x2="76" y2="190"/>
      <line x1="120" y1="204" x2="120" y2="230"/>
    </g>
    <text x="120" y="306" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">plan</text>
  </g>

  <!-- Arrow -->
  <path d="M176 170 L216 170" stroke="#4f6d7a" stroke-width="3"/>
  <path d="M208 162 L218 170 L208 178" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Draft page -->
  <g>
    <rect x="236" y="76" width="236" height="300" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="256" y="96" width="196" height="70" rx="6" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <text x="266" y="118" font-family="sans-serif" font-size="15" fill="#4f6d7a">paragraph 1</text>
    <line x1="266" y1="132" x2="440" y2="132" stroke="#c7cfd3" stroke-width="2"/>
    <line x1="266" y1="146" x2="430" y2="146" stroke="#c7cfd3" stroke-width="2"/>

    <rect x="256" y="178" width="196" height="70" rx="6" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <text x="266" y="200" font-family="sans-serif" font-size="15" fill="#4f6d7a">paragraph 2</text>
    <line x1="266" y1="214" x2="440" y2="214" stroke="#c7cfd3" stroke-width="2"/>
    <line x1="266" y1="228" x2="430" y2="228" stroke="#c7cfd3" stroke-width="2"/>

    <rect x="256" y="260" width="196" height="70" rx="6" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <text x="266" y="282" font-family="sans-serif" font-size="15" fill="#4f6d7a">paragraph 3</text>
    <line x1="266" y1="296" x2="440" y2="296" stroke="#c7cfd3" stroke-width="2"/>
    <line x1="266" y1="310" x2="430" y2="310" stroke="#c7cfd3" stroke-width="2"/>
  </g>

  <!-- Hand with pencil -->
  <g>
    <path d="M420 396 L440 372 L456 388 L436 412 Z" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <rect x="444" y="360" width="8" height="48" rx="3" transform="rotate(38 448 384)" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="442" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42">One paragraph per idea, in order.</text>
  </g>
</svg>
