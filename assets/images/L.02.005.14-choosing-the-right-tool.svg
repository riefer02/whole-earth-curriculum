<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Choosing the right measuring tool</title>
  <desc id="desc">Three measuring tasks matched to tools: a small seed measured with a ruler, a book measured with a ruler, and a long room measured with a meter stick or measuring tape, with the rule small things small units, big things big units.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Choose the Right Tool</text>

  <!-- Seed + ruler -->
  <g>
    <ellipse cx="90" cy="130" rx="26" ry="16" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="120" y="176" width="150" height="36" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <line x1="120" y1="176" x2="120" y2="196" stroke="#2b3a42" stroke-width="2"/>
    <line x1="150" y1="176" x2="150" y2="188" stroke="#2b3a42" stroke-width="2"/>
    <line x1="180" y1="176" x2="180" y2="188" stroke="#2b3a42" stroke-width="2"/>
    <line x1="210" y1="176" x2="210" y2="188" stroke="#2b3a42" stroke-width="2"/>
    <line x1="240" y1="176" x2="240" y2="188" stroke="#2b3a42" stroke-width="2"/>
    <text x="180" y="240" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">a seed → a ruler</text>
  </g>

  <!-- Book + ruler -->
  <g>
    <rect x="320" y="120" width="70" height="90" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="320" y="120" width="70" height="14" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <rect x="400" y="176" width="80" height="36" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="372" y="240" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">a book → a ruler</text>
  </g>

  <!-- Room + meter stick / tape -->
  <g>
    <rect x="60" y="300" width="220" height="110" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <line x1="60" y1="300" x2="280" y2="410" stroke="#2b3a42" stroke-width="2"/>
    <rect x="60" y="300" width="220" height="26" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="160" y="356" width="40" height="54" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <text x="170" y="440" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">a room → a meter stick</text>
  </g>

  <g>
    <rect x="320" y="300" width="14" height="180" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#2b3a42" stroke-width="2">
      <line x1="320" y1="320" x2="334" y2="320"/>
      <line x1="320" y1="360" x2="334" y2="360"/>
      <line x1="320" y1="400" x2="334" y2="400"/>
      <line x1="320" y1="440" x2="334" y2="440"/>
    </g>
    <text x="380" y="410" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">or a measuring tape</text>
  </g>

  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#e0a458">Small things, small units. Big things, big units.</text>
</svg>
