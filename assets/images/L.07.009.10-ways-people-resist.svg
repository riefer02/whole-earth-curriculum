<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Five forms of resistance</title>
  <desc id="desc">A circle with five labeled spokes: protest, boycott, refusal, art, storytelling. Each spoke has a small icon. The center reads "how people choose." The picture shows that resistance takes many forms, chosen for different reasons.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="52" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">Many ways to resist</text>

  <!-- center -->
  <circle cx="256" cy="256" r="54" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="248" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">how people</text>
  <text x="256" y="270" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">choose</text>

  <!-- protest (top) -->
  <g>
    <line x1="256" y1="202" x2="256" y2="150" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="216" y="110" width="80" height="40" rx="8" fill="#6b93b6" opacity="0.3" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="136" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">protest</text>
    <rect x="248" y="86" width="6" height="24" fill="#2b3a42"/>
    <rect x="256" y="82" width="30" height="16" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  </g>

  <!-- boycott (right) -->
  <g>
    <line x1="310" y1="256" x2="360" y2="256" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="360" y="236" width="92" height="40" rx="8" fill="#7a9e7e" opacity="0.35" stroke="#2b3a42" stroke-width="2"/>
    <text x="406" y="262" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">boycott</text>
    <path d="M382 216 L396 200" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <path d="M396 200 L420 200" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- refusal (bottom) -->
  <g>
    <line x1="256" y1="310" x2="256" y2="358" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="216" y="358" width="80" height="40" rx="8" fill="#e0a458" opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="384" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">refusal</text>
  </g>

  <!-- art (left) -->
  <g>
    <line x1="202" y1="256" x2="152" y2="256" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="60" y="236" width="92" height="40" rx="8" fill="#6b93b6" opacity="0.3" stroke="#2b3a42" stroke-width="2"/>
    <text x="106" y="262" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">art</text>
    <circle cx="106" cy="212" r="12" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- storytelling (top-left) -->
  <g>
    <line x1="216" y1="220" x2="180" y2="186" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="76" y="122" width="110" height="40" rx="8" fill="#7a9e7e" opacity="0.35" stroke="#2b3a42" stroke-width="2"/>
    <text x="131" y="148" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">storytelling</text>
  </g>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">People choose the form that fits their goal, risk, and community.</text>
</svg>
