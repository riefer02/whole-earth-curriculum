<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Rules and routines that work for everyone</title>
  <desc id="desc">Two side-by-side scenes of the same classroom. On the left, labeled "without a routine," children crowd and push at a single water cup while one child is left out at the back. On the right, labeled "with a routine," the same children form an orderly line and each takes a turn, so everyone gets a drink. Small labels name what a routine does — take turns, share, listen, tidy up. The closing line teaches that rules and routines help a community work fairly, so no one is left out. Children vary in skin tone, hair, and dress; one uses a wheelchair. Everything reads in grayscale and by label, not color alone.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">Rules and Routines That Work</text>
  <text x="256" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">for everyone — fairly</text>

  <!-- left panel: without a routine -->
  <rect x="16" y="84" width="232" height="280" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="132" y="112" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#8a4b3a">without a routine</text>

  <g>
    <circle cx="110" cy="150" r="16" fill="#d9a06b" stroke="#2b3a42" stroke-width="2"/>
    <path d="M98 150 A12 12 0 0 1 122 150 L122 142 A12 12 0 0 0 98 142 Z" fill="#2b3a42"/>
    <circle cx="105" cy="149" r="2" fill="#2b3a42"/>
    <circle cx="115" cy="149" r="2" fill="#2b3a42"/>
    <path d="M104 156 Q110 159 116 156" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>

    <circle cx="150" cy="152" r="16" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M138 152 A12 12 0 0 1 162 152 L162 144 A12 12 0 0 0 138 144 Z" fill="#4f6d7a"/>
    <circle cx="145" cy="151" r="2" fill="#2b3a42"/>
    <circle cx="155" cy="151" r="2" fill="#2b3a42"/>
    <path d="M144 158 Q150 161 156 158" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>

    <circle cx="74" cy="154" r="16" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M62 154 A12 12 0 0 1 86 154 L86 146 A12 12 0 0 0 62 146 Z" fill="#e0a458"/>
    <circle cx="69" cy="153" r="2" fill="#2b3a42"/>
    <circle cx="79" cy="153" r="2" fill="#2b3a42"/>
    <path d="M68 160 Q74 163 80 160" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>

    <!-- crowd arms toward cup -->
    <line x1="120" y1="168" x2="132" y2="196" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="96" y1="166" x2="130" y2="200" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="158" y1="168" x2="134" y2="198" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>

    <!-- cup -->
    <rect x="126" y="196" width="18" height="22" rx="3" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>

    <!-- left out child -->
    <circle cx="210" cy="250" r="16" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M198 250 A12 12 0 0 1 222 250 L222 242 A12 12 0 0 0 198 242 Z" fill="#7a9e7e"/>
    <circle cx="205" cy="249" r="2" fill="#2b3a42"/>
    <circle cx="215" cy="249" r="2" fill="#2b3a42"/>
    <path d="M204 258 Q210 253 216 258" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>
    <text x="210" y="282" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a4b3a">left out</text>
  </g>

  <!-- right panel: with a routine -->
  <rect x="264" y="84" width="232" height="280" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="380" y="112" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#3a6b4a">with a routine</text>

  <g>
    <!-- line of children -->
    <circle cx="300" cy="150" r="16" fill="#d9a06b" stroke="#2b3a42" stroke-width="2"/>
    <path d="M288 150 A12 12 0 0 1 312 150 L312 142 A12 12 0 0 0 288 142 Z" fill="#2b3a42"/>
    <circle cx="295" cy="149" r="2" fill="#2b3a42"/>
    <circle cx="305" cy="149" r="2" fill="#2b3a42"/>
    <path d="M294 156 Q300 159 306 156" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>

    <circle cx="338" cy="150" r="16" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M326 150 A12 12 0 0 1 350 150 L350 142 A12 12 0 0 0 326 142 Z" fill="#4f6d7a"/>
    <circle cx="333" cy="149" r="2" fill="#2b3a42"/>
    <circle cx="343" cy="149" r="2" fill="#2b3a42"/>
    <path d="M332 156 Q338 159 344 156" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>

    <!-- wheelchair child -->
    <circle cx="376" cy="150" r="16" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M364 150 A12 12 0 0 1 388 150 L388 142 A12 12 0 0 0 364 142 Z" fill="#e0a458"/>
    <circle cx="371" cy="149" r="2" fill="#2b3a42"/>
    <circle cx="381" cy="149" r="2" fill="#2b3a42"/>
    <path d="M370 156 Q376 159 382 156" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="364" y="166" width="26" height="30" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="368" cy="196" r="5" fill="#2b3a42"/>
    <circle cx="386" cy="196" r="5" fill="#2b3a42"/>

    <!-- cup with one child reaching -->
    <rect x="330" y="196" width="18" height="22" rx="3" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="310" y1="166" x2="336" y2="200" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>

    <text x="380" y="234" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a6b4a">everyone waits</text>
    <text x="380" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a6b4a">and gets a turn</text>

    <!-- labels -->
    <text x="312" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">take turns</text>
    <text x="380" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">share</text>
    <text x="448" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">listen</text>
  </g>

  <text x="256" y="392" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">rules and routines are not bossy orders —</text>
  <text x="256" y="412" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">they are how we make sure no one is left out.</text>

  <text x="256" y="508" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Rules and routines help a community work fairly for everyone.</text>
</svg>
