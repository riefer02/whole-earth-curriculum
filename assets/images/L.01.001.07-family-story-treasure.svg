    <line x1="413" y1="376" x2="415" y2="396" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <circle cx="462" cy="316" r="15" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
