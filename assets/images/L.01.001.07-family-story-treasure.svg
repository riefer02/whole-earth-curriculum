    <circle cx="468" cy="314" r="2" fill="#2b3a42"/>
    <path d="M456 326 Q462 330 468 326" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="451" y="334" width="22" height="42" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="455" y1="376" x2="453" y2="396" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="469" y1="376" x2="471" y2="396" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <circle cx="434" cy="350" r="10" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M428 345 A10 10 0 0 1 440 345 Z" fill="#2b3a42"/>
    <circle cx="430" cy="348" r="1.6" fill="#2b3a42"/>
    <circle cx="438" cy="348" r="1.6" fill="#2b3a42"/>
    <path d="M430 355 Q434 358 438 355" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="426" y="360" width="16" height="26" rx="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="430" y1="386" x2="428" y2="396" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="438" y1="386" x2="440" y2="396" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <text x="421" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">two grown-ups and me</text>
  </g>

  <!-- Bottom note -->
  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Every family's story is a treasure worth telling.</text>
</svg>
