    <rect x="110" y="358" width="16" height="28" rx="7" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="114" y1="386" x2="112" y2="398" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="122" y1="386" x2="124" y2="398" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <text x="91" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">one grown-up and me</text>
  </g>

  <!-- Family card 2: my grandparent and me -->
  <g>
    <rect x="181" y="252" width="150" height="156" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
