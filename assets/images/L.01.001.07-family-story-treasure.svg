    <line x1="222" y1="338" x2="219" y2="396" stroke="#4f6d7a" stroke-width="4" stroke-linecap="round"/>
    <path d="M214 396 Q219 401 224 396" fill="none" stroke="#4f6d7a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="283" cy="346" r="10" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M277 341 A10 10 0 0 1 289 341 Z" fill="#2b3a42"/>
    <circle cx="279" cy="344" r="1.6" fill="#2b3a42"/>
    <circle cx="287" cy="344" r="1.6" fill="#2b3a42"/>
    <path d="M279 351 Q283 354 287 351" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="275" y="357" width="16" height="26" rx="7" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="279" y1="383" x2="277" y2="396" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="287" y1="383" x2="289" y2="396" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <text x="256" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">my grandparent and me</text>
  </g>

  <!-- Family card 3: two grown-ups and me -->
  <g>
    <rect x="346" y="252" width="150" height="156" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="406" cy="316" r="15" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M396 310 A15 15 0 0 1 416 310 Z" fill="#2b3a42"/>
    <circle cx="400" cy="314" r="2" fill="#2b3a42"/>
    <circle cx="412" cy="314" r="2" fill="#2b3a42"/>
    <path d="M400 326 Q406 330 412 326" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
