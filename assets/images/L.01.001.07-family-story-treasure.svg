<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Our family stories and traditions</title>
  <desc id="desc">Two rows of cards. The top row shows four ways a family carries a tradition: a bowl of food for a shared meal, a music note for a song, an open book for a story, and a candle for a special day. The bottom row shows three different family shapes: one grown-up and a child; a grandparent with glasses and a cane and a child; and two grown-ups and a child, one grown-up wearing a hearing aid. Skin tones and hair vary. The labels and shapes, not color, carry the meaning so it prints clearly in grayscale, and the graphic shows that every family shape and every tradition is worth telling.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Our Family Stories &amp; Traditions</text>

  <!-- Row 1 label -->
  <text x="256" y="76" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">traditions come in many forms</text>

  <!-- Card 1: a shared meal -->
  <g>
    <rect x="16" y="88" width="108" height="120" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M48 156 Q70 138 92 156 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M58 136 Q62 124 66 136 M72 136 Q76 124 80 136" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="70" y="194" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">a shared meal</text>
  </g>

  <!-- Card 2: a song -->
  <g>
    <rect x="140" y="88" width="108" height="120" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="194" cy="140" r="11" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="202" y1="150" x2="202" y2="176" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <path d="M202 176 Q214 170 216 158" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <path d="M176 150 Q180 142 184 150" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="194" y="194" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">a song</text>
  </g>

  <!-- Card 3: a story -->
  <g>
    <rect x="264" y="88" width="108" height="120" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M300 128 Q318 122 336 128 L336 166 Q318 160 300 166 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="318" y1="128" x2="318" y2="166" stroke="#2b3a42" stroke-width="2"/>
    <line x1="304" y1="140" x2="312" y2="140" stroke="#2b3a42" stroke-width="1.8"/>
    <line x1="304" y1="148" x2="312" y2="148" stroke="#2b3a42" stroke-width="1.8"/>
    <line x1="324" y1="140" x2="332" y2="140" stroke="#2b3a42" stroke-width="1.8"/>
    <line x1="324" y1="148" x2="332" y2="148" stroke="#2b3a42" stroke-width="1.8"/>
    <text x="318" y="194" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">a story</text>
  </g>

  <!-- Card 4: a special day -->
  <g>
    <rect x="388" y="88" width="108" height="120" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <rect x="430" y="148" width="24" height="32" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="442" y1="144" x2="442" y2="138" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="442" cy="132" rx="5" ry="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="442" y="194" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">a special day</text>
  </g>

  <!-- Row 2 label -->
  <text x="256" y="238" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">families come in many shapes</text>

  <!-- Family card 1: one grown-up and me -->
  <g>
    <rect x="16" y="252" width="150" height="156" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="80" cy="316" r="16" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M70 310 A16 16 0 0 1 90 310 Z" fill="#2b3a42"/>
    <circle cx="74" cy="314" r="2" fill="#2b3a42"/>
    <circle cx="86" cy="314" r="2" fill="#2b3a42"/>
