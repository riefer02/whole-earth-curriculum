<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The path to purpose</title>
  <desc id="desc">A winding path climbs from a small figure at the lower left toward a sun on the horizon at the upper right, labeled "purpose: a direction, not a destination." The path has two looping detours labeled "try" and "try again," and two signposts labeled "reflect" and "learn." Labels and shapes carry the meaning, so the diagram prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">The Path to Purpose</text>

  <!-- Sun / horizon -->
  <circle cx="432" cy="150" r="30" fill="#fdfbf7" stroke="#e0a458" stroke-width="3"/>
  <path d="M396 206 h72" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
  <text x="432" y="96" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">purpose: a direction,</text>
  <text x="432" y="118" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">not a destination</text>

  <!-- Winding path -->
  <path d="M72 430 C 150 430 120 340 210 340 C 300 340 250 250 340 240 C 390 234 400 200 432 200" fill="none" stroke="#4f6d7a" stroke-width="5" stroke-linecap="round"/>

  <!-- Detour loops -->
  <path d="M150 408 c40 -30 40 -78 0 -70" fill="none" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
  <text x="150" y="392" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">try</text>

  <path d="M296 316 c40 26 40 74 0 66" fill="none" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
  <text x="296" y="300" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">try again</text>

  <!-- Signposts -->
  <g>
    <path d="M222 350 l0 -40" stroke="#2b3a42" stroke-width="3"/>
    <rect x="186" y="300" width="72" height="24" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="222" y="317" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">reflect</text>
  </g>
  <g>
    <path d="M366 246 l0 -40" stroke="#2b3a42" stroke-width="3"/>
    <rect x="330" y="196" width="72" height="24" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="366" y="213" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">learn</text>
  </g>

  <!-- The traveler -->
  <circle cx="72" cy="418" r="16" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <path d="M58 452 a14 14 0 0 1 28 0 z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>

  <text x="256" y="488" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">Purpose grows by trying and reflecting — not by being certain at once.</text>
</svg>
