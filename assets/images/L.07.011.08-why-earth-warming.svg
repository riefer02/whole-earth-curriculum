<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The greenhouse effect</title>
  <desc id="desc">A diagram of the greenhouse effect. The Sun is at the top, sending energy arrows down to the Earth's surface. A layer of greenhouse gases surrounds the Earth, and some heat arrows bounce back down, labeled "heat is trapped". A note reads "greenhouse gases trap heat".</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">The greenhouse effect</text>

  <!-- sun -->
  <circle cx="256" cy="96" r="34" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
  <g stroke="#e0a458" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="46" x2="256" y2="30"/>
    <line x1="256" y1="146" x2="256" y2="162"/>
    <line x1="206" y1="96" x2="190" y2="96"/>
    <line x1="306" y1="96" x2="322" y2="96"/>
  </g>

  <!-- incoming energy -->
  <g stroke="#2b3a42" stroke-width="2.5" fill="none">
    <path d="M232 126 C220 190 230 250 250 300" marker-end="url(#ar8)"/>
    <path d="M256 130 L256 300" marker-end="url(#ar8)"/>
    <path d="M280 126 C290 190 282 250 266 300" marker-end="url(#ar8)"/>
  </g>

  <!-- atmosphere / gas layer -->
  <ellipse cx="256" cy="330" rx="190" ry="52" fill="none" stroke="#6b93b6" stroke-width="6" opacity="0.8"/>
  <ellipse cx="256" cy="330" rx="190" ry="52" fill="#6b93b6" opacity="0.18"/>
  <text x="256" y="322" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">layer of greenhouse gases</text>

  <!-- surface -->
  <rect x="70" y="392" width="372" height="60" rx="8" fill="#7a9e7e" opacity="0.55" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="428" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Earth's surface warms</text>

  <!-- trapped heat -->
  <g stroke="#e0a458" stroke-width="2.5" fill="none">
    <path d="M140 390 C130 356 138 344 160 342" marker-end="url(#ar8w)"/>
    <path d="M372 390 C382 356 374 344 352 342" marker-end="url(#ar8w)"/>
  </g>

  <defs>
    <marker id="ar8" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b3a42"/>
    </marker>
    <marker id="ar8w" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#e0a458"/>
    </marker>
  </defs>

  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Some heat escapes; more and more is trapped.</text>
</svg>
