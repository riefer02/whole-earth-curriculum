<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">What makes me, me: a four-part "Me" frame</title>
  <desc id="desc">A single frame divided into four labeled spaces for a "Me" sheet: "my name" shows a blank name tag, "things I like" shows a heart and a star, "things I can do" shows an open hand, and "my people" shows two small figures, one taller and one shorter. The labels and shapes, not color, carry the meaning so it prints clearly in grayscale. The blank white spaces invite a learner to draw their own answers.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">What Makes Me, Me</text>

  <!-- Quadrant frames -->
  <rect x="16" y="88" width="232" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="264" y="88" width="232" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="16" y="252" width="232" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="264" y="252" width="232" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Quadrant 1: my name -->
  <text x="132" y="116" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4f6d7a">my name</text>
  <g>
    <rect x="86" y="138" width="92" height="42" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <line x1="96" y1="160" x2="168" y2="160" stroke="#4f6d7a" stroke-width="2.5" stroke-dasharray="6 6"/>
    <path d="M104 150 L105.5 153.5 L109 154 L106.5 155.5 L108 159 L104 157 L100 159 L101.5 155.5 L99 154 L102.5 153.5 Z" fill="#e0a458"/>
  </g>

  <!-- Quadrant 2: things I like -->
  <text x="380" y="116" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4f6d7a">things I like</text>
  <g>
    <path d="M356 170 C351 161 342 161 342 169 C342 176 356 188 356 188 C356 188 370 176 370 169 C370 161 361 161 356 170 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M398 150 L400.5 159.5 L410 161 L400.5 162.5 L398 172 L395.5 162.5 L386 161 L395.5 159.5 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
  </g>

  <!-- Quadrant 3: things I can do -->
  <text x="132" y="280" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4f6d7a">things I can do</text>
  <g>
    <rect x="104" y="308" width="56" height="44" rx="12" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="106" y="290" width="9" height="20" rx="4" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="120" y="290" width="9" height="20" rx="4" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="134" y="290" width="9" height="20" rx="4" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="148" y="290" width="9" height="20" rx="4" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <rect x="94" y="312" width="10" height="20" rx="4" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- Quadrant 4: my people -->
  <text x="380" y="280" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4f6d7a">my people</text>
  <g>
    <circle cx="360" cy="322" r="14" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M351 316 A14 14 0 0 1 369 316 Z" fill="#2b3a42"/>
    <rect x="351" y="338" width="18" height="34" rx="7" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="353" y1="372" x2="351" y2="386" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="367" y1="372" x2="369" y2="386" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>

    <circle cx="406" cy="344" r="10" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M400 340 A10 10 0 0 1 412 340 Z" fill="#2b3a42"/>
    <rect x="400" y="356" width="12" height="24" rx="5" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="402" y1="380" x2="400" y2="390" stroke="#2b3a42" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="410" y1="380" x2="412" y2="390" stroke="#2b3a42" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Bottom note -->
  <text x="256" y="438" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">You are you &#8212; and that is good.</text>
</svg>
