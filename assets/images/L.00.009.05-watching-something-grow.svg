<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Watching something grow, day by day</title>
  <desc id="desc">Four small frames showing the same seed in a cup growing a little more each day: first just a seed, then a tiny sprout, then a sprout with two leaves, then a taller plant with more leaves. Each frame is labeled Day 1, Day 2, Day 3, and Day 4, with an arrow pointing to the next day. Growth is shown by size and shape, so it prints clearly in grayscale.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="52" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Watching Something Grow</text>
  <text x="256" y="78" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">A seed grows a little every day.</text>

  <!-- Frame 1 -->
  <g>
    <rect x="22" y="106" width="104" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <text x="74" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">Day 1</text>
    <!-- cup -->
    <path d="M52 300 L60 360 L88 360 L96 300 Z" fill="#d7d1c3" stroke="#2b3a42" stroke-width="2"/>
    <rect x="52" y="292" width="44" height="10" rx="4" fill="#d7d1c3" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="74" cy="330" rx="9" ry="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="74" y="382" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">seed in soil</text>
  </g>

  <g>
    <path d="M132 250 L150 250" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M146 243 L154 250 L146 257 Z" fill="#2b3a42"/>
  </g>

  <!-- Frame 2 -->
  <g>
    <rect x="160" y="106" width="104" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <text x="212" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">Day 2</text>
    <path d="M190 300 L198 360 L226 360 L234 300 Z" fill="#d7d1c3" stroke="#2b3a42" stroke-width="2"/>
    <rect x="190" y="292" width="44" height="10" rx="4" fill="#d7d1c3" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="212" cy="330" rx="9" ry="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#7a9e7e" stroke-width="4" stroke-linecap="round">
      <line x1="212" y1="330" x2="212" y2="306"/>
    </g>
    <text x="212" y="382" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">a tiny sprout</text>
  </g>

  <g>
    <path d="M270 250 L288 250" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M284 243 L292 250 L284 257 Z" fill="#2b3a42"/>
  </g>

  <!-- Frame 3 -->
  <g>
    <rect x="298" y="106" width="104" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <text x="350" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">Day 3</text>
    <path d="M328 300 L336 360 L364 360 L372 300 Z" fill="#d7d1c3" stroke="#2b3a42" stroke-width="2"/>
    <rect x="328" y="292" width="44" height="10" rx="4" fill="#d7d1c3" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="350" cy="330" rx="9" ry="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#7a9e7e" stroke-width="4" stroke-linecap="round">
      <line x1="350" y1="330" x2="350" y2="296"/>
    </g>
    <path d="M350 306 Q 338 300 336 290" fill="none" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round"/>
    <path d="M350 300 Q 362 294 364 284" fill="none" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round"/>
    <text x="350" y="382" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">two small leaves</text>
  </g>

  <g>
    <path d="M408 250 L426 250" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M422 243 L430 250 L422 257 Z" fill="#2b3a42"/>
  </g>

  <!-- Frame 4 -->
  <g>
    <rect x="436" y="106" width="56" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <text x="464" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Day 4</text>
    <path d="M446 300 L452 360 L476 360 L482 300 Z" fill="#d7d1c3" stroke="#2b3a42" stroke-width="2"/>
    <rect x="446" y="292" width="36" height="10" rx="4" fill="#d7d1c3" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="464" cy="330" rx="8" ry="5" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#7a9e7e" stroke-width="4" stroke-linecap="round">
      <line x1="464" y1="330" x2="464" y2="280"/>
    </g>
    <path d="M464 300 Q 454 294 452 282" fill="none" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round"/>
    <path d="M464 292 Q 474 286 476 274" fill="none" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round"/>
    <path d="M464 276 Q 456 270 456 260" fill="none" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round"/>
    <path d="M464 270 Q 472 264 474 254" fill="none" stroke="#7a9e7e" stroke-width="4" stroke-linecap="round"/>
    <text x="464" y="382" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">taller</text>
  </g>

  <!-- Footer -->
  <text x="256" y="438" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Look again tomorrow — you will notice the change for yourself.</text>
</svg>
