<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Co-ops and mutual aid around the world</title>
  <desc id="desc">A three-panel spectrum. The first panel shows charity as a one-way arrow from a giver above to a receiver below, with power kept. The second shows mutual aid as a circle of equals with arrows going both ways, deciding together. The third shows a cooperative economy as a shared building owned by many, with shared benefit.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Charity &#183; Mutual Aid &#183; Cooperative</text>

  <!-- Panel 1: charity -->
  <rect x="20" y="64" width="150" height="250" rx="12" fill="#fdfbf7" stroke="#e0a458" stroke-width="2"/>
  <text x="95" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#5a3d1e">charity</text>
  <g transform="translate(95,180)">
    <circle cx="0" cy="-36" r="16" fill="#e0a458"/>
    <rect x="-12" y="-20" width="24" height="40" rx="8" fill="#2b3a42"/>
    <circle cx="0" cy="42" r="13" fill="#6b93b6"/>
    <line x1="0" y1="-20" x2="0" y2="28" stroke="#e0a458" stroke-width="3"/>
  </g>
  <text x="95" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a3d1e">one-way gift</text>
  <text x="95" y="268" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a3d1e">giver keeps the power</text>

  <!-- Panel 2: mutual aid -->
  <rect x="181" y="64" width="150" height="250" rx="12" fill="#fdfbf7" stroke="#7a9e7e" stroke-width="2"/>
  <text x="256" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2c4a2c">mutual aid</text>
  <circle cx="256" cy="200" r="52" fill="none" stroke="#2b3a42" stroke-width="2" stroke-dasharray="4 4"/>
  <g>
    <circle cx="256" cy="168" r="15" fill="#7a9e7e"/>
    <circle cx="287" cy="203" r="15" fill="#e0a458"/>
    <circle cx="256" cy="238" r="15" fill="#6b93b6"/>
    <circle cx="225" cy="203" r="15" fill="#e0a458"/>
  </g>
  <g stroke="#7a9e7e" stroke-width="2" fill="none">
    <line x1="256" y1="183" x2="256" y2="223"/>
    <line x1="271" y1="195" x2="240" y2="211"/>
    <line x1="271" y1="211" x2="240" y2="195"/>
  </g>
  <text x="256" y="274" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2c4a2c">equals deciding together</text>

  <!-- Panel 3: cooperative -->
  <rect x="342" y="64" width="150" height="250" rx="12" fill="#fdfbf7" stroke="#6b93b6" stroke-width="2"/>
  <text x="417" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3a5a6a">cooperative</text>
  <g transform="translate(417,205)">
    <rect x="-42" y="-46" width="84" height="56" rx="6" fill="#dce9f0" stroke="#6b93b6" stroke-width="2"/>
    <path d="M-42,-46 L0,-66 L42,-46" fill="#6b93b6"/>
    <rect x="-14" y="-30" width="28" height="40" fill="#fdfbf7" stroke="#6b93b6" stroke-width="1.5"/>
  </g>
  <text x="417" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a5a6a">shared ownership</text>
  <text x="417" y="268" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a5a6a">shared benefit</text>

  <!-- World examples -->
  <text x="256" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">around the world</text>
  <g font-family="sans-serif" font-size="11" fill="#222222">
    <rect x="30" y="360" width="150" height="22" rx="8" fill="#eaf2ea"/>
    <text x="105" y="375" text-anchor="middle">harambee &#183; gotong royong</text>
    <rect x="190" y="360" width="150" height="22" rx="8" fill="#eaf2ea"/>
    <text x="265" y="375" text-anchor="middle">mink&#8217;a/minga &#183; barn raising</text>
    <rect x="350" y="360" width="140" height="22" rx="8" fill="#f6ead8"/>
    <text x="420" y="375" text-anchor="middle">worker co-ops &#183; credit unions</text>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">The question is not how much is given — but who holds the power and who decides.</text>
</svg>
