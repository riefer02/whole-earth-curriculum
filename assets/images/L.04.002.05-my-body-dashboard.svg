<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-04-002-05-my-body-dashboard desc-L-04-002-05-my-body-dashboard">
  <title id="title-L-04-002-05-my-body-dashboard">My body dashboard</title>
  <desc id="desc-L-04-002-05-my-body-dashboard">A three-dial dashboard with rows labeled "heart," "breath," and "warmth." Each row has a semicircular dial with a needle that points near the left side at "rest" and near the right side at "work," showing the three signals rise with activity and fall with rest.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="52" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b3a42">My Body Dashboard</text>

  <!-- Heart dial -->
  <g>
    <text x="210" y="80" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222222">heart</text>
    <path d="M146 156 A 64 64 0 0 1 274 156" fill="none" stroke="#d9d2c5" stroke-width="10" stroke-linecap="round"/>
    <path d="M146 156 A 64 64 0 0 1 210 92" fill="none" stroke="#e0a458" stroke-width="10" stroke-linecap="round"/>
    <line x1="210" y1="156" x2="232" y2="112" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <circle cx="210" cy="156" r="7" fill="#2b3a42"/>
    <text x="146" y="190" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222222">rest</text>
    <text x="274" y="190" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222222">work</text>
  </g>

  <!-- Breath dial -->
  <g>
    <text x="210" y="232" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222222">breath</text>
    <path d="M146 308 A 64 64 0 0 1 274 308" fill="none" stroke="#d9d2c5" stroke-width="10" stroke-linecap="round"/>
    <path d="M146 308 A 64 64 0 0 1 210 244" fill="none" stroke="#6b93b6" stroke-width="10" stroke-linecap="round"/>
    <line x1="210" y1="308" x2="232" y2="264" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <circle cx="210" cy="308" r="7" fill="#2b3a42"/>
    <text x="146" y="342" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222222">rest</text>
    <text x="274" y="342" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222222">work</text>
  </g>

  <!-- Warmth dial -->
  <g>
    <text x="210" y="384" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222222">warmth</text>
    <path d="M146 460 A 64 64 0 0 1 274 460" fill="none" stroke="#d9d2c5" stroke-width="10" stroke-linecap="round"/>
    <path d="M146 460 A 64 64 0 0 1 210 396" fill="none" stroke="#7a9e7e" stroke-width="10" stroke-linecap="round"/>
    <line x1="210" y1="460" x2="232" y2="416" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <circle cx="210" cy="460" r="7" fill="#2b3a42"/>
    <text x="146" y="494" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222222">rest</text>
    <text x="274" y="494" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222222">work</text>
  </g>
</svg>
