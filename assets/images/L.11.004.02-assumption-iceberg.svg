<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Assumption iceberg</title>
  <desc id="desc">An iceberg diagram. Above a waterline sits a speech bubble labeled "what is said aloud (the claim)." Below the waterline, three submerged blocks are labeled "what must already be true," "what is taken for granted," and "what a listener might question." A note reads: most of an argument sits below the surface.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">What Is Assumed, Not Said</text>

  <!-- Waterline -->
  <rect x="20" y="150" width="472" height="10" fill="#6b93b6" rx="3"/>
  <text x="500" y="146" text-anchor="end" font-family="sans-serif" font-size="12" fill="#4f6d7a">waterline</text>

  <!-- Above water: the claim -->
  <g>
    <path d="M150 62 h200 a16 16 0 0 1 16 16 v44 a16 16 0 0 1 -16 16 h-118 l-30 26 v-26 h-52 a16 16 0 0 1 -16 -16 v-44 a16 16 0 0 1 16 -16 z" fill="#dce9f0" stroke="#2b3a42" stroke-width="2"/>
    <text x="250" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">what is said aloud</text>
    <text x="250" y="120" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#3a5a6a">(the claim)</text>
  </g>

  <!-- Below water: assumptions -->
  <rect x="70" y="200" width="372" height="56" rx="10" fill="#eaf2ea" stroke="#7a9e7e" stroke-width="2"/>
  <text x="256" y="222" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">what must already be true</text>
  <text x="256" y="242" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a5a3a">for the claim to make sense</text>

  <rect x="70" y="270" width="372" height="56" rx="10" fill="#f6ead8" stroke="#e0a458" stroke-width="2"/>
  <text x="256" y="292" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">what is taken for granted</text>
  <text x="256" y="312" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8a6d4a">the "obvious" nobody checked</text>

  <rect x="70" y="340" width="372" height="56" rx="10" fill="#fdfbf7" stroke="#6b93b6" stroke-width="2"/>
  <text x="256" y="362" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">what a listener might question</text>
  <text x="256" y="382" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a5a6a">the first place a skeptic looks</text>

  <!-- Note -->
  <rect x="120" y="424" width="272" height="60" rx="12" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">Most of an argument</text>
  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">sits below the surface.</text>
</svg>
