<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">One conflict, many sides</title>
  <desc id="desc">A radial diagram with a conflict at the center and three parties arranged around it, each showing a view, a need, and the strongest evidence, with arrows pointing inward toward the conflict, drawn simply for grayscale printing.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">One conflict, many sides</text>

  <!-- center -->
  <circle cx="256" cy="256" r="64" fill="#e0a458" opacity="0.45" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="250" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">the</text>
  <text x="256" y="270" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">conflict</text>

  <!-- arrows inward -->
  <line x1="256" y1="192" x2="256" y2="150" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="120" y1="256" x2="196" y2="256" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="392" y1="256" x2="316" y2="256" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr)"/>

  <!-- party 1 (top) -->
  <rect x="116" y="60" width="280" height="80" rx="10" fill="#7a9e7e" opacity="0.35" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="84" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">party one</text>
  <text x="256" y="104" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">view: what they think</text>
  <text x="256" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">need: what they fear losing</text>
  <text x="256" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">evidence: their best reason</text>

  <!-- party 2 (left) -->
  <rect x="22" y="196" width="150" height="120" rx="10" fill="#6b93b6" opacity="0.3" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="97" y="222" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">party two</text>
  <text x="97" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">view</text>
  <text x="97" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">need</text>
  <text x="97" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">evidence</text>

  <!-- party 3 (right) -->
  <rect x="340" y="196" width="150" height="120" rx="10" fill="#e0a458" opacity="0.45" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="415" y="222" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">party three</text>
  <text x="415" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">view</text>
  <text x="415" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">need</text>
  <text x="415" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">evidence</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b3a42"/>
    </marker>
  </defs>

  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">Include the side you disagree with — that is the whole point.</text>
  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">You can understand a view fully and still disagree — but now your disagreement is informed.</text>
</svg>
