<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Reading my body's signals</title>
  <desc id="desc">A three-column chart. The left column lists body signals: tight jaw, shallow breath, empty stomach, heavy eyes. The middle column lists the mood each tends to steer toward: anxious, overwhelmed, irritable, flat. The right column lists a kind response: slow exhale, pause and water, food, rest.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Reading My Body's Signals</text>
  <text x="256" y="62" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">A signal is information, never a verdict.</text>

  <!-- header row -->
  <rect x="28" y="84" width="456" height="34" rx="6" fill="#2b3a42"/>
  <text x="128" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fdfbf7">Body signal</text>
  <text x="286" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fdfbf7">Mood it steers</text>
  <text x="420" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fdfbf7">Kind response</text>

  <!-- row 1 -->
  <rect x="28" y="122" width="456" height="86" fill="#ffffff" stroke="#4f6d7a" stroke-width="1.2"/>
  <text x="128" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">tight jaw,</text>
  <text x="128" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">shallow breath</text>
  <text x="286" y="166" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">anxious,</text>
  <text x="286" y="184" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">on edge</text>
  <text x="420" y="166" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3f6b4a">one slow exhale</text>
  <text x="420" y="184" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3f6b4a">drop the shoulders</text>

  <!-- row 2 -->
  <rect x="28" y="212" width="456" height="70" fill="#ffffff" stroke="#4f6d7a" stroke-width="1.2"/>
  <text x="128" y="250" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">empty stomach</text>
  <text x="286" y="250" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">irritable, snappy</text>
  <text x="420" y="250" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3f6b4a">pause, then eat</text>

  <!-- row 3 -->
  <rect x="28" y="286" width="456" height="70" fill="#ffffff" stroke="#4f6d7a" stroke-width="1.2"/>
  <text x="128" y="324" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">heavy eyes,</text>
  <text x="128" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">low energy</text>
  <text x="286" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">flat, foggy,</text>
  <text x="286" y="348" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">harsh inner voice</text>
  <text x="420" y="336" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3f6b4a">rest / water</text>

  <!-- empty row for learner's own -->
  <rect x="28" y="360" width="456" height="70" fill="#fdfbf7" stroke="#e0a458" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="128" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">your signal</text>
  <text x="286" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">your mood</text>
  <text x="420" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">your response</text>

  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Ask: "Am I angry at them — or running on an empty tank?"</text>
  <text x="256" y="488" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Naming the signal stops it from steering in secret.</text>
</svg>
