<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Big movements</title>
  <desc id="desc">Four big movements shown side by side: run, hop, jump, and gallop, each as a simple child figure with a word label. Below them, an equal-width band shows a child in a wheelchair rolling and gliding with one arm raised, labeled roll and glide. Labels carry the meaning, so color is never the only signal. Every way of moving big is shown as equal.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Big Movements</text>

  <!-- Ground -->
  <line x1="16" y1="240" x2="496" y2="240" stroke="#4f6d7a" stroke-width="2"/>

  <!-- RUN (medium skin) -->
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="76" cy="140" r="24" fill="#c99567"/>
    <rect x="58" y="166" width="36" height="54" rx="14" fill="#e0a458"/>
    <line x1="64" y1="180" x2="40" y2="160" stroke-width="13" stroke="#c99567"/>
    <circle cx="38" cy="158" r="6" fill="#c99567"/>
    <line x1="88" y1="180" x2="108" y2="158" stroke-width="13" stroke="#c99567"/>
    <circle cx="110" cy="156" r="6" fill="#c99567"/>
    <line x1="70" y1="218" x2="92" y2="238" stroke-width="14" stroke="#4f6d7a"/>
    <line x1="62" y1="218" x2="44" y2="238" stroke-width="14" stroke="#4f6d7a"/>
  </g>
  <g fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round">
    <path d="M28 150 q10 -12 20 0"/>
    <path d="M22 168 q10 -12 20 0"/>
  </g>
  <text x="76" y="262" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">run</text>

  <!-- HOP (deep skin) -->
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="196" cy="140" r="24" fill="#8f5f3d"/>
    <rect x="178" y="166" width="36" height="54" rx="14" fill="#6b93b6"/>
    <line x1="184" y1="180" x2="162" y2="164" stroke-width="13" stroke="#8f5f3d"/>
    <circle cx="160" cy="162" r="6" fill="#8f5f3d"/>
    <line x1="208" y1="180" x2="230" y2="164" stroke-width="13" stroke="#8f5f3d"/>
    <circle cx="232" cy="162" r="6" fill="#8f5f3d"/>
    <line x1="196" y1="218" x2="196" y2="238" stroke-width="14" stroke="#4f6d7a"/>
    <line x1="206" y1="218" x2="220" y2="196" stroke-width="14" stroke="#4f6d7a"/>
    <circle cx="222" cy="194" r="7" fill="#4f6d7a"/>
  </g>
  <g fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round">
    <path d="M184 118 q12 -12 24 0"/>
  </g>
  <text x="196" y="262" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">hop</text>

  <!-- JUMP (warm-brown skin) -->
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="316" cy="150" r="24" fill="#a47148"/>
    <rect x="298" y="176" width="36" height="52" rx="14" fill="#7a9e7e"/>
    <line x1="304" y1="188" x2="288" y2="152" stroke-width="13" stroke="#a47148"/>
    <circle cx="286" cy="150" r="6" fill="#a47148"/>
    <line x1="328" y1="188" x2="344" y2="152" stroke-width="13" stroke="#a47148"/>
    <circle cx="346" cy="150" r="6" fill="#a47148"/>
    <line x1="306" y1="226" x2="290" y2="238" stroke-width="14" stroke="#2b3a42"/>
    <line x1="326" y1="226" x2="342" y2="238" stroke-width="14" stroke="#2b3a42"/>
  </g>
  <g fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round">
    <path d="M288 128 q14 -14 28 0"/>
    <path d="M316 128 q14 -14 28 0"/>
  </g>
  <text x="316" y="262" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">jump</text>

  <!-- GALLOP (light skin) -->
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="436" cy="140" r="24" fill="#f1c9a5"/>
    <rect x="418" y="166" width="36" height="54" rx="14" fill="#e0a458"/>
    <line x1="424" y1="180" x2="404" y2="162" stroke-width="13" stroke="#f1c9a5"/>
    <circle cx="402" cy="160" r="6" fill="#f1c9a5"/>
    <line x1="448" y1="180" x2="468" y2="162" stroke-width="13" stroke="#f1c9a5"/>
    <circle cx="470" cy="160" r="6" fill="#f1c9a5"/>
    <line x1="430" y1="218" x2="450" y2="238" stroke-width="14" stroke="#6b93b6"/>
    <line x1="442" y1="218" x2="422" y2="238" stroke-width="14" stroke="#6b93b6"/>
  </g>
  <g fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round">
    <path d="M388 150 q10 -12 20 0"/>
    <path d="M382 168 q10 -12 20 0"/>
  </g>
  <text x="436" y="262" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">gallop</text>

  <!-- Adapted / equal band -->
  <rect x="16" y="292" width="480" height="136" rx="14" fill="#ffffff" stroke="#7a9e7e" stroke-width="3"/>
  <line x1="16" y1="398" x2="236" y2="398" stroke="#4f6d7a" stroke-width="2"/>
  <!-- wheelchair roll / glide figure -->
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="120" cy="330" r="24" fill="#c99567"/>
    <rect x="102" y="356" width="36" height="52" rx="14" fill="#6b93b6"/>
    <line x1="120" y1="368" x2="150" y2="326" stroke-width="13" stroke="#c99567"/>
    <circle cx="152" cy="324" r="6" fill="#c99567"/>
    <line x1="106" y1="368" x2="96" y2="394" stroke-width="13" stroke="#c99567"/>
    <circle cx="94" cy="396" r="6" fill="#c99567"/>
    <rect x="90" y="394" width="62" height="12" rx="6" fill="#4f6d7a"/>
    <line x1="104" y1="406" x2="104" y2="428" stroke="#4f6d7a" stroke-width="8"/>
    <circle cx="102" cy="428" r="16" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
    <circle cx="150" cy="436" r="9" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round">
    <path d="M46 326 q12 -14 24 0"/>
    <path d="M42 348 q12 -14 24 0"/>
  </g>
  <text x="120" y="462" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">roll · glide</text>

  <g font-family="sans-serif" fill="#222222">
    <text x="256" y="336" text-anchor="middle" font-size="20" font-weight="bold">Run, hop, jump, gallop —</text>
    <text x="256" y="366" text-anchor="middle" font-size="20" font-weight="bold">or roll and glide.</text>
    <text x="256" y="392" text-anchor="middle" font-size="17" fill="#4f6d7a">Every body moves big its own way.</text>
  </g>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Start, stop, and change speed — that is control.</text>
</svg>
