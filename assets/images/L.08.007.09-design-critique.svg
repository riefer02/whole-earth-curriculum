<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Critiquing a design: four questions</title>
  <desc id="desc">A simple water carrier drawn in the center, surrounded by four labeled boxes — function, materials, fairness, and footprint — the four kinds of evidence used to critique a design.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Critiquing a Design</text>

  <!-- object: water carrier -->
  <ellipse cx="256" cy="250" rx="64" ry="70" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <rect x="224" y="180" width="64" height="16" rx="4" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  <path d="M224 188 C 200 214, 200 240, 224 258" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="262" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">a water</text>
  <text x="256" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">carrier</text>

  <!-- function -->
  <rect x="30" y="88" width="150" height="62" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="105" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Function</text>
  <text x="105" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">does it work?</text>

  <!-- materials -->
  <rect x="332" y="88" width="150" height="62" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="407" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Materials</text>
  <text x="407" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">what is it made of?</text>

  <!-- fairness -->
  <rect x="30" y="360" width="150" height="62" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="105" y="384" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Fairness</text>
  <text x="105" y="404" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">who can use it? who is left out?</text>

  <!-- footprint -->
  <rect x="332" y="360" width="150" height="62" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="407" y="384" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Footprint</text>
  <text x="407" y="404" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">what it costs the Earth?</text>

  <!-- callouts -->
  <path d="M150 119 L204 200" fill="none" stroke="#4f6d7a" stroke-width="1.5"/>
  <path d="M362 119 L308 200" fill="none" stroke="#4f6d7a" stroke-width="1.5"/>
  <path d="M150 391 L204 300" fill="none" stroke="#4f6d7a" stroke-width="1.5"/>
  <path d="M362 391 L308 300" fill="none" stroke="#4f6d7a" stroke-width="1.5"/>

  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Good design is judged on all four, not one</text>
</svg>
