<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">From farm to table</title>
  <desc id="desc">A journey diagram titled "from farm to table." Four steps connected by arrows: grow — soil and water, a farmer plants and tends (a field with a plant and a farmer); harvest — a worker picks or gathers (a hand picking a fruit); transport — by truck, boat, or train, using fuel (a truck); table — a family eats (a table with bowls and two figures). Along the bottom, small labels note "people at each step" and "the environment: soil, water, fuel, packaging." Labels, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="32" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">From Farm to Table</text>

  <!-- Step 1: grow -->
  <g>
    <rect x="24" y="56" width="104" height="130" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="76" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">grow</text>
    <path d="M40 168 Q44 140 58 132 M52 170 Q58 128 76 126 M66 170 Q74 124 92 128" fill="none" stroke="#7a9e7e" stroke-width="2" stroke-linecap="round"/>
    <line x1="34" y1="170" x2="118" y2="170" stroke="#2b3a42" stroke-width="2"/>
    <text x="76" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">soil + water,</text>
    <text x="76" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">a farmer tends</text>
  </g>

  <path d="M132 120 L164 120" stroke="#4f6d7a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M156 114 L166 120 L156 126" stroke="#4f6d7a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2: harvest -->
  <g>
    <rect x="168" y="56" width="104" height="130" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="220" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">harvest</text>
    <path d="M196 168 Q200 132 220 120" fill="none" stroke="#7a9e7e" stroke-width="2" stroke-linecap="round"/>
    <circle cx="220" cy="118" r="7" fill="#e0a458" opacity="0.8" stroke="#2b3a42" stroke-width="1.5"/>
    <path d="M232 150 L250 130" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="220" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">a worker picks</text>
  </g>

  <path d="M276 120 L308 120" stroke="#4f6d7a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M300 114 L310 120 L300 126" stroke="#4f6d7a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3: transport -->
  <g>
    <rect x="312" y="56" width="104" height="130" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="364" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">transport</text>
    <rect x="330" y="112" width="52" height="26" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="338" y="96" width="30" height="18" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="342" cy="140" r="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="372" cy="140" r="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="364" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">by truck, boat,</text>
    <text x="364" y="184" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">or train — uses fuel</text>
  </g>

  <path d="M420 120 L452 120" stroke="#4f6d7a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M444 114 L454 120 L444 126" stroke="#4f6d7a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 4: table -->
  <g>
    <rect x="456" y="56" width="32" height="130" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- Table scene below -->
  <g>
    <rect x="120" y="240" width="272" height="10" rx="3" fill="#2b3a42"/>
    <line x1="136" y1="250" x2="132" y2="288" stroke="#2b3a42" stroke-width="2"/>
    <line x1="376" y1="250" x2="380" y2="288" stroke="#2b3a42" stroke-width="2"/>
    <path d="M160 232 A26 26 0 0 1 212 232 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M244 234 A24 24 0 0 1 292 234 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M320 232 A26 26 0 0 1 372 232 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <!-- family -->
    <circle cx="156" cy="200" r="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="356" cy="200" r="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="146" y="214" width="20" height="18" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="346" y="214" width="20" height="18" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="212" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">table — a family eats</text>
  </g>

  <!-- Bottom labels -->
  <rect x="24" y="356" width="464" height="96" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="384" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">people at each step — and the environment it draws on</text>
  <text x="256" y="410" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">soil and water to grow · fuel to travel · packaging that can become waste</text>
  <text x="256" y="434" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">many hands make one meal — and every plate connects us to the land.</text>

  <text x="256" y="482" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">When we know the journey, we can choose with care and eat with thanks.</text>
</svg>
