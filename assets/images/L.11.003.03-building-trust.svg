<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">What trust is built from</title>
  <desc id="desc">A house built from four labeled blocks: reliability, honesty, care for the other, and repair when I break it. A small figure stands beside the house holding a block labeled support offered. Labels, not color, carry the meaning, so the diagram prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">What Trust Is Built From</text>

  <!-- House -->
  <g stroke="#2b3a42" stroke-width="2">
    <path d="M150 250 L256 180 L362 250 Z" fill="#e0a458"/>
    <rect x="162" y="250" width="188" height="130" fill="#ffffff"/>
    <rect x="240" y="300" width="40" height="80" fill="#fdfbf7"/>
  </g>
  <text x="256" y="150" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">trust</text>

  <!-- Foundation blocks -->
  <g font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">
    <rect x="40" y="398" width="96" height="52" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="88" y="419">reliability</text>
    <text x="88" y="437" font-size="11" fill="#4f6d7a">do what I say</text>

    <rect x="148" y="398" width="96" height="52" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="196" y="419">honesty</text>
    <text x="196" y="437" font-size="11" fill="#4f6d7a">tell the truth</text>

    <rect x="256" y="398" width="96" height="52" rx="6" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="304" y="419">care</text>
    <text x="304" y="437" font-size="11" fill="#4f6d7a">want their good</text>

    <rect x="364" y="398" width="108" height="52" rx="6" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="418" y="419">repair</text>
    <text x="418" y="437" font-size="11" fill="#222222">when I break it</text>
  </g>

  <!-- Figure offering support -->
  <g stroke="#2b3a42" stroke-width="2" fill="#ffffff">
    <circle cx="96" cy="300" r="13" fill="#7a9e7e"/>
    <path d="M96 313 v22 M82 321 c0 11 6 19 14 19 s14 -8 14 -19"/>
    <path d="M96 335 v14 M88 349 l-6 10 M104 349 l6 10"/>
  </g>
  <text x="40" y="282" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">support offered</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">Trust is not found — it is built, block by block, and rebuilt when it breaks.</text>
</svg>
