<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">What plants and animals both need</title>
  <desc id="desc">A two-circle diagram shows the needs that plants and animals share. The left circle is labeled plants and holds a drawing of a plant with the word light. The right circle is labeled animals and holds a drawing of a bird with the word food. The overlap between the two circles is labeled both and holds the words water and air, because both plants and animals need water and air. Word labels and the placement of each need carry the meaning, not color, so the picture prints clearly in grayscale. The closing line teaches that every living thing depends on the same few gifts from the Earth.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">What Plants and Animals Both Need</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Two needs they share: water and air</text>

  <!-- circles -->
  <circle cx="184" cy="232" r="104" fill="#7a9e7e" fill-opacity="0.16" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="328" cy="232" r="104" fill="#6b93b6" fill-opacity="0.16" stroke="#2b3a42" stroke-width="2"/>

  <text x="120" y="128" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">plants</text>
  <text x="392" y="128" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">animals</text>
  <text x="256" y="150" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">both</text>

  <!-- plant in left circle -->
  <path d="M150 300 L150 268" stroke="#4f6d7a" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 290 Q140 284 132 288 Q140 278 150 286 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M150 280 Q160 272 168 276 Q160 268 150 276 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M140 316 L160 316 L157 328 L143 328 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <!-- light label -->
  <text x="150" y="352" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">light</text>
  <text x="150" y="370" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#222222">(plants only)</text>

  <!-- bird in right circle -->
  <circle cx="362" cy="286" r="12" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="368" cy="283" r="2" fill="#2b3a42"/>
  <path d="M372 284 L382 287 L372 290 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <line x1="350" y1="286" x2="340" y2="292" stroke="#e0a458" stroke-width="2" stroke-linecap="round"/>
  <line x1="350" y1="290" x2="340" y2="298" stroke="#e0a458" stroke-width="2" stroke-linecap="round"/>
  <line x1="362" y1="298" x2="362" y2="310" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="362" y="352" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">food</text>
  <text x="362" y="370" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#222222">(animals only)</text>

  <!-- shared needs in overlap -->
  <text x="256" y="238" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">water</text>
  <text x="256" y="264" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">air</text>

  <!-- water drop + air swirl -->
  <path d="M232 208 Q226 216 232 224 Q238 216 232 208 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M280 210 Q288 216 280 226 Q272 216 280 210" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>

  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Water and air go in the middle — both plants and animals need them.</text>
  <text x="256" y="448" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Every living thing, everywhere, depends on the same few gifts</text>
  <text x="256" y="472" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">the Earth gives.</text>
</svg>
