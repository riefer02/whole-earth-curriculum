<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The performance artist statement: four prompts into one statement</title>
  <desc id="desc">Four labeled boxes — what I made, how I made it, why it matters, what an audience should notice — each with an arrow feeding into a single line labeled "performance statement." Labels carry the meaning, so it prints clearly in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">The Performance Statement</text>

  <rect x="36" y="90" width="200" height="66" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="118" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">what I made</text>
  <text x="136" y="140" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">the piece, in plain words</text>

  <rect x="276" y="90" width="200" height="66" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="118" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">how I made it</text>
  <text x="376" y="140" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">movement, gesture, space</text>

  <rect x="36" y="176" width="200" height="66" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="136" y="204" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">why it matters</text>
  <text x="136" y="226" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">the feeling or idea</text>

  <rect x="276" y="176" width="200" height="66" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="204" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">what to notice</text>
  <text x="376" y="226" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">for the audience</text>

  <path d="M136 250 L226 330" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M376 250 L286 330" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <rect x="108" y="330" width="296" height="58" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="365" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222">performance statement</text>
</svg>
