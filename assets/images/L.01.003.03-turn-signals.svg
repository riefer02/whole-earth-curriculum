<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Waiting to speak: many ways to ask for a turn</title>
  <desc id="desc">Four children sit in a row on a ground line. The first child on the left holds a turn marker and speaks into a small speech bubble labeled "my turn." The other three wait patiently, each using a different turn signal: one raises a hand, one holds up a "my turn, please" card, and one taps their knee. The child with the card also signs with the other hand. Labels under each figure name each signal. The turn marker, the raised hand, the card, and the tap carry the meaning, not color, so the picture prints clearly in grayscale and teaches that there are many ways to ask for a turn — a raised hand, a card, a look, or a tap — and that every voice gets a fair chance, not just the loudest or fastest.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Title -->
  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Waiting to Speak</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Many ways to ask for a turn</text>

  <!-- Ground -->
  <line x1="30" y1="320" x2="482" y2="320" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>

  <!-- ===== 1. Speaker holds the turn marker ===== -->
  <g>
    <circle cx="80" cy="220" r="22" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M58 218 A22 22 0 0 1 102 218 Z" fill="#2b3a42"/>
    <circle cx="72" cy="220" r="2.2" fill="#2b3a42"/>
    <circle cx="88" cy="220" r="2.2" fill="#2b3a42"/>
    <path d="M72 230 Q80 236 88 230" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="62" y="244" width="36" height="50" rx="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="70" y1="294" x2="68" y2="318" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <line x1="90" y1="294" x2="92" y2="318" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <line x1="62" y1="258" x2="118" y2="242" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <!-- turn marker -->
    <line x1="120" y1="252" x2="146" y2="214" stroke="#e0a458" stroke-width="8" stroke-linecap="round"/>
    <circle cx="120" cy="252" r="4" fill="#4f6d7a" stroke="#2b3a42" stroke-width="1.5"/>
  </g>
  <text x="80" y="348" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">my turn</text>

  <!-- small speech bubble -->
  <path d="M44 116 Q44 100 66 100 L112 100 Q126 100 126 112 L126 130 Q126 142 112 142 L84 142 L76 152 L78 142 L66 142 Q44 142 44 130 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="85" y="125" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">my turn!</text>

  <!-- ===== 2. Raised hand ===== -->
  <g>
    <circle cx="196" cy="224" r="22" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M174 222 A22 22 0 0 1 218 222 Z" fill="#4f6d7a"/>
    <circle cx="188" cy="224" r="2.2" fill="#2b3a42"/>
    <circle cx="204" cy="224" r="2.2" fill="#2b3a42"/>
    <path d="M188 234 Q196 240 204 234" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="178" y="248" width="36" height="50" rx="12" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="186" y1="298" x2="184" y2="318" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <line x1="206" y1="298" x2="208" y2="318" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <!-- raised arm and hand -->
    <line x1="178" y1="262" x2="200" y2="196" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <path d="M200 196 Q196 182 206 178 L210 186 Q214 192 206 196 Z" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="196" y="348" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">raise a hand</text>

  <!-- ===== 3. Raised card, one hand signs ===== -->
  <g>
    <circle cx="312" cy="222" r="22" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M290 220 A22 22 0 0 1 334 220 Z" fill="#2b3a42"/>
    <circle cx="304" cy="222" r="2.2" fill="#2b3a42"/>
    <circle cx="320" cy="222" r="2.2" fill="#2b3a42"/>
    <path d="M304 232 Q312 238 320 232" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="294" y="246" width="36" height="50" rx="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="302" y1="296" x2="300" y2="318" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <line x1="322" y1="296" x2="324" y2="318" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <!-- raised card -->
    <line x1="294" y1="260" x2="276" y2="206" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <rect x="258" y="180" width="40" height="30" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="278" y="199" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#222222">my turn</text>
    <!-- signing hand -->
    <line x1="330" y1="258" x2="350" y2="232" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <circle cx="352" cy="230" r="5" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <text x="312" y="348" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">a card or sign</text>

  <!-- ===== 4. Tap on the knee ===== -->
  <g>
    <circle cx="428" cy="224" r="22" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M406 222 A22 22 0 0 1 450 222 Z" fill="#4f6d7a"/>
    <circle cx="420" cy="224" r="2.2" fill="#2b3a42"/>
    <circle cx="436" cy="224" r="2.2" fill="#2b3a42"/>
    <path d="M420 234 Q428 240 436 234" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="410" y="248" width="36" height="50" rx="12" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="418" y1="298" x2="416" y2="318" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <line x1="438" y1="298" x2="440" y2="318" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <!-- hand tapping knee -->
    <line x1="410" y1="258" x2="396" y2="286" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <circle cx="394" cy="288" r="5" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M386 296 Q390 302 394 304" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
    <path d="M396 300 Q400 306 404 308" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="428" y="348" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">a look or a tap</text>

  <!-- Bottom note -->
  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Every voice gets a turn — not just the loudest or the fastest.</text>
</svg>
