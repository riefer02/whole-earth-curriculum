<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t-l0500107 d-l0500107">
  <title id="t-l0500107">Three trials, one mean, and the spread</title>
  <desc id="d-l0500107">A table records Trial 1 at 18 millilitres, Trial 2 at 21 millilitres, Trial 3 at 19 millilitres, and a mean of 19.3 millilitres. Below, a number line from 10 to 30 millilitres holds three dots at 18, 19, and 21, joined by a bracket labelled "the spread."</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Three Trials, One Mean</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">18, 21, 19 — close, but not identical</text>

  <!-- table -->
  <rect x="76" y="92" width="360" height="36" fill="#4f6d7a"/>
  <text x="96" y="116" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Trial</text>
  <text x="300" y="116" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Water absorbed</text>

  <rect x="76" y="128" width="360" height="36" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="96" y="152" font-family="sans-serif" font-size="13" fill="#222222">Trial 1</text>
  <text x="300" y="152" font-family="sans-serif" font-size="13" fill="#222222">18 mL</text>

  <rect x="76" y="164" width="360" height="36" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="96" y="188" font-family="sans-serif" font-size="13" fill="#222222">Trial 2</text>
  <text x="300" y="188" font-family="sans-serif" font-size="13" fill="#222222">21 mL</text>

  <rect x="76" y="200" width="360" height="36" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="96" y="224" font-family="sans-serif" font-size="13" fill="#222222">Trial 3</text>
  <text x="300" y="224" font-family="sans-serif" font-size="13" fill="#222222">19 mL</text>

  <rect x="76" y="236" width="360" height="36" fill="#f4efe6" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="96" y="260" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">Mean</text>
  <text x="300" y="260" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">19.3 mL</text>

  <!-- number line -->
  <line x1="80" y1="330" x2="440" y2="330" stroke="#2b3a42" stroke-width="2"/>
  <line x1="80" y1="324" x2="80" y2="336" stroke="#2b3a42" stroke-width="2"/>
  <line x1="170" y1="324" x2="170" y2="336" stroke="#2b3a42" stroke-width="2"/>
  <line x1="260" y1="324" x2="260" y2="336" stroke="#2b3a42" stroke-width="2"/>
  <line x1="350" y1="324" x2="350" y2="336" stroke="#2b3a42" stroke-width="2"/>
  <line x1="440" y1="324" x2="440" y2="336" stroke="#2b3a42" stroke-width="2"/>
  <text x="80" y="354" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">10</text>
  <text x="170" y="354" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">15</text>
  <text x="260" y="354" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">20</text>
  <text x="350" y="354" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">25</text>
  <text x="440" y="354" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">30</text>

  <circle cx="224" cy="330" r="6" fill="#2b3a42"/>
  <circle cx="242" cy="330" r="6" fill="#2b3a42"/>
  <circle cx="278" cy="330" r="6" fill="#2b3a42"/>

  <path d="M224 320 L224 310 L278 310 L278 320" fill="none" stroke="#e0a458" stroke-width="2"/>
  <text x="251" y="302" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">the spread</text>
  <text x="260" y="376" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">water absorbed (mL)</text>

  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">The mean summarizes three trials; it does not hide a wild one.</text>
  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">Report the mean and the spread.</text>
</svg>
