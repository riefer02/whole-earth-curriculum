<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My day of food and drink</title>
  <desc id="desc">A worksheet-style diagram titled "my day of food and drink." Four boxes labeled morning, midday, afternoon, and evening, plus a row labeled drinks. Inside are example foods from several regions — rice and beans, flatbread and vegetables, fruit, soup, nuts, and a cup of water — drawn simply, with space to add your own. A caption reads "Record what you actually eat and drink — with curiosity, never judgment." Labels, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">My Day of Food and Drink</text>

  <!-- Four boxes -->
  <g stroke="#2b3a42" stroke-width="2" fill="#ffffff">
    <rect x="24" y="58" width="224" height="150" rx="12"/>
    <rect x="264" y="58" width="224" height="150" rx="12"/>
    <rect x="24" y="224" width="224" height="150" rx="12"/>
    <rect x="264" y="224" width="224" height="150" rx="12"/>
  </g>

  <!-- Box labels -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">
    <text x="38" y="82">morning</text>
    <text x="278" y="82">midday</text>
    <text x="38" y="248">afternoon</text>
    <text x="278" y="248">evening</text>
  </g>

  <!-- Morning: flatbread and fruit -->
  <ellipse cx="80" cy="130" rx="34" ry="16" fill="#e0a458" opacity="0.8"/>
  <circle cx="150" cy="140" r="16" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <line x1="150" y1="124" x2="150" y2="116" stroke="#2b3a42" stroke-width="2"/>
  <path d="M150 116 Q138 108 130 114" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <!-- Midday: rice and beans in a bowl -->
  <path d="M300 120 A52 52 0 0 1 404 120 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="352" cy="120" rx="52" ry="12" fill="#7a9e7e" opacity="0.7"/>
  <circle cx="332" cy="122" r="3" fill="#2b3a42"/>
  <circle cx="352" cy="126" r="3" fill="#2b3a42"/>
  <circle cx="370" cy="121" r="3" fill="#2b3a42"/>

  <!-- Afternoon: fruit and nuts -->
  <circle cx="80" cy="300" r="18" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <line x1="80" y1="282" x2="80" y2="272" stroke="#2b3a42" stroke-width="2"/>
  <path d="M80 272 Q68 262 58 268" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="140" cy="300" rx="14" ry="10" fill="#e0a458" opacity="0.8"/>
  <ellipse cx="170" cy="306" rx="12" ry="9" fill="#e0a458" opacity="0.8"/>

  <!-- Evening: soup bowl -->
  <path d="M300 300 A52 52 0 0 1 404 300 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="352" cy="300" rx="52" ry="11" fill="#6b93b6" opacity="0.7"/>
  <line x1="318" y1="300" x2="308" y2="288" stroke="#2b3a42" stroke-width="2"/>
  <line x1="352" y1="300" x2="352" y2="286" stroke="#2b3a42" stroke-width="2"/>
  <line x1="386" y1="300" x2="396" y2="288" stroke="#2b3a42" stroke-width="2"/>

  <!-- Drinks row -->
  <rect x="24" y="392" width="464" height="70" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="38" y="418" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">drinks</text>
  <path d="M160 424 L160 448 L200 448 L200 424 Z" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <path d="M168 412 L172 424 L188 424 L192 412 Z" fill="#6b93b6" opacity="0.6"/>
  <path d="M168 412 L172 424 L188 424 L192 412 Z" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <text x="182" y="452" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">water</text>
  <path d="M290 428 Q306 414 322 428 Q306 440 290 428 Z" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <text x="306" y="452" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">tea</text>

  <text x="256" y="490" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">Record what you actually eat and drink — with curiosity, never judgment.</text>
</svg>
