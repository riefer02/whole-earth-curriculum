<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Decision fork: compare two choices by their consequences for others</title>
  <desc id="desc">A decision-fork diagram. At the top, a box reads "you find a wallet on the path." Two branches split downward from it. The left branch, labeled "Choice A: return it," leads to a bubble that reads "the owner gets their money and papers back." The right branch, labeled "Choice B: keep it," leads to a bubble that reads "the owner loses what they need." Below, a caption reads "compare the consequences for others before you decide." Arrows and labels, not color alone, carry the meaning, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">The Decision Fork</text>
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">two choices &#183; two futures for others</text>

  <!-- situation box -->
  <rect x="136" y="92" width="240" height="58" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="118" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">you find a wallet on the path</text>
  <text x="256" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">(the situation)</text>

  <!-- trunk -->
  <line x1="256" y1="150" x2="256" y2="180" stroke="#2b3a42" stroke-width="2"/>
  <line x1="256" y1="180" x2="128" y2="210" stroke="#2b3a42" stroke-width="2"/>
  <line x1="256" y1="180" x2="384" y2="210" stroke="#2b3a42" stroke-width="2"/>

  <!-- Choice A box -->
  <rect x="30" y="212" width="196" height="58" rx="12" fill="#eef4ee" stroke="#2b3a42" stroke-width="2"/>
  <text x="128" y="234" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">Choice A: return it</text>
  <text x="128" y="254" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">give it back to the owner</text>

  <!-- Choice B box -->
  <rect x="286" y="212" width="196" height="58" rx="12" fill="#f6f0e8" stroke="#2b3a42" stroke-width="2"/>
  <text x="384" y="234" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">Choice B: keep it</text>
  <text x="384" y="254" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">take it for yourself</text>

  <!-- down arrows -->
  <line x1="128" y1="270" x2="128" y2="300" stroke="#2b3a42" stroke-width="2"/>
  <line x1="384" y1="270" x2="384" y2="300" stroke="#2b3a42" stroke-width="2"/>

  <!-- consequence A bubble -->
  <rect x="30" y="302" width="196" height="86" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="128" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">consequence for the other person</text>
  <text x="128" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">the owner gets their</text>
  <text x="128" y="370" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">money and papers back</text>

  <!-- consequence B bubble -->
  <rect x="286" y="302" width="196" height="86" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="384" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">consequence for the other person</text>
  <text x="384" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">the owner loses</text>
  <text x="384" y="370" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">what they need</text>

  <text x="256" y="432" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">Compare the consequences for others</text>
  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">before you decide.</text>

  <text x="256" y="500" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Walk each branch in your mind &#8212; then choose.</text>
</svg>
