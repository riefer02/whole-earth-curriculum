<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-06-006-02-graph-support-revise-claim desc-L-06-006-02-graph-support-revise-claim">
  <title id="title-L-06-006-02-graph-support-revise-claim">A bar graph that revises a claim</title>
  <desc id="desc-L-06-006-02-graph-support-revise-claim">A bar graph showing how much water four cloth types absorb. The horizontal axis lists thin cotton, wool, paper, and plastic. The vertical axis is labeled drops absorbed with a scale from 0 to 20. Four bars rise to different heights: thin cotton reaches 18, wool reaches 14, paper reaches 9, and plastic reaches 2. Above the graph, a claim box reads: claim — the thickest cloth absorbs the most. Below, a verdict box reads: the graph revises this claim — the thin cotton, not the thickest cloth, absorbed the most. Labels, numbers, and bar heights, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">A Bar Graph That Revises a Claim</text>
  <text x="256" y="56" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">let the data answer the question</text>

  <!-- claim box -->
  <rect x="56" y="74" width="400" height="40" rx="8" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="99" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">claim: "the thickest cloth absorbs the most water"</text>

  <!-- axes -->
  <g>
    <line x1="90" y1="150" x2="90" y2="400" stroke="#2b3a42" stroke-width="3"/>
    <line x1="90" y1="400" x2="430" y2="400" stroke="#2b3a42" stroke-width="3"/>
    <!-- gridlines -->
    <g stroke="#d7d1c8" stroke-width="1">
      <line x1="90" y1="200" x2="420" y2="200"/><line x1="90" y1="250" x2="420" y2="250"/>
      <line x1="90" y1="300" x2="420" y2="300"/><line x1="90" y1="350" x2="420" y2="350"/>
    </g>
    <text x="80" y="405" text-anchor="end" font-family="sans-serif" font-size="14" fill="#222222">0</text>
    <text x="80" y="355" text-anchor="end" font-family="sans-serif" font-size="14" fill="#222222">5</text>
    <text x="80" y="305" text-anchor="end" font-family="sans-serif" font-size="14" fill="#222222">10</text>
    <text x="80" y="255" text-anchor="end" font-family="sans-serif" font-size="14" fill="#222222">15</text>
    <text x="80" y="205" text-anchor="end" font-family="sans-serif" font-size="14" fill="#222222">20</text>

    <!-- bars: 25px per drop -> 18=450? too tall. Use scale: 10 px per drop -->
    <!-- thin cotton 18 -> 180 -->
    <rect x="110" y="220" width="55" height="180" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="137" y="212" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">18</text>
    <!-- wool 14 -> 140 -->
    <rect x="190" y="260" width="55" height="140" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="217" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">14</text>
    <!-- paper 9 -> 90 -->
    <rect x="270" y="310" width="55" height="90" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="297" y="302" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">9</text>
    <!-- plastic 2 -> 20 -->
    <rect x="350" y="380" width="55" height="20" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <text x="377" y="372" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">2</text>

    <text x="137" y="422" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">thin cotton</text>
    <text x="217" y="422" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">wool</text>
    <text x="297" y="422" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">paper</text>
    <text x="377" y="422" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">plastic</text>

    <text x="90" y="142" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6b93b6">drops absorbed</text>
  </g>

  <!-- verdict box -->
  <rect x="56" y="430" width="400" height="56" rx="8" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="454" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">the graph revises this claim</text>
  <text x="256" y="476" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">the thin cotton, not the thickest cloth, absorbed the most</text>
</svg>
