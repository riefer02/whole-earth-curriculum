<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Society and environment shape each other</title>
  <desc id="desc">A circular loop with two arrows. One arrow labeled people shape the land shows people terracing, canal-building, and farming. The other arrow labeled the land shapes people shows drought, flood, and rich soil affecting people. The cycle is labeled adaptation and decline.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Society &amp; Environment Shape Each Other</text>

  <!-- center label -->
  <text x="256" y="268" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">over deep time:</text>
  <text x="256" y="290" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">adaptation &amp; decline</text>

  <!-- top arrow: people shape land -->
  <path d="M110 150 Q256 60 402 150" fill="none" stroke="#7a9e7e" stroke-width="3" marker-end="url(#e1)"/>
  <defs>
    <marker id="e1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 Z" fill="#7a9e7e"/>
    </marker>
    <marker id="e2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 Z" fill="#6b93b6"/>
    </marker>
  </defs>
  <text x="256" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">people shape the land</text>
  <text x="256" y="138" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">terraces · canals · farms · cities</text>

  <!-- bottom arrow: land shapes people -->
  <path d="M402 330 Q256 420 110 330" fill="none" stroke="#6b93b6" stroke-width="3" marker-end="url(#e2)"/>
  <text x="256" y="392" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">the land shapes people</text>
  <text x="256" y="412" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4f6d7a">rich soil · drought · flood · climate shift</text>

  <!-- small icons: terrace -->
  <rect x="140" y="180" width="34" height="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <rect x="150" y="166" width="34" height="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <!-- small icon: rain -->
  <path d="M330 176 q3 -10 6 0 M344 176 q3 -10 6 0" stroke="#6b93b6" stroke-width="2.5" fill="none"/>
  <path d="M322 186 h40" stroke="#6b93b6" stroke-width="2.5" fill="none"/>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">Decline is usually many causes at once — not one simple story</text>
</svg>
