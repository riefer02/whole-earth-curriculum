<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Competing explanations for the Classic Maya collapse</title>
  <desc id="desc">A balance scale weighing three explanations for the Classic Maya collapse — drought, warfare, and environmental stress — each labeled with its evidence, with the note that scholars now see several causes working together.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Why did the Classic Maya cities decline?</text>

  <!-- balance scale -->
  <g stroke="#2b3a42" stroke-width="3" fill="none">
    <line x1="256" y1="88" x2="256" y2="286"/>
    <line x1="206" y1="288" x2="306" y2="288"/>
    <line x1="256" y1="88" x2="236" y2="120"/>
    <line x1="256" y1="88" x2="276" y2="120"/>
  </g>
  <circle cx="256" cy="84" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>

  <!-- left pan -->
  <path d="M100 250 Q90 316 206 316 L206 292 L100 292 Z" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
  <path d="M120 260 L186 260" stroke="#2b3a42" stroke-width="2"/>

  <!-- right pan -->
  <path d="M412 250 Q422 316 306 316 L306 292 L412 292 Z" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
  <path d="M326 260 L392 260" stroke="#2b3a42" stroke-width="2"/>

  <!-- explanation 1: drought -->
  <g>
    <rect x="40" y="140" width="128" height="64" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="104" y="166" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">drought</text>
    <text x="104" y="186" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">lake-sediment record</text>
  </g>

  <!-- explanation 2: warfare -->
  <g>
    <rect x="356" y="140" width="128" height="64" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="420" y="166" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">warfare</text>
    <text x="420" y="186" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">monuments record war</text>
  </g>

  <!-- explanation 3: environmental stress -->
  <g>
    <rect x="176" y="352" width="160" height="64" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="378" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">environmental stress</text>
    <text x="256" y="398" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">population &amp; worn soils</text>
  </g>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">Scholars now weigh the evidence and see several causes working together.</text>
  <text x="256" y="476" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">The Maya peoples did not vanish — millions of Maya live today.</text>
</svg>
