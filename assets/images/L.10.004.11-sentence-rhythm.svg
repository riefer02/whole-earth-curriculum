<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Sentence rhythm</title>
  <desc id="desc">A paragraph mapped as bars of different lengths: one short punchy sentence, then a medium one, then a long flowing one. Labels note how each length steers the reader's pace and emphasis.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#2b3a42">Sentence Length Is a Tool</text>

  <!-- Bar 1: short -->
  <rect x="60" y="90" width="70" height="34" rx="8" fill="#2b3a42"/>
  <text x="60" y="152" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">short</text>
  <text x="60" y="172" font-family="sans-serif" font-size="13" fill="#4f6d7a">lands hard.</text>
  <text x="60" y="190" font-family="sans-serif" font-size="13" fill="#4f6d7a">sets emphasis.</text>

  <!-- Bar 2: medium -->
  <rect x="60" y="230" width="180" height="34" rx="8" fill="#4f6d7a"/>
  <text x="60" y="292" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">medium</text>
  <text x="60" y="312" font-family="sans-serif" font-size="13" fill="#4f6d7a">carries the middle.</text>

  <!-- Bar 3: long -->
  <rect x="60" y="366" width="360" height="34" rx="8" fill="#6b93b6"/>
  <text x="60" y="428" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">long</text>
  <text x="60" y="448" font-family="sans-serif" font-size="13" fill="#4f6d7a">builds and flows, carrying the reader along to the next idea.</text>

  <!-- Right explanation -->
  <rect x="286" y="90" width="186" height="128" rx="12" fill="#eaf2ea"/>
  <text x="379" y="116" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">A paragraph's rhythm</text>
  <text x="379" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a5a3a">comes from mixing</text>
  <text x="379" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a5a3a">these lengths on purpose.</text>
  <text x="379" y="184" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a5a3a">One short punch line</text>
  <text x="379" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a5a3a">where you want impact.</text>

  <text x="256" y="490" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">A sentence is a tool — and you are the one holding it.</text>
</svg>
