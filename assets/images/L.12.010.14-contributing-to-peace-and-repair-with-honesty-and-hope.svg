<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Contributing to Peace and Repair with Honesty and Hope</title>
  <desc id="desc">Two columns: "honesty — what is broken and hard to repair" and "hope — what is real to build on." Between them, a small plant grows, labeled "my contribution." A footer reads "honesty without despair, hope without denial." Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42" font-weight="bold">Contributing to Peace and Repair with Honesty and Hope</text>

  <!-- two columns -->
  <rect x="30" y="80" width="180" height="150" rx="8" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <text x="120" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">honesty</text>
  <text x="120" y="134" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">what is broken</text>
  <text x="120" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">and hard to repair</text>
  <text x="120" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">look squarely at the harm</text>

  <rect x="302" y="80" width="180" height="150" rx="8" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="392" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">hope</text>
  <text x="392" y="134" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">what is real</text>
  <text x="392" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">to build on</text>
  <text x="392" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">a seed, a person, a place</text>

  <!-- plant between -->
  <path d="M256 290 L256 250" stroke="#4f6d7a" stroke-width="3"/>
  <path d="M256 268 Q232 268 226 246" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <path d="M256 258 Q280 258 286 238" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <circle cx="256" cy="242" r="7" fill="none" stroke="#e0a458" stroke-width="3"/>

  <text x="256" y="318" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">my contribution</text>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">Honesty without despair, hope without denial.</text>
</svg>
