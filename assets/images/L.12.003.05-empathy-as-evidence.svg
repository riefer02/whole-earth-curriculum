<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Reasoning with two pans: empathy and principle</title>
  <desc id="d">A balance scale with two pans — one labeled 'from the inside: empathy', one labeled 'from the outside: principles and consequences' — balancing toward a reasoned decision written at the base. Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <!-- balance beam -->
  <line x1="120" y1="150" x2="392" y2="150" stroke="#2b3a42" stroke-width="3"/>
  <!-- center post -->
  <line x1="256" y1="150" x2="256" y2="230" stroke="#2b3a42" stroke-width="3"/>
  <line x1="216" y1="230" x2="296" y2="230" stroke="#2b3a42" stroke-width="3"/>
  <!-- left pan -->
  <path d="M120 150 L150 214 L170 214" stroke="#2b3a42" stroke-width="2.5" fill="none"/>
  <path d="M120 150 L90 214 L110 214" stroke="#2b3a42" stroke-width="2.5" fill="none"/>
  <path d="M86 214 L174 214 Q174 238 130 238 Q86 238 86 214" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="130" y="270" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">from the inside</text>
  <text x="130" y="288" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">empathy</text>
  <!-- right pan -->
  <path d="M392 150 L362 214 L382 214" stroke="#2b3a42" stroke-width="2.5" fill="none"/>
  <path d="M392 150 L422 214 L402 214" stroke="#2b3a42" stroke-width="2.5" fill="none"/>
  <path d="M358 214 L426 214 Q426 238 392 238 Q358 238 358 214" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="392" y="270" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">from the outside</text>
  <text x="392" y="288" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">principles &amp; consequences</text>
  <!-- decision base -->
  <rect x="146" y="330" width="220" height="62" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="357" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">a reasoned decision</text>
  <text x="256" y="378" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">that holds both</text>
  <line x1="256" y1="238" x2="256" y2="328" stroke="#2b3a42" stroke-width="2.5"/>
</svg>
