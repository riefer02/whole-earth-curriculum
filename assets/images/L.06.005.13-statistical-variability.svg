<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-06-005-13-statistical-variability desc-L-06-005-13-statistical-variability">
  <title id="title-L-06-005-13-statistical-variability">Statistical variability: center, spread, and shape</title>
  <desc id="desc-L-06-005-13-statistical-variability">A dot plot of daily rainfall in millimeters across fourteen days. Dots are stacked at values 0, 1, 2, 3, 4, 5, and 6 millimeters. A vertical line marks the center near 3, a double-headed bracket shows the spread from 0 to 6, and a label notes the shape is roughly symmetric with one peak. Labels, numbers, and position, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="33.6" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">Statistical Variability: Center, Spread, and Shape</text>
  <text x="256" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">data varies — we describe it by its center, its spread, and its shape</text>

  <g>
    <!-- axis -->
    <line x1="40" y1="90" x2="40" y2="320" stroke="#2b3a42" stroke-width="3"/>
    <line x1="40" y1="320" x2="480" y2="320" stroke="#2b3a42" stroke-width="3"/>

    <!-- values -->
    <text x="40" y="342" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">0</text>
    <text x="100" y="342" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">1</text>
    <text x="160" y="342" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">2</text>
    <text x="220" y="342" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">3</text>
    <text x="280" y="342" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">4</text>
    <text x="340" y="342" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">5</text>
    <text x="400" y="342" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">6</text>
    <text x="460" y="342" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">7</text>
    <text x="260" y="372" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6b93b6">rainfall (mm per day)</text>

    <!-- dots -->
    <g fill="#2b3a42">
      <circle cx="40" cy="310" r="6"/>
      <circle cx="100" cy="310" r="6"/><circle cx="100" cy="294" r="6"/>
      <circle cx="160" cy="310" r="6"/><circle cx="160" cy="294" r="6"/><circle cx="160" cy="278" r="6"/>
      <circle cx="220" cy="310" r="6"/><circle cx="220" cy="294" r="6"/><circle cx="220" cy="278" r="6"/><circle cx="220" cy="262" r="6"/>
      <circle cx="280" cy="310" r="6"/><circle cx="280" cy="294" r="6"/><circle cx="280" cy="278" r="6"/>
      <circle cx="340" cy="310" r="6"/><circle cx="340" cy="294" r="6"/>
      <circle cx="400" cy="310" r="6"/>
    </g>

    <!-- center -->
    <line x1="220" y1="254" x2="220" y2="318" stroke="#e0a458" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="220" y="246" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#8a5a1a">center ≈ 3</text>

    <!-- spread -->
    <path d="M 40 240 L 40 230 L 400 230 L 400 240" fill="none" stroke="#7a9e7e" stroke-width="3"/>
    <line x1="40" y1="230" x2="40" y2="210" stroke="#7a9e7e" stroke-width="2"/>
    <line x1="400" y1="230" x2="400" y2="210" stroke="#7a9e7e" stroke-width="2"/>
    <text x="220" y="202" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#436b47">spread (range): 0 to 6</text>
  </g>

  <text x="256" y="392" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">shape: one peak, roughly symmetric</text>
  <text x="256" y="414.8" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">center: where the data piles up · spread: how far it stretches · shape:</text>
  <text x="256" y="434.2" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">how it looks</text>
  <text x="256" y="458" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">different places get very different rainfall — that difference is variability</text>
</svg>
