<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Words That Shape, Voices That Meet — a unit map</title>
  <desc id="desc">A central circle labeled "My voice among many voices" with three labeled boxes around it: "Listening &amp; Speaking", "Reading", and "Writing &amp; Languages". Lines connect the circle to each box, showing the three clusters of the unit.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">Reading, Writing, Argument &amp; Many Languages</text>

  <!-- central circle -->
  <circle cx="256" cy="256" r="78" fill="#7a9e7e" opacity="0.45" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="248" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">My voice</text>
  <text x="256" y="270" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">among many</text>
  <text x="256" y="288" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">voices</text>

  <!-- top box -->
  <rect x="136" y="66" width="240" height="56" rx="10" fill="#e0a458" opacity="0.6" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="256" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Listening &amp; Speaking</text>
  <line x1="256" y1="178" x2="256" y2="122" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- left box -->
  <rect x="22" y="226" width="176" height="60" rx="10" fill="#6b93b6" opacity="0.45" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="110" y="260" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Reading</text>
  <line x1="198" y1="256" x2="178" y2="256" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- right box -->
  <rect x="314" y="226" width="176" height="60" rx="10" fill="#7a9e7e" opacity="0.5" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="402" y="250" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Writing &amp;</text>
  <text x="402" y="272" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Languages</text>
  <line x1="314" y1="256" x2="334" y2="256" stroke="#2b3a42" stroke-width="2.5" marker-end="url(#arr)"/>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b3a42"/>
    </marker>
  </defs>

  <text x="256" y="472" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Three clusters, one practice: using words with other people.</text>
</svg>
