<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Systems of Relationships as Equations</title>
  <desc id="desc">A coordinate grid with two straight lines crossing at the point (30, 20). The two equations are written beside the grid, and the crossing point is labeled as the solution — the one pair that satisfies both relationships at once.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2b3a42" font-weight="bold">Two Equations, One Pair That Satisfies Both</text>

  <!-- grid -->
  <g stroke="#dcd5c8" stroke-width="1">
    <line x1="70" y1="80" x2="70" y2="380"/>
    <line x1="140" y1="80" x2="140" y2="380"/>
    <line x1="210" y1="80" x2="210" y2="380"/>
    <line x1="280" y1="80" x2="280" y2="380"/>
    <line x1="350" y1="80" x2="350" y2="380"/>
    <line x1="420" y1="80" x2="420" y2="380"/>
    <line x1="70" y1="120" x2="420" y2="120"/>
    <line x1="70" y1="160" x2="420" y2="160"/>
    <line x1="70" y1="200" x2="420" y2="200"/>
    <line x1="70" y1="240" x2="420" y2="240"/>
    <line x1="70" y1="280" x2="420" y2="280"/>
    <line x1="70" y1="320" x2="420" y2="320"/>
    <line x1="70" y1="360" x2="420" y2="360"/>
  </g>
  <line x1="70" y1="380" x2="420" y2="380" stroke="#2b3a42" stroke-width="2"/>
  <line x1="70" y1="380" x2="70" y2="80" stroke="#2b3a42" stroke-width="2"/>
  <text x="70" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">0</text>
  <text x="140" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">10</text>
  <text x="210" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">20</text>
  <text x="280" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">30</text>
  <text x="350" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">40</text>
  <text x="420" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">50</text>

  <!-- line 1: r + b = 50  => b = 50 - r -->
  <line x1="70" y1="230" x2="420" y2="80" stroke="#e0a458" stroke-width="3"/>
  <!-- line 2: 2r + 3b = 120 => b = (120-2r)/3 -->
  <line x1="70" y1="360" x2="420" y2="120" stroke="#6b93b6" stroke-width="3"/>

  <!-- intersection point at r=30 (x=280), b=20 (y=... compute) -->
  <circle cx="280" cy="230" r="7" fill="#2b3a42"/>
  <text x="288" y="214" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">(30, 20)</text>

  <rect x="30" y="416" width="452" height="80" fill="#ffffff" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="48" y="440" font-family="sans-serif" font-size="14" fill="#222222">r + b = 50   (fifty bags total)</text>
  <text x="48" y="464" font-family="sans-serif" font-size="14" fill="#222222">2r + 3b = 120   (one hundred twenty in money)</text>
  <text x="48" y="486" font-family="sans-serif" font-size="14" fill="#4f6d7a">The crossing point is the solution: 30 rice, 20 beans.</text>
</svg>
