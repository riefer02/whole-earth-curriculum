<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Five checks for an altered video</title>
  <desc id="desc">A checklist graphic showing four grouped checks for a possibly altered video: look (unnatural edges, blinking, lighting), trace (who posted it, where it first appeared), verify (find the original, check independent reporting), and ask (is this too perfect), with a small face under a magnifying glass.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">Is This Video Real?</text>

  <!-- face under magnifying glass -->
  <circle cx="256" cy="112" r="40" fill="none" stroke="#4f6d7a" stroke-width="4"/>
  <line x1="284" y1="140" x2="312" y2="168" stroke="#4f6d7a" stroke-width="5"/>
  <circle cx="244" cy="106" r="9" fill="#c98d5f" stroke="#2b3a42" stroke-width="1.5"/>
  <circle cx="268" cy="106" r="9" fill="#c98d5f" stroke="#2b3a42" stroke-width="1.5"/>
  <circle cx="244" cy="106" r="3" fill="#222222"/>
  <circle cx="268" cy="106" r="3" fill="#222222"/>
  <path d="M238 128 Q256 142 274 128" fill="none" stroke="#2b3a42" stroke-width="2"/>

  <!-- checklist -->
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <rect x="60" y="196" width="392" height="42" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="70" y="204" width="18" height="18" rx="3" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <text x="98" y="222" font-weight="bold" fill="#2b3a42">Look:</text>
    <text x="150" y="222">unnatural edges, blinking, lighting</text>

    <rect x="60" y="248" width="392" height="42" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="70" y="256" width="18" height="18" rx="3" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <text x="98" y="274" font-weight="bold" fill="#2b3a42">Trace:</text>
    <text x="158" y="274">who posted it? where did it first appear?</text>

    <rect x="60" y="300" width="392" height="42" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="70" y="308" width="18" height="18" rx="3" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <text x="98" y="326" font-weight="bold" fill="#2b3a42">Verify:</text>
    <text x="164" y="326">find the original, check independent reporting</text>

    <rect x="60" y="352" width="392" height="42" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="70" y="360" width="18" height="18" rx="3" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <text x="98" y="378" font-weight="bold" fill="#2b3a42">Ask:</text>
    <text x="146" y="378">is this too perfect, too convenient?</text>
  </g>

  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">"I'm not sure yet" is a strong, honest answer.</text>
  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">You don't need perfect eyes — you need the habit of checking.</text>
</svg>
