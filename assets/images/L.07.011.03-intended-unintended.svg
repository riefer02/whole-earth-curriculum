<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Intended and unintended effects of the plastic bag</title>
  <desc id="desc">Two side-by-side panels. The left panel, labeled "Intended", shows a plastic bag carrying groceries with the note "carry things cheaply and lightly". The right panel, labeled "Unintended", shows a bag drifting toward a river and a fish, with the note "plastic in rivers and oceans, harming wildlife".</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Two kinds of effect</text>

  <!-- left panel: intended -->
  <rect x="24" y="72" width="220" height="360" rx="12" fill="#7a9e7e" opacity="0.3" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="134" y="108" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">Intended</text>
  <!-- bag carrying groceries -->
  <path d="M84 176 Q84 140 114 140 L154 140 Q184 140 184 176 L184 250 L84 250 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
  <path d="M96 150 Q134 168 172 150" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="134" y="292" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">carry things</text>
  <text x="134" y="312" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">cheaply and lightly</text>

  <!-- right panel: unintended -->
  <rect x="268" y="72" width="220" height="360" rx="12" fill="#6b93b6" opacity="0.3" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="378" y="108" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">Unintended</text>
  <!-- drifting bag + fish -->
  <path d="M328 170 Q328 142 352 142 L384 142 Q408 142 408 170 L408 220 L328 220 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
  <path d="M340 152 Q368 166 396 152" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
  <path d="M360 244 q-4 30 -30 34 q26 2 28 26 q2 -24 30 -26 q-26 -4 -28 -34 z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="378" y="292" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">plastic in rivers</text>
  <text x="378" y="312" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">and oceans, harming wildlife</text>

  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Designers plan the first; no one planned the second.</text>
</svg>
