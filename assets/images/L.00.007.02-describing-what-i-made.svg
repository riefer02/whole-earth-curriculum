<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Describing what I made: color, shape, and line</title>
  <desc id="desc">A child's artwork hangs in a frame: it shows a red circle, a blue wiggly line, and a green triangle. Three speech bubbles point to the parts and name them with words — "red circle", "wiggly line", "triangle". Beside the picture sits a round turn marker, a smooth stone labeled "my turn to share". Every part is named with a word, and the shapes differ, so the picture prints clearly in grayscale and teaches that pointing or naming a color, shape, or line is a way to describe art.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Describing What I Made</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Say it or point to it: a color, a shape, a line.</text>

  <!-- Artwork frame -->
  <rect x="52" y="104" width="256" height="300" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
  <rect x="76" y="128" width="208" height="208" rx="8" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>

  <!-- red circle -->
  <circle cx="130" cy="186" r="34" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <!-- wiggly line -->
  <path d="M150 268 Q166 248 182 268 Q198 288 214 268 Q230 248 246 268" fill="none" stroke="#6b93b6" stroke-width="5" stroke-linecap="round"/>
  <!-- triangle -->
  <polygon points="180,340 150,398 210,398" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>

  <!-- speech bubble 1: red circle -->
  <g>
    <rect x="308" y="128" width="150" height="54" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M316 182 L300 200 L330 182" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="383" y="160" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">red circle</text>
  </g>
  <!-- speech bubble 2: wiggly line -->
  <g>
    <rect x="308" y="232" width="150" height="54" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M318 232 L300 214 L332 232" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="383" y="264" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">wiggly line</text>
  </g>
  <!-- speech bubble 3: triangle -->
  <g>
    <rect x="308" y="336" width="150" height="54" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M316 390 L300 408 L330 390" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="383" y="368" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">triangle</text>
  </g>

  <!-- Turn marker -->
  <g>
    <ellipse cx="180" cy="440" rx="34" ry="22" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <path d="M164 440 Q180 454 196 440" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="256" y="445" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">turn marker — my turn to share</text>
  </g>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Pointing counts as describing. Every piece has a story.</text>
</svg>
