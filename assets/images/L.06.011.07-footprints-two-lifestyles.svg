<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Footprints: two lives, two amounts of resources</title>
  <desc id="desc">A comparison of two lifestyle footprints, drawn as two footprint outlines of different sizes. The smaller footprint on the left, labeled "LIFE A," lists "walks and rides the bus, grows some food, buys mostly local, reuses and repairs." The larger footprint on the right, labeled "LIFE B," lists "drives a car daily, buys packaged food flown from far away, replaces things often." A bottom band reads "A footprint is a measurement, not a score. Different lives use different amounts. Knowing yours helps you choose." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Footprints: two lives, two amounts of resources</text>

  <!-- LIFE A (smaller footprint) -->
  <g>
    <text x="150" y="86" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">LIFE A</text>
    <!-- smaller footprint -->
    <g transform="translate(86 160) scale(0.72)">
      <path d="M60 40 Q150 -8 200 46 Q238 92 208 128 Q182 152 128 152 Q70 152 44 116 Q18 84 60 40 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="4"/>
      <circle cx="84" cy="46" r="11" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
      <circle cx="118" cy="30" r="11" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
      <circle cx="152" cy="34" r="11" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
      <circle cx="184" cy="52" r="11" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
    </g>
    <text x="150" y="318" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">walks and rides the bus;</text>
    <text x="150" y="336" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">grows some food;</text>
    <text x="150" y="354" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">buys mostly local;</text>
    <text x="150" y="372" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">reuses and repairs.</text>
  </g>

  <!-- LIFE B (larger footprint) -->
  <g>
    <text x="372" y="86" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">LIFE B</text>
    <!-- larger footprint -->
    <g transform="translate(278 120) scale(1.0)">
      <path d="M60 40 Q150 -8 200 46 Q238 92 208 128 Q182 152 128 152 Q70 152 44 116 Q18 84 60 40 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="4"/>
      <circle cx="84" cy="46" r="11" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
      <circle cx="118" cy="30" r="11" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
      <circle cx="152" cy="34" r="11" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
      <circle cx="184" cy="52" r="11" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
    </g>
    <text x="372" y="318" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">drives a car daily;</text>
    <text x="372" y="336" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">buys packaged food flown</text>
    <text x="372" y="354" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">from far away;</text>
    <text x="372" y="372" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">replaces things often.</text>
  </g>

  <!-- bottom band -->
  <rect x="20" y="398" width="472" height="92" rx="12" fill="#f2ead8" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="426" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">A footprint is a measurement, not a score.</text>
  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Different lives use different amounts — not "better"</text>
  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">or "worse." Knowing yours helps you choose.</text>
</svg>
