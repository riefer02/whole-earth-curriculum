<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Forming a Reasoned Synthesis</title>
  <desc id="desc">Three boxes on the left — account A, account B, and what they agree on — each with an arrow feeding into one box on the right labeled "reasoned synthesis," which contains four lines: claim, strongest evidence, what the other account adds, what stays unsettled. Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2b3a42" font-weight="bold">From Weighing to Synthesis</text>

  <!-- left inputs -->
  <rect x="30" y="80" width="170" height="72" rx="8" fill="none" stroke="#6b93b6" stroke-width="3"/>
  <text x="115" y="108" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">Account A</text>
  <text x="115" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">what it notices</text>

  <rect x="30" y="176" width="170" height="72" rx="8" fill="none" stroke="#e0a458" stroke-width="3"/>
  <text x="115" y="204" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">Account B</text>
  <text x="115" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">what it notices</text>

  <rect x="30" y="272" width="170" height="72" rx="8" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <text x="115" y="300" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">What they agree on</text>
  <text x="115" y="322" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">the shared facts</text>

  <!-- arrows -->
  <line x1="200" y1="116" x2="272" y2="140" stroke="#2b3a42" stroke-width="3"/>
  <line x1="200" y1="212" x2="272" y2="212" stroke="#2b3a42" stroke-width="3"/>
  <line x1="200" y1="308" x2="272" y2="284" stroke="#2b3a42" stroke-width="3"/>

  <!-- synthesis box -->
  <rect x="286" y="96" width="196" height="220" rx="8" fill="none" stroke="#4f6d7a" stroke-width="3"/>
  <text x="384" y="124" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42" font-weight="bold">Reasoned synthesis</text>
  <line x1="302" y1="136" x2="466" y2="136" stroke="#4f6d7a" stroke-width="2"/>
  <text x="302" y="160" font-family="sans-serif" font-size="13" fill="#222222">1. Claim</text>
  <text x="302" y="184" font-family="sans-serif" font-size="13" fill="#222222">2. Strongest evidence</text>
  <text x="302" y="208" font-family="sans-serif" font-size="13" fill="#222222">3. What the other adds</text>
  <text x="302" y="232" font-family="sans-serif" font-size="13" fill="#222222">4. What stays unsettled</text>
  <text x="302" y="268" font-family="sans-serif" font-size="12" fill="#4f6d7a">One honest account,</text>
  <text x="302" y="286" font-family="sans-serif" font-size="12" fill="#4f6d7a">not a vote, not a tie.</text>

  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">Take a position, credit the other, admit the unsettled.</text>
</svg>
