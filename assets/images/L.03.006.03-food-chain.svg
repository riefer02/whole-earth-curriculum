<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" font-family="sans-serif">
  <title>A food chain</title>
  <desc>A food chain drawn left to right with arrows. The Sun shines on a grass plant labeled producer, then an arrow to a grasshopper labeled consumer, an arrow to a bird labeled consumer, an arrow to a worm and soil labeled decomposer, and a curved arrow from the decomposer back to the plant.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-size="26" fill="#222222" font-weight="bold">A food chain</text>

  <!-- Sun -->
  <circle cx="62" cy="140" r="26" fill="#e0a458"/>
  <g stroke="#e0a458" stroke-width="5" stroke-linecap="round">
    <line x1="62" y1="100" x2="62" y2="88"/>
    <line x1="62" y1="180" x2="62" y2="192"/>
    <line x1="22" y1="140" x2="10" y2="140"/>
    <line x1="102" y1="140" x2="114" y2="140"/>
    <line x1="34" y1="112" x2="26" y2="104"/>
    <line x1="90" y1="112" x2="98" y2="104"/>
    <line x1="34" y1="168" x2="26" y2="176"/>
    <line x1="90" y1="168" x2="98" y2="176"/>
  </g>
  <text x="62" y="222" text-anchor="middle" font-size="15" fill="#4f6d7a">Sun</text>

  <!-- arrow -->
  <line x1="96" y1="140" x2="122" y2="140" stroke="#4f6d7a" stroke-width="4"/>
  <polygon points="122,132 136,140 122,148" fill="#4f6d7a"/>

  <!-- grass -->
  <g stroke="#7a9e7e" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M150 200 Q148 160 144 138"/>
    <path d="M162 200 Q164 150 162 128"/>
    <path d="M174 200 Q178 158 180 136"/>
  </g>
  <line x1="138" y1="200" x2="186" y2="200" stroke="#4f6d7a" stroke-width="4"/>
  <text x="162" y="222" text-anchor="middle" font-size="15" fill="#4f6d7a">Grass</text>
  <text x="162" y="244" text-anchor="middle" font-size="14" fill="#2b3a42" font-weight="bold">producer</text>

  <!-- arrow -->
  <line x1="196" y1="140" x2="222" y2="140" stroke="#4f6d7a" stroke-width="4"/>
  <polygon points="222,132 236,140 222,148" fill="#4f6d7a"/>

  <!-- grasshopper -->
  <ellipse cx="258" cy="136" rx="16" ry="11" fill="#7a9e7e"/>
  <circle cx="274" cy="130" r="4" fill="#222222"/>
  <line x1="258" y1="147" x2="258" y2="162" stroke="#4f6d7a" stroke-width="4"/>
  <line x1="248" y1="168" x2="248" y2="180" stroke="#4f6d7a" stroke-width="3"/>
  <line x1="268" y1="168" x2="268" y2="180" stroke="#4f6d7a" stroke-width="3"/>
  <text x="258" y="222" text-anchor="middle" font-size="15" fill="#4f6d7a">Grasshopper</text>
  <text x="258" y="244" text-anchor="middle" font-size="14" fill="#2b3a42" font-weight="bold">consumer</text>

  <!-- arrow -->
  <line x1="288" y1="140" x2="314" y2="140" stroke="#4f6d7a" stroke-width="4"/>
  <polygon points="314,132 328,140 314,148" fill="#4f6d7a"/>

  <!-- bird -->
  <ellipse cx="350" cy="132" rx="18" ry="13" fill="#6b93b6"/>
  <circle cx="366" cy="126" r="4" fill="#222222"/>
  <polygon points="370,124 382,132 370,136" fill="#e0a458"/>
  <text x="350" y="222" text-anchor="middle" font-size="15" fill="#4f6d7a">Bird</text>
  <text x="350" y="244" text-anchor="middle" font-size="14" fill="#2b3a42" font-weight="bold">consumer</text>

  <!-- arrow -->
  <line x1="376" y1="140" x2="402" y2="140" stroke="#4f6d7a" stroke-width="4"/>
  <polygon points="402,132 416,140 402,148" fill="#4f6d7a"/>

  <!-- worm -->
  <path d="M430 150 q6 -10 12 0 q6 10 12 0" stroke="#e0a458" stroke-width="6" fill="none" stroke-linecap="round"/>
  <line x1="416" y1="160" x2="452" y2="160" stroke="#4f6d7a" stroke-width="4"/>
  <text x="434" y="222" text-anchor="middle" font-size="15" fill="#4f6d7a">Worm + soil</text>
  <text x="434" y="244" text-anchor="middle" font-size="14" fill="#2b3a42" font-weight="bold">decomposer</text>

  <!-- curved arrow back to grass -->
  <path d="M434 260 Q434 340 300 340 Q162 340 162 260" stroke="#4f6d7a" stroke-width="4" fill="none"/>
  <polygon points="154,264 162,250 170,264" fill="#4f6d7a"/>

  <!-- bottom note -->
  <rect x="90" y="368" width="332" height="76" rx="12" fill="#7a9e7e" opacity="0.18" stroke="#7a9e7e" stroke-width="2"/>
  <text x="256" y="398" text-anchor="middle" font-size="17" fill="#222222">Energy flows from the Sun to the plant</text>
  <text x="256" y="424" text-anchor="middle" font-size="17" fill="#222222">to the eaters, and the decomposers</text>
  <text x="256" y="444" text-anchor="middle" font-size="15" fill="#4f6d7a">return it to the soil. Every link matters.</text>
</svg>
