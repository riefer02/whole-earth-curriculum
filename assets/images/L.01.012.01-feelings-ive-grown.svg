    <text x="193" y="430" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">slow and droopy</text>
  </g>

  <!-- angry -->
  <g>
    <rect x="268" y="332" width="102" height="124" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="319" cy="372" r="20" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M299 372 A20 20 0 0 1 339 372 L339 362 A20 20 0 0 0 299 362 Z" fill="#4f6d7a"/>
    <line x1="309" y1="366" x2="321" y2="363" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <line x1="329" y1="363" x2="341" y2="366" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <circle cx="311" cy="372" r="1.8" fill="#2b3a42"/>
    <circle cx="327" cy="372" r="1.8" fill="#2b3a42"/>
    <line x1="311" y1="383" x2="327" y2="383" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <text x="319" y="410" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">angry</text>
    <text x="319" y="430" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">hot and tight</text>
  </g>

  <!-- scared -->
  <g>
    <rect x="394" y="332" width="102" height="124" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="445" cy="372" r="20" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M425 372 A20 20 0 0 1 465 372 L465 362 A20 20 0 0 0 425 362 Z" fill="#2b3a42"/>
    <path d="M435 364 Q440 360 445 364" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M445 364 Q450 360 455 364" fill="none" stroke="#2b3a42" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="437" cy="370" r="4" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="453" cy="370" r="4" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="437" cy="370" r="1.6" fill="#2b3a42"/>
    <circle cx="453" cy="370" r="1.6" fill="#2b3a42"/>
    <ellipse cx="445" cy="384" rx="3.5" ry="4.5" fill="#fdfbf7" stroke="#2b3a42" stroke-width="1.8"/>
    <text x="445" y="410" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">scared</text>
    <text x="445" y="430" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">fast and small</text>
  </g>

  <text x="256" y="488" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">A feeling is never wrong — only a guess about someone else's feeling can miss.</text>
</svg>
