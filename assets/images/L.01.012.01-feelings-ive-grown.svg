    <circle cx="75" cy="368" r="1.6" fill="#2b3a42"/>
    <path d="M57 382 Q67 390 77 382" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <text x="67" y="410" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">happy</text>
    <text x="67" y="430" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">light and sunny</text>
  </g>

  <!-- sad -->
  <g>
    <rect x="142" y="332" width="102" height="124" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="193" cy="372" r="20" fill="#d9a06b" stroke="#2b3a42" stroke-width="2"/>
    <path d="M173 372 A20 20 0 0 1 213 372 L213 362 A20 20 0 0 0 173 362 Z" fill="#2b3a42"/>
    <circle cx="185" cy="370" r="1.8" fill="#2b3a42"/>
    <circle cx="201" cy="370" r="1.8" fill="#2b3a42"/>
    <path d="M185 366 Q189 369 193 367" fill="none" stroke="#2b3a42" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M197 367 Q201 369 205 366" fill="none" stroke="#2b3a42" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M185 384 Q193 378 201 384" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M204 368 L208 373 L206 376" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
