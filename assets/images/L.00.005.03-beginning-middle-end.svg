<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-00-005-03-beginning-middle-end desc-L-00-005-03-beginning-middle-end">
  <title id="title-L-00-005-03-beginning-middle-end">Stories have a beginning, a middle, and an end</title>
  <desc id="desc-L-00-005-03-beginning-middle-end">Three frames in a row show the order of a story using a day: a rising sun for the beginning, a high bright sun for the middle, and a setting sun for the end. The frames are labeled BEGINNING, MIDDLE, and END, and bold arrows point from the first to the second and from the second to the third. Small words "first", "next", "last" sit under each frame. The labels, arrows, and the changing sun shape carry the meaning, so the picture prints clearly in grayscale and teaches that stories move in order from beginning to middle to end.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="48" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Beginning, Middle, End</text>

  <!-- Frame 1: beginning (sunrise) -->
  <rect x="20" y="96" width="130" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="85" y="124" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">BEGINNING</text>
  <path d="M40 214 L130 214" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <path d="M50 206 L52 222 M70 202 L72 222 M90 200 L92 222 M110 202 L112 222" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  <path d="M62 214 A26 26 0 0 1 62 166" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <circle cx="62" cy="190" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="85" y="264" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">first</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M155 172 L181 172" fill="none" stroke="#2b3a42" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>
  <path d="M173 164 L185 172 L173 180 Z" fill="#2b3a42"/>

  <!-- Frame 2: middle (high sun) -->
  <rect x="191" y="96" width="130" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="124" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">MIDDLE</text>
  <circle cx="256" cy="180" r="26" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M256 142 L256 132 M256 218 L256 228 M218 180 L208 180 M294 180 L304 180 M229 153 L222 146 M283 153 L290 146 M229 207 L222 214 M283 207 L290 214" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  <path d="M221 214 L291 214" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <text x="256" y="264" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">next</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M326 172 L352 172" fill="none" stroke="#2b3a42" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>
  <path d="M344 164 L356 172 L344 180 Z" fill="#2b3a42"/>

  <!-- Frame 3: end (sunset) -->
  <rect x="362" y="96" width="130" height="150" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="427" y="124" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">END</text>
  <path d="M382 214 L472 214" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <path d="M402 206 L400 222 M422 202 L420 222 M442 200 L440 222 M462 202 L460 222" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  <path d="M430 214 A26 26 0 0 0 430 166" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <circle cx="430" cy="190" r="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M420 196 Q412 206 404 210" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
  <text x="427" y="264" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">last</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="14.8" fill="#4f6d7a">First, next, last — the order helps your listeners follow you.</text>
</svg>
