<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Percentages: discounts, tax, and tips</title>
  <desc id="desc">A percentage diagram. A 10-by-10 grid of 100 small squares has 25 squares shaded, labeled "25 out of 100 = 25% = 1/4 = 0.25." Below it, a worked example shows a $40 item with a 20% discount: a bar of 100 parts with 20 shaded, and the computation 20% of 40 = 0.20 × 40 = 8, so the sale price is 40 − 8 = $32. Labels, counts, and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="30" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Percentages: "Out of 100"</text>

  <!-- 10x10 grid, 25 shaded -->
  <g>
    <!-- grid outline 160x160 at x=24,y=48 -->
    <rect x="24" y="48" width="160" height="160" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
    <!-- 25 shaded squares (first 2.5 rows) -->
    <g fill="#7a9e7e" stroke="#4f6d7a" stroke-width="1">
      <rect x="24" y="48" width="16" height="16"/>
      <rect x="40" y="48" width="16" height="16"/>
      <rect x="56" y="48" width="16" height="16"/>
      <rect x="72" y="48" width="16" height="16"/>
      <rect x="88" y="48" width="16" height="16"/>
      <rect x="104" y="48" width="16" height="16"/>
      <rect x="120" y="48" width="16" height="16"/>
      <rect x="136" y="48" width="16" height="16"/>
      <rect x="152" y="48" width="16" height="16"/>
      <rect x="168" y="48" width="16" height="16"/>
      <rect x="24" y="64" width="16" height="16"/>
      <rect x="40" y="64" width="16" height="16"/>
      <rect x="56" y="64" width="16" height="16"/>
      <rect x="72" y="64" width="16" height="16"/>
      <rect x="88" y="64" width="16" height="16"/>
      <rect x="104" y="64" width="16" height="16"/>
      <rect x="120" y="64" width="16" height="16"/>
      <rect x="136" y="64" width="16" height="16"/>
      <rect x="152" y="64" width="16" height="16"/>
      <rect x="168" y="64" width="16" height="16"/>
      <rect x="24" y="80" width="16" height="16"/>
      <rect x="40" y="80" width="16" height="16"/>
      <rect x="56" y="80" width="16" height="16"/>
      <rect x="72" y="80" width="16" height="16"/>
      <rect x="88" y="80" width="16" height="16"/>
    </g>
    <!-- grid lines -->
    <g stroke="#4f6d7a" stroke-width="1">
      <line x1="40" y1="48" x2="40" y2="208"/>
      <line x1="56" y1="48" x2="56" y2="208"/>
      <line x1="72" y1="48" x2="72" y2="208"/>
      <line x1="88" y1="48" x2="88" y2="208"/>
      <line x1="104" y1="48" x2="104" y2="208"/>
      <line x1="120" y1="48" x2="120" y2="208"/>
      <line x1="136" y1="48" x2="136" y2="208"/>
      <line x1="152" y1="48" x2="152" y2="208"/>
      <line x1="168" y1="48" x2="168" y2="208"/>
      <line x1="24" y1="64" x2="184" y2="64"/>
      <line x1="24" y1="80" x2="184" y2="80"/>
      <line x1="24" y1="96" x2="184" y2="96"/>
      <line x1="24" y1="112" x2="184" y2="112"/>
      <line x1="24" y1="128" x2="184" y2="128"/>
      <line x1="24" y1="144" x2="184" y2="144"/>
      <line x1="24" y1="160" x2="184" y2="160"/>
      <line x1="24" y1="176" x2="184" y2="176"/>
      <line x1="24" y1="192" x2="184" y2="192"/>
    </g>
    <text x="104" y="226" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">25 of 100 squares shaded</text>
  </g>

  <!-- equivalences -->
  <g>
    <text x="280" y="80" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">25%</text>
    <text x="280" y="112" font-family="sans-serif" font-size="15" fill="#4f6d7a">= 25 / 100</text>
    <text x="280" y="140" font-family="sans-serif" font-size="15" fill="#4f6d7a">= 1 / 4</text>
    <text x="280" y="168" font-family="sans-serif" font-size="15" fill="#4f6d7a">= 0.25</text>
    <text x="280" y="200" font-family="sans-serif" font-size="13" fill="#222222">a percent has fraction</text>
    <text x="280" y="218" font-family="sans-serif" font-size="13" fill="#222222">and decimal twins</text>
  </g>

  <!-- discount worked example -->
  <rect x="24" y="248" width="464" height="150" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="256" y="272" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Worked example: a $40 jacket, 20% off</text>
  <!-- 100-part bar with 20 shaded -->
  <rect x="40" y="286" width="200" height="20" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  <rect x="40" y="286" width="40" height="20" fill="#e0a458" stroke="#2b3a42" stroke-width="1"/>
  <text x="140" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">20 shaded = 20%</text>
  <text x="300" y="296" font-family="sans-serif" font-size="15" fill="#222222">20% = 0.20</text>
  <text x="300" y="318" font-family="sans-serif" font-size="15" fill="#222222">0.20 × 40 = $8 off</text>
  <text x="300" y="340" font-family="sans-serif" font-size="15" fill="#222222">40 − 8 = $32 sale price</text>
  <text x="256" y="378" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">discount subtracts · tax and tip add</text>

  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">percent → decimal → multiply → add or subtract</text>
  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">"per cent" = "per hundred" — from the Latin per centum</text>
  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">check the decimal point: 20% = 0.20, never 2.0</text>
</svg>
