<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-04-004-14-language-families-and-shared-roots desc-L-04-004-14-language-families-and-shared-roots">
  <title id="title-L-04-004-14-language-families-and-shared-roots">Language families and shared roots</title>
  <desc id="desc-L-04-004-14-language-families-and-shared-roots">A family tree has one shared root at the base and branches labeled with the word for mother in several related languages: mother, madre, mère, and Mutter. This shows that languages belong to families that share roots. Simple shapes, grayscale-printable.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">A Language Family</text>

  <!-- Root -->
  <rect x="176" y="380" width="160" height="66" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="410" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">one old root</text>
  <text x="256" y="434" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">"mother"</text>

  <!-- Trunk -->
  <rect x="240" y="300" width="32" height="80" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  <!-- Branches -->
  <g stroke="#2b3a42" stroke-width="3" fill="none">
    <path d="M256 300 Q256 260 82 260 L82 210"/>
    <path d="M256 300 Q256 260 198 260 L198 210"/>
    <path d="M256 300 Q256 260 314 260 L314 210"/>
    <path d="M256 300 Q256 260 430 260 L430 210"/>
  </g>

  <!-- Leaves: mother words -->
  <g font-family="sans-serif" font-size="22" fill="#222222" text-anchor="middle">
    <rect x="144" y="150" width="108" height="60" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="198" y="188">mother</text>
    <text x="198" y="128" text-anchor="middle" font-size="15" fill="#4f6d7a">English</text>

    <rect x="260" y="150" width="108" height="60" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="314" y="188">madre</text>
    <text x="314" y="128" text-anchor="middle" font-size="15" fill="#4f6d7a">Spanish</text>

    <rect x="376" y="150" width="108" height="60" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="430" y="188">mère</text>
    <text x="430" y="128" text-anchor="middle" font-size="15" fill="#4f6d7a">French</text>
  </g>

  <rect x="28" y="150" width="108" height="60" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="82" y="188" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222222">Mutter</text>
  <text x="82" y="128" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">German</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42">Cousin languages, one shared root.</text>
</svg>
