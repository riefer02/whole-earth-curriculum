<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">The stress wave and the return to calm</title>
  <desc id="d">Two panels. Left: a person with a fast heart, quick breath, and tense muscles, labeled "sympathetic — the stress wave." Right: the same person settled, labeled "parasympathetic — the return to calm," with a slow, long-exhale breath. Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222222">The wave rises, and the wave returns</text>
  <!-- left panel: stress wave -->
  <rect x="28" y="70" width="218" height="360" rx="12" fill="#e0a458" opacity="0.22" stroke="#2b3a42" stroke-width="2"/>
  <text x="137" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222222">sympathetic</text>
  <text x="137" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6d7a">the stress wave</text>
  <circle cx="137" cy="188" r="34" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M100 222 Q100 204 137 204 Q174 204 174 222 L186 300 L166 360 L137 376 L108 360 L88 300 Z" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M102 250 Q72 272 60 322" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M172 250 Q202 272 214 322" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <!-- heart -->
  <path d="M126 240 c-2 -10 12 -16 11 -4 c-1 -12 13 -6 11 4 c-1 7 -12 14 -11 4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="137" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#222222">heart fast</text>
  <text x="137" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#222222">breath quick</text>
  <text x="137" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#222222">muscles tense</text>
  <text x="137" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4f6d7a">readies you to act</text>
  <!-- right panel: return to calm -->
  <rect x="266" y="70" width="218" height="360" rx="12" fill="#7a9e7e" opacity="0.25" stroke="#2b3a42" stroke-width="2"/>
  <text x="375" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222222">parasympathetic</text>
  <text x="375" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6d7a">the return to calm</text>
  <circle cx="375" cy="188" r="34" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M338 222 Q338 204 375 204 Q412 204 412 222 L424 300 L404 360 L375 376 L346 360 L326 300 Z" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <path d="M340 250 Q310 272 298 322" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M410 250 Q440 272 452 322" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <!-- calm breath curve -->
  <path d="M360 250 q8 -14 16 0 q8 14 16 0" fill="none" stroke="#7a9e7e" stroke-width="3" stroke-linecap="round"/>
  <text x="375" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#222222">heart settles</text>
  <text x="375" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#222222">breath slows</text>
  <text x="375" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#222222">muscles release</text>
  <text x="375" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4f6d7a">lets you rest and repair</text>
  <text x="256" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#222222">Trouble is a wave that never turns off — not the wave itself.</text>
</svg>
