<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The quadrilateral family: a square is a rectangle and a rhombus</title>
  <desc id="desc">A family tree diagram. At the top, quadrilaterals with four sides and four angles. Below it, rectangles with four right angles and rhombuses with four equal sides. At the bottom, a square sitting under both, labeled a square is both a rectangle and a rhombus.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">The Quadrilateral Family</text>

  <!-- Top: quadrilateral -->
  <rect x="156" y="72" width="200" height="64" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="100" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">Quadrilateral</text>
  <text x="256" y="122" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">4 sides, 4 angles</text>

  <line x1="256" y1="136" x2="256" y2="160" stroke="#2b3a42" stroke-width="2"/>
  <line x1="256" y1="160" x2="140" y2="160" stroke="#2b3a42" stroke-width="2"/>
  <line x1="256" y1="160" x2="372" y2="160" stroke="#2b3a42" stroke-width="2"/>
  <line x1="140" y1="160" x2="140" y2="184" stroke="#2b3a42" stroke-width="2"/>
  <line x1="372" y1="160" x2="372" y2="184" stroke="#2b3a42" stroke-width="2"/>

  <!-- Rectangles -->
  <rect x="64" y="184" width="152" height="64" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="140" y="212" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Rectangle</text>
  <text x="140" y="234" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">4 right angles</text>

  <!-- Rhombus -->
  <rect x="296" y="184" width="152" height="64" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="372" y="212" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Rhombus</text>
  <text x="372" y="234" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">4 equal sides</text>

  <line x1="140" y1="248" x2="140" y2="272" stroke="#2b3a42" stroke-width="2"/>
  <line x1="372" y1="248" x2="372" y2="272" stroke="#2b3a42" stroke-width="2"/>
  <line x1="140" y1="272" x2="256" y2="272" stroke="#2b3a42" stroke-width="2"/>
  <line x1="372" y1="272" x2="256" y2="272" stroke="#2b3a42" stroke-width="2"/>
  <line x1="256" y1="272" x2="256" y2="296" stroke="#2b3a42" stroke-width="2"/>

  <!-- Square -->
  <rect x="166" y="296" width="180" height="64" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="324" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2b3a42">Square</text>
  <text x="256" y="346" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">4 equal sides AND 4 right angles</text>

  <rect x="96" y="390" width="320" height="70" rx="12" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
  <text x="256" y="418" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">A square is a rectangle AND a rhombus.</text>
  <text x="256" y="444" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">A shape can wear more than one name.</text>

  <text x="256" y="490" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#4f6d7a">Names describe shared properties.</text>
</svg>
