<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 480" role="img" aria-labelledby="title desc">
  <title id="title">The environment shapes design</title>
  <desc id="desc">A four-panel comparison titled "The environment shapes design." The left panel, labeled "igloo — Arctic cold," shows a dome of snow blocks with the note "snow blocks — dome sheds wind, packed snow holds warmth." The second panel, labeled "yurt (ger) — open steppe," shows a round tent with a felt covering and the note "felt from sheep wool on a wooden lattice — portable for herders." The third panel, labeled "stilt house — floodplain," shows a wooden house raised on posts above water with the note "wood on stilts — lifted above the flood." The right panel, labeled "adobe house — dry heat," shows a flat-roofed house with thick walls and the note "thick mud-brick walls — cool inside the heat." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="480" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">The Environment Shapes Design</text>

  <!-- Panel 1: igloo -->
  <rect x="20" y="66" width="112" height="366" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="76" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">igloo</text>
  <text x="76" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">Arctic cold</text>
  <!-- snow dome -->
  <path d="M36 240 Q76 150 116 240 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#2b3a42" stroke-width="1.2" fill="none">
    <path d="M48 240 Q76 176 104 240"/>
    <path d="M36 240 L116 240"/>
    <path d="M56 200 L58 240 M76 184 L76 240 M96 200 L94 240"/>
  </g>
  <rect x="62" y="240" width="28" height="20" fill="#2b3a42"/>
  <text x="76" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">snow blocks — dome</text>
  <text x="76" y="304" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">sheds wind, packed</text>
  <text x="76" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">snow holds warmth</text>

  <!-- Panel 2: yurt -->
  <rect x="144" y="66" width="112" height="366" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="200" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">yurt (ger)</text>
  <text x="200" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">open steppe</text>
  <!-- round tent -->
  <path d="M156 260 L150 190 Q200 168 250 190 L244 260 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M158 226 Q200 208 242 226" fill="none" stroke="#2b3a42" stroke-width="1.5"/>
  <g stroke="#2b3a42" stroke-width="1.2" fill="none">
    <line x1="162" y1="236" x2="162" y2="258"/>
    <line x1="184" y1="248" x2="184" y2="260"/>
    <line x1="216" y1="248" x2="216" y2="260"/>
    <line x1="238" y1="236" x2="238" y2="258"/>
  </g>
  <path d="M150 190 L200 178 L250 190" fill="none" stroke="#2b3a42" stroke-width="2"/>
  <text x="200" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">felt from sheep wool</text>
  <text x="200" y="304" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">on a wooden lattice —</text>
  <text x="200" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">portable for herders</text>

  <!-- Panel 3: stilt house -->
  <rect x="268" y="66" width="112" height="366" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="324" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">stilt house</text>
  <text x="324" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">floodplain</text>
  <!-- water -->
  <path d="M268 268 Q286 262 304 268 Q322 274 340 268 Q358 262 380 268 L380 286 L268 286 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
  <!-- house on stilts -->
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <rect x="288" y="182" width="72" height="52" fill="#ffffff" stroke-width="2"/>
    <path d="M284 182 L324 158 L364 182 Z" fill="#ffffff" stroke-width="2"/>
    <line x1="296" y1="234" x2="296" y2="268"/>
    <line x1="352" y1="234" x2="352" y2="268"/>
    <line x1="308" y1="234" x2="308" y2="268"/>
    <line x1="340" y1="234" x2="340" y2="268"/>
    <rect x="318" y="206" width="14" height="28" fill="#ffffff"/>
  </g>
  <text x="324" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">wood on stilts —</text>
  <text x="324" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">lifted above</text>
  <text x="324" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">the flood</text>

  <!-- Panel 4: adobe -->
  <rect x="392" y="66" width="112" height="366" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="448" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">adobe house</text>
  <text x="448" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">dry heat</text>
  <!-- thick walled flat-roof house -->
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <rect x="408" y="196" width="80" height="64" fill="#ffffff"/>
    <path d="M408 196 L448 196 L448 260 L408 260 Z" fill="none"/>
    <rect x="432" y="226" width="14" height="34" fill="#ffffff"/>
    <rect x="416" y="206" width="12" height="12" fill="#ffffff"/>
    <rect x="468" y="206" width="12" height="12" fill="#ffffff"/>
  </g>
  <!-- sun -->
  <circle cx="466" cy="140" r="12" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#e0a458" stroke-width="2" stroke-linecap="round">
    <line x1="466" y1="120" x2="466" y2="112"/>
    <line x1="466" y1="160" x2="466" y2="168"/>
    <line x1="446" y1="140" x2="438" y2="140"/>
    <line x1="486" y1="140" x2="494" y2="140"/>
  </g>
  <text x="448" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">thick mud-brick</text>
  <text x="448" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">walls — cool inside</text>
  <text x="448" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">the heat</text>

  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2b3a42">same need — shelter · different climate and resources · different design</text>
</svg>
