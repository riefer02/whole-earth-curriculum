<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">What we do together: everyone helps in their own small way</title>
  <desc id="desc">Two panels. The left panel, labeled "we do this together," shows four people of different ages and skin tones planting a garden together around a garden bed: one kneels planting a seedling, one waters with a can, one carries a pot, and one — a child in a wheelchair — hands over a trowel. The right panel, labeled "I help out," shows one child sweeping the ground while another waters a single plant. A bottom note reads "no one does everything; everyone does something." The planting, sweeping, and watering actions and the labels carry the meaning, not color, so the picture prints clearly in grayscale and teaches that a community is kept strong by many small acts of care, not by one big hero.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Title -->
  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">What We Do Together</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Everyone helps in their own small way</text>

  <!-- Ground -->
  <line x1="24" y1="330" x2="488" y2="330" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>

  <!-- Panel frames -->
  <rect x="18" y="92" width="284" height="248" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="316" y="92" width="178" height="248" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>

  <text x="160" y="116" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">we do this together</text>
  <text x="405" y="116" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">I help out</text>

  <!-- ===== Left panel: planting together ===== -->
  <!-- garden bed -->
  <rect x="60" y="284" width="200" height="34" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="60" y1="294" x2="260" y2="294" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <!-- seedlings -->
  <line x1="92" y1="284" x2="92" y2="266" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="92" cy="262" rx="7" ry="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="128" y1="284" x2="128" y2="270" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="128" cy="266" rx="7" ry="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <line x1="230" y1="284" x2="230" y2="268" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="230" cy="264" rx="7" ry="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  <!-- person 1: kneeling planting -->
  <g>
    <circle cx="110" cy="210" r="17" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M93 208 A17 17 0 0 1 127 208 Z" fill="#2b3a42"/>
    <circle cx="104" cy="210" r="1.8" fill="#2b3a42"/>
    <circle cx="116" cy="210" r="1.8" fill="#2b3a42"/>
    <path d="M104 220 Q110 225 116 220" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="96" y="228" width="28" height="40" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="102" y1="268" x2="96" y2="296" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="118" y1="268" x2="126" y2="296" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="96" y1="238" x2="72" y2="256" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- person 2: watering with can -->
  <g>
    <circle cx="180" cy="196" r="17" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <path d="M163 194 A17 17 0 0 1 197 194 Z" fill="#4f6d7a"/>
    <circle cx="174" cy="196" r="1.8" fill="#2b3a42"/>
    <circle cx="186" cy="196" r="1.8" fill="#2b3a42"/>
    <path d="M174 206 Q180 211 186 206" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="166" y="214" width="28" height="44" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="172" y1="258" x2="170" y2="296" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="188" y1="258" x2="190" y2="296" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <!-- watering can -->
    <path d="M190 224 L206 224 L206 240 Q206 252 194 252 L190 252 Q186 252 186 244 L186 236 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M206 230 L216 222" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M190 248 Q186 258 180 264" fill="none" stroke="#6b93b6" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="180" cy="266" r="1.4" fill="#6b93b6"/>
  </g>

  <!-- person 3: carrying a pot -->
  <g>
    <circle cx="236" cy="200" r="16" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <path d="M220 198 A16 16 0 0 1 252 198 Z" fill="#2b3a42"/>
    <circle cx="230" cy="200" r="1.8" fill="#2b3a42"/>
    <circle cx="242" cy="200" r="1.8" fill="#2b3a42"/>
    <path d="M230 210 Q236 215 242 210" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="222" y="217" width="28" height="42" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="228" y1="259" x2="226" y2="296" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="244" y1="259" x2="246" y2="296" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <rect x="204" y="238" width="16" height="20" rx="3" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- person 4: child in wheelchair handing a trowel -->
  <g>
    <circle cx="160" cy="258" r="13" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M147 256 A13 13 0 0 1 173 256 Z" fill="#4f6d7a"/>
    <circle cx="155" cy="258" r="1.6" fill="#2b3a42"/>
    <circle cx="165" cy="258" r="1.6" fill="#2b3a42"/>
    <path d="M155 266 Q160 270 165 266" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="150" y="272" width="20" height="30" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="150" y1="280" x2="132" y2="292" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <!-- wheelchair -->
    <rect x="138" y="302" width="44" height="18" rx="6" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="152" cy="322" r="9" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="184" cy="322" r="9" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <line x1="166" y1="286" x2="166" y2="306" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="152" y1="306" x2="152" y2="320" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <line x1="184" y1="306" x2="184" y2="320" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <!-- trowel being handed -->
    <line x1="132" y1="296" x2="118" y2="284" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <path d="M112 288 L120 276 L126 286 Z" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- ===== Right panel: I help out ===== -->
  <!-- child sweeping -->
  <g>
    <circle cx="378" cy="196" r="16" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M362 194 A16 16 0 0 1 394 194 Z" fill="#2b3a42"/>
    <circle cx="372" cy="196" r="1.8" fill="#2b3a42"/>
    <circle cx="384" cy="196" r="1.8" fill="#2b3a42"/>
    <path d="M372 206 Q378 211 384 206" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="364" y="213" width="28" height="44" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="370" y1="257" x2="368" y2="296" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="386" y1="257" x2="388" y2="296" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <!-- broom -->
    <line x1="398" y1="226" x2="428" y2="308" stroke="#2b3a42" stroke-width="5" stroke-linecap="round"/>
    <path d="M418 306 L436 316 L428 322 L412 312 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <!-- child watering a plant -->
  <g>
    <circle cx="460" cy="200" r="14" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M446 198 A14 14 0 0 1 474 198 Z" fill="#2b3a42"/>
    <circle cx="455" cy="200" r="1.6" fill="#2b3a42"/>
    <circle cx="465" cy="200" r="1.6" fill="#2b3a42"/>
    <path d="M455 208 Q460 212 465 208" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="452" y="215" width="22" height="38" rx="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="458" y1="253" x2="456" y2="296" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <line x1="468" y1="253" x2="470" y2="296" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
    <!-- small plant in pot -->
    <path d="M442 296 L444 274 L458 274 L460 296 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="451" y1="274" x2="451" y2="258" stroke="#2b3a42" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="451" cy="254" rx="6" ry="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M472 232 Q476 240 472 248" fill="none" stroke="#6b93b6" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="405" y="338" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">sweep, water a plant</text>

  <!-- Bottom note -->
  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">No one does everything; everyone does something.</text>
</svg>
