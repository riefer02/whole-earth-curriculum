<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">One idea, many languages</title>
  <desc id="desc">Five cards, all the same size and held at the same height, each show the same idea — thank you — in a different language and script: Latin letters, Arabic script, Devanagari, Chinese characters, and a signed gesture of thanks. The caption reads "one idea, many languages." The labels and shapes carry the meaning, so the picture prints clearly in grayscale and teaches learners that the same idea can be said in many languages, none above another.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">One Idea, Many Languages</text>

  <!-- five equal cards -->
  <g font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">
    <rect x="40" y="130" width="130" height="90" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="105" y="178" text-anchor="middle">thank you</text>

    <rect x="192" y="130" width="130" height="90" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="257" y="182" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans', 'Arial Unicode MS', sans-serif" font-size="24">شكرا</text>

    <rect x="344" y="130" width="130" height="90" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="409" y="182" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans', 'Arial Unicode MS', sans-serif" font-size="24">धन्यवाद</text>

    <rect x="116" y="250" width="130" height="90" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="181" y="300" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans', 'Arial Unicode MS', sans-serif" font-size="26">谢谢</text>

    <!-- signed thanks -->
    <rect x="268" y="250" width="130" height="90" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="306" cy="290" r="10" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M336 276 L352 288 M336 296 L354 304" stroke="#4f6d7a" stroke-width="3" stroke-linecap="round"/>
    <text x="333" y="322" text-anchor="middle" font-size="12" fill="#4f6d7a" font-weight="normal">signed</text>
  </g>

  <!-- equal sign -->
  <g>
    <line x1="410" y1="296" x2="452" y2="296" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
    <line x1="410" y1="308" x2="452" y2="308" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="256" y="404" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#4f6d7a">one idea, many languages</text>
  <text x="256" y="428" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">Every language says the same idea in its own way — none above another.</text>
</svg>
