<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Why people move</title>
  <desc id="desc">A simple home with two people sits on the left, and a new home with two people sits on the right. A dotted arrow points from the first home to the second, with the word "move" on it. Around the arrow are four small labeled cards showing reasons people move: family (people holding hands), work (a tool and bag), safety (a shield), and environment (sun and rain). Labels and shapes, not color, carry the meaning so it prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Why People Move</text>
  <text x="256" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">People move from one place to another for many reasons.</text>

  <!-- left home -->
  <rect x="52" y="330" width="100" height="70" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M44 334 L102 300 L160 334 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <rect x="92" y="364" width="20" height="36" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="112" cy="288" r="12" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M112 300 l0 22 M104 306 l8 8 l8 -8" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="78" cy="292" r="11" fill="#8d5a3a" stroke="#2b3a42" stroke-width="2"/>
  <path d="M78 303 l0 20 M71 309 l7 7 l7 -7" stroke="#2b3a42" stroke-width="2"/>
  <text x="102" y="424" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">old home</text>

  <!-- arrow -->
  <path d="M180 360 L332 360" stroke="#2b3a42" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8"/>
  <path d="M324 352 l14 8 l-14 8 Z" fill="#2b3a42"/>
  <text x="256" y="350" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">move</text>

  <!-- right home -->
  <rect x="360" y="330" width="100" height="70" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <path d="M352 334 L410 300 L468 334 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <rect x="400" y="364" width="20" height="36" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="428" cy="288" r="12" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M428 300 l0 22 M420 306 l8 8 l8 -8" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="384" cy="292" r="11" fill="#8d5a3a" stroke="#2b3a42" stroke-width="2"/>
  <path d="M384 303 l0 20 M377 309 l7 7 l7 -7" stroke="#2b3a42" stroke-width="2"/>
  <text x="410" y="424" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">new home</text>

  <!-- reason cards -->
  <g font-family="sans-serif">
    <rect x="52" y="96" width="92" height="76" rx="8" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <circle cx="82" cy="120" r="8" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="100" cy="122" r="8" fill="#8d5a3a" stroke="#2b3a42" stroke-width="2"/>
    <path d="M82 128 q9 8 18 0" stroke="#2b3a42" stroke-width="2" fill="none"/>
    <text x="98" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b3a42">family</text>

    <rect x="156" y="96" width="92" height="76" rx="8" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <rect x="180" y="112" width="26" height="18" rx="2" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M206 112 l0 18" stroke="#2b3a42" stroke-width="2"/>
    <text x="202" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b3a42">work</text>

    <rect x="260" y="96" width="92" height="76" rx="8" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <path d="M282 116 q20 -6 40 0 l-4 20 l-14 0 l-6 -12 l-6 12 l-14 0 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="306" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b3a42">safety</text>

    <rect x="364" y="96" width="92" height="76" rx="8" fill="#ffffff" stroke="#4f6d7a" stroke-width="2"/>
    <circle cx="396" cy="122" r="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M396 108 l0 -6 M396 142 l0 -6 M382 122 l-6 0 M416 122 l6 0 M386 112 l-4 -4 M406 112 l4 -4 M386 132 l-4 4 M406 132 l4 4" stroke="#2b3a42" stroke-width="2"/>
    <text x="410" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b3a42">environment</text>
  </g>

  <text x="256" y="466" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Family, work, safety, or the environment —</text>
  <text x="256" y="488" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">every move has a reason, and every reason is real.</text>
</svg>
