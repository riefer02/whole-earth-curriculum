<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Cultural Foodways and Lifelong Food Decisions</title>
  <desc id="desc">A bowl at the center with labeled threads reaching out to culture, family, memory, ritual, health, and Earth, captioned "food is more than fuel."</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Food Is More Than Fuel</text>

  <!-- central bowl -->
  <path d="M 196 240 C 196 282, 316 282, 316 240 Z" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
  <ellipse cx="256" cy="240" rx="60" ry="14" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="266" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42">a dish</text>

  <!-- six thread labels -->
  <g font-family="sans-serif" font-size="15" fill="#4f6d7a" text-anchor="middle">
    <text x="256" y="116">culture</text>
    <text x="92" y="150">family</text>
    <text x="420" y="150">memory</text>
    <text x="92" y="360">ritual</text>
    <text x="420" y="360">health</text>
    <text x="256" y="396">Earth</text>
  </g>

  <!-- threads -->
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="256" y1="200" x2="256" y2="126"/>
    <line x1="206" y1="216" x2="118" y2="162"/>
    <line x1="306" y1="216" x2="394" y2="162"/>
    <line x1="206" y1="262" x2="118" y2="346"/>
    <line x1="306" y1="262" x2="394" y2="346"/>
    <line x1="256" y1="286" x2="256" y2="386"/>
  </g>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">No food is ranked above another; every table is honored.</text>
</svg>
