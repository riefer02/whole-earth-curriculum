<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Reading a food ad: spotting the claim and asking for evidence</title>
  <desc id="desc">A worked example of reading a food advertisement. A poster reads "NEW! SUNNY CRUNCH — Fuels your day!" with a smiling sun mascot and a tiny fine-print line at the bottom. Four annotation callouts point to parts of the ad and label them: Claim (Fuels your day), Feeling appeal (happy sun, warm colors), Fine print (tiny text with limits), and No evidence shown (no tests, no amounts).</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Reading a food ad, piece by piece</text>

  <!-- ad poster -->
  <g>
    <rect x="136" y="150" width="240" height="300" rx="12" fill="#fdf0d8" stroke="#2b3a42" stroke-width="2.5"/>
    <circle cx="256" cy="222" r="34" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
    <g stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round">
      <line x1="256" y1="188" x2="256" y2="172"/>
      <line x1="256" y1="256" x2="256" y2="272"/>
      <line x1="222" y1="222" x2="206" y2="222"/>
      <line x1="290" y1="222" x2="306" y2="222"/>
      <line x1="232" y1="198" x2="220" y2="186"/>
      <line x1="280" y1="198" x2="292" y2="186"/>
      <line x1="232" y1="246" x2="220" y2="258"/>
      <line x1="280" y1="246" x2="292" y2="258"/>
    </g>
    <path d="M244 226 Q256 234 268 226" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="242" cy="216" r="2.5" fill="#2b3a42"/>
    <circle cx="270" cy="216" r="2.5" fill="#2b3a42"/>

    <text x="256" y="300" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">NEW! SUNNY CRUNCH</text>
    <text x="256" y="326" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#e0a458">"Fuels your day!"</text>
    <rect x="160" y="342" width="192" height="34" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="256" y="365" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">Everyone loves it!</text>

    <text x="256" y="424" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#4f6d7a">*one serving, as part of a balanced day. not a substitute.</text>
  </g>

  <!-- annotation callouts -->
  <g font-family="sans-serif" font-size="13">
    <!-- claim -->
    <line x1="256" y1="332" x2="256" y2="316" stroke="#e0a458" stroke-width="2"/>
    <rect x="150" y="66" width="212" height="26" rx="6" fill="#e0a458" fill-opacity="0.2" stroke="#e0a458" stroke-width="2"/>
    <text x="256" y="84" text-anchor="middle" font-weight="bold" fill="#2b3a42">Claim: "Fuels your day!"</text>
    <line x1="256" y1="92" x2="256" y2="150" stroke="#e0a458" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- feeling appeal -->
    <line x1="304" y1="222" x2="360" y2="222" stroke="#6b93b6" stroke-width="2"/>
    <rect x="364" y="208" width="136" height="30" rx="6" fill="#6b93b6" fill-opacity="0.2" stroke="#6b93b6" stroke-width="2"/>
    <text x="432" y="228" text-anchor="middle" font-weight="bold" fill="#2b3a42">Feeling appeal:</text>
    <rect x="370" y="240" width="124" height="24" rx="6" fill="#6b93b6" fill-opacity="0.15" stroke="#6b93b6" stroke-width="2"/>
    <text x="432" y="257" text-anchor="middle" fill="#2b3a42">happy sun, warm colors</text>

    <!-- no evidence -->
    <line x1="150" y1="250" x2="120" y2="250" stroke="#7a9e7e" stroke-width="2"/>
    <rect x="12" y="220" width="104" height="60" rx="6" fill="#7a9e7e" fill-opacity="0.2" stroke="#7a9e7e" stroke-width="2"/>
    <text x="64" y="242" text-anchor="middle" font-weight="bold" fill="#2b3a42">No evidence</text>
    <text x="64" y="258" text-anchor="middle" font-size="11" fill="#2b3a42">shown: no tests,</text>
    <text x="64" y="272" text-anchor="middle" font-size="11" fill="#2b3a42">no amounts</text>

    <!-- fine print -->
    <line x1="256" y1="418" x2="256" y2="446" stroke="#4f6d7a" stroke-width="2"/>
    <rect x="150" y="448" width="212" height="44" rx="6" fill="#4f6d7a" fill-opacity="0.15" stroke="#4f6d7a" stroke-width="2"/>
    <text x="256" y="468" text-anchor="middle" font-weight="bold" fill="#2b3a42">Fine print: tiny text with limits</text>
    <text x="256" y="484" text-anchor="middle" font-size="11" fill="#2b3a42">("one serving... not a substitute")</text>
  </g>
</svg>
