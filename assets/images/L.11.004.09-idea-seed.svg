<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A seed idea grows into a work</title>
  <desc id="desc">A seed in the ground sprouts into a growing plant. Along the stem, five stages are labeled from bottom to top: seed idea, one question, first move, developing arc, full work — showing a single idea growing into a sustained piece of writing.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="30" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">From Seed to Sustained Work</text>

  <!-- Ground -->
  <line x1="40" y1="400" x2="472" y2="400" stroke="#7a9e7e" stroke-width="3"/>
  <path d="M40 400 q40 -14 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t12 0" fill="none" stroke="#7a9e7e" stroke-width="2"/>

  <!-- Seed -->
  <ellipse cx="256" cy="410" rx="16" ry="11" fill="#8a6d4a" stroke="#2b3a42" stroke-width="2"/>
  <path d="M256 410 q-40 -40 0 -80" stroke="#2b3a42" stroke-width="2" fill="none"/>

  <!-- Stem -->
  <path d="M256 340 C 240 300, 272 260, 256 210 C 246 180, 266 140, 256 96" stroke="#4f6d7a" stroke-width="3" fill="none"/>

  <!-- Leaves -->
  <ellipse cx="232" cy="280" rx="26" ry="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" transform="rotate(-30 232 280)"/>
  <ellipse cx="284" cy="200" rx="26" ry="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" transform="rotate(25 284 200)"/>

  <!-- Flower -->
  <g transform="translate(256 76)">
    <ellipse cx="0" cy="-14" rx="10" ry="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="14" cy="-4" rx="16" ry="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="0" cy="8" rx="10" ry="16" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="-14" cy="-4" rx="16" ry="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="0" cy="-4" r="7" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2"/>
  </g>

  <!-- Stage labels -->
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <text x="300" y="416">seed idea</text>
    <text x="300" y="342">one question</text>
    <text x="300" y="250">first move</text>
    <text x="300" y="166">developing arc</text>
    <text x="300" y="84">full work</text>
  </g>

  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">one idea, given time, becomes a sustained work</text>
</svg>
