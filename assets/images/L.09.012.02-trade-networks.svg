<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Long-distance trade: three networks</title>
  <desc id="desc">A simple map showing three long-distance trade networks: the overland Silk Roads across Central Asia, the monsoon-driven Indian Ocean sea routes, and the trans-Saharan desert routes, each labeled with its goods.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#2b3a42">Long-Distance Trade: Three Networks</text>

  <!-- Silk Roads band (overland) -->
  <rect x="30" y="72" width="452" height="66" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="52" cy="105" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="70" y="101" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Silk Roads (overland)</text>
  <text x="70" y="120" font-family="sans-serif" font-size="12" fill="#4f6d7a">silk · paper · spices · ideas (Buddhism)</text>
  <path d="M40 138 h40" fill="none" stroke="#e0a458" stroke-width="3"/>

  <!-- Indian Ocean band (sea) -->
  <rect x="30" y="156" width="452" height="66" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="52" cy="189" r="9" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="70" y="185" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Indian Ocean (sea)</text>
  <text x="70" y="204" font-family="sans-serif" font-size="12" fill="#4f6d7a">monsoon winds · dhows · gold, cloth, rice</text>
  <path d="M40 222 h40" fill="none" stroke="#6b93b6" stroke-width="3"/>

  <!-- Trans-Saharan band (desert) -->
  <rect x="30" y="240" width="452" height="66" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="52" cy="273" r="9" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="70" y="269" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Trans-Saharan (desert)</text>
  <text x="70" y="288" font-family="sans-serif" font-size="12" fill="#4f6d7a">camel caravans · gold for salt · books</text>
  <path d="M40 306 h40" fill="none" stroke="#7a9e7e" stroke-width="3"/>

  <!-- continuity vs change -->
  <rect x="30" y="330" width="452" height="150" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="356" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">What stayed the same · what changed</text>
  <text x="46" y="384" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">CONTINUED: goods, ideas, and beliefs moved for</text>
  <text x="46" y="402" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">centuries; merchants met across many faiths and lands</text>
  <text x="46" y="432" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">CHANGED: routes shifted, new goods joined old ones,</text>
  <text x="46" y="450" font-family="sans-serif" font-size="12.5" fill="#4f6d7a">new seafaring and caravan tools spread the network</text>
</svg>
