<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-06-006-05-cell-basic-unit desc-L-06-006-05-cell-basic-unit">
  <title id="title-L-06-006-05-cell-basic-unit">Cells: the basic unit of life</title>
  <desc id="desc-L-06-006-05-cell-basic-unit">A diagram of cells as the basic unit of life. On the left, an animal cell is a rounded shape with a labeled outer membrane, a central labeled nucleus, and labeled cytoplasm filling the inside. In the middle, a plant cell is a more boxy shape with a thick labeled cell wall outside the membrane, a nucleus, cytoplasm, and small labeled chloroplasts. On the right, a single-celled organism (an amoeba) is one irregular cell with a nucleus, labeled one cell equals one whole living thing. A title reads: cells are the basic unit of life. Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Cells: The Basic Unit of Life</text>
  <text x="256" y="56" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">every living thing is made of cells — some are just one cell</text>

  <!-- animal cell -->
  <g>
    <ellipse cx="100" cy="180" rx="74" ry="84" fill="#6b93b6" fill-opacity="0.35" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="100" cy="180" rx="74" ry="84" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="100" cy="180" r="22" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="100" y="280" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">animal cell</text>
    <!-- labels -->
    <line x1="80" y1="130" x2="170" y2="118" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="176" y="122" font-family="sans-serif" font-size="12" fill="#222222">membrane</text>
    <line x1="108" y1="158" x2="188" y2="154" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="194" y="158" font-family="sans-serif" font-size="12" fill="#222222">nucleus</text>
    <line x1="60" y1="210" x2="170" y2="210" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="176" y="214" font-family="sans-serif" font-size="12" fill="#222222">cytoplasm</text>
  </g>

  <!-- plant cell -->
  <g>
    <rect x="206" y="96" width="150" height="168" rx="14" fill="#7a9e7e" fill-opacity="0.35" stroke="#2b3a42" stroke-width="2"/>
    <rect x="214" y="104" width="134" height="152" rx="10" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="281" cy="180" r="20" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <g fill="#7a9e7e" stroke="#2b3a42" stroke-width="2">
      <ellipse cx="246" cy="220" rx="12" ry="7"/>
      <ellipse cx="314" cy="140" rx="12" ry="7"/>
      <ellipse cx="248" cy="134" rx="12" ry="7"/>
      <ellipse cx="312" cy="222" rx="12" ry="7"/>
    </g>
    <text x="281" y="280" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">plant cell</text>
    <!-- labels -->
    <line x1="356" y1="104" x2="382" y2="98" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="388" y="102" font-family="sans-serif" font-size="12" fill="#222222">cell wall</text>
    <line x1="324" y1="220" x2="382" y2="226" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="388" y="230" font-family="sans-serif" font-size="12" fill="#222222">chloroplast</text>
  </g>

  <!-- single celled -->
  <g>
    <path d="M 412 126 C 442 106 472 116 482 146 C 492 176 472 216 442 226 C 412 236 382 216 380 176 C 378 146 392 136 412 126 Z"
          fill="#e0a458" fill-opacity="0.4" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="432" cy="171" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="412" y="284" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">one cell = one living thing</text>
    <text x="412" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">an amoeba</text>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">the cell is where life is built</text>
  <text x="256" y="494" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">from one cell to a whole forest</text>
</svg>
