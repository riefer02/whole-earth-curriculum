<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t9 d9">
  <title id="t9">Ecosystem services</title>
  <desc id="d9">A scene of a wetland, a field, and a forest with labeled arrows showing the services each provides: pollination, clean water, and soil held by roots.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <g stroke="#2b3a42" stroke-width="2" fill="#7a9e7e">
    <path d="M40 360 q60 -70 120 -20 q60 50 120 -20 q60 -60 120 -10 l0 150 Z"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="#6b93b6">
    <path d="M40 430 q60 20 120 -10 l0 40 l-120 0 Z"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <path d="M96 360 v-40 M120 360 v-50 M144 360 v-40"/>
    <circle cx="96" cy="296" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="140" cy="300" r="6" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="#7a9e7e">
    <path d="M300 360 l0 -90"/>
    <path d="M280 330 q10 -40 20 -90 M300 330 l0 -90 M320 330 q-10 -40 -20 -90"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <ellipse cx="140" cy="240" rx="12" ry="20"/>
    <path d="M128 240 l-12 -6 M140 232 l-8 -10 M152 240 l12 -6"/>
  </g>
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <path d="M330 150 h70 l-10 14 h-50 Z"/>
    <path d="M400 150 l10 -14 h30 l-6 14"/>
  </g>
  <g stroke="#6b93b6" stroke-width="3" fill="none">
    <path d="M180 300 l-40 30"/>
    <path d="M300 300 l40 30"/>
  </g>
  <text x="70" y="210" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">pollination</text>
  <text x="430" y="180" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">clean water</text>
  <text x="330" y="250" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">soil held</text>
  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">Nature's free labor</text>
</svg>
