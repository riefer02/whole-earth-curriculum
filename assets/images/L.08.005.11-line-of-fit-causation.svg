<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Line of fit, and association is not causation</title>
  <desc id="desc">A scatter plot of ice-cream sales and drownings, both rising in summer. A line of best fit is drawn through the points. A caption reads "they rise together, but ice cream does not cause drowning — a common cause, summer heat, explains both." A second small panel shows a line of fit with points scattered near and far, labeled "judge the fit: how near do the points lie to the line?" Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="30" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">Lines of Fit — and Association Is Not Causation</text>

  <!-- main axes -->
  <line x1="60" y1="330" x2="330" y2="330" stroke="#2b3a42" stroke-width="2"/>
  <line x1="60" y1="80" x2="60" y2="330" stroke="#2b3a42" stroke-width="2"/>
  <path d="M330 330 L322 326 M330 330 L322 334" stroke="#2b3a42" stroke-width="2"/>
  <text x="330" y="352" text-anchor="end" font-family="sans-serif" font-size="12" fill="#222222">ice-cream sales</text>
  <text x="40" y="80" font-family="sans-serif" font-size="12" fill="#222222">drownings</text>

  <!-- points -->
  <g fill="#6b93b6" stroke="#2b3a42" stroke-width="2">
    <circle cx="90" cy="300" r="6"/>
    <circle cx="110" cy="280" r="6"/>
    <circle cx="140" cy="250" r="6"/>
    <circle cx="160" cy="230" r="6"/>
    <circle cx="190" cy="200" r="6"/>
    <circle cx="220" cy="170" r="6"/>
    <circle cx="250" cy="140" r="6"/>
    <circle cx="290" cy="100" r="6"/>
  </g>

  <!-- line of fit -->
  <line x1="80" y1="310" x2="300" y2="90" stroke="#e0a458" stroke-width="3"/>
  <text x="200" y="108" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e0a458">line of best fit</text>

  <!-- caption -->
  <rect x="20" y="380" width="472" height="116" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="256" y="406" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">they rise together — but ice cream does not cause drowning</text>
  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">a common cause, summer heat, raises both</text>
  <text x="256" y="454" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">association is a clue, never a proof of cause</text>
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">judge the fit: how near do the points lie to the line? predict only within the data's range</text>

  <!-- inset: judge fit -->
  <rect x="384" y="80" width="120" height="140" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <line x1="392" y1="200" x2="500" y2="96" stroke="#e0a458" stroke-width="2"/>
  <g fill="#e0a458" stroke="#2b3a42" stroke-width="2">
    <circle cx="404" cy="190" r="5"/>
    <circle cx="430" cy="150" r="5"/>
    <circle cx="452" cy="120" r="5"/>
    <circle cx="440" cy="170" r="5"/>
    <circle cx="470" cy="130" r="5"/>
    <circle cx="490" cy="110" r="5"/>
  </g>
  <text x="444" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">near = good fit, far = weaker fit</text>
</svg>
