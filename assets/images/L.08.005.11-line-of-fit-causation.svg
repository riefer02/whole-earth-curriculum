<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-08-005-11-line-of-fit-causation desc-L-08-005-11-line-of-fit-causation">
  <title id="title-L-08-005-11-line-of-fit-causation">Line of fit, and association is not causation</title>
  <desc id="desc-L-08-005-11-line-of-fit-causation">A scatter plot of ice-cream sales and drownings, both rising in summer. A line of best fit is drawn through the points. A caption reads "they rise together, but ice cream does not cause drowning — a common cause, summer heat, explains both." A second small panel shows a line of fit with points scattered near and far, labeled "judge the fit: how near do the points lie to the line?" Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="28" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">Lines of Fit — Association</text>
  <text x="256" y="50" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">Is Not Causation</text>

  <!-- main axes -->
  <line x1="60" y1="330" x2="330" y2="330" stroke="#2b3a42" stroke-width="2"/>
  <line x1="60" y1="80" x2="60" y2="330" stroke="#2b3a42" stroke-width="2"/>
  <path d="M330 330 L322 326 M330 330 L322 334" stroke="#2b3a42" stroke-width="2"/>
  <text x="330" y="352" text-anchor="end" font-family="sans-serif" font-size="14" fill="#222222">ice-cream sales</text>
  <text x="66" y="68" font-family="sans-serif" font-size="14" fill="#222222">drownings</text>

  <!-- points: upward trend with real scatter -->
  <g fill="#6b93b6" stroke="#2b3a42" stroke-width="2">
    <circle cx="90" cy="302" r="6"/>
    <circle cx="112" cy="278" r="6"/>
    <circle cx="138" cy="256" r="6"/>
    <circle cx="162" cy="228" r="6"/>
    <circle cx="188" cy="206" r="6"/>
    <circle cx="218" cy="172" r="6"/>
    <circle cx="252" cy="138" r="6"/>
    <circle cx="288" cy="104" r="6"/>
  </g>

  <!-- line of fit -->
  <line x1="80" y1="310" x2="300" y2="90" stroke="#e0a458" stroke-width="3"/>
  <text x="168" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7a4d16">line of best fit</text>

  <!-- caption -->
  <rect x="20" y="372" width="472" height="124" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="256" y="398" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">they rise together — but ice cream does not cause drowning</text>
  <text x="256" y="422" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">a common cause, summer heat, raises both</text>
  <text x="256" y="446" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">association is a clue, never a proof of cause</text>
  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">judge fit by nearness to the line; predict only within range</text>

  <!-- inset: judge fit -->
  <rect x="372" y="72" width="128" height="186" fill="#ffffff" stroke="#2b3a42" stroke-width="2" rx="6"/>
  <text x="436" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">how good is the fit?</text>
  <line x1="382" y1="200" x2="490" y2="106" stroke="#e0a458" stroke-width="2.5"/>
  <g fill="none" stroke="#2b3a42" stroke-width="2">
    <circle cx="398" cy="192" r="5"/>
    <circle cx="420" cy="158" r="5"/>
    <circle cx="442" cy="128" r="5"/>
    <circle cx="434" cy="172" r="5"/>
    <circle cx="460" cy="140" r="5"/>
    <circle cx="478" cy="118" r="5"/>
  </g>
  <g fill="#e0a458" stroke="#2b3a42" stroke-width="1.2">
    <circle cx="398" cy="192" r="2"/>
    <circle cx="420" cy="158" r="2"/>
    <circle cx="442" cy="128" r="2"/>
    <circle cx="434" cy="172" r="2"/>
    <circle cx="460" cy="140" r="2"/>
    <circle cx="478" cy="118" r="2"/>
  </g>
  <text x="436" y="228" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">near = good fit,</text>
  <text x="436" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">far = weaker fit</text>
</svg>
