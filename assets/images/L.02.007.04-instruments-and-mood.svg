<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Hearing instruments and mood</title>
  <desc id="desc">Four panels show instruments to identify by ear: a drum, a flute, a shaker, and a plucked string instrument, each drawn simply with sound waves beside it and a name label below. At the bottom, two mood faces are shown — a smiling face labeled happy and a frowning face labeled sad — to show that music can feel happy or sad or another way. Labels, shapes, and expressions carry all meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Hearing Instruments and Mood</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Name the sound, feel the mood.</text>

  <!-- drum -->
  <g>
    <ellipse cx="80" cy="140" rx="42" ry="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <path d="M38 140 L44 210 Q46 224 60 224 L100 224 Q114 224 116 210 L122 140 Z" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M126 120 Q134 116 132 108"/>
      <path d="M134 150 Q142 146 140 138"/>
    </g>
    <text x="80" y="252" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">drum</text>
  </g>

  <!-- flute -->
  <g>
    <rect x="150" y="126" width="80" height="12" rx="6" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="158" cy="132" r="3" fill="#2b3a42"/>
    <circle cx="172" cy="132" r="3" fill="#2b3a42"/>
    <circle cx="186" cy="132" r="3" fill="#2b3a42"/>
    <circle cx="200" cy="132" r="3" fill="#2b3a42"/>
    <circle cx="214" cy="132" r="3" fill="#2b3a42"/>
    <g stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M236 128 Q244 124 242 116"/>
      <path d="M236 142 Q244 138 242 130"/>
    </g>
    <text x="190" y="252" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">flute</text>
  </g>

  <!-- shaker -->
  <g>
    <rect x="308" y="118" width="12" height="26" rx="4" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <ellipse cx="314" cy="170" rx="20" ry="26" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#4f6d7a" stroke-width="2" stroke-linecap="round">
      <line x1="296" y1="186" x2="288" y2="186"/>
      <line x1="332" y1="186" x2="340" y2="186"/>
      <line x1="298" y1="160" x2="290" y2="160"/>
      <line x1="330" y1="160" x2="338" y2="160"/>
    </g>
    <text x="314" y="252" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">shaker</text>
  </g>

  <!-- string -->
  <g>
    <path d="M380 128 Q414 108 452 128 L452 208 Q414 188 380 208 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="392" y1="132" x2="392" y2="204" stroke="#2b3a42" stroke-width="2"/>
    <line x1="406" y1="128" x2="406" y2="208" stroke="#2b3a42" stroke-width="2"/>
    <line x1="420" y1="126" x2="420" y2="210" stroke="#2b3a42" stroke-width="2"/>
    <line x1="434" y1="126" x2="434" y2="210" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M456 150 Q464 146 462 138"/>
      <path d="M456 176 Q464 172 462 164"/>
    </g>
    <text x="416" y="252" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">string</text>
  </g>

  <!-- divider -->
  <line x1="40" y1="290" x2="472" y2="290" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- mood faces -->
  <text x="256" y="322" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">How does the music feel?</text>

  <!-- happy -->
  <g>
    <circle cx="160" cy="392" r="42" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <circle cx="146" cy="384" r="4" fill="#2b3a42"/>
    <circle cx="174" cy="384" r="4" fill="#2b3a42"/>
    <path d="M144 406 Q160 420 176 406" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <text x="160" y="462" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">happy</text>
  </g>

  <!-- sad -->
  <g>
    <circle cx="352" cy="392" r="42" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <circle cx="338" cy="384" r="4" fill="#2b3a42"/>
    <circle cx="366" cy="384" r="4" fill="#2b3a42"/>
    <path d="M336 414 Q352 400 368 414" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <text x="352" y="462" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">sad</text>
  </g>
</svg>
