<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" font-family="sans-serif">
  <title>A simple circuit with a conductor and an insulator</title>
  <desc>A simple circuit loop: a battery connected by wires to a lit bulb, with labels for battery, wire, and bulb. A small panel below shows a metal key as a conductor that lets electricity through, and a rubber band as an insulator that stops it.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="38" text-anchor="middle" font-size="25" fill="#222222" font-weight="bold">A simple circuit</text>

  <!-- Circuit loop -->
  <g stroke="#2b3a42" stroke-width="4" fill="none">
    <path d="M120 170 L120 300 L392 300 L392 170"/>
  </g>
  <!-- Battery (bottom) -->
  <rect x="236" y="286" width="40" height="66" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="3"/>
  <line x1="244" y1="286" x2="244" y2="280" stroke="#2b3a42" stroke-width="4"/>
  <line x1="268" y1="352" x2="268" y2="358" stroke="#2b3a42" stroke-width="4"/>
  <text x="256" y="376" text-anchor="middle" font-size="15" fill="#222222">battery</text>

  <!-- Bulb (top) -->
  <circle cx="256" cy="160" r="22" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
  <g stroke="#e0a458" stroke-width="3" stroke-linecap="round">
    <line x1="240" y1="148" x2="234" y2="138"/>
    <line x1="256" y1="140" x2="256" y2="128"/>
    <line x1="272" y1="148" x2="278" y2="138"/>
  </g>
  <text x="256" y="120" text-anchor="middle" font-size="15" fill="#222222">bulb</text>

  <!-- Wire labels -->
  <text x="150" y="238" text-anchor="middle" font-size="15" fill="#222222">wire</text>
  <text x="362" y="238" text-anchor="middle" font-size="15" fill="#222222">wire</text>

  <!-- Flow arrows -->
  <g fill="#e0a458">
    <polygon points="256,258 250,250 262,250"/>
    <polygon points="256,258 250,266 262,266"/>
  </g>

  <!-- Conductor / insulator panel -->
  <text x="256" y="404" text-anchor="middle" font-size="18" fill="#2b3a42" font-weight="bold">Which lets electricity through?</text>

  <!-- Conductor -->
  <rect x="40" y="418" width="210" height="78" rx="12" fill="#7a9e7e" opacity="0.28" stroke="#7a9e7e" stroke-width="2"/>
  <!-- key -->
  <circle cx="90" cy="458" r="12" fill="none" stroke="#2b3a42" stroke-width="4"/>
  <line x1="102" y1="458" x2="128" y2="458" stroke="#2b3a42" stroke-width="4"/>
  <line x1="124" y1="458" x2="124" y2="470" stroke="#2b3a42" stroke-width="4"/>
  <line x1="118" y1="470" x2="130" y2="470" stroke="#2b3a42" stroke-width="4"/>
  <text x="170" y="452" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">Conductor</text>
  <text x="170" y="474" text-anchor="middle" font-size="14" fill="#4f6d7a">metal — lets it through</text>

  <!-- Insulator -->
  <rect x="262" y="418" width="210" height="78" rx="12" fill="#e0a458" opacity="0.28" stroke="#e0a458" stroke-width="2"/>
  <!-- rubber band -->
  <ellipse cx="320" cy="458" rx="18" ry="10" fill="none" stroke="#2b3a42" stroke-width="4"/>
  <text x="392" y="452" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">Insulator</text>
  <text x="392" y="474" text-anchor="middle" font-size="14" fill="#4f6d7a">rubber — stops it</text>
</svg>
