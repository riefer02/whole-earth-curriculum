<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">How paper spread and changed: China to the world</title>
  <desc id="desc">A map-style diagram of paper's journey, with a dotted path and labeled stops. The path begins at a point labeled "China — paper invented (about 105 CE)," then moves through "Korea and Japan," then "Central Asia," then "Baghdad — paper mills," then "North Africa," then "Europe — paper by the 1100s." Beside each region, a small label notes how paper changed as it moved, such as "new materials and mills" and "printing spread with it." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="50" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">How Paper Spread and Changed</text>
  <text x="256" y="72" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">a technology that moved between cultures and changed as it went</text>

  <!-- dotted path -->
  <path d="M82 300 Q150 180 250 160 Q360 140 440 210" fill="none" stroke="#4f6d7a" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- Stop 1: China -->
  <circle cx="82" cy="300" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="82" y="305" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">1</text>
  <text x="72" y="336" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b3a42">China</text>
  <text x="72" y="354" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">paper invented,</text>
  <text x="72" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">about 105 CE</text>

  <!-- Stop 2: Korea & Japan -->
  <circle cx="180" cy="212" r="13" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="180" y="217" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">2</text>
  <text x="180" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">Korea &amp; Japan</text>
  <text x="180" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">paper arrived</text>
  <text x="180" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">with printing</text>

  <!-- Stop 3: Central Asia -->
  <circle cx="282" cy="150" r="13" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="282" y="155" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">3</text>
  <text x="282" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">Central Asia</text>
  <text x="282" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">paper traveled</text>
  <text x="282" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">the Silk Roads</text>

  <!-- Stop 4: Baghdad -->
  <circle cx="376" cy="168" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="376" y="173" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">4</text>
  <text x="376" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">Baghdad</text>
  <text x="376" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">paper mills made</text>
  <text x="376" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">it from new cloth</text>

  <!-- Stop 5: North Africa -->
  <circle cx="420" cy="232" r="13" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="420" y="237" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">5</text>
  <text x="430" y="262" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">North Africa</text>

  <!-- Stop 6: Europe -->
  <circle cx="462" cy="300" r="14" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="462" y="305" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">6</text>
  <text x="462" y="336" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">Europe</text>
  <text x="462" y="354" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">paper by</text>
  <text x="462" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">the 1100s</text>

  <rect x="24" y="408" width="464" height="80" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="438" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">As paper moved, it changed: new materials, new mills,</text>
  <text x="256" y="462" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">and printing spread along with it — each people made it their own.</text>
</svg>
