<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The circle of fair play</title>
  <desc id="desc">A circle divided into four wedges labeled follow the rules, play honestly, respect everyone, and win or lose with grace. Around it, a ring lists inclusive adaptations: change equipment, rules, roles, and pace. Three small player figures with varied bodies and abilities sit around the circle. Shapes and labels, not color, carry the meaning.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">The Circle of Fair Play</text>

  <!-- four wedges -->
  <circle cx="256" cy="222" r="132" fill="#ffffff" stroke="#2b3a42" stroke-width="3"/>
  <line x1="256" y1="90" x2="256" y2="354" stroke="#2b3a42" stroke-width="2"/>
  <line x1="124" y1="222" x2="388" y2="222" stroke="#2b3a42" stroke-width="2"/>

  <text x="256" y="150" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Follow</text>
  <text x="256" y="172" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">the rules</text>

  <text x="256" y="306" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Respect</text>
  <text x="256" y="328" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">everyone</text>

  <text x="168" y="216" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Play</text>
  <text x="168" y="238" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">honestly</text>

  <text x="344" y="216" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Win or lose</text>
  <text x="344" y="238" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">with grace</text>

  <!-- outer ring: inclusive adaptations -->
  <text x="256" y="384" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">Welcome every body: adapt the…</text>
  <rect x="30" y="404" width="214" height="40" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="137" y="429" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">equipment</text>
  <rect x="268" y="404" width="214" height="40" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="375" y="429" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">rules</text>
  <rect x="30" y="456" width="214" height="40" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="137" y="481" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">roles</text>
  <rect x="268" y="456" width="214" height="40" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="375" y="481" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">pace</text>

  <!-- three player figures around the circle -->
  <!-- standing player top-left, varied skin -->
  <g>
    <circle cx="112" cy="128" r="12" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
    <line x1="112" y1="140" x2="112" y2="162" stroke="#2b3a42" stroke-width="2"/>
    <line x1="112" y1="146" x2="94" y2="152" stroke="#2b3a42" stroke-width="2"/>
    <line x1="112" y1="146" x2="130" y2="152" stroke="#2b3a42" stroke-width="2"/>
  </g>
  <!-- seated wheelchair player bottom-right -->
  <g>
    <circle cx="404" cy="318" r="11" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <line x1="404" y1="329" x2="404" y2="350" stroke="#2b3a42" stroke-width="2"/>
    <line x1="404" y1="334" x2="386" y2="340" stroke="#2b3a42" stroke-width="2"/>
    <line x1="404" y1="334" x2="422" y2="340" stroke="#2b3a42" stroke-width="2"/>
    <rect x="384" y="350" width="40" height="5" rx="2" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="392" cy="360" r="7" fill="none" stroke="#2b3a42" stroke-width="1.5"/>
    <circle cx="416" cy="360" r="7" fill="none" stroke="#2b3a42" stroke-width="1.5"/>
  </g>
  <!-- player with cane bottom-left -->
  <g>
    <circle cx="112" cy="316" r="12" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="112" y1="328" x2="112" y2="350" stroke="#2b3a42" stroke-width="2"/>
    <line x1="112" y1="334" x2="94" y2="340" stroke="#2b3a42" stroke-width="2"/>
    <line x1="112" y1="334" x2="130" y2="340" stroke="#2b3a42" stroke-width="2"/>
    <line x1="128" y1="340" x2="132" y2="366" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
