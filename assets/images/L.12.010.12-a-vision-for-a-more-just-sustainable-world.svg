<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">A Vision for a More Just, Sustainable World</title>
  <desc id="desc">Two interlocking circles: "justice for people" and "a livable Earth." In the overlap: "the world I want to help build." Below: "the role I will play." Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="38" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42" font-weight="bold">A Vision for a More Just, Sustainable World</text>

  <!-- interlocking circles -->
  <circle cx="176" cy="210" r="108" fill="none" stroke="#6b93b6" stroke-width="4"/>
  <circle cx="336" cy="210" r="108" fill="none" stroke="#7a9e7e" stroke-width="4"/>

  <text x="140" y="176" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">justice for people</text>
  <text x="372" y="176" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">a livable Earth</text>

  <!-- overlap -->
  <rect x="196" y="196" width="120" height="52" rx="6" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="217" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">the world I want</text>
  <text x="256" y="234" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">to help build</text>

  <!-- role -->
  <rect x="136" y="360" width="240" height="44" rx="6" fill="none" stroke="#e0a458" stroke-width="3"/>
  <text x="256" y="387" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">the role I will play</text>

  <text x="256" y="476" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">A fair world and a livable world are the same wish.</text>
</svg>
