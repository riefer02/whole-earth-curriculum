<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Two people connected through a screen, feeling with each other</title>
  <desc id="desc">Two figures face each other across a screen border, each with a heart. A shared bridge of light runs between their hearts labeled 'with' and 'for', showing two ways empathy can flow — feeling alongside someone versus feeling for them from a distance.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <!-- left figure -->
  <circle cx="120" cy="180" r="34" fill="#8d5a3b"/>
  <path d="M92 178 Q104 158 120 176 Q136 158 148 178 L148 192 Q136 200 104 200 Q92 200 92 192 Z" fill="#2b3a42"/>
  <rect x="90" y="224" width="60" height="96" rx="22" fill="#6b93b6"/>
  <path d="M116 262 C108 250 90 254 90 264 C90 274 116 286 116 286 C116 286 142 274 142 264 C142 254 124 250 116 262 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <!-- right figure -->
  <circle cx="392" cy="180" r="34" fill="#c68a5a"/>
  <path d="M364 178 Q376 158 392 176 Q408 158 420 178 L420 192 Q408 200 376 200 Q364 200 364 192 Z" fill="#2b3a42"/>
  <rect x="362" y="224" width="60" height="96" rx="22" fill="#7a9e7e"/>
  <path d="M388 262 C380 250 362 254 362 264 C362 274 388 286 388 286 C388 286 414 274 414 264 C414 254 396 250 388 262 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <!-- screen border between them -->
  <rect x="238" y="96" width="36" height="240" rx="10" fill="#2b3a42"/>
  <rect x="246" y="120" width="20" height="60" rx="8" fill="#4f6d7a"/>
  <!-- empathy bridge -->
  <path d="M142 268 Q256 214 370 268" fill="none" stroke="#e0a458" stroke-width="6" stroke-linecap="round"/>
  <path d="M142 268 Q256 330 370 268" fill="none" stroke="#7a9e7e" stroke-width="6" stroke-linecap="round" stroke-dasharray="9 8"/>
  <text x="256" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#2b3a42">with</text>
  <text x="256" y="338" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#2b3a42">for</text>
  <text x="256" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#222222">empathy can reach through a screen</text>
</svg>
