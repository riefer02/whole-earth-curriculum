<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Three ways to show depth in a flat picture</title>
  <desc id="d">Three labeled panels. Panel one shows a circle overlapping a square, labeled "overlap." Panel two shows one big circle and one small circle, labeled "size." Panel three shows a horizon line with a tall tree low on the page and a small mountain high near the horizon, labeled "placement." Labels and shapes carry all meaning so the graphic prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#222222">Three Ways to Show Depth</text>
  <text x="256" y="66" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">How an artist makes a flat page feel deep</text>

  <!-- Panel dividers -->
  <line x1="172" y1="96" x2="172" y2="480" stroke="#c9d4d8" stroke-width="2"/>
  <line x1="340" y1="96" x2="340" y2="480" stroke="#c9d4d8" stroke-width="2"/>

  <!-- Panel 1: Overlap -->
  <text x="94" y="108" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">1. Overlap</text>
  <rect x="56" y="230" width="78" height="78" fill="none" stroke="#2b3a42" stroke-width="3" rx="6"/>
  <circle cx="120" cy="250" r="42" fill="#7a9e7e" fill-opacity="0.55" stroke="#2b3a42" stroke-width="3"/>
  <text x="94" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">one shape covers</text>
  <text x="94" y="380" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">part of another</text>

  <!-- Panel 2: Size -->
  <text x="256" y="108" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">2. Size</text>
  <circle cx="256" cy="205" r="52" fill="#6b93b6" fill-opacity="0.55" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="256" cy="312" r="22" fill="#6b93b6" fill-opacity="0.55" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="370" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">near = big</text>
  <text x="256" y="390" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">far = small</text>

  <!-- Panel 3: Placement -->
  <text x="422" y="108" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">3. Placement</text>
  <line x1="368" y1="250" x2="476" y2="250" stroke="#2b3a42" stroke-width="3"/>
  <!-- far mountain, high near horizon -->
  <path d="M 384 250 L 406 196 L 428 250 Z" fill="none" stroke="#2b3a42" stroke-width="3" stroke-linejoin="round"/>
  <!-- near tree, low and big -->
  <line x1="438" y1="330" x2="438" y2="260" stroke="#2b3a42" stroke-width="4"/>
  <path d="M 418 300 C 438 240 458 240 478 300 Z" fill="#7a9e7e" fill-opacity="0.55" stroke="#2b3a42" stroke-width="3" stroke-linejoin="round"/>
  <text x="422" y="380" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">near = low</text>
  <text x="422" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">far = high</text>

  <text x="256" y="456" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Use all three together and a flat page feels deep.</text>
</svg>
