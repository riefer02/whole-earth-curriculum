<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Multiplying and dividing within 100 with known facts and strategies</title>
  <desc id="desc">A ten-by-ten multiplication table with the 5s row highlighted. Beside it, three strategy boxes show doubling (4 times 3 equals 12, so 8 times 3 equals 24), halving (so 2 times 3 equals 6), and a fact family for five times six equals thirty.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Known Facts Open New Facts</text>

  <!-- Multiplication table (compact 6x6 shown) -->
  <text x="120" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4f6d7a">× table</text>
  <g font-family="sans-serif" font-size="13" text-anchor="middle">
    <g fill="#2b3a42">
      <text x="56" y="92">×</text><text x="88" y="92">1</text><text x="120" y="92">2</text><text x="152" y="92">3</text><text x="184" y="92">4</text><text x="216" y="92">5</text>
      <text x="56" y="122">1</text><text x="56" y="152">2</text><text x="56" y="182">3</text><text x="56" y="212">4</text><text x="56" y="242">5</text>
    </g>
    <!-- row 1 -->
    <text x="88" y="122" fill="#4f6d7a">1</text><text x="120" y="122" fill="#4f6d7a">2</text><text x="152" y="122" fill="#4f6d7a">3</text><text x="184" y="122" fill="#4f6d7a">4</text><text x="216" y="122" fill="#4f6d7a">5</text>
    <!-- row 2 -->
    <text x="88" y="152" fill="#4f6d7a">2</text><text x="120" y="152" fill="#4f6d7a">4</text><text x="152" y="152" fill="#4f6d7a">6</text><text x="184" y="152" fill="#4f6d7a">8</text><text x="216" y="152" fill="#4f6d7a">10</text>
    <!-- row 3 -->
    <text x="88" y="182" fill="#4f6d7a">3</text><text x="120" y="182" fill="#4f6d7a">6</text><text x="152" y="182" fill="#4f6d7a">9</text><text x="184" y="182" fill="#4f6d7a">12</text><text x="216" y="182" fill="#e0a458">15</text>
    <!-- row 4 -->
    <text x="88" y="212" fill="#4f6d7a">4</text><text x="120" y="212" fill="#4f6d7a">8</text><text x="152" y="212" fill="#4f6d7a">12</text><text x="184" y="212" fill="#4f6d7a">16</text><text x="216" y="212" fill="#e0a458">20</text>
    <!-- row 5 -->
    <text x="88" y="242" fill="#e0a458">5</text><text x="120" y="242" fill="#e0a458">10</text><text x="152" y="242" fill="#e0a458">15</text><text x="184" y="242" fill="#e0a458">20</text><text x="216" y="242" fill="#e0a458">25</text>
  </g>

  <!-- Strategy boxes -->
  <rect x="252" y="66" width="240" height="96" rx="10" fill="#ffffff" stroke="#7a9e7e" stroke-width="2"/>
  <text x="372" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Double and halve</text>
  <text x="372" y="122" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">4 × 3 = 12</text>
  <text x="372" y="146" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">8 × 3 = 24  (double)</text>

  <rect x="252" y="176" width="240" height="96" rx="10" fill="#ffffff" stroke="#6b93b6" stroke-width="2"/>
  <text x="372" y="202" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Fact family</text>
  <text x="372" y="230" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">5 × 6 = 30   30 ÷ 5 = 6</text>
  <text x="372" y="254" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2b3a42">6 × 5 = 30   30 ÷ 6 = 5</text>

  <text x="256" y="310" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2b3a42">If you know 5 × 4 = 20, then 5 × 6 = 20 + 5 + 5 = 30.</text>

  <rect x="96" y="340" width="320" height="120" rx="12" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
  <text x="256" y="372" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#2b3a42">Fluency is reasoning, not racing.</text>
  <text x="256" y="408" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4f6d7a">Skip count · double · halve · fact family</text>

  <text x="256" y="490" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#4f6d7a">Every fact has a picture.</text>
</svg>
