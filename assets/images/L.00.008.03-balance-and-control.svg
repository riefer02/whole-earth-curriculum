<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Balance and control</title>
  <desc id="desc">Two ways to practice balance, shown as equal. On the left, a standing child walks a balance line with arms out and a beanbag on their head. On the right, a seated child balances a beanbag on one open hand. Gentle wobble arcs show the body adjusting. Word labels read walk the line and balance an object, so the meaning does not rely on color.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Balance and Control</text>

  <!-- balance beam / line -->
  <rect x="56" y="352" width="208" height="10" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <rect x="56" y="362" width="208" height="6" rx="3" fill="#dbe6d2" stroke="#2b3a42" stroke-width="1"/>

  <!-- Left: standing figure walking the line -->
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="160" cy="250" r="24" fill="#c99567"/>
    <rect x="148" y="216" width="24" height="12" rx="5" fill="#e0a458"/>
    <rect x="142" y="276" width="36" height="54" rx="14" fill="#6b93b6"/>
    <line x1="148" y1="290" x2="124" y2="272" stroke-width="13" stroke="#c99567"/>
    <circle cx="122" cy="270" r="6" fill="#c99567"/>
    <line x1="172" y1="290" x2="196" y2="272" stroke-width="13" stroke="#c99567"/>
    <circle cx="198" cy="270" r="6" fill="#c99567"/>
    <line x1="150" y1="328" x2="144" y2="352" stroke-width="14" stroke="#4f6d7a"/>
    <line x1="170" y1="328" x2="176" y2="352" stroke-width="14" stroke="#4f6d7a"/>
  </g>
  <g fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round">
    <path d="M128 236 q8 -10 16 0"/>
    <path d="M176 236 q8 -10 16 0"/>
    <path d="M110 340 q6 -8 12 0"/>
  </g>
  <text x="160" y="414" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">walk the line</text>

  <!-- Right: seated figure balancing an object -->
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- stool -->
    <rect x="352" y="340" width="56" height="16" rx="6" fill="#4f6d7a"/>
    <line x1="362" y1="356" x2="362" y2="372" stroke="#4f6d7a" stroke-width="7"/>
    <line x1="398" y1="356" x2="398" y2="372" stroke="#4f6d7a" stroke-width="7"/>
    <!-- body -->
    <circle cx="380" cy="262" r="24" fill="#8f5f3d"/>
    <rect x="362" y="288" width="36" height="50" rx="14" fill="#7a9e7e"/>
    <line x1="386" y1="300" x2="420" y2="280" stroke-width="13" stroke="#8f5f3d"/>
    <ellipse cx="426" cy="276" rx="10" ry="6" fill="#8f5f3d"/>
    <line x1="372" y1="300" x2="348" y2="286" stroke-width="13" stroke="#8f5f3d"/>
    <circle cx="346" cy="284" r="6" fill="#8f5f3d"/>
  </g>
  <!-- beanbag on open hand -->
  <rect x="412" y="262" width="24" height="12" rx="5" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <g fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round">
    <path d="M406 246 q8 -10 16 0"/>
    <path d="M432 246 q8 -10 16 0"/>
  </g>
  <text x="380" y="414" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">balance an object</text>

  <rect x="16" y="440" width="480" height="44" rx="12" fill="#ffffff" stroke="#7a9e7e" stroke-width="2"/>
  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Wobbling is the body's way of learning to be steady.</text>
</svg>
