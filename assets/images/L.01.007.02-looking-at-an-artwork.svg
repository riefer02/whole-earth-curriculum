<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Looking at an artwork: I notice and it makes me feel</title>
  <desc id="desc">A woven cloth hangs in a frame on the left, labeled "a maker's work." In front of it, a small paper "notice frame" is shown over one corner so a viewer can focus on one small part. On the right are two labeled cards. The top card says "I notice" and asks what you see — a line, a shape, a color. The bottom card says "it makes me feel" and offers feeling words: happy, calm, curious, excited. A child stands at the bottom holding a notice frame up to one eye, looking at the cloth. Every meaning is carried by the words and shapes, so the picture prints clearly in grayscale and teaches that looking carefully means noticing one thing and naming one feeling, with no wrong answer.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Looking at an Artwork</text>
  <text x="256" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Notice one thing — and name one feeling.</text>

  <!-- ===== Left: the artwork (woven cloth) ===== -->
  <g>
    <rect x="22" y="96" width="200" height="280" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="122" y="124" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#6b93b6">the artwork</text>
    <!-- frame -->
    <rect x="44" y="140" width="156" height="146" rx="6" fill="#fdfbf7" stroke="#2b3a42" stroke-width="3"/>
    <!-- woven cloth with pattern -->
    <rect x="52" y="148" width="140" height="130" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <g stroke="#2b3a42" stroke-width="2">
      <line x1="52" y1="164" x2="192" y2="164"/>
      <line x1="52" y1="180" x2="192" y2="180"/>
      <line x1="52" y1="212" x2="192" y2="212"/>
      <line x1="52" y1="228" x2="192" y2="228"/>
      <line x1="52" y1="244" x2="192" y2="244"/>
      <line x1="52" y1="260" x2="192" y2="260"/>
    </g>
    <!-- zig-zag band -->
    <path d="M52 196 L72 184 L92 196 L112 184 L132 196 L152 184 L172 196 L192 184" fill="none" stroke="#6b93b6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- dots band -->
    <circle cx="70" cy="254" r="3" fill="#2b3a42"/>
    <circle cx="96" cy="254" r="3" fill="#2b3a42"/>
    <circle cx="122" cy="254" r="3" fill="#2b3a42"/>
    <circle cx="148" cy="254" r="3" fill="#2b3a42"/>
    <circle cx="174" cy="254" r="3" fill="#2b3a42"/>
    <text x="122" y="310" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">a woven cloth</text>
    <text x="122" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">a maker's work,</text>
    <text x="122" y="346" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">made by hand</text>
    <!-- notice frame over a corner -->
    <g>
      <rect x="148" y="222" width="46" height="46" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
      <rect x="156" y="230" width="30" height="30" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="4 3"/>
      <line x1="194" y1="222" x2="206" y2="210" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
      <text x="216" y="212" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4f6d7a">notice frame</text>
    </g>
  </g>

  <!-- ===== Right: I notice / it makes me feel ===== -->
  <g>
    <rect x="246" y="96" width="244" height="128" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="276" cy="128" r="14" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="276" cy="128" r="5" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <text x="300" y="134" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">I notice ...</text>
    <text x="266" y="168" font-family="sans-serif" font-size="14" fill="#222222">What do you see?</text>
    <text x="266" y="188" font-family="sans-serif" font-size="13" fill="#4f6d7a">a line · a shape · a color</text>
    <text x="266" y="208" font-family="sans-serif" font-size="13" fill="#4f6d7a">Everyone notices something different.</text>
  </g>
  <g>
    <rect x="246" y="240" width="244" height="128" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <path d="M270 244 C268 238 274 234 278 238 L282 234 C286 232 290 234 289 239 L290 244 C288 248 272 248 270 244 Z" fill="#c47a6b" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="300" y="276" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b3a42">it makes me feel ...</text>
    <text x="266" y="310" font-family="sans-serif" font-size="14" fill="#222222">How does it make you feel?</text>
    <text x="266" y="330" font-family="sans-serif" font-size="13" fill="#4f6d7a">happy · calm · curious · excited</text>
    <text x="266" y="350" font-family="sans-serif" font-size="13" fill="#4f6d7a">There is no wrong feeling.</text>
  </g>

  <!-- ===== Bottom: child looking through a notice frame ===== -->
  <g>
    <line x1="30" y1="468" x2="482" y2="468" stroke="#4f6d7a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="150" cy="398" r="22" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <path d="M128 396 A22 22 0 0 1 172 396 Z" fill="#2b3a42"/>
    <circle cx="143" cy="398" r="2.2" fill="#2b3a42"/>
    <circle cx="157" cy="398" r="2.2" fill="#2b3a42"/>
    <path d="M143 408 Q150 414 157 408" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="132" y="422" width="36" height="46" rx="12" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="140" y1="466" x2="138" y2="486" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <line x1="160" y1="466" x2="162" y2="486" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <!-- arm holding notice frame up to eye -->
    <line x1="132" y1="434" x2="186" y2="406" stroke="#2b3a42" stroke-width="7" stroke-linecap="round"/>
    <rect x="184" y="388" width="42" height="42" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
    <rect x="192" y="396" width="26" height="26" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="150" y="506" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">look through the frame</text>
  </g>

</svg>
