<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Throwing and catching with both hands</title>
  <desc id="desc">Two panels. Throw: a child pushes a soft ball with both hands toward a target. Catch: a child catches a ball with both hands open and ready, and a seated child in a wheelchair catches too. Arrows show the ball's path. Each panel is labeled with words, so it prints clearly in grayscale and the meaning does not depend on color.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#2b3a42">Throwing and Catching with Both Hands</text>

  <!-- ===== Throw panel ===== -->
  <g>
    <rect x="20" y="66" width="230" height="200" rx="14" fill="#ffffff" stroke="#7a9e7e" stroke-width="3"/>
    <text x="135" y="94" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">throw</text>

    <!-- throwing child (both hands out) -->
    <circle cx="80" cy="176" r="20" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
    <rect x="64" y="196" width="32" height="42" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <line x1="66" y1="204" x2="46" y2="198" stroke="#c99567" stroke-width="9" stroke-linecap="round"/>
    <line x1="94" y1="204" x2="114" y2="198" stroke="#c99567" stroke-width="9" stroke-linecap="round"/>
    <circle cx="80" cy="196" r="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="74" y1="238" x2="70" y2="258" stroke="#4f6d7a" stroke-width="9" stroke-linecap="round"/>
    <line x1="86" y1="238" x2="90" y2="258" stroke="#4f6d7a" stroke-width="9" stroke-linecap="round"/>

    <!-- ball path -->
    <path d="M96 190 Q140 160 180 150" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-dasharray="5 4"/>
    <path d="M172 146 L180 150 L174 156" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- target -->
    <circle cx="196" cy="150" r="26" fill="#e0a458" stroke="#2b3a42" stroke-width="3"/>
    <circle cx="196" cy="150" r="16" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <circle cx="196" cy="150" r="7" fill="#e0a458" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="196" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">both hands</text>
    <text x="135" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">push or toss with both hands</text>
  </g>

  <!-- ===== Catch panel ===== -->
  <g>
    <rect x="262" y="66" width="230" height="200" rx="14" fill="#ffffff" stroke="#6b93b6" stroke-width="3"/>
    <text x="377" y="94" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2b3a42">catch</text>

    <!-- catching child, hands open -->
    <circle cx="320" cy="176" r="20" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
    <rect x="304" y="196" width="32" height="42" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="306" y1="204" x2="286" y2="200" stroke="#8f5f3d" stroke-width="9" stroke-linecap="round"/>
    <line x1="334" y1="204" x2="354" y2="200" stroke="#8f5f3d" stroke-width="9" stroke-linecap="round"/>
    <circle cx="320" cy="198" r="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="314" y1="238" x2="310" y2="258" stroke="#4f6d7a" stroke-width="9" stroke-linecap="round"/>
    <line x1="326" y1="238" x2="330" y2="258" stroke="#4f6d7a" stroke-width="9" stroke-linecap="round"/>
    <text x="320" y="276" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">hands open, eyes on the ball</text>

    <!-- seated child in wheelchair catching -->
    <circle cx="432" cy="190" r="16" fill="#d9a066" stroke="#2b3a42" stroke-width="2"/>
    <rect x="418" y="206" width="28" height="30" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="420" y1="212" x2="406" y2="208" stroke="#d9a066" stroke-width="8" stroke-linecap="round"/>
    <line x1="444" y1="212" x2="458" y2="208" stroke="#d9a066" stroke-width="8" stroke-linecap="round"/>
    <circle cx="432" cy="208" r="9" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="412" y="238" width="40" height="8" rx="4" fill="#4f6d7a"/>
    <circle cx="420" cy="252" r="7" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <circle cx="446" cy="252" r="5" fill="#fdfbf7" stroke="#2b3a42" stroke-width="2.5"/>
    <text x="432" y="276" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">wheels count too</text>
  </g>

  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Both hands can throw, and both hands can catch.</text>
</svg>
