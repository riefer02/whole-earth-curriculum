<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Language Under Pressure</title>
  <desc id="desc">A tree with strong roots and many leaves on the left. Beside it, a second tree with fewer leaves, some falling, while a hand reaches up to shelter the remaining leaves, illustrating language loss and the effort to keep it alive.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">A Language Under Pressure</text>

  <!-- Left tree: full -->
  <g>
    <rect x="100" y="220" width="18" height="130" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M100 250 Q70 230 60 210" fill="none" stroke="#7a9e7e" stroke-width="4"/>
    <path d="M118 260 Q150 240 160 214" fill="none" stroke="#7a9e7e" stroke-width="4"/>
    <circle cx="78" cy="150" r="26" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="140" cy="130" r="30" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="118" cy="96" r="22" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <path d="M108 300 Q90 330 90 360" fill="none" stroke="#7a9e7e" stroke-width="4"/>
    <path d="M112 320 Q120 340 130 360" fill="none" stroke="#7a9e7e" stroke-width="4"/>
  </g>
  <text x="112" y="392" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">many words</text>

  <!-- Right tree: thinned -->
  <g>
    <rect x="330" y="230" width="16" height="120" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="300" cy="160" r="20" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="360" cy="150" r="22" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <path d="M338 290 Q320 320 318 348" fill="none" stroke="#6b93b6" stroke-width="4"/>
  </g>
  <!-- falling leaves -->
  <g fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5">
    <ellipse cx="288" cy="250" rx="7" ry="4" transform="rotate(-30 288 250)"/>
    <ellipse cx="384" cy="260" rx="6" ry="4" transform="rotate(25 384 260)"/>
    <ellipse cx="368" cy="300" rx="7" ry="4" transform="rotate(-20 368 300)"/>
  </g>
  <text x="352" y="392" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">words falling</text>

  <!-- Sheltering hand -->
  <g stroke="#e0a458" stroke-width="4" fill="none">
    <path d="M330 120 q-20 -30 -40 -26 q-12 2 -16 14 q-14 6 -12 20"/>
    <path d="M300 130 q-10 -16 -24 -16"/>
  </g>

  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">A hand shelters what remains — and works to grow it back.</text>
</svg>
