<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Trigonometric Functions as Waves</title>
  <desc id="desc">A sine wave drawn on axes. A horizontal dashed midline at y equals 1 is labeled. A vertical arrow shows the amplitude from midline to peak. A horizontal arrow under one full cycle shows the period. The wave is shifted right from the origin, labeled phase shift. The equation y = A sin(B(x - C)) + D is shown with each part labeled.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">The Four Features of a Wave</text>

  <!-- axes -->
  <line x1="40" y1="250" x2="480" y2="250" stroke="#2b3a42" stroke-width="2"/>
  <line x1="40" y1="60" x2="40" y2="380" stroke="#2b3a42" stroke-width="2"/>

  <!-- midline at y=250 (D=1 shown as offset) -->
  <line x1="40" y1="190" x2="480" y2="190" stroke="#e0a458" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="486" y="194" font-family="sans-serif" font-size="13" fill="#e0a458">midline D</text>

  <!-- sine wave: amplitude 70, period 200, midline 190, phase shift 40 -->
  <path d="M 60 190
           C 90 120, 140 120, 160 190
           C 180 260, 220 260, 240 190
           C 260 120, 310 120, 330 190
           C 350 260, 390 260, 410 190"
        fill="none" stroke="#2b3a42" stroke-width="3"/>

  <!-- amplitude arrow -->
  <line x1="260" y1="190" x2="260" y2="120" stroke="#7a9e7e" stroke-width="2"/>
  <polygon points="260,120 254,132 266,132" fill="#7a9e7e"/>
  <text x="268" y="150" font-family="sans-serif" font-size="13" fill="#7a9e7e">amplitude A</text>

  <!-- period arrow -->
  <line x1="160" y1="300" x2="330" y2="300" stroke="#6b93b6" stroke-width="2"/>
  <polygon points="160,300 172,294 172,306" fill="#6b93b6"/>
  <polygon points="330,300 318,294 318,306" fill="#6b93b6"/>
  <text x="245" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6b93b6">period = 2&#960;/B</text>

  <!-- phase shift arrow -->
  <line x1="40" y1="350" x2="160" y2="350" stroke="#4f6d7a" stroke-width="2"/>
  <polygon points="160,350 148,344 148,356" fill="#4f6d7a"/>
  <text x="100" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">phase shift C</text>

  <!-- equation -->
  <rect x="120" y="392" width="272" height="52" fill="#ffffff" stroke="#e0a458" stroke-width="2" rx="6"/>
  <text x="256" y="416" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">y = A&#183;sin(B(x &#8722; C)) + D</text>
  <text x="256" y="436" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">A height &#183; B frequency &#183; C shift &#183; D midline</text>
</svg>
