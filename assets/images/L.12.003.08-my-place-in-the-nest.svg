<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">My place in nested communities</title>
  <desc id="d">Concentric rings labeled self, family, friends and school, neighborhood, region and nation, humanity, and the community of all life, with a single dot at the center. Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>
  <!-- dot at center -->
  <circle cx="256" cy="256" r="8" fill="#2b3a42"/>
  <!-- rings from outer to inner -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="105" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="40" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
  <!-- labels -->
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">community of all life</text>
  <text x="256" y="82" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">humanity</text>
  <text x="256" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">region &amp; nation</text>
  <text x="256" y="153" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">neighborhood</text>
  <text x="256" y="188" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">friends &amp; school</text>
  <text x="256" y="222" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">family</text>
  <text x="256" y="252" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3a42">self</text>
</svg>
