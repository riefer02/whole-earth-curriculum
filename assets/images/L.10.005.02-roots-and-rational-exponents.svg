<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Roots and Rational Exponents</title>
  <desc id="desc">A unit square with its diagonal labeled the square root of 2, a number line from 0 to 4 with root-2 and root-3 placed between whole numbers, and a bridge table showing nth-root form equals rational-exponent form.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42" font-weight="bold">Roots and Rational Exponents</text>

  <!-- Unit square with diagonal -->
  <text x="128" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a" font-weight="bold">A unit square</text>
  <rect x="48" y="90" width="160" height="160" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <line x1="48" y1="250" x2="208" y2="90" stroke="#e0a458" stroke-width="2.5"/>
  <text x="74" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">1</text>
  <text x="168" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">1</text>
  <text x="140" y="176" font-family="sans-serif" font-size="15" fill="#a06030" font-weight="bold">&#8730;2</text>
  <text x="128" y="276" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">(diagonal)&#178; = 1&#178; + 1&#178; = 2</text>

  <!-- Number line -->
  <text x="384" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a" font-weight="bold">Where do the roots sit?</text>
  <line x1="280" y1="130" x2="488" y2="130" stroke="#2b3a42" stroke-width="2"/>
  <g stroke="#2b3a42" stroke-width="2">
    <line x1="280" y1="122" x2="280" y2="138"/><text x="280" y="154" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">0</text>
    <line x1="332" y1="122" x2="332" y2="138"/><text x="332" y="154" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">1</text>
    <line x1="384" y1="122" x2="384" y2="138"/><text x="384" y="154" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">2</text>
    <line x1="436" y1="122" x2="436" y2="138"/><text x="436" y="154" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">3</text>
    <line x1="488" y1="122" x2="488" y2="138"/><text x="488" y="154" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">4</text>
  </g>
  <!-- root 2 and root 3 markers -->
  <circle cx="358" cy="130" r="5" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="358" y="176" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#a06030">&#8730;2 &#8776; 1.414</text>
  <circle cx="410" cy="130" r="5" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="410" y="176" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#a06030">&#8730;3 &#8776; 1.732</text>

  <!-- Bridge table -->
  <text x="256" y="226" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a" font-weight="bold">The bridge: a root is a fractional power</text>
  <g font-family="sans-serif" font-size="15" fill="#222222">
    <rect x="88" y="244" width="160" height="40" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="168" y="269" text-anchor="middle">&#8319;&#8730;a = a^(1/n)</text>
    <rect x="264" y="244" width="160" height="40" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="344" y="269" text-anchor="middle">(&#8319;&#8730;a)^m = a^(m/n)</text>

    <rect x="88" y="300" width="160" height="40" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="168" y="325" text-anchor="middle">8^(1/3) = &#8731;8 = 2</text>
    <rect x="264" y="300" width="160" height="40" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="344" y="325" text-anchor="middle">16^(3/4) = (&#8308;&#8730;16)&#179; = 8</text>

    <text x="256" y="376" text-anchor="middle" font-size="13" fill="#4f6d7a">Power rules still hold: x^(1/2) &#183; x^(1/2) = x&#185; = x</text>
  </g>

  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">&#8730;2 is not a fraction: assume &#8730;2 = a/b, then both a and b turn out even — impossible.</text>
  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">The Babylonians approximated &#8730;2 to about six decimals on tablet YBC 7289 (c. 1800&#8211;1600 BCE).</text>
</svg>
