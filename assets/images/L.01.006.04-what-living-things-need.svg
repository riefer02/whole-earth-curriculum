<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The four things every living thing needs</title>
  <desc id="desc">A green plant with roots in soil sits in the center. Around it, four labeled cards name the four needs of every living thing: food (an apple), water (a droplet), air (wavy breeze lines), and shelter (a little house). Each card pairs a simple icon with a written word, so meaning comes from words and shapes, not color alone, and it prints clearly in grayscale.</desc>

  <!-- Paper background -->
  <rect width="512" height="512" fill="#fdfbf7"/>

  <!-- Header -->
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">What Living Things Need</text>

  <!-- Central plant -->
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="256" y1="252" x2="256" y2="180"/>
    <path d="M256 224 Q238 216 234 198"/>
    <path d="M256 208 Q274 200 278 182"/>
  </g>
  <circle cx="256" cy="176" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <path d="M232 252 Q256 268 280 252" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <!-- roots -->
  <g stroke="#2b3a42" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M248 254 Q244 268 240 276"/>
    <path d="M256 254 Q256 270 256 278"/>
    <path d="M264 254 Q268 268 272 276"/>
  </g>
  <text x="256" y="302" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">a living thing</text>

  <!-- Four need cards -->
  <g>
    <!-- food -->
    <rect x="20" y="336" width="110" height="110" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <g fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round">
      <circle cx="75" cy="378" r="22"/>
      <path d="M66 366 Q75 358 84 366"/>
    </g>
    <line x1="75" y1="356" x2="75" y2="344" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M75 344 Q70 340 72 336 Q78 338 75 344 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="75" y="420" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">food</text>

    <!-- water -->
    <rect x="142" y="336" width="110" height="110" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M197 360 Q215 384 197 396 Q179 384 197 360 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="197" y="420" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">water</text>

    <!-- air -->
    <rect x="264" y="336" width="110" height="110" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <g stroke="#4f6d7a" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M290 384 Q304 372 318 384 Q332 396 346 384"/>
      <path d="M296 398 Q308 390 320 398 Q332 406 344 398"/>
    </g>
    <text x="319" y="420" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">air</text>

    <!-- shelter -->
    <rect x="386" y="336" width="110" height="110" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M418 390 L441 366 L464 390 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <rect x="424" y="390" width="34" height="26" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
    <rect x="436" y="402" width="10" height="14" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="441" y="428" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">shelter</text>
  </g>

  <!-- Footer -->
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Food, water, air, and shelter — for every living thing, everywhere.</text>
</svg>
