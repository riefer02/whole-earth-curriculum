<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Rules shape outcomes</title>
  <desc id="desc">Two panels show the same simple game with different rules. In the first, one rule-set funnels all the tokens to a single player. In the second, a shared rule-set divides tokens evenly among all players. A note reads that rules and incentives, not just players, shape who wins and how much.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Same Game, Different Rules</text>

  <!-- Panel 1: winner-take-all -->
  <text x="128" y="84" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">winner-take-all</text>
  <rect x="30" y="100" width="196" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <!-- four players -->
  <circle cx="78" cy="150" r="16" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="178" cy="150" r="16" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="78" cy="230" r="16" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="178" cy="230" r="16" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
  <!-- one player gets a big pile -->
  <g>
    <circle cx="178" cy="286" r="6" fill="#e0a458"/><circle cx="188" cy="280" r="6" fill="#e0a458"/><circle cx="170" cy="280" r="6" fill="#e0a458"/>
    <circle cx="178" cy="272" r="6" fill="#e0a458"/><circle cx="164" cy="274" r="6" fill="#e0a458"/>
    <text x="178" y="312" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">all to one</text>
  </g>
  <!-- others get none -->
  <circle cx="78" cy="290" r="3" fill="#2b3a42"/><circle cx="70" cy="290" r="3" fill="#2b3a42"/>
  <text x="78" y="312" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">none</text>

  <!-- Arrow -->
  <path d="M250 250 L282 250" fill="none" stroke="#2b3a42" stroke-width="4"/>
  <path d="M282 250 L272 242 M282 250 L272 258" fill="none" stroke="#2b3a42" stroke-width="4" stroke-linecap="round"/>

  <!-- Panel 2: shared pot -->
  <text x="392" y="84" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">shared pot</text>
  <rect x="286" y="100" width="196" height="300" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="334" cy="150" r="16" fill="#e6bb92" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="434" cy="150" r="16" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="334" cy="230" r="16" fill="#8f5f3d" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="434" cy="230" r="16" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
  <!-- pot in center -->
  <path d="M360 284 L360 328 Q384 342 408 328 L408 284 Z" fill="#6b93b6" opacity="0.3" stroke="#2b3a42" stroke-width="2"/>
  <text x="384" y="312" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">shared</text>
  <!-- small equal piles near each player -->
  <circle cx="334" cy="300" r="5" fill="#e0a458"/><circle cx="326" cy="300" r="5" fill="#e0a458"/>
  <circle cx="434" cy="300" r="5" fill="#e0a458"/><circle cx="426" cy="300" r="5" fill="#e0a458"/>
  <circle cx="334" cy="352" r="5" fill="#e0a458"/><circle cx="326" cy="352" r="5" fill="#e0a458"/>
  <circle cx="434" cy="352" r="5" fill="#e0a458"/><circle cx="426" cy="352" r="5" fill="#e0a458"/>
  <text x="384" y="380" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">divided evenly</text>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#4f6d7a">Rules and incentives — not just players — shape who wins and how much.</text>
</svg>
