<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Energy transformation chains</title>
  <desc id="desc">A diagram of two energy transformation chains. The top chain shows a plate of food labeled chemical energy, an arrow to a running person labeled kinetic energy, and an arrow to a wavy heat symbol labeled thermal energy, waste heat. The bottom chain shows the Sun labeled light energy, an arrow to a leaf labeled chemical energy (photosynthesis), an arrow to a battery and bulb labeled electrical energy, and an arrow to a lit bulb labeled light plus heat. A caption reads: at every step energy changes form, and some always leaves as heat. Labels, arrows, and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Energy Transformation Chains</text>
  <text x="256" y="56" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">at every step, energy changes form — and some leaves as heat</text>

  <defs>
    <marker id="ta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2b3a42"/>
    </marker>
  </defs>

  <!-- TOP CHAIN: food -> motion -> heat -->
  <text x="256" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">a meal becomes motion, then warmth</text>

  <!-- food -->
  <g transform="translate(30, 110)">
    <ellipse cx="50" cy="46" rx="42" ry="16" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
    <path d="M8,46 Q50,68 92,46" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="50" y="86" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">chemical (food)</text>
  </g>
  <line x1="120" y1="156" x2="156" y2="156" stroke="#2b3a42" stroke-width="3" marker-end="url(#ta)"/>

  <!-- running person -->
  <g transform="translate(160, 110)">
    <circle cx="50" cy="24" r="14" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <line x1="50" y1="38" x2="50" y2="70" stroke="#2b3a42" stroke-width="2"/>
    <line x1="50" y1="48" x2="30" y2="62" stroke="#2b3a42" stroke-width="2"/>
    <line x1="50" y1="48" x2="72" y2="58" stroke="#2b3a42" stroke-width="2"/>
    <line x1="50" y1="70" x2="34" y2="96" stroke="#2b3a42" stroke-width="2"/>
    <line x1="50" y1="70" x2="70" y2="92" stroke="#2b3a42" stroke-width="2"/>
    <text x="50" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">kinetic (running)</text>
  </g>
  <line x1="250" y1="156" x2="286" y2="156" stroke="#2b3a42" stroke-width="3" marker-end="url(#ta)"/>

  <!-- heat -->
  <g transform="translate(290, 110)">
    <g stroke="#e0a458" stroke-width="3" fill="none">
      <path d="M30,80 C24,66 36,66 30,52"/>
      <path d="M50,84 C44,70 56,70 50,56"/>
      <path d="M70,80 C64,66 76,66 70,52"/>
    </g>
    <text x="50" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">thermal (waste heat)</text>
  </g>

  <line x1="20" y1="250" x2="492" y2="250" stroke="#d7d1c8" stroke-width="2"/>

  <!-- BOTTOM CHAIN: sun -> leaf -> battery -> bulb -->
  <text x="256" y="284" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">sunlight becomes food, then light again</text>

  <!-- sun -->
  <g transform="translate(30, 304)">
    <circle cx="42" cy="46" r="18" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="42" y="92" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">light (Sun)</text>
  </g>
  <line x1="94" y1="350" x2="126" y2="350" stroke="#2b3a42" stroke-width="3" marker-end="url(#ta)"/>

  <!-- leaf -->
  <g transform="translate(130, 304)">
    <path d="M10,60 Q50,20 92,40 Q50,80 10,60 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="10" y1="60" x2="90" y2="42" stroke="#2b3a42" stroke-width="2"/>
    <text x="50" y="92" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">chemical</text>
    <text x="50" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">(photosynthesis)</text>
  </g>
  <line x1="222" y1="350" x2="254" y2="350" stroke="#2b3a42" stroke-width="3" marker-end="url(#ta)"/>

  <!-- battery -->
  <g transform="translate(258, 304)">
    <rect x="16" y="32" width="26" height="40" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="10" y="40" width="6" height="24" rx="2" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <text x="58" y="60" font-family="sans-serif" font-size="12" fill="#222222">electrical</text>
  </g>
  <line x1="320" y1="350" x2="352" y2="350" stroke="#2b3a42" stroke-width="3" marker-end="url(#ta)"/>

  <!-- bulb -->
  <g transform="translate(356, 304)">
    <circle cx="46" cy="46" r="22" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="34" y="68" width="24" height="10" rx="2" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <text x="46" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">light + heat</text>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">follow any chain far enough and you end at heat</text>
  <text x="256" y="494" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">each output becomes the next input</text>
</svg>
