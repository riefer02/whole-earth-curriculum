<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-06-006-08-energy-transformations-chain desc-L-06-006-08-energy-transformations-chain">
  <title id="title-L-06-006-08-energy-transformations-chain">Energy transformation chains</title>
  <desc id="desc-L-06-006-08-energy-transformations-chain">A diagram of two energy transformation chains. The top chain shows a plate of food labeled chemical energy, an arrow to a running person labeled kinetic energy, and an arrow to a wavy heat symbol labeled thermal energy, waste heat. The bottom chain shows the Sun labeled light energy, an arrow to a leaf labeled chemical energy (photosynthesis), an arrow to a battery and bulb labeled electrical energy, and an arrow to a lit bulb labeled light plus heat. A caption reads: at every step energy changes form, and some always leaves as heat. Labels, arrows, and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Energy Transformation Chains</text>
  <text x="256" y="56" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">at every step, energy changes form — and some leaves as heat</text>

  <defs>
    <marker id="ta-L-06-006-08-energy-transformations-chain" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2b3a42"/>
    </marker>
  </defs>

  <!-- TOP CHAIN: food -> motion -> heat -->
  <text x="256" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">a meal becomes motion, then warmth</text>

  <!-- food -->
  <g>
    <ellipse cx="80" cy="156" rx="42" ry="16" fill="#f4efe4" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 38 156 Q 80 178 122 156" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="80" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">chemical (food)</text>
  </g>
  <line x1="120" y1="156" x2="156" y2="156" stroke="#2b3a42" stroke-width="3" marker-end="url(#ta-L-06-006-08-energy-transformations-chain)"/>

  <!-- running person: a profile stride, one leg driving, one trailing -->
  <g>
    <!-- trailing leg, heel kicked up behind -->
    <path d="M 196 166 L 174 182 L 163 172" fill="none" stroke="#c98d5f" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="158" cy="169" rx="9" ry="5" fill="#2b3a42" transform="rotate(-18 158 169)"/>
    <!-- trailing arm -->
    <path d="M 204 142 L 188 150 L 195 164" fill="none" stroke="#c98d5f" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- torso, leaning into the run -->
    <path d="M 212 136 L 196 166" fill="none" stroke="#6b93b6" stroke-width="21"
          stroke-linecap="round"/>
    <!-- driving leg, knee up and forward -->
    <path d="M 196 166 L 222 178 L 216 196" fill="none" stroke="#c98d5f" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="218" cy="199" rx="9" ry="5" fill="#2b3a42"/>
    <!-- front arm, bent and swinging -->
    <path d="M 209 142 L 225 152 L 219 136" fill="none" stroke="#c98d5f" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- head and hair -->
    <circle cx="215" cy="117" r="11.5" fill="#c98d5f" stroke="#2b3a42" stroke-width="2"/>
    <path d="M 204 115 Q 204 105 215 105 Q 226 105 226 115 Q 219 109 212 111 Q 206 113 204 115 Z"
          fill="#2b3a42"/>
    <text x="210" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">kinetic (running)</text>
  </g>
  <line x1="250" y1="156" x2="286" y2="156" stroke="#2b3a42" stroke-width="3" marker-end="url(#ta-L-06-006-08-energy-transformations-chain)"/>

  <!-- heat -->
  <g>
    <g stroke="#e0a458" stroke-width="3" fill="none">
      <path d="M 320 190 C 314 176 326 176 320 162"/>
      <path d="M 340 194 C 334 180 346 180 340 166"/>
      <path d="M 360 190 C 354 176 366 176 360 162"/>
    </g>
    <text x="340" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">thermal (waste heat)</text>
  </g>

  <line x1="20" y1="250" x2="492" y2="250" stroke="#d7d1c8" stroke-width="2"/>

  <!-- BOTTOM CHAIN: sun -> leaf -> battery -> bulb -->
  <text x="256" y="284" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">sunlight becomes food, then light again</text>

  <!-- sun -->
  <g>
    <circle cx="72" cy="350" r="18" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="72" y="396" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">light (Sun)</text>
  </g>
  <line x1="94" y1="350" x2="126" y2="350" stroke="#2b3a42" stroke-width="3" marker-end="url(#ta-L-06-006-08-energy-transformations-chain)"/>

  <!-- leaf -->
  <g>
    <path d="M 140 364 Q 180 324 222 344 Q 180 384 140 364 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <line x1="140" y1="364" x2="220" y2="346" stroke="#2b3a42" stroke-width="2"/>
    <text x="180" y="396" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">chemical</text>
    <text x="180" y="410" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">(photosynthesis)</text>
  </g>
  <line x1="222" y1="350" x2="254" y2="350" stroke="#2b3a42" stroke-width="3" marker-end="url(#ta-L-06-006-08-energy-transformations-chain)"/>

  <!-- battery -->
  <g>
    <rect x="274" y="336" width="26" height="40" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <rect x="268" y="344" width="6" height="24" rx="2" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <text x="316" y="374" font-family="sans-serif" font-size="12" fill="#222222">electrical</text>
  </g>
  <line x1="320" y1="350" x2="352" y2="350" stroke="#2b3a42" stroke-width="3" marker-end="url(#ta-L-06-006-08-energy-transformations-chain)"/>

  <!-- bulb -->
  <g>
    <circle cx="402" cy="350" r="22" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <rect x="390" y="372" width="24" height="10" rx="2" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>
    <text x="402" y="412" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">light + heat</text>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222222">follow any chain far enough and you end at heat</text>
  <text x="256" y="494" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f6d7a">each output becomes the next input</text>
</svg>
