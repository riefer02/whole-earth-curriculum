<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 600" role="img" aria-labelledby="title desc">
  <title id="title">All connected</title>
  <desc id="desc">A ripple diagram about how living things depend on one another. Four boxes sit in a row connected by arrows: "water plants," then "small animals (snails, insects)," then "fish and frogs," then "birds." Below, a dashed "what if?" box reads "if the water plants die: small animals lose food, then fish and frogs decline, then birds have less to eat." A closing caption reads "every part depends on the parts around it; change one, and the rest feel it." Labels, arrows, and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="600" fill="#fdfbf7"/>

  <defs>
    <marker id="arr7" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2b3a42"/>
    </marker>
  </defs>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2b3a42">All Connected</text>
  <text x="256" y="54" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">living things depend on one another</text>

  <!-- chain boxes -->
  <rect x="20" y="120" width="104" height="72" rx="10" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="72" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">water</text>
  <text x="72" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">plants</text>

  <line x1="124" y1="156" x2="144" y2="156" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr7)"/>
  <text x="134" y="144" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2b3a42">food</text>

  <rect x="146" y="120" width="104" height="72" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="198" y="146" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">small animals</text>
  <text x="198" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">snails, insects</text>

  <line x1="250" y1="156" x2="270" y2="156" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr7)"/>

  <rect x="272" y="120" width="104" height="72" rx="10" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="324" y="146" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">fish</text>
  <text x="324" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">and frogs</text>

  <line x1="376" y1="156" x2="396" y2="156" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr7)"/>

  <rect x="398" y="120" width="94" height="72" rx="10" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="445" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">birds</text>

  <text x="256" y="214" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">each arrow shows who eats whom — and who depends on whom</text>

  <!-- what if box -->
  <rect x="36" y="250" width="440" height="190" rx="12" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="256" y="282" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">what if one part changes?</text>

  <rect x="60" y="300" width="120" height="54" rx="8" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
  <text x="120" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">the water</text>
  <text x="120" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">plants die</text>

  <line x1="180" y1="327" x2="204" y2="327" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr7)"/>
  <rect x="206" y="300" width="120" height="54" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="266" y="316" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">small animals</text>
  <text x="266" y="336" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">lose food</text>

  <line x1="326" y1="327" x2="350" y2="327" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr7)"/>
  <rect x="352" y="300" width="104" height="54" rx="8" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
  <text x="404" y="316" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">fish and frogs</text>
  <text x="404" y="336" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">decline</text>

  <line x1="404" y1="354" x2="404" y2="378" stroke="#2b3a42" stroke-width="2" marker-end="url(#arr7)"/>
  <rect x="352" y="380" width="104" height="40" rx="8" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
  <text x="404" y="404" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222222">birds have</text>
  <text x="404" y="418" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">less to eat</text>

  <text x="256" y="464" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">a change ripples out — one part touches all the others</text>

  <rect x="36" y="492" width="440" height="64" rx="10" fill="#2b3a42" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="520" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Every part depends on the parts around it.</text>
  <text x="256" y="542" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fdfbf7">change one, and the rest feel it.</text>
</svg>
