<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-08-001-07-pause-button desc-L-08-001-07-pause-button">
  <title id="title-L-08-001-07-pause-button">Pause before you pounce: the respond-not-react path</title>
  <desc id="desc-L-08-001-07-pause-button">A four-step path from left to right. Step 1: a charged moment. Step 2: a pause symbol (two bars) labeled "pause". Step 3: a small menu of three tools: breathe, name the feeling, count to ten. Step 4: "choose my response". Arrows connect the steps. Outline and label only, so it prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Respond, don&#8217;t react</text>

  <!-- Step 1 -->
  <rect x="26" y="112" width="100" height="124" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="76" y="168" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">charged</text>
  <text x="76" y="190" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">moment</text>

  <line x1="128" y1="174" x2="142" y2="174" stroke="#e0a458" stroke-width="4" stroke-linecap="round"/>
  <path d="M140 169 L150 174 L140 179 Z" fill="#e0a458"/>

  <!-- Step 2: pause -->
  <rect x="152" y="112" width="100" height="124" rx="14" fill="#ffffff" stroke="#e0a458" stroke-width="3"/>
  <rect x="184" y="144" width="12" height="56" rx="3" fill="#e0a458"/>
  <rect x="206" y="144" width="12" height="56" rx="3" fill="#e0a458"/>
  <text x="202" y="222" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">pause</text>

  <line x1="254" y1="174" x2="268" y2="174" stroke="#e0a458" stroke-width="4" stroke-linecap="round"/>
  <path d="M266 169 L276 174 L266 179 Z" fill="#e0a458"/>

  <!-- Step 3: tools -->
  <rect x="278" y="112" width="100" height="124" rx="14" fill="#ffffff" stroke="#6b93b6" stroke-width="2.5"/>
  <text x="328" y="144" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">breathe</text>
  <text x="328" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">name the feeling</text>
  <text x="328" y="188" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42">count to ten</text>
  <text x="328" y="218" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">(pick one)</text>

  <line x1="380" y1="174" x2="394" y2="174" stroke="#e0a458" stroke-width="4" stroke-linecap="round"/>
  <path d="M392 169 L402 174 L392 179 Z" fill="#e0a458"/>

  <!-- Step 4 -->
  <rect x="404" y="112" width="100" height="124" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="454" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">choose my</text>
  <text x="454" y="188" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b3a42">response</text>

  <!-- Loop back -->
  <path d="M454 236 L454 300 Q454 318 436 318 L94 318 Q76 318 76 300 L76 244" fill="none" stroke="#7a9e7e" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M70 248 L76 238 L82 248 Z" fill="#7a9e7e"/>
  <text x="256" y="344" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">practice makes the pause come faster</text>

  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">the impulse says &#8220;now&#8221; &#8212; the pause gives you the choice back</text>
</svg>
