<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Capstone web: synthesis and authorship</title>
  <desc id="desc">A web diagram with synthesis and authorship at the center and eight spokes — synthesize spoken sources, lead a discussion, structure style and argument, world literature, synthesize across texts, research argument, real audiences, and languages and identity — each labeled with a short reminder.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Our Unit Web: Synthesis &amp; Authorship</text>

  <!-- center -->
  <ellipse cx="256" cy="256" rx="82" ry="40" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="256" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">synthesis</text>
  <text x="256" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b3a42">&amp; authorship</text>

  <!-- spokes (8 goal nodes) -->
  <rect x="20" y="92" width="150" height="52" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="95" y="112" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">synthesize spoken sources</text>
  <text x="95" y="130" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#4f6d7a">many voices, one account</text>

  <rect x="342" y="92" width="150" height="52" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="417" y="112" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">lead a fair discussion</text>
  <text x="417" y="130" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#4f6d7a">every voice, fair managing</text>

  <rect x="20" y="160" width="150" height="52" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="95" y="180" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">structure · style · argument</text>
  <text x="95" y="198" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#4f6d7a">how a text works</text>

  <rect x="342" y="160" width="150" height="52" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="417" y="180" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">world literature</text>
  <text x="417" y="198" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#4f6d7a">many places, same tools</text>

  <rect x="20" y="228" width="150" height="52" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="95" y="248" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">synthesize across texts</text>
  <text x="95" y="266" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#4f6d7a">one supported position</text>

  <rect x="342" y="228" width="150" height="52" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="417" y="248" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">research argument</text>
  <text x="417" y="266" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#4f6d7a">claim · evidence · citation</text>

  <rect x="20" y="296" width="150" height="52" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="95" y="316" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">compose for real readers</text>
  <text x="95" y="334" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#4f6d7a">letter · proposal · post</text>

  <rect x="342" y="296" width="150" height="52" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5"/>
  <text x="417" y="316" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#222222">languages &amp; identity</text>
  <text x="417" y="334" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#4f6d7a">loss · revitalization · me</text>

  <!-- connector lines -->
  <path d="M170 118 C 210 150, 220 200, 224 230" fill="none" stroke="#4f6d7a" stroke-width="1.5"/>
  <path d="M342 118 C 302 150, 292 200, 288 230" fill="none" stroke="#4f6d7a" stroke-width="1.5"/>
  <path d="M170 186 C 200 200, 210 230, 224 250" fill="none" stroke="#4f6d7a" stroke-width="1.5"/>
  <path d="M342 186 C 312 200, 302 230, 288 250" fill="none" stroke="#4f6d7a" stroke-width="1.5"/>
  <path d="M170 254 C 200 260, 210 262, 224 264" fill="none" stroke="#4f6d7a" stroke-width="1.5"/>
  <path d="M342 254 C 312 260, 302 262, 288 264" fill="none" stroke="#4f6d7a" stroke-width="1.5"/>
  <path d="M170 322 C 200 300, 210 280, 226 274" fill="none" stroke="#4f6d7a" stroke-width="1.5"/>
  <path d="M342 322 C 312 300, 302 280, 286 274" fill="none" stroke="#4f6d7a" stroke-width="1.5"/>

  <text x="256" y="470" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">Eight goals, one skill: build a supported voice and share it with the world</text>
</svg>
