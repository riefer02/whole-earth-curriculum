<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-L-06-002-01-stress-tension-in-body desc-L-06-002-01-stress-tension-in-body">
  <title id="title-L-06-002-01-stress-tension-in-body">Stress, tension, and my body</title>
  <desc id="desc-L-06-002-01-stress-tension-in-body">A thought bubble reading "so much to do, and a test tomorrow" beside a worried face, with an arrow pointing down to a body in soft silhouette. Three shaded areas on the body are joined by leader lines to labels: tight shoulders, clenched jaw, and tight stomach. A caption reads: stress in the mind can show up as tension in the body. Leaders and labels, not colour alone, carry the meaning, so the picture prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Stress in the Mind, Tension in the Body</text>

  <!-- Thought bubble -->
  <rect x="56" y="64" width="180" height="96" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="242" cy="154" r="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="261" cy="142" r="4.5" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="146" y="94" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">so much to do,</text>
  <text x="146" y="116" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">and a test</text>
  <text x="146" y="138" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">tomorrow</text>

  <!-- Worried face -->
  <circle cx="300" cy="112" r="32" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="290" cy="106" r="3" fill="#2b3a42"/>
  <circle cx="310" cy="106" r="3" fill="#2b3a42"/>
  <path d="M288 128 Q300 136 312 128" fill="none" stroke="#2b3a42" stroke-width="2"
        stroke-linecap="round"/>

  <!-- Arrow from the thought to the body -->
  <path d="M300 150 L300 204" stroke="#4f6d7a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M292 196 L300 208 L308 196" stroke="#4f6d7a" stroke-width="3" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Body: one soft silhouette, not a stick figure -->
  <g fill="#d9e3e9">
    <circle cx="300" cy="244" r="21"/>
    <rect x="294" y="260" width="12" height="18" rx="5"/>
    <rect x="272" y="272" width="56" height="126" rx="24"/>
    <path d="M 278 286 L 262 340" stroke="#d9e3e9" stroke-width="16"
          stroke-linecap="round" fill="none"/>
    <path d="M 322 286 L 338 340" stroke="#d9e3e9" stroke-width="16"
          stroke-linecap="round" fill="none"/>
    <path d="M 292 392 L 290 448" stroke="#d9e3e9" stroke-width="20"
          stroke-linecap="round" fill="none"/>
    <path d="M 308 392 L 310 448" stroke="#d9e3e9" stroke-width="20"
          stroke-linecap="round" fill="none"/>
    <ellipse cx="287" cy="452" rx="11" ry="6"/>
    <ellipse cx="313" cy="452" rx="11" ry="6"/>
  </g>

  <!-- Tension held in the body, marked with shape as well as colour -->
  <g fill="#e0a458" opacity="0.75">
    <ellipse cx="279" cy="287" rx="11" ry="9"/>
    <ellipse cx="321" cy="287" rx="11" ry="9"/>
    <ellipse cx="300" cy="257" rx="10" ry="6"/>
    <ellipse cx="300" cy="344" rx="16" ry="13"/>
  </g>

  <!-- Leaders sit under the labels and meet the shaded spot -->
  <g stroke="#4f6d7a" stroke-width="2" fill="none">
    <line x1="318" y1="256" x2="356" y2="238"/>
    <line x1="328" y1="289" x2="356" y2="296"/>
    <line x1="316" y1="344" x2="356" y2="344"/>
  </g>

  <g font-family="sans-serif" font-size="15" fill="#222222">
    <text x="360" y="234">clenched</text>
    <text x="360" y="252">jaw</text>
    <text x="360" y="292">tight</text>
    <text x="360" y="310">shoulders</text>
    <text x="360" y="340">tight</text>
    <text x="360" y="358">stomach</text>
  </g>

  <text x="256" y="492" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">Stress in the mind can show up as tension in the body.</text>
</svg>
