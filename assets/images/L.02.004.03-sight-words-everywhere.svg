<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Sight words everywhere</title>
  <desc id="desc">A child reads a stack of word cards, with a small stopwatch beside them. The cards show common words written in two different writing systems side by side — Latin letters and Arabic script — all the same size, to show that sight words can be known quickly in any language's script. A little burst of stars above the cards marks a word read instantly "by heart." The labels and shapes carry the meaning, so the picture prints clearly in grayscale and teaches learners to read common words they see every day quickly and by heart.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">Sight Words Everywhere</text>

  <!-- child reading -->
  <circle cx="256" cy="150" r="30" fill="#c99567" stroke="#2b3a42" stroke-width="2"/>
  <path d="M218 230 Q214 178 256 178 Q298 178 294 230 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>

  <!-- cards fanned on the table -->
  <g>
    <rect x="120" y="270" width="120" height="70" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2" transform="rotate(-8 180 305)"/>
    <text x="180" y="312" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">home</text>

    <rect x="250" y="258" width="120" height="70" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2" transform="rotate(2 310 293)"/>
    <text x="310" y="300" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans', 'Arial Unicode MS', sans-serif" font-size="26" font-weight="bold" fill="#2b3a42">بيت</text>

    <rect x="210" y="320" width="120" height="70" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2" transform="rotate(-4 270 355)"/>
    <text x="270" y="362" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">friend</text>

    <rect x="336" y="330" width="120" height="70" rx="10" fill="#ffffff" stroke="#2b3a42" stroke-width="2" transform="rotate(7 396 365)"/>
    <text x="396" y="372" text-anchor="middle" font-family="'DejaVu Sans', 'Noto Sans', 'Arial Unicode MS', sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">صديق</text>
  </g>

  <!-- stars for instant recognition -->
  <path d="M100 180 l5 12 13 2 -9 9 2 13 -11 -7 -11 7 2 -13 -9 -9 13 -2 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="1.5"/>
  <path d="M150 120 l4 10 10 1 -7 7 2 10 -9 -5 -9 5 2 -10 -7 -7 10 -1 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>

  <!-- stopwatch -->
  <circle cx="434" cy="140" r="26" fill="#ffffff" stroke="#2b3a42" stroke-width="2.5"/>
  <line x1="434" y1="140" x2="434" y2="124" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="434" y1="140" x2="448" y2="150" stroke="#e0a458" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="428" y="104" width="12" height="12" rx="3" fill="#4f6d7a" stroke="#2b3a42" stroke-width="2"/>

  <text x="256" y="452" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Words you know at a glance, in any language's script.</text>
</svg>
