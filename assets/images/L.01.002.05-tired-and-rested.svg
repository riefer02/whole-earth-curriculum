<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Tired and rested</title>
  <desc id="desc">Two figures show the same child tired and rested. The tired figure has a drooping head, heavy closed eyes, and a yawn, with slow z's floating nearby. The rested figure has a lifted head, bright open eyes, and a small smile. An arrow between them is labeled rest and sleep. A note says rest is kind care, not lazy.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#2b3a42">Tired and Rested</text>

  <!-- Tired figure -->
  <g>
    <text x="128" y="90" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">tired</text>
    <!-- drooping head -->
    <circle cx="120" cy="150" r="40" fill="#d7d1c3" stroke="#2b3a42" stroke-width="2"/>
    <path d="M102 146 Q111 151 120 146" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M124 146 Q133 151 142 146" fill="none" stroke="#2b3a42" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="128" cy="166" rx="9" ry="7" fill="#2b3a42"/>
    <!-- z's -->
    <text x="158" y="126" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4f6d7a">z</text>
    <text x="170" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f6d7a">z</text>
    <!-- slumped body -->
    <rect x="96" y="188" width="56" height="92" rx="18" fill="#d7d1c3" stroke="#2b3a42" stroke-width="2"/>
    <line x1="100" y1="204" x2="82" y2="252" stroke="#d7d1c3" stroke-width="16" stroke-linecap="round"/>
    <line x1="152" y1="204" x2="166" y2="252" stroke="#d7d1c3" stroke-width="16" stroke-linecap="round"/>
    <line x1="116" y1="276" x2="116" y2="316" stroke="#d7d1c3" stroke-width="18" stroke-linecap="round"/>
    <line x1="140" y1="276" x2="140" y2="316" stroke="#d7d1c3" stroke-width="18" stroke-linecap="round"/>
    <text x="124" y="344" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">heavy eyes,</text>
    <text x="124" y="363" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">slow body</text>
  </g>

  <!-- Rest arrow -->
  <g>
    <path d="M188 214 L300 214" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M294 208 L302 214 L294 220" fill="none" stroke="#4f6d7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="244" y="200" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">rest</text>
    <text x="244" y="238" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">and</text>
    <text x="244" y="254" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">sleep</text>
  </g>

  <!-- Rested figure -->
  <g>
    <text x="388" y="90" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#2b3a42">rested</text>
    <!-- lifted head -->
    <circle cx="388" cy="140" r="40" fill="#d7d1c3" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="374" cy="134" r="4" fill="#2b3a42"/>
    <circle cx="402" cy="134" r="4" fill="#2b3a42"/>
    <path d="M376 152 Q388 162 400 152" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
    <!-- bright sparkles -->
    <path d="M428 112 l4 8 8 4 -8 4 -4 8 -4 -8 -8 -4 8 -4 Z" fill="#e0a458"/>
    <!-- upright body -->
    <rect x="364" y="178" width="56" height="92" rx="18" fill="#d7d1c3" stroke="#2b3a42" stroke-width="2"/>
    <line x1="368" y1="196" x2="350" y2="244" stroke="#d7d1c3" stroke-width="16" stroke-linecap="round"/>
    <line x1="420" y1="196" x2="434" y2="244" stroke="#d7d1c3" stroke-width="16" stroke-linecap="round"/>
    <line x1="384" y1="266" x2="384" y2="306" stroke="#d7d1c3" stroke-width="18" stroke-linecap="round"/>
    <line x1="408" y1="266" x2="408" y2="306" stroke="#d7d1c3" stroke-width="18" stroke-linecap="round"/>
    <text x="392" y="334" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">bright eyes,</text>
    <text x="392" y="353" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222222">ready to play</text>
  </g>

  <text x="256" y="416" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4f6d7a">Rest is not lazy — rest fills your energy back up.</text>
</svg>
