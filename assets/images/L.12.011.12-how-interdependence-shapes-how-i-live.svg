<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">How Interdependence Shapes How I Live</title>
  <desc id="desc">Concentric ripples expanding from a central circle labeled 'one everyday choice,' through rings labeled 'me,' 'other people,' 'other species,' 'future generations,' and 'the Earth.' Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2b3a42" font-weight="bold">One Choice, Many Ripples</text>

  <!-- rings -->
  <circle cx="256" cy="280" r="52" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="275" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42" font-weight="bold">one everyday</text>
  <text x="256" y="292" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42" font-weight="bold">choice</text>

  <circle cx="256" cy="280" r="92" fill="none" stroke="#6b93b6" stroke-width="2.5"/>
  <text x="256" y="182" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42" font-weight="bold">me</text>

  <circle cx="256" cy="280" r="132" fill="none" stroke="#7a9e7e" stroke-width="2.5"/>
  <text x="256" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42" font-weight="bold">other people</text>

  <circle cx="256" cy="280" r="172" fill="none" stroke="#e0a458" stroke-width="2.5"/>
  <text x="256" y="102" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42" font-weight="bold">other species</text>

  <circle cx="256" cy="280" r="212" fill="none" stroke="#4f6d7a" stroke-width="2.5"/>
  <text x="256" y="62" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42" font-weight="bold">future generations</text>

  <!-- outer Earth arc label at bottom -->
  <text x="256" y="500" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b3a42" font-weight="bold">…and the Earth</text>
</svg>
