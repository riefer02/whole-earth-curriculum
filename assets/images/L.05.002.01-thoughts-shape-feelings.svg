<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Same event, different thoughts, different feelings</title>
  <desc id="desc">A two-row chart showing the same event leading to two different thoughts and two different feelings. The top row shows a rainy day, the thought "our game is ruined," and a worried face. The bottom row shows the same rainy day, the thought "the garden needs this," and a calm smiling face. Columns are labeled event, thought, and feeling. Shapes and labels, not color alone, carry the meaning so the chart prints clearly in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Same Event, Different Thoughts</text>

  <!-- Column headers -->
  <text x="104" y="84" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#4f6d7a">event</text>
  <text x="256" y="84" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#4f6d7a">thought</text>
  <text x="418" y="84" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#4f6d7a">feeling</text>

  <!-- Row 1 -->
  <!-- event: rain cloud -->
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 128 q-12 -4 -12 -20 a14 14 0 0 1 8 -12 a20 20 0 0 1 38 -4 a16 16 0 0 1 26 8 a16 16 0 0 1 4 20 q6 0 6 10 z" fill="#c9d6df"/>
  </g>
  <g stroke="#6b93b6" stroke-width="3" stroke-linecap="round">
    <line x1="82" y1="152" x2="82" y2="164"/>
    <line x1="98" y1="152" x2="98" y2="164"/>
    <line x1="114" y1="152" x2="114" y2="164"/>
  </g>

  <!-- thought bubble 1 -->
  <rect x="180" y="120" width="152" height="62" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M216 182 L208 200 L238 182" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <text x="256" y="158" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#222222">Our game</text>
  <text x="256" y="177" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#222222">is ruined.</text>

  <!-- worried face 1 -->
  <circle cx="418" cy="150" r="34" fill="#f5d6b6" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="406" cy="142" r="3.5" fill="#2b3a42"/>
  <circle cx="430" cy="142" r="3.5" fill="#2b3a42"/>
  <path d="M400 134 Q406 130 412 134" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M424 134 Q430 130 436 134" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M406 164 Q418 156 430 164" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="418" y="206" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">worried</text>

  <!-- Row 2 -->
  <!-- event: rain cloud (same) -->
  <g stroke="#2b3a42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 268 q-12 -4 -12 -20 a14 14 0 0 1 8 -12 a20 20 0 0 1 38 -4 a16 16 0 0 1 26 8 a16 16 0 0 1 4 20 q6 0 6 10 z" fill="#c9d6df"/>
  </g>
  <g stroke="#6b93b6" stroke-width="3" stroke-linecap="round">
    <line x1="82" y1="292" x2="82" y2="304"/>
    <line x1="98" y1="292" x2="98" y2="304"/>
    <line x1="114" y1="292" x2="114" y2="304"/>
  </g>

  <!-- thought bubble 2 -->
  <rect x="180" y="260" width="152" height="62" rx="14" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <path d="M216 322 L208 340 L238 322" fill="#ffffff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
  <text x="256" y="297" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#222222">The garden</text>
  <text x="256" y="316" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#222222">needs this.</text>

  <!-- calm smiling face 2 -->
  <circle cx="418" cy="290" r="34" fill="#ab7a4e" stroke="#2b3a42" stroke-width="2"/>
  <circle cx="406" cy="282" r="3.5" fill="#2b3a42"/>
  <circle cx="430" cy="282" r="3.5" fill="#2b3a42"/>
  <path d="M400 274 Q406 270 412 274" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M424 274 Q430 270 436 274" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <path d="M404 302 Q418 314 432 302" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
  <text x="418" y="346" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">relieved</text>

  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2b3a42">The event stayed the same — the thought changed the feeling.</text>

  <!-- connector arrows -->
  <g stroke="#e0a458" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 140 L176 140" marker-end="none"/>
    <path d="M118 150 L118 150"/>
  </g>
</svg>
