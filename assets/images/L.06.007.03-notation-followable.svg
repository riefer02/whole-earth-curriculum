<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 560" role="img" aria-labelledby="title desc">
  <title id="title">Notate it so others can follow</title>
  <desc id="desc">A notation poster titled "Notate it so others can follow." At the top, a beat grid shows four boxes; the first holds one filled note labeled "ta — one sound on a beat," the second holds two beamed notes labeled "ti-ti — two sounds on a beat." Below, a five-step pitch ladder is labeled, bottom to top, "do re mi sol la," and a worked example melody of noteheads on the ladder steps reads across the grid, with a caption "same beat grid, plus a pitch ladder — a melody anyone can read." Labels and shapes, not color alone, carry the meaning so it prints clearly in grayscale.</desc>

  <rect width="512" height="560" fill="#fdfbf7"/>
  <text x="256" y="36" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b3a42">Notate It So Others Can Follow</text>

  <!-- beat grid: four boxes -->
  <text x="40" y="76" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">the beat grid — one box per beat</text>
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <rect x="40" y="92" width="90" height="64"/>
    <rect x="134" y="92" width="90" height="64"/>
    <rect x="228" y="92" width="90" height="64"/>
    <rect x="322" y="92" width="90" height="64"/>
  </g>
  <!-- box 1: ta -->
  <ellipse cx="85" cy="124" rx="12" ry="9" fill="#2b3a42"/>
  <line x1="97" y1="124" x2="97" y2="108" stroke="#2b3a42" stroke-width="2"/>
  <text x="85" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">ta</text>
  <text x="85" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">one sound on a beat</text>
  <!-- box 2: ti-ti -->
  <ellipse cx="165" cy="124" rx="9" ry="7" fill="#2b3a42"/>
  <line x1="174" y1="124" x2="174" y2="108" stroke="#2b3a42" stroke-width="2"/>
  <ellipse cx="193" cy="124" rx="9" ry="7" fill="#2b3a42"/>
  <line x1="202" y1="124" x2="202" y2="108" stroke="#2b3a42" stroke-width="2"/>
  <line x1="174" y1="110" x2="202" y2="110" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="179" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">ti-ti</text>
  <text x="179" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">two sounds on a beat</text>
  <!-- box 3: ta -->
  <ellipse cx="273" cy="124" rx="12" ry="9" fill="#2b3a42"/>
  <line x1="285" y1="124" x2="285" y2="108" stroke="#2b3a42" stroke-width="2"/>
  <text x="273" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">ta</text>
  <!-- box 4: rest -->
  <path d="M363 108 L377 124 L363 140" fill="none" stroke="#2b3a42" stroke-width="2.5"/>
  <text x="370" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b3a42">(rest)</text>
  <text x="370" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4f6d7a">one silent beat</text>

  <!-- pitch ladder -->
  <text x="40" y="250" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">the pitch ladder — how high</text>
  <g stroke="#2b3a42" stroke-width="2" fill="none">
    <rect x="40" y="268" width="90" height="30"/>
    <rect x="40" y="298" width="90" height="30"/>
    <rect x="40" y="328" width="90" height="30"/>
    <rect x="40" y="358" width="90" height="30"/>
    <rect x="40" y="388" width="90" height="30"/>
  </g>
  <text x="30" y="288" text-anchor="end" font-family="sans-serif" font-size="14" fill="#2b3a42">la</text>
  <text x="30" y="318" text-anchor="end" font-family="sans-serif" font-size="14" fill="#2b3a42">sol</text>
  <text x="30" y="348" text-anchor="end" font-family="sans-serif" font-size="14" fill="#2b3a42">mi</text>
  <text x="30" y="378" text-anchor="end" font-family="sans-serif" font-size="14" fill="#2b3a42">re</text>
  <text x="30" y="408" text-anchor="end" font-family="sans-serif" font-size="14" fill="#2b3a42">do</text>

  <!-- worked example melody: do do re-mi sol -->
  <text x="160" y="286" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">worked example: do · do · re-mi · sol</text>
  <!-- do -->
  <ellipse cx="180" cy="403" rx="11" ry="8" fill="#2b3a42"/>
  <line x1="191" y1="403" x2="191" y2="388" stroke="#2b3a42" stroke-width="2"/>
  <!-- do -->
  <ellipse cx="220" cy="403" rx="11" ry="8" fill="#2b3a42"/>
  <line x1="231" y1="403" x2="231" y2="388" stroke="#2b3a42" stroke-width="2"/>
  <!-- re -->
  <ellipse cx="260" cy="373" rx="9" ry="7" fill="#2b3a42"/>
  <line x1="269" y1="373" x2="269" y2="358" stroke="#2b3a42" stroke-width="2"/>
  <!-- mi -->
  <ellipse cx="282" cy="343" rx="9" ry="7" fill="#2b3a42"/>
  <line x1="291" y1="343" x2="291" y2="328" stroke="#2b3a42" stroke-width="2"/>
  <line x1="269" y1="360" x2="291" y2="330" stroke="#2b3a42" stroke-width="2.5"/>
  <!-- sol -->
  <ellipse cx="324" cy="313" rx="11" ry="8" fill="#2b3a42"/>
  <line x1="335" y1="313" x2="335" y2="298" stroke="#2b3a42" stroke-width="2"/>

  <!-- beat positions beneath melody -->
  <g stroke="#4f6d7a" stroke-width="1.5" fill="none">
    <line x1="180" y1="410" x2="180" y2="430"/>
    <line x1="220" y1="410" x2="220" y2="430"/>
    <line x1="260" y1="380" x2="260" y2="430"/>
    <line x1="282" y1="350" x2="282" y2="430"/>
    <line x1="324" y1="320" x2="324" y2="430"/>
  </g>
  <text x="176" y="446" font-family="sans-serif" font-size="12" fill="#4f6d7a">beat 1</text>
  <text x="216" y="446" font-family="sans-serif" font-size="12" fill="#4f6d7a">beat 2</text>
  <text x="268" y="446" font-family="sans-serif" font-size="12" fill="#4f6d7a">beat 3</text>
  <text x="324" y="446" font-family="sans-serif" font-size="12" fill="#4f6d7a">beat 4</text>

  <line x1="40" y1="470" x2="472" y2="470" stroke="#d8d3ca" stroke-width="2"/>
  <text x="256" y="498" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42">same beat grid, plus a pitch ladder — a melody anyone can read</text>
  <text x="256" y="526" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4f6d7a">people around the world notate music in many ways — this is one shared way</text>
</svg>
