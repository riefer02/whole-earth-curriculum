<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Dressing and my daily care</title>
  <desc id="desc">Five cards show ways clothes fasten: a button, a zip, a snap, a tie, and a wrap with a sash or drawstring. Each card has a simple drawing and a word label. Below, five icons with arrows show a daily care routine in order: wake, wash, brush, dress, eat. Labels carry the meaning, so it prints in grayscale.</desc>

  <rect width="512" height="512" fill="#fdfbf7"/>
  <text x="256" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2b3a42">Dressing and My Daily Care</text>

  <!-- button -->
  <g>
    <rect x="16" y="76" width="92" height="150" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="60" cy="128" r="16" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="54" cy="122" r="2" fill="#2b3a42"/>
    <circle cx="66" cy="122" r="2" fill="#2b3a42"/>
    <circle cx="54" cy="134" r="2" fill="#2b3a42"/>
    <circle cx="66" cy="134" r="2" fill="#2b3a42"/>
    <rect x="42" y="156" width="36" height="14" rx="4" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="60" y="196" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">button</text>
  </g>

  <!-- zip -->
  <g>
    <rect x="116" y="76" width="92" height="150" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <line x1="152" y1="104" x2="152" y2="170" stroke="#2b3a42" stroke-width="2"/>
    <line x1="168" y1="104" x2="168" y2="170" stroke="#2b3a42" stroke-width="2"/>
    <path d="M152 108 l8 6 l-8 6 l8 6 l-8 6 l8 6 l-8 6 l8 6 l-8 6 l8 6 l-8 6" fill="none" stroke="#4f6d7a" stroke-width="2" stroke-linejoin="round"/>
    <rect x="152" y="168" width="16" height="18" rx="4" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2"/>
    <text x="160" y="196" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">zip</text>
  </g>

  <!-- snap -->
  <g>
    <rect x="216" y="76" width="92" height="150" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="260" cy="118" r="15" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <circle cx="254" cy="112" r="2" fill="#2b3a42"/>
    <circle cx="266" cy="112" r="2" fill="#2b3a42"/>
    <circle cx="254" cy="124" r="2" fill="#2b3a42"/>
    <circle cx="266" cy="124" r="2" fill="#2b3a42"/>
    <line x1="260" y1="133" x2="260" y2="142" stroke="#2b3a42" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="260" cy="158" r="15" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="260" y="196" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">snap</text>
  </g>

  <!-- tie -->
  <g>
    <rect x="316" y="76" width="92" height="150" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <path d="M360 118 q-14 -10 -24 0 q10 8 14 8 q-4 0 -14 -8 q-10 10 24 0 Z" fill="none" stroke="#2b3a42" stroke-width="2"/>
    <path d="M338 122 q-10 4 -4 12 q6 -2 8 -6 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M382 122 q10 4 4 12 q-6 -2 -8 -6 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M356 152 l8 16 l8 -16 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="360" y="196" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">tie</text>
  </g>

  <!-- wrap / sash -->
  <g>
    <rect x="416" y="76" width="92" height="150" rx="12" fill="#ffffff" stroke="#4f6d7a" stroke-width="2" stroke-opacity="0.4"/>
    <path d="M436 108 L484 108 L484 168 L460 168 L448 148 L436 168 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <line x1="452" y1="124" x2="452" y2="160" stroke="#8f5f3d" stroke-width="2"/>
    <path d="M446 132 q6 6 12 0" fill="none" stroke="#8f5f3d" stroke-width="2" stroke-linecap="round"/>
    <text x="460" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">wrap / sash</text>
  </g>

  <text x="256" y="252" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4f6d7a">Much of the world&#8217;s clothing wraps, ties, or uses a sash or drawstring — all are honored.</text>

  <!-- Daily routine -->
  <text x="256" y="290" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b3a42">My day, in order</text>
  <g>
    <!-- wake -->
    <circle cx="48" cy="340" r="20" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="48" y="384" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">wake</text>
    <!-- arrow -->
    <line x1="72" y1="340" x2="88" y2="340" stroke="#4f6d7a" stroke-width="3"/>
    <path d="M86 335 L96 340 L86 345 Z" fill="#4f6d7a"/>
    <!-- wash -->
    <path d="M130 328 q8 10 0 20 q-8 -10 0 -20 Z" fill="#6b93b6" stroke="#2b3a42" stroke-width="2"/>
    <text x="136" y="384" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">wash</text>
    <!-- arrow -->
    <line x1="164" y1="340" x2="180" y2="340" stroke="#4f6d7a" stroke-width="3"/>
    <path d="M178 335 L188 340 L178 345 Z" fill="#4f6d7a"/>
    <!-- brush -->
    <line x1="214" y1="332" x2="214" y2="348" stroke="#e0a458" stroke-width="8" stroke-linecap="round"/>
    <rect x="222" y="328" width="18" height="8" rx="3" fill="#6b93b6" stroke="#2b3a42" stroke-width="1.5"/>
    <text x="228" y="384" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">brush</text>
    <!-- arrow -->
    <line x1="256" y1="340" x2="272" y2="340" stroke="#4f6d7a" stroke-width="3"/>
    <path d="M270 335 L280 340 L270 345 Z" fill="#4f6d7a"/>
    <!-- dress -->
    <path d="M318 322 L330 322 L338 352 L310 352 Z" fill="#7a9e7e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
    <text x="320" y="384" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">dress</text>
    <!-- arrow -->
    <line x1="348" y1="340" x2="364" y2="340" stroke="#4f6d7a" stroke-width="3"/>
    <path d="M362 335 L372 340 L362 345 Z" fill="#4f6d7a"/>
    <!-- eat -->
    <path d="M398 330 A18 18 0 0 0 434 330 Z" fill="#e0a458" stroke="#2b3a42" stroke-width="2"/>
    <text x="412" y="384" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">eat</text>
  </g>

  <text x="256" y="424" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3a42">Helpers, Velcro, big buttons, and extra practice are all fine.</text>
  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">Practice is how fingers grow. Caring for your body is the goal — care is never a test.</text>
  <text x="256" y="478" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4f6d7a">There is no one right outfit — people dress for their own weather and their own life.</text>
</svg>
