<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">How Migration Shaped the Human Story</title>
  <desc id="desc">A central circle labeled "migration shaped the human story," with three arrows pointing in, each labeled one kind of effect: "spread crops, animals, and technologies," "mixed languages, ideas, and beliefs," and "carried dignity and trauma." Below, a line reads "spread and loss, together." Labels carry the meaning, so it prints in grayscale.</desc>
  <rect width="512" height="512" fill="#fdfbf7"/>

  <text x="256" y="40" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2b3a42" font-weight="bold">How Migration Shaped the Human Story</text>

  <!-- central -->
  <circle cx="256" cy="250" r="88" fill="none" stroke="#2b3a42" stroke-width="3"/>
  <text x="256" y="242" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">Migration shaped</text>
  <text x="256" y="262" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">the human story</text>

  <!-- three arrows -->
  <!-- spread crops -->
  <line x1="120" y1="140" x2="200" y2="200" stroke="#6b93b6" stroke-width="4"/>
  <polygon points="200,200 186,194 192,208" fill="#6b93b6"/>
  <text x="70" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">spread</text>
  <text x="70" y="128" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">crops, animals,</text>
  <text x="70" y="142" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">technologies</text>

  <!-- mix languages -->
  <line x1="256" y1="110" x2="256" y2="160" stroke="#e0a458" stroke-width="4"/>
  <polygon points="256,160 248,148 264,148" fill="#e0a458"/>
  <text x="256" y="86" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">mixed</text>
  <text x="256" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">languages, ideas, beliefs</text>

  <!-- carry dignity -->
  <line x1="392" y1="140" x2="312" y2="200" stroke="#7a9e7e" stroke-width="4"/>
  <polygon points="312,200 320,194 306,208" fill="#7a9e7e"/>
  <text x="442" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b3a42" font-weight="bold">carried</text>
  <text x="442" y="128" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">dignity and trauma</text>

  <rect x="80" y="380" width="352" height="64" rx="8" fill="none" stroke="#4f6d7a" stroke-width="3"/>
  <text x="256" y="408" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b3a42" font-weight="bold">Spread and loss, together.</text>
  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4f6d7a">A full account names both — never only the gift, never only the wound.</text>

  <text x="256" y="486" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">Migration keeps shaping the story — now and next.</text>
</svg>
