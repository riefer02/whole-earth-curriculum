[build]
  base = "www"
  command = "npm run build"
  publish = "dist"
  # The curriculum lives OUTSIDE this base directory (curriculum/, assets/,
  # sources/), but Netlify's change detection only watches the base. Left to
  # itself it cancels the deploy of a content-only commit with "no content
  # change" — so a lesson edit silently never reaches the site. A lesson commit
  # on 2026-11-24 was lost exactly this way. Non-zero means "do build".
  ignore = "exit 1"

[build.environment]
  NODE_VERSION = "22"
  SITE_URL = "https://wholeearthcurriculum.org"

[[headers]]
  for = "/pagefind/index/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pagefind/fragment/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pagefind/filter/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com https://wec-support-form.whole-earth-curriculum.workers.dev; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
