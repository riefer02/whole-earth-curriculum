  - id: S-111
    title: "BBC Bitesize (KS2) — What can fossils tell us?"
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zvhhvcw/articles/ztbshcw
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.04.006 L10 (Fossils and Rock Layers: Earth's Long Story) for how fossils give clues about Earth's long history and past life. URL verified live (2026-08-17), article 'What can fossils tell us?' (KS2 'Evolution and inheritance' topic zvhhvcw). Replaces broken article z9bbkqt/z22w9ty (404)."

  - id: S-112
    title: "BBC Bitesize (KS2) — What are conductors and insulators?"
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zj44jxs/articles/zxv482p
    organization: BBC Bitesize
    domains: [D06]
