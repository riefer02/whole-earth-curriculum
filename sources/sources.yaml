# Canonical source registry. Owned by the fact-checker agent.
# `reviewed` is true only after the fact-checker has verified the source.

sources:
  - id: S-001
    title: CASEL — Fundamentals of Social and Emotional Learning
    type: website
    url: https://casel.org/fundamentals-of-sel/
    organization: CASEL (Collaborative for Academic, Social, and Emotional Learning)
    domains: [D01, D02, D03, D04, D09]
    reviewed: true
    notes: "Framework for the SEL competencies referenced in D01 exemplars; also cited in D04 language/listening lessons (U.00.005 L01/L02/L04; U.01.004 L01) and in D09 kindness/caring (U.00.011 L01). Also cited in D09 fairness/shared rules (U.01.010 L01) for the responsible decision-making competency, and in U.03.010 L01/L05/L06/L07/L08/L10 (responsible decision-making, relationship skills, social awareness, and self-management — all five competencies are real CASEL competencies). Cited in U.05.003 L01/L02 (self-awareness) and L06 (relationship skills, giving/receiving feedback) — both are among CASEL's five core competencies. URL re-verified live (2026-08-15): the 'Fundamentals of SEL' page defines SEL and its five core competencies (incl. relationship skills/listening) — on-topic for the lessons that cite it. Also cited in U.05.011 L01/L02 (values and responsible decision-making), L05 (social awareness and responsible decision-making), and L06/L07 (social awareness / comparing how decisions are made). Also cited across U.06.003 L01–L10 (Friendships, Empathy & Belonging) for relationship skills and social awareness — friendship change, conflict repair and I-statements, passive/aggressive/assertive communication, empathy, perspective-taking, belonging, cooperation, and fairness. Also cited in U.06.004 L04 (Disagreeing Respectfully) for the relationship-skills basis of 'acknowledge before you disagree' in civil discourse. Also cited across U.07.001 L01/L02/L03/L07/L08/L09 (Feelings, Identity & Purpose) for the self-awareness competency (precise labeling of mixed feelings), social awareness (cultural display rules), and responsible decision-making (reflecting on a past decision) — all three are among CASEL's five core competencies, used as classroom framing, not as claim-level citations. Also cited across U.07.003 L05/L06/L07/L09 (Relationships, Empathy & Conflict) for social awareness and perspective-taking, empathy across difference, and belonging — all within CASEL's five core competencies, used as classroom framing."

  - id: S-002
    title: NASA — The Big Bang
    type: website
    url: https://science.nasa.gov/universe/the-big-bang/
    organization: NASA
    domains: [D06]
    reviewed: true
    notes: Age-appropriate origin story referenced in the D06 exemplar. Cosmic-history overview; cites cosmic microwave background (oldest observable light) and first stars as evidence.

  - id: S-003
    title: World Health Organization
    type: website
    url: https://www.who.int/
    organization: WHO
    domains: [D03, D10]
    reviewed: true
    notes: Global health reference for Body & Wellness. URL verified live (2026-08-15) — official WHO homepage, on-topic for D03 body-signals/hunger/thirst/tiredness lessons (U.01.002 L03–L05) which cite it as a general wellbeing reference. General authority, not a page-level citation for any single claim.

  - id: S-004
    title: UNESCO — Education for Sustainable Development
    type: website
    url: https://www.unesco.org/en/sustainable-development/education
    organization: UNESCO
    domains: [D08, D10]
    reviewed: true
    notes: "Cited in U.01.011 L09 (Earth Care in Practice) as a general frame for the idea that caring for the Earth and for other people is one everyday practice. URL re-verified live (2026-08-15): UNESCO's ESD page defines ESD as empowering people with the knowledge, skills, values, attitudes and behaviours to live in a way that is good for the environment, economy and society — on-topic for the lesson's stewardship framing (a value frame, not a factual claim)."

  - id: S-005
    title: Intergovernmental Panel on Climate Change
    type: website
    url: https://www.ipcc.ch/
    organization: IPCC
    domains: [D06, D10]
    reviewed: true
    notes: "Authoritative climate science for Environment content. Cited in U.07.006 L11 (the climate system — Sun + atmosphere + ocean + land — and the greenhouse effect) and L12 (ice-core records of past atmosphere, e.g., Vostok and Greenland cores). The IPCC is the authoritative intergovernmental body summarizing climate-system science and paleoclimate reconstructions from ice cores; on-topic for both lessons. Global and intergovernmental by design. URL verified live (2026-08-18)."

  - id: S-006
    title: Our World in Data
    type: website
    url: https://ourworldindata.org/
    organization: Global Change Data Lab (University of Oxford)
    domains: [D05, D08, D09]
    reviewed: false
    notes: Global, open data for history, civic life, and reasoning.

  - id: S-007
    title: Bloom (1984) — The 2 Sigma Problem
    type: article
    url: https://en.wikipedia.org/wiki/Bloom%27s_2_sigma_problem
    organization: Educational Researcher
    year: 1984
    domains: []
    reviewed: true
    notes: One-to-one tutoring ≈2 SD above group instruction; mastery learning/feedback-corrective ≈1.0, cooperative learning ≈0.8, classroom participation ≈1.0 (Bloom's reported effect sizes).

  - id: S-008
    title: Escuela Nueva — multi-grade, self-paced rural schooling
    type: website
    url: https://en.wikipedia.org/wiki/Escuela_Nueva
    organization: Fundación Escuela Nueva (Vicky Colbert)
    year: 1975
    domains: []
    reviewed: true
    notes: Founded mid-1970s by Vicky Colbert (co-founders Beryl Levinger, Oscar Mogollón). One-room multi-grade rural schools using self-paced learning guides; ~20,000 in Colombia, adopted in 19 countries. A 1990s UNESCO report found Colombia was the only South American country where poor rural schools outperformed city schools.

  - id: S-009
    title: Pratham — Teaching at the Right Level (TaRL)
    type: website
    url: https://www.pratham.org/about/teaching-at-the-right-level/
    organization: Pratham
    domains: [D04, D05]
    reviewed: true
    notes: Group learners by assessed level, not age/grade; six J-PAL randomized evaluations across seven Indian states found large learning gains; GEEAP/World Bank "Good Buy" for low- and middle-income contexts.

  - id: S-010
    title: Class-size reduction — Project STAR
    type: website
    url: https://en.wikipedia.org/wiki/Class-size_reduction
    organization: Wikipedia (Project STAR, Tennessee)
    year: 1985
    domains: []
    reviewed: true
    notes: Randomized K-3 (small 13–17 vs regular 22–25); gains about doubled for minority students (two to three times for low-income learners/children of color). CONTESTED — a 2025 meta-analysis (Opatrny et al., 66 studies / 2,819 estimates) finds effects negligible outside STAR-like designs and classes under ~15.

  - id: S-011
    title: Kirschner, Sweller & Clark (2006) — Why Minimal Guidance Does Not Work
    type: article
    url: https://doi.org/10.1207/s15326985ep4102_1
    organization: Educational Psychologist
    year: 2006
    domains: []
    reviewed: true
    notes: "Novices learn foundational material better with explicit instruction, worked examples, and guided practice than with minimal guidance. Full title: 'Why Minimal Guidance During Instruction Does Not Work: An Analysis of the Failure of Constructivist, Discovery, Problem-Based, Experiential, and Inquiry-Based Teaching' (Educational Psychologist 41(2), 75–86; DOI 10.1207/s15326985ep4102_1 verified). Cited in U.02.007 L01/L03/L05–L09 to justify 'model once, then guided practice' for skills (mixing, echoing patterns, movement sequences, leading/following, planning, comparing two ways) — consistent with philosophy §13. Also cited in U.03.007 L01–L04 and L06–L09 (patterns, mood, long/short sounds, tempo/dynamics/pitch, movement retelling, design loop, materials comparison, sound+motion) to justify 'model once, then guided practice' for arts/making skills. On-topic: the citation supports explicit modeling + guided practice over pure discovery, not any specific art claim. Also cited in U.05.011 L01/L02/L05/L08/L09 to justify 'model once, then guided practice' for reasoning and mediation skills. Also cited across U.06.003 L01–L10 (Friendships, Empathy & Belonging) to justify 'model once, then guided practice' for social-emotional skills (conflict repair, assertion, perspective-taking, cooperation). Also cited across U.06.004 L01–L12 (Reading, Writing, Argument & Many Languages) to justify 'model once, then guided practice' for listening, discussion, argument-writing, revision, and formatting skills. Also cited across U.07.001 L01–L10 (Feelings, Identity & Purpose) to justify 'model once, then guided practice' for the both/and sentence, the word-ladder, the display-rule sort, the then/now map, the decision loop, and the routine wheel. Also cited across U.07.003 L01–L10 (Relationships, Empathy & Conflict) to justify 'model once, then guided practice' for boundary-setting, repair conversation, perspective-taking, and mutual-aid planning skills. Also cited across U.07.007 L01–L08 (Making, Performing & Designing) to justify 'model once, then guided practice' for message-mapping, framing/emphasis, sound analysis, performance tools, gesture reading, scene devising, accessibility testing, and trade-off weighing."

  - id: S-012
    title: Hattie — Visible Learning (relationships, feedback, class size)
    type: book
    url: https://en.wikipedia.org/wiki/John_Hattie
    organization: Routledge
    year: 2008
    domains: []
    reviewed: true
    notes: Synthesis of 815 meta-analyses (800+); teacher-student relationships (d≈0.72) and feedback (d≈0.73) among the largest influences, class size among the weakest. Effect-size methodology has been criticized (miscategorized studies; some statistics reported incorrectly).

  - id: S-013
    title: Mitra — Hole in the Wall / Self-Organized Learning Environments (SOLE)
    type: website
    url: https://en.wikipedia.org/wiki/Minimally_invasive_education
    organization: Sugata Mitra
    year: 1999
    domains: []
    reviewed: true
    notes: Children can self-organize learning around big questions. CONTESTED — original durability claims overclaimed; treat as a structure, not proof.

  - id: S-014
    title: Montessori education — mixed-age, self-directed
    type: website
    url: https://en.wikipedia.org/wiki/Montessori_education
    organization: Montessori
    year: 1907
    domains: []
    reviewed: true
    notes: Mixed-age (3-year) classrooms, self-directed learning, prepared environment; global practice for over a century.

  - id: S-015
    title: RULER Approach — Yale Center for Emotional Intelligence
    type: website
    url: https://www.rulerapproach.org/
    organization: Yale Center for Emotional Intelligence
    domains: [D01]
    reviewed: true
    notes: Evidence-based SEL approach (Recognizing, Understanding, Labeling, Expressing, Regulating emotions); cited in L.00.001.05 and in U.07.001 L01/L02/L03 (Holding Two Feelings at Once; The Precise Words for the Mix; Feelings Shown, Hidden, and Valued) for the labeling-emotions-with-precision skill. Also cited in U.07.003 L09 (When a Community Changes) for holding 'both/and' mixed, co-occurring feelings (RULER's emotional-complexity/mixed-feelings framing).

  - id: S-016
    title: WHO — Hand hygiene (infection prevention and control)
    type: website
    url: https://www.who.int/teams/integrated-health-services/infection-prevention-control/hand-hygiene
    organization: World Health Organization
    domains: [D03]
    reviewed: true
    notes: "Cited in L.00.002.07 (handwashing). WHO hand-hygiene guidance — soap and water remove germs; supports a ~20-second scrub and handwashing at key moments (before eating, after toilet, etc.)."

  - id: S-017
    title: WHO — Oral health fact sheet
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/oral-health
    organization: World Health Organization
    year: 2025
    domains: [D03]
    reviewed: true
    notes: "Cited in L.00.002.08 (brushing teeth). WHO recommends twice-daily brushing with fluoride toothpaste (1000–1500 ppm); supports morning/night brushing and fluoride toothpaste."

  - id: S-018
    title: NASA Space Place — What Is the Big Bang?
    type: website
    url: https://spaceplace.nasa.gov/big-bang/
    organization: NASA
    domains: [D06]
    reviewed: true
    notes: "Cited in L.00.003.02 (Big Bang told as the 'Everywhere Stretch'). Child-friendly NASA page: universe began as a single point, then expanded and stretched (Lemaître 1927); galaxies receding (Hubble) is the evidence it is still expanding; hot particles cooled and grouped into atoms, then stars and galaxies; universe ~13.8 billion years old."

  - id: S-019
    title: UNESCO — International Mother Language Day
    type: website
    url: https://www.unesco.org/en/days/mother-language
    organization: UNESCO
    domains: [D04]
    reviewed: true
    notes: "Cited in U.00.005 L12/L13 (home-language greetings; 'many languages are treasures') and U.03.004 L13–L15 (multilingualism as wealth; every language a bearer of dignity; no spoken or signed language above another). Page states verbatim: 'Globally 40 per cent of the population does not have access to an education in a language they speak or understand.' Supports the 40% claim and the value of every learner's home language; the U.03.004 lessons cite it for the mother-tongue/multilingual-education value, held as a value/commitment, not a factual statistic. Also cited in U.06.004 L14 (Across a Language Difference) for UNESCO's multilingual-education guidance as the frame for treating 'not sharing a language' as ordinary, never a failure."

  - id: S-020
    title: "Clements & Sarama — Learning and Teaching Early Math: The Learning Trajectories Approach"
    type: book
    author: Douglas H. Clements & Julie Sarama
    organization: Routledge
    year: 2014
    domains: [D05]
    reviewed: true
    notes: "2nd ed., Routledge, 2014 (ISBN 9780415828505). Cited in U.00.006 L01–L03. The learning-trajectories framework for early math; its counting trajectory explicitly treats one-to-one correspondence, the verbal counting sequence, and cardinality (the last counting word names the quantity) as foundational skills."

  - id: S-021
    title: NASA Space Place — NASA Science for Kids (home)
    type: website
    url: https://spaceplace.nasa.gov/
    organization: NASA
    domains: [D06]
    reviewed: true
    notes: "Cited in L.00.009.02 (The Changing Sky) as a kid-friendly space/sky reference. Live homepage with Sun, Moon, Earth, Solar System, and Universe menus; includes Moon phases, skywatching tips, and Earth/Sun explainers. On-topic and authoritative for age-appropriate sky observation."

  - id: S-022
    title: International Institute for Restorative Practices (IIRP)
    type: website
    url: https://www.iirp.edu/
    organization: IIRP Graduate School (International Institute for Restorative Practices)
    domains: [D09]
    reviewed: true
    notes: "Cited in U.00.011 L07 (solving a small disagreement / making it right), U.01.010 L09 (making things right — repair, not punishment), and U.03.010 L09 (repairing harm, not only punishing — listen, take responsibility, make it right). IIRP Graduate School, Bethlehem, PA — the field's graduate school for restorative practices; frames responding to harm by repairing it and restoring relationships rather than only punishing. URL re-verified live (2026-08-15). Also cited in U.05.011 L09 (peer mediation — each side speaks, listens, repeats back, finds a fair solution both accept) and L10 (conflict as an opportunity to listen and repair rather than harm). Also cited in U.07.003 L03/L04 (Repair: Apologize, Listen, Agree; Practicing the Repair Conversation) for the modern restorative three-question frame (what happened / who was harmed / how do we make it right)."

  - id: S-023
    title: "Ifrah (2000) — The Universal History of Numbers"
    type: book
    author: Georges Ifrah
    organization: John Wiley & Sons
    year: 2000
    domains: [D05]
    reviewed: true
    notes: "Cited in U.01.005 L02 (reading/writing numbers). Standard, authoritative history of numeration; documents that the decimal positional system with zero and the ten glyphs 0–9 originated in India and reached the wider world through Arabic-speaking scholars, hence 'Hindu-Arabic numerals.' English translation published 2000 by Wiley. Supports the lesson's accurate, appropriately hedged claim that these digits are one system among many (tally marks, Inka quipu, etc.)."

  - id: S-024
    title: "Zaslavsky (1999) — Africa Counts: Number and Pattern in African Cultures"
    type: book
    author: Claudia Zaslavsky
    organization: Lawrence Hill Books
    year: 1999
    domains: [D05]
    reviewed: true
    notes: "Cited in U.01.005 L02, L07, L15 (numeral traditions; pattern in weaving/beading; cowrie shells as pre-coin exchange). 3rd ed. 1999, Lawrence Hill Books (1st ed. 1973). Documents African counting systems, tally/knot records, woven and beaded patterns, and cowrie-shell money across African cultures — on-topic for each claim it supports."

  - id: S-025
    title: "Carpenter, Fennema, Franke, Levi & Empson (2015) — Children's Mathematics: Cognitively Guided Instruction"
    type: book
    author: Thomas P. Carpenter, Elizabeth Fennema, Megan Loef Franke, Linda Levi, Susan B. Empson
    organization: Heinemann
    year: 2015
    domains: [D05]
    reviewed: true
    notes: "Cited in U.01.005 L04, L05, L06, L09 (join/separate problem types, counting strategies, missing-addend/missing-number problems). 2nd ed. 2015, Heinemann. The foundational CGI framework: children's informal joining/separating strategies underpin addition/subtraction, and children explaining their own strategies builds understanding — exactly what those lessons claim."

  - id: S-026
    title: "Van de Walle, Karp & Bay-Williams (2019) — Elementary and Middle School Mathematics: Teaching Developmentally"
    type: book
    author: John A. Van de Walle, Karen S. Karp, Jennifer M. Bay-Williams
    organization: Pearson
    year: 2019
    domains: [D05]
    reviewed: true
    notes: "Cited in U.01.005 L10, L11, L12, L14 (shape composition; 3-D attributes faces/edges/vertices; unit iteration and equal units; telling time to hour/half-hour). 10th ed. 2019, Pearson. Standard methods text for elementary/middle math; the cited topics (composing/decomposing shapes, non-standard measurement, grade-1 clock reading) are all covered there."

  - id: S-027
    title: "National Research Council (2009) — Mathematics Learning in Early Childhood: Paths Toward Excellence and Equity"
    type: report
    author: Committee on Early Childhood Mathematics (C. T. Cross, T. A. Woods, H. Schweingruber, eds.)
    organization: The National Academies Press
    year: 2009
    domains: [D05]
    reviewed: true
    notes: "Cited in U.01.005 L12, L13 (non-standard measurement / unit iteration; early data collection and representation with picture graphs) and U.03.005 L16 (scaled picture/bar graphs). Authoritative NRC consensus report on early math learning trajectories; both measurement topics appear in its recommendations for grades PreK–2. Data representation (collecting, organizing, and representing data with picture and bar graphs) is covered in the report's data-analysis trajectory. Note: the report's stated focus is early childhood (ages 3–8, PreK–2); the Grade-3 'scaling' skill (one symbol = two, five, or ten) is an extension that builds on — rather than appears page-for-page in — the report's data-representation trajectory, so the U.03.005 L16 citation is a general authority for the data trajectory, not a claim-level citation for the scale itself."

  - id: S-028
    title: "Davies (2002) — A History of Money: From Ancient Times to the Present Day"
    type: book
    author: Glyn Davies
    organization: University of Wales Press
    year: 2002
    domains: [D05]
    reviewed: true
    notes: "Cited in U.01.005 L15 (coins/buying a snack). 3rd ed. 2002, University of Wales Press (1st ed. 1994). Standard economic history covering the origins and variety of money, including commodity money (cacao beans in Mesoamerica, salt, cowrie shells, beads) — supports the lesson's claim that people have used many forms of exchange besides coins."

  - id: S-029
    title: BBC Bitesize (KS1) — What is day and night?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zkvv4wx/articles/zyfhxbk
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.01.006 L08 (day/night from Earth's rotation) and L09 (seasons). URL verified live (2026-08-15). States: the Sun is the star at the centre of our solar system; Earth and the planets orbit it and rotate; the Sun shines on only half of Earth at once; as Earth rotates some places face the Sun (daytime) and others face away (night-time). Also covers seasons (Earth's tilt), daylight hours, and that north of the Arctic Circle the Sun does not set in summer — no geocentrism."

  - id: S-030
    title: NASA Space Place — What Causes the Seasons?
    type: website
    url: https://spaceplace.nasa.gov/seasons/en/
    organization: NASA
    domains: [D06]
    reviewed: true
    notes: "Cited in U.01.006 L08 (day/night) and L09 (seasons). URL verified live (2026-08-15). States verbatim: 'Earth spins around this pole, making one complete turn each day. That is why we have day and night' — directly supports the no-geocentrism claim. Explains Earth's tilted axis causes the seasons, with opposite seasons in the two hemispheres."

  - id: S-031
    title: BBC Bitesize (KS1) — What are the senses?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/z6882hv/articles/zsbntrd
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.01.006 L01 (five senses). URL verified live (2026-08-15). States we have five main senses — hearing, sight, smell, taste, and touch — and that our senses help us learn about the world around us."

  - id: S-032
    title: BBC Bitesize (KS1) — What do animals need to survive?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/z6882hv/articles/zx38wmn
    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.01.006 L04 (living things need food/water/air/shelter). URL verified live (2026-08-15). States verbatim: 'Animals need air, water, shelter and food to survive'; also notes fish use gills to get oxygen and animals find shelter in shells or burrows."

  - id: S-033
    title: BBC Bitesize (KS1) — What does a plant need to grow?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zpxnyrd/articles/zkp2jsg
    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.01.006 L04 (plant needs). URL verified live (2026-08-15). States plants need water, light, the right temperature, air, and time; plants use light to make food inside their leaves, take up water through their roots, and obtain most nutrients from the soil."

  - id: S-034
    title: BBC Bitesize (KS1) — How can I sort objects into dead, living and non-living?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zx882hv/articles/zfhfn9q
    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.01.006 L05 (living vs nonliving). URL verified live (2026-08-15). Living things react to surroundings, need air, feed, grow, reproduce, and get rid of waste; all living things (plants and animals) can move; non-living things have never been alive (water, rocks, weather, fire, metal) and do not need food, water, or air — consistent with the lesson's 'grow, move, reproduce' clues and its hedges (some non-living things like wind/water also move)."

  - id: S-035
    title: BBC Bitesize (KS1) — Describing materials
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zrssgk7/articles/zvpysk7
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.01.006 L06 (material properties). URL verified live (2026-08-15). Materials have properties (soft, hard, shiny) that describe how they look, feel, and behave; we select the right material for each job based on its properties."

  - id: S-036
    title: BBC Bitesize (KS2) — Friction
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/znmmn39/articles/zcmwkty
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.01.006 L07 (push/pull and what stops motion). URL verified live (2026-08-15) via the BBC Bitesize KS2 Science index (Forces section). Explains friction as the force that differs by surface and acts on objects moving across it — supports the lesson's note that friction (the ground rubbing) is the reason most moving things stop."

  - id: S-037
    title: BBC Bitesize (KS2) — Moving on different surfaces
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/znmmn39/articles/zqxnhcw
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.01.006 L07 (how objects move). URL verified live (2026-08-15) via the BBC Bitesize KS2 Science index (Forces section). Explains that objects move differently depending on the surface they are on — supports the lesson's rolling/sliding and 'what makes it stop' exploration."

  - id: S-038
    title: WHO — Healthy diet fact sheet
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/healthy-diet
    organization: World Health Organization
    year: 2026
    domains: [D03]
    reviewed: true
    notes: "Cited in U.01.008 L03 (food gives the body energy to grow, play, and learn), and in U.05.009 L01/L04/L08 (carbohydrates as primary energy; proteins as building blocks; advice to limit free sugars, salt/sodium, and saturated fat). URL verified live (2026-08-15 and 2026-08-17); page updated 26 Jan 2026. States 'Carbohydrates provide the primary energy source for the body' and frames protein as the building blocks for body structure/growth — supports the lesson's basic-biology claim that food gives the body energy to grow, play, and learn. Also supports the global/variety framing (diversity across food groups as one of four core principles). Explicitly advises limiting free sugars to <10% of energy, salt to <5 g/day, and saturated fat to <10% of energy — directly supporting U.05.009 L04's 'too much over time' claims (added sugar → tooth decay/energy, salt → blood pressure, saturated fat → vessel build-up). Also cited in U.07.008 L03/L04 (Food Marketing: Claims vs. Evidence) as the nutrition authority alongside the WHO marketing-to-children recommendations (S-312) — the lessons evaluate claims against evidence, not any person's food."

  - id: S-039
    title: "Dunlosky, Rawson, Marsh, Nathan & Willingham (2013) — Improving Students' Learning With Effective Learning Techniques"
    type: article
    author: John Dunlosky, Katherine A. Rawson, Elizabeth J. Marsh, Mitchell J. Nathan, Daniel T. Willingham
    organization: Psychological Science in the Public Interest
    year: 2013
    url: https://doi.org/10.1177/1529100612453266
    domains: []
    reviewed: true
    notes: "Cited in U.01.009 L10 (unit capstone described as a retrieval-practice/spacing 'science-of-learning payoff'). Real, well-known consensus review (14(1), 4–58). DOI verified live (2026-08-15). Identifies practice testing (retrieval practice) and distributed practice (spacing) as the two highest-utility learning techniques — supports the lesson's claim that recalling the unit's ideas across the unit (spaced retrieval) is evidence-backed. Also cited in U.05.011 L10 (spaced, interleaved capstone review across the unit's four strands), and in U.07.001 L09/L10 (reflection deepening judgment via retrieval/spacing; the unit-closing retrieval pass)."

  - id: S-040
    title: "National Reading Panel (2000) — Teaching Children to Read: An Evidence-Based Assessment"
    type: report
    author: National Reading Panel (NICHD)
    organization: National Institute of Child Health and Human Development (NICHD), National Institutes of Health
    year: 2000
    url: https://www.nichd.nih.gov/research/supported/nrp
    domains: [D04]
    reviewed: true
    notes: "Cited in U.02.004 L05 (fluency via repeated/guided oral reading), L06–L09 (comprehension via question answering and question generation); and U.03.004 L04 (accuracy via systematic/explicit sound–symbol instruction), L05 (fluency via re-reading/guided oral reading), L06 (comprehension monitoring/self-correction), L07–L08 (main idea and supporting details). Real, landmark US report. URL verified live (2026-08-16): NICHD hosts the panel page (marked 'Historical/For Reference Only'). NRP identified five components of reading — phonemic awareness, phonics, fluency, vocabulary, comprehension — and found guided repeated oral reading improves fluency and that question answering, question generation, comprehension monitoring, and summarization (which includes identifying main ideas and supporting details) are among the comprehension strategies with a solid research base. On-topic for each lesson that cites it. US-centric source; treated as one widely used evidence base among others, not the only tradition. Also cited in U.06.004 L07/L08 for read-aloud as supporting fluency and enjoyment in reading fiction, poetry, nonfiction, and drama."

  - id: S-041
    title: BBC Bitesize (KS1) — Working scientifically
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/z8q9pbk
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.02.006 L01 (wonder→prediction) and L02 (test it and record the result). URL verified live (2026-08-16). KS1 'Working scientifically' topic lists three guides — 'Why do scientists ask questions?', 'What is science?' (test ideas and predict outcomes), and 'How do scientists record and represent their findings?' — on-topic for the unit's ask/predict/test/record skills at Grade 2. (Corrected from the earlier KS3 topic zsg6m39, which was mislabeled as KS2.)"

  - id: S-042
    title: BBC Bitesize (KS1) — Everyday materials
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zrssgk7
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.02.006 L03 (sort/group by features) and L06 (material properties → jobs). URL verified live (2026-08-16). KS1 'Everyday materials' topic contains 'Objects and materials' (choose the right material to make things) and 'Describing materials' (describe materials and their properties) — on-topic for both lessons' grouping-by-property and property-to-job claims. (Corrected from a 404 topic z9prd2p.)"

  - id: S-043
    title: BBC Bitesize (KS1) — What is the life cycle of a plant?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zpxnyrd/articles/z2vdjxs
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.02.006 L04 (seed→sprout→seedling→flower→fruit→seed). URL verified live (2026-08-16). States: seeds grow roots and shoots, then leaves above ground; many plants make flowers which turn into fruits; flowers and fruits make their own seeds — 'We call this a life cycle.' On-topic and consistent with the lesson's stage order."

  - id: S-044
    title: BBC Bitesize (KS1) — Living things and their habitats
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zx882hv
    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.02.006 L05 (habitat = home: food, water, shelter). URL verified live (2026-08-16). KS1 'Living things and their habitats' topic includes 'What is a habitat?' plus woodland/coastal/desert/ocean/polar/pond/rainforest/urban habitats and food chains — on-topic for the lesson's many-biomes framing (pond, forest, desert, seashore, meadow)."

  - id: S-045
    title: BBC Bitesize (KS2) — Sound (How are sounds made?)
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zgffr82
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.02.006 L07 (sound comes from vibration). URL verified live (2026-08-16). KS2 'Sound' topic lists 'How are sounds made?' plus pitch, volume, and how sounds are detected — supports the lesson's core claim that sound is made when things vibrate and that we hear it with our ears. (Lesson title corrected to match the actual guide.)"

  - id: S-046
    title: BBC Bitesize (KS2) — Rocks (What is soil made from?)
    type: website
