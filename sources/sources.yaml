  - id: S-147
    title: "Slavin — Cooperative Learning"
    type: book
    organization: Allyn & Bacon
    year: 1995
    domains: [D09]
    reviewed: true
    notes: "Robert E. Slavin, Cooperative Learning: Theory, Research, and Practice (2nd ed., Allyn & Bacon, 1995). Cited in U.04.010 L06/L07 (Plan/Do Our Shared Project) as the research base for cooperative-learning structures that divide work fairly. Real, seminal work in cooperative learning. No URL (print book). Also cited in U.05.011 L08 (cooperative learning / collective action research base). Also cited in U.06.002 L05 (Sharing Roles on a Team) and L07 (Skill and Teamwork Together) for the claim that cooperative learning assigning roles with individual accountability is a well-evidenced classroom structure — Slavin's cooperative-learning model (individual accountability + group rewards/roles) directly supports this; it replaced an earlier, unverifiable 'J-PAL review of cooperative strategies' citation (J-PAL has no such review; its education policy insights cover tailoring instruction and socioemotional skills, not cooperative learning per se). Also cited in U.06.003 L09 (Cooperation vs Competition) for cooperative learning improving achievement and relationships, alongside Johnson & Johnson (S-233). Also cited in U.07.003 L10 (Mutual Aid: Why We Help) for the research base that cooperative structures help groups thrive."

