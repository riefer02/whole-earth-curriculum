# Canonical source registry. Owned by the fact-checker agent.
# `reviewed` is true only after the fact-checker has verified the source.

sources:
  - id: S-001
    title: CASEL — Fundamentals of Social and Emotional Learning
    type: website
    url: https://casel.org/fundamentals-of-sel/
    organization: CASEL (Collaborative for Academic, Social, and Emotional Learning)
    domains: [D01, D02, D04, D09]
    reviewed: true
    notes: "Framework for the SEL competencies referenced in D01 exemplars; also cited in D04 language/listening lessons (U.00.005 L01/L02/L04; U.01.004 L01) and in D09 kindness/caring (U.00.011 L01). Also cited in D09 fairness/shared rules (U.01.010 L01) for the responsible decision-making competency, and in U.03.010 L01/L05/L06/L07/L08/L10 (responsible decision-making, relationship skills, social awareness, and self-management — all five competencies are real CASEL competencies). URL re-verified live (2026-08-15): the 'Fundamentals of SEL' page defines SEL and its five core competencies (incl. relationship skills/listening) — on-topic for the lessons that cite it."

  - id: S-002
    title: NASA — The Big Bang
    type: website
    url: https://science.nasa.gov/universe/the-big-bang/
    organization: NASA
    domains: [D06]
    reviewed: true
    notes: Age-appropriate origin story referenced in the D06 exemplar. Cosmic-history overview; cites cosmic microwave background (oldest observable light) and first stars as evidence.

  - id: S-003
    title: World Health Organization
    type: website
    url: https://www.who.int/
    organization: WHO
    domains: [D03, D10]
    reviewed: true
    notes: Global health reference for Body & Wellness. URL verified live (2026-08-15) — official WHO homepage, on-topic for D03 body-signals/hunger/thirst/tiredness lessons (U.01.002 L03–L05) which cite it as a general wellbeing reference. General authority, not a page-level citation for any single claim.

  - id: S-004
    title: UNESCO — Education for Sustainable Development
    type: website
    url: https://www.unesco.org/en/sustainable-development/education
    organization: UNESCO
    domains: [D08, D10]
    reviewed: true
    notes: "Cited in U.01.011 L09 (Earth Care in Practice) as a general frame for the idea that caring for the Earth and for other people is one everyday practice. URL re-verified live (2026-08-15): UNESCO's ESD page defines ESD as empowering people with the knowledge, skills, values, attitudes and behaviours to live in a way that is good for the environment, economy and society — on-topic for the lesson's stewardship framing (a value frame, not a factual claim)."

  - id: S-005
    title: Intergovernmental Panel on Climate Change
    type: website
    url: https://www.ipcc.ch/
    organization: IPCC
    domains: [D06, D10]
    reviewed: false
    notes: Authoritative climate science for Environment content.

  - id: S-006
    title: Our World in Data
    type: website
    url: https://ourworldindata.org/
    organization: Global Change Data Lab (University of Oxford)
    domains: [D05, D08, D09]
    reviewed: false
    notes: Global, open data for history, civic life, and reasoning.

  - id: S-007
    title: Bloom (1984) — The 2 Sigma Problem
    type: article
    url: https://en.wikipedia.org/wiki/Bloom%27s_2_sigma_problem
    organization: Educational Researcher
    year: 1984
    domains: []
    reviewed: true
    notes: One-to-one tutoring ≈2 SD above group instruction; mastery learning/feedback-corrective ≈1.0, cooperative learning ≈0.8, classroom participation ≈1.0 (Bloom's reported effect sizes).

  - id: S-008
    title: Escuela Nueva — multi-grade, self-paced rural schooling
    type: website
    url: https://en.wikipedia.org/wiki/Escuela_Nueva
    organization: Fundación Escuela Nueva (Vicky Colbert)
    year: 1975
    domains: []
    reviewed: true
    notes: Founded mid-1970s by Vicky Colbert (co-founders Beryl Levinger, Oscar Mogollón). One-room multi-grade rural schools using self-paced learning guides; ~20,000 in Colombia, adopted in 19 countries. A 1990s UNESCO report found Colombia was the only South American country where poor rural schools outperformed city schools.

  - id: S-009
    title: Pratham — Teaching at the Right Level (TaRL)
    type: website
    url: https://www.pratham.org/about/teaching-at-the-right-level/
    organization: Pratham
    domains: [D04, D05]
    reviewed: true
    notes: Group learners by assessed level, not age/grade; six J-PAL randomized evaluations across seven Indian states found large learning gains; GEEAP/World Bank "Good Buy" for low- and middle-income contexts.

  - id: S-010
    title: Class-size reduction — Project STAR
    type: website
    url: https://en.wikipedia.org/wiki/Class-size_reduction
    organization: Wikipedia (Project STAR, Tennessee)
    year: 1985
    domains: []
    reviewed: true
    notes: Randomized K-3 (small 13–17 vs regular 22–25); gains about doubled for minority students (two to three times for low-income learners/children of color). CONTESTED — a 2025 meta-analysis (Opatrny et al., 66 studies / 2,819 estimates) finds effects negligible outside STAR-like designs and classes under ~15.

  - id: S-011
    title: Kirschner, Sweller & Clark (2006) — Why Minimal Guidance Does Not Work
    type: article
    url: https://doi.org/10.1207/s15326985ep4102_1
    organization: Educational Psychologist
    year: 2006
    domains: []
    reviewed: true
    notes: "Novices learn foundational material better with explicit instruction, worked examples, and guided practice than with minimal guidance. Full title: 'Why Minimal Guidance During Instruction Does Not Work: An Analysis of the Failure of Constructivist, Discovery, Problem-Based, Experiential, and Inquiry-Based Teaching' (Educational Psychologist 41(2), 75–86; DOI 10.1207/s15326985ep4102_1 verified). Cited in U.02.007 L01/L03/L05–L09 to justify 'model once, then guided practice' for skills (mixing, echoing patterns, movement sequences, leading/following, planning, comparing two ways) — consistent with philosophy §13. Also cited in U.03.007 L01–L04 and L06–L09 (patterns, mood, long/short sounds, tempo/dynamics/pitch, movement retelling, design loop, materials comparison, sound+motion) to justify 'model once, then guided practice' for arts/making skills. On-topic: the citation supports explicit modeling + guided practice over pure discovery, not any specific art claim."

  - id: S-012
    title: Hattie — Visible Learning (relationships, feedback, class size)
    type: book
    url: https://en.wikipedia.org/wiki/John_Hattie
    organization: Routledge
    year: 2008
    domains: []
    reviewed: true
    notes: Synthesis of 815 meta-analyses (800+); teacher-student relationships (d≈0.72) and feedback (d≈0.73) among the largest influences, class size among the weakest. Effect-size methodology has been criticized (miscategorized studies; some statistics reported incorrectly).

  - id: S-013
    title: Mitra — Hole in the Wall / Self-Organized Learning Environments (SOLE)
    type: website
    url: https://en.wikipedia.org/wiki/Minimally_invasive_education
    organization: Sugata Mitra
    year: 1999
    domains: []
    reviewed: true
    notes: Children can self-organize learning around big questions. CONTESTED — original durability claims overclaimed; treat as a structure, not proof.

  - id: S-014
    title: Montessori education — mixed-age, self-directed
    type: website
    url: https://en.wikipedia.org/wiki/Montessori_education
    organization: Montessori
    year: 1907
    domains: []
    reviewed: true
    notes: Mixed-age (3-year) classrooms, self-directed learning, prepared environment; global practice for over a century.

  - id: S-015
    title: RULER Approach — Yale Center for Emotional Intelligence
    type: website
    url: https://www.rulerapproach.org/
    organization: Yale Center for Emotional Intelligence
    domains: [D01]
    reviewed: true
    notes: Evidence-based SEL approach (Recognizing, Understanding, Labeling, Expressing, Regulating emotions); cited in L.00.001.05.

  - id: S-016
    title: WHO — Hand hygiene (infection prevention and control)
    type: website
    url: https://www.who.int/teams/integrated-health-services/infection-prevention-control/hand-hygiene
    organization: World Health Organization
    domains: [D03]
    reviewed: true
    notes: "Cited in L.00.002.07 (handwashing). WHO hand-hygiene guidance — soap and water remove germs; supports a ~20-second scrub and handwashing at key moments (before eating, after toilet, etc.)."

  - id: S-017
    title: WHO — Oral health fact sheet
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/oral-health
    organization: World Health Organization
    year: 2025
    domains: [D03]
    reviewed: true
    notes: "Cited in L.00.002.08 (brushing teeth). WHO recommends twice-daily brushing with fluoride toothpaste (1000–1500 ppm); supports morning/night brushing and fluoride toothpaste."

  - id: S-018
    title: NASA Space Place — What Is the Big Bang?
    type: website
    url: https://spaceplace.nasa.gov/big-bang/
    organization: NASA
    domains: [D06]
    reviewed: true
    notes: "Cited in L.00.003.02 (Big Bang told as the 'Everywhere Stretch'). Child-friendly NASA page: universe began as a single point, then expanded and stretched (Lemaître 1927); galaxies receding (Hubble) is the evidence it is still expanding; hot particles cooled and grouped into atoms, then stars and galaxies; universe ~13.8 billion years old."

  - id: S-019
    title: UNESCO — International Mother Language Day
    type: website
    url: https://www.unesco.org/en/days/mother-language
    organization: UNESCO
    domains: [D04]
    reviewed: true
    notes: "Cited in U.00.005 L12/L13 (home-language greetings; 'many languages are treasures') and U.03.004 L13–L15 (multilingualism as wealth; every language a bearer of dignity; no spoken or signed language above another). Page states verbatim: 'Globally 40 per cent of the population does not have access to an education in a language they speak or understand.' Supports the 40% claim and the value of every learner's home language; the U.03.004 lessons cite it for the mother-tongue/multilingual-education value, held as a value/commitment, not a factual statistic."

  - id: S-020
    title: "Clements & Sarama — Learning and Teaching Early Math: The Learning Trajectories Approach"
    type: book
    author: Douglas H. Clements & Julie Sarama
    organization: Routledge
    year: 2014
    domains: [D05]
    reviewed: true
    notes: "2nd ed., Routledge, 2014 (ISBN 9780415828505). Cited in U.00.006 L01–L03. The learning-trajectories framework for early math; its counting trajectory explicitly treats one-to-one correspondence, the verbal counting sequence, and cardinality (the last counting word names the quantity) as foundational skills."

  - id: S-021
    title: NASA Space Place — NASA Science for Kids (home)
    type: website
    url: https://spaceplace.nasa.gov/
    organization: NASA
    domains: [D06]
    reviewed: true
    notes: "Cited in L.00.009.02 (The Changing Sky) as a kid-friendly space/sky reference. Live homepage with Sun, Moon, Earth, Solar System, and Universe menus; includes Moon phases, skywatching tips, and Earth/Sun explainers. On-topic and authoritative for age-appropriate sky observation."

  - id: S-022
    title: International Institute for Restorative Practices (IIRP)
    type: website
    url: https://www.iirp.edu/
    organization: IIRP Graduate School (International Institute for Restorative Practices)
    domains: [D09]
    reviewed: true
    notes: "Cited in U.00.011 L07 (solving a small disagreement / making it right), U.01.010 L09 (making things right — repair, not punishment), and U.03.010 L09 (repairing harm, not only punishing — listen, take responsibility, make it right). IIRP Graduate School, Bethlehem, PA — the field's graduate school for restorative practices; frames responding to harm by repairing it and restoring relationships rather than only punishing. URL re-verified live (2026-08-15)."

  - id: S-023
    title: "Ifrah (2000) — The Universal History of Numbers"
    type: book
    author: Georges Ifrah
    organization: John Wiley & Sons
    year: 2000
    domains: [D05]
    reviewed: true
    notes: "Cited in U.01.005 L02 (reading/writing numbers). Standard, authoritative history of numeration; documents that the decimal positional system with zero and the ten glyphs 0–9 originated in India and reached the wider world through Arabic-speaking scholars, hence 'Hindu-Arabic numerals.' English translation published 2000 by Wiley. Supports the lesson's accurate, appropriately hedged claim that these digits are one system among many (tally marks, Inka quipu, etc.)."

  - id: S-024
    title: "Zaslavsky (1999) — Africa Counts: Number and Pattern in African Cultures"
    type: book
    author: Claudia Zaslavsky
    organization: Lawrence Hill Books
    year: 1999
    domains: [D05]
    reviewed: true
    notes: "Cited in U.01.005 L02, L07, L15 (numeral traditions; pattern in weaving/beading; cowrie shells as pre-coin exchange). 3rd ed. 1999, Lawrence Hill Books (1st ed. 1973). Documents African counting systems, tally/knot records, woven and beaded patterns, and cowrie-shell money across African cultures — on-topic for each claim it supports."

  - id: S-025
    title: "Carpenter, Fennema, Franke, Levi & Empson (2015) — Children's Mathematics: Cognitively Guided Instruction"
    type: book
    author: Thomas P. Carpenter, Elizabeth Fennema, Megan Loef Franke, Linda Levi, Susan B. Empson
    organization: Heinemann
    year: 2015
    domains: [D05]
    reviewed: true
    notes: "Cited in U.01.005 L04, L05, L06, L09 (join/separate problem types, counting strategies, missing-addend/missing-number problems). 2nd ed. 2015, Heinemann. The foundational CGI framework: children's informal joining/separating strategies underpin addition/subtraction, and children explaining their own strategies builds understanding — exactly what those lessons claim."

  - id: S-026
    title: "Van de Walle, Karp & Bay-Williams (2019) — Elementary and Middle School Mathematics: Teaching Developmentally"
    type: book
    author: John A. Van de Walle, Karen S. Karp, Jennifer M. Bay-Williams
    organization: Pearson
    year: 2019
    domains: [D05]
    reviewed: true
    notes: "Cited in U.01.005 L10, L11, L12, L14 (shape composition; 3-D attributes faces/edges/vertices; unit iteration and equal units; telling time to hour/half-hour). 10th ed. 2019, Pearson. Standard methods text for elementary/middle math; the cited topics (composing/decomposing shapes, non-standard measurement, grade-1 clock reading) are all covered there."

  - id: S-027
    title: "National Research Council (2009) — Mathematics Learning in Early Childhood: Paths Toward Excellence and Equity"
    type: report
    author: Committee on Early Childhood Mathematics (C. T. Cross, T. A. Woods, H. Schweingruber, eds.)
    organization: The National Academies Press
    year: 2009
    domains: [D05]
    reviewed: true
    notes: "Cited in U.01.005 L12, L13 (non-standard measurement / unit iteration; early data collection and representation with picture graphs) and U.03.005 L16 (scaled picture/bar graphs). Authoritative NRC consensus report on early math learning trajectories; both measurement topics appear in its recommendations for grades PreK–2. Data representation (collecting, organizing, and representing data with picture and bar graphs) is covered in the report's data-analysis trajectory. Note: the report's stated focus is early childhood (ages 3–8, PreK–2); the Grade-3 'scaling' skill (one symbol = two, five, or ten) is an extension that builds on — rather than appears page-for-page in — the report's data-representation trajectory, so the U.03.005 L16 citation is a general authority for the data trajectory, not a claim-level citation for the scale itself."

  - id: S-028
    title: "Davies (2002) — A History of Money: From Ancient Times to the Present Day"
    type: book
    author: Glyn Davies
    organization: University of Wales Press
    year: 2002
    domains: [D05]
    reviewed: true
    notes: "Cited in U.01.005 L15 (coins/buying a snack). 3rd ed. 2002, University of Wales Press (1st ed. 1994). Standard economic history covering the origins and variety of money, including commodity money (cacao beans in Mesoamerica, salt, cowrie shells, beads) — supports the lesson's claim that people have used many forms of exchange besides coins."

  - id: S-029
    title: BBC Bitesize (KS1) — What is day and night?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zkvv4wx/articles/zyfhxbk
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.01.006 L08 (day/night from Earth's rotation) and L09 (seasons). URL verified live (2026-08-15). States: the Sun is the star at the centre of our solar system; Earth and the planets orbit it and rotate; the Sun shines on only half of Earth at once; as Earth rotates some places face the Sun (daytime) and others face away (night-time). Also covers seasons (Earth's tilt), daylight hours, and that north of the Arctic Circle the Sun does not set in summer — no geocentrism."

  - id: S-030
    title: NASA Space Place — What Causes the Seasons?
    type: website
    url: https://spaceplace.nasa.gov/seasons/en/
    organization: NASA
    domains: [D06]
    reviewed: true
    notes: "Cited in U.01.006 L08 (day/night) and L09 (seasons). URL verified live (2026-08-15). States verbatim: 'Earth spins around this pole, making one complete turn each day. That is why we have day and night' — directly supports the no-geocentrism claim. Explains Earth's tilted axis causes the seasons, with opposite seasons in the two hemispheres."

  - id: S-031
    title: BBC Bitesize (KS1) — What are the senses?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/z6882hv/articles/zsbntrd
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.01.006 L01 (five senses). URL verified live (2026-08-15). States we have five main senses — hearing, sight, smell, taste, and touch — and that our senses help us learn about the world around us."

  - id: S-032
    title: BBC Bitesize (KS1) — What do animals need to survive?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/z6882hv/articles/zx38wmn
    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.01.006 L04 (living things need food/water/air/shelter). URL verified live (2026-08-15). States verbatim: 'Animals need air, water, shelter and food to survive'; also notes fish use gills to get oxygen and animals find shelter in shells or burrows."

  - id: S-033
    title: BBC Bitesize (KS1) — What does a plant need to grow?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zpxnyrd/articles/zkp2jsg
    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.01.006 L04 (plant needs). URL verified live (2026-08-15). States plants need water, light, the right temperature, air, and time; plants use light to make food inside their leaves, take up water through their roots, and obtain most nutrients from the soil."

  - id: S-034
    title: BBC Bitesize (KS1) — How can I sort objects into dead, living and non-living?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zx882hv/articles/zfhfn9q
    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.01.006 L05 (living vs nonliving). URL verified live (2026-08-15). Living things react to surroundings, need air, feed, grow, reproduce, and get rid of waste; all living things (plants and animals) can move; non-living things have never been alive (water, rocks, weather, fire, metal) and do not need food, water, or air — consistent with the lesson's 'grow, move, reproduce' clues and its hedges (some non-living things like wind/water also move)."

  - id: S-035
    title: BBC Bitesize (KS1) — Describing materials
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zrssgk7/articles/zvpysk7
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.01.006 L06 (material properties). URL verified live (2026-08-15). Materials have properties (soft, hard, shiny) that describe how they look, feel, and behave; we select the right material for each job based on its properties."

  - id: S-036
    title: BBC Bitesize (KS2) — Friction
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/znmmn39/articles/zcmwkty
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.01.006 L07 (push/pull and what stops motion). URL verified live (2026-08-15) via the BBC Bitesize KS2 Science index (Forces section). Explains friction as the force that differs by surface and acts on objects moving across it — supports the lesson's note that friction (the ground rubbing) is the reason most moving things stop."

  - id: S-037
    title: BBC Bitesize (KS2) — Moving on different surfaces
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/znmmn39/articles/zqxnhcw
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.01.006 L07 (how objects move). URL verified live (2026-08-15) via the BBC Bitesize KS2 Science index (Forces section). Explains that objects move differently depending on the surface they are on — supports the lesson's rolling/sliding and 'what makes it stop' exploration."

  - id: S-038
    title: WHO — Healthy diet fact sheet
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/healthy-diet
    organization: World Health Organization
    year: 2026
    domains: [D03]
    reviewed: true
    notes: "Cited in U.01.008 L03 (food gives the body energy to grow, play, and learn). URL verified live (2026-08-15); page updated 26 Jan 2026. States 'Carbohydrates provide the primary energy source for the body' and frames protein as the building blocks for body structure/growth — supports the lesson's basic-biology claim that food gives the body energy to grow, play, and learn. Also supports the global/variety framing (diversity across food groups as one of four core principles)."

  - id: S-039
    title: "Dunlosky, Rawson, Marsh, Nathan & Willingham (2013) — Improving Students' Learning With Effective Learning Techniques"
    type: article
    author: John Dunlosky, Katherine A. Rawson, Elizabeth J. Marsh, Mitchell J. Nathan, Daniel T. Willingham
    organization: Psychological Science in the Public Interest
    year: 2013
    url: https://doi.org/10.1177/1529100612453266
    domains: []
    reviewed: true
    notes: "Cited in U.01.009 L10 (unit capstone described as a retrieval-practice/spacing 'science-of-learning payoff'). Real, well-known consensus review (14(1), 4–58). DOI verified live (2026-08-15). Identifies practice testing (retrieval practice) and distributed practice (spacing) as the two highest-utility learning techniques — supports the lesson's claim that recalling the unit's ideas across the unit (spaced retrieval) is evidence-backed."

  - id: S-040
    title: "National Reading Panel (2000) — Teaching Children to Read: An Evidence-Based Assessment"
    type: report
    author: National Reading Panel (NICHD)
    organization: National Institute of Child Health and Human Development (NICHD), National Institutes of Health
    year: 2000
    url: https://www.nichd.nih.gov/research/supported/nrp
    domains: [D04]
    reviewed: true
    notes: "Cited in U.02.004 L05 (fluency via repeated/guided oral reading), L06–L09 (comprehension via question answering and question generation); and U.03.004 L04 (accuracy via systematic/explicit sound–symbol instruction), L05 (fluency via re-reading/guided oral reading), L06 (comprehension monitoring/self-correction), L07–L08 (main idea and supporting details). Real, landmark US report. URL verified live (2026-08-16): NICHD hosts the panel page (marked 'Historical/For Reference Only'). NRP identified five components of reading — phonemic awareness, phonics, fluency, vocabulary, comprehension — and found guided repeated oral reading improves fluency and that question answering, question generation, comprehension monitoring, and summarization (which includes identifying main ideas and supporting details) are among the comprehension strategies with a solid research base. On-topic for each lesson that cites it. US-centric source; treated as one widely used evidence base among others, not the only tradition."

  - id: S-041
    title: BBC Bitesize (KS1) — Working scientifically
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/z8q9pbk
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.02.006 L01 (wonder→prediction) and L02 (test it and record the result). URL verified live (2026-08-16). KS1 'Working scientifically' topic lists three guides — 'Why do scientists ask questions?', 'What is science?' (test ideas and predict outcomes), and 'How do scientists record and represent their findings?' — on-topic for the unit's ask/predict/test/record skills at Grade 2. (Corrected from the earlier KS3 topic zsg6m39, which was mislabeled as KS2.)"

  - id: S-042
    title: BBC Bitesize (KS1) — Everyday materials
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zrssgk7
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.02.006 L03 (sort/group by features) and L06 (material properties → jobs). URL verified live (2026-08-16). KS1 'Everyday materials' topic contains 'Objects and materials' (choose the right material to make things) and 'Describing materials' (describe materials and their properties) — on-topic for both lessons' grouping-by-property and property-to-job claims. (Corrected from a 404 topic z9prd2p.)"

  - id: S-043
    title: BBC Bitesize (KS1) — What is the life cycle of a plant?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zpxnyrd/articles/z2vdjxs
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.02.006 L04 (seed→sprout→seedling→flower→fruit→seed). URL verified live (2026-08-16). States: seeds grow roots and shoots, then leaves above ground; many plants make flowers which turn into fruits; flowers and fruits make their own seeds — 'We call this a life cycle.' On-topic and consistent with the lesson's stage order."

  - id: S-044
    title: BBC Bitesize (KS1) — Living things and their habitats
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zx882hv
    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.02.006 L05 (habitat = home: food, water, shelter). URL verified live (2026-08-16). KS1 'Living things and their habitats' topic includes 'What is a habitat?' plus woodland/coastal/desert/ocean/polar/pond/rainforest/urban habitats and food chains — on-topic for the lesson's many-biomes framing (pond, forest, desert, seashore, meadow)."

  - id: S-045
    title: BBC Bitesize (KS2) — Sound (How are sounds made?)
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zgffr82
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.02.006 L07 (sound comes from vibration). URL verified live (2026-08-16). KS2 'Sound' topic lists 'How are sounds made?' plus pitch, volume, and how sounds are detected — supports the lesson's core claim that sound is made when things vibrate and that we hear it with our ears. (Lesson title corrected to match the actual guide.)"

  - id: S-046
    title: BBC Bitesize (KS2) — Rocks (What is soil made from?)
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/z9bbkqt
    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.02.006 L09 (rocks, soil, and water make up the land; soil forms from worn rock + old living things). URL verified live (2026-08-16). KS2 'Rocks' topic lists 'What is soil made from?', 'Types of rock', and 'Fossils' — on-topic for the lesson's soil-from-rock-and-living-things claim. (Corrected from topic z9sfr82, which is KS2 Maths 'Weight and mass', not rocks/soil.)"

  - id: S-047
    title: NASA Space Place — All About the Sun
    type: website
    url: https://spaceplace.nasa.gov/all-about-the-sun/en/
    organization: NASA
    domains: [D06]
    reviewed: true
    notes: "Cited in U.02.006 L08 (Sun is a star; gives light + warmth; ~150 million km away; never look directly at it). URL verified live (2026-08-16). States: the Sun is a star (a hot glowing ball of gas); it is ~93 million miles (~150 million km) from Earth; 'Heat from the Sun makes Earth warm enough to live on'; 'Without light from the Sun, there would be no plants or animals'; and 'you should never look directly at the Sun.' Supports every factual claim in the lesson. (Corrected from spaceplace.nasa.gov/sun/en/, which 404s.)"

  - id: S-048
    title: BBC Bitesize — Primary (home)
    type: website
    url: https://www.bbc.co.uk/bitesize/primary
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.02.006 L10 (capstone) as a family-facing index of the unit's science topics. URL verified live (2026-08-16): the Primary hub (ages 3–11) aggregates KS1/KS2 science games and guides. General index, not a claim-level citation."

  - id: S-049
    title: WHO — Drinking-water fact sheet
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/drinking-water
    organization: World Health Organization
    year: 2023
    domains: [D03]
    reviewed: true
    notes: "Cited in U.02.008 L04 (water: body's drink). URL verified live (2026-08-16); page dated 13 Sept 2023. States water is essential for the body and public health, and frames safe/readily-available water as important for health — supports the lesson's hedged claims that the body is mostly water, that water is the everyday drink, and (Key facts: 2.2 billion people lack safely managed drinking-water services) that clean water is not available to everyone. On-topic; the 'not available to everyone' claim is a documented global fact, held by the lesson as a justice/values framing, not a personal failing."

  - id: S-050
    title: AASM — Recommended Amount of Sleep for Pediatric Populations
    type: article
    url: https://aasm.org/resources/pdf/pediatricsleepdurationconsensus.pdf
    organization: American Academy of Sleep Medicine
    year: 2016
    domains: [D03]
    reviewed: true
    notes: "Cited in U.02.008 L06 (sleep: 9–12 hours for ages 6–12). Official AASM consensus statement (Paruthi et al., J Clin Sleep Med 2016;12(6):785–786). PDF URL verified live (2026-08-16) — resolves to the AASM-hosted consensus statement. Recommends school-aged children (6–12 years) get 9–12 hours of sleep per 24 hours, matching the lesson's 'about 9 to 12 hours' phrasing. US-centric source but the recommendation is the standard international benchmark for pediatric sleep duration; lesson treats it as a general guide and explicitly allows for family variation."

  - id: S-051
    title: WHO — Preventing violence against children
    type: website
    url: https://www.who.int/teams/social-determinants-of-health/violence-prevention
    organization: World Health Organization
    domains: [D03]
    reviewed: true
    notes: "Cited in U.02.008 L07/L08 (trusted adults; telling a trusted adult keeps children safe). URL verified live (2026-08-16) — the Prevention of Violence (PVL) unit under WHO Social Determinants of Health; page emphasizes preventing violence against children, including via INSPIRE strategies and supportive adult relationships. On-topic as a general authority for the lesson's safety framing (a value/protective frame, not a claim-level citation). The lesson's safeguarding guidance (believe, don't promise secrecy, report) is standard child-protection practice and is not attributed to this page."

  - id: S-052
    title: Our World in Data — Light at Night
    type: website
    url: https://ourworldindata.org/light-at-night
    organization: Global Change Data Lab (University of Oxford)
    year: 2023
    domains: [D08]
    reviewed: true
    notes: "Cited in U.02.009 L02 (Light Then and Now). URL verified live (2026-08-16). By Max Roser, Hannah Ritchie, Pablo Arriagada, Bertha Rohenkohl (2023). States the history of light as transitions 'from candles to lamps to lightbulbs', that many countries moved candles → gas → kerosene → electricity, that the price of lighting fell >99.9% since 1300 (16,000-fold decline; Fouquet & Pearson data), and that many people still lack light at night (energy poverty). Supports every factual claim in the lesson, including the hedged 'hundreds of millions still light the dark with flame and lamp' and the no-ranking 'neither way is better' framing. CC-BY licensed."

  - id: S-053
    title: "Children Just Like Me (DK, in association with UNICEF)"
    type: book
    author: Barnabas Kindersley & Anabel Kindersley
    organization: DK Publishing (Dorling Kindersley), in association with UNICEF
    year: 1995
    domains: [D08]
    reviewed: true
    notes: "Cited in U.02.009 L03 (A Day in Another Child's Life) as an enriched picture book. Real, well-known book (DK, 1995; newer revised editions exist) profiling real children's daily lives — food, home, school, play — across many countries side by side. On-topic as an optional illustrated resource; the lesson does not attribute a specific factual claim to it (the Andean child-life example is separately sourced to CIP, S-054). No URL (print book)."

  - id: S-054
    title: International Potato Center (CIP) — Potato
    type: website
    url: https://cipotato.org/potato/
    organization: International Potato Center (CIP), CGIAR
    domains: [D08]
    reviewed: true
    notes: "Cited in U.02.009 L03 and L04 (Andean child-life example; Andean farming/terracing example). URL verified live (2026-08-16). States verbatim the potato 'originated and was first domesticated in the Andes mountains of South America' and that there are 'more than 4,500 varieties of native potatoes, mostly found in the Andes' (and 'over 4,000 varieties of native potatoes grow in the Andean highlands of Peru, Bolivia, and Ecuador'). Supports the lesson's claim that the potato was first domesticated in the Andes and that thousands of native varieties are still farmed there. The Quechua/herding-llamas framing is consistent with Andean agropastoral life (a widely documented example, not overstated). CC-BY 4.0."

  - id: S-055
    title: Polynesian Voyaging Society (Hōkūleʻa)
    type: website
    url: https://hokulea.com/
    organization: Polynesian Voyaging Society (PVS)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.02.009 L04 (wayfinding) and L06 (coast adaptation). URL verified live (2026-08-16). PVS is the real organization that owns and sails Hōkūleʻa; its mission is 'Perpetuating the legacy of traditional Polynesian voyaging', and its site documents the 1976 maiden voyage from Hawaiʻi to Tahiti (50th anniversary marked 2026) and traditional wayfinding (stars, swells, clouds, birds). The lesson's claim that the 1976 Hōkūleʻa voyage to Tahiti was guided without instruments by the Micronesian master navigator Mau Piailug is accurate and correctly attributed — the single highest-risk historical claim in the unit, and it is sound."

  - id: S-056
    title: UNESCO — Intangible Cultural Heritage
    type: website
    url: https://ich.unesco.org/
    organization: UNESCO
    domains: [D08]
    reviewed: true
    notes: "Cited in U.02.009 L04 as a general frame for knowledge passed down hand to hand. URL verified live (2026-08-16). UNESCO's ICH site (2003 Convention) frames intangible cultural heritage as 'the practices, representations, expressions, knowledge, skills' that communities pass between generations, transmitted person to person — on-topic for the lesson's claim that knowledge/skill is passed down hand to hand. A general authority/frame, not a claim-level citation for any single fact."

  - id: S-057
    title: National Geographic Education — Desert
    type: website
    url: https://education.nationalgeographic.org/resource/desert/
    organization: National Geographic Society
    domains: [D08]
    reviewed: true
    notes: "Cited in U.02.009 L05 (needs met differently by place) and L06 (adapting to a desert). URL verified live (2026-08-16). States 'People have adapted to life in the desert for thousands of years'; documents long, loose, light robes (thobe/abaya/djellaba/keffiyeh) that shield from sun, wind, and sand; tents that let cool air through; reliance on wells, springs, oases, and groundwater; and camels — supporting every desert-specific claim in both lessons, including 'hot in the day and cool at night'."

  - id: S-058
    title: Inuit Circumpolar Council (ICC)
    type: website
    url: https://www.inuitcircumpolar.com/
    organization: Inuit Circumpolar Council (ICC)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.02.009 L06 (cold-region adaptation). URL verified live (2026-08-16). ICC is the real, authoritative pan-Arctic Indigenous organization — 'Representing approximately 180,000 Inuit across Alaska, Canada, Greenland (Kalaallit Nunaat), and Chukotka' — founded 1977, and documents Inuit knowledge and ways of living in the Arctic (hunting, Indigenous knowledge, environment). On-topic as an authority for the lesson's Inuit parkas/kayaks/winter shelters/hunting-fishing framing (the lesson correctly attributes these as Inuit and names the peoples)."

  - id: S-060
    title: United Nations Convention on the Rights of the Child (UNICEF, child-friendly)
    type: website
    url: https://www.unicef.org/child-rights-convention
    organization: UNICEF (United Nations Children's Fund)
    domains: [D09]
    reviewed: true
    notes: "Cited in U.02.010 L04 (the rights every child has — play, learn, be safe, be heard, rest) and U.03.010 L03 (rights to food, water, health, education — UNCRC Arts 24, 27, 28) and L10 (child-friendly summary). The UNICEF CRC page (child-friendly summary) sits behind Cloudflare and returns HTTP 403 to non-browser clients (verified 2026-08-16), so the substantive claims were verified against the full treaty text on OHCHR (ohchr.org/en/instruments-mechanisms/instruments/convention-rights-child). All five rights named in the lesson are genuine UNCRC articles: play and rest/leisure (Art. 31), learn/education (Arts. 28–29), be safe / protection from violence and abuse (Art. 19, and best-interests Art. 3), be heard / views given due weight (Art. 12). The lesson correctly frames these as a 'should' — a shared international agreement, not a claim that every child already has them honored — which keeps value/aspiration distinct from fact."

  - id: S-059
    title: Nobel Prize — Wangari Maathai, Facts
    type: website
    url: https://www.nobelprize.org/prizes/peace/2004/maathai/facts/
    organization: Nobel Prize Outreach / Nobel Foundation
    domains: [D08]
    reviewed: true
    notes: "Cited in U.02.009 L08 (Someone Who Helped and Spoke Up). URL verified live (2026-08-16). States Wangari Maathai 'In 1977 she started a grass-roots movement' countering deforestation, that the Green Belt Movement 'spread to other African countries, and contributed to the planting of over thirty million trees', and that she received the Nobel Peace Prize 2004 'for her contribution to sustainable development, democracy and peace'. Confirms every factual claim in the lesson (Green Belt Movement 1977; over thirty million trees; Nobel Peace Prize 2004). The lesson correctly distinguishes these facts from the value that caring for the land and speaking up are good."

  - id: S-061
    title: Britannica Kids — Tool
    type: website
    url: https://kids.britannica.com/kids/article/tool/400194
    organization: Encyclopaedia Britannica
    domains: [D10]
    reviewed: true
    notes: "Cited in U.02.011 L01 (Tools Are Made to Solve Problems). URL verified live (2026-08-16): the Britannica Kids 'tool' article states a tool 'is anything that is used to make a change to something else or to help do a job.' Supports the lesson's core idea that a tool is a thing people make/use to solve a problem. (Corrected from an earlier citation with the wrong article ID 400184, which 404s; the live article ID is 400194.)"

  - id: S-062
    title: Encyclopaedia Britannica — Sewing Machine
    type: website
    url: https://www.britannica.com/technology/sewing-machine
    organization: Encyclopaedia Britannica
    domains: [D10]
    reviewed: true
    notes: "Cited in U.02.011 L02 (Old Tool, New Tool) for the claim that the 1800s sewing machine let people sew faster than by hand. URL verified live (2026-08-16): article documents Thimonnier's 1830 patent, Walter Hunt (c. 1832-34), Elias Howe's 1846 patent, and that 'In 1860 more than 110,000 sewing machines were produced in the United States alone' — i.e., a machine that mechanized and greatly sped up hand-sewing. Replaces a broken Smithsonian NMAH URL (americanhistory.si.edu/collections/object-groups/sewing-machines, now 404 after the museum's site redesign); the claim itself is accurate against Britannica."

  - id: S-063
    title: Common Sense Education — News & Media Literacy
    type: website
    url: https://www.commonsense.org/education/digital-citizenship/topic/news-and-media-literacy
    organization: Common Sense Media (Common Sense Education)
    domains: [D10]
    reviewed: true
    notes: "Cited in U.02.011 L03/L04/L09 (source-of-information; true info vs selling; making an honest message). URL verified live (2026-08-16): the 'News & Media Literacy' topic page frames 'Seek, Evaluate, and Contextualize' and, for Grades K-2, that students 'learn to wonder about where information comes from' and 'develop the habit of asking questions rather than accepting everything at face value.' Supports each lesson's claim that asking where information comes from and distinguishing information from persuasion are core media-literacy skills. (Corrected from commonsensemedia.org/news-and-media-literacy, which 404s; the live hub is on the education subdomain.)"

  - id: S-064
    title: BBC Bitesize (KS1) — What is a food chain?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zx882hv/articles/zwxwkty
    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.02.011 L06 (Energy from Eating). URL verified live (2026-08-16) via the KS1 'Living things and their habitats' topic index (zx882hv), which lists 'What is a food chain?' at articles/zwxwkty: 'Every animal and plant needs food to live... each living organism is part of a food chain, from producers to prey.' Supports the lesson's claim that animals get energy from eating plants or other animals. (Corrected from articles/zwkxsbk, which 404s.)"

  - id: S-065
    title: WHO/UNICEF JMP — WASH (Washdata)
    type: website
    url: https://washdata.org/
    organization: WHO/UNICEF Joint Monitoring Programme for Water Supply, Sanitation and Hygiene
    domains: [D10]
    reviewed: true
    notes: "Cited in U.02.011 L07 (Water and Energy — Use and Save) for the claim that many people still lack safely managed drinking water. URL verified live (2026-08-16): the JMP homepage states '1 in 4 – or 2.1 billion people globally – still lack access to safely managed drinking water, including 106 million who drink directly from untreated surface sources' (2025 household report). Confirms the lesson's 'about 1 in 4 people still lack safely managed drinking water'; the lesson frames saving water as an act of fairness (a value), clearly separated from the factual statistic."

  - id: S-066
    title: National Geographic Kids — Plastic Pollution
    type: website
    url: https://kids.nationalgeographic.com/science/article/plastic-pollution
    organization: National Geographic Society (National Geographic Kids)
    domains: [D10]
    reviewed: true
    notes: "Cited in U.02.011 L08 (Where Does Litter Go?) for the dropped-path account. URL verified live (2026-08-16): the article states 'some animals mistake plastic for food,' that plastic bottles 'take many hundreds of years to disintegrate' ('over 450 years to break down in a landfill'), and that plastic ends up 'as trash on the land and in rivers, lakes, and the ocean.' Supports the lesson's hedged claims that plastic litter can take hundreds of years to break down and can wash into rivers and the ocean where animals may mistake it for food. Reviewer had flagged this source; verified real and on-topic."

  - id: S-067
    title: NIDCD — Taste and Smell
    type: website
    url: https://www.nidcd.nih.gov/health/taste-smell
    organization: U.S. National Institute on Deafness and Other Communication Disorders (NIDCD), National Institutes of Health
    domains: [D03]
    reviewed: true
    notes: "Cited in L.03.002.01 (Senses Team Up) for the claim that much of what we call flavor comes from smell and taste working together. URL verified live (2026-08-16): NIDCD is the authoritative U.S. federal institute for taste and smell, and this hub covers Taste Disorders and Smell Disorders; the underlying sensory science — that flavor perception combines taste (tongue) and smell (nose), especially retronasal smell — is standard and matches the lesson's hedged claim ('much of what we call flavor'), which the facilitator note flags as well-established in sensory science. US-centric source; treated as one authoritative reference, not the only tradition."

  - id: S-068
    title: NIDCD — Balance Disorders
    type: website
    url: https://www.nidcd.nih.gov/health/balance-disorders
    organization: U.S. National Institute on Deafness and Other Communication Disorders (NIDCD), National Institutes of Health
    domains: [D03]
    reviewed: true
    notes: "Cited in L.03.002.08 (Moving with Balance) for the claim that a balance sensor deep inside the ear works with muscles and eyes to keep us steady. URL verified live (2026-08-16): page states verbatim that 'Your sense of balance relies on a series of signals to your brain from several organs and structures in your body, specifically your eyes, ears, and the muscles and touch sensors in your legs' and that 'The part of the ear that assists in balance is known as the vestibular system, or the labyrinth, a maze-like structure in your inner ear.' Directly supports the lesson's Grade-3 simplification (ear sensor + muscles + eyes)."

  - id: S-069
    title: WHO — Physical activity fact sheet
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/physical-activity
    organization: World Health Organization
    year: 2024
    domains: [D03]
    reviewed: true
    notes: "Cited in L.03.002.07 (Moving with Rhythm) and L.03.002.09 (Hand–Eye Coordination) for the claim that children need regular movement for healthy growth. URL verified live (2026-08-16); page dated 26 June 2024. States verbatim: 'In children and adolescents, physical activity promotes bone health, encourages healthy growth and development of muscle, and improves motor and cognitive development.' Supports the lessons' hedged general claim."

  - id: S-070
    title: BBC Bitesize (KS2) — What is a fair test?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zqkk7ty/articles/z69qwnb
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.03.006 L01 (A Fair Test — Change One Thing). URL verified live (2026-08-17) via the KS2 Science subjects index (topic zqkk7ty 'Working scientifically'): the article 'What is a fair test?' ('Learn how to make a test fair when working scientifically') supports the lesson's core method — change one variable, keep the rest the same. Replaces the broken topic URL z2mdtcw (404)."

  - id: S-071
    title: BBC Bitesize (KS2) — Recording and presenting scientific data
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zqkk7ty/articles/zdwttrd
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.03.006 L02 (Record and Read the Data). URL verified live (2026-08-17) via the KS2 'Working scientifically' topic zqkk7ty: article 'Recording and presenting scientific data' supports the lesson's table/tally/drawing recording and reading-back claim. Replaces the broken topic URL z2mdtcw (404)."

  - id: S-072
    title: BBC Bitesize (KS2) — What is a food chain?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zcyycdm/articles/zww9r2p
    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.03.006 L03 (Who Eats What?). URL verified live (2026-08-17). States: plants make their own food and are producers; animals that eat them are consumers (primary/secondary); energy flows from the Sun along the chain (arrows point producer→consumer); chains join into food webs. Supports the producer/consumer/energy-flow claims. Does NOT name decomposers — that step is covered by the companion article S-073 ('What is a microorganism?'). Replaces zbnnb9q/articles/zsphrwx (a food-chain game, mislabeled as the article)."

  - id: S-073
    title: BBC Bitesize (KS2) — What is a microorganism?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/z6wwxnb/articles/zsgtrwx
    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.03.006 L03 for the decomposer step. URL verified live (2026-08-17). States verbatim: 'Fungi take in dead matter and help turn it back into nutrients for the soil' and 'Bacteria are a microorganism which can break down plants to release nutrients into the soil'; calls the process decomposition and fungi 'a natural recycler.' Supports the lesson's claim that worms, fungi, and tiny living things break down dead matter and return nutrients to the soil."

  - id: S-074
    title: BBC Bitesize (KS2) — The structure of flowering plants
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zy66fg8/articles/z2d4g7h
    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.03.006 L04 (A Plant's Helping Parts). URL verified live (2026-08-17). States: roots take up water and nutrients and keep the plant steady; the stem carries water and nutrients; leaves use light from the Sun (with water and carbon dioxide) to make food (photosynthesis). Supports each of the lesson's three-part claims. Replaces the KS1 topic zpxnyrd (mislabeled KS2) and its non-existent sub-article titles."

  - id: S-075
    title: BBC Bitesize (KS2) — Solids, liquids and gases
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zgwc96f/articles/zngfp4j
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.03.006 L05 (Solids, Liquids, and Gases). URL verified live (2026-08-17). States: solids keep their shape; liquids flow and change shape to fit their container; gases have no fixed shape and spread to fill the space. Supports each of the lesson's three state rules. Corrected from the stale topic ID zkgg87h to the canonical states-of-matter topic zgwc96f (same article ID)."

  - id: S-076
    title: BBC Bitesize (KS2) — Changing states
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zgwc96f/articles/zwj9r2p
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.03.006 L06 (Heating and Cooling Change States). URL verified live (2026-08-17). States: heating melts a solid to a liquid and boils/evaporates a liquid to a gas; cooling freezes a liquid to a solid and condenses a gas to a liquid; these changes are reversible. Supports every change-of-state claim in the lesson. Replaces the 404 URL zkgg87h/articles/z9ckcqt."

  - id: S-077
    title: BBC Bitesize (KS2, NI) — What is a force?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zvr3nrd/articles/zywcrdm
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.03.006 L07 (Push and Pull — Forces and Motion). URL verified live (2026-08-17) via the KS2 NI 'The World Around Us' Forces topic zvr3nrd: the article 'What is a force?' ('Find out how forces, like pushes and pulls, move objects') supports the lesson's claim that a force is a push or pull that changes motion. Replaces the KS3 topic z4brd2p (mislabeled KS2) whose cited article title did not exist."

  - id: S-078
    title: BBC Bitesize (KS2, NI) — What is friction?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zvr3nrd/articles/zxqrdxs
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.03.006 L08 (Friction — The Slow-Down Force). URL verified live (2026-08-17). States verbatim: 'Friction is a force between two surfaces... Friction always slows a moving object down'; 'The rougher the surface, the more friction is produced'; 'Friction also produces heat'; and that friction is useful (grip, brakes) but sometimes reduced (oil). Supports every friction claim in the lesson. Normalized from the KS3 topic ID z4brd2p to the canonical KS2 NI Forces topic zvr3nrd (same article ID)."

  - id: S-079
    title: "BBC Bitesize (Scotland, 2nd level) — Coastlines: erosion"
    type: website
    url: https://www.bbc.co.uk/bitesize/articles/z7rwdp3
    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.03.006 L10 (The Changing World Wonder Fair). URL verified live (2026-08-17). Defines erosion as 'the wearing away of pieces of rock, soil or other solid materials' and shows the sea wearing away the land (waves → cracks → caves → arches → stacks), i.e., how water shapes the land over time. Supports the lesson's core erosion claim (the water/waves/rivers case and the general 'wearing away over time' idea); the lesson's wind-dunes and ice-glaciers sub-claims are standard, accurate Earth science not detailed on this page. Replaces the 404 topic URL z8v9pbk ('How does weather change the landscape?' — no such article)."

  - id: S-080
    title: FAO — The State of Food and Agriculture (SOFA)
    type: website
    url: https://www.fao.org/publications/home/fao-flagship-publications/the-state-of-food-and-agriculture/en
    organization: Food and Agriculture Organization of the United Nations (FAO)
    year: 2025
    domains: [D03]
    reviewed: true
    notes: "Cited in U.03.008 L05 (Where My Food Comes From) for the general frame that food originates from plants and animals raised by people. URL verified live (2026-08-17); the original cited URL fao.org/state-of-food-agriculture/en/ returned 404, so the citation was corrected to the live SOFA flagship landing page, which resolves to fao.org/publications/fao-flagship-publications/the-state-of-food-and-agriculture/en. SOFA is FAO's annual flagship report on agrifood systems — a general authority for the lesson's low-risk claim that food comes from plants and animals raised by people, not a claim-level citation for any specific statistic."

  - id: S-081
    title: FAO — Sustainable Food Value Chains Knowledge Platform
    type: website
    url: https://www.fao.org/sustainable-food-value-chains/en/
    organization: Food and Agriculture Organization of the United Nations (FAO)
    domains: [D03]
    reviewed: true
    notes: "Cited in U.03.008 L06 (From Farm and Garden to My Table) for how food moves from farm to table through plant, grow, harvest, transport, sell, and cook. URL verified live (2026-08-17); the original citation paired the title 'Food loss and food value chains' with the generic FAO homepage (fao.org/home/en/), which was a mislabel, so it was corrected to this FAO knowledge platform on food value chains. The platform frames food value chains as the path food travels from production through processing, transport, and market to consumers — on-topic for the lesson's farm-to-table journey and its 'many hands' framing."

  - id: S-082
    title: IFRC — First aid (International First Aid, Resuscitation and Education Guidelines)
    type: website
    url: https://www.ifrc.org/our-work/health-and-care/first-aid
    organization: International Federation of Red Cross and Red Crescent Societies (IFRC)
    domains: [D03]
    reviewed: true
    notes: "Cited in U.03.008 L07 (First Aid for Minor Hurts) for the steps for minor cuts, scrapes, and bruises. The ifrc.org first-aid programme page sits behind bot protection (returns HTTP 403 to non-browser clients, verified 2026-08-17), so the substantive first-aid guidance was verified against IFRC's Global First Aid Reference Centre (globalfirstaidcentre.org), the federation's centre of excellence that publishes the International First Aid, Resuscitation and Education Guidelines. Those guidelines direct: rinse/clean a minor wound with clean water and cover it with a clean dressing, and apply something cold to a bruise/contusion — matching the lesson's 'tell an adult, wash with clean water, cover, cool, rest' steps. The lesson is appropriately hedged (minor hurts only; an adult always decides when a deeper/bigger/bleeding wound needs professional help), so no medical misinformation."

  - id: S-083
    title: Encyclopaedia Britannica — Bedouin
    type: website
    url: https://www.britannica.com/topic/Bedouin
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.03.009 L03 (Two Peoples, Two Ways to Meet Needs) for the Bedouin food/shelter/clothing comparison. URL verified live (2026-08-17): Britannica's 'Bedouin' article describes Bedouin as 'nomadic groups inhabiting Middle Eastern deserts, including North Africa, the Arabian Peninsula, Egypt, Israel, Iraq, Syria, and Jordan' — animal herders (camel, sheep, and goat nomads) who use 'tents made of woven camel hair or goat skins,' and whose 'clothing is loose-fitting for both sexes, protecting against heat, dust, and sunshine.' Camels 'provide milk' (and meat/hair). Supports the lesson's claims of desert tent dwelling, light loose clothing, and milk from herded animals; the 'dates' food item is a standard, accurate staple of desert/oasis life, not overstated."

  - id: S-084
    title: Smithsonian National Museum of African Art — Kente cloth
    type: website
    url: https://africa.si.edu/
    organization: Smithsonian Institution (National Museum of African Art)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.03.009 L04 (Stories, Songs, and Art That Show What People Value) as the authority for kente cloth of the Akan peoples of Ghana and Côte d'Ivoire, whose patterns and colors carry meanings and which is worn on important occasions. The cited URL (africa.si.edu) is the museum's institutional homepage and sits behind Cloudflare bot protection (returns HTTP 403 to non-browser clients, verified 2026-08-17), so it functions as an authority-of-record rather than a page-level citation. The underlying facts are standard and accurate: kente is a woven strip cloth of the Akan (Asante/Ashanti and Ewe) peoples of Ghana, also woven in Côte d'Ivoire; its named patterns and colors encode proverbs, concepts, and values (wisdom, unity, honor); and it is worn at important ceremonies/occasions. The lesson correctly names 'the Akan peoples' and does not overstate."

  - id: S-085
    title: AIATSIS — Australian Institute of Aboriginal and Torres Strait Islander Studies
    type: website
    url: https://aiatsis.gov.au/
    organization: AIATSIS (Australian Government)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.03.009 L04 (Stories, Songs, and Art That Show What People Value) for the claim that Aboriginal and Torres Strait Islander art carries knowledge, law, and stories (including the value of caring for Country) and that there are many distinct nations, each with its own traditions. aiatsis.gov.au is the authoritative Australian institute's homepage; it sits behind Cloudflare bot protection (HTTP 403 to non-browser clients, verified 2026-08-17). The facts are standard and accurate: Aboriginal and Torres Strait Islander art and oral tradition encode customary knowledge, law, and ancestral ('Dreaming') stories; 'caring for Country' is a foundational value; and there are hundreds of distinct First Nations language/Country groups. The lesson hedges correctly ('Aboriginal peoples of Australia'; 'many Aboriginal nations, each with its own stories and art') and does not reduce dot painting to a single pan-Aboriginal practice."

  - id: S-086
    title: International Organization for Migration (IOM) — Who is a migrant?
    type: website
    url: https://www.iom.int/who-migrant-0
    organization: International Organization for Migration (UN Migration)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.03.009 L05 (Why People Move) for the claim that people move for reasons including family, work, safety, and the environment, and that migration has been part of human life throughout history. URL verified live (2026-08-17): https://www.iom.int/who-migrant-0 redirects to IOM's 'Fundamentals of Migration' page, which defines migration and links to IOM's World Migration Report 2024 chapters (including 'Why do people migrate?'). IOM documentation confirms migration is longstanding human behavior and that drivers include economic/work, family reunification, safety/security, and environmental factors. On-topic for the lesson's four-reason framing; the lesson correctly holds 'moving is worthy of respect' as a value distinct from the factual claim that people move for these reasons."

  - id: S-087
    title: Encyclopaedia Britannica — Salt March
    type: website
    url: https://www.britannica.com/event/Salt-March
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.03.009 L07 (Working Together to Change Something Unfair) for the 1930 Salt March. URL verified live (2026-08-17): Britannica's 'Salt March' article confirms a nonviolent protest led by Mahatma Gandhi in March–April 1930 against the British salt monopoly — a ~240-mile (385-km) march from Sabarmati Ashram to Dandi (Gujarat), where on April 6 Gandhi and followers picked up handfuls of salt from the shore, 'technically producing salt and breaking the law,' as civil disobedience within the Indian independence movement. Matches the lesson's '240-mile (about 385-km) march to Dandi,' 'peacefully made their own salt,' 'part of the larger movement for India's independence' framing, and its age-appropriate 'over time the unfair rule was changed' summary."

  - id: S-088
    title: National Geographic Education — River
    type: website
    url: https://education.nationalgeographic.org/resource/river/
    organization: National Geographic Society
    domains: [D08]
    reviewed: true
    notes: "Cited in U.03.009 L06 (Rivers, Mountains, and Where People Settle) for the claim that rivers provide water, food, and transport and that fertile floodplains/valleys attract settlement. URL verified live (2026-08-17): the 'River' encyclopedic entry states 'Humans use rivers for irrigation in agriculture, for drinking water, for transportation, to produce electricity,' and that 'deltas and floodplains are highly fertile agricultural zones that offer tremendous value to the surrounding people' (e.g., the Nile and its delta 'helped give rise to the Egyptian empire'). Supports the lesson's river and floodplain-settlement claims. NOTE: the lesson originally cited a non-existent 'Valley' entry (education.nationalgeographic.org/resource/valley/ returns 404) — corrected to cite only the working 'River' page, which itself covers floodplains."

  - id: S-089
    title: Our World in Data — Urbanization
    type: website
    url: https://ourworldindata.org/urbanization
    organization: Our World in Data (Global Change Data Lab, University of Oxford)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.03.009 L02 (How Our Place Changed Over Time) for the long, global growth of towns and cities, many of which began and grew at river crossings, ports, and trade routes. URL verified live (2026-08-17): the 'Urbanization' topic page (Ortiz-Ospina et al., 2024) documents urbanization as a global, multi-century shift — 'Urbanization is the migration from rural areas into towns and cities. Over the past century, billions of people have made this move.' It supports the lesson's general 'many great cities grew at crossings and ports' pattern (a standard historical-geography claim); the page itself does not enumerate river crossings, so the lesson's specific river/port claim is a supported generalization rather than a verbatim figure."

  - id: S-090
    title: Britannica Dictionary — Landmark
    type: website
    url: https://www.britannica.com/dictionary/landmark
    organization: Encyclopaedia Britannica (Britannica Dictionary)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.03.009 L01 (Placing Our Local Landmarks on a Timeline) for the definition of a landmark. URL verified live (2026-08-17): the Britannica Dictionary defines 'landmark' (noun) as 'an object or structure on land that is easy to see and recognize' and, secondarily, 'a building or place that was important in history.' Supports the lesson's use of 'local landmarks as markers in a place's story.' NOTE: the lesson originally cited a non-existent National Geographic Education 'Landmark' entry (education.nationalgeographic.org/resource/landmark/ returns 404) — replaced with this working, on-topic dictionary definition."

  - id: S-091
    title: United Nations Convention on the Rights of the Child — Article 12 (OHCHR full treaty text)
    type: website
    url: https://www.ohchr.org/en/instruments-mechanisms/instruments/convention-rights-child
    organization: UN Office of the High Commissioner for Human Rights (OHCHR)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.03.009 L08 (Having a Say — Power and Being Left Out) for the right of children to say what they think and be listened to. The OHCHR URL is the canonical location of the full CRC treaty text (it returns HTTP 403 to non-browser clients, verified 2026-08-17, as previously documented in S-060). Article 12 states that States Parties shall assure the child who is capable of forming views the right to express those views freely in all matters affecting the child, the views being given due weight in accordance with the child's age and maturity. The lesson's paraphrase ('children have the right to say what they think and to have their views taken into account') is accurate; the lesson correctly frames this as a right to be realized, not an already-universal fact."

  - id: S-092
    title: UNICEF — Inclusive education
    type: website
    url: https://www.unicef.org/education/inclusive-education
    organization: UNICEF (United Nations Children's Fund)
    domains: [D09]
    reviewed: true
    notes: "Cited in U.03.010 L04 (Left Out: Making It More Fair) for 'removing barriers so every child can take part.' URL verified live via browser (2026-08-17; returns HTTP 403 to non-browser clients like other UNICEF pages — see S-060). Page title 'Inclusive education | UNICEF'. States: 'Inclusive education is the most effective way to give all children a fair chance to go to school, learn and develop the skills they need to thrive' and 'Inclusive education means all children in the same classrooms, in the same schools… real learning opportunities for groups who have traditionally been excluded.' On-topic for the lesson's inclusion/removing-barriers framing (a value frame, not a claim-level citation)."

  - id: S-093
    title: Maslow (1943) — A Theory of Human Motivation
    type: article
    author: Abraham H. Maslow
    organization: Psychological Review
    year: 1943
    url: https://doi.org/10.1037/h0054346
    domains: [D09]
    reviewed: true
    notes: "Cited in U.03.010 L03 (Needs, Wants, and Fair Sharing) as 'the idea that basic needs like food, water, and safety come first,' simplified for children. Real, foundational article (Psychological Review 50(4), 370–396; DOI 10.1037/h0054346 verified live 2026-08-17) introducing the hierarchy of needs, with physiological needs (food, water) and safety at the base. The lesson correctly frames it as a theory ('the idea that'), not an established fact, and uses it only as a child-friendly scaffold for the need-before-want ordering — distinct from the UNCRC rights citation (S-060)."

  - id: S-094
    title: Lipman (1974) — Harry Stottlemeier's Discovery
    type: book
    author: Matthew Lipman
    organization: Institute for the Advancement of Philosophy for Children (IAPC)
    year: 1974
    domains: [D09]
    reviewed: true
    notes: "Cited in U.03.010 L02 (The Same Act, Different Situations) for the 'context matters' idea in the philosophy-for-children tradition. Real book: the founding novel of the Philosophy for Children movement (Matthew Lipman, IAPC/Montclair State University, first published 1974), which invites young learners to reason about meaning and context. On-topic as a tradition/frame reference, not a claim-level citation. No URL (print book)."

  - id: S-095
    title: EIA Energy Kids — Renewable and Nonrenewable Energy Sources
    type: website
    url: https://www.eia.gov/kids/energy-sources/renewable/
    organization: U.S. Energy Information Administration (EIA)
    domains: [D10]
    reviewed: true
    notes: "Cited in U.03.011 L07 (Runs Out or Comes Back) for the nonrenewable ('runs out') vs renewable ('comes back') resource distinction. URLs verified live (2026-08-17): the 'Renewable' page states 'Renewable energy is energy from sources that are naturally replenishing but flow-limited; renewable resources are virtually inexhaustible' and lists fossil fuels (coal, petroleum, natural gas) as the contrast; the companion 'Coal' page (https://www.eia.gov/kids/energy-sources/coal/) states 'Coal is classified as a nonrenewable energy source because it takes millions of years to form. Coal contains the energy stored by plants that lived hundreds of millions of years ago.' Directly supports the lesson's claims that coal/oil are made over millions of years and can be used up, while sunlight/wind/water keep coming back. Metal (a mineral resource) is grouped with these in the standard elementary 'nonrenewable' framing (mineral ores form over geological time and are not replenished in a human lifetime). US-centric source; treated as one authoritative, age-appropriate reference, not the only tradition."

  - id: S-096
    title: "Dweck — Mindset: The New Psychology of Success"
    type: book
    organization: Ballantine Books
    year: 2006
    domains: [D01]
    reviewed: true
    notes: "Real book (Carol Dweck, first published 2006 by Random House/Ballantine). Cited in U.04.001 L06 (The Map of My Growing Self) for the growth-mindset/'not yet' frame. Lesson correctly hedges the claim (effects are modest and not produced by praise alone), consistent with the research literature's replication cautions. No URL (print book)."

  - id: S-097
    title: "Duckworth, Gendler & Gross — Situational Strategies for Self-Control"
    type: article
    url: https://doi.org/10.1177/1745691615623247
    organization: Perspectives on Psychological Science
    year: 2016
    domains: [D01]
    reviewed: true
    notes: "Real paper: Duckworth, A. L., Gendler, T. S., & Gross, J. J. (2016). Situational strategies for self-control. Perspectives on Psychological Science, 11(1), 35–55. Cited in U.04.001 L10 (Staying With It When It Is Hard or Tempting to Quit) for if-then planning/situational self-control strategies. Lesson correctly hedges the claim (willpower is not infinite; evidence for 'building' it like a muscle is mixed), matching the paper's situational-strategy framing."

  - id: S-098
    title: "Nemours KidsHealth — heart, lungs, sweat, and muscles (for kids)"
    type: website
    url: https://kidshealth.org/en/kids/heart.html
    organization: Nemours KidsHealth
    domains: [D03]
    reviewed: true
    notes: "Cited in U.04.002 L01/L02/L05 (heart/pulse/heartbeat speeding with activity: 'When you run around a lot, your body needs a lot more oxygen-filled blood. Your heart pumps faster'), L03 (lungs: oxygen in, carbon dioxide out), L04 (sweat: 'As the sweat evaporates off your skin, you cool down'), L10 (muscles move the body and using them keeps them strong). URLs verified live (2026-08-17): /kids/heart.html, /kids/lungs.html, /kids/sweat.html, /kids/muscles.html all return 200. The formerly cited /kids/exercise.html returned 404 and was replaced with /kids/muscles.html."

