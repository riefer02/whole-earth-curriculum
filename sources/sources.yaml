    reviewed: true
    notes: "Kohli, R., & Solórzano, D. G. (2012). Teachers, please learn our names!: racial microaggressions and the K-12 classroom. Race Ethnicity and Education, 15(4), 441–462. Cited in U.04.004 L15 for the importance of correctly learning/pronouncing a peer's name. Journal title is 'Race Ethnicity and Education' (no comma)."

