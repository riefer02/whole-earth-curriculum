  - id: S-163
    title: "Kropotkin (1902) — Mutual Aid: A Factor of Evolution"
    type: book
    author: Peter Kropotkin
    organization: McClure Phillips & Co. (first English ed., 1902); Heinemann
    year: 1902
    domains: [D02]
    reviewed: true
    notes: "Cited in U.05.004 L09 (Mutual Aid Across Cultures and Times) for the framing that mutual aid — cooperation and reciprocity, not for pay but from belonging — is a widespread human practice. Real, foundational 1902 book: Peter Kropotkin's collection of anthropological essays (first serialized in The Nineteenth Century 1890–1896) arguing that mutual aid/cooperation, alongside competition, is a factor of evolution in animal and human societies past and present. The lesson's Resources note states the concept is 'named in' Kropotkin's book — accurate: Kropotkin is the canonical source who popularized 'mutual aid' as a term/theory. The lesson appropriately holds 'helping one another is good' as a value distinct from the factual claim that mutual-aid traditions are widespread and documented. No URL (print book; full text is public domain on Wikisource/Project Gutenberg)."

