  - id: S-109
    title: "BBC Bitesize (KS2) — How are sounds made?"
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zgffr82/articles/zh9bydm
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.04.006 L07 (Energy Moves: Heat, Sound, Light) for sound being made by vibrations and traveling as energy. URL verified live (2026-08-17), article 'How are sounds made?' (KS2 'Sound' topic zgffr82)."

  - id: S-110
    title: "BBC Bitesize (KS2) — What is the water cycle?"
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/z849q6f/articles/zj2nydm
    organization: BBC Bitesize
