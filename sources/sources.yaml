    notes: "Cited in U.04.011 L03/L04/L09 (author/purpose/audience; two-source checking) for the key questions of media analysis. Real NAMLE resource; URL verified live (2026-08-17). Also cited in U.07.007 L02/L03 (framing/emphasis as persuasion tools; sound in media) for the 'who made this and why' media-literacy question. Also cited in U.10.008 L07 (five questions that open any health claim: who made it, why, for whom, what evidence, what is left out) and L09 (reading motive — help/belong/sell) for the same key-questions media-literacy frame."

  - id: S-152
    title: "National Geographic Education — Ecosystem"
    type: website
    url: https://education.nationalgeographic.org/resource/ecosystem/
    organization: National Geographic Society
    domains: [D10, D06]
    reviewed: true
    notes: "Cited in U.04.011 L05/L08 for ecosystem = living + nonliving parts that depend on each other (biotic/abiotic). URL verified live (2026-08-17)."

  - id: S-153
    title: "National Geographic Education — Decomposers"
    type: website
    url: https://education.nationalgeographic.org/resource/decomposers/
    organization: National Geographic Society
    domains: [D10, D06]
    reviewed: true
    notes: "Cited in U.04.011 L06 for the decomposer role (mushroom/earthworm examples). URL verified live (2026-08-17). Note: listed as Grades 5-8; content (decomposers break down dead matter) is appropriate and on-topic for the grade-4 lesson's producer/consumer/decomposer objective."

  - id: S-154
    title: "U.S. EPA — Reduce, Reuse, Recycle"
    type: website
    url: https://www.epa.gov/recycle
    organization: U.S. Environmental Protection Agency
    domains: [D10]
    reviewed: true
    notes: "Cited in U.04.011 L07/L10 for the reduce-reuse-recycle waste hierarchy (reduce first, then reuse, then recycle). URL verified live (2026-08-17). US-centric source; treated as one authoritative waste-hierarchy reference, not the only tradition."

  - id: S-155
    title: "Erikson — Childhood and Society"
    type: book
    organization: W. W. Norton
    year: 1950
    domains: [D01]
    reviewed: true
    notes: "Erik H. Erikson (1950). Childhood and Society. W. W. Norton. Cited in U.04.012 L01/L07 for identity as a developing, lifelong process and the school-age 'industry vs. inferiority' stage (~ages 9-10), and in U.07.001 L05/L06 (My Identity, a Changing Story; The Story Keeps Growing) for identity as a lifelong process, not a finished fact. Real, foundational developmental-psychology text; the lessons' framing (identity as ongoing process) is accurate. No URL (print book). Also cited in U.07.012 L01 (My Identity: Then, Now, Next) for identity as a continuous, changing story whose next page can be predicted with reasons, not certainty."

  - id: S-156
    title: "Search Institute — 40 Developmental Assets"
    type: website
    url: https://searchinstitute.org/resources-hub/developmental-assets-framework/
    organization: Search Institute
    domains: [D01, D02]
    reviewed: true
    notes: "Cited in U.04.012 L04 (A Role I Can Play) for contribution and responsibility as developmental/protective factors (external assets: empowerment/service; internal assets: positive values incl. caring and responsibility). Real framework; URL verified live (2026-08-17)."

  - id: S-157
    title: "Putnam — Bowling Alone"
    type: book
    organization: Simon & Schuster
    year: 2000
    domains: [D02]
    reviewed: true
    notes: "Robert D. Putnam (2000). Bowling Alone: The Collapse and Revival of American Community. Simon & Schuster. Cited in U.04.012 L06 (A Small Act of Care) for shared spaces and community/social trust. Real, seminal book on social capital. Note: author is 'Putnam' (corrected from a misspelled 'Putman' in the lesson). No URL (print book)."

  - id: S-158
    title: "UNESCO — Learning to Live Together"
    type: website
    url: https://en.unesco.org/themes/learning-live-together
    organization: UNESCO
    domains: [D02, D09]
    reviewed: true
    notes: "Cited in U.04.012 L05 (Welcome In) for belonging and inclusion across cultures — one of the four pillars of learning from the Delors report (Learning: The Treasure Within, 1996). URL verified live (2026-08-17). Used as a value frame, not a factual claim."

  - id: S-159
    title: "Beck — Cognitive Therapy and the Emotional Disorders"
    type: book
    organization: International Universities Press
    year: 1976
    domains: [D01]
    reviewed: true
    notes: "Aaron T. Beck (1976). Cognitive Therapy and the Emotional Disorders. International Universities Press. Cited in U.05.002 L01 for the cognitive-appraisal claim (thoughts/interpretations shape emotion), the founding basis of cognitive-behavioral therapy. Real, foundational text. No URL (print book)."

  - id: S-160
    title: "Ekman & Friesen — The Repertoire of Nonverbal Behavior"
    type: article
    url: https://doi.org/10.1515/semi.1969.1.1.49
    organization: Semiotica
    year: 1969
    domains: [D01]
    reviewed: true
    notes: "Ekman, P., & Friesen, W. V. (1969). The repertoire of nonverbal behavior: Categories, origins, usage, and coding. Semiotica, 1(1), 49–98. Cited in U.05.002 L03/L04 for 'display rules' — how the expression of feeling differs across families and cultures — and in U.07.001 L03/L04 (Feelings Shown, Hidden, and Valued; No Culture Is the Default) for the same display-rules concept. Real, foundational emotion-research article; the lessons correctly trace the concept to it and hold the non-ranking stance as a value, not a fact. Also cited in U.07.007 L05 (Gesture, Posture, Spacing) for the foundational idea that nonverbal behavior is patterned, learned, and varies across cultures — the basis for the lesson's 'we ask, we don't assume' stance."

  - id: S-161
    title: "Zehr — Changing Lenses (restorative justice)"
    type: book
    organization: Herald Press
    year: 1990
    domains: [D09]
    reviewed: true
    notes: "Howard Zehr (1990). Changing Lenses: A New Focus for Crime and Justice. Herald Press. Cited in U.05.002 L10 for the 'repair over punishment' restorative-justice framing. Real, seminal restorative-justice text; complements the IIRP frame (S-022). No URL (print book). Also cited in U.07.003 L03/L04 (Repair: Apologize, Listen, Agree; Practicing the Repair Conversation) for the repair-over-punishment framing; the lesson also names Diné (Navajo) hózhó (balance/harmony) and Indigenous peacemaking circles, concepts Zehr discusses in tracing restorative justice's Indigenous roots."

  - id: S-162
    title: "WHO — Child Growth Standards (toolkit)"
    type: website
    url: https://www.who.int/toolkits/child-growth-standards
    organization: World Health Organization
    year: 2006
    domains: [D03]
    reviewed: true
    notes: "Cited in U.05.003 L03 and L10 for the claim that human growth is measured against a range of normal, not a single number. URL verified live (2026-08-17): page presents the WHO Child Growth Standards developed from the WHO Multicentre Growth Reference Study (MGRS), with percentile growth curves (length/height-for-age, weight-for-age, BMI-for-age, etc.) and motor milestone windows of achievement, plus growth reference data for ages 5–19. The percentile-curve format directly supports the lesson's 'wide range of heights and weights are normal' framing, and the L03 claim that growth is shaped by genes, nutrition, and environment is standard. Supports the hedged general claim."

  - id: S-163
    title: "Kropotkin (1902) — Mutual Aid: A Factor of Evolution"
    type: book
    author: Peter Kropotkin
    organization: McClure Phillips & Co. (first English ed., 1902); Heinemann
    year: 1902
    domains: [D02]
    reviewed: true
    notes: "Cited in U.05.004 L09 (Mutual Aid Across Cultures and Times) for the framing that mutual aid — cooperation and reciprocity, not for pay but from belonging — is a widespread human practice. Real, foundational 1902 book: Peter Kropotkin's collection of anthropological essays (first serialized in The Nineteenth Century 1890–1896) arguing that mutual aid/cooperation, alongside competition, is a factor of evolution in animal and human societies past and present. The lesson's Resources note states the concept is 'named in' Kropotkin's book — accurate: Kropotkin is the canonical source who popularized 'mutual aid' as a term/theory. The lesson appropriately holds 'helping one another is good' as a value distinct from the factual claim that mutual-aid traditions are widespread and documented. No URL (print book; full text is public domain on Wikisource/Project Gutenberg). Also cited in U.07.003 L10 (Mutual Aid: Why We Help) as the canonical source for the term 'mutual aid,' held there as a description of a practice, not a claim that helping is good. Also cited in U.07.012 L05 (Capstone: Mutual Aid, Motives, and Celebration) for the same framing."

  - id: S-164
    title: "Communal-work (mutual-aid) traditions — harambee, gotong royong, mink'a/minga, barn-raising"
    type: website
    url: https://en.wikipedia.org/wiki/Communal_work
    organization: Wikipedia ("Communal work") — cross-checked against BBC Travel (harambee) and Britannica (barn raising)
    domains: [D02, D08]
    reviewed: true
    notes: "Cited in U.05.004 L09 (Mutual Aid Across Cultures and Times) for four named communal-help traditions. Verified 2026-08-17: (1) harambee — Swahili 'all pull together'; a Kenyan (East African) tradition of community self-help/fundraising events and Kenya's official motto — the lesson's 'in Kenya, people pull together … to build a school or help a family' is accurate; (2) gotong royong — Indonesian ethos of 'joint bearing of burdens'/mutual assistance, used to build village facilities (irrigation, roads, houses of worship) and run communal events — the lesson's 'neighbors share the work of a village' is accurate; (3) mink'a/minka/minga — an Inca/Andean tradition of communal, largely unpaid collective labor for community or family benefit, incl. harvesting potatoes, still practiced across Peru, Bolivia, Ecuador, Colombia, Chile — the lesson's 'neighbors farm terraces together, in a minga' is accurate (minga is the Hispanicized form); (4) barn raising — a documented North American communal-building tradition (associated esp. with Amish/Mennonite and other rural communities) — the lesson's 'neighbors gather to raise a family's barn in a day, and the favor returns' is accurate. Each is presented as one named tradition in one place, not as a universal 'all people in X do Y'; the lesson's Resources note correctly adds 'verify local details with community members.' Used as documentation of the mutual-aid examples, not a claim-level citation for any single statistic. Also cited in U.07.003 L10 (Mutual Aid: Why We Help) for the same four named traditions (harambee, gotong royong, mink'a/minga, barn raising), with the lesson's note to verify local details with community members. Also cited in U.07.012 L05 (Capstone: Mutual Aid, Motives, and Celebration) for the same four named traditions."

  - id: S-165
    title: "Daniels & Bright (eds.) — The World's Writing Systems"
    type: book
    author: Peter T. Daniels & William Bright (eds.)
    organization: Oxford University Press
    year: 1996
    domains: [D04]
    reviewed: true
    notes: "Peter T. Daniels & William Bright (eds.), The World's Writing Systems, Oxford University Press, 1996. The canonical scholarly reference for writing-system typology; the source of the 'alphabet / abjad / abugida / logographic (character)' classification used in U.05.005 L13 (Many Writing Systems). Daniels coined and standardized the terms 'abjad' and 'abugida.' No URL (print book). The lesson's four-type framing (alphabet, abjad, abugida, character script) is directly supported."

  - id: S-166
    title: "DeFrancis — The Chinese Language: Fact and Fantasy"
    type: book
    author: John DeFrancis
    organization: University of Hawai'i Press
    year: 1984
    domains: [D04]
    reviewed: true
    notes: "John DeFrancis, The Chinese Language: Fact and Fantasy, University of Hawai'i Press, 1984. Argues Chinese writing is morphosyllabic — each character stands for a syllable plus a morpheme (meaning), not a pure 'picture of an idea' — and debunks the 'ideographic myth.' Cited in U.05.005 L13 for the claim that 'Chinese characters mostly stand for meanings (morphemes), not just sounds.' The lesson's facilitator note already hedges this correctly (characters = morphemes, not 'just a meaning'). No URL (print book)."

  - id: S-167
    title: "Everett — Language: The Cultural Tool"
    type: book
    author: Daniel L. Everett
    organization: Pantheon Books
    year: 2012
    domains: [D04]
    reviewed: true
    notes: "Daniel L. Everett, Language: The Cultural Tool, Pantheon Books, 2012. Argues language is a tool shaped by culture and use, supporting U.05.005 L14's framing that 'words carry culture' and that the distinctions a language makes reflect what its speakers value. Everett is a real linguist/anthropologist (best known for the Pirahã work). Also cited in U.06.004 L13 (The Same Idea in Many Languages) for translation always gaining/losing and 'words carry culture.' Also cited in U.07.004 L12/L13/L14 (translation and interpretation; dialect and accent as natural, rule-governed, complete systems — no variety 'broken' or 'incorrect'). No URL (print book)."

  - id: S-168
    title: "Sapir & Whorf — language and thought (linguistic relativity)"
    type: book
    author: Edward Sapir (1929); Benjamin Lee Whorf (1956)
    organization: MIT Press (Whorf, Language, Thought, and Reality, ed. J. B. Carroll)
    year: 1956
    domains: [D04]
    reviewed: true
    notes: "Classic linguistic-relativity (Sapir–Whorf) tradition: Edward Sapir, 'The Status of Linguistics as a Science' (1929), and Benjamin Lee Whorf, Language, Thought, and Reality (MIT Press, 1956, ed. J. B. Carroll). Cited in U.05.005 L14 for the moderate idea that languages 'sort the world differently' and shape habitual thought. Note: the lesson uses only the moderate, well-supported form; the strong determinism form (language wholly determines thought) is largely rejected and is not claimed. Also cited in U.06.004 L13 for the moderate idea that languages 'sort the world differently,' so translation gains and loses. No URL (print book)."

  - id: S-169
    title: "WALS — Östen Dahl, 'Tea' (chapter 138)"
    type: website
    author: Östen Dahl
    url: https://wals.info/chapter/138
    organization: World Atlas of Language Structures (WALS Online; Dryer & Haspelmath, eds.)
    year: 2013
    domains: [D04]
    reviewed: true
    notes: "Verified live 2026-08-17 (wals.info/chapter/138). Östen Dahl, 'Tea,' WALS Online ch. 138. Maps the sources of words for 'tea': 'Words derived from Sinitic cha' (110 languages — the overland route, giving chai in Eastern Europe/Asia) vs 'Words derived from Min Nan Chinese te' (84 languages — via Dutch sea trade out of Amoy/Xiamen, giving thee/tea in much of Europe and former Dutch colonies). Directly supports U.05.005 L14's claim that the same drink 'spread by sea as tea and by land as chai.' Correctly attributed (WALS is a structural atlas; the tea/chai isogloss is its ch. 138, so the citation is on-point, not a misattribution). Also cited in U.07.004 L12 (Translation: Carrying Words Across Languages) for the tea/chai overland-vs-sea route claim (Sinitic cha → chai overland; Min Nan te → tea/thé/Tee by sea)."

  - id: S-170
    title: "IES — Improving Adolescent Literacy: Effective Classroom and Intervention Practices"
    type: report
    url: https://ies.ed.gov/ncee/wwc/practiceguide/8
    organization: Institute of Education Sciences, What Works Clearinghouse (panel chair Michael Kamil)
    year: 2008
    domains: [D04]
    reviewed: true
    notes: "Verified live 2026-08-17 (ies.ed.gov/ncee/wwc/practiceguide/8). WWC practice guide (Aug 2008). Recommendation 2 is 'Provide direct and explicit comprehension strategy instruction' — which supports U.05.005 L05/L06 (text structure: cause/effect, problem/solution), L07 (fact vs opinion), L08 (author's purpose/point of view), and L11 (gathering/corroborating information) as comprehension-strategy and text-structure instruction. Also cited in U.06.004 L05/L06 (citing text evidence; inference) and L07/L08 (fiction/poetry/nonfiction/drama genre shapes) for comprehension-strategy and text-structure instruction. General authority, not a page-level citation for any single statistic."

  - id: S-171
    title: "IES — Teaching Secondary Students to Write Effectively"
    type: report
    url: https://ies.ed.gov/ncee/wwc/practiceguide/22
    organization: Institute of Education Sciences, What Works Clearinghouse (panel chair Steve Graham)
    year: 2016
    domains: [D04]
    reviewed: true
    notes: "Verified live 2026-08-17 (ies.ed.gov/ncee/wwc/practiceguide/22; guide PDF at wwc_secondary_writing_110116.pdf returns HTTP 200). WWC practice guide (Nov 2016). Covers the writing process (plan/draft/revise/edit) and explicit strategy instruction, supporting U.05.005 L12 (writing a report in one's own words with citation). Note this is a *secondary* (grades 6–12) guide used here for a Grade-5 lesson as a general writing-pedagogy authority; the elementary counterpart is the 2012/2018 'Teaching Elementary School Students to Be Effective Writers' guide. Also cited in U.06.004 L09–L12 for argument writing and word-processing/collaborative writing at Grade 6 — the *secondary* guide is on-grade here (grades 6–12). Also cited in U.11.004 L10 (revision as re-seeing; peer feedback serving the work) and L11 (register/formality/audience as craft) — on-grade (grade 11) for the writing process (plan/draft/revise/edit). General authority."

  - id: S-172
    title: "Duke & Pearson — Effective Practices for Developing Reading Comprehension"
    type: article
    author: Nell K. Duke & P. David Pearson
    organization: International Reading Association (in What Research Has to Say About Reading Instruction, 3rd ed., Farstrup & Samuels, eds.)
    year: 2002
    domains: [D04]
    reviewed: true
    notes: "Duke, N. K., & Pearson, P. D. (2002). Effective Practices for Developing Reading Comprehension. In A. E. Farstrup & S. J. Samuels (eds.), What Research Has to Say About Reading Instruction (3rd ed., pp. 205–242). International Reading Association. Foundational synthesis of comprehension-strategy research (prediction, text-structure awareness, question generation, summarization, monitoring). Cited in U.05.005 L05/L06/L07/L08 for comprehension-strategy and text-structure instruction. Also cited in U.06.004 L01/L02/L05/L06/L07/L08 for comprehension-strategy and text-structure (genre) instruction. Real, widely cited, on-topic. No URL (print chapter)."

  - id: S-173
    title: "Marzano, Pickering & Pollock — Classroom Instruction That Works"
    type: book
    author: Robert J. Marzano, Debra J. Pickering & Jane E. Pollock
    organization: Association for Supervision and Curriculum Development (ASCD)
    year: 2001
    domains: [D04]
    reviewed: true
    notes: "Marzano, R. J., Pickering, D. J., & Pollock, J. E. (2001). Classroom Instruction That Works: Research-Based Strategies for Increasing Student Achievement. ASCD. 'Summarizing and note taking' is one of its nine research-based instructional strategies (high effect size). Cited in U.05.005 L04 (Supporting Reasons and a Conclusion) for the claim that clear organization and summarizing support recall. Real and on-topic as a general authority. No URL (print book)."

  - id: S-174
    title: "International Listening Association — Listening Skills resources"
    type: website
    url: https://listen.org/
    organization: International Listening Association (ILA)
    domains: [D04]
    reviewed: true
    notes: "Verified live 2026-08-17 (listen.org). The ILA is the real professional body for listening scholarship; its site has a 'Listening Skills' section ('The Importance of Listening,' a 'Listening Toolkit,' and a 'Listening Definition'). Cited in U.05.005 L01 (Paraphrase a Speaker's Points) as a classroom-friendly framing for paraphrasing/clarifying as active-listening skills, alongside CASEL (S-001). The lesson names an ILA 'Listening Skills' primer generically; the organization and its Listening Skills area exist, so the citation is real, though it is best read as a general authority rather than a specific page. Consider adding a direct link to the 'Listening Toolkit' page if a page-level citation is desired. Also cited in U.06.004 L01 (Hear the Main Argument) as a classroom-friendly framing for separating a main claim from its support."

  - id: S-175
    title: "ISO 80000-1 — Quantities and units, Part 1: General (decimal sign)"
    type: other
    url: https://www.iso.org/standard/76921.html
    organization: International Organization for Standardization (ISO)
    year: 2022
    domains: [D05]
    reviewed: true
    notes: "Cited in U.05.006 L01 for the claim that a comma serves as the decimal separator in many countries. ISO 80000-1:2022 stipulates 'The decimal sign is either a comma or a point on the line' (with an ISO/IEC-directives note that all ISO standards use the comma). This is the correct part (Part 1: General) for the decimal-sign rule — the lesson originally cited ISO 80000-2 (Part 2: Mathematics, which covers mathematical signs and symbols), corrected to ISO 80000-1 during fact-check. The same convention is affirmed by CGPM Resolution 10 (2003). On-topic and authoritative for the lesson's 'comma vs point' convention note."

  - id: S-176
    title: National Geographic Education — Role of Keystone Species in an Ecosystem
    type: website
    url: https://education.nationalgeographic.org/resource/role-keystone-species-ecosystem/
    organization: National Geographic Society
    domains: [D06]
    reviewed: true
    notes: "Cited in U.05.007 L02 for the sea-otter–urchin–kelp example. URL verified live (2026-08-17): the page defines a keystone species and a trophic cascade ('a top-down trophic cascade describes changes that result from the removal of an ecosystem's top predator'), and its Fast Facts state 'Kelp is a keystone host. Kelp forests provide stabilizing shelter for sea otters, and nutrient-rich food for their prey, such as fish and sea urchins.' Supports the lesson's well-documented sea-otter/urchin/kelp chain (Estes & Palmisano's classic keystone-predator work). Replaces the broken citation to education.nationalgeographic.org/resource/kelp-forest/ (404)."

  - id: S-177
    title: Encyclopaedia Britannica — Heredity
    type: website
    url: https://www.britannica.com/science/heredity-genetics
    organization: Encyclopaedia Britannica
    domains: [D06]
    reviewed: true
    notes: "Cited in U.05.007 L03/L04 (traits pass from parents to offspring; traits vary within a family). URL verified live (2026-08-17): the 'Heredity' article covers Mendelian genetics, chromosomes and genes, polygenic inheritance, and 'Heredity and environment' — on-topic for the lessons' claims that offspring receive trait instructions from both parents and that offspring of the same parents vary. Authoritative general reference; the lessons appropriately defer the gene-level mechanism to Grade 8."

  - id: S-178
    title: FAO — Commission on Genetic Resources for Food and Agriculture (CGRFA)
    type: website
    url: https://www.fao.org/cgrfa/en/
    organization: Food and Agriculture Organization of the United Nations (FAO)
    domains: [D03, D06]
    reviewed: true
    notes: "Cited in U.05.007 L03 for the claim that selecting plants and animals with valued traits is a documented, worldwide agricultural practice. URL verified live (2026-08-17): the CGRFA homepage frames 'biodiversity for food and agriculture' as 'among the Earth's most important resources' and the Commission as conserving and sustainably using it — a general authority for crop/animal genetic resources. The lesson's claim that people everywhere selected seeds and animals with useful traits (rice in Asia, maize in the Americas, cattle in Africa/Middle East) is standard, accurate agricultural history; this page is a general authority, not a claim-level citation for any single statistic."

  - id: S-179
    title: National Science Teaching Association (NSTA)
    type: website
    url: https://www.nsta.org/
    organization: National Science Teaching Association
    domains: [D06]
    reviewed: true
    notes: "Cited in U.05.007 L04 for the 'heredity and variation of traits' life-science progression. URL verified live (2026-08-17): nsta.org is the live homepage of the real professional association for K–12 science teaching, which promotes the NGSS life-science progression (LS3: Heredity — Inheritance and Variation of Traits). Note: the Next Generation Science Standards themselves are published by Achieve (with NSTA among the writing partners), so this citation is best read as a general authority for the heredity/variation progression, not a claim-level citation. The underlying claim (variation within families is standard elementary life science) is accurate."

  - id: S-180
    title: NASA Space Place — What Is Gravity?
    type: website
    url: https://spaceplace.nasa.gov/what-is-gravity/en/
    organization: NASA
    domains: [D06]
    reviewed: true
    notes: "Cited in U.05.007 L06 (gravity as a force that acts at a distance). URL verified live (2026-08-17). States verbatim: 'Gravity is the force by which a planet or other body draws objects toward its center'; 'an invisible force that pulls objects toward each other'; 'Earth's gravity is what keeps you on the ground and what makes things fall'; and 'what keeps the moon in orbit around Earth.' Directly supports the lesson's claims (pull toward Earth's center, acts without touching, holds the Moon in orbit). The lesson correctly defers the mass-dependence of gravity to Grade 7."

  - id: S-181
    title: NASA — Earth's Moon
    type: website
    url: https://science.nasa.gov/moon/
    organization: NASA
    domains: [D06]
    reviewed: true
    notes: "Cited in U.05.007 L08 (moon phases and the Earth–Moon–Sun system). URL verified live (2026-08-17): the 'Earth's Moon' hub has 'Moon Phases', 'Phases', 'Eclipses', and 'Tides' sections and states the phase cycle is 'new moon, waxing crescent, first quarter, waxing gibbous, full moon, waning gibbous, third quarter, and waning crescent.' Supports the lesson's phase-order and Earth–Moon–Sun claims. (The lesson labels it 'The Moon'; the page's formal title is 'Earth's Moon.')"

  - id: S-182
    title: NASA Space Place — What Are the Moon's Phases?
    type: website
    url: https://spaceplace.nasa.gov/moon-phases/en/
    organization: NASA
    domains: [D06]
    reviewed: true
    notes: "Cited in U.05.007 L08 (moon phases; the Moon reflects sunlight). URL verified live (2026-08-17). States verbatim: 'The Moon does not produce its own light'; 'moonlight is actually just sunlight reflecting off of the Moon's surface'; 'it always illuminates... one half of the Moon'; and that our view of the illuminated half changes as the Moon orbits, giving the eight phases (new, waxing crescent, first quarter, waxing gibbous, full, waning gibbous, third quarter, waning crescent), with ~27.3 days to orbit and ~29.5 days new-moon-to-new-moon. Supports every phase claim in the lesson, including its '29–30 days' phrasing and its explicit correction of the 'Earth's shadow makes the phases' misconception."

  - id: S-183
    title: NASA Space Place — Lunar Eclipses and Solar Eclipses
    type: website
    url: https://spaceplace.nasa.gov/eclipses/en/
    organization: NASA
    domains: [D06]
    reviewed: true
    notes: "Cited in U.05.007 L09 (solar and lunar eclipses). URL verified live (2026-08-17). States: 'A solar eclipse happens when the Moon gets in the way of the Sun's light and casts its shadow on Earth'; 'During a lunar eclipse, Earth gets in the way of the Sun's light hitting the Moon'; the Moon can look reddish (atmosphere); and 'The Moon's path around Earth is tilted compared to Earth's orbit around the Sun' — which is why there isn't an eclipse every month. Also gives the eye-safety caution (never look directly at the Sun). Supports every eclipse claim in the lesson. (The lesson's original label 'What is an eclipse?' was corrected to the page's actual title.)"

  - id: S-184
    title: NASA — Eclipses
    type: website
    url: https://science.nasa.gov/eclipses/
    organization: NASA
    domains: [D06]
    reviewed: true
    notes: "Cited in U.05.007 L09 (eclipse geometry and predictability). URL verified live (2026-08-17). States verbatim in 'Quick Facts': 'Lunar eclipses occur during the full moon phase, and solar eclipses occur during the new moon phase'; covers eclipse seasons, tilted-orbit rarity, pinhole-projector and eclipse-glasses safety, and the Anyang (China) eclipse records used to measure Earth's changing rotation — directly supporting the lesson's 'solar at new moon, lunar at full moon' claim, its rarity explanation, and its note that people have recorded and predicted eclipses for thousands of years across cultures."

  - id: S-185
    title: National Geographic Education — Erosion
    type: website
    url: https://education.nationalgeographic.org/resource/erosion/
    organization: National Geographic Society
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.05.007 L10 (slow surface change: weathering, erosion, deposition). URL verified live (2026-08-17). States 'Erosion is the geological process in which earthen materials are worn away and transported by natural forces such as wind or water'; 'A similar process, weathering, breaks down or dissolves rock, but does not involve movement'; 'Erosion is the opposite of deposition'; and covers erosion by water (rivers carving valleys/canyons, e.g., Fish River Canyon), wind, and ice/glaciers. Supports every slow-process claim in the lesson, including the river-carves-a-canyon-over-long-times claim."

  - id: S-186
    title: National Geographic Education — Plate Tectonics
    type: website
    url: https://education.nationalgeographic.org/resource/plate-tectonics/
    organization: National Geographic Society
    domains: [D06]
    reviewed: true
    notes: "Cited in U.05.007 L10 (earthquakes and volcanoes occur where plates meet). URL verified live (2026-08-17). States the theory 'explains how major landforms are created... including mountain building events, volcanoes, and earthquakes'; Earth's outer layer 'is broken into large rocky plates' that 'move relative to each other'; and that plates interact at boundaries (subduction zones, rifts). Supports the lesson's claim that most earthquakes and volcanoes happen where plates meet (the lesson adds the Ring of Fire example, standard and accurate). Grades 9–12 entry, used here only for the boundary-location pattern, which is grade-appropriate."

  - id: S-187
    title: BBC Bitesize (KS2, NI) — What is a magnet?
    type: website
    url: https://www.bbc.co.uk/bitesize/articles/zpvcrdm
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.05.007 L07 (magnets attract and repel; compass points north). URL verified live (2026-08-17). States: 'Even if the magnets aren't touching, they can exert a force on each other'; 'The opposite poles of a magnet attract one another, and poles that are the same... repel one another'; and 'Sailors have been using magnets in compasses to navigate for hundreds of years. If the magnets can move freely, it will always show which way is north.' Directly supports the lesson's attract/repel, acts-at-a-distance, and compass claims. Replaces the broken citation to spaceplace.nasa.gov/magnets/en/ (404 — NASA Space Place has no such page)."

  - id: S-188
    title: "Smithsonian Folkways Recordings"
    type: website
    url: https://folkways.si.edu/
    organization: Smithsonian Folkways Recordings (Smithsonian Institution)
    domains: [D07]
    reviewed: true
    notes: "Cited in U.05.008 L04/L05 (tools for teaching; performing with care) and L06 (how music reflects place) for world music recordings and teaching notes, including Andean panpipes and West African drumming. Real, reputable Smithsonian record label dedicated to folk and traditional music from around the world; folkways.si.edu returns 403 to automated clients but serves browsers (verified 2026-08-17). The lesson's musical claims it is paired with — Andean siku panpipes played in interlocking pairs and West African djembe drumming with layered rhythms and call-and-response — are standard, accurately attributed traditions; Folkways is cited as a general source of respectful recordings and teaching notes, not as a claim-level citation. Also cited in U.07.007 L03/L04 (sound carrying meaning across world traditions; dynamics, phrasing, and ensemble in world music, including call-and-response and interlocking rhythms)."

  - id: S-189
    title: "Kennedy Center — Education (arts education resources)"
    type: website
    url: https://www.kennedy-center.org/education/
    organization: The John F. Kennedy Center for the Performing Arts
    domains: [D07]
    reviewed: true
    notes: "Cited in U.05.008 L07/L08 for classroom-friendly framing of dance and movement traditions. Real, reputable arts-education hub; URL verified live (2026-08-17) — the page describes a 'Digital Resources Library of lesson plans, activities, classroom strategies, and arts-focused media' for educators. Used as a general pedagogical authority for presenting dance traditions respectfully, not as a claim-level citation for any single tradition (the haka/Bharatanatyam/capoeira descriptions in L08 are standard and independently accurate). Also cited in U.07.007 L05 (gesture, posture, spacing) and L06 (timing, expression, ensemble) for movement-and-dance pedagogy presenting traditions with respect."

  - id: S-190
    title: "Smithsonian Science Education Center"
    type: website
    url: https://ssec.si.edu/
    organization: Smithsonian Science Education Center (Smithsonian Institution)
    domains: [D07, D10]
    reviewed: true
    notes: "Cited in U.05.008 L09 (design and build to solve a real problem) for the engineering design cycle. Real, reputable Smithsonian K-12 STEM education center; URL verified live (2026-08-17) — its offerings include 'Smithsonian Science for Makerspaces' and 'STEM, Manufacturing and Design Activities,' consistent with an elementary design/build/improve cycle. The lesson's design-cycle framing (name the problem → imagine → choose materials → build → test → improve) is standard elementary engineering practice (cf. the registered TeachEngineering source S-150). General authority, not a claim-level citation. Also cited in U.07.007 L08 for the engineering/design-cycle framing of choosing and comparing materials."

  - id: S-191
    title: "National Geographic Education"
    type: website
    url: https://education.nationalgeographic.org/
    organization: National Geographic Society
    domains: [D07, D08, D10]
    reviewed: true
    notes: "Cited in U.05.008 L10 (compare designs for different climates) for classroom-friendly framing of how environment shapes human shelters and adaptation. Real, reputable National Geographic Society education resource; the index page is live (2026-08-17). Used as a general authority, not a claim-level citation; the specific shelter claims in L10 (igloo snow dome for Arctic cold; felt yurt/ger for the steppe; stilt house for floodplains; adobe/mud-brick for dry heat; palm thatch for tropical rain) are standard, well-documented, and non-ranking. (Specific National Geographic Education resource pages are registered separately under their own IDs.)"

  - id: S-192
    title: "The Metropolitan Museum of Art — #MetKids"
    type: website
    url: https://www.metmuseum.org/art/online-features/metkids/
    organization: The Metropolitan Museum of Art
    domains: [D07]
    reviewed: true
    notes: "Cited in U.05.008 L01/L02 (plan and complete an artwork) as a kid-friendly art resource for seeing how artists plan and make work. Real Met Museum online feature for children (metmuseum.org/art/online-features/metkids/); the page is a JS-driven interactive and serves browsers, though automated clients receive a minimal shell (verified 2026-08-17). Used as a general, age-appropriate engagement resource, not a claim-level citation; the lessons make no factual claims that depend on it."

  - id: S-193
    title: WHO — Micronutrients (health topic)
    type: website
    url: https://www.who.int/health-topics/micronutrients
    organization: World Health Organization
    domains: [D03]
    reviewed: true
    notes: "Cited in U.05.009 L02 (vitamins/minerals/water as protectors and regulators) and L08 (unit review). URL verified live (2026-08-17): states 'Micronutrients are vitamins and minerals needed by the body in very small amounts'; 'A lack of iron, folate and vitamins B12 and A can lead to anaemia'; anaemia is 'causing fatigue'; and 'Vitamin A deficiency is the leading cause of preventable blindness in children.' Supports the lessons' claims that vitamins protect/heal and minerals build/regulate, and that too little iron causes tiredness. On-topic and authoritative."

  - id: S-194
    title: WHO — Anaemia fact sheet
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/anaemia
    organization: World Health Organization
    year: 2025
    domains: [D03]
    reviewed: true
    notes: "Cited in U.05.009 L03 (too little iron over time → tiredness). URL verified live (2026-08-17); page dated 10 Feb 2025. States 'Anaemia occurs when there isn't enough haemoglobin in the body to carry oxygen to the organs and tissues'; 'Anaemia causes symptoms such as fatigue'; common symptoms include 'tiredness'; and 'Iron deficiency... is considered the most common nutritional deficiency leading to anaemia.' Directly supports the lesson's claim that too little iron over time leads to iron-deficiency anaemia whose main symptom is fatigue."

  - id: S-195
    title: ITU — Recommendation E.161.1 (emergency number guidelines)
    type: other
    url: https://www.itu.int/rec/T-REC-E.161.1
    organization: International Telecommunication Union (ITU)
    year: 2008
    domains: [D03]
    reviewed: true
    notes: "Cited in U.05.009 L05 (emergency numbers are country-specific). URL verified live (2026-08-17): ITU-T Recommendation E.161.1 'Guidelines to select Emergency Number for public telecommunications networks' is the ITU instrument for emergency-number selection and standardization. Supports the lesson's general claim that emergency numbers are set per country (no single universal number) and its hedged, correctly attributed examples: 112 (much of Europe / EU-wide), 999 (United Kingdom), 000 (Australia), 911 (United States and Canada), and 119/110/10111 elsewhere — all accurate."

  - id: S-196
    title: UNICEF — Violence against children (child protection)
    type: website
    url: https://www.unicef.org/protection/violence-against-children
    organization: UNICEF (United Nations Children's Fund)
    domains: [D03]
    reviewed: true
    notes: "Cited in U.05.009 L07/L08 (body autonomy/consent; telling a trusted adult; a child's right to protection). URL verified live (2026-08-17): UNICEF's child-protection program page on violence against children. States violence against children 'happens in every country and any setting' and is grounded in the Convention on the Rights of the Child; frames protective adult relationships and disclosure to a trusted adult as central to child safety. On-topic as a general authority for the lessons' consent/safety framing (a protective value frame consistent with UN CRC Art. 19, not a claim-level citation)."

  - id: S-197
    title: British Museum — Egypt collection
    type: website
    url: https://www.britishmuseum.org/collection/egypt
    organization: The British Museum
    domains: [D08]
    reviewed: true
    notes: "Cited in U.05.010 L01/L02 for the standard dates of ancient Egypt (unification ~3100 BCE; Great Pyramid at Giza ~2600 BCE; New Kingdom ~1500 BCE; Roman rule from 30 BCE; the Nile's annual flood and irrigation). URL verified live (2026-08-17): the British Museum 'Egypt' collection section is real (title 'Egypt | British Museum'), covering hieroglyphs, the Rosetta Stone, and 'the 5,000-year story' of Egyptian civilisation. The cited dates are standard in the archaeological record; the lesson correctly flags them as approximations. The British Museum is also cited (general authority) for cuneiform writing (L03) and Yoruba culture (L04)."

  - id: S-198
    title: UNESCO World Heritage Centre — Archaeological Ruins at Moenjodaro (Dossier 138)
    type: website
    url: https://whc.unesco.org/en/list/138/
    organization: UNESCO World Heritage Centre
    domains: [D08]
    reviewed: true
    notes: "Cited in U.05.010 L01/L02 for the Indus Valley city of Mohenjo-daro and the mature Harappan phase (~2600–1900 BCE), its grid streets and drainage. URL verified live (2026-08-17): Dossier 138 is 'Archaeological Ruins at Moenjodaro' (Pakistan, inscribed 1980, criteria ii/iii). Its 'Brief synthesis' states the property 'represents the metropolis of Indus civilization' and describes 'the most ancient planned city', 'streets intersecting each other at right angles', and an 'elaborate drainage system' — supporting the lessons' grid-street/drainage and planned-city claims. Note: UNESCO phrases the civilization as flourishing 'between 2,500-1,500 BC' (a looser figure); the lesson's 'mature phase around 2600–1900 BCE' is the standard, more precise archaeological consensus and is not contradicted. Spelling varies (Moenjodaro vs Mohenjo-daro); both are accepted."

  - id: S-199
    title: UNESCO World Heritage Centre — Great Zimbabwe National Monument (Dossier 364)
    type: website
    url: https://whc.unesco.org/en/list/364/
    organization: UNESCO World Heritage Centre
    domains: [D08]
    reviewed: true
    notes: "Cited in U.05.010 L05 and U.06.009 L02 for Great Zimbabwe as a stone city of the 11th–15th centuries CE built without mortar and the center of a trading kingdom. URL verified live (2026-08-17): Dossier 364 is 'Great Zimbabwe National Monument' (Zimbabwe, inscribed 1986, criteria i/iii/vi). States the ruins are 'a unique testimony to the Bantu civilization of the Shona between the 11th and 15th centuries', that the property was 'built between 1100 and 1450 AD', was 'an important trading centre' (glass beads/porcelain from China and Persia, gold and Arab coins from Kilwa), and describes 'dry stone masonry walls' (no mortar). Directly supports the lesson's claims. The UNESCO description also notes the now-discredited colonial 'Queen of Sheba' legend as an age-old legend — the lesson correctly presents Great Zimbabwe as an African achievement, with no such attribution."

  - id: S-200
    title: UNESCO World Heritage Centre — Historic Sanctuary of Machu Picchu (Dossier 274)
    type: website
    url: https://whc.unesco.org/en/list/274/
    organization: UNESCO World Heritage Centre
    domains: [D08]
    reviewed: true
    notes: "Cited in U.05.010 L05 and U.06.009 L07 for Machu Picchu as a stone city built high in the Andes with tightly fitted stones and for Andean terrace agriculture. URL verified live (2026-08-17): Dossier 274 is 'Historic Sanctuary of Machu Picchu' (Peru, inscribed 1983, mixed criteria i/iii/vii/ix). States Machu Picchu 'stands 2,430 m above sea-level' on 'the eastern slopes of the Andes', was 'Built in the fifteenth century' by the Inca Empire, and that 'its giant walls, terraces and ramps seem as if they have been cut naturally in the continuous rock escarpments' — supporting the lesson's claims. The lesson's 'fitted so tightly the stones still stand' is the standard, accurate description of Inca ashlar masonry."

  - id: S-201
    title: UNESCO — Memory of the World (Timbuktu manuscripts)
    type: website
    url: https://www.unesco.org/en/memory-world
    organization: UNESCO
    domains: [D08]
    reviewed: true
    notes: "Cited in U.05.010 L05 and U.06.009 L05 for Timbuktu's manuscripts and its role as a center of learning. The Timbuktu manuscripts (Mali) were inscribed on UNESCO's Memory of the World International Register in 2017, and Timbuktu's scholarly tradition (astronomy, mathematics, medicine, law) is well documented. Note: the lesson originally cited the retired en.unesco.org/memoryoftheworld URL, corrected during fact-check to the current Memory of the World programme page (www.unesco.org/en/memory-world); en.unesco.org was retired after UNESCO's 2022 migration to unesco.org. (unesco.org was not reachable from the fact-checker's environment on 2026-08-17, but the programme and the inscription are real and well established.)"

  - id: S-202
    title: Te Ara — The Encyclopedia of New Zealand (Ranginui and Papatūānuku)
    type: website
    url: https://teara.govt.nz
    organization: Te Ara — The Encyclopedia of New Zealand (Manatū Taonga, Ministry for Culture and Heritage)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.05.010 L04 for the Māori account of Ranginui (sky) and Papatūānuku (earth) and their separation, and in U.06.009 L04 for Māori settlement of Aotearoa and the centrality of whakapapa (genealogy). Te Ara is the authoritative national encyclopedia of Aotearoa New Zealand, and its 'Creation' story (teara.govt.nz/en/creation) documents the separation of Ranginui and Papatūānuku as told across iwi. Site returns 403 to automated clients but is real and canonical (verified 2026-08-17). The lesson correctly names the story as a living tradition told across iwi, with details varying by community."

  - id: S-203
    title: Smithsonian National Museum of the American Indian — Haudenosaunee creation
    type: website
    url: https://americanindian.si.edu/
    organization: Smithsonian Institution (National Museum of the American Indian)
    domains: [D08, D09]
    reviewed: true
    notes: "Cited in U.05.010 L04 for the Haudenosaunee account of Sky Woman and Turtle Island, and in U.06.009 L09/L10 for the Haudenosaunee (Iroquois) Confederacy, its Great Law of Peace, its consensus-based councils, and the role of clan mothers. NMAI is the authoritative Smithsonian museum for Native American/Indigenous histories, and its educational materials (including the Native Knowledge 360° project) document Haudenosaunee creation traditions, including Sky Woman and the land grown on Turtle's back. Site returns 403 to automated clients but is real and canonical (verified 2026-08-17). The lesson correctly presents the story as a living tradition of the Haudenosaunee Confederacy. Also cited in U.06.010 L06 (Democracy, Autocracy & Other Ways of Deciding) alongside S-142 for the Haudenosaunee Confederacy's consensus-based councils as a living way of deciding."

  - id: S-204
    title: Smithsonian Institution — writing systems, the wheel, and Maya astronomy
    type: website
    url: https://www.si.edu/
    organization: Smithsonian Institution
    domains: [D08]
    reviewed: true
    notes: "Cited in U.05.010 L03 (writing emerged independently in Mesopotamia, Egypt, China, and Mesoamerica; the wheel ~3500 BCE in Mesopotamia and on toys but not for transport in the Americas) and L05 (Maya astronomy and the calendar), and in U.06.009 L06 (the invention and spread of paper) and L08 (the Columbian Exchange). These are standard, accurately stated facts: cuneiform ~3200 BCE, Egyptian hieroglyphs, Chinese oracle-bone script, and Maya glyphs are independent writing traditions; the wheel appears in the Americas only on toys, in part because large draft animals were absent; and the Maya accurately recorded Venus and the Sun and built calendars (e.g., the Dresden Codex Venus table). The Smithsonian (si.edu, incl. its museums and magazine) is a general authority for these claims, not a page-level citation. Site returns 403 to automated clients but is real (verified 2026-08-17)."

  - id: S-205
    title: Nobel Prize — Mahatma Gandhi, the missing laureate
    type: website
    url: https://www.nobelprize.org/prizes/themes/mahatma-gandhi-the-missing-laureate/
    organization: Nobel Prize Outreach / Nobel Foundation
    domains: [D08]
    reviewed: true
    notes: "Cited in U.05.010 L08 and U.06.009 L11 for the 1930 Salt March and the Indian independence movement (1947). URL verified live (2026-08-17): the NobelPrize.org article 'Mahatma Gandhi, the missing laureate' (by Øyvind Tønnesson) documents Gandhi as the 20th century's strongest symbol of non-violence and his satyagraha method of non-violently breaking unjust laws, though it does not give a blow-by-blow of the Salt March itself. The Salt March's specifics (March–April 1930, Gandhi's march to Dandi to make salt in defiance of the salt tax) are factual and are more precisely sourced in the already-registered Britannica 'Salt March' entry (S-087). This Nobel page functions as a general authority on Gandhi's non-violence; the lesson's claim is accurate."

  - id: S-206
    title: National Museum of Australia — Wave Hill Walk-Off (Defining Moments)
    type: website
    url: https://www.nma.gov.au/defining-moments/resources/wave-hill-walk-off
    organization: National Museum of Australia
    domains: [D08]
    reviewed: true
    notes: "Cited in U.05.010 L08 for the 1966 Wave Hill walk-off by Gurindji stockworkers led by Vincent Lingiari. URL verified live (2026-08-17): the NMA 'Defining Moments' page states 'On 23 August 1966, about 200 Gurindji stockmen, domestic workers and their families initiated strike action at Wave Hill station', that it was 'led by Vincent Lingiari', sought fair pay and the return of their homelands, and 'led to the return of a portion of their homelands to the Gurindji people in 1975'. Directly supports every element of the lesson's claim (1966, Gurindji, Lingiari, fair pay and land, land eventually returned)."

  - id: S-207
    title: UNESCO — The Indian Ocean, a shared heritage
    type: website
    url: https://www.unesco.org/en/silk-roads
    organization: UNESCO
    domains: [D08]
    reviewed: true
    notes: "Cited in U.05.010 L07 as the frame for the Indian Ocean trade network — driven by monsoon winds and sailed by dhows with lateen sails, connecting East Africa, Arabia, India, Southeast Asia, and China, and moving goods, ideas, plants, and animals. UNESCO's maritime heritage / Silk Roads programme frames the Indian Ocean as a shared maritime space of exchange across cultures, and the monsoon-dhow network is a widely documented historical pattern. This is cited as a general authority/frame, not a page-level citation for any single statistic. The lesson correctly frames the network as mutual exchange between trading partners (non-colonial)."

  - id: S-208
    title: Archaeological Survey of India — Indus Valley civilization
    type: website
    url: https://asi.nic.in/
    organization: Archaeological Survey of India (Government of India)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.05.010 L01 for the Indus Valley civilization's mature phase and its cities Harappa and Mohenjo-daro. URL verified live (2026-08-17, HTTP 200). ASI is the authoritative Indian government body for archaeological survey and heritage, and has long documented the Indus (Harappan) civilization and its sites. Used as a general authority alongside the UNESCO Mohenjo-daro listing (S-198), not a page-level citation."

  - id: S-209
    title: "Adiele Afigbo — The Warrant Chiefs / Aba Women's War (1929)"
    type: book
    author: Adiele Eberechukwu Afigbo
    organization: "Longman Nigeria (The Warrant Chiefs: Indirect Rule in Southeastern Nigeria, 1891–1929)"
    year: 1972
    domains: [D08]
    reviewed: true
    notes: "Cited in U.05.010 L08 for the 1929 Aba Women's War in southeastern Nigeria. Adiele Afigbo (1937–2009) was a leading Nigerian historian whose work on indirect rule and the warrant chiefs directly addresses the taxation and colonial-rule grievances behind the 1929 women's uprising (variously 'Women's War' / 'Aba Women's War'; the older colonial label 'Aba Riots' is now avoided). The event is real and accurately dated to November–December 1929, in which thousands of Igbo and Ibibio women organized against unfair taxation and the warrant-chief system. The lesson uses the preferred 'Aba Women's War' name and is accurate. No URL (print book)."

  - id: S-210
    title: CGAP — Financial Inclusion (mobile money / M-Pesa)
    type: website
    url: https://www.cgap.org/
    organization: CGAP (Consultative Group to Assist the Poor), housed at the World Bank
    domains: [D10]
    reviewed: true
    notes: "Cited in U.05.012 L02 for the claim that mobile money (e.g., M-Pesa) grew where bank branches were scarce, letting people send, save, and pay by phone. URL verified live (2026-08-17): cgap.org identifies CGAP as 'an independent think tank that works to advance the lives of poor people, especially women, through financial inclusion. Housed at the World Bank.' CGAP is the authoritative research body on digital financial services for the poor and has published extensively on M-Pesa (launched 2007 in Kenya by Safaricom/Vodafone) as mobile money that spread where formal bank access was limited. Supports the lesson's accurately-hedged mobile-money claim; the lesson holds the 'each use fits its place' framing as a value, not a fact."

  - id: S-211
    title: World Bank — Financial Inclusion (mobile money / digital financial services)
    type: website
    url: https://www.worldbank.org/en/topic/financialinclusion
    organization: World Bank Group
    domains: [D10]
    reviewed: true
    notes: "Cited in U.05.012 L01 (phones reshaped daily communication, with the ITU) and L02 (mobile money grew where bank branches were scarce). URL verified live (2026-08-17): the Financial Inclusion topic page states 'Digital financial services (DFS), enabled by fintech, are lowering costs, increasing speed, security, and transparency of transactions, enabling access for underserved sections' and 'As of early 2020, there were over 850 million registered mobile money accounts across 90 countries.' Supports the mobile-money/phone daily-life claims. Note: for the phone-spread history the lesson co-cites the ITU (already registered: S-128, S-180), whose role as the UN telecom agency publishing mobile statistics is accurate."

  - id: S-212
    title: USGS — Water Science School (The Water Cycle)
    type: website
    url: https://www.usgs.gov/special-topics/water-science-school/science/fundamentals-water-cycle
    organization: U.S. Geological Survey (U.S. Department of the Interior)
    domains: [D10]
    reviewed: true
    notes: "Cited in U.05.012 L06 (and U.05.012 L04 for the ~71% ocean-coverage figure). URL verified live (2026-08-17): the USGS Water Science School 'Water cycle' page states the cycle is driven by 'energy from the sun and the force of gravity', that the sun's energy causes evaporation and gravity causes water to flow downward and rain/snow/hail to fall, and that water moves via evaporation, evapotranspiration, condensation, precipitation, runoff/streamflow, and infiltration/groundwater; it also states 'Oceans store 96% of all water on Earth' and (quoting NASA) that water 'covers 75% of the Earth's surface.' Supports every factual claim in L06 (evaporation→condensation→precipitation→collection; sun up/gravity down; water reused, not made new) and the lesson's conservation-of-matter framing. US-centric agency but the water cycle is standard global elementary science."

  - id: S-213
    title: NASA — GPM Precipitation Education (The Water Cycle)
    type: website
    url: https://gpm.nasa.gov/education/water-cycle
    organization: NASA (Global Precipitation Measurement mission, Goddard Space Flight Center)
    domains: [D10]
    reviewed: true
    notes: "Cited in U.05.012 L06 as 'NASA Earth science' documenting the water cycle. URL verified live (2026-08-17): the NASA GPM 'The Water Cycle' page states verbatim 'The water cycle describes how water evaporates from the surface of the earth, rises into the atmosphere, cools and condenses into rain or snow in clouds, and falls again to the surface as precipitation. The water falling on land collects in rivers and lakes, soil, and porous layers of rock, and much of it flows back into the oceans, where it will once more evaporate.' Directly supports the lesson's cycle path, and the page also links a 'NASA Earth Science: The Water Cycle' article. Complements S-212 (USGS)."

  - id: S-214
    title: NOAA — How many oceans are there? (ocean covers 71% of Earth)
    type: website
    url: https://oceanservice.noaa.gov/facts/howmanyoceans.html
    organization: National Oceanic and Atmospheric Administration (NOAA), National Ocean Service
    domains: [D10]
    reviewed: true
    notes: "Cited in U.05.012 L04 for the claim that oceans cover roughly 70–71% of Earth's surface (the lesson's worked example of two sources agreeing on ~seven-tenths and differing only on the exact number). URL verified live (2026-08-17): the NOAA page states verbatim that 'the vast body of water that covers 71 percent of the Earth is geographically divided into distinct named regions.' Confirms the 71% figure; USGS (S-212) confirms the same ballpark ('about 70%' in many references), which is exactly why the lesson uses it as an agree-with-a-small-gap example. The lesson is careful to say the exact number stays 'open,' which is honest about rounding differences across sources."

  - id: S-215
    title: NOAA — What is coral bleaching?
    type: website
    url: https://oceanservice.noaa.gov/facts/coral_bleach.html
    organization: National Oceanic and Atmospheric Administration (NOAA), National Ocean Service
    domains: [D10]
    reviewed: true
    notes: "Cited in U.05.012 L07 for coral bleaching in the coral-reef ripple card. URL verified live (2026-08-17): the NOAA page states 'When corals are stressed by changes in conditions such as temperature, light, or nutrients, they expel the symbiotic algae living in their tissues, causing them to turn completely white' and 'Warmer water temperatures can result in coral bleaching.' Supports the lesson's claim that when a coral bleaches, the fish that depend on the reef decline — a standard, accurately-stated ecology ripple, not overstated."

  - id: S-216
    title: UNEP — Plastic Pollution
    type: website
    url: https://www.unep.org/plastic-pollution
    organization: United Nations Environment Programme (UNEP)
    domains: [D10, D06]
    reviewed: true
    notes: "Cited in U.05.012 L08 (plastic's path from land to rivers to oceans and harm to wildlife; the reduce-waste ladder refuse/reuse/recycle/clean-up) and L09 (sustainable/careful resource use). URL verified live (2026-08-17): the UNEP plastic-pollution page states 'Plastic pollution poses a global challenge' and that UNEP 'works to reduce plastic pollution and its impacts,' framing the move to a circular economy. Plastic entering rivers and oceans and harming marine life via ingestion/entanglement is UNEP's core, well-documented message (also see the already-registered National Geographic Kids plastic article, S-066). Supports the lesson's land→river→ocean→animal pathway and its refuse/reuse/recycle/clean-up actions; the stewardship-and-hope framing is held as a value, distinct from the factual pathway."

  - id: S-217
    title: UNESCO — Media and Information Literacy (MIL)
    type: website
    url: https://www.unesco.org/en/media-information-literacy
    organization: UNESCO
    domains: [D10]
    reviewed: true
    notes: "Cited in U.05.012 L05 (fair reporting includes all sides, evidence, and who is speaking) and L10. UNESCO's Media and Information Literacy programme (the 'MIL Curriculum for Teachers', the MIL Alliance, and annual Global MIL Week) is a real, long-standing UNESCO initiative whose core framework is that citizens should access, evaluate, and critically engage media, and distinguish information from persuasion. The unesco.org URL returned a timeout to the fact-checker's environment (2026-08-17) — consistent with other UNESCO entries in this registry — but the programme and its canonical page are real and well established. The lesson's 'benefits, concerns, who is speaking' test is an age-appropriate version of source/perspective analysis, and the fairness ideal is held as a value, not a fact. Complemented by the already-registered Common Sense Education entry (S-063). Also cited in U.07.004 L03 (Unsupported Claims and Probing Questions) and L08 (Can I Trust This Source?) for evaluating the support behind a claim and judging source credibility by author, purpose, and evidence. Also cited in U.07.008 L01/L02 (Media Images & Body Image) and L07/L08 (Social Media & Mental Health) as the media-literacy framework for 'media images are chosen/edited/repeated' and for critically reading digital media — on-topic, general authority."

  - id: S-218
    title: WWF — Habitats (mangroves, coral reefs, forests)
    type: website
    url: https://www.worldwildlife.org/
    organization: World Wildlife Fund (WWF)
    domains: [D10]
    reviewed: true
    notes: "Cited in U.05.012 L07 as one authority for coral bleaching, mangrove nurseries, and forest habitats. WWF is the leading global conservation organization and documents, across its habitat pages, that mangroves serve as nursery grounds for juvenile fish and buffer coasts against storms, that coral reefs support high biodiversity and are threatened by bleaching, and that forests shelter much of the world's land biodiversity. The specific worldwildlife.org/habitats/mangroves URL returned 404 (2026-08-17; WWF has restructured its habitat pages), so WWF is registered here as a general authority. The underlying ecology claims are independently supported by NOAA (S-215, coral bleaching) and FAO (S-220, forests as home to over half of land species), and mangrove-nursery/storm-shield is standard, well-documented marine ecology."

  - id: S-219
    title: WHO — Household air pollution fact sheet
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/household-air-pollution-and-health
    organization: World Health Organization (WHO)
    year: 2025
    domains: [D10, D06]
    reviewed: true
    notes: "Cited in U.05.012 L08 for air pollution from burning trash/fuels harming lungs, with cleaner stoves as the fix. URL verified live (2026-08-17; page dated 16 Dec 2025): states 'Around 2.1 billion people worldwide ... cook using open fires or inefficient stoves fuelled by kerosene, biomass (wood, animal dung and crop waste) and coal, which generates harmful household air pollution', that such pollution 'inflame[s] the airways and lungs' and leads to stroke, ischaemic heart disease, COPD, and lung cancer, and that clean fuels/stoves and cleaner technologies reduce it. Directly supports the lesson's air-pollution pathway (burning fuels → smoke harms lungs) and its 'burn less, use cleaner stoves' action. Also cited in U.10.006 L12 (Energy Trade-Offs) for the claim that household air pollution from cooking fuels harms millions of people."

  - id: S-220
    title: FAO — Forestry (forests as habitat; deforestation)
    type: website
    url: https://www.fao.org/forestry/en/
    organization: Food and Agriculture Organization of the United Nations (FAO)
    domains: [D10, D06]
    reviewed: true
    notes: "Cited in U.05.012 L08 for deforestation-driven habitat loss (animals lose their homes). URL verified live (2026-08-17): the FAO Forestry page states 'Forests cover 31 percent of the world's land and are fundamental to life on our planet. Home to more than half of the world's land animal and plant species...' This directly supports the lesson's claim that clearing forests removes animal habitat; the 'plant native trees, use less paper, protect reserves' actions are standard, accurate conservation measures. (The earlier cited fao.org/state-of-forests/en returned 404; the live FAO Forestry hub is the correct canonical page.)"

  - id: S-221
    title: "Festinger — A Theory of Social Comparison Processes"
    type: article
    author: Leon Festinger
    organization: Human Relations
    year: 1954
    domains: [D01]
    reviewed: true
    notes: "Festinger, L. (1954). A theory of social comparison processes. Human Relations, 7(2), 117–140. The foundational paper of social comparison theory: people evaluate their own opinions and abilities by comparing themselves to others (with a drive toward upward comparison). Cited in U.06.001 L07/L08 (Peers and Media Shape My Self-Image; A Healthy Response to Negative Comparison) for the claim that comparing ourselves to others is a normal human tendency that curated/edited content can skew. Real, one of the most-cited papers in social psychology; correctly attributed (not overstated — the lessons treat comparison as a natural pull, not a pathology). No URL (print article)."

  - id: S-222
    title: "Neff — Self-Compassion: An Alternative Conceptualization of a Healthy Attitude Toward Oneself"
    type: article
    author: Kristin D. Neff
    organization: Self and Identity
    year: 2003
    domains: [D01, D03]
    reviewed: true
    notes: "Neff, K. D. (2003). Self-compassion: An alternative conceptualization of a healthy attitude toward oneself. Self and Identity, 2(2), 85–101. Kristin Neff is the leading researcher on self-compassion, which she defines as three interacting components — self-kindness, common humanity, and mindfulness — and which she distinguishes from self-esteem (which relies on social comparison and can turn into self-criticism). Cited in U.06.001 L08 for the healthy-response framing ('return to self-compassion and their own growth'). The lesson's move — reframing negative comparison toward self-kindness rather than 'I'm better than X' — matches Neff's core claim that self-compassion offers a healthier alternative to comparison-based self-evaluation. Real, correctly attributed. No URL (print article)."

  - id: S-223
    title: "Locke & Latham — A Theory of Goal Setting & Task Performance"
    type: book
    author: Edwin A. Locke & Gary P. Latham
    organization: Prentice-Hall
    year: 1990
    domains: [D01]
    reviewed: true
    notes: "Locke, E. A., & Latham, G. P. (1990). A Theory of Goal Setting & Task Performance. Prentice-Hall (see also Locke & Latham 2002, 'Building a practically useful theory of goal setting and task motivation,' American Psychologist 57(9), 705–717). The foundational goal-setting literature: specific, difficult (challenging) goals, with feedback, improve performance more than vague 'do your best' goals. Cited in U.06.001 L09 (Set, Track, and Reflect on a Short-Term Goal) for 'specific, challenging goals with feedback improve performance.' The lesson adapts this correctly for age 11–12 by making goals 'small, specific, and checkable' (what/how much/by when) rather than 'difficult,' which is a defensible developmental translation, not a misattribution. Real, correctly attributed. No URL (print book)."

  - id: S-224
    title: "Mischel, Shoda & Rodriguez — Delay of Gratification in Children"
    type: article
    author: Walter Mischel, Yuichi Shoda & Monica L. Rodriguez
    organization: Science
    year: 1989
    domains: [D01]
    reviewed: true
    notes: "Mischel, W., Shoda, Y., & Rodriguez, M. L. (1989). Delay of gratification in children. Science, 244(4907), 933–938 (see also Mischel, Ebbesen & Zeiss 1972). The classic 'marshmallow test' line of work on delay of gratification and self-control strategies. Cited in U.06.001 L10 (Staying True to My Values Under Pressure) for the 'pause' step, which the lesson explicitly frames as merely an *echo* of impulse-control research, and adds 'and its replications' — an appropriately cautious hedge given the well-known 2018 replication (Watts, Duncan & Quan) showing smaller effects once socioeconomic factors are controlled. Real, correctly attributed, not overstated. No URL (print article)."

  - id: S-225
    title: "Gross — The Emerging Field of Emotion Regulation: An Integrative Review"
    type: article
    author: James J. Gross
    organization: Review of General Psychology
    year: 1998
    domains: [D01]
    reviewed: true
    notes: "Gross, J. J. (1998). The emerging field of emotion regulation: An integrative review. Review of General Psychology, 2(3), 271–299. Foundational review introducing the process model of emotion regulation, including response-focused strategies (expressive suppression) that decouple the felt emotion from the outward display. Cited in U.06.001 L03 (What I Feel vs What I Show) for 'the distinction between felt emotion and outward display, and the social reasons people manage their expression.' The felt-vs-shown distinction maps to Gross's response-modulation/suppression construct, so the attribution is on-point. Real, foundational, correctly attributed (the lesson does not claim suppression is healthy — it presents both sides as real and normalizes display management as a skill). No URL (print article)."

  - id: S-226
    title: "Common Sense Media — Research Program (media & tech impact on child/adolescent development)"
    type: website
    url: https://www.commonsensemedia.org/research
    organization: Common Sense Media
    domains: [D01, D10]
    reviewed: true
    notes: "Verified live 2026-08-17 (commonsensemedia.org/research). The Common Sense Research Program 'provides parents, educators, health organizations, and policymakers with reliable, independent data on children's use of media and technology and the impact it has on their physical, emotional, social, and intellectual development.' It has published recurring reports on social media and adolescent well-being (e.g., the 'Social Media, Social Life' surveys), which is what U.06.001 L07 cites for the claim that curated, edited images can distort self-image/body image. Real and on-topic as a general authority; the lesson's specific 'warped mirror' framing (edited/curated highlight reels) is well supported by this body of research and by Festinger (S-221). Distinct from the media-literacy entry S-063. Also cited in U.07.003 L08 (Two Kinds of Gathering: Online and Offline) for the framing that online community is a real, ordinary part of adolescent social life, not inherently harmful."

  - id: S-227
    title: "Jacobson — Progressive Relaxation (progressive muscle relaxation)"
    type: book
    author: Edmund Jacobson
    organization: University of Chicago Press
    year: 1929
    domains: [D03]
    reviewed: true
    notes: "Edmund Jacobson (1929), Progressive Relaxation, University of Chicago Press (technique first presented at Harvard University in 1908; also 1934 'You Must Relax'). Origin of progressive muscle relaxation (PMR), the tense-then-release method cited in U.06.002 L02 (One Way to Release Tension). Attribution verified (2026-08-17): PMR was 'initially developed by American physician Edmund Jacobson'; the technique is a two-step tense-then-relax of muscle groups, with 'breathing in while tensing the muscles and breathing out as the muscles are released' — matching the lesson's four-step squeeze-and-release (breathe in, squeeze, hold, breathe out and let go). The lesson correctly presents it as 'a form of' PMR, simplified for Grade 6, and hedges it as one of many traditions rather than a cure. No URL (print book); Wikipedia summary used for verification."

  - id: S-228
    title: "Roediger & Karpicke — Test-Enhanced Learning: Taking Memory Tests Improves Long-Term Retention"
    type: article
    author: Henry L. Roediger III, Jeffrey D. Karpicke
    organization: Psychological Science
    year: 2006
    url: https://doi.org/10.1111/j.1467-9280.2006.01693.x
    domains: [D01, D03]
    reviewed: true
    notes: "Roediger, H. L., & Karpicke, J. D. (2006). Test-enhanced learning: Taking memory tests improves long-term retention. Psychological Science, 17(3), 249–255. Landmark experimental demonstration of the testing effect (retrieval practice): taking a memory test improves long-term retention more than additional study. Cited in U.06.002 L08 (My Body at Work: My Tension-Release Toolkit) for the claim that 'retrieval practice — recalling what was learned rather than re-reading it — strengthens long-term memory.' On-point and correctly attributed (the lesson pairs it with the general 'learning-science literature'; Dunlosky et al. S-039 is the companion consensus review). DOI format verified; the canonical DOI is 10.1111/j.1467-9280.2006.01693.x."

  - id: S-229
    title: "Steinberg — Age of Opportunity: Lessons from the New Science of Adolescence"
    type: book
    author: Laurence Steinberg
    organization: Houghton Mifflin Harcourt
    year: 2014
    domains: [D02]
    reviewed: true
    notes: "Laurence Steinberg, Age of Opportunity: Lessons from the New Science of Adolescence (Houghton Mifflin Harcourt, 2014). A synthesis of the adolescent-brain literature documenting that adolescence is a period of heightened sensitivity to peers and reward, and that peer relationships grow in importance and reorganize as young people develop. Cited in U.06.003 L01 (A Friendship Changes) for the claim that peer relationships intensify in early adolescence and friendships naturally reorganize. Real, correctly attributed; the lesson co-cites CASEL relationship skills. No URL (print book). The 'change is normal, not a failure' phrasing is a values commitment of the curriculum, not a claim from Steinberg."

  - id: S-230
    title: "Batson — Empathic Concern vs Personal Distress (empathy-altruism)"
    type: article
    author: C. Daniel Batson, Jim Fultz, Patricia A. Schoenrade
    organization: Journal of Personality
    year: 1987
    domains: [D02]
    reviewed: true
    notes: "Batson, C. D., Fultz, J., & Schoenrade, P. A. (1987). Distress and empathy: Two qualitatively distinct vicarious emotions with different motivational consequences. Journal of Personality, 55(1), 19–39. Foundational to Batson's empathy-altruism program: it distinguishes other-oriented empathic concern from self-oriented personal distress, two different emotional responses to another's suffering with different motivational consequences. Cited in U.06.003 L05 (Empathy With vs Sympathy For) as part of the research base for the empathy–sympathy distinction. Real, correctly attributed; the lesson explicitly frames the 'with vs for' teaching language as a simplification of this literature, not a direct claim from Batson. No URL (print article). Also cited in U.07.003 L06/L07 (The Same Thing, Many Views; Seeking to Understand, Not to Win) for empathic concern as a motive for helping."

  - id: S-231
    title: "Decety & Cowell — Empathy, Perspective-Taking, and Morality"
    type: article
    author: Jean Decety, Jason M. Cowell
    organization: Trends in Cognitive Sciences
    year: 2014
    domains: [D02]
    reviewed: true
    notes: "Decety, J., & Cowell, J. M. (2014). The complex relation between morality and empathy. Trends in Cognitive Sciences, 18(7), 337–339 (see also Decety & Cowell 2014, 'Friends or Foes: Is Empathy Necessary for Moral Behavior?', Perspectives on Psychological Science, 9(5), 525–537). Decety's research program distinguishes empathy (affective sharing — feeling with another) from empathic concern/sympathy and perspective-taking, and documents empathic responding across development. Cited in U.06.003 L05 (empathy vs sympathy) and L06 (perspective-taking) as the research base for the claim that perspective-taking/empathic responding is a well-studied route to prosocial behavior and reduced aggression. Real, correctly attributed; cited as a general authority, not for a single statistic. No URL (print article). Also cited in U.07.003 L05/L06/L07 (Where My Point of View Comes From; The Same Thing, Many Views; Seeking to Understand, Not to Win) for perspective-taking and empathy-across-difference as well-studied routes to prosocial behavior."

  - id: S-232
    title: "Tajfel — Minimal Group Paradigm and Social Identity"
    type: article
    author: Henri Tajfel
    organization: European Journal of Social Psychology / Scientific American
    year: 1970
    domains: [D02, D08]
    reviewed: true
    notes: "Tajfel, H. (1970). Experiments in intergroup discrimination. Scientific American, 223(5), 96–102; and Tajfel, H., Billig, M. G., Bundy, R. P., & Flament, C. (1971). Social categorization and intergroup behaviour. European Journal of Social Psychology, 1(2), 149–178. The minimal-group experiments showed that even arbitrary, content-free group assignment triggers in-group favoritism, grounding social identity theory. Cited in U.06.003 L07 (Belonging: Who's In, Who's Out, and Why) for in-group/out-group dynamics and their often-unintentional, habit-driven nature. Real, correctly attributed; the lesson's 'open the circle' framing is a values commitment, not a claim from Tajfel. No URL (print articles)."

  - id: S-233
    title: "Johnson & Johnson — Cooperation vs Competition (social interdependence theory)"
    type: article
    author: David W. Johnson, Roger T. Johnson
    organization: Psychological Bulletin
    year: 1981
    domains: [D02, D09]
    reviewed: true
    notes: "Johnson, D. W., Maruyama, G., Johnson, R., Nelson, D., & Skon, L. (1981). Effects of cooperative, competitive, and individualistic goal structures on achievement: A meta-analysis. Psychological Bulletin, 89(1), 47–62 (see also D. W. Johnson & R. T. Johnson, Cooperation and Competition: Theory and Research, Interaction Book Company). The meta-analysis and the brothers' social interdependence theory show cooperative goal structures produce higher achievement and better interpersonal outcomes than competitive or individualistic structures. Cited in U.06.003 L09 (Cooperation vs Competition) for the claim that cooperative learning improves achievement and relationships, alongside Slavin (S-147). Real, correctly attributed; the lesson's 'each is a tool' framing is a values position, not a claim from Johnson & Johnson. Also cited in U.06.004 L03 (Building on Others' Ideas) for cooperative discussion as a well-supported structure. No URL (print sources). Also cited in U.07.003 L10 (Mutual Aid: Why We Help) for social interdependence theory as the research base for why cooperation helps groups thrive. Also cited in U.07.012 L05 (Capstone: Mutual Aid, Motives, and Celebration) for the same 'cooperation helps groups thrive' framing."

  - id: S-234
    title: "World Bank — Poverty and Inequality (Poverty, Prosperity, and Planet Report)"
    type: website
    url: https://www.worldbank.org/en/topic/poverty/overview
    organization: World Bank Group
    year: 2026
    domains: [D02, D08]
    reviewed: true
    notes: "World Bank poverty topic page and the Poverty, Prosperity, and Planet Report. URL verified live (2026-08-17, re-verified 2026-08-18): documents that extreme poverty fell from ~2.3 billion in 1990 to ~831 million (under $3/day), that poverty reduction has slowed due to interconnected crises (sluggish growth, debt, COVID-19, conflict and fragility, weather shocks), and that extreme poverty is now concentrated in Sub-Saharan Africa and conflict-affected places — i.e., structural/place-based drivers, not individual worth. Cited in U.06.003 L10 (Capstone: Why Some Have More Than They Need) as the 'widely documented' data base for the claim that economic inequality is driven largely by structural factors (where one is born, work and pay, inherited wealth, health, conflict). Also cited in U.06.012 L05 (Together and Fair: Carrying It Forward) for the same structural-drivers-of-inequality claim, alongside UN/UNDP data (S-283). The lesson makes no specific statistic and flags 'no person's worth is measured by their resources' as a values commitment, not a scientific claim — appropriate for Grade 6."

  - id: S-235
    title: "UNESCO — Inclusion in Education (Salamanca Statement; Guide for Ensuring Inclusion and Equity)"
    type: website
    url: https://www.unesco.org/en/inclusion-education
    organization: UNESCO
    year: 2017
    domains: [D02, D09]
    reviewed: true
    notes: "UNESCO's inclusion-in-education work (the 1994 Salamanca Statement and Framework for Action on Special Needs Education; the 2017 'A Guide for Ensuring Inclusion and Equity in Education'; the SDG 4 inclusive-education agenda). Frames inclusion as removing barriers so every learner participates and is valued, and treats difference as ordinary rather than deficient. Cited in U.06.003 L08 (Identity Shapes Belonging) for the claim that 'belonging is shaped by how identity is received, and inclusive settings treat difference as ordinary rather than deficient.' On-topic as a general authority; unesco.org was unreachable from the fact-checker's environment on 2026-08-17 (consistent with other UNESCO entries), but the programme and its canonical documents are real and well established. The 'gift, not gap' framing is a values commitment, not a UNESCO claim."

  - id: S-236
    title: "Toulmin — The Uses of Argument (claim/data/warrant model)"
    type: book
    author: Stephen E. Toulmin
    organization: Cambridge University Press
    year: 1958
    domains: [D04]
    reviewed: true
    notes: "Stephen Toulmin, The Uses of Argument (Cambridge University Press, 1958; updated ed. 2003). Lays out the functional model of argument — claim, data (grounds), warrant, backing, qualifier, and rebuttal. Cited in U.06.004 L09 (claim + reasons) and L10 (evidence + counterargument/rebuttal) as the standard framework behind the 'claim/reasons/evidence/counterargument' scaffold used in the unit. The lessons use 'claim/data/warrant' and 'claim/evidence/rebuttal' as faithful shorthands of Toulmin's components, not as a new model. Real, foundational, correctly attributed. No URL (print book)."

  - id: S-237
    title: "Council of Europe — CEFR Companion Volume (plurilingual competence)"
    type: report
    url: https://www.coe.int/en/web/common-european-framework-reference-languages/companion-volume
    organization: Council of Europe
    year: 2020
    domains: [D04]
    reviewed: true
    notes: "Common European Framework of Reference for Languages: Learning, Teaching, Assessment — Companion Volume (Council of Europe; first published 2018, new edition 2020). Extends the CEFR and centers 'plurilingual and pluricultural competence' (the ability to draw on more than one language/culture to communicate) and mediation. Cited in U.06.004 L14 (Across a Language Difference) as the literature on lingua franca and plurilingual competence supporting cross-language communication strategies. Real, correctly attributed. coe.int returned HTTP 403 from the fact-checker's environment on 2026-08-17 (bot-blocking, consistent with other .coe.int/.unesco.org entries), but the document and its plurilingual-competence concept are canonical and well established. Also cited in U.07.004 L13 (Interpretation: Meaning in the Moment) as the plurilingual-communication literature framing the written-translation vs spoken-live-interpretation distinction."

  - id: S-238
    title: "Michaels & O'Connor — Accountable Talk / Talk Moves"
    type: article
    author: Sarah Michaels & Catherine O'Connor
    organization: Institute for Learning, University of Pittsburgh
    year: 2012
    domains: [D04]
    reviewed: true
    notes: "Sarah Michaels and Catherine O'Connor (with Lauren Resnick), 'Accountable Talk: Classroom Conversation that Works' — the 'talk moves' framework (e.g., 'Can you add on?', 'Who can restate that?', 'Do you agree or disagree, and why?') for productive, academically accountable discussion. Cited in U.06.004 L03 (Building on Others' Ideas) and L04 (Disagreeing Respectfully) as the research base for discussion 'moves' that build on others' ideas and disagree respectfully. Real, widely used, correctly attributed. Used as a general authority, not for a single statistic."

  - id: S-239
    title: "Agarwal & Bain — Powerful Teaching: Unleash the Science of Learning"
    type: book
    author: Pooja K. Agarwal & Patrice M. Bain
    organization: Jossey-Bass (Wiley)
    year: 2019
    domains: [D04]
    reviewed: true
    notes: "Pooja K. Agarwal & Patrice M. Bain, Powerful Teaching: Unleash the Science of Learning (Jossey-Bass, 2019). Practitioner synthesis of retrieval practice, spacing, and other learning-science techniques. Cited in U.06.004 L02 (Details and Examples) alongside Kirschner et al. for the retrieval-practice basis of the lesson's recall activities. Real, correctly attributed; used as a general authority for retrieval practice. No URL (print book)."

  - id: S-240
    title: MacTutor History of Mathematics Archive (University of St Andrews)
    type: website
    organization: School of Mathematics and Statistics, University of St Andrews (Scotland)
    url: https://mathshistory.st-andrews.ac.uk/
    domains: [D05]
    reviewed: true
    notes: "General authority for the history-of-mathematics notes across U.06.005. Verified live (2026-08-17) via three pages: (1) the Brahmagupta biography (mathshistory.st-andrews.ac.uk/Biographies/Brahmagupta/) — born 598, died 670, wrote the Brahmasphutasiddhanta in 628, and 'gives arithmetical rules in terms of fortunes (positive numbers) and debts (negative numbers)', i.e., the first systematic rules for arithmetic with negative numbers (7th century CE), matching L03/L04's claim that negative numbers were given rules by Brahmagupta in India. (2) The Al-Khwarizmi biography (mathshistory.st-andrews.ac.uk/Biographies/Al-Khwarizmi/) — 'His algebra treatise Hisab al-jabr w'al-muqabala gives us the word algebra and can be considered as the first book to be written on algebra' (9th century), matching L05/L06's claim that 'algebra' derives from al-jabr in al-Khwarizmi's 9th-century work. (3) 'An overview of Indian mathematics' (mathshistory.st-andrews.ac.uk/HistTopics/Indian_mathematics/) — 'The main Sulbasutras were composed by Baudhayana (about 800 BC)…' as 'rules for constructing altars', matching L01's Baudhayana-Sulba-Sutra scaling-altars note. The remaining history notes are standard and accurate without a page-level citation: Chinese counting rods used red for positive and black for negative in the Nine Chapters on the Mathematical Art (Jiuzhang Suanshu, Han dynasty) (L03); coordinate grids trace to Descartes (La Geometrie, 1637) while locating by two distances (latitude/longitude, grid squares) is far older (L07/L11); area/volume formulas appear in ancient Egyptian (Rhind/Moscow papyri), Mesopotamian, Chinese (Nine Chapters), and Indian (Sulbasutras) records (L09); averages/middle values appear in Babylonian and Indian record-keeping (L14). All these lessons hold the 'all traditions are worthy of study' framing as a value (docs/philosophy.md), clearly separated from the factual history."

  - id: S-241
    title: "Khan Academy — 6th grade data & statistics and physics (forces)"
    type: website
    url: https://www.khanacademy.org/
    organization: Khan Academy
    domains: [D06]
    reviewed: true
    notes: "Cited in U.06.006 L01 (Reading tables), L02 (Creating bar graphs), and L09 (Balanced and unbalanced forces) as a general, age-appropriate practice reference for data organization and Newton's-first-law force concepts. Khan Academy is a real, reputable open education resource; the specific lesson/unit paths cited (cc-sixth-grade-math/cc-6th-data-statistics and physics/forces-newtons-laws/balanced-unbalanced-forces) are standard Khan Academy course locations. khanacademy.org returned a bot-challenge (HTTP 403-style 'Client Challenge') to the fact-checker's environment on 2026-08-17, so it is registered as a general authority rather than a page-level claim citation. The underlying skills (tables, bar graphs, balanced vs unbalanced forces) are standard and independently supported by the BBC Bitesize entries S-242, S-246, S-247 below."

  - id: S-242
    title: "BBC Bitesize (KS3) — Working scientifically: different types of data, graphs and charts, observation and measurement, bias in science"
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zsg6m39
    organization: BBC Bitesize (KS3 Science)
    domains: [D06]
    reviewed: true
    notes: "Cited in U.06.006 L01 (Different types of data, articles/zxkh6g8), L02 (Graphs and charts, articles/zhmbvwx), L03 (Observation and measurement skills, articles/zm37jsg), and L04 (Bias in science, articles/zybm7yc). URLs verified live (2026-08-17) via the KS3 'Working scientifically' topic (zsg6m39; the same article set also appears under the Physics topic zrwvf82 and Chemistry topic zb8fn9q). Content spot-checked live: 'Different types of data' covers recording/reading data in tables (continuous/discrete); 'Graphs and charts' covers bar charts, axes, and scale; 'Observation and measurement skills' covers measuring, repeating readings, and error; 'Bias in science' covers bias and how sampling/random selection reduce it. These directly support the unit's tables→graphs→error→bias inquiry progression. Replaces the retired KS3 'guides/…/revision/N' URLs (guides/zy4rng8 and guides/zg96kqt), which now 404 after BBC Bitesize restructured guides→topics/articles."

  - id: S-243
    title: "BBC Bitesize (KS3) — Living organisms: plant and animal cells; unicellular organisms"
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/znyycdm
    organization: BBC Bitesize (KS3 Biology)
    domains: [D06]
    reviewed: true
    notes: "Cited in U.06.006 L05 (What are plant and animal cells?, articles/zkm7wnb; Unicellular organisms, articles/z4f26yc). URLs verified live (2026-08-17) via the KS3 'Living organisms' topic (znyycdm). Spot-checked live: 'What are plant and animal cells?' states cells have a nucleus, cytoplasm, cell membrane (animal), plus a cell wall and chloroplasts (plant) — directly supporting the lesson's cell-parts and plant-vs-animal claims; 'Unicellular organisms' names amoeba, bacteria, and yeast as single-celled — supporting the lesson's single-celled-organism claim. Replaces (a) the previously cited articles/zfj3rwx, which resolves to 'Specialised animal cells' (only animal-cell parts, no plant wall/chloroplasts or single-celled content), and (b) the broken National Geographic 'cells' article URL."

  - id: S-244
    title: "BBC Bitesize (KS3) — Ecosystems and habitats: food chains and webs"
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zxhhvcw/articles/zjh4r2p
    organization: BBC Bitesize (KS3 Biology)
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.06.006 L06 for energy transfer through an ecosystem. URL verified live (2026-08-17) via the KS3 'Ecosystems and habitats' topic (zxhhvcw). Spot-checked live: covers food chains/webs, producers, consumers, decomposers, and energy transfer along the chain — directly supporting the lesson's energy-flow claim. Replaces the retired guides/z99kkqt/revision/1 URL, which now resolves to an unrelated Higher-Physics 'Interference' page."

  - id: S-245
    title: "BBC Bitesize (KS3) — Energy: energy stores"
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zc3g87h/articles/zg2sn9q
    organization: BBC Bitesize (KS3 Physics)
    domains: [D06]
    reviewed: true
    notes: "Cited in U.06.006 L07 and L08 for the forms of energy and energy transfers. URL verified live (2026-08-17) via the KS3 'Energy' topic (zc3g87h). Spot-checked live: covers kinetic, potential (gravitational/elastic), thermal, and chemical energy stores and energy transfers — directly supporting the lesson's five-forms and transformation-chain claims. Replaces the retired guides/z6g2pv4/revision/1 and /revision/3 URLs (both 404)."

  - id: S-246
    title: "BBC Bitesize (KS3) — Forces and movement: force diagrams and resultant forces"
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/z4brd2p/articles/zhnfp4j
    organization: BBC Bitesize (KS3 Physics)
    domains: [D06]
    reviewed: true
    notes: "Cited in U.06.006 L09 for balanced and unbalanced forces. URL verified live (2026-08-17) via the KS3 'Forces and movement' topic (z4brd2p). Spot-checked live: covers drawing/interpreting force diagrams and resultant forces — i.e., balanced (zero resultant) vs unbalanced (non-zero resultant) forces and their effect on motion — directly supporting the lesson's Newton's-first-law claim. Replaces the retired guides/z9bqxsg/revision/1 URL (404)."

  - id: S-247
    title: "BBC Bitesize (KS3) — The Earth and atmosphere: the rock cycle"
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/z3fv4wx/articles/z2xx6g8
    organization: BBC Bitesize (KS3 Chemistry)
    domains: [D06]
    reviewed: true
    notes: "Cited in U.06.006 L11 for the rock cycle. URL verified live (2026-08-17) via the KS3 'The Earth and atmosphere' topic (z3fv4wx). Spot-checked live: covers igneous, sedimentary, and metamorphic rock and the rock cycle — directly supporting the lesson's three-rock-types and recycling claims. Replaces the retired guides/zwd2mp3/revision/1 URL (404)."

  - id: S-248
    title: "BBC Bitesize (KS2) — What is soil made from?"
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/z9bbkqt/articles/zgqkcmn
    organization: BBC Bitesize (KS2 Science)
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.06.006 L12 for what soil is made of. URL verified live (2026-08-17): the KS2 'Rocks' topic (z9bbkqt) article 'What is soil made from?' (articles/zgqkcmn) explains soil as formed from broken-down rock (minerals) and decayed living things — directly supporting the lesson's 'soil = minerals + humus' claim. Replaces the retired topics/z9f2pv4/articles/z2vrcmn URL (404). Complements the already-registered KS2 Rocks topic entry S-046."

  - id: S-249
    title: "NIST — Uncertainty of Measurement Results"
    type: website
    url: https://physics.nist.gov/cuu/Uncertainty/index.html
    organization: National Institute of Standards and Technology (NIST), Physical Measurement Laboratory
    domains: [D06]
    reviewed: true
    notes: "Cited in U.06.006 L03 for why every measurement carries some uncertainty. URL verified live (2026-08-17): the NIST 'Uncertainty of Measurement Results' reference (the CODATA/PMI uncertainty hub) has an 'Essentials of expressing measurement uncertainty' section covering basic definitions, evaluating/combining uncertainty components, and expanded uncertainty — directly supporting the lesson's 'measurements differ; name the source and reduce it' framing at a general-authority level (the statistical treatment is deferred to later grades). Replaces the 404 URL nist.gov/pml/owm/measurement-uncertainty (NIST restructured OWM pages). US-centric source; treated as one authoritative reference."

  - id: S-250
    title: "Understanding Science (UC Berkeley) — What is science? / bias"
    type: website
    url: https://undsci.berkeley.edu/understanding-science-101/what-is-science/
    organization: University of California Museum of Paleontology / Understanding Science (UC Berkeley)
    domains: [D06]
    reviewed: true
    notes: "Cited in U.06.006 L04 for how science guards against bias. URL verified live (2026-08-17): the 'Understanding Science 101 → What is science?' page is live and its 'The social side of science' section includes 'Human endeavor, human biases' — the specific content on bias and how scientists guard against it. The cited URL is the 101 hub that links to that content, so it functions as a general authority for the bias-vs-error distinction and the guardrails (random sampling, blind measurement) rather than a page-level citation. The lesson's specific bias definitions (selection bias, observer bias) are standard and independently supported by BBC Bitesize 'Bias in science' (S-242)."

  - id: S-251
    title: "National Geographic Education — Cell Theory"
    type: website
    url: https://education.nationalgeographic.org/resource/cell-theory/
    organization: National Geographic Society
    domains: [D06]
    reviewed: true
    notes: "Cited in U.06.006 L05 for cells as the basic unit of life. URL verified live (2026-08-17). States the classical cell theory — 'all organisms are made of cells', 'cells are the basic units of life', 'cells come from preexisting cells' — and the modern addition that 'cells are the basic structural, functional, and organizational units of both single-celled and multicellular organisms.' Directly supports every claim in the lesson. Replaces the broken nationalgeographic.com/science/article/cells URL (404)."

  - id: S-252
    title: "National Geographic Education — Food Chain"
    type: website
    url: https://education.nationalgeographic.org/resource/food-chain/
    organization: National Geographic Society
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.06.006 L06 for energy flowing through an ecosystem. URL verified live (2026-08-17). States 'Each food chain is a possible pathway that energy and nutrients can follow through the ecosystem,' describes producers→consumers→decomposers, and that decomposers 'complete the cycle of life, returning nutrients to the soil' — directly supporting the lesson's 'energy flows one way, matter cycles' framing. Replaces the 404 URL education.nationalgeographic.org/resource/energy-flow-ecosystem/."

  - id: S-253
    title: "National Geographic Education — The Carbon Cycle"
    type: website
    url: https://education.nationalgeographic.org/resource/carbon-cycle/
    organization: National Geographic Society
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.06.006 L06 for the carbon cycle. URL verified live (2026-08-17). States carbon moves between reservoirs via photosynthesis, respiration, decomposition, and burning fossil fuels, and 'Because Earth is a closed system, the amount of carbon on the planet never changes' — directly supporting the lesson's 'carbon cycles, reused again and again' claim."

  - id: S-254
    title: "National Geographic Education — The Rock Cycle"
    type: website
    url: https://education.nationalgeographic.org/resource/rock-cycle/
    organization: National Geographic Society
    domains: [D06]
    reviewed: true
    notes: "Cited in U.06.006 L11 for the rock cycle. URL verified live (2026-08-17). States there are 'three main types of rocks: sedimentary, igneous, and metamorphic', formed by 'melting, cooling, eroding, compacting, or deforming'; igneous = molten material that cools and solidifies; sedimentary = weathered/eroded fragments compacted into layers; metamorphic = changed by 'immense heat or pressure.' Directly supports every claim in the lesson."

  - id: S-255
    title: "EIA Energy Kids — Forms of Energy"
    type: website
    url: https://www.eia.gov/kids/what-is-energy/forms-of-energy.php
    organization: U.S. Energy Information Administration (EIA)
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.06.006 L07 for the forms of energy. URL verified live (2026-08-17). States 'energy is either potential energy or kinetic energy'; lists potential (chemical, stored mechanical/tension, gravitational) and kinetic (radiant/light, thermal/heat, motion, sound, electrical) forms, and gives conversions (e.g., 'chemical energy is converted to thermal energy when people burn wood'). Directly supports the lesson's five-forms (kinetic, potential, thermal, chemical, electrical) framing — a standard elementary grouping of EIA's finer sub-forms. US-centric source; treated as one authoritative, age-appropriate reference."

  - id: S-256
    title: "EIA Energy Kids — Laws of Energy"
    type: website
    url: https://www.eia.gov/kids/what-is-energy/laws-of-energy.php
    organization: U.S. Energy Information Administration (EIA)
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.06.006 L08 for energy changing form and being conserved. URL verified live (2026-08-17, HTTP 200). Covers the law of conservation of energy (energy is neither created nor destroyed, only changes form) and energy transfers/conversions with waste heat — directly supporting the lesson's 'energy changes form; some always escapes as heat; none disappears' framing, which the lesson correctly hedges (the quantitative law is deferred to Grade 9). Replaces the 404 URL eia.gov/kids/what-is-energy/transformations.php. US-centric source; treated as one authoritative, age-appropriate reference."

  - id: S-257
    title: "NASA Space Place — Solar System"
    type: website
    url: https://spaceplace.nasa.gov/menu/solar-system/
    organization: NASA (NASA Space Place / NASA Science for Kids)
    domains: [D06]
    reviewed: true
    notes: "Cited in U.06.006 L10 for the planets, the Sun, and Earth's place. URL verified live (2026-08-17): the 'Solar System' hub (spaceplace.nasa.gov/menu/solar-system/) lists 'All About the Planets' and individual planet/moon pages, including Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune and the Sun. Replaces the 404 URL spaceplace.nasa.gov/solar-system/en/ (no such page)."

  - id: S-258
    title: "NASA Science — Solar System Exploration"
    type: website
    url: https://science.nasa.gov/solar-system/
    organization: NASA
    domains: [D06]
    reviewed: true
    notes: "Cited in U.06.006 L10 for planet order and the Sun's scale. URL verified live (2026-08-17). States 'Our solar system has eight planets, and five dwarf planets', 'Our solar system includes the Sun, eight planets… hundreds of moons…', and has 'About the Planets — Learn about the inner planets, the outer planets' — directly supporting the lesson's eight-planet order, Earth-is-third, inner-vs-outer, and Sun-is-a-star claims. The lesson's 'about 100 times wider' Sun-vs-Earth figure is a correct one-significant-figure rounding of the ~109× ratio."

  - id: S-259
    title: "FAO Soils Portal — Key definitions (what is soil)"
    type: website
    url: https://www.fao.org/soils-portal/about/all-definitions/en/
    organization: Food and Agriculture Organization of the United Nations (FAO)
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.06.006 L12 for what soil is made of. URL verified live (2026-08-17): the FAO Soils Portal 'All definitions' page defines soil as 'the natural medium for the growth of plants' composed of 'weathered mineral materials, organic material, air and water' and states 'Soil sustains most living organisms, being the ultimate source of their mineral nutrients.' Directly supports the lesson's 'soil = minerals from broken rock + humus from decayed life' claim. Note: the lesson's earlier label 'Soils: where food begins' is FAO's World Soil Day slogan, not this page's title — the citation is corrected to the page's actual title ('All definitions')."

  - id: S-260
    title: "IDEA — International Drama/Theatre and Education Association"
    type: website
    url: https://www.idea-org.net/
    organization: International Drama/Theatre and Education Association (IDEA)
    domains: [D07]
    reviewed: true
    notes: "Cited in U.06.007 L05 (Tell a Story with Movement, Voice, and One More Element) as a classroom-friendly framing of devised performance. IDEA is a real international non-governmental organization for drama/theatre education, founded 1992, with consultative status with UNESCO, and it holds a triennial World Congress; its presidents have included Dan Baron Cohen (2004–2010) and Patrice Baldwin (2010–2013), and John O'Toole was a founder-member in 1992 (verified against independent sources, 2026-08-18). The domain www.idea-org.net resolves (DNS: 91.198.137.135) but the site was not reachable via HTTP from the review environment (connection/transport error), so it is registered as a general authority for devised-performance pedagogy rather than a claim-level citation for any specific fact; the lesson's substantive claim (movement + voice + one extra element as a standard elementary drama method) is standard and accurate on its own. Also cited in U.07.007 L06 (Performing a Scene or Dance) as classroom-friendly framing of devised performance."

  - id: S-261
    title: WHO — Adolescent health (health topic)
    type: website
    url: https://www.who.int/health-topics/adolescent-health
    organization: World Health Organization
    domains: [D03]
    reviewed: true
    notes: "Cited in U.06.008 L01 (Puberty Basics) and L02 (Every Pace Is Normal) as the authority for the basic, standard biology of puberty and adolescent development. URL verified live (2026-08-18): the WHO 'Adolescent health' health-topic page is real and on-topic. It states 'Adolescence is the phase of life between childhood and adulthood, from ages 10 to 19' and that 'Adolescents experience rapid physical, cognitive and psychosocial growth,' and links to WHO's sexual-and-reproductive-health and comprehensive-sexuality-education resources — on-topic as a general authority for the lessons' basic puberty changes (growth spurt, body hair, oilier skin, voice change, and reproductive changes) and their claim that puberty unfolds gradually and begins at different times for different people. The page does not enumerate a specific onset-age range, so the lessons' 'between about 8 and 15' phrasing is the standard, appropriately hedged pediatric consensus (girls typically 8–13, boys typically 9–14), not a verbatim figure from this page; the citation is used as a general authority for adolescent biology, not a claim-level citation for the age figure itself. General authority, non-Western-aligned (WHO, global). Also cited in U.07.008 L01/L02 (Media Images & Body Image) as a general authority for adolescent wellbeing alongside UNESCO MIL, and L06 (choking/getting help) as a general adolescent-health authority."

  - id: S-262
    title: "Smithsonian Institution Global Volcanism Program — Krakatau (1883)"
    type: website
    url: https://volcano.si.edu/
    organization: Smithsonian Institution (National Museum of Natural History)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.06.009 L01 (Primary and Secondary Sources) and L12 (capstone) for the 1883 eruption of Krakatoa (Krakatau) as one of the largest volcanic eruptions in recorded history. The Smithsonian Global Volcanism Program is the authoritative world volcanic-eruption database; it documents the catastrophic August 1883 eruption of Krakatau in the Sunda Strait between Java and Sumatra (Indonesia), including its caldera collapse, tsunamis, and global atmospheric effects. The lesson's use is correct: the eruption is dated August 1883, and Krakatoa lies between Java and Sumatra in Southeast Asia. The site returns HTTP 403 to non-browser clients (verified 2026-08-18) but is real and canonical. The lesson correctly flags that it is the source-kind distinction (not the exact day) that matters."

  - id: S-263
    title: "U.S. National Archives — Primary and Secondary Sources"
    type: website
    url: https://www.archives.gov/
    organization: U.S. National Archives and Records Administration (NARA)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.06.009 L01 (Primary and Secondary Sources) and L12 (capstone) for the standard distinction between primary sources ('the raw materials of history — original documents and objects created at the time under study') and secondary sources (later interpretations that draw on primary sources). NARA's educator materials (including 'Getting Started with Primary Sources' and DocsTeach) are the canonical U.S. archive guidance for this distinction and directly match the lesson's 'made at the time / made later' framing. The lesson's additional honest note that the line can blur ('more primary' or 'more secondary') is a standard caveat in historical method. US-centric source; used as one authoritative reference for a methodological distinction, not the only tradition."

  - id: S-264
    title: "British Library — history of writing materials and primary sources"
    type: website
    url: https://www.bl.uk/
    organization: The British Library
    domains: [D08]
    reviewed: true
    notes: "Cited in U.06.009 L01/L02 (primary vs secondary sources; Zheng He) and L06 (the journey of paper) and L12 (capstone). The British Library is a real, reputable institution whose Learning/collection pages document (a) primary and secondary source method, (b) the voyages of Zheng He (1405–1433) across the Indian Ocean, and (c) the history of paper: invented in China and refined by Cai Lun around 105 CE, carried along the Silk Roads through Central Asia to the Islamic world (Baghdad paper mills) and reaching Europe by the 1100s, where water-powered mills and printing later transformed it. All three claims are standard and accurate, and the BL is a legitimate general authority for them (institutional homepages return 403 to some automated clients but serve browsers)."

  - id: S-265
    title: "UNESCO Silk Roads Programme (Maritime Silk Road)"
    type: website
    url: https://www.unesco.org/en/silk-road
    organization: UNESCO
    domains: [D08]
    reviewed: true
    notes: "Cited in U.06.009 L02 (Zheng He's voyages) and L12 (capstone) as a general authority for the Indian Ocean voyages of Zheng He (1405–1433), in which Ming fleets reached Southeast Asia, South Asia, Arabia, and East Africa. The UNESCO Silk Roads Programme is real and documents the maritime Silk Roads and Zheng He's expeditions. Note: the lesson's Resources originally cited the retired https://en.unesco.org/silkroad/ URL; en.unesco.org was retired after UNESCO's 2022 migration to unesco.org (consistent with S-201), so the citation was updated to the current unesco.org programme page. unesco.org was not reachable from the fact-checker's environment on 2026-08-18, but the programme and its documentation of Zheng He are real and well established."

  - id: S-266
    title: "Ma Huan — Ying-yai Sheng-lan (The Overall Survey of the Ocean's Shores)"
    type: book
    author: "Ma Huan (translated and edited by J. V. G. Mills)"
    year: 1970
    organization: Hakluyt Society
    domains: [D08]
    reviewed: true
    notes: "Cited in U.06.009 L02 as the primary source for Zheng He's voyages. Ma Huan was a Muslim interpreter who sailed with Zheng He on the 1413–1415, 1421–1422, and 1431–1433 expeditions and wrote the Yingya Shenglan (1433), the key Chinese eyewitness account of the ports and peoples of Southeast Asia, South Asia, Arabia, and East Africa. J.V.G. Mills' English translation (Hakluyt Society, 1970) is the standard scholarly edition. The lesson's claim that Ma Huan 'sailed with the fleet and wrote down what he saw' is accurate and correctly attributed. No URL (print book)."

  - id: S-267
    title: "al-Umari — Masalik al-absar (Account of Mansa Musa's pilgrimage)"
    type: book
    author: "Shihab al-Din al-Umari"
    year: "c. 1340s"
    organization: Mamluk Egypt (contemporary Arabic chronicle)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.06.009 L02 as the primary source for the 1324 pilgrimage of Mansa Musa, emperor of Mali. The contemporary Egyptian scholar al-Umari (1301–1349), in his encyclopedia Masalik al-absar, recorded eyewitness-derived accounts of Mansa Musa's 1324–1325 hajj, including his famous largesse in Cairo (which temporarily depressed the value of gold). The lesson's use — Mansa Musa's 1324 pilgrimage, documented by the contemporary Egyptian scholar al-Umari — is accurate and correctly attributed. No URL (medieval manuscript; the lesson also cites the British Museum as a general authority)."

  - id: S-268
    title: "UNESCO World Heritage Centre — Timbuktu (Dossier 119)"
    type: website
    url: https://whc.unesco.org/en/list/119/
    organization: UNESCO World Heritage Centre
    domains: [D08]
    reviewed: true
    notes: "Cited in U.06.009 L03 (change and continuity in the Songhai empire / Timbuktu) and L05 (Timbuktu manuscripts). URL verified live (2026-08-18): Dossier 119 is 'Timbuktu' (Mali, inscribed 1988, criteria ii/iv/v). The Brief synthesis states Timbuktu was 'an intellectual and spiritual capital and a centre for the propagation of Islam throughout Africa in the 15th and 16th centuries,' home of 'the prestigious Koranic Sankore University' with '180 Koranic schools and 25,000 students,' where 'the trading of manuscripts was negotiated'; its apogee is dated to 'the 15th and 16th centuries,' 'at the end of the Askia dynasty.' This directly supports L03's claim that under Songhai rule (1464–1591) Timbuktu became a famous center of learning where scholars wrote and copied thousands of books in Arabic, and L05's claim that families preserved thousands of manuscripts on law, astronomy, medicine, and math."

  - id: S-269
    title: "Djibril Tamsir Niane — Sundiata: An Epic of Old Mali"
    type: book
    author: "Djibril Tamsir Niane (as told by the griot Mamadou Kouyaté)"
    year: 1965
    organization: Longman (French original 1960, Présence Africaine)
    domains: [D08, D04]
    reviewed: true
    notes: "Cited in U.06.009 L03 for the griots of West Africa as hereditary keepers of oral history, and in U.08.004 L06 (Texts From Many Cultures and Times) for the Sundiata epic as a West African oral-tradition text kept by griots. Niane (1932–2021), the Guinean historian, recorded and translated the Sundiata epic from the griot Mamadou Kouyaté; the book is the canonical scholarly demonstration that griots (jeliw) are hereditary custodians who pass a people's history by word across generations. The lesson's claim — griots are storytellers who keep a people's history by word, passing it from one generation to the next — is accurate and correctly attributed to Niane's scholarship. The U.08.004 lesson's quoted line ('I am a griot; it is I, Djeli Mamoudou Kouyaté, who speak…') is a faithful rendering of the epic's opening as narrated by the griot Djeli Mamoudou Kouyaté (the same person as Mamadou Kouyaté; 'Djeli' is the jeli/griot title). No URL (print book)."

  - id: S-270
    title: "Tokyo National Museum — Edo period collections"
    type: website
    url: https://www.tnm.jp/
    organization: Tokyo National Museum
    domains: [D08]
    reviewed: true
    notes: "Cited in U.06.009 L04 (change and continuity in the first century of Edo Japan, 1600–1700). The Tokyo National Museum is Japan's authoritative national museum; its collections and e-Museum document the Edo (Tokugawa) period (1603–1868), including the peace that followed the 1600 Battle of Sekigahara, the growth of Edo as a great city, and the road network that connected the realm — matching the lesson's change-and-continuity card (peace after long wars; cities like Edo grew; new roads; rice farming and family/community life steady). Standard, accurate Japanese history."

  - id: S-271
    title: "The Palace Museum (Forbidden City) — Ming dynasty collections"
    type: website
    url: https://en.dpm.org.cn/
    organization: The Palace Museum, Beijing
    domains: [D08]
    reviewed: true
    notes: "Cited in U.06.009 L04 (change and continuity in Ming China, about 1368–1500). The Palace Museum is the authoritative museum of the Ming and Qing imperial palace in Beijing; its collections document the Ming dynasty (1368–1644), including the rebuilding of the realm, printed books, and the Zheng He voyages — matching the lesson's change-and-continuity card (a new dynasty rebuilt the land, printed books, and sent fleets across the Indian Ocean, while farming, family, and classical learning continued). Standard, accurate Chinese history."

  - id: S-272
    title: "George Gheverghese Joseph — The Crest of the Peacock: Non-European Roots of Mathematics"
    type: book
    author: "George Gheverghese Joseph"
    year: 1991
    organization: I.B. Tauris (Princeton University Press edition 2000)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.06.009 L06 for the spread of the Indian decimal system and the concept of zero through the Islamic world to Europe. Joseph's book is the canonical scholarly account of the non-European roots of mathematics; it documents that the decimal place-value system and the symbol for zero were developed in India and transmitted via Arabic/Islamic scholars (e.g., al-Khwarizmi's 9th-century work) to Europe, where they transformed calculation. The lesson's claim ('the number zero and the decimal system were developed in India and carried by scholars to Baghdad, then into Europe — changing how people counted everywhere') is accurate and correctly attributed. No URL (print book)."

  - id: S-273
    title: "Alfred W. Crosby — The Columbian Exchange: Biological and Cultural Consequences of 1492"
    type: book
    author: "Alfred W. Crosby"
    year: 1972
    organization: Greenwood Press
    domains: [D08]
    reviewed: true
    notes: "Cited in U.06.009 L08 (Plants, Animals, and People on the Move) and L12 (capstone) for the Columbian Exchange framework. Crosby (1972) coined the term 'Columbian Exchange' for the post-1492 movement of plants, animals, diseases, and people between the Americas and Afro-Eurasia. The lesson's content is accurate: from the Americas went maize, potato, tomato, cacao, and chili; into the Americas came wheat, rice, horses, cattle, sheep, pigs, and — through colonization and the transatlantic slave trade — enslaved African people; the potato later fed Ireland; the tomato became central to Italian and South Asian cooking; maize spread across Africa; horses transformed Plains hunting and travel. The lesson holds this honestly (naming colonization, the slave trade, and the epidemic disease that devastated Indigenous peoples) while centering Indigenous and African dignity and agency. No URL (print book; the lesson also cites the Smithsonian as a general authority)."

  - id: S-274
    title: "UNESCO — Routes of Enslaved Peoples (formerly The Slave Route)"
    type: website
    url: https://www.unesco.org/en/routes-enslaved-peoples
    organization: UNESCO
    domains: [D08]
    reviewed: true
    notes: "Cited in U.06.009 L08 (Plants, Animals, and People on the Move) and L12 (capstone) for the transatlantic slave trade, in which millions of African people were forcibly taken. UNESCO's 'Routes of Enslaved Peoples: Resistance, Liberty, Heritage' project (formerly 'The Slave Route') is the authoritative UN documentation of the scale and history of the transatlantic slave trade and the resistance of enslaved peoples. The lesson's claim — that the exchange rode on colonization and a slave trade that 'stole millions of African people from their homes' — is accurate (the trade forcibly displaced an estimated 12.5 million Africans across the Atlantic). Note: the lesson's Resources originally cited the retired https://en.unesco.org/themes/fostering-rights-inclusion/slave-route URL; en.unesco.org was retired after UNESCO's 2022 migration (see S-201), so the citation was updated to the current unesco.org programme page. unesco.org was not reachable from the fact-checker's environment on 2026-08-18, but the project and the facts are real and well established."

  - id: S-275
    title: "Steven Lukes — Power: A Radical View"
    type: book
    author: "Steven Lukes"
    year: 1974
    organization: Macmillan (2nd ed. 2005, Palgrave Macmillan)
    domains: [D08, D09]
    reviewed: true
    notes: "Cited in U.06.009 L09 (What Is Power, and Who Holds It?) for the working definition of power as the ability to influence or decide, for oneself and for others. Lukes (1974) is the canonical political-theory text on power; it distinguishes one-dimensional power (A gets B to do what B would not otherwise do — 'power over') from a more capacious three-dimensional view, and its core insight is that power is the capacity to affect outcomes, which can be exercised with or over others. The lesson's 'power over' (one person or group decides for others) vs 'power with' (people deciding together as equals) framing is a standard, age-appropriate rendering consistent with Lukes' account; the lesson correctly treats 'power with'/'power over' as descriptions, deferring the fairness (value) judgment to L10. No URL (print book)."

  - id: S-276
    title: "Encyclopaedia Britannica — Kwame Nkrumah (Ghana independence)"
    type: website
    url: https://www.britannica.com/biography/Kwame-Nkrumah
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.06.009 L11 (A Movement for Freedom) for Ghana's independence movement. Britannica's Kwame Nkrumah biography documents that Nkrumah led the Convention People's Party (founded 1949), which used boycotts, strikes, and nonviolent 'Positive Action' against British colonial rule, and that Ghana became independent on 6 March 1957 — the first sub-Saharan African colony to win independence, with Nkrumah its first prime minister. This directly supports the lesson's claims (CPP, boycotts and peaceful strikes/'positive action', independence in 1957, many African nations soon following). The lesson correctly centers ordinary people's collective action, not a single 'great man.'"

  - id: S-277
    title: Global Footprint Network — Ecological Footprint
    type: website
    url: https://www.footprintnetwork.org/our-work/ecological-footprint/
    organization: Global Footprint Network
    domains: [D10]
    reviewed: true
    notes: "Cited in U.06.011 L07 (Footprints: What My Life Uses) and L08 (Walk or Ride?). URL verified live (2026-08-18). The Ecological Footprint 'measures how much nature we have and how much nature we use'; on the demand side it 'adds up all the biologically productive areas for which a population, a person or a product competes' to produce the resources it consumes and absorb its waste (carbon emissions). Conceived 1990 by Mathis Wackernagel and William Rees at UBC. Supports L07's accurate simplification 'a footprint is the resources a person or place uses' and its four-part breakdown (food/travel/energy/things); the lesson correctly holds the footprint as a measurement, not a score on character. L08 uses it for weighing everyday choices' environmental effects — a general authority, not a claim-level statistic."

  - id: S-278
    title: Center for News Literacy (Stony Brook University)
    type: website
    url: https://www.centerfornewsliteracy.org/
    organization: Stony Brook University School of Journalism
    domains: [D10]
    reviewed: true
    notes: "Cited in U.06.011 L03 (News, Opinion, or Ad?) and L04 (Loaded Words and Emotional Images). URL verified live (2026-08-18). The Center states News Literacy helps learners 'recognize the differences between fact and rumor, news and advertising, news and opinion, and bias and fairness.' Supports the lessons' news/opinion/advertisement distinction and their persuasive-technique work. Used as a framework authority (with Common Sense Education, S-063), not a claim-level citation."

  - id: S-279
    title: Convention on Biological Diversity (CBD)
    type: website
    url: https://www.cbd.int/
    organization: Secretariat of the Convention on Biological Diversity (UN)
    domains: [D10]
    reviewed: true
    notes: "Cited in U.06.011 L06 (Biodiversity: Why Variety Keeps Ecosystems Strong). URL verified live (2026-08-18). The CBD is the authoritative international treaty on biodiversity — 'the foundation of all life on Earth' — and its Kunming-Montreal Global Biodiversity Framework is the world's blueprint to halt and reverse biodiversity loss. Supports the lesson's claim that biodiversity (the variety of living things) is linked to ecosystem health/resilience. General authority/frame; the lesson's specific single-crop example (Irish potato famine) is standard, accurate history and is not attributed to this page."

  - id: S-280
    title: W3C WAI — Web Content Accessibility Guidelines (WCAG)
    type: website
    url: https://www.w3.org/WAI/standards-guidelines/wcag/
    organization: W3C Web Accessibility Initiative (WAI)
    domains: [D10]
    reviewed: true
    notes: "Cited in U.06.011 L02 (Who Gets to Use It? Technology and Fairness) as an accessibility standard. URL verified live (2026-08-18). WCAG is the international standard (WCAG 2.0/2.1/2.2; ISO/IEC 40500) explaining 'how to make web content more accessible to people with disabilities.' Supports the lesson's claim that design decisions (e.g., accessible screens) change who is included. Used as a general authority for accessibility standards, not a claim-level citation. Also cited in U.07.007 L07 (Designing for Everyone) for the WCAG four principles — perceivable, operable, understandable, robust — applied to any design."

  - id: S-281
    title: "World Bank — World Development Report 2016: Digital Dividends"
    type: report
    url: https://www.worldbank.org/en/publication/wdr2016
    organization: World Bank Group
    year: 2016
    domains: [D10]
    reviewed: true
    notes: "Cited in U.06.011 L02 (Who Gets to Use It? Technology and Fairness). URL verified live (2026-08-18). WDR 2016 documents that digital technologies have spread rapidly but their benefits are unevenly distributed, and that 'for digital technologies to benefit everyone everywhere requires closing the remaining digital divide, especially in internet access.' Supports the lesson's claim that access to technology varies by cost, disability, and geography, and that design and policy decisions change who is included. General authority for the access/fairness framing, not a claim-level statistic. Also cited in U.07.003 L08 (Two Kinds of Gathering: Online and Offline) for the claim that internet access varies by cost, geography, and disability — i.e., the digital divide."

  - id: S-282
    title: UN Environment Programme (UNEP)
    type: website
    url: https://www.unep.org/
    organization: United Nations Environment Programme
    domains: [D10]
    reviewed: true
    notes: "Cited in U.06.011 L07 (Footprints: What My Life Uses) as a general authority for teaching the ecological footprint in age-appropriate form. URL verified live (2026-08-18). UNEP is the leading global environmental authority (climate, nature, air quality, transport); it frames the footprint/overshoot concept for public and classroom audiences. A general authority, not a claim-level citation. Complements Global Footprint Network (S-277). Also cited in U.07.007 L08 (The Trade-Offs) for the environmental framing of materials and waste."

  - id: S-283
    title: UNDP — Human Development Reports (inequality and poverty data)
    type: website
    url: https://hdr.undp.org/data-center
    organization: United Nations Development Programme (UNDP), Human Development Report Office
    year: 2025
    domains: [D02, D08]
    reviewed: true
    notes: "Cited in U.06.012 L05 (Together and Fair: Carrying It Forward) as the 'UN data on inequality and poverty' half of the claim that economic inequality is driven largely by structural factors rather than individual worth. URL verified live (2026-08-18): hdr.undp.org/data-center is the UNDP Human Development Report Office data centre (© 2026), publishing the Human Development Index (HDI), the Inequality-adjusted HDI (IHDI), the Gender Inequality Index (GII), and the Global Multidimensional Poverty Index (MPI) — i.e., real, authoritative UN measures of inequality and poverty. Complements the World Bank poverty/inequality source (S-234); the lesson makes no specific statistic and flags 'no person's worth is measured by their resources' as a values commitment, not a scientific claim."

  - id: S-284
    title: "Steele & Aronson (1995) — Stereotype Threat and the Intellectual Test Performance of African Americans"
    type: article
    author: Claude M. Steele & Joshua Aronson
    url: https://doi.org/10.1037/0022-3514.69.5.797
    organization: Journal of Personality and Social Psychology
    year: 1995
    domains: [D01]
    reviewed: true
    notes: "Steele, C. M., & Aronson, J. (1995). Stereotype threat and the intellectual test performance of African Americans. Journal of Personality and Social Psychology, 69(5), 797–811. DOI 10.1037/0022-3514.69.5.797. Cited in U.07.001 L08 (When a Label Narrows Me) for the 'stereotype threat' finding — that worrying about confirming a negative stereotype can weigh on performance. The lesson cites it correctly and with the research's own cautions: it teaches 'labels can get inside and weigh on a person,' not a fixed law, and the facilitator note flags that effect size and boundary conditions are debated in the literature (consistent with subsequent replication/meta-analytic discussion). Real, foundational social-psychology article; on-topic for the lesson's internalization claim."

  - id: S-285
    title: "Human energy requirements: Report of a Joint FAO/WHO/UNU Expert Consultation"
    type: report
    url: https://www.fao.org/4/y5686e/y5686e00.htm
    organization: Food and Agriculture Organization of the United Nations (FAO), World Health Organization (WHO), United Nations University (UNU)
    year: 2004
    domains: [D03]
    reviewed: true
    notes: "Cited in U.07.002 L07 (Energy Needs Differ Among Bodies and Activities) for the claim that human energy needs differ by age, sex, body size, and physical activity level, and rise steeply during the adolescent growth spurt (energy is spent on growth as well as on daily activity). ISBN 92-5-105212-3 (FAO Food and Nutrition Technical Report Series 1, Rome, 2004). Fact-check verified live (2026-08-18): the URL resolves to the report's title page ('Report of a Joint FAO/WHO/UNU Expert Consultation, Rome, 17-24 October 2001', published Rome 2004), and its table of contents lists Chapter 4 'Energy Requirements of Children and Adolescents' with '4.3 Energy needs for growth' and Chapter 5 covering 'physical activity level' — directly supporting the lesson's hedged general claim that growing bodies and more active bodies need more energy, and that energy needs are individual, not a single number. Global (FAO/WHO/UNU), not a single-tradition source."

  - id: S-286
    title: "Nemours KidsHealth — Eating Disorders (for teens)"
    type: website
    url: https://kidshealth.org/en/teens/eat-disorder.html
    organization: Nemours KidsHealth (Nemours Children's Health)
    year: 2022
    domains: [D03]
    reviewed: true
    notes: "Cited in U.07.002 L08 (Fueling a Growing Body: Why Restriction Harms) for the claims that eating disorders are serious illnesses (not a choice or a character flaw), that restricting food during the growing years can harm a growing body — listing undernutrition harms including 'delayed puberty and slow growth,' 'weak bones,' 'irregular periods,' 'feeling tired, weak, dizzy, or faint,' and trouble focusing/remembering — and that recovery is possible with help from a team (doctor, dietitian, therapist). Fact-check verified live (2026-08-18): the page is real and medically reviewed (D'Arcy Lyness, PhD; 'Date reviewed: March 2022'). Its anorexia section lists 'delayed puberty and slow growth', 'weak bones', 'irregular periods', 'feeling tired, weak, dizzy, or faint', and 'find it hard to focus and have trouble remembering things' as harms of undernutrition/low body weight; it states eating disorders are treated 'by a team that includes a doctor, dietitian, and therapist,' that there is 'no one cause' (genes, environment, stressful events), and that 'When an eating disorder is caught early, a person has a better chance of recovery,' with the advice to 'Tell someone' and 'Get help early.' Each lesson claim is directly supported. The lesson holds the 'no shame, no blame' stance as a values commitment distinct from these facts, and directs learners to tell a trusted adult and seek early help. US-centric source; treated as one authoritative pediatric reference, not the only tradition."

  - id: S-287
    title: "UNESCO — Traditional Sports and Games (TSG)"
    type: website
    url: https://www.unesco.org/en/sport-and-anti-doping/traditional-sports-and-games
    organization: UNESCO
    domains: [D03, D08]
    reviewed: true
    notes: "Cited in U.07.002 L04 (Teamwork: Games from Around the World) as a general frame for traditional sports and games as living cultural heritage — practices communities pass down and adapt, which carry values of fair play, teamwork, and inclusion. URL corrected by fact-checker (2026-08-18): the lesson originally cited https://www.unesco.org/en/traditional-sports-and-games, which is not the canonical page; the live UNESCO page is https://www.unesco.org/en/sport-and-anti-doping/traditional-sports-and-games (confirmed via search; unesco.org is unreachable to automated clients — times out/HTTP 000 — consistent with prior UNESCO entries). The page defines traditional sports and games (TSG) as 'practices in an individual or collective manner, deriving from regional or local identity, based on accepted rules' and part of the 'universal heritage diversity,' per the Collective Consultation (Tehran) — matching the lesson's living-heritage/fair-play framing. The lesson's specific games (kabaddi and kho-kho of South Asia, sepak takraw of Southeast Asia) are standard, widely documented team games; the lesson presents them as living traditions played with respect, never ranked, and directs learners to verify local rules with community members."








  - id: S-288
    title: "MacTutor — Mathematics in Egyptian Papyri (Rhind Papyrus)"
    type: website
    url: https://mathshistory.st-andrews.ac.uk/HistTopics/Egyptian_papyri/
    organization: MacTutor History of Mathematics Archive, University of St Andrews
    domains: [D05]
    reviewed: true
    notes: "Cited in U.07.005 L01/L03/L09 (Rhind Papyrus 'per one' division and bread/beer proportional problems) and L12 (Egyptian π = 256/81). URL verified live (2026-08-18). Page documents the Rhind Papyrus (scribe Ahmes): division by doubling, unit fractions, the 2/n table, Problems 21/24 (false position), and Problem 50 (round field, diameter 9 khet → area 64 setat), noting the result 'is equivalent to taking π = 4(8/9)² = 3.1605' — i.e., 256/81 ≈ 3.16. Supports the lessons' hedged claims that the Rhind Papyrus contains division/'per one' reckoning and the 256/81 value of π. (Bread-and-beer problems appear elsewhere in the Rhind Papyrus, Problems 5 and 72–76, a standard fact consistent with the page's description of the papyrus as a practical handbook of division of loaves and beer.) Also cited in U.11.005 L13 (Composite Solids) for the claim that the Egyptians computed the volume of a truncated pyramid in the Moscow Papyrus. Verified live (2026-08-19): the same page's 'The Moscow papyrus' section gives Example 14, 'Example of calculating a truncated pyramid' (base square side 4 cubits, top square side 2 cubits, height 6 cubits), deriving V = ⅓h(a² + ab + b²) — directly supporting the lesson's truncated-pyramid volume claim."

  - id: S-289
    title: "MacTutor — Nine Chapters on the Mathematical Art"
    type: website
    url: https://mathshistory.st-andrews.ac.uk/HistTopics/Nine_chapters/
    organization: MacTutor History of Mathematics Archive, University of St Andrews
    domains: [D05]
    reviewed: true
    notes: "Cited in U.07.005 L05 (negative numbers in the Chinese Nine Chapters, c. 200 BCE) and L10 (the gou-gu / Pythagorean right-triangle rule in China). URL verified live (2026-08-18). Page states the text 'originated around 200 BC' (most historians), that Chapter 8 (Calculation by Square Tables / systems of linear equations) 'uses negative numbers ... and the chapter includes rules to compute with them', and that Chapter 9 uses 'Pythagoras's theorem, which the Chinese knew as the Gougu rule', with Pythagorean triples. Supports the lessons' hedged dating ('c. 200 BCE') and the negative-numbers claim. Note: the red/black counting-rod convention (red positive, black negative) is a documented detail of Chinese rod numerals (Liu Hui's commentary and the Suan shu shu) — accurate but not stated verbatim on this page; the page confirms the negative-numbers-and-rules core."

  - id: S-290
    title: "MacTutor — Brahmagupta"
    type: website
    url: https://mathshistory.st-andrews.ac.uk/Biographies/Brahmagupta/
    organization: MacTutor History of Mathematics Archive, University of St Andrews
    domains: [D05]
    reviewed: true
    notes: "Cited in U.07.005 L05 (Brahmagupta's 7th-century rules for negative numbers). URL verified live (2026-08-18). Brahmagupta (598–670) wrote the Brahmasphutasiddhanta in 628; the page quotes his arithmetic rules 'in terms of fortunes (positive numbers) and debts (negative numbers)', including 'The product or quotient of two debts is one fortune' (negative × negative = positive) and 'The product or quotient of a debt and a fortune is a debt' — directly supporting the lesson's claim that Brahmagupta wrote rules for negative numbers in the 7th century."

  - id: S-291
    title: "MacTutor — A history of Pi"
    type: website
    url: https://mathshistory.st-andrews.ac.uk/HistTopics/Pi_through_the_ages/
    organization: MacTutor History of Mathematics Archive, University of St Andrews
    domains: [D05]
    reviewed: true
    notes: "Cited in U.07.005 L12 (π approximations across cultures: Egypt, Archimedes, Zu Chongzhi). URL verified live (2026-08-18). Page states: in the Rhind Papyrus 'dated about 1650 BC, there is good evidence for 4×(8/9)² = 3.16 as a value for π'; Archimedes obtained 223/71 < π < 22/7 (i.e., between 3 10/71 and 3 1/7); and lists 'Zu Chongzhi (430-501 AD) 355/113' among later improvements. Supports every π claim in the lesson, including 'accurate to six decimal places' (355/113 = 3.1415929...)."

  - id: S-292
    title: "MacTutor — The Indian Sulbasutras"
    type: website
    url: https://mathshistory.st-andrews.ac.uk/HistTopics/Indian_sulbasutras/
    organization: MacTutor History of Mathematics Archive, University of St Andrews
    domains: [D05]
    reviewed: true
    notes: "Cited in U.07.005 L03 (Baudhayana Sulba Sutra: proportional rules for scaling altars) and L10 (3-4-5-type rope triangle / Pythagorean triples in India). URL verified live (2026-08-18). Page states the Sulbasutras 'give rules for constructing altars' to precise measurements, names the 'Baudhayana Sulbasutra written about 800 BC' among the most important, and notes the results are stated 'in terms of ropes' ('sutras came to mean a rope for measuring an altar'), with many Pythagorean triples listed. Supports the lessons' claims about Baudhayana altar-scaling rules and the rope-based right-triangle construction in India. The Egyptian 'rope-stretcher' and Chinese cases are standard documented history; the Egyptian knotted-rope surveying (harpedonaptai) is attested in Greek accounts and the Chinese 3-4-5 (gou-gu) is covered by S-289."

  - id: S-293
    title: "MacTutor — Al-Khwarizmi"
    type: website
    url: https://mathshistory.st-andrews.ac.uk/Biographies/Al-Khwarizmi/
    organization: MacTutor History of Mathematics Archive, University of St Andrews
    domains: [D05]
    reviewed: true
    notes: "Cited in U.07.005 L06 (the word 'algebra' from al-jabr in al-Khwarizmi's 9th-century work). URL verified live (2026-08-18). Al-Khwarizmi (c. 780–850); the page states his algebra treatise 'Hisab al-jabr w'al-muqabala gives us the word algebra and can be considered as the first book to be written on algebra', and explains that al-jabr ('completion') removes negative terms while al-muqabala ('balancing') reduces like terms. Directly supports the lesson's claim."

  - id: S-294
    title: "MacTutor — Simon Stevin"
    type: website
    url: https://mathshistory.st-andrews.ac.uk/Biographies/Stevin/
    organization: MacTutor History of Mathematics Archive, University of St Andrews
    domains: [D05]
    reviewed: true
    notes: "Cited in U.07.005 L04 (Simon Stevin's De Thiende, 1585, popularized decimal fractions in Europe). URL verified live (2026-08-18). Page states Stevin 'presented the first elementary and thorough account of decimal fractions', that 'In 1585 he published La Thiende' (a 29-page booklet on decimal fractions), and — crucially for the lesson's shared-invention framing — that 'Although he did not invent decimals (they had been used by the Arabs and the Chinese long before Stevin's time) he did introduce their use in mathematics in Europe.' Directly supports the lesson's claims, including the hedged 'popularized in Europe, but the idea is a shared human invention.'"

  - id: S-295
    title: "MacTutor — Indian numerals"
    type: website
    url: https://mathshistory.st-andrews.ac.uk/HistTopics/Indian_numerals/
    organization: MacTutor History of Mathematics Archive, University of St Andrews
    domains: [D05]
    reviewed: true
    notes: "Cited in U.07.005 L04 (decimal place-value notation developed in India, transmitted through the Arab world to Europe). URL verified live (2026-08-18). Page quotes Laplace — 'The ingenious method of expressing every possible number using a set of ten symbols (each symbol having a place value and an absolute value) emerged in India' — and documents the base-10 place-value system's development: Nagari/Devanagari numerals evolved 'beginning around the 7th century AD' and were 'transmitted into the Arab world' before reaching Europe. Supports the lesson's hedged claim ('by the 7th century CE ... transmitted through the Arab world')."

  - id: S-296
    title: "MacTutor — Omar Khayyam"
    type: website
    url: https://mathshistory.st-andrews.ac.uk/Biographies/Khayyam/
    organization: MacTutor History of Mathematics Archive, University of St Andrews
    domains: [D05]
    reviewed: true
    notes: "Cited in U.07.005 L08 (the Persian scholar Omar Khayyam's geometric methods for equations). URL verified live (2026-08-18). Omar Khayyam (1048–1131, Persia); the page's summary states he 'discovered a geometrical method of solving cubic equations by intersecting a parabola with a circle', and the biography details his 'Treatise on Demonstration of Problems of Algebra' with geometric solutions via intersecting conic sections. Supports the lesson's claim that he 'used geometric methods for equations'."

  - id: S-297
    title: "Encyclopaedia Britannica — Zakat (Islamic tax)"
    type: website
    url: https://www.britannica.com/topic/zakat-Islamic-tax
    organization: Encyclopaedia Britannica
    domains: [D05]
    reviewed: true
    notes: "Cited in U.07.005 L02 (Islamic zakat as a fixed share of wealth). URL verified live (2026-08-18). Britannica defines zakat as 'an obligatory tax required of Muslims, one of the five Pillars of Islam', levied on categories including 'gold and silver' and 'movable goods', payable yearly. The 2.5% figure (one-fortieth) is the standard documented rate for zakat on monetary wealth/gold/silver (not stated verbatim on this page but the standard rate in all reference works); the lesson's 'fixed share (2.5%) of one's wealth, a percentage used for care, not profit' is accurate."

  - id: S-298
    title: "Encyclopaedia Britannica — Muhammad al-Idrisi"
    type: website
    url: https://www.britannica.com/biography/Muhammad-al-Idrisi
    organization: Encyclopaedia Britannica
    domains: [D05]
    reviewed: true
    notes: "Cited in U.07.005 L11 (al-Idrisi's celebrated 12th-century world map for the court in Sicily). URL verified live (2026-08-18); the biography 'Muhammad al-Idrisi | Geographer, Maps, & Biography' (also known as al-Sharif al-Idrisi) covers the Arab geographer whose world map (Tabula Rogeriana, 1154) was produced for King Roger II of Sicily. Supports the lesson's claim. (Original URL /biography/al-Sharif-al-Idrisi redirects to /biography/Muhammad-al-Idrisi.)"

  - id: S-299
    title: "Encyclopaedia Britannica — Ptolemy"
    type: website
    url: https://www.britannica.com/biography/Ptolemy
    organization: Encyclopaedia Britannica
    domains: [D05]
    reviewed: true
    notes: "Cited in U.07.005 L11 (Ptolemy's coordinates set places in proportion / his Geography). URL verified live (2026-08-18). The Britannica biography of Claudius Ptolemy (2nd century CE) has a 'Geographer' section on his Geography, which assigned latitude/longitude coordinates to places — the coordinate framework the lesson attributes to him. Supports the lesson's claim that Ptolemy's coordinates set places in proportion."

  - id: S-300
    title: "Encyclopaedia Britannica — Dice"
    type: website
    url: https://www.britannica.com/topic/dice
    organization: Encyclopaedia Britannica
    domains: [D05]
    reviewed: true
    notes: "Cited in U.07.005 L14 (dice found in ancient India, Egypt, and Mesopotamia). URL verified live (2026-08-18). The Britannica 'dice' article (History section) states dice 'are ancient implements, used by many cultures', that six-sided dice were found in 'Egyptian tombs dating from 2000 bce', and that dice were used in 'India more than 2,000 years ago', with knucklebones (astragals) used in 'Egypt and the Orient'. Supports Egypt and India explicitly; Mesopotamia (cubical dice in the Royal Game of Ur, c. 2600 BCE) is the standard third example and is accurately included in the lesson's hedged claim. The lesson's phrasing 'dice are found in ancient India, Egypt, and Mesopotamia' is accurate."

  - id: S-301
    title: "Encyclopaedia Britannica — Probability and statistics"
    type: website
    url: https://www.britannica.com/science/probability
    organization: Encyclopaedia Britannica
    domains: [D05, D06]
    reviewed: true
    notes: "Cited in U.07.005 L14 (the careful study of chance began with gamblers' questions in 17th-century Europe, answered by Pascal and Fermat). URL verified live (2026-08-18). The Britannica 'probability and statistics' article includes an 'Early probability' and 'Games of chance' section covering the 17th-century Pascal–Fermat correspondence (1654) on the problem of points as the origin of the mathematical theory of probability. Supports the lesson's claim."

  - id: S-302
    title: "Newton — Philosophiæ Naturalis Principia Mathematica (1687)"
    type: book
    author: Isaac Newton
    organization: Royal Society (London)
    year: 1687
    domains: [D06]
    reviewed: true
    notes: "Cited in U.07.006 L07 (force = mass × acceleration, Newton's second law) and L08 (balanced/unbalanced forces — Newton's first and second laws; gravity and friction). Real, foundational physics text. Newton's second law (change of motion proportional to the impressed force) is the source of the modern F = ma (constant-mass form) the lesson teaches; the first law (a body persists in rest or uniform motion unless acted on by a net force) grounds L08's balanced/unbalanced distinction. The lessons' age-appropriate renderings (more force → more acceleration; more mass → less acceleration for the same force; balanced forces → no change in motion) are correct. No URL (print book)."

  - id: S-303
    title: "Darwin — On the Origin of Species (1859)"
    type: book
    author: Charles Darwin
    organization: John Murray (London)
    year: 1859
    domains: [D06]
    reviewed: true
    notes: "Cited in U.07.006 L04 (heritable variation as the raw material of evolution) and L05 (natural selection — variation + inheritance + differential survival/reproduction over generations). Real, foundational text. The lessons' four-step rendering (variation → environment selects → survivors reproduce → population shifts) is the standard, accurate summary of Darwin's mechanism, and they correctly avoid teleology ('the environment selects without choosing on purpose'; 'nothing decided this'). No URL (print book; public domain)."

  - id: S-304
    title: "Kettlewell (1955) — Selection experiments on industrial melanism (peppered moth, Biston betularia)"
    type: article
    author: H. B. D. Kettlewell
    organization: Heredity
    year: 1955
    domains: [D06]
    reviewed: true
    notes: "Kettlewell, H. B. D. (1955). Selection experiments on industrial melanism in the Lepidoptera. Heredity 9(3), 323–342. Cited in U.07.006 L05 for the peppered-moth case. The lesson's account is accurate and appropriately hedged: the dark 'carbonaria' form became much more common in sooty industrial England, then declined as air was cleaned. Kettlewell's classic mid-20th-century experiments were later criticized for methodological weaknesses (Majerus 1998) and re-run with a stronger design (Cook, Grant, Saccheri & Mallet 2012, Biology Letters — direct evidence of selective bird predation); the lesson correctly writes 'Kettlewell's classic experiments, later refined; the pattern of change is well established.' No URL (print article)."

  - id: S-305
    title: "Grant & Grant — Darwin's finches (Geospiza fortis) on Daphne Major"
    type: article
    author: Peter R. Grant & B. Rosemary Grant
    organization: "Princeton University (Boag & Grant 1981, Science 214:82–85; Grant & Grant 2002, Science 296:707–711; Grant & Grant 2014, 40 Years of Evolution, Princeton Univ. Press)"
    year: 1981
    domains: [D06]
    reviewed: true
    notes: "Cited in U.07.006 L05 for 'measured beak-size shifts across drought years.' Accurate: the Grants' multi-decade field study of the medium ground finch on Daphne Major documented that the 1977 drought (and later droughts) caused a measurable shift in average beak size as large-beaked birds survived on the harder seeds that remained. The lesson's one-line claim is correct and not overstated. No URL (print sources; Boag & Grant 1981 DOI 10.1126/science.214.4516.82)."

  - id: S-306
    title: "Bradford Hill (1965) — The Environment and Disease: Association or Causation?"
    type: article
    author: Austin Bradford Hill
    organization: Proceedings of the Royal Society of Medicine
    year: 1965
    domains: [D06]
    reviewed: true
    notes: "Hill, A. B. (1965). The environment and disease: association or causation? Proceedings of the Royal Society of Medicine, 58(5), 295–300. Cited in U.07.006 L02 as the classic statement of the criteria for moving from correlation to causation. The lesson names strength, consistency, plausible mechanism, and temporality — all genuine Hill criteria — and simplifies them into a learner-friendly four-step checklist (pattern → third variable → mechanism → fair test). Real, foundational epidemiology paper; the simplification is faithful. No URL (print article)."

  - id: S-307
    title: "Tyler Vigen — Spurious Correlations"
    type: website
    url: https://www.spuriouscorrelations.com/
    organization: Tyler Vigen
    domains: [D06]
    reviewed: true
    notes: "Cited in U.07.006 L01 (spurious-correlation gallery; the 'correlation is not causation' idea). URL verified live (2026-08-18): the site's header reads 'spurious correlations — correlation is not causation'; it is a real, well-known collection of real datasets that happen to correlate (data dredging), with the author explicitly explaining the lack of causal connection, confounding variables, and the limits of p-values. CC BY 4.0. On-topic for the lesson's third-variable/spurious-correlation practice. The lesson's ice-cream-and-drowning worked example is the standard common-cause illustration, not taken from this site."

  - id: S-308
    title: "USGS — Geologic Time: Age of the Earth"
    type: website
    url: https://pubs.usgs.gov/gip/geotime/age.html
    organization: U.S. Geological Survey (U.S. Department of the Interior)
    domains: [D06]
    reviewed: true
    notes: "Cited in U.07.006 L12 for the principle of superposition (deeper undisturbed rock layers are older) and the age of Earth (~4.6 billion years). URL verified live (2026-08-18): the page states the best age for the Earth/Solar System is 4.54 billion years (lead-isotope dating of the Canyon Diablo meteorite, <1% uncertainty) and that the oldest Earth rocks/crystals are 4.0–4.3 billion years old. The lesson's 'about 4.6 billion years' is the standard, correct rounding of 4.54 Ga. Superposition is a standard USGS-geologic-time concept (see the USGS geologic-time graphic linked from this page). US-centric agency, but the age of Earth and superposition are universal geology. Complements S-212 (USGS Water Science School)."

  - id: S-309
    title: "NOAA — Climate (climate.gov / NOAA.gov/climate)"
    type: website
    url: https://www.climate.gov/
    organization: National Oceanic and Atmospheric Administration (NOAA)
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.07.006 L11 (the climate system — Sun + atmosphere + ocean + land — and the greenhouse effect) as the NOAA authority alongside the IPCC. URL verified live (2026-08-18): climate.gov currently redirects to NOAA.gov/climate ('NOAA experts provide data, tools and information to help people understand, prepare for and adapt to our changing climate'), with Drought.gov/Heat.gov and climate-data quick links. NOAA is the authoritative U.S. climate/ocean/atmosphere agency and documents the greenhouse effect and ocean heat transport the lesson describes. US-centric source; used alongside the IPCC (global) as one authority, not the only tradition."

  - id: S-310
    title: "Ripple & Beschta (2012) — Trophic cascades in Yellowstone (wolves, elk, aspen)"
    type: article
    author: William J. Ripple & Robert L. Beschta
    organization: Biological Conservation
    year: 2012
    domains: [D06, D10]
    reviewed: true
    notes: "Ripple, W. J., & Beschta, R. L. (2012). Trophic cascades in Yellowstone: The first 15 years after wolf reintroduction. Biological Conservation 145(1), 205–213 (see also Beschta & Ripple 2009, Biological Conservation 142:2401–2414). Cited in U.07.006 L06 for the wolf–Yellowstone trophic cascade. ACCURACY NOTE: the lesson originally wrote that returning wolves 'changed rivers and forests,' echoing the popular 'How Wolves Change Rivers' simplification. Fact-check corrected this to the accurate, hedged form: wolves were extirpated from Yellowstone by ~1930 and reintroduced 1995–1996; their return reduced elk numbers and browsing, and some willow/aspen recovery followed — but the ecosystem's response has been complex, spatially variable, and contested, and recent work (Brice et al. 2025, Ecological Monographs; Hobbs et al. 2024, Ecological Monographs) cautions against treating Yellowstone as a straightforward 'wolves changed the rivers' cascade. The lesson now states the documented reduction in elk browsing and partial plant recovery without overstating the rivers claim. No URL (print article)."

  - id: S-311
    title: WHO — Mental health of adolescents (fact sheet)
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/adolescent-mental-health
    organization: World Health Organization
    year: 2025
    domains: [D03]
    reviewed: true
    notes: "Cited in U.07.008 L07/L08 (Social Media & Mental Health; Social-Media Boundaries) and L01 (Media Images & Body Image). URL verified live (2026-08-18); page dated 1 September 2025. States adolescence is 'a unique and formative time' and 'a crucial period for developing social and emotional habits important for mental well-being' — including 'adopting healthy sleep patterns' — and that 'Media influence and gender norms can exacerbate the disparity between an adolescent's lived reality and their perceptions or aspirations for the future,' and that 'Digital media, like any other media, can play a significant role in either enhancing or weakening suicide prevention efforts.' The lesson's claims (social media can both lift — connection, learning, creativity — and weigh down — comparison, disrupted sleep; adolescence is a critical time whose digital habits can shape it) are accurate, hedged ('can', 'linked to'), and consistent with the WHO page's balanced, non-causal framing. Also supports the L01 facilitator note that media influence can widen the gap between how adolescents see themselves and the ideals they are shown. Global, non-Western-aligned source. Also cited in U.07.012 L03 (The Routine I'll Carry Forward) for adolescence as a formative time for building healthy habits including sleep."

  - id: S-312
    title: WHO — Set of recommendations on the marketing of foods and non-alcoholic beverages to children
    type: report
    url: https://www.who.int/publications/i/item/9789241500210
    organization: World Health Organization
    year: 2010
    domains: [D03]
    reviewed: true
    notes: "Cited in U.07.008 L03/L04 (Food Marketing: Claims vs. Evidence; Evaluating Food Ads) for the claim that the WHO recommends limits on marketing foods high in fat, salt, and sugar to children. URL verified live (2026-08-18); ISBN 978-92-4-150021-0, endorsed by WHA63.14. The overview states the document 'calls for national and international action to reduce the impact on children of marketing of foods high in saturated fats, trans-fatty acids, free sugars, or salt.' The lesson's paraphrase (WHO recommends limits on marketing foods high in fat, salt, and sugar to children) is faithful; the lesson correctly holds the 'no food is good or bad / every family's way of eating is honored' framing as a value, distinct from the recommendation. Complements S-038 (WHO healthy diet fact sheet)."

  - id: S-313
    title: IFRC Global First Aid Reference Centre (GFARC)
    type: website
    url: https://www.globalfirstaidcentre.org/
    organization: International Federation of Red Cross and Red Crescent Societies (IFRC)
    domains: [D03]
    reviewed: true
    notes: "Cited in U.07.008 L05 (First Aid: Bleeding & Burns) and L06 (First Aid: Choking & Getting Help) as the page-level authority for the first-aid steps. URL verified live (2026-08-18): GFARC is the IFRC 'centre of excellence' (managed by the French Red Cross) that publishes the International First Aid, Resuscitation and Education Guidelines (2020, updated 2025). The lessons' steps all match those guidelines: bleeding — direct pressure with a clean cloth, get medical help if heavy/spurting/won't stop; burns — cool under cool running water (never ice) about 20 minutes if possible, remove tight items such as rings, do not pop blisters, get help for large/deep burns or burns to the face, hands, feet, or joints; choking — recognize the universal sign (hands at the throat), call the emergency number and get an adult, give back blows and abdominal thrusts only if trained. The lessons are appropriately hedged and safety-first (help-seeking framed as part of first aid; thrusts learned from a certified instructor and never practiced on a peer; emergency numbers taught as region-specific 112/999/911/local). Companion general authority: S-082 (ifrc.org first-aid programme page)."

  - id: S-314
    title: Encyclopaedia Britannica — Historiography (periodization)
    type: website
    url: https://www.britannica.com/topic/historiography
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.07.009 L01 (Why Historians Divide Time into Periods) for the claim that periodization is a human convention, not a fact of nature. URL verified live (2026-08-18): Britannica's 'historiography' article (sections 'Methodology of historiography' and 'The presentation of history') treats the dividing of history into periods/eras as a choice historians make and revise, not a feature written in nature. Supports the lesson's core claim that dividing lines are human choices drawn differently by different peoples. (Note: Britannica has no standalone 'periodization' entry — the lesson originally named a non-existent 'periodization' article; corrected to 'historiography' during fact-check.)"

  - id: S-315
    title: Encyclopaedia Britannica — Calendar / Gregorian calendar / Islamic calendar
    type: website
    url: https://www.britannica.com/science/calendar
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.07.009 L02 (Calendars: Many Ways to Count the Years) for the solar vs lunar year lengths (≈365.24 vs ≈354 days), the Gregorian reform of 1582, and the Islamic Hijri calendar's start in 622 CE. URL verified live (2026-08-18): Britannica's 'calendar' article has sections 'The Muslim calendar,' 'The Gregorian calendar,' 'The Mayan calendar,' 'The Jewish calendar,' 'The Chinese calendar,' and 'The Hindu calendar,' directly supporting the claim that many calendar systems coexist and that the Gregorian calendar is solar while the Islamic calendar is lunar (twelve synodic months, ~354 days). The 622 CE Hijra epoch and 1582 Gregorian reform are standard, stated in the companion 'Islamic calendar' and 'Gregorian calendar' entries. The lesson's claim that a calendar's 'year one' is a choice is a values/egalitarian framing, not a factual claim."

  - id: S-316
    title: Stanford History Education Group (SHEG) — historical thinking (sourcing, causality)
    type: website
    url: https://sheg.stanford.edu/
    organization: Stanford History Education Group
    domains: [D08]
    reviewed: true
    notes: "Cited in U.07.009 L03 (Many Causes, Many Consequences) for the claim that multiple causation and intended/unintended consequences are core, teachable historical-thinking skills (sourcing and causality). SHEG is a real, long-established research-and-curriculum group (Stanford University) whose 'Reading Like a Historian' framework treats sourcing, contextualization, corroboration, and causal analysis as teachable skills. The site returned a transient 503 to the fact-checker's environment on 2026-08-18, but the group and its framework are real and well established; cited as a general pedagogical authority, not a claim-level citation for any specific fact."

  - id: S-317
    title: Encyclopaedia Britannica — Paper / Papermaking
    type: website
    url: https://www.britannica.com/technology/papermaking
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.07.009 L04 (The Spread of Paper) for the invention of paper in China (2nd century BCE fragments; Cai Lun c. 105 CE) and its westward spread via Central Asia and Baghdad to Europe. URL verified live (2026-08-18): Britannica's 'papermaking' article has a 'Historical development' section documenting paper's Chinese origin, the traditional attribution to Cai Lun (c. 105 CE), and the craft's transmission westward (Samarkand, Baghdad, then Europe by the 12th–15th centuries). The Battle of Talas (751 CE) papermaker tradition and Bi Sheng's movable type (c. 1040s) are standard; the lesson correctly states the Talas account as tradition, not certainty. Companion authority: S-264 (British Library, history of paper)."

  - id: S-318
    title: Encyclopaedia Britannica — Zero / Hindu-Arabic numerals
    type: website
    url: https://www.britannica.com/topic/zero-mathematics
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.07.009 L05 (Zero: A Number That Changed the World) for the Indian origin of the decimal place-value system with zero and the ten glyphs 0–9, Brahmagupta's 7th-century rules, and the system's spread via al-Khwarizmi (c. 820 CE) and Fibonacci's Liber Abaci (1202). URL verified live (2026-08-18): Britannica's 'zero' article has sections 'The Indian invention' and 'From India to the world,' documenting the Indian origin of zero as both placeholder and number, Brahmagupta's rules, and transmission through Arabic-speaking scholars to Europe (hence 'Hindu-Arabic numerals'). The companion 'Hindu-Arabic numerals' entry is likewise real. Companion authority: S-023 (Ifrah), S-272 (Joseph), S-240 (MacTutor)."

  - id: S-319
    title: Encyclopaedia Britannica — Avicenna / The Canon of Medicine / al-Razi
    type: website
    url: https://www.britannica.com/biography/Avicenna
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.07.009 L06 (The Canon of Medicine and the First Hospitals) for Ibn Sina (Avicenna, 980–1037, Persian), the Canon of Medicine (c. 1025 CE, five-volume encyclopedia), its centuries-long use in the Islamic world and European universities, and al-Razi's distinction of smallpox from measles. URL verified live (2026-08-18): Britannica's 'Avicenna' biography documents Ibn Sina's dates (980–1037), his Persian origin, and the Canon of Medicine's encyclopedic scope and long use; the companion 'The Canon of Medicine' entry documents the five-book structure and its status as a standard medical text into the early modern period; 'al-Razi' documents his smallpox/measles distinction. The bimaristan (hospital with care, teaching, pharmacy) is standard in the history of medicine. The lesson's 'first hospitals' title is a mild shorthand — the body correctly says bimaristans were 'advanced for their time,' not literally the first hospitals in history."

  - id: S-320
    title: CSIRO — Indigenous Cultural Burning education resources
    type: website
    url: https://www.csiro.au/en/education/Resource-Library/Indigenous-STEM-Education-Resources/Cultural-Burning-Resources
    organization: CSIRO (Commonwealth Scientific and Industrial Research Organisation)
    domains: [D08, D10]
    reviewed: true
    notes: "Cited in U.07.009 L07 (Two Knowledge Systems: Fire and the Forest) for Aboriginal and Torres Strait Islander cultural burning as a long-standing, living fire-management practice. URL verified live (2026-08-18): CSIRO (Australia's national science agency) states 'For thousands of years, Aboriginal and/or Torres Strait Islander Peoples have cared for Country using the traditional fire management practice of Cultural Burning,' describes cool/low fires that 'promote plant growth, maintain habitats,' and reduce fuel, and describes the practice as one 'recognised and applied today.' Directly supports the lesson's claims about cultural burning's long history, cool-burn technique, land-health benefits, and living (not merely 'ancient') status. The lesson's claim that cultural burning and formal fire science are equal knowledge systems is a values/egalitarian framing (philosophy §4), not a CSIRO factual claim."

  - id: S-321
    title: Firesticks Alliance (now Living Knowledge Network) — Indigenous fire and cultural burning
    type: website
    url: https://www.firesticks.org.au/
    organization: Firesticks Alliance / Living Knowledge Network
    domains: [D08, D10]
    reviewed: true
    notes: "Cited in U.07.009 L07 as an Indigenous fire organization describing cultural burning's long history and benefits. URL verified live (2026-08-18): firesticks.org.au resolves to 'Living Knowledge Network — The next chapter of Firesticks,' a community-led Indigenous network (founded by Tagalaka man Victor Steffensen) 'Born from Cultural Fire practices,' which describes cultural burning as knowledge of 'the oldest living cultures on Earth' for healing Country. Real, on-topic Indigenous-led authority. (Note: the organization has rebranded from 'Firesticks Alliance' to 'Living Knowledge Network'; the domain still resolves and the content is on-topic.)"

  - id: S-322
    title: Trans-Atlantic Slave Trade Database (SlaveVoyages)
    type: website
    url: https://www.slavevoyages.org/
    organization: SlaveVoyages (Emory University and collaborators)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.07.009 L08 (Choosing to Move, Forced to Move) for the scale of the transatlantic slave trade ('at least 12 million Africans forcibly transported'). URL verified live (2026-08-18): slavevoyages.org is the authoritative quantitative database of the transatlantic slave trade (Emory University consortium); its consensus figure is that roughly 12.5 million captives were embarked, of whom ~10.7 million disembarked. The lesson's conservative 'at least 12 million' is accurate and not overstated. Companion authority: S-274 (UNESCO Routes of Enslaved Peoples). The lesson names the figure briefly and non-graphically, deferring fuller study to Grade 8 (per facilitation.md)."

  - id: S-323
    title: Encyclopaedia Britannica — Silk Road / Indian Ocean trade
    type: website
    url: https://www.britannica.com/topic/Silk-Road-trade-route
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.07.009 L09 (Rivers, Oceans, Deserts, Mountains) for the Silk Roads as overland routes across deserts and mountains carrying silk, spices, paper, and ideas (Buddhism, numerals) between East Asia and the Mediterranean, and for monsoon-driven Indian Ocean trade linking East Africa, Arabia, India, and Southeast Asia. URL verified live (2026-08-18): Britannica's 'Silk Road' article documents the network of overland routes, its goods, and its role in transmitting ideas and religions. The Indian Ocean monsoon-sailing network is standard (companion 'Indian Ocean trade' entry and S-207, UNESCO Indian Ocean). The claim that rivers (Nile, Niger, Ganges, Indus) fed early civilizations and that the Inka built a road system across the Andes is likewise standard and documented in the relevant Britannica entries (S-141, S-088)."

  - id: S-324
    title: Encyclopaedia Britannica — Montgomery bus boycott
    type: website
    url: https://www.britannica.com/event/Montgomery-bus-boycott
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.07.009 L10 (Ways People Resist) for the Montgomery bus boycott (USA, 1955–56) as an example of boycott as a form of resistance. URL verified live (2026-08-18): Britannica's 'Montgomery bus boycott' article documents the December 1955–December 1956 boycott of segregated buses (sparked by Rosa Parks' arrest, led in part by Martin Luther King Jr.), lasting over a year and ending with the Browder v. Gayle Supreme Court ruling. Matches the lesson's 'people stopped riding segregated buses for over a year' claim. Companion authorities: S-087 (Britannica Salt March, for the 1930 protest example)."

  - id: S-325
    title: Encyclopaedia Britannica — Capoeira
    type: website
    url: https://www.britannica.com/sports/capoeira
    organization: Encyclopaedia Britannica
    domains: [D03, D08]
    reviewed: true
    notes: "Cited in U.07.009 L10 for capoeira (Brazil) as an art of movement and song created by enslaved Africans, carrying strength and identity. URL verified live (2026-08-18): Britannica's 'capoeira' article documents capoeira as an Afro-Brazilian martial-art/dance form that developed among enslaved Africans in Brazil. The UNESCO inscription of the 'capoeira circle' (2014) is registered as S-056. The lesson's framing of capoeira as a form of resistance art and identity is a standard, well-documented interpretation, not overstated."

  - id: S-326
    title: Encyclopaedia Britannica — Western colonialism
    type: website
    url: https://www.britannica.com/topic/colonialism
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.07.009 L11 (What Colonization Took) for the global reach of European colonization from the late 1400s and its effects (dispossession, suppression of languages and practices, imposition of foreign rule). URL verified live (2026-08-18): Britannica's 'Western colonialism' article documents European overseas expansion from the late 15th century across the Americas, Africa, Asia, and Oceania, and its effects on colonized peoples. The residential/boarding-school practice of punishing Indigenous children's languages is documented by national truth-and-reconciliation commissions (e.g., Canada) and UNESCO's language-loss/revitalization work; the lesson states this without graphic detail. The lesson's pairing of loss with continuity is a values-and-accuracy commitment (philosophy §4), not a historical claim."

  - id: S-327
    title: Encyclopaedia Britannica — Woman suffrage
    type: website
    url: https://www.britannica.com/topic/woman-suffrage
    organization: Encyclopaedia Britannica
    domains: [D09]
    reviewed: true
    notes: "Cited in U.07.010 L06 (A Human-Rights Case: Honored and Violated) for the dates women gained the national vote — New Zealand 1893 (first self-governing country to grant women the national vote), Switzerland 1971, Saudi Arabia 2015. URL verified live (2026-08-18): Britannica's 'woman suffrage' article documents these dates (the fetched article text contains 1893, 1971, 2015, New Zealand, Switzerland, Saudi Arabia). The lesson offers the dates as examples of a right honored at different times, not as a complete list, and correctly distinguishes the declared right (UDHR Art. 21, S-149) from its uneven enjoyment."

  - id: S-328
    title: Encyclopaedia Britannica — Chipko movement
    type: website
    url: https://www.britannica.com/topic/Chipko-movement
    organization: Encyclopaedia Britannica
    domains: [D09]
    reviewed: true
    notes: "Cited in U.07.010 L08 (Civil Society: Acting for the Common Good) for the Chipko movement — India, 1970s; villagers (especially women) embraced trees to stop them being cut, protecting the forests their communities depended on. URL verified live (2026-08-18): Britannica's 'Chipko movement' article ('Indian environmental movement', also 'Chipko andolan') documents the movement, its Gandhian nonviolence inspiration, and protesters embracing trees to prevent felling. The lesson states it with a 'for example' hedge and treats it as one case of civil society acting for the common good."

  - id: S-329
    title: IFRC — International Red Cross and Red Crescent Movement
    type: website
    url: https://www.ifrc.org/
    organization: International Federation of Red Cross and Red Crescent Societies (IFRC)
    domains: [D09]
    reviewed: true
    notes: "Cited in U.07.010 L08 (Civil Society) for the Red Cross/Red Crescent movement as an example of neutral, voluntary humanitarian aid. URL verified live (2026-08-18): the IFRC homepage describes the IFRC as 'the world's largest humanitarian network', supporting local Red Cross and Red Crescent action in more than 191 countries with more than 18 million volunteers — on-topic for the lesson's one-line claim that the movement 'gives neutral humanitarian aid in crises'. General authority, not a claim-level citation for a specific statistic."

  - id: S-330
    title: Encyclopaedia Britannica — Pollination
    type: website
    url: https://www.britannica.com/science/pollination
    organization: Encyclopaedia Britannica
    domains: [D10]
    reviewed: true
    notes: "Cited in U.07.011 L07 (Partners in Life: Pollination and Symbiosis) for the claim that pollination is the transfer of pollen that enables plants to make seeds, and that pollinators (bees and others) receive nectar and pollen (food) while the plant gains reproduction — a mutualism in which both benefit. URL verified live (2026-08-18): Britannica's 'pollination' article opens 'pollination, transfer of pollen grains from the stamens (the flower parts that produce them) to the ovule-bearing organs or to the ovules (seed precursors) themselves', states 'pollination is essential to the perpetuation of the vast majority of the world's wild plants as well as to the production of most fruit and seed crops', and documents bees as pollinators that feed on nectar and pollen, with nectar attracting pollinators to the stamens. Directly supports the lesson's mutualism framing (bee gets food; plant gets pollen moved so it can make seeds)."

  - id: S-331
    title: Encyclopaedia Britannica — Symbiosis
    type: website
    url: https://www.britannica.com/science/symbiosis
    organization: Encyclopaedia Britannica
    domains: [D10]
    reviewed: true
    notes: "Cited in U.07.011 L07 (Partners in Life: Pollination and Symbiosis) for the claim that symbiosis is a close relationship between two different species, and that mutualism is the kind in which both partners benefit (contrasted with parasitism, where one benefits and the other is harmed). URL verified live (2026-08-18): Britannica's 'symbiosis' article opens 'symbiosis, any of several living arrangements between members of two different species, including mutualism, commensalism, and parasitism. Both positive (beneficial) and negative (unfavourable to harmful) associations are therefore included', and adds 'Any association between two species populations that live together is symbiotic, whether the species benefit, harm, or have no effect on one another.' Directly supports the lesson's mutualism/parasitism contrast; the lesson's 'close relationship between two different species' is a faithful, appropriately simplified rendering for grade 7."

  - id: S-332
    title: Albert Ellis Institute — Rational Emotive Behavior Therapy (the ABC model)
    type: website
    url: https://albertellis.org/rebt-cbt-therapy/
    organization: Albert Ellis Institute
    domains: [D01]
    reviewed: true
    notes: "The ABC model (Activating event, Beliefs, Consequences) at the core of Rational Emotive Behavior Therapy (REBT), developed by psychologist Albert Ellis. URL verified live (2026-08-18): albertellis.org/rebt-cbt-therapy/ is the Albert Ellis Institute's REBT page — 'REBT is the pioneering form of cognitive behavior therapy developed by Dr. Albert Ellis in 1955' and 'it is largely our thinking about events that leads to emotional and behavioral upset' (the belief-mediated, A-B-C view of emotional consequences). On-topic for the Grade-8 lesson L.08.001.02, which adapts the ABC frame descriptively (event, thought, feeling) to teach that a thought/belief sits between an event and its emotional consequence — used as a self-awareness tool, not as therapy, and explicitly framed as such."

  - id: S-333
    title: "Lerner, Li, Valdesolo & Kassam (2015) — Emotion and Decision Making"
    type: article
    url: https://doi.org/10.1146/annurev-psych-010213-115043
    author: Jennifer S. Lerner, Ye Li, Piercarlo Valdesolo, Karim S. Kassam
    organization: Annual Review of Psychology
    year: 2015
    domains: [D01]
    reviewed: true
    notes: "Annual Review of Psychology 66:799-823. DOI 10.1146/annurev-psych-010213-115043 verified via Crossref (2026-08-18): title 'Emotion and Decision Making', authors Lerner/Li/Valdesolo/Kassam, Annual Review of Psychology 66, 799-823 (2015) — all correct. The review's thesis is that emotion is integral to — not the opposite of — judgment and decision-making: emotion can improve decision quality (the 'informing' half) and can also bias or degrade it (the 'distorting' half). Supports both halves of the Grade-8 objective D01.S1.08.02 in L.08.001.03 and L.08.001.04."

  - id: S-334
    title: "Crenshaw (1989) — Demarginalizing the Intersection of Race and Sex"
    type: article
    url: https://chicagounbound.uchicago.edu/uclf/vol1989/iss1/8
    author: Kimberlé Crenshaw
    organization: University of Chicago Legal Forum
    year: 1989
    domains: [D01]
    reviewed: true
    notes: "University of Chicago Legal Forum 1989(1):139-167. URL verified live (2026-08-18): chicagounbound.uchicago.edu/uclf/vol1989/iss1/8 hosts the full text — 'Demarginalizing the Intersection of Race and Sex: A Black Feminist Critique of Antidiscrimination Doctrine, Feminist Theory and Antiracist Politics', Kimberle Crenshaw, University of Chicago Legal Forum Vol. 1989, Article 8 (ISSN 0892-5593). The foundational statement of intersectionality — that overlapping identities (such as race and sex) shape a person's experience together, not separately, and that analyzing them in isolation misses how they interact. The Grade-8 lesson L.08.001.05 uses the concept descriptively and age-appropriately to teach that multiple and intersecting identities (culture, gender, ability, language) shape a whole self (D01.S2.08.01)."

  - id: S-335
    title: "Crocker & Wolfe (2001) — Contingencies of Self-Worth"
    type: article
    url: https://doi.org/10.1037/0033-295X.108.3.593
    author: Jennifer Crocker, Connie T. Wolfe
    organization: Psychological Review
    year: 2001
    domains: [D01]
    reviewed: true
    notes: "Psychological Review 108(3):593-623. DOI 10.1037/0033-295X.108.3.593 verified via Crossref (2026-08-18): title 'Contingencies of self-worth.', authors Crocker/Wolfe, Psychological Review 108(3), 593-623 (2001) — all correct. Argues that self-worth that depends (is 'contingent') on meeting external standards — approval, appearance, performance — is more fragile and more costly than self-worth that is less contingent. Supports the Grade-8 lesson L.08.001.06 on distinguishing inner worth from outside approval (D01.S2.08.02)."

  - id: S-336
    title: "Mischel, Shoda & Rodriguez (1989) — Delay of Gratification in Children"
    type: article
    url: https://doi.org/10.1126/science.2658056
    author: Walter Mischel, Yuichi Shoda, Monica L. Rodriguez
    organization: Science
    year: 1989
    domains: [D01]
    reviewed: true
    notes: "Science 244(4907):933-938. DOI 10.1126/science.2658056 verified via Crossref (2026-08-18): title 'Delay of Gratification in Children', authors Mischel/Shoda/Rodriguez, Science 244(4907), 933-938 (1989) — all correct. The classic 'marshmallow test' paper (the 'cool' vs 'hot' cognitive transformations that enable or undermine delay). The Grade-8 lesson L.08.001.07 teaches the pause skill and the hot/cool framing, while explicitly noting the replication caveat: later, more careful studies (Watts, Duncan & Quan 2018, 'Revisiting the Marshmallow Test: A Conceptual Replication…', Psychological Science, DOI 10.1177/0956797618761661, verified via Crossref 2026-08-18) found much weaker long-term predictions once background and sample differences are controlled. We teach the learnable pause, not a claim that one childhood test predicts a life."

  - id: S-337
    title: "Kahneman (2011) — Thinking, Fast and Slow"
    type: book
    url: https://en.wikipedia.org/wiki/Thinking,_Fast_and_Slow
    author: Daniel Kahneman
    organization: Farrar, Straus and Giroux
    year: 2011
    domains: [D01]
    reviewed: true
    notes: "Kahneman's System 1 (fast, automatic, emotional) versus System 2 (slow, deliberate, effortful) distinction, and related findings on present bias and time discounting (valuing a smaller immediate reward over a larger delayed one). Real, well-known book (Farrar, Straus and Giroux, 2011); URL (Wikipedia) verified live (2026-08-18). Supports L.08.001.04 (a slower check corrects vivid but wrong first reactions), L.08.001.08 (present bias / why the brain favors 'now'), and their framing in L.08.001.09."

  - id: S-338
    title: American Psychological Association — Stress effects on the body
    type: website
    url: https://www.apa.org/topics/stress/body
    organization: American Psychological Association
    year: 2018
    domains: [D03]
    reviewed: true
    notes: "Describes the acute fight-or-flight (fight-flight-freeze) stress response — nervous and endocrine activation (adrenaline/epinephrine and cortisol) that readies the body for danger — and the health costs of chronic stress when the response does not turn off (musculoskeletal tension, cardiovascular strain, digestive upset, sleep disruption, and effects on mood). URL verified live (2026-08-18): the page states the autonomic nervous system divides into sympathetic (SNS, 'fight or flight') and parasympathetic (PNS) branches; that acute stress raises heart rate and releases adrenaline/noradrenaline/cortisol; and that chronic stress produces wear-and-tear (muscle tension, cardiovascular strain, gut and sleep disruption, mood effects). Cited in Grade-8 lessons L.08.002.02 and L.08.002.03 (D03.S1.08.01 and D03.S1.08.02). US-based organization but a standard authority on the physiology of stress; treated as one scientific account alongside others."

  - id: S-339
    title: "Cleveland Clinic — What Happens During Fight-or-Flight Response?"
    type: website
    url: https://health.clevelandclinic.org/what-happens-to-your-body-during-the-fight-or-flight-response
    organization: Cleveland Clinic
    year: 2024
    domains: [D03]
    reviewed: true
    notes: "Explains the sympathetic nervous system's fight-or-flight (and freeze/fawn) stress response — the body changes it triggers (faster heart rate and blood pressure, quicker and heavier breathing, dilated pupils, tense/trembling muscles, and digestion and other non-urgent functions temporarily paused) — and notes the parasympathetic nervous system ('rest and digest') returns the body to calm. URL re-verified live (2026-08-18): the article was retitled from 'Fight, Flight, Freeze: What This Response Means'; the previously registered URL (health.clevelandclinic.org/fight-flight-freeze-response) now returns 404, and the live article is at /what-happens-to-your-body-during-the-fight-or-flight-response (published 22 July 2024, headline 'What Is the Fight, Flight, Freeze or Fawn Response?'). Cited in Grade-8 lesson L.08.002.02 (D03.S1.08.01) for the basic role of the nervous system in sensing and responding."

  - id: S-340
    title: "Harvard Health — Relaxation techniques: Breath control helps quell errant stress response"
    type: website
    url: https://www.health.harvard.edu/mind-and-mood/relaxation-techniques-breath-control-helps-quell-errant-stress-response
    organization: Harvard Health Publishing
    year: 2024
    domains: [D03]
    reviewed: true
    notes: "Describes how slow, deliberate breathing (especially a longer exhale) activates the parasympathetic nervous system and lowers the fight-or-flight response, as one healthy way to help the body return to calm. URL verified live (2026-08-18): page title matches exactly ('Relaxation techniques: Breath control helps quell errant stress response', reviewed 24 July 2024 by Howard E. LeWine, MD); the full article sits behind the Harvard Health Online+ login, but the title/topic directly support the claim that breath control quells the stress response. Cited in Grade-8 lesson L.08.002.03 (D03.S1.08.02) alongside sleep, movement, and connection as named ways to unwind. Treated as one scientific account; the lesson also holds breathing practices from many cultures (pranayama, qigong, and others) side by side without ranking them."

  - id: S-341
    title: World Health Organization — Physical activity fact sheet
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/physical-activity
    organization: World Health Organization
    year: 2024
    domains: [D03]
    reviewed: true
    notes: "WHO guidance that regular physical activity supports health and that a balanced routine includes aerobic (endurance) activity and muscle-strengthening activity, with balance and flexibility also part of functional capacity across the lifespan. URL verified live (2026-08-18): the fact sheet (dated 26 June 2024) states regular physical activity 'provides significant physical and mental health benefits', that 'both moderate- and vigorous-intensity physical activity improve health', and that 'muscle strengthening benefits everyone'; it points to the WHO Guidelines on physical activity and sedentary behaviour, which recommend aerobic and muscle-strengthening activity for all ages and balance/functional training (especially for older adults). Cited in Grade-8 lessons L.08.002.04 and L.08.002.05 (D03.S2.08.01) for the strength/endurance/flexibility framing of movement design. Global and authoritative by design."

  - id: S-342
    title: UNESCO — International Charter of Physical Education, Physical Activity and Sport
    type: website
    url: https://www.unesco.org/en/sport-and-anti-doping/international-charter-sport
    organization: UNESCO
    year: 2015
    domains: [D03]
    reviewed: true
    notes: "UNESCO's revised International Charter (2015) states that the practice of physical education, physical activity and sport is a fundamental right for all, and that opportunities must be inclusive and accessible to every person regardless of ability, background, or other status. URL verified live (2026-08-18): the page confirms Article 1 — 'The practice of physical education, physical activity and sport is a fundamental right for all' — and that the revised Charter 'promotes inclusive access to sport by all without any form of discrimination', adopted at UNESCO's 38th General Conference (November 2015). Cited in Grade-8 lesson L.08.002.06 (D03.S2.08.02) as the egalitarian frame for fair play and inclusive movement."

  - id: S-343
    title: "Suler (2004) — The Online Disinhibition Effect"
    type: article
    author: John Suler
    organization: CyberPsychology & Behavior
    year: 2004
    url: https://doi.org/10.1089/1094931041291295
    domains: [D02]
    reviewed: true
    notes: "Suler, J. (2004). The Online Disinhibition Effect. CyberPsychology & Behavior, 7(3), 321–326. DOI 10.1089/1094931041291295 verified (CyberPsychology & Behavior is Mary Ann Liebert, Inc.). Real, foundational, correctly attributed article on how online communication, with its reduced social cues (no tone, no face, often no immediate reply), both loosens self-restraint ('disinhibition') and makes messages easier to misread. Cited in Grade-8 lesson L.08.003.03 (D02.S1.08.01) for the claim that digital messages remove the tone and body cues that carry meaning and can loosen self-restraint, so misreading is common and checking is a skill — on-topic and not overstated (the lesson hedges 'reduced-cues' and 'can loosen,' matching Suler's framing). Verified by fact-checker 2026-08-18."

  - id: S-344
    title: "Banaji & Greenwald (2013) — Blindspot: Hidden Biases of Good People"
    type: book
    author: Mahzarin R. Banaji & Anthony G. Greenwald
    organization: Delacorte Press
    year: 2013
    domains: [D02]
    reviewed: true
    notes: "Banaji, M. R., & Greenwald, A. G. (2013). Blindspot: Hidden Biases of Good People. New York: Delacorte Press. Real, well-known book (ISBN 978-0553804645); Banaji & Greenwald are the Harvard/U. Washington researchers behind the Implicit Association Test. Foundational, accessible account of implicit (automatic) bias — the idea that bias often operates below conscious awareness, shaped by the culture one is surrounded by, and can be caught and questioned rather than pretended away. Cited in Grade-8 lesson L.08.003.06 (D02.S2.08.02) for the claim that bias is often automatic, not deliberate, and therefore something to recognize and question — accurate and on-topic. The lesson holds 'reducing a person to a label is wrong' as a values commitment, distinct from the factual claim about automatic bias. Verified by fact-checker 2026-08-18."

  - id: S-345
    title: "Dean Spade (2020) — Mutual Aid: Building Solidarity During This Crisis (and the Next)"
    type: book
    author: Dean Spade
    organization: Verso
    year: 2020
    domains: [D02]
    reviewed: true
    notes: "Spade, D. (2020). Mutual Aid: Building Solidarity During This Crisis (and the Next). London: Verso (ISBN 978-1839762123). Real, widely read book (Dean Spade is a law professor and trans-rights/mutual-aid organizer); accurately distinguishes charity — a one-way gift in which the giver keeps the power and the receiver stays passive and often must prove need — from mutual aid and solidarity, in which people meet one another's needs together as equals, sharing both the giving and the deciding. Cited in Grade-8 lesson L.08.003.10 (D02.S4.08.02) for the charity-versus-mutual-aid distinction — accurate and on-topic. The lesson holds 'sharing power is better than only sharing goods' as a values commitment, distinct from the descriptive distinction, and explicitly says the difference is not 'charity is bad.' Also cited in U.10.012 L06 (Mutual Aid: Solidarity in Action) for the same charity-vs-mutual-aid distinction (where the power sits). Verified by fact-checker 2026-08-18."

  - id: S-346
    title: "Aristotle — Rhetoric (ethos, pathos, logos)"
    type: website
    url: https://plato.stanford.edu/entries/aristotle-rhetoric/
    organization: Stanford Encyclopedia of Philosophy
    year: 2022
    domains: [D04]
    reviewed: true
    notes: "Aristotle's Rhetoric (c. 350 BCE), the founding analysis of persuasion in the Greek tradition, organizes means of persuasion into three appeals — ethos (the character/credibility of the speaker), pathos (the audience's emotion), and logos (the argument/reasoning itself). Cited in Grade-8 lesson L.08.004.02 for the claim that word choice, tone, and delivery are analyzed as persuasive craft, and that Aristotle named three appeals. Held as one (ancient Greek) tradition among many rhetorical traditions worldwide — not the only one; the lesson notes other cultures have their own arts of speaking. URL verified live (2026-08-18): SEP 'Aristotle's Rhetoric' entry (first published 2002; substantive revision 2022) states verbatim that persuasion 'can produce persuasion either through the character (êthos) of the speaker, the emotional state (pathos) of the listener, or the argument (logos) itself' (§5, 'The Three Means of Persuasion') — exactly the claim cited. Correctly attributed; year corrected to 2022 (the SEP revision date, not 2010)."

  - id: S-347
    title: "Encyclopaedia Britannica — Figure of speech (metaphor, simile, personification, hyperbole)"
    type: website
    url: https://www.britannica.com/art/figure-of-speech
    organization: Encyclopaedia Britannica
    domains: [D04]
    reviewed: true
    notes: "Standard reference for the major figures of speech. Metaphor (an implicit comparison), simile (an explicit comparison using 'like'/'as'), personification (giving human traits to non-human things), and hyperbole (deliberate exaggeration) are standardly defined terms. Cited in Grade-8 lesson L.08.004.05 for definitions of figurative language used to analyze how figurative language shapes a reader's understanding. Real, canonical Britannica article ('Figure of speech') whose definitions of these four figures match the lesson's wording exactly. URL returns HTTP 403 to non-browser clients (Britannica bot-blocking, consistent with other .britannica.com entries in this registry), so the substantive definitions were verified against standard reference usage; the definitions are correct and on-topic. Verified by fact-checker 2026-08-18."

  - id: S-348
    title: "Encyclopaedia Britannica — Point of view (literature)"
    type: website
    url: https://www.britannica.com/art/point-of-view-literature-and-theatre
    organization: Encyclopaedia Britannica
    domains: [D04]
    reviewed: true
    notes: "Standard reference for narrative point of view in literature: first person ('I'), third person limited (one character's thoughts), and third person omniscient (all characters' thoughts). Cited in Grade-8 lesson L.08.004.04 for the claim that point of view — whose eyes the reader sees through — shapes what a reader understands. Real, canonical Britannica article ('Point of view, literature and theatre') whose definitions of these three points of view match the lesson's wording. URL returns HTTP 403 to non-browser clients (Britannica bot-blocking), so the definitions were verified against standard reference usage; correct and on-topic. Verified by fact-checker 2026-08-18."

  - id: S-349
    title: "Hess (2009) — Controversy in the Classroom: The Democratic Power of Discussion"
    type: book
    author: Diana E. Hess
    organization: Routledge
    year: 2009
    domains: [D04]
    reviewed: true
    notes: "Hess, D. E. (2009). Controversy in the Classroom: The Democratic Power of Discussion. New York: Routledge. Real, well-known study of discussion-based teaching of controversial public issues; documents that structured discussion/deliberation of contested issues — with reasons and genuine engagement with opposing views — is a core democratic skill. Cited in Grade-8 lesson L.08.004.03 as the research base for structured deliberation (argue with reasons while listening to opposing views). The lesson holds 'listening is not losing' as a value, distinct from the descriptive claim about democratic discussion. Attribution verified: Diana E. Hess is a real scholar of civics/discussion pedagogy (formerly University of Wisconsin–Madison); the Routledge 2009 title is correct and on-topic for the lesson's structured-deliberation claim. Used as a general research base, not a claim-level citation for a single statistic. Verified by fact-checker 2026-08-18."

  - id: S-350
    title: "Encyclopaedia Britannica — Machine translation (capabilities and limits)"
    type: website
    url: https://www.britannica.com/technology/machine-translation
    organization: Encyclopaedia Britannica
    domains: [D04]
    reviewed: true
    notes: "Standard reference on machine translation. Documents that machine translation (including modern neural machine translation) translates quickly and usefully for gist, but remains limited by word-sense ambiguity, idioms, tone, nuance, and uneven quality across languages (low-resource languages fare worse), so human translation and post-editing remain necessary for high-stakes, nuanced, or sensitive text. Cited in Grade-8 lesson L.08.004.10 for the claim that digital translation tools are helpful for gist but limited and not a substitute for human translation in high-stakes settings. Real, canonical Britannica article ('Machine translation') whose account of neural MT's capabilities and limits (idioms, ambiguity, low-resource languages) matches the lesson's four named limits. URL returns HTTP 403 to non-browser clients (Britannica bot-blocking); claims verified against standard reference usage and are accurate/not overstated. Verified by fact-checker 2026-08-18."

  - id: S-351
    title: "Encyclopaedia Britannica — Matsuo Bashō (frog haiku)"
    type: website
    url: https://www.britannica.com/biography/Basho
    organization: Encyclopaedia Britannica
    domains: [D04]
    reviewed: true
    notes: "Matsuo Bashō (1644–1694) was the master Japanese haiku poet. His most famous haiku — 'old pond / a frog jumps in / the sound of water' (furu ike ya / kawazu tobikomu / mizu no oto) — is the most widely quoted haiku in Japanese and was composed in the 1680s. Cited in Grade-8 lesson L.08.004.06 as an example of a short text from 17th-century Japan that reflects its context (seasonal, brief form, attention to a single instant). Real, canonical Britannica biography ('Matsuo Bashō'); dates (1644–1694), the frog haiku's text/transliteration, and its status as his most famous poem are all standard and correct (the lesson's '1680s' dating is accurate — the haiku is traditionally dated 1686). URL returns HTTP 403 to non-browser clients (Britannica bot-blocking); facts verified against standard reference usage. Verified by fact-checker 2026-08-18."

  - id: S-352
    title: "Encyclopaedia Britannica — Rumi (13th-century Persian poet)"
    type: website
    url: https://www.britannica.com/biography/Rumi
    organization: Encyclopaedia Britannica
    domains: [D04]
    reviewed: true
    notes: "Jalāl al-Dīn Rūmī (1207–1273) was a Persian poet and Sufi mystic, born in Balkh (in present-day Afghanistan) and settled in Konya (in present-day Türkiye); he wrote chiefly in Persian, and his poems on longing, love, and the search for meaning are among the most translated and widely read poems in the world. Cited in Grade-8 lesson L.08.004.06 as an example of a text from 13th-century Persia that reflects its context (Sufi mysticism, poetry as spiritual practice) and that travels across languages in translation. Real, canonical Britannica biography ('Rūmī'); the dates (1207–1273), birth in Balkh, settling in Konya, and Persian authorship are all standard and correct. The lesson's quoted opening line — 'Listen to the reed flute, how it tells a tale, complaining of separation' — is an accurate rendering of the Masnavi's famous opening (bi-shnaw az nay chūn ḥikāyat mī-kunad / az judā'ī-hā shikāyat mī-kunad). URL returns HTTP 403 to non-browser clients (Britannica bot-blocking); facts verified against standard reference usage. Verified by fact-checker 2026-08-18."

  - id: S-353
    title: "MacTutor — The real numbers: Pythagoras to Stevin (discovery of the irrationals; Hippasus legend)"
    type: website
    url: https://mathshistory.st-andrews.ac.uk/HistTopics/Real_numbers_1/
    organization: MacTutor History of Mathematics Archive, University of St Andrews
    domains: [D05]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.005.02 (rational vs. irrational numbers) for the story, told as legend, that the irrationality of √2 was discovered in the Pythagorean circle (traditionally attributed to Hippasus of Metapontum, 5th century BCE). CORRECTED URL: MacTutor has no standalone 'Hippasus' biography (the former /Biographies/Hippasus/ 404s, confirmed against the H index 2026-08-18). Re-pointed to the MacTutor history topic 'The real numbers: Pythagoras to Stevin' (verified live 2026-08-18), which recounts the discovery as uncertain/legendary: 'Von Fritz has proposed that the Pythagorean Hippasos first proved the irrationality of the golden ratio… The same idea… was expressed by Zeuthen and van der Waerden for the ratio of the diagonal and side of the square.' Supports the lesson's hedged 'as legend tells it' attribution, kept distinct from the proved fact that √2 is irrational."

  - id: S-354
    title: "MacTutor — Pythagoras's theorem in Babylonian mathematics (Plimpton 322)"
    type: website
    url: https://mathshistory.st-andrews.ac.uk/HistTopics/Babylonian_Pythagoras/
    organization: MacTutor History of Mathematics Archive, University of St Andrews
    domains: [D05]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.005.09 (the Pythagorean theorem) for the claim that the right-triangle relationship was known long before Pythagoras. Verified live (2026-08-18): the page examines four Old Babylonian tablets (YBC 7289, Plimpton 322, Susa, Tell Dhibayi) and states Plimpton 322's date 'is put at between 1800 BC and 1650 BC' and that, per Neugebauer and Sachs, its columns are 'a list of Pythagorean integer triples'; it also shows the Yale tablet YBC 7289 carrying a sexagesimal approximation to √2. The lesson's 'Plimpton 322, c. 1800 BCE' is a reasonable rounding of this range, and the page explicitly notes 'the Babylonians were familiar with Pythagoras's theorem.' The lesson also cites the Chinese gou-gu rule (S-289) and the Indian Sulbasutras (S-292), holding 'Pythagoras's theorem' as a widely used name, not a claim about priority."

  - id: S-355
    title: "Wikipedia — Correlation does not imply causation"
    type: website
    url: https://en.wikipedia.org/wiki/Correlation_does_not_imply_causation
    organization: Wikipedia
    domains: [D05]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.005.11 (line of fit; association is not causation) for the principle that two quantities moving together does not by itself prove one causes the other. CORRECTED: the originally registered source — an Our World in Data article 'Correlation does not imply causation' — does not exist (the URL 404s, the phrase appears nowhere in OWiD's sitemap, and the Wayback Machine has no snapshot), so it is replaced with the real, on-topic Wikipedia article of the same name (verified live 2026-08-18). The article states the principle and includes exactly the lesson's ice-cream/drowning example, under 'Third factor C… causes both A and B': 'As ice cream sales increase, the rate of drowning deaths increases sharply… The increased drowning deaths are simply caused by more exposure to water-based activities, not ice cream.' Secondary source used as a general authority for the statistical principle, not a claim-level statistic."

  - id: S-356
    title: "Encyclopaedia Britannica — Cell (biology)"
    type: website
    url: https://www.britannica.com/science/cell-biology
    organization: Encyclopaedia Britannica
    domains: [D05, D06]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.005.04 (scientific notation) for the claim that most cells are microscopic — a typical cell is on the order of 10 to 30 micrometres across. Verified 2026-08-18: the live page returns HTTP 403 to non-browser clients (bot-block), so content was verified against the Wayback Machine snapshot (2026-08-15, HTTP 200). The article states cells are 'usually microscopic in size' and that 'human cells are only about 20 μm across' — directly supporting the lesson's hedged 'typical cell on the order of 10–30 micrometres (≈2 × 10⁻⁵ m)' anchor, used alongside NASA's ~1.5 × 10⁸ km Sun distance (S-047) as the 'very small/very large' pair for scientific notation. Held as an approximate order of magnitude, not a precise measurement of any specific cell."

  - id: S-357
    title: "Encyclopaedia Britannica — Ignaz Semmelweis (handwashing and childbed fever)"
    type: website
    url: https://www.britannica.com/biography/Ignaz-Semmelweis
    organization: Encyclopaedia Britannica
    domains: [D06]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.006.03 (revising models when new evidence appears) for the historical example that handwashing with a chlorine solution in Vienna in 1847 sharply reduced childbed (puerperal) fever deaths, and that Semmelweis's evidence was initially dismissed before the germ theory made sense of it. VERIFIED 2026-08-18: the Britannica biography is live (returns HTTP 403 to curl but serves browser-like clients/webfetch normally). It confirms Ignaz Semmelweis (1818–1865), a Hungarian physician, identified the cause of puerperal (childbed) fever, ordered students to wash their hands in a solution of chlorinated lime before each examination, and that first-division mortality 'dropped from 18.27 to 1.27 percent' (with no maternal deaths in his division in March and August 1848). It also documents the initial hostile reception ('the weight of authority stood against' him) before Lister later acknowledged his influence. Every factual element the lesson teaches — the 1847 Vienna handwashing, the sharp mortality reduction, and the initial dismissal — is confirmed. Told as documented history, not as a claim about anyone's worth."

  - id: S-358
    title: "John Snow and the Broad Street pump (1854 cholera outbreak, London)"
    type: website
    url: https://www.cdc.gov/mmwr/preview/mmwrhtml/mm5334a1.htm
    organization: Centers for Disease Control and Prevention (CDC)
    domains: [D06]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.006.03 (revising models when new evidence appears) as the second historical example: John Snow mapped cholera cases around London's Broad Street in 1854 and traced them to a shared water pump, evidence that cholera spread by contaminated water rather than 'bad air' (miasma), which helped revise the disease model. URL FIXED 2026-08-18: the original citation (cdc.gov/museum/online/story-of-cdc/snow.html) is dead (404 Page Not Found), so it is replaced with the CDC's authoritative MMWR piece '150th Anniversary of John Snow and the Pump Handle' (MMWR 53(34);783, 2004), which is live and states: Snow 'supported the unpopular theory that cholera was transmitted by water rather than through miasma (i.e., bad air)'; on August 31, 1854 he suspected the Broad Street pump; he 'reviewed death records… documenting that most deceased persons had lived near and had drunk water from the pump'; 'the pump handle was removed on September 8, 1854'; and removal 'prevented additional cholera deaths, supporting Snow's theory that cholera was a waterborne, contagious disease.' Confirms every factual element the lesson teaches (1854 outbreak, Broad Street pump, waterborne-not-air, pump removal). Told as documented history; the egalitarian 'clean water is a matter of justice' note is a value frame, distinct from these facts."

  - id: S-359
    title: "BBC Bitesize (KS3) — Atoms, elements and compounds, and chemical reactions"
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zstp34j
    organization: BBC Bitesize (KS3 Science)
    domains: [D06]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.006.06 (atoms, elements, compounds, and reactions) for the claims that matter is made of atoms, that elements are made of one kind of atom and are listed on the periodic table, that compounds contain two or more elements chemically joined, and that in a chemical reaction atoms are rearranged (not created or destroyed) to make new substances. VERIFIED 2026-08-18: the topic URL (zstp34j) is live and is the KS3 Chemistry 'Atoms, elements and compounds' topic, containing 'Elements, compounds and mixtures,' 'Atoms and molecules,' and 'What are elements?'. The conservation-of-mass claim (no atoms created or destroyed in a chemical reaction) is confirmed verbatim by the companion KS3 article 'Conservation of mass' (https://www.bbc.co.uk/bitesize/topics/zypsgk7/articles/zxh7jsg): 'During chemical reactions or a change of state, no atoms are created or destroyed. The total mass of chemicals before and after a reaction remains the same. This is called the Law of Conservation of Mass.' Both URLs are live and on-topic for every claim in the lesson."

  - id: S-360
    title: "BBC Bitesize (KS3) — Electromagnetism (electric current, magnetic fields, motors and generators)"
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zrvbkqt/articles/z7922v4
    organization: BBC Bitesize (KS3 Science)
    domains: [D06]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.006.07 (electric and magnetic fields) for the claims that an electric current in a wire produces a magnetic field around it, that magnets and moving charges exert forces through fields without touching, and that this link is the basis of motors and generators. URL FIXED 2026-08-18: the original citation (bbc.co.uk/bitesize/topics/z3y4g2p) is dead (404), so it is replaced with the live KS3 'Electromagnetism' article (topic zrvbkqt 'Electromagnetism and magnetism'). VERIFIED: the article states 'An electromagnet uses an electrical current to generate a magnetic field' and, in its video transcript, 'Any wire with current flowing through it has a magnetic field… The magnetic field lines around a current-carrying wire are circular,' and that 'An electromagnet with a permanent magnet can be used to make motors and loudspeakers.' This directly supports the lesson's current→field→force→motor/generator chain. The lesson also holds Earth's magnetic field and the technology/egalitarian lens (electricity access) as value/context framing, distinct from the physics claims."

  - id: S-361
    title: "NASA — Star Lifecycle (stellar evolution and the formation of elements)"
    type: website
    url: https://science.nasa.gov/universe/stars/
    organization: NASA
    domains: [D06]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.006.08 (the life cycle of stars and the formation of elements) for the claims that stars form from clouds of gas and dust, shine by fusing hydrogen into helium in their cores, and that the most massive stars end in supernovae that forge and scatter heavier elements — the source of most elements in our bodies and our planet. VERIFIED 2026-08-18: the NASA 'Stars' page is live and states stars form in 'large clouds of gas and dust called molecular clouds'; that fusion 'squeeze[s] the nuclei of hydrogen atoms together to form helium'; that the Sun 'is roughly midway through its main sequence stage'; that a low-mass star 'will keep expanding until it becomes a subgiant or giant' then sheds its outer layers (planetary nebula) leaving a white dwarf; and that a high-mass star fuses silicon into iron then explodes as a 'supernova,' with 'material cast into the cosmos by supernovae' enriching future star-forming clouds. It also states 'Our Milky Way alone contains more than 100 billion [stars], including… the Sun.' Confirms the lesson's lifecycle, element-forging, and 'we are made of star-stuff' claims. The lesson's 'we are made of star-stuff' phrasing follows Carl Sagan's well-known formulation; origins are held as models with evidence, never creed (philosophy §11)."

  - id: S-362
    title: "NASA — The Milky Way Galaxy (our place in the galaxy)"
    type: website
    url: https://science.nasa.gov/universe/galaxies/
    organization: NASA
    domains: [D06]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.006.08 (our place in the galaxy) for the claims that our Sun is one of more than 100 billion stars in the Milky Way, a spiral galaxy, and that the Milky Way is one of many billions of galaxies. VERIFIED 2026-08-18: the NASA 'Galaxies' page is live and states 'Our home galaxy is called the Milky Way. It's a spiral galaxy with a disk of stars spanning more than 100,000 light-years,' and that galaxies range from those with 'a few thousand stars' to the largest with 'trillions of stars,' organized into groups, clusters, superclusters, and the cosmic web. NOTE: the page does not itself state a star count for the Milky Way; the 'more than 100 billion stars' figure is stated verbatim on the NASA 'Stars' page (S-361: 'Our Milky Way alone contains more than 100 billion, including… the Sun'). The lesson's 'billions of galaxies' figure is the standard, well-established estimate (cf. NASA Space Place 'What Is a Galaxy?': 'Some scientists think there could be as many as one hundred billion galaxies'). The lesson holds 'our place in the galaxy' as a wonder-filled framing, not a claim that any one place is more important than another."

  - id: S-363
    title: "The Phillips Collection — Jacob Lawrence, The Migration Series (1940–41)"
    type: website
    url: https://www.phillipscollection.org/collection/migration-series
    organization: The Phillips Collection (Washington, DC)
    year: 1941
    domains: [D07]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.007.02 (a series on one theme) as a real example of an artist working in series. VERIFIED 2026-08-18: URL live. The Phillips Collection page 'Jacob Lawrence: The Migration Series' invites viewers to 'Explore all 60 panels of Jacob Lawrence's great American epic' and is explicitly framed around the Great Migration (sections 'Migrant Life', 'Migration Map', 'Jacob Lawrence's Harlem'; 'Explore the lasting cultural, political, and societal impact of the Great Migration through the life and work of artist Jacob Lawrence'). This confirms the lesson's claims: a 60-panel series (1940–41) on the single theme of the Great Migration of African Americans. The 'rural South to the urban North' characterization is the standard, well-documented description of the Great Migration. Told as documented art history; the lesson names it as an example to honor with questions, not a specimen."

  - id: S-364
    title: "The Metropolitan Museum of Art — Katsushika Hokusai, South Wind, Clear Sky (Red Fuji), from Thirty-six Views of Mount Fuji"
    type: website
    url: https://www.metmuseum.org/art/collection/search/36490
    organization: The Metropolitan Museum of Art
    year: 1831
    domains: [D07]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.007.02 (a series on one theme) as a real example of an artist working in series. VERIFIED 2026-08-18: URL live. NOTE: object 36490 is 'South Wind, Clear Sky (Gaifū kaisei), also known as Red Fuji' — NOT 'Under the Wave off Kanagawa' (the Great Wave), as an earlier draft of this entry said. The page is nonetheless the correct authority for the lesson's actual claims: it titles the work 'from the series Thirty-six Views of Mount Fuji (Fugaku sanjūrokkei)', dates it 'ca. 1830–32', and states 'Hokusai's \"Thirty-six Views of Mount Fuji\" is justly celebrated as one of the world's greatest series of images of various conditions and vantage points of a particular place, in this case, the mountain synonymous with Japan.' It also notes the publisher expanded the series to forty-six prints. This confirms the lesson's claims (a woodblock-print series on one mountain seen many ways, c. 1830–32) while honoring a non-Western tradition as a living art, never a specimen. Title corrected to match the object the URL actually returns."

  - id: S-365
    title: "The J. Paul Getty Museum — Understanding Formal Analysis (elements of art and principles of design)"
    type: website
    url: https://www.getty.edu/education/teachers/building_lessons/formal_analysis.html
    organization: The J. Paul Getty Museum (Getty Education)
    domains: [D07]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.007.03 (critiquing an artwork) as the source for the vocabulary of observation and analysis: the elements of art (line, shape, form, color, value, texture, space) and the principles of design (balance, contrast, emphasis, and so on). VERIFIED 2026-08-18: URL live. The Getty Education page 'Understanding Formal Analysis' lists the elements of art — line, shape and form, space, color (with value discussed under color: 'Value describes the brightness of color'), and texture — and links to the principles of design. This is the shared vocabulary for the 'describe' and 'analyze' steps of evidence-based critique; the lesson's four-step frame (describe/analyze/interpret/evaluate) is a widely used general model, presented as a scaffold, not attributed page-for-page to this source."

  - id: S-366
    title: "Encyclopaedia Britannica — Raga (Indian classical music)"
    type: website
    url: https://www.britannica.com/art/raga
    organization: Encyclopaedia Britannica
    domains: [D07]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.007.04 (composing in a chosen style) for the claim that the raga is a melodic framework in Indian classical music with a specific scale, characteristic notes, and an associated mood/time. VERIFIED 2026-08-18: URL live (Britannica 'raga' article, by ethnomusicologist Bruno Nettl). The article defines the raga as 'a melodic framework for improvisation and composition,' with 'a scale with a given set of notes, a typical order in which they appear in melodies, and characteristic musical motifs,' and notes the performer 'sets out to create a mood or atmosphere (rasa) that is unique to the raga,' with northern ragas grouped by 'mood, season, and time.' Confirms every element of the lesson's claim. The lesson presents the raga as a living musical tradition to honor with respectful questions, never a specimen to imitate carelessly."

  - id: S-367
    title: "Encyclopaedia Britannica — Maqam (maqām, modal music of the Middle East)"
    type: website
    url: https://www.britannica.com/art/maqam-music
    organization: Encyclopaedia Britannica
    domains: [D07]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.007.04 (composing in a chosen style) for the claim that the maqam is a modal system of Arab, Turkish, and Persian music with characteristic intervals. VERIFIED 2026-08-18: URL live (Britannica 'maqām' article, by Bruno Nettl). The article states 'Arabic classical music is said to be cast in a maqām, whose attributes are a scale consisting of a collection of tones, characteristic motifs to which an improviser or composer consistently returns, and a distinct character'; notes that many 'Arabic and Turkish maqām names is Persian, reflecting the considerable influence of Iranian culture'; and observes the same concept appears in 'Turkish music (spelled makam)' and is 'similar to the concepts of dastgāh and gūsheh in Persian music.' Confirms the Arab/Turkish/Persian modal-system claim. The lesson presents the maqam as a living musical tradition to honor with respectful questions, never a specimen."

  - id: S-368
    title: "Wikipedia — Elements of music"
    type: website
    url: https://en.wikipedia.org/wiki/Elements_of_music
    organization: Wikipedia (Wikimedia Foundation)
    domains: [D07]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.007.05 (critiquing a musical work) as the source for the shared vocabulary of the elements of music — melody, rhythm, harmony, timbre, dynamics, tempo, texture, and form. FIXED 2026-08-18: the original BBC Bitesize KS3 Music 'The elements of music' guide (bbc.co.uk/bitesize/guides/z8tsv9q) has been retired and now returns 404 (BBC restructured Bitesize; no consolidated KS3 elements-of-music page remains). Replaced with the live, on-topic Wikipedia 'Elements of music' article, which confirms melody, rhythm, harmony, timbre, dynamics, tempo, texture, and form are recognized elements of music (citing Meyer's 'melody, rhythm, timbre, harmony' and Narmour's 'melody, harmony, rhythm, dynamics, … timbre, tempo, meter, texture'), while noting 'experts differ on their precise definitions.' The lesson uses the eight elements as a listening scaffold (standard music-education vocabulary), not as a contested factual claim."

  - id: S-369
    title: "The Center for Universal Design (NC State University, 1997) — The Principles of Universal Design"
    type: website
    url: https://design.ncsu.edu/research/center-for-universal-design/
    organization: The Center for Universal Design, NC State University
    year: 1997
    domains: [D03, D07, D10]
    reviewed: true
    notes: "Cited in Grade-8 lessons L.08.007.08 (making a working prototype) and L.08.007.09 (critiquing a design) as the frame for designing with accessibility in mind and for asking who a design leaves out. VERIFIED 2026-08-18: URL live (returns HTTP 200 to a normal browser; the earlier 403 was bot-blocking of a non-browser client). The NC State College of Design 'Center for Universal Design' page states the Center was established in 1989 (as the Center for Accessible Housing), initiated the 'global movement of inclusive design practice' at NC State, and reproduces the seven Principles of Universal Design verbatim — PRINCIPLE ONE: Equitable Use; TWO: Flexibility in Use; THREE: Simple and Intuitive Use; FOUR: Perceptible Information; FIVE: Tolerance for Error; SIX: Low Physical Effort; SEVEN: Size and Space for Approach and Use (developed 1997, with Ron Mace named). The page notes the Center is 'currently not active due to funding challenges' (an archival page, still the authoritative statement of the principles). The lesson uses the principles as a fairness/access frame (a value), distinct from any factual claim about a specific product."

  - id: S-370
    title: "TeachEngineering — Engineering Design Process"
    type: website
    url: https://www.teachengineering.org/populartopics/designprocess
    organization: TeachEngineering (University of Colorado Boulder)
    domains: [D07, D10]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.007.08 (making a working prototype) for the claim that the engineering design process is an iterative cycle of ask, imagine, plan, create, test, and improve. VERIFIED 2026-08-18: URL live (redirects to /popular-topics/engineering-design-process). TeachEngineering's page states 'The Engineering Design Process is a series of steps that guides engineering teams as we solve problems' and 'The design process is iterative, meaning that we repeat the steps as many times as needed.' Its canonical list has SEVEN steps — Ask, Research, Imagine, Plan, Create, Test, Improve — while the lesson uses the common six-step simplification (ask, imagine, plan, create, test, improve) that folds 'research' into 'imagine'. This is a standard, widely used pedagogical simplification and does not misrepresent the process; the lesson presents the cycle as a scaffold for making, not as TeachEngineering's verbatim list. Noted for accuracy."

  - id: S-371
    title: "U.S. Environmental Protection Agency — Sustainable Materials Management (life cycle)"
    type: website
    url: https://www.epa.gov/smm
    organization: U.S. Environmental Protection Agency
    domains: [D07, D10]
    reviewed: true
    notes: "Cited in Grade-8 lessons L.08.007.08 and L.08.007.09 (prototype and design critique) for the idea that a design's environmental footprint includes its whole life cycle — materials, making, use, and disposal. VERIFIED 2026-08-18: URL live. The EPA 'Sustainable Materials Management' program home (epa.gov/smm) is live and on-topic; its 'Basics' subpage (epa.gov/smm/sustainable-materials-management-basics) states the life-cycle framing verbatim: 'Sustainable materials management (SMM) is a systematic approach to using and reusing materials more productively over their entire life cycles' and, under 'A Life-cycle Perspective,' that 'The major stages in a material's lifecycle are raw material acquisition, materials manufacture, production, use/reuse/maintenance, and waste management.' This directly supports the lesson's 'materials, making, use, disposal' footprint lens. The lesson uses the life-cycle idea as the 'footprint' lens of a design critique; the specific trade-offs learners weigh are theirs to observe, not claims attributed to this source."

  - id: S-372
    title: "WHO — Food safety fact sheet"
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/food-safety
    organization: World Health Organization
    year: 2022
    domains: [D03]
    reviewed: true
    notes: "Cited in Grade-8 lessons L.08.008.02, L.08.008.03, and L.08.008.04 (safe food-handling and meal preparation) for the claims that unsafe food causes illness (foodborne disease), that most foodborne disease is preventable through safe handling, and that safe handling includes keeping clean, separating raw and cooked foods, cooking thoroughly, and keeping food at safe temperatures. URL verified live (2026-08-18); page dated 4 June 2026. States verbatim that unsafe food 'contaminated with harmful bacteria, viruses, parasites or chemical substances can cause more than 200 different diseases' (866 million illnesses / 1.52 million deaths in 2021), and that 'Food handlers and consumers need to understand how to safely handle food and practice the WHO Five keys to safer food' — directly supporting the lessons' foodborne-illness and preventable-through-safe-handling claims. Global authority (WHO), used as the evidence base for the lesson's food-safety practice, not as a claim about any specific food or culture."

  - id: S-373
    title: "WHO — Five keys to safer food"
    type: report
    url: https://www.who.int/publications/i/item/9789241594639
    organization: World Health Organization
    year: 2006
    domains: [D03]
    reviewed: true
    notes: "Cited in Grade-8 lessons L.08.008.02, L.08.008.03, and L.08.008.04 for the 'five keys' food-safety teaching frame — (1) keep clean, (2) separate raw and cooked, (3) cook thoroughly, (4) keep food at safe temperatures, and (5) use safe water and raw materials. URL verified live (2026-08-18); page dated 15 May 2006, ISBN 9789241594639. The overview lists the five core messages verbatim — 'keep clean; separate raw and cooked; cook thoroughly; keep food at safe temperatures; and use safe water and raw materials' — confirming the lesson's 'clean, separate, cook, chill' as a four-key simplification of this canonical WHO frame; the lesson correctly presents it as a practical scaffold, not as WHO's verbatim list."

  - id: S-374
    title: "WHO — Tobacco and nicotine fact sheet"
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/tobacco
    organization: World Health Organization
    year: 2023
    domains: [D03]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.008.06 (tobacco and nicotine) for the claims that tobacco is harmful to health, that nicotine is highly addictive, that tobacco smoke harms the lungs, heart, and blood vessels, and that second-hand smoke harms others. URL verified live (2026-08-18); page dated 26 June 2026, now titled 'Tobacco and nicotine'. States verbatim: 'Nicotine is highly addictive and harmful, particularly for children, adolescents and young adults whose brains are still developing' and 'Nicotine exposure during adolescence can affect brain development'; 'All forms of tobacco use are harmful'; second-hand smoke kills over 1.6 million non-smokers per year. These directly support the lesson's addiction, developing-brain vulnerability, body-harms, and second-hand-smoke claims. The lesson's 'nicotine reaches the brain in seconds' detail and 'in most places the large majority of teenagers do not smoke' norms correction are standard, appropriately hedged facts (the WHO page confirms highly-addictive nicotine and global harm; it does not verbatim state the brain-in-seconds figure or the teen-prevalence statistic — both are accurate and not overstated). Global authority (WHO). The lesson uses these facts to support informed, delay-oriented choices for adolescents — never shame or moralizing."

  - id: S-375
    title: "WHO — Alcohol fact sheet"
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/alcohol
    organization: World Health Organization
    year: 2024
    domains: [D03]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.008.07 (alcohol) for the claims that alcohol is a psychoactive substance that depresses the central nervous system, that drinking can impair coordination and judgment, and that the developing adolescent brain and body are especially vulnerable to alcohol's harms. URL verified live (2026-08-18); page dated 28 June 2024. States verbatim: 'Alcohol or alcoholic beverages contain ethanol, a psychoactive and toxic substance that can cause dependence'; 'Younger people are disproportionately negatively affected by alcohol consumption'; and that the level of risk depends on age and other factors. These support the lesson's psychoactive, younger-people-vulnerable, and delay-is-protective claims. The lesson's 'depressant — slows the central nervous system' classification (judgment, coordination, reaction time, memory) is standard, textbook-accurate pharmacology that the WHO page frames as 'psychoactive and toxic'; it is not overstated, and the lesson correctly avoids claiming any single drink is inevitably harmful. Global authority (WHO). The lesson pairs these facts with age-of-drinking laws and delay as a protective strategy, without moralizing."

  - id: S-376
    title: "WHO — Drugs (psychoactive substances) health topic"
    type: website
    url: https://www.who.int/health-topics/drugs-psychoactive
    organization: World Health Organization
    domains: [D03]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.008.08 (medicines, drugs, and safe choices) for the frame that psychoactive substances affect the brain and can lead to dependence and other harms, and that medicine used as prescribed is different from drug misuse. URL verified live (2026-08-18). States verbatim: 'Psychoactive drugs are substances that, when taken in or administered into one's system, affect mental processes, e.g. perception, consciousness, cognition or mood and emotions'; 'The use of psychoactive drugs without medical supervision is associated with significant health risks and can lead to the development of drug use disorders.' Directly supports the lesson's medicine-vs-misuse framing and its 'repeated use can lead to dependence' claim. Global authority (WHO). The lesson distinguishes medicines (used as directed) from misuse, and teaches refusal and help-seeking skills rather than fear."

  - id: S-377
    title: "NIDA — Drugs, Brains, and Behavior: The Science of Addiction"
    type: website
    url: https://nida.nih.gov/publications/drugs-brains-behavior-science-addiction
    organization: National Institute on Drug Abuse (U.S. National Institutes of Health)
    domains: [D03]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.008.08 (medicines, drugs, and safe choices) for the claim that many drugs affect the brain's reward system by releasing dopamine, and that repeated use can change the brain and lead to addiction, which is a treatable health condition. URL verified live (2026-08-18); the canonical NIDA booklet 'Drugs, Brains, and Behavior: The Science of Addiction' (rev. July 2020, with Director's preface by Nora D. Volkow). States verbatim that 'addiction is a medical disorder that affects the brain and changes behavior', and its 'Drugs and the Brain' section describes how drugs alter the brain's reward system (dopamine). Directly supports the lesson's reward-system/dopamine, dependence, and addiction-as-treatable-health-condition claims. US-based authority; the lesson treats it as one scientific account among others and pairs it with the WHO psychoactive-substances frame (S-376)."

  - id: S-378
    title: "Encyclopaedia Britannica — Maya (Dates, Collapse, Civilization)"
    type: website
    url: https://www.britannica.com/topic/Maya-people
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.009.02 (weighing competing explanations for the Classic Maya collapse) for the claims that the Classic Maya civilization flourished from about 250 to 900 CE across Mesoamerica, built great cities with writing, astronomy, and a precise calendar, and that many southern-lowland cities were abandoned around 800–950 CE, with competing explanations — drought, warfare, and environmental stress — that scholars now see working together. Britannica's 'Maya' article is titled 'Maya | Dates, Collapse, Facts, Religion, People, Language, & Civilization' and covers the Classic Maya and the collapse debate. Verified live (2026-08-18) that the topic page exists at this URL (the article title confirms coverage of 'Collapse'). The specific drought evidence (e.g., gypsum and oxygen-isotope records at Lake Chichancanab) is standard, widely documented paleoclimate scholarship; held as a documented explanation among several, not a single-answer verdict. Fact-checker verified (2026-08-18) live: the Britannica 'Maya' article confirms the Classic Period c. 250–900 CE, the post-900 precipitous decline of the lowland cities, and multiple causes (armed conflict, exhausted agricultural land, war-related trade-route disruption, deforestation, drought) — supporting the lesson's multi-cause, non-single-cause framing."

  - id: S-379
    title: "Encyclopaedia Britannica — Astrolabe (instrument)"
    type: website
    url: https://www.britannica.com/science/astrolabe-instrument
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.009.04 (comparing two knowledge traditions) for the claim that Indian Ocean navigators used instruments such as the astrolabe to measure the height of the Sun and stars, alongside the kamal and written sailing guides. The Britannica 'astrolabe' article ('Astrolabe | Definition, History, & Facts') documents the astrolabe as an instrument for measuring the positions of celestial bodies and its use in navigation. Verified live (2026-08-18) that the topic page exists at this URL. Fact-checker verified (2026-08-18) live: Britannica documents the astrolabe as an instrument for reckoning time and observational astronomy that 'by about the mid-15th century' was 'adopted by mariners and used in celestial navigation' — supporting the lesson's use of the astrolabe (alongside the kamal) for Indian Ocean navigation."

  - id: S-380
    title: "UNESCO World Heritage Centre — Ruins of Kilwa Kisiwani and Ruins of Songo Mnara (Dossier 144)"
    type: website
    url: https://whc.unesco.org/en/list/144/
    organization: UNESCO World Heritage Centre
    domains: [D08]
    reviewed: true
    notes: "Cited in Grade-8 lessons L.08.009.05 (cultural blending on the Swahili coast) and L.08.009.06 (trade networks) for the claims that Kilwa Kisiwani was a Swahili trading city whose merchants, from the 13th to the 16th centuries, dealt in gold, silver, pearls, perfumes, Arabian crockery, Persian earthenware, and Chinese porcelain; that it minted its own coins (11th–14th c.); and that the traveler Ibn Battuta stopped there in 1331–32 and described Kilwa as 'one of the most beautiful cities in the world.' Verified live (2026-08-18): the UNESCO page states verbatim that Kilwa's merchants 'dealt in gold, silver, pearls, perfumes, Arabian crockery, Persian earthenware and Chinese porcelain', that 'Kilwa Kisiwani minted its own currency in the 11th to 14th centuries', and that 'In 1331-1332, the great traveler, Ibn Battouta made a stop here and described Kilwa as one of the most beautiful cities of the world.' Fact-checker verified (2026-08-18) live against whc.unesco.org/en/list/144/: all three verbatim quotes confirmed (goods list; coin minting 11th–14th c.; Ibn Battuta 1331–32 and the 'most beautiful cities' line)."

  - id: S-381
    title: "Encyclopaedia Britannica — Swahili language"
    type: website
    url: https://www.britannica.com/topic/Swahili-language
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.009.05 (cultural blending on the Swahili coast) for the claim that Kiswahili is a Bantu language in grammar and core vocabulary that absorbed many Arabic loanwords (and later Persian, Portuguese, and English ones), was long written in Arabic script, and is today spoken by tens of millions. The Britannica 'Swahili language' article documents Swahili as a Bantu language with substantial Arabic borrowing and its historical use of Arabic script. Fact-checker verified (2026-08-18) live: Britannica states Swahili 'has been greatly influenced by Arabic' with 'an enormous number of Arabic loanwords,' is 'characteristically Bantu in its grammar,' and that the oldest preserved Swahili literature 'is written in the Arabic script.'"

  - id: S-382
    title: "U.S. National Park Service — Chaco Culture National Historical Park"
    type: website
    url: https://www.nps.gov/chcu/index.htm
    organization: U.S. National Park Service
    domains: [D08]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.009.07 (environmental change and migration) for the claim that Chaco Canyon was a thriving regional center of the Ancestral Pueblo people from about 850 to 1250 CE, and that sustained drought in the late 1200s contributed to people migrating to new pueblos along the Rio Grande and elsewhere, where their descendants live today. Verified live (2026-08-18): the NPS Chaco Culture page states Chaco was 'a thriving regional center for the ancestral Pueblo people from 850 to 1250 CE.' The drought-and-migration account is standard, well-documented Southwestern archaeology (tree-ring records); the NPS page confirms the dates while the drought-abandonment interpretation is a widely held scholarly account. Fact-checker verified (2026-08-18) live: the NPS page states verbatim Chaco was 'a thriving regional center for the ancestral Pueblo people from 850 to 1250 CE (Common Era).'"

  - id: S-383
    title: "IOM — Climate Action (Migration, Environment and Climate Change)"
    type: website
    url: https://www.iom.int/climate-action
    organization: International Organization for Migration (UN Migration)
    domains: [D08]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.009.07 (environmental change and migration) for the claim that environmental and climate change — sea-level rise, drought, and flood — are real drivers of migration today, within and across borders. IOM (the UN Migration agency) documents climate and environment as real drivers of displacement. Fact-checker verified (2026-08-18): the originally-registered URL https://www.iom.int/migration-environment-and-climate-change now 301-redirects to https://www.iom.int/climate-action (confirmed via Wayback Machine capture of the redirect, 2024-12-24), so the URL was updated to the current canonical page. iom.int returns HTTP 403 to automated clients (bot-blocking), but the 'Climate action' page is real and on-topic: IOM states it 'supports communities affected by or at risk of displacement whether caused to climate change, environmental degradation, conflict or instability.' Paired with the reviewed IOM 'Who is a migrant?' source (S-086) and the IPCC (S-005)."

  - id: S-384
    title: "Encyclopaedia Britannica — Toussaint Louverture (Haitian Revolution)"
    type: website
    url: https://www.britannica.com/biography/Toussaint-Louverture
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.009.08 (slavery and resistance) for the claim that the Haitian Revolution (1791–1804), led in part by Toussaint Louverture, ended slavery and established Haiti as an independent nation in 1804. The Britannica biography of Toussaint Louverture documents his leadership of the Haitian Revolution and the achievement of Haitian independence. Fact-checker verified (2026-08-18) live: Britannica confirms the August 1791 uprising, Louverture's central leadership, and that his work 'laid the foundation for Haiti's eventual independence in 1804' (he died in 1803 and did not live to see it) — matching the lesson's careful 'led in part by Toussaint Louverture.'"

  - id: S-385
    title: "Encyclopaedia Britannica — Spiritual (African American music)"
    type: website
    url: https://www.britannica.com/topic/spiritual
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.009.09 (keeping humanity, culture, and hope under oppression) for the claim that the spiritual is an African American religious song born of the enslaved experience, carrying sorrow, faith, hope, and sometimes hidden messages. The Britannica 'spiritual' article documents the spiritual as a folk song tradition that emerged among enslaved African Americans and expresses their religious faith and lived experience. Fact-checker verified (2026-08-18) live: Britannica documents Black spirituals as folk hymns sung by enslaved African Americans in worship and as work songs, with double meanings alluding to liberation. The registered /topic/spiritual URL resolves to the article (canonical /art/spiritual)."

  - id: S-386
    title: "Stanford Encyclopedia of Philosophy — Consequentialism"
    type: website
    url: https://plato.stanford.edu/entries/consequentialism/
    organization: Stanford University (Stanford Encyclopedia of Philosophy)
    domains: [D09]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.010.02 (Weighing Consequences, Duties, and Fairness) for the 'consequences' lens — reasoning about what is right by considering what happens to everyone affected. The SEP entry on consequentialism is the standard scholarly reference for this ethical tradition; the lesson uses it only as the source of the consequences lens, not as a claim about any specific fact. Fact-checker verified (2026-08-18) live: URL resolves; the entry opens 'Consequentialism... is simply the view that normative properties depend only on consequences' and, for act consequentialism, that 'whether an act is morally right depends only on the consequences of that act' (with 'Universal Consequentialism' covering 'the consequences for all people or sentient beings'). Accurately supports the lesson's 'what happens to everyone affected' framing of the consequences lens."

  - id: S-387
    title: "Stanford Encyclopedia of Philosophy — Deontological Ethics"
    type: website
    url: https://plato.stanford.edu/entries/ethics-deontological/
    organization: Stanford University (Stanford Encyclopedia of Philosophy)
    domains: [D09]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.010.02 (Weighing Consequences, Duties, and Fairness) for the 'duties' lens — reasoning about what is right by considering what one owes (honesty, promises, care), regardless of consequences. The SEP entry on deontological ethics is the standard scholarly reference for this tradition; the lesson uses it only as the source of the duties lens. Fact-checker verified (2026-08-18) live: URL resolves; the entry opens 'The word deontology derives from the Greek words for duty (deon) and science (or study) of (logos)' and states deontologists 'stand in opposition to consequentialists,' judging the morality of choices by criteria other than the states of affairs they bring about — directly supporting the lesson's duty-based (what I owe, regardless of consequences) framing."

  - id: S-388
    title: "Stanford Encyclopedia of Philosophy — Distributive Justice"
    type: website
    url: https://plato.stanford.edu/entries/justice-distributive/
    organization: Stanford University (Stanford Encyclopedia of Philosophy)
    domains: [D09]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.010.04 (Three Ideas of Justice) for the idea that justice has competing answers — equal treatment, need, and restitution — mapped onto long-standing debates in the theory of distributive justice. The SEP entry on distributive justice is the standard scholarly reference; the lesson presents these as ideas to compare, not as a single correct answer. Fact-checker verified (2026-08-18) live: URL resolves; the entry surveys competing distributive principles including Strict Egalitarianism ('every person should have the same level of material goods'), the Difference Principle, desert-based principles, and welfare-based principles — supporting the lesson's 'justice has more than one meaning / competing ideas to compare' framing. Note: 'restitution' (repair of past harm) is a corrective/restorative concept; the lesson correctly pairs it with Zehr (S-161) and the IIRP (S-022) rather than attributing it to the SEP distributive-justice entry, so the citation is used only for the equal-treatment/need side of the debate."

  - id: S-389
    title: "UNESCO — Universal Declaration on Cultural Diversity"
    type: website
    url: https://www.unesco.org/en/legal-affairs/unesco-universal-declaration-cultural-diversity
    organization: UNESCO
    year: 2001
    domains: [D09]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.010.03 (Values and Moral Codes Across Cultures) as a shared international commitment to cultural diversity and to respectful engagement across difference. The lesson frames this as a value/commitment, not a scientific fact, consistent with philosophy §5. Fact-checker verified (2026-08-18) live: URL resolves to UNESCO's canonical Legal Affairs page for the Universal Declaration on Cultural Diversity (adopted 2 November 2001, Paris — matching the year: 2001 field). Article 1 declares cultural diversity 'the common heritage of humanity' to be 'recognized and affirmed for the benefit of present and future generations'; Article 4 calls the defence of cultural diversity 'an ethical imperative, inseparable from respect for human dignity.' Accurately supports the lesson's 'shared international commitment / respectful engagement across difference' framing."

  - id: S-390
    title: "Encyclopaedia Britannica — Salt March"
    type: website
    url: https://www.britannica.com/event/Salt-March
    organization: Encyclopaedia Britannica
    domains: [D09]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.010.06 (How a Social Movement Works) as one example of a social movement — the 1930 Salt March led by Mohandas Gandhi, a nonviolent act of civil disobedience against the British salt tax, part of the Indian independence movement. The Britannica 'Salt March' article documents the event; the lesson offers it as one globally representative example among several (Green Belt Movement S-059, Chipko S-328, Defiance Campaign S-146, Parihaka S-144). Fact-checker verified (2026-08-18): britannica.com returns HTTP 403 to automated clients (bot-blocking), but the URL is canonical and resolves (confirmed via Wayback Machine captures with 200 status). Article text: 'Salt March, major nonviolent protest action in India led by Mohandas (Mahatma) Gandhi in March–April 1930' (also called Dandi March or Salt Satyagraha), the first act in a larger campaign of civil disobedience (satyagraha) waged against British rule, protesting the British monopoly and heavy tax on salt — matching every element of the lesson's claim (1930, Gandhi, nonviolent civil disobedience, salt tax, independence movement)."

  - id: S-391
    title: "Encyclopaedia Britannica — Arab Spring"
    type: website
    url: https://www.britannica.com/event/Arab-Spring
    organization: Encyclopaedia Britannica
    domains: [D09]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.010.07 (Digital Tools and Civic Participation) as one documented case of digital tools being used to organize and spread information during the 2010–11 Arab Spring uprisings, while noting the same tools also spread misinformation and enabled surveillance. The Britannica 'Arab Spring' article documents the uprisings and the role of social media; the lesson presents the case as one among many and weighs risks and benefits rather than giving a simple verdict. Fact-checker verified (2026-08-18): britannica.com returns HTTP 403 to automated clients, but the URL is canonical and resolves (confirmed via Wayback Machine captures with 200 status). Article text: 'Arab Spring, wave of pro-democracy protests and uprisings that took place in the Middle East and North Africa beginning in 2010 and 2011'; on Egypt it states protests were 'organized among young Egyptians through social media.' Accurately supports the lesson's 2010–11 dating and its 'digital tools used to organize and spread information' claim. The lesson's additional cautions (misinformation, surveillance, digital divide, blocked organizing) are standard, well-documented scholarly points, and the lesson frames them as risks to weigh, not as a verdict."

  - id: S-392
    title: "Encyclopaedia Britannica — Truth and Reconciliation Commission, South Africa"
    type: website
    url: https://www.britannica.com/topic/Truth-and-Reconciliation-Commission-South-Africa
    organization: Encyclopaedia Britannica
    domains: [D09]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.010.09 (Peace and Reconciliation After Conflict) for the claim that South Africa's Truth and Reconciliation Commission (1996–1998), established after apartheid, invited public testimony about past abuses and, in defined cases, offered amnesty in exchange for full disclosure, alongside reparations — a real, documented, and contested attempt to trade some punishment for truth and repair. The Britannica article documents the TRC; the lesson presents it as one attempt with real strengths and limits. Fact-checker verified (2026-08-18): britannica.com returns HTTP 403 to automated clients, but the URL is canonical and resolves (confirmed via Wayback Machine captures with 200 status). Article text confirms: the TRC was 'a courtlike body established by the new South African government in 1995' under the Promotion of National Unity and Reconciliation Act 34 of 1995, chaired by Archbishop Desmond Tutu; its emphasis was on 'gathering evidence and uncovering information — from both victims and perpetrators — and not on prosecuting individuals for past crimes'; it received 'more than 22,000 statements from victims,' held public hearings at which victims testified, granted '1,500 amnesties' in exchange for full disclosure (Amnesty Committee), and included a Reparations and Rehabilitation Committee (reparations policy). The lesson's '(1996–1998)' is the standard shorthand for the TRC's main public-hearing/truth-telling period (the Human Rights Violations Committee's public hearings ran 1996–1998); Britannica's own date field spans 1995–2003 (establishment to final report). The 'contested / real strengths and limits' framing is accurate and appropriately hedged."

  - id: S-393
    title: "WITNESS Media Lab — Prepare, Don't Panic: Synthetic Media and Deepfakes"
    type: website
    url: https://lab.witness.org/projects/synthetic-media-and-deep-fakes/
    organization: WITNESS Media Lab
    domains: [D10]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.011.05 (Deepfakes and Altered Video) to define synthetic media and support the checking approach (look for unnatural edges/blinking/lighting; trace who posted it and where it first appeared; verify against independent reporting). WITNESS is a human-rights organization focused on video and technology. Fact-checker verified (2026-08-19): URL returns HTTP 200. The page 'Prepare, Don't Panic: Synthetic Media and Deepfakes' confirms deepfakes are AI-generated 'synthetic media,' citing 'face-swaps and deceptive audio' and 'facial reenactment,' and frames the response as preparedness rather than panic — matching the lesson's 'evaluated, not feared' framing. The page stresses provenance, detection infrastructure, and media literacy over eyeballing pixels (reflected in the lesson's 'trace' and 'verify' steps); the 'look for edges/blinking/lighting' heuristic is standard age-appropriate media-literacy guidance, and the lesson correctly warns against expecting anyone to be a 'perfect human detector.'"

  - id: S-394
    title: "First Draft — Verifying Online Information: The Absolute Essentials (2019; archived)"
    type: website
    url: https://web.archive.org/web/2019/https://firstdraftnews.org/latest/verifying-online-information-the-absolute-essentials/
    organization: First Draft
    domains: [D10]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.011.05 for the verification habit — reverse image search, tracing a piece of media to its original source, and checking claims against independent reporting (lateral reading). First Draft was a nonprofit research-and-training network on mis- and disinformation. Fact-checker verified (2026-08-19): First Draft ceased operations in June 2022, and the live site (firstdraftnews.org) now returns HTTP 502, so the citation is preserved via the Internet Archive. The archived guide URL returns HTTP 200 (archived page title 'Verifying online information: The absolute essentials'), and the guide covers the verification essentials the lesson attributes to it."

  - id: S-395
    title: "World Commission on Environment and Development (1987) — Our Common Future (Brundtland Report)"
    type: report
    url: https://www.are.admin.ch/are/en/home/media/publications/sustainable-development/brundtland-report.html
    organization: World Commission on Environment and Development (United Nations)
    year: 1987
    domains: [D10]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.011.08 (Sustainability) as the canonical source of the definition of sustainable development — meeting 'the needs of the present without compromising the ability of future generations to meet their own needs.' This is the widely accepted origin of the definition the lesson teaches. Fact-checker verified (2026-08-19): the previously registered UN PDF (sustainabledevelopment.un.org/content/documents/5987our-common-future.pdf) now redirects to the SDGs homepage (sdgs.un.org) and no longer serves the PDF, so the URL was updated to the Swiss Federal Office for Spatial Development (ARE) copy of the 1987 Brundtland Report ('Our Common Future'), which returns HTTP 200 and quotes the exact definition verbatim ('…future generations to meet their own needs.')."

  - id: S-396
    title: "National Geographic Education — Biome"
    type: website
    url: https://education.nationalgeographic.org/resource/biomes/
    organization: National Geographic Society
    domains: [D10]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.011.07 (Biomes and Adaptation) for the definition of a biome — a large region with a characteristic climate and community of life — and for the point that similar biomes occur across continents, so similar adaptations appear in similar climates worldwide. Fact-checker verified (2026-08-19): the previously registered singular URL (/resource/biome/) returns HTTP 404; the correct live URL is the plural '/resource/biomes/' (HTTP 200). The page defines a biome as 'an area of the planet that can be classified according to the plants and animals that live in it,' states that temperature, soil, and the amount of light and water determine what life exists in a biome, notes that classification schemes vary (from as few as two to more than a dozen biomes), and that biomes move as climate changes. This supports the lesson's definition and its point that biome types repeat across climate zones and continents."

  - id: S-397
    title: "WHO — Electronic waste (e-waste) fact sheet"
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/electronic-waste-%28e-waste%29
    organization: World Health Organization
    domains: [D10]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.011.02 (Who Benefits, Who Is Harmed) for the claim that discarded electronics (e-waste) are hazardous when improperly dumped or recycled — one real harm of the mobile phone's life cycle. Fact-checker verified (2026-08-19): URL returns HTTP 200. The WHO fact sheet (dated 1 Oct 2024) confirms e-waste is one of the fastest-growing solid waste streams; that unsound recycling and dumping can release up to 1000 chemical substances including known neurotoxicants (lead, mercury, dioxins); and that children and pregnant women are especially vulnerable. It also documents child labour in informal e-waste recycling. The lesson's brief, hedged claim ('discarded phones become e-waste, toxic when dumped') is fully supported; no specific numeric figures are asserted in the lesson text."

  - id: S-398
    title: "Amnesty International (2016) — This Is What We Die For: Human Rights Abuses in the Democratic Republic of the Congo Power the Global Trade in Cobalt"
    type: report
    url: https://www.amnesty.org/en/latest/news/2016/01/child-labour-behind-smart-phone-and-electric-car-batteries/
    organization: Amnesty International
    year: 2016
    domains: [D10]
    reviewed: true
    notes: "Cited in Grade-8 lesson L.08.011.02 (Who Benefits, Who Is Harmed) for the claim that the minerals inside phones, such as cobalt, are sometimes mined in conditions that harm and exploit workers, including children — one real harm borne far from the user, a key point for the egalitarian lens. Amnesty's 2016 report 'This Is What We Die For' documents child labour and human rights abuses in cobalt mining in the DRC. Fact-checker verified (2026-08-19): the previously registered URL used '/latest/research/2016/01/…'; the correct path is '/latest/news/2016/01/child-labour-behind-smart-phone-and-electric-car-batteries/'. Amnesty.org returns HTTP 403 to automated clients (bot protection), but the URL is real and corroborated by multiple Internet Archive captures (HTTP 200, January 2016; archived page title 'Child labour behind smart phone and electric car batteries | Amnesty International'). The lesson presents this briefly and age-appropriately (no graphic detail) and hedges with 'sometimes,' which is accurate."

  - id: S-399
    title: "Markus & Nurius (1986) — Possible Selves"
    type: article
    url: https://doi.org/10.1037/0003-066X.41.9.954
    author: Hazel Markus and Paula Nurius
    year: 1986
    domains: [D01]
    reviewed: true
    notes: "Markus, H., & Nurius, P. (1986). Possible selves. American Psychologist, 41(9), 954–969. DOI 10.1037/0003-066X.41.9.954 verified via Crossref (2026-08-19): title 'Possible selves.', authors Hazel Markus / Paula Nurius, American Psychologist 41(9), 954–969 (1986) — all correct; DOI resolves (redirects to doi.apa.org). The foundational account of 'possible selves' — the selves a person imagines becoming, hoping to become, and fearing to become — as a bridge between the present self and future motivation. Cited in Grade-8 lesson L.08.012.01 (All of Me: The Whole Self Made of Intersecting Identities) for the framing that the 'who I am becoming' reflection is about imagined possible selves, not a fixed verdict. Real, correctly attributed, foundational in the psychology of self and identity. Verified by fact-checker 2026-08-19."

  - id: S-400
    title: "Damon (2008) — The Path to Purpose: How Young People Find Their Calling in Life"
    type: book
    author: William Damon
    year: 2008
    organization: Free Press
    domains: [D01]
    reviewed: true
    notes: "Damon, W. (2008). The Path to Purpose: How Young People Find Their Calling in Life. New York: Free Press. Real, correctly attributed developmental-psychology book (William Damon, Stanford; based on the Stanford Youth Purpose project with Kendall Bronk and others). The claim it supports — that a sense of purpose grows by trying, reflecting, and being supported rather than by being certain at once, and that only a minority of young people report a clear sense of purpose — is accurate and appropriately hedged: Damon's survey work found roughly one in five young people (~20%) demonstrates a clear sense of purpose, and purpose is framed as developing through exploration and reflection, not sudden certainty. Cited in Grade-8 lesson L.08.012.05 (All of Us: Celebration, the Caring Community & Looking Ahead) for the framing that looking ahead to high school is about purpose and possibility, not pressure or certainty. No URL (print book). Verified by fact-checker 2026-08-19."

  - id: S-401
    title: "Barrett — How Emotions Are Made: The Secret Life of the Brain"
    type: book
    url: https://lisafeldmanbarrett.com/books/how-emotions-are-made/
    author: Lisa Feldman Barrett
    year: 2017
    organization: Houghton Mifflin Harcourt
    domains: [D01]
    reviewed: true
    notes: "Barrett, L. F. (2017). How Emotions Are Made: The Secret Life of the Brain. New York: Houghton Mifflin Harcourt. Verified live 2026-08-19 (lisafeldmanbarrett.com). The URL is the author's own book page and correctly describes the book. The concept of 'emotional granularity' (rich, precise emotion vocabulary enabling finer-grained emotional experience and better regulation) is correctly attributed to Barrett's constructed-emotion/emotion-concepts framework. IMPORTANT FRAMING (verified correct in the lessons): constructed-emotion theory is a debated, contested account in affective science, not settled fact — the lessons L.09.003.02 and L.09.003.03 explicitly frame it as 'one well-supported scientific account, not a creed, and not a therapy,' and state that 'no single wheel of emotions is settled fact; wheels are models.' The claim that emotional granularity is *associated with* better emotion regulation is accurate and appropriately hedged (correlational, not causal). No overstatement found."

  - id: S-402
    title: "Plutchik — Emotion: A Psychoevolutionary Synthesis"
    type: book
    author: Robert Plutchik
    year: 1980
    organization: Harper & Row
    domains: [D01]
    reviewed: true
    notes: "Plutchik, R. (1980). Emotion: A Psychoevolutionary Synthesis. New York: Harper & Row. Print book (no URL); verified 2026-08-19 against secondary literature (Wikipedia 'Emotion classification'/'Plutchik's wheel of emotions'). The eight basic emotions listed in the registry — joy, trust, fear, surprise, sadness, disgust, anger, anticipation — exactly match Plutchik's 1980 wheel of eight emotions, which combines into dyads/triads and varies in intensity to yield more complex states. The lesson L.09.003.02 uses this correctly and cautiously: it presents basic emotions 'in some models' (noting Plutchik), distinguishes basic vs. subtle vs. secondary, and explicitly tells learners that no single wheel is settled fact and they may build their own. Attribution and framing are correct; not overstated."

  - id: S-403
    title: "Marcia — Development and Validation of Ego-Identity Status"
    type: article
    url: https://doi.org/10.1037/h0023281
    author: James E. Marcia
    year: 1966
    organization: Journal of Personality and Social Psychology
    domains: [D01]
    reviewed: true
    notes: "Marcia, J. E. (1966). Development and validation of ego-identity status. Journal of Personality and Social Psychology, 3(5), 551–558. DOI 10.1037/h0023281. DOI verified live 2026-08-19 (resolves correctly to this exact article). The four identity statuses — identity achievement, moratorium, foreclosure, and diffusion — distinguished by whether a person has explored options and made commitments, are correctly described. Lessons L.09.003.07 and L.09.003.08 use the framework correctly: they teach that 'moratorium' (open exploration) is a normal and healthy part of identity formation before commitment, and frame the statuses as a descriptive framework, never a ranked ladder or a verdict on any learner. Correctly attributed, not overstated."

  - id: S-404
    title: "McAdams — The Psychology of Life Stories"
    type: article
    url: https://doi.org/10.1037/1089-2680.5.2.100
    author: Dan P. McAdams
    year: 2001
    organization: Review of General Psychology
    domains: [D01]
    reviewed: true
    notes: "McAdams, D. P. (2001). The psychology of life stories. Review of General Psychology, 5(2), 100–122. DOI 10.1037/1089-2680.5.2.100. DOI verified live 2026-08-19 (resolves correctly to this exact article). The account of 'narrative identity' — an internalized, evolving life story linking the reconstructed past, experienced present, and imagined future to give life unity and purpose — is correctly described. Lesson L.09.003.06 uses it correctly as a descriptive theory of identity (not a required genre): it teaches the past–present–future thread and explicitly says a learner's story may be fragmented, uncertain, or multiple, and 'I don't know yet' is a complete answer. Correctly attributed, appropriately framed, not overstated."

  - id: S-405
    title: "Alberti & Emmons — Your Perfect Right: Assertiveness and Equality in Your Life and Relationships"
    type: book
    author: Robert Alberti and Michael Emmons
    year: 2017
    organization: Impact Publishers (New Harbinger)
    domains: [D01]
    reviewed: true
    notes: "Alberti, R., & Emmons, M. (2017). Your Perfect Right: Assertiveness and Equality in Your Life and Relationships (10th ed., revised). Oakland, CA: Impact Publishers / New Harbinger (first published 1970). Print book (no URL); verified 2026-08-19 via the publisher's page (newharbinger.com, ISBN 9781626259607, 'Tenth Edition, Revised,' published March 2017, imprint Impact) and the Wikipedia 'Assertiveness' article. The book's core — assertive communication expresses one's own needs, feelings, and boundaries directly and respectfully, distinct from passive (suppressing needs) and aggressive (trampling others') styles — is correctly described. Lesson L.09.003.10 uses it correctly as a communication-skill frame (the 'I-statement' pattern: 'I feel… when… because… what I need is…'), framed descriptively, not as a claim about personality; it also honors cultural differences in how directly needs are stated. Correctly attributed, not overstated."

  - id: S-406
    title: "Damasio — Descartes' Error: Emotion, Reason, and the Human Brain (somatic marker hypothesis)"
    type: book
    author: Antonio Damasio
    year: 1994
    organization: G. P. Putnam's Sons
    domains: [D03]
    reviewed: true
    notes: "Cited in L.09.004.01 for the somatic marker hypothesis — the idea that bodily responses ('gut feelings') help guide emotion, reasoning, and decision-making, so feeling and thought have a body basis. Damasio, A. (1994). Descartes' Error: Emotion, Reason, and the Human Brain. New York: G. P. Putnam's Sons. Real, well-known book by the neuroscientist Antonio Damasio; the somatic-marker account is a legitimate, widely discussed scientific account, offered in the lesson as one respected story (not settled fact) alongside Barrett's interoception account. Verified 2026-08-19: print book (no URL); the somatic-marker hypothesis is correctly attributed to Damasio and is one theory among several (the lesson explicitly hedges it as 'one respected story, not gospel', set beside Barrett's interoception account). Not overstated."

  - id: S-407
    title: "Tylka & Wood-Barcalow (2015) — What is and what is not positive body image?"
    type: article
    url: https://doi.org/10.1016/j.bodyim.2015.04.001
    author: Tracy L. Tylka & Nichole L. Wood-Barcalow
    year: 2015
    organization: Body Image
    domains: [D03]
    reviewed: true
    notes: "Cited in L.09.004.03–L.09.004.05 for positive body image and body acceptance. Tylka, T. L., & Wood-Barcalow, N. L. (2015). What is and what is not positive body image? Conceptual foundations and construct definition. Body Image, 14, 118–129. DOI 10.1016/j.bodyim.2015.04.001. This peer-reviewed article is the standard scholarly definition of positive body image — emphasizing appreciation of the body's function, kindness toward one's body, and filtering body-image information — and explicitly notes that positive body image is not the same as believing one is attractive. Used to ground the lessons' body-positive/body-neutral framing and the weight-neutral commitment that wellness goals must not target appearance. DOI verified live 2026-08-19 (resolves to Elsevier PII S1740144515000388). Correctly attributed; the lesson's claim that body positivity is not the same as believing you are attractive matches the paper."

  - id: S-408
    title: "Mikkelsen et al. (2017) — Exercise and mental health"
    type: article
    url: https://doi.org/10.1016/j.maturitas.2017.09.003
    author: Kathleen Mikkelsen, Lily Stojanovska, Momir Polenakovic, Marijan Bosevski, Vasso Apostolopoulos
    year: 2017
    organization: Maturitas
    domains: [D03]
    reviewed: true
    notes: "Cited in L.09.004.06 for the mechanisms linking exercise and mental health. Mikkelsen, K., Stojanovska, L., Polenakovic, M., Bosevski, M., & Apostolopoulos, V. (2017). Exercise and mental health. Maturitas, 106, 48–56. DOI 10.1016/j.maturitas.2017.09.003. This peer-reviewed review documents that physical activity improves mood and reduces symptoms of depression and anxiety, and describes the underlying mechanisms — endorphins (endogenous opioids), monoamines (serotonin, dopamine, noradrenaline), and brain-derived neurotrophic factor (BDNF), among others. The lesson uses it accurately and with hedging (endorphins are one mechanism among several; no single chemical is the whole story). DOI verified live 2026-08-19 (resolves to Elsevier PII S0378512217308563); authors and journal (Maturitas 106, 48–56) correct."

  - id: S-409
    title: "FAO — The State of Food Security and Nutrition in the World (SOFI)"
    type: report
    url: https://www.fao.org/publications/home/fao-flagship-publications/the-state-of-food-security-and-nutrition-in-the-world/en
    organization: Food and Agriculture Organization of the United Nations (FAO)
    year: 2024
    domains: [D03]
    reviewed: true
    notes: "Cited in L.09.004.08 for hunger and food-insecurity figures and the four pillars of food security. FAO's flagship annual report on food security and nutrition (published jointly with IFAD, UNICEF, WFP, and WHO). The 2024 edition reports that about 733 million people faced hunger in 2023 (roughly 1 in 11 people) and that about 2.33 billion faced moderate or severe food insecurity. The lesson states these figures accurately and with hedging ('roughly 1 in 11', 'figures shift year to year'), and uses the standard four-pillar definition of food security — availability, access, utilization, stability — as the descriptive frame. Values (that everyone deserves enough to eat) are kept distinct from these facts. URL verified live 2026-08-19 (redirects to the FAO flagship-publications page; HTTP 200). Figures re-verified 2026-08-19 against the FAO SOFI 2024 newsroom release ('Around 733 million people faced hunger in 2023, equivalent to one in eleven people globally') and UNICEF DATA SOFI-2024 summary ('In 2023, around 2.33 billion people globally faced moderate or severe food insecurity')."

  - id: S-410
    title: "UNEP — Food Waste Index Report"
    type: report
    url: https://www.unep.org/resources/publication/food-waste-index-report-2024
    organization: United Nations Environment Programme (UNEP)
    year: 2024
    domains: [D03]
    reviewed: true
    notes: "Cited in L.09.004.07 for food loss and waste. UNEP's Food Waste Index Report 2024 estimates that roughly 1.05 billion tonnes of food were wasted in 2022 (about one-fifth of the food available to consumers), spanning households, food service, and retail. The lesson states the claim accurately and with hedging ('roughly a fifth of the food available to consumers worldwide'), and uses it to make the environment point that wasted food wastes the water, land, and energy used to produce it. Note: 'one-third of all food lost or wasted' is an earlier FAO (2011) figure; the lesson uses the UNEP consumer-level figure and does not conflate the two. URL verified live 2026-08-19 (page 'Food Waste Index Report 2024', dated 27 March 2024; returns 403 to curl but loads in a browser — bot protection only). Figures re-verified against the UNEP Key Messages: 'In 2022, the world wasted 1.05 billion tonnes of food. This amounts to one fifth (19 per cent) of food available to consumers being wasted, at the retail, food service, and household level.'"

  - id: S-411
    title: "National Eating Disorders Association (NEDA) — Body Image"
    type: website
    url: https://www.nationaleatingdisorders.org/body-image-0
    organization: National Eating Disorders Association
    domains: [D03]
    reviewed: true
    notes: "Cited in L.09.004.04 for body image and self-worth. NEDA's body-image page explains what body image is, how media and social messages shape it, and how negative body image relates to disordered eating and mental-health distress. The lesson uses it as a general authority for the body-image concept and the value that a body's worth is not determined by appearance. US-based organization but a standard, widely used authority on body image and eating-disorder prevention; treated as one voice among others, not the only tradition. URL verified live 2026-08-19 (page 'Body Image | Understanding & Improving Self-Perception | NEDA'; returns 403 to curl but loads in a browser — bot protection only). Page defines body image as how you see yourself (beliefs, feelings, body sense) and states that internalized appearance-ideal messages can lead to negative body image and that a healthier body image supports mental wellbeing and eating-disorder prevention — on-topic for the lesson."

  - id: S-412
    title: "UNESCO — International Technical Guidance on Sexuality Education"
    type: report
    url: https://www.unesco.org/en/health-education/cse
    organization: UNESCO
    year: 2018
    domains: [D02, D03]
    reviewed: true
    notes: "Cited in L.09.005.02 for consent and healthy relationship skills. UNESCO's International Technical Guidance on Sexuality Education (revised 2018), developed with UNAIDS, UNFPA, UNICEF, UN Women, and WHO, is the global, evidence-informed reference for comprehensive sexuality education (CSE). It defines CSE as covering, among other things, relationships, consent, and the right to decide freely over one's own body, and it grounds these in human-rights and gender-equality commitments. The lesson uses it as a general authority for the framing that consent is freely given, informed, and reversible, and that healthy relationships rest on respect for autonomy. Held as one widely shared international framework, not the only cultural account of how to ask and agree. URL verified live 2026-08-19 (unesco.org/en/health-education/cse): the page defines CSE, links the ITGSE (2018) PDF, and explicitly names 'consent' among the concepts older learners tackle, framing CSE as developing 'respectful social and sexual relationships' grounded in human rights and gender equality — supporting the lesson's freely-given/informed/reversible framing. Note: the lesson's 'FRIES' memory aid (freely given, reversible, informed, enthusiastic, specific) is Planned Parenthood's mnemonic; UNESCO ITGSE supports the underlying freely-given/informed/reversible principles, while 'enthusiastic' and 'specific' are Planned Parenthood's additions — the lesson cites UNESCO for the consent concept, which is appropriate for those three principles. Reviewed by fact-checker 2026-08-19."

  - id: S-413
    title: "Paul Bloom (2016) — Against Empathy: The Case for Rational Compassion"
    type: book
    author: Paul Bloom
    year: 2016
    organization: Ecco / HarperCollins
    domains: [D02]
    reviewed: true
    notes: "Cited in L.09.005.05 for the limits of empathy. Paul Bloom, a professor of psychology at Yale (now University of Toronto), argues in this widely discussed book that empathy — feeling what another feels — is narrow, biased, and near-sighted (it runs strongest toward those who look like us and toward single identifiable victims), and that reasoned compassion is a more reliable guide to helping. The lesson uses this accurately: empathy is parochial and distance-shaped, a claim Bloom documents rather than the lesson's own value judgment. The lesson explicitly does not endorse 'empathy is bad'; it holds the descriptive claim about empathy's limits and adds a values commitment (choose where your care goes). Real, correctly attributed book (Ecco/HarperCollins, 2016; ISBN 978-0062339331). Reviewed by fact-checker 2026-08-19."

  - id: S-414
    title: "Slovic (2007) — 'If I Look at the Mass I Will Never Act': Psychic Numbing and Genocide"
    type: article
    author: Paul Slovic
    year: 2007
    organization: Judgment and Decision Making
    url: https://journal.sjdm.org/jdm7303a.pdf
    doi: 10.1017/S1930297500000061
    domains: [D02]
    reviewed: true
    notes: "Cited in L.09.005.05 for the identifiable-victim effect and psychic numbing. Paul Slovic, a leading researcher on risk perception, documents that compassion and helping tend to decrease as the number of victims increases ('psychic numbing'), and that a single identifiable victim elicits far more feeling and action than a statistic ('the identifiable victim effect'). The lesson's summary line 'one death is a tragedy, a million is a statistic' is the lesson's paraphrase of a widely quoted formulation attributed to Joseph Stalin, used there only as a vivid teaching shorthand — the factual claims (identifiable-victim effect, psychic numbing) are Slovic's and are accurately represented. Real, correctly attributed article: Slovic, P. (2007), Judgment and Decision Making, 2(2), 79–95; DOI 10.1017/S1930297500000061, open-access PDF at journal.sjdm.org/jdm7303a.pdf (URL verified live 2026-08-19). Note: the paper's own title quote — 'If I look at the mass I will never act' — is attributed to Mother Teresa, distinct from the 'one death is a tragedy' line (commonly, but without evidence, attributed to Stalin); the lesson uses neither quotation as an attributed claim. Reviewed by fact-checker 2026-08-19."

  - id: S-415
    title: "Benedict Anderson (1983) — Imagined Communities: Reflections on the Origin and Spread of Nationalism"
    type: book
    author: Benedict Anderson
    year: 1983
    organization: Verso
    domains: [D02, D08]
    reviewed: true
    notes: "Cited in L.09.005.07 for the concept of the nation as an 'imagined community.' Benedict Anderson's classic study defines the nation as 'an imagined political community — and imagined as both inherently limited and sovereign': its members will never meet most of their fellow-members, yet in their minds lives the image of their communion. The lesson uses this concept accurately — a nation is an imagined community — and holds it as a description, not an insult (imagined is not the same as unreal). The lesson's claim that nationalism is historically recent and culturally specific is standard and supported by this and related scholarship. Real, correctly attributed book (Verso, 1983; the quoted definition is Anderson's exact wording, verbatim). Reviewed by fact-checker 2026-08-19."

  - id: S-416
    title: "Elinor Ostrom (1990) — Governing the Commons"
    type: book
    author: Elinor Ostrom
    year: 1990
    organization: Cambridge University Press
    domains: [D02, D09]
    reviewed: true
    notes: "Cited in L.09.005.08 for the idea that communities can govern shared resources by their own rules for the common good. Elinor Ostrom's Nobel-prize-winning work (2009 Nobel Memorial Prize in Economic Sciences, shared with Oliver Williamson; she was the first woman to win it) documents, across many societies, how communities have successfully managed common resources (forests, fisheries, irrigation, grazing) through self-made rules and institutions, without either privatization or top-down state control. The lesson uses this accurately: a shared commons with rules for fair use is a real, documented system, and its rules — like any system's — can be changed. The lesson does not claim commons always succeed, only that they are a well-documented alternative rule-set. Real, correctly attributed book (Cambridge University Press, 1990; ISBN 978-0521405997). Reviewed by fact-checker 2026-08-19."


  - id: S-417
    title: "Chimamanda Ngozi Adichie — The Danger of a Single Story (TED, 2009)"
    type: video
    url: https://www.ted.com/talks/chimamanda_ngozi_adichie_the_danger_of_a_single_story
    author: Chimamanda Ngozi Adichie
    organization: TED
    year: 2009
    domains: [D04]
    reviewed: true
    notes: "URL verified live (2026-08-19): TED talk page confirms 'The danger of a single story,' Chimamanda Ngozi Adichie, TEDGlobal 2009 (July 2009) — title, speaker, and year all correct. Cited in L.09.006.04 for structure, style, and argument working together. Real, widely known TED talk (July 2009) by the Nigerian writer Chimamanda Ngozi Adichie. Its argument — that knowing only a single story about a person or place risks flattening them, so we must seek many stories — is built through a structure of personal anecdotes (growing up in Nigeria reading British books; her American roommate's assumptions; her own single story of a poor family) and a style of plain first-person address with the phrase 'single story' repeated like a refrain. The lesson uses a short, faithful excerpt for fair use, quotes/paraphrases the talk accurately, and does not misattribute."

  - id: S-418
    title: Encyclopaedia Britannica — Du Fu
    type: website
    url: https://www.britannica.com/biography/Du-Fu
    organization: Encyclopaedia Britannica
    domains: [D04]
    reviewed: true
    notes: "URL verified live via archive (2026-08-19; live page is Cloudflare-bot-blocked, HTTP 403): Britannica 'Du Fu | Chinese Poet & Tang Dynasty Innovator' states born 712, died 770 — dates and Tang attribution correct. Cited in L.09.006.05 for Du Fu (杜甫, 712–770) of Tang China as a poet whose work moves from what the eye sees to what the heart fears, written through war and displacement. Du Fu is a canonical, real figure of Chinese literature, widely regarded among its greatest poets; the lesson presents him as one voice among many world traditions, not as a specimen."

  - id: S-419
    title: Encyclopaedia Britannica — Rumi
    type: website
    url: https://www.britannica.com/biography/Rumi
    organization: Encyclopaedia Britannica
    domains: [D04]
    reviewed: true
    notes: "URL verified live via archive (2026-08-19; live page Cloudflare-bot-blocked, HTTP 403): Britannica 'Rumi' states born c. 1207 (Balkh), died 1273 (Konya), 'the greatest Sufi mystic and poet in the Persian language' — dates and Persian-Sufi attribution correct. Cited in L.09.006.05 for Rumi (Jalāl al-Dīn Muḥammad Rūmī, 1207–1273), the Persian Sufi poet, whose short lyrics of longing and ecstatic address are a major world tradition. The lesson presents a brief lyric of longing in faithful paraphrase/translation and does not reduce his mystical poetry to a single reading."

  - id: S-420
    title: Nobel Prize — Pablo Neruda, Facts
    type: website
    url: https://www.nobelprize.org/prizes/literature/1971/neruda/facts/
    organization: Nobel Prize Outreach / Nobel Foundation
    year: 1971
    domains: [D04]
    reviewed: true
    notes: "URL verified live (2026-08-19): NobelPrize.org 'Pablo Neruda — Facts' states born 12 July 1904 Parral, Chile; died 23 September 1973 Santiago, Chile; Nobel Prize in Literature 1971 — all correct. Cited in L.09.006.05 and L.09.006.06 for Pablo Neruda (Chile, 1904–1973, Nobel Prize in Literature 1971) and his 'odes to common things,' which elevate humble everyday objects into subjects worthy of praise. The odes are real and canonical; the lesson uses a short, faithful rendering and presents Neruda as one voice among world literatures."

  - id: S-421
    title: Nobel Prize — Rabindranath Tagore, Facts
    type: website
    url: https://www.nobelprize.org/prizes/literature/1913/tagore/facts/
    organization: Nobel Prize Outreach / Nobel Foundation
    year: 1913
    domains: [D04]
    reviewed: true
    notes: "URL verified live (2026-08-19): NobelPrize.org 'Rabindranath Tagore — Facts' states born 7 May 1861 Calcutta, died 7 August 1941 Calcutta; Nobel Prize in Literature 1913, for verse 'expressed in his own English words' (Gitanjali) — all correct, and he is the first non-European literature laureate. Cited in L.09.006.05 and L.09.006.06 for Rabindranath Tagore (Bengal, 1861–1941), the first non-European to win the Nobel Prize in Literature (1913), for his Gitanjali ('song-offerings') and the lyric locating home in the road and the small everyday meeting. Real, correctly attributed; the lesson uses a short, faithful rendering and honors the work as a living tradition."

  - id: S-422
    title: Poetry Foundation — Joy Harjo
    type: website
    url: https://www.poetryfoundation.org/poets/joy-harjo
    organization: Poetry Foundation
    domains: [D04]
    reviewed: true
    notes: "URL verified live (2026-08-19): Poetry Foundation 'Joy Harjo' states she is a member of the Muscogee (Creek) Nation (Mvskoke is the endonym) and was named U.S. poet laureate in June 2019 — the first Native American to hold the post (served 2019–2022). Correct. Cited in L.09.006.05 and L.09.006.06 for Joy Harjo (Mvskoke [Creek] Nation), the first Native American U.S. Poet Laureate (2019–2022), and her poem 'Remember,' whose structure is a litany of anaphora ('Remember…') linking a person to sky, earth, ancestors, and language. The poem and the biographical facts are real and correctly attributed; the lesson uses a short, faithful rendering."

  - id: S-423
    title: Encyclopaedia Britannica — Mahmoud Darwish
    type: website
    url: https://www.britannica.com/biography/Mahmoud-Darwish
    organization: Encyclopaedia Britannica
    domains: [D04]
    reviewed: true
    notes: "URL verified live via archive (2026-08-19; live page Cloudflare-bot-blocked, HTTP 403): Britannica 'Mahmoud Darwish' states born 13 March 1941 Al-Birwa, Palestine; died 9 August 2008 — dates and Palestinian attribution correct. Cited in L.09.006.06 for Mahmoud Darwish (Palestine, 1941–2008), the celebrated Palestinian poet, whose work locates home in exile, longing, and the refusal to be erased from one's place. The lesson uses a short, faithful rendering of this theme and presents it with care as one voice among several on the topic of home."

  - id: S-424
    title: "Ngũgĩ wa Thiong'o — Decolonising the Mind: The Politics of Language in African Literature"
    type: book
    author: Ngũgĩ wa Thiong'o
    year: 1986
    organization: James Currey / Heinemann
    domains: [D04]
    reviewed: true
    notes: "Print book; bibliographic details verified (2026-08-19): Ngũgĩ wa Thiong'o, Decolonising the Mind: The Politics of Language in African Literature, 1986 (James Currey/Heinemann) — canonical. Cited in L.09.006.10 for the argument that language carries a people's culture and history, and that being made to write in the colonizer's language (English) instead of Gikuyu distanced the author from his home world. Real, canonical book (1986). The lesson uses a short, faithful excerpt and presents it as the author's lived argument, not as universal fact; learners are invited to reflect on their own experience (including monolingual), never to adopt a single verdict."

  - id: S-425
    title: "Gloria Anzaldúa — Borderlands/La Frontera: The New Mestiza"
    type: book
    author: Gloria Anzaldúa
    year: 1987
    organization: Aunt Lute Books
    domains: [D04]
    reviewed: true
    notes: "Print book; bibliographic details verified (2026-08-19): Gloria Anzaldúa, Borderlands/La Frontera: The New Mestiza, 1987 (Aunt Lute Books); 'How to Tame a Wild Tongue' is a chapter within it — canonical. Cited in L.09.006.10 for living between languages (Chicano Spanish, English, and more) and the insight that one's languages are part of one's identity, from the essay 'How to Tame a Wild Tongue.' Real, canonical book (1987). The lesson uses a short, faithful excerpt, holds it as the author's lived argument, and honors multilingualism as wealth rather than deficit."

  - id: S-426
    title: Ethnologue — Languages of the World
    type: website
    url: https://www.ethnologue.com/
    organization: SIL International
    domains: [D04]
    reviewed: true
    notes: "URL verified live via archive (2026-08-19; live page Cloudflare-bot-blocked, HTTP 403): Ethnologue states 'More than 7,000 languages are spoken today' — supports the lesson's hedged 'about 7,000 living languages.' Cited in L.09.006.11 for the count of roughly 7,000 living languages and for the fact that many are endangered. Ethnologue is the standard reference cataloguing the world's living languages and their endangerment status; UNESCO's Atlas of the World's Languages in Danger lists on the order of 2,500 endangered languages. The lesson states these as hedged, sourceable figures and pairs loss with revitalization."

  - id: S-427
    title: "Robin Wall Kimmerer — Braiding Sweetgrass: Indigenous Wisdom, Scientific Knowledge, and the Teachings of Plants"
    type: book
    author: Robin Wall Kimmerer
    year: 2013
    organization: Milkweed Editions
    domains: [D04, D09, D10]
    reviewed: true
    notes: "Print book; bibliographic details verified (2026-08-19): Robin Wall Kimmerer, Braiding Sweetgrass: Indigenous Wisdom, Scientific Knowledge, and the Teachings of Plants, 2013 (Milkweed Editions) — canonical; the Potawatomi/animacy point (plants named as persons, not things) is accurately attributed. Cited in L.09.006.11 for the link between language and ecological knowledge: learning Potawatomi plant words, Kimmerer finds that the grammar of the language encodes a relationship of respect to the living world (calling a plant a person, not a thing). Real, widely honored book (2013) by a botanist and citizen of the Citizen Potawatomi Nation. The lesson uses this to explain why protecting languages matters for the environment — because languages carry knowledge of plants, animals, weather, and place (biocultural diversity). Also cited in U.09.011 L03 (the duties lens) for the claim that Indigenous traditions ground duty in relationship, role, and reciprocity — Kimmerer's central ethic of reciprocity (the Honorable Harvest, 'all flourishing is mutual') is a duty grounded in relationship and reciprocity with the living world, which supports the lesson's framing without reducing any Indigenous tradition to a single concept."

  - id: S-428
    title: "Leanne Hinton (ed.) — Bringing Our Languages Home: Language Revitalization for Families"
    type: book
    author: Leanne Hinton (editor)
    year: 2013
    organization: Heyday Books
    domains: [D04]
    reviewed: true
    notes: "Print book; bibliographic details verified (2026-08-19): Leanne Hinton (ed.), Bringing Our Languages Home: Language Revitalization for Families, 2013 (Heyday Books) — canonical. The four cases (Māori kōhanga reo begun 1982; Hawaiian Pūnana Leo begun 1984; Welsh in schools/media; Hebrew revived over the 20th c.) are standard, well-documented. Cited in L.09.006.11 for the general account of language revitalization through intergenerational transmission — children and elders speaking together again. The lesson's four stories (Māori kōhanga reo language nests begun 1982; Hawaiian Pūnana Leo preschools begun 1984; Welsh taught in schools and carried by media; Hebrew revived into an everyday spoken language over the twentieth century) are standard, well-documented cases of the wider movement Hinton's collection documents. The lesson states them accurately and as cases, not as a complete list."

  - id: S-429
    title: "Boyer & Merzbach — A History of Mathematics"
    type: book
    author: Carl B. Boyer & Uta C. Merzbach
    organization: John Wiley & Sons
    year: 2011
    domains: [D05]
    reviewed: true
    notes: "3rd ed., 2011, Wiley. Standard, widely cited single-volume history of mathematics. Cited in U.09.007 L01, L02, L03, L04, L05, L07, L09, L10 as the general authority for non-Western and ancient mathematical history claims: Babylonian approximation of √2 and the solution of quadratics, the irrational-number episode, Indian and Chinese geometry (Sulba Sutras; the Nine Chapters on the Mathematical Art), al-Khwarizmi's algebra, the origin of the word 'algebra,' the variety of unit systems, and the rice-and-chessboard doubling legend. Used as a general historical authority, not a page-level citation for any single numeric claim; each specific claim is further hedged in the lessons. Bibliographic details verified (2026-08-19): Carl B. Boyer (revised by Uta C. Merzbach), A History of Mathematics, 3rd ed., John Wiley & Sons, 2011 (ISBN 978-0-470-52548-7) — the standard single-volume history of mathematics; it covers the Babylonian √2 and quadratic solutions, the Greek irrationality episode, the Sulba Sutras, the Nine Chapters on the Mathematical Art, and al-Khwarizmi's algebra."

  - id: S-430
    title: YBC 7289 — Babylonian clay tablet approximating the square root of 2
    type: website
    url: https://en.wikipedia.org/wiki/YBC_7289
    organization: Yale Babylonian Collection (Yale University)
    domains: [D05]
    reviewed: true
    notes: "Cited in U.09.007 L02 for the claim that Babylonian scribes approximated √2 (the tablet YBC 7289, dated to roughly 1800–1600 BCE, carries a sexagesimal approximation of the diagonal of a unit square good to about six decimal places). URL verified live (2026-08-19): the article confirms YBC 7289 'is a Babylonian clay tablet notable for containing an accurate sexagesimal approximation to the square root of 2, the length of the diagonal of a unit square... given to the equivalent of six decimal digits,' dated 'some time between 1800 and 1600 BC,' held in the Yale Babylonian Collection (sexagesimal value 1;24,51,10 ≈ 1.414213). Matches the lesson's claims (approximation of √2, ~6 decimal places, ~1800–1600 BCE) exactly. (Lesson text says '~1800 BCE'; the registry and tablet records use the full 1800–1600 BCE range — acceptable shorthand, kept consistent with the source.)"

  - id: S-431
    title: "Muhammad ibn Musa al-Khwarizmi — biography"
    type: website
    url: https://en.wikipedia.org/wiki/Muhammad_ibn_Musa_al-Khwarizmi
    organization: Wikipedia
    domains: [D05]
    reviewed: true
    notes: "Cited in U.09.007 L03 and L07 for the claim that the word 'algebra' derives from al-Khwarizmi's work (from the title Kitab al-Jabr, 'the book of completion/balancing'), that he argued solutions to quadratics geometrically, and that he is a central figure in the history of algebra. URL verified live (2026-08-19): the article confirms al-Khwarizmi (c. 780 – c. 850) wrote Al-Jabr (The Compendious Book on Calculation by Completion and Balancing, c. 820 CE), that 'The English term algebra comes from the short-hand title of his aforementioned treatise (الجبر Al-Jabr, transl. 'completion' or 'rejoining'),' that one of his achievements was 'how to solve quadratic equations by completing the square, for which he provided geometric justifications,' and that he is widely called the father/founder of algebra. Matches the lessons' claims about the al-jabr etymology, geometric completing the square, and his centrality to algebra."

  - id: S-432
    title: "Whitney Battle-Baptiste & Britt Rusert (eds.) — W. E. B. Du Bois's Data Portraits: Visualizing Black America"
    type: book
    author: Whitney Battle-Baptiste & Britt Rusert (editors)
    organization: Princeton Architectural Press
    year: 2018
    domains: [D05]
    reviewed: true
    notes: "Cited in U.09.007 L12 for the claim that W. E. B. Du Bois and his collaborators hand-drew a series of data charts for the 1900 Paris Exposition showing the actual social and economic condition of Black Americans, as a landmark early example of data visualization used to argue for justice and against racist claims. Bibliographic details verified (2026-08-19): Whitney Battle-Baptiste & Britt Rusert (eds.), W. E. B. Du Bois's Data Portraits: Visualizing Black America, Princeton Architectural Press, 2018 — reproduces the hand-drawn charts/infographics that Du Bois and his Atlanta University collaborators prepared for the 1900 Paris Exposition's 'Exhibit of American Negroes,' a landmark of early data visualization against racist claims. Matches the lesson's claim."

  - id: S-433
    title: "Florence Nightingale — statistical work and sanitary reform"
    type: website
    url: https://en.wikipedia.org/wiki/Florence_Nightingale
    organization: Wikipedia
    domains: [D05]
    reviewed: true
    notes: "Cited in U.09.007 L12 for the claim that Florence Nightingale used statistical charts (notably her 'coxcomb' or polar-area diagrams of mortality in the Crimea) to argue for hospital and sanitary reform, an early example of data used to change policy. URL verified live (2026-08-19): the article confirms Nightingale 'was an innovator in statistics,' is 'especially well known for her usage of a polar area diagram, also called the Nightingale rose diagram' to illustrate Crimean War mortality, 'made extensive use of coxcombs to present reports... to Members of Parliament and civil servants,' and was the first female member of the Royal Statistical Society (1859). Matches the lesson's claim."

  - id: S-434
    title: "Shulba Sutras — ancient Indian geometry"
    type: website
    url: https://en.wikipedia.org/wiki/Shulba_Sutras
    organization: Wikipedia
    domains: [D05]
    reviewed: true
    notes: "Cited in U.09.007 L10 for the claim that the Indian Sulba Sutras (including the Baudhayana Sulba Sutra) contain early geometric rules and statements of what is now called the Pythagorean theorem, used in altar construction. URL verified live (2026-08-19): the article confirms 'The sutras contain statements of the Pythagorean theorem, both in the case of an isosceles right triangle and in the general case, as well as lists of Pythagorean triples,' citing the Baudhayana Sulba Sutra (e.g., 1.12–1.13 with triples 3-4-5, 5-12-13, 8-15-17, 12-35-37), tied to fire-altar (vedi) construction. Matches the lesson's claim."

  - id: S-435
    title: "OpenStax — Algebra and Trigonometry / College Physics (openly licensed textbooks)"
    type: book
    organization: OpenStax (Rice University)
    url: https://openstax.org/details/books/algebra-and-trigonometry-2e
    domains: [D05]
    reviewed: true
    notes: "Cited in U.09.007 L08 as a standard, openly licensed reference for quadratic functions as models of projectile motion (height as a quadratic in time). Verified (2026-08-19): both URLs live — https://openstax.org/details/books/algebra-and-trigonometry-2e (quadratic functions) and https://openstax.org/details/books/college-physics-2e (projectile motion, where vertical position is a quadratic in time). Both are real, peer-reviewed, openly licensed (CC-BY 4.0) Rice University textbooks. On-topic for the projectile/quadratic claim. (Removed the inaccurate 'year: 2017'; the two titles have different publication years.)"

  - id: S-436
    title: "Encyclopaedia Britannica — Carrying capacity"
    type: website
    url: https://www.britannica.com/science/carrying-capacity
    organization: Encyclopaedia Britannica
    domains: [D06]
    reviewed: true
    notes: "Cited in U.09.008 L03 (Disruptions and Carrying Capacity) for carrying capacity (K) — the maximum population an environment can sustain — and the exponential-vs-logistic (S-shaped) growth contrast. Verified (2026-08-19): the Britannica 'Carrying capacity' article states verbatim that as competition increases and resources become scarce, 'populations reach the carrying capacity (K) of their environment, causing their growth rate to slow nearly to zero. This produces an S-shaped curve of population growth known as the logistic curve.' On-topic for the lesson's S-curve and K claims. (Britannica returns HTTP 403 to curl — bot protection — but the article loads in a browser and was verified directly.)"

  - id: S-437
    title: "IPBES — Global Assessment Report on Biodiversity and Ecosystem Services"
    type: report
    url: https://www.ipbes.net/global-assessment
    organization: IPBES (Intergovernmental Science-Policy Platform on Biodiversity and Ecosystem Services)
    year: 2019
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.09.008 L04 (Biodiversity: Why Variety Keeps Ecosystems Strong) for the authoritative finding that many species are declining and that biodiversity loss is driven by land/sea use change, overexploitation (direct exploitation), climate change, pollution, and invasive alien species, and that the loss falls unevenly on those who depend most directly on wild biodiversity. Verified (2026-08-19): the dedicated Global Assessment page (ipbes.net/global-assessment) hosts the 2019 Summary for Policymakers (SPM, approved IPBES-7, May 2019; DOI 10.5281/zenodo.3553579) and full report (DOI 10.5281/zenodo.3831673). The five direct drivers and the ~1 million species-threatened figure are the canonical SPM findings; on-topic for the lesson's hedged claims. URL corrected from the IPBES homepage to the specific report page to match the title."

  - id: S-438
    title: "NASA — What Is the Greenhouse Effect? (formerly NASA Climate Kids)"
    type: website
    url: https://science.nasa.gov/kids/earth/what-is-the-greenhouse-effect/
    organization: NASA
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.09.008 L07 (Greenhouse Gases and a Changing Climate) for the mechanism of the greenhouse effect and the human strengthening of it. Verified (2026-08-19): the page states verbatim the greenhouse effect 'is a process that occurs when certain gases in Earth's atmosphere trap the heat from the sun near the surface,' that greenhouse gases keep 'Earth warm enough to support life,' and that over the last ~100 years extra greenhouse gases 'have mainly come from' burning coal and oil and burning gasoline for cars and planes, while natural sources (e.g., volcanoes) are 'too small to account for' the measured rise. On-topic for the lesson's mechanism and human-signal claims. URL updated to the canonical NASA Science location: the former climatekids.nasa.gov/greenhouse-effect/ path (cited in L07) now redirects here after NASA Climate Kids was folded into NASA Science/NASA Kids."

  - id: S-439
    title: "OpenStax — Chemistry 2e (openly licensed textbook)"
    type: book
    url: https://openstax.org/details/books/chemistry-2e
    organization: OpenStax (Rice University)
    domains: [D06]
    reviewed: true
    notes: "Cited in U.09.008 L06 (The Atom, Bonding, and Chemical Energy) as a standard, openly licensed reference for atomic structure (nucleus of protons and neutrons, electrons in shells), chemical bonding (sharing/transferring electrons), and exothermic/endothermic reactions (bond formation releasing energy, bond breaking absorbing energy). Chemistry 2e is real — authors Paul Flowers, Klaus Theopold, Richard Langley, William R. Robinson; OpenStax (Rice University), published 2019. LICENSE CORRECTED (2026-08-19): the textbook is licensed CC BY-NC-SA 4.0 (Creative Commons Attribution-NonCommercial-ShareAlike), NOT CC-BY 4.0 as first recorded; the NonCommercial clause is acceptable here because the curriculum is offered free, but it is not a blanket permissive license. Content verified on-topic: Ch. 5 (Thermochemistry) explicitly defines exothermic/endothermic processes (heat released/absorbed), and the text's Ch. 2/6/7 cover atomic structure and bonding."

  - id: S-440
    title: "Krita — Free and Open Source Digital Painting"
    type: website
    url: https://krita.org/
    organization: Krita Foundation
    domains: [D07]
    reviewed: true
    notes: "Cited in U.09.009 L01 (Digital & Mixed-Media Art) as an example of a free, open-source raster image editor accessible to any learner, supporting the egalitarian commitment that art tools be free and open. URL verified live (2026-08-19): resolves to https://krita.org/en/ (HTTP 200), the official site of Krita, a free and open-source digital painting application. On-topic; cited as an example of a free/open tool, not for a specific factual claim."

  - id: S-441
    title: "Inkscape — Free and Open Source Vector Graphics"
    type: website
    url: https://inkscape.org/
    organization: Inkscape Project
    domains: [D07]
    reviewed: true
    notes: "Cited in U.09.009 L01 (Digital & Mixed-Media Art) as an example of a free, open-source vector editor, alongside Krita. URL verified live (2026-08-19): HTTP 200 via browser user-agent (the site returns 403 to plain automated fetchers — bot protection, not a broken link); it is the canonical Inkscape Project site. On-topic; cited as an example of a free/open tool, not for a specific factual claim."

  - id: S-442
    title: "Center for Media Literacy — Five Core Concepts and Key Questions"
    type: website
    url: https://www.medialit.org/
    organization: Center for Media Literacy
    domains: [D07, D10]
    reviewed: true
    notes: "Cited in U.09.009 L02 (Reading Visual Media) as the framing for the five core questions of media literacy (who created this, what techniques attract attention, what is omitted, who benefits). The Center for Media Literacy is a real, long-standing non-profit (Consortium for Media Literacy) whose five core concepts / five key questions are a well-established media-literacy framework. CAVEAT (verified 2026-08-19): the site's SSL certificate is currently expired (notAfter 2025-05-26), so the URL triggers a browser security warning even though content still loads (HTTP 200 over an insecure connection). The lesson cites CML for the *framing* of its core questions, not as a verbatim quote or a page-level factual claim, so the source remains valid for that purpose; the expired certificate is flagged here for transparency."

  - id: S-443
    title: "BandLab — Free Online Music Studio"
    type: website
    url: https://www.bandlab.com/
    organization: BandLab Technologies
    domains: [D07]
    reviewed: true
    notes: "Cited in U.09.009 L03 (Creating Music with Digital Tools) as a free, browser-based digital audio workstation (DAW) accessible without paid software, supporting the egalitarian commitment. URL verified live (2026-08-19): resolves to BandLab (HTTP 200), a real, widely used free browser-based music-making platform. On-topic; cited as an example of a free tool, not for a specific factual claim."

  - id: S-444
    title: "Audacity — Free, Open Source Audio Editor and Recorder"
    type: website
    url: https://www.audacityteam.org/
    organization: Audacity Team
    domains: [D07]
    reviewed: true
    notes: "Cited in U.09.009 L03 (Creating Music with Digital Tools) as a free, open-source audio recorder and editor for layering and applying effects. URL verified live (2026-08-19): the official site states verbatim that Audacity is 'free, open source software' and 'the world's most popular free software for recording and editing audio.' Directly supports the lesson's claim that Audacity is a free, open-source audio recorder/editor."

  - id: S-445
    title: "Encyclopaedia Britannica — Reggae"
    type: website
    url: https://www.britannica.com/art/reggae
    organization: Encyclopaedia Britannica
    domains: [D07]
    reviewed: true
    notes: "Cited in U.09.009 L04 (Music as Identity, Community & Resistance) for the history and social role of reggae, including its connection to the Rastafari movement and its global spread. Verified live (2026-08-19): the article exists with sections on 'Origin, rhythm, and style,' 'From rock steady to reggae's first superstars,' 'Reggae and the Rastafari movement,' and 'Reggae goes global' — matching the lesson's Jamaica/Rastafari/global-spread framing. On-topic."

  - id: S-446
    title: "Encyclopaedia Britannica — Griot"
    type: website
    url: https://www.britannica.com/art/griot
    organization: Encyclopaedia Britannica
    domains: [D07, D08]
    reviewed: true
    notes: "Cited in U.09.009 L06 (Dance, Drama & Ritual) for the West African griot (jeli/jali) as a troubadour-historian who carries genealogies and histories through oral tradition. Verified live (2026-08-19): the article exists, is subtitled 'West African, Oral Tradition, Storyteller,' defines the griot as an 'African troubadour-historian,' and lists the alternate terms jeli/jali — supporting the lesson's oral-historian/genealogy claim."

  - id: S-447
    title: "Te Ara — The Encyclopedia of New Zealand: Haka"
    type: website
    url: https://teara.govt.nz/en/haka
    organization: Te Ara — The Encyclopedia of New Zealand (Manatū Taonga)
    domains: [D07, D08]
    reviewed: true
    notes: "Cited in U.09.009 L06 (Dance, Drama & Ritual) as the authoritative New Zealand source on the Māori haka as a living tradition of posture and chant expressing identity, welcome, strength, and remembrance. Te Ara is New Zealand's national encyclopedia. (Site returns HTTP 403 to automated fetchers due to bot protection, but the haka entry is a well-known, canonical page and the lesson's characterization of the haka as a living posture-chant tradition of identity/welcome/remembrance is accurate and not overstated.)"

  - id: S-448
    title: "UNESCO — Indigenous Festivity Dedicated to the Dead (Day of the Dead)"
    type: website
    url: https://ich.unesco.org/en/RL/indigenous-festivity-dedicated-to-the-dead-00054
    organization: UNESCO
    year: 2008
    domains: [D07, D08]
    reviewed: true
    notes: "Cited in U.09.009 L06 (Dance, Drama & Ritual) for Mexico's Day of the Dead as a living ritual that links the living to deceased loved ones and the maize harvest, fusing Indigenous and Catholic traditions. Verified live (2026-08-19): the UNESCO Intangible Cultural Heritage entry exists (inscribed 2008, nomination 00054) and states verbatim that, as practised by the indigenous communities of Mexico, it 'commemorates the transitory return to Earth of deceased relatives,' marks 'the completion of the annual cycle of cultivation of maize,' and fuses 'pre-Hispanic religious rites and Catholic feasts' — directly supporting every factual claim in the lesson."

  - id: S-449
    title: "Encyclopaedia Britannica — Nueva canción"
    type: website
    url: https://www.britannica.com/art/nueva-cancion
    organization: Encyclopaedia Britannica
    domains: [D07]
    reviewed: true
    notes: "Cited in U.09.009 L04 (Music as Identity, Community & Resistance) for nueva canción as the Latin American movement fusing folk forms with protest and social change, facing censorship and violence under dictatorship. Verified live (2026-08-19): the article exists, titled 'Nueva canción — Latin American Music, Protest Songs & Social Change,' with sections 'The formative years: the late 1950s through the '60s' and 'The tumultuous years: the 1970s through the late '80s'; its text references Chile, censorship, and imprisonment (including Victor Jara). This supports the lesson's claim of a folk-based protest/social-change movement active across the 1960s–80s whose musicians faced censorship and violence under dictatorship. (Lesson's '1960s–80s' is a fair periodization; Britannica dates the formative phase from the late 1950s.)"

  - id: S-450
    title: "UNESCO — Reggae Music of Jamaica"
    type: website
    url: https://ich.unesco.org/en/RL/reggae-music-of-jamaica-01398
    organization: UNESCO
    year: 2018
    domains: [D07]
    reviewed: true
    notes: "Cited in U.09.009 L04 (Music as Identity, Community & Resistance) for reggae as originating among marginalized groups in western Kingston and acting as 'a voice for all' on injustice, resistance, love, and humanity. Verified live (2026-08-19): the UNESCO Intangible Cultural Heritage entry exists (inscribed 2018, nomination 01398) and states verbatim that reggae originated 'within a cultural space that was home to marginalized groups, mainly in Western Kingston,' was in its embryonic state 'the voice of the marginalized,' contributes to discourse on 'injustice, resistance, love and humanity,' and 'continues to act as a voice for all' — directly supporting every factual claim in the lesson."

  - id: S-451
    title: "Fab Foundation — Fabrication Laboratories (Fab Labs)"
    type: website
    url: https://fabfoundation.org/
    organization: The Fab Foundation
    domains: [D07, D10]
    reviewed: true
    notes: "Cited in U.09.009 L07 (Design & Make with Digital Fabrication) as the reference for community fabrication laboratories that make digital fabrication tools broadly accessible. URL verified live (2026-08-19): the site describes the mission as providing 'access to the tools, the knowledge and the means' for digital fabrication 'to allow anyone to make (almost) anything' and reports 2,300+ fab labs across 120+ countries — supporting the lesson's claim that community fab labs make these tools broadly accessible rather than a luxury."

  - id: S-452
    title: "Ellen MacArthur Foundation — The Circular Economy"
    type: website
    url: https://ellenmacarthurfoundation.org/
    organization: Ellen MacArthur Foundation
    domains: [D07, D10]
    reviewed: true
    notes: "Cited in U.09.009 L08 (Design, Technology & the Environment) as the reference for the circular-economy framework — designing out waste and keeping materials in use across a product's life cycle. URL verified live (2026-08-19): the site defines 'What is a circular economy?' as 'a system where materials never become waste and nature is regenerated' and foregrounds circular design — supporting the lesson's circular-economy framing (repair, reuse, return to the loop rather than disposal)."

  - id: S-453
    title: WHO — Family planning/contraception methods (fact sheet)
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/family-planning-contraception
    organization: World Health Organization
    domains: [D03]
    year: 2025
    reviewed: true
    notes: "Cited in U.09.010 L05 (Contraception & Preventing Infections) as the authority for how the main methods of contraception work and for the framing that access to contraception is a matter of health and justice. URL verified live (2026-08-19): WHO fact sheet 'Family planning/contraception methods' (dated 3 July 2025). Confirms the lesson's claims — condoms are 'the only method that also protects against sexually transmitted infections, including HIV'; methods span barrier (condoms), hormonal (pills, injections, patches, vaginal rings), and long-acting (implants, IUDs, sterilization); 'barrier methods like condoms are effective at preventing pregnancy, if used correctly'; and access to contraception 'supports the fundamental human right to decide freely,' 'advancing gender equality,' with barriers that include 'age, income, or marital status' and 'misinformation' — supporting the lesson's method descriptions and its unequal-access/health-and-justice framing. Reviewed by fact-checker 2026-08-19."

  - id: S-454
    title: WHO — Sexually transmitted infections (STIs) (fact sheet)
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/sexually-transmitted-infections-(stis)
    organization: World Health Organization
    domains: [D03]
    year: 2025
    reviewed: true
    notes: "Cited in U.09.010 L05 (Contraception & Preventing Infections) for the claims that STIs can pass during sex, that some are curable with medicine and some manageable with treatment, and that many can be present without symptoms — which is why testing and prevention (condoms, vaccines) matter. URL verified live (2026-08-19): WHO fact sheet 'Sexually transmitted infections (STIs)' (dated 10 September 2025). Confirms the lesson's claims — STIs are caused by 'bacteria, viruses and parasites' transmitted through sexual contact; '4 are currently curable' (syphilis, gonorrhoea, chlamydia, trichomoniasis) while 4 are viral (hepatitis B, HSV, HIV, HPV); STIs 'are often asymptomatic'; 'condoms offer one of the most effective methods of protection against STIs, including HIV'; and 'safe and highly effective vaccines are available for 2 viral STIs: hepatitis B and HPV.' Note: the lesson's original 'bacteria or viruses' wording was tightened by the fact-checker to 'bacteria, viruses, or parasites' and the curable examples corrected (trichomoniasis is parasitic, not bacterial, and syphilis is bacterial) to match the source. Reviewed by fact-checker 2026-08-19."

  - id: S-455
    title: WHO — Adolescent pregnancy (fact sheet)
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/adolescent-pregnancy
    organization: World Health Organization
    domains: [D03]
    year: 2024
    reviewed: true
    notes: "Cited in U.09.010 L03 (How Reproduction Works) as supporting context for the claim that where accurate information and services are missing, unplanned and adolescent pregnancy is more common. URL verified live (2026-08-19): WHO fact sheet 'Adolescent pregnancy' (dated 10 April 2024). Confirms the lesson's claim — adolescent pregnancy is 'a global phenomenon with clearly known causes and serious health, social and economic consequences,' with causes including child marriage, child sexual abuse, and 'barriers to obtaining and using contraceptives [that] prevent adolescents from avoiding unintended pregnancies,' and notes adolescents 'may lack... knowledge on where to obtain [contraceptives] and how to correctly use them.' Supports the lesson's framing that accurate reproductive education and access to services reduce unplanned/adolescent pregnancy. Reviewed by fact-checker 2026-08-19."

  - id: S-456
    title: "Stanford Encyclopedia of Philosophy — Consequentialism"
    type: article
    url: https://plato.stanford.edu/entries/consequentialism/
    organization: Stanford University (Stanford Encyclopedia of Philosophy)
    domains: [D09]
    reviewed: true
    notes: "Cited in U.09.011 L01/L02/L05 (the consequences lens) as the scholarly reference for consequentialism — the family of ethical traditions that judge an act by its results, whose best-known form is utilitarianism (associated with Jeremy Bentham and John Stuart Mill). The lesson presents the lens as one tradition among several, not the correct answer. Fact-checker verified live (2026-08-19): URL resolves (200). The SEP entry states 'The paradigm case of consequentialism is utilitarianism, whose classic proponents were Jeremy Bentham (1789), John Stuart Mill (1861), and Henry Sidgwick (1907)' and defines consequentialism as the view that 'normative properties depend only on consequences' — directly supporting the lesson's description. Bentham/Mill attribution is accurate."

  - id: S-457
    title: "Stanford Encyclopedia of Philosophy — Deontological Ethics"
    type: article
    url: https://plato.stanford.edu/entries/ethics-deontological/
    organization: Stanford University (Stanford Encyclopedia of Philosophy)
    domains: [D09]
    reviewed: true
    notes: "Cited in U.09.011 L01/L03/L05 (the duties lens) as the scholarly reference for deontological ethics — traditions that judge an act by whether it fulfills a duty, most associated with Immanuel Kant (universal rule; treating persons as ends, never merely as means). The lesson also notes that duty-based reasoning appears in many traditions, including relationship- and role-based accounts. Fact-checker verified live (2026-08-19): URL resolves (200). The SEP entry centers Kant and the categorical imperative, discussing the Formula of Universal Law ('universal law') and the Formula of Humanity / treating humanity as an 'end in itself' — directly supporting the lesson's Kant/universal-rule/persons-as-ends description."

  - id: S-458
    title: "Stanford Encyclopedia of Philosophy — Virtue Ethics"
    type: article
    url: https://plato.stanford.edu/entries/ethics-virtue/
    organization: Stanford University (Stanford Encyclopedia of Philosophy)
    domains: [D09]
    reviewed: true
    notes: "Cited in U.09.011 L01/L04/L05 (the virtues lens) as the scholarly reference for virtue ethics — traditions that judge an act by the kind of person it builds, most associated with Aristotle (a virtue is a settled habit of character, built by practice, aimed at flourishing/eudaimonia). The lesson notes that ideas of character and a good life run through many traditions, including Confucian, Buddhist, Islamic, and Indigenous frameworks. Fact-checker verified live (2026-08-19): URL resolves (200). The SEP entry is centered on Aristotle and eudaimonia and defines a virtue as a settled character trait — directly supporting the lesson's Aristotle/habit-of-character/flourishing description. The Confucian/Buddhist/Islamic/Indigenous extension is presented by the lesson as a cross-cultural parallel (a value frame), not as a claim sourced to this entry."

  - id: S-459
    title: "Rawls (1971) — A Theory of Justice"
    type: book
    author: John Rawls
    organization: Harvard University Press
    year: 1971
    domains: [D09]
    reviewed: true
    notes: "Cited in U.09.011 L07 as background for the idea that justice has competing theories — equal treatment, need, fairness — which the unit holds as ideas to compare, not a single correct answer. Rawls is the canonical modern theorist of distributive justice. Fact-checker verified (2026-08-19): John Rawls, A Theory of Justice, was published 1971 by the Belknap Press of Harvard University Press (rev. ed. 1999). Correct attribution; the book is the canonical source for the 'veil of ignorance' / original position and the difference principle, though the lesson does not itself name the veil of ignorance — it cites Rawls only for the 'justice has more than one answer' framing, which is accurate. Print book; no URL."

  - id: S-460
    title: "Sen (1999) — Development as Freedom"
    type: book
    author: Amartya Sen
    organization: Alfred A. Knopf
    year: 1999
    domains: [D09, D08]
    reviewed: true
    notes: "Cited in U.09.011 L09 (human rights across cultures) as background for the capabilities approach — the idea that freedom and development are about what people are actually able to do and be — which informs a cross-cultural evaluation of human rights. Fact-checker verified (2026-08-19): Amartya Sen, Development as Freedom, was first published 1999 by Alfred A. Knopf (New York; Oxford University Press, UK). Correct attribution and year. The capabilities approach is the book's central framework (developed with Martha Nussbaum), so the citation supports the lesson's 'freedom = what people can actually do and be' framing. Print book; no URL."

  - id: S-461
    title: "V-Dem Institute — Varieties of Democracy"
    type: website
    url: https://v-dem.net/
    organization: V-Dem Institute, University of Gothenburg
    domains: [D09]
    reviewed: true
    notes: "Cited in U.09.011 L10/L11 (power and accountability; democracy and its alternatives) as the authoritative, cross-national dataset measuring how power is distributed and how democratic participation varies across societies. The lesson uses it to ground the claim that participation is uneven, without ranking one society's arrangements above another's. Fact-checker verified live (2026-08-19): URL resolves (200). V-Dem is the real, authoritative Varieties of Democracy project (University of Gothenburg) providing 'a multidimensional and disaggregated dataset' measuring democracy across five principles — electoral, liberal, participatory, deliberative, and egalitarian — across countries and time. Directly supports the lesson's cross-national, non-ranking measurement framing."

  - id: S-462
    title: "Galtung (1969) — Violence, Peace, and Peace Research"
    type: article
    url: https://doi.org/10.1177/002234336900600301
    author: Johan Galtung
    organization: Journal of Peace Research
    year: 1969
    domains: [D09]
    reviewed: true
    notes: "Cited in U.09.011 L12 (the roots of conflict) as the foundational peace-studies reference for structural violence and the distinction between conflict and violence, and for the claim that inequality, fear, and scarcity are among the best-supported root causes of conflict. The lesson presents these as among the causes, not the only ones. Fact-checker verified (2026-08-19): DOI 10.1177/002234336900600301 resolves to Johan Galtung, 'Violence, Peace, and Peace Research,' Journal of Peace Research 6(3), pp. 167–191 (1969) (publisher link returns 403 to non-browser clients, but the DOI resolves to the correct article). This is the canonical article introducing the concept of structural violence and distinguishing personal/direct violence from structural violence, and it anchors the positive/negative peace distinction Galtung developed. Correct attribution. The 'inequality, fear, scarcity' triad is the lesson's own pedagogic summary (fear/scarcity are broader conflict-root claims, not verbatim from this article), and it is appropriately hedged as 'among the causes, not the only ones.'"

  - id: S-463
    title: "United Nations — Sustainable Development Goal 16: Peace, Justice and Strong Institutions"
    type: website
    url: https://sdgs.un.org/goals/goal16
    organization: United Nations
    domains: [D09]
    reviewed: true
    notes: "Cited in U.09.011 L12/L13 as a shared international commitment to peace, justice, and strong institutions, framing the unit's conflict and reconciliation work as a common global goal (a value, not a fact claim). Fact-checker verified live (2026-08-19): URL resolves (200). The UN SDG 16 page is titled Goal 16 'Promote peaceful and inclusive societies for sustainable development, provide access to justice for all and build effective, accountable and inclusive institutions at all levels' — matching the 'Peace, Justice and Strong Institutions' shorthand and the lesson's framing as a shared global commitment. Correct attribution; used as a value/aspiration frame, not a fact claim."

  - id: S-464
    title: "World Inequality Lab — World Inequality Report"
    type: website
    url: https://wir2022.wid.world/
    organization: World Inequality Lab
    domains: [D09, D08]
    reviewed: true
    notes: "Cited in U.09.011 L12 (the roots of conflict) as the authoritative source for the measurement of inequality within and across countries, supporting the claim that inequality is a documented, widespread condition linked to conflict risk. Fact-checker verified live (2026-08-19): URL resolves (200) — the World Inequality Report 2022 site (World Inequality Lab, co-directed by Thomas Piketty, Lucas Chancel, et al.). The lesson cites it only as the authoritative inequality-measurement source, not for any specific figure, so no individual statistic needs verification; the 'inequality is a documented, widespread condition' framing is well supported by the WIR. Correct attribution."

  - id: S-465
    title: "African Charter on Human and Peoples' Rights (Banjul Charter)"
    type: report
    url: https://au.int/en/treaties/african-charter-human-and-peoples-rights
    organization: African Union (formerly Organisation of African Unity)
    year: 1981
    domains: [D09]
    reviewed: true
    notes: "Cited in U.09.011 L09 (human rights across cultures) as the regional human-rights document that extends the Universal Declaration by adding duties and peoples'/collective rights, showing that the human-rights idea has been amended and extended across traditions rather than merely accepted. The lesson holds it alongside the UDHR and a critique, none as the default. Fact-checker verified live (2026-08-19): URL resolves (200) to the African Union treaties page for the 'African Charter on Human and Peoples' Rights'; the page confirms Date of Adoption 1 June 1981 and entry into force 21 October 1986. Correct attribution (adopted by the OAU 1981, now AU; 'Banjul Charter' is its common name). The Charter's addition of peoples'/collective rights and individual duties is accurate and well documented — supporting the lesson's claim that the human-rights idea was extended, not merely accepted."

  - id: S-466
    title: "Stanford Encyclopedia of Philosophy — Mohism"
    type: article
    url: https://plato.stanford.edu/entries/mohism/
    organization: Stanford University (Stanford Encyclopedia of Philosophy)
    domains: [D09]
    reviewed: false
    notes: "Cited in U.09.011 L02 (the consequences lens) as the scholarly reference for the claim that consequentialist reasoning appears early in Chinese Mohism. The Mohists (Mozi, c. 5th century BCE) held a consequentialist ethics: practices, policies, and institutions are evaluated by whether they benefit (li) the world and promote the welfare of all impartially (jian'ai, inclusive care) — explicitly 'promoting benefit and eliminating harm.' URL resolves (200). Registered by the alignment-auditor to close the evidence-vs-values gap flagged by the global-culture-editor; pending fact-checker verification (reviewed:false)."

  - id: S-467
    title: "Stanford Encyclopedia of Philosophy — Ethics in Indian and Tibetan Buddhism"
    type: article
    url: https://plato.stanford.edu/entries/ethics-indian-buddhism/
    organization: Stanford University (Stanford Encyclopedia of Philosophy)
    domains: [D09]
    reviewed: true
    notes: "Cited in U.09.011 L02 (the consequences lens) as the scholarly reference for the claim that consequentialist reasoning appears in Buddhist ethics, and in U.10.010 L07 (Poverty and Responsibility) for the claim that Buddhist consequentialism carries ideas of justice as old and as serious as the Western canon. Buddhist ethics is centrally concerned with reducing suffering (dukkha) for all sentient beings and has been read by contemporary scholars (e.g., Charles Goodman) as a form of consequentialism. Fact-checker verified live (2026-08-19): URL resolves (200); the entry discusses Śāntideva's consequentialist/utilitarian-leaning passages and Goodman's 'character consequentialism', and notes the question of whether to read Buddhist ethics as consequentialist or virtue ethics is a live scholarly debate — so the 'Buddhist consequentialism' gloss is accurate when hedged (as the lesson does). Updated from reviewed:false after fact-checker verification."

  - id: S-468
    title: "Stanford Encyclopedia of Philosophy — Confucius"
    type: article
    url: https://plato.stanford.edu/entries/confucius/
    organization: Stanford University (Stanford Encyclopedia of Philosophy)
    domains: [D09]
    reviewed: true
    notes: "Cited in U.09.011 L03 (the duties lens) as the scholarly reference for the claim that duty-based reasoning appears in Confucian role ethics, and in U.10.010 L07 (Poverty and Responsibility) for the claim that Confucian role ethics carries ideas of justice as old and as serious as the Western canon. Confucian ethics grounds obligation in roles and relationships (filial piety, xiao; the reciprocal duties between parent and child, ruler and minister, friend and friend) rather than in a universal rule alone. Fact-checker verified live (2026-08-19): URL resolves (200); the entry centers on role- and relationship-grounded ethics (filial piety xiao; reciprocal obligations of ruler/minister, parent/child, friend/friend; the five virtues including ren and yi), directly supporting the 'Confucian role ethics' characterization. Updated from reviewed:false after fact-checker verification."

  - id: S-469
    title: "Encyclopaedia Britannica — dharma"
    type: article
    url: https://www.britannica.com/topic/dharma-religious-concept
    organization: Encyclopaedia Britannica
    domains: [D09]
    reviewed: true
    notes: "Cited in U.09.011 L03 (the duties lens) as the reference for the claim that Hindu and Buddhist accounts of dharma are duty-based, and in U.10.010 L07 (Poverty and Responsibility) for the claim that dharma-based duty carries ideas of justice as old and as serious as the Western canon. Dharma is the key concept of duty, righteousness, and moral law in Hinduism and Buddhism (and Jainism/Sikhism). Fact-checker verified live (2026-08-19): the canonical Britannica entry 'dharma' (title 'Dharma | Hinduism, Buddhism, Karma'; 'Also known as: dhamma') resolves and confirms dharma as the duty/moral-law concept central to Hindu, Buddhist, Jain, and Sikh ethics — supporting the 'dharma-based duty' characterization. Updated from reviewed:false after fact-checker verification."

  - id: S-470
    title: "The Metropolitan Museum of Art — The Trans-Saharan Gold Trade (7th–14th Century)"
    type: website
    url: https://www.metmuseum.org/toah/hd/gold/hd_gold.htm
    organization: The Metropolitan Museum of Art (Heilbrunn Timeline of Art History)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.09.012 L02 (Continuity & Change: Long-Distance Trade) for the trans-Saharan network of camel caravans that traded gold for salt across the desert and fed cities such as Timbuktu. URL corrected during fact-check (2026-08-19): the originally-registered https://www.britannica.com/topic/trans-Saharan-trade returns 404 (Britannica has no dedicated article under that slug; the topic lives within its 'Sahara', 'Western Africa', and 'Islamic world' articles). Replaced with the Metropolitan Museum of Art Heilbrunn Timeline essay 'The Trans-Saharan Gold Trade (7th–14th Century)', verified live (2026-08-19): states verbatim that 'Gold, sought from the western and central Sudan, was the main commodity of the trans-Saharan trade', that trans-Saharan trade 'linked the Mediterranean economies that demanded gold—and could supply salt—to the sub-Saharan economies, where gold was abundant', and that Berber-speaking camel caravans crossed the Sahara; it also discusses Timbuktu (via Leo Africanus). Directly supports the lesson's gold-for-salt, camel-caravan, Timbuktu-linked claim."

  - id: S-471
    title: "UNESCO World Heritage Centre — Angkor (Dossier 668)"
    type: website
    url: https://whc.unesco.org/en/list/668/
    organization: UNESCO World Heritage Centre
    domains: [D08]
    reviewed: true
    notes: "Cited in U.09.012 L03 (growth of cities) and L06 (societies and environments) for Angkor as a Khmer city of the 9th–15th centuries CE whose vast water system of reservoirs and canals managed the monsoons, and for the debated, multi-causal nature of its decline. Fact-checker verified live (2026-08-19): Dossier 668 ('Angkor', Cambodia, inscribed 1992, criteria i/ii/iii/iv) states Angkor contains 'the magnificent remains of the different capitals of the Khmer Empire, from the 9th to the 15th century', and its Brief synthesis describes 'hydraulic structures (basins, dykes, reservoirs, canals)' and 'large water reservoirs' — directly supporting the lesson's 9th–15th c. dating and water-system claim."

  - id: S-472
    title: "UNESCO World Heritage Centre — Cahokia Mounds State Historic Site (Dossier 198)"
    type: website
    url: https://whc.unesco.org/en/list/198/
    organization: UNESCO World Heritage Centre
    domains: [D08]
    reviewed: true
    notes: "Cited in U.09.012 L03 (growth of cities) for Cahokia as a Mississippian city near the Mississippi River, ~1050–1350 CE, built around earth mounds. Fact-checker verified live (2026-08-19): Dossier 198bis ('Cahokia Mounds State Historic Site', United States, inscribed 1982) is the largest pre-Columbian settlement north of Mexico, near St Louis on the Mississippi; UNESCO dates the Mississippian culture at the site to 800–1350, with a 10,000–20,000 peak population at 1050–1150, and describes ~120 mounds including Monks Mound. The lesson's '~1050–1350 CE' is an accurate, appropriately hedged rendering of Cahokia's Mississippian-period florescence."

  - id: S-473
    title: "Encyclopaedia Britannica — quipu (khipu)"
    type: website
    url: https://www.britannica.com/topic/quipu
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.09.012 L04 (knowledge traditions suppressed, preserved, revived) for the Andean khipu (quipu), the knotted-cord record-keeping system used by the Inka and their predecessors to record numbers and information, suppressed as a system under Spanish colonial administration, and now the subject of careful study and community revival. Fact-checker verified live (2026-08-19): Britannica's 'quipu' article ('Quipu | Definition, Knots, Inca, Significance, & Facts', also known as khipu/quipo) documents the quipu as an Incan counting/recording tool used for statistical information such as taxes, census data, and storehouse inventories, with knots on pendant cords indicating decimal values — directly supporting the lesson's knotted-cord numeric-recording claim."

  - id: S-474
    title: "Encyclopaedia Britannica — Dresden Codex"
    type: website
    url: https://www.britannica.com/topic/Dresden-Codex
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.09.012 L04 (knowledge traditions suppressed, preserved, revived) for the claim that Spanish colonial authorities destroyed most Maya bark-paper codices and that only a few survive — among them the Dresden Codex, notable for its astronomical tables — while Maya peoples still speak their languages and scholars and communities now study and revive Maya mathematics and astronomy. Fact-checker verified live (2026-08-19): Britannica's 'Dresden Codex' article ('Dresden Codex | Mayan, Astronomy, Venus, Calendrics, & Hieroglyphs') describes it as 'a pre-Columbian book of astronomical data written in Maya glyphs' and covers its Venus/calendrics tables. Standard, well-documented Maya history (cf. S-378, already reviewed)."

  - id: S-475
    title: "Encyclopaedia Britannica — Haitian Creole language"
    type: website
    url: https://www.britannica.com/topic/Haitian-Creole
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.09.012 L05 (when cultures mix) for the claim that Haitian Creole is a full language born of contact between enslaved Africans and French colonists on the island that became Haiti, now spoken by millions, and that it is not a broken version of French. Fact-checker verified live (2026-08-19): Britannica's 'Haitian Creole' article ('Haitian Creole | Caribbean, French-based & Creole') documents it as a French-based creole language of the Caribbean/Haiti. Standard, well-documented sociolinguistic history."

  - id: S-476
    title: "Encyclopaedia Britannica — Palmares (quilombo)"
    type: website
    url: https://www.britannica.com/topic/Palmares
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.09.012 L07 (transatlantic slave trade and forced migration) for the claim that enslaved people resisted — through revolt, refusal, and escape — and built free communities called quilombos or maroon settlements, such as Palmares in Brazil. Fact-checker verified live (2026-08-19): Britannica's 'Palmares' article ('Palmares | Portuguese Colony, Quilombo, Afro-Brazilian', historical republic, Brazil) documents Palmares as a quilombo (maroon) community of escaped enslaved people in Brazil. Standard, well-documented history."

  - id: S-477
    title: "Encyclopaedia Britannica — Berlin West Africa Conference"
    type: website
    url: https://www.britannica.com/event/Berlin-West-Africa-Conference
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.09.012 L08 (colonialism and empire as systems of power) for the claim that at the Berlin Conference of 1884–85 European powers drew colonial borders in Africa without Africans present. Fact-checker verified live (2026-08-19): Britannica's 'Berlin Conference' article (slug /event/Berlin-West-Africa-Conference; title 'Berlin Conference | 1884, Result, Summary, & Impact on Africa', also known as 'Berlin West Africa Conference') documents the 1884–85 conference and its partition of Africa. Standard, well-documented history."

  - id: S-478
    title: "Encyclopaedia Britannica — Algerian War"
    type: website
    url: https://www.britannica.com/event/Algerian-War
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.09.012 L09 (anti-colonial movements) for the claim that Algeria's war of independence (1954–1962), led by the FLN, was an armed struggle against French rule after 132 years, ending in Algerian independence. Fact-checker verified live (2026-08-19): Britannica's 'Algerian War' article ('Algerian War of Independence | Brief Summary', also known as 'Algerian War of Independence') documents the 1954–1962 FLN-led war against French rule and Algerian independence. The '132 years' figure reflects French rule from the 1830 invasion to 1962 — standard, well-documented history."

  - id: S-479
    title: "Encyclopaedia Britannica — abolitionism"
    type: website
    url: https://www.britannica.com/topic/abolitionism-European-and-American-social-movement
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.09.012 L10 (freedom and dignity: ideas that travel) for the movement to end slavery, for which the Haitian Revolution (1791–1804) was a world-changing turning point, followed by abolition across the 1800s. URL corrected during fact-check (2026-08-19): the originally-registered https://www.britannica.com/topic/abolitionism returns 404; the live article is at /topic/abolitionism-European-and-American-social-movement (title 'Abolitionism | Movement, U.S. History, Leaders, & Definition', verified live 2026-08-19). The article documents the origins and spread of the abolition movement. Note it is Western/Atlantic-focused; the lesson's global 'abolition across the 1800s' framing is additionally anchored by the Haitian Revolution source (S-384) and is standard, well-documented history."

  - id: S-480
    title: "Encyclopaedia Britannica — apartheid"
    type: website
    url: https://www.britannica.com/topic/apartheid
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.09.012 L10 (freedom and dignity: ideas that travel) for the claim that apartheid, South Africa's system of legal racial segregation, was ended in 1994 by a struggle waged within South Africa and worldwide. Fact-checker verified live (2026-08-19): Britannica's 'apartheid' article ('Apartheid | South Africa, Laws, Definition, Facts, History, Beginning, & End') includes a section 'The end of legislated apartheid', documenting the 1994 end of legal racial segregation. Standard, well-documented history."

  - id: S-481
    title: "Encyclopaedia Britannica — Social media"
    type: website
    url: https://www.britannica.com/topic/social-media
    organization: Encyclopaedia Britannica
    domains: [D10]
    reviewed: true
    notes: "General authority for the D10.S1 media/technology lessons (algorithms, feeds, platforms, who controls them). Britannica's 'social media' article covers what social media platforms are, how they operate (feeds, recommendation and ranking algorithms, advertising-based business models, content moderation and platform rules), and the concerns they raise. Used as a general reference for the mechanism and governance claims; not a claim-level citation for any single statistic. Fact-checker verified (2026-08-19): URL returns HTTP 200; article live, editor-reviewed, last updated 2026-08-10. It states verbatim that 'Social media algorithms and echo chambers can... exacerbate the problem by prioritizing engagement over accuracy, and by creating filter bubbles where users are primarily exposed to information confirming existing beliefs' — supporting the lessons' claims that feeds rank by engagement (Lesson 2), that platforms set rules and moderate content (Lesson 3), and that personalization can narrow what a person sees (Lesson 4)."

  - id: S-482
    title: "Pariser (2011) — The Filter Bubble: What the Internet Is Hiding from You"
    type: book
    author: Eli Pariser
    organization: Penguin Press
    year: 2011
    domains: [D10]
    reviewed: true
    notes: "Canonical popular source for the 'filter bubble' idea: personalization and recommendation algorithms can invisibly surround a person with information that confirms their existing views while hiding what challenges them. Cited in the echo-chamber lesson as the origin of the filter-bubble concept, held as a concept to examine (with the note that scholarly debate continues about how strong the effect is), not as a single-answer verdict. Fact-checker verified (2026-08-19): bibliographic entry is real and correctly attributed — Eli Pariser, The Filter Bubble: What the Internet Is Hiding from You (Penguin Press, 2011), which coined the 'filter bubble' term (from Pariser's 2011 TED talk of the same name). The lesson correctly treats the concept as a hypothesis under scholarly debate, not an established law."

  - id: S-483
    title: "U.S. Environmental Protection Agency — Environmental Justice"
    type: website
    url: https://web.archive.org/web/2024/https://www.epa.gov/environmentaljustice
    organization: U.S. Environmental Protection Agency
    domains: [D10, D06]
    reviewed: true
    notes: "Canonical source of the formal U.S. definition of environmental justice. Fact-checker verified (2026-08-19): the live URL https://www.epa.gov/environmentaljustice now returns HTTP 404 (the EPA removed its environmental-justice pages in 2025), so the citation is preserved via the Internet Archive, which returns HTTP 200. The archived page states: 'Environmental justice means the just treatment and meaningful involvement of all people, regardless of income, race, color, national origin, Tribal affiliation, or disability, in agency decision-making and other Federal activities that affect human health and the environment.' The lesson's paraphrase ('the fair treatment of all people in environmental decisions') is a faithful rendering of the long-standing EPA definition. US-centric, so the lesson pairs it with the IPCC (S-005) for the global uneven-burden facts and treats the definition as one widely used framing, not the only tradition. Also cited in U.10.006 L12 (Energy Trade-Offs) for the term 'environmental justice' in the energy-burden-falls-unevenly framing."

  - id: S-484
    title: "Bullard (1990) — Dumping in Dixie: Race, Class, and Environmental Quality"
    type: book
    author: Robert D. Bullard
    organization: Westview Press
    year: 1990
    domains: [D10]
    reviewed: true
    notes: "Foundational environmental-justice scholarship documenting how hazardous-waste sites and polluting facilities were disproportionately sited in Black and low-income communities in the U.S. South, and the community struggles that responded (including the 1982 Warren County, North Carolina protests). Robert D. Bullard is widely regarded as a founder of the environmental-justice field. Cited for the historical origins of environmental justice as a movement and a field of study; US-focused, so the lesson pairs it with global examples anchored by the IPCC (S-005). Fact-checker verified (2026-08-19): bibliographic entry is real and correctly attributed — Robert D. Bullard, Dumping in Dixie: Race, Class, and Environmental Quality (Westview Press, 1990), the first book-length study of environmental racism, and Bullard is universally described as a founder of the field. The Warren County, NC (1982) PCB-landfill protests are accurately named as the movement's catalyzing event."

  - id: S-485
    title: "Standing Rock Sioux Tribe — Dakota Access Pipeline opposition (Mní wičhóni / water is life)"
    type: website
    url: https://standingrock.org/
    organization: Standing Rock Sioux Tribe
    domains: [D10]
    reviewed: true
    notes: "First-party source for the Standing Rock Sioux Tribe's opposition to the Dakota Access Pipeline (DAPL). Fact-checker verified live (2026-08-19): standingrock.org homepage states verbatim the reservation is 'Stradling the South Dakota and North Dakota border' covering '2.3 million acres,' 'borders the Missouri River,' and is 'Home to the Lakota and Dakota nations,' and its 'Stand With Us' section asks supporters to fund 'our continued efforts in the Dakota Access Pipeline battle.' This confirms the Tribe is real, the reservation straddles the ND/SD border along the Missouri River, its people are Lakota and Dakota, and it still opposes DAPL — matching the lesson's claims. The underlying facts are standard and well documented: the Tribe opposed DAPL, a crude-oil pipeline routed under/alongside the Missouri River, on grounds that it threatened their water supply and treaty lands; in 2016–2017 thousands of Indigenous 'water protectors' gathered in camps (#NoDAPL) grounded in the Lakota phrase Mní wičhóni ('water is life'). Cited in U.09.013 L10 (environmental justice) as the lesson's Indigenous stewardship/defense case, so Indigenous peoples appear as knowledge-holders, stewards, and defenders — not only as burden-bearers. US case; paired with the global island sea-level-rise case (IPCC, S-005)."

  - id: S-486
    title: "International Cooperative Alliance (ICA) — the global cooperative movement"
    type: website
    url: https://www.ica.coop/
    organization: International Cooperative Alliance
    domains: [D02]
    reviewed: true
    notes: "First-party source for cooperative identity and the global scale of the cooperative movement, cited in U.10.003 L12 (Co-ops and Mutual Aid Around the World) alongside Mondragón (S-487) as primary references for 'worker cooperatives and credit unions' detail. Fact-checker verified live (2026-08-19): ica.coop returns HTTP 200. The ICA describes itself as 'the voice of cooperatives worldwide… established in 1895 to promote the cooperative model,' states 'cooperative members represent at least 12% of humanity' and 'the 3 million cooperatives on earth,' and defines a cooperative as a 'people-centred enterprise jointly owned and democratically controlled by and for their members' run on the 'one member, one vote' rule. This is the canonical first-party definition of a cooperative and its Cooperative Identity Statement (values and 7 principles). Supports the lesson's framing that worker cooperatives and credit unions are well-documented cooperative forms in which members own and decide together; the lesson holds 'sharing power is better' as a value, distinct from these descriptive facts."

  - id: S-487
    title: "Mondragón Corporation — federation of worker cooperatives (Basque Country)"
    type: website
    url: https://www.mondragon-corporation.com/
    organization: Mondragón Corporation
    domains: [D02]
    reviewed: true
    notes: "First-party source for Mondragón as a real, large federation of worker cooperatives, cited in U.10.003 L12 (Co-ops and Mutual Aid Around the World) alongside the ICA (S-486) as primary references. Fact-checker verified live (2026-08-19): mondragon-corporation.com returns HTTP 200. The corporate site locates Mondragón in Mondragón (Gipuzkoa), Basque Country, Spain (Paseo José María Arizmendiarrieta, 5), and reports ~70,000 people ('70.000 PERSONAS') and sales in over 150 countries, organized across finance, industry, distribution, and knowledge (and its 'Cooperativas' section). This confirms the lesson's claim that Mondragón is a worker-cooperative federation in the Basque Country and a widely documented example of cooperative ownership; the lesson describes it as an example to check against first-party detail rather than citing a specific statistic."

  - id: S-488
    title: "Wikipedia — 2011 OPERA faster-than-light neutrino anomaly"
    type: website
    url: https://en.wikipedia.org/wiki/Faster-than-light_neutrino_anomaly
    organization: Wikipedia (Wikimedia Foundation)
    year: 2011
    domains: [D06]
    reviewed: true
    notes: "Cited in U.10.006 L03 (Why We Trust Science) for the 2011 OPERA faster-than-light neutrino claim and its correction by open sharing, replication, and scrutiny. Fact-checker verified live (2026-08-19): the Wikipedia article '2011 OPERA faster-than-light neutrino anomaly' (redirect from 'Faster-than-light neutrino anomaly') states that in 2011 the OPERA experiment mistakenly observed muon neutrinos appearing to travel faster than light (a result that would violate special relativity); that OPERA shared the result openly and invited independent scrutiny — CERN spokesperson James Gillies said the team was 'inviting the broader physics community to look at what they [had] done... and ideally for someone elsewhere in the world to repeat the measurements'; that the collaboration submitted the result for peer-reviewed publication (Journal of High Energy Physics); that in February 2012 OPERA announced two error sources, one being 'a link from a GPS receiver to the OPERA master clock was loose' (a loose fiber-optic cable); and that by June/July 2012 (ICARUS, MINOS, LVD, BOREXINO) the anomaly was refuted and neutrino speed found consistent with light. Supports the lesson's faithful retelling: announced 2011, checked openly, corrected within months via a loose fiber-optic cable, and 'physics stood.'"

  - id: S-489
    title: "Understanding Science (UC Museum of Paleontology) — How science works: peer review & replication"
    type: website
    url: https://undsci.berkeley.edu/understanding-science-101/how-science-works/scrutinizing-science-peer-review/
    organization: University of California Museum of Paleontology (Berkeley)
    domains: [D06]
    reviewed: true
    notes: "Cited in U.10.006 L03 for the claim that peer review, replication, and open scrutiny are the social safeguards that make scientific knowledge trustworthy and self-correcting. Fact-checker verified live (2026-08-19): the Understanding Science 'Scrutinizing science: Peer review' page (part of the 'How science works' section) states that peer-reviewed journals publish work 'vetted by experts in the relevant field,' that 'peer-reviewed work isn't necessarily correct or conclusive, but it does meet the standards of science,' and that once published 'science must deal with it somehow — perhaps by... figuring out why it is wrong, or trying to replicate its results.' The sibling pages 'Copycats in science: The role of replication' and 'Scientific scrutiny' cover replication and self-correction. Supports the lesson's three-safeguards framing (peer review filters, replication tests, openness lets outsiders check — and each can fall short)."

  - id: S-490
    title: "United States Holocaust Memorial Museum — Introduction to the Holocaust"
    type: website
    url: https://encyclopedia.ushmm.org/content/en/article/introduction-to-the-holocaust
    organization: United States Holocaust Memorial Museum (USHMM)
    domains: [D08]
    reviewed: true
    notes: "Authoritative Holocaust Encyclopedia article defining the Holocaust (the systematic, state-sponsored persecution and murder of six million Jews by Nazi Germany and its collaborators, 1933–1945) and its stages. Supports factual claims about the Holocaust as a defined case of genocide, taught with care and without graphic detail. Fact-checker verified live (2026-08-19): the page's opening definition reads verbatim 'The Holocaust was the systematic, state-sponsored persecution and murder of six million European Jews by the Nazi German regime and its allies and collaborators. The Holocaust was an evolving process that took place throughout Europe between 1933 and 1945,' and the article covers the stages of escalation (legal discrimination, ghettoization, the 'Final Solution,' killing centers). On-topic and accurately summarized."

  - id: S-491
    title: "United Nations — Convention on the Prevention and Punishment of the Crime of Genocide (1948) & Raphael Lemkin"
    type: website
    url: https://www.un.org/en/genocideprevention/genocide.shtml
    organization: United Nations Office on Genocide Prevention and the Responsibility to Protect
    year: 1948
    domains: [D08, D09]
    reviewed: true
    notes: "UN source for the legal definition of genocide and the 1948 Convention, and the framing that Raphael Lemkin coined the term 'genocide' (1944) to name the destruction of a people as a crime. Supports the lesson's claim that genocide is a defined international crime and that the concept applies globally, not to one place. Fact-checker verified (2026-08-19): the page content was confirmed via the Wayback Machine (2,812 captures, 2019–2026). The page states verbatim: 'The word \"genocide\" was first coined by Polish lawyer Raphäel Lemkin in 1944 in his book Axis Rule in Occupied Europe,' that genocide 'was codified as an independent crime in the 1948 Convention on the Prevention and Punishment of the Crime of Genocide,' and quotes Article II's full definition (acts 'committed with intent to destroy, in whole or in part, a national, ethnical, racial or religious group, as such'). Note: un.org returns HTTP 403/404 to automated clients (bot-blocking), so the URL was verified via archive rather than a live fetch; the page and content are real and current."

  - id: S-492
    title: "Yad Vashem — The Righteous Among the Nations"
    type: website
    url: https://www.yadvashem.org/righteous.html
    organization: Yad Vashem (The World Holocaust Remembrance Center)
    domains: [D08]
    reviewed: true
    notes: "Yad Vashem's database and program honoring non-Jews who risked their lives to rescue Jews during the Holocaust (the Righteous Among the Nations). Supports claims about sheltering/rescue as documented, ordinary, and honored actions. Fact-checker verified live (2026-08-19): the page describes 'a small minority who mustered extraordinary courage to uphold human values, risking their lives to save Jews by hiding them in their homes, providing false papers and assisting their escape: the Righteous Among the Nations,' and states they 'come from different countries and nationalities, and from all walks of life.' On-topic and accurately summarized (cf. Lesson 12's 'non-Jews across Europe who risked their lives to rescue Jews')."

  - id: S-493
    title: "UNHCR — Global Trends: Forced Displacement (annual report)"
    type: report
    url: https://www.unhcr.org/global-trends
    organization: UNHCR (UN Refugee Agency)
    domains: [D08]
    reviewed: true
    notes: "UNHCR's annual Global Trends report documents the number of forcibly displaced people worldwide (refugees, internally displaced persons, asylum-seekers) and their causes (conflict, persecution, violence). Supports the lesson's claim that forced displacement is large, global, and driven primarily by conflict and persecution, with climate a growing driver (paired with IOM S-086/S-383 and IPCC S-005). Fact-checker verified live (2026-08-19): the Global Trends page ('published in June 2026') states it 'provides key statistical trends on forced displacement' and 'includes the latest official statistics on refugees, asylum-seekers, internally displaced and stateless people.' On-topic and accurately summarized."

  - id: S-494
    title: "Encyclopaedia Britannica — Rwanda genocide of 1994"
    type: website
    url: https://www.britannica.com/event/Rwanda-genocide-of-1994
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Britannica entry on the 1994 genocide against the Tutsi in Rwanda (April–July 1994), in which an estimated 800,000 people were killed. Used only for brief, non-graphic factual context that genocide is not a single region's history. Fact-checker verified live (2026-08-19): the article ('Rwanda genocide of 1994 | Summary, History, Date, Background, Deaths, & Facts') covers Background, Genocide, Aftermath, Prosecuting the perpetrators (ICTR, national courts, Gacaca courts), National recovery, and the 1994 events; the death toll of about 800,000 is the article's stated figure, and it dates the genocide to April–July 1994 (roughly 100 days), triggered by the assassination of President Habyarimana. On-topic and accurately summarized."

  - id: S-495
    title: "United States Holocaust Memorial Museum — Guidelines for Teaching about the Holocaust"
    type: website
    url: https://www.ushmm.org/teach/fundamentals/guidelines-for-teaching-the-holocaust
    organization: United States Holocaust Memorial Museum (USHMM)
    domains: [D08]
    reviewed: true
