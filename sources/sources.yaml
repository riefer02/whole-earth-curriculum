    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.02.006 L09 (rocks, soil, and water make up the land; soil forms from worn rock + old living things). URL verified live (2026-08-16). KS2 'Rocks' topic lists 'What is soil made from?', 'Types of rock', and 'Fossils' — on-topic for the lesson's soil-from-rock-and-living-things claim. (Corrected from topic z9sfr82, which is KS2 Maths 'Weight and mass', not rocks/soil.)"

  - id: S-047
    title: NASA Space Place — All About the Sun
    type: website
    url: https://spaceplace.nasa.gov/all-about-the-sun/en/
    organization: NASA
    domains: [D06]
    reviewed: true
    notes: "Cited in U.02.006 L08 (Sun is a star; gives light + warmth; ~150 million km away; never look directly at it). URL verified live (2026-08-16). States: the Sun is a star (a hot glowing ball of gas); it is ~93 million miles (~150 million km) from Earth; 'Heat from the Sun makes Earth warm enough to live on'; 'Without light from the Sun, there would be no plants or animals'; and 'you should never look directly at the Sun.' Supports every factual claim in the lesson. (Corrected from spaceplace.nasa.gov/sun/en/, which 404s.)"

  - id: S-048
    title: BBC Bitesize — Primary (home)
    type: website
    url: https://www.bbc.co.uk/bitesize/primary
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.02.006 L10 (capstone) as a family-facing index of the unit's science topics. URL verified live (2026-08-16): the Primary hub (ages 3–11) aggregates KS1/KS2 science games and guides. General index, not a claim-level citation."

  - id: S-049
    title: WHO — Drinking-water fact sheet
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/drinking-water
    organization: World Health Organization
    year: 2023
    domains: [D03]
    reviewed: true
    notes: "Cited in U.02.008 L04 (water: body's drink). URL verified live (2026-08-16); page dated 13 Sept 2023. States water is essential for the body and public health, and frames safe/readily-available water as important for health — supports the lesson's hedged claims that the body is mostly water, that water is the everyday drink, and (Key facts: 2.2 billion people lack safely managed drinking-water services) that clean water is not available to everyone. On-topic; the 'not available to everyone' claim is a documented global fact, held by the lesson as a justice/values framing, not a personal failing."

  - id: S-050
    title: AASM — Recommended Amount of Sleep for Pediatric Populations
    type: article
    url: https://aasm.org/resources/pdf/pediatricsleepdurationconsensus.pdf
    organization: American Academy of Sleep Medicine
    year: 2016
    domains: [D03]
    reviewed: true
    notes: "Cited in U.02.008 L06 (sleep: 9–12 hours for ages 6–12) and U.07.001 L10 (sleep: 8–10 hours for teens, 9–12 for younger children). Official AASM consensus statement (Paruthi et al., J Clin Sleep Med 2016;12(6):785–786). PDF URL verified live (2026-08-16) — resolves to the AASM-hosted consensus statement. Recommends school-aged children (6–12 years) get 9–12 hours of sleep per 24 hours and teenagers (13–18 years) get 8–10 hours per 24 hours — matching both the U.02.008 L06 'about 9 to 12 hours' phrasing and the U.07.001 L10 'about 8–10 hours for teens, 9–12 for younger children' phrasing. US-centric source but the recommendation is the standard international benchmark for pediatric sleep duration; lessons treat it as a general guide and explicitly allow for family variation."

  - id: S-051
    title: WHO — Preventing violence against children
    type: website
    url: https://www.who.int/teams/social-determinants-of-health/violence-prevention
    organization: World Health Organization
    domains: [D03]
    reviewed: true
    notes: "Cited in U.02.008 L07/L08 (trusted adults; telling a trusted adult keeps children safe). URL verified live (2026-08-16) — the Prevention of Violence (PVL) unit under WHO Social Determinants of Health; page emphasizes preventing violence against children, including via INSPIRE strategies and supportive adult relationships. On-topic as a general authority for the lesson's safety framing (a value/protective frame, not a claim-level citation). The lesson's safeguarding guidance (believe, don't promise secrecy, report) is standard child-protection practice and is not attributed to this page."

  - id: S-052
    title: Our World in Data — Light at Night
    type: website
    url: https://ourworldindata.org/light-at-night
    organization: Global Change Data Lab (University of Oxford)
    year: 2023
    domains: [D08]
    reviewed: true
    notes: "Cited in U.02.009 L02 (Light Then and Now). URL verified live (2026-08-16). By Max Roser, Hannah Ritchie, Pablo Arriagada, Bertha Rohenkohl (2023). States the history of light as transitions 'from candles to lamps to lightbulbs', that many countries moved candles → gas → kerosene → electricity, that the price of lighting fell >99.9% since 1300 (16,000-fold decline; Fouquet & Pearson data), and that many people still lack light at night (energy poverty). Supports every factual claim in the lesson, including the hedged 'hundreds of millions still light the dark with flame and lamp' and the no-ranking 'neither way is better' framing. CC-BY licensed."

  - id: S-053
    title: "Children Just Like Me (DK, in association with UNICEF)"
    type: book
    author: Barnabas Kindersley & Anabel Kindersley
    organization: DK Publishing (Dorling Kindersley), in association with UNICEF
    year: 1995
    domains: [D08]
    reviewed: true
    notes: "Cited in U.02.009 L03 (A Day in Another Child's Life) as an enriched picture book. Real, well-known book (DK, 1995; newer revised editions exist) profiling real children's daily lives — food, home, school, play — across many countries side by side. On-topic as an optional illustrated resource; the lesson does not attribute a specific factual claim to it (the Andean child-life example is separately sourced to CIP, S-054). No URL (print book)."

  - id: S-054
    title: International Potato Center (CIP) — Potato
    type: website
    url: https://cipotato.org/potato/
    organization: International Potato Center (CIP), CGIAR
    domains: [D08]
    reviewed: true
    notes: "Cited in U.02.009 L03 and L04 (Andean child-life example; Andean farming/terracing example), and in U.06.009 L07 (the potato as a hardy Andean crop) and L08 (the potato in the Andes and later Ireland). URL verified live (2026-08-16). States verbatim the potato 'originated and was first domesticated in the Andes mountains of South America' and that there are 'more than 4,500 varieties of native potatoes, mostly found in the Andes' (and 'over 4,000 varieties of native potatoes grow in the Andean highlands of Peru, Bolivia, and Ecuador'). Supports the lesson's claim that the potato was first domesticated in the Andes and that thousands of native varieties are still farmed there. The Quechua/herding-llamas framing is consistent with Andean agropastoral life (a widely documented example, not overstated). CC-BY 4.0."

  - id: S-055
    title: Polynesian Voyaging Society (Hōkūleʻa)
    type: website
    url: https://hokulea.com/
    organization: Polynesian Voyaging Society (PVS)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.02.009 L04 (wayfinding) and L06 (coast adaptation). URL verified live (2026-08-16). PVS is the real organization that owns and sails Hōkūleʻa; its mission is 'Perpetuating the legacy of traditional Polynesian voyaging', and its site documents the 1976 maiden voyage from Hawaiʻi to Tahiti (50th anniversary marked 2026) and traditional wayfinding (stars, swells, clouds, birds). The lesson's claim that the 1976 Hōkūleʻa voyage to Tahiti was guided without instruments by the Micronesian master navigator Mau Piailug is accurate and correctly attributed — the single highest-risk historical claim in the unit, and it is sound."

  - id: S-056
    title: UNESCO — Intangible Cultural Heritage
    type: website
    url: https://ich.unesco.org/
    organization: UNESCO
    domains: [D08, D07]
    reviewed: true
    notes: "Cited in U.02.009 L04 as a general frame for knowledge passed down hand to hand, in U.05.008 L03/L06/L08/L10 as the frame for arts as living heritage, and in U.06.009 L05 for Japanese master-apprentice craft (apprenticeship) as a living-heritage form of knowledge transmission. URL verified live (2026-08-16). UNESCO's ICH site (2003 Convention) frames intangible cultural heritage as 'the practices, representations, expressions, knowledge, skills' that communities pass between generations, transmitted person to person. The U.05.008 lessons name specific inscribed elements, all accurate: Mongolian 'Khoomei' throat singing (Representative List, 2010) in L06; the 'Capoeira circle' (Roda de capoeira, Brazil, 2014) in L08; and traditional felt-making / the Mongol ger (L10, cf. 'Traditional craftsmanship of the Mongol Ger and its associated customs,' 2013). L03 originally used 'Tibetan sand mandala' as its example, which is NOT an inscribed element — corrected to cite ICH as a general living-heritage frame. A general authority/frame, not a claim-level citation for any single fact."

  - id: S-057
    title: National Geographic Education — Desert
    type: website
    url: https://education.nationalgeographic.org/resource/desert/
    organization: National Geographic Society
    domains: [D08]
    reviewed: true
    notes: "Cited in U.02.009 L05 (needs met differently by place) and L06 (adapting to a desert). URL verified live (2026-08-16). States 'People have adapted to life in the desert for thousands of years'; documents long, loose, light robes (thobe/abaya/djellaba/keffiyeh) that shield from sun, wind, and sand; tents that let cool air through; reliance on wells, springs, oases, and groundwater; and camels — supporting every desert-specific claim in both lessons, including 'hot in the day and cool at night'."

  - id: S-058
    title: Inuit Circumpolar Council (ICC)
    type: website
    url: https://www.inuitcircumpolar.com/
    organization: Inuit Circumpolar Council (ICC)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.02.009 L06 (cold-region adaptation). URL verified live (2026-08-16). ICC is the real, authoritative pan-Arctic Indigenous organization — 'Representing approximately 180,000 Inuit across Alaska, Canada, Greenland (Kalaallit Nunaat), and Chukotka' — founded 1977, and documents Inuit knowledge and ways of living in the Arctic (hunting, Indigenous knowledge, environment). On-topic as an authority for the lesson's Inuit parkas/kayaks/winter shelters/hunting-fishing framing (the lesson correctly attributes these as Inuit and names the peoples)."

  - id: S-060
    title: United Nations Convention on the Rights of the Child (UNICEF, child-friendly)
    type: website
    url: https://www.unicef.org/child-rights-convention
    organization: UNICEF (United Nations Children's Fund)
    domains: [D09]
    reviewed: true
    notes: "Cited in U.02.010 L04 (the rights every child has — play, learn, be safe, be heard, rest) and U.03.010 L03 (rights to food, water, health, education — UNCRC Arts 24, 27, 28) and L10 (child-friendly summary), and in U.05.009 L07/L08 (body autonomy/consent and protection from harm — UN CRC Art. 19). The UNICEF CRC page (child-friendly summary) sits behind Cloudflare and returns HTTP 403 to non-browser clients (verified 2026-08-16), so the substantive claims were verified against the full treaty text on OHCHR (ohchr.org/en/instruments-mechanisms/instruments/convention-rights-child; Art. 19 text re-verified 2026-08-17). All five rights named in the lesson are genuine UNCRC articles: play and rest/leisure (Art. 31), learn/education (Arts. 28–29), be safe / protection from violence and abuse (Art. 19, and best-interests Art. 3), be heard / views given due weight (Art. 12). Article 19 verbatim obliges protection 'from all forms of physical or mental violence, injury or abuse, neglect or negligent treatment, maltreatment or exploitation, including sexual abuse' — supporting the consent lessons' 'tell a trusted adult' safety framing. The lesson correctly frames these as a 'should' — a shared international agreement, not a claim that every child already has them honored — which keeps value/aspiration distinct from fact. Also cited in U.05.011 L03 (define a right; UNCRC names learn/play/be safe/rest/be heard) and L04 (rights apply to every child without discrimination — Art. 2; play Art. 31; education Art. 28; be heard Art. 12; protection Art. 19). Also cited in U.07.003 L01/L02 (Boundaries: The Yes, the No, and the Maybe; Reading the Boundary) for boundaries/consent grounded in a child's right to be heard (Art. 12) and protected (Art. 19)."

  - id: S-059
    title: Nobel Prize — Wangari Maathai, Facts
    type: website
    url: https://www.nobelprize.org/prizes/peace/2004/maathai/facts/
    organization: Nobel Prize Outreach / Nobel Foundation
    domains: [D08, D09]
    reviewed: true
    notes: "Cited in U.02.009 L08 (Someone Who Helped and Spoke Up). URL verified live (2026-08-16). States Wangari Maathai 'In 1977 she started a grass-roots movement' countering deforestation, that the Green Belt Movement 'spread to other African countries, and contributed to the planting of over thirty million trees', and that she received the Nobel Peace Prize 2004 'for her contribution to sustainable development, democracy and peace'. Confirms every factual claim in the lesson (Green Belt Movement 1977; over thirty million trees; Nobel Peace Prize 2004). The lesson correctly distinguishes these facts from the value that caring for the land and speaking up are good. Also cited in U.06.010 L07 (Ordinary People, Changing What Was Unfair) for the same Green Belt Movement facts (founded 1977 by Wangari Maathai; spread to other African countries; over thirty million trees; Nobel Peace Prize 2004). Re-verified live (2026-08-18)."

  - id: S-061
    title: Britannica Kids — Tool
    type: website
    url: https://kids.britannica.com/kids/article/tool/400194
    organization: Encyclopaedia Britannica
    domains: [D10]
    reviewed: true
    notes: "Cited in U.02.011 L01 (Tools Are Made to Solve Problems). URL verified live (2026-08-16): the Britannica Kids 'tool' article states a tool 'is anything that is used to make a change to something else or to help do a job.' Supports the lesson's core idea that a tool is a thing people make/use to solve a problem. (Corrected from an earlier citation with the wrong article ID 400184, which 404s; the live article ID is 400194.)"

  - id: S-062
    title: Encyclopaedia Britannica — Sewing Machine
    type: website
    url: https://www.britannica.com/technology/sewing-machine
    organization: Encyclopaedia Britannica
    domains: [D10]
    reviewed: true
    notes: "Cited in U.02.011 L02 (Old Tool, New Tool) for the claim that the 1800s sewing machine let people sew faster than by hand. URL verified live (2026-08-16): article documents Thimonnier's 1830 patent, Walter Hunt (c. 1832-34), Elias Howe's 1846 patent, and that 'In 1860 more than 110,000 sewing machines were produced in the United States alone' — i.e., a machine that mechanized and greatly sped up hand-sewing. Replaces a broken Smithsonian NMAH URL (americanhistory.si.edu/collections/object-groups/sewing-machines, now 404 after the museum's site redesign); the claim itself is accurate against Britannica."

  - id: S-063
    title: Common Sense Education — News & Media Literacy
    type: website
    url: https://www.commonsense.org/education/digital-citizenship/topic/news-and-media-literacy
    organization: Common Sense Media (Common Sense Education)
    domains: [D10]
    reviewed: true
    notes: "Cited in U.02.011 L03/L04/L09 (source-of-information; true info vs selling; making an honest message) and U.07.001 L07/L08 (Stereotypes and Labels; When a Label Narrows Me) for media's role in repeating narrow images until types feel like laws. URL verified live (2026-08-16): the 'News & Media Literacy' topic page frames 'Seek, Evaluate, and Contextualize' and, for Grades K-2, that students 'learn to wonder about where information comes from' and 'develop the habit of asking questions rather than accepting everything at face value.' Supports each lesson's claim that asking where information comes from and distinguishing information from persuasion are core media-literacy skills. (Corrected from commonsensemedia.org/news-and-media-literacy, which 404s; the live hub is on the education subdomain.)"

  - id: S-064
    title: BBC Bitesize (KS1) — What is a food chain?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zx882hv/articles/zwxwkty
    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.02.011 L06 (Energy from Eating). URL verified live (2026-08-16) via the KS1 'Living things and their habitats' topic index (zx882hv), which lists 'What is a food chain?' at articles/zwxwkty: 'Every animal and plant needs food to live... each living organism is part of a food chain, from producers to prey.' Supports the lesson's claim that animals get energy from eating plants or other animals. (Corrected from articles/zwkxsbk, which 404s.)"

  - id: S-065
    title: WHO/UNICEF JMP — WASH (Washdata)
    type: website
    url: https://washdata.org/
    organization: WHO/UNICEF Joint Monitoring Programme for Water Supply, Sanitation and Hygiene
    domains: [D09, D10]
    reviewed: true
    notes: "Cited in U.02.011 L07 (Water and Energy — Use and Save) for the claim that many people still lack safely managed drinking water, and in U.07.010 L04 (Seeing Injustice) for the same figure as evidence of unequal access. URL verified live (2026-08-16): the JMP homepage states '1 in 4 – or 2.1 billion people globally – still lack access to safely managed drinking water, including 106 million who drink directly from untreated surface sources' (2025 household report). Confirms the lessons' 'about 1 in 4 people (roughly 2.1 billion) still lack safely managed drinking water'; both lessons frame this as a fact (evidence), clearly separated from the value claim that everyone should have clean water."

  - id: S-066
    title: National Geographic Kids — Plastic Pollution
    type: website
    url: https://kids.nationalgeographic.com/science/article/plastic-pollution
    organization: National Geographic Society (National Geographic Kids)
    domains: [D10]
    reviewed: true
    notes: "Cited in U.02.011 L08 (Where Does Litter Go?) for the dropped-path account. URL verified live (2026-08-16): the article states 'some animals mistake plastic for food,' that plastic bottles 'take many hundreds of years to disintegrate' ('over 450 years to break down in a landfill'), and that plastic ends up 'as trash on the land and in rivers, lakes, and the ocean.' Supports the lesson's hedged claims that plastic litter can take hundreds of years to break down and can wash into rivers and the ocean where animals may mistake it for food. Reviewer had flagged this source; verified real and on-topic."

  - id: S-067
    title: NIDCD — Taste and Smell
    type: website
    url: https://www.nidcd.nih.gov/health/taste-smell
    organization: U.S. National Institute on Deafness and Other Communication Disorders (NIDCD), National Institutes of Health
    domains: [D03]
    reviewed: true
    notes: "Cited in L.03.002.01 (Senses Team Up) for the claim that much of what we call flavor comes from smell and taste working together. URL verified live (2026-08-16): NIDCD is the authoritative U.S. federal institute for taste and smell, and this hub covers Taste Disorders and Smell Disorders; the underlying sensory science — that flavor perception combines taste (tongue) and smell (nose), especially retronasal smell — is standard and matches the lesson's hedged claim ('much of what we call flavor'), which the facilitator note flags as well-established in sensory science. US-centric source; treated as one authoritative reference, not the only tradition."

  - id: S-068
    title: NIDCD — Balance Disorders
    type: website
    url: https://www.nidcd.nih.gov/health/balance-disorders
    organization: U.S. National Institute on Deafness and Other Communication Disorders (NIDCD), National Institutes of Health
    domains: [D03]
    reviewed: true
    notes: "Cited in L.03.002.08 (Moving with Balance) for the claim that a balance sensor deep inside the ear works with muscles and eyes to keep us steady. URL verified live (2026-08-16): page states verbatim that 'Your sense of balance relies on a series of signals to your brain from several organs and structures in your body, specifically your eyes, ears, and the muscles and touch sensors in your legs' and that 'The part of the ear that assists in balance is known as the vestibular system, or the labyrinth, a maze-like structure in your inner ear.' Directly supports the lesson's Grade-3 simplification (ear sensor + muscles + eyes)."

  - id: S-069
    title: WHO — Physical activity fact sheet
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/physical-activity
    organization: World Health Organization
    year: 2024
    domains: [D03]
    reviewed: true
    notes: "Cited in L.03.002.07 (Moving with Rhythm) and L.03.002.09 (Hand–Eye Coordination) for the claim that children need regular movement for healthy growth, and in U.07.001 L10 (Building a Routine That Serves My Goals) for daily movement as an evidence-backed routine block. URL verified live (2026-08-16); page dated 26 June 2024. States verbatim: 'In children and adolescents, physical activity promotes bone health, encourages healthy growth and development of muscle, and improves motor and cognitive development.' Supports the lessons' hedged general claim."

  - id: S-070
    title: BBC Bitesize (KS2) — What is a fair test?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zqkk7ty/articles/z69qwnb
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.03.006 L01 (A Fair Test — Change One Thing). URL verified live (2026-08-17) via the KS2 Science subjects index (topic zqkk7ty 'Working scientifically'): the article 'What is a fair test?' ('Learn how to make a test fair when working scientifically') supports the lesson's core method — change one variable, keep the rest the same. Replaces the broken topic URL z2mdtcw (404)."

  - id: S-071
    title: BBC Bitesize (KS2) — Recording and presenting scientific data
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zqkk7ty/articles/zdwttrd
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.03.006 L02 (Record and Read the Data). URL verified live (2026-08-17) via the KS2 'Working scientifically' topic zqkk7ty: article 'Recording and presenting scientific data' supports the lesson's table/tally/drawing recording and reading-back claim. Replaces the broken topic URL z2mdtcw (404)."

  - id: S-072
    title: BBC Bitesize (KS2) — What is a food chain?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zcyycdm/articles/zww9r2p
    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.03.006 L03 (Who Eats What?). URL verified live (2026-08-17). States: plants make their own food and are producers; animals that eat them are consumers (primary/secondary); energy flows from the Sun along the chain (arrows point producer→consumer); chains join into food webs. Supports the producer/consumer/energy-flow claims. Does NOT name decomposers — that step is covered by the companion article S-073 ('What is a microorganism?'). Replaces zbnnb9q/articles/zsphrwx (a food-chain game, mislabeled as the article)."

  - id: S-073
    title: BBC Bitesize (KS2) — What is a microorganism?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/z6wwxnb/articles/zsgtrwx
    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.03.006 L03 for the decomposer step. URL verified live (2026-08-17). States verbatim: 'Fungi take in dead matter and help turn it back into nutrients for the soil' and 'Bacteria are a microorganism which can break down plants to release nutrients into the soil'; calls the process decomposition and fungi 'a natural recycler.' Supports the lesson's claim that worms, fungi, and tiny living things break down dead matter and return nutrients to the soil."

  - id: S-074
    title: BBC Bitesize (KS2) — The structure of flowering plants
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zy66fg8/articles/z2d4g7h
    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.03.006 L04 (A Plant's Helping Parts). URL verified live (2026-08-17). States: roots take up water and nutrients and keep the plant steady; the stem carries water and nutrients; leaves use light from the Sun (with water and carbon dioxide) to make food (photosynthesis). Supports each of the lesson's three-part claims. Replaces the KS1 topic zpxnyrd (mislabeled KS2) and its non-existent sub-article titles."

  - id: S-075
    title: BBC Bitesize (KS2) — Solids, liquids and gases
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zgwc96f/articles/zngfp4j
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.03.006 L05 (Solids, Liquids, and Gases). URL verified live (2026-08-17). States: solids keep their shape; liquids flow and change shape to fit their container; gases have no fixed shape and spread to fill the space. Supports each of the lesson's three state rules. Corrected from the stale topic ID zkgg87h to the canonical states-of-matter topic zgwc96f (same article ID)."

  - id: S-076
    title: BBC Bitesize (KS2) — Changing states
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zgwc96f/articles/zwj9r2p
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.03.006 L06 (Heating and Cooling Change States). URL verified live (2026-08-17). States: heating melts a solid to a liquid and boils/evaporates a liquid to a gas; cooling freezes a liquid to a solid and condenses a gas to a liquid; these changes are reversible. Supports every change-of-state claim in the lesson. Replaces the 404 URL zkgg87h/articles/z9ckcqt."

  - id: S-077
    title: BBC Bitesize (KS2, NI) — What is a force?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zvr3nrd/articles/zywcrdm
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.03.006 L07 (Push and Pull — Forces and Motion). URL verified live (2026-08-17) via the KS2 NI 'The World Around Us' Forces topic zvr3nrd: the article 'What is a force?' ('Find out how forces, like pushes and pulls, move objects') supports the lesson's claim that a force is a push or pull that changes motion. Replaces the KS3 topic z4brd2p (mislabeled KS2) whose cited article title did not exist."

  - id: S-078
    title: BBC Bitesize (KS2, NI) — What is friction?
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zvr3nrd/articles/zxqrdxs
    organization: BBC Bitesize
    domains: [D06]
    reviewed: true
    notes: "Cited in U.03.006 L08 (Friction — The Slow-Down Force). URL verified live (2026-08-17). States verbatim: 'Friction is a force between two surfaces... Friction always slows a moving object down'; 'The rougher the surface, the more friction is produced'; 'Friction also produces heat'; and that friction is useful (grip, brakes) but sometimes reduced (oil). Supports every friction claim in the lesson. Normalized from the KS3 topic ID z4brd2p to the canonical KS2 NI Forces topic zvr3nrd (same article ID)."

  - id: S-079
    title: "BBC Bitesize (Scotland, 2nd level) — Coastlines: erosion"
    type: website
    url: https://www.bbc.co.uk/bitesize/articles/z7rwdp3
    organization: BBC Bitesize
    domains: [D06, D10]
    reviewed: true
    notes: "Cited in U.03.006 L10 (The Changing World Wonder Fair). URL verified live (2026-08-17). Defines erosion as 'the wearing away of pieces of rock, soil or other solid materials' and shows the sea wearing away the land (waves → cracks → caves → arches → stacks), i.e., how water shapes the land over time. Supports the lesson's core erosion claim (the water/waves/rivers case and the general 'wearing away over time' idea); the lesson's wind-dunes and ice-glaciers sub-claims are standard, accurate Earth science not detailed on this page. Replaces the 404 topic URL z8v9pbk ('How does weather change the landscape?' — no such article)."

  - id: S-080
    title: FAO — The State of Food and Agriculture (SOFA)
    type: website
    url: https://www.fao.org/publications/home/fao-flagship-publications/the-state-of-food-and-agriculture/en
    organization: Food and Agriculture Organization of the United Nations (FAO)
    year: 2025
    domains: [D03]
    reviewed: true
    notes: "Cited in U.03.008 L05 (Where My Food Comes From) for the general frame that food originates from plants and animals raised by people. URL verified live (2026-08-17); the original cited URL fao.org/state-of-food-agriculture/en/ returned 404, so the citation was corrected to the live SOFA flagship landing page, which resolves to fao.org/publications/fao-flagship-publications/the-state-of-food-and-agriculture/en. SOFA is FAO's annual flagship report on agrifood systems — a general authority for the lesson's low-risk claim that food comes from plants and animals raised by people, not a claim-level citation for any specific statistic."

  - id: S-081
    title: FAO — Sustainable Food Value Chains Knowledge Platform
    type: website
    url: https://www.fao.org/sustainable-food-value-chains/en/
    organization: Food and Agriculture Organization of the United Nations (FAO)
    domains: [D03]
    reviewed: true
    notes: "Cited in U.03.008 L06 (From Farm and Garden to My Table) for how food moves from farm to table through plant, grow, harvest, transport, sell, and cook. URL verified live (2026-08-17); the original citation paired the title 'Food loss and food value chains' with the generic FAO homepage (fao.org/home/en/), which was a mislabel, so it was corrected to this FAO knowledge platform on food value chains. The platform frames food value chains as the path food travels from production through processing, transport, and market to consumers — on-topic for the lesson's farm-to-table journey and its 'many hands' framing."

  - id: S-082
    title: IFRC — First aid (International First Aid, Resuscitation and Education Guidelines)
    type: website
    url: https://www.ifrc.org/our-work/health-and-care/first-aid
    organization: International Federation of Red Cross and Red Crescent Societies (IFRC)
    domains: [D03]
    reviewed: true
    notes: "Cited in U.03.008 L07 (First Aid for Minor Hurts) for the steps for minor cuts, scrapes, and bruises. The ifrc.org first-aid programme page sits behind bot protection (returns HTTP 403 to non-browser clients, verified 2026-08-17), so the substantive first-aid guidance was verified against IFRC's Global First Aid Reference Centre (globalfirstaidcentre.org), the federation's centre of excellence that publishes the International First Aid, Resuscitation and Education Guidelines. Those guidelines direct: rinse/clean a minor wound with clean water and cover it with a clean dressing, and apply something cold to a bruise/contusion — matching the lesson's 'tell an adult, wash with clean water, cover, cool, rest' steps. The lesson is appropriately hedged (minor hurts only; an adult always decides when a deeper/bigger/bleeding wound needs professional help), so no medical misinformation. For U.07.008 L05/L06, which cite the Global First Aid Reference Centre page directly, see S-313."

  - id: S-083
    title: Encyclopaedia Britannica — Bedouin
    type: website
    url: https://www.britannica.com/topic/Bedouin
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.03.009 L03 (Two Peoples, Two Ways to Meet Needs) for the Bedouin food/shelter/clothing comparison. URL verified live (2026-08-17): Britannica's 'Bedouin' article describes Bedouin as 'nomadic groups inhabiting Middle Eastern deserts, including North Africa, the Arabian Peninsula, Egypt, Israel, Iraq, Syria, and Jordan' — animal herders (camel, sheep, and goat nomads) who use 'tents made of woven camel hair or goat skins,' and whose 'clothing is loose-fitting for both sexes, protecting against heat, dust, and sunshine.' Camels 'provide milk' (and meat/hair). Supports the lesson's claims of desert tent dwelling, light loose clothing, and milk from herded animals; the 'dates' food item is a standard, accurate staple of desert/oasis life, not overstated."

  - id: S-084
    title: Smithsonian National Museum of African Art — Kente cloth
    type: website
    url: https://africa.si.edu/
    organization: Smithsonian Institution (National Museum of African Art)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.03.009 L04 (Stories, Songs, and Art That Show What People Value) as the authority for kente cloth of the Akan peoples of Ghana and Côte d'Ivoire, whose patterns and colors carry meanings and which is worn on important occasions. The cited URL (africa.si.edu) is the museum's institutional homepage and sits behind Cloudflare bot protection (returns HTTP 403 to non-browser clients, verified 2026-08-17), so it functions as an authority-of-record rather than a page-level citation. The underlying facts are standard and accurate: kente is a woven strip cloth of the Akan (Asante/Ashanti and Ewe) peoples of Ghana, also woven in Côte d'Ivoire; its named patterns and colors encode proverbs, concepts, and values (wisdom, unity, honor); and it is worn at important ceremonies/occasions. The lesson correctly names 'the Akan peoples' and does not overstate. Also cited in U.07.007 L01 (Art with a Message) as the general authority for adinkra cloth of the Akan peoples of Ghana and Côte d'Ivoire, whose stamped symbols encode proverbs and values (unity, memory, wisdom) — accurate, and the lesson correctly frames adinkra as a living tradition to honor, not a specimen to copy."

  - id: S-085
    title: AIATSIS — Australian Institute of Aboriginal and Torres Strait Islander Studies
    type: website
    url: https://aiatsis.gov.au/
    organization: AIATSIS (Australian Government)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.03.009 L04 (Stories, Songs, and Art That Show What People Value) for the claim that Aboriginal and Torres Strait Islander art carries knowledge, law, and stories (including the value of caring for Country) and that there are many distinct nations, each with its own traditions; and in U.06.009 L05 for Australian Aboriginal songlines as an oral tradition that encodes knowledge of land, water, and law. aiatsis.gov.au is the authoritative Australian institute's homepage; it sits behind Cloudflare bot protection (HTTP 403 to non-browser clients, verified 2026-08-17). The facts are standard and accurate: Aboriginal and Torres Strait Islander art and oral tradition encode customary knowledge, law, and ancestral ('Dreaming') stories; 'caring for Country' is a foundational value; and there are hundreds of distinct First Nations language/Country groups. The lesson hedges correctly ('Aboriginal peoples of Australia'; 'many Aboriginal nations, each with its own stories and art') and does not reduce dot painting to a single pan-Aboriginal practice."

  - id: S-086
    title: International Organization for Migration (IOM) — Who is a migrant?
    type: website
    url: https://www.iom.int/who-migrant-0
    organization: International Organization for Migration (UN Migration)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.03.009 L05 (Why People Move) for the claim that people move for reasons including family, work, safety, and the environment, and that migration has been part of human life throughout history. URL verified live (2026-08-17): https://www.iom.int/who-migrant-0 redirects to IOM's 'Fundamentals of Migration' page, which defines migration and links to IOM's World Migration Report 2024 chapters (including 'Why do people migrate?'). IOM documentation confirms migration is longstanding human behavior and that drivers include economic/work, family reunification, safety/security, and environmental factors. On-topic for the lesson's four-reason framing; the lesson correctly holds 'moving is worthy of respect' as a value distinct from the factual claim that people move for these reasons."

  - id: S-087
    title: Encyclopaedia Britannica — Salt March
    type: website
    url: https://www.britannica.com/event/Salt-March
    organization: Encyclopaedia Britannica
    domains: [D08]
    reviewed: true
    notes: "Cited in U.03.009 L07 (Working Together to Change Something Unfair) for the 1930 Salt March. URL verified live (2026-08-17): Britannica's 'Salt March' article confirms a nonviolent protest led by Mahatma Gandhi in March–April 1930 against the British salt monopoly — a ~240-mile (385-km) march from Sabarmati Ashram to Dandi (Gujarat), where on April 6 Gandhi and followers picked up handfuls of salt from the shore, 'technically producing salt and breaking the law,' as civil disobedience within the Indian independence movement. Matches the lesson's '240-mile (about 385-km) march to Dandi,' 'peacefully made their own salt,' 'part of the larger movement for India's independence' framing, and its age-appropriate 'over time the unfair rule was changed' summary."

  - id: S-088
    title: National Geographic Education — River
    type: website
    url: https://education.nationalgeographic.org/resource/river/
    organization: National Geographic Society
    domains: [D08]
    reviewed: true
    notes: "Cited in U.03.009 L06 (Rivers, Mountains, and Where People Settle) for the claim that rivers provide water, food, and transport and that fertile floodplains/valleys attract settlement. URL verified live (2026-08-17): the 'River' encyclopedic entry states 'Humans use rivers for irrigation in agriculture, for drinking water, for transportation, to produce electricity,' and that 'deltas and floodplains are highly fertile agricultural zones that offer tremendous value to the surrounding people' (e.g., the Nile and its delta 'helped give rise to the Egyptian empire'). Supports the lesson's river and floodplain-settlement claims. NOTE: the lesson originally cited a non-existent 'Valley' entry (education.nationalgeographic.org/resource/valley/ returns 404) — corrected to cite only the working 'River' page, which itself covers floodplains."

  - id: S-089
    title: Our World in Data — Urbanization
    type: website
    url: https://ourworldindata.org/urbanization
    organization: Our World in Data (Global Change Data Lab, University of Oxford)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.03.009 L02 (How Our Place Changed Over Time) for the long, global growth of towns and cities, many of which began and grew at river crossings, ports, and trade routes. URL verified live (2026-08-17): the 'Urbanization' topic page (Ortiz-Ospina et al., 2024) documents urbanization as a global, multi-century shift — 'Urbanization is the migration from rural areas into towns and cities. Over the past century, billions of people have made this move.' It supports the lesson's general 'many great cities grew at crossings and ports' pattern (a standard historical-geography claim); the page itself does not enumerate river crossings, so the lesson's specific river/port claim is a supported generalization rather than a verbatim figure."

  - id: S-090
    title: Britannica Dictionary — Landmark
    type: website
    url: https://www.britannica.com/dictionary/landmark
    organization: Encyclopaedia Britannica (Britannica Dictionary)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.03.009 L01 (Placing Our Local Landmarks on a Timeline) for the definition of a landmark. URL verified live (2026-08-17): the Britannica Dictionary defines 'landmark' (noun) as 'an object or structure on land that is easy to see and recognize' and, secondarily, 'a building or place that was important in history.' Supports the lesson's use of 'local landmarks as markers in a place's story.' NOTE: the lesson originally cited a non-existent National Geographic Education 'Landmark' entry (education.nationalgeographic.org/resource/landmark/ returns 404) — replaced with this working, on-topic dictionary definition."

  - id: S-091
    title: United Nations Convention on the Rights of the Child — Article 12 (OHCHR full treaty text)
    type: website
    url: https://www.ohchr.org/en/instruments-mechanisms/instruments/convention-rights-child
    organization: UN Office of the High Commissioner for Human Rights (OHCHR)
    domains: [D08]
    reviewed: true
    notes: "Cited in U.03.009 L08 (Having a Say — Power and Being Left Out) for the right of children to say what they think and be listened to. The OHCHR URL is the canonical location of the full CRC treaty text (it returns HTTP 403 to non-browser clients, verified 2026-08-17, as previously documented in S-060). Article 12 states that States Parties shall assure the child who is capable of forming views the right to express those views freely in all matters affecting the child, the views being given due weight in accordance with the child's age and maturity. The lesson's paraphrase ('children have the right to say what they think and to have their views taken into account') is accurate; the lesson correctly frames this as a right to be realized, not an already-universal fact. Also cited in U.05.011 L03/L04 for the full treaty text (Arts. 2, 31, 28, 12, 19)."

  - id: S-092
    title: UNICEF — Inclusive education
    type: website
    url: https://www.unicef.org/education/inclusive-education
    organization: UNICEF (United Nations Children's Fund)
    domains: [D09]
    reviewed: true
    notes: "Cited in U.03.010 L04 (Left Out: Making It More Fair) for 'removing barriers so every child can take part.' URL verified live via browser (2026-08-17; returns HTTP 403 to non-browser clients like other UNICEF pages — see S-060). Page title 'Inclusive education | UNICEF'. States: 'Inclusive education is the most effective way to give all children a fair chance to go to school, learn and develop the skills they need to thrive' and 'Inclusive education means all children in the same classrooms, in the same schools… real learning opportunities for groups who have traditionally been excluded.' On-topic for the lesson's inclusion/removing-barriers framing (a value frame, not a claim-level citation)."

  - id: S-093
    title: Maslow (1943) — A Theory of Human Motivation
    type: article
    author: Abraham H. Maslow
    organization: Psychological Review
    year: 1943
    url: https://doi.org/10.1037/h0054346
    domains: [D09]
    reviewed: true
    notes: "Cited in U.03.010 L03 (Needs, Wants, and Fair Sharing) as 'the idea that basic needs like food, water, and safety come first,' simplified for children. Real, foundational article (Psychological Review 50(4), 370–396; DOI 10.1037/h0054346 verified live 2026-08-17) introducing the hierarchy of needs, with physiological needs (food, water) and safety at the base. The lesson correctly frames it as a theory ('the idea that'), not an established fact, and uses it only as a child-friendly scaffold for the need-before-want ordering — distinct from the UNCRC rights citation (S-060)."

  - id: S-094
    title: Lipman (1974) — Harry Stottlemeier's Discovery
    type: book
    author: Matthew Lipman
    organization: Institute for the Advancement of Philosophy for Children (IAPC)
    year: 1974
    domains: [D09]
    reviewed: true
    notes: "Cited in U.03.010 L02 (The Same Act, Different Situations) for the 'context matters' idea in the philosophy-for-children tradition. Real book: the founding novel of the Philosophy for Children movement (Matthew Lipman, IAPC/Montclair State University, first published 1974), which invites young learners to reason about meaning and context. On-topic as a tradition/frame reference, not a claim-level citation. No URL (print book)."

  - id: S-095
    title: EIA Energy Kids — Renewable and Nonrenewable Energy Sources
    type: website
    url: https://www.eia.gov/kids/energy-sources/renewable/
    organization: U.S. Energy Information Administration (EIA)
    domains: [D10]
    reviewed: true
    notes: "Cited in U.03.011 L07 (Runs Out or Comes Back) for the nonrenewable ('runs out') vs renewable ('comes back') resource distinction. URLs verified live (2026-08-17): the 'Renewable' page states 'Renewable energy is energy from sources that are naturally replenishing but flow-limited; renewable resources are virtually inexhaustible' and lists fossil fuels (coal, petroleum, natural gas) as the contrast; the companion 'Coal' page (https://www.eia.gov/kids/energy-sources/coal/) states 'Coal is classified as a nonrenewable energy source because it takes millions of years to form. Coal contains the energy stored by plants that lived hundreds of millions of years ago.' Directly supports the lesson's claims that coal/oil are made over millions of years and can be used up, while sunlight/wind/water keep coming back. Metal (a mineral resource) is grouped with these in the standard elementary 'nonrenewable' framing (mineral ores form over geological time and are not replenished in a human lifetime). US-centric source; treated as one authoritative, age-appropriate reference, not the only tradition."

  - id: S-096
    title: "Dweck — Mindset: The New Psychology of Success"
    type: book
    organization: Ballantine Books
    year: 2006
    domains: [D01]
    reviewed: true
    notes: "Real book (Carol Dweck, first published 2006 by Random House/Ballantine). Cited in U.04.001 L06 (The Map of My Growing Self) for the growth-mindset/'not yet' frame, and in U.07.001 L06 (The Story Keeps Growing) for the same frame. Lessons correctly hedge the claim (effects are modest and not produced by praise alone; effort is not a guarantee), consistent with the research literature's replication cautions. No URL (print book)."

  - id: S-097
    title: "Duckworth, Gendler & Gross — Situational Strategies for Self-Control"
    type: article
    url: https://doi.org/10.1177/1745691615623247
    organization: Perspectives on Psychological Science
    year: 2016
    domains: [D01]
    reviewed: true
    notes: "Real paper: Duckworth, A. L., Gendler, T. S., & Gross, J. J. (2016). Situational strategies for self-control. Perspectives on Psychological Science, 11(1), 35–55. Cited in U.04.001 L10 (Staying With It When It Is Hard or Tempting to Quit) and U.07.001 L10 (Building a Routine That Serves My Goals) for if-then planning/situational self-control strategies. Lessons correctly hedge the claim (willpower is not infinite; evidence for 'building' it like a muscle is mixed), matching the paper's situational-strategy framing."

  - id: S-098
    title: "Nemours KidsHealth — heart, lungs, sweat, and muscles (for kids)"
    type: website
    url: https://kidshealth.org/en/kids/heart.html
    organization: Nemours KidsHealth
    domains: [D03]
    reviewed: true
    notes: "Cited in U.04.002 L01/L02/L05 (heart/pulse/heartbeat speeding with activity: 'When you run around a lot, your body needs a lot more oxygen-filled blood. Your heart pumps faster'), L03 (lungs: oxygen in, carbon dioxide out), L04 (sweat: 'As the sweat evaporates off your skin, you cool down'), L10 (muscles move the body and using them keeps them strong). URLs verified live (2026-08-17): /kids/heart.html, /kids/lungs.html, /kids/sweat.html, /kids/muscles.html all return 200. The formerly cited /kids/exercise.html returned 404 and was replaced with /kids/muscles.html."

  - id: S-099
    title: "WHO — Assistive Technology fact sheet"
    type: website
    url: https://www.who.int/news-room/fact-sheets/detail/assistive-technology
    organization: World Health Organization (WHO)
    domains: [D03]
    reviewed: true
    notes: "Cited in U.04.002 L06 (Many Ways to Sense and Move) for the range of assistive technology — wheelchairs, glasses, prosthetic limbs, white canes, hearing aids. URL verified live (2026-08-17). Supports the claim that aids are common, ordinary tools used worldwide."

  - id: S-100
    title: "UN Convention on the Rights of Persons with Disabilities (CRPD), Article 30"
    type: website
    url: https://www.un.org/development/desa/disabilities/convention-on-the-rights-of-persons-with-disabilities.html
    organization: United Nations
    domains: [D03, D09]
    reviewed: true
    notes: "Cited in U.04.002 L06/L07 for the right to take part in play, recreation, and sport (Article 30 — Participation in cultural life, recreation, leisure and sport). Genuine UN page (verified live 2026-08-17 by fact-checker; un.org may return 403 to automated clients but serves browsers normally). Used as a value/rights frame, not a factual claim. Also cited in U.07.007 L07 (Designing for Everyone) for the rights frame behind accessible design."

  - id: S-101
    title: "SHAPE America — Society of Health and Physical Educators"
    type: website
    url: https://www.shapeamerica.org/
    organization: SHAPE America
    domains: [D03]
    reviewed: true
    notes: "Cited in U.04.002 L08/L09 for cooperative-game rules and fair play in physical education. Real professional authority for PE standards; URL verified live (2026-08-17). Used as a general authority for fair-play and inclusive-game framing."

  - id: S-102
    title: "Graham & Perin — Writing Next"
    type: report
    url: https://all4ed.org/reports-factsheets/writing-next/
    organization: Alliance for Excellent Education / Carnegie Corporation of New York
    year: 2007
    domains: [D04]
    reviewed: true
    notes: "Graham, S., & Perin, D. (2007). Writing Next: Effective Strategies to Improve Writing of Adolescents in Middle and High Schools. Real report to Carnegie Corporation of New York (Alliance for Excellent Education). Cited in U.04.004 L09–L13 for the writing-process (plan/draft/revise/edit/publish) claims and explicit strategy instruction. Also cited in U.06.004 L09–L12 for argument writing (claim/reasons/evidence/counterargument) and digital drafting/revising/publishing. Used as a general authority for effective writing pedagogy."

  - id: S-103
    title: "Fortson — Indo-European Language and Culture (2nd ed.)"
    type: book
    organization: Wiley-Blackwell
    year: 2010
    domains: [D04]
    reviewed: true
    notes: "Fortson, B. W. (2010). Indo-European Language and Culture: An Introduction (2nd ed.). Wiley-Blackwell. ISBN 978-1-405-18896-8. Cited in U.04.004 L14 for the Proto-Indo-European *méh₂tēr 'mother' root and its reflexes (English mother, Spanish madre, French mère, German Mutter, Hindi mātā via Sanskrit mātár-). Reconstruction correctly framed as an inferred scientific story, not a revealed truth. No URL (print book)."

  - id: S-104
    title: "Kohli & Solórzano — Teachers, please learn our names!"
    type: article
    url: https://doi.org/10.1080/13613324.2012.674026
    organization: Race Ethnicity and Education
    year: 2012
    domains: [D04]
    reviewed: true
    notes: "Kohli, R., & Solórzano, D. G. (2012). Teachers, please learn our names!: racial microaggressions and the K-12 classroom. Race Ethnicity and Education, 15(4), 441–462. Cited in U.04.004 L15 for the importance of correctly learning/pronouncing a peer's name. Journal title is 'Race Ethnicity and Education' (no comma)."

  - id: S-105
    title: "BBC Bitesize (KS2) — How do scientists use their findings?"
    type: website
    url: https://www.bbc.co.uk/bitesize/topics/zqkk7ty/articles/zbxsp4j
    organization: BBC Bitesize
    domains: [D06]
